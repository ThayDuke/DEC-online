const fullQuestionBank=[{q:`There are ___ apples on the table; they are enough for everyone to share. 🍎`,a:[{text:`some`,correct:!0,explanation:`Câu khẳng định dùng 'some' với danh từ đếm được số nhiều 'apples'.`},{text:`any`,explanation:`Sai. 'Any' thường dùng trong câu phủ định hoặc nghi vấn.`,correct:!1},{text:`much`,explanation:`Sai. 'Much' dùng cho danh từ không đếm được.`,correct:!1},{text:`a little`,explanation:`Sai. 'A little' dùng cho danh từ không đếm được.`,correct:!1}]},{q:`I do not know whether there is any milk: do you have ___ milk in the fridge? 🥛`,a:[{text:`any`,correct:!0,explanation:`Câu nghi vấn (câu hỏi) thường dùng 'any'.`},{text:`some`,explanation:`Sai. 'Some' thường dùng trong câu khẳng định hoặc lời mời.`,correct:!1},{text:`many`,explanation:`Sai. 'Many' dùng cho danh từ đếm được.`,correct:!1},{text:`a few`,explanation:`Sai. 'A few' dùng cho danh từ đếm được.`,correct:!1}]},{q:`I don't have ___ money right now. 💸`,a:[{text:`any`,correct:!0,explanation:`Câu phủ định (don't have) dùng 'any'.`},{text:`some`,explanation:`Sai. 'Some' dùng trong câu khẳng định.`,correct:!1},{text:`many`,explanation:`Sai. 'Money' là danh từ không đếm được.`,correct:!1},{text:`a few`,explanation:`Sai. Dùng cho danh từ đếm được.`,correct:!1}]},{q:`How ___ students are there in your class? 🏫`,a:[{text:`many`,correct:!0,explanation:`Hỏi số lượng danh từ đếm được số nhiều 'students' dùng 'How many'.`},{text:`much`,explanation:`Sai. Dùng cho danh từ không đếm được.`,correct:!1},{text:`some`,explanation:`Sai. 'Some' không đứng sau 'How' để hỏi số lượng.`,correct:!1},{text:`any`,explanation:`Sai. 'Any' không thể thay cho mẫu hỏi 'How many students'.`,correct:!1}]},{q:`How ___ water do you drink every day? 💧`,a:[{text:`much`,correct:!0,explanation:`Hỏi lượng danh từ không đếm được 'water' dùng 'How much'.`},{text:`many`,explanation:`Sai. Dùng cho danh từ đếm được.`,correct:!1},{text:`some`,explanation:`Sai. 'some' là lượng từ dùng trong câu khẳng định hoặc lời mời, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`any`,explanation:`Sai. 'any' là lượng từ dùng trong câu phủ định hoặc nghi vấn, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1}]},{q:`She has ___ friends in this city. 👭`,a:[{text:`a lot of`,correct:!0,explanation:`'A lot of' dùng được cho cả danh từ đếm được và không đếm được.`},{text:`much`,explanation:`Sai. 'Friends' là danh từ đếm được.`,correct:!1},{text:`a little`,explanation:`Sai. Dùng cho danh từ không đếm được.`,correct:!1},{text:`any`,explanation:`Sai. Đây là câu khẳng định.`,correct:!1}]},{q:`There is only ___ juice left. 🧃`,a:[{text:`a little`,correct:!0,explanation:`'Juice' là danh từ không đếm được, diễn tả một lượng nhỏ dùng 'a little'.`},{text:`a few`,explanation:`Sai. 'A few' chỉ lượng nhỏ của vật đếm được, còn 'juice' là chất lỏng.`,correct:!1},{text:`many`,explanation:`Sai. 'Many' diễn tả số lượng lớn của danh từ đếm được, không dùng trực tiếp với 'juice'.`,correct:!1},{text:`few`,explanation:`Sai. 'Few' chỉ một số rất ít vật đếm được, không đi với 'juice'.`,correct:!1}]},{q:`I need ___ minutes to finish my homework. ⏱️`,a:[{text:`a few`,correct:!0,explanation:`'Minutes' là danh từ đếm được số nhiều, dùng 'a few' (một vài).`},{text:`a little`,explanation:`Sai. 'A little' chỉ hợp với chất không đếm được, còn 'minutes' là các phút đếm được.`,correct:!1},{text:`much`,explanation:`Sai. 'Much' hỏi lượng chất không đếm được, không hỏi số phút.`,correct:!1},{text:`any`,explanation:`Sai. Phương án 'any' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`I am offering you a cup: would you like ___ tea? ☕`,a:[{text:`some`,correct:!0,explanation:`Trong câu mời mọc lịch sự, chúng ta dùng 'some' thay vì 'any'.`},{text:`any`,explanation:`Sai. Dùng trong câu hỏi thông thường, không phải lời mời.`,correct:!1},{text:`many`,explanation:`Sai. 'Many' cần danh từ đếm được số nhiều, còn 'tea' là đồ uống không đếm được.`,correct:!1},{text:`a few`,explanation:`Sai. 'A few' chỉ vài vật đếm được, không chỉ một lượng trà trong cốc.`,correct:!1}]},{q:`There aren't ___ pictures on the wall. 🖼️`,a:[{text:`any`,correct:!0,explanation:`Câu phủ định (aren't) dùng 'any'.`},{text:`some`,explanation:`Sai. Dùng trong câu khẳng định.`,correct:!1},{text:`much`,explanation:`Sai. 'Much' dành cho chất không đếm được, còn 'pictures' là các bức tranh.`,correct:!1},{text:`a little`,explanation:`Sai. 'A little' chỉ lượng chất, không chỉ số bức tranh trên tường.`,correct:!1}]},{q:`He has ___ books on his shelf. 📚`,a:[{text:`many`,correct:!0,explanation:`'Books' là danh từ đếm được số nhiều.`},{text:`much`,explanation:`Sai. Dùng cho danh từ không đếm được.`,correct:!1},{text:`a little`,explanation:`Sai. 'A little' chỉ lượng nhỏ của chất, không chỉ số sách.`,correct:!1},{text:`any`,explanation:`Sai. 'Any' thường cần câu phủ định hoặc nghi vấn, không phải mệnh đề khẳng định này.`,correct:!1}]},{q:`We don't have ___ bread for breakfast. 🍞`,a:[{text:`much`,correct:!0,explanation:`'Bread' là danh từ không đếm được; trong câu phủ định dùng 'much bread'.`},{text:`many`,explanation:`Sai. Dùng cho danh từ đếm được.`,correct:!1},{text:`a few`,explanation:`Sai. 'A few' dùng cho vật đếm được, còn 'bread' là thực phẩm không đếm được.`,correct:!1},{text:`few`,explanation:`Sai. 'Few' chỉ số rất ít vật đếm được, không dùng trực tiếp với 'bread'.`,correct:!1}]},{q:`There are ___ birds in the sky. 🐦`,a:[{text:`a lot of`,correct:!0,explanation:`'Birds' là danh từ đếm được số nhiều, 'a lot of' nghĩa là nhiều.`},{text:`much`,explanation:`Sai. 'Much' chỉ lượng chất, còn 'birds' là các con chim đếm được.`,correct:!1},{text:`a little`,explanation:`Sai. 'A little' chỉ lượng nhỏ của chất, không chỉ số con chim.`,correct:!1},{text:`any`,explanation:`Sai. Đây là câu khẳng định.`,correct:!1}]},{q:`Please put ___ sugar in my coffee. 🍬`,a:[{text:`a little`,correct:!0,explanation:`'Sugar' là danh từ không đếm được, dùng 'a little' (một chút).`},{text:`a few`,explanation:`Sai. 'A few' dùng cho vật đếm được, còn 'sugar' là chất không đếm được.`,correct:!1},{text:`many`,explanation:`Sai. 'Many' chỉ số lượng vật đếm được, không dùng trực tiếp với đường.`,correct:!1},{text:`few`,explanation:`Sai. 'Few' chỉ số rất ít vật đếm được, không phải lượng đường.`,correct:!1}]},{q:`I do not know whether the room has any chairs: are there ___ chairs in the room? 🪑`,a:[{text:`any`,correct:!0,explanation:`Câu hỏi với danh từ đếm được số nhiều dùng 'any'.`},{text:`some`,explanation:`Sai. Thường dùng trong câu khẳng định.`,correct:!1},{text:`much`,explanation:`Sai. 'Much' chỉ lượng chất, còn 'chairs' là những chiếc ghế đếm được.`,correct:!1},{text:`a little`,explanation:`Sai. 'A little' chỉ lượng nhỏ của chất, không chỉ số ghế.`,correct:!1}]},{q:`I have ___ good news for you. 📰`,a:[{text:`some`,correct:!0,explanation:`'News' là danh từ không đếm được, câu khẳng định dùng 'some'.`},{text:`a few`,explanation:`Sai. 'A few' cần danh từ đếm được, còn 'news' là danh từ không đếm được.`,correct:!1},{text:`many`,explanation:`Sai. 'Many' không đi trực tiếp với 'news', dù nội dung tin có thể nhiều.`,correct:!1},{text:`any`,explanation:`Sai. Đây là câu khẳng định đang báo tin, không phải câu hỏi hay phủ định.`,correct:!1}]},{q:`There is too ___ noise here. 🔊`,a:[{text:`much`,correct:!0,explanation:`'Noise' là danh từ không đếm được, đi với 'too much' (quá nhiều).`},{text:`many`,explanation:`Sai. 'Many' dùng cho vật đếm được, còn 'noise' là âm thanh không đếm được.`,correct:!1},{text:`a few`,explanation:`Sai. 'A few' chỉ vài vật đếm được, không chỉ mức độ tiếng ồn.`,correct:!1},{text:`some`,explanation:`Sai ngữ pháp với 'too'.`,correct:!1}]},{q:`Please pour me ___ orange juice; I would like one glass. 🍊`,a:[{text:`some`,correct:!0,explanation:`Lời yêu cầu/đề nghị lịch sự dùng 'some'.`},{text:`any`,explanation:`Sai. Dùng cho câu hỏi thông tin bình thường.`,correct:!1},{text:`many`,explanation:`Sai. 'Many' cần danh từ đếm được số nhiều, còn 'orange juice' là chất lỏng.`,correct:!1},{text:`a few`,explanation:`Sai. 'A few' chỉ vài vật đếm được, không phải một cốc nước cam.`,correct:!1}]},{q:`There are only ___ eggs in the box. 🥚`,a:[{text:`a few`,correct:!0,explanation:`'Eggs' là danh từ đếm được, 'only a few' nghĩa là chỉ có một vài.`},{text:`a little`,explanation:`Sai. 'A little' dành cho chất không đếm được, còn 'eggs' là các quả trứng.`,correct:!1},{text:`much`,explanation:`Sai. 'Much' chỉ lượng chất, không hỏi số quả trứng.`,correct:!1},{text:`any`,explanation:`Sai. Phương án 'any' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`How ___ stars can you see? 🌟`,a:[{text:`many`,correct:!0,explanation:`'Stars' đếm được, hỏi số lượng dùng 'How many'.`},{text:`much`,explanation:`Sai. Dùng cho danh từ không đếm được.`,correct:!1},{text:`some`,explanation:`Sai. 'some' là lượng từ dùng trong câu khẳng định hoặc lời mời, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`any`,explanation:`Sai. 'any' là lượng từ dùng trong câu phủ định hoặc nghi vấn, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1}]},{q:`We don't need ___ help. 🆘`,a:[{text:`any`,correct:!0,explanation:`Câu phủ định dùng 'any'.`},{text:`some`,explanation:`Sai. Dùng trong câu khẳng định.`,correct:!1},{text:`many`,explanation:`Sai. 'Help' ở đây là danh từ không đếm được.`,correct:!1},{text:`a few`,explanation:`Sai. Dùng cho danh từ đếm được.`,correct:!1}]},{q:`There is ___ rice in the bowl. 🍚`,a:[{text:`some`,correct:!0,explanation:`Câu khẳng định, 'rice' không đếm được dùng 'some'.`},{text:`any`,explanation:`Sai. Dùng trong câu phủ định.`,correct:!1},{text:`many`,explanation:`Sai. 'Many' chỉ số lượng vật đếm được, không dùng trực tiếp với 'rice'.`,correct:!1},{text:`a few`,explanation:`Sai. 'A few' chỉ vài vật đếm được, không chỉ cơm trong bát.`,correct:!1}]},{q:`How ___ money do you need? 💰`,a:[{text:`much`,correct:!0,explanation:`'Money' là danh từ không đếm được, dùng 'How much'.`},{text:`many`,explanation:`Sai. 'many' là lượng từ dùng cho danh t
