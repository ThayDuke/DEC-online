const fullQuestionBank=[{q:`My name is Nam. I am a student at Thang Long Primary School. Every morning, my alarm rings at 6 and I leave my bed immediately: I ___ up at 6 o'clock.`,a:[{text:`get`,correct:!0,explanation:`Cụm từ 'get up' nghĩa là thức dậy.`},{text:`gets`,explanation:`Sai. Chủ ngữ 'I' đi với động từ nguyên mẫu.`,correct:!1},{text:`getting`,explanation:`Sai cấu trúc. Vị trí này không dùng danh động từ (V-ing).`,correct:!1},{text:`got`,explanation:`Đây là thì hiện tại đơn, không dùng quá khứ.`,correct:!1}]},{q:`Today is Sunday. The weather is very sunny and ___. We are going to the beach to swim.`,a:[{text:`hot`,correct:!0,explanation:`Thời tiết đi biển thường là nắng và nóng.`},{text:`cold`,explanation:`Sai nghĩa. Trời lạnh không đi bơi biển.`,correct:!1},{text:`snowy`,explanation:`Sai. Từ vựng hoặc dạng từ 'snowy' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`rainy`,explanation:`Sai. Từ vựng hoặc dạng từ 'rainy' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`I have a small dog. Its name is Lulu. Lulu ___ eating meat and playing with a ball.`,a:[{text:`likes`,correct:!0,explanation:`Chủ ngữ 'Lulu' (số ít) nên động từ 'like' thêm 's'.`},{text:`like`,explanation:`Sai. Thiếu 's'. Cách dùng phù hợp trong câu này là “likes”.`,correct:!1},{text:`liking`,explanation:`Sai cấu trúc. Vị trí này không dùng danh động từ (V-ing).`,correct:!1},{text:`to like`,explanation:`Sai cấu trúc. Vị trí này không dùng động từ nguyên thể có 'to'.`,correct:!1}]},{q:`My mother is a teacher. She works in a big school. She ___ English to many children.`,a:[{text:`teaches`,correct:!0,explanation:`Chủ ngữ 'She' nên động từ 'teach' thêm 'es'.`},{text:`teach`,explanation:`Sai. Thiếu 'es'. Cách dùng phù hợp trong câu này là “teaches”.`,correct:!1},{text:`teaching`,explanation:`Sai cấu trúc. Vị trí này không dùng danh động từ (V-ing).`,correct:!1},{text:`teacher`,explanation:`Đây là danh từ, không phải động từ.`,correct:!1}]},{q:`In the afternoon, I often play football with my friends. We play in the ___ near my house.`,a:[{text:`park`,correct:!0,explanation:`Công viên là nơi phù hợp để đá bóng.`},{text:`kitchen`,explanation:`Không đá bóng trong bếp.`,correct:!1},{text:`bathroom`,explanation:`Không đá bóng trong nhà tắm.`,correct:!1},{text:`library`,explanation:`Không đá bóng trong thư viện.`,correct:!1}]},{q:`This is my classroom. There are twenty tables and chairs. There is a big ___ on the wall.`,a:[{text:`clock`,correct:!0,explanation:`Đồng hồ thường treo trên tường lớp học.`},{text:`floor`,explanation:`Sàn nhà không nằm trên tường.`,correct:!1},{text:`desk`,explanation:`Bàn không treo trên tường.`,correct:!1},{text:`pen`,explanation:`Bút không phải vật trang trí chính trên tường.`,correct:!1}]},{q:`I like fruit very much. I eat an ___ every day. It is good for my health.`,a:[{text:`apple`,explanation:`Đúng. 'an' đứng trước danh từ bắt đầu bằng nguyên âm.`,correct:!0},{text:`banana`,explanation:`Sai. 'banana' phải đi với 'a'.`,correct:!1},{text:`pear`,explanation:`Sai. 'pear' phải đi với 'a'.`,correct:!1},{text:`mango`,explanation:`Sai. 'mango' phải đi với 'a'.`,correct:!1}]},{q:`Last summer, my family went to Da Lat. The air was very ___ and cool. We saw many flowers.`,a:[{text:`fresh`,correct:!0,explanation:`Không khí ở Đà Lạt rất trong lành (fresh).`},{text:`dirty`,explanation:`Sai. Từ vựng hoặc dạng từ 'dirty' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`busy`,explanation:`Không khí không dùng 'busy'.`,correct:!1},{text:`hot`,explanation:`Đà Lạt thường mát mẻ, không nóng.`,correct:!1}]},{q:`My brother is good at music. He can play the ___ very well. He practices every evening.`,a:[{text:`piano`,correct:!0,explanation:`Cụm từ 'play the piano' nghĩa là chơi đàn dương cầm.`},{text:`football`,explanation:`Football không phải nhạc cụ.`,correct:!1},{text:`book`,explanation:`Book không dùng với 'play the'.`,correct:!1},{text:`chess`,explanation:`Chess không phải nhạc cụ.`,correct:!1}]},{q:`It is raining outside. Don't forget to take your ___ with you. You don't want to get wet.`,a:[{text:`umbrella`,correct:!0,explanation:`Dùng ô (dù) để không bị ướt khi trời mưa.`},{text:`hat`,explanation:`Mũ không che được mưa lớn.`,correct:!1},{text:`shoes`,explanation:`Giày không giúp chống ướt toàn thân.`,correct:!1},{text:`bag`,explanation:`Cặp sách không dùng để che mưa.`,correct:!1}]},{q:`Linh is very thirsty. She wants a clear drinking ___ of water. She is drinking it now.`,a:[{text:`glass`,correct:!0,explanation:`Một cốc nước là 'a glass of water'.`},{text:`bowl`,explanation:`Không dùng bát để uống nước.`,correct:!1},{text:`box`,explanation:`Không dùng hộp để uống nước.`,correct:!1},{text:`bag`,explanation:`Không dùng túi để uống nước.`,correct:!1}]},{q:`I love reading. I often go to the ___ on weekends. There are many interesting books there.`,a:[{text:`library`,correct:!0,explanation:`Thư viện là nơi có nhiều sách.`},{text:`cinema`,explanation:`Rạp phim để xem phim.`,correct:!1},{text:`market`,explanation:`Chợ để mua sắm. Cách dùng phù hợp trong câu này là “library”.`,correct:!1},{text:`hospital`,explanation:`Bệnh viện để khám bệnh.`,correct:!1}]},{q:`The elephant is a very big animal. It has a long ___ and two big ears. It lives in the forest.`,a:[{text:`trunk`,correct:!0,explanation:`Voi có cái vòi dài (trunk).`},{text:`tail`,explanation:`Đuôi voi không dài và đặc trưng bằng vòi.`,correct:!1},{text:`arm`,explanation:`Voi không có cánh tay.`,correct:!1},{text:`hair`,explanation:`Voi không có tóc. Cách dùng phù hợp trong câu này là “trunk”.`,correct:!1}]},{q:`Every evening, my family has dinner together. After dinner, we ___ TV in the living room.`,a:[{text:`watch`,correct:!0,explanation:`Cụm từ 'watch TV' nghĩa là xem tivi.`},{text:`look`,explanation:`Look không đi trực tiếp với TV.`,correct:!1},{text:`listen`,explanation:`Nghe tivi dùng 'listen to', nhưng 'watch' phổ biến hơn.`,correct:!1},{text:`read`,explanation:`Không đọc tivi. Cách dùng phù hợp trong câu này là “watch”.`,correct:!1}]},{q:`Tomorrow is my birthday. My mother is going to make a big ___ with candles for me. I am very happy.`,a:[{text:`cake`,correct:!0,explanation:`Bánh sinh nhật là món đồ phổ biến trong ngày sinh nhật.`},{text:`pizza`,explanation:`Ít phổ biến hơn 'cake' trong ngữ cảnh làm bánh sinh nhật.`,correct:!1},{text:`soup`,explanation:`Không đặc trưng cho sinh nhật.`,correct:!1},{text:`bread`,explanation:`Bánh mì không phải bánh sinh nhật.`,correct:!1}]},{q:`Mai lives in a small house. There is a beautiful ___ in front of her house. She grows many flowers there.`,a:[{text:`garden`,correct:!0,explanation:`Vườn là nơi trồng hoa.`},{text:`kitchen`,explanation:`Không trồng hoa trong bếp.`,correct:!1},{text:`bedroom`,explanation:`Không trồng hoa trong phòng ngủ.`,correct:!1},{text:`garage`,explanation:`Nhà để xe không dùng để trồng hoa.`,correct:!1}]},{q:`Look at the sky! The ___ is shining brightly. It's a beautiful day.`,a:[{text:`sun`,correct:!0,explanation:`Mặt trời tỏa sáng (shining).`},{text:`moon`,explanation:`Mặt trăng thường tỏa sáng ban đêm.`,correct:!1},{text:`star`,explanation:`Ngôi sao không làm trời sáng rực như ban ngày.`,correct:!1},{text:`rain`,explanation:`Mưa không tỏa sáng (shining).`,correct:!1}]},{q:`We have breakfast at 7 a.m. We usually have bread and cold white ___ from a carton for breakfast. It's delicious.`,a:[{text:`milk`,correct:!0,explanation:`Bánh mì và sữa là bữa sáng phổ biến.`},{text:`water`,explanation:`Nước lọc ít được nhắc đến kèm bánh mì làm món đặc trưng.`,correct:!1},{text:`rice`,explanation:`Bánh mì và cơm không thường ăn cùng nhau.`,correct:!1},{text:`salt`,explanation:`Không ăn muối cho bữa sáng.`,correct:!1}]},{q:`My father is a doctor. He works in a ___ with wards and operating rooms. He helps sick people get better.`,a:[{text:`hospital`,correct:!0,explanation:`Bác sĩ làm việc trong bệnh viện.`},{text:`farm`,explanation:`Nông dân làm ở trang trại.`,correct:!1},{text:`factory`,explanation:`Công nhân làm ở nhà máy.`,correct:!1},{text:`store`,explanation:`Người bán hàng làm ở cửa hàng.`,correct:!1}]},{q:`I like English because it is ___ for talking to foreign friends.`,a:[{text:`useful`,correct:!0,explanation:`Tiếng Anh hữu ích (useful) để giao tiếp.`},{text:`bad`,explanation:`Sai. Từ vựng hoặc dạng từ 'bad' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`useless`,explanation:`Sai nghĩa. 'Useless' trái với việc dùng tiếng Anh để nói chuyện với bạn bè quốc tế.`,correct:!1},{text:`short`,explanation:`Bạn bè không phải thứ cần làm; câu nói về bài tập phải hoàn thành.`,correct:!1}]},{q:`The monkeys are very funny. They like to eat yellow ___ and climb trees. They live in the zoo.`,a:[{text:`bananas`,correct:!0,explanation:`Khỉ rất thích ăn chuối.`},{text:`meat`,explanation:`Khỉ ít ăn thịt. Cách dùng phù hợp trong câu này là “bananas”.`,correct:!1},{text:`fish`,explanation:`Khỉ không ăn cá. Cách dùng phù hợp trong câu này là “bananas”.`,correct:!1},{text:`cakes`,explanation:`Không phải thức ăn tự nhiên của khỉ.`,correct:!1}]},{q:`Today is Monday. We have a lot of ___ today. I need to do them all tonight.`,a:[{text:`homework`,correct:!0,explanation:`Bài tập về nhà cần làm vào buổi tối.`},{text:`toys`,explanation:`Đồ chơi không phải thứ 'cần làm'.`,correct:!1},{text:`friends`,explanation:`Thức ăn không phải nhiệm vụ cần làm trong tối nay.`,correct:!1},{text:`food`,explanation:`Không phù hợp ngữ cảnh.`,correct:!1}]},{q:`My bedroom is very tidy. I always ___ my bed by straightening the sheets after waking up. It looks very neat.`,a:[{text:`make`,correct:!0,explanation:`Cụm từ 'make the bed' nghĩa là dọn dẹp giường cho ngăn nắp.`},{text:`do`,explanation:`Với giường, động từ tự nhiên là 'make', không dùng 'do'.`,correct:!1},{text:`take`,explanation:`'Take the bed' không tạo thành cụm động từ đúng trong câu này.`,correct:!1},{text:`clean`,explanation:`Mặc dù có nghĩa dọn dẹp nhưng 'make my bed' là cụm cố định.`,correct:!1}]},{q:`In the winter, it is very cold. I usually wear a ___ and a scarf to keep warm.`,a:[{text:`coat`,correct:!0,explanation:`Áo khoác (coat) giúp giữ ấm mùa đông.`},{text:`T-shirt`,explanation:`Áo phông không đủ ấm.`,correct:!1},{text:`shorts`,explanation:`Quần đùi dùng cho mùa hè.`,correct:!1},{text:`swimsuit`,explanation:`Đồ bơi không dùng mùa đông.`,correct:!1}]},{q:`Peter is from America. He is ___. He speaks English very well.`,a:[{text:`American`,correct:!0,explanation:`Người đến từ America gọi là American.`},{text:`Vietnam`,explanation:`Vietnam là tên quốc gia, không phải quốc tịch tiếng Anh phù hợp sau 'is'.`,correct:!1},{text:`English`,explanation:`English là người Anh.`,correct:!1},{text:`Japan`,explanation:`Japan là tên quốc gia; quốc tịch tương ứng phải là Japanese.`,correct:!1}]},{q:`Birds can fly high in the sky. They have ___ to help them fly. They sing beautifully too.`,a:[{text:`wings`,correct:!0,explanation:`Chim có cánh (wings) để bay.`},{text:`legs`,explanation:`Chân dùng để đi/đậu.`,correct:!1},{text:`tails`,explanation:`Đuôi giúp định hướng, nhưng cánh mới là bộ phận chính để bay.`,correct:!1},{text:`hands`,explanation:`Chim không có tay. Cách dùng phù hợp trong câu này là “wings”.`,correct:!1}]},{q:`I'm going to the supermarket. I need to buy some ___ to cook dinner. My mom asked me to do it.`,a:[{text:`vegetables`,correct:!0,explanation:`Rau củ dùng để nấu bữa tối.`},{text:`books`,explanation:`Sách không dùng để nấu ăn.`,correct:!1},{text:`pencils`,explanation:`Bút chì không dùng để nấu ăn.`,correct:!1},{text:`clothes`,explanation:`Quần áo không dùng để nấu ăn.`,correct:!1}]},{q:`The library is very ___. You should not talk loudly there. Everyone is reading books.`,a:[{text:`quiet`,correct:!0,explanation:`Thư viện cần sự yên tĩnh (quiet).`},{text:`noisy`,explanation:`Sai. Từ vựng hoặc dạng từ 'noisy' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`large`,explanation:`Chưa đúng khi chọn “large”. Đúng về kích
