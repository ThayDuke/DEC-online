const fullQuestionBank=[{q:`There are four people in my family. 👨‍👩‍👧‍👦`,a:[{text:`My family has four people.`,correct:!0,explanation:`Cấu trúc 'There are' tương đương với 'Subject + has/have'.`},{text:`My family are four people.`,explanation:`Sai ngữ pháp, 'family' đi với 'has'.`,correct:!1},{text:`There has four people.`,explanation:`Không có cấu trúc 'There has'.`,correct:!1},{text:`My family having four people.`,explanation:`Thiếu động từ chính.`,correct:!1}]},{q:`My school has twenty classes. 🏫`,a:[{text:`There are twenty classes in my school.`,correct:!0,explanation:`'Has' chuyển sang 'There are' cho số nhiều.`},{text:`There is twenty classes.`,explanation:`Sai, 'twenty' là số nhiều nên dùng 'are'.`,correct:!1},{text:`My school is twenty classes.`,explanation:`Sai nghĩa (Trường tôi là 20 lớp).`,correct:!1},{text:`Twenty classes has my school.`,explanation:`Sai cấu trúc. Phương án 'Twenty classes has my school.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`I like English best. 🇬🇧`,a:[{text:`My favorite subject is English.`,correct:!0,explanation:`'Like best' đồng nghĩa với 'Favorite'.`},{text:`I favorite English.`,explanation:`'Favorite' là tính từ/danh từ, không phải động từ.`,correct:!1},{text:`English is I like.`,explanation:`Sai. Phương án 'English is I like.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`My English is favorite.`,explanation:`Sai. Cấu trúc 'My English is favorite.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`This is my book. 📖`,a:[{text:`The book is mine.`,correct:!0,explanation:`Tính từ sở hữu 'my' chuyển thành đại từ sở hữu 'mine'.`},{text:`The book is my.`,explanation:`Thiếu danh từ sau 'my'.`,correct:!1},{text:`This book is me.`,explanation:`Sai nghĩa (Quyển sách này là tôi).`,correct:!1},{text:`The mine is book.`,explanation:`Sai cấu trúc. Phương án 'The mine is book.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`The car is blue. 💙`,a:[{text:`It is a blue car.`,correct:!0,explanation:`Tính từ 'blue' đứng trước danh từ 'car'.`},{text:`It is a car blue.`,explanation:`Trong tiếng Anh, tính từ phải đứng trước danh từ.`,correct:!1},{text:`Is a blue car.`,explanation:`Thiếu chủ ngữ 'It'. Cách dùng phù hợp trong câu này là “It is a blue car.”.`,correct:!1},{text:`The blue is car.`,explanation:`Sai cấu trúc. Phương án 'The blue is car.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`He is a good soccer player. ⚽`,a:[{text:`He plays soccer well.`,correct:!0,explanation:`Tính từ 'good' bổ nghĩa cho danh từ chuyển thành trạng từ 'well' bổ nghĩa cho động từ.`},{text:`He plays soccer good.`,explanation:`Sai, 'good' là tính từ, phải dùng trạng từ 'well'.`,correct:!1},{text:`He soccer well.`,explanation:`Thiếu động từ 'plays'.`,correct:!1},{text:`He is play soccer well.`,explanation:`Thừa động từ 'is'. Cách dùng phù hợp trong câu này là “He plays soccer well.”.`,correct:!1}]},{q:`She has long hair. 👩`,a:[{text:`Her hair is long.`,correct:!0,explanation:`Sở hữu 'She has' chuyển thành 'Her hair is'.`},{text:`She is long hair.`,explanation:`Sai. Phương án 'She is long hair.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`The hair she is long.`,explanation:`Sai cấu trúc. Phương án 'The hair she is long.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`Her long is hair.`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “Her hair is long.”.`,correct:!1}]},{q:`My bag is small. 🎒`,a:[{text:`I have a small bag.`,correct:!0,explanation:`Vật + be + adj chuyển thành S + have/has + adj + vật.`},{text:`I am a small bag.`,explanation:`Sai nghĩa (Tôi là cái túi nhỏ).`,correct:!1},{text:`The small bag is I.`,explanation:`Sai cấu trúc. Phương án 'The small bag is I.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`My have a small bag.`,explanation:`Sai chủ ngữ. Cách dùng phù hợp trong câu này là “I have a small bag.”.`,correct:!1}]},{q:`Her eyes are brown. 👀`,a:[{text:`She has brown eyes.`,correct:!0,explanation:`Sở hữu 'Her eyes are' chuyển thành 'She has'.`},{text:`She is brown eyes.`,explanation:`Sai nghĩa (Cô ấy là đôi mắt nâu).`,correct:!1},{text:`Her has brown eyes.`,explanation:`Sai đại từ làm chủ ngữ.`,correct:!1},{text:`Brown eyes is her.`,explanation:`Sai cấu trúc. Phương án 'Brown eyes is her.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`My father is a careful driver. 🚗`,a:[{text:`My father drives carefully.`,correct:!0,explanation:`Tính từ 'careful' chuyển thành trạng từ 'carefully' bổ nghĩa cho động từ 'drives'.`},{text:`My father drive careful.`,explanation:`Thiếu 's' ở động từ và dùng sai tính từ.`,correct:!1},{text:`My father is drive careful.`,explanation:`Sai cấu trúc. Phương án 'My father is drive careful.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`My father drives careful.`,explanation:`Thiếu hậu tố '-ly' cho trạng từ.`,correct:!1}]},{q:`I walk to school every day. 🚶`,a:[{text:`I go to school on foot every day.`,correct:!0,explanation:`'Walk' đồng nghĩa với 'Go on foot'.`},{text:`I go to school by a foot.`,explanation:`Không dùng 'by foot', phải dùng 'on foot'.`,correct:!1},{text:`I walking to school.`,explanation:`Thiếu động từ tobe. Cách dùng phù hợp trong câu này là “I go to school on foot every day.”.`,correct:!1},{text:`I go to school by walk.`,explanation:`Sai cấu trúc. Phương án 'I go to school by walk.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`He goes to work by car. 🚘`,a:[{text:`He drives to work.`,correct:!0,explanation:`'Go by car' có thể viết lại thành 'Drive'.`},{text:`He go to work by car.`,explanation:`Chủ ngữ 'He' động từ phải thêm 'es'.`,correct:!1},{text:`He drive to work.`,explanation:`Thiếu 's' ở động từ 'drive'.`,correct:!1},{text:`He is drive to work.`,explanation:`Thừa 'is'. Cách dùng phù hợp trong câu này là “He drives to work.”.`,correct:!1}]},{q:`The flowers are very beautiful. 🌸`,a:[{text:`They are beautiful flowers.`,correct:!0,explanation:`Dùng đại từ 'They' thay cho 'The flowers' và đặt tính từ trước danh từ.`},{text:`The beautiful is flowers.`,explanation:`Sai cấu trúc. Phương án 'The beautiful is flowers.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`It is beautiful flowers.`,explanation:`'Flowers' số nhiều nên không dùng 'It is'.`,correct:!1},{text:`They are flowers beautiful.`,explanation:`Tính từ phải đứng trước danh từ.`,correct:!1}]},{q:`The toy is under the bed. 🧸`,a:[{text:`There is a toy under the bed.`,correct:!0,explanation:`'A toy' là danh từ số ít nên mẫu tồn tại đúng là 'There is a toy under the bed'.`},{text:`There are a toy under the bed.`,explanation:`'A toy' là số ít nên dùng 'is'.`,correct:!1},{text:`The bed is on the toy.`,explanation:`Ngược nghĩa (Cái giường ở trên đồ chơi).`,correct:!1},{text:`Is a toy under the bed.`,explanation:`Thiếu 'There'. Cách dùng phù hợp trong câu này là “There is a toy under the bed.”.`,correct:!1}]},{q:`My favorite drink is orange juice. 🍊`,a:[{text:`I like orange juice best.`,correct:!0,explanation:`'Favorite' tương đương với 'Like best'.`},{text:`I favorite orange juice.`,explanation:`'Favorite' không phải là động từ.`,correct:!1},{text:`Orange juice like me.`,explanation:`Sai nghĩa (Nước cam thích tôi).`,correct:!1},{text:`I like best orange juice.`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “I like orange juice best.”.`,correct:!1}]},{q:`The house has a garden. 🏡`,a:[{text:`There is a garden at the house.`,correct:!0,explanation:`'Has' chuyển sang 'There is' cho vật số ít.`},{text:`There has a garden in the house.`,explanation:`Không có cấu trúc 'There has'.`,correct:!1},{text:`A garden have the house.`,explanation:`Sai cấu trúc. Phương án 'A garden have the house.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`In the house is garden.`,explanation:`Thiếu mạo từ 'a'. Cách dùng phù hợp trong câu này là “There is a garden at the house.”.`,correct:!1}]},{q:`Nam is taller than Ba. 🦒`,a:[{text:`Ba is shorter than Nam.`,correct:!0,explanation:`So sánh hơn: A cao hơn B tức là B thấp hơn A.`},{text:`Ba is taller than Nam.`,explanation:`'Ba is taller' đảo ngược so với việc Ba thấp hơn Nam.`,correct:!1},{text:`Nam is shorter than Ba.`,explanation:`'Nam is shorter' cũng đảo ngược quan hệ chiều cao.`,correct:!1},{text:`Ba is tall than Nam.`,explanation:`Thiếu đuôi '-er' trong so sánh hơn.`,correct:!1}]},{q:`No one in my class is taller than Lan. 📏`,a:[{text:`Lan is the tallest student in my class.`,correct:!0,explanation:`Không ai cao hơn tức là người đó cao nhất.`},{text:`Lan is tall than everyone.`,explanation:`Thiếu 'er' và 'the'.`,correct:!1},{text:`Lan is taller than no one.`,explanation:`Sai. Cấu trúc 'Lan is taller than no one.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Everyone is shorter Lan.`,explanation:`Thiếu 'than'. Cách dùng phù hợp trong câu này là “Lan is the tallest student in my class.”.`,correct:!1}]},{q:`My house is behind the park. 🌳`,a:[{text:`The park is in front of my house.`,correct:!0,explanation:`'Behind' (đằng sau) ngược nghĩa với 'In front of' (đằng trước).`},{text:`The park is behind my house.`,explanation:`'Behind my house' trái với việc công viên ở phía trước nhà.`,correct:!1},{text:`My house is in front of the park.`,explanation:`'In front of the park' đảo ngược vị trí nhà–công viên.`,correct:!1},{text:`The park is next to my house.`,explanation:`Sai. Phương án 'The park is next to my house.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`We have a break of fifteen minutes. ⏰`,a:[{text:`We have a fifteen-minute break.`,correct:!0,explanation:`Cấu trúc danh từ ghép: số đếm - danh từ số ít.`},{text:`We have a fifteen minutes break.`,explanation:`Danh từ trong cụm tính từ ghép không có 's'.`,correct:!1},{text:`We have break fifteen minutes.`,explanation:`Sai cấu trúc. Phương án 'We have break fifteen minutes.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`A fifteen minute is our break.`,explanation:`Sai cấu trúc. Phương án 'A fifteen minute is our break.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`It's a good idea to eat more vegetables. 🥗`,a:[{text:`You should eat more vegetables.`,correct:!0,explanation:`'It's a good idea' dùng để đưa ra lời khuyên với 'Should'.`},{text:`You can eat more vegetables.`,explanation:`'Can' chỉ khả năng, không phải lời khuyên.`,correct:!1},{text:`Eating vegetables is should.`,explanation:`Sai cấu trúc. Phương án 'Eating vegetables is should.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`You must eat more vegetables.`,explanation:`'Must' mang tính bắt buộc quá mạnh.`,correct:!1}]},{q:`Jane's cat is very cute. 🐱`,a:[{text:`The cat of Jane is very cute.`,correct:!0,explanation:`Sở hữu cách 's' có thể thay bằng 'of'.`},{text:`Jane is a cute cat.`,explanation:`Sai. Phương án 'Jane is a cute cat.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`The cat Jane is cute.`,explanation:`Thiếu 's' hoặc 'of'.`,correct:!1},{text:`Cute cat is Jane.`,explanation:`Sai. Cấu trúc 'Cute cat is Jane.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`I want a glass of water. 💧`,a:[{text:`I would like a glass of water.`,correct:!0,explanation:`'Want' trang trọng hơn là 'Would like'.`},{text:`I like a glass of water.`,explanation:`'Like' là sở thích, không phải mong muốn nhất thời.`,correct:!1},{text:`A glass of water wants me.`,explanation:`Sai. Cấu trúc 'A glass of water wants me.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`I would like glass water.`,explanation:`Thiếu 'a' và 'of'. Cách dùng phù hợp trong câu này là “I would like a glass of water.”.`,correct:!1}]},{q:`My room is very messy. 🧸`,a:[{text:`My room is not tidy.`,correct:!0,explanation:`'Messy' (bừa bộn) ngược nghĩa với 'Not tidy' (không gọn gàng).`},{text:`My room is tidy.`,explanation:`'Tidy' trái với nghĩa 'very messy'.`,correct:!1},{text:`I have a tidy room.`,explanation:`'A tidy room' trái với căn phòng bừa bộn.`,correct:!1},{text:`The messy is my room.`,explanation:`Sai cấu trúc. Phương án 'The messy is my room.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`Does your school have a library? 📚`,a:[{text:`Is there a library in your school?`,correct:!0,explanation:`Chuyển câu hỏi 'Does... have' sang 'Is there'.`},{text:`Are there a library in your school?`,explanation:`'A library' số ít dùng 'Is'.`,correct:!1},{text:`Has your school library?`,explanation:`Sai. Phương án 'Has your school a library?' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`There is a library in your school?`,explanation:`Thiếu đảo ngữ 'Is' lên đầu câu.`,correct:!1}]},{q:`The bookstore is to the left of the bakery. 🥖`,a:[{text:`The bakery is to the right of the bookstore.`,correct:!0,explanation:`Bên trái của A là B thì bên phải của B là A.`},{text:`The bakery is to the left of the bookstore.`,explanation:`Sai vị trí. Cách dùng phù hợp trong câu này là “The bakery is to the right of the bookstore.”.`,correct:!1},{text:`The bookstore is next to the bakery.`,explanation:`Chưa đủ chi tiết trái/phải.`,correct:!1},{text:`The bakery is behind the bookstore.`,explanation:`Sai. Cấu trúc 'The bakery is behind the bookstore.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`She is a fast runner. 🏃‍♀️`,a:[{text:`She runs fast.`,correct:!0,explanation:`Tính từ 'fast' đứng trước danh từ chuyển thành trạng từ 'fast' đứng sau động từ.`},{text:`She runs fastly.`,explanation:`Không có từ 'fastly' trong tiếng Anh.`,correct:!1},{text:`She is run fast.`,explanation:`Sai cấu trúc 'is + động từ nguyên mẫu'.`,correct:!1},{text:`She run fast.`,explanation:`Chủ ngữ 'She' động từ phải thêm 's'.`,correct:!1}]},{q:`He is interested in reading comics. 📖`,a:[{text:`He likes reading comics.`,correct:!0,explanation:`'Be interested in' đồng nghĩa với 'Like/Love'.`},{text:`He interest reading comics.`,explanation:`Thiếu 'is' hoặc dùng sai từ loại.`,correct:!1},{text:`Reading comics is he like.`,explanation:`Sai cấu trúc. Phương án 'Reading comics is he like.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`He likes read comics.`,explanation:`Sau 'like' phải dùng 'V-ing'.`,correct:!1}]},{q:`My sister is older than me. 👩‍🦳`,a:[{text:`I am younger than my sister.`,correct:!0,explanation:`Chị già hơn tôi tức là tôi trẻ hơn chị.`},{text:`I am older than my sister.`,explanation:`'Older' trái với câu gốc nói tôi nhỏ tuổi hơn chị/em.`,correct:!1},{text:`My sister is younger than me.`,explanation:`'Younger than me' đảo ngược quan hệ tuổi.`,correct:!1},{text:`I am as old as my sister.`,explanation:`Sai. Phương án 'I am as old as my sister.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`The weather is hot today. ☀️`,a:[{text:`It is a hot day today.`,correct:!0,explanation:`Tính từ 'hot' đứng trước danh từ 'day'.`},{text:`Today have hot weather.`,explanation:`Sai động từ. Cách dùng phù hợp trong câu này là “It is a hot day today.”.`,correct:!1},{text:`It is hotting today.`,explanation:`Không có từ 'hotting'.`,correct:!1},{text:`Today is hot weather.`,explanation:`Sai cấu trúc. Phương án 'Today is hot weather.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`We can't go out because it's raining. 🌧️`,a:[{text:`It's raining, so we can't go out.`,correct:!0,explanation:`'Because' (vì) chuyển sang dùng 'So' (nên) để nối vế.`},{text:`It's raining because we can't go out.`,explanation:`Đảo quan hệ nguyên nhân–kết quả: mưa là nguyên nhân, không phải do không ra ngoài.`,correct:!1},{text:`We can't go out so it's raining.`,explanation:`'So' đặt việc không ra ngoài thành nguyên nhân của mưa, sai logic.`,correct:!1},{text:`Because it's raining so we can't go out.`,explanation:`Không dùng cả 'Because' và 'So' trong một câu.`,correct:!1}]},{q:`There is a lamp on the table. 💡`,a:[{text:`The table has a lamp on it.`,correct:!0,explanation:`Chuyển 'There is' thành 'Has' để chỉ sự sở hữu/có mặt.`},{text:`The table is on the lamp.`,explanation:`Sai nghĩa (Cái bàn trên cái đèn).`,correct:!1},{text:`The lamp is under the table.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “The table has a lamp on it.”.`,correct:!1},{text:`There are a lamp on the table.`,explanation:`Sai. Phương án 'There are a lamp on the table.' không hòa hợp chủ vị với chủ ngữ trong câu.`,correct:!1}]},{q:`My mother is a good cook. 🍳`,a:[{text:`My mother cooks well.`,correct:!0,explanation:`Tính từ 'good' bổ nghĩa cho danh từ 'cook' (người nấu) chuyển thành trạng từ 'well'.`},{text:`My mother cooks good.`,explanation:`Phải dùng trạng từ 'well' cho động từ 'cook'.`,correct:!1},{text:`My mother is cook well.`,explanation:`Sai cấu trúc. Phương án 'My mother is cook well.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`My mother is a cook good.`,explanation:`Tính từ đứng sau danh từ là sai.`,correct:!1}]},{q:`This cake is delicious. 🍰`,a:[{text:`It is a delicious cake.`,correct:!0,explanation:`Đưa tính từ lên trước danh từ.`},{text:`The cake delicious is.`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “It is a delicious cake.”.`,correct:!1},{text:`It is delicious a cake.`,explanation:`Mạo từ 'a' phải đứng trước tính từ.`,correct:!1},{text:`This is cake delicious.`,explanation:`Tính từ đứng sau danh từ là sai.`,correct:!1}]},{q:`I study English for two hours every day. ⏰`,a:[{text:`I spend two hours studying English every day.`,correct:!0,explanation:`Cấu trúc: Spend + time + V-ing.`},{text:`I spend two hours study English.`,explanation:`Sau 'spend' phải là 'V-ing'.`,correct:!1},{text:`I take two hours studying English.`,explanation:`Cấu trúc với 'Take' dùng to-V: It takes me... to study.`,correct:!1},{text:`English takes me two hours studying.`,explanation:`Sai cấu trúc. Phư
