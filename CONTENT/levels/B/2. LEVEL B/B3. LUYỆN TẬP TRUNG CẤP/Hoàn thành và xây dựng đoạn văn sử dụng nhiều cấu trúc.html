const fullQuestionBank=[{q:`Sắp xếp đoạn văn sau: (1) Then, I have breakfast. (2) First, I wake up at 6 AM. (3) Finally, I go to school. Câu nào nên đứng ở vị trí số 1? ⏰`,a:[{text:`Câu (2)`,correct:!0,explanation:`Câu (2) chứa từ 'First' và hành động thức dậy, thường là bắt đầu của một ngày.`},{text:`Câu (1)`,explanation:`Câu này có 'Then', diễn tả hành động tiếp theo, không phải bắt đầu.`,correct:!1},{text:`Câu (3)`,explanation:`Câu này có 'Finally', dùng cho hành động kết thúc.`,correct:!1},{text:`Câu (1) và (3)`,explanation:`Không thể có hai câu đứng đầu cùng lúc.`,correct:!1}]},{q:`Sắp xếp: (1) After that, we had lunch. (2) We went to the zoo yesterday. (3) We saw many lions and tigers. Câu nào đứng ở vị trí số 2? 🦁`,a:[{text:`Câu (3)`,correct:!0,explanation:`Sau khi đến sở thú (2), hành động tiếp theo là ngắm thú (3) rồi mới ăn trưa (1).`},{text:`Câu (1)`,explanation:`Ăn trưa thường diễn ra sau khi đã tham quan xong một phần.`,correct:!1},{text:`Câu (2)`,explanation:`Câu (2) là câu mở đầu giới thiệu thời gian và địa điểm.`,correct:!1},{text:`Không câu nào`,explanation:`Vị trí số 2 là câu (3) để mạch truyện hợp lý.`,correct:!1}]},{q:`Sắp xếp: (1) He felt very tired. (2) Nam played football all afternoon. (3) So he went to bed early. Câu nào nên đứng ở vị trí số 3? ⚽`,a:[{text:`Câu (3)`,correct:!0,explanation:`Câu (3) bắt đầu bằng 'So' chỉ kết quả cuối cùng của việc chơi bóng và mệt mỏi.`},{text:`Câu (2)`,explanation:`Đây là câu nêu nguyên nhân đầu tiên.`,correct:!1},{text:`Câu (1)`,explanation:`Đây là câu diễn tả cảm xúc trung gian.`,correct:!1},{text:`Câu (1) và (2)`,explanation:`Sai logic thứ tự. Cách dùng phù hợp trong câu này là “Câu (3)”.`,correct:!1}]},{q:`Sắp xếp: (1) It was a beautiful day. (2) Finally, we went home happily. (3) We flew kites in the park. Câu mở đầu hợp lý nhất là? 🪁`,a:[{text:`Câu (1)`,correct:!0,explanation:`Câu (1) giới thiệu bối cảnh thời tiết, rất phù hợp để mở đầu đoạn văn.`},{text:`Câu (3)`,explanation:`Câu này kể về hành động cụ thể, nên đứng sau câu giới thiệu.`,correct:!1},{text:`Câu (2)`,explanation:`Câu có 'Finally' phải đứng cuối.`,correct:!1},{text:`Không có câu nào`,explanation:`Câu (1) là lựa chọn tốt nhất.`,correct:!1}]},{q:`Sắp xếp: (1) My name is Lan. (2) Finally, I live in Hanoi with my family. (3) Next, I am ten years old. Câu nào nên đứng ở vị trí số 2? 🏠`,a:[{text:`Câu (3)`,correct:!0,explanation:`Thông thường, sau khi giới thiệu tên (1) sẽ đến tuổi (3) rồi mới đến nơi ở (2).`},{text:`Câu (1)`,explanation:`Đây là câu chào hỏi/tên, đứng số 1.`,correct:!1},{text:`Câu (2)`,explanation:`Câu này nên đứng cuối đoạn giới thiệu bản thân này.`,correct:!1},{text:`Câu (1) và (2)`,explanation:`Sai logic sắp xếp thông tin cá nhân.`,correct:!1}]},{q:`Sắp xếp: (1) I brush my teeth. (2) I wash my face. (3) I get out of bed. Câu nào nên đứng ở vị trí số 3? 🪥`,a:[{text:`Câu (1)`,correct:!0,explanation:`Thứ tự vệ sinh cá nhân hợp lý: Rời giường -> Rửa mặt -> Đánh răng.`},{text:`Câu (3)`,explanation:`Đây là hành động đầu tiên khi ngủ dậy.`,correct:!1},{text:`Câu (2)`,explanation:`Hành động này thường đứng giữa.`,correct:!1},{text:`Không câu nào`,explanation:`Thứ tự 3-2-1 là logic nhất.`,correct:!1}]},{q:`Sắp xếp: (1) Next, she adds some sugar. (2) First, she pours the tea. (3) Finally, she drinks it. Câu nào đứng ở vị trí số 2? ☕`,a:[{text:`Câu (1)`,correct:!0,explanation:`Từ 'Next' chỉ hành động tiếp theo sau bước đầu tiên (First).`},{text:`Câu (2)`,explanation:`Đây là bước đầu tiên.`,correct:!1},{text:`Câu (3)`,explanation:`Đây là bước cuối cùng.`,correct:!1},{text:`Cả (2) và (3)`,explanation:`Sai vị trí. Cách dùng phù hợp trong câu này là “Câu (1)”.`,correct:!1}]},{q:`Sắp xếp: (1) I am a student. (2) Hello everyone. (3) I study at Thang Long School. Câu mở đầu là? 👋`,a:[{text:`Câu (2)`,correct:!0,explanation:`Lời chào 'Hello' luôn là câu bắt đầu mọi cuộc hội thoại hoặc đoạn văn giới thiệu.`},{text:`Câu (1)`,explanation:`Đây là câu giới thiệu nghề nghiệp, đứng sau lời chào.`,correct:!1},{text:`Câu (3)`,explanation:`Câu này giới thiệu cụ thể nơi học, đứng sau câu (1).`,correct:!1},{text:`Câu (1) và (2)`,explanation:`Lời chào luôn ưu tiên số 1.`,correct:!1}]},{q:`Sắp xếp: (1) It rained heavily. (2) We stayed at home. (3) We could not go camping. Câu nào nên đứng ở vị trí số 1? 🌧️`,a:[{text:`Câu (1)`,correct:!0,explanation:`Câu (1) nêu sự kiện mở đầu; sau đó mới đến việc không thể đi cắm trại (3) và ở nhà (2).`},{text:`Câu (2)`,explanation:`Đây là kết quả cuối cùng.`,correct:!1},{text:`Câu (3)`,explanation:`Đây là kết quả trực tiếp từ việc mưa.`,correct:!1},{text:`Không câu nào`,explanation:`Trình tự 1-3-2 là logic nhất.`,correct:!1}]},{q:`Sắp xếp: (1) Then, she is very tall. (2) Finally, she plays basketball well. (3) First, my sister is Hoa. Câu nào đứng ở vị trí số 2? 🏀`,a:[{text:`Câu (1)`,correct:!0,explanation:`Giới thiệu tên (3) -> Đặc điểm ngoại hình (1) -> Tài năng/Hành động (2).`},{text:`Câu (3)`,explanation:`Đây là câu giới thiệu nhân vật, đứng số 1.`,correct:!1},{text:`Câu (2)`,explanation:`Câu này đứng cuối để giải thích lý do tại sao ngoại hình (1) lại giúp ích.`,correct:!1},{text:`Câu (1) và (3)`,explanation:`Sai trình tự mô tả. Cách dùng phù hợp trong câu này là “Câu (1)”.`,correct:!1}]},{q:`Sắp xếp: (1) Then, we saw a movie. (2) Last Sunday, I went out with my friends. (3) It was very funny. Câu nào đứng ở vị trí số 3? 🎬`,a:[{text:`Câu (3)`,correct:!0,explanation:`Câu (3) dùng 'It' để thay thế và nhận xét về bộ phim ở câu (1).`},{text:`Câu (2)`,explanation:`Đây là câu mở đầu giới thiệu thời gian.`,correct:!1},{text:`Câu (1)`,explanation:`Câu này kể về hành động tiếp theo, đứng số 2.`,correct:!1},{text:`Không câu nào`,explanation:`Thứ tự 2-1-3 là chuẩn nhất.`,correct:!1}]},{q:`Sắp xếp: (1) She bought some milk. (2) Then, she went home. (3) Mom went to the market. Câu nào đứng ở vị trí số 1? 🛒`,a:[{text:`Câu (3)`,correct:!0,explanation:`Hành động đi đến chợ (3) phải xảy ra trước khi mua hàng (1) và về nhà (2).`},{text:`Câu (1)`,explanation:`Mua hàng xảy ra tại chợ, đứng số 2.`,correct:!1},{text:`Câu (2)`,explanation:`Về nhà là hành động cuối cùng.`,correct:!1},{text:`Cả 3 câu`,explanation:`Chỉ một câu mở đầu logic.`,correct:!1}]},{q:`Sắp xếp: (1) They are very cute. (2) I have two small cats. (3) Their names are Mimi and Lulu. Câu nào đứng ở vị trí số 3? 🐈`,a:[{text:`Câu (3)`,correct:!0,explanation:`Giới thiệu vật nuôi (2) -> Nhận xét (1) -> Tên gọi (3) hoặc (2)-(3)-(1) đều được nhưng (3) cuối rất phổ biến.`},{text:`Câu (2)`,explanation:`Đây là câu giới thiệu số lượng, đứng số 1.`,correct:!1},{text:`Câu (1)`,explanation:`Nhận xét chung về chúng.`,correct:!1},{text:`Không có`,explanation:`Thứ tự logic là giới thiệu -> chi tiết.`,correct:!1}]},{q:`Sắp xếp: (1) He is a doctor. (2) He works in a big hospital. (3) This is my father. Câu nào đứng ở vị trí số 2? 👨‍⚕️`,a:[{text:`Câu (1)`,correct:!0,explanation:`Giới thiệu quan hệ (3) -> Nghề nghiệp (1) -> Nơi làm việc (2).`},{text:`Câu (3)`,explanation:`Đây là câu giới thiệu nhân vật.`,correct:!1},{text:`Câu (2)`,explanation:`Nơi làm việc là thông tin bổ sung cuối cùng.`,correct:!1},{text:`Không câu nào`,explanation:`Thứ tự 3-1-2 là chuẩn.`,correct:!1}]},{q:`Sắp xếp: (1) It's my favorite fruit. (2) I like mangoes very much. (3) Because they are sweet. Câu nào đứng ở vị trí số 3? 🥭`,a:[{text:`Câu (3)`,correct:!0,explanation:`Câu (3) bắt đầu bằng 'Because' để giải thích lý do cho các khẳng định trước đó.`},{text:`Câu (2)`,explanation:`Nêu sở thích, đứng số 1.`,correct:!1},{text:`Câu (1)`,explanation:`Nhấn mạnh lại sở thích, đứng số 2.`,correct:!1},{text:`Câu (1) và (2)`,explanation:`Giải thích luôn đứng sau khẳng định.`,correct:!1}]},{q:`Sắp xếp: (1) Today is my birthday. (2) I am very excited. (3) My friends give me many gifts. Câu mở đầu hợp lý? 🎂`,a:[{text:`Câu (1)`,correct:!0,explanation:`Lý do của sự hào hứng và quà tặng là ngày sinh nhật (1).`},{text:`Câu (2)`,explanation:`Cảm xúc thường theo sau sự kiện.`,correct:!1},{text:`Câu (3)`,explanation:`Hành động
