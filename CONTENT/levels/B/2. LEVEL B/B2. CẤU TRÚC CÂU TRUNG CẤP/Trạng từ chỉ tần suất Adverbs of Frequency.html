const fullQuestionBank=[{q:`Which adverb means '100% of the time'? 🌟`,a:[{text:`Always`,correct:!0,explanation:`'Always' nghĩa là luôn luôn, xảy ra 100%.`},{text:`Never`,explanation:`Sai. Phương án 'Never' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`Sometimes`,explanation:`Sai. Phương án 'Sometimes' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`Often`,explanation:`Sai. Phương án 'Often' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`Which adverb means '0% of the time'? ❌`,a:[{text:`Never`,correct:!0,explanation:`'Never' nghĩa là không bao giờ xảy ra.`},{text:`Always`,explanation:`Sai. Phương án 'Always' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`Usually`,explanation:`Sai. Phương án 'Usually' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`Rarely`,explanation:`Sai. Phương án 'Rarely' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`I go to school by bus on some days but not every day. I ___ go to school by bus. 🚌`,a:[{text:`sometimes`,correct:!0,explanation:`'Sometimes' nghĩa là thỉnh thoảng.`},{text:`always`,explanation:`Sai. Phương án 'always' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`never`,explanation:`Sai. Phương án 'never' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`often`,explanation:`Sai. Phương án 'often' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`She drinks milk for breakfast on four of the five school mornings, but not every morning. She ___ drinks milk for breakfast. 🥛`,a:[{text:`often`,correct:!0,explanation:`Đúng. Bốn trên năm buổi sáng là thường xuyên nhưng không phải 100%, nên dùng 'often'.`},{text:`never`,explanation:`Sai. Từ vựng hoặc dạng từ 'never' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`rarely`,explanation:`Sai. Từ vựng hoặc dạng từ 'rarely' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`sometimes`,explanation:`Sai. Từ vựng hoặc dạng từ 'sometimes' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`We ___ play soccer on Sundays. ⚽`,a:[{text:`always`,correct:!0,explanation:`'Always' nghĩa là luôn luôn.`},{text:`never`,explanation:`Sai. Từ vựng hoặc dạng từ 'never' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`seldom`,explanation:`Sai. Từ vựng hoặc dạng từ 'seldom' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`sometimes`,explanation:`Sai. Từ vựng hoặc dạng từ 'sometimes' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`He arrives before the bell every day, so he is ___ late for class. ⏰`,a:[{text:`never`,correct:!0,explanation:`'Never' nghĩa là không bao giờ.`},{text:`always`,explanation:`Sai. Từ vựng hoặc dạng từ 'always' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`often`,explanation:`Sai. Từ vựng hoặc dạng từ 'often' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`usually`,explanation:`Sai. Từ vựng hoặc dạng từ 'usually' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Trong tiếng Anh chuẩn trung tính, chọn câu đúng vị trí trạng từ: 🏃`,a:[{text:`I always run fast.`,correct:!0,explanation:`Trạng từ 'always' đứng trước động từ thường 'run'.`},{text:`I run always fast.`,explanation:`Sai. 'Always' không đứng giữa động từ 'run' và trạng từ cách thức 'fast' trong mẫu trung tính.`,correct:!1},{text:`Always I run fast.`,explanation:`Sai. Đặt 'Always' đầu câu không phải vị trí được yêu cầu trong mẫu tiếng Anh chuẩn trung tính này.`,correct:!1},{text:`I run fast always.`,explanation:`Sai. 'Always' không đặt cuối câu sau trạng từ 'fast' trong mẫu trung tính.`,correct:!1}]},{q:`Trong tiếng Anh chuẩn trung tính, chọn câu đúng vị trí trạng từ: 😴`,a:[{text:`He is never tired.`,correct:!0,explanation:`Trạng từ 'never' đứng sau động từ to be 'is'.`},{text:`He never is tired.`,explanation:`Sai. Phải đứng sau 'is'.`,correct:!1},{text:`Never he is tired.`,explanation:`Sai cấu trúc. Phương án 'Never he is tired.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`He is tired never.`,explanation:`Sai cấu trúc. Phương án 'He is tired never.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`They watch TV on most evenings after homework, but not every evening. They ___ watch TV in the evening. 📺`,a:[{text:`usually`,correct:!0,explanation:`Đúng. 'Most evenings, but not every evening' tương ứng với 'usually'.`},{text:`never`,explanation:`Sai. Từ vựng hoặc dạng từ 'never' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`rarely`,explanation:`Sai. Từ vựng hoặc dạng từ 'rarely' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`once`,explanation:`Sai. Phương án 'once' không chính xác do sai cấu trúc hoặc không phù hợp ngữ cảnh.`,correct:!1}]},{q:`My cat usually sleeps on the sofa and only occasionally sleeps on my bed; it ___ sleeps on my bed. 🐱`,a:[{text:`rarely`,correct:!0,explanation:`'Rarely' nghĩa là hiếm khi.`},{text:`always`,explanation:`Sai. Từ vựng hoặc dạng từ 'always' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`usually`,explanation:`Sai. Từ vựng hoặc dạng từ 'usually' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`often`,explanation:`Sai. Từ vựng hoặc dạng từ 'often' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`I ___ eat vegetables at every meal. I love them! 🥦`,a:[{text:`always`,correct:!0,explanation:`Cụm 'at every meal' khóa tần suất 100%, nên dùng 'always'; 'love' chỉ bổ sung lý do, không tự suy ra tần suất.`},{text:`never`,explanation:`Sai. Từ vựng hoặc dạng từ 'never' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`rarely`,explanation:`Sai. Từ vựng hoặc dạng từ 'rarely' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`seldom`,explanation:`Sai. Từ vựng hoặc dạng từ 'seldom' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`I hate spiders and refuse to touch them under any circumstances. I ___ touch them. 🕷️`,a:[{text:`never`,correct:!0,explanation:`Cụm 'under any circumstances' khẳng định tần suất 0%, nên dùng 'never'; không chỉ suy đoán từ cảm xúc 'hate'.`},{text:`always`,explanation:`Sai. Từ vựng hoặc dạng từ 'always' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`usually`,explanation:`Sai. Từ vựng hoặc dạng từ 'usually' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`often`,explanation:`Sai. Từ vựng hoặc dạng từ 'often' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Trong tiếng Anh chuẩn trung tính, sắp xếp: always / happy / is / She. 😊`,a:[{text:`She is always happy.`,correct:!0,explanation:`Trạng từ 'always' đứng sau động từ to be 'is'.`},{text:`She always is happy.`,explanation:`Sai vị trí. Cách dùng phù hợp trong câu này là “She is always happy.”.`,correct:!1},{text:`Always she is happy.`,explanation:`Sai cấu trúc. Phương án 'Always she is happy.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`She is happy always.`,explanation:`Sai cấu trúc. Phương án 'She is happy always.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`Trong tiếng Anh chuẩn trung tính, sắp xếp: reads / He / often / books. 📚`,a:[{text:`He often reads books.`,correct:!0,explanation:`Trạng từ 'often' đứng trước động từ thường 'reads'.`},{text:`He reads often books.`,explanation:`Sai vị trí. Cách dùng phù hợp trong câu này là “He often reads books.”.`,correct:!1},{text:`Often he reads books.`,explanation:`Sai cấu trúc. Phương án 'Often he reads books.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`He reads books often.`,explanation:`Sai cấu trúc. Phương án 'He reads books oft
