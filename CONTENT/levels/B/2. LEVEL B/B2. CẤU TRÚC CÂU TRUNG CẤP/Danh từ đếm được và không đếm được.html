const fullQuestionBank=[{q:`There is ___ milk in the fridge. 🥛`,a:[{text:`some`,correct:!0,explanation:`'Milk' là danh từ không đếm được, dùng 'some' trong câu khẳng định.`},{text:`a`,explanation:`Sai. 'A' cần một danh từ đếm được số ít hoặc một đơn vị như 'a glass of milk'.`,correct:!1},{text:`an`,explanation:`Sai. 'An' cũng không đứng trực tiếp trước danh từ không đếm được 'milk'.`,correct:!1},{text:`many`,explanation:`Sai. 'Many' dùng cho danh từ đếm được số nhiều.`,correct:!1}]},{q:`I have ___ apple for lunch. 🍎`,a:[{text:`an`,correct:!0,explanation:`'Apple' là danh từ đếm được số ít, bắt đầu bằng nguyên âm nên dùng 'an'.`},{text:`a`,explanation:`Sai. 'Apple' bắt đầu bằng nguyên âm.`,correct:!1},{text:`some`,explanation:`Sai. Phương án 'some' không hòa hợp về ngôi và số với chủ ngữ 'I have'.`,correct:!1},{text:`any`,explanation:`Sai. Dùng trong câu phủ định hoặc nghi vấn.`,correct:!1}]},{q:`How ___ books do you have? 📚`,a:[{text:`many`,correct:!0,explanation:`'Books' là danh từ đếm được số nhiều, dùng 'How many'.`},{text:`much`,explanation:`Sai. 'Much' dùng cho danh từ không đếm được.`,correct:!1},{text:`some`,explanation:`Sai. Phương án 'some' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`any`,explanation:`Sai. Phương án 'any' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`She drinks ___ water every day. 💧`,a:[{text:`a lot of`,correct:!0,explanation:`'Water' là danh từ không đếm được, dùng 'a lot of'.`},{text:`many`,explanation:`Sai. 'Many' chỉ đi với danh từ đếm được số nhiều, không đi trực tiếp với 'water'.`,correct:!1},{text:`a`,explanation:`Sai. Muốn dùng 'a' phải thêm đơn vị, chẳng hạn 'a bottle of water'.`,correct:!1},{text:`few`,explanation:`Sai. 'Few' dùng cho danh từ đếm được.`,correct:!1}]},{q:`Do you need ___ sugar at all for the cake? 🍰`,a:[{text:`any`,correct:!0,explanation:`Cụm phủ định phạm vi 'at all' khóa câu hỏi về bất kỳ lượng đường nào, nên dùng 'any'.`},{text:`a`,explanation:`Sai. 'A' không đứng trước 'sugar' nếu không có đơn vị như 'a spoonful'.`,correct:!1},{text:`many`,explanation:`Sai. 'Many' dùng cho vật đếm được số nhiều, không dùng cho đường.`,correct:!1},{text:`an`,explanation:`Sai. 'an' là mạo từ không xác định dùng trước nguyên âm (u, e, o, a, i), không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1}]},{q:`There are two ___ in the garden. 🐱`,a:[{text:`cats`,correct:!0,explanation:`Số từ 'two' đi với danh từ số nhiều thêm 's'.`},{text:`cat`,explanation:`Sai. Thiếu 's'. Cách dùng phù hợp trong câu này là “cats”.`,correct:!1},{text:`cates`,explanation:`Sai. Phương án 'cates' bị viết sai chính tả hoặc sai dạng từ gốc.`,correct:!1},{text:`cat's`,explanation:`Sai. Đây là sở hữu cách.`,correct:!1}]},{q:`I would like some ___, please. 🍚`,a:[{text:`rice`,correct:!0,explanation:`'Rice' là danh từ không đếm được, đi với 'some'.`},{text:`rices`,explanation:`Sai. 'Rice' không có dạng số nhiều.`,correct:!1},{text:`a rice`,explanation:`Sai. Từ vựng hoặc dạng từ 'a rice' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`an rice`,explanation:`Sai. Từ vựng hoặc dạng từ 'an rice' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`My mother has long ___ overall, as a hairstyle. 👩`,a:[{text:`hair`,correct:!0,explanation:`'Hair' (tóc) nói chung là danh từ không đếm được.`},{text:`hairs`,explanation:`Sai. Chỉ dùng 'hairs' khi đếm từng sợi tóc cụ thể.`,correct:!1},{text:`a hair`,explanation:`Sai. Phương án 'a hair' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`an hair`,explanation:`Sai. Từ vựng hoặc dạng từ 'an hair' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Can I have a ___ of bread? 🍞`,a:[{text:`loaf`,correct:!0,explanation:`Dùng 'a loaf of bread' (một ổ bánh mì).`},{text:`bar`,explanation:`Sai. Thường dùng 'bar of chocolate'.`,correct:!1},{text:`bottle`,explanation:`Sai. Dùng cho chất lỏng.`,correct:!1},{text:`bowl`,explanation:`Sai. Dùng cho món ăn trong bát.`,correct:!1}]},{q:`How ___ money do you need? 💵`,a:[{text:`much`,correct:!0,explanation:`'Money' là danh từ không đếm được, dùng 'How much'.`},{text:`many`,explanation:`Sai. 'many' là lượng từ dùng cho danh từ đếm được số nhiều, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`any`,explanation:`Sai. 'any' là lượng từ dùng trong câu phủ định hoặc nghi vấn, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`some`,explanation:`Sai. 'some' là lượng từ dùng trong câu khẳng định hoặc lời mời, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1}]},{q:`We don't have ___ bananas left—not even one. 🍌`,a:[{text:`any`,correct:!0,explanation:`Cụm 'not even one' khẳng định không còn một quả nào, nên dùng 'any'.`},{text:`some`,explanation:`Sai. 'Some' thường dùng trong câu khẳng định.`,correct:!1},{text:`a`,explanation:`Sai. Phương án 'a' không hòa hợp chủ vị với chủ ngữ trong câu.`,correct:!1},{text:`much`,explanation:`Sai. 'Bananas' đếm được.`,correct:!1}]},{q:`Look! There is a ___ in the sky. 🐦`,a:[{text:`bird`,correct:!0,explanation:`Dùng 'a' với danh từ đếm được số ít 'bird'.`},{text:`birds`,explanation:`Sai. Phương án 'birds' không hòa hợp chủ vị với chủ ngữ trong câu.`,correct:!1},{text:`water`,explanation:`Sai. 'Water' là chất lỏng, không phải một con vật xuất hiện trên trời.`,correct:!1},{text:`rain`,explanation:`Sai. 'Rain' là mưa; câu đang cần một danh từ chỉ con vật số ít.`,correct:!1}]},{q:`Please buy a plastic ___ of milk from the vending machine. 🍼`,a:[{text:`bottle`,correct:!0,explanation:`Đúng. Stem yêu cầu một chai nhựa từ máy bán hàng, nên dùng 'bottle'.`},{text:`piece`,explanation:`Sai. Dùng cho bánh, giấy...`,correct:!1},{text:`slice`,explanation:`Sai. Dùng cho bánh mì, thịt...`,correct:!1},{text:`kilo`,explanation:`Không tự nhiên trong ngữ cảnh này.`,correct:!1}]},{q:`He eats a ___ every morning, made with two slices of bread and a filling. 🥪`,a:[{text:`egg`,explanation:`Sai. 'Egg' bắt đầu bằng nguyên âm, phải dùng 'an'.`,correct:!1},{text:`sandwich`,correct:!0,explanation:`'A' đi với danh từ bắt đầu bằng phụ âm 'sandwich'.`},{text:`rice`,explanation:`Sai. 'Rice' là ngũ cốc không đếm được, không phải món kẹp giữa hai lát bánh mì.`,correct:!1},{text:`soup`,explanation:`Sai. 'Soup' là món lỏng không đếm được, không khớp mô tả hai lát bánh mì và nhân.`,correct:!1}]},{q:`Is there ___ cheese in the burger? 🧀`,a:[{text:`any`,correct:!0,explanation:`Câu hỏi với danh từ không đếm được dùng 'any'.`},{text:`a`,explanation:`Sai. Cheese không đếm được.`,correct:!1},{text:`many`,explanation:`Sai. 'many' là lượng từ dùng cho danh từ đếm được số nhiều, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`an`,explanation:`Sai. 'an' là mạo từ không xác định dùng trước nguyên âm (u, e, o, a, i), không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1}]},{q:`I see three ___ on the street. 🚌`,a:[{text:`buses`,correct:!0,explanation:`Danh từ kết thúc bằng 's', thêm 'es' khi sang số nhiều.`},{text:`bus`,explanation:`Sai. Phương án 'bus' không hòa hợp về ngôi và số với chủ ngữ 'I see three'.`,correct:!1},{text:`buss`,explanation:`Sai. Phương án 'buss' bị viết sai chính tả hoặc sai dạng từ gốc.`,correct:!1},{text:`bus's`,explanation:`Sai. Từ vựng hoặc dạng từ 'bus's' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`She wants a ___ of chocolate. 🍫`,a:[{text:`bar`,correct:!0,explanation:`Đơn vị đếm của sô-cô-la là 'bar' (thanh).`},{text:`can`,explanation:`Sai. Dùng cho đồ uống.`,correct:!1},{text:`loaf`,explanation:`Sai. Dùng cho bánh mì.`,correct:!1},{text:`bottle`,explanation:`Sai. Từ vựng hoặc dạng từ 'bottle' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Do you like ___ as a food in general? 🍕`,a:[{text:`pizza`,correct:!0,explanation:`Đúng. Stem hỏi món pizza nói chung, nên dùng danh từ không đếm được 'pizza'.`},{text:`pizzas`,explanation:`Sai. 'Pizzas' chỉ nhiều chiếc hoặc nhiều loại pizza,
