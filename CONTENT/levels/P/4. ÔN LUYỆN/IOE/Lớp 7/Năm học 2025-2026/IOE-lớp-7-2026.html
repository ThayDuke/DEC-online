ear' yêu cầu chia thì Hiện tại hoàn thành: 'has planted'.`},{text:`planted`,correct:!1,explanation:`Quá khứ đơn không đi với giới từ 'since' chỉ độ dài đến hiện tại.`},{text:`plants`,correct:!1,explanation:`Hiện tại đơn diễn tả thói quen.`},{text:`will plant`,correct:!1,explanation:`Tương lai đơn sai thì.`}]},{q:`Have you ever ___ food to homeless people at the charity soup kitchen? 🍲`,a:[{text:`provided`,correct:!0,explanation:`Chính xác! Sau 'Have you ever...' động từ chia ở dạng phân từ hai (V3/ed): 'provided'.`},{text:`provide`,correct:!1,explanation:`Nguyên thể chưa chia.`},{text:`provides`,correct:!1,explanation:`Dạng hiện tại đơn ngôi thứ 3.`},{text:`providing`,correct:!1,explanation:`Dạng V-ing tiếp diễn.`}]},{q:`Odd one out: Chọn từ có đuôi '-ed' phát âm là /ɪd/ (khác với âm /t/ và /d/): donated, helped, washed, cooked 🔊`,a:[{text:`donated`,correct:!0,explanation:`Chính xác! Động từ tận cùng bằng âm /t/ ('donate') khi thêm đuôi -ed phát âm là /ɪd/, còn helped, washed, cooked đều phát âm là /t/.`},{text:`helped`,correct:!1,explanation:`Phát âm đuôi là /t/ (sau âm vô thanh /p/).`},{text:`washed`,correct:!1,explanation:`Phát âm đuôi là /t/ (sau âm vô thanh /ʃ/).`},{text:`cooked`,correct:!1,explanation:`Phát âm đuôi là /t/ (sau âm vô thanh /k/).`}]},{q:`Odd one out: Chọn từ có đuôi '-ed' phát âm là /t/ (khác với âm /d/): cleaned, recycled, watched, opened 🔊`,a:[{text:`watched`,correct:!0,explanation:`Đúng rồi! 'watched' tận cùng bằng âm vô thanh /tʃ/ nên -ed phát âm là /t/, còn cleaned, recycled, opened đều phát âm là /d/.`},{text:`cleaned`,correct:!1,explanation:`Phát âm đuôi là /d/ (sau âm hữu thanh /n/).`},{text:`recycled`,correct:!1,explanation:`Phát âm đuôi là /d/ (sau âm hữu thanh /l/).`},{text:`opened`,correct:!1,explanation:`Phát âm đuôi là /d/ (sau âm hữu thanh /n/).`}]},{q:`Sắp xếp chữ cái thành từ chỉ viện dưỡng lão cho người cao tuổi: 's - g - n - r - i - u - n' 👵👴`,a:[{text:`nursing`,correct:!0,explanation:`Xuất sắc! 'nursing home' là viện dưỡng lão chăm sóc người già neo đơn.`},{text:`nursign`,correct:!1,explanation:`Sai vị trí chữ g và n cuối từ.`},{text:`nursin`,correct:!1,explanation:`Thiếu chữ g.`},{text:`runsing`,correct:!1,explanation:`Sai vị trí các chữ cái đầu.`}]},{q:`Viết lại câu không đổi nghĩa: 'They started doing community service three years ago.' 🤝`,a:[{text:`They have done community service for three years.`,correct:!0,explanation:`Chính xác! Cấu trúc 'started V-ing + time ago' chuyển đổi thành 'have/has + V3 + for + time'.`},{text:`They have started doing community service for three years.`,correct:!1,explanation:`Không dùng động từ 'started' kéo dài với 'for three years'.`},{text:`They did community service since three years.`,correct:!1,explanation:`'since' không đi với khoảng thời gian đếm được.`},{text:`They will do community service in three years.`,correct:!1,explanation:`Tương lai đơn sai nghĩa gốc.`}]},{q:`Tìm lỗi sai trong câu sau: 'We have collected hundreds of warm coats yesterday morning.' 🧥`,a:[{text:`have collected -> collected`,correct:!0,explanation:`Đúng rồi! Thời điểm xác định trong quá khứ 'yesterday morning' chỉ đi với thì Quá khứ đơn 'collected', không dùng Hiện tại hoàn thành.`},{text:`hundreds of -> hundred of`,correct:!1,explanation:`Cụm danh từ 'hundreds of' (hàng trăm) là hoàn toàn đúng.`},{text:`warm coats -> coats warm`,correct:!1,explanation:`Tính từ đứng trước danh từ là chuẩn.`},{text:`yesterday morning -> tomorrow morning`,correct:!1,explanation:`Không thay đổi mốc thời gian đề bài.`}]},{q:`Dự án 'Đổi giấy vụn lấy cây xanh nhỏ' tiếng Anh dùng cụm từ nào? 📄🌱`,a:[{text:`exchange paper for plants`,correct:!0,explanation:`Chính xác! 'exchange A for B' là đổi vật A lấy vật B.`},{text:`buy paper with plants`,correct:!1,explanation:`Mua giấy bằng cây (sai nghĩa).`},{text:`burn paper with plants`,correct:!1,explanation:`Đốt giấy cùng với cây.`},{text:`throw paper at plants`,correct:!1,explanation:`Ném giấy vào cây xanh.`}]},{q:`Trung tâm cứu hộ động vật bị bỏ rơi và chăm sóc thú cưng đi lạc gọi là: 🐕🐈`,a:[{text:`animal shelter`,correct:!0,explanation:`Đúng rồi! 'animal shelter' là trạm cứu hộ động vật.`},{text:`pet shop`,correct:!1,explanation:`'pet shop' là cửa hàng buôn bán thú cưng thương mại.`},{text:`zoo`,correct:!1,explanation:`'zoo' là vườn bách thú trưng bày.`},{text:`aquarium`,correct:!1,explanation:`'aquarium' là thủy cung nuôi cá cảnh.`}]},{q:`Doing volunteer work helps students gain practical skills and feel more ___ towards others. ❤️`,a:[{text:`compassionate`,correct:!0,explanation:`Tuyệt vời! 'compassionate' có nghĩa là giàu lòng trắc ẩn, biết yêu thương và cảm thông.`},{text:`selfish`,correct:!1,explanation:`'selfish' là ích kỷ hẹp hòi.`},{text:`greedy`,correct:!1,explanation:`'greedy' là tham lam vơ vét.`},{text:`careless`,correct:!1,explanation:`'careless' là bất cẩn vô tâm.`}]},{q:`We organized a charity music concert to ___ funds for poor students in remote villages. 🎵💰`,a:[{text:`raise`,correct:!0,explanation:`Chính xác! Cụm từ gây quỹ từ thiện là 'raise funds' (hoặc 'raise money').`},{text:`rise`,correct:!1,explanation:`'rise' là nội động từ (mọc lên, tăng lên), không đi với tân ngữ 'funds'.`},{text:`lose`,correct:!1,explanation:`'lose' là làm mất tiền.`},{text:`spend`,correct:!1,explanation:`'spend' là tiêu xài tiền vào việc gì.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'children / tutored / We / street / Maths / last / summer / .' 📚`,a:[{text:`We tutored street children Maths last summer.`,correct:!0,explanation:`Xuất sắc! Cấu trúc câu: S (We) + V (tutored) + Tân ngữ gián tiếp (street children) + Tân ngữ trực tiếp (Maths) + Thời gian (last summer).`},{text:`We street children tutored Maths last summer.`,correct:!1,explanation:`Tân ngữ không được đứng trước động từ chính.`},{text:`Last summer tutored we street children Maths.`,correct:!1,explanation:`Sai vị trí chủ ngữ 'We'.`},{text:`We tutored last summer street children Maths.`,correct:!1,explanation:`Cụm thời gian nên để ở cuối câu.`}]},{q:`What is the main purpose of blood donation campaigns? 🩸`,a:[{text:`To save patients' lives in emergency situations.`,correct:!0,explanation:`Chính xác! Mục đích cao đẹp nhất của hiến máu nhân đạo là cứu sống tính mạng người bệnh trong cơn nguy kịch.`},{text:`To sell blood for a lot of cash.`,correct:!1,explanation:`Hiến máu nhân đạo không nhằm mục đích thương mại.`},{text:`To test new cosmetics.`,correct:!1,explanation:`Hiến máu không để thử nghiệm mỹ phẩm.`},{text:`To win sports medals.`,correct:!1,explanation:`Hiến máu không để lấy huy chương thể thao.`}]},{q:`Người nghệ sĩ tài hoa sáng tác nên những bản giao hưởng và giai điệu âm nhạc bất hủ gọi là: 🎼`,a:[{text:`composer`,correct:!0,explanation:`Chính xác! Nhà soạn nhạc là 'composer' (ví dụ: Mozart, Beethoven, Trịnh Công Sơn).`},{text:`painter`,correct:!1,explanation:`'painter' là họa sĩ vẽ tranh.`},{text:`sculptor`,correct:!1,explanation:`'sculptor' là nhà điêu khắc tạc tượng.`},{text:`poet`,correct:!1,explanation:`'poet' là nhà thơ sáng tác thơ ca.`}]},{q:`Bức tranh vẽ chân dung diện mạo khuôn mặt của một người tiếng Anh là gì? 🖼️👤`,a:[{text:`portrait`,correct:!0,explanation:`Đúng rồi! Tranh chân dung là 'portrait'.`},{text:`landscape`,correct:!1,explanation:`'landscape' là tranh phong cảnh thiên nhiên.`},{text:`still life`,correct:!1,explanation:`'still life' là tranh tĩnh vật (hoa quả, bình trà).`},{text:`graffiti`,correct:!1,explanation:`'graffiti' là tranh vẽ phun sơn trên tường phố.`}]},{q:`Nghệ thuật múa rối nước độc đáo truyền thống của cư dân đồng bằng Bắc Bộ Việt Nam là: 🎎🌊`,a:[{text:`water puppetry`,correct:!0,explanation:`Xuất sắc! Nghệ thuật múa rối nước là 'water puppetry'.`},{text:`circus`,correct:!1,explanation:`'circus' là rạp xiếc uốn dẻo và xiếc thú.`},{text:`opera`,correct:!1,explanation:`'opera' là nhạc kịch thính phòng phương Tây.`},{text:`ballet`,correct:!1,explanation:`'ballet' là môn múa ba-lê cổ điển.`}]},{q:`Nhạc cụ dây bằng gỗ có kích thước rất lớn, âm thanh trầm ấm người chơi phải ngồi ôm đàn kéo vĩ là gì? 🎻`,a:[{text:`cello`,correct:!0,explanation:`Chính xác! Đàn trung hồ cầm / hồ cầm là 'cello' (hoặc 'violoncello').`},{text:`violin`,correct:!1,explanation:`'violin' là đàn vĩ cầm nhỏ kẹp ở vai.`},{text:`flute`,correct:!1,explanation:`'flute' là ống sáo trúc thổi hơi.`},{text:`drum`,correct:!1,explanation:`'drum' là chiếc trống gõ bằng dùi.`}]},{q:`Learning to play a musical instrument is not ___ as learning a foreign language. 🎹 (So sánh ngang bằng)`,a:[{text:`as difficult`,correct:!0,explanation:`Đúng rồi! Cấu trúc so sánh bằng ở dạng phủ định: 'not as/so + adj + as' ('not as difficult as').`},{text:`different`,correct:!1,explanation:`Cần cấu trúc so sánh bằng 'as...as'.`},{text:`more difficult`,correct:!1,explanation:`Nếu dùng 'more difficult' thì phải đi với từ 'than', không đi với 'as'.`},{text:`the same`,correct:!1,explanation:`Cần tính từ miêu tả độ khó 'difficult'.`}]},{q:`My painting style is totally ___ from hers. She prefers bright colours while I like dark shades. 🎨`,a:[{text:`different`,correct:!0,explanation:`Chính xác! Cấu trúc so sánh khác biệt: 'different from' (khác biệt với).`},{text:`same`,correct:!1,explanation:`'same' phải đi với giới từ 'as' (the same as).`},{text:`like`,correct:!1,explanation:`'like' không đi cùng giới từ 'from'.`},{text:`similar`,correct:!1,explanation:`'similar' đi với giới từ 'to' (similar to).`}]},{q:`This exhibition ticket costs 100,000 VND. That ticket costs 100,000 VND too. The prices are ___. 🎟️`,a:[{text:`the same`,correct:!0,explanation:`Đúng rồi! Khi hai vật có cùng mức giá tiền như nhau ta nói 'The prices are the same.'.`},{text:`different`,correct:!1,explanation:`Hai vé đều 100k nên giá bằng nhau, không khác nhau.`},{text:`as well`,correct:!1,explanation:`'as well' có nghĩa là cũng thế, không đứng làm vị ngữ so sánh.`},{text:`different from`,correct:!1,explanation:`Thiếu đối tượng so sánh phía sau.`}]},{q:`Phần trình diễn của ca sĩ trẻ tối qua cuốn hút và ấn tượng hệt như một nghệ sĩ chuyên nghiệp. 'Ấn tượng như' viết là: ✨`,a:[{text:`as impressive as`,correct:!0,explanation:`Chính xác! Cấu trúc so sánh ngang bằng tính từ: 'as + impressive + as'.`},{text:`as impressive than`,correct:!1,explanation:`So sánh bằng không dùng từ 'than'.`},{text:`more impressive as`,correct:!1,explanation:`Dùng 'more' phải đi với 'than'.`},{text:`the same impressive as`,correct:!1,explanation:`Sau 'the same' là danh từ, không dùng tính từ.`}]},{q:`Odd one out: Chọn từ có phần phát âm phụ âm là /ʒ/ (khác với âm /ʃ/): show, machine, share, pleasure 🔊`,a:[{text:`pleasure`,correct:!0,explanation:`Chính xác! 'pleasure' có âm 's' phát âm là /ʒ/ hữu thanh /ˈpleʒ.ər/, trong khi show, machine, share đều phát âm là /ʃ/ vô thanh.`},{text:`show`,correct:!1,explanation:`Phát âm là /ʃ/.`},{text:`machine`,correct:!1,explanation:`Phát âm là /ʃ/.`},{text:`share`,correct:!1,explanation:`Phát âm là /ʃ/.`}]},{q:`Odd one out: Từ nào chỉ THỂ LOẠI TÁC PHẨM NGHỆ THUẬT, không phải nhạc cụ âm nhạc? 🎷`,a:[{text:`sculpture`,correct:!0,explanation:`Đúng rồi! 'sculpture' (tác phẩm điêu khắc) là nghệ thuật thị giác, còn saxophone, violin, guitar là nhạc cụ âm nhạc.`},{text:`saxophone`,correct:!1,explanation:`'saxophone' là kèn sắc-xô-phôn bằng đồng.`},{text:`violin`,correct:!1,explanation:`'violin' là đàn vĩ cầm kéo vĩ.`},{text:`guitar`,correct:!1,explanation:`'guitar' là đàn ghi-ta gảy ngón.`}]},{q:`Sắp xếp chữ cái thành từ chỉ phòng trưng bày triển lãm tranh: 'r - l - g - a - l - e - y' 🏛️`,a:[{text:`gallery`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'gallery' (phòng triển lãm nghệ thuật).`},{text:`gallerly`,correct:!1,explanation:`Thừa chữ l.`},{text:`galleey`,correct:!1,explanation:`Sai chữ r thành e.`},{text:`legarly`,correct:!1,explanation:`Sai chính tả hoàn toàn.`}]},{q:`Viết lại câu không đổi nghĩa: 'Classical music is more relaxing than heavy metal rock music.' 🎻🎸`,a:[{text:`Heavy metal rock music is not as relaxing as classical music.`,correct:!0,explanation:`Chính xác! 'A is more adj than B' viết lại thành 'B is not as adj as A'.`},{text:`Heavy metal rock music is as relaxing as classical music.`,correct:!1,explanation:`Chuyển thành so sánh bằng là sai ý nghĩa gốc.`},{text:`Classical music is less relaxing than heavy metal rock music.`,correct:!1,explanation:`Ngược hoàn toàn nghĩa gốc.`},{text:`Heavy metal rock music is different to classical music.`,correct:!1,explanation:`Chưa nêu rõ khía cạnh tính từ relaxing.`}]},{q:`Tìm lỗi sai trong câu sau: 'His new song is not the same like his previous album.' 🎵`,a:[{text:`the same like -> the same as`,correct:!0,explanation:`Đúng rồi! Cấu trúc so sánh giống nhau bắt buộc dùng 'the same as', không dùng 'the same like'.`},{text:`new song -> song new`,correct:!1,explanation:`Tính từ đứng trước danh từ là đúng.`},{text:`previous -> next`,correct:!1,explanation:`Không cần thay đổi từ chỉ trước đây.`},{text:`album -> albums`,correct:!1,explanation:`Một album trước đó là hoàn toàn đúng.`}]},{q:`Khán phòng nhà hát vang dội tiếng vỗ tay ròn rã của khán giả tán thưởng màn trình diễn. 'Vỗ tay tán thưởng' là: 👏`,a:[{text:`applause`,correct:!0,explanation:`Chính xác! 'applause' là tràng pháo tay cổ vũ tán thưởng nhiệt liệt.`},{text:`silence`,correct:!1,explanation:`'silence' là sự im lặng như tờ.`},{text:`screaming`,correct:!1,explanation:`'screaming' là tiếng la hét thất thanh.`},{text:`crying`,correct:!1,explanation:`'crying' là tiếng khóc lóc.`}]},{q:`The Mona Lisa is probably the most famous oil ___ in the world, painted by Leonardo da Vinci. 🖼️`,a:[{text:`painting`,correct:!0,explanation:`Đúng rồi! Bức tranh vẽ bằng chất liệu sơn dầu là 'oil painting'.`},{text:`drawing`,correct:!1,explanation:`'drawing' là tranh vẽ phác thảo bằng bút chì.`},{text:`sculpture`,correct:!1,explanation:`'sculpture' là pho tượng điêu khắc đá.`},{text:`poster`,correct:!1,explanation:`'poster' là tấm áp phích quảng cáo in giấy.`}]},{q:`The anthem of a country is played solemnly at international sports events. 'Quốc ca' tiếng Anh là: 🇻🇳`,a:[{text:`national anthem`,correct:!0,explanation:`Tuyệt vời! Bản quốc ca của một quốc gia là 'national anthem' (ví dụ bài 'Tiến quân ca').`},{text:`folk song`,correct:!1,explanation:`'folk song' là bài hát dân ca truyền thống.`},{text:`pop song`,correct:!1,explanation:`'pop song' là bài hát nhạc trẻ hiện đại.`},{text:`lullaby`,correct:!1,explanation:`'lullaby' là bài hát ru con ngủ.`}]},{q:`Musicians in a traditional orchestra must follow the tempo guided by the ___. 🎼`,a:[{text:`conductor`,correct:!0,explanation:`Chính xác! Người chỉ huy dàn nhạc giao hưởng là 'conductor'.`},{text:`driver`,correct:!1,explanation:`'driver' là tài xế lái xe.`},{text:`actor`,correct:!1,explanation:`'actor' là nam diễn viên kịch.`},{text:`dancer`,correct:!1,explanation:`'dancer' là vũ công nhảy múa.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'different / tastes / His / music / are / mine / from / in / .' 🎶`,a:[{text:`His tastes in music are different from mine.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: His tastes in music (Gu thưởng thức âm nhạc của anh ấy) + are + different from + mine (của tôi).`},{text:`His tastes are different in music from mine.`,correct:!1,explanation:`Cụm 'tastes in music' không nên bị tách rời.`},{text:`Different from mine his tastes are in music.`,correct:!1,explanation:`Sai trật tự cú pháp tiếng Anh.`},{text:`His music tastes from mine are different.`,correct:!1,explanation:`Vị ngữ phải đi sau chủ ngữ.`}]},{q:`Van Cao was a brilliant Vietnamese musician who ___ the national anthem 'Tien Quan Ca' in 1944. ✍️`,a:[{text:`composed`,correct:!0,explanation:`Chính xác! Sáng tác nên một bản nhạc dùng động từ quá khứ 'composed'.`},{text:`painted`,correct:!1,explanation:`Họa sĩ vẽ tranh mới dùng 'painted'.`},{text:`built`,correct:!1,explanation:`Thợ xây dựng nhà mới dùng 'built'.`},{text:`invented`,correct:!1,explanation:`Phát minh máy móc mới dùng 'invented'.`}]},{q:`Which traditional art form from the Mekong Delta of Vietnam is recognized by UNESCO as intangible cultural heritage? 🎭`,a:[{text:`Don ca tai tu music`,correct:!0,explanation:`Chính xác! Đờn ca tài tử Nam Bộ là di sản văn hóa phi vật thể đại diện của nhân loại được UNESCO vinh danh.`},{text:`Hip hop dance`,correct:!1,explanation:`Môn nhảy đường phố hiện đại.`},{text:`Rock and roll`,correct:!1,explanation:`Dòng nhạc rock phương Tây.`},{text:`K-pop choreography`,correct:!1,explanation:`Vũ đạo nhạc trẻ Hàn Quốc.`}]},{q:`Nước dùng ninh từ xương bò hoặc gà trong veo, ngọt thanh của món phở truyền thống gọi là gì? 🍲`,a:[{text:`broth`,correct:!0,explanation:`Chính xác! Nước dùng nấu phở / nước hầm xương là 'broth'.`},{text:`sauce`,correct:!1,explanation:`'sauce' là nước sốt chấm sệt.`},{text:`gravy`,correct:!1,explanation:`'gravy' là nước sốt thịt quay kiểu Tây.`},{text:`curry`,correct:!1,explanation:`'curry' là món cà ri cay nồng.`}]},{q:`Củ nghệ vàng thơm dùng làm gia vị ướp món cá kho hoặc chả cá tiếng Anh là gì? 🧄`,a:[{text:`turmeric`,correct:!0,explanation:`Đúng rồi! Củ nghệ vàng là 'turmeric'.`},{text:`pepper`,correct:!1,explanation:`'pepper' là hạt tiêu đen xay nhỏ.`},{text:`garlic`,correct:!1,explanation:`'garlic' là củ tỏi thơm.`},{text:`ginger`,correct:!1,explanation:`'ginger' là củ gừng cay nồng ấm bụng.`}]},{q:`Món trứng đánh đều tráng mỏng vàng ươm trên chảo dầu nóng gọi là: 🍳`,a:[{text:`omelette`,correct:!0,explanation:`Xuất sắc! Món trứng tráng / ốp-lết là 'omelette'.`},{text:`pancake`,correct:!1,explanation:`'pancake' là bánh rán bột mì ngọt.`},{text:`sandwich`,correct:!1,explanation:`'sandwich' là bánh mì kẹp hai lát.`},{text:`spring roll`,correct:!1,explanation:`'spring roll' là món nem rán / chả giò giòn.`}]},{q:`How ___ bottles of cooking oil does your mother need for the family dinner? 🍾`,a:[{text:`many`,correct:!0,explanation:`Chính xác! 'bottles' (những chiếc chai) là danh từ đếm được số nhiều nên dùng 'How many'.`},{text:`much`,correct:!1,explanation:`'much' chỉ đi trực tiếp với danh từ không đếm được như 'How much cooking oil...?'.`},{text:`long`,correct:!1,explanation:`'How long' là hỏi về thời gian bao lâu.`},{text:`often`,correct:!1,explanation:`'How often' là hỏi về tần suất thường xuyên.`}]},{q:`How ___ pepper did you add into the beef soup? It tastes quite spicy. 🌶️`,a:[{text:`much`,correct:!0,explanation:`Đúng rồi! 'pepper' (hạt tiêu) là danh từ không đếm được nên dùng 'How much'.`},{text:`many`,correct:!1,explanation:`'many' chỉ dùng cho danh từ đếm được số nhiều.`},{text:`far`,correct:!1,explanation:`'How far' là hỏi khoảng cách bao xa.`},{text:`little`,correct:!1,explanation:`Không có cấu trúc hỏi lượng 'How little'.`}]},{q:`Cụm từ chỉ lượng: 'một nhúm muối nhỏ' thả vào nồi canh khi nấu ăn viết là: 🧂`,a:[{text:`a pinch of salt`,correct:!0,explanation:`Chính xác! 'a pinch of salt' là một nhúm muối nhỏ bằng đầu ngón tay.`},{text:`a bottle of salt`,correct:!1,explanation:`Một chai muối (không tự nhiên trong công thức nấu ăn).`},{text:`a slice of salt`,correct:!1,explanation:`Muối không dùng đơn vị lát mỏng 'slice'.`},{text:`a carton of salt`,correct:!1,explanation:`Không dùng hộp giấy 'carton' cho muối.`}]},{q:`Cụm từ chỉ lượng: 'một lát bánh mì gối mỏng' phết bơ ăn sáng là gì? 🍞`,a:[{text:`a slice of bread`,correct:!0,explanation:`Đúng rồi! Một lát mỏng bánh mì là 'a slice of bread'.`},{text:`a bar of bread`,correct:!1,explanation:`'bar' dùng cho thanh sô-cô-la hoặc bánh xà phòng.`},{text:`a cup of bread`,correct:!1,explanation:`'cup' dùng cho tách cà phê/trà.`},{text:`a bowl of bread`,correct:!1,explanation:`'bowl' dùng cho bát tô súp/cơm.`}]},{q:`Hộp giấy carton đựng một lít sữa tươi tiệt trùng trong siêu thị gọi là: 🥛📦`,a:[{text:`a carton of milk`,correct:!0,explanation:`Xuất sắc! Hộp giấy đựng sữa là 'a carton of milk'.`},{text:`a slice of milk`,correct:!1,explanation:`Sữa chất lỏng không dùng 'slice'.`},{text:`a pinch of milk`,correct:!1,explanation:`Không dùng 'pinch' cho sữa.`},{text:`a loaf of milk`,correct:!1,explanation:`'loaf' dùng cho ổ bánh mì dài.`}]},{q:`Can you give me ___ warm water, please? I am feeling very thirsty after running. 💧`,a:[{text:`some`,correct:!0,explanation:`Chính xác! Dùng 'some' trong câu yêu cầu / lời đề nghị lịch sự với danh từ không đếm được ('water').`},{text:`any`,correct:!1,explanation:`'any' thường dùng trong câu hỏi thông tin hoặc câu phủ định.`},{text:`a`,correct:!1,explanation:`'water' không đếm được nên không dùng mạo từ 'a'.`},{text:`many`,correct:!1,explanation:`'many' chỉ đi với danh từ đếm được số nhiều.`}]},{q:`Is there ___ butter left in the fridge? We need it to make chocolate cupcakes. 🧁`,a:[{text:`any`,correct:!0,explanation:`Đúng rồi! Trong câu hỏi nghi vấn kiểm tra sự tồn tại của danh từ không đếm được ('butter') ta dùng 'any'.`},{text:`many`,correct:!1,explanation:`'butter' không đếm được, không dùng 'many'.`},{text:`few`,correct:!1,explanation:`'few' đi với danh từ đếm được số nhiều.`},{text:`an`,correct:!1,explanation:`'butter' không đi với mạo từ 'an'.`}]},{q:`Odd one out: Chọn từ có phần phát âm nguyên âm là /ɔː/ dài (khác với âm /ɒ/ ngắn): pot, hot, sauce, bottle 🔊`,a:[{text:`sauce`,correct:!0,explanation:`Chính xác! 'sauce' phát âm là /sɔːs/ (âm /ɔː/ dài), trong khi pot, hot, bottle đều có âm /ɒ/ ngắn.`},{text:`pot`,correct:!1,explanation:`Có âm /ɒ/ ngắn.`},{text:`hot`,correct:!1,explanation:`Có âm /ɒ/ ngắn.`},{text:`bottle`,correct:!1,explanation:`Có âm /ɒ/ ngắn.`}]},{q:`Odd one out: Chọn món ăn ĐẶC SẢN NƯỚC NGOÀI, không thuộc ẩm thực truyền thống Việt Nam: 🍱`,a:[{text:`sushi`,correct:!0,explanation:`Đúng rồi! 'sushi' là món ăn truyền thống nổi tiếng của Nhật Bản, còn pho, banh chung, bun cha là của Việt Nam.`},{text:`pho bo`,correct:!1,explanation:`Phở bò truyền thống Việt Nam.`},{text:`banh chung`,correct:!1,explanation:`Bánh chưng ngày Tết Việt Nam.`},{text:`bun cha`,correct:!1,explanation:`Bún chả Hà Nội trứ danh.`}]},{q:`Sắp xếp chữ cái thành từ chỉ thành phần nguyên liệu nấu ăn: 'd - t - i - e - e - n - n - r - i - g' 🥕🧅`,a:[{text:`ingredient`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'ingredient' (nguyên liệu nấu ăn).`},{text:`ingredinet`,correct:!1,explanation:`Sai vị trí chữ e và n.`},{text:`ingredietn`,correct:!1,explanation:`Sai vị trí chữ t và n cuối từ.`},{text:`ingrendiet`,correct:!1,explanation:`Sai chính tả tiếng Anh.`}]},{q:`Viết lại câu không đổi nghĩa: 'There are only a few eggs left in the carton.' 🥚`,a:[{text:`There aren't many eggs left in the carton.`,correct:!0,explanation:`Chính xác! 'only a few' (chỉ còn một ít) tương đương với 'aren't many' (không còn nhiều).`},{text:`There are lots of eggs left in the carton.`,correct:!1,explanation:`Ngược hoàn toàn về số lượng.`},{text:`There is no egg left in the carton.`,correct:!1,explanation:`'only a few' nghĩa là vẫn còn một vài quả, không phải đã hết sạch.`},{text:`There aren't much eggs left in the carton.`,correct:!1,explanation:`Danh từ số nhiều 'eggs' phải đi với 'many', không đi với 'much'.`}]},{q:`Tìm lỗi sai trong câu sau: 'How many beef do we need to prepare for fifty guests tonight?' 🥩`,a:[{text:`many -> much`,correct:!0,explanation:`Đúng rồi! 'beef' (thịt bò) là danh từ không đếm được nên phải dùng 'How much beef', không dùng 'How many'.`},{text:`do we need -> we need do`,correct:!1,explanation:`Trợ động từ đứng trước chủ ngữ trong câu hỏi là đúng.`},{text:`fifty guests -> fifty guest`,correct:!1,explanation:`Sau số đếm 50 danh từ phải ở số nhiều.`},{text:`tonight -> last night`,correct:!1,explanation:`Ngữ cảnh chuẩn bị cho tối nay là hoàn toàn hợp lý.`}]},{q:`Món súp lươn Nghệ An thơm nồng ấm cay trong tiếng Anh gọi là: 🍲🌶️`,a:[{text:`eel soup`,correct:!0,explanation:`Chính xác! Con lươn là 'eel', món súp lươn là 'eel soup'.`},{text:`crab soup`,correct:!1,explanation:`'crab soup' là súp cua đồng.`},{text:`snake soup`,correct:!1,explanation:`'snake soup' là súp rắn.`},{text:`chicken soup`,correct:!1,explanation:`'chicken soup' là súp gà.`}]},{q:`Gia vị màu đen xay từ hạt tiêu có vị cay nồng rắc lên món trứng rán là: 🧂`,a:[{text:`black pepper`,correct:!0,explanation:`Đúng rồi! Hạt tiêu đen xay nhỏ là 'black pepper'.`},{text:`sugar`,correct:!1,explanation:`'sugar' là đường ngọt.`},{text:`flour`,correct:!1,explanation:`'flour' là bột mì trắng.`},{text:`oil`,correct:!1,explanation:`'oil' là dầu ăn rán.`}]},{q:`Pour a liter of mineral water into the pot and ___ it for ten minutes before adding noodles. 🍜`,a:[{text:`boil`,correct:!0,explanation:`Tuyệt vời! 'boil' là đun sôi nước sùng sục trên bếp.`},{text:`freeze`,correct:!1,explanation:`'freeze' là làm đông đá.`},{text:`burn`,correct:!1,explanation:`'burn' là làm cháy khét thức ăn.`},{text:`bake`,correct:!1,explanation:`'bake' là nướng bánh trong lò nướng.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'teaspoon / of / Add / a / sugar / lemonade / the / to / .' 🍋`,a:[{text:`Add a teaspoon of sugar to the lemonade.`,correct:!0,explanation:`Xuất sắc! Cấu trúc câu mệnh lệnh hướng dẫn công thức: Add a teaspoon of sugar to the lemonade.`},{text:`Add a sugar teaspoon of to the lemonade.`,correct:!1,explanation:`Cụm danh từ đo lường phải là 'a teaspoon of sugar'.`},{text:`To the lemonade add a teaspoon sugar of.`,correct:!1,explanation:`Sai vị trí giới từ 'of'.`},{text:`A teaspoon of sugar add to the lemonade.`,correct:!1,explanation:`Động từ 'Add' phải đứng đầu câu mệnh lệnh.`}]},{q:`What is the main ingredient of traditional Vietnamese fish sauce? 🐟`,a:[{text:`Fresh anchovies and sea salt.`,correct:!0,explanation:`Chính xác! Nước mắm truyền thống Việt Nam được ủ chượp từ cá cơm tươi ('anchovies') và muối biển nguyên chất.`},{text:`Beef bones and pork meat.`,correct:!1,explanation:`Xương bò và thịt lợn dùng nấu nước dùng phở.`},{text:`Soybeans and wheat flour.`,correct:!1,explanation:`Đậu nành và lúa mì dùng làm xì dầu / nước tương.`},{text:`Crushed chili and garlic only.`,correct:!1,explanation:`Chỉ có ớt và tỏi không làm nên nước mắm cốt.`}]},{q:`Trường đại học đầu tiên trong lịch sử Việt Nam được thành lập năm 1076 có tên là: 🏛️`,a:[{text:`Imperial Academy`,correct:!0,explanation:`Chính xác! Quốc Tử Giám - trường đại học đầu tiên của nước ta là 'Imperial Academy'.`},{text:`Temple of Literature`,correct:!1,explanation:`Văn Miếu thờ Khổng Tử được xây dựng năm 1070.`},{text:`Hanoi University`,correct:!1,explanation:`Đại học Hà Nội hiện đại.`},{text:`Quoc Hoc Hue`,correct:!1,explanation:`Trường Quốc học Huế thành lập năm 1896.`}]},{q:`Quần thể di tích Văn Miếu - Quốc Tử Giám ở thủ đô Hà Nội tiếng Anh là: ⛩️`,a:[{text:`Temple of Literature`,correct:!0,explanation:`Đúng rồi! Văn Miếu là 'Temple of Literature'.`},{text:`One Pillar Pagoda`,correct:!1,explanation:`Chùa Một Cột độc đáo.`},{text:`Tran Quoc Pagoda`,correct:!1,explanation:`Chùa Trấn Quốc cổ kính bên Hồ Tây.`},{text:`Ngoc Son Temple`,correct:!1,explanation:`Đền Ngọc Sơn trên đảo ngọc Hồ Gươm.`}]},{q:`Những tấm bia đá vinh danh tên tuổi của các vị tiến sĩ đỗ đạt thời xưa đặt trên lưng rùa đá là: 🐢📜`,a:[{text:`Doctors' stone tablets`,correct:!0,explanation:`Xuất sắc! Bia tiến sĩ khắc trên đá là 'Doctors' stone tablets'.`},{text:`Doctors' books`,correct:!1,explanation:`Sách của bác sĩ.`},{text:`Turtle shells`,correct:!1,explanation:`Mai rùa tự nhiên.`},{text:`Golden medals`,correct:!1,explanation:`Huy chương vàng thể thao.`}]},{q:`Khuê Văn Các - biểu tượng văn hóa ngàn năm văn hiến của thủ đô Hà Nội là: 🏛️✨`,a:[{text:`Khue Van Pavilion`,correct:!0,explanation:`Chính xác! Khuê Văn Các trong tiếng Anh gọi là 'Khue Van Pavilion'.`},{text:`Imperial Palace`,correct:!1,explanation:`Hoàng thành Thăng Long.`},{text:`Stone Bridge`,correct:!1,explanation:`Chiếc cầu đá cổ.`},{text:`Tower of Hanoi`,correct:!1,explanation:`Tháp Hà Nội.`}]},{q:`The Temple of Literature was founded ___ 1070 during the reign of Emperor Ly Thanh Tong. 👑 (Vào năm 1070)`,a:[{text:`in`,correct:!0,explanation:`Đúng rồi! Đi với một năm lịch sử (năm 1070) ta dùng giới từ 'in'.`},{text:`on`,correct:!1,explanation:`'on' đi với ngày cụ thể (on Monday, on October 10th).`},{text:`at`,correct:!1,explanation:`'at' đi với giờ cụ thể hoặc địa điểm nhỏ (at 8 a.m., at school).`},{text:`for`,correct:!1,explanation:`'for' chỉ khoảng thời gian kéo dài.`}]},{q:`Students usually gather in the school courtyard ___ Monday morning to attend the flag ceremony. 🇻🇳`,a:[{text:`on`,correct:!0,explanation:`Chính xác! Đi với buổi của một ngày cụ thể trong tuần ('Monday morning') ta dùng giới từ 'on'.`},{text:`in`,correct:!1,explanation:`Chỉ dùng 'in the morning' nói chung, nhưng có thứ 'Monday morning' phải dùng 'on'.`},{text:`at`,correct:!1,explanation:`Không dùng 'at Monday morning'.`},{text:`by`,correct:!1,explanation:`'by' là trước thời điểm nào.`}]},{q:`The grand graduation ceremony will take place ___ the Grand Hall tomorrow afternoon. 🎓`,a:[{text:`at`,correct:!0,explanation:`Đúng rồi! Địa điểm nơi chốn cụ thể trong khuôn viên trường dùng giới từ 'at the Grand Hall'.`},{text:`on`,correct:!1,explanation:`Không dùng 'on the Grand Hall'.`},{text:`to`,correct:!1,explanation:`Chỉ hướng chuyển động, sau 'take place' dùng giới từ chỉ địa điểm tĩnh.`},{text:`by`,correct:!1,explanation:`'by' là bên cạnh.`}]},{q:`Kỳ thi tuyển sinh đầu vào khắt khe tuyển chọn nhân tài thời xưa tiếng Anh là gì? 📝`,a:[{text:`entrance exam`,correct:!0,explanation:`Chính xác! Kỳ thi tuyển sinh đầu vào là 'entrance exam'.`},{text:`final test`,correct:!1,explanation:`Bài kiểm tra cuối kỳ học thông thường.`},{text:`pop quiz`,correct:!1,explanation:`Bài kiểm tra miệng 15 phút bất ngờ.`},{text:`oral exam`,correct:!1,explanation:`Bài thi vấn đáp bằng lời nói.`}]},{q:`Các bậc trí giả, nhà nho uyên bác đỗ đạt học vị cao trong xã hội xưa gọi là: 👨‍🎓`,a:[{text:`scholars`,correct:!0,explanation:`Đúng rồi! Các học giả uyên bác là 'scholars'.`},{text:`soldiers`,correct:!1,explanation:`'soldiers' là người lính canh phòng.`},{text:`sailors`,correct:!1,explanation:`'sailors' là thủy thủ đi tàu biển.`},{text:`merchants`,correct:!1,explanation:`'merchants' là thương gia buôn bán hàng hóa.`}]},{q:`Odd one out: Chọn từ có phụ âm phát âm là /dʒ/ (khác với âm /tʃ/): chair, teach, chocolate, jacket 🧥`,a:[{text:`jacket`,correct:!0,explanation:`Chính xác! 'jacket' bắt đầu bằng âm hữu thanh /dʒ/ /ˈdʒæk.ɪt/, trong khi chair, teach, chocolate đều phát âm là âm vô thanh /tʃ/.`},{text:`chair`,correct:!1,explanation:`Bắt đầu bằng âm /tʃ/.`},{text:`teach`,correct:!1,explanation:`Kết thúc bằng âm /tʃ/.`},{text:`chocolate`,correct:!1,explanation:`Bắt đầu bằng âm /tʃ/.`}]},{q:`Odd one out: Từ nào KHÔNG THUỘC khu di tích lịch sử Văn Miếu - Quốc Tử Giám? 🏰`,a:[{text:`Long Bien Bridge`,correct:!0,explanation:`Đúng rồi! Cầu Long Biên là cây cầu thép bắc qua sông Hồng, không nằm trong quần thể Văn Miếu.`},{text:`Doctors' stone tablets`,correct:!1,explanation:`82 tấm bia tiến sĩ bằng đá.`},{text:`Khue Van Pavilion`,correct:!1,explanation:`Gác Khuê Văn Các cổ kính.`},{text:`Well of Heavenly Clarity`,correct:!1,explanation:`Giếng Thiên Quang Tỉnh trong vắt.`}]},{q:`Sắp xếp chữ cái thành từ chỉ khoảng sân rộng lát gạch: 'y - a - d - c - t - r - u - o - r' 🏛️`,a:[{text:`courtyard`,correct:!0,explanation:`Xuất sắc! 'courtyard' là khoảng sân trong của dinh thự hoặc trường học cổ.`},{text:`courttayd`,correct:!1,explanation:`Sai vị trí chữ t và y.`},{text:`courtrayd`,correct:!1,explanation:`Sai chính tả tiếng Anh.`},{text:`curtyoard`,correct:!1,explanation:`Sai vị trí nguyên âm.`}]},{q:`Viết lại câu sử dụng thể bị động: 'Emperor Ly Nhan Tong established the Imperial Academy in 1076.' 📜`,a:[{text:`The Imperial Academy was established in 1076 by Emperor Ly Nhan Tong.`,correct:!0,explanation:`Chính xác! Thể bị động thì quá khứ đơn: 'S + was/were + V3/ed + by O'.`},{text:`The Imperial Academy is established in 1076 by Emperor Ly Nhan Tong.`,correct:!1,explanation:`Sai thì hiện tại 'is' với năm 1076.`},{text:`The Imperial Academy has been established in 1076.`,correct:!1,explanation:`Không dùng hiện tại hoàn thành với mốc năm quá khứ xác định.`},{text:`Emperor Ly Nhan Tong was established the Imperial Academy.`,correct:!1,explanation:`Vua không bị thành lập.`}]},{q:`Tìm lỗi sai trong câu sau: 'There are eighty-two Doctors' stone tablet placed on the backs of tortoises.' 🐢`,a:[{text:`tablet -> tablets`,correct:!0,explanation:`Đúng rồi! Có 82 tấm bia (eighty-two) nên danh từ phải ở số nhiều: 'stone tablets'.`},{text:`eighty-two -> eighty-second`,correct:!1,explanation:`Đếm số lượng dùng số đếm 'eighty-two' là đúng.`},{text:`placed on -> placed in`,correct:!1,explanation:`Đặt trên lưng rùa đá dùng 'placed on' là chuẩn.`},{text:`tortoises -> tortoise`,correct:!1,explanation:`Nhiều con rùa đá là số nhiều.`}]},{q:`Giếng Thiên Quang trong vắt soi bóng gác Khuê Văn tiếng Anh gọi là: 💧`,a:[{text:`Well of Heavenly Clarity`,correct:!0,explanation:`Tuyệt vời! 'Well of Heavenly Clarity' là tên gọi tiếng Anh của Giếng Thiên Quang.`},{text:`Sword Lake`,correct:!1,explanation:`Hồ Hoàn Kiếm / Hồ Gươm.`},{text:`West Lake`,correct:!1,explanation:`Hồ Tây mênh mông.`},{text:`Red River`,correct:!1,explanation:`Dòng sông Hồng phù sa.`}]},{q:`Ngôi trường trung học lâu đời và danh tiếng bậc nhất miền Trung thành lập năm 1896 là: 🏫`,a:[{text:`Quoc Hoc Hue High School`,correct:!0,explanation:`Chính xác! Trường THPT Chuyên Quốc học Huế là ngôi trường trăm năm lịch sử nổi tiếng.`},{text:`Chu Van An High School`,correct:!1,explanation:`Trường Bưởi - Chu Văn An nằm ở Hà Nội.`},{text:`Le Hong Phong High School`,correct:!1,explanation:`Trường Lê Hồng Phong nằm ở TP. Hồ Chí Minh.`},{text:`Phan Chau Trinh School`,correct:!1,explanation:`Trường nằm ở Đà Nẵng.`}]},{q:`Before major exams, many Vietnamese students visit the Temple of Literature to wish for ___. 🍀`,a:[{text:`good luck`,correct:!0,explanation:`Đúng rồi! Các sĩ tử thường đến Văn Miếu thắp hương cầu may mắn đỗ đạt ('wish for good luck').`},{text:`bad luck`,correct:!1,explanation:`Cầu điều rủi ro xui xẻo là sai.`},{text:`high money`,correct:!1,explanation:`Không nói 'high money'.`},{text:`fast food`,correct:!1,explanation:`Cầu đồ ăn nhanh là sai ý nghĩa.`}]},{q:`Chu Van An was considered one of the most dedicated and respected ___ in Vietnamese history. 👨‍🏫`,a:[{text:`teachers`,correct:!0,explanation:`Chính xác! Thầy giáo Chu Văn An là người thầy mẫu mực, tận tụy được muôn đời tôn kính.`},{text:`merchants`,correct:!1,explanation:`'merchants' là lái buôn.`},{text:`sailors`,correct:!1,explanation:`'sailors' là thủy thủ.`},{text:`farmers`,correct:!1,explanation:`'farmers' là người làm nông.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'built / Literature / 1070 / was / Temple / in / of / The / .' ⛩️`,a:[{text:`The Temple of Literature was built in 1070.`,correct:!0,explanation:`Xuất sắc! Cấu trúc câu bị động lịch sử: The Temple of Literature + was built + in 1070.`},{text:`The Temple was built of Literature in 1070.`,correct:!1,explanation:`Cụm danh từ 'The Temple of Literature' không được tách rời.`},{text:`In 1070 the Temple was built of Literature.`,correct:!1,explanation:`Sai cụm danh từ.`},{text:`Was built the Temple of Literature in 1070.`,correct:!1,explanation:`Đây không phải câu hỏi đảo ngữ.`}]},{q:`UNESCO recognised the 82 Doctors' stone tablets in Hanoi as a World Documentary Heritage in which year? 📜`,a:[{text:`2010`,correct:!0,explanation:`Chính xác! Năm 2010, 82 bia đá tiến sĩ tại Văn Miếu đã được UNESCO chính thức công nhận là Di sản tư liệu thế giới.`},{text:`1990`,correct:!1,explanation:`Năm 1990 chưa được công nhận.`},{text:`2000`,correct:!1,explanation:`Năm 2000 chưa có quyết định.`},{text:`2020`,correct:!1,explanation:`Năm 2020 là sau đó 10 năm.`}]},{q:`___ is about two kilometers from my family's house to my secondary school. 🛣️`,a:[{text:`It`,correct:!0,explanation:`Chính xác! Dùng đại từ 'It' làm chủ ngữ giả để chỉ khoảng cách: 'It is about + khoảng cách + from A to B'.`},{text:`There`,correct:!1,explanation:`'There' dùng để chỉ sự tồn tại (There is/are), không chỉ khoảng cách đo lường.`},{text:`This`,correct:!1,explanation:`Không dùng 'This is about 2 km from...'.`},{text:`That`,correct:!1,explanation:`Không dùng 'That' làm chủ ngữ giả chỉ cự ly.`}]},{q:`Vạch sơn trắng kẻ ngang đường dành riêng cho người đi bộ sang đường an toàn gọi là gì? 🦓🚶`,a:[{text:`zebra crossing`,correct:!0,explanation:`Đúng rồi! Vạch sang đường cho người đi bộ là 'zebra crossing'.`},{text:`cycle lane`,correct:!1,explanation:`'cycle lane' là làn đường dành cho xe đạp.`},{text:`pavement`,correct:!1,explanation:`'pavement' là vỉa hè dành cho người đi dạo bộ.`},{text:`railway`,correct:!1,explanation:`'railway' là đường ray tàu hỏa.`}]},{q:`Chiếc mũ bảo hiểm bắt buộc phải đội khi điều khiển xe máy và xe đạp điện trên đường là: 🪖`,a:[{text:`helmet`,correct:!0,explanation:`Xuất sắc! Mũ bảo hiểm là 'helmet'.`},{text:`hat`,correct:!1,explanation:`'hat' là mũ nan / mũ vành che nắng.`},{text:`cap`,correct:!1,explanation:`'cap' là mũ lưỡi trai thời trang.`},{text:`seatbelt`,correct:!1,explanation:`'seatbelt' là dây đai an toàn thắt trên ô tô.`}]},{q:`Dây đai an toàn người ngồi trên xe ô tô và máy bay bắt buộc phải thắt chặt là: 🚗💺`,a:[{text:`seatbelt`,correct:!0,explanation:`Chính xác! Dây an toàn là 'seatbelt'.`},{text:`helmet`,correct:!1,explanation:`'helmet' là mũ bảo hiểm đội đầu.`},{text:`handbag`,correct:!1,explanation:`'handbag' là túi xách tay đựng ví.`},{text:`tie`,correct:!1,explanation:`'tie' là chiếc cà vạt thắt cổ áo.`}]},{q:`My father ___ ride a bicycle to work when he was young, but now he drives a car. 🚲🚗`,a:[{text:`used to`,correct:!0,explanation:`Đúng rồi! Cấu trúc 'used to + V-inf' diễn tả một thói quen hoặc tình trạng đã từng diễn ra trong quá khứ nhưng nay không còn nữa.`},{text:`is used to`,correct:!1,explanation:`Sau 'is used to' phải là V-ing (quen với việc gì ở hiện tại).`},{text:`uses to`,correct:!1,explanation:`Không có cấu trúc hiện tại 'uses to + V'.`},{text:`get used to`,correct:!1,explanation:`Mang nghĩa 'dần quen với việc gì', đi với V-ing.`}]},{q:`Did your uncle ___ travel on foot across the village when there were no concrete roads? 🚶‍♂️`,a:[{text:`use to`,correct:!0,explanation:`Chính xác! Trong câu hỏi quá khứ với trợ động từ 'Did', cấu trúc 'used to' bỏ 'd' trở về nguyên thể 'use to'.`},{text:`used to`,correct:!1,explanation:`Đã có trợ động từ 'Did' thì không để đuôi 'd' ở 'used'.`},{text:`using to`,correct:!1,explanation:`Sai ngữ pháp.`},{text:`uses to`,correct:!1,explanation:`Sai thì và cấu trúc.`}]},{q:`You ___ obey all traffic signs and stop immediately when the traffic lights turn red! 🚦`,a:[{text:`must`,correct:!0,explanation:`Đúng rồi! Động từ khuyết thiếu 'must' bắt buộc người tham gia giao thông phải tuân thủ luật lệ.`},{text:`mustn't`,correct:!1,explanation:`'mustn't' là cấm tuân thủ (sai).`},{text:`needn't`,correct:!1,explanation:`'needn't' là không cần tuân thủ (sai luật).`},{text:`can't`,correct:!1,explanation:`'can't' là không thể.`}]},{q:`Khung giờ cao điểm buổi sáng và chiều muộn khi xe cộ đông đúc kẹt cứng trên phố gọi là: 🚗🛵🚚`,a:[{text:`rush hour`,correct:!0,explanation:`Chính xác! Giờ cao điểm giao thông là 'rush hour'.`},{text:`free time`,correct:!1,explanation:`'free time' là thời gian rảnh rỗi.`},{text:`night time`,correct:!1,explanation:`'night time' là ban đêm thanh vắng.`},{text:`lunch hour`,correct:!1,explanation:`'lunch hour' là giờ nghỉ trưa ăn cơm.`}]},{q:`Hiện tượng hàng ngàn phương tiện xe máy, ô tô ùn ứ kẹt cứng không thể nhích bước gọi là: 🛑`,a:[{text:`traffic jam`,correct:!0,explanation:`Đúng rồi! Tắc đường / kẹt xe là 'traffic jam' (hoặc 'traffic congestion').`},{text:`traffic light`,correct:!1,explanation:`'traffic light' là cột đèn tín hiệu xanh đỏ vàng.`},{text:`traffic sign`,correct:!1,explanation:`'traffic sign' là biển báo chỉ dẫn trên đường.`},{text:`traffic rule`,correct:!1,explanation:`'traffic rule' là luật lệ giao thông đường bộ.`}]},{q:`Odd one out: Chọn từ có phần nguyên âm phát âm là /aɪ/ (khác với âm /eɪ/): sign, ride, bike, pavement 🚲`,a:[{text:`pavement`,correct:!0,explanation:`Chính xác! 'pavement' phát âm nguyên âm đầu là /eɪ/ /ˈpeɪv.mənt/, trong khi sign, ride, bike đều có âm /aɪ/.`},{text:`sign`,correct:!1,explanation:`Có âm /aɪ/.`},{text:`ride`,correct:!1,explanation:`Có âm /aɪ/.`},{text:`bike`,correct:!1,explanation:`Có âm /aɪ/.`}]},{q:`Odd one out: Từ nào chỉ HÀNH VI VI PHẠM LUẬT GIAO THÔNG? ⚠️`,a:[{text:`speeding`,correct:!0,explanation:`Đúng rồi! 'speeding' (chạy xe quá tốc độ quy định) là hành vi vi phạm pháp luật nguy hiểm, còn fastening seatbelt, stopping at red light, walking on pavement là đúng luật.`},{text:`fastening seatbelt`,correct:!1,explanation:`Thắt dây an toàn đúng luật.`},{text:`stopping at red light`,correct:!1,explanation:`Dừng đèn đỏ đúng quy định.`},{text:`walking on pavement`,correct:!1,explanation:`Đi bộ trên vỉa hè an toàn.`}]},{q:`Sắp xếp chữ cái thành từ chỉ người đi bộ tham gia giao thông: 'e - n - d - i - p - e - t - r - s - a' 🚶`,a:[{text:`pedestrian`,correct:!0,explanation:`Xuất sắc! 'pedestrian' là người đi bộ trên đường.`},{text:`pedestiran`,correct:!1,explanation:`Sai vị trí chữ a và i.`},{text:`pedestrain`,correct:!1,explanation:`Sai chính tả chữ r-a-i-n.`},{text:`predestrian`,correct:!1,explanation:`Thừa chữ r ở đầu.`}]},{q:`Viết lại câu sử dụng 'used to': 'My father no longer smokes cigarettes.' 🚭`,a:[{text:`My father used to smoke cigarettes.`,correct:!0,explanation:`Chính xác! 'S + no longer + V' (không còn làm gì nữa) viết lại thành 'S + used to + V-inf'.`},{text:`My father used to smoking cigarettes.`,correct:!1,explanation:`Sau 'used to' chỉ quá khứ dùng động từ nguyên thể 'smoke', không dùng V-ing.`},{text:`My father is used to smoke cigarettes.`,correct:!1,explanation:`Sai cấu trúc.`},{text:`My father didn't use to smoke cigarettes.`,correct:!1,explanation:`Ngược nghĩa: trước đây không hút thuốc.`}]},{q:`Tìm lỗi sai trong câu sau: 'How far is it from your home to school? - It is about two hours by bus.' 🚌`,a:[{text:`two hours -> two kilometres`,correct:!0,explanation:`Đúng rồi! Câu hỏi 'How far' hỏi về khoảng cách cự ly (kilomet, mét) chứ không hỏi về thời gian bao lâu ('two hours' là trả lời cho How long).`},{text:`How far -> How long`,correct:!1,explanation:`Đề bài hỏi cự ly khoảng cách là đúng.`},{text:`is it -> it is`,correct:!1,explanation:`Đảo ngữ trong câu hỏi là chuẩn.`},{text:`by bus -> on bus`,correct:!1,explanation:`Đi bằng xe buýt dùng 'by bus' là chính xác.`}]},{q:`Giấy phép lái xe hợp pháp cấp cho người đủ tuổi điều khiển phương tiện là gì? 🪪`,a:[{text:`driving licence`,correct:!0,explanation:`Chính xác! Bằng lái xe là 'driving licence' (hoặc 'driver's license').`},{text:`identity card`,correct:!1,explanation:`'identity card' là căn cước công dân.`},{text:`student card`,correct:!1,explanation:`'student card' là thẻ học sinh.`},{text:`passport`,correct:!1,explanation:`'passport' là cuốn hộ chiếu xuất cảnh.`}]},{q:`Biển báo hình tròn viền đỏ, nền trắng hoặc xanh thường là loại biển báo gì? ⭕`,a:[{text:`Prohibitive road sign`,correct:!0,explanation:`Đúng rồi! Biển tròn viền đỏ là biển báo cấm (Prohibitive sign).`},{text:`Warning sign`,correct:!1,explanation:`Biển báo nguy hiểm hình tam giác viền đỏ nền vàng.`},{text:`Information sign`,correct:!1,explanation:`Biển chỉ dẫn hình vuông hoặc chữ nhật nền xanh.`},{text:`Commercial sign`,correct:!1,explanation:`Biển quảng cáo thương mại.`}]},{q:`Cycling on the pavement is ___ because the pavement is reserved only for pedestrians. 🚫`,a:[{text:`illegal`,correct:!0,explanation:`Chính xác! 'illegal' nghĩa là trái luật, không hợp pháp.`},{text:`legal`,correct:!1,explanation:`'legal' là hợp pháp đúng luật.`},{text:`safe`,correct:!1,explanation:`'safe' là an toàn.`},{text:`convenient`,correct:!1,explanation:`'convenient' là thuận tiện.`}]},{q:`Children under the age of sixteen ___ drive motorbikes with engine size over 50cc. 🛵`,a:[{text:`mustn't`,correct:!0,explanation:`Đúng rồi! Học sinh dưới 16 tuổi tuyệt đối không được phép lái xe máy phân khối lớn: 'mustn't drive'.`},{text:`must`,correct:!1,explanation:`Bắt buộc lái là phạm luật nghiêm trọng.`},{text:`can`,correct:!1,explanation:`Có thể lái là vi phạm pháp luật.`},{text:`should`,correct:!1,explanation:`Chỉ khuyên nhẹ là không đủ tính cưỡng chế pháp lý.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'careful / You / road / should / be / crossing / when / the / .' 🚸`,a:[{text:`You should be careful when crossing the road.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: You should be careful (Bạn nên cẩn thận) + when crossing the road (khi qua đường).`},{text:`You should careful be when crossing the road.`,correct:!1,explanation:`Tính từ 'careful' phải đứng sau to be 'be'.`},{text:`When crossing the road you careful should be.`,correct:!1,explanation:`Sai trật tự vị ngữ.`},{text:`You be should careful when crossing the road.`,correct:!1,explanation:`Động từ khiếm khuyết 'should' phải đứng trước 'be'.`}]},{q:`What should a driver do when seeing an amber (yellow) traffic light blinking? 🟡`,a:[{text:`Slow down and prepare to stop before the white line.`,correct:!0,explanation:`Chính xác! Khi thấy đèn vàng, người lái xe phải giảm tốc độ và chuẩn bị dừng trước vạch trắng.`},{text:`Speed up as fast as possible to pass through.`,correct:!1,explanation:`Tăng ga phóng nhanh vượt đèn vàng là rất nguy hiểm.`},{text:`Turn off the engine immediately in the middle of the road.`,correct:!1,explanation:`Tắt máy giữa đường gây tai nạn liên hoàn.`},{text:`Sound the horn loudly and close eyes.`,correct:!1,explanation:`Bấm còi inh ỏi và nhắm mắt là hành vi ngớ ngẩn.`}]},{q:`Nhà phê bình điện ảnh chuyên xem và viết bài đánh giá chất lượng các bộ phim chiếu rạp là: 🖋️🎬`,a:[{text:`film critic`,correct:!0,explanation:`Chính xác! Nhà phê bình phim là 'film critic'.`},{text:`audience`,correct:!1,explanation:`'audience' là khán giả xem phim.`},{text:`director`,correct:!1,explanation:`'director' là đạo diễn chỉ đạo quay phim.`},{text:`producer`,correct:!1,explanation:`'producer' là nhà sản xuất đầu tư vốn.`}]},{q:`Thể loại phim viễn tưởng khám phá vũ trụ, du hành thời gian và người ngoài hành tinh gọi là: 🚀👽`,a:[{text:`science fiction film`,correct:!0,explanation:`Đúng rồi! Phim khoa học viễn tưởng viết tắt là 'sci-fi' hoặc 'science fiction film'.`},{text:`horror film`,correct:!1,explanation:`'horror film' là phim kinh dị rùng rợn dọa ma.`},{text:`documentary`,correct:!1,explanation:`'documentary' là phim tài liệu thực tế.`},{text:`romantic comedy`,correct:!1,explanation:`'romantic comedy' là phim hài tình cảm lãng mạn.`}]},{q:`Hiệu ứng hình ảnh kỹ xảo 3D mãn nhãn tạo ra các vụ nổ và quái vật trong phim bom tấn là: 💥🦖`,a:[{text:`visual effects`,correct:!0,explanation:`Xuất sắc! Kỹ xảo hình ảnh là 'visual effects' (viết tắt là VFX).`},{text:`soundtrack`,correct:!1,explanation:`'soundtrack' là nhạc nền trong phim.`},{text:`costume`,correct:!1,explanation:`'costume' là trang phục của diễn viên.`},{text:`script`,correct:!1,explanation:`'script' là kịch bản lời thoại của bộ phim.`}]},{q:`___ the acting was outstanding, the film's ending was quite disappointing. 🎭 (Mặc dù)`,a:[{text:`Although`,correct:!0,explanation:`Chính xác! 'Although + mệnh đề' (chủ ngữ 'the acting' + vị ngữ 'was outstanding') diễn tả sự tương phản.`},{text:`Despite`,correct:!1,explanation:`Sau 'Despite' bắt buộc dùng danh từ / cụm danh từ / V-ing, không dùng mệnh đề có động từ chia 'was'.`},{text:`In spite of`,correct:!1,explanation:`Sau 'In spite of' dùng cụm danh từ, không dùng mệnh đề.`},{text:`However`,correct:!1,explanation:`'However' thường đứng đầu câu sau dấu chấm và ngăn cách bởi dấu phẩy.`}]},{q:`___ the heavy rain, all tickets for the premiere of the new superhero film were sold out. 🌧️🎟️`,a:[{text:`Despite`,correct:!0,explanation:`Đúng rồi! 'the heavy rain' là cụm danh từ nên phải dùng giới từ chỉ sự tương phản 'Despite' (hoặc 'In spite of').`},{text:`Although`,correct:!1,explanation:`Sau 'Although' phải là một mệnh đề hoàn chỉnh (S + V).`},{text:`Even though`,correct:!1,explanation:`Sau 'Even though' phải là một mệnh đề hoàn chỉnh.`},{text:`Though`,correct:!1,explanation:`Sau 'Though' cần một mệnh đề.`}]},{q:`The documentary about deep ocean creatures was so ___ that all students watched it attentively. 🐙`,a:[{text:`fascinating`,correct:!0,explanation:`Chính xác! Miêu tả tính chất hấp dẫn lôi cuốn của một bộ phim tài liệu dùng tính từ đuôi -ing: 'fascinating'.`},{text:`fascinated`,correct:!1,explanation:`'fascinated' mang đuôi -ed miêu tả cảm xúc của con người (bị cuốn hút).`},{text:`fascinate`,correct:!1,explanation:`Động từ nguyên thể.`},{text:`fascination`,correct:!1,explanation:`Danh từ chỉ sự quyến rũ.`}]},{q:`I felt completely ___ because the plot of the action film was too predictable and slow. 🥱`,a:[{text:`bored`,correct:!0,explanation:`Đúng rồi! Miêu tả cảm xúc buồn chán của con người ('I felt...') ta dùng tính từ đuôi -ed: 'bored'.`},{text:`boring`,correct:!1,explanation:`'boring' dùng miêu tả bản chất của sự vật/bộ phim gây chán ngắt.`},{text:`bore`,correct:!1,explanation:`Động từ nguyên thể.`},{text:`boredom`,correct:!1,explanation:`Danh từ sự buồn chán.`}]},{q:`The main actor gave an incredible performance. ___, the film received poor reviews from critics. 👎`,a:[{text:`However`,correct:!0,explanation:`Chính xác! 'However' (Tuy nhiên) đứng đầu câu thứ hai sau dấu chấm và trước dấu phẩy để liên kết hai ý tương phản.`},{text:`Although`,correct:!1,explanation:`'Although' không đứng độc lập trước dấu phẩy như 'However'.`},{text:`Despite`,correct:!1,explanation:`Không dùng 'Despite' đứng độc lập trước dấu phẩy.`},{text:`Because`,correct:!1,explanation:`Ý câu mang tính tương phản chứ không phải nguyên nhân.`}]},{q:`Odd one out: Chọn từ có nguyên âm đôi phát âm là /ɪə/ (khác với âm /eə/): hear, clear, cheer, square 🏙️`,a:[{text:`square`,correct:!0,explanation:`Chính xác! 'square' phát âm là /skweər/ (âm /eə/), trong khi hear, clear, cheer đều có âm /ɪə/.`},{text:`hear`,correct:!1,explanation:`Có âm /ɪə/.`},{text:`clear`,correct:!1,explanation:`Có âm /ɪə/.`},{text:`cheer`,correct:!1,explanation:`Có âm /ɪə/.`}]},{q:`Odd one out: Từ nào chỉ THÀNH PHẦN SẢN XUẤT PHIM, không phải tên thể loại phim? 🎬`,a:[{text:`director`,correct:!0,explanation:`Đúng rồi! 'director' (đạo diễn) là con người làm phim, còn comedy, horror, documentary là các thể loại phim.`},{text:`comedy`,correct:!1,explanation:`'comedy' là phim hài kịch.`},{text:`horror`,correct:!1,explanation:`'horror' là phim kinh dị.`},{text:`documentary`,correct:!1,explanation:`'documentary' là phim tài liệu.`}]},{q:`Sắp xếp chữ cái thành từ chỉ nhạc nền chủ đề của bộ phim: 'c - u - d - o - k - n - a - t - r - s' 🎵`,a:[{text:`soundtrack`,correct:!0,explanation:`Xuất sắc! 'soundtrack' là bản nhạc nền của bộ phim.`},{text:`soundtrakc`,correct:!1,explanation:`Sai vị trí chữ c và k.`},{text:`soudntrack`,correct:!1,explanation:`Sai vị trí chữ d và n.`},{text:`soundtrck`,correct:!1,explanation:`Thiếu chữ a.`}]},{q:`Viết lại câu chuyển đổi giữa Although và Despite: 'Although he had a high fever, he attended the film premiere.' 🤒🎬`,a:[{text:`Despite having a high fever, he attended the film premiere.`,correct:!0,explanation:`Chính xác! Khi hai mệnh đề có cùng chủ ngữ 'he', mệnh đề 'Although S + V' chuyển thành 'Despite + V-ing' ('Despite having...').`},{text:`Despite he had a high fever, he attended the film premiere.`,correct:!1,explanation:`Sau 'Despite' không dùng mệnh đề S + V.`},{text:`Although having a high fever, he attended the premiere.`,correct:!1,explanation:`Cấu trúc chuẩn là 'Despite V-ing'.`},{text:`In spite of he had a high fever, he attended the premiere.`,correct:!1,explanation:`Sau 'In spite of' không dùng mệnh đề.`}]},{q:`Tìm lỗi sai trong câu sau: 'Despite of spending millions of dollars, the disaster film was a total flop.' 🌊`,a:[{text:`Despite of -> Despite`,correct:!0,explanation:`Đúng rồi! 'Despite' không đi với 'of' (chỉ có 'In spite of' mới có 'of').`},{text:`spending -> spent`,correct:!1,explanation:`Sau giới từ dùng V-ing là hoàn toàn chính xác.`},{text:`disaster film -> film disaster`,correct:!1,explanation:`Tính từ bổ nghĩa đứng trước danh từ là đúng.`},{text:`total flop -> flop total`,correct:!1,explanation:`Tính từ đứng trước danh từ là chuẩn.`}]},{q:`Bộ phim thảm họa thiên nhiên (động đất, sóng thần, thiên thạch va chạm) tiếng Anh là: 🌋🌊`,a:[{text:`disaster film`,correct:!0,explanation:`Chính xác! Phim thảm họa là 'disaster film'.`},{text:`comedy`,correct:!1,explanation:`Phim hài vui nhộn.`},{text:`cartoon`,correct:!1,explanation:`Phim hoạt hình vẽ tay.`},{text:`musical`,correct:!1,explanation:`Phim ca vũ nhạc kịch.`}]},{q:`The plot of the detective movie had a shocking twist at the end that ___ everyone in the cinema. 😱`,a:[{text:`shocked`,correct:!0,explanation:`Đúng rồi! Cú ngoặt bất ngờ đã làm cho mọi người sửng sốt: động từ quá khứ 'shocked everyone'.`},{text:`shocking`,correct:!1,explanation:`Tính từ đuôi -ing không làm vị ngữ chính cho 'twist'.`},{text:`shock`,correct:!1,explanation:`Động từ nguyên thể không phù hợp thì quá khứ của 'had'.`},{text:`shocks`,correct:!1,explanation:`Dạng hiện tại đơn ngôi 3.`}]},{q:`Tác phẩm điện ảnh thành công vang dội phá kỷ lục doanh thu phòng vé gọi là phim: 💰🍿`,a:[{text:`blockbuster`,correct:!0,explanation:`Tuyệt vời! Phim bom tấn ăn khách nhất phòng vé là 'blockbuster'.`},{text:`flop`,correct:!1,explanation:`'flop' là tác phẩm thất bại thảm hại thua lỗ.`},{text:`trailer`,correct:!1,explanation:`'trailer' là đoạn video ngắn giới thiệu phim sắp chiếu.`},{text:`poster`,correct:!1,explanation:`'poster' là bức tranh áp phích quảng bá.`}]},{q:`Tom Hanks is an Oscar-winning actor who ___ in many world-famous classic films. 🌟`,a:[{text:`starred`,correct:!0,explanation:`Chính xác! Động từ 'star' mang nghĩa là đóng vai chính, đóng vai ngôi sao trong một bộ phim.`},{text:`watched`,correct:!1,explanation:`'watch' là ngồi xem phim.`},{text:`sold`,correct:!1,explanation:`'sell' là bán vé.`},{text:`bought`,correct:!1,explanation:`'buy' là mua phim.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'was / surprised / I / at / the / violent / scenes / .' 💥`,a:[{text:`I was surprised at the violent scenes.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (I) + was surprised at (bị bất ngờ trước) + the violent scenes (những cảnh bạo lực).`},{text:`I was at the violent scenes surprised.`,correct:!1,explanation:`Tính từ 'surprised' phải đi liền giới từ 'at'.`},{text:`Surprised I was at the violent scenes.`,correct:!1,explanation:`Sai trật tự chủ ngữ vị ngữ.`},{text:`The violent scenes was surprised at I.`,correct:!1,explanation:`Sai hoàn toàn logic ngữ pháp.`}]},{q:`A short video clip that advertises and gives previews of an upcoming movie is called a: 🎞️`,a:[{text:`trailer`,correct:!0,explanation:`Chính xác! Đoạn giới thiệu phim sắp ra rạp là 'trailer'.`},{text:`poster`,correct:!1,explanation:`'poster' là tấm áp phích ảnh tĩnh.`},{text:`script`,correct:!1,explanation:`'script' là cuốn kịch bản bằng chữ.`},{text:`review`,correct:!1,explanation:`'review' là bài viết nhận xét đánh giá.`}]},{q:`Why do many people enjoy watching animated movies even when they grow up? 👧👵`,a:[{text:`Because of their heartwarming messages and delightful humor.`,correct:!0,explanation:`Chính xác! Vì thông điệp ấm áp lay động lòng người và tiếng cười tươi vui hồn nhiên của phim hoạt hình.`},{text:`Because they contain too much graphic violence.`,correct:!1,explanation:`Phim hoạt hình không chứa bạo lực man rợ.`},{text:`Because they are very boring and long.`,correct:!1,explanation:`Nhàm chán không phải lý do thu hút người xem.`},{text:`Because tickets are always completely free.`,correct:!1,explanation:`Vé xem phim hoạt hình vẫn phải mua bình thường.`}]},{q:`Lễ hội ném cà chua chín đỏ rực rỡ vui nhộn tại thị trấn Buñol của đất nước Tây Ban Nha là gì? 🍅🇪🇸`,a:[{text:`La Tomatina`,correct:!0,explanation:`Chính xác! Lễ hội ném cà chua nổi tiếng thế giới là 'La Tomatina'.`},{text:`Carnival`,correct:!1,explanation:`Lễ hội hóa trang đường phố lớn ở Brazil.`},{text:`Halloween`,correct:!1,explanation:`Lễ hội hóa trang ma quỷ đêm 31/10.`},{text:`Diwali`,correct:!1,explanation:`Lễ hội ánh sáng lung linh của Ấn Độ.`}]},{q:`Lễ hội Tạ ơn của người dân Bắc Mỹ vào tháng 11 có món ăn truyền thống không thể thiếu là gì? 🦃🥧`,a:[{text:`Roast turkey and pumpkin pie`,correct:!0,explanation:`Đúng rồi! Gà tây quay ('roast turkey') và bánh bí ngô ('pumpkin pie') là món ăn biểu tượng của Lễ Tạ ơn (Thanksgiving).`},{text:`Pizza and hamburgers`,correct:!1,explanation:`Đồ ăn nhanh thường ngày.`},{text:`Fish and chips`,correct:!1,explanation:`Món ăn đường phố của Anh.`},{text:`Banh chung and spring rolls`,correct:!1,explanation:`Món ăn Tết cổ truyền Việt Nam.`}]},{q:`Lễ hội hóa trang đường phố sôi động nhất hành tinh với những vũ điệu Samba bốc lửa tổ chức ở đâu? 💃🇧🇷`,a:[{text:`Rio de Janeiro, Brazil`,correct:!0,explanation:`Xuất sắc! Lễ hội Carnival ở thành phố Rio de Janeiro, Brazil là ngày hội hóa trang hoành tráng nhất thế giới.`},{text:`Tokyo, Japan`,correct:!1,explanation:`Tokyo có lễ hội hoa anh đào Hanami.`},{text:`Paris, France`,correct:!1,explanation:`Paris là kinh đô ánh sáng Pháp.`},{text:`Sydney, Australia`,correct:!1,explanation:`Sydney có lễ hội ánh sáng Vivid Sydney.`}]},{q:`Quả bí ngô khoét rỗng khắc hình khuôn mặt ma quái cắm nến bên trong đêm Halloween gọi là: 🎃`,a:[{text:`Jack-o'-lantern`,correct:!0,explanation:`Chính xác! Đèn lồng bí ngô ma quái là 'Jack-o'-lantern'.`},{text:`Lantern`,correct:!1,explanation:`Đèn lồng trung thu thông thường.`},{text:`Candlelight`,correct:!1,explanation:`Ánh sáng ngọn nến le lói.`},{text:`Flashlight`,correct:!1,explanation:`Chiếc đèn pin cầm tay.`}]},{q:`___ do people celebrate Thanksgiving in the United States? - On the fourth Thursday of November. 📅`,a:[{text:`When`,correct:!0,explanation:`Đúng rồi! Câu trả lời chỉ mốc thời gian 'fourth Thursday of November' nên dùng từ để hỏi 'When'.`},{text:`Where`,correct:!1,explanation:`Hỏi địa điểm nơi chốn.`},{text:`Why`,correct:!1,explanation:`Hỏi nguyên nhân lý do.`},{text:`Who`,correct:!1,explanation:`Hỏi con người ai đó.`}]},{q:`___ is the Mid-Autumn Festival celebrated? - To celebrate the autumn harvest and family reunion. 🥮🌕`,a:[{text:`Why`,correct:!0,explanation:`Chính xác! Câu trả lời bắt đầu bằng 'To celebrate...' (chỉ mục đích / lý do) nên câu hỏi dùng 'Why'.`},{text:`What`,correct:!1,explanation:`Hỏi đối tượng gì.`},{text:`How far`,correct:!1,explanation:`Hỏi khoảng cách bao xa.`},{text:`Which`,correct:!1,explanation:`Hỏi lựa chọn nào trong số các đối tượng.`}]},{q:`Did you wear a spooky ghost costume to the school Halloween party last night? 👻 (Có, tôi đã mặc)`,a:[{text:`Yes, I did.`,correct:!0,explanation:`Đúng rồi! Câu hỏi quá khứ đơn bắt đầu bằng 'Did you...?' trả lời khẳng định là 'Yes, I did.'.`},{text:`Yes, I do.`,correct:!1,explanation:`Hiện tại đơn không phù hợp với câu hỏi 'Did'.`},{text:`Yes, I was.`,correct:!1,explanation:`Câu hỏi dùng trợ động từ 'Did', không dùng to be 'was'.`},{text:`No, I did.`,correct:!1,explanation:`Sau 'No' phải có phủ định 'didn't'.`}]},{q:`A massive moving platform decorated with flowers and statues in a festival parade is called a: 🚜🌺`,a:[{text:`float`,correct:!0,explanation:`Chính xác! Xe hoa diễu hành trong lễ hội gọi là 'float'.`},{text:`boat`,correct:!1,explanation:`'boat' là con thuyền bơi trên nước.`},{text:`plane`,correct:!1,explanation:`'plane' là máy bay trên trời.`},{text:`cart`,correct:!1,explanation:`'cart' là chiếc xe bò kéo hàng thô sơ.`}]},{q:`Bữa tiệc thịnh soạn ê hề thức ăn ngon lành để thết đãi mọi người trong ngày hội gọi là: 🍖🍗🍷`,a:[{text:`feast`,correct:!0,explanation:`Đúng rồi! Bữa đại tiệc thịnh soạn là 'feast'.`},{text:`snack`,correct:!1,explanation:`'snack' là món ăn nhẹ buổi xế chiều.`},{text:`diet`,correct:!1,explanation:`'diet' là chế độ ăn kiêng khem.`},{text:`fast`,correct:!1,explanation:`'fast' là sự nhịn ăn chay tịnh.`}]},{q:`Odd one out: Chọn từ có trọng âm rơi vào âm tiết THỨ HAI (khác với trọng âm âm tiết 1): festive, pumpkin, parade, turkey 🦃`,a:[{text:`parade`,correct:!0,explanation:`Chính xác! 'parade' có trọng âm rơi vào âm tiết thứ hai /pəˈreɪd/, trong khi festive, pumpkin, turkey đều có trọng âm ở âm tiết thứ nhất.`},{text:`festive`,correct:!1,explanation:`Trọng âm âm tiết 1: /ˈfes.tɪv/.`},{text:`pumpkin`,correct:!1,explanation:`Trọng âm âm tiết 1: /ˈpʌmp.kɪn/.`},{text:`turkey`,correct:!1,explanation:`Trọng âm âm tiết 1: /ˈtɜː.ki/.`}]},{q:`Odd one out: Chọn ngày lễ mang ý nghĩa TÔN GIÁO / TÍN NGƯỠNG, không phải lễ hội theo mùa tự nhiên: ✝️`,a:[{text:`Easter`,correct:!0,explanation:`Đúng rồi! Lễ Phục sinh (Easter) là đại lễ tôn giáo của Kitô giáo, còn Tulip Festival, Cherry Blossom Festival, Harvest Festival là lễ hội mùa tự nhiên.`},{text:`Tulip Festival`,correct:!1,explanation:`Lễ hội hoa tulip mùa xuân.`},{text:`Cherry Blossom Festival`,correct:!1,explanation:`Lễ hội hoa anh đào nở rộ.`},{text:`Harvest Festival`,correct:!1,explanation:`Lễ hội mùa gặt lúa thu hoạch.`}]},{q:`Sắp xếp chữ cái thành từ chỉ phong tục truyền thống lâu đời: 'o - n - a - t - i - t - i - d - r' 🏮`,a:[{text:`tradition`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'tradition' (truyền thống phong tục).`},{text:`traditoin`,correct:!1,explanation:`Sai vị trí chữ o và i.`},{text:`traditon`,correct:!1,explanation:`Thiếu chữ i.`},{text:`tradtion`,correct:!1,explanation:`Thiếu chữ i thứ nhất.`}]},{q:`Viết lại câu hỏi cho phần gạch chân: 'They celebrated the festival with colourful street dances.' 💃`,a:[{text:`How did they celebrate the festival?`,correct:!0,explanation:`Chính xác! Phần gạch chân 'with colourful street dances' chỉ phương thức, cách thức thực hiện nên hỏi bằng 'How did they...?'.`},{text:`Why did they celebrate the festival?`,correct:!1,explanation:`'Why' hỏi về lý do tại sao.`},{text:`Where did they celebrate the festival?`,correct:!1,explanation:`'Where' hỏi về nơi chốn địa điểm.`},{text:`When did they celebrate the festival?`,correct:!1,explanation:`'When' hỏi về thời gian khi nào.`}]},{q:`Tìm lỗi sai trong câu sau: 'Do you know how many people does attend the Tomato Festival each year?' 🍅`,a:[{text:`does attend -> attend`,correct:!0,explanation:`Đúng rồi! Trong câu hỏi gián tiếp hoặc câu hỏi chủ ngữ 'how many people...', động từ chia thẳng không mượn trợ động từ 'does': 'attend'.`},{text:`Do you know -> Did you know`,correct:!1,explanation:`Hiện tại đơn hỏi kiến thức chung là đúng.`},{text:`how many people -> how much people`,correct:!1,explanation:`'people' số nhiều đếm được đi với 'many' là chuẩn.`},{text:`each year -> last year`,correct:!1,explanation:`Không thay đổi mốc thời gian lặp lại hàng năm.`}]},{q:`Trò chơi truyền thống của trẻ em phương Tây gõ cửa từng nhà xin kẹo trong đêm Halloween là: 🍬👻`,a:[{text:`Trick or treat`,correct:!0,explanation:`Chính xác! Trò chơi 'Trick or treat' (Cho kẹo hay bị ghẹo) là phong tục đặc trưng nhất của đêm Halloween.`},{text:`Hide and seek`,correct:!1,explanation:`Trò trốn tìm dân gian.`},{text:`Blind man's bluff`,correct:!1,explanation:`Trò bịt mắt bắt dê.`},{text:`Tug of war`,correct:!1,explanation:`Trò kéo co đồng đội.`}]},{q:`Lễ hội Té nước cầu may mắn mừng năm mới của các nước láng giềng Đông Nam Á (Lào, Thái Lan) là: 💦🐘`,a:[{text:`Songkran Water Festival`,correct:!0,explanation:`Tuyệt vời! Lễ hội té nước Tết té nước nổi tiếng là 'Songkran' (Thái Lan) hoặc 'Bunpimay' (Lào).`},{text:`Ok Om Bok Festival`,correct:!1,explanation:`Lễ cúng trăng của đồng bào Khmer.`},{text:`Gióng Festival`,correct:!1,explanation:`Lễ hội Đền Gióng Sóc Sơn.`},{text:`Hung King Festival`,correct:!1,explanation:`Giỗ Tổ Hùng Vương ngày 10/3 âm lịch.`}]},{q:`Many superstitious people believe that a black cat crossing your path brings ___. 🐈‍⬛ (Mang lại điềm xấu)`,a:[{text:`bad luck`,correct:!0,explanation:`Chính xác! Quan niệm mê tín dị đoan cho rằng mèo đen băng qua đường mang lại xui xẻo ('bad luck').`},{text:`good luck`,correct:!1,explanation:`Mang lại may mắn tốt lành.`},{text:`a lot of wealth`,correct:!1,explanation:`Mang lại tiền tài giàu sang.`},{text:`high marks`,correct:!1,explanation:`Mang lại điểm 10 thi cử.`}]},{q:`At Cannes Film Festival in France, the most talented movie director is awarded the prestigious ___. 🏆🌴`,a:[{text:`Palme d'Or (Golden Palm)`,correct:!0,explanation:`Đúng rồi! Giải Cành cọ vàng (Palme d'Or) là giải thưởng cao quý nhất của Liên hoan phim Cannes.`},{text:`Golden Ball`,correct:!1,explanation:`Quả bóng vàng bóng đá.`},{text:`Golden Globe`,correct:!1,explanation:`Quả cầu vàng điện ảnh Mỹ.`},{text:`Grammy Trophy`,correct:!1,explanation:`Kèn vàng âm nhạc Grammy.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'festival / What / is / your / favorite / cultural / ?' 🎭`,a:[{text:`What is your favorite cultural festival?`,correct:!0,explanation:`Xuất sắc! Trật tự: Từ để hỏi (What) + to be (is) + your favorite cultural festival (Lễ hội văn hóa yêu thích nhất của bạn là gì?).`},{text:`What your favorite cultural festival is?`,correct:!1,explanation:`Động từ 'is' phải đứng trước chủ ngữ trong câu hỏi trực tiếp.`},{text:`What favorite cultural festival is your?`,correct:!1,explanation:`Đại từ sở hữu 'your' phải đứng trước danh từ.`},{text:`Is what your favorite cultural festival?`,correct:!1,explanation:`Từ để hỏi 'What' phải đứng đầu câu.`}]},{q:`Why are festivals important to communities worldwide? 🌍❤️`,a:[{text:`They preserve cultural heritage and foster social solidarity.`,correct:!0,explanation:`Chính xác! Lễ hội giúp gìn giữ bản sắc di sản văn hóa và thắt chặt tình đoàn kết cộng đồng xã hội.`},{text:`They cause total economic collapse.`,correct:!1,explanation:`Gây sụp đổ kinh tế là hoàn toàn sai.`},{text:`They force people to stay indoors alone.`,correct:!1,explanation:`Bắt mọi người ở nhà một mình là sai bản chất lễ hội.`},{text:`They abolish all national traditions.`,correct:!1,explanation:`Xóa bỏ truyền thống dân tộc là sai.`}]},{q:`Nguồn năng lượng có thể tái tạo tự nhiên và không bao giờ bị cạn kiệt tiếng Anh gọi là: ☀️💨`,a:[{text:`renewable energy`,correct:!0,explanation:`Chính xác! Năng lượng tái tạo là 'renewable energy' (năng lượng mặt trời, gió, thủy triều...).`},{text:`non-renewable energy`,correct:!1,explanation:`Năng lượng không thể tái tạo (than đá, dầu mỏ).`},{text:`nuclear waste`,correct:!1,explanation:`Chất thải phóng xạ độc hại.`},{text:`fossil fuel`,correct:!1,explanation:`Nhiên liệu hóa thạch khai thác lòng đất.`}]},{q:`Nhiên liệu hóa thạch không thể tái tạo được hình thành từ xác sinh vật cổ đại hàng triệu năm là: 🪨🛢️`,a:[{text:`fossil fuels`,correct:!0,explanation:`Đúng rồi! Nhiên liệu hóa thạch là 'fossil fuels' (than đá, dầu mỏ, khí đốt tự nhiên).`},{text:`renewable energy`,correct:!1,explanation:`Năng lượng tái tạo xanh sạch.`},{text:`solar energy`,correct:!1,explanation:`Năng lượng mặt trời.`},{text:`hydro energy`,correct:!1,explanation:`Thủy điện từ sức nước.`}]},{q:`Nguồn năng lượng sạch khổng lồ tạo ra từ các dòng nước chảy xiết qua đập ngăn sông gọi là: 🌊⚡`,a:[{text:`hydro energy`,correct:!0,explanation:`Xuất sắc! Thủy điện / năng lượng nước là 'hydro energy' (hoặc 'hydropower').`},{text:`wind energy`,correct:!1,explanation:`Năng lượng gió quay cánh quạt tuabin.`},{text:`solar energy`,correct:!1,explanation:`Năng lượng quang điện mặt trời.`},{text:`thermal energy`,correct:!1,explanation:`Nhiệt điện đốt than gây khói.`}]},{q:`Cột quạt gió khổng lồ quay đều trên đồi cao để biến đổi sức gió thành dòng điện là: 🌬️🗼`,a:[{text:`wind turbine`,correct:!0,explanation:`Chính xác! Tuabin gió là 'wind turbine'.`},{text:`solar panel`,correct:!1,explanation:`Tấm pin năng lượng mặt trời phẳng.`},{text:`coal plant`,correct:!1,explanation:`Nhà máy nhiệt điện đốt than đá.`},{text:`water pump`,correct:!1,explanation:`Máy bơm nước tưới tiêu.`}]},{q:`Tấm pin gắn trên mái nhà dùng để hấp thụ ánh sáng mặt trời chuyển thành điện năng là: ☀️🏠`,a:[{text:`solar panel`,correct:!0,explanation:`Đúng rồi! Tấm pin năng lượng mặt trời là 'solar panel'.`},{text:`wind turbine`,correct:!1,explanation:`Tuabin cánh quạt gió.`},{text:`chimney`,correct:!1,explanation:`Ống khói thải nhiệt.`},{text:`satellite dish`,correct:!1,explanation:`Chảo ăng-ten thu sóng vệ tinh.`}]},{q:`Lượng khí thải nhà kính carbon dioxide (CO2) mà một người thải ra môi trường qua sinh hoạt gọi là: 👣🌫️`,a:[{text:`carbon footprint`,correct:!0,explanation:`Tuyệt vời! Dấu chân carbon / lượng phát thải carbon là 'carbon footprint'.`},{text:`handprint`,correct:!1,explanation:`Dấu bàn tay in trên giấy.`},{text:`footstep`,correct:!1,explanation:`Bước chân đi lại trên cát.`},{text:`greenhouse`,correct:!1,explanation:`Nhà kính trồng hoa rau quả.`}]},{q:`Global temperatures ___ because of massive emissions from factories and coal power plants. 🌡️🔥`,a:[{text:`are rising`,correct:!0,explanation:`Chính xác! Diễn tả một xu hướng biến đổi đang diễn ra trên toàn cầu ta dùng thì Hiện tại tiếp diễn: 'are rising'.`},{text:`rose`,correct:!1,explanation:`Quá khứ đơn không diễn tả tiến trình đang tiếp diễn hiện nay.`},{text:`rise`,correct:!1,explanation:`Hiện tại đơn không thể hiện sự biến đổi theo thời gian rõ rệt như tiếp diễn.`},{text:`have risen`,correct:!1,explanation:`Hiện tại hoàn thành không nhấn mạnh tính biến chuyển từng ngày.`}]},{q:`Scientists are researching new technologies to ___ more clean energy from ocean waves. 🌊`,a:[{text:`generate`,correct:!0,explanation:`Đúng rồi! Tạo ra / sản xuất ra điện năng dùng động từ 'generate electricity'.`},{text:`destroy`,correct:!1,explanation:`'destroy' là phá hủy tàn phá.`},{text:`lose`,correct:!1,explanation:`'lose' là làm mất mát tiêu tán.`},{text:`waste`,correct:!1,explanation:`'waste' là lãng phí năng lượng.`}]},{q:`If we run out of oil and coal in the future, we will face severe energy ___. ⚠️`,a:[{text:`shortages`,correct:!0,explanation:`Chính xác! Tình trạng khủng hoảng thiếu hụt năng lượng là 'energy shortages'.`},{text:`abundance`,correct:!1,explanation:`'abundance' là sự dồi dào thừa thãi.`},{text:`wealth`,correct:!1,explanation:`'wealth' là sự giàu có sung túc.`},{text:`security`,correct:!1,explanation:`'security' là an ninh an toàn vững chắc.`}]},{q:`Odd one out: Chọn từ có trọng âm rơi vào âm tiết THỨ HAI: energy, natural, dangerous, polluted 🏭`,a:[{text:`polluted`,correct:!0,explanation:`Chính xác! 'polluted' có trọng âm rơi vào âm tiết thứ hai /pəˈluː.tɪd/, trong khi energy, natural, dangerous đều có trọng âm ở âm tiết thứ nhất.`},{text:`energy`,correct:!1,explanation:`Trọng âm âm tiết 1: /ˈen.ə.dʒi/.`},{text:`natural`,correct:!1,explanation:`Trọng âm âm tiết 1: /ˈnætʃ.ər.əl/.`},{text:`dangerous`,correct:!1,explanation:`Trọng âm âm tiết 1: /ˈdeɪn.dʒər.əs/.`}]},{q:`Odd one out: Chọn nguồn năng lượng KHÔNG THỂ TÁI TẠO (gây cạn kiệt): 🪨`,a:[{text:`coal`,correct:!0,explanation:`Đúng rồi! 'coal' (than đá) là nhiên liệu hóa thạch không thể tái tạo, còn solar, wind, hydro đều là năng lượng tái tạo.`},{text:`solar power`,correct:!1,explanation:`Năng lượng mặt trời sạch tái tạo vô tận.`},{text:`wind power`,correct:!1,explanation:`Năng lượng gió tái tạo vĩnh cửu.`},{text:`hydro power`,correct:!1,explanation:`Năng lượng thủy điện tái tạo theo chu trình nước.`}]},{q:`Sắp xếp chữ cái thành từ chỉ nguồn năng lượng sạch dồi dào: 'n - n - a - b - u - t - d - a' 🌾`,a:[{text:`abundant`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'abundant' (dồi dào, phong phú, dư dả).`},{text:`abudnant`,correct:!1,explanation:`Sai vị trí chữ d và n.`},{text:`abunadnt`,correct:!1,explanation:`Sai chính tả tiếng Anh.`},{text:`abundantt`,correct:!1,explanation:`Thừa chữ t cuối từ.`}]},{q:`Viết lại câu không đổi nghĩa: 'Coal is a cheaper energy source than solar power, but it causes more pollution.' 🏭☀️`,a:[{text:`Although coal is a cheaper energy source than solar power, it causes more pollution.`,correct:!0,explanation:`Chính xác! Mệnh đề 'A, but B' chuyển thành 'Although A, B'.`},{text:`Because coal is cheaper than solar power, it causes more pollution.`,correct:!1,explanation:`Dùng 'Because' là sai hoàn toàn quan hệ nhân quả.`},{text:`Although coal causes more pollution, but it is cheaper than solar.`,correct:!1,explanation:`Đã dùng 'Although' thì không được dùng 'but'.`},{text:`Solar power is cheaper than coal energy.`,correct:!1,explanation:`Sai sự thật so sánh trong câu gốc.`}]},{q:`Tìm lỗi sai trong câu sau: 'Solar energy will used to heat water and power household appliances in the future.' ☀️🏠`,a:[{text:`will used -> will be used`,correct:!0,explanation:`Đúng rồi! Năng lượng mặt trời không tự sử dụng mà được con người sử dụng nên phải ở thể bị động tương lai: 'will be used'.`},{text:`to heat -> for heating`,correct:!1,explanation:`Sau 'used' chỉ mục đích dùng 'to heat' là hoàn toàn đúng.`},{text:`power -> powering`,correct:!1,explanation:`Động từ 'power' song song với 'heat'.`},{text:`in the future -> in future`,correct:!1,explanation:`Cụm 'in the future' là chuẩn xác.`}]},{q:`Nguồn năng lượng sinh học tạo ra từ chất thải nông nghiệp, cây trồng và phân gia súc gọi là: 🌾💩⚡`,a:[{text:`biogas`,correct:!0,explanation:`Chính xác! Khí sinh học khí sinh vật là 'biogas' (hoặc 'biomass').`},{text:`natural gas`,correct:!1,explanation:`Khí đốt tự nhiên khai thác mỏ khí ngầm.`},{text:`petroleum`,correct:!1,explanation:`Dầu thô mỏ dầu.`},{text:`gasoline`,correct:!1,explanation:`Xăng dầu chạy động cơ xe ô tô.`}]},{q:`Installing solar panels on the roof requires a high initial ___ but saves money in the long run. 💰`,a:[{text:`cost`,correct:!0,explanation:`Đúng rồi! 'high initial cost' là chi phí đầu tư ban đầu cao nhưng tiết kiệm về lâu dài.`},{text:`temperature`,correct:!1,explanation:`'temperature' là nhiệt độ nóng lạnh.`},{text:`volume`,correct:!1,explanation:`'volume' là âm lượng hoặc thể tích.`},{text:`weight`,correct:!1,explanation:`'weight' là trọng lượng nặng nhẹ.`}]},{q:`Using public transport like electric buses helps people ___ their carbon footprint considerably. 🚌🍃`,a:[{text:`reduce`,correct:!0,explanation:`Chính xác! Đi phương tiện công cộng giúp cắt giảm dấu chân carbon: 'reduce carbon footprint'.`},{text:`increase`,correct:!1,explanation:`'increase' là làm tăng thêm lượng phát thải.`},{text:`produce`,correct:!1,explanation:`'produce' là thải thêm khí ô nhiễm.`},{text:`expand`,correct:!1,explanation:`'expand' là mở rộng bành trướng.`}]},{q:`What is the biggest environmental disadvantage of burning coal in thermal power stations? 🏭🌫️`,a:[{text:`It releases massive amounts of toxic smoke and carbon dioxide into the air.`,correct:!0,explanation:`Tuyệt vời! Nhược điểm lớn nhất của nhiệt điện than là thải lượng khói độc hại khổng lồ và CO2 gây thủng tầng ozone và hiệu ứng nhà kính.`},{text:`It makes surrounding areas too cold and freezing.`,correct:!1,explanation:`Nhiệt điện than không làm xung quanh đóng băng lạnh giá.`},{text:`It produces too much clean drinking water.`,correct:!1,explanation:`Không tạo ra nước uống tinh khiết.`},{text:`It runs silently without any noise.`,correct:!1,explanation:`Nhà máy nhiệt điện không vận hành êm ru.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'should / We / renewable / invest / more / in / sources / energy / .' ☀️💨`,a:[{text:`We should invest more in renewable energy sources.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (We) + should invest more (nên đầu tư nhiều hơn) + in renewable energy sources (vào các nguồn năng lượng tái tạo).`},{text:`We should in renewable energy sources invest more.`,correct:!1,explanation:`Động từ 'invest more' phải đi liền sau 'should'.`},{text:`Invest more we should in renewable energy sources.`,correct:!1,explanation:`Sai trật tự chủ ngữ.`},{text:`We in renewable energy sources should invest more.`,correct:!1,explanation:`Trạng từ không đứng trước trợ động từ.`}]},{q:`Which country is known as a world leader in producing electricity from offshore wind farms? 🌊🗼`,a:[{text:`Denmark`,correct:!0,explanation:`Chính xác! Đan Mạch (Denmark) là quốc gia tiên phong dẫn đầu thế giới về điện gió ngoài khơi.`},{text:`Egypt`,correct:!1,explanation:`Ai Cập nổi tiếng về sa mạc kim tự tháp.`},{text:`Brazil`,correct:!1,explanation:`Brazil nổi tiếng về thủy điện và rừng Amazon.`},{text:`Mongolia`,correct:!1,explanation:`Mông Cổ là thảo nguyên du mục.`}]},{q:`Hệ thống tàu đệm từ di chuyển với tốc độ siêu âm hơn 1000 k akes' là các lỗi sai lầm ngớ ngẩn.`},{text:`tickets`,correct:!1,explanation:`'tickets' là vé đi tàu xe.`},{text:`passengers`,correct:!1,explanation:`'passengers' là hành khách ngồi trên xe.`}]},{q:`Odd one out: Chọn từ có trọng âm rơi vào âm tiết THỨ NHẤT: future, bullet, travel, pollute 🚅`,a:[{text:`pollute`,correct:!0,explanation:`Chính xác! 'pollute' có trọng âm rơi vào âm tiết thứ hai /pəˈluːt/, trong khi future, bullet, travel đều có trọng âm ở âm tiết thứ nhất.`},{text:`future`,correct:!1,explanation:`Trọng âm âm tiết 1: /ˈfjuː.tʃər/.`},{text:`bullet`,correct:!1,explanation:`Trọng âm âm tiết 1: /ˈbʊl.ɪt/.`},{text:`travel`,correct:!1,explanation:`Trọng âm âm tiết 1: /ˈtræv.əl/.`}]},{q:`Odd one out: Chọn phương tiện KHÔNG GÂY Ô NHIỄM KHÍ THẢI cho bầu không khí: 🍃`,a:[{text:`solar-powered bus`,correct:!0,explanation:`Đúng rồi! 'solar-powered bus' (xe buýt chạy bằng năng lượng mặt trời) hoàn toàn không phát thải khí độc, còn diesel truck, petrol motorbike, old airplane đều xả khói đen.`},{text:`diesel truck`,correct:!1,explanation:`Xe tải chạy dầu diesel xả khói muội than.`},{text:`petrol motorbike`,correct:!1,explanation:`Xe máy chạy xăng hóa thạch xả CO2.`},{text:`old airplane`,correct:!1,explanation:`Máy bay cũ đốt nhiên liệu phản lực gây ô nhiễm.`}]},{q:`Sắp xếp chữ cái thành từ chỉ hành khách đi trên tàu xe: 'r - e - g - a - s - n - e - s - p' 🧳`,a:[{text:`passenger`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'passenger' (hành khách đi tàu xe).`},{text:`passengre`,correct:!1,explanation:`Sai vị trí chữ r và e cuối từ.`},{text:`passenegr`,correct:!1,explanation:`Sai chính tả tiếng Anh.`},{text:`passanger`,correct:!1,explanation:`Sai chữ e thành a.`}]},{q:`Viết lại câu sử dụng đại từ sở hữu: 'My electric car is white, and her electric car is silver.' ⚡🚗`,a:[{text:`My electric car is white, and hers is silver.`,correct:!0,explanation:`Chính xác! Thay thế cụm danh từ lặp lại 'her electric car' bằng đại từ sở hữu 'hers'.`},{text:`My electric car i
