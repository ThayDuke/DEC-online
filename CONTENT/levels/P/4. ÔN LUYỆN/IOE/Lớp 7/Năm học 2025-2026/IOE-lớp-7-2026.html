const fullQuestionBank=[{q:`My sister enjoys ___ dolls from different foreign countries in her spare time. 🎎`,a:[{text:`collecting`,correct:!0,explanation:`Chính xác! Sau động từ chỉ sở thích 'enjoy' ta dùng danh động từ dạng V-ing: 'collecting'.`},{text:`collect`,correct:!1,explanation:`Động từ nguyên thể không phù hợp sau 'enjoy'.`},{text:`collected`,correct:!1,explanation:`Dạng quá khứ không dùng sau 'enjoy'.`},{text:`to collect`,correct:!1,explanation:`Sau 'enjoy' bắt buộc dùng V-ing, không dùng 'to-V'.`}]},{q:`Sở thích khéo léo dùng dao gọt đẽo các khối gỗ thành hình con vật và đồ chơi là gì? 🪵🔪`,a:[{text:`carving wood`,correct:!0,explanation:`Đúng rồi! Nghệ thuật điêu khắc gỗ là 'carving wood'.`},{text:`making models`,correct:!1,explanation:`'making models' là làm mô hình máy bay, tàu hỏa.`},{text:`gardening`,correct:!1,explanation:`'gardening' là làm vườn trồng cây hoa.`},{text:`skating`,correct:!1,explanation:`'skating' là trượt pa-tin / trượt băng.`}]},{q:`Thú vui tao nhã dùng ống nhòm quan sát đời sống các loài chim trong rừng tự nhiên là gì? 🦜🔭`,a:[{text:`bird watching`,correct:!0,explanation:`Xuất sắc! Thú ngắm chim hoang dã là 'bird watching'.`},{text:`horse riding`,correct:!1,explanation:`'horse riding' là cưỡi ngựa trên thảo nguyên.`},{text:`jogging`,correct:!1,explanation:`'jogging' là chạy bộ rèn luyện sức khỏe.`},{text:`camping`,correct:!1,explanation:`'camping' là cắm trại ngoài trời.`}]},{q:`Phong hates ___ up early on cold winter mornings to go to school. ⏰❄️`,a:[{text:`getting`,correct:!0,explanation:`Chính xác! Sau động từ chỉ sự ghét bỏ 'hate' ta dùng V-ing ('getting').`},{text:`get`,correct:!1,explanation:`Động từ nguyên thể chưa chia dạng V-ing.`},{text:`got`,correct:!1,explanation:`Quá khứ đơn không đứng sau 'hate'.`},{text:`gets`,correct:!1,explanation:`Dạng chia ngôi thứ 3 không đứng sau động từ khác.`}]},{q:`Does your brother like ___ models of historic planes and warships? ✈️🚢`,a:[{text:`making`,correct:!0,explanation:`Đúng rồi! Cụm từ làm mô hình là 'making models'.`},{text:`doing`,correct:!1,explanation:`Không dùng 'doing models'.`},{text:`taking`,correct:!1,explanation:`Không dùng 'taking models'.`},{text:`giving`,correct:!1,explanation:`Không dùng 'giving models'.`}]},{q:`My grandfather loves ___ in the backyard garden because it makes him feel relaxed. 🌺`,a:[{text:`gardening`,correct:!0,explanation:`Tuyệt vời! 'gardening' là thú vui làm vườn chăm sóc hoa lá.`},{text:`skating`,correct:!1,explanation:`'skating' là trượt pa-tin, không phù hợp với người cao tuổi.`},{text:`cycling`,correct:!1,explanation:`'cycling' là đạp xe dạo phố.`},{text:`cooking`,correct:!1,explanation:`'cooking' là nấu nướng trong bếp.`}]},{q:`Môn thể thao quý tộc ngồi trên lưng ngựa điều khiển dây cương di chuyển là gì? 🐎`,a:[{text:`horse riding`,correct:!0,explanation:`Chính xác! Môn cưỡi ngựa là 'horse riding'.`},{text:`mountain climbing`,correct:!1,explanation:`'mountain climbing' là leo núi hiểm trở.`},{text:`snowboarding`,correct:!1,explanation:`'snowboarding' là trượt tuyết trên ván.`},{text:`windsurfing`,correct:!1,explanation:`'windsurfing' là lướt ván buồm trên biển.`}]},{q:`Water ___ at 100 degrees Celsius under standard atmospheric pressure. 🌡️💧`,a:[{text:`boils`,correct:!0,explanation:`Đúng rồi! Diễn tả một chân lý / sự thật hiển nhiên trong tự nhiên, ta dùng thì Hiện tại đơn: 'boils'.`},{text:`is boiling`,correct:!1,explanation:`Hiện tại tiếp diễn không dùng cho quy luật vĩnh cửu.`},{text:`boiled`,correct:!1,explanation:`Quá khứ đơn không phù hợp cho sự thật hiển nhiên.`},{text:`will boil`,correct:!1,explanation:`Tương lai đơn không dùng cho chân lý khoa học.`}]},{q:`The Sun always ___ in the East and sets in the West. ☀️`,a:[{text:`rises`,correct:!0,explanation:`Chính xác! Mặt trời mọc ở hướng Đông là sự thật tự nhiên dùng hiện tại đơn: 'rises'.`},{text:`is rising`,correct:!1,explanation:`Không dùng thì tiếp diễn cho quy luật tự nhiên.`},{text:`rose`,correct:!1,explanation:`Quá khứ đơn sai thì.`},{text:`has risen`,correct:!1,explanation:`Hiện tại hoàn thành không dùng ở đây.`}]},{q:`Odd one out: Chọn từ có phần nguyên âm phát âm là /ɜː/ dài (khác với âm /ə/ ngắn): bird, girl, learn, away 🔊`,a:[{text:`away`,correct:!0,explanation:`Chính xác! 'away' bắt đầu bằng âm /ə/ ngắn /əˈweɪ/, trong khi bird, girl, learn đều có âm /ɜː/ dài.`},{text:`bird`,correct:!1,explanation:`Phát âm là âm /ɜː/ dài /bɜːd/.`},{text:`girl`,correct:!1,explanation:`Phát âm là âm /ɜː/ dài /ɡɜːl/.`},{text:`learn`,correct:!1,explanation:`Phát âm là âm /ɜː/ dài /lɜːn/.`}]},{q:`Odd one out: Từ nào mang ý nghĩa KHÔNG THÍCH, trái nghĩa với 3 từ còn lại? 👎`,a:[{text:`detest`,correct:!0,explanation:`Đúng rồi! 'detest' nghĩa là căm ghét / cực ghét, còn love, adore, fancy đều có nghĩa là yêu thích.`},{text:`love`,correct:!1,explanation:`'love' là yêu thích tha thiết.`},{text:`adore`,correct:!1,explanation:`'adore' là mê mẩn, rất thích.`},{text:`fancy`,correct:!1,explanation:`'fancy' là ưa thích, có hứng thú.`}]},{q:`Sắp xếp chữ cái thành từ chỉ đồ gốm sứ thủ công mỹ nghệ: 't - t - o - y - r - p - e' 🏺`,a:[{text:`pottery`,correct:!0,explanation:`Xuất sắc! 'pottery' là nghề gốm sứ / đồ gốm thủ công.`},{text:`potetry`,correct:!1,explanation:`Sai vị trí chữ t và r.`},{text:`poterri`,correct:!1,explanation:`Sai chữ y thành i.`},{text:`pettory`,correct:!1,explanation:`Sai chính tả tiếng Anh.`}]},{q:`Viết lại câu không đổi nghĩa: 'My hobby is playing the acoustic guitar.' 🎸`,a:[{text:`I enjoy playing the acoustic guitar.`,correct:!0,explanation:`Chính xác! Cấu trúc 'My hobby is V-ing' tương đương với 'I enjoy / like + V-ing'.`},{text:`I am interested at playing the acoustic guitar.`,correct:!1,explanation:`Cụm từ đúng phải là 'interested in', không dùng 'interested at'.`},{text:`I fond of playing the acoustic guitar.`,correct:!1,explanation:`Thiếu động từ to be: 'am fond of'.`},{text:`I hate playing the acoustic guitar.`,correct:!1,explanation:`Ngược hoàn toàn về ý nghĩa.`}]},{q:`Tìm lỗi sai trong câu sau: 'Mai prefers to reading comic books than watching television.' 📚`,a:[{text:`to reading -> reading`,correct:!0,explanation:`Đúng rồi! Cấu trúc so sánh sở thích: 'prefer V-ing to V-ing' (thích làm việc gì hơn việc gì), không dùng 'prefers to reading... than'.`},{text:`comic books -> book comics`,correct:!1,explanation:`Tính từ bổ nghĩa đứng trước danh từ là đúng.`},{text:`than -> to`,correct:!1,explanation:`Cấu trúc prefer đi với giới từ 'to' thay vì 'than'.`},{text:`watching -> watch`,correct:!1,explanation:`Cả hai vế của prefer phải cân đối dạng V-ing.`}]},{q:`A creative hobby like painting can help teenagers develop their ___ and patience. 🎨`,a:[{text:`creativity`,correct:!0,explanation:`Chính xác! Sau tính từ sở hữu 'their' cần một danh từ: 'creativity' (sự sáng tạo).`},{text:`creative`,correct:!1,explanation:`'creative' là tính từ, không đứng sau 'their' làm tân ngữ.`},{text:`creatively`,correct:!1,explanation:`'creatively' là phó từ trạng ngữ.`},{text:`create`,correct:!1,explanation:`'create' là động từ nguyên thể.`}]},{q:`Playing board games with family members helps ___ people together on weekends. ♟️`,a:[{text:`bring`,correct:!0,explanation:`Đúng rồi! Cụm từ gắn kết mọi người lại với nhau là 'bring people together'.`},{text:`take`,correct:!1,explanation:`'take away' là mang đi xa.`},{text:`push`,correct:!1,explanation:`'push' là xô đẩy ra xa.`},{text:`throw`,correct:!1,explanation:`'throw' là ném liệng.`}]},{q:`My father ___ fishing at West Lake every Saturday afternoon when the weather is fine. 🎣`,a:[{text:`goes`,correct:!0,explanation:`Chính xác! Cụm từ đi câu cá là 'go fishing', chủ ngữ số ít 'My father' chia là 'goes'.`},{text:`does`,correct:!1,explanation:`Không dùng 'does fishing'.`},{text:`plays`,correct:!1,explanation:`Không dùng 'plays fishing'.`},{text:`makes`,correct:!1,explanation:`Không dùng 'makes fishing'.`}]},{q:`Do you fancy ___ part in our school dancing club next semester? 💃`,a:[{text:`taking`,correct:!0,explanation:`Đúng rồi! Cụm từ tham gia là 'take part in', sau 'fancy' động từ chia ở dạng V-ing ('taking').`},{text:`to take`,correct:!1,explanation:`Sau 'fancy' không dùng 'to-V'.`},{text:`take`,correct:!1,explanation:`Động từ nguyên thể không đúng ngữ pháp.`},{text:`took`,correct:!1,explanation:`Quá khứ đơn không đứng sau 'fancy'.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'free / in / He / models / his / builds / time / .' 🚂`,a:[{text:`He builds models in his free time.`,correct:!0,explanation:`Xuất sắc! Trật tự: S (He) + V (builds) + O (models) + cụm thời gian (in his free time).`},{text:`He in his free time models builds.`,correct:!1,explanation:`Cụm thời gian không chen vào giữa chủ ngữ và động từ.`},{text:`Builds he models in his free time.`,correct:!1,explanation:`Đây không phải câu hỏi.`},{text:`He builds in his free time models.`,correct:!1,explanation:`Tân ngữ 'models' không bị tách khỏi động từ.`}]},{q:`What are the benefits of having a good hobby? ✨`,a:[{text:`It reduces stress and teaches us new skills.`,correct:!0,explanation:`Chính xác! Lợi ích của sở thích lành mạnh là giảm căng thẳng và rèn luyện kỹ năng mới.`},{text:`It makes us waste a lot of precious time.`,correct:!1,explanation:`Làm lãng phí thời gian là tác hại tiêu cực.`},{text:`It causes serious eye problems.`,correct:!1,explanation:`Gây đau mắt là nhược điểm của việc dùng màn hình quá mức.`},{text:`It isolates us completely from our friends.`,correct:!1,explanation:`Làm cô lập khỏi bạn bè là tiêu cực.`}]},{q:`Tình trạng da mặt xuất hiện các nốt mụn đỏ nhỏ li ti ở tuổi dậy thì tiếng Anh gọi là: 🧖`,a:[{text:`acne`,correct:!0,explanation:`Chính xác! Mụn trứng cá trên da là 'acne'.`},{text:`sunburn`,correct:!1,explanation:`'sunburn' là da bị cháy nắng ửng đỏ rát.`},{text:`chapped lips`,correct:!1,explanation:`'chapped lips' là môi bị nứt nẻ khô ráp mùa đông.`},{text:`flu`,correct:!1,explanation:`'flu' là bệnh cúm mùa.`}]},{q:`Hiện tượng đôi môi bị khô nứt, bong tróc và chảy máu vào mùa đông hanh khô gọi là: 👄❄️`,a:[{text:`chapped lips`,correct:!0,explanation:`Đúng rồi! Môi nứt nẻ khô rát là 'chapped lips'.`},{text:`dimples`,correct:!1,explanation:`'dimples' là đôi lúm đồng tiền xinh xắn.`},{text:`acne`,correct:!1,explanation:`'acne' là mụn trứng cá.`},{text:`sunburn`,correct:!1,explanation:`'sunburn' là da cháy nắng.`}]},{q:`Làn da bị ửng đỏ, phồng rát sau khi phơi nắng quá lâu ngoài bãi biển mà không bôi kem bảo vệ gọi là: 🏖️☀️`,a:[{text:`sunburn`,correct:!0,explanation:`Xuất sắc! Bị cháy nắng là 'sunburn'.`},{text:`allergy`,correct:!1,explanation:`'allergy' là phản ứng dị ứng mẩn ngứa.`},{text:`headache`,correct:!1,explanation:`'headache' là đau đầu nhức óc.`},{text:`stomachache`,correct:!1,explanation:`'stomachache' là đau dạ dày / đau bụng.`}]},{q:`Lọ thuốc nhỏ mắt dùng để rửa sạch bụi bẩn và làm dịu mắt mỏi mệt tiếng Anh là: 👁️💧`,a:[{text:`eye drops`,correct:!0,explanation:`Chính xác! Thuốc nhỏ mắt là 'eye drops'.`},{text:`lip balm`,correct:!1,explanation:`'lip balm' là son dưỡng ẩm chống nẻ môi.`},{text:`cough medicine`,correct:!1,explanation:`'cough medicine' là si-rô thuốc ho.`},{text:`painkiller`,correct:!1,explanation:`'painkiller' là thuốc giảm đau.`}]},{q:`Son dưỡng ẩm không màu giúp đôi môi luôn mềm mại và tránh nứt nẻ gọi là: 💄`,a:[{text:`lip balm`,correct:!0,explanation:`Đúng rồi! Son dưỡng môi chống nẻ là 'lip balm'.`},{text:`eye drops`,correct:!1,explanation:`'eye drops' là thuốc nhỏ mắt.`},{text:`suncream`,correct:!1,explanation:`'suncream' là kem chống nắng toàn thân.`},{text:`toothpaste`,correct:!1,explanation:`'toothpaste' là kem đánh răng.`}]},{q:`Chế độ ăn uống cân bằng dinh dưỡng, giàu rau xanh và hoa quả tươi gọi là: 🥗🍎`,a:[{text:`healthy diet`,correct:!0,explanation:`Tuyệt vời! Chế độ ăn uống lành mạnh là 'healthy diet'.`},{text:`junk food`,correct:!1,explanation:`'junk food' là đồ ăn vặt nhiều dầu mỡ và đường hóa học.`},{text:`fast food`,correct:!1,explanation:`'fast food' là đồ ăn nhanh chế biến sẵn.`},{text:`soft drink`,correct:!1,explanation:`'soft drink' là nước ngọt có ga nhiều calo rỗng.`}]},{q:`Eat more green vegetables and fruits, ___ you will not get enough vitamins. 🥦 (Nếu không thì)`,a:[{text:`or`,correct:!0,explanation:`Chính xác! Liên từ 'or' ở đây mang nghĩa 'nếu không thì' trong câu đưa ra lời khuyên cảnh báo.`},{text:`and`,correct:!1,explanation:`'and' là và, đồng thuận.`},{text:`so`,correct:!1,explanation:`'so' là cho nên, chỉ kết quả.`},{text:`but`,correct:!1,explanation:`'but' là nhưng, chỉ tương phản.`}]},{q:`Lan washes her face twice a day with gentle cleanser, ___ she rarely gets acne. ✨`,a:[{text:`so`,correct:!0,explanation:`Đúng rồi! 'so' (vì vậy, cho nên) nối vế hành động với vế kết quả tích cực.`},{text:`because`,correct:!1,explanation:`Đặt 'because' ở đây bị ngược logic nhân quả.`},{text:`or`,correct:!1,explanation:`'or' là hoặc là / nếu không.`},{text:`but`,correct:!1,explanation:`'but' là nhưng.`}]},{q:`You should exercise regularly, ___ you can keep your body fit and energetic. 🏃`,a:[{text:`so that`,correct:!0,explanation:`Chính xác! Cụm liên từ chỉ mục đích 'so that' có nghĩa là 'để mà'.`},{text:`because of`,correct:!1,explanation:`Sau 'because of' phải là cụm danh từ, không phải mệnh đề 'you can keep'.`},{text:`although`,correct:!1,explanation:`'although' chỉ sự nhượng bộ trái ngược.`},{text:`in spite of`,correct:!1,explanation:`Sau 'in spite of' không đi với mệnh đề có thì hoàn chỉnh.`}]},{q:`Odd one out: Chọn từ có phần phát âm phụ âm 'f' (khác với âm 'v' /v/): fat, food, life, leave 🔊`,a:[{text:`leave`,correct:!0,explanation:`Chính xác! 'leave' kết thúc bằng âm hữu thanh /v/, trong khi fat, food, life đều có âm vô thanh /f/.`},{text:`fat`,correct:!1,explanation:`Có âm /f/.`},{text:`food`,correct:!1,explanation:`Có âm /f/.`},{text:`life`,correct:!1,explanation:`Có âm /f/.`}]},{q:`Odd one out: Từ nào chỉ THÓI QUEN CÓ HẠI cho sức khỏe con người? 🚬`,a:[{text:`staying up late`,correct:!0,explanation:`Đúng rồi! 'staying up late' (thức khuya) là thói quen xấu tàn phá sức khỏe, còn jogging, swimming, drinking water là thói quen tốt.`},{text:`jogging every morning`,correct:!1,explanation:`Chạy bộ sáng là thói quen tốt.`},{text:`swimming regularly`,correct:!1,explanation:`Bơi lội thường xuyên rất tốt.`},{text:`drinking plenty of water`,correct:!1,explanation:`Uống đủ nước tốt cho cơ thể.`}]},{q:`Sắp xếp chữ cái thành từ chỉ bệnh dị ứng thời tiết: 'r - e - l - a - y - l - g' 🤧`,a:[{text:`allergy`,correct:!0,explanation:`Xuất sắc! 'allergy' là chứng dị ứng phấn hoa, thời tiết hoặc thức ăn.`},{text:`allergly`,correct:!1,explanation:`Thừa chữ l.`},{text:`allregy`,correct:!1,explanation:`Sai vị trí chữ e và r.`},{text:`alregiy`,correct:!1,explanation:`Sai chính tả.`}]},{q:`Viết lại câu sử dụng liên từ thích hợp: 'Wear warm clothes or you will catch a cold.' 🧥❄️`,a:[{text:`If you don't wear warm clothes, you will catch a cold.`,correct:!0,explanation:`Chính xác! 'Mệnh lệnh + or S will...' viết lại thành câu điều kiện 'If you don't..., you will...'.`},{text:`If you wear warm clothes, you will catch a cold.`,correct:!1,explanation:`Ngược hoàn toàn logic nghĩa thực tế.`},{text:`Unless you don't wear warm clothes, you will catch a cold.`,correct:!1,explanation:`Sau 'Unless' không dùng phủ định 'don't'.`},{text:`Because you wear warm clothes, you will catch a cold.`,correct:!1,explanation:`Sai hoàn toàn logic nhân quả.`}]},{q:`Tìm lỗi sai trong câu sau: 'My sister has a bad headache, but she takes two aspirins.' 💊`,a:[{text:`but -> so`,correct:!0,explanation:`Đúng rồi! Hai vế câu thể hiện quan hệ nguyên nhân - hệ quả: Vì đau đầu nên cô ấy uống thuốc, phải dùng 'so' chứ không dùng 'but'.`},{text:`bad headache -> headache bad`,correct:!1,explanation:`Tính từ đứng trước danh từ là đúng.`},{text:`she takes -> she take`,correct:!1,explanation:`Chủ ngữ số ít 'she' động từ thêm 's' là chuẩn.`},{text:`aspirins -> aspirin`,correct:!1,explanation:`Danh từ thuốc ở đây dùng chuẩn.`}]},{q:`Người ăn chay trường không ăn thịt động vật tiếng Anh gọi là gì? 🥦🥕`,a:[{text:`vegetarian`,correct:!0,expl uld plenty of water every day.`,correct:!1,explanation:`Sai vị trí chủ ngữ 'We'.`},{text:`Plenty of water we should drink every day.`,correct:!1,explanation:`Không tự nhiên bằng cấu trúc chuẩn.`}]},{q:`Which activity helps improve both physical strength and mental health? 🧘‍♀️`,a:[{text:`Doing yoga and meditation.`,correct:!0,explanation:`Chính xác! Tập yoga và thiền định giúp tăng cường thể lực và tĩnh tâm trí não.`},{text:`Playing video games for ten hours straight.`,correct:!1,explanation:`Chơi game 10 tiếng liên tục gây hại sức khỏe.`},{text:`Eating sugary donuts before sleeping.`,correct:!1,explanation:`Ăn bánh ngọt trước khi ngủ gây béo phì và sâu răng.`},{text:`Skipping breakfast regularly.`,correct:!1,explanation:`Bỏ bữa sáng gây hại dạ dày và suy nhược.`}]},{q:`Những người tình nguyện viên tham gia giúp đỡ cộng đồng không nhận tiền công gọi là: 🤝`,a:[{text:`volunteers`,correct:!0,explanation:`Chính xác! Tình nguyện viên là 'volunteers'.`},{text:`officers`,correct:!1,explanation:`'officers' là sĩ quan hoặc nhân viên công sở.`},{text:`engineers`,correct:!1,explanation:`'engineers' là các kỹ sư công trình.`},{text:`customers`,correct:!1,explanation:`'customers' là khách hàng mua sắm.`}]},{q:`Hành động quyên góp sách vở, quần áo ấm và tiền bạc cho trẻ em vùng lũ lụt là gì? 📦❤️`,a:[{text:`donate`,correct:!0,explanation:`Đúng rồi! Quyên góp ủng hộ từ thiện là 'donate'.`},{text:`destroy`,correct:!1,explanation:`'destroy' là phá hủy làm hư hỏng.`},{text:`steal`,correct:!1,explanation:`'steal' là ăn trộm ăn cắp.`},{text:`waste`,correct:!1,explanation:`'waste' là lãng phí bừa bãi.`}]},{q:`Hành động phụ đạo, kèm cặp học tập miễn phí cho các em nhỏ có hoàn cảnh khó khăn gọi là: 📖✍️`,a:[{text:`tutor`,correct:!0,explanation:`Xuất sắc! Dạy kèm, phụ đạo bài học là động từ 'tutor'.`},{text:`punish`,correct:!1,explanation:`'punish' là phạt, trừng phạt.`},{text:`tease`,correct:!1,explanation:`'tease' là trêu chọc làm phiền.`},{text:`ignore`,correct:!1,explanation:`'ignore' là
