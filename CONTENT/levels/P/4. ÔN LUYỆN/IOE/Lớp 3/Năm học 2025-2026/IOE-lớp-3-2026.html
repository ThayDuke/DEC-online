const fullQuestionBank=[{q:`How do you spell your name? (Bạn đánh vần tên 'Linh' thế nào?) ✍️`,a:[{text:`L-I-N-H`,correct:!0,explanation:`Chính xác! Tên 'Linh' đánh vần là L-I-N-H.`},{text:`L-I-N-K`,correct:!1,explanation:`Chữ cuối là H chứ không phải K em nhé.`},{text:`L-E-N-H`,correct:!1,explanation:`Chữ cái thứ hai là I em nhé.`},{text:`N-I-N-H`,correct:!1,explanation:`Đây là tên Ninh rồi em.`}]},{q:`Are they your friends? 👫 (Họ có phải bạn của bạn không?)`,a:[{text:`Yes, they are.`,correct:!0,explanation:`Đúng rồi! Câu trả lời đồng ý là 'Yes, they are.'`},{text:`Yes, they is.`,correct:!1,explanation:`'they' phải đi với 'are' chứ không đi với 'is'.`},{text:`No, they are.`,correct:!1,explanation:`Nếu trả lời 'No' thì phải có 'aren't'.`},{text:`Yes, I am.`,correct:!1,explanation:`Câu hỏi hỏi về 'they' (họ) em nhé.`}]},{q:`Thư viện trường học trong tiếng Anh là gì? 📚`,a:[{text:`library`,correct:!0,explanation:`Chính xác! Thư viện để đọc sách là 'library'.`},{text:`classroom`,correct:!1,explanation:`'classroom' là phòng học em nhé.`},{text:`playground`,correct:!1,explanation:`'playground' là sân chơi nè.`},{text:`gym`,correct:!1,explanation:`'gym' là phòng tập thể dục.`}]},{q:`Điền chữ cái còn thiếu: "l_brary" (Thư viện) 📖`,a:[{text:`i`,correct:!0,explanation:`Tuyệt vời! Từ đúng là 'library'.`},{text:`e`,correct:!1,explanation:`Chữ 'e' chưa đúng rồi.`},{text:`a`,correct:!1,explanation:`Chữ 'a' không ghép thành từ đúng.`},{text:`o`,correct:!1,explanation:`Chữ 'o' chưa chính xác em nhé.`}]},{q:`Khi muốn xin phép thầy cô vào lớp, em nói câu gì? 🚪`,a:[{text:`May I come in?`,correct:!0,explanation:`Đúng rồi! 'May I come in?' nghĩa là 'Em xin phép vào lớp ạ?'`},{text:`May I go out?`,correct:!1,explanation:`'May I go out?' là xin phép ra ngoài em nhé.`},{text:`May I speak Vietnamese?`,correct:!1,explanation:`Đây là xin phép nói tiếng Việt.`},{text:`May I open the book?`,correct:!1,explanation:`Đây là xin phép mở sách.`}]},{q:`Khi muốn xin phép ra ngoài, em nói thế nào? 🚶`,a:[{text:`May I go out?`,correct:!0,explanation:`Chính xác! 'May I go out?' là xin phép ra ngoài.`},{text:`May I come in?`,correct:!1,explanation:`'May I come in?' là xin phép vào lớp.`},{text:`Sit down, please.`,correct:!1,explanation:`Đây là lời mời ngồi xuống.`},{text:`Stand up, please.`,correct:!1,explanation:`Đây là yêu cầu đứng lên.`}]},{q:`Sắp xếp các chữ cái thành từ chỉ trường học: "o - o - h - s - l - c" 🏫`,a:[{text:`school`,correct:!0,explanation:`Giỏi lắm! Ngôi trường thân yêu là 'school'.`},{text:`shcool`,correct:!1,explanation:`Sai vị trí chữ 'h' và 'c' rồi.`},{text:`sochol`,correct:!1,explanation:`Từ này viết sai chính tả.`},{text:`scohlo`,correct:!1,explanation:`Chưa đúng thứ tự chữ cái em nhé.`}]},{q:`Sân chơi của trường học tiếng Anh là gì? 🎠`,a:[{text:`playground`,correct:!0,explanation:`Đúng rồi! Sân trường vui chơi là 'playground'.`},{text:`classroom`,correct:!1,explanation:`'classroom' là phòng học.`},{text:`gym`,correct:!1,explanation:`'gym' là nhà thể chất/phòng thể dục.`},{text:`computer room`,correct:!1,explanation:`'computer room' là phòng máy tính.`}]},{q:`Phòng máy vi tính trong trường tiếng Anh gọi là gì? 💻`,a:[{text:`computer room`,correct:!0,explanation:`Chính xác! Phòng tin học/máy tính là 'computer room'.`},{text:`music room`,correct:!1,explanation:`'music room' là phòng âm nhạc em nhé.`},{text:`art room`,correct:!1,explanation:`'art room' là phòng mỹ thuật.`},{text:`library`,correct:!1,explanation:`'library' là thư viện nè.`}]},{q:`Điền chữ cái còn thiếu: "fr_end" (Người bạn tốt) 🤝`,a:[{text:`i`,correct:!0,explanation:`Rất tốt! Người bạn viết là 'friend'.`},{text:`e`,correct:!1,explanation:`Chữ 'e' chưa đúng vị trí.`},{text:`a`,correct:!1,explanation:`Chữ 'a' không đúng rồi.`},{text:`o`,correct:!1,explanation:`Chữ 'o' chưa chính xác em nhé.`}]},{q:`Is that your school? 🏫 (Kia có phải trường học của bạn không?)`,a:[{text:`Yes, it is.`,correct:!0,explanation:`Đúng rồi! Trả lời đúng là 'Yes, it is.'`},{text:`Yes, they are.`,correct:!1,explanation:`Chỉ có một ngôi trường ('that school') nên không dùng 'they'.`},{text:`No, it is.`,correct:!1,explanation:`'No' phải đi cùng 'isn't' em nhé.`},{text:`Yes, it isn't.`,correct:!1,explanation:`Không dùng 'Yes' đi cùng phủ định 'isn't'.`}]},{q:`Phòng học âm nhạc trong trường gọi là gì? 🎵`,a:[{text:`music room`,correct:!0,explanation:`Chính xác! Phòng học hát là 'music room'.`},{text:`art room`,correct:!1,explanation:`'art room' là phòng vẽ tranh.`},{text:`gym`,correct:!1,explanation:`'gym' là phòng thể thao.`},{text:`classroom`,correct:!1,explanation:`'classroom' là lớp học chung.`}]},{q:`Sắp xếp chữ cái thành từ chỉ phòng học: "o - r - c - a - s - s - l - o - m" 🎓`,a:[{text:`classroom`,correct:!0,explanation:`Tuyệt vời! Lớp học là 'classroom'.`},{text:`classrom`,correct:!1,explanation:`Thiếu một chữ 'o' rồi em.`},{text:`clarssoom`,correct:!1,explanation:`Thứ tự chữ cái chưa đúng.`},{text:`clasrsoom`,correct:!1,explanation:`Từ này viết sai chính tả.`}]},{q:`Chọn từ khác loại (Odd one out) so với các phòng/địa điểm trường học: father, library, classroom, gym 🏫`,a:[{text:`father`,correct:!0,explanation:`Chính xác! 'father' là thành viên gia đình, còn lại là các phòng ở trường.`},{text:`library`,correct:!1,explanation:`'library' là phòng ở trường (thư viện).`},{text:`classroom`,correct:!1,explanation:`'classroom' là phòng học.`},{text:`gym`,correct:!1,explanation:`'gym' là phòng thể thao.`}]},{q:`May I come in? - Yes, you ___.`,a:[{text:`can`,correct:!0,explanation:`Đúng rồi! Khi đồng ý cho phép ta nói: 'Yes, you can.'`},{text:`can't`,correct:!1,explanation:`'can't' dùng khi từ chối ('No, you can't').`},{text:`do`,correct:!1,explanation:`Không dùng 'do' trong câu trả lời cho 'May I...'.`},{text:`are`,correct:!1,explanation:`Không dùng 'are' trong cấu trúc này.`}]},{q:`Bác sĩ khám bệnh trong tiếng Anh là gì? 👨‍⚕️`,a:[{text:`doctor`,correct:!0,explanation:`Chính xác! Bác sĩ là 'doctor'.`},{text:`teacher`,correct:!1,explanation:`'teacher' là giáo viên em nhé.`},{text:`driver`,correct:!1,explanation:`'driver' là tài xế lái xe.`},{text:`farmer`,correct:!1,explanation:`'farmer' là bác nông dân.`}]},{q:`Cô giáo hoặc thầy giáo trong tiếng Anh là gì? 👩‍🏫`,a:[{text:`teacher`,correct:!0,explanation:`Đúng rồi! Thầy cô giáo là 'teacher'.`},{text:`cook`,correct:!1,explanation:`'cook' là đầu bếp nấu ăn.`},{text:`nurse`,correct:!1,explanation:`'nurse' là y tá chăm sóc bệnh nhân.`},{text:`worker`,correct:!1,explanation:`'worker' là công nhân làm việc.`}]},{q:`What does your father do? 🚜 (Bố em làm nông nghiệp)`,a:[{text:`He is a farmer.`,correct:!0,explanation:`Giỏi lắm! Bác nông dân làm ruộng là 'farmer'.`},{text:`He is a doctor.`,correct:!1,explanation:`'doctor' là bác sĩ khám bệnh.`},{text:`She is a farmer.`,correct:!1,explanation:`Bố là nam giới, phải dùng đại từ 'He' em nhé.`},{text:`He is a teacher.`,correct:!1,explanation:`'teacher' là giáo viên.`}]},{q:`Điền chữ cái còn thiếu: "d_iver" (Bác tài xế lái xe) 🚗`,a:[{text:`r`,correct:!0,explanation:`Rất tốt! Tài xế viết là 'driver'.`},{text:`l`,correct:!1,explanation:`Chữ 'l' chưa đúng rồi.`},{text:`n`,correct:!1,explanation:`Chữ 'n' không ghép thành từ đúng.`},{text:`t`,correct:!1,explanation:`Chữ 't' chưa chính xác em nhé.`}]},{q:`Phòng khách ấm cúng trong ngôi nhà tiếng Anh là gì? 🛋️`,a:[{text:`living room`,correct:!0,explanation:`Đúng rồi! Phòng khách là 'living room'.`},{text:`bedroom`,correct:!1,explanation:`'bedroom' là phòng ngủ em nhé.`},{text:`kitchen`,correct:!1,explanation:`'kitchen' là phòng bếp.`},{text:`bathroom`,correct:!1,explanation:`'bathroom' là phòng tắm.`}]},{q:`Phòng ngủ để nghỉ ngơi trong tiếng Anh là gì? 🛏️`,a:[{text:`bedroom`,correct:!0,explanation:`Chính xác! Phòng ngủ có chiếc giường là 'bedroom'.`},{text:`living room`,correct:!1,explanation:`'living room' là phòng khách.`},{text:`kitchen`,correct:!1,explanation:`'kitchen' là nhà bếp.`},{text:`dining room`,correct:!1,explanation:`'dining room' là phòng ăn.`}]},{q:`Nhà bếp nấu ăn ngon lành trong tiếng Anh là gì? 🍳`,a:[{text:`kitchen`,correct:!0,explanation:`Tuyệt vời! Nhà bếp là 'kitchen'.`},{text:`bathroom`,correct:!1,explanation:`'bathroom' là phòng tắm em nhé.`},{text:`bedroom`,correct:!1,explanation:`'bedroom' là phòng ngủ.`},{text:`garden`,correct:!1,explanation:`'garden' là khu vườn ngoài trời.`}]},{q:`Điền chữ cái còn thiếu: "k_tchen" (Nhà bếp) 🍲`,a:[{text:`i`,correct:!0,explanation:`Đúng rồi! Nhà bếp viết là 'kitchen'.`},{text:`e`,correct:!1,explanation:`Chữ 'e' chưa đúng rồi.`},{text:`a`,correct:!1,explanation:`Chữ 'a' không đúng vị trí.`},{text:`o`,correct:!1,explanation:`Chữ 'o' chưa chính xác em nhé.`}]},{q:`Where is my mother? 👩🍳 (Mẹ đang nấu ăn trong bếp)`,a:[{text:`She is in the kitchen.`,correct:!0,explanation:`Giỏi lắm! 'She is in the kitchen.' nghĩa là Mẹ đang ở trong bếp.`},{text:`He is in the kitchen.`,correct:!1,explanation:`Mẹ là nữ giới, phải dùng 'She' em nhé.`},{text:`She is in the bedroom.`,correct:!1,explanation:`'bedroom' là phòng ngủ.`},{text:`She are in the kitchen.`,correct:!1,explanation:`Chủ ngữ 'She' phải đi với động từ 'is'.`}]},{q:`Khu vườn đầy hoa thơm trước nhà là gì? 🌻`,a:[{text:`garden`,correct:!0,explanation:`Chính xác! Khu vườn là 'garden'.`},{text:`living room`,correct:!1,explanation:`'living room' là phòng khách trong nhà.`},{text:`gate`,correct:!1,explanation:`'gate' là cổng nhà.`},{text:`fence`,correct:!1,explanation:`'fence' là hàng rào.`}]},{q:`Sắp xếp chữ cái thành từ chỉ người y tá: "e - n - u - r - s" 👩‍⚕️`,a:[{text:`nurse`,correct:!0,explanation:`Rất tốt! Cô y tá là 'nurse'.`},{text:`nruse`,correct:!1,explanation:`Chưa đúng thứ tự chữ cái.`},{text:`nesru`,correct:!1,explanation:`Từ này viết sai chính tả.`},{text:`nuser`,correct:!1,explanation:`Chưa chính xác em nhé.`}]},{q:`Người đầu bếp nấu những món ăn ngon gọi là gì? 👨‍🍳`,a:[{text:`cook`,correct:!0,explanation:`Đúng rồi! Đầu bếp là 'cook'.`},{text:`driver`,correct:!1,explanation:`'driver' là tài xế lái xe.`},{text:`farmer`,correct:!1,explanation:`'farmer' là bác nô ging' là ca hát.`}]},{q:`Từ nào sau đây có nghĩa là 'khiêu vũ / nhảy múa'? 💃`,a:[{text:`dancing`,correct:!0,explanation:`Đúng rồi! 'dancing' bắt nguồn từ động từ 'dance' (nhảy múa).`},{text:`sleeping`,correct:!1,explanation:`'sleeping' là ngủ nghỉ.`},{text:`walking`,correct:!1,explanation:`'walking' là đi bộ dạo mát.`},{text:`eating`,correct:!1,explanation:`'eating' là ăn uống.`}]},{q:`Điền từ còn thiếu vào chỗ trống: 'My brother likes ___ books in the library.' 📖`,a:[{text:`reading`,correct:!0,explanation:`Chuẩn xác! Đọc sách là cụm 'reading books'.`},{text:`singing`,correct:!1,explanation:`Không nói 'singing books' (hát sách).`},{text:`drawing`,correct:!1,explanation:`'drawing books' không phù hợp ngữ cảnh đọc trong thư viện.`},{text:`cooking`,correct:!1,explanation:`'cooking books' không đúng nghĩa.`}]},{q:`Sắp xếp chữ cái thành từ chỉ sở thích chạy bộ: 'g - n - n - u - i - r' 🏃`,a:[{text:`running`,correct:!0,explanation:`Tuyệt vời! 'running' là môn chạy bộ rèn luyện sức khỏe.`},{text:`runner`,correct:!1,explanation:`Từ này là danh từ chỉ người chạy bộ.`},{text:`runing`,correct:!1,explanation:`Sai chính tả, từ đúng phải gấp đôi chữ n ('running').`},{text:`raining`,correct:!1,explanation:`Từ này nghĩa là trời đang mưa.`}]},{q:`Chọn từ khác loại (Odd one out) so với các sở thích: cooking, dancing, singing, kitchen 🎯`,a:[{text:`kitchen`,correct:!0,explanation:`Chính xác! 'kitchen' (nhà bếp) là nơi chốn trong nhà, còn cooking, dancing, singing là các sở thích.`},{text:`cooking`,correct:!1,explanation:`'cooking' là sở thích nấu nướng.`},{text:`dancing`,correct:!1,explanation:`'dancing' là sở thích nhảy múa.`},{text:`singing`,correct:!1,explanation:`'singing' là sở thích ca hát.`}]},{q:`What do you like doing in your free time? ♟️ (Tôi thích chơi cờ vua)`,a:[{text:`I like playing chess.`,correct:!0,explanation:`Đúng rồi! 'chess' là môn cờ vua trí tuệ.`},{text:`I like play chess.`,correct:!1,explanation:`Sau 'like' cần động từ dạng V-ing ('playing').`},{text:`I likes pl ear' là ở gần đó.`}]},{q:`Vị trí 'ở ngay bên cạnh' một vật khác tiếng Anh là cụm từ nào? 🪑🛋️`,a:[{text:`next to`,correct:!0,explanation:`Chính xác! 'next to' nghĩa là sát cạnh, liền kề.`},{text:`under`,correct:!1,explanation:`'under' là ở bên dưới gầm.`},{text:`on`,correct:!1,explanation:`'on' là ở bên trên mặt.`},{text:`in`,correct:!1,explanation:`'in' là ở bên trong lòng.`}]},{q:`Sắp xếp chữ cái thành từ chỉ khu vườn xinh đẹp: 'd - r - g - e - a - n' 🌺`,a:[{text:`garden`,correct:!0,explanation:`Tuyệt vời! 'garden' là khu vườn trồng hoa cỏ rực rỡ.`},{text:`gardne`,correct:!1,explanation:`Chữ e và n bị đảo vị trí sai.`},{text:`danger`,correct:!1,explanation:`Từ này nghĩa là nguy hiểm, không phải khu vườn.`},{text:`gender`,correct:!1,explanation:`Từ này mang nghĩa khác hoàn toàn.`}]},{q:`Từ nào KHÔNG CÙNG NHÓM với các phòng trong nhà: bedroom, bathroom, kitchen, rubber 🏠`,a:[{text:`rubber`,correct:!0,explanation:`Chính xác! 'rubber' (cục tẩy) là đồ dùng học tập, còn bedroom, bathroom, kitchen là các phòng trong nhà.`},{text:`bedroom`,correct:!1,explanation:`'bedroom' là phòng ngủ.`},{text:`bathroom`,correct:!1,explanation:`'bathroom' là phòng tắm.`},{text:`kitchen`,correct:!1,explanation:`'kitchen' là phòng bếp.`}]},{q:`Would you like some milk? 🥛 (Bạn có muốn uống một chút sữa không? - Có, làm ơn)`,a:[{text:`Yes, please.`,correct:!0,explanation:`Chính xác! Khi được mời đồ ăn thức uống, lời đồng ý lịch sự là 'Yes, please.'`},{text:`Yes, I do.`,correct:!1,explanation:`Câu hỏi là 'Would you like...?', không dùng trợ động từ 'do'.`},{text:`No, please.`,correct:!1,explanation:`Từ chối lịch sự phải nói 'No, thanks.' chứ không dùng 'No, please.'`},{text:`Yes, I am.`,correct:!1,explanation:`Không dùng động từ to be 'am' ở đây.`}]},{q:`Khi muốn từ chối một lời mời đồ ăn một cách lịch sự, em nói: 🍽️`,a:[{text:`No, thanks.`,correct:!0,explanation:`Đúng rồi! 'No, thanks.' mang ý nghĩa 'Dạ thôi, mình cảm ơn nhé!'.`},{text:`No, I don't.`,correct:!1,explanation:`Đây là câu trả lời ck, puzzle là các món đồ chơi.`},{text:`teddy bear`,correct:!1,explanation:`'teddy bear' là gấu bông đồ chơi.`},{text:`truck`,correct:!1,explanation:`'truck' là xe tải đồ chơi.`},{text:`puzzle`,correct:!1,explanation:`'puzzle' là bộ ghép hình đồ chơi.`}]},{q:`What are you doing? 📺 (Tôi đang ngồi xem phim hoạt hình trên tivi)`,a:[{text:`I am watching TV.`,correct:!0,explanation:`Đúng rồi! Cấu trúc thì hiện tại tiếp diễn với 'I' là 'I am + V-ing' ('watching TV').`},{text:`I am watch TV.`,correct:!1,explanation:`Sau 'am' động từ phải thêm đuôi -ing ('watching').`},{text:`I watching TV.`,correct:!1,explanation:`Thiếu động từ to be 'am'.`},{text:`I is watching TV.`,correct:!1,explanation:`Chủ ngữ 'I' không bao giờ đi với 'is'.`}]},{q:`What is Mary doing? 📖 (Mary đang đọc truyện tranh trong phòng)`,a:[{text:`She is reading a comic book.`,correct:!0,explanation:`Chính xác! Mary là bạn nữ nên dùng 'She is reading...'.`},{text:`He is reading a comic book.`,correct:!1,explanation:`Mary là nữ nên không dùng 'He'.`},{text:`She are reading a comic book.`,correct:!1,explanation:`'She' là số ít nên đi với 'is', không đi với 'are'.`},{text:`She is read a comic book.`,correct:!1,explanation:`Thiếu đuôi -ing ở động từ 'read'.`}]},{q:`Hành động đạp xe đạp dạo quanh công viên tiếng Anh là gì? 🚴`,a:[{text:`cycling`,correct:!0,explanation:`Tuyệt vời! Đạp xe là 'cycling' (hoặc 'riding a bike').`},{text:`skating`,correct:!1,explanation:`'skating' là trượt pa-tin.`},{text:`running`,correct:!1,explanation:`'running' là chạy bộ.`},{text:`walking`,correct:!1,explanation:`'walking' là đi bộ dạo mát.`}]},{q:`What is your brother doing in the park? 🪁 (Anh ấy đang thả diều trong gió)`,a:[{text:`He is flying a kite.`,correct:!0,explanation:`Đúng rồi! Thả diều là cụm từ 'flying a kite'.`},{text:`He flying a kite.`,correct:!1,explanation:`Thiếu động từ to be 'is'.`},{text:`He is fly a kite.`,correct:!1,explanation:`Động từ 'fly' chưa thêm đuôi -ing.`},{text:`She is flying a kite.`,correct:!1,explanation:`'brother' là nam giới nên phải dùng 'He'.`}]},{q:`Các bạn nữ đang nhảy dây rất vui ngoài sân trường. 'Nhảy dây' tiếng Anh là gì? 🪢`,a:[{text:`skipping`,correct:!0,explanation:`Chính xác! Nhảy dây là 'skipping' (nhớ gấp đôi chữ p khi thêm -ing).`},{text:`singing`,correct:!1,explanation:`'singing' là ca hát.`},{text:`dancing`,correct:!1,explanation:`'dancing' là khiêu vũ.`},{text:`swimming`,correct:!1,explanation:`'swimming' là bơi lội.`}]},{q:`What are they doing in the school yard? ⚽ (Họ đang chơi bóng đá sôi nổi)`,a:[{text:`They are playing football.`,correct:!0,explanation:`Đúng rồi! Chủ ngữ 'They' đi với 'are + V-ing' ('playing football').`},{text:`They is playing football.`,correct:!1,explanation:`'They' không đi với 'is'.`},{text:`They are play football.`,correct:!1,explanation:`Động từ 'play' chưa thêm -ing.`},{text:`They playing football.`,correct:!1,explanation:`Thiếu động từ to be 'are'.`}]},{q:`Hành động lắng nghe những giai điệu âm nhạc vui tươi trong tiếng Anh là gì? 🎧`,a:[{text:`listening to music`,correct:!0,explanation:`Rất chuẩn! Cụm từ nghe nhạc là 'listening to music'.`},{text:`watching music`,correct:!1,explanation:`Không nói 'watching music' (xem âm nhạc).`},{text:`reading music`,correct:!1,explanation:`Không dùng 'reading music' trong ngữ cảnh nghe giải trí.`},{text:`singing music`,correct:!1,explanation:`Người ta nói 'singing a song' chứ không nói 'singing music'.`}]},{q:`Hành động vẽ một bức tranh phong cảnh thiên nhiên tiếng Anh là gì? 🖌️`,a:[{text:`drawing a picture`,correct:!0,explanation:`Chính xác! 'drawing a picture' là vẽ một bức tranh.`},{text:`reading a picture`,correct:!1,explanation:`Không dùng 'reading a picture' (đọc tranh).`},{text:`singing a picture`,correct:!1,explanation:`Không dùng 'singing a picture'.`},{text:`cooking a picture`,correct:!1,explanation:`Không có cụm từ này.`}]},{q:`Điền dạng đúng của động từ: 'Look! The girls are ___ in the playground.' 💃`,a:[{text:`dancing`,correct:!0,explanation:`Đúng rồi! Sau 'are' diễn tả hành động đang diễn ra trước mắt dùng 'dancing' (bỏ đuôi e rồi thêm ing).`},{text:`dance`,correct:!1,explanation:`Chưa chia đuôi -ing.`},{text:`danceing`,correct:!1,explanation:`Sai quy tắc chính tả khi thêm ing vào động từ tận cùng bằng chữ e.`},{text:`danced`,correct:!1,explanation:`Đây là dạng quá khứ, không phù hợp với 'are'.`}]},{q:`Sắp xếp chữ cái thành từ chỉ hành động bơi lội: 'i - m - s - w - m - n - i - g' 🏊`,a:[{text:`swimming`,correct:!0,explanation:`Tuyệt vời! 'swimming' (bơi lội) gấp đôi chữ m trước khi thêm ing.`},{text:`swiming`,correct:!1,explanation:`Sai chính tả vì thiếu một chữ m.`},{text:`simming`,correct:!1,explanation:`Thiếu chữ w.`},{text:`swinming`,correct:!1,explanation:`Viết sai chữ m thành n.`}]},{q:`Trò chơi trốn tìm đuổi bắt rất thú vị của học sinh là gì? 🙈`,a:[{text:`hide-and-seek`,correct:!0,explanation:`Chính xác! Trò chơi trốn tìm là 'hide-and-seek'.`},{text:`blind man's bluff`,correct:!1,explanation:`Trò chơi bịt mắt bắt dê.`},{text:`table tennis`,correct:!1,explanation:`Môn bóng bàn.`},{text:`tug of war`,correct:!1,explanation:`Trò chơi kéo co.`}]},{q:`Trò chơi dân gian bịt mắt bắt dê trong tiếng Anh gọi là gì? 🐐`,a:[{text:`blind man's bluff`,correct:!0,explanation:`Xuất sắc! Bịt mắt bắt dê là 'blind man's bluff'.`},{text:`hide-and-seek`,correct:!1,explanation:`Trò chơi trốn tìm.`},{text:`football`,correct:!1,explanation:`Môn bóng đá.`},{text:`chess`,correct:!1,explanation:`Môn cờ vua.`}]},{q:`What can you see at the zoo? 🐘 (Tôi có thể nhìn thấy một chú voi to lớn)`,a:[{text:`I can see an elephant.`,correct:!0,explanation:`Chính xác! 'elephant' bắt đầu bằng nguyên âm 'e' nên phải dùng mạo từ 'an'.`},{text:`I can see a elephant.`,correct:!1,explanation:`Dùng sai mạo từ 'a' trước nguyên âm 'e'.`},{text:`I can see elephant.`,correct:!1,explanation:`Thiếu mạo từ trước danh từ số ít.`},{text:`I can sees an elephant.`,correct:!1,explanation:`Sau động từ khuyết thiếu 'can' động từ giữ nguyên thể, không thêm 's'.`}]},{q:`Chú khỉ tinh nghịch hay leo trèo thoăn thoắt trên cây tiếng Anh là gì? 🐒`,a:[{text:`monkey`,correct:!0,explanation:`Đúng rồi! Con khỉ leo trèo là 'monkey'.`},{text:`tiger`,correct:!1,explanation:`'tiger' là con hổ dũng mãnh.`},{text:`bear`,correct:!1,explanation:`'bear' là chú gấu to lớn.`},{text:`zebra`,correct:!1,explanation:`'zebra' là con ngựa vằn.`}]},{q:`Loài động vật có sọc đen trắng vằn vện khắp người trong thảo nguyên là gì? 🦓`,a:[{text:`zebra`,correct:!0,explanation:`Tuyệt vời! Con ngựa vằn là 'zebra'.`},{text:`horse`,correct:!1,explanation:`'horse' là con ngựa thường.`},{text:`donkey`,correct:!1,explanation:`'donkey' là con lừa.`},{text:`tiger`,correct:!1,explanation:`'tiger' là con hổ vằn cam đen.`}]},{q:`Loài động vật cao kều có chiếc cổ dài ngoằng để ăn lá trên ngọn cây là gì? 🦒`,a:[{text:`giraffe`,correct:!0,explanation:`Chính xác! Hươu cao cổ trong tiếng Anh là 'giraffe'.`},{text:`elephant`,correct:!1,explanation:`'elephant' là con voi có vòi dài.`},{text:`kangaroo`,correct:!1,explanation:`'kangaroo' là con chuột túi nhảy xa.`},{text:`lion`,correct:!1,explanation:`'lion' là chú sư tử bờm rậm.`}]},{q:`Chúa sơn lâm gầm vang với bộ lông bờm hùng dũng tiếng Anh là gì? 🦁`,a:[{text:`lion`,correct:!0,explanation:`Đúng rồi! Sư tử dũng mãnh là 'lion'.`},{text:`tiger`,correct:!1,explanation:`'tiger' là con hổ có vằn.`},{text:`leopard`,correct:!1,explanation:`'leopard' là con báo đốm.`},{text:`wolf`,correct:!1,explanation:`'wolf' là con chó sói.`}]},{q:`Loài chuột túi ở nước Úc có chiếc túi nhỏ trước bụng để nuôi con là gì? 🦘`,a:[{text:`kangaroo`,correct:!0,explanation:`Rất chuẩn! Chuột túi là 'kangaroo'.`},{text:`rabbit`,correct:!1,explanation:`'rabbit' là con thỏ nhà.`},{text:`koala`,correct:!1,explanation:`'koala' là gấu túi trèo cây bạch đàn.`},{text:`panda`,correct:!1,explanation:`'panda' là gấu trúc ăn tre trúc.`}]},{q:`Loài cá sấu khổng lồ có hàm răng sắc nhọn sống dưới đầm lầy là gì? 🐊`,a:[{text:`crocodile`,correct:!0,explanation:`Chính xác! Con cá sấu là 'crocodile' (hoặc 'alligator').`},{text:`hippo`,correct:!1,explanation:`'hippo' là con hà mã to lớn.`},{text:`snake`,correct:!1,explanation:`'snake' là con rắn bò trườn.`},{text:`lizard`,correct:!1,explanation:`'lizard' là con thằn lằn.`}]},{q:`Chú hà mã to béo thích ngâm mình dưới đầm nước mát gọi là gì? 🦛`,a:[{text:`hippo`,correct:!0,explanation:`Tuyệt vời! Con hà mã gọi ngắn gọn là 'hippo' (tên đầy đủ là 'hippopotamus').`},{text:`rhino`,correct:!1,explanation:`'rhino' là con tê giác có sừng nhọn.`},{text:`elephant`,correct:!1,explanation:`'elephant' là con voi.`},{text:`bear`,correct:!1,explanation:`'bear' là con gấu nâu.`}]},{q:`Sắp xếp chữ cái thành từ chỉ con voi to lớn: 'p - t - n - a - h - l - e - e' 🐘`,a:[{text:`elephant`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'elephant' (con voi).`},{text:`elephtan`,correct:!1,explanation:`Chữ a và n bị sai vị trí.`},{text:`elehpatn`,correct:!1,explanation:`Sai chính tả.`},{text:`elepahtn`,correct:!1,explanation:`Sai thứ tự các chữ cái.`}]},{q:`Chọn từ còn thiếu điền vào câu giao tiếp chào hỏi: 'Nice to ___ you, Nam!' 👋`,a:[{text:`meet`,correct:!0,explanation:`Đúng rồi! Cụm từ quen thuộc khi gặp gỡ là 'Nice to meet you' (Rất vui được gặp bạn).`},{text:`meat`,correct:!1,explanation:`'meat' là miếng thịt ăn (đồng âm nhưng khác nghĩa và chính tả).`},{text:`meeting`,correct:!1,explanation:`Sau 'to' dùng động từ nguyên thể 'meet'.`},{text:`see you`,correct:!1,explanation:`Nếu dùng see thì không cần thêm 'you' thừa phía sau.`}]},{q:`Tìm lỗi sai trong câu sau: 'She have three small goldfish in the tank.' 🐟`,a:[{text:`have -> has`,correct:!0,explanation:`Chính xác! Chủ ngữ ngôi thứ 3 số ít 'She' phải đi với 'has', không dùng 'have'.`},{text:`three -> third`,correct:!1,explanation:`'three' chỉ số lượng là đúng.`},{text:`goldfish -> goldfishes`,correct:!1,explanation:`'goldfish' số nhiều vẫn giữ nguyên hình thức.`},{text:`tank -> tanks`,correct:!1,explanation:`'the tank' số ít là hoàn toàn bình thường.`}]},{q:`Tìm lỗi sai trong câu sau: 'How old is your brothers? - They are eight.' 👦👦`,a:[{text:`is -> are`,correct:!0,explanation:`Rất giỏi! 'your brothers' là danh từ số nhiều (có 's') nên động từ to be phải là 'are'.`},{text:`How -> What`,correct:!1,explanation:`Hỏi tuổi bắt buộc dùng 'How old'.`},{text:`They -> He`,correct:!1,explanation:`Hai anh em số nhiều phải dùng 'They'.`},{text:`are -> is`,correct:!1,explanation:`Chủ ngữ 'They' đi với 'are' là hoàn toàn đúng.`}]},{q:`Hoàn thành đoạn hội thoại: A: 'Can you swim, Lucy?' - B: 'No, I ___.' 🏊‍♀️`,a:[{text:`can't`,correct:!0,explanation:`Đúng rồi! Trả lời phủ định cho câu hỏi 'Can you...?' là 'No, I can't' (cannot).`},{text:`can`,correct:!1,explanation:`Đã trả lời 'No' thì không dùng khẳng định 'can'.`},{text:`am not`,correct:!1,explanation:`Câu hỏi dùng 'Can', không dùng động từ to be 'am'.`},{text:`don't`,correct:!1,explanation:`Câu hỏi dùng 'Can', không dùng trợ động từ 'don't'.`}]},{q:`Sắp xếp các từ sau thành câu hoàn chỉnh: 'many / do / How / books / have / you / ?' 📚`,a:[{text:`How many books do you have?`,correct:!0,explanation:`Chính xác! Cấu trúc hỏi số lượng: How many + Danh từ số nhiều + do you have?`},{text:`How books many do you have?`,correct:!1,explanation:`Cụm 'How many' không được tách rời.`},{text:`How many you have do books?`,correct:!1,explanation:`Sai trật tự trợ động từ và chủ ngữ.`},{text:`Do you have how many books?`,correct:!1,explanation:`Trong câu hỏi IOE, từ để hỏi 'How many' phải đứng đầu câu.`}]},{q:`Sắp xếp các từ sau thành câu hoàn chỉnh: 'playing / the / in / They / are / park / . ' 🛝`,a:[{text:`They are playing in the park.`,correct:!0,explanation:`Xuất sắc! Trật tự câu đúng: Chủ ngữ (They) + to be (are) + V-ing (playing) + nơi chốn (in the park).`},{text:`They playing are in the park.`,correct:!1,explanation:`Trợ động từ 'are' phải đứng trước động từ V-ing 'playing'.`},{text:`Are they playing in the park.`,correct:!1,explanation:`Đây là câu hỏi, trong khi câu đề bài có dấu chấm kết thúc.`},{text:`They are in the park playing.`,correct:!1,explanation:`Trật tự tự nhiên nhất là động từ đứng trước cụm giới từ chỉ nơi chốn.`}]},{q:`What time do you get up on school days?`,a:[{text:`At seven o'clock.`,correct:!0,explanation:`We use 'at' with a clock time.`},{text:`In seven o'clock.`,correct:!1,explanation:`Use 'at', not 'in', before a clock time.`},{text:`On seven o'clock.`,correct:!1,explanation:`'On' is not used with a clock time.`},{text:`Seven o'clocks.`,correct:!1,explanation:`The time expression is 'seven o'clock'.`}]},{q:`Which day comes after Tuesday?`,a:[{text:`Wednesday`,correct:!0,explanation:`Wednesday follows Tuesday.`},{text:`Monday`,correct:!1,explanation:`Monday comes before Tuesday.`},{text:`Thursday`,correct:!1,explanation:`Thursday comes after Wednesday.`},{text:`Friday`,correct:!1,explanation:`Friday is later in the week.`}]},{q:`How many months are there in a year?`,a:[{text:`Twelve`,correct:!0,explanation:`A year has twelve months.`},{text:`Ten`,correct:!1,explanation:`A year does not have ten months.`},{text:`Seven`,correct:!1,explanation:`Seven is the number of days in a week.`},{text:`Twenty`,correct:!1,explanation:`Twenty is too many.`}]},{q:`My sister ___ two dolls.`,a:[{text:`has`,correct:!0,explanation:`Use 'has' with he, she or it.`},{text:`have`,correct:!1,explanation:`'Have' is used with I, you, we and they.`},{text:`having`,correct:!1,explanation:`The sentence needs a present simple verb.`},{text:`haves`,correct:!1,explanation:`'Haves' is not the correct form.`}]},{q:`We ___ English on Monday.`,a:[{text:`study`,correct:!0,explanation:`'We study' is the present simple form.`},{text:`studies`,correct:!1,explanation:`'Studies' is used with he, she or it.`},{text:`studying`,correct:!1,explanation:`The sentence needs a finite verb.`},{text:`studied`,correct:!1,explanation:`The exercise describes a regular routine.`}]},{q:`Look! The baby ___ now.`,a:[{text:`is sleeping`,correct:!0,explanation:`'Look!' signals an action happening now.`},{text:`sleep`,correct:!1,explanation:`Use the present continuous after 'Look!'.`},{text:`sleeps`,correct:!1,explanation:`'Sleeps' describes a habit, not this moment.`},{text:`sleeping is`,correct:!1,explanation:`The word order is incorrect.`}]},{q:`There ___ three books on my desk.`,a:[{text:`are`,correct:!0,explanation:`Use 'are' with a plural noun.`},{text:`is`,correct:!1,explanation:`'Is' is for one thing.`},{text:`am`,correct:!1,explanation:`'Am' is used with I.`},{text:`be`,correct:!1,explanation:`The sentence needs 'are'.`}]},{q:`There is ___ orange in the bag.`,a:[{text:`an`,correct:!0,explanation:`Use 'an' before the vowel sound in orange.`},{text:`a`,correct:!1,explanation:`Use 'an' before a vowel sound.`},{text:`some`,correct:!1,explanation:`The sentence names one orange.`},{text:`any`,correct:!1,explanation:`'Any' is usually used in questions or negatives.`}]},{q:`Can your brother swim?`,a:[{text:`Yes, he can.`,correct:!0,explanation:`This is the short affirmative answer with 'can'.`},{text:`Yes, he is.`,correct:!1,explanation:`The question uses the modal 'can'.`},{text:`Yes, he does.`,correct:!1,explanation:`'Does' does not answer a can question.`},{text:`Yes, he has.`,correct:!1,explanation:`'Has' is not used here.`}]},{q:`Which question asks about a place?`,a:[{text:`Where is the library?`,correct:!0,explanation:`'Where' asks about a place.`},{text:`Who is she?`,correct:!1,explanation:`'Who' asks about a person.`},{text:`When is lunch?`,correct:!1,explanation:`'When' asks about time.`},{text:`What is it?`,correct:!1,explanation:`'What' asks about a thing.`}]},{q:`The opposite of 'clean' is ___.`,a:[{text:`dirty`,correct:!0,explanation:`'Dirty' is the opposite of clean.`},{text:`tidy`,correct:!1,explanation:`'Tidy' is similar to clean.`},{text:`new`,correct:!1,explanation:`'New' is not the opposite of clean.`},{text:`bright`,correct:!1,explanation:`'Bright' describes light or colour.`}]},{q:`The opposite of 'tall' is ___.`,a:[{text:`short`,correct:!0,explanation:`'Short' is the opposite of tall.`},{text:`long`,correct:!1,explanation:`'Long' describes length.`},{text:`big`,correct:!1,explanation:`'Big' describes size.`},{text:`strong`,correct:!1,explanation:`'Strong' describes power.`}]},{q:`Which word is a school subject?`,a:[{text:`Science`,correct:!0,explanation:`Science is a school subject.`},{text:`Kitchen`,correct:!1,explanation:`A kitchen is a room.`},{text:`Teacher`,correct:!1,explanation:`A teacher is a person.`},{text:`Bicycle`,correct:!1,explanation:`A bicycle is a vehicle.`}]},{q:`We use a ___ to cut paper.`,a:[{text:`pair of scissors`,correct:!0,explanation:`Scissors are used for cutting paper.`},{text:`ruler`,correct:!1,explanation:`A ruler measures or draws lines.`},{text:`pencil case`,correct:!1,explanation:`A pencil case stores pencils.`},{text:`glue`,correct:!1,explanation:`Glue sticks things together.`}]},{q:`Please ___ the door quietly.`,a:[{text:`close`,correct:!0,explanation:`'Close' is the verb needed after 'please'.`},{text:`closes`,correct:!1,explanation:`The base form follows 'please'.`},{text:`closing`,correct:!1,explanation:`The base form is needed here.`},{text:`closed`,correct:!1,explanation:`'Closed' is not an instruction form.`}]},{q:`What do you wear on your feet?`,a:[{text:`Shoes`,correct:!0,explanation:`We wear shoes on our feet.`},{text:`Gloves`,correct:!1,explanation:`We wear gloves on our hands.`},{text:`Hat`,correct:!1,explanation:`A hat goes on the head.`},{text:`Scarf`,correct:!1,explanation:`A scarf goes around the neck.`}]},{q:`Which animal can fly?`,a:[{text:`Eagle`,correct:!0,explanation:`An eagle is a flying bird.`},{text:`Elephant`,correct:!1,explanation:`An elephant cannot fly.`},{text:`Rabbit`,correct:!1,explanation:`A rabbit cannot fly.`},{text:`Turtle`,correct:!1,explanation:`A turtle cannot fly.`}]},{q:`Which animal gives us milk?`,a:[{text:`Cow`,correct:!0,explanation:`Cows give milk.`},{text:`Lion`,correct:!1,explanation:`A lion is a wild cat.`},{text:`Snake`,c
