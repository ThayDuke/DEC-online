        body:not([data-theme="elegant"]) {
            color-scheme: only light;
        }

        body {
            font-family: "Be Vietnam Pro", sans-serif;
            background-color: var(--bg-color);
            background-image: var(--shell-background-image);
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: var(--lesson-page-align-y);
            overflow-x: hidden;
        }

        /* BUBBLES */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background-color: var(--ulti-rgba-255-255-255-05);
            border-radius: 50%;
            animation: rise 10s infinite ease-in;
        }

        @keyframes rise {
            0% {
                bottom: -100px;
                transform: translateX(0);
            }

            50% {
                transform: translateX(100px);
            }

            100% {
                bottom: 1080px;
                transform: translateX(-200px);
            }
        }

        /* CONTAINER */
        .app-container {
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            max-width: var(--lesson-frame-width);
            background-color: var(--container-bg);
            border: 1px solid var(--border-main);
            border-radius: 22px;
            box-shadow: 0 22px 50px var(--ulti-rgba-28-62-95-016);
            display: flex;
            flex-direction: column;
            padding: 22px;
            margin: 0 auto 20px;
            position: relative;
            min-height: 480px;
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        .app-container::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: var(--accent-height);
            background: linear-gradient(90deg, var(--ulti-hex-e91e63), var(--ulti-hex-00acc1));
            z-index: 1;
            pointer-events: none;
        }

        .header-area {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: var(--lesson-header-margin-bottom);
            min-height: var(--lesson-header-min-height);
        }


        h1 {
            font-family: "Be Vietnam Pro", sans-serif;
            text-align: center;
            color: var(--primary-pink);
            font-weight: var(--font-weight-extra);
            font-size: var(--lesson-title-font-size);
            margin: var(--lesson-title-margin);
            text-transform: none;
            zoom: 0.7;
            line-height: var(--lesson-title-line-height);
            width: 100%;
        }

        #lesson-title.dec-ui-game-title {
            font-family: "Be Vietnam Pro", sans-serif;
            font-weight:var(--font-weight-extra);
            font-size: clamp(1.8rem, 2.5vw, 2.2rem);
            letter-spacing: 0.0625rem;
            text-align: center;
            background: var(--accent-gradient, var(--btn-secondary-bg));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: var(--color-transparent, transparent);
            color: var(--color-transparent, transparent);
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            text-transform: none;
            zoom: 0.7;
            width: 100%;
        }

        /* Overrides for IPA specific header layout */
        body[data-mode="ipa"] .header-area {
            flex-direction: column;
            margin-bottom: 2px;
            min-height: auto;
        }

        body[data-mode="ipa"] .app-logo {
            display: none;
        }

        body[data-mode="ipa"] h1 {
            font-size: var(--lesson-title-font-size);
            margin: var(--lesson-title-margin);
            width: 100%;
            line-height: var(--lesson-title-line-height);
            padding: var(--lesson-title-padding);
            letter-spacing: 0;
        }

        body[data-mode="ipa"] .timer-display {
            display: none !important;
        }

        /* TIMER CLOCK */
        .timer-display {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--ulti-rgba-255-255-255-095);
            color: var(--text-color);
            border: 1px solid var(--border-pink);
            padding: 5px 0;
            width: 116px;
            text-align: center;
            border-radius: 14px;
            font-size: 1.02rem;
            font-weight: var(--font-weight-strong);
            box-shadow: 0 4px 10px var(--ulti-rgba-0-0-0-01);
            display: none;
            transition: all 0.3s;
            z-index: 50;
            font-variant-numeric: tabular-nums;
        }

        .timer-display.is-visible {
            display: block;
        }

        .timer-display.low-time {
            background: var(--ulti-hex-fff0f0);
            border-color: var(--danger-red);
            color: var(--danger-red);
            animation: pulse 1s infinite;
        }

        .timer-display.paused {
            background: var(--ulti-hex-fff8e1);
            border-color: var(--orange-btn);
            color: var(--ulti-hex-555);
            opacity: 0.8;
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* SEGMENTED PROGRESS BAR */
        .progress-container {
            width: 100%;
            height: var(--adaptive-progress-height);
            display: flex;
            justify-content: center;
            gap: var(--adaptive-progress-gap);
            margin-bottom: calc(var(--accent-height) * 4);
            background: none;
        }

        .progress-container.wrap-mode {
            flex-wrap: wrap !important;
            height: auto !important;
        }

        .progress-container.wrap-mode .progress-segment {
            flex: 0 0 calc((100% - (29 * var(--adaptive-progress-gap))) / 30) !important;
            box-sizing: border-box !important;
        }

        .progress-segment {
            flex: 1;
            height: var(--adaptive-progress-height);
            border: var(--adaptive-progress-border-width) solid var(--border-main);
            border-radius: var(--adaptive-progress-segment-radius);
            background: var(--adaptive-progress-empty-bg);
            color: var(--adaptive-progress-empty-text);
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: var(--font-weight-strong);
            cursor: pointer;
            user-select: none;
            transition: background var(--adaptive-progress-motion), border-color var(--adaptive-progress-motion), color var(--adaptive-progress-motion), box-shadow var(--adaptive-progress-motion), transform var(--adaptive-progress-motion);
        }

        .progress-segment:hover:not(.active) {
            background-color: var(--progress-hover-bg);
            transform: translateY(-1px);
        }

        .progress-segment.disabled {
            cursor: default;
            pointer-events: none;
        }

        .progress-segment.done {
            background: var(--adaptive-progress-done-bg);
            color: var(--adaptive-progress-done-text);
        }

        .progress-segment.warn {
            background: var(--adaptive-progress-warn-bg);
            color: var(--adaptive-progress-warn-text);
        }

        .progress-segment.active {
            flex-grow: 2.25;
            min-width: 4.5rem;
            background: var(--adaptive-progress-active-bg);
            color: var(--adaptive-progress-active-text);
            border-color: var(--adaptive-progress-active-bg);
        }

        @media (max-width: 640px) {
            .progress-segment.active {
                min-width: 4rem;
            }
        }

        #display-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .flashcard {
            background: var(--card-bg);
            border: 1px solid var(--border-main);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            text-align: center;
            box-shadow: 0 5px 15px var(--ulti-rgba-0-0-0-005);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            /* Anchor for top/middle/bottom */
            transition: all 0.3s ease;
            position: relative;
            min-height: 280px;
        }

        .card-top-area,
        .card-bottom-area {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        .card-middle-area {
            flex: 0 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 0;
        }

        /* Overrides for IPA specific flashcard style */
        body[data-mode="ipa"] .flashcard {
            border-style: solid;
            border-width: calc(1px / var(--focus-zoom, 1)) !important;
        }

        /* --- IPA SPECIFIC FOCUS MODE --- */

            100% {
                transform: translateY(-30px);
                opacity: 0;
            }
        }

        .speech-feedback-box {
            margin-top: 15px;
            padding: 15px;
            background: var(--ulti-hex-fff);
            border-radius: 15px;
            border: 2px solid var(--ulti-hex-ccc);
            width: 100%;
            text-align: center;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .speech-feedback-box.is-visible {
            display: block;
        }

        .speech-score-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            color: var(--color-on-accent);
            font-weight: var(--font-weight-strong);
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .score-perfect {
            background: var(--success-green);
            box-shadow: 0 4px 10px var(--ulti-rgba-46-125-50-03);
        }

        .score-good {
            background: var(--orange-btn);
        }

        .score-bad {
            background: var(--danger-red);
        }

        .speech-detail {
            font-size: 1.5em;
            font-family: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
        }

        .speech-detail.compact {
            margin-top: 8px;
            color: var(--ulti-hex-555);
            font-size: 1em;
        }

        .w-correct {
            color: var(--success-green);
            font-weight: var(--font-weight-strong);
        }

        .w-close {
            color: var(--orange-btn);
            font-weight: var(--font-weight-strong);
        }

        .w-wrong {
            color: var(--danger-red);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .w-skip {
            color: var(--ulti-rgba-46-125-50-078);
            font-weight: var(--font-weight-strong);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--ulti-rgba-0-0-0-06);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.is-visible {
            display: flex;
        }

        .modal-content {
            background: var(--surface-solid);
            width: 90%;
            max-width: 450px;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            border: 5px solid var(--primary-pink);
            box-shadow: 0 20px 50px var(--ulti-rgba-0-0-0-03);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .score-title {
            font-size: 2em;
            color: var(--game-purple);
            margin-bottom: 20px;
            font-weight: var(--font-weight-strong);
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.4em;
            border-bottom: 2px solid var(--ulti-hex-eee);
            padding-bottom: 5px;
        }

        .score-val {
            font-weight: var(--font-weight-strong);
            color: var(--primary-pink);
        }

        .score-message {
            margin-top: 20px;
            color: var(--ulti-hex-666);
            font-style: italic;
        }

        .btn-restart {
            background: var(--btn-primary-bg);
            color: var(--color-on-accent);
            border: none;
            padding: 10px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            margin-top: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--accent-height);
            font-family: inherit;
            font-weight: var(--font-weight-strong);
            box-shadow:var(--btn-restart-shadow, 0 0.3125rem 0 var(--ulti-hex-5a4050));
        }

        .btn-restart:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* --- Theme Switcher --- */
        .theme-row {
            display: flex;
            justify-content: flex-end;
            margin: var(--lesson-theme-row-margin);
        }

        body[data-mode="ipa"] .theme-row {
            justify-content: flex-end;
            margin: 0;
        }

        .sub-header-controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            justify-content: stretch;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
            padding: 0 2px;
            position: relative;
            /* Anchor for absolute timer */
        }

        body[data-mode="ipa"] .sub-header-controls {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            min-height: 44px;
        }

        .ipa-study-controls {
            position: absolute;
            left: 0;
            display: inline-flex;
            align-items: center;
            gap: var(--accent-height);
            min-width: 0;
        }

        .ipa-order-toggle {
            height: 38px;
            min-width: 104px;
            padding: 0 12px;
            border: 1px solid var(--border-main);
            border-radius: var(--toggle-height);
            background: var(--surface-solid);
            color: var(--text-color);
            box-shadow: var(--toggle-slider-shadow);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--accent-height);
            font-family: "Be Vietnam Pro", sans-serif;
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            transition: transform 0.24s cubic-bezier(0.32, 0.72, 0, 1), color 0.24s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .ipa-order-toggle-switch {
            display: inline-block;
            position: relative;
            width: 72px;
            height: 36px;
            vertical-align: middle;
            margin: 0 10px 0 0;
            user-select: none;
        }

        .ipa-order-toggle-switch input {
            display: none;
        }

        .ipa-order-toggle-switch .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: var(--btn-primary-bg); /* Nền đỏ hồng cho Thứ tự */
            transition: .4s;
            border-radius: 36px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--toggle-slider-shadow);
            border: 1px solid var(--toggle-slider-border);
            box-sizing: border-box;
            background-clip: padding-box;
        }

        .ipa-order-toggle-switch .slider-knob {
            position: absolute;
            height: 28px;
            width: 28px;
            left: 3px;
            bottom: 3px;
            box-sizing: border-box;
            border-radius: 50%;
            z-index: 2;
            box-shadow: var(--toggle-knob-shadow);
            border: 2px solid transparent;
            background-color: var(--surface-solid);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s ease, background-color 0.4s ease;
        }

        .ipa-order-toggle-switch input:checked + .slider {
            background: var(--btn-secondary-bg); /* Nền xanh teal cho Ngẫu nhiên */
            box-shadow: var(--toggle-slider-checked-shadow);
            border: 1px solid var(--toggle-slider-checked-border);
        }

        .ipa-order-toggle-switch input:checked + .slider .slider-knob {
            transform: translateX(38px);
        }
        
        .ipa-order-toggle-switch .slider-knob i {
            font-size: 0.9rem;
            color: var(--focus-action-text, #19a7a0);
            transition: color 0.4s ease;
        }

        .ipa-order-toggle:hover {
            color: var(--primary-pink);
        }

        .ipa-order-toggle:active {
            transform: scale(0.97);
        }

        .ipa-order-toggle:disabled,
        .ipa-timer-segments .segmented-btn:disabled {
            cursor: not-allowed;
            opacity: 0.58;
        }

        .ipa-timer-segments.segmented-control {
            --segment-size: 27px;
            --segment-padding: 2px;
            --segment-gap: 3px;
            --control-width: calc(var(--segment-size) * 3 + var(--segment-gap) * 2 + var(--segment-padding) * 2 + 3px);

            display: flex;
            align-items: center;
            position: relative;
            width: var(--control-width);
            height: var(--dmu-control-small-height);
            padding: var(--segment-padding);
            gap: var(--segment-gap);
            margin: 0 auto;
            border: 1.5px solid #d5e2ef;
            border-radius: var(--dmu-control-small-height);
            background: rgba(245, 247, 250, 0.9);
            box-shadow: none;
            justify-self: center;
            align-self: center;
            box-sizing: border-box;
        }

        .ipa-timer-segments.segmented-control::before {
            content: "";
            position: absolute;
            top: var(--segment-padding);
            left: var(--segment-padding);
            width: var(--segment-size);
            height: var(--segment-size);
            border-radius: 50%;
            background: var(--btn-secondary-bg);
            transform: translateX(var(--ipa-timer-segment-shift, 0));
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            pointer-events: none;
        }

        .ipa-timer-segments .segmented-btn {
            flex: 0 0 var(--segment-size);
            width: var(--segment-size);
            height: var(--segment-size);
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #4a5c70;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            font-family: "Be Vietnam Pro", sans-serif;
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            transition: color 0.24s cubic-bezier(0.32, 0.72, 0, 1), transform 0.24s cubic-bezier(0.32, 0.72, 0, 1);
            font-size: 0.82rem;
            line-height: 1;
            box-sizing: border-box;
        }

        .ipa-timer-segments .segmented-btn[data-seconds="0"] {
            font-size: 1.25rem;
        }

        .ipa-timer-segments .segmented-btn.active {
            color: #ffffff;
        }

        .ipa-timer-segments .segmented-btn:active {
            transform: scale(0.96);
        }

        .ipa-timer-segments .fa-clock {
            font-size: 0.82em;
        }

        /* Hide focus button by default, show in IPA */
        .focus-toggle-btn {
            display: none;
        }

        body[data-mode="ipa"] .focus-toggle-btn {
            display: inline-flex;
            justify-self: start;
        }

        /* --- New Global Theme Toggle --- */
        .theme-toggle-switch,
        .theme-toggle-switch {
            display: inline-block;
            position: relative;
            width: var(--toggle-width);
            height: var(--toggle-height);
            vertical-align: middle;
            margin: 0;
        }

        .switch-mode.theme-toggle-switch {
            grid-column: 1;
            justify-self: start;
            width: var(--toggle-width);
        }

        .theme-toggle-switch:not(.switch-mode) {
            grid-column: 3;
            justify-self: end;
        }

        .theme-toggle-switch input {
            display: none;
        }

        .theme-toggle-switch .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: var(--toggle-slider-bg);
            transition: .4s;
            border-radius: var(--toggle-height);
            overflow: hidden;
            display: flex;
            align-items: center;
            box-shadow: var(--toggle-slider-shadow);
            border: 1px solid var(--toggle-slider-border);
        }

        .theme-toggle-switch .slider-text {
            width: 100%;
            position: absolute;
            left: var(--toggle-text-youth-left);
            text-align: center;
            color: var(--color-on-accent);
            font-weight: var(--font-weight-strong);
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: .4s;
            user-select: none;
            font-family: "Be Vietnam Pro", sans-serif;
            pointer-events: none;
        }

        .switch-mode.theme-toggle-switch .slider-text {
            left: var(--toggle-text-youth-left);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: normal;
            text-transform: uppercase;
        }

        .theme-toggle-switch:not(.switch-mode) .slider-text {
            color: var(--toggle-text-color);
        }

        .theme-toggle-switch .slider:before {
            position: absolute;
            content: "";
            height: var(--toggle-knob);
            width: var(--toggle-knob);
            left: 4px;
            bottom: 3px;
            box-sizing: border-box;
            border-radius: 50%;
            z-index: 2;
            box-shadow: var(--toggle-knob-shadow);
            transition: transform 0.4s ease, border-color 0.4s ease, background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .theme-toggle-switch:not(.switch-mode) .slider:before {
            border: 2px solid var(--toggle-knob-border);
            background-color: var(--toggle-knob-bg);
        }

        .switch-mode.theme-toggle-switch .slider:before {
            border: 2px solid transparent;
            background-color: var(--surface-solid);
        }

        .theme-toggle-switch input:checked+.slider {
            background: var(--toggle-slider-checked-bg);
            box-shadow:var(--toggle-slider-checked-shadow);
            border: 1px solid var(--toggle-slider-checked-border);
        }

        .theme-toggle-switch:not(.switch-mode) input:checked+.slider .slider-text {
            left: var(--toggle-text-elegant-left);
            color: var(--toggle-text-checked-color);
        }

        .switch-mode.theme-toggle-switch input:checked+.slider .slider-text {
            left: var(--toggle-text-elegant-left);
        }

        .theme-toggle-switch input:checked+.slider:before {
            transform: translateX(var(--toggle-shift));
        }

        body[data-theme="elegant"] .theme-toggle-switch .slider {
            background: var(--toggle-slider-bg);
            box-shadow: var(--toggle-slider-shadow);
        }

        body[data-theme="elegant"] .theme-toggle-switch input:checked+.slider {
            background: var(--toggle-slider-checked-bg);
            box-shadow:var(--toggle-slider-checked-shadow);
        }

        /* ==========================================
           STYLE ĐỀN BÙ CHO NÚT HIỆN/GAME (.switch-mode)
           ========================================== */
        .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider {
            background:var(--ulti-rgba-24-169-162-008);
            border-color:var(--ulti-rgba-25-167-160-02);
            box-shadow:var(--toggle-slider-shadow);

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider {
            background:var(--toggle-slider-bg);
            border-color:var(--toggle-slider-border);

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider {
            background:var(--ulti-rgba-120-144-156-03);
            border-color:var(--ulti-rgba-120-144-156-03);
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider {
            background:var(--toggle-slider-checked-bg);
            border-color:var(--toggle-slider-checked-border);
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider::before {
            background-image: var(--btn-secondary-bg);
            box-shadow: var(--toggle-knob-shadow);
            background-repeat: no-repeat;

            background-clip: border-box;

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider::before {

            box-shadow: var(--toggle-knob-shadow);

            background-size: cover;
            background-clip: border-box;
            background-origin: border-box;
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider::before {
            box-shadow:var(--toggle-knob-shadow);
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider::before {
            box-shadow:var(--toggle-knob-shadow);
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider-text {
            color:var(--text-color);
            font-weight:var(--font-weight-extra);
            text-shadow:var(--color-transparent, transparent);
        }

            output.push(NUMBER_WORDS[token] || token);
        });
        return output;
    }

    function normalizeListeningSurface(text, equivalences) {
        const apostrophes = String(text || '')
            .normalize('NFC')
            .replace(/[’ʼ`]/g, "'")
            .replace(/'{2,}/g, "'");
        let value = applyPhraseEquivalences(apostrophes, equivalences);
        value = value.replace(/[-–—/]+/g, ' ');
        value = value.replace(/[^a-z0-9'\s]/g, ' ');
        return value.replace(/\s+/g, ' ').trim();
    }

    function normalizeListeningParts(text, equivalences) {
        const surface = normalizeListeningSurface(text, equivalences);
        if (!surface) return [];
        return surface.split(' ').map((token) => NUMBER_WORDS[token] || token);
    }

    function normalizeListeningCandidates(candidateInput) {
        const input = Array.isArray(candidateInput) ? candidateInput : [candidateInput];
        const seen = new Set();
        const output = [];
        input.forEach((candidate, inputIndex) => {
            const transcript = typeof candidate === 'string'
                ? candidate
                : String(candidate && candidate.transcript || '');
            const trimmed = transcript.trim();
            if (!trimmed) return;
            const key = normalizeListeningSurface(trimmed, []);
            if (!key || seen.has(key)) return;
            seen.add(key);
            const confidenceValue = typeof candidate === 'object' && candidate !== null
                ? Number(candidate.confidence)
                : NaN;
            const rankValue = typeof candidate === 'object' && candidate !== null
                ? Number(candidate.rank)
                : NaN;
            output.push({
                transcript: trimmed,
                confidence: Number.isFinite(confidenceValue) ? clamp(confidenceValue, 0, 1) : null,
                rank: Number.isFinite(rankValue) ? rankValue : inputIndex
            });
        });
        output.sort((a, b) =>
            confidenceForSort(b) - confidenceForSort(a)
            || a.rank - b.rank
        );
        return output;
    }

    function replaceListeningSequence(parts, surfaceParts, targetParts) {
        if (!surfaceParts.length || surfaceParts.length > parts.length) return null;
        const output = [];
        let changed = false;
        for (let index = 0; index < parts.length;) {
            const matches = surfaceParts.every((part, offset) => parts[index + offset] === part);
            if (matches) {
                output.push(...targetParts);
                index += surfaceParts.length;
                changed = true;
            } else {
                output.push(parts[index]);
                index += 1;
            }
        }
        return changed ? output : null;
    }

    function expandListeningCandidateParts(baseParts, profile) {
        const entries = Array.isArray(profile.candidateEquivalences)
            ? profile.candidateEquivalences
            : [];
        const variants = [{ parts: baseParts, equivalenceCount: 0, equivalenceKinds: [] }];
        const seen = new Set([baseParts.join('\u0001')]);
        let capExceeded = false;

        entries.forEach((entry) => {
            if (variants.length >= MAX_LISTENING_CANDIDATE_VARIANTS) {
                capExceeded = true;
                return;
            }
            const surfaceParts = Array.isArray(entry.surfaceParts)
                ? entry.surfaceParts.map((part) => String(part || '').toLowerCase()).filter(Boolean)
                : [];
            const targetParts = Array.isArray(entry.targetParts)
                ? entry.targetParts.map((part) => String(part || '').toLowerCase()).filter(Boolean)
                : [];
            if (!surfaceParts.length || !targetParts.length) return;
            const snapshot = variants.slice();
            snapshot.forEach((variant) => {
                if (variants.length >= MAX_LISTENING_CANDIDATE_VARIANTS) {
                    capExceeded = true;
                    return;
                }
                const replaced = replaceListeningSequence(variant.parts, surfaceParts, targetParts);
                if (!replaced) return;
                const key = replaced.join('\u0001');
                if (seen.has(key)) return;
                seen.add(key);
                variants.push({
                    parts: replaced,
                    equivalenceCount: variant.equivalenceCount + 1,
                    equivalenceKinds: variant.equivalenceKinds.concat(String(entry.kind || 'contraction'))
                });
            });
        });

        variants.forEach((variant) => {
            variant.capExceeded = capExceeded;
        });
        return variants;
    }

    function normalizedLexicalText(text) {
        return normalizeTokens(text, []).join(' ');
    }

    function levenshtein(a, b) {
        if (a === b) return 0;
        if (!a.length) return b.length;
        if (!b.length) return a.length;
        const previous = Array.from({ length: b.length + 1 }, (_, index) => index);
        const current = new Array(b.length + 1);
        for (let i = 1; i <= a.length; i++) {
            current[0] = i;
            for (let j = 1; j <= b.length; j++) {
                current[j] = a[i - 1] === b[j - 1]
                    ? previous[j - 1]
                    : Math.min(previous[j - 1] + 1, previous[j] + 1, current[j - 1] + 1);
            }
            for (let j = 0; j <= b.length; j++) previous[j] = current[j];
        }
        return previous[b.length];
    }

    function lexicalSimilarity(a, b) {
        if (!a || !b) return a === b ? 1 : 0;
        return 1 - levenshtein(a, b) / Math.max(a.length, b.length);
    }

    function normalizeCandidates(candidateInput) {
        const input = Array.isArray(candidateInput) ? candidateInput : [candidateInput];
        const seen = new Set();
        const output = [];
        input.forEach((candidate, inputIndex) => {
            const transcript = typeof candidate === 'string'
                ? candidate
                : String(candidate && candidate.transcript || '');
            const trimmed = transcript.trim();
            if (!trimmed) return;
            const key = normalizedLexicalText(trimmed);
            if (!key || seen.has(key)) return;
            seen.add(key);
            const confidenceValue = typeof candidate === 'object' && candidate !== null
                ? Number(candidate.confidence)
                : NaN;
            const rankValue = typeof candidate === 'object' && candidate !== null
                ? Number(candidate.rank)
                : NaN;
            output.push({
                transcript: trimmed,
                confidence: Number.isFinite(confidenceValue) ? clamp(confidenceValue, 0, 1) : null,
                rank: Number.isFinite(rankValue) ? Math.max(0, Math.floor(rankValue)) : inputIndex,
                inputIndex
            });
        });
        return output;
    }

    function confidenceBand(confidence) {
        if (confidence === null || !Number.isFinite(confidence)) return 'unavailable';
        if (confidence >= 0.8) return 'high';
        if (confidence >= 0.55) return 'medium';
        return 'low';
    }

    function confidenceForSort(candidate) {
        return candidate.confidence === null ? -1 : candidate.confidence;
    }

    function ipaEquivalent(target, spoken, explicitAliases) {
        const aliases = [];
        const builtIn = IPA_ACOUSTIC_EQUIVALENTS[target];
        if (Array.isArray(builtIn)) aliases.push(...builtIn);
        if (Array.isArray(explicitAliases)) aliases.push(...explicitAliases);
        return aliases.some((alias) => normalizedLexicalText(alias) === spoken);
    }

    function scoreIpaCandidate(profile, candidate) {
        const target = normalizedLexicalText(profile.targetText);
        const spoken = normalizedLexicalText(candidate.transcript);
        const level = normalizeLevel(profile.level);
        const passScore = IPA_PASS_SCORE[level];
        const exact = target && spoken === target;
        const accepted = !exact && target && ipaEquivalent(target, spoken, profile.aliases);
        const similarity = target && spoken ? lexicalSimilarity(target, spoken) : 0;
        let finalScore = 0;
        let status = 'incorrect';

        if (exact) {
            finalScore = 100;
            status = 'correct';
        } else if (accepted) {
            finalScore = 92;
            status = 'accepted';
        } else if (similarity >= 0.8) {
            finalScore = Math.min(passScore - 1, Math.round(55 + similarity * 25));
            status = 'near';
        } else {
            finalScore = Math.round(similarity * 55);
        }

        const targetWords = target ? target.split(' ') : [String(profile.targetText || '')];
        const tokenScores = targetWords.map((word, index) => ({
            id: index,
            display: word,
            status,
            matchRatio: status === 'correct' ? 1 : (status === 'accepted' ? 0.92 : round(similarity, 2)),
            hint: status === 'incorrect'
                ? 'Hệ thống chưa nhận đúng từ. Hãy nghe mẫu và nói lại.'
                : ''
        }));

        return {
            apiVersion: API_VERSION,
            policyVersion: IPA_POLICY_VERSION,
            assessmentMode: 'asr_proxy',
            finalScore,
            rawScore: finalScore,
            isPass: (exact || accepted) && finalScore >= passScore,
            passScore,
            confidenceBand: confidenceBand(candidate.confidence),
            selectedCandidate: candidate.transcript,
            candidateText: candidate.transcript,
            candidateConfidence: candidate.confidence,
            candidateRank: candidate.rank,
            tokenScores,
            missingCritical: [],
            insertions: [],
            deletions: status === 'incorrect' ? targetWords.slice() : [],
            substitutions: status === 'near'
                ? [{ target: target, candidate: spoken }]
                : [],
            extraPenalty: 0,
            earnedWeight: round(finalScore / 100, 2),
            totalWeight: 1,
            diagnostics: {
                targetIpa: String(profile.targetIpa || ''),
                evidence: exact ? 'exact_transcript' : (accepted ? 'approved_acoustic_equivalent' : 'lexical_proxy'),
                lexicalSimilarity: round(similarity, 3)
            }
        };
    }

    function emptyIpaResult(profile) {
        const level = normalizeLevel(profile && profile.level);
        const target = normalizedLexicalText(profile && profile.targetText);
        return {
            apiVersion: API_VERSION,
            policyVersion: IPA_POLICY_VERSION,
            assessmentMode: 'asr_proxy',
            finalScore: 0,
            rawScore: 0,
            isPass: false,
            passScore: IPA_PASS_SCORE[level],
            confidenceBand: 'unavailable',
            selectedCandidate: '',
            candidateText: '',
            candidateConfidence: null,
            candidateRank: -1,
            evaluatedCandidatesCount: 0,
            tokenScores: (target ? target.split(' ') : []).map((word, index) => ({
                id: index,
                display: word,
                status: 'incorrect',
                matchRatio: 0,
                hint: 'Không nhận được giọng nói. Hãy thử lại.'
            })),
            missingCritical: [],
            insertions: [],
            deletions: target ? target.split(' ') : [],
            substitutions: [],
            extraPenalty: 0,
            earnedWeight: 0,
            totalWeight: 1,
            diagnostics: { targetIpa: String(profile && profile.targetIpa || ''), evidence: 'no_transcript' }
        };
    }

    function scoreIpaCandidates(profileInput, candidateInput, legacyLevel) {
        const profile = typeof profileInput === 'string'
            ? { targetText: profileInput, targetIpa: '', level: legacyLevel }
            : Object.assign({}, profileInput || {});
        const candidates = normalizeCandidates(candidateInput);
        if (!candidates.length) return emptyIpaResult(profile);
        const scored = candidates.map((candidate) => scoreIpaCandidate(profile, candidate));
        scored.sort((a, b) =>
            b.finalScore - a.finalScore
            || confidenceForSort(b) - confidenceForSort(a)
            || a.candidateRank - b.candidateRank
        );
        scored[0].evaluatedCandidatesCount = scored.length;
        return scored[0];
    }

    function validateListeningProfile(profile) {
        if (!profile || profile.schemaVersion !== LISTENING_PROFILE_VERSION) {
            throw new Error('Invalid Listening profile schema; expected 3.0.0');
        }
        if (!Array.isArray(profile.tokens) || !profile.tokens.length) {
            throw new Error('Invalid Listening profile: missing tokens');
        }
    }

    function buildListeningTokenParts(token, tokenParts) {
        const parts = [];
        const totalWeight = typeof token.weight === 'number' ? token.weight : 1;
        const partWeight = tokenParts.length ? totalWeight / tokenParts.length : 0;
        const requiredIndexes = Array.isArray(token.requiredPartIndexes)
            ? token.requiredPartIndexes
            : [];
        tokenParts.forEach((part, partIndex) => {
            parts.push({
                tokenId: token.id,
                tokenDisplay: String(token.display || part),
                part: String(part || '').toLowerCase(),
                tokenClass: Array.isArray(token.partClasses)
                    ? token.partClasses[partIndex] || token.tokenClass || 'content'
                    : token.tokenClass || 'content',
                criticalReason: Array.isArray(token.criticalReasons)
                    ? token.criticalReasons[partIndex] || null
                    : token.criticalReason || null,
                isCritical: requiredIndexes.includes(partIndex),
                isIgnored: token.scorePolicy === 'ignored' || totalWeight === 0,
                isNumber: /^\d+$/.test(String(part || '')),
                weight: partWeight,
                homophones: token.homophonesByPart && token.homophonesByPart[partIndex] || [],
                aliases: token.aliasesByPart && token.aliasesByPart[partIndex] || []
            });
        });
        return parts;
    }

    function listeningTokenAlternatives(token) {
        const alternatives = Array.isArray(token.partsAlternatives)
            ? token.partsAlternatives.filter((value) => Array.isArray(value) && value.length)
            : [];
        if (alternatives.length) return alternatives;
        if (Array.isArray(token.parts) && token.parts.length) return [token.parts];
        return [[String(token.canonical || token.display || '').toLowerCase()]];
    }

    function buildListeningTargetParts(profile) {
        return profile.tokens.reduce((parts, token) => {
            parts.push(...buildListeningTokenParts(token, listeningTokenAlternatives(token)[0]));
            return parts;
        }, []);
    }

    function buildListeningTargetPartVariants(profile) {
        let variants = [{ parts: [], variantCount: 0 }];
        let capExceeded = false;
        profile.tokens.forEach((token) => {
            const alternatives = listeningTokenAlternatives(token);
            const next = [];
            const seen = new Set();
            variants.forEach((variant) => {
                alternatives.forEach((alternative, alternativeIndex) => {
                    if (next.length >= MAX_LISTENING_TARGET_VARIANTS) {
                        capExceeded = true;
                        return;
                    }
                    const parts = variant.parts.concat(buildListeningTokenParts(token, alternative));
                    const key = parts.map((part) => `${part.tokenId}:${part.part}`).join('|');
                    if (seen.has(key)) return;
                    seen.add(key);
                    next.push({
                        parts,
                        variantCount: variant.variantCount + (alternativeIndex > 0 ? 1 : 0)
                    });
                });
            });
            variants = next.length ? next : variants;
        });
        variants.forEach((variant) => {
            variant.capExceeded = capExceeded;
        });
        return variants;
    }

    function listeningMatchFactor(targetPart, candidatePart) {
        if (targetPart.part === candidatePart) return 1;
        if (targetPart.homophones.includes(candidatePart)) return 0.98;
        if (!targetPart.isCritical && targetPart.aliases.includes(candidatePart)) return 0.82;
        if (!targetPart.isCritical
            && targetPart.tokenClass === 'content'
            && targetPart.part.length >= 5
            && candidatePart.length >= 5
            && lexicalSimilarity(targetPart.part, candidatePart) >= 0.88) {
            return 0.68;
        }
        return 0;
    }

    function isMovableAdverbPart(targetPart) {
        const part = String(targetPart && targetPart.part || '').toLowerCase();
        return targetPart
            && !targetPart.isCritical
            && !IMMOVABLE_ADVERBS.has(part)
            && (targetPart.tokenClass === 'adverb'
                || MOVABLE_ADVERBS.has(part)
                || (part.length > 4 && part.endsWith('ly')));
    }

    function alignWithMovableAdverb(targetParts, candidateParts) {
        if (targetParts.length !== candidateParts.length) return null;

        const movableIndexes = targetParts.reduce((indexes, part, index) => {
            if (isMovableAdverbPart(part)) indexes.push(index);
            return indexes;
        }, []);
        if (movableIndexes.length !== 1) return null;

        const targetAdverbIndex = movableIndexes[0];
        const candidateAdverbIndex = candidateParts[0] === targetParts[targetAdverbIndex].part
            ? 0
            : candidateParts[candidateParts.length - 1] === targetParts[targetAdverbIndex].part
                ? candidateParts.length - 1
                : -1;
        if (candidateAdverbIndex < 0 || candidateAdverbIndex === targetAdverbIndex) return null;

        const details = Array(targetParts.length).fill(null);
        let candidateIndex = 0;
        for (let targetIndex = 0; targetIndex < targetParts.length; targetIndex++) {
            if (targetIndex === targetAdverbIndex) {
                const adverbFactor = listeningMatchFactor(
                    targetParts[targetIndex],
                    candidateParts[candidateAdverbIndex]
                );
                if (adverbFactor <= 0) return null;
                details[targetIndex] = {
                    factor: adverbFactor,
                    candidateIndex: candidateAdverbIndex,
                    candidate: candidateParts[candidateAdverbIndex]
                };
                continue;
            }
            if (candidateIndex === candidateAdverbIndex) candidateIndex += 1;
            const factor = listeningMatchFactor(targetParts[targetIndex], candidateParts[candidateIndex]);
            if (factor <= 0) return null;
            details[targetIndex] = {
                factor,
                candidateIndex,
                candidate: candidateParts[candidateIndex]
            };
            candidateIndex += 1;
        }

        return {
            details,
            matchedCandidateIndexes: new Set(candidateParts.map((_, index) => index)),
            insertions: [],
            deletions: [],
            substitutions: [],
            transpositions: 0,
            adverbReordered: true
        };
    }

    function insertionUnits(token) {
        return FILLERS.has(token) ? 0.03 : 0.18;
    }

    function alignListening(targetParts, candidateParts) {
        const n = targetParts.length;
        const m = candidateParts.length;
        const adverbAlignment = alignWithMovableAdverb(targetParts, candidateParts);
        if (adverbAlignment) return adverbAlignment;
        const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
        const back = Array.from({ length: n + 1 }, () => Array(m + 1).fill(null));

        for (let i = 1; i <= n; i++) {
            dp[i][0] = dp[i - 1][0];
            back[i][0] = { op: 'delete', previousI: i - 1, previousJ: 0 };
        }
        for (let j = 1; j <= m; j++) {
            dp[0][j] = dp[0][j - 1] - insertionUnits(candidateParts[j - 1]);
            back[0][j] = { op: 'insert', previousI: 0, previousJ: j - 1 };
        }

        for (let i = 1; i <= n; i++) {
            for (let j = 1; j <= m; j++) {
                const target = targetParts[i - 1];
                const candidate = candidateParts[j - 1];
                const factor = listeningMatchFactor(target, candidate);
                const choices = [
                    {
                        value: dp[i - 1][j - 1] + target.weight * factor,
                        op: factor > 0 ? 'match' : 'substitute',
                        factor,
                        previousI: i - 1,
                        previousJ: j - 1
                    },
                    {
                        value: dp[i - 1][j],
                        op: 'delete',
                        factor: 0,
                        previousI: i - 1,
                        previousJ: j
                    },
                    {
                        value: dp[i][j - 1] - insertionUnits(candidate),
                        op: 'insert',
                        factor: 0,
                        previousI: i,
                        previousJ: j - 1
                    }
                ];

                if (i >= 2 && j >= 2
                    && targetParts[i - 2].part === candidateParts[j - 1]
                    && targetParts[i - 1].part === candidateParts[j - 2]) {
                    choices.push({
                        value: dp[i - 2][j - 2]
                            + 0.8 * (targetParts[i - 2].weight + targetParts[i - 1].weight),
                        op: 'transpose',
                        factor: 0.8,
                        previousI: i - 2,
                        previousJ: j - 2
                    });
                }

                choices.sort((a, b) => b.value - a.value);
                dp[i][j] = choices[0].value;
                back[i][j] = choices[0];
            }
        }

        const details = Array(n).fill(null);
        const matchedCandidateIndexes = new Set();
        const insertions = [];
        const deletions = [];
        const substitutions = [];
        let transpositions = 0;
        let i = n;
        let j = m;
        while (i > 0 || j > 0) {
            const step = back[i][j];
            if (!step) break;
            if (step.op === 'match' || step.op === 'substitute') {
                const targetIndex = i - 1;
                const candidateIndex = j - 1;
                if (step.op === 'match') {
                    details[targetIndex] = {
                        factor: step.factor,
                        candidateIndex,
                        candidate: candidateParts[candidateIndex]
                    };
                    matchedCandidateIndexes.add(candidateIndex);
                } else {
                    substitutions.push({
                        target: targetParts[targetIndex].tokenDisplay,
                        candidate: candidateParts[candidateIndex]
                    });
                    matchedCandidateIndexes.add(candidateIndex);
                }
            } else if (step.op === 'delete') {
                deletions.push(targetParts[i - 1].tokenDisplay);
            } else if (step.op === 'insert') {
                insertions.push(candidateParts[j - 1]);
            } else if (step.op === 'transpose') {
                details[i - 2] = { factor: 0.8, candidateIndex: j - 1, candidate: candidateParts[j - 1] };
                details[i - 1] = { factor: 0.8, candidateIndex: j - 2, candidate: candidateParts[j - 2] };
                matchedCandidateIndexes.add(j - 1);
                matchedCandidateIndexes.add(j - 2);
                transpositions++;
            }
            i = step.previousI;
            j = step.previousJ;
        }

        return {
            details,
            matchedCandidateIndexes,
            insertions: insertions.reverse(),
            deletions: deletions.reverse(),
            substitutions: substitutions.reverse(),
            transpositions
        };
    }

    function scoreListeningVariantPair(profile, candidate, level, targetVariant, candidateVariant) {
        const normalizedLevel = normalizeLevel(level || profile.level);
        const passScore = Number(profile.passScore) || (normalizedLevel === 'A' ? 70 : (normalizedLevel === 'C' ? 88 : 80));
        const candidateParts = candidateVariant.parts;
        const targetParts = targetVariant.parts;
        const alignment = alignListening(targetParts, candidateParts);

        let earnedWeight = 0;
        let totalWeight = 0;
        let exactMatches = 0;
        let allWeightedPartsExact = true;
        const missingCriticalSet = new Set();
        targetParts.forEach((part, index) => {
            if (!part.isIgnored) totalWeight += part.weight;
            const detail = alignment.details[index];
            if (detail && !part.isIgnored) {
                earnedWeight += part.weight * detail.factor;
                if (detail.factor === 1) exactMatches += 1;
                else allWeightedPartsExact = false;
            } else if (!part.isIgnored) {
                allWeightedPartsExact = false;
            }
            if (part.isCritical && (!detail || detail.factor < 0.95)) {
                missingCriticalSet.add(part.tokenDisplay.replace(/[.,!?;:"()]/g, ''));
            }
        });
        const missingCritical = Array.from(missingCriticalSet);

        const insertionCost = alignment.insertions.reduce(
            (sum, token) => sum + insertionUnits(token),
            0
        );
        const extraPenalty = totalWeight > 0
            ? round(Math.min(12, 100 * insertionCost / totalWeight), 2)
            : 0;
        let rawScore = totalWeight > 0
            ? Math.round(clamp(100 * earnedWeight / totalWeight - extraPenalty, 0, 100))
            : 0;
        const exactEquivalent = allWeightedPartsExact
            && alignment.insertions.length === 0
            && alignment.deletions.length === 0
            && alignment.substitutions.length === 0
            && alignment.transpositions === 0;
        if (!exactEquivalent && rawScore === 100) rawScore = 99;
        const finalScore = missingCritical.length ? Math.min(rawScore, passScore - 1) : rawScore;

        const tokenScores = profile.tokens.map((token) => {
            const ignored = token.scorePolicy === 'ignored' || token.weight === 0;
            if (ignored) {
                return { id: token.id, display: token.display, status: 'ignored', matchRatio: 1 };
            }
            let tokenEarned = 0;
            let tokenTotal = 0;
            targetParts.forEach((part, index) => {
                if (part.tokenId !== token.id) return;
                tokenTotal += part.weight;
                if (alignment.details[index]) tokenEarned += part.weight * alignment.details[index].factor;
            });
            const ratio = tokenTotal > 0 ? tokenEarned / tokenTotal : 0;
            return {
                id: token.id,
                display: token.display,
                status: ratio >= 0.97 ? 'correct' : (ratio >= 0.8 ? 'accepted' : (ratio >= 0.6 ? 'near' : 'incorrect')),
                matchRatio: round(ratio, 2)
            };
        });

        return {
            apiVersion: API_VERSION,
            policyVersion: LISTENING_POLICY_VERSION,
            assessmentMode: 'asr_proxy',
            finalScore,
            rawScore,
            isPass: missingCritical.length === 0 && finalScore >= passScore,
            passScore,
            confidenceBand: confidenceBand(candidate.confidence),
            selectedCandidate: candidate.transcript,
            candidateText: candidate.transcript,
            candidateConfidence: candidate.confidence,
            candidateRank: candidate.rank,
            tokenScores,
            missingCritical,
            insertions: alignment.insertions,
            deletions: alignment.deletions,
            substitutions: alignment.substitutions,
            transpositions: alignment.transpositions,
            extraPenalty,
            earnedWeight: round(earnedWeight, 2),
            totalWeight: round(totalWeight, 2),
            exactMatches,
            equivalenceCount: candidateVariant.equivalenceCount,
            targetVariantCount: targetVariant.variantCount,
            diagnostics: {
                candidateTokenCount: candidateParts.length,
                targetTokenCount: targetParts.length,
                adverbReordered: Boolean(alignment.adverbReordered),
                equivalenceKinds: candidateVariant.equivalenceKinds,
                candidateVariantCapExceeded: Boolean(candidateVariant.capExceeded),
                targetVariantCapExceeded: Boolean(targetVariant.capExceeded),
                rulesHash: String(profile.rulesHash || '')
            }
        };
    }

    function compareListeningVariantResults(a, b) {
        return a.missingCritical.length - b.missingCritical.length
            || b.finalScore - a.finalScore
            || a.deletions.length - b.deletions.length

        function applyDashboardTheme(theme) {
            const normalizedTheme = theme === 'elegant' ? 'elegant' : 'youth';
            document.body.setAttribute('data-theme', normalizedTheme);

            const toggleCb = document.getElementById('themeToggleCheckbox');
            const toggleTxt = document.getElementById('themeToggleText');
            if (toggleCb) toggleCb.checked = (normalizedTheme === 'elegant');
            if (toggleTxt) toggleTxt.textContent = (normalizedTheme === 'elegant') ? 'ELEGANT' : 'YOUTH';
        }

        function switchTheme(theme) {
            setDashboardTheme(theme);
        }

        function setDashboardTheme(theme) {
            applyDashboardTheme(theme);
            try {
                localStorage.setItem(DASHBOARD_THEME_KEY, theme);
            } catch (err) {
                // localStorage can be blocked in strict browser settings.
            }
        }

        function initDashboardTheme() {
            let savedTheme = null;
            try {
                savedTheme = localStorage.getItem(DASHBOARD_THEME_KEY);

        function startPronunciationCountdown() {
            cancelPronunciationCountdown();
            if (ipaTimeLimit <= 0) return;
            const slot = document.querySelector('.countdown-slot');
            const fill = document.querySelector('.countdown-fill');
            if (!slot || !fill) return;
            const startedAt = performance.now();
            const duration = ipaTimeLimit * 1000;
            const attempt = { completed: false, index: currentIndex };
            activePronunciationAttempt = attempt;
            slot.classList.add('is-active');
            setRuntimeCssVariable(fill, '--ipa-countdown-progress', '1');

            const tick = now => {
                if (activePronunciationAttempt !== attempt || attempt.completed) return;
                const remaining = Math.max(0, 1 - ((now - startedAt) / duration));
                setRuntimeCssVariable(fill, '--ipa-countdown-progress', String(remaining));
                if (remaining > 0) {
                    countdownFrame = requestAnimationFrame(tick);
                    return;
                }
                attempt.completed = true;
                countdownFrame = 0;
                slot.classList.remove('is-active');
                try {
                    if (recognition && btnMic.classList.contains('listening')) recognition.stop();
                } catch (error) {
                    reportRuntimeIssue('Mic timeout stop error', error);
                }
                if (pronunciationGameActive) handlePronunciationGameResult(false, 0);
            };
            countdownFrame = requestAnimationFrame(tick);
        }

        function stripSkipMarkersFromText(text) {
            // Ẩn các ký hiệu đánh dấu (nếu bài có dùng { } hoặc [ ]) để học sinh không "nhìn lén" ngoại lệ.
            return (text || "").replace(/[{}\[\]]/g, "");
        }

        function normalizeWord(word) {
            // Canonical normalization for o'clock and common contractions
            word = (word || "").toLowerCase();

            // Normalize apostrophes (' → ')
            word = word.replace(/[']/g, "'");

            // (A) Normalize o'clock variants
            // o'clock, o clock, oclock → oclock
            word = word.replace(/\bo\s*'?clock\b/g, "oclock");

            // (B) Normalize common contractions → full form (canonical)
            const contractionMap = {
                "i'm": "i am",
                "you're": "you are",
                "he's": "he is",
                "she's": "she is",
                "it's": "it is",
                "we're": "we are",
                "they're": "they are",
                "i've": "i have",
                "you've": "you have",
                "we've": "we have",
                "they've": "they have",
                "i'll": "i will",
                "you'll": "you will",
                "he'll": "he will",
                "she'll": "she will",
                "we'll": "we will",
                "they'll": "they will",
                "don't": "do not",
                "doesn't": "does not",
                "didn't": "did not",
                "can't": "cannot",
                "won't": "will not",
                "isn't": "is not",
                "aren't": "are not",
                "wasn't": "was not",
                "weren't": "were not",
                "shouldn't": "should not",
                "wouldn't": "would not",
                "couldn't": "could not"
            };

            if (contractionMap[word]) {
                word = contractionMap[word];
            } else {
                word = word.replace(/'s\b/g, "").replace(/s'\b/g, "s");
            }

            // Làm sạch 1 "mảnh" từ:
            // - Bỏ { } [ ] (đánh dấu skip)
            // - Giữ chữ, số và dấu chấm thập phân
            let w = stripSkipMarkersFromText(word);

            // Chuẩn hóa dấu gạch nối/hyphen: "twenty-one" -> "twenty one"
            w = w.replace(/[-–—]/g, " ");

            // Nếu có số, ưu tiên chuẩn hóa về chuỗi số (bỏ dấu , giữ dấu .)
            if (/\d/.test(w)) {
                w = w.replace(/,/g, "");
                w = w.replace(/[^\d.]/g, "");
                // Nếu chỉ còn dấu chấm hoặc rỗng thì fallback về chữ thường
                if (!w || w === ".") return stripSkipMarkersFromText(word).toLowerCase();
                return w.trim();
            }

            // Với chữ: thay dấu câu bằng khoảng trắng để tránh dính chữ
            w = w.replace(/[.,!?;:"''()]/g, " ");
            return w.trim().toLowerCase();
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        const DUKE_NUM_MAP = {
            "zero": 0, "one": 1, "two": 2, "three": 3, "four": 4, "five": 5, "six": 6, "seven": 7, "eight": 8, "nine": 9,
            "ten": 10, "eleven": 11, "twelve": 12, "thirteen": 13, "fourteen": 14, "fifteen": 15, "sixteen": 16, "seventeen": 17, "eighteen": 18, "nineteen": 19,
            "twenty": 20, "thirty": 30, "forty": 40, "fifty": 50, "sixty": 60, "seventy": 70, "eighty": 80, "ninety": 90,
            "hundred": 100, "thousand": 1000, "million": 1000000, "billion": 1000000000,
            "first": 1, "second": 2, "third": 3, "fourth": 4, "fifth": 5, "sixth": 6, "seventh": 7, "eighth": 8, "ninth": 9, "tenth": 10,
            "eleventh": 11, "twelfth": 12, "thirteenth": 13, "fourteenth": 14, "fifteenth": 15, "sixteenth": 16, "seventeen": 17, "eighteen": 18, "nineteenth": 19,
            "twentieth": 20, "thirtieth": 30, "fortieth": 40, "fiftieth": 50, "sixtieth": 60, "seventieth": 70, "eightieth": 80, "ninetieth": 90
        };

        /**
         * Chuyển đổi một danh sách token chữ/số thành dạng "Canonical Digit"
         * Hỗ trợ: "a hundred" -> 100, "point five" -> 0.5, "first" -> 1, year-style...
         */
        function collapseNumericalTokens(tokens) {
            const canonicalList = [];
            const originalToCanonicalIndex = new Array(tokens.length).fill(-1);

            let i = 0;
            const n = tokens.length;

            while (i < n) {
                let currentVal = 0;
                let totalVal = 0;
                let hasNumber = false;
                let j = i;
                let consumed = [];

                while (j < n) {
                    let w = tokens[j].toLowerCase();

                    // Bỏ qua "and" trong cụm số
                    if (w === "and" && hasNumber && (j + 1 < n) && (DUKE_NUM_MAP[tokens[j + 1].toLowerCase()] !== undefined)) {
                        consumed.push(j);
                        j++;
                        w = tokens[j].toLowerCase();
                    }

                    // Xử lý "a hundred", "a thousand"
                    let val = DUKE_NUM_MAP[w];
                    if (w === "a" && (j + 1 < n)) {
                        const nextW = tokens[j + 1].toLowerCase();
                        if (["hundred", "thousand", "million", "billion"].includes(nextW)) val = 1;
                    }

                    if (val !== undefined || /^\d+(\.\d+)?$/.test(w)) {
                        hasNumber = true;
                        if (val === undefined) val = parseFloat(w);
                        consumed.push(j);

                        if (val >= 100 && val <= 1000000000) {
                            if (currentVal === 0) currentVal = 1;
                            if (val === 100) currentVal *= 100;
                            else { totalVal += currentVal * val; currentVal = 0; }
                        } else {
                            if (currentVal >= 20 && currentVal < 100 && currentVal % 10 === 0 && val < 10) {
                                currentVal += val;
                            } else if (currentVal > 0 && (val >= 10 || (currentVal >= 11 && currentVal <= 99))) {
                                totalVal += currentVal * 100;
                                currentVal = val;
                            } else {
                                totalVal += currentVal;
                                currentVal = val;
                            }
                        }
                        j++;

                        // Xử lý "point" cho số thập phân
                        if (j < n && tokens[j].toLowerCase() === "point" && (j + 1 < n) && DUKE_NUM_MAP[tokens[j + 1].toLowerCase()] < 10) {
                            let base = totalVal + currentVal;
                            consumed.push(j); j++;
                            let dec = "";
                            while (j < n && DUKE_NUM_MAP[tokens[j].toLowerCase()] !== undefined && DUKE_NUM_MAP[tokens[j].toLowerCase()] < 10) {
                                dec += DUKE_NUM_MAP[tokens[j].toLowerCase()];
                                consumed.push(j); j++;
                            }
                            const cIdx = canonicalList.length;
                            canonicalList.push(base + "." + dec);
                            consumed.forEach(idx => originalToCanonicalIndex[idx] = cIdx);
                            i = j; hasNumber = false; break;
                        }
                    } else { break; }
                }

                if (hasNumber) {
                    const finalNum = String(totalVal + currentVal);
                    const cIdx = canonicalList.length;
                    canonicalList.push(finalNum);
                    consumed.forEach(idx => originalToCanonicalIndex[idx] = cIdx);
                    i = j;
                } else if (i < j) {
                    // Break từ point
                } else {
                    const cIdx = canonicalList.length;
                    canonicalList.push(tokens[i]);
                    originalToCanonicalIndex[i] = cIdx;
                    i++;
                }
            }
            return { canonicalList, originalToCanonicalIndex };
        }

        function convertNumbers(word) {
            const w = normalizeWord(word);
            if (DUKE_NUM_MAP[w] !== undefined) return String(DUKE_NUM_MAP[w]);
            return w;
        }

        function isMatch(a, b) {
            const na = normalizeWord(a);
            const nb = normalizeWord(b);
            if (na === nb) return true;
            if (convertNumbers(na) === convertNumbers(nb)) return true;
            return false;
        }

        const compactProgressMedia = window.matchMedia('(max-width: 640px)');

        function renderProgressBar() {
            progressBarContainer.innerHTML = '';
            const total = lessonData.length;
            const radius = compactProgressMedia.matches ? 4 : 10;
            const visibleCount = Math.min(total, radius * 2 + 1);
            let startIndex = Math.max(0, currentIndex - radius);
            let endIndex = Math.min(total, startIndex + visibleCount);
            startIndex = Math.max(0, endIndex - visibleCount);

            progressBarContainer.classList.remove('wrap-mode');

            for (let i = startIndex; i < endIndex; i++) {
                const segment = document.createElement('div');
                segment.className = 'progress-segment';
                segment.innerText = i === currentIndex ? `${i + 1} / ${total}` : i + 1;
                segment.setAttribute('aria-label', `Câu ${i + 1} trên ${total}`);
                if (ipaOrderMode === 'sequence' && !pronunciationGameActive) {
                    segment.onclick = () => jumpToSentence(i);
                } else {
                    segment.classList.add('disabled');
                }

                if (i === currentIndex) {
                    segment.classList.add('active');
                    segment.setAttribute('aria-current', 'step');
                }

                if (isGameMode) {
                    if (GAME_SESSION[i]) {
                        const data = GAME_SESSION[i];
                        if (data.isFinished || data.isLocked) {
                            segment.classList.add('done');

                            segment.classList.add('warn');
                        }
                    } else if (i < currentIndex) {
                        segment.classList.add('warn');
                    }
                } else {
                    if (i < currentIndex) {
                        segment.classList.add('done');
                    }
                }

                progressBarContainer.appendChild(segment);
            }
        }

        function renderCard(index) {
