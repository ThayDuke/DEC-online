848m so với mực nước biển) thuộc dãy Himalaya sừng sững là: 🏔️❄️`,a:[{text:`Mount Everest`,correct:!0,explanation:`Đúng rồi! Nóc nhà của thế giới là 'Mount Everest' (Chomolungma / Sagarmatha).`},{text:`Mount Fuji`,correct:!1,explanation:`'Mount Fuji' là núi Phú Sĩ ngọn núi lửa thiêng ở Nhật Bản.`},{text:`Mont Blanc`,correct:!1,explanation:`'Mont Blanc' là đỉnh núi cao nhất dãy Alps châu Âu.`},{text:`Kilimanjaro`,correct:!1,explanation:`'Kilimanjaro' là ngọn núi lửa đã tắt ở Tanzania châu Phi.`}]},{q:`The gigantic cavern of Son Doong ___ initially discovered by a native jungle woodcutter named Ho Khanh in 1991. 🕳️🧭`,a:[{text:`was`,correct:!0,explanation:`Chính xác! Câu bị động ở thì Quá khứ đơn với chủ ngữ số ít 'The gigantic cavern': 'S + was + V3/ed' ('was initially discovered').`},{text:`is`,correct:!1,explanation:`Phát hiện năm 1991 trong quá khứ nên không dùng to be 'is' hiện tại.`},{text:`were`,correct:!1,explanation:`Chủ ngữ 'The cavern' là danh từ số ít nên dùng 'was', không dùng 'were'.`},{text:`has been`,correct:!1,explanation:`Có mốc năm xác định 1991 cấm dùng hiện tại hoàn thành.`}]},{q:`Ha Long Bay ___ admired by millions of international tourists annually for its surreal seascape of emerald waters. 🏝️🚤`,a:[{text:`is`,correct:!0,explanation:`Đúng rồi! Câu bị động ở thì Hiện tại đơn diễn tả sự thật hiển nhiên hàng năm ('annually'): 'S + is + V3/ed' ('is admired').`},{text:`was`,correct:!1,explanation:`'annually' chỉ tần suất hiện tại, không dùng 'was'.`},{text:`are`,correct:!1,explanation:`Chủ ngữ 'Ha Long Bay' là danh từ số ít nên dùng to be 'is'.`},{text:`were`,correct:!1,explanation:`Sai thì và sai số nhiều.`}]},{q:`Extremely fragile stalactites and stalagmites formed drop by drop over millennia must ___ preserved from human physical contact. 💧💎`,a:[{text:`be`,correct:!0,explanation:`Chính xác! Cấu trúc câu bị động với động từ khuyết thiếu: 'modal verb + be + V3/ed' ('must be preserved').`},{text:`been`,correct:!1,explanation:`Sau 'must' dùng dạng nguyên mẫu 'be', không dùng phân từ 'been'.`},{text:`being`,correct:!1,explanation:`Dạng V-ing sai sau động từ khuyết thiếu.`},{text:`to be`,correct:!1,explanation:`Sau 'must' cấm dùng 'to be'.`}]},{q:`The vibrant ecosystems of Australia's Great Barrier Reef ___ severely threatened by ocean acidification and coral bleaching. 🪸🚨`,a:[{text:`are`,correct:!0,explanation:`Đúng rồi! Chủ ngữ 'The vibrant ecosystems' là danh từ số nhiều nên to be ở hiện tại bị động là 'are' ('are severely threatened').`},{text:`is`,correct:!1,explanation:`Chủ ngữ số nhiều 'ecosystems' không đi với 'is'.`},{text:`was`,correct:!1,explanation:`Hiện tại đang bị đe dọa, không dùng quá khứ đơn.`},{text:`has been`,correct:!1,explanation:`Chủ ngữ số nhiều không đi với 'has'.`}]},{q:`Victoria Falls, renowned as one of the most thundering curtain waterfalls on Earth, ___ positioned along the Zambezi River. 🌊🌍`,a:[{text:`is`,correct:!0,explanation:`Chính xác! Câu miêu tả vị trí địa lý ở hiện tại bị động: 'is positioned' (được tọa lạc dọc theo con sông Zambezi).`},{text:`was`,correct:!1,explanation:`Thác nước vẫn đang nằm ở đó, chia hiện tại đơn.`},{text:`are`,correct:!1,explanation:`'Victoria Falls' là tên riêng một địa danh nên đi với to be số ít 'is'.`},{text:`were`,correct:!1,explanation:`Sai thì và số lượng.`}]},{q:`Odd one out: Chọn câu có ngữ điệu LÊN GIỌNG ở cuối câu (Rising intonation - Câu hỏi Yes/No): 🔊`,a:[{text:`Is Ha Long Bay recognized as a UNESCO World Heritage site?`,correct:!0,explanation:`Chính xác! Câu hỏi Yes/No bắt đầu bằng trợ động từ/To be có ngữ điệu lên giọng ở cuối câu, trong khi các câu hỏi Wh-question đều có ngữ điệu xuống giọng (falling intonation).`},{text:`Where is Son Doong Cave located?`,correct:!1,explanation:`Câu hỏi 'Where' có ngữ điệu xuống giọng ở cuối câu.`},{text:`How deep is the Grand Canyon gorge?`,correct:!1,explanation:`Câu hỏi 'How' có ngữ điệu xuống giọng.`},{text:`When was Mount Everest first conquered?`,correct:!1,explanation:`Câu hỏi 'When' có ngữ điệu xuống giọng.`}]},{q:`Odd one out: Địa danh nào là KỲ QUAN THIÊN NHIÊN DO TẠO HÓA KIẾN TẠO, không phải công trình nhân tạo do bàn tay con người xây dựng? 🏔️`,a:[{text:`Grand Canyon`,correct:!0,explanation:`Đúng rồi! 'Grand Canyon' (Hẻm núi Lớn) là kỳ quan thiên nhiên do con sông Colorado bào mòn đá tự nhiên, còn Eiffel Tower, Taj Mahal, Colosseum là các công trình nhân tạo.`},{text:`Eiffel Tower in Paris`,correct:!1,explanation:`Tháp Eiffel bằng thép do kỹ sư Gustave Eiffel xây dựng.`},{text:`Taj Mahal in India`,correct:!1,explanation:`Lăng mộ cẩm thạch trắng do hoàng đế xây dựng ở Ấn Độ.`},{text:`Colosseum amphitheater in Rome`,correct:!1,explanation:`Đấu trường La Mã cổ đại bằng đá do người La Mã xây dựng.`}]},{q:`Sắp xếp chữ cái thành từ chỉ kỳ quan thiên nhiên: 'd - r - e - o - w - n' ✨`,a:[{text:`wonder`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'wonder' (kỳ quan / điều kỳ diệu).`},{text:`wondar`,correct:!1,explanation:`Sai chữ e thành a.`},{text:`wounder`,correct:!1,explanation:`Thừa chữ u.`},{text:`wandar`,correct:!1,explanation:`Sai chính tả hoàn toàn.`}]},{q:`Chuyển câu chủ động sau sang thể bị động: 'Millions of international sightseers admire the karst limestone pillars of Ha Long Bay.' 🏝️🛶`,a:[{text:`The karst limestone pillars of Ha Long Bay are admired by millions of international sightseers.`,correct:!0,explanation:`Chính xác! Tân ngữ số nhiều 'The karst limestone pillars...' chuyển lên làm chủ ngữ mới + are admired + by O.`},{text:`The karst limestone pillars of Ha Long Bay is admired by sightseers.`,correct:!1,explanation:`Chủ ngữ số nhiều 'pillars' đi với 'is' là sai.`},{text:`The karst limestone pillars were admired by sightseers.`,correct:!1,explanation:`Câu gốc thì hiện tại đơn không chuyển thành quá khứ 'were'.`},{text:`Ha Long Bay admires millions of international sightseers.`,correct:!1,explanation:`Sai nghĩa câu bị động.`}]},{q:`Tìm lỗi sai trong câu bị động sau: 'Son Doong Cave was officially surveyed and mapped by the British Cave Research Association on 2009.' 🕳️🇬🇧`,a:[{text:`on 2009 -> in 2009`,correct:!0,explanation:`Đúng rồi! Trước mốc năm (2009) bắt buộc phải dùng giới từ 'in' ('in 2009'), không dùng giới từ 'on'.`},{text:`was officially surveyed -> is officially surveyed`,correct:!1,explanation:`Sự việc hoàn thành năm 2009 chia quá khứ đơn 'was' là chuẩn.`},{text:`Cave Research Association -> Association Cave Research`,correct:!1,explanation:`Tên cơ quan tổ chức đúng trật tự.`},{text:`Son Doong Cave -> Cave of Son Doong`,correct:!1,explanation:`Tên địa danh chuẩn xác.`}]},{q:`Cột nhũ đá rủ từ trần hang xuống và măng đá nhô từ sàn hang lên trong các hang động karst gọi là: 💧🏛️`,a:[{text:`stalactites and stalagmites`,correct:!0,explanation:`Chính xác! 'stalactites' là nhũ đá (mọc từ trên trần rủ xuống) và 'stalagmites' là măng đá (nhô từ nền hang lên).`},{text:`sand dunes and beaches`,correct:!1,explanation:`'sand dunes' là cồn cát, 'beaches' là bãi biển.`},{text:`bricks and tiles`,correct:!1,explanation:`'bricks' là gạch nung, 'tiles' là ngói lợp nhà.`},{text:`wires and cables`,correct:!1,explanation:`'wires' là dây điện, 'cables' là cáp viễn thông.`}]},{q:`Hố sụt địa chất khổng lồ do trần hang bị sụp đổ cho phép ánh sáng mặt trời chiếu thẳng vào lòng hang Sơn Đoòng tạo ra rừng nguyên sinh là: ☀️🌳`,a:[{text:`doline (sinkhole)`,correct:!0,explanation:`Tuyệt vời! Hố sụt địa chất trong hang động đá vôi là 'doline' hoặc 'sinkhole'.`},{text:`volcano crater`,correct:!1,explanation:`Miệng núi lửa phun trào nham thạch nóng chảy.`},{text:`swimming pool`,correct:!1,explanation:`Bể bơi nhân tạo có lọc nước clo.`},{text:`water well`,correct:!1,explanation:`Giếng nước sinh hoạt của làng xóm.`}]},{q:`Stringent ecotourism guidelines ___ strictly adhered to so as to shield the delicate subterranean cave ecosystem from contamination. 🕳️🛡️`,a:[{text:`must be`,correct:!0,explanation:`Chính xác! 'must be strictly adhered to' có nghĩa là phải được tuân thủ nghiêm ngặt để bảo vệ hệ sinh thái hang động.`},{text:`must have`,correct:!1,explanation:`Thiếu phân từ bị động 'been'.`},{text:`can to be`,correct:!1,explanation:`Sau 'can' không có 'to'.`},{text:`will been`,correct:!1,explanation:`Sau 'will' dùng be, không dùng been.`}]},{q:`Immense polar ice sheets are shedding hundreds of billions of tons of ice annually ___ atmospheric warming intensifies. 🧊🌊`,a:[{text:`as (because)`,correct:!0,explanation:`Đúng rồi! Liên từ 'as / because' chỉ nguyên nhân hoặc sự việc diễn ra đồng thời: Khi / Vì sự ấm lên toàn cầu gia tăng.`},{text:`so that`,correct:!1,explanation:`'so that' chỉ mục đích.`},{text:`unless`,correct:!1,explanation:`'unless' mang nghĩa trừ phi.`},{text:`although`,correct:!1,explanation:`'although' mang nghĩa nhượng bộ tương phản.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'is / annually / Ha Long Bay / millions / visited / tourists / by / of / .' 🏝️✨`,a:[{text:`Ha Long Bay is visited by millions of tourists annually.`,correct:!0,explanation:`Xuất sắc! Cấu trúc câu bị động: S (Ha Long Bay) + is visited + by millions of tourists + annually (trạng ngữ thời gian).`},{text:`Ha Long Bay visited is by millions of tourists annually.`,correct:!1,explanation:`Trợ động từ to be phải đứng trước V3.`},{text:`Millions of tourists is visited by Ha Long Bay annually.`,correct:!1,explanation:`Ngược chủ ngữ vị ngữ câu bị động.`},{text:`Annually Ha Long Bay visited is by millions of tourists.`,correct:!1,explanation:`Sai trật tự trợ từ.`}]},{q:`Why must pristine world natural wonder sites be rigorously shielded from unrestrained mass tourism commercialization? 🛡️🌍`,a:[{text:`To avert irremediable geological degradation and conserve delicate endemic ecosystems for future generations.`,correct:!0,explanation:`Chính xác! Phải bảo vệ nghiêm ngặt để ngăn chặn sự hủy hoại địa chất không thể cứu vãn và giữ gìn các hệ sinh thái đặc hữu cho muôn đời sau.`},{text:`To construct coal-burning thermal power factories inside every cave.`,correct:!1,explanation:`Không thể xây nhà máy nhiệt điện than trong hang động.`},{text:`To ban all global citizens from ever reading geography books.`,correct:!1,explanation:`Không ai cấm đọc sách địa lý.`},{text:`To drain all ocean waters into outer space immediately.`,correct:!1,explanation:`Không thể hút cạn nước biển vào vũ trụ phi lý.`}]},{q:`The dramatic vertical limestone cliffs of Ha Long Bay were shaped by thousands of millennia of marine water ___. 🌊🪨`,a:[{text:`erosion`,correct:!0,explanation:`Chính xác! Quá trình xói mòn, bào mòn địa chất của sóng biển là 'marine water erosion'.`},{text:`boiling`,correct:!1,explanation:`Nước biển không sôi để nấu chín đá.`},{text:`freezing`,correct:!1,explanation:`Khí hậu vịnh nhiệt đới không đóng băng.`},{text:`pollution`,correct:!1,explanation:`Không phải do ô nhiễm tạo nên kỳ quan.`}]},{q:`Mountaineers aiming to reach the apex of Mount Everest can only embark on expeditions during narrow spring weather ___. 🏔️🌤️`,a:[{text:`windows`,correct:!0,explanation:`Đúng rồi! Cụm từ 'weather windows' có nghĩa là các khoảng thời gian thời tiết thuận lợi ngắn ngủi cho phép leo núi an toàn.`},{text:`mirrors`,correct:!1,explanation:`'mirrors' là những tấm gương soi bóng.`},{text:`doors`,correct:!1,explanation:`'doors' là những cánh cửa ra vào nhà.`},{text:`walls`,correct:!1,explanation:`'walls' là những bức tường gạch vữa.`}]},{q:`Flourishing marine coral reefs create nursery grounds that harbor more than one-quarter of all known ocean ___. 🪸🐠`,a:[{text:`species`,correct:!0,explanation:`Chính xác! Rạn san hô là nơi nuôi dưỡng hơn một phần tư các loài sinh vật biển ('ocean species').`},{text:`stones`,correct:!1,explanation:`'stones' là những hòn đá vô tri.`},{text:`ships`,correct:!1,explanation:`'ships' là những chiếc tàu thủy.`},{text:`planes`,correct:!1,explanation:`'planes' là những chiếc máy bay.`}]},{q:`Substantial financial fines and entry bans will be handed down to vandals who deface fragile cave formations with ___. 🕳️🚫`,a:[{text:`graffiti`,correct:!0,explanation:`Đúng rồi! Hành vi vẽ bậy, khắc chữ bừa bãi lên vách đá di sản là 'graffiti'.`},{text:`flashlight beams`,correct:!1,explanation:`Ánh đèn pin không làm hư hại vách đá.`},{text:`gentle footsteps`,correct:!1,explanation:`Bước chân nhẹ nhàng không phá hoại.`},{text:`digital cameras`,correct:!1,explanation:`Máy ảnh kỹ thuật số không làm bẩn tường.`}]},{q:`Conscientious eco-travelers steadfastly abide by the conservation philosophy: 'Take nothing but memories, leave nothing but ___.' 👣🌿`,a:[{text:`footprints`,correct:!0,explanation:`Tuyệt vời! Phương châm du lịch sinh thái nổi tiếng thế giới: 'Chẳng lấy gì ngoài những bức ảnh/kỷ niệm, chẳng để lại gì ngoài những dấu chân' ('leave nothing but footprints').`},{text:`plastic bottles`,correct:!1,explanation:`Tuyệt đối không xả rác chai nhựa.`},{text:`rubbish piles`,correct:!1,explanation:`Không để lại bãi rác thải.`},{text:`chemical spills`,correct:!1,explanation:`Không để lại hóa chất độc hại.`}]},{q:`Hình thức du lịch có trách nhiệm hướng tới việc bảo tồn môi trường tự nhiên và tôn trọng văn hóa bản địa gọi là: 🌿🦜`,a:[{text:`ecotourism`,correct:!0,explanation:`Chính xác! Du lịch sinh thái thân thiện với thiên nhiên là 'ecotourism'.`},{text:`mass tourism`,correct:!1,explanation:`'mass tourism' là du lịch đại trà ồ ạt quá tải.`},{text:`space tourism`,correct:!1,explanation:`'space tourism' là du lịch khám phá quỹ đạo không gian.`},{text:`virtual tourism`,correct:!1,explanation:`'virtual tourism' là du lịch ảo qua màn hình máy tính.`}]},{q:`Chuyến du lịch trọn gói bao gồm toàn bộ vé máy bay, phòng khách sạn, các bữa ăn và xe đưa đón trong tiếng Anh là: ✈️🏨`,a:[{text:`package tour (package holiday)`,correct:!0,explanation:`Đúng rồi! Chuyến đi trọn gói định sẵn là 'package tour' hoặc 'package holiday'.`},{text:`backpacking trek`,correct:!1,explanation:`'backpacking trek' là chuyến phượt tự túc một mình.`},{text:`business meeting`,correct:!1,explanation:`'business meeting' là cuộc họp bàn làm ăn.`},{text:`school exam`,correct:!1,explanation:`'school exam' là kỳ thi học kỳ ở trường.`}]},{q:`Cảm giác uể oải, mất ngủ và mệt mỏi do cơ thể chưa kịp thích nghi khi bay qua nhiều múi giờ khác nhau gọi là: ✈️🥱`,a:[{text:`jet lag`,correct:!0,explanation:`Chính xác! Hội chứng mệt mỏi lệch múi giờ sau chuyến bay dài xuyên lục địa là 'jet lag'.`},{text:`sunburn`,correct:!1,explanation:`'sunburn' là hiện tượng cháy nắng rát da khi đi biển.`},{text:`seasickness`,correct:!1,explanation:`'seasickness' là chứng say sóng nôn nao khi đi tàu thuyền.`},{text:`homesickness`,correct:!1,explanation:`'homesickness' là nỗi nhớ nhà da diết khi đi xa.`}]},{q:`Bản kế hoạch chi tiết liệt kê thứ tự các điểm tham quan, mốc thời gian và phương tiện di chuyển trong chuyến đi là: 🗺️📅`,a:[{text:`travel itinerary`,correct:!0,explanation:`Đúng rồi! Lịch trình chi tiết của chuyến du lịch là 'travel itinerary'.`},{text:`receipt`,correct:!1,explanation:`'receipt' là hóa đơn thanh toán tiền.`},{text:`dictionary`,correct:!1,explanation:`'dictionary' là cuốn từ điển tra từ vựng.`},{text:`recipe`,correct:!1,explanation:`'recipe' là công thức chế biến món ăn ngon.`}]},{q:`Thẻ lên máy bay do hãng hàng không cấp ghi rõ họ tên hành khách, số hiệu chuyến bay, cửa ra và số ghế ngồi là: 🎫✈️`,a:[{text:`boarding pass`,correct:!0,explanation:`Chính xác! Thẻ lên máy bay là 'boarding pass'.`},{text:`credit card`,correct:!1,explanation:`'credit card' là thẻ tín dụng ngân hàng.`},{text:`library card`,correct:!1,explanation:`'library card' là thẻ mượn sách thư viện.`},{text:`student card`,correct:!1,explanation:`'student card' là thẻ học sinh sinh viên.`}]},{q:`The professional flight ___ demonstrated emergency oxygen mask procedures prior to takeoff. 👩‍✈️🛫`,a:[{text:`attendant`,correct:!0,explanation:`Đúng rồi! Tiếp viên hàng không phục vụ trên chuyến bay là 'flight attendant'.`},{text:`driver`,correct:!1,explanation:`'driver' là tài xế lái xe ô tô mặt đất.`},{text:`mechanic`,correct:!1,explanation:`'mechanic' là thợ cơ khí sửa chữa máy móc.`},{text:`waiter`,correct:!1,explanation:`'waiter' là người bồi bàn phục vụ tại nhà hàng.`}]},{q:`Holidaymakers should generously apply high-SPF sun ___ to prevent acute ultraviolet skin damage when sunbathing on beaches. 🧴🏖️`,a:[{text:`cream (lotion)`,correct:!0,explanation:`Chính xác! Kem chống nắng bảo vệ làn da khỏi tia cực tím là 'sun cream' hoặc 'sun lotion' (sunscreen).`},{text:`oil paint`,correct:!1,explanation:`'oil paint' là sơn dầu dùng vẽ tranh nghệ thuật.`},{text:`toothpaste`,correct:!1,explanation:`'toothpaste' là kem đánh răng vệ sinh răng miệng.`},{text:`shampoo`,correct:!1,explanation:`'shampoo' là dầu gội đầu làm sạch tóc.`}]},{q:`The disruptive phenomenon of ___ transpires when tourist volume exceeds an ecosystem's carrying capacity and disrupts local tranquility. 🏖️👥🛑`,a:[{text:`overtourism`,correct:!0,explanation:`Đúng rồi! Tình trạng quá tải du lịch trầm trọng là 'overtourism'.`},{text:`ecotourism`,correct:!1,explanation:`'ecotourism' là du lịch sinh thái có trách nhiệm bền vững.`},{text:`agritourism`,correct:!1,explanation:`'agritourism' là du lịch nông trại trải nghiệm.`},{text:`geotourism`,correct:!1,explanation:`'geotourism' là du lịch địa chất khám phá đá.`}]},{q:`Before securing flight reservations for an international journey, ensure your passport carries at least six months of ___. 🛂📅`,a:[{text:`validity`,correct:!0,explanation:`Chính xác! Thời hạn hiệu lực của hộ chiếu là 'passport validity' (thường yêu cầu tối thiểu 6 tháng trước ngày bay).`},{text:`weight`,correct:!1,explanation:`'weight' là trọng lượng cân nặng.`},{text:`color`,correct:!1,explanation:`'color' là màu sắc bìa hộ chiếu.`},{text:`thickness`,correct:!1,explanation:`'thickness' là độ dày của cuốn sổ.`}]},{q:`Du khách có ý thức du lịch bền vững nên chủ động mang theo bình nước cá nhân để từ chối các loại chai nhựa dùng một lần: 🍶🚫`,a:[{text:`single-use plastics`,correct:!0,explanation:`Tuyệt vời! Nhựa dùng một lần thải độc hại ra đại dương là 'single-use plastics'.`},{text:`reusable steel bottles`,correct:!1,explanation:`Bình thép giữ nhiệt tái sử dụng thân thiện môi trường.`},{text:`biodegradable paper cups`,correct:!1,explanation:`Cốc giấy phân hủy sinh học.`},{text:`bamboo straws`,correct:!1,explanation:`Ống hút bằng thân tre tự nhiên.`}]},{q:`Odd one out: Chọn danh từ ghép (compound noun) có trọng âm rơi vào âm tiết đầu tiên (từ thứ nhất): 'boarding pass, re'lax, a'rrive, pre'fer 🔊`,a:[{text:`boarding pass`,correct:!0,explanation:`Chính xác! 'boarding pass là danh từ ghép có trọng âm rơi vào từ đầu tiên /ˈbɔː.dɪŋ ˌpɑːs/, trong khi relax, arrive, prefer đều là động từ có trọng âm rơi vào âm tiết thứ hai.`},{text:`relax`,correct:!1,explanation:`Trọng âm rơi vào âm tiết thứ hai /rɪˈlæks/.`},{text:`arrive`,correct:!1,explanation:`Trọng âm rơi vào âm tiết thứ hai /əˈraɪv/.`},{text:`prefer`,correct:!1,explanation:`Trọng âm rơi vào âm tiết thứ hai /prɪˈfɜːr/.`}]},{q:`Odd one out: Khái niệm nào MIÊU TẢ HIỆN TƯỢNG TIÊU CỰC CỦA NGÀNH DU LỊCH, không phải hình thức du lịch bền vững văn minh? 🚯`,a:[{text:`overtourism`,correct:!0,explanation:`Đúng rồi! 'overtourism' (tình trạng du lịch quá tải gây hủy hoại môi trường) là vấn nạn tiêu cực, trong khi ecotourism, sustainable tourism, cultural tourism là các mô hình du lịch bền vững tích cực.`},{text:`ecotourism`,correct:!1,explanation:`Du lịch sinh thái bảo vệ môi trường.`},{text:`sustainable tourism`,correct:!1,explanation:`Du lịch bền vững lâu dài.`},{text:`community-based tourism`,correct:!1,explanation:`Du lịch cộng đồng hỗ trợ người dân địa phương.`}]},{q:`Sắp xếp chữ cái thành từ chỉ du lịch sinh thái: 't - r - c - o - o - s - u - i - e - m' 🌿🦜`,a:[{text:`ecotourism`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'ecotourism' (du lịch sinh thái).`},{text:`ecotourisem`,correct:!1,explanation:`Sai chữ sm thành sem.`},{text:`ecotourismm`,correct:!1,explanation:`Thừa chữ m ở cuối.`},{text:`ecotarism`,correct:!1,explanation:`Sai chính tả hoàn toàn.`}]},{q:`Ghép hai từ riêng lẻ thành một danh từ ghép hoàn chỉnh chỉ quầy bán vé vào cổng: 'ticket' + 'counter' 🎟️🚪`,a:[{text:`ticket counter (ticket office)`,correct:!0,explanation:`Chính xác! Quầy/phòng bán vé là danh từ ghép 'ticket counter' hoặc 'ticket office'.`},{text:`ticket shop`,correct:!1,explanation:`Không phải danh từ ghép chuẩn chỉ quầy vé.`},{text:`ticket house`,correct:!1,explanation:`Không dùng ticket house.`},{text:`ticket lane`,correct:!1,explanation:`Làn soát vé, không phải nơi bán vé.`}]},{q:`Tìm lỗi sai trong câu ghép danh từ sau: 'Passengers must show their passes boarding at gate number 5.' 🎫✈️`,a:[{text:`passes boarding -> boarding passes`,correct:!0,explanation:`Đúng rồi! Trật tự danh từ ghép đúng là 'boarding passes' (thẻ lên máy bay), không được đảo ngược thành 'passes boarding'.`},{text:`Passengers must -> Passengers have to`,correct:!1,explanation:`'must' dùng thể hiện yêu cầu quy định là đúng.`},{text:`at gate number 5 -> on gate number 5`,correct:!1,explanation:`Giới từ 'at' chỉ vị trí cửa khởi hành là chuẩn.`},{text:`show their -> show its`,correct:!1,explanation:`Đại từ sở hữu 'their' thay thế cho chủ ngữ số nhiều passengers là đúng.`}]},{q:`Tình trạng dòng du khách tràn ngập ồ ạt làm tắc nghẽn đường sá, đẩy giá cả sinh hoạt lên cao và làm kiệt quệ cư dân bản địa gọi là: 👥🛑`,a:[{text:`overtourism crisis`,correct:!0,explanation:`Chính xác! Khủng hoảng quá tải du lịch là 'overtourism crisis'.`},{text:`winter hibernation`,correct:!1,explanation:`Kỳ ngủ đông tránh rét của loài gấu.`},{text:`space expedition`,correct:!1,explanation:`Chuyến thám hiểm ngoài không gian.`},{text:`desert isolation`,correct:!1,explanation:`Sự cô lập giữa hoang mạc cát.`}]},{q:`Chuyến du lịch bụi nơi du khách tự vác ba-lô, tự săn vé rẻ và tự lên kế hoạch khám phá các nẻo đường là: 🎒🗺️`,a:[{text:`backpacking journey`,correct:!0,explanation:`Tuyệt vời! Chuyến đi phượt bụi ba-lô là 'backpacking journey'.`},{text:`luxury cruise`,correct:!1,explanation:`Chuyến du lịch sang trọng bằng siêu du thuyền 5 sao.`},{text:`presidential state visit`,correct:!1,explanation:`Chuyến công du cấp nhà nước của nguyên thủ quốc gia.`},{text:`space shuttle orbit`,correct:!1,explanation:`Chuyến bay vào quỹ đạo của tàu con thoi.`}]},{q:`Community-based sustainable tourism endeavors to channel direct economic proceeds toward empowering indigenous host ___. 🤝🏡`,a:[{text:`communities`,correct:!0,explanation:`Chính xác! Du lịch cộng đồng giúp đem lại lợi ích kinh tế trực tiếp cho các cộng đồng bản địa ('host communities').`},{text:`factories`,correct:!1,explanation:`'factories' là những nhà máy xí nghiệp sản xuất.`},{text:`prisons`,correct:!1,explanation:`'prisons' là các nhà tù giam giữ tội phạm.`},{text:`zoos`,correct:!1,explanation:`'zoos' là các vườn thú nhốt lồng.`}]},{q:`Air passengers must pass through identity scanning and thorough luggage screening prior to resting in the departure ___. 🛂🛋️`,a:[{text:`lounge`,correct:!0,explanation:`Đúng rồi! Phòng chờ ra máy bay tại sân bay là 'departure lounge'.`},{text:`kitchen`,correct:!1,explanation:`'kitchen' là gian bếp nấu ăn.`},{text:`garage`,correct:!1,explanation:`'garage' là gara để xe ô tô.`},{text:`stadium`,correct:!1,explanation:`'stadium' là sân vận động thi đấu bóng đá.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'Ecotourism / promotes / and / conservation / local / environmental / culture / .' 🌿🏛️`,a:[{text:`Ecotourism promotes environmental conservation and local culture.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (Ecotourism) + promotes (vị ngữ) + O (environmental conservation and local culture).`},{text:`Ecotourism environmental conservation promotes and culture local.`,correct:!1,explanation:`Tân ngữ chen vào trước động từ vị ngữ.`},{text:`Promotes ecotourism environmental conservation and local culture.`,correct:!1,explanation:`Đảo động từ lên đầu câu trần thuật.`},{text:`Local culture ecotourism promotes and environmental conservation.`,correct:!1,explanation:`Sai trật tự cú pháp tiếng Anh.`}]},{q:`What pragmatic measures should municipal tourist destinations execute to mitigate the adverse repercussions of overtourism? 📉🏙️`,a:[{text:`Implement daily visitor ceilings, promote off-peak seasonal travel, and levy conservation tourist surcharges.`,correct:!0,explanation:`Chính xác! Thiết lập hạn mức du khách mỗi ngày, khuyến khích đi vào mùa thấp điểm và thu phí bảo tồn du lịch để giảm tải áp lực cho điểm đến.`},{text:`Demolish all historic monuments to build multi-story car parking lots.`,correct:!1,explanation:`Không thể phá hủy di tích để làm bãi đỗ xe.`},{text:`Mandate that all local residents must vacate their homes and move into the woods.`,correct:!1,explanation:`Không bắt người dân sơ tán vào rừng vô lý.`},{text:`Cut down all urban street trees to make room for advertising billboards.`,correct:!1,explanation:`Chặt cây xanh là hành vi hủy hoại môi trường.`}]},{q:`To easily identify your checked suitcase on the revolving baggage carousel, affix a distinctively bright luggage ___ displaying your contact details. 🧳🏷️`,a:[{text:`tag`,correct:!0,explanation:`Chính xác! Thẻ đeo hành lý ghi tên và số điện thoại liên hệ là 'luggage tag'.`},{text:`coin`,correct:!1,explanation:`'coin' là đồng tiền xu kim loại.`},{text:`stamp`,correct:!1,explanation:`'stamp' là con tem dán thư bưu điện.`},{text:`mirror`,correct:!1,explanation:`'mirror' là chiếc gương soi.`}]},{q:`An inspiring and knowledgeable local tour ___ can bring ancient stone temples to life through vivid cultural anecdotes. 🗣️🏛️`,a:[{text:`guide`,correct:!0,explanation:`Đúng rồi! Hướng dẫn viên du lịch chuyên nghiệp là 'tour guide'.`},{text:`guard`,correct:!1,explanation:`'guard' là nhân viên bảo vệ canh gác.`},{text:`pilot`,correct:!1,explanation:`'pilot' là phi công lái máy bay.`},{text:`mechanic`,correct:!1,explanation:`'mechanic' là thợ sửa xe.`}]},{q:`Discerning globe-trotters frequently secure substantial promotional price cuts by booking flight tickets and hotel accommodations well in ___. ⏰💵`,a:[{text:`advance`,correct:!0,explanation:`Chính xác! Thành ngữ 'in advance' có nghĩa là đặt trước, làm trước (ví dụ đặt vé trước vài tháng).`},{text:`behind`,correct:!1,explanation:`Không dùng 'in behind'.`},{text:`front`,correct:!1,explanation:`'in front of' là phía trước vị trí không gian.`},{text:`late`,correct:!1,explanation:`'in late' sai ngữ nghĩa.`}]},{q:`Cultural experiential tourism affords travelers unique opportunities to immerse themselves deeply in indigenous customs, rituals, and local ___. 🍲🥢`,a:[{text:`cuisine (gastronomy)`,correct:!0,explanation:`Tuyệt vời! Nền ẩm thực bản địa độc đáo là 'local cuisine' hoặc 'gastronomy'.`},{text:`smog`,correct:!1,explanation:`'smog' là khói bụi ô nhiễm mù mịt.`},{text:`garbage`,correct:!1,explanation:`'garbage' là rác thải sinh hoạt bốc mùi.`},{text:`diseases`,correct:!1,explanation:`'diseases' là các mầm bệnh truyền nhiễm.`}]},{q:`Thuật ngữ chỉ ngôn ngữ chung quốc tế được những người không cùng tiếng mẹ đẻ sử dụng để giao dịch và đàm phán là: 🌐🗣️`,a:[{text:`lingua franca`,correct:!0,explanation:`Chính xác! 'lingua franca' là ngôn ngữ giao tiếp chung toàn cầu giữa các cộng đồng khác nhau.`},{text:`dead language`,correct:!1,explanation:`'dead language' là tử ngữ không còn ai nói nữa (như tiếng Latin cổ).`},{text:`sign language`,correct:!1,explanation:`'sign language' là ngôn ngữ ký hiệu dành cho người khiếm thính.`},{text:`secret code`,correct:!1,explanation:`'secret code' là mật mã bí mật quân sự.`}]},{q:`Tiếng mẹ đẻ, ngôn ngữ đầu tiên mà mỗi con người tiếp thu tự nhiên từ thuở ấu thơ gọi là: 👶🤱`,a:[{text:`mother tongue (native language)`,correct:!0,explanation:`Đúng rồi! Tiếng mẹ đẻ là 'mother tongue' hoặc 'native language' (first language).`},{text:`foreign language`,correct:!1,explanation:`'foreign language' là ngoại ngữ học thêm sau này.`},{text:`slang vocabulary`,correct:!1,explanation:`'slang vocabulary' là tiếng lóng khẩu ngữ bình dân.`},{text:`technical jargon`,correct:!1,explanation:`'technical jargon' là thuật ngữ chuyên ngành hẹp.`}]},{q:`Khả năng sử dụng thành thạo và trôi chảy hai ngôn ngữ khác nhau trong đời sống hàng ngày gọi là: 🗣️🔄`,a:[{text:`bilingualism`,correct:!0,explanation:`Chính xác! Hiện tượng song ngữ (nói lưu loát hai ngôn ngữ) là 'bilingualism'.`},{text:`monolingualism`,correct:!1,explanation:`'monolingualism' là chỉ biết duy nhất một thứ tiếng.`},{text:`illiteracy`,correct:!1,explanation:`'illiteracy' là nạn mù chữ không biết đọc viết.`},{text:`dyslexia`,correct:!1,explanation:`'dyslexia' là hội chứng rối loạn khả năng đọc.`}]},{q:`The foreign linguistics expert ___ delivered the inspirational workshop on World Englishes has relocated to Melbourne. 👨‍🏫🇦🇺`,a:[{text:`who (that)`,correct:!0,explanation:`Đúng rồi! Đại từ quan hệ thay thế cho danh từ chỉ người 'The foreign linguistics expert' làm chủ ngữ là 'who' (hoặc 'that').`},{text:`which`,correct:!1,explanation:`'which' thay thế cho danh từ chỉ đồ vật/con vật, không dùng cho người.`},{text:`whose`,correct:!1,explanation:`'whose' chỉ sở hữu, cần có danh từ theo sau.`},{text:`where`,correct:!1,explanation:`'where' là trạng từ quan hệ chỉ nơi chốn.`}]},{q:`English, ___ is spoken by more than 1.5 billion people worldwide, functions as the primary international medium. 🌍✈️`,a:[{text:`which`,correct:!0,explanation:`Chính xác! Trong mệnh đề quan hệ không xác định (nằm giữa hai dấu phẩy), bắt buộc dùng 'which' để thay cho danh từ chỉ sự vật 'English', tuyệt đối cấm dùng 'that'.`},{text:`that`,correct:!1,explanation:`Trong mệnh đề quan hệ có dấu phẩy (non-defining), tuyệt đối không dùng 'that'.`},{text:`who`,correct:!1,explanation:`'who' thay thế cho danh từ chỉ người.`},{text:`whom`,correct:!1,explanation:`'whom' thay thế cho tân ngữ chỉ người.`}]},{q:`The diligent high school student ___ research essay on regional Australian slang won first prize received an overseas grant. 🏆📜`,a:[{text:`whose`,correct:!0,explanation:`Đúng rồi! Đại từ quan hệ chỉ quyền sở hữu: 'whose research essay' (bài luận nghiên cứu của bạn học sinh đó).`},{text:`who`,correct:!1,explanation:`'who' không mang nghĩa sở hữu bài viết.`},{text:`whom`,correct:!1,explanation:`'whom' là đại từ tân ngữ chỉ người.`},{text:`which`,correct:!1,explanation:`Chủ sở hữu là học sinh (người), không dùng 'which'.`}]},{q:`Singapore is a vibrant Southeast Asian republic ___ English serves as the dominant language of commerce, law, and education. 🇸🇬📚`,a:[{text:`where`,correct:!0,explanation:`Chính xác! Trạng từ quan hệ 'where' thay thế cho trạng ngữ chỉ nơi chốn ('in Singapore').`},{text:`which`,correct:!1,explanation:`Nếu dùng 'which' phải có giới từ 'in which'.`},{text:`who`,correct:!1,explanation:`Chỉ nơi chốn không dùng 'who'.`},{text:`whose`,correct:!1,explanation:`Sai nghĩa sở hữu.`}]},{q:`The renowned Scottish poet ___ the conference committee invited as our keynote guest delivered an evocative speech. ✍️🏴󠁧󠁢󠁳󠁣󠁴󠁿`,a:[{text:`whom (who)`,correct:!0,explanation:`Đúng rồi! Thay thế cho danh từ chỉ người đóng vai trò tân ngữ của động từ 'invited' dùng 'whom' hoặc 'who'.`},{text:`which`,correct:!1,explanation:`Chỉ người không dùng 'which'.`},{text:`where`,correct:!1,explanation:`Chỉ nơi chốn.`},{text:`when`,correct:!1,explanation:`Chỉ thời gian.`}]},{q:`Từ mượn gốc tiếng Việt vinh dự được đưa nguyên vẹn vào Đại từ điển tiếng Anh Oxford để chỉ món canh bánh phở bò truyền thống là: 🍲🥢`,a:[{text:`pho`,correct:!0,explanation:`Chính xác! Từ 'pho' (/fɜː/) đã chính thức được ghi nhận trong từ điển Oxford và Merriam-Webster.`},{text:`pizza`,correct:!1,explanation:`'pizza' là từ mượn gốc tiếng Ý.`},{text:`sushi`,correct:!1,explanation:`'sushi' là từ mượn gốc tiếng Nhật.`},{text:`hamburger`,correct:!1,explanation:`'hamburger' là từ mượn gốc tiếng Đức.`}]},{q:`Odd one out: Chọn từ có trọng âm rơi vào âm tiết THỨ NHẤT (khác với quy tắc trọng âm rơi vào âm tiết liền trước đuôi -ics/-ic): politics, economic, artistic, historical 🔊`,a:[{text:`politics`,correct:!0,explanation:`Chính xác! 'politics' có trọng âm bất quy tắc rơi vào âm tiết thứ nhất /ˈpɒl.ə.tɪks/, trong khi economic (/ˌiː.kəˈnɒm.ɪk/), artistic (/ɑːˈtɪs.tɪk/), historical (/hɪˈstɒr.ɪ.kəl/) đều có trọng âm rơi vào âm tiết ngay trước hậu tố.`},{text:`economic`,correct:!1,explanation:`Trọng âm rơi vào âm tiết thứ 3 ngay trước -ic.`},{text:`artistic`,correct:!1,explanation:`Trọng âm rơi vào âm tiết thứ 2 ngay trước -ic.`},{text:`historical`,correct:!1,explanation:`Trọng âm rơi vào âm tiết thứ 2 ngay trước -ical.`}]},{q:`Odd one out: Khái niệm nào KHÔNG LIÊN QUAN ĐẾN ĐẶC ĐIỂM NGÔN NGỮ HỌC, không phải hiện tượng phát âm hay từ vựng? 🌋`,a:[{text:`volcano`,correct:!0,explanation:`Đúng rồi! 'volcano' (núi lửa phun trào) là hiện tượng địa chất, còn accent (giọng điệu), dialect (thổ ngữ), slang (tiếng lóng) là các yếu tố ngôn ngữ.`},{text:`accent`,correct:!1,explanation:`'accent' là ngữ điệu giọng vùng miền.`},{text:`regional dialect`,correct:!1,explanation:`'regional dialect' là phương ngữ địa phương.`},{text:`slang vocabulary`,correct:!1,explanation:`'slang vocabulary' là tiếng lóng khẩu ngữ.`}]},{q:`Sắp xếp chữ cái thành từ chỉ người nói được hai thứ tiếng thành thạo: 'n - i - g - l - i - b - a - l - u' 🗣️`,a:[{text:`bilingual`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'bilingual' (thông thạo song ngữ).`},{text:`bilinguel`,correct:!1,explanation:`Sai chữ a thành e.`},{text:`bilingul`,correct:!1,explanation:`Thiếu chữ a.`},{text:`belyngual`,correct:!1,explanation:`Sai chữ i thành e và y.`}]},{q:`Nối hai câu thành câu có mệnh đề quan hệ không xác định: 'Alexander Graham Bell invented the telephone. He was born in Scotland.' ☎️🏴󠁧󠁢󠁳󠁣󠁴󠁿`,a:[{text:`Alexander Graham Bell, who was born in Scotland, invented the telephone.`,correct:!0,explanation:`Chính xác! Danh từ riêng 'Alexander Graham Bell' đi kèm mệnh đề quan hệ không xác định ngăn cách bởi hai dấu phẩy và dùng đại từ 'who'.`},{text:`Alexander Graham Bell, that was born in Scotland, invented telephone.`,correct:!1,explanation:`Tuyệt đối không dùng 'that' sau dấu phẩy.`},{text:`Alexander Graham Bell who was born in Scotland invented telephone.`,correct:!1,explanation:`Thiếu hai dấu phẩy ngăn cách danh từ riêng xác định.`},{text:`Alexander Graham Bell, which was born in Scotland, invented telephone.`,correct:!1,explanation:`Chỉ người không dùng 'which'.`}]},{q:`Tìm lỗi sai trong câu chứa mệnh đề quan hệ sau: 'Standard English, that is the global medium of aviation communication, is mastered worldwide.' ✈️🌐`,a:[{text:`that -> which`,correct:!0,explanation:`Đúng rồi! Trong mệnh đề quan hệ không xác định (có dấu phẩy), tuyệt đối không được dùng đại từ quan hệ 'that', bắt buộc phải dùng 'which'.`},{text:`Standard English -> Standardly English`,correct:!1,explanation:`Tính từ bổ nghĩa cho danh từ đúng trật tự.`},{text:`global medium -> medium global`,correct:!1,explanation:`Tính từ đứng trước danh từ là chuẩn.`},{text:`is mastered -> are mastered`,correct:!1,explanation:`Chủ ngữ số ít 'Standard English' đi với 'is' là đúng.`}]},{q:`Cách phát âm đặc trưng mang âm hưởng ngữ điệu của từng vùng miền hay từng quốc gia gọi là: 🗣️🗺️`,a:[{text:`accent`,correct:!0,explanation:`Chính xác! Giọng vùng miền trong phát âm là 'accent' (ví dụ British accent, American accent).`},{text:`grammar`,correct:!1,explanation:`'grammar' là hệ thống ngữ pháp quy tắc.`},{text:`spelling`,correct:!1,explanation:`'spelling' là cách đánh vần viết chính tả.`},{text:`alphabet`,correct:!1,explanation:`'alphabet' là bảng chữ cái mẫu tự.`}]},{q:`Người Mỹ dùng từ 'elevator' để chỉ buồng thang máy di chuyển đứng, trong khi người Anh gọi buồng thang máy là: 🛗🇬🇧`,a:[{text:`lift`,correct:!0,explanation:`Đúng rồi! Trong tiếng Anh - Anh (British English), thang máy là 'lift', còn tiếng Anh - Mỹ (American English) gọi là 'elevator'.`},{text:`subway`,correct:!1,explanation:`'subway' trong tiếng Mỹ là tàu điện ngầm, ở Anh là đường hầm đi bộ.`},{text:`lorry`,correct:!1,explanation:`'lorry' là xe tải chở hàng.`},{text:`boot`,correct:!1,explanation:`'boot' là cốp sau xe hơi.`}]},{q:`Hiện tượng người song ngữ chuyển đổi linh hoạt qua lại giữa hai ngôn ngữ ngay trong một cuộc trò chuyện hàng ngày gọi là: 🗣️🔄`,a:[{text:`code-switching`,correct:!0,explanation:`Chính xác! Hiện tượng chêm xen và chuyển mã ngôn ngữ linh hoạt là 'code-switching'.`},{text:`signal-jamming`,correct:!1,explanation:`'signal-jamming' là phá sóng vô tuyến gây nhiễu.`},{text:`channel-surfing`,correct:!1,explanation:`'channel-surfing' là bấm chuyển kênh tivi liên tục.`},{text:`brain-washing`,correct:!1,explanation:`'brain-washing' là hành vi tẩy não.`}]},{q:`Mastering various World Englishes equips international students with deep sensitivity toward regional dialects and cultural ___. 🌏🎭`,a:[{text:`nuances`,correct:!0,explanation:`Đúng rồi! Sắc thái tinh tế trong văn hóa và ngôn từ là 'cultural nuances'.`},{text:`crimes`,correct:!1,explanation:`'crimes' là các vụ tội phạm hình sự.`},{text:`viruses`,correct:!1,explanation:`'viruses' là vi-rút gây bệnh dịch.`},{text:`weapons`,correct:!1,explanation:`'weapons' là vũ khí sát thương.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'who / The / spoke / was / teacher / English / native / British / .' 👨‍🏫🇬🇧`,a:[{text:`The teacher who spoke English was British native.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (The teacher) + who spoke English (mệnh đề quan hệ) + was (vị ngữ) + British native.`},{text:`The teacher spoke who English was British native.`,correct:!1,explanation:`Đại từ quan hệ 'who' bị đặt sai vị trí.`},{text:`Was British native the teacher who spoke English.`,correct:!1,explanation:`Đảo vị ngữ to be lên đầu sai ngữ pháp.`},{text:`The teacher who English spoke was British native.`,correct:!1,explanation:`Tân ngữ 'English' chen vào trước động từ 'spoke'.`}]},{q:`Why is Standard English firmly entrenched as the universal mandatory communication medium in international aviation? ✈️📻`,a:[{text:`To establish unambiguous clarity in pilot-tower radio transmissions and eliminate deadly miscommunication risks.`,correct:!0,explanation:`Chính xác! Chuẩn hóa tiếng Anh hàng không giúp phi công và kiểm soát viên không lưu hiểu rõ ràng lệnh bay, ngăn ngừa tai nạn thảm khốc.`},{text:`To mandate that all airplanes must be painted completely black.`,correct:!1,explanation:`Không liên quan đến màu sơn máy bay.`},{text:`To prohibit pilots from looking out of cockpit windows.`,correct:!1,explanation:`Không cấm phi công quan sát.`},{text:`To prevent airplanes from refueling at international airports.`,correct:!1,explanation:`Không ngăn cản nạp nhiên liệu.`}]},{q:`Alongside Hindi, English enjoys constitutional recognition as an authoritative subsidiary ___ language in India. 🇮🇳📜`,a:[{text:`official`,correct:!0,explanation:`Chính xác! Ngôn ngữ chính thức của một quốc gia là 'official language'.`},{text:`secret`,correct:!1,explanation:`Không phải ngôn ngữ bí mật.`},{text:`illegal`,correct:!1,explanation:`Không hề phi pháp.`},{text:`unwritten`,correct:!1,explanation:`Tiếng Anh có hệ thống chữ viết hoàn chỉnh.`}]},{q:`Foreign vocabulary items adopted and seamlessly assimilated into the English lexicon (like 'tycoon', 'tsunami', 'banh mi') are called ___ words. 📚🔄`,a:[{text:`loan`,correct:!0,explanation:`Đúng rồi! Từ mượn từ các ngôn ngữ khác là 'loanwords' (hoặc borrowed words).`},{text:`bank`,correct:!1,explanation:`Không dùng 'bank words'.`},{text:`debt`,correct:!1,explanation:`Không dùng 'debt words'.`},{text:`rent`,correct:!1,explanation:`Không dùng 'rent words'.`}]},{q:`The digital multimedia language studio ___ students practice phonetics with interactive pronunciation apps is on the 3rd floor. 🎧💻`,a:[{text:`where`,correct:!0,explanation:`Chính xác! Trạng từ quan hệ 'where' thay thế cho nơi chốn phòng thực hành ('in the digital studio').`},{text:`which`,correct:!1,explanation:`Thiếu giới từ 'in'.`},{text:`whom`,correct:!1,explanation:`Dùng cho người.`},{text:`whose`,correct:!1,explanation:`Dùng cho sở hữu.`}]},{q:`An extraordinarily gifted linguist who can speak and write more than five completely different languages effortlessly is termed a ___. 🧠🗣️`,a:[{text:`polyglot`,correct:!0,explanation:`Đúng rồi! Người biết và thông thạo nhiều thứ tiếng là 'polyglot' (hoặc multilingual person).`},{text:`pilot`,correct:!1,explanation:`'pilot' là phi công lái máy bay.`},{text:`sailor`,correct:!1,explanation:`'sailor' là thủy thủ đi tàu biển.`},{text:`gardener`,correct:!1,explanation:`'gardener' là người làm vườn chăm sóc hoa.`}]},{q:`The distinctive term 'Americanisms' denotes colorful idiomatic expressions that originated predominantly within the United ___. 🇺🇸🦅`,a:[{text:`States`,correct:!0,explanation:`Chính xác! Nước Mỹ là 'the United States' (USA).`},{text:`Kingdom`,correct:!1,explanation:`Vương quốc Anh là the United Kingdom.`},{text:`Emirates`,correct:!1,explanation:`Các Tiểu vương quốc Ả Rập là the United Arab Emirates.`},{text:`Nations`,correct:!1,explanation:`Liên Hợp Quốc là the United Nations.`}]},{q:`Lớp màng khí quyển mỏng manh ở tầng bình lưu bảo vệ mọi sinh vật Trái Đất khỏi tia bức xạ cực tím tử ngoại của Mặt Trời là: 🛡️☀️`,a:[{text:`ozone layer`,correct:!0,explanation:`Chính xác! Tầng ô-zôn hấp thụ tia UV gây ung thư da là 'ozone layer'.`},{text:`cloud blanket`,correct:!1,explanation:`Lớp mây che phủ bình thường.`},{text:`smoke cloud`,correct:!1,explanation:`Đám mây khói bụi độc hại.`},{text:`steam layer`,correct:!1,explanation:`Lớp hơi nước bốc lên từ biển.`}]},{q:`Mức độ phong phú và đa dạng sinh học của tất cả các loài sinh vật sống trong các hệ sinh thái trên Trái Đất gọi là: 🌿🐾`,a:[{text:`biodiversity`,correct:!0,explanation:`Đúng rồi! Tính đa dạng sinh học là 'biodiversity'.`},{text:`monoculture`,correct:!1,explanation:`'monoculture' là chế độ độc canh trồng duy nhất một loại cây.`},{text:`deforestation`,correct:!1,explanation:`'deforestation' là nạn phá hủy rừng đầu nguồn.`},{text:`desertification`,correct:!1,explanation:`'desertification' là hiện tượng sa mạc hóa đất đai.`}]},{q:`Những cánh rừng mưa nhiệt đới bạt ngàn hấp thụ hàng tỷ tấn khí CO2 và giải phóng dưỡng khí ô-xy được ví như: 🌳🫁`,a:[{text:`lungs of the Earth`,correct:!0,explanation:`Chính xác! 'Lá phổi xanh của Trái Đất' (lungs of the Earth) là biểu tượng của rừng mưa Amazon và các cánh rừng nguyên sinh.`},{text:`hearth of the world`,correct:!1,explanation:`Lò sưởi của thế giới.`},{text:`stomach of nature`,correct:!1,explanation:`Dạ dày tiêu hóa của tự nhiên.`},{text:`brain of animals`,correct:!1,explanation:`Bộ não của các loài động vật.`}]},{q:`The Amazon basin is an immense tropical biotope in ___ millions of undiscovered insect and botanical species flourish. 🌴🦋`,a:[{text:`which`,correct:!0,explanation:`Đúng rồi! Cấu trúc giới từ + đại từ quan hệ chỉ vật: 'in which' (nơi mà trong đó... = where).`},{text:`that`,correct:!1,explanation:`Sau giới từ 'in', tuyệt đối không được dùng đại từ quan hệ 'that'.`},{text:`whom`,correct:!1,explanation:`'whom' chỉ dùng cho người sau giới từ.`},{text:`whose`,correct:!1,explanation:`Thiếu danh từ sở hữu phía sau.`}]},{q:`The national biosphere reserve ___ our high school biology club surveyed last weekend shelters critically endangered primates. 🐒🌳`,a:[{text:`which (that)`,correct:!0,explanation:`Chính xác! Đại từ quan hệ 'which' hoặc 'that' làm tân ngữ cho động từ 'surveyed' (khu bảo tồn mà chúng tôi đã khảo sát).`},{text:`where`,correct:!1,explanation:`Động từ 'surveyed' là ngoại động từ cần tân ngữ trực tiếp, không dùng trạng từ 'where'.`},{text:`who`,correct:!1,explanation:`Khu bảo tồn là vật/địa điểm, không dùng 'who'.`},{text:`whose`,correct:!1,explanation:`Sai nghĩa sở hữu.`}]},{q:`The renowned marine ecologist to ___ the prestigious international conservation award was granted gave an impassioned speech. 🪸🏆`,a:[{text:`whom`,correct:!0,explanation:`Đúng rồi! Sau giới từ 'to', đại từ quan hệ thay thế cho danh từ chỉ người 'marine ecologist' bắt buộc phải là 'whom'.`},{text:`who`,correct:!1,explanation:`Sau giới từ không dùng 'who', bắt buộc dùng 'whom'.`},{text:`that`,correct:!1,explanation:`Tuyệt đối không dùng 'that' đứng ngay sau giới từ.`},{text:`which`,correct:!1,explanation:`Nhà sinh vật học là người, không dùng 'which'.`}]},{q:`Local inhabitants vividly remembered that dreadful midnight ___ the volcanic crater exploded and rained fiery magma. 🌋🌙`,a:[{text:`when (at which)`,correct:!0,explanation:`Chính xác! Trạng từ quan hệ 'when' (hoặc 'at which') thay thế cho mốc thời gian 'that dreadful midnight'.`},{text:`where`,correct:!1,explanation:`'where' dùng cho nơi chốn, không dùng cho thời gian.`},{text:`why`,correct:!1,explanation:`'why' dùng cho lý do nguyên nhân.`},{text:`which`,correct:!1,explanation:`Nếu dùng 'which' phải có giới từ 'at which'.`}]},{q:`Ecologists have not determined the conclusive scientific cause ___ millions of honeybee colonies are vanishing across continents. 🐝🔍`,a:[{text:`why (for which)`,correct:!0,explanation:`Đúng rồi! Trạng từ quan hệ 'why' (hoặc 'for which') đứng sau danh từ 'cause / reason' chỉ lý do.`},{text:`where`,correct:!1,explanation:`'where' chỉ địa điểm nơi chốn.`},{text:`when`,correct:!1,explanation:`'when' chỉ mốc thời gian.`},{text:`who`,correct:!1,explanation:`'who' chỉ người.`}]},{q:`Planet Earth is the sole celestial orb in our solar system on ___ abundant liquid water and biological life coexist. 🌍💧`,a:[{text:`which`,correct:!0,explanation:`Chính xác! Giới từ + đại từ quan hệ chỉ vật: 'on which' (trên hành tinh mà ở đó... = where).`},{text:`that`,correct:!1,explanation:`Sau giới từ 'on' tuyệt đối cấm dùng 'that'.`},{text:`whom`,correct:!1,explanation:`Dùng cho người sau giới từ.`},{text:`who`,correct:!1,explanation:`Không dùng who sau giới từ.`}]},{q:`Hiện tượng nền nhiệt trung bình của Trái Đất tăng lên do nồng độ khí nhà kính trong khí quyển quá cao gọi là: 🌡️🔥`,a:[{text:`global warming`,correct:!0,explanation:`Chính xác! Sự nóng lên toàn cầu là 'global warming'.`},{text:`global cooling`,correct:!1,explanation:`Hiện tượng Trái Đất lạnh đi đóng băng.`},{text:`polar night`,correct:!1,explanation:`Đêm vùng cực kéo dài 6 tháng.`},{text:`solar eclipse`,correct:!1,explanation:`Hiện tượng nhật thực Mặt Trời.`}]},{q:`Odd one out: Chọn câu hỏi đuôi (tag question) có ngữ điệu XUỐNG GIỌNG (Falling intonation - Người nói chắc chắn và tìm kiếm sự đồng thuận): 🔊`,a:[{text:`Earth revolves around the Sun, doesn't it?`,correct:!0,explanation:`Chính xác! Câu trần thuật hiển nhiên khi người nói chắc chắn 100% sự thật khoa học sẽ xuống giọng ở câu hỏi đuôi, trong khi các câu còn lại lên giọng vì thực sự nghi vấn chưa biết.`},{text:`You don't happen to have an extra umbrella, do you?`,correct:!1,explanation:`Lên giọng vì thực sự không biết hỏi thăm.`},{text:`She hasn't finished her biology assignment yet, has she?`,correct:!1,explanation:`Lên giọng để kiểm tra thông tin nghi vấn.`},{text:`They aren't planning to cancel the eco-tour, are they?`,correct:!1,explanation:`Lên giọng vì lo lắng hỏi lại.`}]},{q:`Odd one out: Yếu tố nào THUỘC HỆ SINH THÁI TỰ NHIÊN BAN TẶNG, không phải rác thải hóa chất do con người tạo ra? 🌿`,a:[{text:`mangrove forest`,correct:!0,explanation:`Đúng rồi! 'mangrove forest' (rừng ngập mặn ven biển) là hệ sinh thái tự nhiên tuyệt vời, còn plastic microparticles, toxic pesticides, industrial sludge là rác thải hóa chất độc hại.`},{text:`plastic microparticles`,correct:!1,explanation:`Vi hạt nhựa nhân tạo độc hại.`},{text:`toxic chemical pesticides`,correct:!1,explanation:`Thuốc trừ sâu hóa học ngấm vào đất.`},{text:`industrial heavy metal sludge`,correct:!1,explanation:`Bùn thải kim loại nặng từ nhà máy.`}]},{q:`Sắp xếp chữ cái thành từ chỉ đa dạng sinh học: 'y - i - o - i - b - s - t - e - d - r - v - i' 🐾🌿`,a:[{text:`biodiversity`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'biodiversity' (tính đa dạng sinh học của muôn loài).`},{text:`biodiversiti`,correct:!1,explanation:`Sai chữ y cuối thành i.`},{text:`biodiversety`,correct:!1,explanation:`Sai chữ i giữa thành e.`},{text:`baodiversity`,correct:!1,explanation:`Sai chữ i đầu thành a.`}]},{q:`Nối hai câu sau dùng cấu trúc 'Giới từ + Đại từ quan hệ': 'The Earth is our fragile home. All living species depend on this planet.' 🌍🤝`,a:[{text:`The Earth is our fragile home on which all living species depend.`,correct:!0,explanation:`Chính xác! 'depend on' đi kèm với 'which' tạo thành cụm trang trọng 'on which all living species depend'.`},{text:`The Earth is our home on that all species depend.`,correct:!1,explanation:`Tuyệt đối không dùng 'that' sau giới từ 'on'.`},{text:`The Earth is our home which all species depend.`,correct:!1,explanation:`Thiếu giới từ 'on' dẫn đến sai ngữ pháp.`},{text:`The Earth is our home on where all species depend.`,correct:!1,explanation:`Không kết hợp giới từ 'on' chung với 'where'.`}]},{q:`Tìm lỗi sai trong câu chứa mệnh đề quan hệ sau: 'The ancient primeval forest in that rare golden monkeys dwell is heavily patrolled.' 🐒🌲`,a:[{text:`in that -> in which (hoặc where)`,correct:!0,explanation:`Đúng rồi! Sau giới từ chỉ nơi chốn 'in', tuyệt đối cấm dùng đại từ quan hệ 'that', bắt buộc phải dùng 'in which' (hoặc thay bằng trạng từ quan hệ 'where').`},{text:`ancient primeval -> anciently primeval`,correct:!1,explanation:`Cặp tính từ bổ nghĩa đúng trật tự.`},{text:`golden monkeys dwell -> dwell golden monkeys`,correct:!1,explanation:`Trật tự chủ ngữ vị ngữ mệnh đề quan hệ là chuẩn.`},{text:`is heavily patrolled -> are heavily patrolled`,correct:!1,explanation:`Chủ ngữ số ít 'The forest' đi với 'is' là chính xác.`}]},{q:`Rừng ngập mặn ven biển với mạng lưới rễ cọc đan chằng chịt giúp chắn sóng bão và chống sạt lở bờ biển là: 🌊🦀`,a:[{text:`mangrove forest`,correct:!0,explanation:`Chính xác! Rừng ngập mặn là 'mangrove forest' (như rừng đước Cần Giờ, Cà Mau).`},{text:`pine woodland`,correct:!1,explanation:`Rừng thông kim vùng núi cao ôn đới.`},{text:`bamboo thicket`,correct:!1,explanation:`Bụi tre làng quê.`},{text:`desert oasis`,correct:!1,explanation:`Ốc đảo xanh giữa sa mạc cát.`}]},{q:`Tầng đất đóng băng vĩnh cửu hàng ngàn năm ở vùng Bắc Cực đang rã đông giải phóng lượng lớn khí methane nguy hiểm là: ❄️🌍`,a:[{text:`permafrost`,correct:!0,explanation:`Tuyệt vời! Tầng đất đóng băng vĩnh cửu vùng cực là 'permafrost'.`},{text:`quicksand`,correct:!1,explanation:`'quicksand' là bãi cát lún chết người.`},{text:`limestone cave`,correct:!1,explanation:`'limestone cave' là hang động đá vôi.`},{text:`coral reef`,correct:!1,explanation:`'coral reef' là rạn san hô dưới biển.`}]},{q:`Renewable green energy harnessing sunlight, ocean tides, and gusts of wind generates electrical power without exhausting fossil ___. ☀️💨`,a:[{text:`fuels`,correct:!0,explanation:`Chính xác! Nhiên liệu hóa thạch (như than đá, dầu mỏ, khí đốt) là 'fossil fuels'.`},{text:`clothes`,correct:!1,explanation:`'clothes' là quần áo may mặc.`},{text:`foods`,correct:!1,explanation:`'foods' là các món đồ ăn.`},{text:`books`,correct:!1,explanation:`'books' là những cuốn sách in.`}]},{q:`International Earth Day is enthusiastically observed worldwide on April 22nd to galvanize public advocacy for ecological ___. 📅🌱`,a:[{text:`protection (conservation)`,correct:!0,explanation:`Đúng rồi! Ngày Trái Đất (22/4) nâng cao ý thức bảo vệ môi trường sinh thái ('ecological protection').`},{text:`pollution`,correct:!1,explanation:`Không ai kỷ niệm để 'bảo vệ sự ô nhiễm'.`},{text:`destruction`,correct:!1,explanation:`Không thúc đẩy sự phá hủy môi trường.`},{text:`neglect`,correct:!1,explanation:`Không thúc đẩy thói thờ ơ.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'Earth / on / The / which / is / planet / live / the / we / .' 🌍✨`,a:[{text:`The Earth is the planet on which we live.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (The Earth) + is the planet (vị ngữ) + on which we live (mệnh đề quan hệ trang trọng).`},{text:`The Earth is the on which planet we live.`,correct:!1,explanation:`Cụm danh từ 'the planet' bị chia cắt sai.`},{text:`On which we live the Earth is the planet.`,correct:!1,explanation:`Đảo ngữ sai quy tắc.`},{text:`The Earth on which is the planet we live.`,correct:!1,explanation:`Động từ to be đặt sai vị trí.`}]},{q:`What ecological tipping point looms if global average temperatures surpass two degrees Celsius above pre-industrial levels? 🌡️🚨`,a:[{text:`Catastrophic die-off of tropical coral reefs, runaway polar ice collapse, and extreme weather calamities.`,correct:!0,explanation:`Chính xác! Vượt ngưỡng 2 độ C sẽ gây tuyệt chủng rạn san hô, sụp đổ dải băng cực và thiên tai bão lũ hạn hán hủy diệt khắp địa cầu.`},{text:`All human beings will immediately sprout green leaves and turn into oak trees.`,correct:!1,explanation:`Con người không biến thành cây sồi phi lý.`},{text:`The oceans will instantly evaporate into sweet lemonade within seconds.`,correct:!1,explanation:`Nước biển không biến thành nước chanh ngọt.`},{text:`Gravity will reverse, flinging all buildings into outer space.`,correct:!1,explanation:`Trọng lực không đảo ngược ném nhà cửa vào vũ trụ.`}]},{q:`Green photosynthetic plants ingest carbon dioxide during daytime and release life-giving ___ into the planetary biosphere. 🌿🫧`,a:[{text:`oxygen`,correct:!0,explanation:`Chính xác! Thực vật quang hợp nhả khí dưỡng khí 'oxygen' cho muôn loài hít thở.`},{text:`plastic`,correct:!1,explanation:`Cây xanh không thải nhựa tổng hợp.`},{text:`oil`,correct:!1,explanation:`Cây xanh không xả dầu nhớt thải.`},{text:`smoke`,correct:!1,explanation:`Cây xanh không xả khói bụi công nghiệp.`}]},{q:`Discarded single-use plastics slowly disintegrate in ocean waters into invisible toxic particles called ___, which contaminate fish tissue. 🌊🧴`,a:[{text:`microplastics`,correct:!0,explanation:`Đúng rồi! Các hạt vi nhựa siêu nhỏ tích tụ trong chuỗi thức ăn đại dương là 'microplastics'.`},{text:`microphones`,correct:!1,explanation:`'microphones' là micrô thu âm giọng nói.`},{text:`microscopes`,correct:!1,explanation:`'microscopes' là kính hiển vi phóng đại.`},{text:`microchips`,correct:!1,explanation:`'microchips' là vi mạch điện tử silicon.`}]},{q:`Arid desert landscapes are characterized by harsh extreme temperature swings, scarce precipitation, and minimal vegetation ___. 🏜️🌵`,a:[{text:`cover`,correct:!0,explanation:`Chính xác! Thảm thực vật che phủ mặt đất là 'vegetation cover'.`},{text:`blanket`,correct:!1,explanation:`Không dùng 'vegetation blanket' trong thuật ngữ địa lý này.`},{text:`hat`,correct:!1,explanation:`Không dùng 'vegetation hat'.`},{text:`curtain`,correct:!1,explanation:`Không dùng 'vegetation curtain'.`}]},{q:`The landmark Paris Agreement mobilizes signatory nations to implement aggressive carbon mitigation plans to limit warming below 1.5 degrees ___. 🌡️📜`,a:[{text:`Celsius`,correct:!0,explanation:`Tuyệt vời! Đơn vị nhiệt độ bách phân đo nhiệt độ toàn cầu là 'degrees Celsius' (°C).`},{text:`Meters`,correct:!1,explanation:`'Meters' là mét đo chiều dài khoảng cách.`},{text:`Liters`,correct:!1,explanation:`'Liters' là lít đo dung tích chất lỏng.`},{text:`Grams`,correct:!1,explanation:`'Grams' là gam đo khối lượng cân nặng.`}]},{q:`Thiết bị cầm tay chuyên dụng dùng để đọc sách điện tử với màn hình mực điện tử e-ink chống lóa bảo vệ mắt là: 📖📱`,a:[{text:`e-reader (e-book reader)`,correct:!0,explanation:`Chính xác! Máy đọc sách điện tử chuyên dụng là 'e-reader' (như Kindle, Kobo).`},{text:`loudspeaker`,correct:!1,explanation:`'loudspeaker' là loa phóng thanh phát âm thanh to.`},{text:`webcam`,correct:!1,explanation:`'webcam' là máy quay phim truyền hình ảnh qua mạng.`},{text:`gamepad`,correct:!1,explanation:`'gamepad' là tay cầm điều khiển trò chơi điện tử.`}]},{q:`Bảng cảm ứng kỹ thuật số kích thước lớn gắn tường cho phép giáo viên và học sinh tương tác trực tiếp bài giảng gọi là: 🖥️🖊️`,a:[{text:`interactive smartboard`,correct:!0,explanation:`Đúng rồi! Bảng tương tác thông minh trong lớp học hiện đại là 'interactive smartboard'.`},{text:`wooden blackboard`,correct:!1,explanation:`'wooden blackboard' là bảng gỗ đen viết bằng phấn bụi trắng.`},{text:`paper poster`,correct:!1,explanation:`'paper poster' là tấm áp phích giấy dán tường.`},{text:`notice board`,correct:!1,explanation:`'notice board' là bảng thông báo ghim giấy.`}]},{q:`Các thiết bị công nghệ điện tử đeo trực tiếp trên cơ thể người như đồng hồ thông minh theo dõi sức khỏe thuộc nhóm: ⌚🏃‍♂️`,a:[{text:`wearable technology (smartwatch)`,correct:!0,explanation:`Chính xác! Công nghệ đeo thông minh là 'wearable technology'.`},{text:`heavy machinery`,correct:!1,explanation:`'heavy machinery' là máy móc công nghiệp nặng máy ủi máy xúc.`},{text:`desktop computer`,correct:!1,explanation:`'desktop computer' là dàn máy tính để bàn cồng kềnh.`},{text:`refrigerator`,correct:!1,explanation:`'refrigerator' là chiếc tủ lạnh bảo quản đồ ăn.`}]},{q:`Modern smart electronic tablets facilitate rapid digital document retrieval; ___, continuous gaze triggers severe ocular fatigue. 📱👀`,a:[{text:`however (nevertheless)`,correct:!0,explanation:`Đúng rồi! Trạng từ liên kết chỉ sự tương phản đối lập đứng sau dấu chấm phẩy và trước dấu phẩy là 'however' hoặc 'nevertheless' (tuy nhiên).`},{text:`furthermore`,correct:!1,explanation:`'furthermore' mang nghĩa bổ sung thêm, không chỉ tương phản.`},{text:`therefore`,correct:!1,explanation:`'therefore' mang nghĩa vì vậy/do đó, chỉ kết quả.`},{text:`in addition`,correct:!1,explanation:`'in addition' mang nghĩa ngoài ra/hơn nữa.`}]},{q:`Portable digital e-readers store thousands of encyclopedic volumes; ___, their energy-efficient batteries last for weeks without recharging. 📚🔋`,a:[{text:`moreover (furthermore)`,correct:!0,explanation:`Chính xác! Trạng từ liên kết bổ sung thông tin tích cực cùng chiều: 'moreover / furthermore / in addition' (hơn nữa, thêm vào đó).`},{text:`however`,correct:!1,explanation:`'however' chỉ sự tương phản đối lập.`},{text:`on the contrary`,correct:!1,explanation:`'on the contrary' chỉ sự đối lập hoàn toàn.`},{text:`in contrast`,correct:!1,explanation:`'in contrast' chỉ sự so sánh tương phản.`}]},{q:`Nam spent eight consecutive hours engrossed in multiplayer mobile gaming; ___, he suffered from throbbing headaches and blurred vision. 🎮🤕`,a:[{text:`consequently (as a result)`,correct:!0,explanation:`Đúng rồi! Trạng từ liên kết chỉ hệ quả/kết quả tất yếu của hành động trước đó là 'consequently' hoặc 'as a result' (hậu quả là, kết quả là).`},{text:`meanwhile`,correct:!1,explanation:`'meanwhile' mang nghĩa trong lúc đó.`},{text:`similarly`,correct:!1,explanation:`'similarly' mang nghĩa tương tự như vậy.`},{text:`nonetheless`,correct:!1,explanation:`'nonetheless' mang nghĩa dù sao đi nữa/tuy nhiên.`}]},{q:`Intelligent educational software provides customized interactive problem sets. ___, it furnishes real-time analytical grading feedback. 💻📊`,a:[{text:`Furthermore (In addition)`,correct:!0,explanation:`Chính xác! 'Furthermore / In addition / Besides' đứng đầu câu chỉ sự bổ sung thêm thông tin hỗ trợ.`},{text:`However`,correct:!1,explanation:`'However' chỉ tương phản trái ngược.`},{text:`Although`,correct:!1,explanation:`'Although' là liên từ phụ thuộc nối hai vế trong cùng một câu, không đứng đầu câu đơn riêng rẽ với dấu phẩy.`},{text:`Even though`,correct:!1,explanation:`Sai chức năng liên từ.`}]},{q:`___ their profound pedagogical utility, cellular phones must remain deactivated during formal standardized examination sessions. 📱🚫`,a:[{text:`In spite of (Despite)`,correct:!0,explanation:`Đúng rồi! Cụm giới từ chỉ sự nhượng bộ trước cụm danh từ 'their profound pedagogical utility': 'In spite of / Despite' (Mặc dù có ích lợi lớn...).`},{text:`Although`,correct:!1,explanation:`'Although' phải đi với mệnh đề có chủ ngữ và vị ngữ S-V.`},{text:`Even though`,correct:!1,explanation:`'Even though' phải đi với mệnh đề S-V.`},{text:`Because`,correct:!1,explanation:`'Because' chỉ nguyên nhân, không chỉ nhượng bộ.`}]},{q:`The municipal educational department equipped all classrooms with high-speed fiber-optic connectivity; ___, teachers can stream educational documentaries effortlessly. 📡🎥`,a:[{text:`therefore (as a result)`,correct:!0,explanation:`Chính xác! 'therefore / as a result' nối mệnh đề nguyên nhân với kết quả thuận lợi sinh ra.`},{text:`nevertheless`,correct:!1,explanation:`'nevertheless' chỉ sự đối lập tương phản.`},{text:`otherwise`,correct:!1,explanation:`'otherwise' mang nghĩa nếu không thì.`},{text:`instead`,correct:!1,explanation:`'instead' mang nghĩa thay vào đó.`}]},{q:`Odd one out: Chọn liên từ CHỈ KẾT QUẢ / HỆ QUẢ (khác với nhóm liên từ chỉ sự tương phản đối lập): therefore, however, nevertheless, nonetheless 🔊`,a:[{text:`therefore`,correct:!0,explanation:`Chính xác! 'therefore' là trạng từ liên kết chỉ kết quả hệ quả (vì vậy, do đó), trong khi however, nevertheless, nonetheless đều mang ý nghĩa tương phản nhượng bộ (tuy nhiên).`},{text:`however`,correct:!1,explanation:`Mang nghĩa tương phản đối lập (tuy nhiên).`},{text:`nevertheless`,correct:!1,explanation:`Mang nghĩa tương phản nhượng bộ (dẫu vậy).`},{text:`nonetheless`,correct:!1,explanation:`Mang nghĩa tương phản nhượng bộ (tuy nhiên).`}]},{q:`Odd one out: Thiết bị nào LÀ DỤNG CỤ TÍNH TOÁN CƠ HỌC CỔ XƯA THỜI TIỀN SỬ, không phải thiết bị điện tử số thông minh? 🧮`,a:[{text:`wooden abacus`,correct:!0,explanation:`Đúng rồi! 'wooden abacus' (bàn tính gẩy hạt bằng gỗ) là dụng cụ cơ học cổ xưa, còn tablet, e-reader, smartwatch là các thiết bị điện tử kỹ thuật số thông minh.`},{text:`digital tablet`,correct:!1,explanation:`Máy tính bảng điện tử thông minh.`},{text:`wearable smartwatch`,correct:!1,explanation:`Đồng hồ đeo tay thông minh kết nối Bluetooth.`},{text:`e-reader device`,correct:!1,explanation:`Thiết bị đọc sách điện tử mực e-ink.`}]},{q:`Sắp xếp chữ cái thành từ chỉ thuộc về điện tử kỹ thuật số: 'i - c - l - n - o - c - e - r - t - e' ⚡💻`,a:[{text:`electronic`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'electronic' (thuộc về điện tử).`},{text:`electranic`,correct:!1,explanation:`Sai chữ o thành a.`},{text:`electronik`,correct:!1,explanation:`Sai chữ c cuối thành k.`},{text:`electrionic`,correct:!1,explanation:`Thừa chữ i trước c.`}]},{q:`Viết lại câu dùng trạng từ liên kết kết quả 'As a result': 'He neglected his coursework due to excessive smartphone gaming, so he failed the semester exam.' 🎮📉`,a:[{text:`He neglected his coursework due to excessive smartphone gaming; as a result, he failed the semester exam.`,correct:!0,explanation:`Chính xác! Cấu trúc: 'Mệnh đề 1; as a result, Mệnh đề 2' diễn đạt kết quả một cách chuẩn xác và học thuật.`},{text:`He neglected coursework; however, he failed the semester exam.`,correct:!1,explanation:`'however' chỉ tương phản, sai ý nghĩa kết quả.`},{text:`As a result he neglected coursework, he failed the exam.`,correct:!1,explanation:`Sai vị trí mệnh đề nguyên nhân - kết quả.`},{text:`He neglected coursework; in addition, he failed exam result.`,correct:!1,explanation:`Dùng sai từ nối.`}]},{q:`Tìm lỗi sai trong câu dùng từ nối sau: 'Electronic tablets are immensely useful for research; moreover, they can distract undisciplined students.' 📱⚠️`,a:[{text:`moreover -> however (hoặc nevertheless)`,correct:!0,explanation:`Đúng rồi! Hai vế của câu mang ý nghĩa đối lập (một bên là lợi ích nghiên cứu, một bên là gây xao nhãng) nên phải dùng liên từ tương phản 'however', không dùng liên từ bổ sung 'moreover'.`},{text:`immensely useful -> useful immensely`,correct:!1,explanation:`Trạng từ đứng trước tính từ là đúng.`},{text:`useful for research -> useful to research`,correct:!1,explanation:`Giới từ 'for research' là chuẩn xác.`},{text:`undisciplined students -> students undisciplined`,correct:!1,explanation:`Tính từ đứng trước danh từ là đúng.`}]},{q:`Công nghệ truyền tải năng lượng điện từ qua đế sạc từ trường mà không cần cắm dây cáp trực tiếp vào thiết bị là: 🔋⚡`,a:[{text:`wireless charging`,correct:!0,explanation:`Chính xác! Công nghệ sạc không dây là 'wireless charging'.`},{text:`coal burning`,correct:!1,explanation:`Đốt than đá sinh nhiệt.`},{text:`kerosene lighting`,correct:!1,explanation:`Thắp đèn dầu hỏa.`},{text:`hand cranking`,correct:!1,explanation:`Quay tay đòn cơ học tạo điện.`}]},{q:`Phần mềm trí tuệ nhân tạo nhận diện giọng nói giúp thực hiện cuộc gọi, đặt báo thức và tra cứu thông tin theo khẩu lệnh là: 🗣️🤖`,a:[{text:`voice assistant (virtual assistant)`,correct:!0,explanation:`Tuyệt vời! Trợ lý ảo điều khiển bằng giọng nói là 'voice assistant' (như Siri, Google Assistant).`},{text:`mechanical typewriter`,correct:!1,explanation:`Máy đánh chữ bằng phím gõ kim loại cổ.`},{text:`smoke detector`,correct:!1,explanation:`Cảm biến báo cháy phát hiện khói.`},{text:`bicycle pedal`,correct:!1,explanation:`Bàn đạp bàn chân xe đạp.`}]},{q:`Wearable biometric sensors continuously monitor resting pulse rates, daily step counts, and overnight slumber ___. ⌚💤`,a:[{text:`quality (cycles)`,correct:!0,explanation:`Chính xác! Vòng đeo tay thông minh đo lường chất lượng giấc ngủ và chu kỳ ngủ là 'slumber quality' hoặc 'cycles'.`},{text:`furniture`,correct:!1,explanation:`'furniture' là đồ đạc bàn ghế trong nhà.`},{text:`vegetables`,correct:!1,explanation:`'vegetables' là rau củ quả nấu ăn.`},{text:`receipts`,correct:!1,explanation:`'receipts' là hóa đơn thanh toán tiền.`}]},{q:`Prolonged exposure to intense artificial blue light emitted by tablet displays late at night suppresses the natural synthesis of sleep-inducing ___. 📱😴`,a:[{text:`melatonin`,correct:!0,explanation:`Đúng rồi! Melatonin là hoóc-môn tự nhiên điều hòa giấc ngủ; ánh sáng xanh điện thoại ức chế chất này khiến cơ thể mất ngủ.`},{text:`calcium`,correct:!1,explanation:`Canxi là khoáng chất cho xương chắc khỏe.`},{text:`chlorophyll`,correct:!1,explanation:`Chất diệp lục quang hợp trong lá cây.`},{text:`keratin`,correct:!1,explanation:`Chất sừng tạo nên móng tay và tóc.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'useful / are / Tablets / ; / however / distract / they / can / students / .' 📱⚠️`,a:[{text:`Tablets are useful; however, they can distract students.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: Tablets are useful; however, they can distract students (Máy tính bảng rất hữu ích; tuy nhiên, chúng có thể làm xao nhãng học sinh).`},{te
