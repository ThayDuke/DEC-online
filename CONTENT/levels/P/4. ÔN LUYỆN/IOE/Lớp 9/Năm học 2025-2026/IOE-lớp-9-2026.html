const fullQuestionBank=[{q:`Làng Bát Tràng (Hà Nội) trứ danh khắp bốn phương với nghề truyền thống làm đồ gốm sứ. 'Đồ gốm' tiếng Anh là: 🏺🍶`,a:[{text:`pottery`,correct:!0,explanation:`Chính xác! Đồ gốm sứ thủ công mỹ nghệ nung từ đất sét là 'pottery'.`},{text:`carpentry`,correct:!1,explanation:`'carpentry' là nghề mộc cưa bào gỗ.`},{text:`blacksmithing`,correct:!1,explanation:`'blacksmithing' là nghề rèn sắt đe búa.`},{text:`tailoring`,correct:!1,explanation:`'tailoring' là nghề may đo quần áo.`}]},{q:`Làng Vạn Phúc (Hà Đông) nổi tiếng với nghề dệt những dải lụa tơ tằm óng ả mềm mại. 'Nghề dệt lụa' là: 🧵👘`,a:[{text:`silk weaving`,correct:!0,explanation:`Đúng rồi! Nghề dệt lụa truyền thống là 'silk weaving'.`},{text:`bronze casting`,correct:!1,explanation:`'bronze casting' là nghề đúc đồng.`},{text:`stone carving`,correct:!1,explanation:`'stone carving' là nghề tạc tượng đá.`},{text:`paper making`,correct:!1,explanation:`'paper making' là nghề làm giấy thủ công.`}]},{q:`Người thợ thủ công lành nghề và tài hoa tạo ra các tác phẩm mỹ nghệ bằng đôi tay khéo léo là: 👨‍🎨🏺`,a:[{text:`artisan (craftsman)`,correct:!0,explanation:`Chính xác! Nghệ nhân thủ công là 'artisan' hoặc 'craftsman'.`},{text:`mechanic`,correct:!1,explanation:`'mechanic' là thợ sửa chữa máy móc động cơ.`},{text:`astronaut`,correct:!1,explanation:`'astronaut' là phi hành gia bay vào vũ trụ.`},{text:`accountant`,correct:!1,explanation:`'accountant' là nhân viên kế toán sổ sách.`}]},{q:`The delicate craft of weaving sedge mats has been passed ___ through four successive generations in our family. 📜🌾`,a:[{text:`down`,correct:!0,explanation:`Đúng rồi! Cụm động từ 'pass down' có nghĩa là truyền lại từ thế hệ này sang thế hệ sau.`},{text:`out`,correct:!1,explanation:`'pass out' là ngất xỉu hoặc phân phát tài liệu.`},{text:`away`,correct:!1,explanation:`'pass away' là qua đời, mất.`},{text:`by`,correct:!1,explanation:`'pass by' là đi ngang qua.`}]},{q:`A group of ambitious young artisans decided to set ___ a community cooperative to showcase local handicrafts. 🛍️🤝`,a:[{text:`up`,correct:!0,explanation:`Chính xác! Cụm động từ 'set up' có nghĩa là thành lập, mở ra (công ty, cửa hàng, hợp tác xã).`},{text:`off`,correct:!1,explanation:`'set off' là khởi hành lên đường.`},{text:`down`,correct:!1,explanation:`'set down' là ghi chép lại.`},{text:`in`,correct:!1,explanation:`'set in' là (thời tiết xấu) bắt đầu kéo đến.`}]},{q:`Due to the economic recession and high rental costs, the traditional ceramic workshop had to close ___ permanently. 🏚️🚪`,a:[{text:`down`,correct:!0,explanation:`Đúng rồi! Cụm động từ 'close down' có nghĩa là đóng cửa, ngừng hoạt động vĩnh viễn.`},{text:`up`,correct:!1,explanation:`'close up' là đóng cửa tạm thời vào cuối ngày.`},{text:`in`,correct:!1,explanation:`'close in' là bao vây áp sát.`},{text:`off`,correct:!1,explanation:`'close off' là phong tỏa ngăn cách một khu vực.`}]},{q:`It is challenging for young weavers to live ___ the modest earnings gained from handmade conical hats. 👒💵`,a:[{text:`on`,correct:!0,explanation:`Chính xác! Cụm động từ 'live on + tiền/thực phẩm' có nghĩa là sống dựa vào, đủ sống bằng nguồn thu nhập nào đó.`},{text:`in`,correct:!1,explanation:`Không dùng 'live in' với nghĩa sống dựa vào tiền bạc.`},{text:`with`,correct:!1,explanation:`Không dùng 'live with' trong ngữ cảnh mưu sinh thu nhập này.`},{text:`at`,correct:!1,explanation:`Không dùng 'live at'.`}]},{q:`The municipal environment committee must urgently deal ___ the rampant dumping of chemical effluent into the river. 🌊🏭`,a:[{text:`with`,correct:!0,explanation:`Đúng rồi! Cụm động từ 'deal with' có nghĩa là giải quyết, đối phó với (vấn đề nan giải).`},{text:`to`,correct:!1,explanation:`Không dùng 'deal to'.`},{text:`for`,correct:!1,explanation:`Không dùng 'deal for'.`},{text:`about`,correct:!1,explanation:`Không dùng 'deal about'.`}]},{q:`All the neighborhood schoolchildren are enthusiastically looking forward ___ visiting the Bat Trang ceramic kiln next Friday. 🚌🏺`,a:[{text:`to`,correct:!0,explanation:`Chính xác! Cấu trúc: 'look forward to + V-ing/Noun' (trông mong, háo hức chờ đợi điều gì).`},{text:`for`,correct:!1,explanation:`Sai giới từ sau 'looking forward'.`},{text:`at`,correct:!1,explanation:`Không đi với 'at'.`},{text:`in`,correct:!1,explanation:`Không đi với 'in'.`}]},{q:`Mai decided to turn ___ the lucrative corporate job offer in the capital city so she could preserve her family craft. 🏢❌`,a:[{text:`down`,correct:!0,explanation:`Đúng rồi! Cụm động từ 'turn down' có nghĩa là từ chối (lời mời, cơ hội việc làm).`},{text:`up`,correct:!1,explanation:`'turn up' là xuất hiện, đến hoặc vặn to âm lượng.`},{text:`on`,correct:!1,explanation:`'turn on' là bật thiết bị.`},{text:`off`,correct:!1,explanation:`'turn off' là tắt thiết bị.`}]},{q:`Làng tranh dân gian Đông Hồ (tỉnh Bắc Ninh) nổi tiếng với những bức tranh khắc gỗ in trên nền giấy gì lấp lánh vỏ sò? 🖼️🐚`,a:[{text:`Diep paper (paper coated with scallop shell powder)`,correct:!0,explanation:`Chính xác! Tranh Đông Hồ được in trên nền giấy điệp quét bột vỏ sò lấp lánh ánh kim tao nhã.`},{text:`Plastic laminated film`,correct:!1,explanation:`Màng nhựa ép dẻo công nghiệp.`},{text:`Recycled aluminum foil`,correct:!1,explanation:`Màng nhôm tái chế gói thực phẩm.`},{text:`Synthetic vinyl fabric`,correct:!1,explanation:`Vải bạt nhựa tổng hợp.`}]},{q:`Odd one out: Chọn từ có phần phát âm nguyên âm là /aʊ/ (khác với nhóm /əʊ/): downtown, local, close, home 🔊`,a:[{text:`downtown`,correct:!0,explanation:`Chính xác! 'downtown' có nguyên âm đôi /aʊ/ (/ˈdaʊn.taʊn/), trong khi local, close, home đều phát âm là /əʊ/.`},{text:`local`,correct:!1,explanation:`Phát âm là /əʊ/ /ˈləʊ.kəl/.`},{text:`close`,correct:!1,explanation:`Phát âm là /əʊ/ /kləʊz/.`},{text:`home`,correct:!1,explanation:`Phát âm là /əʊ/ /həʊm/.`}]},{q:`Odd one out: Từ nào chỉ NGHỀ THỦ CÔNG MỸ NGHỆ TRUYỀN THỐNG, không phải lực lượng phục vụ cộng đồng hiện đại? 🏺`,a:[{text:`pottery making`,correct:!0,explanation:`Đúng rồi! 'pottery making' (nghề làm gốm) là nghề thủ công mỹ nghệ, còn firefighting, policing, healthcare là các dịch vụ công ích bảo an xã hội.`},{text:`firefighting`,correct:!1,explanation:`'firefighting' là đội cứu hỏa chữa cháy.`},{text:`policing`,correct:!1,explanation:`'policing' là lực lượng cảnh sát trị an.`},{text:`healthcare service`,correct:!1,explanation:`'healthcare service' là dịch vụ y tế chăm sóc sức khỏe.`}]},{q:`Sắp xếp chữ cái thành từ chỉ người thợ thủ công khéo léo: 'i - r - a - n - s - a - t' 👨‍🎨`,a:[{text:`artisan`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'artisan' (nghệ nhân thủ công).`},{text:`artisun`,correct:!1,explanation:`Sai chữ a cuối thành u.`},{text:`artizan`,correct:!1,explanation:`Sai chữ s thành z.`},{text:`artisen`,correct:!1,explanation:`Sai chữ a thành e.`}]},{q:`Viết lại câu dùng cụm động từ 'pass down': 'Ancestors handed down this precious embroidery skill to their descendants.' 🪡✨`,a:[{text:`Ancestors passed down this precious embroidery skill to their descendants.`,correct:!0,explanation:`Chính xác! 'hand down' đồng nghĩa với 'pass down' (truyền lại cho con cháu).`},{text:`Ancestors passed by this embroidery skill to descendants.`,correct:!1,explanation:`'pass by' là đi ngang qua, sai nghĩa.`},{text:`Ancestors turned down this embroidery skill.`,correct:!1,explanation:`'turn down' là từ chối, sai nghĩa.`},{text:`Ancestors closed down this embroidery skill.`,correct:!1,explanation:`'close down' là đóng cửa phá sản.`}]},{q:`Tìm lỗi sai trong câu sau: 'All local residents are looking forward to meet the new police officer at the hall.' 👮‍♂️🏛️`,a:[{text:`to meet -> to meeting`,correct:!0,explanation:`Đúng rồi! Cấu trúc 'look forward to' bắt buộc đi với V-ing ('to meeting'), không đi với động từ nguyên mẫu.`},{text:`All local -> All locally`,correct:!1,explanation:`'local' là tính từ bổ nghĩa cho danh từ residents là chuẩn.`},{text:`police officer -> officer police`,correct:!1,explanation:`Trật tự danh từ ghép đúng là police officer.`},{text:`at the hall -> on the hall`,correct:!1,explanation:`Giới từ chỉ địa điểm 'at the hall' là chính xác.`}]},{q:`Sản phẩm thủ công phủ nhiều lớp sơn ta màu bóng loáng, cẩn xà cừ hoặc vẽ tranh vàng bạc của làng Hạ Thái gọi là: 🥢🎨`,a:[{text:`lacquerware`,correct:!0,explanation:`Chính xác! Đồ thủ công sơn mài tinh xảo là 'lacquerware'.`},{text:`glassware`,correct:!1,explanation:`'glassware' là đồ dùng thủy tinh trong suốt.`},{text:`silverware`,correct:!1,explanation:`'silverware' là dao thìa dĩa bằng bạc.`},{text:`hardware`,correct:!1,explanation:`'hardware' là đồ kim khí ốc vít phần cứng.`}]},{q:`Chiếc nón lá duyên dáng che nắng che mưa cho thiếu nữ Việt mang những câu thơ ẩn hiện dưới ánh nắng là: 👒📜`,a:[{text:`poetic conical hat (non bai tho)`,correct:!0,explanation:`Tuyệt vời! Nón bài thơ xứ Huế che nắng che mưa là 'poetic conical hat'.`},{text:`baseball cap`,correct:!1,explanation:`Mũ lưỡi trai thể thao bóng chày.`},{text:`woolen beanie`,correct:!1,explanation:`Mũ len trùm đầu mùa đông ấm áp.`},{text:`helmet`,correct:!1,explanation:`Mũ bảo hiểm cứng đi xe máy.`}]},{q:`Friendly neighbors in our suburban ward always try to get ___ well with each other to maintain communal solidarity. 🤝🏡`,a:[{text:`on (along)`,correct:!0,explanation:`Đúng rồi! Cụm động từ 'get on/along well with someone' có nghĩa là hòa thuận, ăn ý với ai.`},{text:`up`,correct:!1,explanation:`'get up' là thức dậy.`},{text:`off`,correct:!1,explanation:`'get off' là xuống xe buýt/tàu.`},{text:`away`,correct:!1,explanation:`'get away' là đi nghỉ trốn khỏi nơi nào.`}]},{q:`The youth volunteer union mobilized dozens of teenagers to clean up litter in the neighborhood public ___. 🌳🗑️`,a:[{text:`park`,correct:!0,explanation:`Chính xác! Công viên công cộng của khu dân cư là 'neighborhood public park'.`},{text:`bedroom`,correct:!1,explanation:`Phòng ngủ riêng tư gia đình.`},{text:`wardrobe`,correct:!1,explanation:`Tủ đựng quần áo.`},{text:`bathroom`,correct:!1,explanation:`Phòng tắm cá nhân.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'were / passed / These / from / down / skills / generation / to / generation / .' 📜🤝`,a:[{text:`These skills were passed down from generation to generation.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (These skills) + were passed down (vị ngữ bị động) + from generation to generation (trạng ngữ từ thế hệ này sang thế hệ khác).`},{text:`These skills passed down were from generation to generation.`,correct:!1,explanation:`Đảo sai vị trí trợ từ to be 'were'.`},{text:`From generation these skills were to generation passed down.`,correct:!1,explanation:`Xé rời cụm từ cố định 'from generation to generation'.`},{text:`Passed down these skills were from generation to generation.`,correct:!1,explanation:`Đảo cụm động từ sai quy tắc.`}]},{q:`Why is it essential for travelers to purchase authentic handcrafted items when visiting traditional artisan communities? 🛍️❤️`,a:[{text:`To sustain local artisans' livelihoods and ensure the perpetuation of ancestral cultural crafts.`,correct:!0,explanation:`Chính xác! Mua quà lưu niệm thủ công giúp duy trì sinh kế của nghệ nhân và bảo tồn vốn di sản văn hóa phi vật thể của tổ tiên.`},{text:`To monopolize all raw materials and bankrupt the local workshops.`,correct:!1,explanation:`Không phải để thâu tóm phá sản làng nghề.`},{text:`To encourage villages to abandon handicrafts and build factories.`,correct:!1,explanation:`Không phải để xúi giục bỏ nghề truyền thống.`},{text:`To replace handcrafted products with cheap imported mass plastic.`,correct:!1,explanation:`Không phải để thay đồ thủ công bằng đồ nhựa ngoại.`}]},{q:`An experienced ___ rapidly arrived to diagnose and repair the faulty electrical transformer in our alleyway. ⚡🔧`,a:[{text:`electrician`,correct:!0,explanation:`Đúng rồi! Thợ điện có chuyên môn sửa chữa đường dây điện là 'electrician'.`},{text:`librarian`,correct:!1,explanation:`'librarian' là thủ thư thư viện quản lý sách.`},{text:`florist`,correct:!1,explanation:`'florist' là người cắm và bán hoa tươi.`},{text:`chef`,correct:!1,explanation:`'chef' là đầu bếp nấu ăn nhà hàng.`}]},{q:`The neighborhood management board is debating whether to reconstruct the elderly cultural club. 'whether to reconstruct' nghĩa là: 🏛️💬`,a:[{text:`liệu có nên xây dựng lại hay không`,correct:!0,explanation:`Chính xác! Cấu trúc 'whether + to-infinitive' diễn đạt sự cân nhắc phân vân lựa chọn (liệu có nên làm gì hay không).`},{text:`chắc chắn đã xây dựng xong hôm qua`,correct:!1,explanation:`Sai thì và sai ý nghĩa nghi vấn.`},{text:`bắt buộc phải phá hủy ngay lập tức`,correct:!1,explanation:`Sai nghĩa.`},{text:`tuyệt đối không bao giờ được xây dựng`,correct:!1,explanation:`Sai lệch ý nghĩa gốc.`}]},{q:`Before molding intricate ceramic teapots, potters must prepare soft, pliable ___ on a revolving turntable. 🏺🌀`,a:[{text:`clay`,correct:!0,explanation:`Đúng rồi! Đất sét dẻo dùng để vuốt nặn gốm là 'clay'.`},{text:`iron`,correct:!1,explanation:`'iron' là thanh kim loại sắt cứng.`},{text:`plastic`,correct:!1,explanation:`'plastic' là chất liệu nhựa nhân tạo.`},{text:`cement`,correct:!1,explanation:`'cement' là bột xi măng xây nhà.`}]},{q:`Hệ thống đường sắt đô thị hiện đại vận chuyển hành khách công cộng chạy ngầm dưới lòng đất hoặc trên cao gọi là: 🚇⚡`,a:[{text:`metro line (subway)`,correct:!0,explanation:`Chính xác! Tuyến tàu điện ngầm hoặc đường sắt đô thị trên cao là 'metro line' hoặc 'subway'.`},{text:`ferry boat`,correct:!1,explanation:`'ferry boat' là chiếc phà chở khách qua sông.`},{text:`cable car`,correct:!1,explanation:`'cable car' là tuyến cáp treo vượt núi.`},{text:`horse carriage`,correct:!1,explanation:`'horse carriage' là cỗ xe ngựa kéo.`}]},{q:`Hiện tượng đường phố tê liệt với dòng xe cộ ken đặc nhích từng mét vào giờ tan tầm gọi là: 🚗🛵🛑`,a:[{text:`traffic congestion (traffic jam)`,correct:!0,explanation:`Đúng rồi! Tình trạng ùn tắc giao thông kinh hoàng là 'traffic congestion' hoặc 'traffic jam'.`},{text:`smooth flow`,correct:!1,explanation:`'smooth flow' là dòng chảy lưu thông thông suốt êm ả.`},{text:`pedestrian street`,correct:!1,explanation:`'pedestrian street' là tuyến phố đi bộ thanh bình.`},{text:`car race`,correct:!1,explanation:`'car race' là giải đua xe tốc độ cao.`}]},{q:`Hình ảnh ví von các đại đô thị ngột ngạt với san sát những tòa nhà cao tầng bằng bê tông cốt thép thiếu bóng cây là: 🏢🧱`,a:[{text:`concrete jungle`,correct:!0,explanation:`Chính xác! 'Rừng bê tông' (concrete jungle) là thuật ngữ miêu tả đô thị hóa dày đặc cao ốc thiếu mảng xanh thiên nhiên.`},{text:`tropical rainforest`,correct:!1,explanation:`'tropical rainforest' là rừng mưa nhiệt đới rậm rạp cỏ cây.`},{text:`national park`,correct:!1,explanation:`'national park' là vườn quốc gia sinh thái.`},{text:`flower garden`,correct:!1,explanation:`'flower garden' là vườn hoa khoe sắc.`}]},{q:`The larger a metropolis grows in population, ___ congested its thoroughfares become during peak hours. 📈🚗`,a:[{text:`the more`,correct:!0,explanation:`Đúng rồi! Cấu trúc so sánh kép (Double comparative): 'The + comparative..., the + comparative...' ('The larger..., the more congested...').`},{text:`more`,correct:!1,explanation:`Thiếu mạo từ 'the' trong cấu trúc so sánh kép song song.`},{text:`most`,correct:!1,explanation:`So sánh hơn, không dùng so sánh nhất.`},{text:`the most`,correct:!1,explanation:`Không dùng so sánh nhất trong cấu trúc so sánh kép.`}]},{q:`The more reliable and affordable public transit is, ___ private motorbikes citizens will operate on roads. 🚌📉`,a:[{text:`the fewer`,correct:!0,explanation:`Chính xác! 'motorbikes' là danh từ đếm được số nhiều nên so sánh ít hơn dùng 'the fewer' (càng ít xe máy cá nhân hơn).`},{text:`the less`,correct:!1,explanation:`'the less' đi với danh từ không đếm được, không đi với motorbikes.`},{text:`the little`,correct:!1,explanation:`Sai dạng so sánh hơn.`},{text:`fewer`,correct:!1,explanation:`Thiếu mạo từ 'the' của cấu trúc so sánh kép.`}]},{q:`The higher the cost of living escalates in capital cities, the ___ it becomes for young university graduates to buy homes. 💸🏠`,a:[{text:`harder`,correct:!0,explanation:`Đúng rồi! Cấu trúc so sánh kép: 'The higher..., the harder...' (Chi phí sinh hoạt càng tăng, càng khó khăn cho giới trẻ mua nhà).`},{text:`hardest`,correct:!1,explanation:`Không dùng so sánh nhất trong so sánh kép.`},{text:`more hard`,correct:!1,explanation:`'hard' là tính từ ngắn nên dạng so sánh hơn là 'harder', không dùng 'more hard'.`},{text:`the hardest`,correct:!1,explanation:`Sai cấu trúc so sánh kép.`}]},{q:`The earlier commuter trains depart in the morning, ___ likely passengers are to get caught in peak-hour delays. ⏰🚆`,a:[{text:`the less`,correct:!0,explanation:`Chính xác! 'the less likely' có nghĩa là càng ít khả năng bị kẹt trong giờ cao điểm.`},{text:`less`,correct:!1,explanation:`Thiếu mạo từ 'the'.`},{text:`least`,correct:!1,explanation:`So sánh nhất không dùng ở đây.`},{text:`the least`,correct:!1,explanation:`Sai cấu trúc so sánh kép.`}]},{q:`Da Nang is celebrated across the nation as one of the most ___ cities thanks to its pristine beaches, orderly traffic, and welcoming people. 🏖️🌟`,a:[{text:`livable`,correct:!0,explanation:`Đúng rồi! Thành phố đáng sống có chất lượng sống tuyệt vời là 'livable city'.`},{text:`polluted`,correct:!1,explanation:`'polluted' là bị ô nhiễm nặng nề.`},{text:`dangerous`,correct:!1,explanation:`'dangerous' là đầy nguy hiểm bất an.`},{text:`hostile`,correct:!1,explanation:`'hostile' là thù địch, khó chịu.`}]},{q:`Cosmopolitan urban centers continuously draw energetic young talents because they provide abundant employment ___. 💼📈`,a:[{text:`opportunities`,correct:!0,explanation:`Chính xác! Cơ hội việc làm phong phú là 'employment opportunities'.`},{text:`disasters`,correct:!1,explanation:`'disasters' là các thảm họa tai ương.`},{text:`illnesses`,correct:!1,explanation:`'illnesses' là các căn bệnh ốm đau.`},{text:`conflicts`,correct:!1,explanation:`'conflicts' là những mối xung đột mâu thuẫn.`}]},{q:`Odd one out: Chọn từ có phần phát âm nguyên âm là /eə/ (khác với nhóm nguyên âm /ɪə/): square, atmosphere, clear, sincere 🔊`,a:[{text:`square`,correct:!0,explanation:`Chính xác! 'square' phát âm là /skweər/ (nguyên âm /eə/), trong khi atmosphere, clear, sincere đều phát âm với nguyên âm /ɪə/.`},{text:`atmosphere`,correct:!1,explanation:`Phát âm là /ˈæt.məs.fɪər/ (/ɪə/).`},{text:`clear`,correct:!1,explanation:`Phát âm là /klɪər/ (/ɪə/).`},{text:`sincere`,correct:!1,explanation:`Phát âm là /sɪnˈsɪər/ (/ɪə/).`}]},{q:`Odd one out: Từ nào mang SẮC THÁI TIÊU CỰC VỀ ĐÔ THỊ, không phải tiện ích công cộng phục vụ cư dân? 🏢`,a:[{text:`air pollution`,correct:!0,explanation:`Đúng rồi! 'air pollution' (ô nhiễm không khí) là mặt tiêu cực của đô thị hóa, còn library, museum, botanical garden là tiện ích văn hóa giải trí công cộng.`},{text:`public library`,correct:!1,explanation:`'public library' là thư viện công cộng đọc sách mở mang tri thức.`},{text:`city museum`,correct:!1,explanation:`'city museum' là bảo tàng lưu giữ lịch sử văn hóa.`},{text:`botanical garden`,correct:!1,explanation:`'botanical garden' là vườn bách thảo xanh tươi.`}]},{q:`Sắp xếp chữ cái thành từ chỉ thành phố quốc tế đa văn hóa: 'l - i - a - o - o - s - t - o - n - c - p - m' 🌐🏙️`,a:[{text:`cosmopolitan`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'cosmopolitan' (mang tính quốc tế, đa văn hóa toàn cầu).`},{text:`cosmopoliten`,correct:!1,explanation:`Sai chữ a thành e.`},{text:`cosmapolitan`,correct:!1,explanation:`Sai chữ o thứ hai thành a.`},{text:`cosmopolytan`,correct:!1,explanation:`Sai chữ i thành y.`}]},{q:`Viết lại câu dùng so sánh kép: 'As a mega-city becomes more crowded, its traffic becomes slower.' 🚗🐢`,a:[{text:`The more crowded a mega-city becomes, the slower its traffic is.`,correct:!0,explanation:`Chính xác! Cấu trúc: 'The more crowded..., the slower...' (Đô thị càng đông đúc, giao thông càng chậm chạp).`},{text:`The crowded a mega-city becomes, the slower traffic is.`,correct:!1,explanation:`Thiếu 'more' trong mệnh đề tính từ dài crowded.`},{text:`The most crowded a city becomes, the slowest traffic is.`,correct:!1,explanation:`Dùng sai so sánh nhất.`},{text:`More crowded a city is, slower traffic becomes.`,correct:!1,explanation:`Thiếu cặp mạo từ 'The... the...'.`}]},{q:`Tìm lỗi sai trong câu so sánh kép sau: 'The most modernized the urban infrastructure is, the higher the living standard rises.' 🏙️📈`,a:[{text:`The most modernized -> The more modernized`,correct:!0,explanation:`Đúng rồi! Trong cấu trúc so sánh kép bắt buộc dùng dạng so sánh hơn ('The more modernized...'), không bao giờ dùng so sánh nhất 'The most'.`},{text:`urban infrastructure -> infrastructure urban`,correct:!1,explanation:`Cụm danh từ bổ nghĩa đúng trật tự.`},{text:`the higher -> the highest`,correct:!1,explanation:`Vế sau dùng so sánh hơn là hoàn toàn chuẩn xác.`},{text:`standard rises -> standard rise`,correct:!1,explanation:`Chủ ngữ 'living standard' số ít đi với 'rises' là đúng.`}]},{q:`Thành phố quy tụ cư dân đến từ vô số nền văn hóa, sắc tộc và quốc gia khác nhau trên khắp thế giới gọi là: 🌍🌆`,a:[{text:`cosmopolitan city`,correct:!0,explanation:`Chính xác! Đô thị mang tầm vóc quốc tế đa văn hóa là 'cosmopolitan city' (như New York, London, Singapore).`},{text:`isolated village`,correct:!1,explanation:`'isolated village' là ngôi làng cô lập hẻo lánh.`},{text:`desert camp`,correct:!1,explanation:`'desert camp' là khu cắm trại giữa sa mạc cát.`},{text:`ghost town`,correct:!1,explanation:`'ghost town' là thị trấn bỏ hoang không một bóng người.`}]},{q:`Hàng hóa và dịch vụ được bán với mức giá đắt đỏ vô lý, vượt xa giá trị thực tế của chúng trong tiếng Anh là: 🏷️💸`,a:[{text:`overpriced`,correct:!0,explanation:`Tuyệt vời! 'overpriced' có nghĩa là bị đội giá quá cao, đắt cắt cổ.`},{text:`inexpensive`,correct:!1,explanation:`'inexpensive' là rẻ, giá cả phải chăng.`},{text:`economical`,correct:!1,explanation:`'economical' là tiết kiệm chi phí.`},{text:`budget-friendly`,correct:!1,explanation:`'budget-friendly' là vừa túi tiền bình dân.`}]},{q:`The bustling pedestrian streets in the historic Old Quarter are perpetually packed ___ foreign globetrotters. 🚶‍♂️🎒`,a:[{text:`with`,correct:!0,explanation:`Đúng rồi! Cụm tính từ 'packed with' có nghĩa là chật ních, đông nghẹt những ai/cái gì.`},{text:`at`,correct:!1,explanation:`Không dùng 'packed at'.`},{text:`of`,correct:!1,explanation:`Thường nói 'full of', nhưng 'packed' đi với 'with'.`},{text:`by`,correct:!1,explanation:`Không dùng 'packed by' trong ngữ cảnh này.`}]},{q:`The city administration is actively demarcating dedicated pedestrian ___ to ensure safety for walkers and baby strollers. 🚶‍♀️🚸`,a:[{text:`zones (lanes)`,correct:!0,explanation:`Chính xác! Khu vực làn đường dành riêng cho người đi bộ là 'pedestrian zones' hoặc 'pedestrian lanes'.`},{text:`highways`,correct:!1,explanation:`'highways' là đường cao tốc tốc độ cao.`},{text:`railway tracks`,correct:!1,explanation:`'railway tracks' là đường ray tàu hỏa cấm đi bộ.`},{text:`airport runways`,correct:!1,explanation:`'airport runways' là đường băng sân bay cho máy bay cất cánh.`}]},{q:`Many ambitious rural youngsters migrate into vibrant industrial belts in search of better-remunerated ___. 🏭💵`,a:[{text:`jobs (employment)`,correct:!0,explanation:`Đúng rồi! Di cư lên thành phố tìm kiếm việc làm lương cao hơn là 'search of better-remunerated jobs'.`},{text:`storms`,correct:!1,explanation:`'storms' là những cơn bão tố.`},{text:`debts`,correct:!1,explanation:`'debts' là các món nợ xấu nần.`},{text:`fines`,correct:!1,explanation:`'fines' là các khoản phạt hành chính.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'is / The / rent / more / expensive / city / the / higher / the / the / is / .' 🏙️💵`,a:[{text:`The more expensive the city is, the higher the rent is.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: The more expensive the city is (Thành phố càng đắt đỏ), the higher the rent is (tiền thuê nhà càng cao).`},{text:`The city is more expensive, the rent is higher.`,correct:!1,explanation:`Thiếu cặp mạo từ 'the' so sánh kép song hành.`},{text:`Higher the rent is the more expensive city the is.`,correct:!1,explanation:`Sai trật tự cú pháp so sánh kép.`},{text:`The more the city expensive is, the rent higher the is.`,correct:!1,explanation:`Đảo lộn vị trí tính từ.`}]},{q:`What constitutes a paramount environmental hazard confronting fast-expanding mega-cities? 🏭🌫️`,a:[{text:`Choking exhaust emissions causing hazardous air pollution and critical shortage of green canopy.`,correct:!0,explanation:`Chính xác! Hiểm họa môi trường nan giải nhất là khí thải khói bụi gây ô nhiễm không khí nặng và sự thiếu hụt cây xanh bóng mát.`},{text:`Excessive snowfall freezing all tropical waterways solid.`,correct:!1,explanation:`Đô thị nhiệt đới không có bão tuyết đóng băng sông hồ.`},{text:`Complete lack of digital mobile telephones and computers.`,correct:!1,explanation:`Thành phố hiện đại không hề thiếu điện thoại di động.`},{text:`Citizens refusing to buy discounted clothes at department stores.`,correct:!1,explanation:`Từ chối mua sắm không phải hiểm họa môi trường.`}]},{q:`Smart city commuters simply tap their contactless integrated transit ___ upon passing through automatic turnstiles. 💳🚇`,a:[{text:`cards`,correct:!0,explanation:`Đúng rồi! Thẻ thông minh đi lại phương tiện công cộng là 'transit cards'.`},{text:`postcards`,correct:!1,explanation:`'postcards' là bưu thiếp ảnh phong cảnh.`},{text:`playing cards`,correct:!1,explanation:`'playing cards' là bộ bài tây 52 lá.`},{text:`business cards`,correct:!1,explanation:`'business cards' là danh thiếp làm ăn đối tác.`}]},{q:`The central commercial skyline is dominated by magnificent steel-framed ___ towering hundreds of meters above street level. 🏙️✨`,a:[{text:`skyscrapers`,correct:!0,explanation:`Chính xác! Các tòa nhà chọc trời cao hàng trăm mét là 'skyscrapers'.`},{text:`tents`,correct:!1,explanation:`'tents' là những chiếc lều vải bạt dã ngoại.`},{text:`caves`,correct:!1,explanation:`'caves' là các hang động đá tự nhiên.`},{text:`huts`,correct:!1,explanation:`'huts' là những túp lều tranh lụp xụp.`}]},{q:`Urbanites frequently experience overwhelming nervous stress due to unceasing siren noise and the hectic pace of ___. 🏃‍♂️⚡`,a:[{text:`life`,correct:!0,explanation:`Đúng rồi! Nhịp sống hối hả gấp gáp nơi đô thị là 'the hectic pace of life'.`},{text:`walking`,correct:!1,explanation:`'pace of walking' là tốc độ bước chân bình thường.`},{text:`eating`,correct:!1,explanation:`'pace of eating' là tốc độ nhai cơm.`},{text:`sleeping`,correct:!1,explanation:`'pace of sleeping' là tốc độ ngủ.`}]},{q:`The adoption of municipal electric bus fleets significantly slashes carbon emissions because they discharge zero tailpipe ___. 🚌🌱`,a:[{text:`exhaust (pollution)`,correct:!0,explanation:`Chính xác! Xe buýt điện không xả khí thải ống xả khói độc hại ra đường phố ('zero tailpipe exhaust').`},{text:`water`,correct:!1,explanation:`Không xả nước sạch không phải là đặc tính cốt lõi.`},{text:`electricity`,correct:!1,explanation:`Xe điện tiêu thụ điện năng từ pin sạch, không xả điện.`},{text:`air`,correct:!1,explanation:`Không phải xả không khí.`}]},{q:`Hiện tượng tâm lý lo âu khi cảm thấy bị thôi thúc phải có hành động, trang phục hoặc thành tích giống bạn bè cùng tuổi là: 👥⚡`,a:[{text:`peer pressure`,correct:!0,explanation:`Chính xác! Áp lực từ bạn bè cùng trang lứa là 'peer pressure'.`},{text:`blood pressure`,correct:!1,explanation:`'blood pressure' là chỉ số huyết áp tim mạch.`},{text:`air pressure`,correct:!1,explanation:`'air pressure' là áp suất khí quyển đo bằng phong vũ biểu.`},{text:`water pressure`,correct:!1,explanation:`'water pressure' là áp lực nước đường ống.`}]},{q:`Thực đơn ăn uống khoa học cung cấp đầy đủ và cân đối các nhóm chất dinh dưỡng cho sự phát triển của cơ thể gọi là: 🥗🍎`,a:[{text:`well-balanced diet`,correct:!0,explanation:`Đúng rồi! Chế độ ăn uống cân bằng lành mạnh là 'well-balanced diet'.`},{text:`crash diet`,correct:!1,explanation:`'crash diet' là chế độ ăn kiêng khắc nghiệt nhịn đói cấp tốc gây hại.`},{text:`fast-food diet`,correct:!1,explanation:`'fast-food diet' là thói quen ăn toàn đồ ăn nhanh dầu mỡ.`},{text:`sugar-only diet`,correct:!1,explanation:`Chế độ ăn chỉ toàn đường ngọt gây tiểu đường.`}]},{q:`Trạng thái kiệt quệ hoàn toàn cả về thể lực lẫn tinh thần do chịu áp lực học tập và thi cử dồn dập kéo dài gọi là: 🧠📉`,a:[{text:`burnout`,correct:!0,explanation:`Chính xác! Hội chứng kiệt sức lao lực vì quá tải là 'burnout'.`},{text:`workout`,correct:!1,explanation:`'workout' là buổi tập luyện thể dục nâng cao sức khỏe.`},{text:`breakout`,correct:!1,explanation:`'breakout' là sự bùng nổ, vượt ngục hoặc nổi mụn.`},{text:`takeout`,correct:!1,explanation:`'takeout' là đồ ăn mua mang về nhà.`}]},{q:`If you feel hopelessly buried under mountainous piles of exam revision, you ___ consult your school guidance counselor. 📚👨‍🏫`,a:[{text:`should (ought to)`,correct:!0,explanation:`Đúng rồi! Dùng động từ khuyết thiếu 'should / ought to' trong câu điều kiện loại 1 để đưa ra lời khuyên chân thành, hữu ích.`},{text:`would`,correct:!1,explanation:`'would' dùng trong câu điều kiện loại 2.`},{text:`had to have`,correct:!1,explanation:`Sai ngữ pháp và ngữ cảnh khuyên nhủ hiện tại.`},{text:`will have had`,correct:!1,explanation:`Tương lai hoàn thành sai ngữ cảnh.`}]},{q:`If teenagers aspire to sustain razor-sharp cognitive focus in class, they ___ stay up late scrolling feeds on phones. 📱🌙`,a:[{text:`must not (should not)`,correct:!0,explanation:`Chính xác! Dùng 'must not / should not' để thể hiện điều cấm đoán hoặc lời khuyên ngăn không nên làm điều gây hại sức khỏe.`},{text:`should`,correct:!1,explanation:`Ngược nghĩa hoàn toàn; không thể khuyên thức khuya dán mắt vào điện thoại.`},{text:`must`,correct:!1,explanation:`Ngược nghĩa câu.`},{text:`can`,correct:!1,explanation:`'can' không diễn đạt ý khuyên ngăn điều nguy hại.`}]},{q:`Adolescents ___ aim for eight to ten hours of uninterrupted restorative slumber each night for optimal neurological development. 🛌🧠`,a:[{text:`ought to`,correct:!0,explanation:`Đúng rồi! Cụm 'ought to + V nguyên mẫu' có nghĩa là nên làm gì (đồng nghĩa với should).`},{text:`ought`,correct:!1,explanation:`Thiếu giới từ 'to' sau 'ought' ('ought to').`},{text:`had better to`,correct:!1,explanation:`'had better' đi trực tiếp với động từ nguyên mẫu không có 'to'.`},{text:`must to`,correct:!1,explanation:`'must' đi trực tiếp với động từ nguyên mẫu không có 'to'.`}]},{q:`If Tom experiences acute anxiety preceding public oral examinations, he ___ engage in rhythmic diaphragmatic breathing. 🧘‍♂️🌬️`,a:[{text:`can`,correct:!0,explanation:`Chính xác! Dùng modal verb 'can' trong câu điều kiện loại 1 để gợi ý phương pháp khả thi giúp giải tỏa căng thẳng.`},{text:`would`,correct:!1,explanation:`'would' thuộc câu điều kiện loại 2 giả định.`},{text:`could have`,correct:!1,explanation:`Diễn tả khả năng trong quá khứ, sai ngữ cảnh.`},{text:`must have`,correct:!1,explanation:`Phỏng đoán quá khứ, không dùng đưa lời khuyên hiện tại.`}]},{q:`Students ___ avoid consuming high-caffeine energy drinks before bedtime because they trigger heart palpitations and insomnia. ⚡🥫`,a:[{text:`should`,correct:!0,explanation:`Đúng rồi! 'Students should avoid...' có nghĩa là học sinh nên tránh uống nước tăng lực trước giờ đi ngủ.`},{text:`shouldn't`,correct:!1,explanation:`Nếu dùng 'shouldn't' thì không đi với 'avoid' (tránh) vì tạo thành phủ định kép phản tác dụng.`},{text:`must not`,correct:!1,explanation:`Đi với 'avoid' sẽ thành 'không được tránh' (phản logic).`},{text:`cannot`,correct:!1,explanation:`Sai ý khuyên bảo.`}]},{q:`Chuyên gia tâm lý học đường luôn lắng nghe, chia sẻ và gỡ rối những khúc mắc tâm lý cho học sinh gọi là: 👨‍🏫💬`,a:[{text:`school counselor`,correct:!0,explanation:`Chính xác! Chuyên viên tư vấn tâm lý học đường là 'school counselor'.`},{text:`security guard`,correct:!1,explanation:`'security guard' là bác bảo vệ gác cổng trường.`},{text:`bus driver`,correct:!1,explanation:`'bus driver' là bác tài xế lái xe buýt trường học.`},{text:`electrician`,correct:!1,explanation:`'electrician' là thợ điện.`}]},{q:`Odd one out: Chọn từ có phần phát âm nguyên âm là /ɔː/ (khác với nhóm nguyên âm ngắn /ɒ/): sport, doctor, bottle, shock 🔊`,a:[{text:`sport`,correct:!0,explanation:`Chính xác! 'sport' phát âm là /spɔːt/ (nguyên âm dài /ɔː/), trong khi doctor, bottle, shock đều phát âm là nguyên âm ngắn /ɒ/.`},{text:`doctor`,correct:!1,explanation:`Phát âm là /ˈdɒk.tər/ (/ɒ/).`},{text:`bottle`,correct:!1,explanation:`Phát âm là /ˈbɒt.əl/ (/ɒ/).`},{text:`shock`,correct:!1,explanation:`Phát âm là /ʃɒk/ (/ɒ/).`}]},{q:`Odd one out: Hoạt động nào GIÚP GIẢI TỎA ÁP LỰC TINH THẦN LÀNH MẠNH, không phải hành vi tiêu cực phá hủy cơ thể? 🧘‍♀️`,a:[{text:`mindful meditation in nature`,correct:!0,explanation:`Đúng rồi! 'mindful meditation in nature' (thiền chánh niệm giữa thiên nhiên) là liệu pháp giải tỏa căng thẳng tuyệt vời, còn các hành vi khác đều nguy hại.`},{text:`binge eating salty chips`,correct:!1,explanation:`Ăn vô tội vạ đồ ăn vặt nhiều muối hại thận.`},{text:`abusing energy drinks`,correct:!1,explanation:`Lạm dụng nước tăng lực hại tim.`},{text:`isolating oneself in total darkness`,correct:!1,explanation:`Tự giam mình trong bóng tối trầm cảm.`}]},{q:`Sắp xếp chữ cái thành từ chỉ người chuyên viên tư vấn tâm lý: 'u - e - o - s - l - r - n - o - c' 👨‍🏫`,a:[{text:`counselor`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'counselor' (chuyên viên tư vấn tâm lý học đường).`},{text:`counseler`,correct:!1,explanation:`Sai chữ o cuối thành e.`},{text:`caunselor`,correct:!1,explanation:`Sai chữ o đầu thành a.`},{text:`counsilour`,correct:!1,explanation:`Sai chính tả hoàn toàn.`}]},{q:`Viết lại câu dùng động từ khuyết thiếu 'ought to': 'It is strongly advisable for teenagers to exercise half an hour daily.' 🏃‍♂️✨`,a:[{text:`Teenagers ought to exercise for half an hour daily.`,correct:!0,explanation:`Chính xác! Cấu trúc: 'ought to + V nguyên mẫu' tương đương với 'It is advisable for someone to V'.`},{text:`Teenagers ought exercise for half an hour daily.`,correct:!1,explanation:`Thiếu 'to' sau 'ought'.`},{text:`Teenagers ought to exercised for half an hour daily.`,correct:!1,explanation:`Sau 'ought to' phải là động từ nguyên thể, không chia quá khứ.`},{text:`Teenagers ought not to exercise half an hour daily.`,correct:!1,explanation:`Ngược hoàn toàn ý nghĩa khuyên bảo rèn luyện thân thể.`}]},{q:`Tìm lỗi sai trong câu khuyên nhủ sau: 'If you want to maintain vibrant energy, you should to take periodic five-minute walking breaks.' 🚶‍♂️💧`,a:[{text:`should to take -> should take`,correct:!0,explanation:`Đúng rồi! Sau modal verb 'should' bắt buộc là động từ nguyên mẫu không có 'to' ('should take').`},{text:`vibrant energy -> energy vibrant`,correct:!1,explanation:`Tính từ đứng trước danh từ là chuẩn.`},{text:`five-minute -> five-minutes`,correct:!1,explanation:`Tính từ ghép chỉ thời gian có gạch nối không thêm 's' là đúng.`},{text:`walking breaks -> breaks walking`,correct:!1,explanation:`Cụm danh từ đúng trật tự.`}]},{q:`Kỹ năng lập kế hoạch, sắp xếp các công việc cần làm theo mức độ ưu tiên để không bị trễ hạn nộp bài gọi là: 📅⏱️`,a:[{text:`time management skills`,correct:!0,explanation:`Chính xác! Kỹ năng quản lý thời gian là 'time management skills'.`},{text:`game streaming skills`,correct:!1,explanation:`'game streaming skills' là kỹ năng phát trực tiếp chơi game.`},{text:`shopping tricks`,correct:!1,explanation:`'shopping tricks' là mẹo mua sắm.`},{text:`gambling tactics`,correct:!1,explanation:`'gambling tactics' là mưu mẹo cờ bạc đỏ đen.`}]},{q:`Thói quen ăn quá nhiều đồ ngọt, uống trà sữa đậm đặc đường hóa học khiến thanh thiếu niên đối mặt nguy cơ: 🧋🧁`,a:[{text:`obesity and type-2 diabetes`,correct:!0,explanation:`Tuyệt vời! Béo phì và bệnh tiểu đường tuýp 2 là hậu quả nghiêm trọng của việc dư thừa đường hóa học.`},{text:`superhuman muscular strength`,correct:!1,explanation:`Không thể tăng cơ bắp phi thường nhờ đường.`},{text:`exceptional photographic memory`,correct:!1,explanation:`Không giúp tăng trí nhớ siêu phàm.`},{text:`improved biological eyesight`,correct:!1,explanation:`Không làm tăng thị lực mắt.`}]},{q:`Regular cardiovascular physical workouts stimulate the human endocrine system to release endorphins that boost your ___. 🏃‍♀️😄`,a:[{text:`mood`,correct:!0,explanation:`Chính xác! Endorphin là hoóc-môn hạnh phúc giúp cải thiện tâm trạng và xua tan căng thẳng ('boost your mood').`},{text:`fever`,correct:!1,explanation:`'fever' là cơn sốt cao bệnh tật.`},{text:`sadness`,correct:!1,explanation:`'sadness' là nỗi u sầu đau buồn.`},{text:`anger`,correct:!1,explanation:`'anger' là cơn thịnh nộ bực tức.`}]},{q:`When feeling jittery before an important class speech, rehearse your speech multiple times facing a reflective ___. 🪞🗣️`,a:[{text:`mirror`,correct:!0,explanation:`Đúng rồi! Tập nói lưu loát trước gương soi bóng là 'facing a reflective mirror'.`},{text:`wall clock`,correct:!1,explanation:`'wall clock' là chiếc đồng hồ treo tường.`},{text:`pillow`,correct:!1,explanation:`'pillow' là chiếc gối nằm ngủ.`},{text:`blanket`,correct:!1,explanation:`'blanket' là chiếc chăn đắp.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'Teens / their / study / should / balance / relaxation / and / .' ⚖️🧠`,a:[{text:`Teens should balance their study and relaxation.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (Teens) + should balance (vị ngữ) + O (their study and relaxation).`},{text:`Teens their study and relaxation should balance.`,correct:!1,explanation:`Tân ngữ chen vào trước trợ động từ.`},{text:`Should balance teens their study and relaxation.`,correct:!1,explanation:`Đảo 'should' lên đầu trong câu trần thuật là sai.`},{text:`Teens should their study balance and relaxation.`,correct:!1,explanation:`Xé rời cụm tân ngữ ghép.`}]},{q:`Why is obtaining eight hours of uninterrupted deep sleep non-negotiable for growing teenage brains? 🛌🧠`,a:[{text:`Because sleep consolidates learned concepts, detoxifies neural waste, and stabilizes hormonal equilibrium.`,correct:!0,explanation:`Chính xác! Giấc ngủ sâu giúp củng cố kiến thức đã học, đào thải độc tố tế bào thần kinh và cân bằng hoóc-môn phát triển.`},{text:`Because sleep allows students to skip all breakfast meals completely.`,correct:!1,explanation:`Ngủ không phải để nhịn ăn sáng vô lý.`},{text:`Because staying asleep stops the heart from beating entirely.`,correct:!1,explanation:`Tim vẫn đập đều khi ngủ để duy trì sự sống.`},{text:`Because sleep transforms human skin into synthetic bulletproof armor.`,correct:!1,explanation:`Giấc ngủ không biến da thành áo giáp sắt.`}]},{q:`When struggling with emotional heartbreak or academic failure, teenagers should never bottle ___ their tears in silence. 😢🚫`,a:[{text:`up`,correct:!0,explanation:`Chính xác! Cụm thành ngữ 'bottle up feelings/tears' có nghĩa là kìm nén, chôn chặt cảm xúc tiêu cực trong lòng không giãi bày.`},{text:`in`,correct:!1,explanation:`Không dùng 'bottle in'.`},{text:`down`,correct:!1,explanation:`Không dùng 'bottle down'.`},{text:`away`,correct:!1,explanation:`Không dùng 'bottle away'.`}]},{q:`Constructing a structured daily schedule empowers students to overcome the toxic habit of chronic ___. ⏰📉`,a:[{text:`procrastination`,correct:!0,explanation:`Đúng rồi! Thói quen xấu trì hoãn, lần lữa công việc nước đến chân mới nhảy là 'procrastination'.`},{text:`punctuality`,correct:!1,explanation:`'punctuality' là tính đúng giờ chuẩn chỉ.`},{text:`perseverance`,correct:!1,explanation:`'perseverance' là đức tính kiên trì nhẫn nại.`},{text:`cooperation`,correct:!1,explanation:`'cooperation' là tinh thần hợp tác đoàn kết.`}]},{q:`Whenever you sense anxiety creeping in, inhaling deeply through your nose and exhaling slowly will instantly slow down a racing ___. 🫀🧘`,a:[{text:`heart (pulse)`,correct:!0,explanation:`Chính xác! Hít thở sâu giúp làm dịu nhịp tim đang đập dồn dập ('slow down a racing heart').`},{text:`shoe`,correct:!1,explanation:`'shoe' là chiếc giày mang dưới chân.`},{text:`pencil`,correct:!1,explanation:`'pencil' là cây bút chì.`},{text:`backpack`,correct:!1,explanation:`'backpack' là chiếc ba-lô đi học.`}]},{q:`Consistently skipping a nutritious morning breakfast impairs cognitive memory retention because the brain is starved of vital ___. 🍳🧠`,a:[{text:`glucose (energy)`,correct:!0,explanation:`Đúng rồi! Bỏ ăn sáng khiến não bộ thiếu hụt năng lượng và đường glucose cần thiết để tập trung tư duy.`},{text:`caffeine`,correct:!1,explanation:`Não không cần caffeine để duy trì tế bào sống.`},{text:`plastic`,correct:!1,explanation:`Nhựa là chất độc hại, không phải dưỡng chất sinh học.`},{text:`salt`,correct:!1,explanation:`Muối dư thừa gây hại huyết áp chứ không bổ não.`}]},{q:`Active involvement in team sports instills invaluable lessons regarding sportsmanship, empathy, and meaningful interpersonal ___. ⚽🤝`,a:[{text:`connections (relationships)`,correct:!0,explanation:`Chính xác! Chơi thể thao đồng đội rèn luyện kỹ năng kết nối và xây dựng các mối quan hệ xã hội tốt đẹp ('interpersonal connections').`},{text:`arguments`,correct:!1,explanation:`'arguments' là những cuộc cãi vã xích mích.`},{text:`diseases`,correct:!1,explanation:`'diseases' là các mầm bệnh lây lan.`},{text:`failures`,correct:!1,explanation:`'failures' là những thất bại đắng cay.`}]},{q:`Tuyến tàu điện bánh sắt cổ xưa leng keng chạy dọc các phố Hàng giữa lòng Hà Nội thế kỷ 20 là: 🚋🔔`,a:[{text:`historic electric tram`,correct:!0,explanation:`Chính xác! Tàu điện leng keng thời xưa ở Hà Nội là 'historic electric tram'.`},{text:`supersonic jet`,correct:!1,explanation:`'supersonic jet' là máy bay phản lực siêu thanh.`},{text:`container ship`,correct:!1,explanation:`'container ship' là tàu thủy chở công-ten-nơ hàng hóa.`},{text:`bullet train`,correct:!1,explanation:`'bullet train' là tàu cao tốc hình viên đạn hiện đại.`}]},{q:`Người bán hàng rong gánh đôi quang gánh kĩu kịt trên vai mang quà quê đi bán khắp phố phường xưa gọi là: 🧺👵`,a:[{text:`street vendor`,correct:!0,explanation:`Đúng rồi! Người bán hàng rong trên đường phố là 'street vendor'.`},{text:`supermarket cashier`,correct:!1,explanation:`'supermarket cashier' là nhân viên thu ngân siêu thị.`},{text:`bank manager`,correct:!1,explanation:`'bank manager' là giám đốc chi nhánh ngân hàng.`},{text:`flight attendant`,correct:!1,explanation:`'flight attendant' là tiếp viên hàng không.`}]},{q:`Kiểu nhà tranh vách đất lợp bằng rơm rạ đơn sơ mộc mạc của làng quê Bắc Bộ ngày trước là: 🏡🌾`,a:[{text:`thatched cottage (thatched house)`,correct:!0,explanation:`Chính xác! Nhà tranh mái rạ vách đất là 'thatched cottage' hoặc 'thatched house'.`},{text:`penthouse suite`,correct:!1,explanation:`'penthouse suite' là căn hộ tầng áp mái siêu sang.`},{text:`glass skyscraper`,correct:!1,explanation:`'glass skyscraper' là tòa cao ốc bọc kính cao tầng.`},{text:`concrete villa`,correct:!1,explanation:`'concrete villa' là biệt thự bê tông hiện đại.`}]},{q:`In the 1980s, my grandparents ___ commute to the state cooperative factory on an old iron bicycle. 🚲🏭`,a:[{text:`used to`,correct:!0,explanation:`Đúng rồi! Cấu trúc 'used to + V nguyên mẫu' diễn tả thói quen hoặc tình trạng thường xuyên xảy ra trong quá khứ nay không còn nữa.`},{text:`was using to`,correct:!1,explanation:`Không dùng thì quá khứ tiếp diễn với cấu trúc used to thói quen.`},{text:`are used to`,correct:!1,explanation:`'be used to + V-ing' là quen với việc gì ở hiện tại, sai ngữ cảnh.`},{text:`use to`,correct:!1,explanation:`Thiếu thì quá khứ 'd' trong câu khẳng định.`}]},{q:`Children in Vietnamese rural villages fifty years ago ___ have electronic game consoles, so they invented games using pebbles. 🎮🚫`,a:[{text:`didn't use to`,correct:!0,explanation:`Chính xác! Dạng phủ định của 'used to' là 'didn't use to + V nguyên mẫu' (ngày xưa không từng có...).`},{text:`used not have`,correct:!1,explanation:`Cấu trúc thông dụng chuẩn là 'didn't use to have'.`},{text:`didn't used to`,correct:!1,explanation:`Đã có trợ động từ 'didn't' thì 'use' phải ở dạng nguyên mẫu không có 'd'.`},{text:`weren't used to`,correct:!1,explanation:`'weren't used to' có nghĩa là không quen với, sai ngữ pháp.`}]},{q:`Did local children in your hometown ___ gather under the banyan tree to listen to folk fairy tales? 🌳📖`,a:[{text:`use to`,correct:!0,explanation:`Đúng rồi! Trong câu hỏi nghi vấn có trợ động từ 'Did', ta dùng 'use to' nguyên mẫu: 'Did + S + use to + V?'.`},{text:`used to`,correct:!1,explanation:`Đã có 'Did' thì không để 'used' có đuôi -d.`},{text:`using to`,correct:!1,explanation:`Sai dạng V-ing.`},{text:`uses to`,correct:!1,explanation:`Không thêm s sau trợ động từ Did.`}]},{q:`I wish our bustling modern capital ___ still operating the vintage ringing electric trams along the Old Quarter. 🚋🔔`,a:[{text:`were (was)`,correct:!0,explanation:`Chính xác! Cấu trúc câu ước cho hiện tại trái với thực tế: 'S + wish + S + were/past simple' ('I wish our capital were still operating...').`},{text:`is`,correct:!1,explanation:`Câu ước hiện tại bắt buộc phải lùi thì về quá khứ.`},{text:`will be`,correct:!1,explanation:`'will' dùng cho tương lai đơn, không lùi thì.`},{text:`has been`,correct:!1,explanation:`Hiện tại hoàn thành không dùng trong câu ước hiện tại.`}]},{q:`Urban office workers often wish they ___ reside in a tranquil rural hamlet free from relentless traffic din. 🏡🌳`,a:[{text:`could`,correct:!0,explanation:`Đúng rồi! Cấu trúc câu ước khả năng ở hiện tại: 'S + wish + S + could + V nguyên mẫu' (Ước gì có thể sinh sống...).`},{text:`can`,correct:!1,explanation:`Chưa lùi thì khuyết thiếu về quá khứ 'could'.`},{text:`will`,correct:!1,explanation:`Chưa lùi thì thành 'would'.`},{text:`are able to`,correct:!1,explanation:`Hiện tại chưa lùi thì.`}]},{q:`Mr. Binh wishes he ___ prosperous enough to purchase and preserve that decrepit French colonial villa. 🏛️💸`,a:[{text:`were (was)`,correct:!0,explanation:`Chính xác! Câu ước cho hiện tại dùng to be 'were' (hoặc 'was') lùi thì: 'He wishes he were prosperous enough...'.`},{text:`is`,correct:!1,explanation:`Chưa lùi thì trong câu ước hiện tại.`},{text:`be`,correct:!1,explanation:`Động từ to be nguyên thể không làm vị ngữ câu ước.`},{text:`would be`,correct:!1,explanation:`Dùng cho mong ước tương lai hoặc phàn nàn thói quen của người khác.`}]},{q:`Hình ảnh đôi quang gánh tre kĩu kịt chở theo nồi nước dùng phở bò bốc khói nghi ngút là nét đẹp hoài niệm của: 🍜🥢`,a:[{text:`street food vendors in ancient Hanoi`,correct:!0,explanation:`Chính xác! Gánh phở rong chở nồi nước dùng bốc khói là nét văn hóa ẩm thực độc đáo của Hà Nội xưa.`},{text:`modern airport duty-free lounges`,correct:!1,explanation:`Phòng chờ miễn thuế sân bay hiện đại.`},{text:`industrial robot assembly lines`,correct:!1,explanation:`Dây chuyền lắp ráp tự động bằng robot.`},{text:`subsea oil drilling platforms`,correct:!1,explanation:`Giàn khoan dầu ngoài khơi.`}]},{q:`Odd one out: Chọn từ có chữ cái 'h' câm không được phát âm (silent letter /h/): honest, hero, history, house 🔊`,a:[{text:`honest`,correct:!0,explanation:`Chính xác! 'honest' có chữ 'h' câm phát âm là /ˈɒn.ɪst/, trong khi hero, history, house đều phát âm âm phụ âm /h/ rõ ràng.`},{text:`hero`,correct:!1,explanation:`Phát âm phụ âm /h/ /ˈhɪə.rəʊ/.`},{text:`history`,correct:!1,explanation:`Phát âm phụ âm /h/ /ˈhɪs.tər.i/.`},{text:`house`,correct:!1,explanation:`Phát âm phụ âm /h/ /haʊs/.`}]},{q:`Odd one out: Trò chơi nào là TRÒ CHƠI DÂN GIAN TRUYỀN THỐNG CỦA TRẺ EM XƯA, không phải trò chơi công nghệ điện tử? 🤾‍♂️`,a:[{text:`tug of war (keo co)`,correct:!0,explanation:`Đúng rồi! 'tug of war' (trò chơi kéo co) là trò chơi dân gian rèn luyện thể lực và tinh thần đoàn kết, còn video games, online gaming, VR racing là trò chơi điện tử hiện đại.`},{text:`online multiplayer gaming`,correct:!1,explanation:`Trò chơi điện tử trực tuyến qua internet.`},{text:`virtual reality simulator`,correct:!1,explanation:`Thiết bị mô phỏng thực tế ảo.`},{text:`smartphone puzzle app`,correct:!1,explanation:`Ứng dụng giải đố trên điện thoại thông minh.`}]},{q:`Sắp xếp chữ cái thành từ chỉ truyền thống cổ xưa: 'd - i - t - t - i - o - a - n - r' 📜✨`,a:[{text:`tradition`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'tradition' (truyền thống văn hóa tốt đẹp).`},{text:`tradision`,correct:!1,explanation:`Sai chữ t thành s.`},{text:`traditiun`,correct:!1,explanation:`Sai chữ o thành u.`},{text:`tredition`,correct:!1,explanation:`Sai chữ a thành e.`}]},{q:`Viết lại câu dùng cấu trúc 'used to': 'Decades ago, peasants travelled on foot rather than driving motor vehicles.' 🚶‍♂️🌾`,a:[{text:`Decades ago, peasants used to travel on foot rather than driving motor vehicles.`,correct:!0,explanation:`Chính xác! Cấu trúc: S + used to + V nguyên mẫu (used to travel on foot).`},{text:`Decades ago, peasants were used to travel on foot.`,correct:!1,explanation:`'were used to' phải đi với V-ing, sai ngữ pháp.`},{text:`Decades ago, peasants use to travel on foot.`,correct:!1,explanation:`Thiếu đuôi quá khứ -d của 'used to'.`},{text:`Decades ago, peasants didn't use to travel on foot.`,correct:!1,explanation:`Ngược hoàn toàn nghĩa khẳng định của câu gốc.`}]},{q:`Tìm lỗi sai trong câu ước cho hiện tại sau: 'I wish that ancient wooden temple preserves its original carvings against decay.' ⛩️🪵`,a:[{text:`preserves -> preserved (hoặc were preserved)`,correct:!0,explanation:`Đúng rồi! Trong mệnh đề ước 'wish' cho hiện tại, động từ phải lùi thì về quá khứ ('preserved'), không được chia hiện tại đơn 'preserves'.`},{text:`that ancient -> that anciently`,correct:!1,explanation:`'ancient' là tính từ bổ nghĩa cho danh từ temple là đúng.`},{text:`original carvings -> carvings original`,correct:!1,explanation:`Tính từ đứng trước danh từ là chuẩn.`},{text:`against decay -> for decay`,correct:!1,explanation:`Bảo tồn chống lại sự mục nát dùng 'against decay' là chính xác.`}]},{q:`Tiếng chuông leng keng ngân vang giữa sớm mai và tiếng còi tàu điện gắn liền với ký ức hoài niệm của: 🔔🚋`,a:[{text:`Hanoians living in the 20th century`,correct:!0,explanation:`Tuyệt vời! Tiếng chuông tàu điện leng keng là thanh âm biểu tượng của Hà Nội trong ký ức thế kỷ 20.`},{text:`deep-sea scuba divers`,correct:!1,explanation:`Thợ lặn sâu dưới đáy biển.`},{text:`mountain climbers scaling Mount Everest`,correct:!1,explanation:`Nhà leo núi chinh phục đỉnh Everest tuyết trắng.`},{text:`astronauts docking at the International Space Station`,correct:!1,explanation:`Phi hành gia kết nối trạm vũ trụ.`}]},{q:`Viết lại câu bày tỏ mong ước cho hiện tại: 'We do not have enough funds to renovate this ancient pagoda.' ⛩️💵`,a:[{text:`We wish we had enough funds to renovate this ancient pagoda.`,correct:!0,explanation:`Chính xác! Đổi hiện tại phủ định 'do not have' sang câu ước lùi thì quá khứ khẳng định 'had'.`},{text:`We wish we have enough funds to renovate this pagoda.`,correct:!1,explanation:`Chưa lùi thì trong câu ước hiện tại.`},{text:`We wish we will have enough funds to renovate this pagoda.`,correct:!1,explanation:`Dùng 'will' là sai quy tắc câu ước.`},{text:`We wish we don't have enough funds to renovate this pagoda.`,correct:!1,explanation:`Ngược nghĩa mong muốn.`}]},{q:`During lunar new year eves long ago, whole multi-generational families used to assemble around blazing hearths to boil square ___. 🍲🔥`,a:[{text:`chung cakes (banh chung)`,correct:!0,explanation:`Chính xác! Nồi bánh chưng luộc thâu đêm ngày Tết là nét đẹp văn hóa thiêng liêng cổ truyền.`},{text:`ice cream tubs`,correct:!1,explanation:`Hộp kem lạnh mùa hè.`},{text:`pizzas`,correct:!1,explanation:`Bánh pizza kiểu Ý nướng lò.`},{text:`hamburgers`,correct:!1,explanation:`Bánh mì kẹp thịt bò ăn nhanh.`}]},{q:`Before telecommunications existed, people used to maintain relationships with distant relatives by posting handwritten letters sent far ___. ✉️📬`,a:[{text:`away`,correct:!0,explanation:`Đúng rồi! Cụm từ 'far away' có nghĩa là xa xôi, cách trở địa lý.`},{text:`into`,correct:!1,explanation:`Không dùng 'far into' trong ngữ cảnh này.`},{text:`up`,correct:!1,explanation:`Không dùng 'far up'.`},{text:`down`,correct:!1,explanation:`Không dùng 'far down'.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'used / My / grandmother / to / tell / us / bedtime / folk / tales / .' 👵📖`,a:[{text:`My grandmother used to tell us bedtime folk tales.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (My grandmother) + used to tell (vị ngữ) + us (tân ngữ gián tiếp) + bedtime folk tales (tân ngữ trực tiếp).`},{text:`My grandmother to tell used us bedtime folk tales.`,correct:!1,explanation:`Đảo sai vị trí của 'used' và 'to tell'.`},{text:`Us bedtime folk tales my grandmother used to tell.`,correct:!1,explanation:`Đảo tân ngữ lên đầu sai quy tắc câu trần thuật.`},{text:`Used to tell my grandmother us bedtime folk tales.`,correct:!1,explanation:`Đảo vị ngữ lên đầu câu.`}]},{q:`Why do urban architectural conservators strive to safeguard decrepit colonial and ancient structures? 🏛️🛡️`,a:[{text:`To honor historical collective memory, foster civic pride, and bridge ancestral past with the future.`,correct:!0,explanation:`Chính xác! Bảo tồn kiến trúc cổ giúp gìn giữ ký ức tập thể của dân tộc, khơi dậy niềm tự hào và nối liền quá khứ với tương lai.`},{text:`To demolish them completely and construct gambling casinos.`,correct:!1,explanation:`Không phải để san phẳng xây sòng bạc.`},{text:`To punish citizens who appreciate modern technological advancements.`,correct:!1,explanation:`Không hề có mục đích trừng phạt ai.`},{text:`To forbid youths from learning foreign scientific languages.`,correct:!1,explanation:`Không cấm đoán việc học ngoại ngữ.`}]},{q:`Distinctive arched timber windows with emerald-green louvered shutters were hallmarks of French ___ architecture in Indochina. 🏛️🇫🇷`,a:[{text:`colonial`,correct:!0,explanation:`Chính xác! Phong cách kiến trúc thời kỳ Pháp thuộc là 'French colonial architecture'.`},{text:`space age`,correct:!1,explanation:`'space age' là kiến trúc thời đại không gian vũ trụ.`},{text:`futuristic`,correct:!1,explanation:`'futuristic' là kiến trúc tương lai viễn tưởng.`},{text:`stone age`,correct:!1,explanation:`'stone age' là thời kỳ đồ đá tiền sử.`}]},{q:`Rural villagers fifty years ago relied exclusively on sunbeams and flickering kerosene lanterns because there was no centralized power ___. 🏮⚡`,a:[{text:`grid`,correct:!0,explanation:`Đúng rồi! Mạng lưới điện lưới quốc gia là 'power grid'.`},{text:`pond`,correct:!1,explanation:`'pond' là cái ao nước nuôi cá.`},{text:`cage`,correct:!1,explanation:`'cage' là cái lồng nhốt chim.`},{text:`box`,correct:!1,explanation:`'box' là chiếc hộp giấy.`}]},{q:`Inspiring legendary moral myths and heroic folk songs were traditionally transmitted across generations solely through word of ___. 🗣️📜`,a:[{text:`mouth`,correct:!0,explanation:`Chính xác! Thành ngữ 'by word of mouth' có nghĩa là truyền khẩu, truyền miệng từ đời này sang đời khác.`},{text:`eye`,correct:!1,explanation:`Không nói 'word of eye'.`},{text:`hand`,correct:!1,explanation:`Không nói 'word of hand'.`},{text:`ear`,correct:!1,explanation:`Không nói 'word of ear'.`}]},{q:`During breezy summer afternoons, country barefoot boys used to run along grassy dykes flying colorful handmade bamboo ___. 🪁🌾`,a:[{text:`kites`,correct:!0,explanation:`Tuyệt vời! Những cánh diều tre phất giấy bay lượn trên triền đê lộng gió là 'kites'.`},{text:`drones`,correct:!1,explanation:`'drones' là máy bay không người lái hiện đại.`},{text:`helicopters`,correct:!1,explanation:`'helicopters' là trực thăng vũ trang.`},{text:`rockets`,correct:!1,explanation:`'rockets' là tên lửa đạn đạo.`}]},{q:`Môn thể thao mạo hiểm nhảy từ trên cầu cao hoặc vách đá với sợi dây đàn hồi chắc chắn buộc vào cổ chân là: 🪢🏞️`,a:[{text:`bungee jumping`,correct:!0,explanation:`Chính xác! Môn nhảy mạo hiểm bằng dây co giãn đàn hồi là 'bungee jumping'.`},{text:`ice skating`,correct:!1,explanation:`'ice skating' là môn trượt băng nghệ thuật trên băng.`},{text:`table tennis`,correct:!1,explanation:`'table tennis' là môn bóng bàn thi đấu.`},{text:`badminton`,correct:!1,explanation:`'badminton' là môn cầu lông nhẹ nhàng.`}]},{q:`Trải nghiệm lặn sâu dưới đáy biển đeo bình dưỡng khí và kính lặn ngắm nhìn rạn san hô rực rỡ là: 🤿🐠`,a:[{text:`scuba diving`,correct:!0,explanation:`Đúng rồi! Lặn có bình khí dưỡng khí là 'scuba diving' (viết tắt của Self-Contained Underwater Breathing Apparatus).`},{text:`windsurfing`,correct:!1,explanation:`'windsurfing' là môn lướt ván buồm trên mặt nước.`},{text:`horse racing`,correct:!1,explanation:`'horse racing' là môn đua ngựa tốc độ.`},{text:`golfing`,correct:!1,explanation:`'golfing' là môn thể thao đánh golf trên cỏ.`}]},{q:`Chuyến thám hiểm bằng xe chuyên dụng quan sát các loài động vật hoang dã như sư tử, hươu cao cổ trên thảo nguyên là: 🦁🚙`,a:[{text:`safari`,correct:!0,explanation:`Chính xác! Chuyến đi thám hiểm thiên nhiên hoang dã (đặc biệt ở châu Phi) là 'safari'.`},{text:`cruise`,correct:!1,explanation:`'cruise' là chuyến du ngoạn trên du thuyền xa hoa.`},{text:`metro ride`,correct:!1,explanation:`'metro ride' là chuyến đi tàu điện ngầm đô thị.`},{text:`flight`,correct:!1,explanation:`'flight' là chuyến bay bằng máy bay dân dụng.`}]},{q:`Have you ever ___ the sheer rock face of a towering mountain or trekked across a frozen glacier? 🧗‍♂️🏔️`,a:[{text:`climbed`,correct:!0,explanation:`Đúng rồi! Cấu trúc câu hỏi thì Hiện tại hoàn thành hỏi về trải nghiệm cuộc đời: 'Have you ever + V3/ed?' ('Have you ever climbed...?').`},{text:`climb`,correct:!1,explanation:`Hiện tại hoàn thành phải dùng phân từ hai (V3/ed), không dùng nguyên mẫu.`},{text:`climbing`,correct:!1,explanation:`Dạng V-ing không dùng trong thì hiện tại hoàn thành.`},{text:`climbs`,correct:!1,explanation:`Động từ thêm s chia sai thì.`}]},{q:`Last summer vacation, our school volunteer club ___ to the remote mountainous highlands to construct a suspension footbridge. 🌉⛰️`,a:[{text:`traveled (went)`,correct:!0,explanation:`Chính xác! Có mốc thời gian quá khứ xác định cụ thể ('Last summer vacation') nên bắt buộc dùng thì Quá khứ đơn 'traveled'.`},{text:`has traveled`,correct:!1,explanation:`Có trạng từ chỉ thời gian quá khứ xác định 'Last summer', cấm dùng thì hiện tại hoàn thành.`},{text:`travels`,correct:!1,explanation:`Hiện tại đơn sai mốc thời gian quá khứ.`},{text:`had been traveling`,correct:!1,explanation:`Không có hành động quá khứ khác làm mốc so sánh.`}]},{q:`Minh has devoted himself to volunteering at the local wildlife rehabilitation center ___ he was a seventh grader in 2022. 📅🐾`,a:[{text:`since`,correct:!0,explanation:`Đúng rồi! 'since + mốc thời gian / mệnh đề quá khứ' diễn tả mốc thời điểm bắt đầu hành động kéo dài đến nay trong thì Hiện tại hoàn thành.`},{text:`for`,correct:!1,explanation:`'for' đi với khoảng thời gian (for 3 years), không đi với mệnh đề mốc.`},{text:`ago`,correct:!1,explanation:`'ago' đứng sau khoảng thời gian trong thì quá khứ đơn.`},{text:`already`,correct:!1,explanation:`'already' mang nghĩa đã... rồi.`}]},{q:`The expedition members have assembled all their camping survival gear, but they have not finalized the trail itinerary ___. ⛺🗺️`,a:[{text:`yet`,correct:!0,explanation:`Chính xác! 'yet' đứng ở cuối câu phủ định của thì Hiện tại hoàn thành mang nghĩa 'chưa'.`},{text:`already`,correct:!1,explanation:`'already' thường đứng trong câu khẳng định giữa trợ từ và V3.`},{text:`never`,correct:!1,explanation:`'never' đứng trước V3, không đứng cuối câu sau not.`},{text:`since`,correct:!1,explanation:`'since' cần có mốc thời gian theo sau.`}]},{q:`She has ___ returned from an exhilarating spelunking exploration deep inside Son Doong Cave and feels thrilled. 🕳️✨`,a:[{text:`just`,correct:!0,explanation:`Đúng rồi! Trạng từ 'just' đứng giữa 'has' và V3 diễn tả hành động vừa mới xảy ra tức thì.`},{text:`yet`,correct:!1,explanation:`'yet' đứng cuối câu phủ định hoặc nghi vấn.`},{text:`ago`,correct:!1,explanation:`'ago' dùng trong quá khứ đơn.`},{text:`ever`,correct:!1,explanation:`'ever' dùng trong câu hỏi nghi vấn trải nghiệm.`}]},{q:`How many sovereign nations across continents ___ you set foot in so far in your entire travel journeys? 🌍✈️`,a:[{text:`have`,correct:!0,explanation:`Chính xác! Cấu trúc câu hỏi trải nghiệm với dấu hiệu 'so far' (cho tới nay) chia thì Hiện tại hoàn thành với chủ ngữ 'you': 'How many... have you set foot in...?'.`},{text:`did`,correct:!1,explanation:`'so far' chia hiện tại hoàn thành, không chia quá khứ đơn 'did'.`},{text:`are`,correct:!1,explanation:`Đã có động từ 'set foot' nên không dùng to be 'are'.`},{text:`do`,correct:!1,explanation:`Hiện tại đơn không phù hợp với trải nghiệm tích lũy.`}]},{q:`Odd one out: Chọn từ có phần đuôi '-ed' phát âm là /ɪd/ (khác với nhóm phát âm là /t/ hoặc /d/): visited, climbed, lived, explored 🔊`,a:[{text:`visited`,correct:!0,explanation:`Chính xác! 'visited' có tận cùng bằng âm /t/ nên khi thêm -ed phát âm là /ɪd/ (/ˈvɪz.ɪ.tɪd/), trong khi climbed (/d/), lived (/d/), explored (/d/) đều phát âm là /d/.`},{text:`climbed`,correct:!1,explanation:`Phát âm đuôi -ed là /d/ /klaɪmd/.`},{text:`lived`,correct:!1,explanation:`Phát âm đuôi -ed là /d/ /lɪvd/.`},{text:`explored`,correct:!1,explanation:`Phát âm đuôi -ed là /d/ /ɪkˈsplɔːd/.`}]},{q:`Odd one out: Môn thể thao nào KHÔNG PHẢI MÔN THỂ THAO MẠO HIỂM CẢM GIÁC MẠNH? ♟️`,a:[{text:`chess playing`,correct:!0,explanation:`Đúng rồi! 'chess playing' (chơi cờ vua) là môn thể thao trí tuệ tĩnh lặng, còn skydiving, white-water rafting, bungee jumping là các môn thể thao mạo hiểm cảm giác mạnh.`},{text:`skydiving`,correct:!1,explanation:`'skydiving' là nhảy dù từ máy bay mạo hiểm.`},{text:`white-water rafting`,correct:!1,explanation:`'white-water rafting' là chèo xuồng vượt thác ghềnh cuồn cuộn.`},{text:`bungee jumping`,correct:!1,explanation:`'bungee jumping' là nhảy dây đàn hồi từ đỉnh cao vực thẳm.`}]},{q:`Sắp xếp chữ cái thành từ chỉ trải nghiệm cuộc sống: 'n - i - c - r - x - p - e - e - e - e' 🌟`,a:[{text:`experience`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'experience' (trải nghiệm / kinh nghiệm).`},{text:`experiance`,correct:!1,explanation:`Sai chữ e thành a.`},{text:`experiense`,correct:!1,explanation:`Sai chữ c thành s.`},{text:`exparience`,correct:!1,explanation:`Sai chữ e đầu thành a.`}]},{q:`Viết lại câu từ Quá khứ đơn sang Hiện tại hoàn thành: 'The last time I went scuba diving was three years ago.' 🤿🌊`,a:[{text:`I have not gone scuba diving for three years.`,correct:!0,explanation:`Chính xác! Cấu trúc: 'The last time S + V2 was (time) ago' viết lại thành 'S + have/has not + V3 + for (time)'.`},{text:`I have gone scuba diving since three years.`,correct:!1,explanation:`Khoảng thời gian 3 năm phải dùng 'for', không dùng 'since'.`},{text:`I did not go scuba diving for three years ago.`,correct:!1,explanation:`Dùng sai 'for' chung với 'ago' trong quá khứ.`},{text:`I have gone scuba diving three years ago.`,correct:!1,explanation:`Thì hiện tại hoàn thành không đi với 'ago'.`}]},{q:`Tìm lỗi sai trong câu thì sau: 'She has successfully scaled the snowy summit of Mount Fuji two years ago.' 🗻❄️`,a:[{text:`has successfully scaled -> successfully scaled`,correct:!0,explanation:`Đúng rồi! Có mốc thời gian quá khứ xác định 'two years ago' nên bắt buộc dùng thì Quá khứ đơn ('scaled'), không dùng Hiện tại hoàn thành ('has scaled').`},{text:`snowy summit -> summit snowy`,correct:!1,explanation:`Tính từ đứng trước danh từ là chuẩn.`},{text:`Mount Fuji -> Mount of Fuji`,correct:!1,explanation:`Tên đỉnh núi đứng sau Mount không có of là đúng.`},{text:`two years ago -> for two years ago`,correct:!1,explanation:`Không dùng for trước ago.`}]},{q:`Cảm giác bỡ ngỡ, choáng ngợp và lạc lõng khi lần đầu tiên tiếp xúc với một nền văn hóa và lối sống xa lạ là: 🌍🤯`,a:[{text:`culture shock`,correct:!0,explanation:`Chính xác! 'culture shock' là hiện tượng sốc văn hóa khi chuyển đến một môi trường hoàn toàn mới.`},{text:`electric shock`,correct:!1,explanation:`'electric shock' là cú giật điện nguy hiểm.`},{text:`aftershock`,correct:!1,explanation:`'aftershock' là dư chấn rung chuyển sau động đất.`},{text:`traffic shock`,correct:!1,explanation:`Cú sốc giao thông (không phải thuật ngữ chuẩn).`}]},{q:`Môn thể thao nhảy tự do từ máy bay trên độ cao hàng ngàn mét rồi bung dù lượn tiếp đất an toàn là: 🪂✈️`,a:[{text:`skydiving (parachuting)`,correct:!0,explanation:`Tuyệt vời! Môn nhảy dù tự do mạo hiểm từ máy bay là 'skydiving' hoặc 'parachuting'.`},{text:`table soccer`,correct:!1,explanation:`'table soccer' là bi lắc trên bàn gỗ.`},{text:`snorkeling`,correct:!1,explanation:`'snorkeling' là bơi lặn có ống thở sát mặt nước.`},{text:`bowling`,correct:!1,explanation:`'bowling' là ném bóng gỗ 10 ki trong nhà.`}]},{q:`Volunteering to teach impoverished children in remote border highlands has nurtured in my heart profound empathy and ___. ❤️🌱`,a:[{text:`compassion`,correct:!0,explanation:`Chính xác! Lòng trắc ẩn, sự thấu cảm nhân ái và vị tha là 'compassion'.`},{text:`cruelty`,correct:!1,explanation:`'cruelty' là sự độc ác tàn nhẫn.`},{text:`jealousy`,correct:!1,explanation:`'jealousy' là thói đố kỵ ghen ghét.`},{text:`greed`,correct:!1,explanation:`'greed' là lòng tham lam ích kỷ.`}]},{q:`Have you ever tasted exotic tropical fruits with pungent odors like the spiky yellow ___? 🍈🥢`,a:[{text:`durian`,correct:!0,explanation:`Đúng rồi! Quả sầu riêng có gai nhọn và mùi hương nồng đậm đặc trưng là 'durian'.`},{text:`watermelon`,correct:!1,explanation:`'watermelon' là quả dưa hấu ruột đỏ thanh mát.`},{text:`grape`,correct:!1,explanation:`'grape' là chùm nho mọng nước.`},{text:`strawberry`,correct:!1,explanation:`'strawberry' là quả dâu tây đỏ chua ngọt.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'never / has / bungee / She / jumping / tried / in / life / her / .' 🪢✨`,a:[{text:`She has never tried bungee jumping in her life.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (She) + has never tried (vị ngữ hiện tại hoàn thành) + bungee jumping (tân ngữ) + in her life (cụm từ chỉ trải nghiệm cả đời).`},{text:`She has tried never bungee jumping in her life.`,correct:!1,explanation:`Vị trí của 'never' phải đứng ngay sau trợ từ 'has' và trước V3.`},{text:`Never she has tried bungee jumping in her life.`,correct:!1,explanation:`Đảo 'never' lên đầu câu phải dùng đảo ngữ.`},{text:`Bungee jumping she has never tried in life her.`,correct:!1,explanation:`Sai vị trí tính từ sở hữu 'her'.`}]},{q:`How do adventurous voyages and immersive intercultural exchanges accelerate emotional maturity in teenagers? 🎒🌟`,a:[{text:`They cultivate resilience, sharpen crisis adaptability, and shatter narrow parochial prejudices.`,correct:!0,explanation:`Chính xác! Những chuyến đi mạo hiểm tôi luyện ý chí kiên cường, sự thích ứng trước khó khăn và xóa bỏ những định kiến hẹp hòi.`},{text:`They compel youths to forget all academic studies permanently.`,correct:!1,explanation:`Không làm học sinh quên mất kiến thức học tập.`},{text:`They make teenagers detest all fellow human beings completely.`,correct:!1,explanation:`Không gây thù ghét đồng loại.`},{text:`They ensure teenagers become billionaire tycoons overnight.`,correct:!1,explanation:`Không phải cách làm giàu tức thì qua đêm.`}]},{q:`Linh has passionately practiced Vietnamese traditional folk dances ___ seven consecutive years. 💃📅`,a:[{text:`for`,correct:!0,explanation:`Chính xác! 'for + khoảng thời gian' ('for seven consecutive years' - trong 7 năm liên tiếp) dùng trong thì Hiện tại hoàn thành.`},{text:`since`,correct:!1,explanation:`'since' đi với mốc thời gian, không đi với khoảng thời gian.`},{text:`ago`,correct:!1,explanation:`'ago' dùng trong quá khứ đơn, không đi với hiện tại hoàn thành.`},{text:`in`,correct:!1,explanation:`'in' không diễn tả tính liên tục kéo dài đến nay.`}]},{q:`We ___ our round-trip train tickets to the ancient town of Hoi An on an official booking application yesterday evening. 🎫🚆`,a:[{text:`booked`,correct:!0,explanation:`Đúng rồi! Trạng từ quá khứ xác định 'yesterday evening' yêu cầu chia động từ ở thì Quá khứ đơn 'booked'.`},{text:`have booked`,correct:!1,explanation:`Có yesterday evening cấm dùng thì hiện tại hoàn thành.`},{text:`book`,correct:!1,explanation:`Hiện tại đơn sai mốc thời gian hôm qua.`},{text:`had booked`,correct:!1,explanation:`Chỉ có một hành động trong quá khứ, không cần quá khứ hoàn thành.`}]},{q:`An experienced and certified mountain trekking ___ navigated our expedition safely through the mist-shrouded jungle ridge. 🧗‍♂️🧭`,a:[{text:`guide`,correct:!0,explanation:`Chính xác! Người hướng dẫn viên dẫn đường chuyên nghiệp là 'tour guide' hoặc 'trekking guide'.`},{text:`cashier`,correct:!1,explanation:`'cashier' là nhân viên thu ngân cửa hàng.`},{text:`barber`,correct:!1,explanation:`'barber' là thợ cắt tóc nam.`},{text:`carpenter`,correct:!1,explanation:`'carpenter' là thợ mộc đóng bàn ghế.`}]},{q:`Sleeping in a waterproof tent beneath a canopy of twinkling cosmic constellations is an unforgettable wilderness ___. ⛺🌌`,a:[{text:`adventure (experience)`,correct:!0,explanation:`Đúng rồi! Trải nghiệm phiêu lưu giữa thiên nhiên kỳ thú là 'wilderness adventure' hoặc 'experience'.`},{text:`punishment`,correct:!1,explanation:`'punishment' là hình phạt nghiêm khắc.`},{text:`failure`,correct:!1,explanation:`'failure' là sự thất bại đắng cay.`},{text:`nightmare`,correct:!1,explanation:`'nightmare' là cơn ác mộng kinh hoàng.`}]},{q:`Surviving sudden tropical thunderstorms while backpacking across rugged mountain terrain necessitates practical outdoor survival ___. 🎒⚡`,a:[{text:`skills`,correct:!0,explanation:`Chính xác! Kỹ năng sinh tồn ngoài trời là 'outdoor survival skills'.`},{text:`games`,correct:!1,explanation:`'games' là các trò chơi giải trí.`},{text:`toys`,correct:!1,explanation:`'toys' là những món đồ chơi trẻ em.`},{text:`candies`,correct:!1,explanation:`'candies' là những viên kẹo ngọt.`}]},{q:`Mô hình gia đình lớn truyền thống gồm ba hoặc bốn thế hệ (ông bà, bố mẹ, con cháu) cùng chung sống hòa thuận là: 👨‍👩‍👧‍👦👵`,a:[{text:`extended family`,correct:!0,explanation:`Chính xác! Gia đình nhiều thế hệ (đại gia đình) là 'extended family'.`},{text:`single-parent family`,correct:!1,explanation:`'single-parent family' là gia đình đơn thân chỉ có bố hoặc mẹ.`},{text:`childless family`,correct:!1,explanation:`'childless family' là gia đình vợ chồng không có con cái.`},{text:`nuclear family`,correct:!1,explanation:`'nuclear family' là gia đình hạt nhân chỉ có 2 thế hệ.`}]},{q:`Mô hình gia đình hiện đại chỉ gồm hai thế hệ là cha mẹ và con cái sinh sống cùng nhau gọi là: 👨‍👩‍👦🏙️`,a:[{text:`nuclear family`,correct:!0,explanation:`Đúng rồi! Gia đình hạt nhân hai thế hệ là 'nuclear family'.`},{text:`extended family`,correct:!1,explanation:`'extended family' là đại gia đình tam tứ đại đồng đường.`},{text:`communal clan`,correct:!1,explanation:`'communal clan' là cả dòng tộc họ hàng làng xã.`},{text:`tribal community`,correct:!1,explanation:`'tribal community' là cộng đồng bộ lạc du mục.`}]},{q:`Phương tiện đi lại cơ bản và thân thuộc nhất của đa phần người dân Việt Nam trong thời kỳ bao cấp thế kỷ 20 là: 🚲🌾`,a:[{text:`bicycles`,correct:!0,explanation:`Chính xác! Chiếc xe đạp (xe đạp Phượng Hoàng, Thống Nhất) là phương tiện giao thông chính yếu thời bao cấp.`},{text:`supercars`,correct:!1,explanation:`'supercars' là siêu xe thể thao đắt đỏ.`},{text:`helicopters`,correct:!1,explanation:`'helicopters' là máy bay trực thăng.`},{text:`electric monorails`,correct:!1,explanation:`'electric monorails' là tàu điện một ray hiện đại.`}]},{q:`While elderly village grandmothers were sipping fragrant green tea on the veranda, noisy children ___ tag in the courtyard. 🍵🏃‍♂️`,a:[{text:`were playing`,correct:!0,explanation:`Đúng rồi! Hai hành động cùng diễn ra song song trong quá khứ dùng 'While': cả hai vế đều chia thì Quá khứ tiếp diễn ('were playing').`},{text:`played`,correct:!1,explanation:`Diễn tiến song song của hai hành động kéo dài nên chia quá khứ tiếp diễn.`},{text:`play`,correct:!1,explanation:`Hiện tại đơn sai thì.`},{text:`are playing`,correct:!1,e !1,explanation:`Không cấm dùng điện.`}]},{q:`Hardworking street peddlers in historic quarters utilized lightweight bamboo shoulder poles suspending woven rattan ___ on both ends. 🧺👵`,a:[{text:`baskets`,correct:!0,explanation:`Chính xác! Đôi quang gánh tre kĩu kịt chở theo đôi thúng (đôi giỏ đan) là 'shoulder poles suspending woven baskets'.`},{text:`refrigerators`,correct:!1,explanation:`Tủ lạnh cồng kềnh không thể gánh trên vai.`},{text:`washing machines`,correct:!1,explanation:`Máy giặt nặng hàng chục cân.`},{text:`televisions`,correct:!1,explanation:`Tivi màu.`}]},{q:`Before instant messaging apps existed, separated courtships were sustained through heartfelt, meticulously penned handwritten ___. ✉️💌`,a:[{text:`letters`,correct:!0,explanation:`Đúng rồi! Những lá thư tay viết nắn nót đong đầy tình cảm là 'handwritten letters'.`},{text:`bills`,correct:!1,explanation:`'bills' là các tờ hóa đơn đòi nợ tiền điện nước.`},{text:`leaflets`,correct:!1,explanation:`'leaflets' là các tờ rơi quảng cáo in giấy.`},{text:`menus`,correct:!1,explanation:`'menus' là thực đơn món ăn quán nhậu.`}]},{q:`Ancient village stone wells functioned as bustling social hubs where women laundered garments, drew water, and exchanged local ___. 🪣🗣️`,a:[{text:`news (gossip)`,correct:!0,explanation:`Chính xác! Giếng nước gốc đa sân đình là nơi phụ nữ gánh nước, giặt giũ và chuyện trò chia sẻ tin tức xóm làng ('exchanged local news').`},{text:`weapons`,correct:!1,explanation:`'weapons' là vũ khí nguy hiểm.`},{text:`smoke`,correct:!1,explanation:`'smoke' là khói bụi độc hại.`},{text:`garbage`,correct:!1,explanation:`'garbage' là rác rưởi phế thải.`}]},{q:`The ongoing cultural evolution towards smaller nuclear family units has sparked skyrocketing consumer demand for compact modern studio ___. 🏙️🛋️`,a:[{text:`apartments`,correct:!0,explanation:`Tuyệt vời! Căn hộ chung cư nhỏ gọn cho gia đình trẻ là 'studio apartments'.`},{text:`caves`,correct:!1,explanation:`'caves' là các hang đá hoang sơ.`},{text:`
