const fullQuestionBank=[{q:`What's your address? 🏡 (Địa chỉ của bạn là số 81 đường Trần Hưng Đạo)`,a:[{text:`It's 81 Tran Hung Dao Street.`,correct:!0,explanation:`Chính xác! 'It's + số nhà + tên đường + Street' là cấu trúc nói địa chỉ.`},{text:`It's on 81 Tran Hung Dao Street.`,correct:!1,explanation:`Khi có số nhà cụ thể đứng đầu, ta không dùng giới từ 'on' trước số nhà.`},{text:`I live in 81 Tran Hung Dao Street.`,correct:!1,explanation:`Với số nhà cụ thể phải dùng 'live at', không dùng 'live in'.`},{text:`It 81 Tran Hung Dao Street.`,correct:!1,explanation:`Thiếu động từ 'is' ('It's').`}]},{q:`Where do you live? 🏙️ (Tôi sống ở căn hộ số 12 trên tầng 3 của tòa nhà Keangnam)`,a:[{text:`I live in Flat 12 on the third floor of Keangnam Tower.`,correct:!0,explanation:`Đúng rồi! Căn hộ dùng 'in Flat...', tầng dùng 'on the... floor'.`},{text:`I live on Flat 12 in the third floor of Keangnam Tower.`,correct:!1,explanation:`Căn hộ phải dùng 'in', còn tầng nhà phải dùng 'on'.`},{text:`I live at Flat 12 on the third floor of Keangnam Tower.`,correct:!1,explanation:`Sống trong căn hộ dùng giới từ 'in Flat'.`},{text:`I live in Flat 12 at the third floor of Keangnam Tower.`,correct:!1,explanation:`Tầng nhà dùng 'on the floor', không dùng 'at'.`}]},{q:`What is the village like? 🏞️ (Ngôi làng quê trông như thế nào?)`,a:[{text:`It's small and quiet.`,correct:!0,explanation:`Giỏi lắm! Hỏi về đặc điểm cảnh vật dùng 'What is... like?', trả lời bằng các tính từ miêu tả: 'It's small and quiet.'`},{text:`It likes small and quiet.`,correct:!1,explanation:`'like' ở đây là giới từ chỉ tính chất, không phải động từ 'thích'.`},{text:`It is like small and quiet.`,correct:!1,explanation:`Không có từ 'like' trong câu trả lời tính từ miêu tả trực tiếp.`},{text:`It's small and quietly.`,correct:!1,explanation:`'quiet' là tính từ miêu tả, không dùng trạng từ 'quietly'.`}]},{q:`Điền chữ cái còn thiếu: "av_nue" (Đại lộ rộng lớn) 🛣️`,a:[{text:`e`,correct:!0,explanation:`Chính xác! Đại lộ viết là 'avenue'.`},{text:`a`,correct:!1,explanation:`Chữ 'a' chưa đúng rồi.`},{text:`i`,correct:!1,explanation:`Chữ 'i' không ghép thành từ đúng.`},{text:`o`,correct:!1,explanation:`Chữ 'o' chưa chính xác em nhé.`}]},{q:`Sắp xếp các chữ cái sau thành từ chỉ con ngõ nhỏ: "a - e - n - l" 🏡`,a:[{text:`lane`,correct:!0,explanation:`Tuyệt vời! Con ngõ nhỏ trong làng hoặc phố là 'lane'.`},{text:`lean`,correct:!1,explanation:`'lean' là dựa/nghiêng người, không phải con ngõ.`},{text:`nael`,correct:!1,explanation:`Từ này không có nghĩa.`},{text:`laen`,correct:!1,explanation:`Từ này viết sai chính tả rồi.`}]},{q:`How often do you do morning exercise? 🏃‍♂️ (Bạn có thường tập thể dục buổi sáng không?)`,a:[{text:`I always do it.`,correct:!0,explanation:`Đúng rồi! 'always' (luôn luôn) chỉ tần suất 100% các ngày trong tuần.`},{text:`I do it always morning.`,correct:!1,explanation:`Trạng từ tần suất 'always' đứng trước động từ thường 'do'.`},{text:`I always doing it.`,correct:!1,explanation:`Thì hiện tại đơn diễn tả thói quen không dùng V-ing.`},{text:`I am always do it.`,correct:!1,explanation:`Không dùng 'am do' cùng nhau.`}]},{q:`How often do you go to the library? 📚 (Em đến thư viện 2 lần một tuần)`,a:[{text:`Twice a week.`,correct:!0,explanation:`Rất tốt! 2 lần một tuần nói là 'Twice a week'.`},{text:`Two times week.`,correct:!1,explanation:`Hai lần một tuần chuẩn ngữ pháp là 'Twice a week'.`},{text:`Two a week.`,correct:!1,explanation:`'Two' là số đếm, số lần là 'Twice'.`},{text:`Once a week.`,correct:!1,explanation:`'Once a week' là 1 lần một tuần em nhé.`}]},{q:`Điền từ vào chỗ trống: "I usually study ___ a partner in English class." 👥`,a:[{text:`with`,correct:!0,explanation:`Chính xác! Học cùng với bạn đồng hành là 'study with a partner'.`},{text:`to`,correct:!1,explanation:`Không dùng 'study to a partner'.`},{text:`for`,correct:!1,explanation:`'for' là cho/dành cho.`},{text:`at`,correct:!1,explanation:`'at' chỉ địa điểm hoặc thời gian.`}]},{q:`Sắp xếp các chữ cái sau thành từ chỉ người bạn cùng học: "p - t - n - a - r - e - r" 🤝`,a:[{text:`partner`,correct:!0,explanation:`Giỏi lắm! Bạn cùng cặp/bạn đồng hành là 'partner'.`},{text:`partenr`,correct:!1,explanation:`Hai chữ cái cuối bị đảo vị trí.`},{text:`patrner`,correct:!1,explanation:`Chữ 'r' bị đặt sai vị trí.`},{text:`pertanr`,correct:!1,explanation:`Từ này viết sai chính tả.`}]},{q:`Hành động "lướt mạng Internet" để tìm tài liệu học tập là gì? 🌐`,a:[{text:`surf the Internet`,correct:!0,explanation:`Đúng rồi! Lướt web là 'surf the Internet'.`},{text:`play the Internet`,correct:!1,explanation:`Không dùng 'play the Internet'.`},{text:`watch the Internet`,correct:!1,explanation:`Không dùng 'watch the Internet'.`},{text:`look the Internet`,correct:!1,explanation:`Không dùng 'look the Internet'.`}]},{q:`Chọn từ có vị trí trọng âm khác với các từ còn lại: 🎵`,a:[{text:`address`,correct:!0,explanation:`Chính xác! 'ad'dress' có trọng âm rơi vào âm tiết thứ 2, các từ còn lại rơi vào âm tiết thứ 1.`},{text:`village`,correct:!1,explanation:`'village' trọng âm rơi vào âm tiết thứ 1.`},{text:`tower`,correct:!1,explanation:`'tower' trọng âm rơi vào âm tiết thứ 1.`},{text:`city`,correct:!1,explanation:`'city' trọng âm rơi vào âm tiết thứ 1.`}]},{q:`Hà Nội là một thành phố lớn và đông đúc. Ta dùng cặp tính từ nào? 🏙️`,a:[{text:`big and busy`,correct:!0,explanation:`Rất tốt! 'big and busy' nghĩa là to lớn và nhộn nhịp, đông đúc.`},{text:`far and quiet`,correct:!1,explanation:`'far and quiet' là xa xôi và yên tĩnh.`},{text:`small and peaceful`,correct:!1,explanation:`'small and peaceful' là nhỏ bé và thanh bình.`},{text:`busy and quietly`,correct:!1,explanation:`'busy' là tính từ nhưng 'quietly' lại là trạng từ.`}]},{q:`Tìm lỗi sai trong câu sau: "He always get up early in the morning." ⏰`,a:[{text:`get`,correct:!0,explanation:`Đúng rồi! Chủ ngữ 'He' ngôi thứ ba số ít thì động từ phải chia thêm 's' thành 'gets'.`},{text:`always`,correct:!1,explanation:`'always' đứng trước động từ là đúng vị trí.`},{text:`early`,correct:!1,explanation:`'early' là trạng từ đúng nghĩa.`},{text:`in the morning`,correct:!1,explanation:`Cụm chỉ thời gian này hoàn toàn chính xác.`}]},{q:`Điền chữ cái còn thiếu: "t_wer" (Tòa tháp cao tầng) 🗼`,a:[{text:`o`,correct:!0,explanation:`Chính xác! Tòa tháp cao viết là 'tower'.`},{text:`a`,correct:!1,explanation:`Chữ 'a' chưa đúng rồi.`},{text:`e`,correct:!1,explanation:`Chữ 'e' không ghép thành từ đúng.`},{text:`u`,correct:!1,explanation:`Chữ 'u' chưa chính xác.`}]},{q:`Từ nào sau đây đồng nghĩa với từ "peaceful" (yên bình)? 🕊️`,a:[{text:`quiet`,correct:!0,explanation:`Tuyệt vời! 'quiet' (yên tĩnh, thanh bình) gần nghĩa với 'peaceful'.`},{text:`noisy`,correct:!1,explanation:`'noisy' là ồn ào, trái nghĩa với 'peaceful'.`},{text:`crowded`,correct:!1,explanation:`'crowded' là đông đúc chật chội.`},{text:`busy`,correct:!1,explanation:`'busy' là bận rộn náo nhiệt.`}]},{q:`Một tháng bạn về thăm ông bà một lần. Bạn nói câu nào? 👵👴`,a:[{text:`I visit my grandparents once a month.`,correct:!0,explanation:`Đúng rồi! 1 lần một tháng là 'once a month'.`},{text:`I visit my grandparents one a month.`,correct:!1,explanation:`Số lần phải dùng 'once', không dùng 'one'.`},{text:`I visit my grandparents twice a month.`,correct:!1,explanation:`'twice a month' là 2 lần một tháng.`},{text:`I visit my grandparents four a month.`,correct:!1,explanation:`'four' là số đếm, không đúng ngữ pháp chỉ tần suất.`}]},{q:`Sắp xếp các chữ cái sau thành trạng từ chỉ tần suất "thường thường": "u - s - a - u - l - l - y" 🔁`,a:[{text:`usually`,correct:!0,explanation:`Giỏi lắm! Trạng từ chỉ mức độ thường xuyên là 'usually'.`},{text:`usaually`,correct:!1,explanation:`Thừa chữ 'a' ở giữa rồi.`},{text:`usullay`,correct:!1,explanation:`Chưa đúng vị trí các chữ cái.`},{text:`uasully`,correct:!1,explanation:`Từ này viết sai chính tả.`}]},{q:`Chọn từ khác loại so với các từ còn lại (Odd one out): floor, street, lane, avenue`,a:[{text:`floor`,correct:!0,explanation:`Chính xác! 'floor' là sàn/tầng nhà, các từ còn lại là từ chỉ các loại đường phố (đường, ngõ, đại lộ).`},{text:`street`,correct:!1,explanation:`'street' là con đường phố.`},{text:`lane`,correct:!1,explanation:`'lane' là con ngõ.`},{text:`avenue`,correct:!1,explanation:`'avenue' là đại lộ.`}]},{q:`What do you do in the afternoon? 🚴‍♂️ (Tôi thường đi xe đạp quanh hồ)`,a:[{text:`I often ride a bike around the lake.`,correct:!0,explanation:`Tuyệt vời! 'ride a bike around the lake' nghĩa là đạp xe quanh hồ.`},{text:`I often rides a bike around the lake.`,correct:!1,explanation:`Chủ ngữ 'I' động từ giữ nguyên mẫu 'ride'.`},{text:`I am often ride a bike around the lake.`,correct:!1,explanation:`Không dùng 'am ride' cùng nhau.`},{text:`I ride often a bike around the lake.`,correct:!1,explanation:`'often' đứng trước động từ thường 'ride'.`}]},{q:`Từ nào có đuôi '-ed' phát âm là /ɪd/: visited, played, watched, cooked? 📢`,a:[{text:`visited`,correct:!0,explanation:`Chính xác! Động từ kết thúc bằng âm /t/ hoặc /d/ khi thêm -ed sẽ phát âm là /ɪd/: 'visited'.`},{text:`played`,correct:!1,explanation:`'played' phát âm là /d/.`},{text:`watched`,correct:!1,explanation:`'watched' phát âm là /t/.`},{text:`cooked`,correct:!1,explanation:`'cooked' phát âm là /t/.`}]},{q:`Where did you go on holiday? 🏮 (Tôi đã đi thăm Phố cổ Hội An)`,a:[{text:`I went to Hoi An Ancient Town.`,correct:!0,explanation:`Chính xác! Phố cổ Hội An tiếng Anh là 'Hoi An Ancient Town'.`},{text:`I go to Hoi An Ancient Town.`,correct:!1,explanation:`Chuyến đi trong quá khứ phải dùng 'went'.`},{text:`I went at Hoi An Ancient Town.`,correct:!1,explanation:`Đi tới địa danh nào dùng 'went to'.`},{text:`I was go to Hoi An Ancient Town.`,correct:!1,explanation:`Không dùng 'was go' cùng nhau.`}]},{q:`Cố đô Huế với những đền đài cung điện cổ kính tiếng Anh gọi là gì? 🏯`,a:[{text:`Hue Imperial City`,correct:!0,explanation:`Đúng rồi! Cố đô Huế là 'Hue Imperial City'.`},{text:`Hue Ancient Town`,correct:!1,explanation:`'Ancient Town' là phố cổ (như Hội An).`},{text:`Hue Island`,correct:!1,explanation:`'Island' là hòn đảo.`},{text:`Hue Bay`,correct:!1,explanation:`'Bay' là vùng vịnh biển (như Hạ Long).`}]},{q:`Tàu điện ngầm chạy dưới lòng đất ở các thành phố hiện đại là gì? 🚇`,a:[{text:`underground`,correct:!0,explanation:`Giỏi lắm! Tàu điện ngầm là 'underground' (hoặc subway).`},{text:`coach`,correct:!1,explanation:`'coach' là xe khách đường dài.`},{text:`train`,correct:!1,explanation:`'train' là tàu hỏa trên mặt đất.`},{text:`plane`,correct:!1,explanation:`'plane' là máy bay.`}]},{q:`How did you get to your hometown? 🚆 (Tôi về quê bằng tàu hỏa)`,a:[{text:`I went by train.`,correct:!0,explanation:`Rất tốt! 'went by train' là đi bằng tàu hỏa.`},{text:`I went on train.`,correct:!1,explanation:`Chỉ phương tiện di chuyển tổng quát dùng 'by train'.`},{text:`I went in train.`,correct:!1,explanation:`Không dùng 'in train'.`},{text:`I get by train.`,correct:!1,explanation:`Câu hỏi ở quá khứ ('did get') nên trả lời dùng 'went'.`}]},{q:`Điền chữ cái còn thiếu: "anc_ent" (Cổ kính, xưa cũ) 🏛️`,a:[{text:`i`,correct:!0,explanation:`Chính xác! Cổ kính viết là 'ancient'.`},{text:`e`,correct:!1,explanation:`Chữ 'e' chưa đúng rồi.`},{text:`a`,correct:!1,explanation:`Chữ 'a' không ghép thành từ đúng.`},{text:`y`,correct:!1,explanation:`Chữ 'y' chưa chính xác em nhé.`}]},{q:`Sắp xếp các chữ cái sau thành từ chỉ xe khách: "h - c - o - a - c" 🚌`,a:[{text:`coach`,correct:!0,explanation:`Tuyệt vời! Xe khách đường dài là 'coach'.`},{text:`caoch`,correct:!1,explanation:`Chưa đúng vị trí chữ 'o' và 'a'.`},{text:`choac`,correct:!1,explanation:`Từ này viết sai chính tả rồi.`},{text:`choca`,correct:!1,explanation:`Chưa chính xác em nhé.`}]},{q:`What was the trip like? ⛵ (Chuyến đi nghỉ mát thật là tuyệt vời)`,a:[{text:`It was wonderful.`,correct:!0,explanation:`Đúng rồi! Hỏi về cảm nhận chuyến đi đã qua dùng 'What was the trip like?', trả lời: 'It was wonderful.'`},{text:`It is wonderful.`,correct:!1,explanation:`Chuyến đi trong quá khứ phải dùng 'was'.`},{text:`It was wonder.`,correct:!1,explanation:`'wonder' là danh từ/động từ, cần tính từ 'wonderful'.`},{text:`It liked wonderful.`,correct:!1,explanation:`Sai cấu trúc ngữ pháp.`}]},{q:`Did you go to Mai's birthday party yesterday? 🎂 (Bạn có đi dự sinh nhật Mai hôm qua không?)`,a:[{text:`Yes, I did.`,correct:!0,explanation:`Chính xác! Trả lời khẳng định cho câu hỏi 'Did you...?' là 'Yes, I did.'`},{text:`Yes, I was.`,correct:!1,explanation:`Câu hỏi mượn trợ động từ 'Did', trả lời dùng 'did'.`},{text:`Yes, I do.`,correct:!1,explanation:`Câu hỏi ở quá khứ, không trả lời 'do' ở hiện tại.`},{text:`No, I did.`,correct:!1,explanation:`'No' phải đi với phủ định 'didn't'.`}]},{q:`What did you do at the party? 🍕🥤 (Chúng tôi đã ăn đồ ăn ngon và trò chuyện cùng bạn bè)`,a:[{text:`We ate nice food and chatted with friends.`,correct:!0,explanation:`Giỏi lắm! Quá khứ của 'eat' là 'ate', 'chat' gấp đôi 't' thành 'chatted'.`},{text:`We eat nice food and chatted with friends.`,correct:!1,explanation:`'eat' chưa chia quá khứ thành 'ate'.`},{text:`We ate nice food and chat with friends.`,correct:!1,explanation:`'chat' chưa chia quá khứ thành 'chatted'.`},{text:`We was ate nice food.`,correct:!1,explanation:`Không dùng 'was ate' cùng nhau.`}]},{q:`Trò chơi trốn tìm mà các bạn nhỏ rất thích chơi ở buổi tiệc là gì? 🙈`,a:[{text:`hide-and-seek`,correct:!0,explanation:`Đúng rồi! Trò chơi trốn tìm là 'hide-and-seek'.`},{text:`football`,correct:!1,explanation:`'football' là đá bóng.`},{text:`chess`,correct:!1,explanation:`'chess' là cờ vua.`},{text:`puzzle`,correct:!1,explanation:`'puzzle' là trò xếp hình.`}]},{q:`Hội chợ vui chơi với nhiều trò chơi giải trí tiếng Anh là gì? 🎡`,a:[{text:`funfair`,correct:!0,explanation:`Rất tốt! Hội chợ vui chơi náo nhiệt là 'funfair'.`},{text:`library`,correct:!1,explanation:`'library' là thư viện đọc sách.`},{text:`museum`,correct:!1,explanation:`'museum' là viện bảo tàng.`},{text:`cinema`,correct:!1,explanation:`'cinema' là rạp chiếu phim.`}]},{q:`Điền ect:!1,explanation:`'autumn' là mùa thu.`}]},{q:`Bản tin dự báo thời tiết hàng ngày trên truyền hình gọi là gì? 📺🌦️`,a:[{text:`weather forecast`,correct:!0,explanation:`Tuyệt vời! Dự báo thời tiết là 'weather forecast'.`},{text:`weather news`,correct:!1,explanation:`'forecast' là thuật ngữ chuyên ngành dự báo thời tiết chuẩn nhất.`},{text:`weather report`,correct:!1,explanation:`Người ta hay dùng 'weather forecast' cho bản tin dự báo tương lai.`},{text:`weather story`,correct:!1,explanation:`Không dùng 'weather story'.`}]},{q:`What will the weather be like tomorrow? 🌤️ (Ngày mai trời sẽ ấm áp và có gió nhẹ)`,a:[{text:`It will be warm and windy.`,correct:!0,explanation:`Chính xác! 'warm and windy' nghĩa là ấm áp và có gió.`},{text:`It will is warm and windy.`,correct:!1,explanation:`Sau 'will' dùng động từ nguyên mẫu 'be', không dùng 'is'.`},{text:`It is warm and windy.`,correct:!1,explanation:`Dự báo cho ngày mai ('tomorrow') phải dùng thì tương lai 'will be'.`},{text:`It was warm and windy.`,correct:!1,explanation:`'was' dùng cho quá khứ.`}]},{q:`Điền chữ cái còn thiếu: "s_ason" (Mùa trong năm) 🍃`,a:[{text:`e`,correct:!0,explanation:`Đúng rồi! Mùa trong năm viết là 'season'.`},{text:`a`,correct:!1,explanation:`Chữ 'a' đứng sau chữ 'e' rồi.`},{text:`o`,correct:!1,explanation:`Chữ 'o' đứng gần cuối từ rồi.`},{text:`u`,correct:!1,explanation:`Chữ 'u' không đúng em nhé.`}]},{q:`Sắp xếp các chữ cái sau thành từ chỉ mùa thu: "u - m - a - t - n - u" 🍁`,a:[{text:`autumn`,correct:!0,explanation:`Giỏi lắm! Mùa thu là 'autumn'.`},{text:`autmun`,correct:!1,explanation:`Chưa đúng vị trí chữ 'm' và 'n'.`},{text:`autunm`,correct:!1,explanation:`Từ này viết sai chính tả rồi.`},{text:`atuumn`,correct:!1,explanation:`Chưa chính xác em nhé.`}]},{q:`Chọn từ khác loại so với các từ còn lại (Odd one out): forecast, spring, summer, winter`,a:[{text:`forecast`,correct:!0,explanation:`Chính xác! 'forecast' là bản tin dự báo, còn lại là tên bốn mùa trong năm.`},{text:`spring`,correct:!1,explanation:`'spring' là mùa xuân.`},{text:`summer`,correct:!1,explanation:`'summer' là mùa hè.`},{text:`winter`,correct:!1,explanation:`'winter' là mùa đông.`}]},{q:`Thời tiết có độ ẩm cao, nồm ẩm khó chịu tiếng Anh gọi là gì? 🌫️💧`,a:[{text:`humid`,correct:!0,explanation:`Rất tốt! Khí hậu ẩm ướt là 'humid'.`},{text:`dry`,correct:!1,explanation:`'dry' là khô hanh ráo nước.`},{text:`cold`,correct:!1,explanation:`'cold' là lạnh giá.`},{text:`sunny`,correct:!1,explanation:`'sunny' là có nắng rực rỡ.`}]},{q:`Thời tiết mùa đông ở miền Bắc nước ta thường mang đặc điểm gì? 🥶`,a:[{text:`cold and dry`,correct:!0,explanation:`Tuyệt vời! Mùa đông miền Bắc thường lạnh và khô ráo ('cold and dry').`},{text:`hot and sunny`,correct:!1,explanation:`'hot and sunny' là đặc điểm mùa hè.`},{text:`warm and rainy`,correct:!1,explanation:`'warm and rainy' là mùa xuân nồm ẩm.`},{text:`cool and stormy`,correct:!1,explanation:`'cool and stormy' là mùa mưa bão.`}]},{q:`Từ nào có trọng âm chính rơi vào âm tiết thứ 2: banana, sausage, chocolate, packet? 🎵`,a:[{text:`banana`,correct:!0,explanation:`Chính xác! 'ba'nana' có trọng âm rơi vào âm tiết thứ 2, các từ còn lại rơi vào âm tiết thứ 1.`},{text:`sausage`,correct:!1,explanation:`'sausage' trọng âm rơi vào âm tiết thứ 1.`},{text:`chocolate`,correct:!1,explanation:`'chocolate' trọng âm rơi vào âm tiết thứ 1.`},{text:`packet`,correct:!1,explanation:`'packet' trọng âm rơi vào âm tiết thứ 1.`}]},{q:`Tìm lỗi sai trong câu sau: "How many water do you drink every day?" 💧`,a:[{text:`many`,correct:!0,explanation:`Chính xác! Nước ('water') là danh từ không đếm được nên phải hỏi 'How much', không dùng 'How many'.`},{text:`water`,correct:!1,explanation:`Danh từ không đếm được này đúng.`},{text:`do you drink`,correct:!1,explanation:`Cấu trúc câu hỏi hiện tại đơn đúng.`},{text:`every day`,correct:!1,explanation:`Cụm trạng từ tần suất đúng.`}]},{q:`Which place would you like to visit: Trang Tien Bridge or Thien Mu Pagoda? 🌉🏯`,a:[{text:`I'd like to visit Trang Tien Bridge.`,correct:!0,explanation:`Chính xác! Lựa chọn địa danh dùng cấu trúc 'I'd like to visit + tên địa danh'.`},{text:`I like visit Trang Tien Bridge.`,correct:!1,explanation:`Cấu trúc trả lời là 'I'd like to visit'.`},{text:`I visited Trang Tien Bridge.`,correct:!1,explanation:`Câu hỏi hỏi về mong muốn ('would you like to visit'), không dùng quá khứ.`},{text:`Yes, I would.`,correct:!1,explanation:`Đây là câu hỏi lựa chọn giữa hai địa điểm ('or'), không phải câu hỏi Yes/No.`}]},{q:`Cầu Tràng Tiền bắc qua dòng sông Hương thơ mộng thuộc thành phố nào? 🌉🌊`,a:[{text:`Hue City`,correct:!0,explanation:`Đúng rồi! Cầu Tràng Tiền là biểu tượng lịch sử của Cố đô Huế.`},{text:`Hanoi`,correct:!1,explanation:`Hà Nội có Cầu Long Biên, Cầu Nhật Tân.`},{text:`Da Nang`,correct:!1,explanation:`Đà Nẵng có Cầu Rồng, Cầu Sông Hàn.`},{text:`Ho Chi Minh City`,correct:!1,explanation:`TP. Hồ Chí Minh có Chợ Bến Thành.`}]},{q:`Chợ Bến Thành nổi tiếng sầm uất nằm ở thành phố nào của nước ta? 🏛️`,a:[{text:`Ho Chi Minh City`,correct:!0,explanation:`Giỏi lắm! Chợ Bến Thành nằm tại trung tâm TP. Hồ Chí Minh.`},{text:`Hanoi`,correct:!1,explanation:`Hà Nội có Chợ Đồng Xuân.`},{text:`Hue`,correct:!1,explanation:`Huế có Chợ Đông Ba.`},{text:`Nha Trang`,correct:!1,explanation:`Nha Trang có Chợ Đầm.`}]},{q:`Which one is more beautiful: Ha Long Bay or Nha Trang? 🏖️⛵ (Vịnh Hạ Long đẹp hơn)`,a:[{text:`Ha Long Bay is more beautiful.`,correct:!0,explanation:`Rất tốt! So sánh hơn với tính từ dài 'beautiful' dùng 'more beautiful'.`},{text:`Ha Long Bay is beautifuller.`,correct:!1,explanation:`'beautiful' là tính từ dài gồm 3 âm tiết, không thêm đuôi -er.`},{text:`Ha Long Bay is most beautiful.`,correct:!1,explanation:`'most beautiful' dùng cho so sánh nhất (từ 3 đối tượng trở lên).`},{text:`Ha Long Bay more beautiful than.`,correct:!1,explanation:`Thiếu động từ 'is' trong câu.`}]},{q:`Which city is larger: Hanoi or Ho Chi Minh City? 🗺️ (Thành phố Hồ Chí Minh rộng lớn hơn)`,a:[{text:`Ho Chi Minh City is larger.`,correct:!0,explanation:`Chính xác! Tính từ ngắn 'large' kết thúc bằng đuôi 'e', so sánh hơn chỉ cần thêm 'r' thành 'larger'.`},{text:`Ho Chi Minh City is more large.`,correct:!1,explanation:`'large' là tính từ ngắn, không dùng 'more'.`},{text:`Ho Chi Minh City is large.`,correct:!1,explanation:`Câu hỏi so sánh hơn ('larger'), cần trả lời dạng so sánh hơn.`},{text:`Ho Chi Minh City is the largest.`,correct:!1,explanation:`'the largest' dùng cho so sánh nhất.`}]},{q:`Which one is noisier: life in the city or life in the countryside? 🏙️🚜`,a:[{text:`Life in the city is noisier.`,correct:!0,explanation:`Tuyệt vời! 'noisy' kết thúc bằng 'y' đổi thành 'i' rồi thêm '-er' thành 'noisier'.`},{text:`Life in the city is more noisy.`,correct:!1,explanation:`'noisy' đổi thành 'noisier', không dùng 'more noisy'.`},{text:`Life in the city is noisy than.`,correct:!1,explanation:`Thiếu đuôi so sánh hơn.`},{text:`Life in the city is noisiest.`,correct:!1,explanation:`'noisiest' dùng cho so sánh nhất.`}]},{q:`Hồ Gươm (Hồ Hoàn Kiếm) với Tháp Rùa cổ kính tiếng Anh gọi là gì? 🐢🌊`,a:[{text:`Hoan Kiem Lake`,correct:!0,explanation:`Đúng rồi! Hồ Hoàn Kiếm là 'Hoan Kiem Lake'.`},{text:`West Lake`,correct:!1,explanation:`'West Lake' là Hồ Tây.`},{text:`Ba Be Lake`,correct:!1,explanation:`'Ba Be Lake' là Hồ Ba Bể.`},{text:`Tuyen Lam Lake`,correct:!1,explanation:`'Tuyen Lam Lake' là Hồ Tuyền Lâm ở Đà Lạt.`}]},{q:`Chùa Thiên Mụ soi bóng bên dòng sông Hương tiếng Anh là gì? 🏯🔔`,a:[{text:`Thien Mu Pagoda`,correct:!0,explanation:`Giỏi lắm! Chùa chiền cổ kính là 'pagoda', Chùa Thiên Mụ là 'Thien Mu Pagoda'.`},{text:`Thien Mu Temple`,correct:!1,explanation:`'Temple' thường dùng để chỉ đền thờ các vị thần/anh hùng.`},{text:`Thien Mu Church`,correct:!1,explanation:`'Church' là nhà thờ Thiên Chúa giáo.`},{text:`Thien Mu Bridge`,correct:!1,explanation:`'Bridge' là cây cầu.`}]},{q:`Điền chữ cái còn thiếu: "p_goda" (Ngôi chùa thanh tịnh) 🏯`,a:[{text:`a`,correct:!0,explanation:`Chính xác! Ngôi chùa vi
