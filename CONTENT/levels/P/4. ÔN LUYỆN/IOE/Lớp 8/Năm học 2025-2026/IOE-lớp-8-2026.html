const fullQuestionBank=[{q:`Nghệ thuật gấp giấy truyền thống tinh xảo của đất nước Nhật Bản tiếng Anh gọi là: 🦢📄`,a:[{text:`origami`,correct:!0,explanation:`Chính xác! Nghệ thuật gấp giấy Nhật Bản là 'origami'.`},{text:`karate`,correct:!1,explanation:`'karate' là môn võ thuật đối kháng.`},{text:`judo`,correct:!1,explanation:`'judo' là môn võ nhu đạo.`},{text:`bonsai`,correct:!1,explanation:`'bonsai' là nghệ thuật uốn tỉa cây cảnh mini.`}]},{q:`Các dự án tự tay chế tác đồ thủ công, sửa chữa đồ đạc trong nhà viết tắt là: 🔨✂️`,a:[{text:`DIY projects`,correct:!0,explanation:`Đúng rồi! DIY là viết tắt của 'Do It Yourself' (Tự tay làm lấy).`},{text:`VIP projects`,correct:!1,explanation:`'VIP' là nhân vật quan trọng.`},{text:`UFO projects`,correct:!1,explanation:`'UFO' là đĩa bay ngoài hành tinh.`},{text:`SOS projects`,correct:!1,explanation:`'SOS' là tín hiệu cấp cứu khẩn cấp.`}]},{q:`Hành động đi dạo quanh các trung tâm thương mại ngắm nghía đồ đẹp qua tủ kính mà không mua gọi là: 🛍️👀`,a:[{text:`window shopping`,correct:!0,explanation:`Xuất sắc! 'window shopping' là thú vui ngắm đồ trưng bày qua cửa kính.`},{text:`online shopping`,correct:!1,explanation:`'online shopping' là mua sắm qua mạng internet.`},{text:`grocery shopping`,correct:!1,explanation:`'grocery shopping' là đi chợ mua rau củ thực phẩm.`},{text:`bargain shopping`,correct:!1,explanation:`'bargain shopping' là săn hàng đại hạ giá.`}]},{q:`Minh prefers ___ board games with his family on weekends to surfing the net. ♟️`,a:[{text:`playing`,correct:!0,explanation:`Chính xác! Cấu trúc so sánh sở thích: 'prefer V-ing to V-ing' ('prefers playing... to surfing').`},{text:`play`,correct:!1,explanation:`Động từ nguyên thể không đúng cấu trúc prefer.`},{text:`to play`,correct:!1,explanation:`Sau 'prefer' so sánh với giới từ 'to' ở vế sau phải dùng V-ing.`},{text:`played`,correct:!1,explanation:`Quá khứ đơn sai cấu trúc.`}]},{q:`Many teenagers are addicted ___ scrolling TikTok and watching short reels for hours. 📱`,a:[{text:`to`,correct:!0,explanation:`Đúng rồi! Cụm tính từ nghiện, đam mê cái gì là 'addicted to + N/V-ing'.`},{text:`with`,correct:!1,explanation:`Không dùng 'addicted with'.`},{text:`on`,correct:!1,explanation:`Thường nói 'hooked on', không dùng 'addicted on'.`},{text:`for`,correct:!1,explanation:`Không dùng 'addicted for'.`}]},{q:`My younger brother is very fond ___ making paper planes and testing how far they can glide. ✈️`,a:[{text:`of`,correct:!0,explanation:`Chính xác! Cụm tính từ yêu thích là 'fond of + V-ing'.`},{text:`in`,correct:!1,explanation:`Cụm 'interested in' mới đi với 'in'.`},{text:`at`,correct:!1,explanation:`Cụm 'good at' mới đi với 'at'.`},{text:`about`,correct:!1,explanation:`Cụm 'crazy about' mới đi với 'about'.`}]},{q:`Mai is crazy ___ Korean pop music and knows all the choreography of her favourite idol group. 💃🎵`,a:[{text:`about`,correct:!0,explanation:`Đúng rồi! Cụm từ cuồng nhiệt, say mê cái gì là 'crazy about + N/V-ing'.`},{text:`with`,correct:!1,explanation:`Không dùng 'crazy with' trong ngữ cảnh sở thích.`},{text:`on`,correct:!1,explanation:`Không dùng 'crazy on'.`},{text:`to`,correct:!1,explanation:`Không dùng 'crazy to'.`}]},{q:`Although Nam hates ___, he still helps his mother wash the dishes after dinner. 🍽️`,a:[{text:`doing the washing-up`,correct:!0,explanation:`Chính xác! Sau động từ 'hate' dùng danh động từ V-ing: 'doing the washing-up' (rửa bát đĩa).`},{text:`do the washing-up`,correct:!1,explanation:`Động từ nguyên thể chưa chia.`},{text:`did the washing-up`,correct:!1,explanation:`Quá khứ đơn không đứng sau 'hate'.`},{text:`to doing the washing-up`,correct:!1,explanation:`Sai cấu trúc 'to doing'.`}]},{q:`Odd one out: Chọn từ có phần nguyên âm phát âm là /uː/ dài (khác với âm /ʊ/ ngắn): blue, school, fruit, book 📖`,a:[{text:`book`,correct:!0,explanation:`Chính xác! 'book' có âm /ʊ/ ngắn /bʊk/, trong khi blue, school, fruit đều có âm /uː/ dài.`},{text:`blue`,correct:!1,explanation:`Có âm /uː/ dài /bluː/.`},{text:`school`,correct:!1,explanation:`Có âm /uː/ dài /skuːl/.`},{text:`fruit`,correct:!1,explanation:`Có âm /uː/ dài /fruːt/.`}]},{q:`Odd one out: Từ nào mang ý nghĩa KHÔNG THÍCH / GHÉT BỎ, khác với 3 từ còn lại? 👎`,a:[{text:`detest`,correct:!0,explanation:`Đúng rồi! 'detest' nghĩa là ghê tởm, cực ghét, còn fancy, adore, love đều mang nghĩa yêu thích.`},{text:`fancy`,correct:!1,explanation:`'fancy' là thích thú hào hứng.`},{text:`adore`,correct:!1,explanation:`'adore' là mê mẩn yêu thương.`},{text:`love`,correct:!1,explanation:`'love' là yêu thích tha thiết.`}]},{q:`Sắp xếp chữ cái thành từ chỉ thời gian nhàn rỗi giải trí: 'u - r - e - e - s - l - i' 🏖️`,a:[{text:`leisure`,correct:!0,explanation:`Xuất sắc! 'leisure time' là thời gian rảnh rỗi giải trí.`},{text:`leisrue`,correct:!1,explanation:`Sai vị trí chữ r và u cuối từ.`},{text:`liesure`,correct:!1,explanation:`Sai vị trí chữ e và i.`},{text:`lesiure`,correct:!1,explanation:`Sai chính tả tiếng Anh.`}]},{q:`Viết lại câu không đổi nghĩa: 'She prefers hanging out with friends to staying at home alone.' 👭`,a:[{text:`She likes hanging out with friends more than staying at home alone.`,correct:!0,explanation:`Chính xác! Cấu trúc 'prefer A to B' tương đương với 'like A more than B'.`},{text:`She likes hanging out with friends less than staying at home.`,correct:!1,explanation:`Ngược hoàn toàn về ý nghĩa.`},{text:`She detests hanging out with friends and stays at home.`,correct:!1,explanation:`Sai hoàn toàn sự thật sở thích.`},{text:`She prefers to stay at home rather than hanging out.`,correct:!1,explanation:`Đảo ngược thứ tự hai hoạt động.`}]},{q:`Tìm lỗi sai trong câu sau: 'My sister enjoys to knit woollen scarves for poor children in winter.' 🧣`,a:[{text:`to knit -> knitting`,correct:!0,explanation:`Đúng rồi! Sau động từ 'enjoy' bắt buộc dùng danh động từ V-ing: 'knitting', không dùng 'to knit'.`},{text:`woollen scarves -> scarf woollens`,correct:!1,explanation:`Tính từ bổ nghĩa đứng trước danh từ là chuẩn.`},{text:`for poor children -> with poor children`,correct:!1,explanation:`Đan tặng cho ai dùng 'for' là đúng.`},{text:`in winter -> on winter`,correct:!1,explanation:`Mùa trong năm đi với giới từ 'in' là chính xác.`}]},{q:`Cụm từ chỉ một người lười vận động, suốt ngày chỉ ngồi lì trên ghế xem tivi và ăn vặt là: 🛋️🥔`,a:[{text:`couch potato`,correct:!0,explanation:`Chính xác! Thành ngữ 'couch potato' dùng để chỉ người lười biếng chỉ thích nằm dài xem tivi.`},{text:`mouse potato`,correct:!1,explanation:`'mouse potato' là người nghiện ngồi máy tính lướt web.`},{text:`bookworm`,correct:!1,explanation:`'bookworm' là mọt sách chăm chỉ đọc sách.`},{text:`busy bee`,correct:!1,explanation:`'busy bee' là người bận rộn như chú ong chăm chỉ.`}]},{q:`Joining an English public speaking club helps students improve their communication ___ significantly. 🗣️`,a:[{text:`skills`,correct:!0,explanation:`Đúng rồi! Cụm từ kỹ năng giao tiếp là 'communication skills'.`},{text:`games`,correct:!1,explanation:`'games' là trò chơi.`},{text:`homework`,correct:!1,explanation:`'homework' là bài tập về nhà.`},{text:`mistakes`,correct:!1,explanation:`'mistakes' là lỗi sai lầm.`}]},{q:`Spending too much screen time on digital devices can cause mental and physical ___. 📱⚠️`,a:[{text:`fatigue`,correct:!0,explanation:`Tuyệt vời! 'fatigue' nghĩa là sự mệt mỏi suy nhược, kiệt sức.`},{text:`pleasure`,correct:!1,explanation:`'pleasure' là niềm vui sướng hân hoan.`},{text:`energy`,correct:!1,explanation:`'energy' là nguồn năng lượng dồi dào.`},{text:`strength`,correct:!1,explanation:`'strength' là sức mạnh thể lực.`}]},{q:`Doing leisure activities outdoors with close classmates teaches teenagers about the value of ___. 🤝`,a:[{text:`teamwork`,correct:!0,explanation:`Chính xác! Tinh thần đồng đội làm việc nhóm là 'teamwork'.`},{text:`selfishness`,correct:!1,explanation:`'selfishness' là tính ích kỷ hẹp hòi.`},{text:`laziness`,correct:!1,explanation:`'laziness' là thói lười biếng.`},{text:`loneliness`,correct:!1,explanation:`'loneliness' là sự cô đơn quạnh quẽ.`}]},{q:`My father taught me how to ___ delicate flowers and animals from fresh carrots and radishes. 🥕🌸`,a:[{text:`carve`,correct:!0,explanation:`Đúng rồi! 'carve' là gọt tỉa, điêu khắc hoa quả củ quả.`},{text:`paint`,correct:!1,explanation:`'paint' là quét sơn vẽ màu.`},{text:`knit`,correct:!1,explanation:`'knit' là đan len bằng que đan.`},{text:`bake`,correct:!1,explanation:`'bake' là nướng bánh trong lò.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'origami / likes / My / folding / sister / her / in / room / .' 🦢`,a:[{text:`My sister likes folding origami in her room.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (My sister) + V (likes) + V-ing (folding origami) + nơi chốn (in her room).`},{text:`My sister folding origami likes in her room.`,correct:!1,explanation:`Động từ 'likes' phải đứng trước 'folding origami'.`},{text:`Folding origami likes my sister in her room.`,correct:!1,explanation:`Sai trật tự chủ ngữ vị ngữ.`},{text:`My sister likes in her room folding origami.`,correct:!1,explanation:`Cụm nơi chốn nên đặt ở cuối câu.`}]},{q:`Why should teenagers strike a balance between leisure activities and study? ⚖️`,a:[{text:`To maintain good academic performance while protecting mental well-being.`,correct:!0,explanation:`Chính xác! Cân bằng giữa học tập và giải trí giúp duy trì kết quả học tập tốt mà vẫn bảo vệ sức khỏe tinh thần.`},{text:`To abandon all school examinations completely.`,correct:!1,explanation:`Bỏ thi cử là hoàn toàn sai.`},{text:`To spend twenty hours a day playing video games.`,correct:!1,explanation:`Chơi game 20 tiếng/ngày là lệch lạc nguy hại.`},{text:`To isolate themselves from society.`,correct:!1,explanation:`Tự cô lập bản thân là sai mục đích.`}]},{q:`Cánh đồng cỏ xanh bao la bạt ngàn nơi đàn gia súc gặm cỏ tiếng Anh là gì? 🌾🐄`,a:[{text:`pasture`,correct:!0,explanation:`Chính xác! Đồng cỏ chăn thả gia súc là 'pasture'.`},{text:`factory`,correct:!1,explanation:`'factory' là nhà máy công xưởng.`},{text:`stadium`,correct:!1,explanation:`'stadium' là sân vận động thể thao.`},{text:`harbour`,correct:!1,explanation:`'harbour' là bến cảng neo đậu tàu thuyền.`}]},{q:`Lối sống du mục nay đây mai đó di chuyển theo bầy đàn gia súc và lều bạt gọi là: ⛺🐎`,a:[{text:`nomadic life`,correct:!0,explanation:`Đúng rồi! Cuộc sống du mục là 'nomadic life'.`},{text:`urban life`,correct:!1,explanation:`'urban life' là cuộc sống đô thị phồn hoa.`},{text:`modern life`,correct:!1,explanation:`'modern life' là cuộc sống hiện đại tiện nghi.`},{text:`busy life`,correct:!1,explanation:`'busy life' là cuộc sống bận rộn tất bật.`}]},{q:`Thời điểm mùa màng lúa chín vàng rộ người nông dân tất bật gặt hái lúa về nhà gọi là: 🌾🌾`,a:[{text:`harvest time`,correct:!0,explanation:`Xuất sắc! Mùa thu hoạch / mùa gặt là 'harvest time'.`},{text:`planting time`,correct:!1,explanation:`Thời điểm gieo mạ cấy lúa non.`},{text:`winter break`,correct:!1,explanation:`Kỳ nghỉ đông tránh rét.`},{text:`flood season`,correct:!1,explanation:`Mùa lũ lụt nước dâng cao.`}]},{q:`During the harvest season, farmers in my village work much ___ than usual. 👨‍🌾 (Chăm chỉ hơn)`,a:[{text:`harder`,correct:!0,explanation:`Chính xác! 'hard' vừa là tính từ vừa là trạng từ, dạng so sánh hơn của trạng từ là 'harder', không dùng 'more hardly'.`},{text:`more hardly`,correct:!1,explanation:`'hardly' mang nghĩa là 'hầu như không', không phải so sánh hơn của chăm chỉ.`},{text:`hardest`,correct:!1,explanation:`Đây là dạng so sánh nhất.`},{text:`more hard`,correct:!1,explanation:`Trạng từ ngắn không dùng 'more'.`}]},{q:`City dwellers usually walk ___ than people living in quiet rural villages. 🏙️🚶‍♂️ (Nhanh hơn)`,a:[{text:`more quickly`,correct:!0,explanation:`Đúng rồi! Trạng từ dài kết thúc bằng đuôi -ly ('quickly') khi so sánh hơn dùng 'more quickly than'.`},{text:`quicker`,correct:!1,explanation:`Trong văn phong chuẩn ngữ pháp, trạng từ dùng 'more quickly'.`},{text:`quicklier`,correct:!1,explanation:`Không có từ 'quicklier' trong tiếng Anh.`},{text:`most ue`,correct:!0,explanation:`Đúng rồi! 'picturesque' nghĩa là đẹp như tranh vẽ, thơ mộng và cổ kính.`},{text:`polluted`,correct:!1,explanation:`'polluted' là ô nhiễm khói bụi bẩn.`},{text:`noisy`,correct:!1,explanation:`'noisy' là ồn ào inh ỏi.`},{text:`congested`,correct:!1,explanation:`'congested' là kẹt xe tắc nghẽn.`}]},{q:`Sắp xếp chữ cái thành từ chỉ người dân địa phương hiếu khách mến khách: 'o - t - s - b - a - i - h - e - l - p' 😊`,a:[{text:`hospitable`,correct:!0,explanation:`Xuất sắc! 'hospitable' nghĩa là hiếu khách, niềm nở đón tiếp khách lạ.`},{text:`hospitaelb`,correct:!1,explanation:`Sai vị trí chữ b và e cuối từ.`},{text:`hopsitable`,correct:!1,explanation:`Sai vị trí chữ o và s.`},{text:`hospitalbe`,correct:!1,explanation:`Sai trật tự chữ l và b.`}]},{q:`Viết lại câu so sánh trạng từ: 'An runs faster than Binh.' 🏃‍♂️🏃`,a:[{text:`Binh runs more slowly than An.`,correct:!0,explanation:`Chính xác! 'An chạy nhanh hơn Bình' viết lại thành 'Bình chạy chậm hơn An' ('runs more slowly than').`},{text:`Binh runs as fast as An.`,correct:!1,explanation:`So sánh bằng sai ý nghĩa gốc.`},{text:`An runs more slowly than Binh.`,correct:!1,explanation:`Ngược hoàn toàn về người chạy nhanh.`},{text:`Binh runs faster than An.`,correct:!1,explanation:`Sai sự thật câu đề bài.`}]},{q:`Tìm lỗi sai trong câu sau: 'She speaks English much more good than her elder brother.' 🗣️`,a:[{text:`more good -> better`,correct:!0,explanation:`Đúng rồi! Trạng từ của 'good' là 'well', dạng so sánh hơn bất quy tắc của 'well' là 'better', không có 'more good'.`},{text:`She speaks -> She speak`,correct:!1,explanation:`Chủ ngữ số ít 'She' thêm 's' vào động từ là đúng.`},{text:`than -> as`,correct:!1,explanation:`So sánh hơn bắt buộc dùng 'than'.`},{text:`elder brother -> brother elder`,correct:!1,explanation:`Tính từ đứng trước danh từ là chuẩn.`}]},{q:`Những chú chim bồ câu bay lượn tự do trên bầu trời trong vắt. Bầu trời 'bao la bát ngát' là tính từ: 🕊️☁️`,a:[{text:`vast`,correct:!0,explanation:`Chính xác! 'vast' nghĩa là bao la, rộng lớn mênh mông bát ngát.`},{text:`narrow`,correct:!1,explanation:`'narrow' là chật hẹp tù túng.`},{text:`tiny`,correct:!1,explanation:`'tiny' là bé xíu li ti.`},{text:`crowded`,correct:!1,explanation:`'crowded' là đông đúc chật ních.`}]},{q:`Con trâu mộng cần mẫn cày bừa giúp người nông dân trên ruộng nước tiếng Anh là gì? 🐃`,a:[{text:`water buffalo`,correct:!0,explanation:`Đúng rồi! Con trâu nước là 'water buffalo'.`},{text:`camel`,correct:!1,explanation:`'camel' là con lạc đà trên sa mạc cát.`},{text:`zebra`,correct:!1,explanation:`'zebra' là con ngựa vằn thảo nguyên.`},{text:`reindeer`,correct:!1,explanation:`'reindeer' là con tuần lộc kéo xe tuyết.`}]},{q:`Hành động dắt trâu bò ra đồng cỏ gặm cỏ và trông coi đàn gia súc gọi là: 🐄🌾`,a:[{text:`herd cattle`,correct:!0,explanation:`Tuyệt vời! Chăn dắt gia súc là cụm động từ 'herd cattle'.`},{text:`hunt cattle`,correct:!1,explanation:`'hunt' là săn bắn thú hoang.`},{text:`feed cattle`,correct:!1,explanation:`Cho ăn trong chuồng trại, chăn thả ngoài đồng dùng 'herd'.`},{text:`kill cattle`,correct:!1,explanation:`Giết mổ gia súc.`}]},{q:`Kênh rạch dẫn nước từ sông lớn vào tưới mát cho các thửa ruộng lúa gọi là: 🏞️`,a:[{text:`canal`,correct:!0,explanation:`Chính xác! Kênh đào dẫn nước thủy lợi là 'canal'.`},{text:`ocean`,correct:!1,explanation:`'ocean' là đại dương bao la.`},{text:`desert`,correct:!1,explanation:`'desert' là sa mạc khô hạn.`},{text:`waterfall`,correct:!1,explanation:`'waterfall' là thác nước đổ đứng.`}]},{q:`Thửa ruộng bậc thang uốn lượn tầng tầng lớp lớp trên sườn núi Tây Bắc gọi là: 🌾🏔️`,a:[{text:`terraced field`,correct:!0,explanation:`Đúng rồi! Ruộng bậc thang tuyệt đẹp là 'terraced field'.`},{text:`football field`,correct:!1,explanation:`Sân bóng đá cỏ nhân tạo.`},{text:`battle field`,correct:!1,explanation:`Chiến trường đánh trận.`},{text:`airport field`,correct:!1,explanation:`Đường băng sân bay.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'peacefully /  số dân số cả nước.`},{text:`Kinh`,correct:!1,explanation:`Dân tộc Kinh chiếm khoảng 85% dân số Việt Nam.`},{text:`Viet`,correct:!1,explanation:`Tên gọi khác của dân tộc Kinh.`},{text:`Majority`,correct:!1,explanation:`Từ mang nghĩa 'đa số'.`}]},{q:`Sắp xếp chữ cái thành từ chỉ trang phục dân tộc truyền thống: 's - m - c - e - u - o - t' 👘`,a:[{text:`costume`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'costume' (trang phục dân tộc).`},{text:`costuem`,correct:!1,explanation:`Sai vị trí chữ e và m cuối từ.`},{text:`custome`,correct:!1,explanation:`Sai chữ o thành u.`},{text:`costum`,correct:!1,explanation:`Thiếu chữ e cuối từ.`}]},{q:`Viết lại câu hỏi cho phần gạch chân: 'The Tay people mainly live in the northern mountainous regions.' 🏔️`,a:[{text:`Where do the Tay people mainly live?`,correct:!0,explanation:`Chính xác! Phần gạch chân chỉ nơi chốn địa lý 'in the northern mountainous regions' nên dùng từ để hỏi 'Where'.`},{text:`When do the Tay people live?`,correct:!1,explanation:`'When' hỏi về mốc thời gian.`},{text:`How do the Tay people live?`,correct:!1,explanation:`'How' hỏi về phương thức sinh sống.`},{text:`Why do the Tay people live?`,correct:!1,explanation:`'Why' hỏi về lý do tại sao.`}]},{q:`Tìm lỗi sai trong câu sau: 'There is only a few milk left in the refrigerator for the baby.' 🍼`,a:[{text:`a few -> a little`,correct:!0,explanation:`Đúng rồi! 'milk' (sữa) là danh từ không đếm được nên phải dùng 'a little milk', không dùng 'a few'.`},{text:`There is -> There are`,correct:!1,explanation:`Chủ ngữ là danh từ không đếm được 'milk' nên to be 'is' là đúng.`},{text:`in the refrigerator -> on the refrigerator`,correct:!1,explanation:`Bên trong tủ lạnh dùng 'in' là chuẩn.`},{text:`for the baby -> to the baby`,correct:!1,explanation:`Dành cho em bé dùng giới từ 'for' là chính xác.`}]},{q:`Không gian văn hóa Cồng Chiêng Tây Nguyên được UNESCO vinh danh là di sản gì? 🥁🌲`,a:[{text:`Masterpiece of Intangible Heritage`,correct:!0,explanation:`Chính xác! Không gian văn hóa Cồng chiêng Tây Nguyên là Kiệt tác di sản truyền khẩu và phi vật thể của nhân loại.`},{text:`World Natural Heritage`,correct:!1,explanation:`Di sản thiên nhiên thế giới (như Vịnh Hạ Long, Phong Nha).`},{text:`Architectural Monument`,correct:!1,explanation:`Di tích kiến trúc xây dựng.`},{text:`Scientific Discovery`,correct:!1,explanation:`Phát minh khám phá khoa học.`}]},{q:`Kiểu nhà sàn gỗ dựng cao để tránh thú dữ và nước lũ của đồng bào miền núi là: 🏡🪵`,a:[{text:`stilt house`,correct:!0,explanation:`Đúng rồi! Nhà sàn bằng gỗ tre nứa là 'stilt house'.`},{text:`mud hut`,correct:!1,explanation:`Túp lều đắp bằng đất bùn rơm rạ.`},{text:`igloo`,correct:!1,explanation:`Ngôi nhà tuyết hình vòm của người Eskimo.`},{text:`tent`,correct:!1,explanation:`Chiếc lều vải bạt dã ngoại.`}]},{q:`Điệu múa sạp gõ tre rộn ràng tiếng cười trong đêm hội trăng rằm Tây Bắc gọi là: 🎋👯‍♀️`,a:[{text:`Bamboo pole dance`,correct:!0,explanation:`Tuyệt vời! Múa sạp với các thanh tre gõ nhịp là 'bamboo pole dance' (múa sạp).`},{text:`Samba dance`,correct:!1,explanation:`Vũ điệu Samba bốc lửa của Brazil.`},{text:`Ballet dance`,correct:!1,explanation:`Múa ba-lê cổ điển châu Âu.`},{text:`Hip hop dance`,correct:!1,explanation:`Nhảy hip-hop đường phố.`}]},{q:`The Cham ethnic people in central Vietnam are famous for their ancient brick ___ towers. 🏛️🧱`,a:[{text:`Cham`,correct:!0,explanation:`Chính xác! Tháp Chàm (Cham towers) xây bằng gạch nung đỏ rực kỳ bí không lộ mạch vữa.`},{text:`glass`,correct:!1,explanation:`Kính hiện đại.`},{text:`wooden`,correct:!1,explanation:`Gỗ mộc.`},{text:`iron`,correct:!1,explanation:`Sắt thép công nghiệp.`}]},{q:`Many ethnic minority groups still preserve their unique customs, folk songs, and native ___. 🗣️`,a:[{text:`dialects`,correct:!0,explanation:`Đúng rồi! Tiếng thổ ngữ bản địa của từng dân tộc là 'native dialects' (hoặc 'languages').`},{text:`laptops`,correct:!1,explanation:`Máy tính xách tay.`},{text:`cellphones`,correct:!1,explanation:`Điện thoại di động thông minh.`},{text:`televisions`,correct:!1,explanation:`Tivi màu màn hình phẳng.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'cultural / Vietnam / diverse / has / heritage / a / rich / .' 🇻🇳✨`,a:[{text:`Vietnam has a rich diverse cultural heritage.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (Vietnam) + has + cụm danh từ (a rich diverse cultural heritage - nền di sản văn hóa phong phú và đa dạng).`},{text:`Vietnam has a cultural rich diverse heritage.`,correct:!1,explanation:`Trật tự tính từ bổ nghĩa cho heritage chưa chuẩn.`},{text:`A rich diverse cultural heritage Vietnam has.`,correct:!1,explanation:`Sai trật tự câu khẳng định.`},{text:`Vietnam a rich diverse cultural heritage has.`,correct:!1,explanation:`Vị ngữ 'has' bị đẩy xuống cuối câu là sai.`}]},{q:`Why is it essential to preserve the cultural traditions of 54 ethnic groups in Vietnam? 🤝❤️`,a:[{text:`Because they enrich national identity and strengthen patriotic unity.`,correct:!0,explanation:`Chính xác! Vì di sản của các dân tộc làm giàu thêm bản sắc văn hóa dân tộc và thắt chặt khối đại đoàn kết toàn dân tộc.`},{text:`To force all ethnic minorities to abandon their languages.`,correct:!1,explanation:`Bắt bỏ tiếng mẹ đẻ là sai trái hoàn toàn.`},{text:`To replace all folk arts with foreign pop culture.`,correct:!1,explanation:`Thay thế văn hóa dân gian bằng văn hóa ngoại lai là sai.`},{text:`To separate people into isolated communities.`,correct:!1,explanation:`Chia rẽ dân tộc là hành vi sai trái.`}]},{q:`Theo phong tục truyền thống tốt đẹp của người Việt, việc thắp nén nhang thơm tưởng nhớ tổ tiên gọi là: 🕯️🌾`,a:[{text:`ancestor worship`,correct:!0,explanation:`Chính xác! Tục thờ cúng tổ tiên trong văn hóa Việt là 'ancestor worship'.`},{text:`idol worship`,correct:!1,explanation:`'idol worship' là tôn sùng thần tượng giải trí.`},{text:`nature worship`,correct:!1,explanation:`'nature worship' là tín ngưỡng sùng bái tự nhiên.`},{text:`hero worship`,correct:!1,explanation:`'hero worship' là tôn sùng anh hùng dân tộc.`}]},{q:`Bữa cơm ấm cúng sum họp đông đủ mọi thế hệ trong gia đình vào ngày cuối năm gọi là: 🍲👨‍👩‍👧‍👦`,a:[{text:`family reunion dinner`,correct:!0,explanation:`Đúng rồi! Bữa cơm tất niên sum họp gia đình là 'family reunion dinner'.`},{text:`birthday party`,correct:!1,explanation:`'birthday party' là tiệc mừng sinh nhật.`},{text:`business lunch`,correct:!1,explanation:`'business lunch' là bữa trưa bàn công việc làm ăn.`},{text:`farewell party`,correct:!1,explanation:`'farewell party' là tiệc chia tay.`}]},{q:`Truyền thống 'Kính trên nhường dưới', lễ phép và nhường nhịn người lớn tuổi trong xã hội là: 👵🤝`,a:[{text:`respect for the elderly`,correct:!0,explanation:`Chính xác! Lòng tôn kính và lễ phép với người cao tuổi là 'respect for the elderly'.`},{text:`peer pressure`,correct:!1,explanation:`'peer pressure' là áp lực từ bạn bè cùng trang lứa.`},{text:`disobedience`,correct:!1,explanation:`'disobedience' là sự bất phục tùng, không nghe lời.`},{text:`negligence`,correct:!1,explanation:`'negligence' là sự thờ ơ xao nhãng.`}]},{q:`In Vietnam, it is ___ custom to take off your footwear before entering someone's living room. 👞🚫`,a:[{text:`a`,correct:!0,explanation:`Đúng rồi! Cấu trúc 'It is a custom to V' (Đó là một phong tục...). 'custom' đếm được bắt đầu bằng phụ âm nên dùng 'a'.`},{text:`an`,correct:!1,explanation:`'custom' bắt đầu bằng phụ âm /k/, không dùng 'an'.`},{text:`the`,correct:!1,explanation:`Ở đây nói về một phong tục nói chung lần đầu nhắc đến.`},{text:`zero article (no article)`,correct:!1,explanation:`Danh từ đếm được số ít 'custom' phải có mạo từ 'a'.`}]},{q:`We should always show deep respect to ___ elderly by offering our seats on public buses. 🚌👴`,a:[{text:`the`,correct:!0,explanation:`Chính xác! Cấu trúc 'the + tính từ' chỉ một tập hợp nhóm người trong xã hội ('the elderly' = những người cao tuổi).`},{text:`a`,correct:!1,explanation:`'the elderly' chỉ tập thể người già, không dùng 'a'.`},{text:`an`,correct:!1,explanation:`Không dùng 'an elderly' khi chỉ tập thể người cao tuổi.`},{text:`zero article (no article)`,correct:!1,explanation:`Bắt buộc có 'the' để tạo danh từ tập thể.`}]},{q:`Vietnamese families traditionally gather to have ___ dinner together every evening at 7 PM. 🍽️`,a:[{text:`zero article (no article)`,correct:!0,explanation:`Đúng rồi! Trước tên các bữa ăn thông thường (breakfast, lunch, dinner) không dùng mạo từ.`},{text:`a`,correct:!1,explanation:`Bữa ăn thông thường không dùng mạo từ 'a'.`},{text:`an`,correct:!1,explanation:`Từ 'dinner' bắt đầu bằng phụ âm.`},{text:`the`,correct:!1,explanation:`Chỉ dùng 'the dinner' khi có mệnh đề xác định cụ thể bữa tối nào.`}]},{q:`Breaking a glass mirror on the first day of the lunar new year is believed to bring ___ bad luck. 🪞❌`,a:[{text:`zero article (no article)`,correct:!0,explanation:`Chính xác! 'luck' là danh từ không đếm được nên không dùng mạo từ 'a/an'.`},{text:`a`,correct:!1,explanation:`'luck' không đếm được nên không đi với 'a'.`},{text:`an`,correct:!1,explanation:`Không dùng 'an' trước phụ âm 'b'.`},{text:`the`,correct:!1,explanation:`Nói về sự xui xẻo nói chung, không dùng mạo từ 'the'.`}]},{q:`Unlike Westerners who use knives and forks, Vietnamese people eat everyday meals with ___. 🥢🍚`,a:[{text:`chopsticks`,correct:!0,explanation:`Đúng rồi! Người Việt và các nước Á Đông dùng đũa 'chopsticks' để gắp thức ăn trong bữa cơm.`},{text:`forks`,correct:!1,explanation:`'forks' là nĩa xiên.`},{text:`knives`,correct:!1,explanation:`'knives' là dao cắt thịt.`},{text:`skewers`,correct:!1,explanation:`'skewers' là que xiên nướng.`}]},{q:`Lễ hội đền Hùng diễn ra hàng năm để tưởng nhớ công ơn khai thiên lập quốc của các vị vua Hùng tại tỉnh nào? 🏛️🚩`,a:[{text:`Phu Tho province`,correct:!0,explanation:`Chính xác! Giỗ Tổ Hùng Vương và Lễ hội Đền Hùng được tổ chức trang nghiêm tại núi Nghĩa Lĩnh, tỉnh Phú Thọ.`},{text:`Ninh Binh province`,correct:!1,explanation:`Ninh Bình có Cố đô Hoa Lư.`},{text:`Quang Ninh province`,correct:!1,explanation:`Quảng Ninh có Vịnh Hạ Long và Yên Tử.`},{text:`Thua Thien Hue province`,correct:!1,explanation:`Thừa Thiên Huế có Cố đô Huế.`}]},{q:`Odd one out: Chọn từ có phần phát âm cụm phụ âm là /spr/ (khác với nhóm /str/): street, string, spring, straight 🔊`,a:[{text:`spring`,correct:!0,explanation:`Chính xác! 'spring' bắt đầu bằng cụm phụ âm /spr/, trong khi street, string, straight đều bắt đầu bằng /str/.`},{text:`street`,correct:!1,explanation:`Bắt đầu bằng cụm /str/.`},{text:`string`,correct:!1,explanation:`Bắt đầu bằng cụm /str/.`},{text:`straight`,correct:!1,explanation:`Bắt đầu bằng cụm /str/.`}]},{q:`Odd one out: Từ nào chỉ PHONG TỤC / TẬP QUÁN VĂN HÓA, không phải đồ dùng bàn ăn? 🥢`,a:[{text:`tradition`,correct:!0,explanation:`Đúng rồi! 'tradition' (truyền thống/tập tục) là khái niệm văn hóa, còn spoon, chopsticks, bowl là đồ dùng ăn uống.`},{text:`spoon`,correct:!1,explanation:`'spoon' là cái thìa/muỗng múc canh.`},{text:`chopsticks`,correct:!1,explanation:`'chopsticks' là đôi đũa gắp cơm.`},{text:`bowl`,correct:!1,explanation:`'bowl' là cái bát/chén đựng cơm.`}]},{q:`Sắp xếp chữ cái thành từ chỉ phong tục tập quán: 's - t - m - u - o - c' 📜`,a:[{text:`custom`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'custom' (phong tục tập quán).`},{text:`custome`,correct:!1,explanation:`Thừa chữ e cuối từ (thành costume - trang phục).`},{text:`custum`,correct:!1,explanation:`Sai chữ o thành u.`},{text:`costum`,correct:!1,explanation:`Sai chữ u đầu thành o.`}]},{q:`Viết lại câu dùng cấu trúc danh từ 'custom of': 'Vietnamese people traditionally visit pagodas at Tet.' ⛩️🌸`,a:[{text:`There is a traditional custom of visiting pagodas at Tet in Vietnam.`,correct:!0,explanation:`Chính xác! Cấu trúc: 'There is a custom of + V-ing' (Có một phong tục làm gì...).`},{text:`Visiting pagodas at Tet is not a Vietnamese custom.`,correct:!1,explanation:`Ngược hoàn toàn nghĩa gốc.`},{text:`Vietnamese customs prevent people from visiting pagodas.`,correct:!1,explanation:`Sai lệch ý nghĩa hoàn toàn.`},{text:`There has a custom to visit pagodas at Tet.`,correct:!1,explanation:`Sai ngữ pháp 'There has'.`}]},{q:`Tìm lỗi sai trong câu sau: 'It is a tradition to give a children lucky money in red envelopes on Tet.' 🧧`,a:[{text:`a children -> children`,correct:!0,explanation:`Đúng rồi! 'children' là danh từ số nhiều bất quy tắc của 'child', không được dùng mạo từ số ít 'a'.`},{text:`a tradition -> tradition`,correct:!1,explanation:`Dùng 'a tradition' là hoàn toàn đúng ngữ pháp.`},{text:`lucky money -> luckily money`,correct:!1,explanation:`'lucky' là tính từ bổ nghĩa cho 'money' là chuẩn.`},{text:`red envelopes -> envelopes red`,correct:!1,explanation:`Tính từ đứng trước danh từ là chuẩn.`}]},{q:`Hành động cắm thẳng đứng đôi đũa vào giữa bát cơm đầy bị coi là điều cấm kỵ trong bữa ăn gia đình vì: 🍚❌`,a:[{text:`It resembles incense burning in a bowl at funerals for deceased spirits.`,correct:!0,explanation:`Chính xác! Cắm đũa thẳng đứng giống như cắm hương bát nhang tang lễ, mang điềm rủi ro bất kính.`},{text:`It breaks the wooden bowl immediately.`,correct:!1,explanation:`Đũa gỗ không làm vỡ bát cơm.`},{text:`It makes the cooked rice turn sour.`,correct:!1,explanation:`Đũa không làm thiu cơm.`},{text:`It is considered a polite greeting to hosts.`,correct:!1,explanation:`Đây là điều bất lịch sự kiêng kỵ.`}]},{q:`Hành động trao phong bao lì xì đỏ thắm cho trẻ nhỏ và người già đầu năm mang ý nghĩa thiêng liêng gì? 🧧✨`,a:[{text:`Wishing good health, scholarly success, and all-year prosperity.`,correct:!0,explanation:`Tuyệt vời! Lì xì đầu xuân mang ý nghĩa chúc sức khỏe, học hành tấn tới, may mắn và tài lộc cả năm.`},{text:`Showing off personal wealth and expensive clothes.`,correct:!1,explanation:`Khoe khoang của cải là sai ý nghĩa tốt đẹp.`},{text:`Paying wages for holiday housework.`,correct:!1,explanation:`Không phải trả tiền công lao động.`},{text:`Borrowing money from family members.`,correct:!1,explanation:`Không phải hành động vay mượn tiền nong.`}]},{q:`The national Hung Kings Commemoration takes place on ___ tenth day of the third lunar month. 📅🚩`,a:[{text:`the`,correct:!0,explanation:`Chính xác! Trước số thứ tự (tenth day - ngày mùng mười) bắt buộc phải có mạo từ xác định 'the'.`},{text:`a`,correct:!1,explanation:`Số thứ tự không dùng mạo từ 'a'.`},{text:`an`,correct:!1,explanation:`'tenth' bắt đầu bằng phụ âm /t/.`},{text:`zero article (no article)`,correct:!1,explanation:`Trước ngày tháng thứ tự bắt buộc có 'the'.`}]},{q:`Preserving architectural monuments and folk songs helps protect our priceless national ___. 🏛️🛡️`,a:[{text:`heritage`,correct:!0,explanation:`Đúng rồi! Di sản văn hóa quốc gia vô giá là 'national heritage'.`},{text:`garbage`,correct:!1,explanation:`'garbage' là rác thải sinh hoạt.`},{text:`pollution`,correct:!1,explanation:`'pollution' là sự ô nhiễm độc hại.`},{text:`disaster`,correct:!1,explanation:`'disaster' là thảm họa thiên tai.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'ancestors / Vietnamese / at / worship / families / home / their / .' 🏠🕯️`,a:[{text:`Vietnamese families worship their ancestors at home.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (Vietnamese families) + V (worship) + O (their ancestors) + Place (at home).`},{text:`Vietnamese families at home worship ancestors their.`,correct:!1,explanation:`Sai trật tự cụm tân ngữ 'their ancestors'.`},{text:`Ancestors worship their Vietnamese families at home.`,correct:!1,explanation:`Ngược hoàn toàn chủ ngữ vị ngữ.`},{text:`At home Vietnamese families their ancestors worship.`,correct:!1,explanation:`Động từ 'worship' bị đẩy sai vị trí.`}]},{q:`Why is it valuable for modern youths to uphold traditional cultural practices and moral values? 🌟🌱`,a:[{text:`To honor ancestral roots and build a distinctive national identity in globalization.`,correct:!0,explanation:`Chính xác! Gìn giữ phong tục truyền thống giúp thế hệ trẻ ghi nhớ cội nguồn và khẳng định bản sắc văn hóa dân tộc.`},{text:`To isolate the nation from modern science and global economy.`,correct:!1,explanation:`Không phải để cô lập đất nước.`},{text:`To oppose all scientific and technological developments.`,correct:!1,explanation:`Không hề bài xích khoa học kỹ thuật.`},{text:`To avoid making international foreign friendships.`,correct:!1,explanation:`Không phải để khép kín giao lưu quốc tế.`}]},{q:`Lối sống tự do nay đây mai đó, di chuyển theo đồng cỏ xanh chăn thả bầy gia súc của người thảo nguyên gọi là: 🐎🏕️`,a:[{text:`nomadic lifestyle`,correct:!0,explanation:`Chính xác! Lối sống du mục di cư theo đàn gia súc là 'nomadic lifestyle'.`},{text:`urban lifestyle`,correct:!1,explanation:`'urban lifestyle' là lối sống thành thị hoa lệ.`},{text:`sedentary lifestyle`,correct:!1,explanation:`'sedentary lifestyle' là lối sống ngồi thụ động một chỗ.`},{text:`coastal lifestyle`,correct:!1,explanation:`'coastal lifestyle' là lối sống vùng duyên hải ven biển.`}]},{q:`Nhịp sống hối hả, tấp nập và bận rộn với guồng quay công việc ở các siêu đô thị lớn được gọi là: 🏙️⚡`,a:[{text:`fast-paced lifestyle`,correct:!0,explanation:`Đúng rồi! Nhịp sống hối hả gấp gáp là 'fast-paced lifestyle'.`},{text:`slow-motion lifestyle`,correct:!1,explanation:`Lối sống quay chậm.`},{text:`boring lifestyle`,correct:!1,explanation:`Lối sống buồn tẻ tẻ nhạt.`},{text:`peaceful lifestyle`,correct:!1,explanation:`Lối sống êm đềm bình yên nơi đồng quê.`}]},{q:`Thói quen ăn quá nhiều thức ăn nhanh, lười vận động thể chất và thức khuya gọi là: 🍔🛋️`,a:[{text:`unhealthy lifestyle`,correct:!0,explanation:`Chính xác! Lối sống không lành mạnh gây hại cho cơ thể là 'unhealthy lifestyle'.`},{text:`balanced lifestyle`,correct:!1,explanation:`'balanced lifestyle' là lối sống cân bằng hài hòa.`},{text:`athletic lifestyle`,correct:!1,explanation:`'athletic lifestyle' là lối sống năng động yêu thể thao.`},{text:`green lifestyle`,correct:!1,explanation:`'green lifestyle' là lối sống xanh thân thiện môi trường.`}]},{q:`If we regularly consume balanced meals and take daily brisk walks, our bodies ___ stay vibrant and strong. 🏃‍♂️🥦`,a:[{text:`will`,correct:!0,explanation:`Đúng rồi! Câu điều kiện loại 1 diễn tả sự việc có thể xảy ra ở hiện tại/tương lai: If + S + V(hiện tại đơn), S + will + V-inf.`},{text:`would`,correct:!1,explanation:`'would' dùng trong điều kiện loại 2.`},{text:`must have`,correct:!1,explanation:`Dùng để phỏng đoán quá khứ, sai ngữ pháp.`},{text:`had`,correct:!1,explanation:`Quá khứ hoàn thành không dùng ở mệnh đề chính loại 1.`}]},{q:`What will you do if your internet connection ___ during the online English speaking contest? 💻📶`,a:[{text:`fails`,correct:!0,explanation:`Chính xác! Trong mệnh đề phụ điều kiện 'if' của câu điều kiện loại 1, động từ chia ở hiện tại đơn (chủ ngữ 'connection' số ít thêm s/es: 'fails').`},{text:`will fail`,correct:!1,explanation:`Không dùng 'will' trong mệnh đề 'if' của câu điều kiện loại 1.`},{text:`failed`,correct:!1,explanation:`Quá khứ đơn dùng cho câu điều kiện loại 2.`},{text:`had failed`,correct:!1,explanation:`Quá khứ hoàn thành dùng cho câu điều kiện loại 3.`}]},{q:`If teenagers spend over six hours staring at smartphone screens each night, they ___ experience severe eye strain. 📱👀`,a:[{text:`will`,correct:!0,explanation:`Đúng rồi! Cấu trúc câu điều kiện loại 1: If + present simple, S + will + V nguyên mẫu.`},{text:`did`,correct:!1,explanation:`Sai cấu trúc câu điều kiện loại 1.`},{text:`would`,correct:!1,explanation:`'would' dùng trong câu điều kiện loại 2 trái thực tế.`},{text:`won't`,correct:!1,explanation:`Nghịch lý về nghĩa; thức khuya dùng điện thoại thì sẽ bị mỏi mắt.`}]},{q:`If you ___ up early at 5:30 AM every morning, you will have ample quiet time for meditation and exercise. 🌅🧘`,a:[{text:`wake`,correct:!0,explanation:`Chính xác! Trong mệnh đề If của câu điều kiện loại 1, chủ ngữ 'you' đi với động từ nguyên mẫu 'wake'.`},{text:`will wake`,correct:!1,explanation:`Tuyệt đối không dùng 'will' trong mệnh đề If loại 1.`},{text:`woke`,correct:!1,explanation:`Quá khứ đơn thuộc điều kiện loại 2.`},{text:`waking`,correct:!1,explanation:`Dạng V-ing không làm vị ngữ chính.`}]},{q:`You won't improve your English pronunciation unless you ___ listening and repeating every single day. 🗣️🎧`,a:[{text:`practice`,correct:!0,explanation:`Đúng rồi! Cấu trúc 'unless = if ... not'. Trong mệnh đề unless chia hiện tại đơn: 'unless you practice'.`},{text:`will practice`,correct:!1,explanation:`Không dùng 'will' trong mệnh đề unless.`},{text:`practiced`,correct:!1,explanation:`Quá khứ sai ngữ cảnh câu loại 1.`},{text:`won't practice`,correct:!1,explanation:`'unless' đã mang nghĩa phủ định, không dùng thêm 'won't'.`}]},{q:`Những chiếc lều hình tròn bằng nỉ và khung gỗ có thể tháo lắp di động của người du mục Mông Cổ gọi là: ⛺🇲🇳`,a:[{text:`gers (yurts)`,correct:!0,explanation:`Chính xác! Căn lều tròn di động của người du mục vùng Trung Á/Mông Cổ gọi là 'ger' hoặc 'yurt'.`},{text:`skyscrapers`,correct:!1,explanation:`'skyscrapers' là những tòa nhà chọc trời cao tầng.`},{text:`castles`,correct:!1,explanation:`'castles' là các lâu đài nguy nga bằng đá.`},{text:`villas`,correct:!1,explanation:`'villas' là những căn biệt thự sang trọng.`}]},{q:`Odd one out: Chọn từ có phần phát âm cụm phụ âm là /br/ (khác với nhóm /pr/): promise, bright, prepare, practice 🔊`,a:[{text:`bright`,correct:!0,explanation:`Chính xác! 'bright' phát âm phụ âm đầu là /br/, trong khi promise, prepare, practice đều bắt đầu bằng /pr/.`},{text:`promise`,correct:!1,explanation:`Bắt đầu bằng cụm phụ âm /pr/.`},{text:`prepare`,correct:!1,explanation:`Bắt đầu bằng cụm phụ âm /pr/.`},{text:`practice`,correct:!1,explanation:`Bắt đầu bằng cụm phụ âm /pr/.`}]},{q:`Odd one out: Hoạt động nào thuộc về LỐI SỐNG LÀNH MẠNH CÓ LỢI CHO SỨC KHỎE THỂ CHẤT? 🥗🏃‍♀️`,a:[{text:`jogging in the park`,correct:!0,explanation:`Đúng rồi! 'jogging in the park' (chạy bộ trong công viên) là thói quen lành mạnh, còn thức khuya, ăn đồ dầu mỡ, lười vận động là thói quen xấu.`},{text:`staying up until 2 AM`,correct:!1,explanation:`Thức khuya phá hủy sức khỏe.`},{text:`eating deep-fried junk food`,correct:!1,explanation:`Ăn nhiều đồ chiên rán gây béo phì tim mạch.`},{text:`sitting motionless all day`,correct:!1,explanation:`Lối sống ngồi lì một chỗ gây thoái hóa.`}]},{q:`Sắp xếp chữ cái thành từ chỉ phong cách lối sống: 'e - l - y - s - f - i - l - e - t' 🌿🏃`,a:[{text:`lifestyle`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'lifestyle' (lối sống / phong cách sống).`},{text:`lifestyel`,correct:!1,explanation:`Sai vị trí l và e cuối từ.`},{text:`lifstyle`,correct:!1,explanation:`Thiếu chữ e ở giữa.`},{text:`livestyle`,correct:!1,explanation:`Sai chữ f thành v.`}]},{q:`Viết lại câu dùng câu điều kiện loại 1: 'Eat nutritious balanced food or you will suffer from nutritional deficiency.' 🍎`,a:[{text:`If you do not eat nutritious balanced food, you will suffer from nutritional deficiency.`,correct:!0,explanation:`Chính xác! Cấu trúc mệnh lệnh 'V or you will...' viết lại thành: 'If you do not V, you will...'.`},{text:`If you eat nutritious food, you will suffer from disease.`,correct:!1,explanation:`Sai ngược hoàn toàn ý nghĩa gốc.`},{text:`Unless you do not eat nutritious food, you will be healthy.`,correct:!1,explanation:`Dùng sai 'unless you do not' (phủ định kép).`},{text:`If you will eat nutritious food, you get sick.`,correct:!1,explanation:`Mệnh đề if loại 1 cấm dùng 'will'.`}]},{q:`Tìm lỗi sai trong câu sau: 'If it will be sunny and warm this weekend, we will cycle around the lake.' 🚴☀️`,a:[{text:`will be -> is`,correct:!0,explanation:`Đúng rồi! Trong mệnh đề 'If' của câu điều kiện loại 1, tuyệt đối không dùng trợ động từ 'will', phải chia hiện tại đơn 'is'.`},{text:`sunny and warm -> sun and warmth`,correct:!1,explanation:`Dùng cặp tính từ sau to be 'is' là đúng.`},{text:`this weekend -> at this weekend`,correct:!1,explanation:`'this weekend' làm trạng từ thời gian không cần giới từ.`},{text:`cycle -> cycled`,correct:!1,explanation:`Sau 'will' dùng động từ nguyên mẫu là chính xác.`}]},{q:`Hiện tượng dành quá nhiều giờ trong ngày dán mắt vào các thiết bị công nghệ điện tử được gọi là: 📱💻`,a:[{text:`excessive screen time`,correct:!0,explanation:`Chính xác! 'excessive screen time' là thời lượng sử dụng màn hình thiết bị quá mức cho phép.`},{text:`outdoor adventure`,correct:!1,explanation:`'outdoor adventure' là chuyến thám hiểm ngoài trời.`},{text:`physical fitness`,correct:!1,explanation:`'physical fitness' là thể lực dẻo dai cường tráng.`},{text:`book reading time`,correct:!1,explanation:`'book reading time' là thời gian đọc sách giấy bổ ích.`}]},{q:`Mô hình học tập hiện đại kết hợp linh hoạt giữa lớp học truyền thống và bài giảng trực tuyến là: 🏫💻`,a:[{text:`blended learning`,correct:!0,explanation:`Tuyệt vời! Phương pháp học tập kết hợp giữa trực tiếp và trực tuyến gọi là 'blended learning'.`},{text:`blind learning`,correct:!1,explanation:`Học mù quáng (từ vô nghĩa).`},{text:`sleep learning`,correct:!1,explanation:`Học trong giấc ngủ.`},{text:`casual learning`,correct:!1,explanation:`Học tùy hứng không có kế hoạch.`}]},{q:`Nomadic children on the vast grasslands learn how to ride spirited horses and herd cattle from an early ___. 🐎🎯`,a:[{text:`age`,correct:!0,explanation:`Chính xác! Cụm từ 'from an early age' có nghĩa là từ khi còn thơ ấu, từ nhỏ.`},{text:`year`,correct:!1,explanation:`Không dùng 'from an early year' trong thành ngữ này.`},{text:`time`,correct:!1,explanation:`Không dùng 'from an early time'.`},{text:`century`,correct:!1,explanation:`'century' là thế kỷ.`}]},{q:`Following a sustainable zero-waste lifestyle means striving to ___ as little domestic trash as possible. ♻️🗑️`,a:[{text:`produce`,correct:!0,explanation:`Đúng rồi! 'produce trash' có nghĩa là xả rác, tạo ra rác thải.`},{text:`recycle`,correct:!1,explanation:`Mục tiêu là giảm rác thải ra môi trường, không phải 'tạo ra ít tái chế'.`},{text:`invent`,correct:!1,explanation:`'invent' là phát minh sáng chế máy móc.`},{text:`celebrate`,correct:!1,explanation:`'celebrate' là tổ chức ăn mừng lễ hội.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'will / healthier / you / daily / If / exercise / you / become / .' 🏃‍♂️💪`,a:[{text:`If you exercise daily, you will become healthier.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: If + S + V(hiện tại đơn) + daily, S + will + become + adj (healthier).`},{text:`If you will exercise daily, you become healthier.`,correct:!1,explanation:`Mệnh đề if không dùng 'will'.`},{text:`Daily if you exercise, healthier will become you.`,correct:!1,explanation:`Sai trật tự đảo ngữ.`},{text:`If exercise you daily, you will healthier become.`,correct:!1,explanation:`Sai trật tự chủ ngữ vị ngữ.`}]},{q:`Why is it crucial for students to maintain a harmonious balance between schoolwork and physical recreation? ⚖️🧠`,a:[{text:`To foster sharp academic intellect while nurturing enduring physical and emotional well-being.`,correct:!0,explanation:`Chính xác! Giữ cân bằng giữa việc học tập và vận động giải trí giúp phát triển trí tuệ lẫn sức khỏe thể chất và tinh thần bền vững.`},{text:`To waste extra leisure time sleeping endlessly.`,correct:!1,explanation:`Không phải để ngủ nướng lãng phí thời gian.`},{text:`To skip all important examinations.`,correct:!1,explanation:`Không phải để bỏ thi cử.`},{text:`To avoid interacting with teachers and classmates.`,correct:!1,explanation:`Không phải để trốn tránh thầy cô bạn bè.`}]},{q:`Hành động chặt phá rừng đầu nguồn quy mô lớn bừa bãi làm hủy hoại nơi cư trú của động vật hoang dã gọi là: 🪓🌲`,a:[{text:`deforestation`,correct:!0,explanation:`Chính xác! Nạn phá rừng trên diện rộng là 'deforestation'.`},{text:`afforestation`,correct:!1,explanation:`'afforestation' là việc trồng rừng mới trên đất trống.`},{text:`reforestation`,correct:!1,explanation:`'reforestation' là việc trồng lại rừng đã bị chặt phá.`},{text:`agriculture`,correct:!1,explanation:`'agriculture' là ngành nông nghiệp trồng trọt chăn nuôi.`}]},{q:`Các loài động thực vật quý hiếm đứng trước hiểm họa biến mất vĩnh viễn khỏi Trái Đất được gọi là: 🐼🚨`,a:[{text:`endangered species`,correct:!0,explanation:`Đúng rồi! Các loài có nguy cơ tuyệt chủng ghi trong Sách Đỏ là 'endangered species'.`},{text:`common species`,correct:!1,explanation:`'common species' là các loài sinh vật phổ biến thông thường.`},{text:`dangerous species`,correct:!1,explanation:`'dangerous species' là các loài thú dữ nguy hiểm.`},{text:`domestic pets`,correct:!1,explanation:`'domestic pets' là vật nuôi thú cưng trong nhà.`}]},{q:`Tổng lượng khí thải nhà kính (chủ yếu là khí CO2) do hoạt động sống của một người thải ra môi trường là: 👣🏭`,a:[{text:`carbon footprint`,correct:!0,explanation:`Chính xác! Dấu chân carbon đo lường mức độ tác động môi trường là 'carbon footprint'.`},{text:`water footprint`,correct:!1,explanation:`'water footprint' là dấu chân nước đo mức tiêu thụ nước.`},{text:`fingerprint`,correct:!1,explanation:`'fingerprint' là dấu vân tay sinh trắc học.`},{text:`footstep`,correct:!1,explanation:`'footstep' là tiếng bước chân đi.`}]},{q:`We must strictly ban single-use plastic straws and bags ___ they take centuries to degrade naturally. 🐢🛍️`,a:[{text:`because`,correct:!0,explanation:`Đúng rồi! Liên từ chỉ lý do/nguyên nhân là 'because / since / as' (bởi vì chúng mất hàng thế kỷ để phân hủy).`},{text:`although`,correct:!1,explanation:`'although' mang nghĩa tương phản (mặc dù).`},{text:`so that`,correct:!1,explanation:`'so that' chỉ mục đích (để mà).`},{text:`unless`,correct:!1,explanation:`'unless' mang nghĩa trừ phi/nếu không.`}]},{q:`___ urban air pollution has escalated rapidly, more city inhabitants suffer from chronic asthma. 🏙️😷`,a:[{text:`Since`,correct:!0,explanation:`Chính xác! 'Since / As' đứng đầu câu mang nghĩa nguyên nhân: Bởi vì / Do tình trạng ô nhiễm không khí gia tăng...`},{text:`However`,correct:!1,explanation:`'However' là trạng từ liên kết mang nghĩa tương phản, sau có dấu phẩy.`},{text:`Unless`,correct:!1,explanation:`'Unless' mang nghĩa điều kiện phủ định.`},{text:`Though`,correct:!1,explanation:`'Though' mang nghĩa nhượng bộ (mặc dù).`}]},{q:`Numerous endangered sea turtles perish every year ___ they ingest floating plastic debris mistaking it for jellyfish. 🌊🐢`,a:[{text:`because`,correct:!0,explanation:`Đúng rồi! 'because + mệnh đề' chỉ nguyên nhân trực tiếp dẫn tới cái chết thương tâm của rùa biển.`},{text:`so`,correct:!1,explanation:`'so' chỉ kết quả, không đứng trước mệnh đề nguyên nhân.`},{text:`despite`,correct:!1,explanation:`'despite' đi với cụm danh từ/V-ing, không đi với mệnh đề S-V.`},{text:`in spite of`,correct:!1,explanation:`'in spite of' đi với danh từ/V-ing.`}]},{q:`Raging wildfires ravaged the northern woodland, ___ hundreds of native creatures lost their sheltered natural habitat. 🌲🔥`,a:[{text:`so`,correct:!0,explanation:`Chính xác! Liên từ 'so' chỉ kết quả: Đám cháy dữ dội đã tàn phá khu rừng, vì vậy hàng trăm loài sinh vật bị mất nơi ở.`},{text:`because`,correct:!1,explanation:`'because' chỉ nguyên nhân, không dùng chỉ kết quả ở vế sau dấu phẩy.`},{text:`since`,correct:!1,explanation:`'since' mang nghĩa bởi vì.`},{text:`although`,correct:!1,explanation:`'although' mang nghĩa nhượng bộ.`}]},{q:`We ought to switch off all classroom air conditioners when leaving ___ conserve precious electric energy. 💡❄️`,a:[{text:`in order to`,correct:!0,explanation:`Đúng rồi! Cụm chỉ mục đích: 'in order to + V nguyên mẫu' (để tiết kiệm điện năng).`},{text:`because`,correct:!1,explanation:`'because' phải đi với một mệnh đề có chủ ngữ và vị ngữ.`},{text:`so that`,correct:!1,explanation:`'so that' phải đi với một mệnh đề (so that we can...).`},{text:`in case`,correct:!1,explanation:`'in case' mang nghĩa phòng khi/lỡ như.`}]},{q:`Loài thú có móng guốc quý hiếm được mệnh danh là 'Kỳ lân châu Á' vô cùng nguy cấp phát hiện ở dãy Trường Sơn Việt Nam là: 🦌🏔️`,a:[{text:`Sao la`,correct:!0,explanation:`Chính xác! Sao la (Pseudoryx nghetinhensis) là loài thú cực kỳ quý hiếm được phát hiện lần đầu tại Việt Nam năm 1992.`},{text:`Kangaroo`,correct:!1,explanation:`Chuột túi là loài bản địa nước Úc.`},{text:`Panda`,correct:!1,explanation:`Gấu trúc lớn là biểu tượng hoang dã của Trung Quốc.`},{text:`Koala`,correct:!1,explanation:`Gấu túi Koala sống trên cây bạch đàn ở Úc.`}]},{q:`Odd one out: Chọn từ có phần phát âm cụm phụ âm là /cl/ (khác với nhóm /bl/): blank, climate, blanket, blossom 🔊`,a:[{text:`climate`,correct:!0,explanation:`Chính xác! 'climate' bắt đầu bằng cụm phụ âm /kl/, trong khi blank, blanket, blossom đều bắt đầu bằng /bl/.`},{text:`blank`,correct:!1,explanation:`Bắt đầu bằng cụm /bl/.`},{text:`blanket`,correct:!1,explanation:`Bắt đầu bằng cụm /bl/.`},{text:`blossom`,correct:!1,explanation:`Bắt đầu bằng cụm /bl/.`}]},{q:`Odd one out: Hành động nào GÂY HẠI NGHIÊM TRỌNG CHO MÔI TRƯỜNG, không phải hành vi bảo vệ thiên nhiên? 🚯🌱`,a:[{text:`dumping untreated chemical waste into rivers`,correct:!0,explanation:`Đúng rồi! 'dumping untreated chemical waste into rivers' (xả chất thải hóa học chưa xử lý ra sông) là hành vi hủy hoại môi trường.`},{text:`planting green saplings`,correct:!1,explanation:`Trồng cây con phủ xanh đồi trọc.`},{text:`collecting coastal garbage`,correct:!1,explanation:`Thu gom rác ven biển.`},{text:`sorting household recyclables`,correct:!1,explanation:`Phân loại rác tái chế tại nguồn.`}]},{q:`Sắp xếp chữ cái thành từ chỉ ô nhiễm môi trường: 'i - o - n - l - u - l - p - o - t' 🏭💨`,a:[{text:`pollution`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'pollution' (sự ô nhiễm môi trường).`},{text:`polution`,correct:!1,explanation:`Thiếu một chữ l ở giữa.`},{text:`pollusion`,correct:!1,explanation:`Sai chữ t thành s.`},{text:`polluition`,correct:!1,explanation:`Thừa chữ i trước t.`}]},{q:`Viết lại câu dùng cụm danh từ 'Because of': 'Because the municipal water was contaminated, citizens stopped drinking it.' 🚰❌`,a:[{text:`Because of the contaminated municipal water, citizens stopped drinking it.`,correct:!0,explanation:`Chính xác! Cấu trúc: 'Because + S + V' chuyển thành 'Because of + Noun phrase' (the contaminated municipal water).`},{text:`Because of the municipal water was contaminated, citizens drank it.`,correct:!1,explanation:`Sau 'because of' không được dùng mệnh đề có to be 'was'.`},{text:`Citizens drank contaminated water because of health benefits.`,correct:!1,explanation:`Sai ngược hoàn toàn ý nghĩa câu gốc.`},{text:`Because contaminated of municipal water, citizens stopped drinking.`,correct:!1,explanation:`Sai trật tự cụm từ.`}]},{q:`Tìm lỗi sai trong câu sau: 'Because she was tired and unwell, so she took a sick leave from work.' 🤒🏥`,a:[{text:`Bỏ 'so' (Không dùng cặp Because... so trong tiếng Anh)`,correct:!0,explanation:`Đúng rồi! Trong tiếng Anh chuẩn, mệnh đề bắt đầu bằng 'Because' thì vế chính tuyệt đối không được dùng 'so'.`},{text:`tired and unwell -> tiredness and unwell`,correct:!1,explanation:`Dùng cặp tính từ sau 'was' là chuẩn.`},{text:`took -> takes`,correct:!1,explanation:`Động từ quá khứ hòa hợp với 'was' là đúng.`},{text:`from work -> at work`,correct:!1,explanation:`Nghỉ ốm ở chỗ làm dùng 'leave from work' là chính xác.`}]},{q:`Khái niệm nguyên tắc '3R' cốt lõi trong các chiến dịch bảo vệ môi trường toàn cầu là viết tắt của 3 từ nào? ♻️🌍`,a:[{text:`Reduce - Reuse - Recycle`,correct:!0,explanation:`Chính xác! 3R là viết tắt của: Reduce (Giảm thiểu) - Reuse (Tái sử dụng) - Recycle (Tái chế).`},{text:`Remove - Reject - Replace`,correct:!1,explanation:`Loại bỏ, từ chối, thay thế.`},{text:`Read - Repeat - Remember`,correct:!1,explanation:`Đọc, nhắc lại, ghi nhớ.`},{text:`Run - Rest - Recover`,correct:!1,explanation:`Chạy, nghỉ ngơi, hồi phục.`}]},{q:`Các sản phẩm gia dụng làm từ bã mía, thân tre, lá sen có khả năng tự phân hủy hữu cơ an toàn gọi là: 🌿📦`,a:[{text:`eco-friendly products`,correct:!0,explanation:`Tuyệt vời! Sản phẩm thân thiện và an toàn với hệ sinh thái là 'eco-friendly products' (hoặc biodegradable products).`},{text:`hazardous materials`,correct:!1,explanation:`'hazardous materials' là các chất độc hại nguy hiểm.`},{text:`radioactive waste`,correct:!1,explanation:`'radioactive waste' là rác thải phóng xạ hạt nhân.`},{text:`disposable plastics`,correct:!1,explanation:`'disposable plastics' là nhựa dùng một lần độc hại.`}]},{q:`The melting of polar ice caps driven by global warming causes sea levels to ___ significantly worldwide. 🌊🧊`,a:[{text:`rise`,correct:!0,explanation:`Chính xác! Nước biển dâng cao dùng nội động từ 'rise' (dâng lên, tăng lên).`},{text:`raise`,correct:!1,explanation:`'raise' là ngoại động từ, cần có tân ngữ theo sau.`},{text:`drop`,correct:!1,explanation:`Nước biển dâng chứ không sụt giảm.`},{text:`freeze`,correct:!1,explanation:`Băng tan chứ nước biển không đóng băng toàn cầu.`}]},{q:`Local secondary students volunteered to pick up scattered plastic bottles along the sandy ___ on Sunday. 🏖️🧴`,a:[{text:`beach`,correct:!0,explanation:`Đúng rồi! Bãi biển cát trắng ven biển là 'sandy beach'.`},{text:`classroom`,correct:!1,explanation:`Lớp học không có cát biển tự nhiên.`},{text:`kitchen`,correct:!1,explanation:`Nhà bếp nấu ăn.`},{text:`library`,correct:!1,explanation:`Thư viện đọc sách yên tĩnh.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'can / trees / We / Earth / planting / protect / more / by / the / .' 🌍🌱`,a:[{text:`We can protect the Earth by planting more trees.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (We) + can protect + O (the Earth) + by + V-ing (planting more trees).`},{text:`We can protect planting more trees by the Earth.`,correct:!1,explanation:`Sai trật tự giới từ 'by'.`},{text:`Planting more trees we can protect by the Earth.`,correct:!1,explanation:`Sai cấu trúc bổ ngữ.`},{text:`We the Earth can protect by planting more trees.`,correct:!1,explanation:`Tân ngữ 'the Earth' chen sai vị trí.`}]},{q:`What catastrophe will occur if mankind continues exhausting fossil fuels without shifting towards renewable clean energy? ☀️💨`,a:[{text:`Global temperatures will escalate, intensifying catastrophic droughts, storms, and species extinction.`,correct:!0,explanation:`Chính xác! Tiếp tục đốt nhiên liệu hóa thạch sẽ đẩy nhiệt độ toàn cầu tăng vọt, gây biến đổi khí hậu khốc liệt và tuyệt chủng sinh vật.`},{text:`The planet will instantly enter an eternal ice age tomorrow.`,correct:!1,explanation:`Không gây đóng băng ngay lập tức.`},{text:`All environmental pollution will magically dissolve within days.`,correct:!1,explanation:`Ô nhiễm không thể tự dưng biến mất.`},{text:`Fossil fuels will reproduce themselves abundantly forever.`,correct:!1,explanation:`Nhiên liệu hóa thạch không thể tự tái tạo vô tận.`}]},{q:`Thuật ngữ chỉ người có thói quen nghiện mua sắm không kiểm soát ngay cả khi túng thiếu tiền bạc là: 🛍️💳`,a:[{text:`shopaholic`,correct:!0,explanation:`Chính xác! Người nghiện mua sắm không cưỡng lại được là 'shopaholic'.`},{text:`workaholic`,correct:!1,explanation:`'workaholic' là người cuồng tham công tiếc việc.`},{text:`alcoholic`,correct:!1,explanation:`'alcoholic' là người nghiện rượu.`},{text:`chocoholic`,correct:!1,explanation:`'chocoholic' là người nghiện ăn sô-cô-la.`}]},{q:`Một món đồ chất lượng tốt được mua với mức giá rẻ hời hơn rất nhiều so với giá trị thực tế của nó là: 🏷️✨`,a:[{text:`a bargain`,correct:!0,explanation:`Đúng rồi! Món hàng hời giá rẻ là 'a bargain'.`},{text:`an rip-off`,correct:!1,explanation:`'a rip-off' là món đồ bị mua đắt cắt cổ, bị lừa.`},{text:`a fine`,correct:!1,explanation:`'a fine' là tiền phạt vi phạm pháp luật.`},{text:`a debt`,correct:!1,explanation:`'a debt' là món nợ tài chính.`}]},{q:`Khu chợ dân sinh họp ngoài trời với các sạp bán tôm cá, rau củ quả tươi sống mỗi sớm mai là: 🥦🐟`,a:[{text:`open-air market`,correct:!0,explanation:`Chính xác! Chợ họp ngoài trời truyền thống là 'open-air market'.`},{text:`supermarket`,correct:!1,explanation:`'supermarket' là siêu thị trong nhà khép kín máy lạnh.`},{text:`online shop`,correct:!1,explanation:`'online shop' là cửa hàng mua sắm qua mạng.`},{text:`convenience store`,correct:!1,explanation:`'convenience store' là cửa hàng tiện lợi 24/7.`}]},{q:`According to the official schedule, the annual midnight discount fair ___ at 11:30 PM tonight. ⏰🏷️`,a:[{text:`closes`,correct:!0,explanation:`Đúng rồi! Thì hiện tại đơn diễn tả lịch trình, thời khóa biểu cố định trong tương lai: 'closes at 11:30 PM tonight'.`},{text:`will be closing`,correct:!1,explanation:`Lịch trình cố định ưu tiên dùng hiện tại đơn.`},{text:`has closed`,correct:!1,explanation:`Đêm nay chưa diễn ra, không dùng hiện tại hoàn thành.`},{text:`closed`,correct:!1,explanation:`Quá khứ đơn sai mốc thời gian tonight.`}]},{q:`What time ___ the large grocery supermarket open its doors to morning shoppers on weekdays? 🛒🕗`,a:[{text:`does`,correct:!0,explanation:`Chính xác! Đặt câu hỏi thì hiện tại đơn với chủ ngữ số ít 'the large grocery supermarket': 'What time does... open?'.`},{text:`is`,correct:!1,explanation:`Đã có động từ thường 'open' ở dạng nguyên mẫu, không dùng to be 'is'.`},{text:`do`,correct:!1,explanation:`Chủ ngữ số ít không dùng trợ động từ 'do'.`},{text:`has`,correct:!1,explanation:`Không dùng 'has' với động từ nguyên mẫu 'open'.`}]},{q:`Linh ___ purchases footwear online because she insists on trying shoes on in person to check the fitting size. 👠📦`,a:[{text:`rarely`,correct:!0,explanation:`Đúng rồi! 'rarely' (hiếm khi) phù hợp với ngữ cảnh vì Linh muốn thử giày tận mắt trước khi mua.`},{text:`always`,correct:!1,explanation:`'always' (luôn luôn) trái ngược với việc muốn thử trực tiếp.`},{text:`often`,correct:!1,explanation:`'often' (thường xuyên) mâu thuẫn với ngữ cảnh.`},{text:`usually`,correct:!1,explanation:`'usually' (thông thường) không hợp logic câu.`}]},{q:`Eligible shoppers can claim a full cash refund within seven days provided that they retain their original purchase ___. 🧾💵`,a:[{text:`receipt`,correct:!0,explanation:`Chính xác! Hóa đơn mua hàng là 'receipt' (chữ 'p' câm: /rɪˈsiːt/).`},{text:`recipe`,correct:!1,explanation:`'recipe' là công thức nấu ăn món ngon.`},{text:`prescription`,correct:!1,explanation:`'prescription' là đơn thuốc của bác sĩ khám bệnh.`},{text:`leaflet`,correct:!1,explanation:`'leaflet' là tờ rơi quảng cáo in giấy.`}]},{q:`During festive seasons, apparel items are prominently advertised at a massive 50% ___ off the marked tag. 🏷️📉`,a:[{text:`discount`,correct:!0,explanation:`Đúng rồi! Mức giảm giá, chiết khấu là 'discount' (50% discount).`},{text:`increase`,correct:!1,explanation:`'increase' là mức tăng giá.`},{text:`penalty`,correct:!1,explanation:`'penalty' là mức phạt tiền.`},{text:`tax`,correct:!1,explanation:`'tax' là mức thuế nộp cho nhà nước.`}]},{q:`Chuỗi cửa hàng bách hóa mini mở cửa xuyên suốt 24 giờ mỗi ngày phục vụ đồ ăn nhanh và hàng thiết yếu là: 🏪🌙`,a:[{text:`convenience store`,correct:!0,explanation:`Chính xác! Cửa hàng tiện lợi mở cửa 24/7 (như Circle K, 7-Eleven) là 'convenience store'.`},{text:`hardware store`,correct:!1,explanation:`'hardware store' là cửa hàng bán đồ nghề kim khí ốc vít.`},{text:`furniture store`,correct:!1,explanation:`'furniture store' là cửa hàng bán bàn ghế nội thất.`},{text:`florist's`,correct:!1,explanation:`'florist's' là tiệm bán hoa tươi.`}]},{q:`Odd one out: Chọn từ có phần phát âm cụm phụ âm là /sp/ (khác với nhóm /st/): store, spend, status, stadium 🔊`,a:[{text:`spend`,correct:!0,explanation:`Chính xác! 'spend' bắt đầu bằng cụm phụ âm /sp/, trong khi store, status, stadium đều bắt đầu bằng /st/.`},{text:`store`,correct:!1,explanation:`Bắt đầu bằng cụm phụ âm /st/.`},{text:`status`,correct:!1,explanation:`Bắt đầu bằng cụm phụ âm /st/.`},{text:`stadium`,correct:!1,explanation:`Bắt đầu bằng cụm phụ âm /st/.`}]},{q:`Odd one out: Từ nào chỉ HÀNH ĐỘNG THƯƠNG LƯỢNG MẶC CẢ, không phải địa điểm buôn bán? 🏷️`,a:[{text:`bargain`,correct:!0,explanation:`Đúng rồi! 'bargain' (mặc cả/món hời) là hành động/tính chất mua bán, trong khi bakery, pharmacy, bookstore là các cửa hàng vật lý.`},{text:`bakery`,correct:!1,explanation:`'bakery' là tiệm bánh mì bánh ngọt.`},{text:`pharmacy`,correct:!1,explanation:`'pharmacy' là hiệu thuốc tây.`},{text:`bookstore`,correct:!1,explanation:`'bookstore' là nhà sách bán truyện và tập vở.`}]},{q:`Sắp xếp chữ cái thành từ chỉ khách hàng mua sắm: 'r - o - t - s - c - e - u - m' 🛒👤`,a:[{text:`customer`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'customer' (khách hàng mua sắm).`},{text:`custome`,correct:!1,explanation:`Thiếu chữ r cuối từ (thành costume).`},{text:`custemer`,correct:!1,explanation:`Sai chữ o thành e.`},{text:`costumer`,correct:!1,explanation:`Sai chữ u đầu thành o.`}]},{q:`Viết lại câu dùng trạng từ tần suất chỉ thói quen 100%: 'Tom visits the local market every single Sunday without failure.' 🧺📅`,a:[{text:`Tom always visits the local market on Sundays.`,correct:!0,explanation:`Chính xác! Hành động diễn ra 100% không bỏ lỡ lần nào tương ứng với trạng từ tần suất 'always' (luôn luôn).`},{text:`Tom rarely visits the local market on Sundays.`,correct:!1,explanation:`'rarely' là hiếm khi, trái ngược nghĩa gốc.`},{text:`Tom sometimes visits the local market on Sundays.`,correct:!1,explanation:`'sometimes' là thỉnh thoảng.`},{text:`Tom never visits the local market on Sundays.`,correct:!1,explanation:`'never' là không bao giờ.`}]},{q:`Tìm lỗi sai trong câu sau: 'The express delivery van will departs from the central warehouse at 6:00 AM tomorrow.' 🚚📦`,a:[{text:`will departs -> will depart (hoặc departs)`,correct:!0,explanation:`Đúng rồi! Sau trợ động từ khuyết thiếu 'will' phải là động từ nguyên mẫu không chia ('will depart'), hoặc dùng hiện tại đơn 'departs' theo lịch trình.`},{text:`delivery van -> van delivery`,correct:!1,explanation:`Cụm danh từ bổ nghĩa đúng trật tự.`},{text:`warehouse -> warehoused`,correct:!1,explanation:`'warehouse' là danh từ nhà kho, không thêm d.`},{text:`at 6:00 AM -> on 6:00 AM`,correct:!1,explanation:`Trước giờ cụ thể dùng giới từ 'at' là chuẩn xác.`}]},{q:`Hành động thảo luận với người bán để hạ bớt giá tiền một món hàng ở chợ truyền thống gọi là: 💬💵`,a:[{text:`bargaining (haggling)`,correct:!0,explanation:`Chính xác! Trả giá, mặc cả để mua được giá rẻ hơn gọi là 'bargaining' hoặc 'haggling'.`},{text:`stealing`,correct:!1,explanation:`'stealing' là hành vi trộm cắp phạm pháp.`},{text:`complaining`,correct:!1,explanation:`'complaining' là phàn nàn chê bai chất lượng.`},{text:`donating`,correct:!1,explanation:`'donating' là quyên góp từ thiện.`}]},{q:`Trước khi quyết định bấm thanh toán trực tuyến, người tiêu dùng thông minh nên tham khảo mục gì? ⭐📝`,a:[{text:`customer feedback and product reviews`,correct:!0,explanation:`Tuyệt vời! Đọc nhận xét đánh giá thực tế của khách hàng (reviews and feedback) giúp tránh mua phải hàng kém chất lượng.`},{text:`fake banner promotions`,correct:!1,explanation:`Băng rôn quảng cáo giả mạo.`},{text:`spam pop-up alerts`,correct:!1,explanation:`Các thông báo rác lừa đảo.`},{text:`lottery winning claims`,correct:!1,explanation:`Tin trúng số lừa tiền.`}]},{q:`Shoppers pushing a heavy metal wheeled ___ down the supermarket aisles can load numerous bulk groceries. 🛒`,a:[{text:`trolley (cart)`,correct:!0,explanation:`Đúng rồi! Chiếc xe đẩy hàng bằng kim loại có bánh xe trong siêu thị là 'trolley' hoặc 'cart'.`},{text:`bicycle`,correct:!1,explanation:`'bicycle' là chiếc xe đạp hai bánh.`},{text:`suitcase`,correct:!1,explanation:`'suitcase' là vali kéo hành lý du lịch.`},{text:`backpack`,correct:!1,explanation:`'backpack' là chiếc ba-lô đeo trên vai.`}]},{q:`This high-tech robot vacuum cleaner is covered by a comprehensive 24-month manufacturer's ___. 🛠️📄`,a:[{text:`warranty`,correct:!0,explanation:`Chính xác! Phiếu bảo hành chính hãng là 'warranty' (hoặc 'guarantee').`},{text:`punishment`,correct:!1,explanation:`'punishment' là hình phạt thích đáng.`},{text:`debt`,correct:!1,explanation:`'debt' là khoản nợ ngân hàng.`},{text:`discount`,correct:!1,explanation:`Thời gian 24 tháng là thời hạn bảo hành, không phải thời hạn giảm giá.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'discounts / offers / The / store / big / weekends / on / .' 🏷️📅`,a:[{text:`The store offers big discounts on weekends.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (The store) + V (offers) + O (big discounts) + Time (on weekends).`},{text:`The store big discounts offers on weekends.`,correct:!1,explanation:`Tân ngữ chen vào giữa chủ ngữ và vị ngữ.`},{text:`Big discounts offers the store on weekends.`,correct:!1,explanation:`Sai trật tự chủ ngữ vị ngữ.`},{text:`On weekends big discounts the store offers.`,correct:!1,explanation:`Vị ngữ bị đẩy xuống cuối câu là sai.`}]},{q:`What is a major advantage of shopping at traditional local open-air wet markets compared to e-commerce apps? 🥬🤝`,a:[{text:`Shoppers can inspect freshness directly, support local farmers, and enjoy lively human interaction.`,correct:!0,explanation:`Chính xác! Ưu điểm của chợ truyền thống là được tự tay chọn thực phẩm tươi ngon, ủng hộ tiểu thương địa phương và giao lưu trò chuyện thân tình.`},{text:`Products are completely cost-free and given away for nothing.`,correct:!1,explanation:`Không ai cho không miễn phí hàng hóa ở chợ.`},{text:`Markets never close and stay open during typhoons.`,correct:!1,explanation:`Chợ không mở khi bão tố nguy hiểm.`},{text:`All goods are guaranteed by international space agencies.`,correct:!1,explanation:`Hàng chợ không liên quan cơ quan vũ trụ.`}]},{q:`Cơn bão nhiệt đới dữ dội kèm theo gió lốc giật dữ dội và mưa như trút nước hình thành trên vùng biển châu Á gọi là: 🌀🌊`,a:[{text:`typhoon`,correct:!0,explanation:`Chính xác! Cơn bão nhiệt đới dữ dội ở vùng Tây Bắc Thái Bình Dương/châu Á gọi là 'typhoon'.`},{text:`drought`,correct:!1,explanation:`'drought' là hạn hán khô hạn kéo dài.`},{text:`heatwave`,correct:!1,explanation:`'heatwave' là đợt nắng nóng gay gắt.`},{text:`blizzard`,correct:!1,explanation:`'blizzard' là trận bão tuyết mù mịt giá lạnh.`}]},{q:`Đợt sóng thần khổng lồ dâng cao hàng chục mét ập vào bờ biển do động đất dưới đáy đại dương gây ra là: 🌊🚨`,a:[{text:`tsunami`,correct:!0,explanation:`Đúng rồi! Sóng thần bắt nguồn từ tiếng Nhật là 'tsunami' (chữ 't' câm: /tsuːˈnɑːmi/).`},{text:`puddle`,correct:!1,explanation:`'puddle' là vũng nước mưa đọng trên đường.`},{text:`tide`,correct:!1,explanation:`'tide' là hiện tượng thủy triều lên xuống bình thường.`},{text:`ripple`,correct:!1,explanation:`'ripple' là gợn sóng nhỏ lăn tăn trên mặt hồ.`}]},{q:`Hiện tượng rung chuyển mặt đất đột ngột do sự dịch chuyển va chạm của các mảng kiến tạo vỏ Trái Đất là: 🏚️📉`,a:[{text:`earthquake`,correct:!0,explanation:`Chính xác! Trận động đất là 'earthquake'.`},{text:`sandstorm`,correct:!1,explanation:`'sandstorm' là trận bão cát sa mạc.`},{text:`tornado`,correct:!1,explanation:`'tornado' là cơn lốc xoáy hình phễu hút mọi vật lên cao.`},{text:`wildfire`,correct:!1,explanation:`'wildfire' là đám cháy rừng bùng phát dữ dội.`}]},{q:`While my family was having dinner in the dining room, the floor suddenly ___ to tremble violently. 🍽️⚡`,a:[{text:`began`,correct:!0,explanation:`Đúng rồi! Cấu trúc: 'While + S + was/were V-ing (hành động đang diễn ra), S + V-ed (hành động ngắn chen ngang)'.`},{text:`was beginning`,correct:!1,explanation:`Hành động chen ngang bất ngờ dùng thì quá khứ đơn.`},{text:`begins`,correct:!1,explanation:`Hiện tại đơn sai ngữ cảnh quá khứ.`},{text:`has begun`,correct:!1,explanation:`Hiện tại hoàn thành không dùng trong câu quá khứ kết hợp này.`}]},{q:`What ___ you doing at 9:00 PM yesterday when the civil defense typhoon siren started blaring? ⏰📢`,a:[{text:`were`,correct:!0,explanation:`Chính xác! Cấu trúc câu hỏi quá khứ tiếp diễn với chủ ngữ 'you': 'What were you doing... when...?'.`},{text:`are`,correct:!1,explanation:`Hiện tại tiếp diễn sai mốc thời gian yesterday.`},{text:`was`,correct:!1,explanation:`Chủ ngữ 'you' đi với to be 'were', không đi với 'was'.`},{text:`did`,correct:!1,explanation:`Đã có V-ing 'doing' nên phải dùng to be, không dùng trợ động từ 'did'.`}]},{q:`The courageous rescue volunteers were searching for trapped survivors when a severe aftershock ___ the damaged building. 🏚️🚨`,a:[{text:`struck`,correct:!0,explanation:`Đúng rồi! Mệnh đề 'when' chỉ hành động ngắn bất ngờ chen ngang chia ở quá khứ đơn ('struck' là quá khứ của 'strike').`},{text:`was striking`,correct:!1,explanation:`Hành động chen ngang đột ngột chia quá khứ đơn.`},{text:`strikes`,correct:!1,explanation:`Hiện tại đơn sai ngữ cảnh quá khứ.`},{text:`had been striking`,correct:!1,explanation:`Sai thì trong cấu trúc kết hợp when.`}]},{q:`While firefighters were combating the forest blaze, paramedics ___ urgent first aid to injured evacuees. 🚒👨‍⚕️`,a:[{text:`were administering`,correct:!0,explanation:`Chính xác! Hai hành động cùng diễn ra song song trong quá khứ dùng 'While': cả hai vế đều chia quá khứ tiếp diễn.`},{text:`administered`,correct:!1,explanation:`Hai hành động kéo dài song song dùng quá khứ tiếp diễn.`},{text:`administer`,correct:!1,explanation:`Hiện tại đơn sai thì.`},{text:`are administering`,correct:!1,explanation:`Hiện tại tiếp diễn sai ngữ cảnh quá khứ.`}]},{q:`At this exact hour yesterday, torrential rain and gale-force winds ___ off dozens of residential roofs in the coastal village. 🏚️💨`,a:[{text:`were tearing`,correct:!0,explanation:`Đúng rồi! Hành động đang diễn ra tại thời điểm xác định cụ thể trong quá khứ ('At this exact hour yesterday') chia thì quá khứ tiếp diễn.`},{text:`tore`,correct:!1,explanation:`Chỉ thời điểm cụ thể đang xảy ra nên chia quá khứ tiếp diễn.`},{text:`tear`,correct:!1,explanation:`Hiện tại đơn sai mốc thời gian.`},{text:`are tearing`,correct:!1,explanation:`Hiện tại tiếp diễn sai ngữ cảnh quá khứ.`}]},{q:`Bộ dụng cụ khẩn cấp gồm đèn pin, pin dự phòng, hộp sơ cứu y tế, nước đóng chai và đồ hộp dự trữ gọi là: 🔦🩹🥫`,a:[{text:`emergency supply kit`,correct:!0,explanation:`Chính xác! Túi/hộp cứu sinh chuẩn bị trước thiên tai là 'emergency supply kit'.`},{text:`fashion accessory`,correct:!1,explanation:`'fashion accessory' là phụ kiện thời trang làm đẹp.`},{text:`cosmetic kit`,correct:!1,explanation:`'cosmetic kit' là bộ đồ trang điểm son phấn.`},{text:`stationery set`,correct:!1,explanation:`'stationery set' là bộ đồ dùng học tập bút thước.`}]},{q:`Odd one out: Chọn từ có trọng âm rơi vào âm tiết thứ hai (khác với nhóm trọng âm rơi vào âm tiết thứ nhất): practical, dangerous, natural, disastrous 🔊`,a:[{text:`disastrous`,correct:!0,explanation:`Chính xác! 'disastrous' có trọng âm rơi vào âm tiết thứ 2 /dɪˈzɑː.strəs/, trong khi practical, dangerous, natural đều có trọng âm rơi vào âm tiết thứ nhất.`},{text:`practical`,correct:!1,explanation:`Trọng âm rơi vào âm tiết thứ nhất /ˈpræk.tɪ.kəl/.`},{text:`dangerous`,correct:!1,explanation:`Trọng âm rơi vào âm tiết thứ nhất /ˈdeɪn.dʒər.əs/.`},{text:`natural`,correct:!1,explanation:`Trọng âm rơi vào âm tiết thứ nhất /ˈnætʃ.ər.əl/.`}]},{q:`Odd one out: Từ nào chỉ THIÊN TAI NGUY HIỂM DO TỰ NHIÊN, không phải thiết bị ứng phó thảm họa? 🌪️`,a:[{text:`landslide`,correct:!0,explanation:`Đúng rồi! 'landslide' (vụ sạt lở đất) là hiện tượng thiên tai hiểm họa, còn whistle, flashlight, first-aid kit là trang bị sinh tồn cứu hộ.`},{text:`whistle`,correct:!1,explanation:`'whistle' là cái còi thổi cầu cứu.`},{text:`flashlight`,correct:!1,explanation:`'flashlight' là chiếc đèn pin chiếu sáng.`},{text:`first-aid kit`,correct:!1,explanation:`'first-aid kit' là túi hộp sơ cứu vết thương.`}]},{q:`Sắp xếp chữ cái thành từ chỉ thảm họa tai ương: 'i - a - e - d - t - s - s - r' 🚨`,a:[{text:`disaster`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'disaster' (thảm họa thiên tai).`},{text:`desaster`,correct:!1,explanation:`Sai chữ i thành e.`},{text:`disastor`,correct:!1,explanation:`Sai chữ e thành o.`},{text:`disatser`,correct:!1,explanation:`Sai vị trí t và s.`}]},{q:`Viết lại câu dùng cấu trúc thì Quá khứ tiếp diễn với 'While': 'The ferocious earthquake struck during our geography class.' 🏚️📚`,a:[{text:`While we were having our geography class, the ferocious earthquake struck.`,correct:!0,explanation:`Chính xác! Cấu trúc: 'While + S + were having (quá khứ tiếp diễn), S + struck (quá khứ đơn)'.`},{text:`While we had our geography class, the earthquake was striking.`,correct:!1,explanation:`Sai cách chia thì của hành động kéo dài và hành động chen ngang.`},{text:`The earthquake struck while we are having our geography class.`,correct:!1,explanation:`Sai to be 'are' trong ngữ cảnh quá khứ.`},{text:`While our geography class, the earthquake was striking.`,correct:!1,explanation:`Sau 'while' phải là mệnh đề S-V.`}]},{q:`Tìm lỗi sai trong câu sau: 'When the historic typhoon hit the central province, residents are evacuating to concrete shelters.' 🌀🏚️`,a:[{text:`are evacuating -> were evacuating`,correct:!0,explanation:`Đúng rồi! Mệnh đề 'when' dùng quá khứ đơn 'hit' thì vế diễn biến phải chia quá khứ tiếp diễn 'were evacuating', không dùng hiện tại 'are'.`},{text:`historic typhoon -> typhoon historic`,correct:!1,explanation:`Tính từ đứng trước danh từ là chuẩn.`},{text:`the central province -> on central province`,correct:!1,explanation:`Giới từ và mạo từ trước địa danh là đúng.`},{text:`concrete shelters -> shelters concrete`,correct:!1,explanation:`Tính từ concrete (bê tông) đứng trước danh từ là đúng.`}]},{q:`Công trình kiên cố được cơ quan chức năng bố trí để người dân sơ tán tạm trú an toàn khi bão lũ đổ bộ là: 🏢🛡️`,a:[{text:`emergency evacuation shelter`,correct:!0,explanation:`Tuyệt vời! Khu trú ẩn sơ tán khẩn cấp an toàn là 'emergency evacuation shelter'.`},{text:`movie theater`,correct:!1,explanation:`Rạp chiếu phim giải trí.`},{text:`shopping mall center`,correct:!1,explanation:`Trung tâm thương mại mua sắm.`},{text:`amusement theme park`,correct:!1,explanation:`Công viên trò chơi cảm giác mạnh.`}]},{q:`Hiện tượng đất đá, bùn nhão từ sườn núi dốc ạt xuống vùi lấp đường sá và làng mạc sau mưa bão dữ dội gọi là: ⛰️🚜`,a:[{text:`landslide (mudslide)`,correct:!0,explanation:`Chính xác! Trận sạt lở đất đá kinh hoàng là 'landslide' hoặc 'mudslide'.`},{text:`snowstorm`,correct:!1,explanation:`'snowstorm' là bão tuyết lạnh giá.`},{text:`sand dune`,correct:!1,explanation:`'sand dune' là cồn cát sa mạc lộng gió.`},{text:`volcano`,correct:!1,explanation:`'volcano' là ngọn núi lửa phun trào nham thạch.`}]},{q:`Specially trained rescue search dogs utilize their sharp sense of smell to ___ survivors buried under thick collapsed debris. 🐕🔍`,a:[{text:`locate`,correct:!0,explanation:`Đúng rồi! Động từ định vị, tìm kiếm chính xác vị trí nạn nhân mắc kẹt là 'locate' (hoặc 'detect').`},{text:`forget`,correct:!1,explanation:`'forget' là lãng quên.`},{text:`damage`,correct:!1,explanation:`'damage' là làm hư hỏng phá hoại.`},{text:`ignore`,correct:!1,explanation:`'ignore' là phớt lờ bỏ mặc.`}]},{q:`The national meteorological agency broadcast an urgent red alert ___ the river water levels had surpassed historical danger marks. 📊🌊`,a:[{text:`because`,correct:!0,explanation:`Chính xác! Liên từ 'because' chỉ nguyên nhân dẫn đến việc cơ quan khí tượng phát lệnh báo động đỏ khẩn cấp.`},{text:`although`,correct:!1,explanation:`'although' mang nghĩa tương phản nhượng bộ.`},{text:`so that`,correct:!1,explanation:`'so that' chỉ mục đích.`},{text:`unless`,correct:!1,explanation:`'unless' mang nghĩa trừ phi.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'were / siren / sleeping / The / when / sounded / we / .' 📢😴`,a:[{text:`We were sleeping when the siren sounded.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (We) + were sleeping + when + S (the siren) + sounded (quá khứ đơn).`},{text:`We sleeping were when the sounded siren.`,correct:!1,explanation:`Sai trật tự trợ từ và động từ tiếp diễn.`},{text:`When we were sleeping the siren sounded we.`,correct:!1,explanation:`Thừa đại từ 'we' ở cuối câu.`},{text:`The siren sounded were we sleeping when.`,correct:!1,explanation:`Cấu trúc lộn xộn vô nghĩa.`}]},{q:`What essential survival precautions should coastal households take upon receiving an impending super-typhoon broadcast? 📻🏠`,a:[{text:`Board up glass windows, secure rooftop iron sheets, disconnect electrical lines, and prepare emergency kits.`,correct:!0,explanation:`Chính xác! Chằng chống cửa kính, gia cố mái nhà tôn, ngắt điện nguồn và sẵn sàng túi đồ cứu hộ là các bước sống còn khi có bão dữ.`},{text:`Go swimming at the beach to experience monster tidal waves.`,correct:!1,explanation:`Bơi biển khi bão là hành vi cực kỳ nguy hiểm đến tính mạng.`},{text:`Leave all windows wide open to invite refreshing gale winds.`,correct:!1,explanation:`Mở toang cửa sổ sẽ khiến gió giật tốc mái sập nhà.`},{text:`Ignore all warnings and organize an outdoor music festival.`,correct:!1,explanation:`Tổ chức tiệc ngoài trời khi bão là coi thường tính mạng.`}]},{q:`Khả năng truyền trực tiếp dòng suy nghĩ và cảm xúc từ tâm trí người này sang tâm trí người khác không qua lời nói là: 🧠✨`,a:[{text:`telepathy`,correct:!0,explanation:`Chính xác! Khả năng thần giao cách cảm giao tiếp bằng sóng não là 'telepathy'.`},{text:`telephony`,correct:!1,explanation:`'telephony' là công nghệ điện thoại viễn thông thông thường.`},{text:`telegraph`,correct:!1,explanation:`'telegraph' là máy đánh điện tín mã Morse xưa.`},{text:`television`,correct:!1,explanation:`'television' là máy thu hình vô tuyến truyền hình.`}]},{q:`Công nghệ tái tạo hình ảnh không gian 3 chiều sống động như người thật lơ lửng giữa không trung gọi là: 👤🌈`,a:[{text:`holography (hologram)`,correct:!0,explanation:`Đúng rồi! Kỹ thuật ghi hình toàn ký chiếu không gian 3 chiều là 'holography' (hình chiếu gọi là 'hologram').`},{text:`photography`,correct:!1,explanation:`'photography' là nhiếp ảnh chụp ảnh phẳng 2D.`},{text:`calligraphy`,correct:!1,explanation:`'calligraphy' là nghệ thuật viết chữ thư pháp.`},{text:`biography`,correct:!1,explanation:`'biography' là cuốn sách tiểu sử cuộc đời danh nhân.`}]},{q:`Cặp mắt kính công nghệ cao hiển thị thông tin ảo, chỉ đường và dịch thuật trực tiếp ngay trước tầm mắt người đeo là: 👓🌐`,a:[{text:`smart glasses`,correct:!0,explanation:`Chính xác! Kính thực tế ảo tăng cường thông minh là 'smart glasses'.`},{text:`sunglasses`,correct:!1,explanation:`'sunglasses' là kính râm chống nắng thông thường.`},{text:`microscopes`,correct:!1,explanation:`'microscopes' là kính hiển vi soi tế bào vi khuẩn.`},{text:`binoculars`,correct:!1,explanation:`'binoculars' là ống nhòm nhìn xa.`}]},{q:`This futuristic voice translation earbud is not yours; it is ___. I purchased it from the robotics expo yesterday. 🎧🤖`,a:[{text:`mine`,correct:!0,explanation:`Đúng rồi! Đại từ sở hữu 'mine' thay thế cho 'my translation earbud' (của tôi).`},{text:`my`,correct:!1,explanation:`'my' là tính từ sở hữu, bắt buộc có danh từ theo sau.`},{text:`me`,correct:!1,explanation:`'me' là đại từ tân ngữ.`},{text:`myself`,correct:!1,explanation:`'myself' là đại từ phản thân.`}]},{q:`Our international student conference on space habitats takes place ___ 8:30 AM ___ Monday morning. 📅⏰`,a:[{text:`at - on`,correct:!0,explanation:`Chính xác! Trước giờ cụ thể dùng giới từ 'at' (at 8:30 AM); trước các thứ trong tuần dùng giới từ 'on' (on Monday morning).`},{text:`in - on`,correct:!1,explanation:`Trước giờ cụ thể không dùng giới từ 'in'.`},{text:`at - at`,correct:!1,explanation:`Trước thứ ngày trong tuần không dùng 'at'.`},{text:`on - in`,correct:!1,explanation:`Đảo ngược sai vị trí hai giới từ.`}]},{q:`Futuristic scientists predict that thousands of people will reside and communicate ___ orbital space colonies by 2080. 🛰️🌌`,a:[{text:`in`,correct:!0,explanation:`Đúng rồi! Sống bên trong trạm không gian/khu định cư kín dùng giới từ 'in' ('in orbital space colonies').`},{text:`at`,correct:!1,explanation:`Không dùng 'at' chỉ bên trong trạm không gian.`},{text:`on`,correct:!1,explanation:`'on' dùng với bề mặt hành tinh, với trạm vũ trụ dùng 'in'.`},{text:`under`,correct:!1,explanation:`'under' là bên dưới lòng đất/nước.`}]},{q:`Their holographic projection device can only display black-and-white silhouettes, whereas ___ renders ultra-realistic 8K colors. 🌈✨`,a:[{text:`ours`,correct:!0,explanation:`Chính xác
