! Đại từ sở hữu 'ours' thay thế cho 'our holographic projection device' (của chúng tôi).`},{text:`our`,correct:!1,explanation:`'our' là tính từ sở hữu, cần có danh từ phía sau.`},{text:`we`,correct:!1,explanation:`'we' là đại từ chủ ngữ.`},{text:`us`,correct:!1,explanation:`'us' là đại từ tân ngữ.`}]},{q:`Lan misplaced her stylus pen before the virtual architecture workshop, so David graciously offered her ___. 🖊️🤝`,a:[{text:`his`,correct:!0,explanation:`Đúng rồi! Đại từ sở hữu 'his' thay thế cho 'his stylus pen' (của anh ấy).`},{text:`him`,correct:!1,explanation:`'him' là đại từ tân ngữ.`},{text:`he`,correct:!1,explanation:`'he' là đại từ chủ ngữ.`},{text:`himself`,correct:!1,explanation:`'himself' là đại từ phản thân.`}]},{q:`Thiết bị bay tự hành không người lái cỡ nhỏ dùng để vận chuyển nhanh các gói hàng và thuốc men trong thành phố tương lai là: 🛸📦`,a:[{text:`delivery drone`,correct:!0,explanation:`Chính xác! Máy bay giao hàng không người lái là 'delivery drone'.`},{text:`submarine`,correct:!1,explanation:`'submarine' là tàu ngầm lặn dưới đại dương.`},{text:`steam train`,correct:!1,explanation:`'steam train' là đoàn tàu hỏa chạy bằng hơi nước cổ xưa.`},{text:`space shuttle`,correct:!1,explanation:`'space shuttle' là tàu con thoi bay vào quỹ đạo vũ trụ.`}]},{q:`Odd one out: Chọn từ có trọng âm rơi vào âm tiết thứ nhất (khác với nhóm từ có trọng âm rơi vào âm tiết trước đuôi -ity): sensitive, ability, activity, reality 🔊`,a:[{text:`sensitive`,correct:!0,explanation:`Chính xác! 'sensitive' có trọng âm rơi vào âm tiết thứ nhất /ˈsen.sə.tɪv/, trong khi ability, activity, reality đều có trọng âm rơi vào âm tiết thứ hai (ngay trước hậu tố -ity).`},{text:`ability`,correct:!1,explanation:`Trọng âm rơi vào âm tiết thứ hai /əˈbɪl.ə.ti/.`},{text:`activity`,correct:!1,explanation:`Trọng âm rơi vào âm tiết thứ hai /ækˈtɪv.ə.ti/.`},{text:`reality`,correct:!1,explanation:`Trọng âm rơi vào âm tiết thứ hai /riˈæl.ə.ti/.`}]},{q:`Odd one out: Từ nào chỉ CÔNG NGHỆ TRUYỀN THÔNG HIỆN ĐẠI/TƯƠNG LAI, không phải thư tín giấy truyền thống? 📬`,a:[{text:`holographic teleconference`,correct:!0,explanation:`Đúng rồi! 'holographic teleconference' (hội nghị truyền hình 3D toàn ký) là công nghệ đỉnh cao, trong khi postcard, paper letter, stamp thuộc về thư tín giấy truyền thống.`},{text:`postcard`,correct:!1,explanation:`'postcard' là tấm bưu thiếp giấy viết tay.`},{text:`paper letter`,correct:!1,explanation:`'paper letter' là lá thư tay viết trên giấy gửi qua bưu điện.`},{text:`postage stamp`,correct:!1,explanation:`'postage stamp' là con tem bưu chính dán ngoài phong bì.`}]},{q:`Sắp xếp chữ cái thành từ chỉ hình chiếu ba chiều: 'o - h - l - r - o - a - m - g' ✨`,a:[{text:`hologram`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'hologram' (hình chiếu 3D lập thể toàn ký).`},{text:`hologrem`,correct:!1,explanation:`Sai chữ a thành e.`},{text:`holagram`,correct:!1,explanation:`Sai chữ o thứ hai thành a.`},{text:`hologrm`,correct:!1,explanation:`Thiếu chữ a.`}]},{q:`Viết lại câu dùng đại từ sở hữu thích hợp: 'This is my smart tablet, and that is your smart tablet.' 📱✨`,a:[{text:`This smart tablet is mine, and that one is yours.`,correct:!0,explanation:`Chính xác! Thay 'my smart tablet' bằng 'mine' và 'your smart tablet' bằng 'yours'.`},{text:`This smart tablet is my, and that is your.`,correct:!1,explanation:`Sai ngữ pháp, 'my' và 'your' không đứng một mình cuối câu.`},{text:`This smart tablet is me, and that is you.`,correct:!1,explanation:`Sai đại từ tân ngữ chỉ người.`},{text:`This tablet is myself, and that is yourself.`,correct:!1,explanation:`Sai đại từ phản thân.`}]},{q:`Tìm lỗi sai trong câu sau: 'My smart video communication glasses are much lighter and faster than your.' 👓⚡`,a:[{text:`your -> yours`,correct:!0,explanation:`Đúng rồi! Ở cuối câu so sánh độc lập, phải dùng đại từ sở hữu 'yours' (thay cho 'your glasses'), không dùng tính từ sở hữu 'your' đứng trơ trọi.`},{text:`video communication -> communication video`,correct:!1,explanation:`Cụm danh từ bổ nghĩa đúng trật tự.`},{text:`lighter and faster -> lightly and fastly`,correct:!1,explanation:`Dùng cặp tính từ ngắn so sánh hơn đuôi -er là chính xác.`},{text:`glasses are -> glasses is`,correct:!1,explanation:`Danh từ 'glasses' (kính mắt) luôn ở số nhiều nên dùng to be 'are' là chuẩn.`}]},{q:`Cặp tai nghe thông minh tích hợp trí tuệ nhân tạo có khả năng phiên dịch ngôn ngữ tức thời hai chiều vào tai là: 🎧🌐`,a:[{text:`AI real-time translation earbuds`,correct:!0,explanation:`Tuyệt vời! Tai nghe thông minh phiên dịch tức thời đa ngôn ngữ là 'AI real-time translation earbuds'.`},{text:`earplugs for sleeping`,correct:!1,explanation:`Nút bịt tai chống ồn khi ngủ.`},{text:`hearing aid amplifier`,correct:!1,explanation:`Máy trợ thính khuếch đại âm thanh cho người khiếm thính.`},{text:`stethoscope`,correct:!1,explanation:`Ống nghe y tế khám nhịp tim của bác sĩ.`}]},{q:`Cuộc họp ảo nơi hình ảnh đại diện 3D (avatars) của mọi người ngồi quanh bàn họp kỹ thuật số trong không gian ảo là: 🥽🤝`,a:[{text:`virtual reality (VR) meeting`,correct:!0,explanation:`Chính xác! Cuộc họp thực tế ảo mô phỏng là 'virtual reality meeting' (hoặc 'metaverse conference').`},{text:`black-and-white fax transmission`,correct:!1,explanation:`Truyền bản sao tài liệu bằng máy fax đen trắng cổ xưa.`},{text:`smoke signal gathering`,correct:!1,explanation:`Phương thức nhóm lửa báo hiệu bằng khói thời cổ.`},{text:`carrier pigeon message`,correct:!1,explanation:`Gửi thư buộc chân chim bồ câu đưa thư.`}]},{q:`Prominent futurists predict that brain-to-brain telepathic networking will become standard ___ the late 21st century. 🧠📅`,a:[{text:`in`,correct:!0,explanation:`Chính xác! Trước các khoảng thời gian thế kỷ (in the 21st century) luôn đi với giới từ 'in'.`},{text:`at`,correct:!1,explanation:`Trước thế kỷ không dùng giới từ 'at'.`},{text:`on`,correct:!1,explanation:`Trước thế kỷ không dùng giới từ 'on'.`},{text:`of`,correct:!1,explanation:`'of' là giới từ sở hữu/thuộc về.`}]},{q:`Next-generation 6G telecommunication satellites will transmit colossal volumes of multimedia data in a tiny fraction of a ___. ⚡⏱️`,a:[{text:`second`,correct:!0,explanation:`Đúng rồi! Cụm từ 'in a fraction of a second' có nghĩa là chỉ trong chớp mắt, trong một phần nhỏ của một giây.`},{text:`century`,correct:!1,explanation:`'century' là một thế kỷ (100 năm).`},{text:`decade`,correct:!1,explanation:`'decade' là một thập kỷ (10 năm).`},{text:`year`,correct:!1,explanation:`'year' là một năm (365 ngày).`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'will / through / communicate / holograms / in / people / future / the / .' 👤✨`,a:[{text:`People will communicate through holograms in the future.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (People) + will communicate (vị ngữ) + through holograms (bổ ngữ phương tiện) + in the future (trạng ngữ thời gian).`},{text:`People will communicate in the future through holograms people.`,correct:!1,explanation:`Lặp từ thừa 'people'.`},{text:`Through holograms people will the future communicate in.`,correct:!1,explanation:`Sai trật tự trạng từ.`},{text:`Will communicate people through holograms in future the.`,correct:!1,explanation:`Đảo 'will' lên đầu trong câu trần thuật là sai.`}]},{q:`How will seamless real-time neural and AI translation devices profoundly transform human civilization? 🌍🤝`,a:[{text:`They will dissolve linguistic divides, enabling empathetic cross-cultural diplomacy and worldwide collaboration.`,correct:!0,explanation:`Chính xác! Thiết bị dịch tức thời sẽ xóa bỏ hoàn toàn rào cản ngôn ngữ, thúc đẩy sự thấu hiểu hòa bình và hợp tác toàn cầu không biên giới.`},{text:`They will completely erase all human memory of their native cultures.`,correct:!1,explanation:`Không hề xóa ký ức văn hóa cội nguồn.`},{text:`They will cause humans to cease talking and live in complete silence.`,correct:!1,explanation:`Con người vẫn giao tiếp chứ không câm lặng.`},{text:`They will ban the internet and return humanity to the Stone Age.`,correct:!1,explanation:`Không hề bài trừ internet hay kéo lùi văn minh.`}]},{q:`Ngành khoa học chế tạo các hệ thống máy móc thông minh có khả năng tư duy và tự học hỏi viết tắt là: 🤖💻`,a:[{text:`AI (Artificial Intelligence)`,correct:!0,explanation:`Chính xác! Trí tuệ nhân tạo là 'AI' (viết tắt của 'Artificial Intelligence').`},{text:`DJ (Disc Jockey)`,correct:!1,explanation:`'DJ' là người chỉnh nhạc trong các bữa tiệc.`},{text:`PR (Public Relations)`,correct:!1,explanation:`'PR' là ngành quan hệ công chúng.`},{text:`VIP (Very Important Person)`,correct:!1,explanation:`'VIP' là nhân vật quan trọng đặc biệt.`}]},{q:`Loại robot thông minh có ngoại hình, khung xương và biểu cảm khuôn mặt mô phỏng hệt như con người gọi là: 🧍‍♂️🤖`,a:[{text:`humanoid robot`,correct:!0,explanation:`Đúng rồi! Robot hình người là 'humanoid robot' (ví dụ như robot Sophia, Atlas).`},{text:`vacuum cleaner`,correct:!1,explanation:`'vacuum cleaner' là máy hút bụi gia đình.`},{text:`washing machine`,correct:!1,explanation:`'washing machine' là chiếc máy giặt quần áo.`},{text:`lawn mower`,correct:!1,explanation:`'lawn mower' là chiếc máy cắt cỏ sân vườn.`}]},{q:`Công nghệ nghiên cứu và thao tác vật liệu ở kích thước siêu hiển vi một phần tỷ mét (nanomet) gọi là: 🔬🧬`,a:[{text:`nanotechnology`,correct:!0,explanation:`Chính xác! Công nghệ nano siêu hiển vi là 'nanotechnology'.`},{text:`archaeology`,correct:!1,explanation:`'archaeology' là ngành khảo cổ học khai quật di tích cổ.`},{text:`geology`,correct:!1,explanation:`'geology' là ngành địa chất học nghiên cứu đất đá.`},{text:`astrology`,correct:!1,explanation:`'astrology' là thuật chiêm tinh bói sao.`}]},{q:`Tom said, 'I am developing an AI algorithm for language translation today.' -> Tom said that he ___ an AI algorithm for language translation that day. 💻🔄`,a:[{text:`was developing`,correct:!0,explanation:`Đúng rồi! Chuyển câu trực tiếp thì hiện tại tiếp diễn ('am developing') sang gián tiếp lùi thì thành quá khứ tiếp diễn ('was developing'), 'today' đổi thành 'that day'.`},{text:`is developing`,correct:!1,explanation:`Chưa lùi thì trong câu gián tiếp.`},{text:`developed`,correct:!1,explanation:`Hiện tại tiếp diễn lùi về quá khứ tiếp diễn, không lùi về quá khứ đơn.`},{text:`had developed`,correct:!1,explanation:`Quá khứ hoàn thành là lùi từ hiện tại hoàn thành hoặc quá khứ đơn.`}]},{q:`The senior researcher said, 'Our laboratory has successfully synthesized a cancer-fighting nanomaterial.' -> The researcher said that their laboratory ___ successfully synthesized a cancer-fighting nanomaterial. 🔬🧪`,a:[{text:`had`,correct:!0,explanation:`Chính xác! Thì hiện tại hoàn thành ('has synthesized') khi chuyển sang câu gián tiếp phải lùi thì thành quá khứ hoàn thành ('had synthesized').`},{text:`has`,correct:!1,explanation:`Chưa lùi thì trong câu tường thuật.`},{text:`was`,correct:!1,explanation:`Không dùng 'was' với phân từ hai để tạo thì hoàn thành.`},{text:`would`,correct:!1,explanation:`'would' dùng cho tương lai trong quá khứ.`}]},{q:`'Engineers will test the Mars autonomous robotic rover tomorrow,' the director announced. -> The director announced that engineers ___ test the Mars autonomous robotic rover the following day. 🚀🪐`,a:[{text:`would`,correct:!0,explanation:`Đúng rồi! Trợ động từ 'will' trong lời nói trực tiếp lùi thì thành 'would' trong câu tường thuật, và 'tomorrow' đổi thành 'the following day'.`},{text:`will`,correct:!1,explanation:`Chưa lùi thì trong câu gián tiếp.`},{text:`can`,correct:!1,explanation:`Sai trợ động từ.`},{text:`must`,correct:!1,explanation:`'must' mang nghĩa bắt buộc.`}]},{q:`Sarah said to Mark, 'You can test my new 3D bioprinter to manufacture the prototype now.' -> Sarah told Mark that he ___ test her new 3D bioprinter to manufacture the prototype then. 🖨️✨`,a:[{text:`could`,correct:!0,explanation:`Chính xác! Trợ động từ khuyết thiếu 'can' lùi thì thành 'could', đại từ sở hữu đổi ngôi, và trạng từ thời gian 'now' đổi thành 'then'.`},{text:`can`,correct:!1,explanation:`Chưa lùi thì trợ động từ khuyết thiếu.`},{text:`will`,correct:!1,explanation:`Sai trợ động từ.`},{text:`may`,correct:!1,explanation:`Chưa lùi thì.`}]},{q:`Professor David announced, 'We are installing intelligent solar arrays in our facility.' -> Professor David announced that they were installing intelligent solar arrays in ___ facility. ☀️🏢`,a:[{text:`their`,correct:!0,explanation:`Đúng rồi! Tính từ sở hữu 'our' (của chúng tôi) đổi ngôi theo chủ ngữ gián tiếp thành 'their' (của họ).`},{text:`our`,correct:!1,explanation:`Chưa đổi ngôi tính từ sở hữu.`},{text:`his`,correct:!1,explanation:`Chủ ngữ gián tiếp là 'they' (nhóm của giáo sư) nên dùng 'their'.`},{text:`them`,correct:!1,explanation:`'them' là đại từ tân ngữ, không bổ nghĩa cho danh từ facility.`}]},{q:`Thiết bị quang điện hấp thụ trực tiếp ánh sáng mặt trời để chuyển đổi thành nguồn điện sạch thân thiện môi trường là: ☀️⚡`,a:[{text:`solar panels`,correct:!0,explanation:`Chính xác! Tấm pin năng lượng mặt trời là 'solar panels'.`},{text:`diesel generators`,correct:!1,explanation:`'diesel generators' là máy phát điện chạy bằng dầu diesel xả khói đen.`},{text:`coal stoves`,correct:!1,explanation:`'coal stoves' là bếp lò đun than đá ô nhiễm.`},{text:`firewood hearths`,correct:!1,explanation:`'firewood hearths' là bếp củi đốt rơm rạ.`}]},{q:`Odd one out: Chọn từ có tiền tố mang ý nghĩa phủ định là 'un-' (khác với nhóm tiền tố phủ định 'im-'): impossible, unable, impatient, impolite 🔊`,a:[{text:`unable`,correct:!0,explanation:`Chính xác! 'unable' có tiền tố phủ định là 'un-' (un- + able), trong khi impossible, impatient, impolite đều có tiền tố phủ định là 'im-'.`},{text:`impossible`,correct:!1,explanation:`Có tiền tố phủ định 'im-' (im + possible).`},{text:`impatient`,correct:!1,explanation:`Có tiền tố phủ định 'im-' (im + patient).`},{text:`impolite`,correct:!1,explanation:`Có tiền tố phủ định 'im-' (im + polite).`}]},{q:`Odd one out: Từ nào chỉ THÀNH TỰU KHOA HỌC HIỆN ĐẠI CỦA THẾ KỶ 21, không phải dụng cụ thời nguyên thủy? 🤖`,a:[{text:`quantum supercomputer`,correct:!0,explanation:`Đúng rồi! 'quantum supercomputer' (siêu máy tính lượng tử) là đỉnh cao công nghệ cao hiện đại, còn stone axe, wooden spear, flint knife là công cụ thời kỳ đồ đá săn bắt hái lượm.`},{text:`stone axe`,correct:!1,explanation:`'stone axe' là chiếc rìu đá nguyên thủy.`},{text:`wooden spear`,correct:!1,explanation:`'wooden spear' là cây giáo gỗ săn thú thời tiền sử.`},{text:`flint knife`,correct:!1,explanation:`'flint knife' là con dao ghè đẽo bằng đá lửa.`}]},{q:`Sắp xếp chữ cái thành từ chỉ khoa học công nghệ: 'o - l - h - e - t - c - y - o - n - g' 🔬`,a:[{text:`technology`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'technology' (khoa học công nghệ).`},{text:`technolagy`,correct:!1,explanation:`Sai chữ o thành a.`},{text:`technolgy`,correct:!1,explanation:`Thiếu chữ o.`},{text:`thecnology`,correct:!1,explanation:`Sai vị trí t và h.`}]},{q:`Chuyển lời nói trực tiếp sau sang câu gián tiếp: 'The technician said: "I am recalibrating the robotic sensor right now."' 🤖🔧`,a:[{text:`The technician said that he was recalibrating the robotic sensor right then.`,correct:!0,explanation:`Chính xác! Đổi thì 'am recalibrating' -> 'was recalibrating', đổi 'right now' -> 'right then'.`},{text:`The technician said that he is recalibrating the robotic sensor right now.`,correct:!1,explanation:`Chưa lùi thì và chưa đổi trạng từ thời gian now.`},{text:`The technician said that he has recalibrated the robotic sensor then.`,correct:!1,explanation:`Lùi sai thì thành hoàn thành.`},{text:`The technician told that he was recalibrating sensor.`,correct:!1,explanation:`Dùng 'told' bắt buộc phải có tân ngữ người nghe (told someone).`}]},{q:`Tìm lỗi sai trong câu tường thuật sau: 'Dr. Watson told to me that the new synthetic vaccine was safe and effective.' 💉👨‍⚕️`,a:[{text:`told to me -> told me (hoặc said to me)`,correct:!0,explanation:`Đúng rồi! Cấu trúc đúng là 'told + tân ngữ' (told me), không bao giờ có giới từ 'to' sau động từ 'told' ('said to me' thì có 'to').`},{text:`synthetic vaccine -> vaccine synthetic`,correct:!1,explanation:`Tính từ đứng trước danh từ là đúng.`},{text:`was safe -> is safe`,correct:!1,explanation:`Lùi thì thành 'was' trong câu gián tiếp là chuẩn.`},{text:`safe and effective -> safely and effectively`,correct:!1,explanation:`Dùng cặp tính từ sau to be 'was' là chính xác.`}]},{q:`Công nghệ chế tạo các vật thể rắn ba chiều bằng cách đắp từng lớp vật liệu kế tiếp nhau theo mô hình kỹ thuật số trên máy tính là: 🖨️🏗️`,a:[{text:`3D printing`,correct:!0,explanation:`Tuyệt vời! Kỹ thuật in 3 chiều bồi đắp từng lớp là '3D printing'.`},{text:`ink stamping`,correct:!1,explanation:`Đóng dấu mộc mực đỏ lên văn bản giấy.`},{text:`spray painting`,correct:!1,explanation:`Phun sơn màu tường graffiti.`},{text:`wood carving`,correct:!1,explanation:`Đục đẽo tượng gỗ thủ công mỹ nghệ.`}]},{q:`Xe tự hành thám hiểm không người lái có bánh xích chịu lực chuyên khảo sát bề mặt đất đá gồ ghề của sao Hỏa là: 🚜🔴`,a:[{text:`Mars rover`,correct:!0,explanation:`Chính xác! Xe tự hành thám hiểm bề mặt sao Hỏa (như Curiosity, Perseverance) là 'Mars rover'.`},{text:`submarine`,correct:!1,explanation:`Tàu ngầm thám hiểm đáy biển sâu.`},{text:`speed boat`,correct:!1,explanation:`Cano cao tốc lướt sóng trên mặt nước.`},{text:`roller coaster`,correct:!1,explanation:`Tàu lượn siêu tốc trong công viên giải trí.`}]},{q:`Agricultural biotechnology enables scientists to breed genetically enhanced crops that can withstand extreme drought, salinity, and insect ___. 🌾🐛`,a:[{text:`pests`,correct:!0,explanation:`Đúng rồi! Sâu bọ phá hoại mùa màng là 'insect pests'.`},{text:`presents`,correct:!1,explanation:`'presents' là những món quà tặng sinh nhật.`},{text:`pets`,correct:!1,explanation:`'pets' là thú cưng nuôi trong nhà.`},{text:`prizes`,correct:!1,explanation:`'prizes' là những giải thưởng cuộc thi.`}]},{q:`Automated smart home systems empower householders to manage lighting, security cameras, and thermostat temperatures via smartphone ___. 📱🏠`,a:[{text:`apps`,correct:!0,explanation:`Chính xác! Ứng dụng điện thoại thông minh là 'apps' (viết tắt của applications).`},{text:`pencils`,correct:!1,explanation:`'pencils' là bút chì chuốt nhọn.`},{text:`erasers`,correct:!1,explanation:`'erasers' là cục tẩy cao su tẩy chì.`},{text:`scissors`,correct:!1,explanation:`'scissors' là chiếc kéo cắt giấy kim loại.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'that / robots / said / will / He / dangerous / replace / humans / in / tasks / .' 🤖🦾`,a:[{text:`He said that robots would replace humans in dangerous tasks.`,correct:!0,explanation:`Xuất sắc! Cấu trúc câu tường thuật gián tiếp: S + said that + robots would replace humans in dangerous tasks (Anh ấy nói rằng robot sẽ thay thế con người trong các công việc nguy hiểm).`},{text:`He said that robots will replace in dangerous tasks humans.`,correct:!1,explanation:`Sai trật tự tân ngữ 'humans'.`},{text:`Robots said that he would replace humans in dangerous tasks.`,correct:!1,explanation:`Ngược chủ ngữ vị ngữ.`},{text:`He that robots would said replace humans in tasks.`,correct:!1,explanation:`Động từ tường thuật 'said' bị đặt sai vị trí.`}]},{q:`What ethical dilemmas must international scientists urgently resolve regarding the rapid deployment of autonomous AI algorithms? ⚖️🧠`,a:[{text:`Preventing algorithmic algorithmic bias, safeguarding personal privacy, and preserving absolute human accountability.`,correct:!0,explanation:`Chính xác! Trách nhiệm đạo đức trong kỷ nguyên AI là ngăn ngừa định kiến thiên vị, bảo vệ quyền riêng tư dữ liệu và đảm bảo quyền kiểm soát tối thượng của con người.`},{text:`Replacing all school teachers with completely silent toy machines.`,correct:!1,explanation:`Không thể thay thế hoàn toàn tình cảm và sự định hướng của người thầy.`},{text:`Banning all medical research and dismantling all hospitals.`,correct:!1,explanation:`Không ai bài xích nghiên cứu y học.`},{text:`Mandating all humans to live without electricity and books.`,correct:!1,explanation:`Không ai bắt loài người từ bỏ điện sinh hoạt.`}]},{q:`Hành tinh khí khổng lồ lớn nhất trong Hệ Mặt Trời có Vết Đỏ Lớn kỳ vĩ và hơn 90 vệ tinh tự nhiên quay quanh là: 🪐🔴`,a:[{text:`Jupiter`,correct:!0,explanation:`Chính xác! Sao Mộc là hành tinh lớn nhất trong Hệ Mặt Trời tiếng Anh là 'Jupiter'.`},{text:`Mercury`,correct:!1,explanation:`'Mercury' là Sao Thủy, hành tinh nhỏ nhất gần Mặt Trời nhất.`},{text:`Venus`,correct:!1,explanation:`'Venus' là Sao Kim, hành tinh sáng và nóng nhất.`},{text:`Mars`,correct:!1,explanation:`'Mars' là Sao Hỏa, hành tinh đỏ thứ tư.`}]},{q:`Hành tinh thứ tư tính từ Mặt Trời được mệnh danh là 'Hành tinh Đỏ' do bề mặt chứa đầy oxit sắt rỉ sét là: 🔴🚀`,a:[{text:`Mars`,correct:!0,explanation:`Đúng rồi! Sao Hỏa là 'Mars' (The Red Planet).`},{text:`Earth`,correct:!1,explanation:`'Earth' là Trái Đất quê hương của chúng ta.`},{text:`Neptune`,correct:!1,explanation:`'Neptune' là Sao Hải Vương xa xôi xanh thẳm.`},{text:`Saturn`,correct:!1,explanation:`'Saturn' là Sao Thổ nổi tiếng với vành đai vành khuyên tuyệt đẹp.`}]},{q:`Sinh vật thông minh giả định sinh sống ngoài vũ trụ xa xôi trong phim ảnh khoa học viễn tưởng tiếng Anh gọi là: 👽🛸`,a:[{text:`alien (extraterrestrial)`,correct:!0,explanation:`Chính xác! Người ngoài hành tinh là 'alien' hoặc 'extraterrestrial' (ET).`},{text:`earthling`,correct:!1,explanation:`'earthling' là người Trái Đất cư dân địa cầu.`},{text:`dinosaur`,correct:!1,explanation:`'dinosaur' là loài khủng long tiền sử đã tuyệt chủng.`},{text:`mammal`,correct:!1,explanation:`'mammal' là động vật có vú nuôi con bằng sữa mẹ.`}]},{q:`'Do you believe extraterrestrial civilizations exist beyond our galaxy?' asked Nam. -> Nam asked me ___ I believed extraterrestrial civilizations existed beyond our galaxy. 🌌🛸`,a:[{text:`if (whether)`,correct:!0,explanation:`Đúng rồi! Trong câu hỏi Yes/No tường thuật gián tiếp, dùng từ nối 'if' hoặc 'whether', sau đó là S + V lùi thì ('believed').`},{text:`that`,correct:!1,explanation:`Không dùng liên từ 'that' trong câu hỏi gián tiếp.`},{text:`what`,correct:!1,explanation:`'what' chỉ dùng cho Wh-question có từ để hỏi what.`},{text:`did`,correct:!1,explanation:`Trong câu tường thuật câu hỏi tuyệt đối không dùng trợ động từ đảo ngữ 'did'.`}]},{q:`'Where did the autonomous robotic lander touch down?' asked the journalist. -> The journalist asked where the autonomous robotic lander ___ down. 🚀🪐`,a:[{text:`had touched`,correct:!0,explanation:`Chính xác! Câu hỏi trực tiếp ở quá khứ đơn ('did... touch down') khi chuyển sang gián tiếp phải lùi thì thành quá khứ hoàn thành ('had touched down') và bỏ trợ động từ đảo ngữ.`},{text:`did touch`,correct:!1,explanation:`Tuyệt đối không đảo trợ động từ trong câu hỏi gián tiếp.`},{text:`touches`,correct:!1,explanation:`Hiện tại đơn sai thì.`},{text:`would touch`,correct:!1,explanation:`Dùng cho tương lai trong quá khứ.`}]},{q:`'Can humans breathe freely on the surface of Mars without spacesuits?' asked Mai. -> Mai asked if humans ___ breathe freely on the surface of Mars without spacesuits. 🔴👩‍🚀`,a:[{text:`could`,correct:!0,explanation:`Đúng rồi! Trợ động từ khuyết thiếu 'can' khi chuyển sang câu tường thuật gián tiếp phải lùi thì thành 'could'.`},{text:`can`,correct:!1,explanation:`Chưa lùi thì trợ động từ.`},{text:`will`,correct:!1,explanation:`Sai trợ động từ.`},{text:`must`,correct:!1,explanation:`'must' mang nghĩa bắt buộc, không tương ứng với 'can'.`}]},{q:`'What are you observing through the high-powered telescope right now?' the astronomer asked. -> The astronomer asked what I ___ observing through the high-powered telescope right then. 🔭🌌`,a:[{text:`was`,correct:!0,explanation:`Chính xác! Câu hỏi Wh-question trực tiếp thì hiện tại tiếp diễn ('are you observing') đổi sang gián tiếp lùi thì thành 'what I was observing' (trật tự khẳng định S + V).`},{text:`am`,correct:!1,explanation:`Chưa lùi thì to be.`},{text:`was I`,correct:!1,explanation:`Sai trật tự, câu hỏi gián tiếp không được đảo ngữ vị ngữ lên trước chủ ngữ.`},{text:`were`,correct:!1,explanation:`Chủ ngữ ngôi thứ nhất số ít 'I' đi với 'was', không đi với 'were'.`}]},{q:`'Why do astronauts float weightlessly inside the orbital station?' asked Tommy. -> Tommy asked why astronauts ___ weightlessly inside the orbital station. 🛰️👨‍🚀`,a:[{text:`floated`,correct:!0,explanation:`Đúng rồi! Câu hỏi trực tiếp thì hiện tại đơn ('do astronauts float') khi chuyển sang gián tiếp bỏ trợ động từ 'do' và lùi thì động từ thành quá khứ đơn 'floated'.`},{text:`do float`,correct:!1,explanation:`Không dùng trợ động từ 'do' trong câu tường thuật gián tiếp.`},{text:`float`,correct:!1,explanation:`Chưa lùi thì.`},{text:`did float`,correct:!1,explanation:`Không dùng trợ động từ đảo ngữ 'did'.`}]},{q:`Vùng không gian quanh một ngôi sao có nhiệt độ vừa phải giúp nước duy trì ở dạng lỏng để sự sống sinh sôi gọi là: 🪐💧`,a:[{text:`habitable zone (Goldilocks zone)`,correct:!0,explanation:`Chính xác! Vùng có thể sống được (nhiệt độ không quá nóng cũng không quá lạnh) là 'habitable zone' hoặc 'Goldilocks zone'.`},{text:`danger zone`,correct:!1,explanation:`Khu vực nguy hiểm bom đạn.`},{text:`freezing point`,correct:!1,explanation:`Điểm đóng băng nước thành đá.`},{text:`boiling limit`,correct:!1,explanation:`Giới hạn sôi bốc hơi.`}]},{q:`Odd one out: Chọn từ có hậu tố mang ý nghĩa 'thiếu/không có' là '-less' (khác với nhóm hậu tố mang ý nghĩa 'tràn đầy' là '-ful'): powerful, helpful, hopeful, endless 🔊`,a:[{text:`endless`,correct:!0,explanation:`Chính xác! 'endless' có hậu tố '-less' mang nghĩa không có điểm dừng / vô tận, trong khi powerful, helpful, hopeful đều mang hậu tố '-ful' (đầy sức mạnh, hữu ích, đầy hy vọng).`},{text:`powerful`,correct:!1,explanation:`Có hậu tố mang nghĩa đầy đủ '-ful' (đầy quyền uy).`},{text:`helpful`,correct:!1,explanation:`Có hậu tố mang nghĩa đầy đủ '-ful' (rất hữu ích).`},{text:`hopeful`,correct:!1,explanation:`Có hậu tố mang nghĩa đầy đủ '-ful' (tràn trề hy vọng).`}]},{q:`Odd one out: Thiên thể nào là NGÔI SAO TỰ PHÁT QUANG RỰC RỠ, không phải hành tinh quay quanh quỹ đạo? ☀️`,a:[{text:`Sun`,correct:!0,explanation:`Đúng rồi! 'Sun' (Mặt Trời) là một ngôi sao tự phát sáng nằm ở trung tâm thái dương hệ, còn Mercury, Saturn, Neptune là các hành tinh quay quanh nó.`},{text:`Mercury`,correct:!1,explanation:`'Mercury' là Sao Thủy, hành tinh nhỏ nhất gần Mặt Trời.`},{text:`Saturn`,correct:!1,explanation:`'Saturn' là Sao Thổ, hành tinh khí có vành khuyên.`},{text:`Neptune`,correct:!1,explanation:`'Neptune' là Sao Hải Vương, hành tinh thứ tám.`}]},{q:`Sắp xếp chữ cái thành từ chỉ hành tinh thiên thể: 'a - l - e - t - n - p' 🪐`,a:[{text:`planet`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'planet' (hành tinh).`},{text:`planete`,correct:!1,explanation:`Thừa chữ e cuối từ.`},{text:`planit`,correct:!1,explanation:`Sai chữ e thành i.`},{text:`palnet`,correct:!1,explanation:`Sai vị trí a và l.`}]},{q:`Chuyển câu hỏi trực tiếp sau sang câu gián tiếp: 'The student asked: "Is there liquid water beneath the icy crust of Europa?"' 🌊❄️`,a:[{text:`The student asked if there was liquid water beneath the icy crust of Europa.`,correct:!0,explanation:`Chính xác! Câu hỏi Yes/No gián tiếp dùng 'if', to be 'is' lùi thì thành 'was'.`},{text:`The student asked is there liquid water beneath Europa.`,correct:!1,explanation:`Chưa bỏ đảo ngữ và chưa lùi thì.`},{text:`The student asked that there was water beneath Europa.`,correct:!1,explanation:`Dùng sai liên từ 'that' trong câu hỏi.`},{text:`The student asked if was there liquid water beneath Europa.`,correct:!1,explanation:`Sai trật tự to be 'was' vẫn đứng trước chủ ngữ.`}]},{q:`Tìm lỗi sai trong câu tường thuật câu hỏi sau: 'The teacher asked Nam what was the largest planet in our solar system.' 🪐🔭`,a:[{text:`what was the largest planet -> what the largest planet was`,correct:!0,explanation:`Đúng rồi! Trong câu hỏi gián tiếp, trật tự từ phải là trật tự câu khẳng định: Từ để hỏi + S + V (what the largest planet was), không được đảo to be 'was' lên trước chủ ngữ.`},{text:`The teacher asked -> The teacher said to`,correct:!1,explanation:`'asked' trong câu tường thuật hỏi là chuẩn xác.`},{text:`largest planet -> larger planet`,correct:!1,explanation:`So sánh nhất có 'the' đi với tính từ đuôi -est là đúng.`},{text:`in our solar system -> on our solar system`,correct:!1,explanation:`Giới từ 'in' chỉ bên trong hệ mặt trời là chuẩn.`}]},{q:`Thuật ngữ chỉ vật thể bay không xác định nghi ngờ là phi thuyền của nền văn minh ngoài hành tinh viết tắt là: 🛸👽`,a:[{text:`UFO (Unidentified Flying Object)`,correct:!0,explanation:`Chính xác! Vật thể bay không xác định là 'UFO' (Unidentified Flying Object).`},{text:`GPS (Global Positioning System)`,correct:!1,explanation:`'GPS' là hệ thống định vị toàn cầu trên điện thoại.`},{text:`USB (Universal Serial Bus)`,correct:!1,explanation:`'USB' là cổng kết nối truyền tải dữ liệu máy tính.`},{text:`CEO (Chief Executive Officer)`,correct:!1,explanation:`'CEO' là tổng giám đốc điều hành công ty.`}]},{q:`Bộ trang phục chuyên dụng có mũ bảo hộ kín khí và bình oxy giúp các phi hành gia bước ra khoảng không vũ trụ là: 👨‍🚀🚀`,a:[{text:`spacesuit`,correct:!0,explanation:`Tuyệt vời! Bộ quần áo phi hành gia vũ trụ là 'spacesuit'.`},{text:`swimsuit`,correct:!1,explanation:`'swimsuit' là bộ đồ bơi tắm biển.`},{text:`raincoat`,correct:!1,explanation:`'raincoat' là chiếc áo mưa che mưa gió.`},{text:`nightgown`,correct:!1,explanation:`'nightgown' là bộ váy ngủ mặc ban đêm.`}]},{q:`Lực hút vô hình giữ cho các hành tinh quay đều quanh Mặt Trời và giữ cho con người không bị trôi nổi bay vào không gian là: 🌍🧲`,a:[{text:`gravity`,correct:!0,explanation:`Chính xác! Trọng lực / lực hấp dẫn là 'gravity'.`},{text:`friction`,correct:!1,explanation:`'friction' là lực ma sát cản trở chuyển động.`},{text:`magnetism`,correct:!1,explanation:`'magnetism' là lực từ tính nam châm.`},{text:`electricity`,correct:!1,explanation:`'electricity' là nguồn điện năng.`}]},{q:`Ngành dịch vụ du lịch mới nổi đưa du khách giàu có bay ra ngoài quỹ đạo Trái Đất để ngắm nhìn hành tinh xanh gọi là: 🚀🌌`,a:[{text:`space tourism`,correct:!0,explanation:`Đúng rồi! Ngành du lịch vũ trụ thám hiểm không gian là 'space tourism'.`},{text:`ecotourism`,correct:!1,explanation:`'ecotourism' là du lịch sinh thái rừng ngập mặn.`},{text:`historical tourism`,correct:!1,explanation:`'historical tourism' là du lịch tham quan di tích lịch sử.`},{text:`culinary tourism`,correct:!1,explanation:`'culinary tourism' là du lịch ẩm thực thưởng thức món ngon.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'asked / planets / whether / life / on / He / existed / other / .' 👽🪐`,a:[{text:`He asked whether life existed on other planets.`,correct:!0,explanation:`Xuất sắc! Cấu trúc: S (He) + asked + whether + S (life) + V (existed) + on other planets.`},{text:`He asked whether on other planets life existed whether.`,correct:!1,explanation:`Lặp từ thừa 'whether' ở cuối câu.`},{text:`Whether life existed on other planets he asked not.`,correct:!1,explanation:`Sai cấu trúc câu gián tiếp.`},{text:`He life asked whether existed on other planets.`,correct:!1,explanation:`Tân ngữ 'life' chen sai vị trí trước từ nối.`}]},{q:`Why is discovering liquid water on distant exoplanets considered the ultimate breakthrough in searching for extraterrestrial life? 💧🧬`,a:[{text:`Because liquid water serves as the indispensable universal solvent for biological biochemistry and cellular life.`,correct:!0,explanation:`Chính xác! Nước ở thể lỏng là dung môi hòa tan vạn năng tối cần thiết cho mọi phản ứng sinh hóa tế bào để sự sống hình thành và duy trì.`},{text:`Because space aliens drink boiling toxic molten lava to stay hydrated.`,correct:!1,explanation:`Người ngoài hành tinh không uống dung nham sôi độc hại.`},{text:`Because liquid water instantly dissolves any solid rocky planet.`,correct:!1,explanation:`Nước không làm tan chảy cả hành tinh đá.`},{text:`Because spaceships can only fly when floating on surface water rivers.`,correct:!1,explanation:`Tàu vũ trụ bay trong chân không chứ không cần thả trôi sông.`}]},{q:`What nationality is a person from Japan?`,a:[{text:`Japanese`,correct:!0,explanation:`People from Japan are Japanese.`},{text:`Japanian`,correct:!1,explanation:`The correct nationality word is Japanese.`},{text:`Japanish`,correct:!1,explanation:`Japanish is not the correct word.`},{text:`Chinese`,correct:!1,explanation:`Chinese refers to China.`}]},{q:`Which country is famous for the Eiffel Tower?`,a:[{text:`France`,correct:!0,explanation:`The Eiffel Tower is in France.`},{text:`Italy`,correct:!1,explanation:`Italy is famous for the Colosseum.`},{text:`Australia`,correct:!1,explanation:`Australia is a different country.`},{text:`Brazil`,correct:!1,explanation:`Brazil is in South America.`}]},{q:`Where is New York?`,a:[{text:`In the USA.`,correct:!0,explanation:`New York is a city in the United States.`},{text:`In Canada.`,correct:!1,explanation:`Canada is north of the USA.`},{text:`In Spain.`,correct:!1,explanation:`Spain is in Europe.`},{text:`In Egypt.`,correct:!1,explanation:`Egypt is in Africa.`}]},{q:`People from Australia are ___.`,a:[{text:`Australian`,correct:!0,explanation:`Australian is the nationality adjective.`},{text:`Austria`,correct:!1,explanation:`Austria is a different country.`},{text:`Australic`,correct:!1,explanation:`Australic is not the nationality word.`},{text:`Australish`,correct:!1,explanation:`Australish is incorrect.`}]},{q:`Which language do people commonly speak in England?`,a:[{text:`English`,correct:!0,explanation:`English is the main language of England.`},{text:`French`,correct:!1,explanation:`French is mainly spoken in France.`},{text:`Japanese`,correct:!1,explanation:`Japanese is spoken in Japan.`},{text:`Arabic`,correct:!1,explanation:`Arabic is used in many Arab countries.`}]},{q:`My uncle ___ from Canada.`,a:[{text:`is`,correct:!0,explanation:`Use 'is' with a singular person.`},{text:`are`,correct:!1,explanation:`'Are' is used with you or plural subjects.`},{text:`am`,correct:!1,explanation:`'Am' is used with I.`},{text:`be`,correct:!1,explanation:`The sentence needs the verb is.`}]},{q:`___ your parents Vietnamese?`,a:[{text:`Are`,correct:!0,explanation:`Use 'Are' with plural parents.`},{text:`Is`,correct:!1,explanation:`'Is' is singular.`},{text:`Am`,correct:!1,explanation:`'Am' is used with I.`},{text:`Do`,correct:!1,explanation:`Nationality uses the verb be here.`}]},{q:`What is the capital city of Vietnam?`,a:[{text:`Hanoi`,correct:!0,explanation:`Hanoi is the capital of Vietnam.`},{text:`Hue`,correct:!1,explanation:`Hue is a historic city.`},{text:`Da Nang`,correct:!1,explanation:`Da Nang is a coastal city.`},{text:`Can Tho`,correct:!1,explanation:`Can Tho is in the Mekong Delta.`}]},{q:`Which city is in Japan?`,a:[{text:`Tokyo`,correct:!0,explanation:`Tokyo is the capital of Japan.`},{text:`Seoul`,correct:!1,explanation:`Seoul is in South Korea.`},{text:`London`,correct:!1,explanation:`London is in England.`},{text:`Moscow`,correct:!1,explanation:`Moscow is in Russia.`}]},{q:`There ___ a map on the classroom wall.`,a:[{text:`is`,correct:!0,explanation:`Use 'is' with one map.`},{text:`are`,correct:!1,explanation:`'Are' is for plural nouns.`},{text:`am`,correct:!1,explanation:`'Am' is used with I.`},{text:`be`,correct:!1,explanation:`The correct form is is.`}]},{q:`There ___ many pupils in the playground.`,a:[{text:`are`,correct:!0,explanation:`Use 'are' with a plural noun.`},{text:`is`,correct:!1,explanation:`'Is' is for one thing.`},{text:`am`,correct:!1,explanation:`'Am' is used with I.`},{text:`be`,correct:!1,explanation:`The sentence needs are.`}]},{q:`The art room is ___ the music room.`,a:[{text:`next to`,correct:!0,explanation:`'Next to' means beside.`},{text:`under`,correct:!1,explanation:`'Under' means below.`},{text:`inside`,correct:!1,explanation:`The room is not inside another room.`},{text:`through`,correct:!1,explanation:`'Through' describes movement across.`}]},{q:`Turn left ___ the library.`,a:[{text:`at`,correct:!0,explanation:`Use 'at' for a point or place.`},{text:`in`,correct:!1,explanation:`'In' means inside.`},{text:`on`,correct:!1,explanation:`'On' means on a surface.`},{text:`from`,correct:!1,explanation:`'From' shows a starting point.`}]},{q:`A place where you see paintings is an ___.`,a:[{text:`art gallery`,correct:!0,explanation:`An art gallery displays paintings.`},{text:`airport`,correct:!1,explanation:`An airport is for air travel.`},{text:`aquarium`,correct:!1,explanation:`An aquarium has fish and sea life.`},{text:`stadium`,correct:!1,explanation:`A stadium hosts sports events.`}]},{q:`A place where planes arrive and leave is an ___.`,a:[{text:`airport`,correct:!0,explanation:`Planes use an airport.`},{text:`office`,correct:!1,explanation:`An office is a workplace.`},{text:`island`,correct:!1,explanation:`An island is land surrounded by water.`},{text:`apartment`,correct:!1,explanation:`An apartment is a home.`}]},{q:`You can borrow books at a ___.`,a:[{text:`library`,correct:!0,explanation:`Libraries lend books.`},{text:`cinema`,correct:!1,explanation:`A cinema shows films.`},{text:`bakery`,correct:!1,explanation:`A bakery sells bread.`},{text:`factory`,correct:!1,explanation:`A factory makes products.`}]},{q:`The opposite of 'cheap' is ___.`,a:[{text:`expensive`,correct:!0,explanation:`Expensive is the opposite of cheap.`},{text:`easy`,correct:!1,explanation:`Easy is the opposite of difficult.`},{text:`empty`,correct:!1,explanation:`Empty is the opposite of full.`},{text:`quiet`,correct:!1,explanation:`Quiet is the opposite of noisy.`}]},{q:`The opposite of 'noisy' is ___.`,a:[{text:`quiet`,correct:!0,explanation:`Quiet is the opposite of noisy.`},{text:`busy`,correct:!1,explanation:`Busy describes activity.`},{text:`strong`,correct:!1,explanation:`Strong describes power.`},{text:`bright`,correct:!1,explanation:`Bright describes light.`}]},{q:`The opposite of 'difficult' is ___.`,a:[{text:`easy`,correct:!0,explanation:`Easy is the opposite of difficult.`},{text:`heavy`,correct:!1,explanation:`Heavy is the opposite of light.`},{text:`slow`,correct:!1,explanation:`Slow is the opposite of fast.`},{text:`weak`,correct:!1,explanation:`Weak is the opposite of strong.`}]},{q:`A person who flies a plane is a ___.`,a:[{text:`pilot`,correct:!0,explanation:`A pilot flies a plane.`},{text:`nurse`,correct:!1,explanation:`A nurse cares for patients.`},{text:`waiter`,correct:!1,explanation:`A waiter serves food.`},{text:`farmer`,correct:!1,explanation:`A farmer works on a farm.`}]},{q:`A person who helps sick people in hospital is a ___.`,a:[{text:`nurse`,correct:!0,explanation:`Nurses care for sick people.`},{text:`mechanic`,correct:!1,explanation:`A mechanic repairs vehicles.`},{text:`singer`,correct:!1,explanation:`A singer performs songs.`},{text:`postman`,correct:!1,explanation:`A postman delivers letters.`}]},{q:`My mother works in a restaurant. She is a ___.`,a:[{text:`chef`,correct:!0,explanation:`A chef cooks in a restaurant.`},{text:`pilot`,correct:!1,explanation:`A pilot flies planes.`},{text:`farmer`,correct:!1,explanation:`A farmer grows crops.`},{text:`artist`,correct:!1,explanation:`An artist creates art.`}]},{q:`He ___ breakfast at seven every morning.`,a:[{text:`has`,correct:!0,explanation:`Use has with he in the present simple.`},{text:`have`,correct:!1,explanation:`Have is used with I, you, we and they.`},{text:`having`,correct:!1,explanation:`The sentence needs a finite verb.`},{text:`had`,correct:!1,explanation:`Had is past tense.`}]},{q:`They ___ football after school on Fridays.`,a:[{text:`play`,correct:!0,explanation:`Use the base verb with they.`},{text:`plays`,correct:!1,explanation:`Plays is for he, she or it.`},{text:`playing`,correct:!1,explanation:`The sentence describes a routine.`},{text:`played`,correct:!1,explanation:`Played is past tense.`}]},{q:`Look! The children ___ a kite.`,a:[{text:`are flying`,correct:!0,explanation:`Look signals an action happening now.`},{text:`fly`,correct:!1,explanation:`The present continuous is needed.`},{text:`flies`,correct:!1,explanation:`Flies is singular present simple.`},{text:`flew`,correct:!1,explanation:`Flew is past tense.`}]},{q:`Listen! Someone ___ at the door.`,a:[{text:`is knocking`,correct:!0,explanation:`Listen signals an action happening now.`},{text:`knock`,correct:!1,explanation:`Use the present continuous here.`},{text:`knocks`,correct:!1,explanation:`Knocks describes a habit.`},{text:`knocked`,correct:!1,explanation:`Knocked is past tense.`}]},{q:`___ you doing your homework now?`,a:[{text:`Are`,correct:!0,explanation:`Use Are with you in the present continuous.`},{text:`Do`,correct:!1,explanation:`Do forms present simple questions.`},{text:`Is`,correct:!1,explanation:`Is is used with he, she or it.`},{text:`Am`,correct:!1,explanation:`Am is used with I.`}]},{q:`What ___ she doing?`,a:[{text:`is`,correct:!0,explanation:`Use is with she in the present continuous.`},{text:`are`,correct:!1,explanation:`Are is used with you, we and they.`},{text:`do`,correct:!1,explanation:`Do is a present simple auxiliary.`},{text:`does`,correct:!1,explanation:`Does is a present simple auxiliary.`}]},{q:`My brother can ___ a bicycle.`,a:[{text:`ride`,correct:!0,explanation:`Use the base verb after can.`},{text:`rides`,correct:!1,explanation:`Do not add -s after can.`},{text:`riding`,correct:!1,explanation:`Use the base form after can.`},{text:`rode`,correct:!1,explanation:`Rode is past tense.`}]},{q:`Can you ___ this word?`,a:[{text:`spell`,correct:!0,explanation:`Use the base verb after can.`},{text:`spells`,correct:!1,explanation:`Do not add -s after can.`},{text:`spelling`,correct:!1,explanation:`The base form is needed.`},{text:`spelled`,correct:!1,explanation:`Spelled is past tense.`}]},{q:`Would you like ___ orange juice?`,a:[{text:`some`,correct:!0,explanation:`Use some in a polite offer.`},{text:`any`,correct:!1,explanation:`Any is common in questions about quantity, not this offer.`},
