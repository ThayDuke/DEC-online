const fullQuestionBank=[{q:`Students in Vietnam usually wear their school ___ on Mondays. 👔 (Học sinh mặc đồng phục đến trường)`,a:[{text:`uniform`,correct:!0,explanation:`Chính xác! 'uniform' là đồng phục học sinh.`},{text:`clothes`,correct:!1,explanation:`'clothes' là quần áo nói chung, không cụ thể là đồng phục trường.`},{text:`calculator`,correct:!1,explanation:`'calculator' là máy tính cầm tay.`},{text:`compass`,correct:!1,explanation:`'compass' là chiếc compa dùng trong môn toán.`}]},{q:`Dụng cụ học tập dùng để vẽ các đường tròn chính xác trong môn Hình học là gì? 📐`,a:[{text:`compass`,correct:!0,explanation:`Đúng rồi! Chiếc compa là 'compass'.`},{text:`pencil sharpener`,correct:!1,explanation:`'pencil sharpener' là chiếc gọt bút chì.`},{text:`rubber`,correct:!1,explanation:`'rubber' là cục gôm tẩy.`},{text:`pencil case`,correct:!1,explanation:`'pencil case' là hộp đựng bút.`}]},{q:`Chiếc máy tính cầm tay giúp tính toán các phép cộng trừ nhân chia nhanh chóng là gì? 🔢`,a:[{text:`calculator`,correct:!0,explanation:`Xuất sắc! Máy tính cầm tay trong tiếng Anh là 'calculator'.`},{text:`computer`,correct:!1,explanation:`'computer' là máy vi tính để bàn.`},{text:`ruler`,correct:!1,explanation:`'ruler' là cây thước kẻ.`},{text:`textbook`,correct:!1,explanation:`'textbook' là sách giáo khoa.`}]},{q:`Loại trường học mà học sinh học tập, ăn uống và ngủ nghỉ nội trú tại trường gọi là gì? 🏫`,a:[{text:`boarding school`,correct:!0,explanation:`Chính xác! 'boarding school' là trường nội trú.`},{text:`international school`,correct:!1,explanation:`'international school' là trường quốc tế.`},{text:`primary school`,correct:!1,explanation:`'primary school' là trường tiểu học.`},{text:`secondary school`,correct:!1,explanation:`'secondary school' là trường trung học cơ sở.`}]},{q:`Nick is very ___. He always has new and interesting ideas for art projects. 🎨`,a:[{text:`creative`,correct:!0,explanation:`Tuyệt vời! 'creative' nghĩa là sáng tạo, luôn có ý tưởng mới mẻ.`},{text:`shy`,correct:!1,explanation:`'shy' là nhút nhát, e thẹn.`},{text:`lazy`,correct:!1,explanation:`'lazy' là lười biếng, ngại hoạt động.`},{text:`smart`,correct:!1,explanation:`Mặc dù 'smart' là thông minh, nhưng nói về ý tưởng nghệ thuật thì 'creative' là chính xác nhất.`}]},{q:`Nam usually ___ his homework in the evening before going to bed. ✍️`,a:[{text:`does`,correct:!0,explanation:`Đúng rồi! Cụm từ làm bài tập về nhà là 'do homework', với chủ ngữ số ít 'Nam' chia thành 'does'.`},{text:`makes`,correct:!1,explanation:`Không dùng 'make homework', phải dùng 'do homework'.`},{text:`plays`,correct:!1,explanation:`'play' là chơi thể thao hoặc trò chơi.`},{text:`studies`,correct:!1,explanation:`Thường nói 'study for a test', làm bài tập về nhà cụ thể dùng 'does his homework'.`}]},{q:`Môn học nghiên cứu về các sự kiện lịch sử của dân tộc và thế giới trong quá khứ là gì? 🏛️`,a:[{text:`history`,correct:!0,explanation:`Chính xác! Môn Lịch sử là 'history'.`},{text:`geography`,correct:!1,explanation:`'geography' là môn Địa lý.`},{text:`science`,correct:!1,explanation:`'science' là môn Khoa học tự nhiên.`},{text:`literature`,correct:!1,explanation:`'literature' là môn Ngữ văn.`}]},{q:`Môn học giúp học sinh khám phá bản đồ địa hình, các châu lục và thời tiết là gì? 🗺️`,a:[{text:`geography`,correct:!0,explanation:`Đúng rồi! Môn Địa lý trong tiếng Anh là 'geography'.`},{text:`physics`,correct:!1,explanation:`'physics' là môn Vật lý.`},{text:`history`,correct:!1,explanation:`'history' là môn Lịch sử.`},{text:`biology`,correct:!1,explanation:`'biology' là môn Sinh học.`}]},{q:`Trạng từ chỉ tần suất 'always' (luôn luôn) đứng ở vị trí nào so với động từ to be và động từ thường? ⏱️`,a:[{text:`Đứng sau to be và đứng trước động từ thường`,correct:!0,explanation:`Chính xác! Vị trí của trạng từ tần suất: Sau to be (is always), trước V thường (always gets up).`},{text:`Đứng trước to be và sau động từ thường`,correct:!1,explanation:`Ngược quy tắc ngữ pháp.`},{text:`Luôn luôn đứng ở cuối câu`,correct:!1,explanation:`Trạng từ tần suất như always, usually không đứng cuối câu.`},{text:`Luôn luôn đứng ở đầu câu`,correct:!1,explanation:`Chỉ có Sometimes mới hay đứng đầu câu.`}]},{q:`Chọn câu có vị trí trạng từ chỉ tần suất chính xác nhất trong tiếng Anh: ⏰`,a:[{text:`She is always late for school on rainy days.`,correct:!0,explanation:`Đúng rồi! Trạng từ 'always' đứng ngay sau động từ to be 'is'.`},{text:`She always is late for school on rainy days.`,correct:!1,explanation:`Trạng từ tần suất không đứng trước động từ to be.`},{text:`She is late always for school on rainy days.`,correct:!1,explanation:`Đặt sai vị trí giữa tính từ và to be.`},{text:`Always she is late for school on rainy days.`,correct:!1,explanation:`'Always' không đứng đầu câu.`}]},{q:`Every morning, Duy ___ cycling to school with his close classmates. 🚲`,a:[{text:`goes`,correct:!0,explanation:`Chính xác! Cụm từ đi xe đạp là 'go cycling', chủ ngữ ngôi thứ 3 số ít 'Duy' chia là 'goes'.`},{text:`plays`,correct:!1,explanation:`'play' đi với các môn bóng thể thao (play football, play chess).`},{text:`does`,correct:!1,explanation:`'do' đi với môn thể dục (do judo, do karate).`},{text:`takes`,correct:!1,explanation:`Không nói 'takes cycling'.`}]},{q:`My brother often ___ judo at the sports club twice a week. 🥋`,a:[{text:`does`,correct:!0,explanation:`Đúng rồi! Đi với các môn võ thuật không dùng bóng như judo, karate, taekwondo ta dùng 'do/does'.`},{text:`plays`,correct:!1,explanation:`'play' chỉ dùng cho môn có bóng hoặc thi đấu đối kháng có đồng đội.`},{text:`goes`,correct:!1,explanation:`'go' dùng với hoạt động đuôi -ing (go swimming, go cycling).`},{text:`studies`,correct:!1,explanation:`Không nói 'studies judo' trong sinh hoạt CLB.`}]},{q:`Odd one out: Chọn từ có phần gạch chân phát âm khác (/ɑː/ vs /ʌ/): smart, art, star, subject 🔤`,a:[{text:`subject`,correct:!0,explanation:`Chính xác! 'subject' phát âm là /ʌ/, trong khi smart, art, star đều có âm /ɑː/ dài.`},{text:`smart`,correct:!1,explanation:`'smart' phát âm âm /ɑː/ dài.`},{text:`art`,correct:!1,explanation:`'art' phát âm âm /ɑː/ dài.`},{text:`star`,correct:!1,explanation:`'star' phát âm âm /ɑː/ dài.`}]},{q:`Odd one out: Từ nào có nhóm nghĩa KHÔNG CÙNG LOẠI: compass, calculator, rubber, bedroom 🎒`,a:[{text:`bedroom`,correct:!0,explanation:`Đúng rồi! 'bedroom' là phòng ngủ, còn compass, calculator, rubber là dụng cụ học tập.`},{text:`compass`,correct:!1,explanation:`'compass' là chiếc compa học tập.`},{text:`calculator`,correct:!1,explanation:`'calculator' là máy tính cầm tay.`},{text:`rubber`,correct:!1,explanation:`'rubber' là cục tẩy bút chì.`}]},{q:`Sắp xếp chữ cái thành từ chỉ người bạn cùng lớp: 'a - s - m - l - a - t - c - s - e' 🧑‍🤝‍🧑`,a:[{text:`classmate`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'classmate' (bạn cùng lớp).`},{text:`classtame`,correct:!1,explanation:`Sai vị trí chữ t và m.`},{text:`classemat`,correct:!1,explanation:`Sai chính tả tiếng Anh.`},{text:`classroom`,correct:!1,explanation:`Thiếu chữ r và o.`}]},{q:`Tìm lỗi sai trong câu sau: 'Listen! The teacher is explain the new English lesson.' 👩‍🏫`,a:[{text:`explain -> explaining`,correct:!0,explanation:`Chính xác! Sau 'is' diễn tả hành động đang diễn ra (dấu hiệu 'Listen!') phải dùng V-ing: 'is explaining'.`},{text:`Listen -> Look`,correct:!1,explanation:`'Listen!' là dấu hiệu nhận biết thì hiện tại tiếp diễn hoàn toàn đúng.`},{text:`The teacher -> Teachers`,correct:!1,explanation:`Chủ ngữ số ít 'The teacher' là chuẩn xác.`},{text:`lesson -> lessons`,correct:!1,explanation:`Bài học số ít không có lỗi sai.`}]},{q:`Viết lại câu không đổi nghĩa: 'My school has thirty modern classrooms.' 🏫`,a:[{text:`There are thirty modern classrooms in my school.`,correct:!0,explanation:`Đúng rồi! Cấu trúc 'S + has + N' tương đương với 'There is/are + N + in + S'.`},{text:`There is thirty modern classrooms in my school.`,correct:!1,explanation:`'thirty classrooms' số nhiều phải dùng 'There are', không dùng 'There is'.`},{text:`There have thirty modern classrooms in my school.`,correct:!1,explanation:`Không dùng 'There have'.`},{text:`In my school has thirty modern classrooms.`,correct:!1,explanation:`Không được đặt 'In my school' làm chủ ngữ của động từ 'has'.`}]},{q:`What do you often do at break time? ⚽ (Tôi thường chơi bóng rổ cùng bạn bè)`,a:[{text:`I often play basketball with my friends.`,correct:!0,explanation:`Chính xác! 'play basketball' là chơi bóng rổ.`},{text:`I often do basketball with my friends.`,correct:!1,explanation:`Bóng rổ đi với động từ 'play', không đi với 'do'.`},{text:`I often go basketball with my friends.`,correct:!1,explanation:`Không dùng 'go basketball'.`},{text:`I often make basketball with my friends.`,correct:!1,explanation:`Không dùng 'make basketball'.`}]},{q:`At an international school, students study English with ___ teachers from the UK and USA. 🌍`,a:[{text:`foreign`,correct:!0,explanation:`Rất giỏi! 'foreign teachers' là các giáo viên người nước ngoài.`},{text:`strange`,correct:!1,explanation:`'strange' là kì lạ, lập dị.`},{text:`old`,correct:!1,explanation:`'old' là già nua hoặc cũ kỹ.`},{text:`heavy`,correct:!1,explanation:`'heavy' là nặng nề.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'rarely / he / school / is / late / for / .' 🏫`,a:[{text:`He is rarely late for school.`,correct:!0,explanation:`Chính xác! Trật tự chuẩn: S + to be (is) + Trạng từ tần suất (rarely) + Tính từ (late) + for school.`},{text:`He rarely is late for school.`,correct:!1,explanation:`Trạng từ tần suất không đứng trước to be 'is'.`},{text:`Rarely he is late for school.`,correct:!1,explanation:`Trạng từ rarely không đứng đầu câu trong câu khẳng định thường.`},{text:`He is late rarely for school.`,correct:!1,explanation:`Trạng từ không đứng sau tính từ late.`}]},{q:`Kiểu nhà truyền thống dựng trên các cột gỗ cao trên mặt đất của đồng bào vùng cao gọi là gì? 🏡`,a:[{text:`stilt house`,correct:!0,explanation:`Chính xác! Nhà sàn trong tiếng Anh là 'stilt house'.`},{text:`town house`,correct:!1,explanation:`'town house' là nhà phố liền kề ở đô thị.`},{text:`country house`,correct:!1,explanation:`'country house' là nhà ở vùng nông thôn.`},{text:`villa`,correct:!1,explanation:`'villa' là biệt thự sang trọng.`}]},{q:`Tòa nhà lớn gồm nhiều căn hộ gia đình sinh sống cùng nhau gọi là gì? 🏢`,a:[{text:`apartment building`,correct:!0,explanation:`Đúng rồi! Tòa nhà chung cư là 'apartment building' (hoặc 'block of flats').`},{text:`villa`,correct:!1,explanation:`'villa' là biệt thự riêng biệt.`},{text:`stilt house`,correct:!1,explanation:`'stilt house' là nhà sàn.`},{text:`tent`,correct:!1,explanation:`'tent' là cái lều cắm trại.`}]},{q:`Thiết bị nhà bếp hiện đại giúp hâm nóng đồ ăn nhanh chóng bằng sóng vi ba là gì? 🍲`,a:[{text:`microwave`,correct:!0,explanation:`Xuất sắc! Lò vi sóng là 'microwave'.`},{text:`dishwasher`,correct:!1,explanation:`'dishwasher' là máy rửa chén bát tự động.`},{text:`fridge`,correct:!1,explanation:`'fridge' là tủ lạnh bảo quản thực phẩm.`},{text:`washing machine`,correct:!1,explanation:`'washing machine' là máy giặt quần áo.`}]},{q:`Thiết bị gia dụng tiện lợi giúp rửa sạch toàn bộ bát đĩa và thìa dĩa sau bữa ăn là gì? 🍽️`,a:[{text:`dishwasher`,correct:!0,explanation:`Chính xác! Máy rửa bát là 'dishwasher'.`},{text:`microwave`,correct:!1,explanation:`'microwave' là lò vi sóng hâm thức ăn.`},{text:`cooker`,correct:!1,explanation:`'cooker' là bếp nấu nướng.`},{text:`fridge`,correct:!1,explanation:`'fridge' là tủ lạnh chứa đồ.`}]},{q:`Chiếc tủ có nhiều ngăn kéo kéo ra đẩy vào để đựng tất, khăn và đồ nhỏ gọi là gì? 🗄️`,a:[{text:`chest of drawers`,correct:!0,explanation:`Tuyệt vời! Tủ nhiều ngăn kéo là 'chest of drawers'.`},{text:`wardrobe`,correct:!1,explanation:`'wardrobe' là tủ đứng to để treo quần áo áo khoác.`},{text:`cupboard`,correct:!1,explanation:`'cupboard' là tủ chén/tủ bát đĩa có cánh mở.`},{text:`shelf`,correct:!1,explanation:`'shelf' là chiếc giá đơn gắn trên tường.`}]},{q:`Chiếc tủ lớn chuyên dùng để treo quần áo, váy và comple phẳng phiu là gì? 👗`,a:[{text:`wardrobe`,correct:!0,explanation:`Đúng rồi! Tủ quần áo lớn là 'wardrobe'.`},{text:`chest of drawers`,correct:!1,explanation:`'chest of drawers' là tủ ngăn kéo.`},{text:`fridge`,correct:!1,explanation:`'fridge' là tủ lạnh.`},{text:`bookcase`,correct:!1,explanation:`'bookcase' là tủ đựng sách vở.`}]},{q:`Where is the lamp? 💡 (Chiếc đèn bàn nằm ở giữa chiếc giường và bàn học)`,a:[{text:`It is between the bed and the desk.`,correct:!0,explanation:`Chính xác! Cấu trúc chỉ vị trí ở giữa hai vật là 'between A and B'.`},{text:`It is among the bed and the desk.`,correct:!1,explanation:`'among' dùng cho từ 3 người/vật trở lên, giữa 2 vật dùng 'between'.`},{text:`It is next the bed and the desk.`,correct:!1,explanation:`Thiếu giới từ 'to', không đi cùng cấu trúc 'and'.`},{text:`It is behind between the bed and desk.`,correct:!1,explanation:`Thừa giới từ 'behind'.`}]},{q:`The dog is sleeping peacefully ___ the shade of the big tree. 🐕🌳`,a:[{text:`under`,correct:!0,explanation:`Đúng rồi! Dưới bóng râm của cây dùng giới từ 'under the shade'.`},{text:`on`,correct:!1,explanation:`'on' là ở bên trên bề mặt.`},{text:`between`,correct:!1,explanation:`'between' cần có 2 vật đối xứng nối bởi 'and'.`},{text:`at`,correct:!1,explanation:`Không nói 'at the shade'.`}]},{q:`Chọn cách viết sở hữu cách đúng ngữ pháp: 'Căn phòng ngủ của bạn Nam' 👦🛏️`,a:[{text:`Nam's bedroom`,correct:!0,explanation:`Chính xác! Tên riêng kết hợp sở hữu cách là 'Nam's + danh từ' ('Nam's bedroom').`},{text:`Nams' bedroom`,correct:!1,explanation:`Dấu phẩy đặt sau chữ s chỉ dùng cho danh từ số nhiều tận cùng bằng s.`},{text:`The bedroom of Nam's`,correct:!1,explanation:`Thừa cả 'of' lẫn dấu sở hữu cách 's.`},{text:`Nam bedroom`,correct:!1,explanation:`Thiếu dấu sở hữu cách 's.`}]},{q:`Chọn cách viết sở hữu cách đúng: 'Ngôi nhà của bố mẹ tôi' 👨‍👩‍👧🏡`,a:[{text:`my parents' house`,correct:!0,explanation:`Đúng rồi! Danh từ số nhiều tận cùng bằng 's' ('parents') chỉ cần thêm dấu nháy đơn (') phía sau.`},{text:`my parents's house`,correct:!1,explanation:`Không thêm 's vào sau danh từ số nhiều đã có s.`},{text:`my parent's house`,correct:!1,explanation:`'parent's' chỉ là nhà của 1 người (bố hoặc mẹ), không phải cả hai bố mẹ.`},{text:`my house's parents`,correct:!1,explanation:`Nghĩa bị đảo lộn thành 'bố mẹ của ngôi nhà'.`}]},{q:`Odd one out: Chọn từ có đuôi '-s' phát âm là /s/ (khác với âm /z/): books, lamps, sinks, rooms 🔊`,a:[{text:`rooms`,correct:!0,explanation:`Chính xác! 'rooms' phát âm đuôi là /z/ (sau âm hữu thanh /m/), còn books, lamps, sinks đều phát âm là /s/.`},{text:`books`,correct:!1,explanation:`Sau phụ âm vô thanh /k/, phát âm là /s/.`},{text:`lamps`,correct:!1,explanation:`Sau phụ âm vô thanh /p/, phát âm là /s/.`},{text:`sinks`,correct:!1,explanation:`Sau phụ âm vô thanh /k/, phát âm là /s/.`}]},{q:`Odd one out: Chọn từ khác loại so với 3 từ còn lại: hall, kitchen, microwave, bathroom 🏠`,a:[{text:`microwave`,correct:!0,explanation:`Đúng rồi! 'microwave' (lò vi sóng) là thiết bị gia dụng, còn hall, kitchen, bathroom là các phòng/khu vực trong nhà.`},{text:`hall`,correct:!1,explanation:`'hall' là đại sảnh / hành lang đón khách.`},{text:`kitchen`,correct:!1,explanation:`'kitchen' là phòng bếp nấu ăn.`},{text:`bathroom`,correct:!1,explanation:`'bathroom' là phòng tắm vệ sinh.`}]},{q:`Sắp xếp chữ cái thành từ chỉ ngôi nhà biệt thự sang trọng: 'i - v - l - a - l' 🏰`,a:[{text:`villa`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'villa' (biệt thự sân vườn sang trọng).`},{text:`valil`,correct:!1,explanation:`Không phải từ tiếng Anh có nghĩa.`},{text:`valli`,correct:!1,explanation:`Sai chính tả tiếng Anh.`},{text:`villia`,correct:!1,explanation:`Thừa chữ i.`}]},{q:`Viết lại câu không đổi nghĩa: 'There is a big mirror in my sister's bedroom.' 🪞`,a:[{text:`My sister's bedroom has a big mirror.`,correct:!0,explanation:`Chính xác! 'There is + N + in + Place' tương đương với 'Place + has + N'.`},{text:`My sister's bedroom is a big mirror.`,correct:!1,explanation:`Câu này có nghĩa vô lý: Phòng ngủ là một chiếc gương soi.`},{text:`There have a big mirror in my sister's bedroom.`,correct:!1,explanation:`Không dùng cấu trúc 'There have'.`},{text:`My sister has a big mirror bedroom.`,correct:!1,explanation:`Sai trật tự danh từ bổ nghĩa.`}]},{q:`Tìm lỗi sai trong câu sau: 'My grandmother's country house are very quiet and peaceful.' 🏡`,a:[{text:`are -> is`,correct:!0,explanation:`Chính xác! Chủ ngữ chính là 'country house' (số ít) nên động từ to be phải là 'is', không dùng 'are'.`},{text:`grandmother's -> grandmother`,correct:!1,explanation:`Cần sở hữu cách để chỉ ngôi nhà của bà.`},{text:`country house -> country houses`,correct:!1,explanation:`Câu đang nói về 1 ngôi nhà cụ thể.`},{text:`peaceful -> peacefully`,correct:!1,explanation:`Sau to be dùng tính từ 'peaceful', không dùng phó từ.`}]},{q:`Cửa sổ phòng ngủ của tôi nhìn thẳng ra ngọn núi xanh biếc. 'Ngắm nhìn ra' dùng cụm từ nào? 🪟`,a:[{text:`looks out on`,correct:!0,explanation:`Tuyệt vời! 'look out on / look over' có nghĩa là nhìn trông ra cảnh quan bên ngoài.`},{text:`looks at`,correct:!1,explanation:`'look at' là nhìn chăm chú vào 1 vật cụ thể.`},{text:`looks after`,correct:!1,explanation:`'look after' là chăm sóc, trông nom người/vật.`},{text:`looks for`,correct:!1,explanation:`'look for' là tìm kiếm đồ vật bị thất lạc.`}]},{q:`The cat is hiding ___ the door, so you cannot see it immediately. 🐱🚪`,a:[{text:`behind`,correct:!0,explanation:`Chính xác! 'behind' nghĩa là ở đằng sau cánh cửa nên không nhìn thấy ngay.`},{text:`in front of`,correct:!1,explanation:`Nếu ở đằng trước thì đã nhìn thấy ngay rồi.`},{text:`under`,correct:!1,explanation:`Mèo không trốn bên dưới cánh cửa được.`},{text:`on`,correct:!1,explanation:`Không phù hợp ngữ cảnh trốn.`}]},{q:`Khách sạn trên mặt nước hoặc ngôi nhà nổi bồng bềnh trên sông hồ gọi là gì? 🛶🏠`,a:[{text:`houseboat`,correct:!0,explanation:`Đúng rồi! Nhà thuyền trên sông nước gọi là 'houseboat'.`},{text:`town house`,correct:!1,explanation:`'town house' là nhà phố trên đất liền.`},{text:`stilt house`,correct:!1,explanation:`'stilt house' là nhà sàn có cột chống.`},{text:`villa`,correct:!1,explanation:`'villa' là biệt thự nghỉ dưỡng.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'living / the / is / television / in / There / a / room / .' 📺`,a:[{text:`There is a television in the living room.`,correct:!0,explanation:`Xuất sắc! Cấu trúc đúng: There is + a television + in the living room.`},{text:`There a television is in the living room.`,correct:!1,explanation:`Động từ 'is' phải đứng ngay sau 'There'.`},{text:`A television there is in the living room.`,correct:!1,explanation:`Sai vị trí 'there is'.`},{text:`There is in the living room a television.`,correct:!1,explanation:`Cụm nơi chốn thường đặt ở cuối câu khẳng định.`}]},{q:`Is there a ceiling fan in your bedroom? 🌀 (Có một chiếc quạt trần trong phòng ngủ không? - Có)`,a:[{text:`Yes, there is.`,correct:!0,explanation:`Chính xác! Câu hỏi 'Is there...?' trả lời khẳng định là 'Yes, there is.'`},{text:`Yes, it is.`,correct:!1,explanation:`Câu hỏi bắt đầu bằng 'Is there', không trả lời 'Yes, it is'.`},{text:`Yes, there are.`,correct:!1,explanation:`Chỉ có 1 chiếc quạt trần số ít nên không dùng 'there are'.`},{text:`No, there is.`,correct:!1,explanation:`Đã trả lời 'No' thì phải dùng phủ định 'there isn't'.`}]},{q:`Mai has a round face and big ___ eyes. 👀 (Mai có đôi mắt màu nâu to tròn)`,a:[{text:`brown`,correct:!0,explanation:`Chính xác! 'brown eyes' là đôi mắt màu nâu ấm áp.`},{text:`chubby`,correct:!1,explanation:`'chubby' là mũm mĩm, dùng cho má (chubby cheeks), không dùng cho mắt.`},{text:`curly`,correct:!1,explanation:`'curly' là quăn gợn sóng, dùng cho mái tóc (curly hair).`},{text:`straight`,correct:!1,explanation:`'straight' là suôn thẳng, dùng miêu tả tóc.`}]},{q:`Mái tóc uốn lượn bồng bềnh gợn sóng trong tiếng Anh miêu tả bằng tính từ nào? 👩‍🦱`,a:[{text:`curly`,correct:!0,explanation:`Đúng rồi! Tóc xoăn / quăn là 'curly hair'.`},{text:`straight`,correct:!1,explanation:`'straight hair' là tóc thẳng suôn mượt.`},{text:`blonde`,correct:!1,explanation:`'blonde hair' là tóc màu vàng hoe.`},{text:`bald`,correct:!1,explanation:`'bald' là bị hói đầu, không có tóc.`}]},{q:`Đôi má bầu bĩnh, phúng phính đáng yêu của em bé tiếng Anh miêu tả là gì? 👶`,a:[{text:`chubby cheeks`,correct:!0,explanation:`Xuất sắc! 'chubby cheeks' là đôi má phúng phính mũm mĩm.`},{text:`thin cheeks`,correct:!1,explanation:`'thin cheeks' là má hóp gầy gò.`},{text:`curly cheeks`,correct:!1,explanation:`Không dùng 'curly' miêu tả má.`},{text:`long cheeks`,correct:!1,explanation:`Không có cụm từ này.`}]},{q:`Lan is very ___. She always gets good marks in Math and English exams. 💡`,a:[{text:`clever`,correct:!0,explanation:`Chính xác! 'clever' nghĩa là thông minh, sáng dạ (tương đương với 'smart').`},{text:`lazy`,correct:!1,explanation:`'lazy' là lười biếng học tập.`},{text:`shy`,correct:!1,explanation:`'shy' là e thẹn, ngại giao tiếp.`},{text:`funny`,correct:!1,explanation:`'funny' là vui tính, hài hước.`}]},{q:`Phong is a ___ student. He spends five hours studying and reading every day. 📚`,a:[{text:`hard-working`,correct:!0,explanation:`Đúng rồi! 'hard-working' là chăm chỉ, cần cù chịu khó.`},{text:`lazy`,correct:!1,explanation:`'lazy' là lười nhác.`},{text:`curious`,correct:!1,explanation:`'curious' là tò mò hiếu kỳ.`},{text:`talkative`,correct:!1,explanation:`'talkative' là nói nhiều, lắm lời.`}]},{q:`Một người bạn luôn biết lắng nghe, quan tâm và sẵn sàng giúp đỡ người khác là người: ❤️`,a:[{text:`caring`,correct:!0,explanation:`Tuyệt vời! 'caring' là chu đáo, biết quan tâm chăm sóc người khác.`},{text:`selfish`,correct:!1,explanation:`'selfish' là ích kỷ chỉ nghĩ đến bản thân.`},{text:`mean`,correct:!1,explanation:`'mean' là keo kiệt hoặc xấu tính.`},{text:`cruel`,correct:!1,explanation:`'cruel' là độc ác tàn nhẫn.`}]},{q:`Minh always makes everyone laugh because of his humorous jokes. He is very ___. 😂`,a:[{text:`funny`,correct:!0,explanation:`Chính xác! 'funny' là hài hước, vui nhộn, luôn đem lại tiếng cười.`},{text:`boring`,correct:!1,explanation:`'boring' là nhạt nhẽo, buồn tẻ.`},{text:`serious`,correct:!1,explanation:`'serious' là nghiêm túc, đứng đắn.`},{text:`quiet`,correct:!1,explanation:`'quiet' là trầm tính, ít nói.`}]},{q:`Một người tự tin vào bản thân khi đứng trước đám đông và phát biểu được gọi là: 🎤`,a:[{text:`confident`,correct:!0,explanation:`Đúng rồi! 'confident' là tự tin, đàng hoàng chững chạc.`},{text:`shy`,correct:!1,explanation:`'shy' là rụt rè, bẽn lẽn.`},{text:`nervous`,correct:!1,explanation:`'nervous' là lo lắng, bồn chồn.`},{text:`scared`,correct:!1,explanation:`'scared' là sợ hãi.`}]},{q:`What are you doing this Saturday evening? 🎬 (Tối thứ Bảy này tôi sẽ đi xem phim)`,a:[{text:`I am going to the cinema with my best friend.`,correct:!0,explanation:`Chính xác! Dùng thì Hiện tại tiếp diễn diễn tả kế hoạch chắc chắn trong tương lai gần.`},{text:`I go to the cinema with my best friend.`,correct:!1,explanation:`Hiện tại đơn diễn tả thói quen lặp lại, không dùng cho kế hoạch cụ thể tối thứ Bảy này.`},{text:`I went to the cinema with my best friend.`,correct:!1,explanation:`Thì quá khứ đơn, sai vì 'this Saturday evening' là tương lai.`},{text:`I was going to the cinema.`,correct:!1,explanation:`Quá khứ tiếp diễn không phù hợp.`}]},{q:`Look at the schedule! We ___ a picnic at Thong Nhat Park tomorrow morning. 🧺`,a:[{text:`are having`,correct:!0,explanation:`Đúng rồi! Kế hoạch dã ngoại đã lên lịch 'tomorrow morning' dùng hiện tại tiếp diễn 'are having'.`},{text:`have`,correct:!1,explanation:`Hiện tại đơn diễn tả thói quen.`},{text:`had`,correct:!1,explanation:`Quá khứ đơn không dùng cho 'tomorrow'.`},{text:`have had`,correct:!1,explanation:`Hiện tại hoàn thành không dùng cho thời điểm tương lai xác định.`}]},{q:`Odd one out: Chọn từ có phần phát âm phụ âm khác (/p/ vs /b/): pen, play, picnic, book 📖`,a:[{text:`book`,correct:!0,explanation:`Chính xác! 'book' bắt đầu bằng âm hữu thanh /b/, trong khi pen, play, picnic bắt đầu bằng âm vô thanh /p/.`},{text:`pen`,correct:!1,explanation:`Bắt đầu bằng âm /p/ bật hơi.`},{text:`play`,correct:!1,explanation:`Bắt đầu bằng âm /p/ bật hơi.`},{text:`picnic`,correct:!1,explanation:`Bắt đầu bằng âm /p/ bật hơi.`}]},{q:`Odd one out: Từ nào miêu tả TÍNH CÁCH (personality), không phải ngoại hình (appearance)? 🧠`,a:[{text:`generous`,correct:!0,explanation:`Đúng rồi! 'generous' (hào phóng, rộng lượng) chỉ tính cách, còn tall, slim, curly chỉ vóc dáng ngoại hình.`},{text:`tall`,correct:!1,explanation:`'tall' là cao ráo (ngoại hình).`},{text:`slim`,correct:!1,explanation:`'slim' là thon thả mảnh mai (ngoại hình).`},{text:`curly`,correct:!1,explanation:`'curly' là tóc xoăn (ngoại hình).`}]},{q:`Sắp xếp chữ cái thành tính từ chỉ sự kiên nhẫn, nhẫn nại: 'n - p - a - t - e - t - i' ⏳`,a:[{text:`patient`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'patient' (kiên nhẫn, nhẫn nại).`},{text:`petiant`,correct:!1,explanation:`Sai chính tả vị trí chữ e và i.`},{text:`painett`,correct:!1,explanation:`Không phải từ có nghĩa.`},{text:`paitent`,correct:!1,explanation:`Sai vị trí chữ i và t.`}]},{q:`My best friend, An, has ___ black hair and a bright smile. ✨`,a:[{text:`long straight`,correct:!0,explanation:`Chính xác! Trật tự tính từ miêu tả kích thước đứng trước kiểu dáng/hình dáng: 'long straight hair'.`},{text:`straight long`,correct:!1,explanation:`Sai trật tự tính từ, 'long' (chiều dài) phải đứng trước 'straight' (hình dáng).`},{text:`a long straight`,correct:!1,explanation:`Danh từ 'hair' không đếm được nên không dùng mạo từ 'a'.`},{text:`long straight a`,correct:!1,explanation:`Đặt mạo từ sai vị trí hoàn toàn.`}]},{q:`Tìm lỗi sai trong câu sau: 'She is having a round face and black eyes.' 👩`,a:[{text:`is having -> has`,correct:!0,explanation:`Chính xác! Động từ 'have' khi mang nghĩa sở hữu đặc điểm ngoại hình không dùng ở thì tiếp diễn.`},{text:`round face -> face round`,correct:!1,explanation:`Tính từ đứng trước danh từ là đúng.`},{text:`and -> but`,correct:!1,explanation:`Hai đặc điểm bổ sung cho nhau dùng liên từ 'and'.`},{text:`black eyes -> eye black`,correct:!1,explanation:`Tính từ đứng trước danh từ là chuẩn.`}]},{q:`Người bạn thích khám phá, tò mò tìm hiểu mọi thứ xung quanh được miêu tả bằng tính từ: 🔍`,a:[{text:`curious`,correct:!0,explanation:`Đúng rồi! 'curious' là tò mò, ham học hỏi và thích khám phá.`},{text:`bored`,correct:!1,explanation:`'bored' là cảm thấy buồn chán.`},{text:`scared`,correct:!1,explanation:`'scared' là cảm giác sợ sệt.`},{text:`polite`,correct:!1,explanation:`'polite' là lịch sự, lễ phép.`}]},{q:`Would you like to come to my birthday party this Sunday? 🎂 (Bạn có muốn đến dự sinh nhật tôi không? - Tôi rất thích)`,a:[{text:`Yes, I'd love to. Thanks!`,correct:!0,explanation:`Chính xác! Lời nhận lời mời lịch sự và thân thiện: 'Yes, I'd love to. Thanks!'.`},{text:`Yes, I do.`,correct:!1,explanation:`'Would you like...?' không dùng trợ động từ 'do' để trả lời.`},{text:`No, I don't like it.`,correct:!1,explanation:`Câu này thiếu lịch sự và thô lỗ trong giao tiếp.`},{text:`Yes, I am.`,correct:!1,explanation:`Không dùng động từ to be 'am' cho lời mời này.`}]},{q:`Viết lại câu không đổi nghĩa: 'Her eyes are big and blue.' 👁️`,a:[{text:`She has big blue eyes.`,correct:!0,explanation:`Chính xác! 'Her eyes are big and blue' chuyển thành 'She has big blue eyes'.`},{text:`She is big blue eyes.`,correct:!1,explanation:`Câu này sai: Cô ấy là đôi mắt to màu xanh.`},{text:`She has blue eyes big.`,correct:!1,explanation:`Tính từ phải đứng trước danh từ 'eyes'.`},{text:`She has eyes big and blue.`,correct:!1,explanation:`Không đặt tính từ sau danh từ trong trường hợp này.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'is / playing / brother / My / video / not / games / now / .' 🎮`,a:[{text:`My brother is not playing video games now.`,correct:!0,explanation:`Xuất sắc! Cấu trúc thì hiện tại tiếp diễn phủ định: S + is not + V-ing + O + now.`},{text:`My brother not is playing video games now.`,correct:!1,explanation:`Trợ từ 'not' phải đứng sau to be 'is'.`},{text:`My brother is playing not video games now.`,correct:!1,explanation:`Đặt sai vị trí của 'not'.`},{text:`Now my brother playing is not video games.`,correct:!1,explanation:`Sai trật tự trợ từ và động từ.`}]},{q:`Một người bạn luôn sẵn lòng chia sẻ đồ ăn và đồ chơi với bạn bè gọi là người: 🎁`,a:[{text:`generous`,correct:!0,explanation:`Chính xác! 'generous' là hào phóng, rộng lượng, thích sẻ chia.`},{text:`selfish`,correct:!1,explanation:`'selfish' là ích kỷ.`},{text:`greedy`,correct:!1,explanation:`'greedy' là tham lam.`},{text:`careless`,correct:!1,explanation:`'careless' là cẩu thả, bất cẩn.`}]},{q:`Nơi lưu giữ và trưng bày các tác phẩm nghệ thuật, tranh vẽ điêu khắc quý giá là gì? 🖼️`,a:[{text:`art gallery`,correct:!0,explanation:`Chính xác! Phòng triển lãm nghệ thuật là 'art gallery'.`},{text:`railway station`,correct:!1,explanation:`'railway station' là nhà ga xe lửa.`},{text:`post office`,correct:!1,explanation:`'post office' là bưu điện gửi thư từ.`},{text:`supermarket`,correct:!1,explanation:`'supermarket' là siêu thị bách hóa.`}]},{q:`Quảng trường rộng lớn ở trung tâm thành phố nơi mọi người tụ tập dạo chơi gọi là gì? 🏛️`,a:[{text:`square`,correct:!0,explanation:`Đúng rồi! Quảng trường trong tiếng Anh là 'square'.`},{text:`memorial`,correct:!1,explanation:`'memorial' là đài tưởng niệm anh hùng.`},{text:`temple`,correct:!1,explanation:`'temple' là ngôi đền chùa cổ kính.`},{text:`cathedral`,correct:!1,explanation:`'cathedral' là nhà thờ chính tòa lớn.`}]},{q:`Công trình kiến trúc xây dựng để tưởng nhớ các danh nhân hoặc sự kiện lịch sử là gì? 🗿`,a:[{text:`memorial`,correct:!0,explanation:`Tuyệt vời! Đài tưởng niệm / đài kỷ niệm là 'memorial'.`},{text:`supermarket`,correct:!1,explanation:`'supermarket' là siêu thị.`},{text:`cinema`,correct:!1,explanation:`'cinema' là rạp chiếu phim.`},{text:`stadium`,correct:!1,explanation:`'stadium' là sân vận động thể thao.`}]},{q:`Living in a big city is much ___ than living in a quiet countryside village. 🏙️🚗`,a:[{text:`noisier`,correct:!0,explanation:`Chính xác! So sánh hơn của tính từ 2 âm tiết tận cùng bằng 'y' ('noisy'): đổi 'y' thành 'i' rồi thêm 'er' ('noisier').`},{text:`more noisy`,correct:!1,explanation:`Quy tắc ngữ pháp ưu tiên dùng 'noisier' cho tính từ tận cùng bằng -y.`},{text:`noisy`,correct:!1,explanation:`Chưa chia ở dạng so sánh hơn.`},{text:`noisiest`,correct:!1,explanation:`Đây là dạng so sánh nhất, có 'than' phải dùng so sánh hơn.`}]},{q:`This street is very ___. Two cars cannot pass each other easily. 🛣️`,a:[{text:`narrow`,correct:!0,explanation:`Đúng rồi! 'narrow' nghĩa là chật hẹp, ngõ nhỏ.`},{text:`wide`,correct:!1,explanation:`'wide' là rộng rãi thoáng đãng.`},{text:`peaceful`,correct:!1,explanation:`'peaceful' là yên bình thanh tịnh.`},{text:`convenient`,correct:!1,explanation:`'convenient' là thuận tiện, tiện lợi.`}]},{q:`The air in the countryside is generally ___ than that in big industrial cities. 🍃`,a:[{text:`fresher`,correct:!0,explanation:`Chính xác! Tính từ ngắn 'fresh' khi so sánh hơn thêm đuôi '-er' thành 'fresher' (trong lành hơn).`},{text:`more fresh`,correct:!1,explanation:`Tính từ ngắn không dùng 'more'.`},{text:`freshest`,correct:!1,explanation:`Đây là dạng so sánh nhất.`},{text:`fresh`,correct:!1,explanation:`Chưa chia so sánh hơn.`}]},{q:`A house in the city centre is usually ___ expensive than a house in the suburbs. 💰`,a:[{text:`more`,correct:!0,explanation:`Đúng rồi! 'expensive' là tính từ dài (3 âm tiết) nên so sánh hơn phải dùng 'more + adj + than'.`},{text:`much`,correct:!1,explanation:`Chỉ dùng 'much' để bổ nghĩa trước 'more' (much more expensive), không đi một mình thay thế 'more'.`},{text:`as`,correct:!1,explanation:`Cần cấu trúc so sánh bằng 'as...as'.`},{text:`the most`,correct:!1,explanation:`Dùng cho so sánh nhất, không đi với 'than'.`}]},{q:`The traffic in Hanoi during rush hours is ___ than it is at noon. 🚦 (Giao thông tệ hơn)`,a:[{text:`worse`,correct:!0,explanation:`Chính xác! Dạng so sánh hơn bất quy tắc của tính từ 'bad' là 'worse' (tồi tệ hơn).`},{text:`badder`,correct:!1,explanation:`Không có từ 'badder' trong tiếng Anh.`},{text:`more bad`,correct:!1,explanation:`Sai quy tắc so sánh bất quy tắc.`},{text:`the worst`,correct:!1,explanation:`Đây là dạng so sánh nhất.`}]},{q:`My new school has ___ modern equipment than my old one. 👍 (Tốt hơn)`,a:[{text:`better`,correct:!0,explanation:`Đúng rồi! So sánh hơn bất quy tắc của 'good' là 'better' (tốt hơn).`},{text:`gooder`,correct:!1,explanation:`Không có từ 'gooder'.`},{text:`more good`,correct:!1,explanation:`Sai quy tắc.`},{text:`the best`,correct:!1,explanation:`Dạng so sánh nhất.`}]},{q:`Khi muốn hỏi đường ai đó một cách lịch sự: 'Làm ơn cho tôi biết đường tới rạp chiếu phim?', em nói: 🗺️`,a:[{text:`Excuse me, could you tell me the way to the cinema?`,correct:!0,explanation:`Chính xác! Cấu trúc hỏi đường chuẩn lịch sự: 'Excuse me, could you tell me the way to + Địa điểm?'.`},{text:`Where cinema is?`,correct:!1,explanation:`Sai trật tự từ và thiếu lịch sự.`},{text:`Go to the cinema now!`,correct:!1,explanation:`Đây là câu mệnh lệnh ra lệnh.`},{text:`Tell me cinema road!`,correct:!1,explanation:`Sai ngữ pháp tiếng Anh bồi.`}]},{q:`Chỉ đường: 'Đi thẳng về phía trước, sau đó rẽ trái ở ngã tư thứ hai' nói thế nào? ➡️`,a:[{text:`Go straight ahead, then turn left at the second crossroads.`,correct:!0,explanation:`Đúng rồi! 'Go straight ahead' là đi thẳng, 'turn left' là rẽ trái.`},{text:`Go straight back, then turn right.`,correct:!1,explanation:`'Go back' là quay trở lại phía sau.`},{text:`Turn left now, then don't go straight.`,correct:!1,explanation:`Chỉ dẫn sai nghĩa.`},{text:`Cross the road, then stop there.`,correct:!1,explanation:`Sang đường rồi đứng yên.`}]},{q:`Odd one out: Chọn từ có nguyên âm phát âm là /iː/ dài: peaceful, street, convenient, historic 🔊`,a:[{text:`historic`,correct:!0,explanation:`Chính xác! 'historic' phát âm là /hɪˈstɒrɪk/ (âm /ɪ/ ngắn), trong khi peaceful, street đều có âm /iː/ dài.`},{text:`peaceful`,correct:!1,explanation:`Có âm /iː/ dài.`},{text:`street`,correct:!1,explanation:`Có âm /iː/ dài.`},{text:`convenient`,correct:!1,explanation:`Có âm /iː/ dài ở âm tiết thứ hai.`}]},{q:`Odd one out: Từ nào mang ý nghĩa tiêu cực (chỉ nhược điểm) của khu phố: 🏙️`,a:[{text:`polluted`,correct:!0,explanation:`Đúng rồi! 'polluted' (bị ô nhiễm) là tính từ mang nghĩa tiêu cực, còn modern, peaceful, convenient là tích cực.`},{text:`modern`,correct:!1,explanation:`'modern' là hiện đại tiên tiến.`},{text:`peaceful`,correct:!1,explanation:`'peaceful' là thanh bình yên tĩnh.`},{text:`convenient`,correct:!1,explanation:`'convenient' là thuận tiện tiện ích.`}]},{q:`Sắp xếp chữ cái thành từ chỉ nhà ga xe lửa: 'i - s - a - t - t - o - n' 🚉`,a:[{text:`station`,correct:!0,explanation:`Xuất sắc! 'station' là nhà ga trung chuyển.`},{text:`stantio`,correct:!1,explanation:`Sai vị trí chữ cái.`},{text:`statoni`,correct:!1,explanation:`Không phải từ có nghĩa.`},{text:`saitont`,correct:!1,explanation:`Sai chính tả.`}]},{q:`Viết lại câu không đổi nghĩa: 'Life in the countryside is more peaceful than life in the city.' 🌾`,a:[{text:`Life in the city is less peaceful than life in the countryside.`,correct:!0,explanation:`Chính xác! 'more peaceful' (yên bình hơn) chuyển thành 'less peaceful' (ít yên bình hơn).`},{text:`Life in the city is peacefuler than life in the countryside.`,correct:!1,explanation:`'peaceful' là tính từ dài, không thêm đuôi -er.`},{text:`Life in the countryside is noisier than life in the city.`,correct:!1,explanation:`Ngược hoàn toàn về nghĩa thực tế.`},{text:`Life in the city is as peaceful as life in the countryside.`,correct:!1,explanation:`Chuyển thành so sánh bằng là sai nghĩa gốc.`}]},{q:`Tìm lỗi sai trong câu sau: 'Hoi An is famous for its ancient houses and narrow street.' 🏘️`,a:[{text:`narrow street -> narrow streets`,correct:!0,explanation:`Đúng rồi! Cả khu phố cổ có rất nhiều con phố hẹp đan xen nên danh từ phải ở số nhiều: 'narrow streets'.`},{text:`famous for -> famous with`,correct:!1,explanation:`Cụm tính từ 'famous for' (nổi tiếng về) là hoàn toàn chính xác.`},{text:`ancient -> more ancient`,correct:!1,explanation:`Không có từ 'than' để dùng so sánh hơn.`},{text:`houses -> house`,correct:!1,explanation:`Nhiều ngôi nhà cổ là đúng.`}]},{q:`The market in our town is very ___. There are hundreds of people buying and selling. 👥`,a:[{text:`crowded`,correct:!0,explanation:`Chính xác! 'crowded' nghĩa là đông đúc, tấp nập người qua lại.`},{text:`empty`,correct:!1,explanation:`'empty' là trống vắng, không có người.`},{text:`quiet`,correct:!1,explanation:`'quiet' là yên tĩnh vắng lặng.`},{text:`boring`,correct:!1,explanation:`'boring' là buồn tẻ.`}]},{q:`Da Nang is said to be one of the most ___ cities in Vietnam. 🏖️ (Đáng sống nhất)`,a:[{text:`liveable`,correct:!0,explanation:`Đúng rồi! 'liveable city' là thành phố đáng sống với môi trường và dịch vụ tuyệt vời.`},{text:`living`,correct:!1,explanation:`Không dùng 'living city'.`},{text:`live`,correct:!1,explanation:`'live' là động từ nguyên thể.`},{text:`lively`,correct:!1,explanation:`'lively' là sống động nhộn nhịp, nhưng danh hiệu thường là 'liveable city'.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'is / My / neighbourhood / than / quieter / yours / .' 🏡`,a:[{text:`My neighbourhood is quieter than yours.`,correct:!0,explanation:`Chính xác! Trật tự: S + to be (is) + Tính từ so sánh (quieter) + than + Đại từ sở hữu (yours).`},{text:`My neighbourhood quieter is than yours.`,correct:!1,explanation:`Động từ 'is' phải đứng trước tính từ so sánh.`},{text:`Yours neighbourhood is quieter than my.`,correct:!1,explanation:`Đại từ sở hữu 'yours' không đứng trước danh từ.`},{text:`My neighbourhood is than quieter yours.`,correct:!1,explanation:`Đặt từ 'than' sai vị trí.`}]},{q:`Can you tell me how to get to the post office? - ___ the second turning on your right. 📮`,a:[{text:`Take`,correct:!0,explanation:`Tuyệt vời! Cụm từ chỉ hướng rẽ ở ngã rẽ thứ mấy là 'Take the second turning on your right/left'.`},{text:`Do`,correct:!1,explanation:`Không dùng 'Do the turning'.`},{text:`Make`,correct:!1,explanation:`Thường nói 'make a turn' chứ không nói 'make the second turning'.`},{text:`Go`,correct:!1,explanation:`Nói 'Turn right' chứ không nói 'Go the second turning'.`}]},{q:`Vịnh Hạ Long nổi tiếng thế giới với hàng nghìn hòn đảo đá vôi kỳ vĩ. 'Kỳ quan thiên nhiên' tiếng Anh là gì? 🏞️`,a:[{text:`natural wonder`,correct:!0,explanation:`Chính xác! 'natural wonder' là kỳ quan thiên nhiên ban tặng.`},{text:`man-made wonder`,correct:!1,explanation:`'man-made wonder' là kỳ quan nhân tạo do con người xây dựng.`},{text:`waterfall`,correct:!1,explanation:`'waterfall' là thác nước.`},{text:`forest`,correct:!1,explanation:`'forest' là khu rừng rậm.`}]},{q:`Vùng đất khô cằn bao la chỉ toàn cát và rất hiếm khi có mưa rơi gọi là gì? 🏜️`,a:[{text:`desert`,correct:!0,explanation:`Đúng rồi! Sa mạc là 'desert' (nhớ phân biệt với 'dessert' là món tráng miệng).`},{text:`island`,correct:!1,explanation:`'island' là hòn đảo bốn bề có nước biển bao bọc.`},{text:`valley`,correct:!1,explanation:`'valley' là thung lũng giữa hai sườn núi.`},{text:`cave`,correct:!1,explanation:`'cave' là hang động ngầm.`}]},{q:`Dòng nước chảy từ trên vách đá cao dựng đứng đổ ầm ầm xuống vực thẳm là gì? 🌊`,a:[{text:`waterfall`,correct:!0,explanation:`Xuất sắc! Thác nước hùng vĩ là 'waterfall'.`},{text:`lake`,correct:!1,explanation:`'lake' là hồ nước tĩnh lặng.`},{text:`river`,correct:!1,explanation:`'river' là dòng sông uốn lượn.`},{text:`stream`,correct:!1,explanation:`'stream' là con suối nhỏ chảy róc rách.`}]},{q:`Dụng cụ y tế nhỏ dính có lớp gạc dùng để băng bó vết thương nhỏ khi đi du lịch là gì? 🩹`,a:[{text:`plaster`,correct:!0,explanation:`Chính xác! Băng dán cá nhân là 'plaster' (hoặc 'bandage').`},{text:`suncream`,correct:!1,explanation:`'suncream' là kem chống nắng.`},{text:`scissors`,correct:!1,explanation:`'scissors' là chiếc kéo cắt giấy.`},{text:`backpack`,correct:!1,explanation:`'backpack' là chiếc ba lô đeo lưng.`}]},{q:`Chiếc túi ngủ ấm áp mà người leo núi mang theo để ngủ trong lều cắm trại là gì? ⛺`,a:[{text:`sleeping bag`,correct:!0,explanation:`Đúng rồi! Túi ngủ chuyên dụng là 'sleeping bag'.`},{text:`backpack`,correct:!1,explanation:`'backpack' là ba lô đựng hành lý.`},{text:`waterproof coat`,correct:!1,explanation:`'waterproof coat' là áo mưa chống thấm nước.`},{text:`compass`,correct:!1,explanation:`'compass' là chiếc la bàn định hướng.`}]},{q:`Kem thoa da giúp bảo vệ làn da khỏi ánh nắng chói chang khi đi biển là gì? ☀️`,a:[{text:`suncream`,correct:!0,explanation:`Tuyệt vời! Kem chống nắng là 'suncream' (hoặc 'sunscreen').`},{text:`ice cream`,correct:!1,explanation:`'ice cream' là que kem mát lạnh ăn giải khát.`},{text:`toothpaste`,correct:!1,explanation:`'toothpaste' là kem đánh răng vệ sinh miệng.`},{text:`soap`,correct:!1,explanation:`'soap' là bánh xà phòng tắm.`}]},{q:`Fansipan is the ___ mountain in Vietnam and Indochina. 🏔️ (Ngọn núi cao nhất)`,a:[{text:`highest`,correct:!0,explanation:`Chính xác! So sánh nhất của tính từ ngắn 'high' là 'the highest' (cao nhất).`},{text:`higher`,correct:!1,explanation:`Dùng cho so sánh hơn giữa 2 đối tượng.`},{text:`most high`,correct:!1,explanation:`Tính từ ngắn không dùng 'most'.`},{text:`highest than`,correct:!1,explanation:`So sánh nhất không đi với từ 'than'.`}]},{q:`Son Doong Cave is the ___ cave in the entire world. 🦇 (Hang động lớn nhất)`,a:[{text:`largest`,correct:!0,explanation:`Đúng rồi! So sánh nhất của tính từ tận cùng bằng 'e' ('large') là thêm '-st' thành 'the largest'.`},{text:`larger`,correct:!1,explanation:`So sánh hơn.`},{text:`most large`,correct:!1,explanation:`Sai ngữ pháp tính từ ngắn.`},{text:`largest than`,correct:!1,explanation:`Thừa chữ 'than'.`}]},{q:`This is the ___ dangerous mountain trail I have ever hiked. ⚠️ (Hiểm trở nhất)`,a:[{text:`most`,correct:!0,explanation:`Chính xác! Cấu trúc so sánh nhất của tính từ dài: 'the most + adj' ('the most dangerous').`},{text:`more`,correct:!1,explanation:`'more' dùng trong so sánh hơn.`},{text:`much`,correct:!1,explanation:`Không dùng cấu trúc 'the much dangerous'.`},{text:`as`,correct:!1,explanation:`Dùng trong so sánh bằng.`}]},{q:`You ___ follow the park rules strictly. Do not litter or throw trash in the river! 🚯`,a:[{text:`must`,correct:!0,explanation:`Đúng rồi! Động từ khuyết thiếu 'must' diễn tả mệnh lệnh bắt buộc phải tuân theo.`},{text:`mustn't`,correct:!1,explanation:`'mustn't' là cấm không được làm.`},{text:`needn't`,correct:!1,explanation:`'needn't' là không cần thiết.`},{text:`can't`,correct:!1,explanation:`'can't' là không thể.`}]},{q:`Visitors ___ touch the delicate stalactites inside the ancient cave! 🚫 (Cấm không được chạm vào)`,a:[{text:`mustn't`,correct:!0,explanation:`Chính xác! 'mustn't' dùng để diễn đạt sự cấm đoán tuyệt đối.`},{text:`must`,correct:!1,explanation:`'must' là bắt buộc phải chạm (nguy hiểm).`},{text:`should`,correct:!1,explanation:`'should' chỉ là lời khuyên nhẹ nhàng.`},{text:`need`,correct:!1,explanation:`'need' là cần thiết.`}]},{q:`There isn't ___ fresh water left in our water bottles. We need to find a clean stream. 💧`,a:[{text:`any`,correct:!0,explanation:`Đúng rồi! Trong câu phủ định với danh từ không đếm được ('water') ta dùng lượng từ 'any'.`},{text:`some`,correct:!1,explanation:`'some' thường dùng trong câu khẳng định hoặc lời mời lịch sự.`},{text:`many`,correct:!1,explanation:`'many' chỉ đi với danh từ đếm được số nhiều.`},{text:`a`,correct:!1,explanation:`'water' là danh từ không đếm được nên không dùng mạo từ 'a'.`}]},{q:`How ___ tents do we need to bring for twelve students in our scout group? ⛺`,a:[{text:`many`,correct:!0,explanation:`Chính xác! 'tents' là danh từ đếm được số nhiều nên dùng cụm hỏi số lượng 'How many'.`},{text:`much`,correct:!1,explanation:`'How much' dùng hỏi lượng cho danh từ không đếm được hoặc hỏi giá tiền.`},{text:`long`,correct:!1,explanation:`'How long' là hỏi độ dài hoặc thời gian bao lâu.`},{text:`often`,correct:!1,explanation:`'How often' là hỏi tần suất thường xuyên.`}]},{q:`Odd one out: Chọn danh từ KHÔNG ĐẾM ĐƯỢC (Uncountable noun) trong 4 từ sau: 🍞`,a:[{text:`butter`,correct:!0,explanation:`Đúng rồi! 'butter' (bơ) là danh từ không đếm được, còn apple, tent, bottle là danh từ đếm được.`},{text:`apple`,correct:!1,explanation:`'apple' là quả táo, đếm được số ít/nhiều.`},{text:`tent`,correct:!1,explanation:`'tent' là chiếc lều, đếm được.`},{text:`bottle`,correct:!1,explanation:`'bottle' là cái chai nước, đếm được.`}]},{q:`Sắp xếp chữ cái thành từ chỉ hòn đảo giữa biển: 'n - a - d - i - s - l' 🏝️`,a:[{text:`island`,correct:!0,explanation:`Xuất sắc! 'island' là hòn đảo (lưu ý chữ 's' là âm câm không phát âm).`},{text:`siland`,correct:!1,explanation:`Sai vị trí chữ cái.`},{text:`islnad`,correct:!1,explanation:`Sai chính tả tiếng Anh.`},{text:`isklad`,correct:!1,explanation:`Không phải từ có nghĩa.`}]},{q:`Odd one out: Chọn từ có phát âm phụ âm cuối là /t/: boat, forest, plant, island 🔊`,a:[{text:`island`,correct:!0,explanation:`Chính xác! 'island' kết thúc bằng âm /d/, trong khi boat, forest, plant đều kết thúc bằng âm /t/.`},{text:`boat`,correct:!1,explanation:`Kết thúc bằng âm /t/.`},{text:`forest`,correct:!1,explanation:`Kết thúc bằng âm /t/.`},{text:`plant`,correct:!1,explanation:`Kết thúc bằng âm /t/.`}]},{q:`Viết lại câu không đổi nghĩa: 'No river in the world is longer than the Nile River.' 🌍`,a:[{text:`The Nile River is the longest river in the world.`,correct:!0,explanation:`Chính xác! 'Không có con sông nào dài hơn sông Nile' có nghĩa là 'Sông Nile là con sông dài nhất thế giới'.`},{text:`The Nile River is the most long river in the world.`,correct:!1,explanation:`Sai ngữ pháp vì 'long' là tính từ ngắn, phải dùng 'longest'.`},{text:`The Nile River is as long as all rivers in the world.`,correct:!1,explanation:`Sai nghĩa so sánh bằng.`},{text:`The Nile River is shorter than other rivers.`,correct:!1,explanation:`Ngược hoàn toàn nghĩa gốc.`}]},{q:`Tìm lỗi sai trong câu sau: 'You must to bring a waterproof coat because it may rain heavily.' 🌧️`,a:[{text:`must to bring -> must bring`,correct:!0,explanation:`Đúng rồi! Sau động từ khuyết thiếu 'must' ta dùng động từ nguyên thể không có 'to' (V-inf).`},{text:`waterproof coat -> coat waterproof`,correct:!1,explanation:`Tính từ bổ nghĩa đứng trước danh từ là đúng.`},{text:`because -> so`,correct:!1,explanation:`Liên từ chỉ nguyên nhân 'because' hoàn toàn chính xác.`},{text:`heavily -> heavy`,correct:!1,explanation:`Bổ nghĩa cho động từ 'rain' cần phó từ 'heavily'.`}]},{q:`Chiếc kéo sắc bén dùng để cắt dây thừng và vải bạt khi dựng lều tiếng Anh là gì? ✂️`,a:[{text:`scissors`,correct:!0,explanation:`Chính xác! Cây kéo luôn ở hình thức số nhiều có đuôi -s: 'scissors'.`},{text:`scissor`,correct:!1,explanation:`Không dùng hình thức số ít 'scissor'.`},{text:`knife`,correct:!1,explanation:`'knife' là con dao gọt.`},{text:`fork`,correct:!1,explanation:`'fork' là chiếc dĩa ăn.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'highest / Everest / peak / is / Mount / the / world / in / the / .' 🏔️`,a:[{text:`Mount Everest is the highest peak in the world.`,correct:!0,explanation:`Tuyệt vời! Trật tự câu đúng: Mount Everest + is + the highest peak + in the world.`},{text:`Mount Everest the highest peak is in the world.`,correct:!1,explanation:`Động từ 'is' phải đứng trước cụm so sánh nhất.`},{text:`The highest peak Mount Everest is in the world.`,correct:!1,explanation:`Sai trật tự chủ ngữ.`},{text:`Mount Everest is in the world the highest peak.`,correct:!1,explanation:`Cụm nơi chốn nên đặt ở cuối câu.`}]},{q:`Loài hoa màu hồng thắm đặc trưng cho ngày Tết Nguyên đán ở miền Bắc Việt Nam là gì? 🌸`,a:[{text:`peach blossoms`,correct:!0,explanation:`Chính xác! Hoa đào nở thắm ngày Tết là 'peach blossoms'.`},{text:`apricot blossoms`,correct:!1,explanation:`'apricot blossoms' là hoa mai vàng rực rỡ ở miền Nam.`},{text:`roses`,correct:!1,explanation:`'roses' là hoa hồng.`},{text:`tulips`,correct:!1,explanation:`'tulips' là hoa uất kim hương (hoa tulip).`}]},{q:`Hoa mai vàng rực rỡ tượng trưng cho sự may mắn ngày Tết ở miền Nam tiếng Anh là gì? 🌼`,a:[{text:`apricot blossoms`,correct:!0,explanation:`Đúng rồi! Hoa mai vàng phương Nam là 'apricot blossoms'.`},{text:`peach blossoms`,correct:!1,explanation:`'peach blossoms' là hoa đào miền Bắc.`},{text:`lotus`,correct:!1,explanation:`'lotus' là hoa sen thanh khiết.`},{text:`sunflowers`,correct:!1,explanation:`'sunflowers' là hoa hướng dương.`}]},{q:`Món bánh truyền thống làm từ gạo nếp, đậu xanh và thịt mỡ gói lá dong ngày Tết là gì? 🎍`,a:[{text:`banh chung`,correct:!0,explanation:`Xuất sắc! Bánh chưng truyền thống của người Việt gọi là 'banh chung' (hoặc 'Chung cake').`},{text:`banh mi`,correct:!1,explanation:`'banh mi' là bánh mì kẹp thịt ăn sáng.`},{text:`spring rolls`,correct:!1,explanation:`'spring rolls' là món nem rán / chả giò giòn rụm.`},{text:`sticky rice`,correct:!1,explanation:`'sticky rice' là món xôi nếp dẻo thơm.`}]},{q:`Những phong bao màu đỏ chứa tiền mừng tuổi mà người lớn tặng trẻ nhỏ ngày đầu năm là gì? 🧧`,a:[{text:`lucky money`,correct:!0,explanation:`Chính xác! Tiền lì xì mừng tuổi lấy may đầu năm là 'lucky money'.`},{text:`real money`,correct:!1,explanation:`'real money' là tiền thật nói chung.`},{text:`paper money`,correct:!1,explanation:`'paper money' là tiền giấy lưu hành.`},{text:`pocket money`,correct:!1,explanation:`'pocket money' là tiền tiêu vặt hàng tuần bố mẹ cho.`}]},{q:`Children ___ behave well and say polite wishes to their grandparents at Tet. 👵👴`,a:[{text:`should`,correct:!0,explanation:`Đúng rồi! 'should' dùng để diễn tả lời khuyên về hành vi đúng đắn và tốt đẹp.`},{text:`shouldn't`,correct:!1,explanation:`'shouldn't' là không nên (sai đạo lý).`},{text:`mustn't`,correct:!1,explanation:`'mustn't' là cấm không được làm.`},{text:`needn't`,correct:!1,explanation:`'needn't' là không cần thiết.`}]},{q:`People believe that you ___ sweep the house or throw away garbage on the first day of Tet. 🧹`,a:[{text:`shouldn't`,correct:!0,explanation:`Chính xác! Theo phong tục truyền thống, không nên quét nhà ngày mùng 1 Tết: 'shouldn't sweep the floor'.`},{text:`should`,correct:!1,explanation:`Theo quan niệm dân gian, quét nhà mùng 1 sẽ quét đi tài lộc.`},{text:`must`,correct:!1,explanation:`Bắt buộc quét nhà là sai phong tục Tết.`},{text:`can`,correct:!1,explanation:`'can' chỉ khả năng, không diễn đạt lời khuyên kiêng kỵ.`}]},{q:`Màn pháo hoa rực rỡ thắp sáng bầu trời đêm giao thừa trong tiếng Anh là gì? 🎆`,a:[{text:`fireworks`,correct:!0,explanation:`Tuyệt vời! Pháo hoa là 'fireworks' (hoặc 'firework display').`},{text:`firefighters`,correct:!1,explanation:`'firefighters' là các chiến sĩ lính cứu hỏa.`},{text:`bonfire`,correct:!1,explanation:`'bonfire' là đống lửa trại bùng cháy.`},{text:`fireplace`,correct:!1,explanation:`'fireplace' là lò sưởi trong phòng khách.`}]},{q:`Hành động dọn dẹp và trang hoàng nhà cửa đẹp đẽ trước Tết tiếng Anh là cụm từ nào? 🏮`,a:[{text:`decorate the house`,correct:!0,explanation:`Đúng rồi! 'decorate the house' là trang hoàng, trang trí nhà cửa.`},{text:`destroy the house`,correct:!1,explanation:`'destroy the house' là phá hoại nhà cửa.`},{text:`build the house`,correct:!1,explanation:`'build the house' là xây dựng nhà mới.`},{text:`sell the house`,correct:!1,explanation:`'sell the house' là bán nhà.`}]},{q:`My mother bought ___ fresh flowers and sweet fruits to arrange the five-fruit tray. 🍊`,a:[{text:`some`,correct:!0,explanation:`Chính xác! Dùng 'some' trong câu khẳng định với danh từ số nhiều đếm được ('flowers').`},{text:`any`,correct:!1,explanation:`'any' dùng trong câu phủ định và câu hỏi.`},{text:`an`,correct:!1,explanation:`'flowers' là số nhiều nên không dùng 'an'.`},{text:`much`,correct:!1,explanation:`'much' chỉ dùng với danh từ không đếm được.`}]},{q:`Do you have ___ special plans for the upcoming Lunar New Year tiền lì xì là hành vi không lịch sự.`},{text:`must`,correct:!1,explanation:`Bắt buộc đòi tiền là sai lễ phép.`},{text:`need`,correct:!1,explanation:`Không dùng 'need' trong ngữ cảnh này.`}]},{q:`Người họ hàng thân thích (cô, chú, bác, dì, anh em họ) trong tiếng Anh là gì? 👨‍👩‍👧‍👦`,a:[{text:`relative`,correct:!0,explanation:`Tuyệt vời! 'relative' là người thân, bà con họ hàng.`},{text:`stranger`,correct:!1,explanation:`'stranger' là người xa lạ không quen biết.`},{text:`foreigner`,correct:!1,explanation:`'foreigner' là người ngoại quốc.`},{text:`neighbour`,correct:!1,explanation:`'neighbour' là người hàng xóm sống bên cạnh.`}]},{q:`Đi chùa cầu chúc bình an và sức khỏe cho gia đình đầu năm gọi là gì? ⛩️`,a:[{text:`visit a pagoda`,correct:!0,explanation:`Đúng rồi! 'visit a pagoda' là đi vãn cảnh chùa chiền cầu an.`},{text:`visit a cinema`,correct:!1,explanation:`Đi rạp chiếu phim.`},{text:`visit a factory`,correct:!1,explanation:`Đi tham quan nhà máy.`},{text:`visit a supermarket`,correct:!1,explanation:`Đi mua sắm siêu thị.`}]},{q:`Viết lại câu không đổi nghĩa: 'It is a good idea for you to say thank you when receiving lucky money.' 🎁`,a:[{text:`You should say thank you when receiving lucky money.`,correct:!0,explanation:`Chính xác! 'It is a good idea for S to V' được viết lại bằng cấu trúc 'S + should + V'.`},{text:`You must not say thank you when receiving lucky money.`,correct:!1,explanation:`Ngược hoàn toàn về ý nghĩa.`},{text:`You shouldn't say thank you when receiving lucky money.`,correct:!1,explanation:`Khuyên không nên cảm ơn là sai.`},{text:`Saying thank you is not necessary for you.`,correct:!1,explanation:`Không cần cảm ơn là sai lễ nghĩa.`}]},{q:`Tìm lỗi sai trong câu sau: 'At Tet, Vietnamese people usually cooks special traditional food.' 🍲`,a:[{text:`cooks -> cook`,correct:!0,explanation:`Đúng rồi! Chủ ngữ 'Vietnamese people' là danh từ số nhiều (người dân) nên động từ phải giữ nguyên 'cook'.`},{text:`At Tet -> In Tet`,correct:!1,explanation:`Giới từ 'At Tet' là hoàn toàn chính xác.`},{text:`usually -> usual`,correct:!1,explanation:`Cần trạng từ tần suất 'usually' bổ nghĩa cho động từ.`},{text:`food -> foods`,correct:!1,explanation:`'food' là danh từ không đếm được hoặc số nhiều đều chuẩn.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'wish / and / I / health / happiness / you / good / . ' 🍀`,a:[{text:`I wish you good health and happiness.`,correct:!0,explanation:`Xuất sắc! Lời chúc Tết kinh điển: 'I wish you good health and happiness.' (Tôi chúc bạn dồi dào sức khỏe và hạnh phúc).`},{text:`I wish good health and you happiness.`,correct:!1,explanation:`Đại từ tân ngữ 'you' phải đứng ngay sau động từ 'wish'.`},{text:`Good health and happiness I wish you.`,correct:!1,explanation:`Sai trật tự tự nhiên của câu chúc.`},{text:`You wish I good health and happiness.`,correct:!1,explanation:`Đảo ngược người chúc và người nhận.`}]},{q:`Người đầu tiên xông đất bước vào nhà trong sáng mùng 1 Tết tiếng Anh gọi là: 🚪`,a:[{text:`first footer`,correct:!0,explanation:`Chính xác! Người xông nhà đầu năm mới gọi là 'first footer'.`},{text:`first runner`,correct:!1,explanation:`Vận động viên về nhất.`},{text:`first builder`,correct:!1,explanation:`Người thợ xây đầu tiên.`},{text:`first driver`,correct:!1,explanation:`Người tài xế đầu tiên.`}]},{q:`Chương trình hoạt hình sống động vẽ bằng tranh vẽ hoặc đồ họa 3D tiếng Anh là gì? 🐭`,a:[{text:`animated film`,correct:!0,explanation:`Chính xác! Phim hoạt hình là 'animated film' (hoặc 'cartoon').`},{text:`documentary`,correct:!1,explanation:`'documentary' là phim tài liệu về đời thực.`},{text:`weather forecast`,correct:!1,explanation:`'weather forecast' là bản tin dự báo thời tiết.`},{text:`talent show`,correct:!1,explanation:`'talent show' là cuộc thi tìm kiếm tài năng.`}]},{q:`Chương trình truyền hình cung cấp thông tin dự báo nắng mưa, bão tuyết hàng ngày là gì? ⛅`,a:[{text:`weather forecast`,correct:!0,explanation:`Đúng rồi! Bản tin dự báo thời tiết là 'weather forecast'.`},{text:`game show`,correct:!1,explanation:`'game show' là trò chơi truyền hình có thưởng.`},{text:`comedy`,correct:!1,explanation:`'comedy' là phim hài / kịch hài hước.`},{text:`sports programme`,correct:!1,explanation:`'sports programme' là chương trình bình luận thể thao.`}]},{q:`Bộ phim tài liệu ghi lại chân thực về thế giới hoang dã và lịch sử gọi là gì? 🦁`,a:[{text:`documentary`,correct:!0,explanation:`Xuất sắc! Phim tài liệu là 'documentary'.`},{text:`soap opera`,correct:!1,explanation:`'soap opera' là phim truyền hình dài tập tình cảm.`},{text:`music show`,correct:!1,explanation:`'music show' là đại nhạc hội ca nhạc.`},{text:`sitcom`,correct:!1,explanation:`'sitcom' là phim hài kịch tình huống.`}]},{q:`Người dẫn chương trình duyên dáng kết nối các tiết mục trên sóng truyền hình gọi là gì? 🎤`,a:[{text:`MC`,correct:!0,explanation:`Chính xác! Người dẫn chương trình là 'MC' (viết tắt của Master of Ceremonies, hoặc 'host').`},{text:`viewer`,correct:!1,explanation:`'viewer' là khán giả ngồi xem trước màn ảnh nhỏ.`},{text:`newsreader`,correct:!1,explanation:`'newsreader' là phát thanh viên đọc bản tin thời sự.`},{text:`cameraman`,correct:!1,explanation:`'cameraman' là người quay phim điều khiển máy quay.`}]},{q:`Người đọc bản tin thời sự 19h chính luận nghiêm túc trên sóng truyền hình gọi là gì? 📰`,a:[{text:`newsreader`,correct:!0,explanation:`Đúng rồi! Phát thanh viên bản tin tin tức là 'newsreader'.`},{text:`comedian`,correct:!1,explanation:`'comedian' là diễn viên hài kịch.`},{text:`audience`,correct:!1,explanation:`'audience' là khán giả theo dõi trực tiếp tại trường quay.`},{text:`singer`,correct:!1,explanation:`'singer' là ca sĩ biểu diễn.`}]},{q:`Chiếc điều khiển từ xa dùng để chuyển kênh tivi mà không cần lại gần màn hình là gì? 📺`,a:[{text:`remote control`,correct:!0,explanation:`Tuyệt vời! Chiếc điều khiển từ xa là 'remote control'.`},{text:`joystick`,correct:!1,explanation:`'joystick' là tay cầm chơi game điện tử.`},{text:`mouse`,correct:!1,explanation:`'mouse' là con chuột máy tính.`},{text:`keyboard`,correct:!1,explanation:`'keyboard' là bàn phím gõ chữ.`}]},{q:`I like watching educational programmes on VTV7 ___ they help me learn a lot of new things. 💡`,a:[{text:`because`,correct:!0,explanation:`Chính xác! 'because' là liên từ chỉ lý do, nguyên nhân (bởi vì).`},{text:`so`,correct:!1,explanation:`'so' là liên từ chỉ kết quả (vì vậy, cho nên).`},{text:`although`,correct:!1,explanation:`'although' là liên từ chỉ sự tương phản (mặc dù).`},{text:`but`,correct:!1,explanation:`'but' là liên từ chỉ sự đối lập (nhưng).`}]},{q:`___ the comedy was very funny, my grandfather fell asleep halfway through. 😴`,a:[{text:`Although`,correct:!0,explanation:`Đúng rồi! 'Although' (mặc dù) diễn tả hai vế câu mang nghĩa tương phản nhau.`},{text:`Because`,correct:!1,explanation:`Nếu phim rất hài hước thì lý do buồn ngủ là vô lý.`},{text:`So`,correct:!1,explanation:`'So' không đứng ở đầu mệnh đề trạng ngữ trước dấu phẩy.`},{text:`And`,correct:!1,explanation:`Liên từ 'And' không tạo ra mệnh đề nhượng bộ.`}]},{q:`The weather forecast said it would rain heavily, ___ we decided to stay at home and watch TV. 🌧️`,a:[{text:`so`,correct:!0,explanation:`Chính xác! 'so' (cho nên, vì thế) nối vế câu chỉ nguyên nhân với vế câu chỉ kết quả.`},{text:`because`,correct:!1,explanation:`Đặt 'because' ở đây bị ngược trật tự nguyên nhân kết quả.`},{text:`although`,correct:!1,explanation:`'although' chỉ sự nhượng bộ trái ngược.`},{text:`or`,correct:!1,explanation:`'or' chỉ sự lựa chọn (hoặc là).`}]},{q:`My sister likes listening to music, ___ she doesn't like watching talent shows on TV. 🎵`,a:[{text:`but`,correct:!0,explanation:`Đúng rồi! 'but' (nhưng) dùng để nối hai mệnh đề mang ý nghĩa trái ngược nhau.`},{text:`and`,correct:!1,explanation:`'and' dùng cho hai ý đồng thuận.`},{text:`because`,correct:!1,explanation:`Vế sau không phải là nguyên nhân của vế trước.`},{text:`so`,correct:!1,explanation:`Vế sau không phải là hệ quả.`}]},{q:`___ do you watch this nature documentary `Xuất sắc! Các chữ cái ghép thành từ 'channel' (kênh truyền hình).`},{text:`channle`,correct:!1,explanation:`Sai vị trí chữ l và e cuối từ.`},{text:`chennal`,correct:!1,explanation:`Sai nguyên âm a thành e.`},{text:`challen`,correct:!1,explanation:`Không phải từ có nghĩa.`}]},{q:`Viết lại câu không đổi nghĩa: 'Although the film was broadcast late at night, many children watched it.' 🌙`,a:[{text:`The film was broadcast late at night, but many children watched it.`,correct:!0,explanation:`Chính xác! Mệnh đề 'Although A, B' chuyển đổi tương đương thành 'A, but B'.`},{text:`Although the film was broadcast late, but many children watched it.`,correct:!1,explanation:`Trong tiếng Anh đã có 'Although' thì tuyệt đối không dùng 'but'.`},{text:`The film was broadcast late, so many children watched it.`,correct:!1,explanation:`Dùng 'so' là sai hoàn toàn logic nhân quả.`},{text:`Because the film was late, many children watched it.`,correct:!1,explanation:`Dùng 'because' là sai logic.`}]},{q:`Tìm lỗi sai trong câu sau: 'Why do you like this game show? - Because it is bored and silly.' ❓`,a:[{text:`bored -> boring`,correct:!0,explanation:`Đúng rồi! Tính chất của một chương trình truyền hình gây nhàm chán phải dùng tính từ đuôi -ing ('boring'), 'bored' chỉ cảm xúc con người.`},{text:`Why -> What`,correct:!1,explanation:`Hỏi lý do dùng 'Why' là hoàn toàn đúng.`},{text:`Because -> Although`,correct:!1,explanation:`Trả lời cho 'Why' bắt đầu bằng 'Because' là chuẩn.`},{text:`silly -> sillier`,correct:!1,explanation:`Không có so sánh hơn ở đây.`}]},{q:`Chương trình truyền hình giúp người xem học hỏi kiến thức khoa học, tiếng Anh và văn hóa gọi là chương trình: 🧠`,a:[{text:`educational`,correct:!0,explanation:`Chính xác! 'educational programme' là chương trình mang tính giáo dục bổ ích.`},{text:`boring`,correct:!1,explanation:`'boring' là nhàm chán vô bổ.`},{text:`tiring`,correct:!1,explanation:`'tiring' là mệt mỏi kiệt sức.`},{text:`violent`,correct:!1,explanation:`'violent' là mang tín nh không thể ở dạng nguyên thể 'go'.`}]},{q:`We ___ play badminton yesterday morning because it rained all day. 🌧️ (Đã không chơi)`,a:[{text:`didn't`,correct:!0,explanation:`Chính xác! Phủ định thì Quá khứ đơn với động từ thường: 'didn't + V-inf' ('didn't play').`},{text:`don't`,correct:!1,explanation:`Phủ định ở thì hiện tại đơn.`},{text:`weren't`,correct:!1,explanation:`Không dùng 'weren't' đứng trước động từ thường nguyên thể.`},{text:`haven't`,correct:!1,explanation:`Phủ định hiện tại hoàn thành.`}]},{q:`Khi muốn hô hào mệnh lệnh: 'Đừng chạy trong hành lang trơn trượt!', em nói: 🚫`,a:[{text:`Don't run in the slippery corridor!`,correct:!0,explanation:`Đúng rồi! Cấu trúc câu mệnh lệnh phủ định: 'Don't + V-inf'.`},{text:`Not run in the slippery corridor!`,correct:!1,explanation:`Thiếu trợ động từ 'do'.`},{text:`No run in the slippery corridor!`,correct:!1,explanation:`Không dùng 'No' đứng trước động từ nguyên thể để ra lệnh.`},{text:`Don't running in the slippery corridor!`,correct:!1,explanation:`Sau 'Don't' dùng động từ nguyên thể, không thêm -ing.`}]},{q:`Câu mệnh lệnh yêu cầu: 'Hãy chuyền bóng nhanh cho Nam!' trong trận đấu viết thế nào? ⚽`,a:[{text:`Pass the ball quickly to Nam!`,correct:!0,explanation:`Chính xác! Câu mệnh lệnh khẳng định bắt đầu bằng động từ nguyên thể 'Pass the ball...'.`},{text:`Passing the ball quickly to Nam!`,correct:!1,explanation:`Không dùng V-ing mở đầu câu mệnh lệnh trực tiếp.`},{text:`To pass the ball quickly to Nam!`,correct:!1,explanation:`Không dùng động từ nguyên mẫu có 'to'.`},{text:`You are passing the ball quickly!`,correct:!1,explanation:`Đây là câu trần thuật tiếp diễn, không phải câu mệnh lệnh.`}]},{q:`Odd one out: Chọn từ có phát âm nguyên âm là /e/ (khác với âm /æ/ bẹt): tennis, chess, member, racket 🎾`,a:[{text:`racket`,correct:!0,explanation:`Chính xác! 'racket' có nguyên âm /æ/ bẹt, trong khi tennis, chess, member đều có nguyên âm /e/ ngắn.`},{text:`tennis`,correct:!1,explanation:`Có nguyên âm /e/ ngắn.`},{text:`chess`,correct:!1,explanation:`Có nguyên âm /e/ ngắn.`},{text:`member`,correct:!1,explanation:`Có nguyên âm /e/ ngắn.`}]},{q:`Odd one out: Từ nào chỉ MÔN THỂ THAO, không phải dụng cụ thi đấu? 🏸`,a:[{text:`table tennis`,correct:!0,explanation:`Đúng rồi! 'table tennis' (môn bóng bàn) là môn thể thao, còn racket, ball, goggles là dụng cụ thi đấu.`},{text:`racket`,correct:!1,explanation:`'racket' là cây vợt đánh bóng.`},{text:`ball`,correct:!1,explanation:`'ball' là quả bóng tròn.`},{text:`goggles`,correct:!1,explanation:`'goggles' là chiếc kính bơi.`}]},{q:`Sắp xếp chữ cái thành từ chỉ vận động viên vô địch: 'p - o - c - h - m - i - a - n' 🥇`,a:[{text:`champion`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'champion' (nhà vô địch giải đấu).`},{text:`champoin`,correct:!1,explanation:`Sai vị trí chữ o và i.`},{text:`chanpion`,correct:!1,explanation:`Sai chữ m thành n.`},{text:`champino`,correct:!1,explanation:`Sai chính tả tiếng Anh.`}]},{q:`Duy bought a pair of running shoes and a new skateboard at the sports shop ___. 🛹`,a:[{text:`yesterday`,correct:!0,explanation:`Chính xác! 'bought' là thì quá khứ đơn nên trạng từ chỉ thời gian phù hợp là 'yesterday' (hôm qua).`},{text:`tomorrow`,correct:!1,explanation:`'tomorrow' là ngày mai, thuộc thì tương lai.`},{text:`now`,correct:!1,explanation:`'now' là bây giờ, thuộc thì tiếp diễn.`},{text:`every day`,correct:!1,explanation:`'every day' diễn tả thói quen hiện tại đơn.`}]},{q:`Pelé was one of the greatest ___ players in the history of world sports. ⚽`,a:[{text:`football`,correct:!0,explanation:`Đúng rồi! Vua bóng đá Pelé là cầu thủ bóng đá huyền thoại ('football player').`},{text:`tennis`,correct:!1,explanation:`Pelé không chơi quần vợt.`},{text:`chess`,correct:!1,explanation:`Pelé không phải kỳ thủ cờ vua.`},{text:`swimming`,correct:!1,explanation:`Không nói 'swimming player'.`}]},{q:`Viết lại câu không đổi nghĩa: 'It is not good to eat a lot of fast food before exercising.' 🍔`,a:[{text:`Don't eat a lot of fast food before exercising.`,correct:!0,explanation:`Chính xác! Lời khuyên không nên làm được viết thành câu mệnh lệnh phủ định 'Don't + V'.`},{text:`Eat a lot of fast food before exercising.`,correct:!1,explanation:`Ngược hoàn toàn về ý nghĩa.`},{text:`You must eat a lot of fast food.`,correct:!1,explanation:`Bắt buộc ăn nhiều thức ăn nhanh là sai.`},{text:`Eating fast food is good for exercising.`,correct:!1,explanation:`Sai sự thật khoa học.`}]},{q:`Tìm lỗi sai trong câu sau: 'Did you went to the basketball match with your classmates last Sunday?' 🏀`,a:[{text:`went -> go`,correct:!0,explanation:`Đúng rồi! Sau trợ động từ 'Did' trong câu hỏi quá khứ đơn, động từ chính phải trở về nguyên thể 'go'.`},{text:`Did -> Do`,correct:!1,explanation:`Câu có dấu hiệu 'last Sunday' nên dùng 'Did' là đúng.`},{text:`with -> to`,correct:!1,explanation:`Đi xem cùng ai dùng giới từ 'with' là chuẩn.`},{text:`last Sunday -> next Sunday`,correct:!1,explanation:`Không cần thay đổi mốc thời gian.`}]},{q:`Tập luyện thể thao đều đặn giúp chúng ta duy trì một cơ thể khỏe khoắn và cân đối. 'Thon gọn, khỏe mạnh' là tính từ: 💪`,a:[{text:`fit`,correct:!0,explanation:`Chính xác! 'fit' (hoặc 'keep fit') có nghĩa là giữ cơ thể thon gọn khỏe mạnh.`},{text:`fat`,correct:!1,explanation:`'fat' là béo phì.`},{text:`weak`,correct:!1,explanation:`'weak' là yếu ớt suy nhược.`},{text:`lazy`,correct:!1,explanation:`'lazy' là lười nhác lười vận động.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'practised / They / judo / yesterday / gym / the / in / .' 🥋`,a:[{text:`They practised judo in the gym yesterday.`,correct:!0,explanation:`Xuất sắc! Trật tự câu: S (They) + V quá khứ (practised) + O (judo) + Nơi chốn (in the gym) + Thời gian (yesterday).`},{text:`They judo practised in the gym yesterday.`,correct:!1,explanation:`Tân ngữ 'judo' không được đứng trước động từ.`},{text:`Yesterday they in the gym judo practised.`,correct:!1,explanation:`Sai trật tự các thành phần câu.`},{text:`Practised they judo in the gym yesterday.`,correct:!1,explanation:`Đây không phải câu hỏi.`}]},{q:`What sports equipment do you need for playing badminton? 🏸`,a:[{text:`A racket and a shuttlecock.`,correct:!0,explanation:`Chính xác! Để chơi cầu lông ta cần cây vợt ('racket') và quả cầu lông ('shuttlecock').`},{text:`A ball and a net.`,correct:!1,explanation:`Bóng và lưới dùng cho bóng chuyền hoặc bóng rổ.`},{text:`A pair of goggles.`,correct:!1,explanation:`Kính bơi dùng cho môn bơi lội.`},{text:`A skateboard and a helmet.`,correct:!1,explanation:`Ván trượt và mũ bảo hiểm dùng cho môn trượt ván.`}]},{q:`Địa danh nổi tiếng hoặc công trình kiến trúc mang tính biểu tượng của một thành phố gọi là: 🗽`,a:[{text:`landmark`,correct:!0,explanation:`Chính xác! 'landmark' là thắng cảnh hoặc công trình biểu tượng của thành phố.`},{text:`building`,correct:!1,explanation:`'building' là tòa nhà thông thường.`},{text:`street`,correct:!1,explanation:`'street' là con phố đi lại.`},{text:`market`,correct:!1,explanation:`'market' là khu chợ buôn bán.`}]},{q:`Tháp Eiffel bằng thép nổi tiếng thế giới tọa lạc tại thủ đô nào? 🗼`,a:[{text:`Paris`,correct:!0,explanation:`Đúng rồi! Tháp Eiffel là biểu tượng của thủ đô Paris, nước Pháp.`},{text:`London`,correct:!1,explanation:`London có tháp đồng hồ Big Ben.`},{text:`Tokyo`,correct:!1,explanation:`Tokyo là thủ đô của Nhật Bản.`},{text:`New York`,correct:!1,explanation:`New York có Tượng Nữ thần Tự do.`}]},{q:`Tượng Nữ thần Tự do (Statue of Liberty) khổng lồ là công trình biểu tượng của thành phố nào? 🗽`,a:[{text:`New York`,correct:!0,explanation:`Xuất sắc! Tượng Nữ thần Tự do nằm ở thành phố New York, nước Mỹ.`},{text:`Washington D.C.`,correct:!1,explanation:`Washington D.C. là thủ đô hành chính của Mỹ.`},{text:`Sydney`,correct:!1,explanation:`Sydney có Nhà hát Con Sò.`},{text:`London`,correct:!1,explanation:`London là thủ đô vương quốc Anh.`}]},{q:`Công trình Nhà hát Opera có mái vòm hình cánh buồm con sò độc đáo nằm ở thành phố nào của nước Úc? ⛵`,a:[{text:`Sydney`,correct:!0,e e'.`},{text:`for`,correct:!1,explanation:`'for' chỉ đi với khoảng thời gian đếm được.`},{text:`from`,correct:!1,explanation:`Thường đi thành cặp 'from... to...', không đứng đơn độc ở thì hiện tại hoàn thành như 'since'.`},{text:`ago`,correct:!1,explanation:`'ago' đi với thì quá khứ đơn (three years ago).`}]},{q:`This smartphone is not mine. Is it ___? 📱 (Chiếc điện thoại này có phải của bạn không?)`,a:[{text:`yours`,correct:!0,explanation:`Đúng rồi! Đại từ sở hữu thay thế cho 'your smartphone' là 'yours'.`},{text:`your`,correct:!1,explanation:`'your' là tính từ sở hữu, bắt buộc phải có danh từ đi sau (your phone).`},{text:`you`,correct:!1,explanation:`'you' là đại từ nhân xưng chủ ngữ hoặc tân ngữ.`},{text:`yourself`,correct:!1,explanation:`'yourself' là đại từ phản thân (chính bạn).`}]},{q:`My bicycle is red, but ___ is painted bright blue. 🚲 (Chiếc xe đạp của cô ấy)`,a:[{text:`hers`,correct:!0,explanation:`Chính xác! Đại từ sở hữu thay thế cho 'her bicycle' đứng làm chủ ngữ là 'hers'.`},{text:`her`,correct:!1,explanation:`'her' là tính từ sở hữu hoặc tân ngữ, không đứng độc lập làm chủ ngữ thay danh từ.`},{text:`she`,correct:!1,explanation:`'she' là đại từ nhân xưng chỉ người, không phải xe đạp.`},{text:`herself`,correct:!1,explanation:`Đại từ phản thân.`}]},{q:`Our classroom is on the second floor, and ___ is on the third floor. 🏫 (Phòng học của họ)`,a:[{text:`theirs`,correct:!0,explanation:`Đúng rồi! Đại từ sở hữu thay thế cho 'their classroom' là 'theirs'.`},{text:`their`,correct:!1,explanation:`'their' là tính từ sở hữu, thiếu danh từ đi sau.`},{text:`them`,correct:!1,explanation:`'them' là tân ngữ chỉ người/vật.`},{text:`they`,correct:!1,explanation:`'they' là đại từ chủ ngữ.`}]},{q:`Odd one out: Chọn từ có nguyên âm phát âm là /əʊ/ (khác với âm /aʊ/): boat, old, postcard, crowded 📬`,a:[{text:`crowded`,correct:!0,explanation:`Chính xác! 'crowded' phát âm nguyên âm là /aʊ/, trong khi boat, old, postcard đều có âm /əʊ/.`},{text:`boat`,correct:!1,explanation:`Có tter`,correct:!1,explanation:`'letter' là lá thư viết tay.`}]},{q:`Nguồn năng lượng sạch vô tận lấy từ ánh sáng mặt trời để chạy các thiết bị trong tương lai là gì? ☀️`,a:[{text:`solar energy`,correct:!0,explanation:`Chính xác! Năng lượng mặt trời là 'solar energy'.`},{text:`wind energy`,correct:!1,explanation:`'wind energy' là năng lượng gió từ tuabin.`},{text:`nuclear energy`,correct:!1,explanation:`'nuclear energy' là năng lượng hạt nhân.`},{text:`fossil fuels`,correct:!1,explanation:`'fossil fuels' là nhiên liệu hóa thạch gây ô nhiễm.`}]},{q:`Vật thể bay không xác định (đĩa bay của người ngoài hành tinh) viết tắt là gì? 🛸`,a:[{text:`UFO`,correct:!0,explanation:`Đúng rồi! Đĩa bay viết tắt từ Unidentified Flying Object là 'UFO'.`},{text:`USB`,correct:!1,explanation:`'USB' là thiết bị lưu trữ dữ liệu máy tính.`},{text:`VIP`,correct:!1,explanation:`'VIP' là nhân vật quan trọng.`},{text:`ATM`,correct:!1,explanation:`'ATM' là cây rút tiền tự động.`}]},{q:`Trạm không gian bay trên quỹ đạo Trái Đất nơi các nhà du hành vũ trụ sinh sống và làm việc gọi là gì? 🛰️`,a:[{text:`space station`,correct:!0,explanation:`Xuất sắc! Trạm vũ trụ không gian là 'space station'.`},{text:`spacecraft`,correct:!1,explanation:`'spacecraft' là con tàu du hành vũ trụ.`},{text:`airport`,correct:!1,explanation:`'airport' là sân bay mặt đất.`},{text:`bus stop`,correct:!1,explanation:`'bus stop' là điểm dừng xe buýt.`}]},{q:`Các thiết bị điện máy gia dụng hiện đại tự động hóa trong ngôi nhà thông minh gọi là: 🔌`,a:[{text:`appliances`,correct:!0,explanation:`Chính xác! Thiết bị đồ dùng gia dụng là 'appliances' (modern appliances).`},{text:`tools`,correct:!1,explanation:`'tools' là dụng cụ thô sơ như cờ lê, búa đinh.`},{text:`weapons`,correct:!1,explanation:`'weapons' là vũ khí quân sự.`},{text:`vehicles`,correct:!1,explanation:`'vehicles' là phương tiện giao thông xe cộ.`}]},{q:`In the year 2050, robots ___ do all the heavy and boring housework for humans. 🤖 (Sẽ làm)`,a:[{text:`will`,correct:!0,exp ly. 🗣️ (Nhận diện giọng nói)`,a:[{text:`recognise`,correct:!0,explanation:`Chính xác! 'recognise' (hoặc 'recognize') nghĩa là nhận diện, nhận biết tín hiệu.`},{text:`forget`,correct:!1,explanation:`'forget' là quên mất.`},{text:`destroy`,correct:!1,explanation:`'destroy' là phá hủy làm hỏng.`},{text:`lose`,correct:!1,explanation:`'lose' là làm đánh mất.`}]},{q:`Ngôi nhà tương lai thân thiện với môi trường nhờ lắp đặt kính cách nhiệt và hệ thống tái chế nước gọi là: 🌿🏠`,a:[{text:`eco-friendly house`,correct:!0,explanation:`Tuyệt vời! 'eco-friendly' nghĩa là thân thiện với môi trường tự nhiên.`},{text:`noisy house`,correct:!1,explanation:`'noisy' là ồn ào ô nhiễm tiếng ồn.`},{text:`polluted house`,correct:!1,explanation:`'polluted' là bị nhiễm bẩn ô nhiễm.`},{text:`dark house`,correct:!1,explanation:`'dark' là tối tăm u ám.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'will / What / your / like / be / future / house / ?' 🏡`,a:[{text:`What will your future house be like?`,correct:!0,explanation:`Xuất sắc! Cấu trúc hỏi miêu tả trong tương lai: 'What will + S + be like?'.`},{text:`What your future house will be like?`,correct:!1,explanation:`Trợ động từ 'will' phải đảo lên trước chủ ngữ 'your future house'.`},{text:`What will be like your future house?`,correct:!1,explanation:`Chủ ngữ phải đứng giữa 'will' và 'be like'.`},{text:`How will your future house be like?`,correct:!1,explanation:`Hỏi với 'like' phải dùng 'What', không dùng 'How'.`}]},{q:`Will you have a swimming pool on the roof of your future house? 🏊 (Có, tôi sẽ có)`,a:[{text:`Yes, I will.`,correct:!0,explanation:`Chính xác! Câu hỏi Yes/No với 'Will you...?' trả lời khẳng định là 'Yes, I will.'.`},{text:`Yes, I do.`,correct:!1,explanation:`Câu hỏi bắt đầu bằng 'Will', không trả lời bằng 'do'.`},{text:`Yes, I am.`,correct:!1,explanation:`Không dùng động từ to be 'am' ở đây.`},{text:`No, I will.`,correct:!1,explanation:`Đã trả lời 'No' thì phải đi với phủ định 'won't'.`}]},{q:`Chiến dịch 3Rs bảo vệ môi trường thế
