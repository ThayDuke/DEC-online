 + V(hiện tại đơn), S + will + V-inf'.`},{text:`saved`,correct:!1,explanation:`Quá khứ đơn, không dùng cho điều kiện loại 1 có thật ở hiện tại/tương lai.`},{text:`save`,correct:!1,explanation:`Mệnh đề chính cần trợ động từ 'will' chỉ hệ quả tương lai.`},{text:`would save`,correct:!1,explanation:`Dùng trong câu điều kiện loại 2 giả định không có thật.`}]},{q:`If people continue to pollute rivers with chemical waste, fish and sea animals ___. 🐟⚠️`,a:[{text:`will die`,correct:!0,explanation:`Chính xác! Mệnh đề chính câu điều kiện loại 1 dùng 'will + V-inf' ('will die').`},{text:`die`,correct:!1,explanation:`Thiếu trợ động từ 'will'.`},{text:`died`,correct:!1,explanation:`Quá khứ đơn sai cấu trúc.`},{text:`are dying`,correct:!1,explanation:`Hiện tại tiếp diễn không chuẩn cho mệnh đề kết quả loại 1.`}]},{q:`What will happen if we ___ turning off taps when brushing our teeth? 🚰`,a:[{text:`forget`,correct:!0,explanation:`Đúng rồi! Trong mệnh đề If của câu điều kiện loại 1, động từ chia ở thì hiện tại đơn ('forget').`},{text:`will forget`,correct:!1,explanation:`Không dùng 'will' trong mệnh đề chứa liên từ 'If'.`},{text:`forgot`,correct:!1,explanation:`Quá khứ đơn sai thì.`},{text:`forgetting`,correct:!1,explanation:`Động từ chưa chia to be.`}]},{q:`You will save a lot of money on electricity bills if you ___ the lights before leaving the room. 💡`,a:[{text:`turn off`,correct:!0,explanation:`Chính xác! 'turn off the lights' là tắt đèn điện, động từ ở mệnh đề If chia hiện tại đơn.`},{text:`turn on`,correct:!1,explanation:`'turn on' là bật đèn (sẽ tốn thêm tiền điện).`},{text:`will turn off`,correct:!1,explanation:`Mệnh đề If không dùng 'will'.`},{text:`turned off`,correct:!1,explanation:`Quá khứ đơn sai thì.`}]},{q:`Túi đựng đồ bằng vải có thể giặt sạch và sử dụng lại nhiều lần khi đi chợ gọi là: 🛍️`,a:[{text:`reusable bag`,correct:!0,explanation:`Tuyệt vời! 'reusable bag' là túi tái sử dụng thân thiện môi trường thay thế túi nilon.`},{text:`plastic bag`,correct:!1,explanation:`'plastic bag' là túi nilon khó phân hủy gây hại môi trường.`},{text:`paper bag`,correct:!1,explanation:`'paper bag' là túi giấy dùng một vài lần.`},{text:`garbage bag`,correct:!1,explanation:`'garbage bag' là túi đựng rác thải sinh hoạt.`}]},{q:`Hiện tượng rừng cây bị đốn hạ và chặt phá bừa bãi trên diện rộng tiếng Anh gọi là: 🪓🌳`,a:[{text:`deforestation`,correct:!0,explanation:`Đúng rồi! Nạn phá rừng là 'deforestation'.`},{text:`reforestation`,correct:!1,explanation:`'reforestation' là hoạt động trồng cây gây rừng lại.`},{text:`pollution`,correct:!1,explanation:`'pollution' là ô nhiễm môi trường.`},{text:`global warming`,correct:!1,explanation:`'global warming' là sự nóng lên toàn cầu.`}]},{q:`Chiếc thùng chứa rác có nắp đậy đặt trên hè phố để mọi người bỏ rác vào là: 🗑️`,a:[{text:`rubbish bin`,correct:!0,explanation:`Chính xác! Thùng rác là 'rubbish bin' (hoặc 'dustbin', 'trash can').`},{text:`bottle`,correct:!1,explanation:`'bottle' là chiếc chai thủy tinh/nhựa.`},{text:`container`,correct:!1,explanation:`'container' là thùng hàng container lớn.`},{text:`carton`,correct:!1,explanation:`'carton' là hộp bìa các-tông đựng sữa.`}]},{q:`Odd one out: Chọn hành động GÂY HẠI cho môi trường sống trong 4 hành động sau: 🚯`,a:[{text:`littering in public places`,correct:!0,explanation:`Đúng rồi! 'littering' (vứt rác bừa bãi nơi công cộng) là hành động phá hoại môi trường.`},{text:`planting more green trees`,correct:!1,explanation:`Trồng thêm cây xanh là bảo vệ môi trường.`},{text:`recycling plastic bottles`,correct:!1,explanation:`Tái chế chai nhựa là bảo vệ môi trường.`},{text:`riding bicycles to school`,correct:!1,explanation:`Đi xe đạp giúp giảm khói bụi ô nhiễm không khí.`}]},{q:`Odd one out: Từ nào chỉ CHẤT THẢI / Ô NHIỄM, không phải vật dụng thân thiện môi trường? ⚠️`,a:[{text:`chemical waste`,correct:!0,explanation:`Chính xác! 'chemical waste' (chất thải hóa học độc hại) gây ô nhiễm, còn reusable bag, solar panel, water bottle là giải pháp xanh.`},{text:`reusable bag`,correct:!1,explanation:`Túi vải dùng nhiều lần bảo vệ thiên nhiên.`},{text:`solar panel`,correct:!1,explanation:`Tấm pin năng lượng mặt trời sạch.`},{text:`refillable bottle`,correct:!1,explanation:`Bình đựng nước tái nạp nhiều lần.`}]},{q:`Sắp xếp chữ cái thành từ chỉ môi trường sống tự nhiên: 'n - e - t - o - n - i - m - r - n - v - e' 🌍`,a:[{text:`environment`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'environment' (môi trường tự nhiên).`},{text:`enviroment`,correct:!1,explanation:`Sai chính tả, thiếu chữ n trước ment.`},{text:`environmet`,correct:!1,explanation:`Thiếu chữ n cuối từ.`},{text:`enviroments`,correct:!1,explanation:`Thừa chữ s.`}]},{q:`Viết lại câu sử dụng câu điều kiện loại 1: 'Plant more trees and the air will be cleaner.' 🌲`,a:[{text:`If we plant more trees, the air will be cleaner.`,correct:!0,explanation:`Chính xác! Cấu trúc 'V and S will...' chuyển thành 'If we + V, S will...'.`},{text:`If we plant more trees, so the air will be cleaner.`,correct:!1,explanation:`Trong câu điều kiện không dùng liên từ 'so' sau dấu phẩy.`},{text:`If we planted more trees, the air will be cleaner.`,correct:!1,explanation:`Mệnh đề If chia quá khứ đơn là sai quy tắc loại 1.`},{text:`Unless we plant more trees, the air will be cleaner.`,correct:!1,explanation:`'Unless' có nghĩa là 'Trừ phi', sai nghĩa hoàn toàn.`}]},{q:`Tìm lỗi sai trong câu sau: 'If you will cycle to school every day, you will help protect the environment.' 🚲`,a:[{text:`will cycle -> cycle`,correct:!0,explanation:`Đúng rồi! Trong mệnh đề phụ bắt đầu bằng 'If', tuyệt đối không dùng trợ động từ 'will'.`},{text:`to school -> at school`,correct:!1,explanation:`'cycle to school' là đi xe đạp đến trường, đúng ngữ pháp.`},{text:`every day -> all days`,correct:!1,explanation:`'every day' chỉ thói quen hàng ngày là chuẩn.`},{text:`protect -> protecting`,correct:!1,explanation:`Sau 'help' dùng động từ nguyên thể 'protect' là hoàn toàn đúng.`}]},{q:`We should put all used plastic bottles into the recycling ___ at school. ♻️`,a:[{text:`bin`,correct:!0,explanation:`Chính xác! Thùng rác tái chế là 'recycling bin'.`},{text:`box`,correct:!1,explanation:`'box' là chiếc hộp kín.`},{text:`bag`,correct:!1,explanation:`'bag' là chiếc túi.`},{text:`pocket`,correct:!1,explanation:`'pocket' là túi quần áo.`}]},{q:`Khí thải độc hại từ các ống khói nhà máy và động cơ xe máy gây ra hiện tượng ô nhiễm gì? 🏭💨`,a:[{text:`air pollution`,correct:!0,explanation:`Tuyệt vời! Ô nhiễm không khí là 'air pollution'.`},{text:`water pollution`,correct:!1,explanation:`Ô nhiễm nguồn nước sông ngòi.`},{text:`noise pollution`,correct:!1,explanation:`Ô nhiễm tiếng ồn âm thanh.`},{text:`soil pollution`,correct:!1,explanation:`Ô nhiễm đất đai thổ nhưỡng.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'will / If / it / rains / stay / we / home / at / .' 🌧️`,a:[{text:`If it rains, we will stay at home.`,correct:!0,explanation:`Xuất sắc! Cấu trúc chuẩn câu điều kiện loại 1: If it rains, we will stay at home.`},{text:`If it will rain, we stay at home.`,correct:!1,explanation:`Mệnh đề If không được dùng 'will'.`},{text:`We will stay home at if it rains.`,correct:!1,explanation:`Cụm 'at home' bị tách rời sai vị trí.`},{text:`If rains it, we will stay at home.`,correct:!1,explanation:`Sai trật tự chủ ngữ và động từ sau 'If'.`}]},{q:`Turning off unnecessary electrical devices is a simple way to ___ energy. ⚡`,a:[{text:`save`,correct:!0,explanation:`Chính xác! 'save energy' là tiết kiệm năng lượng điện.`},{text:`waste`,correct:!1,explanation:`'waste' là lãng phí tiêu hao.`},{text:`damage`,correct:!1,explanation:`'damage' là làm hư hại tổn thất.`},{text:`pollute`,correct:!1,explanation:`'pollute' là gây ô nhiễm.`}]},{q:`Người máy có thể nâng các vật nặng hàng tấn trong công xưởng thực hiện khả năng gì? 🏋️‍♂️`,a:[{text:`heavy lifting`,correct:!0,explanation:`Chính xác! 'heavy lifting' là khả năng bốc vác, nâng nhấc các đồ vật nặng nhọc.`},{text:`light lifting`,correct:!1,explanation:`Nâng vật nhẹ.`},{text:`ironing clothes`,correct:!1,explanation:`'ironing clothes' là ủi là quần áo phẳng phiu.`},{text:`watering flowers`,correct:!1,explanation:`'watering flowers' là tưới hoa trong vườn.`}]},{q:`Hành động dùng bàn ủi nóng để làm phẳng các nếp nhăn trên áo sơ mi và quần tây là gì? 👔`,a:[{text:`iron clothes`,correct:!0,explanation:`Đúng rồi! Là ủi quần áo là cụm động từ 'iron clothes'.`},{text:`wash clothes`,correct:!1,explanation:`'wash clothes' là giặt giũ quần áo trong chậu hoặc máy giặt.`},{text:`make the bed`,correct:!1,explanation:`'make the bed' là dọn dẹp gấp chăn gối.`},{text:`do the dishes`,correct:!1,explanation:`'do the dishes' là rửa chén bát ăn.`}]},{q:`Người máy bảo vệ canh gác cổng tòa nhà suốt ngày đêm chống trộm cắp tiếng Anh gọi là: 💂`,a:[{text:`guard robot`,correct:!0,explanation:`Xuất sắc! Robot bảo vệ canh gác là 'guard robot'.`},{text:`home robot`,correct:!1,explanation:`'home robot' là robot làm việc nhà gia đình.`},{text:`teacher robot`,correct:!1,explanation:`'teacher robot' là robot dạy học sinh.`},{text:`doctor robot`,correct:!1,explanation:`'doctor robot' là robot hỗ trợ bác sĩ mổ phẫu thuật.`}]},{q:`When my grandfather was young, he ___ run five kilometers without feeling tired. 🏃‍♂️ (Khả năng trong quá khứ)`,a:[{text:`could`,correct:!0,explanation:`Chính xác! 'could' là dạng quá khứ của 'can', diễn tả khả năng có thể làm được việc gì trong quá khứ.`},{text:`can`,correct:!1,explanation:`'can' diễn tả khả năng ở hiện tại, không dùng cho 'was young'.`},{text:`will be able to`,correct:!1,explanation:`Diễn tả khả năng trong tương lai.`},{text:`is able to`,correct:!1,explanation:`Hiện tại chia ngôi thứ ba.`}]},{q:`In the near future, scientist believe that smart robots ___ talk and express human feelings. 🤖 (Khả năng trong tương lai)`,a:[{text:`will be able to`,correct:!0,explanation:`Đúng rồi! Cụm từ 'will be able to + V-inf' diễn tả khả năng có thể làm được gì trong tương lai.`},{text:`could`,correct:!1,explanation:`'could' diễn tả khả năng trong quá khứ.`},{text:`can`,correct:!1,explanation:`'can' chỉ dùng cho hiện tại.`},{text:`were able to`,correct:!1,explanation:`Khả năng trong quá khứ.`}]},{q:`Robot có khả năng cắt tỉa cành cây, bón phân và chăm sóc bồn hoa trong sân vườn làm nhiệm vụ: 🌺✂️`,a:[{text:`do gardening`,correct:!0,explanation:`Chính xác! 'do gardening' là làm vườn, chăm sóc cây cảnh.`},{text:`do laundry`,correct:!1,explanation:`'do laundry' là giặt giũ quần áo bẩn.`},{text:`do homework`,correct:!1,explanation:`'do homework' là làm bài tập về nhà.`},{text:`do judo`,correct:!1,explanation:`'do judo' là tập võ judo.`}]},{q:`My little sister is only four years old, but she ___ count from one to one hundred in English. 🔢 (Khả năng hiện tại)`,a:[{text:`can`,correct:!0,explanation:`Đúng rồi! 'can' diễn tả khả năng có thể làm được ở thời điểm hiện tại.`},{text:`could`,correct:!1,explanation:`'could' dùng cho quá khứ.`},{text:`will can`,correct:!1,explanation:`Trong tiếng Anh không bao giờ kết hợp hai động từ khuyết thiếu 'will can'.`},{text:`is`,correct:!1,explanation:`Thiếu 'able to'.`}]},{q:`ASIMO was one of the most famous humanoid robots in the world. 'Humanoid' nghĩa là gì? 🤖`,a:[{text:`Có hình dáng và cử chỉ giống như con người`,correct:!0,explanation:`Chính xác! 'humanoid robot' là người máy hình nhân (có đầu, hai tay, hai chân bước đi như con người).`},{text:`Có hình dáng giống như một chiếc xe ô tô`,correct:!1,explanation:`Đó là ô tô tự hành, không phải humanoid.`},{text:`Có hình dáng giống như một con côn trùng`,correct:!1,explanation:`Đó là insect robot.`},{text:`Là một phần mềm máy tính không có thể xác`,correct:!1,explanation:`Đó là AI chatbot.`}]},{q:`Can a home robot cook special dinners and make tea for guests? ☕ (Có, nó có thể)`,a:[{text:`Yes, it can.`,correct:!0,explanation:`Đúng rồi! Câu hỏi 'Can a home robot...?' trả lời khẳng định là 'Yes, it can.'.`},{text:`Yes, it could.`,correct:!1,explanation:`Câu hỏi ở hiện tại với 'Can', không đổi sang 'could'.`},{text:`Yes, it does.`,correct:!1,explanation:`Câu hỏi dùng động từ khuyết thiếu 'Can', không dùng trợ động từ 'does'.`},{text:`Yes, they can.`,correct:!1,explanation:`'a home robot' là danh từ số ít nên dùng đại từ 'it', không dùng 'they'.`}]},{q:`Although robots are very smart, they ___ replace human teachers in caring for young students. ❤️`,a:[{text:`cannot`,correct:!0,explanation:`Chính xác! 'cannot' (can't) mang nghĩa không thể thay thế được tình yêu thương và sự thấu hiểu của thầy cô.`},{text:`can`,correct:!1,explanation:`Trái ngược với thực tế sư phạm và ngữ cảnh liên từ 'Although'.`},{text:`must`,correct:!1,explanation:`Bắt buộc thay thế là sai hoàn toàn.`},{text:`could`,correct:!1,explanation:`Không diễn tả khả năng hiện tại.`}]},{q:`Odd one out: Chọn động từ KHÔNG PHẢI là một hoạt động việc nhà thường ngày (housework): 🧹`,a:[{text:`explore space`,correct:!0,explanation:`Đúng rồi! 'explore space' (khám phá vũ trụ) là nhiệm vụ khoa học viễn chinh, không phải việc nhà, còn iron clothes, wash dishes, make bed là việc nhà.`},{text:`iron clothes`,correct:!1,explanation:`Ủi quần áo phẳng phiu là việc nhà.`},{text:`wash dishes`,correct:!1,explanation:`Rửa bát đĩa sau bữa ăn là việc nhà.`},{text:`make the bed`,correct:!1,explanation:`Dọn dẹp gấp chăn ga gối đệm là việc nhà.`}]},{q:`Odd one out: Chọn từ có trọng âm rơi vào âm tiết THỨ NHẤT: robot, laundry, machine, garden 🌸`,a:[{text:`machine`,correct:!0,explanation:`Chính xác! 'machine' có trọng âm rơi vào âm tiết 2 /məˈʃiːn/, trong khi robot, laundry, garden đều có trọng âm rơi vào âm tiết thứ nhất.`},{text:`robot`,correct:!1,explanation:`Trọng âm âm tiết 1: /ˈrəʊ.bɒt/.`},{text:`laundry`,correct:!1,explanation:`Trọng âm âm tiết 1: /ˈlɔːn.dri/.`},{text:`garden`,correct:!1,explanation:`Trọng âm âm tiết 1: /ˈɡɑː.dən/.`}]},{q:`Sắp xếp chữ cái thành từ chỉ sự nhận diện giọng nói: 'c - i - o - e - v' 🎤`,a:[{text:`voice`,correct:!0,explanation:`Xuất sắc! Các chữ cái ghép thành từ 'voice' (giọng nói con người).`},{text:`vocie`,correct:!1,explanation:`Sai vị trí chữ i và c.`},{text:`vicoy`,correct:!1,explanation:`Không phải từ tiếng Anh có nghĩa.`},{text:`covie`,correct:!1,explanation:`Sai chính tả.`}]},{q:`Viết lại câu sử dụng cấu trúc tương đương: 'Robots have the ability to recognise faces easily.' 👤`,a:[{text:`Robots can recognise faces easily.`,correct:!0,explanation:`Chính xác! 'have the ability to V' tương đương hoàn toàn với 'can + V-inf'.`},{text:`Robots must recognise faces easily.`,correct:!1,explanation:`'must' chỉ bắt buộc, không chỉ khả năng.`},{text:`Robots should recognise faces easily.`,correct:!1,explanation:`'should' chỉ lời khuyên.`},{text:`Robots could recognise faces easily.`,correct:!1,explanation:`'could' dùng cho quá khứ.`}]},{q:`Tìm lỗi sai trong câu sau: 'Five years ago, smart machines cannot understand human feelings.' 🧠`,a:[{text:`cannot -> could not`,correct:!0,explanation:`Đúng rồi! Mốc thời gian 'Five years ago' thuộc về quá khứ nên phải dùng 'could not' (couldn't), không dùng 'cannot'.`},{text:`smart machines -> machines smart`,correct:!1,explanation:`Tính từ đứng trước danh từ là chuẩn.`},{text:`understand -> understands`,correct:!1,explanation:`Sau modal verb động từ giữ nguyên thể.`},{text:`human feelings -> feelings human`,correct:!1,explanation:`Tính từ đứng trước danh từ bổ nghĩa.`}]},{q:`Cụm từ chỉ việc giặt giũ phơi phóng toàn bộ quần áo trong gia đình tiếng Anh là: 🧺`,a:[{text:`do the laundry`,correct:!0,explanation:`Chính xác! Cụm từ giặt quần áo là 'do the laundry'.`},{text:`make the laundry`,correct:!1,explanation:`Không dùng động từ 'make' với 'laundry'.`},{text:`play the laundry`,correct:!1,explanation:`Không dùng 'play'.`},{text:`take the laundry`,correct:!1,explanation:`Thường dùng 'do the laundry'.`}]},{q:`Sắp xếp các từ sau thành câu đúng: 'will / What / to / robots / do / be / able / in / 2040 / ?' 🤖`,a:[{text:`What will robots be able to do in 2040?`,correct:!0,explanation:`Xuất sắc! Cấu trúc hỏi khả năng tương lai: What will + S (robots) + be able to do in 2040?`},{text:`What robots will be able to do in 2040?`,correct:!1,explanation:`Trợ động từ 'will' phải đứng trước chủ ngữ 'robots' trong câu hỏi.`},{text:`What will be able to do robots in 2040?`,correct:!1,explanation:`Đặt sai vị trí chủ ngữ 'robots'.`},{text:`In 2040 what will robots be able to do?`,correct:!1,explanation:`Từ để hỏi 'What' phải đứng ở vị trí đầu câu chuẩn ngữ pháp.`}]},{q:`Ngữ điệu (Intonation) chuẩn khi đặt câu hỏi Yes/No trong tiếng Anh (ví dụ: 'Can robots talk to humans?') là: 📈`,a:[{text:`Lên giọng ở cuối câu (Rising intonation)`,correct:!0,explanation:`Chính xác! Câu hỏi Yes/No trong tiếng Anh luôn lên giọng ở cuối câu (Rising intonation).`},{text:`Xuống giọng ở cuối câu (Falling intonation)`,correct:!1,explanation:`Xuống giọng dùng cho câu hỏi Wh- và câu trần thuật khẳng định.`},{text:`Giữ nguyên tông giọng bằng phẳng không thay đổi`,correct:!1,explanation:`Sai ngữ điệu chuẩn tiếng Anh.`},{text:`Lên giọng ở từ đầu tiên rồi tắt dần`,correct:!1,explanation:`Sai quy tắc phát âm ngữ điệu.`}]},{q:`Ngữ điệu chuẩn khi kết thúc một câu trần thuật hoặc câu hỏi bắt đầu bằng từ để hỏi Wh- (ví dụ: 'Where does your father work?') là: 📉`,a:[{text:`Xuống giọng ở cuối câu (Falling intonation)`,correct:!0,explanation:`Đúng rồi! Câu hỏi có từ để hỏi Wh- và câu trần thuật luôn hạ thấp ngữ điệu ở cuối câu (Falling intonation).`},{text:`Lên giọng cao vút ở cuối câu`,correct:!1,explanation:`Lên giọng dùng cho câu hỏi Yes/No.`},{text:`Lên giọng ở giữa câu rồi ngừng lại`,correct:!1,explanation:`Sai ngữ điệu.`},{text:`Luôn luôn thì thầm nhỏ giọng`,correct:!1,explanation:`Không phải quy tắc ngữ điệu.`}]},{q:`Sophia is a famous social humanoid robot that was granted citizenship by Saudi Arabia in 2017. 'Citizenship' nghĩa là gì? 📜`,a:[{text:`Quyền công dân chính thức của một quốc gia`,correct:!0,explanation:`Chính xác! 'citizenship' nghĩa là tư cách công dân / quyền công dân của một đất nước.`},{text:`Giải thưởng khoa học kỹ thuật`,correct:!1,explanation:`Đó là award/prize.`},{text:`Tấm bằng tốt nghiệp đại học`,correct:!1,explanation:`Đó là university degree.`},{text:`Quyền sở hữu công ty cổ phần`,correct:!1,explanation:`Đó là ownership.`}]},{q:`What nationality is a person from Japan?`,a:[{text:`Japanese`,correct:!0,explanation:`People from Japan are Japanese.`},{text:`Japanian`,correct:!1,explanation:`The correct nationality word is Japanese.`},{text:`Japanish`,correct:!1,explanation:`Japanish is not the correct word.`},{text:`Chinese`,correct:!1,explanation:`Chinese refers to China.`}]},{q:`Which country is famous for the Eiffel Tower?`,a:[{text:`France`,correct:!0,explanation:`The Eiffel Tower is in France.`},{text:`Italy`,correct:!1,explanation:`Italy is famous for the Colosseum.`},{text:`Australia`,correct:!1,explanation:`Australia is a different country.`},{text:`Brazil`,correct:!1,explanation:`Brazil is in South America.`}]},{q:`Where is New York?`,a:[{text:`In the USA.`,correct:!0,explanation:`New York is a city in the United States.`},{text:`In Canada.`,correct:!1,explanation:`Canada is north of the USA.`},{text:`In Spain.`,correct:!1,explanation:`Spain is in Europe.`},{text:`In Egypt.`,correct:!1,explanation:`Egypt is in Africa.`}]},{q:`People from Australia are ___.`,a:[{text:`Australian`,correct:!0,explanation:`Australian is the nationality adjective.`},{text:`Austria`,correct:!1,explanation:`Austria is a different country.`},{text:`Australic`,correct:!1,explanation:`Australic is not the nationality word.`},{text:`Australish`,correct:!1,explanation:`Australish is incorrect.`}]},{q:`Which language do people commonly speak in England?`,a:[{text:`English`,correct:!0,explanation:`English is the main language of England.`},{text:`French`,correct:!1,explanation:`French is mainly spoken in France.`},{text:`Japanese`,correct:!1,explanation:`Japanese is spoken in Japan.`},{text:`Arabic`,correct:!1,explanation:`Arabic is used in many Arab countries.`}]},{q:`My uncle ___ from Canada.`,a:[{text:`is`,correct:!0,explanation:`Use 'is' with a singular person.`},{text:`are`,correct:!1,explanation:`'Are' is used with you or plural subjects.`},{text:`am`,correct:!1,explanation:`'Am' is used with I.`},{text:`be`,correct:!1,explanation:`The sentence needs the verb is.`}]},{q:`___ your parents Vietnamese?`,a:[{text:`Are`,correct:!0,explanation:`Use 'Are' with plural parents.`},{text:`Is`,correct:!1,explanation:`'Is' is singular.`},{text:`Am`,correct:!1,explanation:`'Am' is used with I.`},{text:`Do`,correct:!1,explanation:`Nationality uses the verb be here.`}]},{q:`What is the capital city of Vietnam?`,a:[{text:`Hanoi`,correct:!0,explanation:`Hanoi is the capital of Vietnam.`},{text:`Hue`,correct:!1,explanation:`Hue is a historic city.`},{text:`Da Nang`,correct:!1,explanation:`Da Nang is a coastal city.`},{text:`Can Tho`,correct:!1,explanation:`Can Tho is in the Mekong Delta.`}]},{q:`Which city is in Japan?`,a:[{text:`Tokyo`,correct:!0,explanation:`Tokyo is the capital of Japan.`},{text:`Seoul`,correct:!1,explanation:`Seoul is in South Korea.`},{text:`London`,correct:!1,explanation:`London is in England.`},{text:`Moscow`,correct:!1,explanation:`Moscow is in Russia.`}]},{q:`There ___ a map on the classroom wall.`,a:[{text:`is`,correct:!0,explanation:`Use 'is' with one map.`},{text:`are`,correct:!1,explanation:`'Are' is for plural nouns.`},{text:`am`,correct:!1,explanation:`'Am' is used with I.`},{text:`be`,correct:!1,explanation:`The correct form is is.`}]},{q:`There ___ many pupils in the playground.`,a:[{text:`are`,correct:!0,explanation:`Use 'are' with a plural noun.`},{text:`is`,correct:!1,explanation:`'Is' is for one thing.`},{text:`am`,correct:!1,explanation:`'Am' is used with I.`},{text:`be`,correct:!1,explanation:`The sentence needs are.`}]},{q:`The art room is ___ the music room.`,a:[{text:`next to`,correct:!0,explanation:`'Next to' means beside.`},{text:`under`,correct:!1,explanation:`'Under' means below.`},{text:`inside`,correct:!1,explanation:`The room is not inside another room.`},{text:`through`,correct:!1,explanation:`'Through' describes movement across.`}]},{q:`Turn left ___ the library.`,a:[{text:`at`,correct:!0,explanation:`Use 'at' for a point or place.`},{text:`in`,correct:!1,explanation:`'In' means inside.`},{text:`on`,correct:!1,explanation:`'On' means on a surface.`},{text:`from`,correct:!1,explanation:`'From' shows a starting point.`}]},{q:`A place where you see paintings is an ___.`,a:[{text:`art gallery`,correct:!0,explanation:`An art gallery displays paintings.`},{text:`airport`,correct:!1,explanation:`An airport is for air travel.`},{text:`aquarium`,correct:!1,explanation:`An aquarium has fish and sea life.`},{text:`stadium`,correct:!1,explanation:`A stadium hosts sports events.`}]},{q:`A place where planes arrive and leave is an ___.`,a:[{text:`airport`,correct:!0,explanation:`Planes use an airport.`},{text:`office`,correct:!1,explanation:`An office is a workplace.`},{text:`island`,correct:!1,explanation:`An island is land surrounded by water.`},{text:`apartment`,correct:!1,explanation:`An apartment is a home.`}]},{q:`You can borrow books at a ___.`,a:[{text:`library`,correct:!0,explanation:`Libraries lend books.`},{text:`cinema`,correct:!1,explanation:`A cinema shows films.`},{text:`bakery`,correct:!1,explanation:`A bakery sells bread.`},{text:`factory`,correct:!1,explanation:`A factory makes products.`}]},{q:`The opposite of 'cheap' is ___.`,a:[{text:`expensive`,correct:!0,explanation:`Expensive is the opposite of cheap.`},{text:`easy`,correct:!1,explanation:`Easy is the opposite of difficult.`},{text:`empty`,correct:!1,explanation:`Empty is the opposite of full.`},{text:`quiet`,correct:!1,explanation:`Quiet is the opposite of noisy.`}]},{q:`The opposite of 'noisy' is ___.`,a:[{text:`quiet`,correct:!0,explanation:`Quiet is the opposite of noisy.`},{text:`busy`,correct:!1,explanation:`Busy describes activity.`},{text:`strong`,correct:!1,explanation:`Strong describes power.`},{text:`bright`,correct:!1,explanation:`Bright describes light.`}]},{q:`The opposite of 'difficult' is ___.`,a:[{text:`easy`,correct:!0,explanation:`Easy is the opposite of difficult.`},{text:`heavy`,correct:!1,explanation:`Heavy is the opposite of light.`},{text:`slow`,correct:!1,explanation:`Slow is the opposite of fast.`},{text:`weak`,correct:!1,explanation:`Weak is the opposite of strong.`}]},{q:`A person who flies a plane is a ___.`,a:[{text:`pilot`,correct:!0,explanation:`A pilot flies a plane.`},{text:`nurse`,correct:!1,explanation:`A nurse cares for patients.`},{text:`waiter`,correct:!1,explanation:`A waiter serves food.`},{text:`farmer`,correct:!1,explanation:`A farmer works on a farm.`}]},{q:`A person who helps sick people in hospital is a ___.`,a:[{text:`nurse`,correct:!0,explanation:`Nurses care for sick people.`},{text:`mechanic`,correct:!1,explanation:`A mechanic repairs vehicles.`},{text:`singer`,correct:!1,explanation:`A singer performs songs.`},{text:`postman`,correct:!1,explanation:`A postman delivers letters.`}]},{q:`My mother works in a restaurant. She is a ___.`,a:[{text:`chef`,correct:!0,explanation:`A chef cooks in a restaurant.`},{text:`pilot`,correct:!1,explanation:`A pilot flies planes.`},{text:`farmer`,correct:!1,explanation:`A farmer grows crops.`},{text:`artist`,correct:!1,explanation:`An artist creates art.`}]},{q:`He ___ breakfast at seven every morning.`,a:[{text:`has`,correct:!0,explanation:`Use has with he in the present simple.`},{text:`have`,correct:!1,explanation:`Have is used with I, you, we and they.`},{text:`having`,correct:!1,explanation:`The sentence needs a finite verb.`},{text:`had`,correct:!1,explanation:`Had is past tense.`}]},{q:`They ___ football after school on Fridays.`,a:[{text:`play`,correct:!0,explanation:`Use the base verb with they.`},{text:`plays`,correct:!1,explanation:`Plays is for he, she or it.`},{text:`playing`,correct:!1,explanation:`The sentence describes a routine.`},{text:`played`,correct:!1,explanation:`Played is past tense.`}]},{q:`Look! The childre
