const fullQuestionBank=[{q:`Where are you from? 🇻🇳 (Bạn đến từ đất nước nào?)`,a:[{text:`I am from Vietnam.`,correct:!0,explanation:`Chính xác! 'I am from Vietnam' nghĩa là Tôi đến từ Việt Nam.`},{text:`I am from Vietnamese.`,correct:!1,explanation:`'from' đi cùng tên quốc gia (Vietnam), không đi với quốc tịch (Vietnamese).`},{text:`I am Vietnam.`,correct:!1,explanation:`Thiếu giới từ 'from' chỉ nơi xuất xứ.`},{text:`I from Vietnam.`,correct:!1,explanation:`Thiếu động từ 'am' trong câu.`}]},{q:`What nationality are you? 🇻🇳 (Quốc tịch của bạn là gì?)`,a:[{text:`I am Vietnamese.`,correct:!0,explanation:`Đúng rồi! Quốc tịch Việt Nam là 'Vietnamese'.`},{text:`I am Vietnam.`,correct:!1,explanation:`'Vietnam' là tên quốc gia, câu hỏi hỏi quốc tịch ('nationality').`},{text:`I from Vietnamese.`,correct:!1,explanation:`Cấu trúc trả lời quốc tịch là 'I am + nationality'.`},{text:`My nationality Vietnam.`,correct:!1,explanation:`Sai cấu trúc ngữ pháp em nhé.`}]},{q:`Where is Akiko from? 🇯🇵 (Cô ấy đến từ Nhật Bản)`,a:[{text:`She is from Japan.`,correct:!0,explanation:`Giỏi lắm! Akiko là bạn nữ người Nhật Bản, đến từ đất nước 'Japan'.`},{text:`He is from Japan.`,correct:!1,explanation:`Akiko là bạn nữ, phải dùng đại từ 'She'.`},{text:`She is from Japanese.`,correct:!1,explanation:`'Japanese' là quốc tịch, sau 'from' phải là tên nước 'Japan'.`},{text:`She from Japan.`,correct:!1,explanation:`Thiếu động từ 'is' em nhé.`}]},{q:`Người bạn đến từ nước Mỹ có quốc tịch gì? 🇺🇸`,a:[{text:`American`,correct:!0,explanation:`Chính xác! Quốc tịch Mỹ là 'American'.`},{text:`America`,correct:!1,explanation:`'America' là tên quốc gia.`},{text:`English`,correct:!1,explanation:`'English' là người Anh.`},{text:`Australian`,correct:!1,explanation:`'Australian' là người Úc.`}]},{q:`Người bạn đến từ nước Anh có quốc tịch gì? 🇬🇧`,a:[{text:`English`,correct:!0,explanation:`Đúng rồi! Quốc tịch Anh là 'English' (hoặc British).`},{text:`England`,correct:!1,explanation:`'England' là tên quốc gia (nước Anh).`},{text:`American`,correct:!1,explanation:`'American' là người Mỹ.`},{text:`Japanese`,correct:!1,explanation:`'Japanese' là người Nhật Bản.`}]},{q:`Điền chữ cái còn thiếu: "V_etnam" (Đất nước Việt Nam) 🇻🇳`,a:[{text:`i`,correct:!0,explanation:`Chính xác! Đất nước ta viết là 'Vietnam'.`},{text:`e`,correct:!1,explanation:`Chữ 'e' chưa đúng rồi.`},{text:`a`,correct:!1,explanation:`Chữ 'a' không ghép thành từ đúng.`},{text:`y`,correct:!1,explanation:`Chữ 'y' chưa chính xác em nhé.`}]},{q:`Sắp xếp các chữ cái sau thành tên một đất nước hoa anh đào: "p - n - j - a - a" 🌸🇯🇵`,a:[{text:`Japan`,correct:!0,explanation:`Rất tốt! Sắp xếp lại ta được từ 'Japan' (Nhật Bản).`},{text:`Japna`,correct:!1,explanation:`Chưa đúng vị trí chữ cái cuối.`},{text:`Jpnaa`,correct:!1,explanation:`Từ này viết sai chính tả.`},{text:`Janap`,correct:!1,explanation:`Chưa chính xác em nhé.`}]},{q:`Bạn Tony đến từ nước Úc (Australia). Vậy Tony là người nước nào? 🇦🇺`,a:[{text:`Australian`,correct:!0,explanation:`Tuyệt vời! Người Úc có quốc tịch là 'Australian'.`},{text:`Australia`,correct:!1,explanation:`'Australia' là tên nước Úc.`},{text:`Austrian`,correct:!1,explanation:`'Austrian' là người nước Áo.`},{text:`Australians`,correct:!1,explanation:`Chỉ 1 người ('Tony') nên không dùng dạng số nhiều có 's'.`}]},{q:`Bạn Hakim đến từ Malaysia. Hakim mang quốc tịch gì? 🇲🇾`,a:[{text:`Malaysian`,correct:!0,explanation:`Đúng rồi! Quốc tịch Malaysia viết là 'Malaysian'.`},{text:`Malaysia`,correct:!1,explanation:`'Malaysia' là tên đất nước.`},{text:`Malayan`,correct:!1,explanation:`Từ này chưa chuẩn chính tả.`},{text:`Malay`,correct:!1,explanation:`'Malay' thường dùng để chỉ tiếng Mã Lai hoặc người Mã Lai bản địa.`}]},{q:`Chọn từ khác loại so với các từ còn lại (Odd one out): Japanese, Vietnam, England, America`,a:[{text:`Japanese`,correct:!0,explanation:`Chính xác! 'Japanese' là từ chỉ quốc tịch, còn lại là tên các quốc gia.`},{text:`Vietnam`,correct:!1,explanation:`'Vietnam' là tên quốc gia.`},{text:`England`, planation:`'English' là quốc tịch.`}]},{q:`What day is it today? 📅 (Hôm nay là Thứ Hai đầu tuần)`,a:[{text:`It is Monday.`,correct:!0,explanation:`Chính xác! Thứ Hai là 'Monday'.`},{text:`It is Tuesday.`,correct:!1,explanation:`'Tuesday' là Thứ Ba em nhé.`},{text:`It is Sunday.`,correct:!1,explanation:`'Sunday' là Chủ Nhật.`},{text:`It is Friday.`,correct:!1,explanation:`'Friday' là Thứ Sáu.`}]},{q:`Ngày Thứ Sáu trong tuần tiếng Anh là gì? 🗓️`,a:[{text:`Friday`,correct:!0,explanation:`Đúng rồi! Thứ Sáu là 'Friday'.`},{text:`Thursday`,correct:!1,explanation:`'Thursday' là Thứ Năm.`},{text:`Wednesday`,correct:!1,explanation:`'Wednesday' là Thứ Tư.`},{text:`Tuesday`,correct:!1,explanation:`'Tuesday' là Thứ Ba.`}]},{q:`Ngày Chủ Nhật được nghỉ học tiếng Anh là gì? ☀️`,a:[{text:`Sunday`,correct:!0,explanation:`Giỏi lắm! Ngày Chủ Nhật là 'Sunday'.`},{text:`Saturday`,correct:!1,explanation:`'Saturday' là Thứ Bảy.`},{text:`Monday`,correct:!1,explanation:`'Monday' là Thứ Hai.`},{text:`Wednesday`,correct:!1,explanation:`'Wednesday' là Thứ Tư.`}]},{q:`Điền chữ cái còn thiếu: "W_dnesday" (Ngày Thứ Tư) 📅`,a:[{text:`e`,correct:!0,explanation:`Rất tốt! Thứ Tư viết là 'Wednesday'.`},{text:`a`,correct:!1,explanation:`Chữ 'a' chưa đúng rồi.`},{text:`i`,correct:!1,explanation:`Chữ 'i' không ghép thành từ đúng.`},{text:`o`,correct:!1,explanation:`Chữ 'o' chưa chính xác em nhé.`}]},{q:`Sắp xếp các chữ cái sau thành từ chỉ ngày Thứ Năm: "u - h - r - T - s - a - d - y" 🗓️`,a:[{text:`Thursday`,correct:!0,explanation:`Tuyệt vời! Thứ Năm là 'Thursday'.`},{text:`Thrusday`,correct:!1,explanation:`Chưa đúng vị trí chữ 'r' và 'u'.`},{text:`Tuhsraday`,correct:!1,explanation:`Từ này viết sai chính tả rồi.`},{text:`Thursdya`,correct:!1,explanation:`Hai chữ cái cuối bị đảo vị trí.`}]},{q:`What do you do on Saturdays? 🏊‍♂️ (Tôi thường đi bơi vào các ngày Thứ Bảy)`,a:[{text:`I go swimming.`,correct:!0,explanation:`Chính xác! Đi bơi là 'go swimming'.`},{text:`I goes swimming.`,correct:!1,explanation:`Chủ ngữ 'I' đi với động từ nguyên mẫu 'go'.`},{text:`I am swim.`,correct:!1,explanation:`Sai cấu trúc ngữ pháp.`},{text:`I going swimming.`,correct:!1,explanation:`Thiếu trợ động từ 'am' nếu muốn dùng thì tiếp diễn.`}]},{q:`Tháng 1 đầu năm mới trong tiếng Anh là gì? 🎆`,a:[{text:`January`,correct:!0,explanation:`Đúng rồi! Tháng Một là 'January'.`},{text:`February`,correct:!1,explanation:`'February' là Tháng Hai.`},{text:`March`,correct:!1,explanation:`'March' là Tháng Ba.`},{text:`June`,correct:!1,explanation:`'June' là Tháng Sáu.`}]},{q:`Tháng 12 cuối năm với mùa Giáng sinh ấm áp là gì? 🎄`,a:[{text:`December`,correct:!0,explanation:`Giỏi lắm! Tháng Mười Hai là 'December'.`},{text:`November`,correct:!1,explanation:`'November' là Tháng Mười Một.`},{text:`October`,correct:!1,explanation:`'October' là Tháng Mười.`},{text:`September`,correct:!1,explanation:`'September' là Tháng Chín.`}]},{q:`When is your birthday? 🎂 (Sinh nhật của em vào Tháng Mười)`,a:[{text:`It's in October.`,correct:!0,explanation:`Chính xác! Đứng trước tháng ta dùng giới từ 'in' ('in October').`},{text:`It's on October.`,correct:!1,explanation:`'on' dùng khi có ngày cụ thể, chỉ có tháng thì dùng 'in'.`},{text:`It's at October.`,correct:!1,explanation:`'at' dùng chỉ giờ giấc hoặc địa điểm.`},{text:`It's from October.`,correct:!1,explanation:`'from' chỉ nguồn gốc xuất phát.`}]},{q:`Điền từ vào chỗ trống: "My birthday is ___ the first of June." 🎈`,a:[{text:`on`,correct:!0,explanation:`Đúng rồi! Có ngày cụ thể ('the first of June') ta dùng giới từ 'on'.`},{text:`in`,correct:!1,explanation:`'in' chỉ dùng khi chỉ có tháng hoặc năm.`},{text:`at`,correct:!1,explanation:`'at' dùng cho giờ giấc.`},{text:`by`,correct:!1,explanation:`Không dùng 'by' trong ngữ cảnh ngày sinh nhật.`}]},{q:`Điền chữ cái còn thiếu: "b_rthday" (Ngày sinh nhật) 🎁`,a:[{text:`i`,correct:!0,explanation:`Tuyệt vời! Ngày sinh nhật viết là 'birthday'.`},{text:`e`,correct:!1,explanation:`Chữ 'e' chưa đúng rồi.`},{text:`a`,correct:!1,explanatio xt:`have dinner`,correct:!1,explanation:`'have dinner' là ăn bữa tối.`}]},{q:`Điền chữ cái còn thiếu: "br_akfast" (Bữa ăn sáng) 🥪`,a:[{text:`e`,correct:!0,explanation:`Tuyệt vời! Bữa sáng viết là 'breakfast'.`},{text:`a`,correct:!1,explanation:`Chữ 'a' chưa đúng vị trí.`},{text:`i`,correct:!1,explanation:`Chữ 'i' không ghép thành từ đúng.`},{text:`o`,correct:!1,explanation:`Chữ 'o' chưa chính xác em nhé.`}]},{q:`Sắp xếp các chữ cái sau thành từ chỉ bữa cơm tối: "n - d - i - r - n - e" 🍛`,a:[{text:`dinner`,correct:!0,explanation:`Chính xác! Bữa tối là 'dinner'.`},{text:`dinnre`,correct:!1,explanation:`Chưa đúng vị trí hai chữ cái cuối.`},{text:`dniner`,correct:!1,explanation:`Từ này viết sai chính tả rồi.`},{text:`dennir`,correct:!1,explanation:`Chưa chính xác em nhé.`}]},{q:`What time does he go to school? 🎒 (Cậu ấy đến trường lúc 7 giờ 15)`,a:[{text:`He goes to school at seven fifteen.`,correct:!0,explanation:`Giỏi lắm! Chủ ngữ 'He' ngôi thứ 3 số ít động từ 'go' chia thành 'goes'.`},{text:`He go to school at seven fifteen.`,correct:!1,explanation:`Chủ ngữ 'He' phải chia động từ thành 'goes'.`},{text:`He is go to school at seven fifteen.`,correct:!1,explanation:`Không dùng 'is go' cùng nhau.`},{text:`He goes to school on seven fifteen.`,correct:!1,explanation:`Đứng trước giờ phải dùng giới từ 'at'.`}]},{q:`7 giờ 30 phút trong tiếng Anh ta có thể nói là gì? 🕢`,a:[{text:`seven thirty`,correct:!0,explanation:`Đúng rồi! 7h30 là 'seven thirty' (hoặc half past seven).`},{text:`seven thirteen`,correct:!1,explanation:`'thirteen' là 13 phút em nhé.`},{text:`thirty seven`,correct:!1,explanation:`Giờ nói trước rồi mới đến phút.`},{text:`seven o'clock thirty`,correct:!1,explanation:`Không dùng 'o'clock' khi có số phút lẻ.`}]},{q:`Điền từ vào chỗ trống: "My mother goes to work ___ 7:00 a.m." 🚗`,a:[{text:`at`,correct:!0,explanation:`Rất tốt! Chỉ giờ giấc luôn dùng giới từ 'at'.`},{text:`on`,correct:!1,explanation:`'on' dùng cho thứ trong tuần hoặc ngày.`},{text:`in`,correct:!1,explanation:`'in' dùng cho buổi trong ngày ('in the morning'), nhưng có giờ chính xác phải dùng 'at'.`},{text:`from`,correct:!1,explanation:`Không dùng 'from' đơn lẻ để chỉ mốc giờ bắt đầu đi làm.`}]},{q:`Hành động "rửa mặt" buổi sáng bằng nước mát là gì? 🧖‍♀️`,a:[{text:`wash my face`,correct:!0,explanation:`Chính xác! Rửa mặt là 'wash my face'.`},{text:`brush my teeth`,correct:!1,explanation:`'brush my teeth' là đánh răng.`},{text:`comb my hair`,correct:!1,explanation:`'comb my hair' là chải tóc.`},{text:`wash my hands`,correct:!1,explanation:`'wash my hands' là rửa tay.`}]},{q:`Hành động "đánh răng" trước khi đi ngủ là gì? 🪥`,a:[{text:`brush my teeth`,correct:!0,explanation:`Đúng rồi! Đánh răng là 'brush my teeth'.`},{text:`wash my face`,correct:!1,explanation:`'wash my face' là rửa mặt.`},{text:`take a shower`,correct:!1,explanation:`'take a shower' là tắm vòi sen.`},{text:`get dressed`,correct:!1,explanation:`'get dressed' là mặc quần áo.`}]},{q:`Chọn từ khác loại so với các từ còn lại (Odd one out): seven, get up, have breakfast, go to bed`,a:[{text:`seven`,correct:!0,explanation:`Chính xác! 'seven' là số đếm, còn lại là các cụm từ chỉ thói quen hàng ngày.`},{text:`get up`,correct:!1,explanation:`'get up' là thói quen thức dậy.`},{text:`have breakfast`,correct:!1,explanation:`'have breakfast' là thói quen ăn sáng.`},{text:`go to bed`,correct:!1,explanation:`'go to bed' là thói quen đi ngủ.`}]},{q:`Điền chữ cái còn thiếu: "d_nner" (Bữa cơm tối) 🍲`,a:[{text:`i`,correct:!0,explanation:`Tuyệt vời! Bữa tối viết là 'dinner'.`},{text:`e`,correct:!1,explanation:`Chữ 'e' chưa đúng rồi.`},{text:`a`,correct:!1,explanation:`Chữ 'a' không ghép thành từ đúng.`},{text:`o`,correct:!1,explanation:`Chữ 'o' chưa chính xác em nhé.`}]},{q:`Where were you yesterday? 🏠 (Hôm qua em ở nhà)`,a:[{text:`I was at home.`,correct:!0,explanation:`Chính xác! 'I was at home' nghĩa là Hôm qua tôi ở nhà.`},{text:`I were at home.`,correct:!1,explanation:`Chủ ngữ 'I' đi với 'was' trong quá khứ, không ảo viết là 'island'.`},{text:`e`,correct:!1,explanation:`Chữ 'e' chưa đúng rồi.`},{text:`o`,correct:!1,explanation:`Chữ 'o' không tạo thành từ hòn đảo.`},{text:`u`,correct:!1,explanation:`Chữ 'u' chưa chính xác em nhé.`}]},{q:`Sắp xếp các chữ cái sau thành từ chỉ bãi biển: "c - h - a - e - b" 🏖️`,a:[{text:`beach`,correct:!0,explanation:`Tuyệt vời! Bãi biển là 'beach'.`},{text:`baech`,correct:!1,explanation:`Chưa đúng vị trí chữ 'e' và 'a'.`},{text:`becah`,correct:!1,explanation:`Từ này viết sai chính tả rồi.`},{text:`beahc`,correct:!1,explanation:`Chưa chính xác em nhé.`}]},{q:`How did you get there? 🚆 (Gia đình mình đã đi bằng tàu hỏa)`,a:[{text:`By train.`,correct:!0,explanation:`Chính xác! Đi bằng phương tiện gì dùng 'By + phương tiện': 'By train.'`},{text:`On train.`,correct:!1,explanation:`Chỉ phương tiện di chuyển tổng quát dùng 'By'.`},{text:`In train.`,correct:!1,explanation:`Không dùng 'In train' trong câu trả lời ngắn này.`},{text:`With train.`,correct:!1,explanation:`Không dùng 'With'.`}]},{q:`Xe khách đường dài hoặc xe buýt du lịch tiếng Anh là gì? 🚌`,a:[{text:`coach`,correct:!0,explanation:`Đúng rồi! Xe khách/xe buýt đường dài là 'coach'.`},{text:`taxi`,correct:!1,explanation:`'taxi' là xe tắc-xi.`},{text:`plane`,correct:!1,explanation:`'plane' là máy bay.`},{text:`motorbike`,correct:!1,explanation:`'motorbike' là xe máy.`}]},{q:`Sắp xếp các chữ cái sau thành từ chỉ kỳ nghỉ: "l - o - h - d - a - i - y" 🏖️`,a:[{text:`holiday`,correct:!0,explanation:`Giỏi lắm! Kỳ nghỉ vui vẻ là 'holiday'.`},{text:`hoidlay`,correct:!1,explanation:`Chưa đúng vị trí chữ cái 'i' và 'd'.`},{text:`holidya`,correct:!1,explanation:`Hai chữ cái cuối bị đảo vị trí.`},{text:`hlioday`,correct:!1,explanation:`Từ này viết sai chính tả.`}]},{q:`What did you do yesterday? 📺 (Hôm qua em đã xem phim hoạt hình)`,a:[{text:`I watched TV.`,correct:!0,explanation:`Rất tốt! Quá khứ của 'watch' là 'watched': 'I watched TV.'`},{text:`I watch TV.`,correct:!1,explanation:`'yesterday' (hôm qua) là qu
