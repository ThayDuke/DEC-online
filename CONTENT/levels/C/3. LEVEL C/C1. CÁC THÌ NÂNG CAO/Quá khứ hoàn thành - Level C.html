const fullQuestionBank=[{q:`Use the past perfect to show the earlier action: She ___ her homework before she went to bed.`,a:[{text:`had finished`,correct:!0,explanation:`Hành động 'làm xong bài' xảy ra trước hành động 'đi ngủ' trong quá khứ -> Dùng Quá khứ hoàn thành.`},{text:`has finished`,explanation:`Sai. Đây là Hiện tại hoàn thành.`,correct:!1},{text:`finished`,explanation:`Sai. Đây là Quá khứ đơn.`,correct:!1},{text:`finishes`,explanation:`Sai. Đây là Hiện tại đơn.`,correct:!1}]},{q:`Use the past perfect to show the earlier action: When we arrived at the station, we learned that the train ___ five minutes earlier.`,a:[{text:`had left`,correct:!0,explanation:`Đúng. 'Had left' đặt việc tàu rời đi năm phút trước mốc chúng tôi đến.`},{text:`left`,explanation:`Sai. Hành động này xảy ra TRƯỚC một hành động/thời điểm khác trong quá khứ, nên phải dùng Quá khứ hoàn thành (had + V3/ed) thay vì Quá khứ đơn.`,correct:!1},{text:`leaves`,explanation:`Sai. Cấu trúc thì Quá khứ hoàn thành bị chia sai (phải là had + V3/ed).`,correct:!1},{text:`has left`,explanation:`Sai. Câu kể lại một sự việc xảy ra trước một thời điểm/hành động khác trong quá khứ, phải dùng Quá khứ hoàn thành, không dùng Hiện tại/Hiện tại hoàn thành (has left).`,correct:!1}]},{q:`Use the past perfect to show the earlier action: By the time I left for school, I ___ breakfast already.`,a:[{text:`had eaten`,correct:!0,explanation:`Đúng. 'Had eaten' diễn tả bữa sáng đã hoàn tất trước mốc rời nhà đi học.`},{text:`had eat`,explanation:`Sai. 'Ate' là quá khứ đơn; câu cần nêu bữa sáng đã hoàn tất trước mốc rời đi.`,correct:!1},{text:`eat`,explanation:`Sai. 'Eat' là dạng nguyên mẫu, không thể đứng sau chủ ngữ trong timeline quá khứ này.`,correct:!1},{text:`have eaten`,explanation:`Sai. 'Have eaten' là hiện tại hoàn thành; mốc tham chiếu ở đây hoàn toàn nằm trong quá khứ.`,correct:!1}]},{q:`Use the past perfect to show the earlier action: Before they read the book, they discovered that they ___ the movie the week before.`,a:[{text:`had watched`,correct:!0,explanation:`Đúng. 'Had watched' diễn tả việc xem phim xảy ra trước cả lúc họ đọc sách.`},{text:`watched`,explanation:`Sai. 'Watched' là quá khứ đơn và không đánh dấu rõ việc xem phim xảy ra trước phát hiện/đọc sách.`,correct:!1},{text:`watch`,explanation:`Sai. 'Watch' là dạng nguyên mẫu, không phù hợp với sự việc đã hoàn tất trong quá khứ.`,correct:!1},{text:`have watched`,explanation:`Sai. 'Have watched' là hiện tại hoàn thành, trong khi mốc so sánh là các sự kiện quá khứ.`,correct:!1}]},{q:`Use the past perfect to show the earlier action: By the time dad came home, my mom ___ dinner already.`,a:[{text:`had cooked`,correct:!0,explanation:`Đúng. 'Had cooked' hoàn tất trước mốc dad came home.`},{text:`cooked`,explanation:`Sai. 'Cooked' chỉ nêu quá khứ đơn, không khóa việc nấu xong trước khi dad came home.`,correct:!1},{text:`cooks`,explanation:`Sai. 'Cooks' là hiện tại đơn, trái với mốc 'dad came home'.`,correct:!1},{text:`has cooked`,explanation:`Sai. 'Has cooked' là hiện tại hoàn thành; câu đang thiết lập hai mốc trong quá khứ.`,correct:!1}]},{q:`Use the past perfect to show the earlier action: Before he left the house, he realized that he ___ the keys already.`,a:[{text:`had found`,correct:!0,explanation:`Đúng. 'Had found' xảy ra trước khoảnh khắc anh ấy nhận ra và rời nhà.`},{text:`found`,explanation:`Sai. Cấu trúc thì Quá khứ hoàn thành bị chia sai (phải là had + V3/ed).`,correct:!1},{text:`finds`,explanation:`'Finds' là hiện tại đơn ngôi thứ ba, không khớp mốc nhận ra trong quá khứ.`,correct:!1},{text:`has found`,explanation:`'Has found' là hiện tại hoàn thành; câu yêu cầu hành động xảy ra trước một mốc quá khứ.`,correct:!1}]},{q:`Use the past perfect to show the earlier action: When we were ready to leave, we saw that the rain ___ already.`,a:[{text:`had stopped`,correct:!0,explanation:`Đúng. 'Had stopped' diễn tả mưa đã tạnh trước thời điểm chúng tôi chuẩn bị ra ngoài.`},{text:`stopped`,explanation:`Sai. Cấu trúc thì Qu cô giáo kiểm tra và là nguyên nhân của sự tức giận.`},{text:`forgot`,explanation:`Sai. Hành động này xảy ra TRƯỚC một hành động/thời điểm khác trong quá khứ, nên phải dùng Quá khứ hoàn thành (had + V3/ed) thay vì Quá khứ đơn.`,correct:!1},{text:`forgets`,explanation:`Sai. Câu nói về sự việc trong quá khứ, không dùng thì Hiện tại đơn.`,correct:!1},{text:`has forgotten`,explanation:`Sai. Câu kể lại một sự việc xảy ra trước một thời điểm/hành động khác trong quá khứ, phải dùng Quá khứ hoàn thành, không dùng Hiện tại/Hiện tại hoàn thành (has forgotten).`,correct:!1}]},{q:`Use the past perfect to show the earlier action: When I reached the station, I realized I ___ my wallet at home.`,a:[{text:`had left`,correct:!0,explanation:`Đúng. 'Had left' đặt việc để quên ví trước mốc tôi đến ga và nhận ra.`},{text:`left`,explanation:`Sai. Hành động này xảy ra TRƯỚC một hành động/thời điểm khác trong quá khứ, nên phải dùng Quá khứ hoàn thành (had + V3/ed) thay vì Quá khứ đơn.`,correct:!1},{text:`leave`,explanation:`Sai. Câu nói về sự việc trong quá khứ, không dùng thì Hiện tại đơn.`,correct:!1},{text:`has left`,explanation:`Sai. Câu kể lại một sự việc xảy ra trước một thời điểm/hành động khác trong quá khứ, phải dùng Quá khứ hoàn thành, không dùng Hiện tại/Hiện tại hoàn thành (has left).`,correct:!1}]},{q:`Use the past perfect to show the earlier action: By the time the police came, the thief ___ already.`,a:[{text:`had escaped`,correct:!0,explanation:`Đúng. 'Had escaped' hoàn tất trước mốc cảnh sát đến; 'already' khóa quan hệ trước-sau.`},{text:`escaped`,explanation:`Sai. Hành động này xảy ra TRƯỚC một hành động/thời điểm khác trong quá khứ, nên phải dùng Quá khứ hoàn thành (had + V3/ed) thay vì Quá khứ đơn.`,correct:!1},{text:`escapes`,explanation:`Sai. Câu nói về sự việc trong quá khứ, không dùng thì Hiện tại đơn.`,correct:!1},{text:`has escaped`,explanation:`Sai. Câu kể lại một sự việc xảy ra trước một thời điểm/hành động khác trong quá khứ, phải dùng Quá khứ hoàn thành, không
