const fullQuestionBank=[{q:`Mục đích chính của bộ 'Công thức tối thượng' là gì?`,a:[{text:`Giúp học sinh ghi nhớ ít công thức nhất nhưng triển khai được mọi thì.`,correct:!0,explanation:`Theo tài liệu, mục đích là giúp ghi nhớ ít nhất nhưng triển khai ra thành mọi công thức.`},{text:`Giúp học sinh học thuộc lòng 12 công thức riêng biệt.`,explanation:`Sai. Mục tiêu là giảm thiểu việc học thuộc lòng.`,correct:!1},{text:`Giúp học sinh chỉ tập trung vào từ vựng.`,explanation:`Sai. Tài liệu tập trung vào cấu trúc ngữ pháp.`,correct:!1},{text:`Giúp học sinh loại bỏ hoàn toàn việc dùng thì.`,explanation:`Sai. Mục đích là nắm vững các thì.`,correct:!1}]},{q:`Bộ 'Công thức tối thượng' bao gồm bao nhiêu công thức chủ động?`,a:[{text:`5 công thức.`,correct:!0,explanation:`Tài liệu đề cập đến 'Bộ 5 công thức tối thượng Duke'.`},{text:`12 công thức.`,explanation:`Sai. 12 là số lượng thì, không phải số công thức tối thượng.`,correct:!1},{text:`3 công thức.`,explanation:`Sai. Cấu trúc '3 công thức.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`4 công thức.`,explanation:`Sai. Cấu trúc '4 công thức.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Công thức số 1 (S + tobe + Danh từ/Tính từ) chuyên dùng cho nhóm thì nào?`,a:[{text:`Các thì Đơn (diễn tả trạng thái, tính chất).`,correct:!0,explanation:`Công thức 1 dùng tobe để diễn tả trạng thái, tính chất của các thì Đơn.`},{text:`Các thì Tiếp diễn.`,explanation:`Sai. Tiếp diễn dùng Công thức 3.`,correct:!1},{text:`Các thì Hoàn thành.`,explanation:`Sai. Hoàn thành dùng Công thức 4.`,correct:!1},{text:`Các thì Hoàn thành tiếp diễn.`,explanation:`Sai. Cấu trúc 'Các thì Hoàn thành tiếp diễn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Trong bộ công thức này, động từ 'tobe' đại diện cho nhóm ý nghĩa gì?`,a:[{text:`Diễn tả trạng thái, tính chất.`,correct:!0,explanation:`Theo tài liệu, tobe dùng trong Công thức 1 diễn tả trạng thái, tính chất.`},{text:`Diễn tả hành động.`,explanation:`Sai. Hành động dùng động từ thường (Công thức 2).`,correct:!1},{text:`Diễn tả sự sở hữu.`,explanation:`Sai. Cấu trúc 'Diễn tả sự sở hữu.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Diễn tả khả năng.`,explanation:`Sai. Cấu trúc 'Diễn tả khả năng.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Công thức nào là tổng hợp của các thì Đơn sử dụng động từ thường?`,a:[{text:`S + V + O (Công thức 2).`,correct:!0,explanation:`Công thức 2 quy định: S + V + O dùng cho động từ thường (hành động).`},{text:`S + tobe + Danh từ/Tính từ.`,explanation:`Sai. Đây là động từ tobe.`,correct:!1},{text:`S + HAVE + V3 + O.`,explanation:`Sai. Phương án 'S + HAVE + V3 + O.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`S + tobe + Ving + O.`,explanation:`Sai. Phương án 'S + tobe + Ving + O.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`Trong Công thức 1 (S + tobe + ...), 'tobe' ở thì Hiện tại đơn là gì?`,a:[{text:`am / is / are`,correct:!0,explanation:`Quy ước: Với hiện tại đơn, tobe = am/is/are.`},{text:`was / were`,explanation:`Sai. Đây là quá khứ đơn.`,correct:!1},{text:`will be`,explanation:`Sai. Đây là tương lai đơn.`,correct:!1},{text:`been`,explanation:`Sai. Đây là dạng V3.`,correct:!1}]},{q:`Trong Công thức 1 (S + tobe + ...), 'tobe' ở thì Quá khứ đơn là gì?`,a:[{text:`was / were`,correct:!0,explanation:`Quy ước: Với quá khứ đơn, tobe = was/were.`},{text:`am / is / are`,explanation:`Sai. Cấu trúc 'am / is / are' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`will be`,explanation:`Sai. Từ vựng hoặc dạng từ 'will be' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`being`,explanation:`Sai. Từ vựng hoặc dạng từ 'being' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Trong Công thức 1 (S + tobe + ...), 'tobe' ở thì Tương lai đơn là gì?`,a:[{text:`will be`,correct:!0,explanation:`Quy ước: Với tương lai đơn, tobe = will be.`},{text:`will`,explanation:`Sai. Thiếu 'be'. Cách dùng phù hợp trong câu này là “will be”.`,correct:!1},{text:`is going to`,explanation:`Sai. Tài liệu chỉ đề cập will be.`,correct:!1},{text:`shall`,explanation:`Sai. Tài liệu quy ước là will be.`,correct:!1}]},{q:`Công thức 2 (S + V + O) áp dụng cho loại động từ nào?`,a:[{text:`Động từ thường (diễn tả hành động).`,correct:!0,explanation:`Công thức 2 dùng cho động từ thường.`},{text:`Động từ tobe.`,explanation:`Sai. Tobe thuộc Công thức 1.`,correct:!1},{text:`Trợ động từ khuyết thiếu.`,explanation:`Sai. Cấu trúc 'Trợ động từ khuyết thiếu.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Động từ sở hữu.`,explanation:`Sai. Cấu trúc 'Động từ sở hữu.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Trong Công thức 2, với thì Hiện tại đơn, V có dạng nào?`,a:[{text:`V(nguyên mẫu) hoặc V(s/es)`,correct:!0,explanation:`Quy ước hiện tại đơn: V = V(nguyên mẫu) hoặc V(s/es).`},{text:`V(2/ed)`,explanation:`Sai. Đây là quá khứ.`,correct:!1},{text:`will + V`,explanation:`Sai. Đây là tương lai.`,correct:!1},{text:`Ving`,explanation:`Sai. Từ vựng hoặc dạng từ 'Ving' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Trong Công thức 2, với thì Quá khứ đơn, V có dạng nào?`,a:[{text:`V(2/ed)`,correct:!0,explanation:`Quy ước quá khứ đơn: V = V(2/ed).`},{text:`V(nguyên mẫu)`,explanation:`Sai. Từ vựng hoặc dạng từ 'V(nguyên mẫu)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`had + V3`,explanation:`Sai. Cấu trúc 'had + V3' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`was + V`,explanation:`Sai. Cấu trúc 'was + V' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Trong Công thức 2, với thì Tương lai đơn, V có dạng nào?`,a:[{text:`will + V(nguyên mẫu)`,correct:!0,explanation:`Quy ước tương lai đơn: V = will + V(nguyên mẫu).`},{text:`will + Ving`,explanation:`Sai. Cấu trúc 'will + Ving' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`will + V3`,explanation:`Sai. Cấu trúc 'will + V3' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`will + to V`,explanation:`Sai. Cấu trúc 'will + to V' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Câu 'She is beautiful' thuộc công thức nào?`,a:[{text:`Công thức 1.`,correct:!0,explanation:`Cấu trúc S + tobe + Tính từ.`},{text:`Công thức 2.`,explanation:`Sai. Không dùng động từ thường.`,correct:!1},{text:`Công thức 3.`,explanation:`Sai. Không có Ving. Cách dùng phù hợp trong câu này là “Công thức 1.”.`,correct:!1},{text:`Công thức 4.`,explanation:`Sai. Không có Have + V3.`,correct:!1}]},{q:`Câu 'They played soccer' thuộc công thức nào?`,a:[{text:`Công thức 2.`,correct:!0,explanation:`Cấu trúc S + V(ed) + O (Động từ thường).`},{text:`Công thức 1.`,explanation:`Sai. Cấu trúc 'Công thức 1.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Công thức 3.`,explanation:`Sai. Cấu trúc 'Công thức 3.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Công thức 5.`,explanation:`Sai. Cấu trúc 'Công thức 5.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Trong Công thức 2, V(s/es) được sử dụng khi nào?`,a:[{text:`Hiện tại đơn, ngôi thứ 3 số ít.`,correct:!0,explanation:`Kiến thức cơ bản của thì hiện tại đơn trong Công thức 2.`},{text:`Quá khứ đơn.`,explanation:`Sai. Cấu trúc 'Quá khứ đơn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Hiện tại đơn, số nhiều.`,explanation:`Sai. Cấu trúc 'Hiện tại đơn, số nhiều.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Tương lai đơn.`,explanation:`Sai. Cấu trúc 'Tương lai đơn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Công thức 3 (S + tobe + Ving + O) là tổng hợp của nhóm thì nào?`,a:[{text:`Các thì Tiếp diễn.`,correct:!0,explanation:`Công thức 3 chuyên dùng cho các thì Tiếp diễn.`},{text:`Các thì Đơn.`,explanation:`Sai. Cấu trúc 'Các thì Đơn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Các thì Hoàn thành.`,explanation:`Sai. Cấu trúc 'Các thì Hoàn thành.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Các thì Hoàn thành tiếp diễn.`,explanation:`Sai. Cấu trúc 'Các thì Hoàn thành tiếp diễn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Trong Công thức 3, thành phần nào thay đổi theo thời gian (quá khứ/hiện tại/tương lai)?`,a:[{text:`Động từ 'tobe'.`,correct:!0,explanation:`Ving giữ nguyên, chỉ có 'tobe' thay đổi (am/is/are/was/were/will be).`},{text:`Động từ Ving.`,explanation:`Sai. Ving cố định trong nhóm tiếp diễn.`,correct:!1},{text:`Tân ngữ O.`,explanation:`Sai. Cấu trúc 'Tân ngữ O.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Chủ ngữ S.`,explanation:`Sai. Cấu trúc 'Chủ ngữ S.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Với thì Hiện tại tiếp diễn, 'tobe' trong Công thức 3 là gì?`,a:[{text:`am / is / are`,correct:!0,explanation:`Quy ước: Hiện tại tiếp diễn dùng am/is/are.`},{text:`was / were`,explanation:`Sai. Cấu trúc 'was / were' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`will be`,explanation:`Sai. Từ vựng hoặc dạng từ 'will be' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`been`,explanation:`Sai. Từ vựng hoặc dạng từ 'been' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Với thì Quá khứ tiếp diễn, 'tobe' trong Công thức 3 là gì?`,a:[{text:`was / were`,correct:!0,explanation:`Quy ước: Quá khứ tiếp diễn dùng was/were.`},{text:`am / is / are`,explanation:`Sai. Cấu trúc 'am / is / are' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`will be`,explanation:`Sai. Từ vựng hoặc dạng từ 'will be' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`be`,explanation:`Sai. Từ vựng hoặc dạng từ 'be' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Với thì Tương lai tiếp diễn, 'tobe' trong Công thức 3 là gì?`,a:[{text:`will be`,correct:!0,explanation:`Quy ước: Tương lai tiếp diễn dùng will be.`},{text:`will`,explanation:`Sai. 'will' là trợ động từ chỉ tương lai, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`is going to be`,explanation:`Sai. Cấu trúc 'is going to be' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`shall`,explanation:`Sai. Từ vựng hoặc dạng từ 'shall' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Câu 'I am studying English' sử dụng thành phần 'tobe' nào?`,a:[{text:`am`,correct:!0,explanation:`Chủ ngữ 'I' đi với 'am'.`},{text:`is`,explanation:`Sai. 'is' là động từ 'to be' dùng cho ngôi thứ 3 số ít (he/she/it), không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`are`,explanation:`Sai. 'are' là động từ 'to be' dùng cho ngôi số nhiều (we/you/they), không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`was`,explanation:`Sai. 'was' là động từ 'to be' quá khứ dùng cho ngôi số ít, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1}]},{q:`Câu 'They were watching TV' thuộc thì nào dựa trên Công thức 3?`,a:[{text:`Quá khứ tiếp diễn.`,correct:!0,explanation:`'Were' là tobe quá khứ + Ving -> Quá khứ tiếp diễn.`},{text:`Hiện tại tiếp diễn.`,explanation:`Sai. Cấu trúc 'Hiện tại tiếp diễn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Tương lai tiếp diễn.`,explanation:`Sai. Cấu trúc 'Tương lai tiếp diễn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:
