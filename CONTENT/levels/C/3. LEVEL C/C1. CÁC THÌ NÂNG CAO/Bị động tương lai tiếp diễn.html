const fullQuestionBank=[{q:`At this time tomorrow, the report ___ by the manager. 📄`,a:[{text:`will be being read`,correct:!0,explanation:`Cấu trúc bị động thì Tương lai tiếp diễn: will + be + being + V3/ed.`},{text:`will be reading`,explanation:`Sai. Ngữ cảnh câu mang nghĩa bị động, không dùng phương án chủ động 'will be reading'.`,correct:!1},{text:`will read`,explanation:`Sai. Đây là thì Tương lai đơn bị động.`,correct:!1},{text:`is being readed`,explanation:`Sai. Đây là thì Hiện tại tiếp diễn bị động.`,correct:!1}]},{q:`At this time next week, the new bridge ___ by the workers; construction will still be underway. 🌉`,a:[{text:`will be being built`,correct:!0,explanation:`Cấu trúc bị động TLTD: will + be + being + V3 (built).`},{text:`will be building`,explanation:`Sai. Ngữ cảnh câu mang nghĩa bị động, không dùng phương án chủ động 'will be building'.`,correct:!1},{text:`will built`,explanation:`Sai. Sau 'will' phải có 'be being built'; 'will built' thiếu cả cấu trúc bị động tiếp diễn.`,correct:!1},{text:`is building`,explanation:`Sai. 'is building' là hiện tại tiếp diễn chủ động, không khớp mốc 'next week' và chủ ngữ cây cầu.`,correct:!1}]},{q:`Don't come at 7 PM tomorrow. The house ___ by my mom. 🧹`,a:[{text:`will be being cleaned`,correct:!0,explanation:`Hành động sẽ đang diễn ra ở tương lai (at 7 PM) dưới dạng bị động.`},{text:`will be cleaning`,explanation:`Sai. Nhà không thể tự dọn dẹp.`,correct:!1},{text:`will cleaned`,explanation:`Sai. Cần 'will be being cleaned'; 'will cleaned' thiếu 'be being' trước V3.`,correct:!1},{text:`was being cleaned`,explanation:`Sai. Dấu hiệu 'by my mom' không phù hợp với thì/cấu trúc của phương án 'was being cleaned'.`,correct:!1}]},{q:`The old songs ___ by the choir at this time next Sunday. 🎤`,a:[{text:`will be being sung`,correct:!0,explanation:`Passive Future Continuous: will + be + being + V3 (sung).`},{text:`will be singing`,explanation:`Sai. Chủ ngữ 'The old songs' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will be singing'.`,correct:!1},{text:`are being sing`,explanation:`Sai. Sau 'being' cần V3 'sung', đồng thời phải dùng 'will' cho mốc Chủ nhật tới.`,correct:!1},{text:`will be sing`,explanation:`Sai. Dấu hiệu 'by the choir at this time next Sunday' không phù hợp với thì/cấu trúc của phương án 'will be sung'.`,correct:!1}]},{q:`At 10 o'clock tomorrow, the cake ___ by the chef. 🎂`,a:[{text:`will be being decorated`,correct:!0,explanation:`Cấu trúc: will + be + being + V3 (decorated).`},{text:`will be decorating`,explanation:`Sai. Ngữ cảnh câu mang nghĩa bị động, không dùng phương án chủ động 'will be decorating'.`,correct:!1},{text:`is being decorate`,explanation:`Sai. V3 của 'decorate' là 'decorated', và mốc tương lai cần 'will be being decorated'.`,correct:!1},{text:`will being decorated`,explanation:`Sai ngữ pháp (thiếu 'be').`,correct:!1}]},{q:`This time next year, a new school ___ in our village; construction will still be underway. 🏫`,a:[{text:`will be being constructed`,correct:!0,explanation:`Ở mốc 'this time next year', ngôi trường sẽ đang được xây; 'constructed' là V3 của construct.`},{text:`will be constructing`,explanation:`Sai. Ngữ cảnh câu mang nghĩa bị động, không dùng phương án chủ động 'will be constructing'.`,correct:!1},{text:`will construct`,explanation:`Sai. 'will construct' là chủ động; ngôi trường là đối tượng được xây và cần dạng bị động tiếp diễn.`,correct:!1},{text:`is constructed`,explanation:`Sai. 'is constructed' là hiện tại đơn bị động; câu cần quá trình đang diễn ra vào năm tới.`,correct:!1}]},{q:`At 4 PM tomorrow, the car ___ when you arrive; the repair will still be underway. 🚗`,a:[{text:`will be being repaired`,correct:!0,explanation:`Hành động sửa xe sẽ đang diễn ra (bị động) khi bạn đến.`},{text:`will be repairing`,explanation:`Sai. Chủ ngữ 'The car' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will be repairing'.`,correct:!1},{text:`will repair`,explanation:`Sai. 'will repair' 🎨`,a:[{text:`will be being painted`,correct:!0,explanation:`Lúc 5 giờ ngày mai, những bức tường sẽ đang được sơn; 'painted' giữ vai trò V3.`},{text:`will be painting`,explanation:`Sai. Chủ ngữ 'The walls' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will be painting'.`,correct:!1},{text:`will painted`,explanation:`Sai. Cần 'will be being painted'; 'will painted' thiếu cấu trúc bị động tiếp diễn.`,correct:!1},{text:`are painting`,explanation:`Sai. Từ vựng hoặc dạng từ 'are painting' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`My laptop ___ by the technician all afternoon tomorrow; the repair will still be in progress. 💻`,a:[{text:`will be being fixed`,correct:!0,explanation:`Diễn tả hành động bị động kéo dài trong tương lai.`},{text:`will be fixing`,explanation:`Sai. Chủ ngữ 'My laptop' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will be fixing'.`,correct:!1},{text:`will fix`,explanation:`Sai. 'will fix' là chủ động; laptop là vật được kỹ thuật viên sửa suốt buổi chiều.`,correct:!1},{text:`is fix`,explanation:`Sai. Sau 'being' cần V3 'fixed', và mốc tương lai cần 'will be being fixed'.`,correct:!1}]},{q:`The delicious dinner ___ by my father at 6 PM tomorrow. 🍳`,a:[{text:`will be being cooked`,correct:!0,explanation:`Bữa tối nhận hành động nấu tại 6 giờ tương lai, nên dùng 'will be being cooked'.`},{text:`will be cooking`,explanation:`Sai. Chủ ngữ 'The delicious dinner' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will be cooking'.`,correct:!1},{text:`will cook`,explanation:`Sai. 'will cook' là chủ động; bữa tối nhận tác động từ cha và đang được nấu lúc 6 PM.`,correct:!1},{text:`is being cook`,explanation:`Sai. V3 của 'cook' là 'cooked'; hiện tại 'is being' cũng không khớp 6 PM tương lai.`,correct:!1}]},{q:`The heavy boxes ___ by the movers when we get there; the carrying will still be underway. 📦`,a:[{text:`will be being carried`,correct:!0,explanation:`Khi chúng ta tới, các hộp sẽ đang được người chuyển đồ mang; 'carried' là V3.`},{text:`will be carrying`,explanation:`Sai. Chủ ngữ 'The heavy boxes' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will be carrying'.`,correct:!1},{text:`will carried`,explanation:`Sai cấu trúc. Thể truyền khiến (Causative) bị động cần dùng V3/ed.`,correct:!1},{text:`are carried`,explanation:`Sai. 'are carried' là hiện tại đơn bị động; lúc chúng ta đến, hành động phải đang diễn ra trong tương lai.`,correct:!1}]},{q:`At this time next month, a new video game ___ by the team; development will still be underway. 🎮`,a:[{text:`will be being developed`,correct:!0,explanation:`Bị động TLTD diễn tả quá trình đang diễn ra trong tương lai.`},{text:`will be developing`,explanation:`Sai. Chủ ngữ 'A new video game' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will be developing'.`,correct:!1},{text:`will develop`,explanation:`Sai. 'will develop' là chủ động, không diễn tả trò chơi được đội phát triển trong tháng tới.`,correct:!1},{text:`is developing`,explanation:`Sai. 'is developing' là hiện tại tiếp diễn chủ động, không khớp mốc 'next month' và chủ ngữ trò chơi.`,correct:!1}]},{q:`The flowers ___ by my sister this time tomorrow; watering will still be in progress. 🌻`,a:[{text:`will be being watered`,correct:!0,explanation:`Cấu trúc: will + be + being + V3.`},{text:`will be watering`,explanation:`Sai. Chủ ngữ 'The flowers' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will be watering'.`,correct:!1},{text:`will water`,explanation:`Sai. 'will water' là chủ động; hoa là đối tượng được chị tưới vào thời điểm ngày mai.`,correct:!1},{text:`are water`,explanation:`Sai. 'water' chưa là V3; cần 'will be being watered' cho thời điểm ngày mai.`,correct:!1}]},{q:`The final exam ___ by the students at 8 AM next Monday. 📝`,a:[{text:`will be being taken`,correct:!0,explanation:`Học sinh làm bài thi => Bài thi được làm (taken).`},{text:`will be taking`,explanation:`Sai. Chủ ngữ 'The final exam' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will be taking'.`,correct:!1},{text:`will be took`,explanation:`Sai V3. Cách dùng phù hợp trong câu này là “will be being taken”.`,correct:!1},{text:`is take`,explanation:`Sai. 'is take' thiếu V3 'taken' và dùng hiện tại thay vì tương lai.`,correct:!1}]},{q:`At this exact moment next week, the contract ___. ✍️`,a:[{text:`will be being signed`,correct:!0,explanation:`Hành động ký hợp đồng đang diễn ra ở tương lai (bị động).`},{text:`will be signing`,explanation:`Sai. Ngữ cảnh câu mang nghĩa bị động, không dùng phương án chủ động 'will be signing'.`,correct:!1},{text:`will sign`,explanation:`Sai. 'will sign' là chủ động; hợp đồng là đối tượng đang được ký vào thời điểm tuần tới.`,correct:!1},{text:`is signing`,explanation:`Sai. 'is signing' là hiện tại tiếp diễn chủ động, không khớp 'at this exact moment next week'.`,correct:!1}]},{q:`At 3 PM tomorrow, the broken window ___ while the rain is stopping; the replacement will still be underway. 🪟`,a:[{text:`will be being replaced`,correct:!0,explanation:`Lúc 3 giờ, cửa sổ sẽ đang được thay và công việc vẫn tiếp diễn.`},{text:`will be replacing`,explanation:`Sai. Chủ ngữ 'The broken window' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will be replacing'.`,correct:!1},{text:`will replace`,explanation:`Sai. 'will replace' là chủ động; cửa sổ bị thay thế lúc 3 PM ngày mai.`,correct:!1},{text:`is replace`,explanation:`Sai. 'replace' phải là V3 'replaced' và cần cấu trúc tương lai tiếp diễn bị động.`,correct:!1}]},{q:`At 11 AM tomorrow, the gifts ___ by the children; the unwrapping will still be underway. 🎁`,a:[{text:`will be being opened`,correct:!0,explanation:`Đến 11 giờ, quà sẽ đang được bọn trẻ mở; 'opened' là phân từ bị động.`},{text:`will be opening`,explanation:`Sai. Chủ ngữ 'The gifts' chịu sự tác động, do đó câu ma
