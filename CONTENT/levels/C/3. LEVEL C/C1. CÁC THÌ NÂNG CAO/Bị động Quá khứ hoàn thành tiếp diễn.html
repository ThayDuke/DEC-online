const fullQuestionBank=[{q:`Use the Past Perfect Continuous Passive: the old house ___ for three months before they sold it. 🏠`,a:[{text:`had been being renovated`,correct:!0,explanation:`Cấu trúc bị động QKHTTD: S + had + been + being + V3/ed.`},{text:`had been renovated`,explanation:`Sai. Đây là QKHT, thiếu tính tiếp diễn.`,correct:!1},{text:`has been being renovated`,explanation:`Sai. Đây là HTHTTD. Cách dùng phù hợp trong câu này là “had been being renovated”.`,correct:!1},{text:`was being renovated`,explanation:`Sai. Đây là QKTD. Cách dùng phù hợp trong câu này là “had been being renovated”.`,correct:!1}]},{q:`The heavy boxes ___ by the workers all morning before the truck left. 📦`,a:[{text:`had been being carried`,correct:!0,explanation:`Nhấn mạnh quá trình 'bê vác' diễn ra liên tục trước 1 thời điểm trong quá khứ.`},{text:`had carried`,explanation:`Sai. Chủ ngữ 'The heavy boxes' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had carried'.`,correct:!1},{text:`have been being carried`,explanation:`Sai. Dấu hiệu 'by the workers all morning' không phù hợp với thì/cấu trúc của phương án 'have been being carried'.`,correct:!1},{text:`had been carry`,explanation:`Sau 'been' cần 'being' và V3: phải là 'had been being carried'.`,correct:!1}]},{q:`That beautiful song ___ by the singer for hours before the show ended. 🎤`,a:[{text:`had been being sung`,correct:!0,explanation:`Sing -> Sang -> Sung. Cấu trúc: had been being + V3.`},{text:`had been being sang`,explanation:`Sai V3 (sang là V2).`,correct:!1},{text:`had being sung`,explanation:`Sai. Dấu hiệu 'by the singer for hours before the show ended' không phù hợp với thì/cấu trúc của phương án 'had being sung'.`,correct:!1},{text:`had been singing`,explanation:`Sai. Chủ ngữ 'That beautiful song' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had been singing'.`,correct:!1}]},{q:`Use the Past Perfect Continuous Passive: the important report ___ by the team before the manager arrived. 📄`,a:[{text:`had been being prepared`,correct:!0,explanation:`Hành động 'chuẩn bị' bị động và kéo dài liên tục trong quá khứ.`},{text:`had prepared`,explanation:`Sai. Chủ ngữ 'The important report' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had prepared'.`,correct:!1},{text:`was being prepared`,explanation:`Sai. Dấu hiệu 'by the team before the manager arrived' không phù hợp với thì/cấu trúc của phương án 'was being prepared'.`,correct:!1},{text:`had been prepared`,explanation:`Sai. Đây là QKHT (nhấn mạnh kết quả hơn là quá trình).`,correct:!1}]},{q:`The tasty cakes ___ in the kitchen all afternoon before the guests arrived. 🍰`,a:[{text:`had been being baked`,correct:!0,explanation:`Bị động QKHTTD: had + been + being + V3.`},{text:`had been baking`,explanation:`Sai. Chủ ngữ 'The tasty cakes' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had been baking'.`,correct:!1},{text:`have been being baked`,explanation:`'Have' đặt câu ở hiện tại hoàn thành; mốc 'before the guests arrived' yêu cầu 'had'.`,correct:!1},{text:`had being baked`,explanation:`Cấu trúc bị động tiếp diễn phải có đủ 'had been being baked', không được bỏ 'been'.`,correct:!1}]},{q:`Use the Past Perfect Continuous Passive: the fence ___ when the storm hit. 🖌️`,a:[{text:`had been being painted`,correct:!0,explanation:`Hành động 'sơn' xảy ra liên tục trước khi bão đến.`},{text:`had been painted`,explanation:`Sai. QKHT nhấn mạnh việc đã xong.`,correct:!1},{text:`was painting`,explanation:`Sai. Chủ ngữ 'The fence' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'was painting'.`,correct:!1},{text:`had painted`,explanation:`Sai. Chủ ngữ 'The fence' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had painted'.`,correct:!1}]},{q:`Choose the correct passive sentence: 'They had been watching the movie for 2 hours before the director arrived.' 🎬`,a:[{text:`The movie had been being watched for 2 hours.`,correct:!0,explanation:`Chuyển tân ngữ 'The movie' lên làm chủ ngữ, áp dụng had been being V3.`},{text:`The movie had been watched for 2 hours.`,explanation:`Sai. Mất tính tiếp diễn.`,correct:!1},{text:`The movie had being watched for 2 hours.`,explanation:`Sai ngữ pháp (thiếu been).`,correct:!1},{text:`The movie was being watched for 2 hours.`,explanation:`Sai. Dấu hiệu 'for 2 hours' không phù hợp với thì/cấu trúc của phương án 'The movie was being watched for 2 hours.'.`,correct:!1}]},{q:`The noisy road ___ for a long time before we moved here. 🚧`,a:[{text:`had been being repaired`,correct:!0,explanation:`Repair là động từ có quy tắc -> repaired.`},{text:`had been repairing`,explanation:`Sai. Chủ ngữ 'The noisy road' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had been repairing'.`,correct:!1},{text:`has been being repaired`,explanation:`'Has' là hiện tại; mốc 'before we moved here' nằm trong quá khứ nên phải dùng 'had'.`,correct:!1},{text:`had being repaired`,explanation:`Thiếu 'been' giữa 'had' và 'being'; dạng đúng là 'had been being repaired'.`,correct:!1}]},{q:`Use the Past Perfect Continuous Passive: my car ___ by the mechanic for a week before the inspection. 🚗`,a:[{text:`had been being fixed`,correct:!0,explanation:`Fix -> Fixed. Bị động nhấn mạnh quá trình.`},{text:`had been fixing`,explanation:`Sai. Chủ ngữ 'My car' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had been fixing'.`,correct:!1},{text:`had being fixed`,explanation:`Cần thêm 'been' để tạo chuỗi 'had been being fixed' ở bị động quá khứ hoàn thành tiếp diễn.`,correct:!1},{text:`was being fixed`,explanation:`Sai thì: hành động kéo dài trước mốc quá khứ cần 'had been being fixed', không dùng 'was being fixed'.`,correct:!1}]},{q:`The secret data ___ before the system crashed. 💻`,a:[{text:`had been being downloaded`,correct:!0,explanation:`Dữ liệu đang được tải xuống liên tục thì máy hỏng.`},{text:`had been download`,explanation:`Sau 'been' phải dùng V3 'downloaded', không dùng nguyên mẫu 'download'.`,correct:!1},{text:`had downloaded`,explanation:`Sai. Chủ ngữ 'The secret data' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had downloaded'.`,correct:!1},{text:`was downloading`,explanation:`Sai. Chủ ngữ 'The secret data' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'was downloading'.`,correct:!1}]},{q:`Use the Past Perfect Continuous Passive: the garden ___ by my dad all day yesterday before the storm arrived. 🌻`,a:[{text:`had been being watered`,correct:!0,explanation:`Hành động bị động kéo dài trong quá khứ.`},{text:`had been watering`,explanation:`Sai. Chủ ngữ 'The garden' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had been watering'.`,correct:!1},{text:`had watered`,explanation:`Sai. Chủ ngữ 'The garden' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had watered'.`,correct:!1},{text:`was being watered`,explanation:`Sai. Dấu hiệu 'by my dad all day yesterday' không phù hợp với thì/cấu trúc của phương án 'was being watered'.`,correct:!1}]},{q:`Choose the correct passive sentence: 'She had been writing the novel for years before it was published.' 📚`,a:[{text:`The novel had been being written for years.`,correct:!0,explanation:`Write -> Written. Cấu trúc bị động QKHTTD.`},{text:`The novel had been written for years.`,explanation:`Sai. Đây là QKHT. Cách dùng phù hợp trong câu này là “The novel had been being written for years.”.`,correct:!1},{text:`The novel had being written for years.`,explanation:`Bị động tiếp diễn cần đủ 'had been being written'; phương án này thiếu 'been'.`,correct:!1},{text:`The novel has been being written for years.`,explanation:`Mệnh đề 'before it was published' là mốc quá khứ, nên dùng 'had', không dùng 'has'.`,correct:!1}]},{q:`The old bridge ___ for months before it collapsed. 🌉`,a:[{text:`had been being used`,correct:!0,explanation:`Cây cầu đã được sử dụng liên tục trước khi sập.`},{text:`had been using`,explanation:`Sai. Chủ ngữ 'The old bridge' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had been using'.`,correct:!1},{text:`had being used`,explanation:`Thiếu 'been' trong công thức; phải viết 'had been being used'.`,correct:!1},{text:`was using`,explanation:`Sai. Chủ ngữ 'The old bridge' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'was using'.`,correct:!1}]},{q:`Use the Past Perfect Continuous Passive: those strange sounds ___ before the police came. 👂`,a:[{text:`had been being heard`,correct:!0,explanation:`Hear -> Heard. Âm thanh bị/được nghe thấy.`},{text:`had been hearing`,explanation:`Sai. Chủ ngữ 'Those strange sounds' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had been hearing'.`,correct:!1},{text:`had being heard`,explanation:`Cần 'been' trước 'being heard' để thể hiện quá trình bị động kéo dài.`,correct:!1},{text:`were being heard`,explanation:`Sai thì: quá trình kéo dài trước mốc quá khứ cần 'had been being heard', không dùng quá khứ tiếp diễn đơn.`,correct:!1}]},{q:`The messy room ___ by the kids just before mom got home. 🧹`,a:[{text:`had been being cleaned`,correct:!0,explanation:`Clean -> Cleaned. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`had been cleaning`,explanation:`Sai. Chủ ngữ 'The messy room' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had been cleaning'.`,correct:!1},{text:`has been being cleaned`,explanation:`Mốc 'before mom got home' ở quá khứ, vì vậy trợ động từ phải là 'had', không phải 'has'.`,correct:!1},{text:`had cleaned`,explanation:`Sai. Chủ ngữ 'The messy room' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had cleaned'.`,correct:!1}]},{q:`The difficult lesson ___ by the teacher for 45 minutes before the bell rang. 👨‍🏫`,a:[{text:`had been being explained`,correct:!0,explanation:`Bài học được giải thích liên tục trong 45 phút trước đó.`},{text:`had been explaining`,explanation:`Sai. Chủ ngữ 'The difficult lesson' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had been explaining'.`,correct:!1},{text:`had explain`,explanation:`Phương án thiếu toàn bộ 'been being' và cũng chưa dùng V3 'explained'.`,correct:!1},{text:`was explaining`,explanation:`Sai. Chủ ngữ 'The difficult lesson' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'was explaining'.`,correct:!1}]},{q:`The stolen money ___ for a long time before the police found it. 💰`,a:[{text:`had been being looked for`,correct:!0,explanation:`Cụm động từ 'look for' giữ nguyên giới từ 'for' sau V3.`},{text:`had been being looked`,explanation:`Sai. Thiếu 'for'. Cách dùng phù hợp trong câu này là “had been being looked for”.`,correct:!1},{text:`had been looking for`,explanation:`Sai. Chủ ngữ 'The stolen money' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had been looking for'.`,correct:!1},{text:`had looked for`,explanation:`Sai. Chủ ngữ 'The stolen money' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had looked for'.`,correct:!1}]},{q:`The new software ___ before the bug was found. 💿`,a:[{text:`had been being installed`,correct:!0,explanation:`Phần mềm đang trong quá trình được cài đặt.`},{text:`had been installing`,explanation:`Sai. Chủ ngữ 'The new software' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had been installing'.`,correct:!1},{text:`had being installed`,explanation:`Công thức cần 'had been being installed'; phương án này bỏ mất 'been'.`,correct:!1},{text:`was installing`,explanation:`Sai. Chủ ngữ 'The new software' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'was installing'.`,correct:!1}]},{q:`Choose the correct passive sentence: 'Someone had been throwing stone
