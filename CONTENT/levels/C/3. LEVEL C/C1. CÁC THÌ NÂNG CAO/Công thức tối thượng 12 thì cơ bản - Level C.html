const fullQuestionBank=[{q:`Mục đích chính của bộ 'Công thức tối thượng' là gì?`,a:[{text:`Giúp ghi nhớ ít công thức nhất nhưng triển khai được mọi thì.`,correct:!0,explanation:`Theo tài liệu, mục đích là giúp học sinh ghi nhớ ít nhất có thể nhưng triển khai ra mọi công thức.`},{text:`Giúp học sinh học thuộc lòng 12 công thức riêng biệt.`,explanation:`Sai. Mục tiêu là tổng hợp lại, không phải học thuộc lòng riêng lẻ.`,correct:!1},{text:`Chỉ tập trung vào các thì quá khứ.`,explanation:`Sai. Bộ công thức bao quát các thì trong tiếng Anh (T1-T12).`,correct:!1},{text:`Để luyện tập kỹ năng nghe nói chuyên sâu.`,explanation:`Sai. Mục đích tập trung vào cấu trúc ngữ pháp (công thức).`,correct:!1}]},{q:`Bộ 'Công thức tối thượng' bao gồm bao nhiêu công thức chính?`,a:[{text:`5 công thức.`,correct:!0,explanation:`Tài liệu nêu rõ: PHẦN I: BỘ 5 CÔNG THỨC TỐI THƯỢNG DUKE.`},{text:`12 công thức.`,explanation:`Sai. 12 là số lượng thì, không phải số lượng công thức tối thượng.`,correct:!1},{text:`3 công thức.`,explanation:`Sai. Cấu trúc '3 công thức.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`4 công thức.`,explanation:`Sai. Cấu trúc '4 công thức.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Bộ 5 công thức tối thượng này áp dụng cho thể nào của động từ?`,a:[{text:`Thể Chủ động.`,correct:!0,explanation:`Tài liệu ghi chú: Đây là bộ 5 công thức chuyên dùng cho 12 thì ở thể Chủ động.`},{text:`Thể Bị động.`,explanation:`Sai. Tài liệu nói chưa áp dụng được với thể Bị động.`,correct:!1},{text:`Cả chủ động và bị động.`,explanation:`Sai. Cấu trúc 'Cả chủ động và bị động.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Thể cầu khiến.`,explanation:`Sai. Cấu trúc 'Thể cầu khiến.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Để chuyển sang thể Bị động, chúng ta cần tham khảo phần nào?`,a:[{text:`Phần 2.`,correct:!0,explanation:`Tài liệu ghi: Để chuyển sang bị động, chúng ta cần phần 2.`},{text:`Phần 1.`,explanation:`Sai. Phần 1 là bộ 5 công thức chủ động.`,correct:!1},{text:`Phụ lục.`,explanation:`Sai. Từ vựng hoặc dạng từ 'Phụ lục.' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Công thức số 5.`,explanation:`Sai. Cấu trúc 'Công thức số 5.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Công thức số 1 (S + tobe + N/Adj) là công thức tổng hợp của nhóm thì nào?`,a:[{text:`Các thì Đơn (diễn tả trạng thái, tính chất).`,correct:!0,explanation:`Công thức 1 dùng động từ tobe, tổng hợp các thì Đơn.`},{text:`Các thì Tiếp diễn.`,explanation:`Sai. Đó là công thức 3.`,correct:!1},{text:`Các thì Hoàn thành.`,explanation:`Sai. Đó là công thức 4.`,correct:!1},{text:`Các thì Hoàn thành tiếp diễn.`,explanation:`Sai. Cấu trúc 'Các thì Hoàn thành tiếp diễn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Công thức số 2 (S + V + O) là công thức tổng hợp của nhóm thì nào?`,a:[{text:`Các thì Đơn (diễn tả hành động).`,correct:!0,explanation:`Công thức 2 dùng động từ thường, tổng hợp các thì Đơn.`},{text:`Các thì Tiếp diễn.`,explanation:`Sai. Cấu trúc 'Các thì Tiếp diễn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Các thì Hoàn thành.`,explanation:`Sai. Cấu trúc 'Các thì Hoàn thành.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Các thì Hoàn thành tiếp diễn.`,explanation:`Sai. Cấu trúc 'Các thì Hoàn thành tiếp diễn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Công thức số 3 (S + tobe + Ving + O) là công thức tổng hợp của nhóm thì nào?`,a:[{text:`Các thì Tiếp diễn.`,correct:!0,explanation:`Công thức 3 đại diện cho nhóm thì Tiếp diễn.`},{text:`Các thì Đơn.`,explanation:`Sai. Cấu trúc 'Các thì Đơn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Các thì Hoàn thành.`,explanation:`Sai. Cấu trúc 'Các thì Hoàn thành.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Các thì Tương lai gần.`,explanation:`Sai. Cấu trúc 'Các thì Tương lai gần.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Công thức số 4 (S + HAVE + V3 + O) là công thức tổng hợp của nhóm thì nào?`,a:[{text:`Các thì Hoàn thành.`,correct:!0,explanation:`Công thức 4 đại diện cho nhóm thì Hoàn thành.`},{text:`Các thì Tiếp diễn.`,explanation:`Sai. Cấu trúc 'Các thì Tiếp diễn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Các thì Đơn.`,explanation:`Sai. Cấu trúc 'Các thì Đơn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Các thì Bị động.`,explanation:`Sai. Cấu trúc 'Các thì Bị động.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Công thức số 5 (S + HAVE + been + Ving + O) là công thức tổng hợp của nhóm thì nào?`,a:[{text:`Các thì Hoàn thành tiếp diễn.`,correct:!0,explanation:`Công thức 5 đại diện cho nhóm thì Hoàn thành tiếp diễn.`},{text:`Các thì Hoàn thành.`,explanation:`Sai. Cấu trúc 'Các thì Hoàn thành.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Các thì Tiếp diễn.`,explanation:`Sai. Cấu trúc 'Các thì Tiếp diễn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Các thì Đơn.`,explanation:`Sai. Cấu trúc 'Các thì Đơn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Trong bộ công thức này, động từ 'tobe' ở Công thức 1 dùng để diễn tả điều gì?`,a:[{text:`Trạng thái, tính chất.`,correct:!0,explanation:`Tài liệu ghi rõ: tobe (diễn tả trạng thái, tính chất).`},{text:`Hành động dứt khoát.`,explanation:`Sai. Đó là động từ thường (V) ở công thức 2.`,correct:!1},{text:`Sự sở hữu.`,explanation:`Sai. Cấu trúc 'Sự sở hữu.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Sự tiếp diễn.`,explanation:`Sai. Cấu trúc 'Sự tiếp diễn.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Với Hiện tại đơn trong Công thức 1, 'tobe' được triển khai thành gì?`,a:[{text:`am / is / are`,correct:!0,explanation:`Quy ước Công thức 1: Với hiện tại đơn: tobe = am/is/are.`},{text:`was / were`,explanation:`Sai. Đây là Quá khứ đơn.`,correct:!1},{text:`will be`,explanation:`Sai. Đây là Tương lai đơn.`,correct:!1},{text:`been`,explanation:`Sai. Từ vựng hoặc dạng từ 'been' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Với Quá khứ đơn trong Công thức 1, 'tobe' được triển khai thành gì?`,a:[{text:`was / were`,correct:!0,explanation:`Quy ước Công thức 1: Với quá khứ đơn: tobe = was/were.`},{text:`am / is / are`,explanation:`Sai. Cấu trúc 'am / is / are' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`will be`,explanation:`Sai. Từ vựng hoặc dạng từ 'will be' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`being`,explanation:`Sai. Từ vựng hoặc dạng từ 'being' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Với Tương lai đơn dùng will trong Công thức 1, 'tobe' được triển khai thành gì?`,a:[{text:`will be`,correct:!0,explanation:`Quy ước Công thức 1: Với tương lai đơn: tobe = will be.`},{text:`shall`,explanation:`Sai. Từ vựng hoặc dạng từ 'shall' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`was / were`,explanation:`Sai. Cấu trúc 'was / were' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`is going to`,explanation:`Sai. Tài liệu không đề cập tương lai gần trong bộ này.`,correct:!1}]},{q:`Trong Công thức 2, động từ thường (V) diễn tả điều gì?`,a:[{text:`Hành động.`,correct:!0,explanation:`Tài liệu ghi: sử dụng động từ thường (diễn tả hành động).`},{text:`Trạng thái.`,explanation:`Động từ thường V diễn tả hành động/sự việc, không phải trạng thái trong công thức đang hỏi.`,correct:!1},{text:`Tính chất.`,explanati
