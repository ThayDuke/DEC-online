ng nguyên mẫu 'show'.`,correct:!1},{text:`is going to be show`,explanation:`Sai. Động từ phải ở dạng V3 (shown).`,correct:!1}]},{q:`The letters ___ by the postman this afternoon. ✉️`,a:[{text:`are going to be delivered`,correct:!0,explanation:`Chủ ngữ 'The letters' (số nhiều) -> are going to be + V3 (delivered).`},{text:`is going to be delivered`,explanation:`Sai. Phương án 'is going to be delivered' không hòa hợp về ngôi và số với chủ ngữ 'The letters'.`,correct:!1},{text:`will deliver`,explanation:`Sai. Chủ ngữ 'The letters' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will deliver'.`,correct:!1},{text:`are going to delivered`,explanation:`Sai: sau 'going to' phải có 'be' trước V3 'delivered'.`,correct:!1}]},{q:`My room ___ by my sister next weekend. 🧹`,a:[{text:`is going to be cleaned`,correct:!0,explanation:`Bị động: is going to be + V3 (cleaned).`},{text:`is going to clean`,explanation:`Sai. Phòng không thể tự dọn.`,correct:!1},{text:`will be cleaning`,explanation:`Sai thể chủ động tiếp diễn; 'my room' nhận hành động nên cần bị động 'is going to be cleaned'.`,correct:!1},{text:`are going to be cleaned`,explanation:`Sai. Phương án 'are going to be cleaned' không hòa hợp về ngôi và số với chủ ngữ 'My room'.`,correct:!1}]},{q:`A new song ___ by the famous singer at next month's concert. 🎤`,a:[{text:`is going to be sung`,correct:!0,explanation:`V3 của 'sing' là 'sung'. Cấu trúc: is going to be + sung.`},{text:`is going to be sing`,explanation:`Sai V3: 'sing' phải đổi thành bất quy tắc 'sung' sau 'be'.`,correct:!1},{text:`is going to be sang`,explanation:`Sai. 'Sang' là V2 (quá khứ đơn).`,correct:!1},{text:`will sung`,explanation:`Sai: sau 'will' cần 'be' để tạo bị động, rồi dùng V3 'sung'.`,correct:!1}]},{q:`The broken window ___ by my dad tomorrow morning. 🔨`,a:[{text:`is going to be fixed`,correct:!0,explanation:`Bị động: is going to be + V3 (fixed).`},{text:`is going to fix`,explanation:`Sai nghĩa (cửa sổ không tự sửa).`,correct:
