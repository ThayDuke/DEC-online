const fullQuestionBank=[{q:`The homework ___ by the students tomorrow. 📚`,a:[{text:`will be finished`,correct:!0,explanation:`Cấu trúc bị động thì tương lai đơn: S + will be + V3/ed. 'Finished' là V-ed.`},{text:`will finish`,explanation:`Sai. Chủ ngữ 'The homework' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will finish'.`,correct:!1},{text:`is finished`,explanation:`Sai. 'is finished' là hiện tại đơn bị động, không khớp mốc tương lai 'tomorrow'.`,correct:!1},{text:`will be finish`,explanation:`Sai. Sau 'be' phải là V3/ed, không phải V nguyên thể.`,correct:!1}]},{q:`A new bridge ___ in our town next year. 🌉`,a:[{text:`will be built`,correct:!0,explanation:`Cấu trúc bị động TLĐ: will be + V3. V3 của 'build' là 'built'.`},{text:`will build`,explanation:`Sai. 'A new bridge' là đối tượng được xây; phải dùng bị động 'will be built', không phải chủ động 'will build'.`,correct:!1},{text:`will be build`,explanation:`Sai. Sau 'will be' cần V3 'built'; 'build' vẫn là nguyên thể.`,correct:!1},{text:`is built`,explanation:`Sai. 'is built' là hiện tại đơn bị động, không phù hợp với mốc 'next year'.`,correct:!1}]},{q:`The party ___ at 7 PM tonight. 🎉`,a:[{text:`will be held`,correct:!0,explanation:`Cấu trúc bị động TLĐ: will be + V3. V3 của 'hold' là 'held'.`},{text:`will hold`,explanation:`Sai. 'The party' là đối tượng được tổ chức lúc 7 giờ; cần bị động 'will be held'.`,correct:!1},{text:`will be hold`,explanation:`Sai. V3 của 'hold' là 'held', nên không thể dùng nguyên dạng 'hold' sau 'will be'.`,correct:!1},{text:`holds`,explanation:`Sai. 'holds' là hiện tại đơn chủ động, thiếu cấu trúc bị động và không khớp mốc tối nay.`,correct:!1}]},{q:`The winner ___ soon. 🏆`,a:[{text:`will be announced`,correct:!0,explanation:`Cấu trúc bị động TLĐ: will be + V3.`},{text:`will announce`,explanation:`Sai. Chủ ngữ 'The winner' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will announce'.`,correct:!1},{text:`is announced`,explanation:`Sai. 'is announced' là hiện tại đơn bị động; 'soon' yêu cầu sự việc sẽ xảy ra trong tương lai.`,correct:!1},{text:`announced`,explanation:`Sai. Phương án 'announced' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`This song ___ by a famous singer at tomorrow night's concert. 🎤`,a:[{text:`will be sung`,correct:!0,explanation:`V3 của 'sing' là 'sung'.`},{text:`will be sang`,explanation:`Sai. Sau 'will be' phải dùng V3 'sung'; 'sang' chỉ là V2 của 'sing'.`,correct:!1},{text:`will sing`,explanation:`Sai. Chủ ngữ 'This song' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will sing'.`,correct:!1},{text:`is singing`,explanation:`Sai. 'is singing' là chủ động tiếp diễn; chủ ngữ 'This song' phải nhận tác động từ ca sĩ.`,correct:!1}]},{q:`The letters ___ to your house next week. ✉️`,a:[{text:`will be sent`,correct:!0,explanation:`V3 của 'send' là 'sent'.`},{text:`will be send`,explanation:`Sai. V3 của 'send' là 'sent', không phải nguyên thể 'send' sau 'will be'.`,correct:!1},{text:`will send`,explanation:`Sai. Chủ ngữ 'The letters' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will send'.`,correct:!1},{text:`are sent`,explanation:`Sai. 'are sent' là hiện tại đơn bị động, trái với mốc tương lai 'next week'.`,correct:!1}]},{q:`The car ___ by my dad tomorrow morning. 🚗`,a:[{text:`will be washed`,correct:!0,explanation:`Động từ 'wash' có quy tắc, thêm -ed.`},{text:`will wash`,explanation:`Sai. Chủ ngữ 'The car' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will wash'.`,correct:!1},{text:`will be wash`,explanation:`Sai. Sau 'will be' cần V3 'washed', không dùng nguyên thể 'wash'.`,correct:!1},{text:`washed`,explanation:`Sai. 'washed' thiếu trợ động từ 'will be', nên không tạo được bị động tương lai với mốc 'tomorrow morning'.`,correct:!1}]},{q:`My room ___ later this afternoon. 🧹`,a:[{text:`will be cleaned`,correct:!0,explanation:`Hành động đ in'.`,correct:!1},{text:`explained`,explanation:`Sai. 'explained' thiếu cụm 'will be', nên không tạo bị động cho mốc 'tomorrow's lesson'.`,correct:!1}]},{q:`New trees ___ in the park next month. 🌳`,a:[{text:`will be planted`,correct:!0,explanation:`Cấu trúc bị động TLĐ.`},{text:`will plant`,explanation:`Sai. 'New trees' là đối tượng được trồng trong công viên; phải dùng 'will be planted'.`,correct:!1},{text:`will be plant`,explanation:`Sai. V3 của 'plant' là 'planted'; sau 'will be' không dùng nguyên thể 'plant'.`,correct:!1},{text:`are planted`,explanation:`Sai. 'are planted' là hiện tại đơn bị động, không phù hợp mốc 'next month'.`,correct:!1}]},{q:`The movie ___ at the cinema next Friday. 🎬`,a:[{text:`will be shown`,correct:!0,explanation:`V3 của 'show' là 'shown'.`},{text:`will be showed`,explanation:`Sai theo dạng chuẩn của bài: sau 'will be' dùng V3 'shown' của 'show'; phương án 'showed' không phải đáp án mục tiêu ở đây.`,correct:!1},{text:`will show`,explanation:`Sai. Chủ ngữ 'The movie' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will show'.`,correct:!1},{text:`shows`,explanation:`Sai. 'shows' là hiện tại đơn chủ động; 'The movie' là đối tượng được chiếu vào 'next Friday'.`,correct:!1}]},{q:`Dinner ___ at 8 o'clock tonight. 🍽️`,a:[{text:`will be served`,correct:!0,explanation:`Bữa tối được phục vụ.`},{text:`will serve`,explanation:`Sai. Chủ ngữ 'Dinner' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will serve'.`,correct:!1},{text:`will be serve`,explanation:`Sai. V3 của 'serve' là 'served', không dùng nguyên thể sau 'will be'.`,correct:!1},{text:`is serving`,explanation:`Sai. 'is serving' là hiện tại tiếp diễn chủ động; 'Dinner' phải là đối tượng được phục vụ trong tương lai.`,correct:!1}]},{q:`The lost dog ___ by its owner soon. 🐕`,a:[{text:`will be found`,correct:!0,explanation:`V3 của 'find' là 'found'.`},{text:`will be find`,explanation:`Sai. V3 của 'find' là 'found', không phải nguyên thể 'find' sau 'will be'.`,correct:!1},{text:`will find`,explanation:`Sai. Chủ ngữ 'The lost dog' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will find'.`,correct:!1},{text:`finds`,explanation:`Sai. 'finds' là hiện tại đơn chủ động và không thể diễn tả chú chó được chủ nhân tìm thấy.`,correct:!1}]},{q:`All the questions ___ correctly in tomorrow's test. ❓`,a:[{text:`will be answered`,correct:!0,explanation:`Bị động TLĐ với động từ 'answer'.`},{text:`will answer`,explanation:`Sai. Chủ ngữ 'All the questions' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will answer'.`,correct:!1},{text:`will be answer`,explanation:`Sai. V3 của 'answer' là 'answered'; sau 'will be' phải dùng dạng này.`,correct:!1},{text:`answered`,explanation:`Sai. 'answered' đứng một mình là V3, thiếu 'will be' của cấu trúc bị động tương lai.`,correct:!1}]},{q:`The computer ___ tomorrow afternoon. 💻`,a:[{text:`will be repaired`,correct:!0,explanation:`Bị động: máy tính sẽ được sửa.`},{text:`will repair`,explanation:`Sai. Chủ ngữ 'The computer' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will repair'.`,correct:!1},{text:`will be repair`,explanation:`Sai. Sau 'will be' cần V3 'repaired', không dùng nguyên thể 'repair'.`,correct:!1},{text:`repairs`,explanation:`Sai. 'repairs' là hiện tại đơn chủ động; máy tính là vật được sửa vào ngày mai.`,correct:!1}]},{q:`The gift ___ in beautiful paper before the party tomorrow. 🎁`,a:[{text:`will be wrapped`,correct:!0,explanation:`Gấp đôi phụ âm cuối 'p' trước khi thêm 'ed'.`},{text:`will be wrap`,explanation:`Sai. V3 của 'wrap' là 'wrapped', nên phải dùng dạng gấp đôi 'p' sau 'will be'.`,correct:!1},{text:`will wrap`,explanation:`Sai. Chủ ngữ 'The gift' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will wrap'.`,correct:!1},{text:`wrapped`,explanation:`Sai. 'wrapped' thiếu 'will be' và không thể hiện việc món quà sẽ được gói trước bữa tiệc.`,correct:!1}]},{q:`English ___ by more people in the future. 🗣️`,a:[{text:`will be spoken`,correct:!0,explanation:`V3 của 'speak' là 'spoken'.`},{text:`will be spoke`,explanation:`Sai. 'spoke' là V2 của 'speak'; sau 'will be' cần V3 'spoken'.`,correct:!1},{text:`will speak`,explanation:`Sai. Chủ ngữ 'English' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will speak'.`,correct:!1},{text:`is spoken`,explanation:`Sai. 'is spoken' là hiện tại đơn bị động, không khớp mốc 'in the future'.`,correct:!1}]},{q:`The trash ___ every day next week. 🗑️`,a:[{text:`will be collected`,correct:!0,explanation:`Bị động TLĐ. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`will collect`,explanation:`Sai. Chủ ngữ 'The trash' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'will collect'.`,correct:!1},{text:`will be collect`,explanation:`Sai. V3 của 'collect' là 'collected'; sau 'will be' không dùng nguyên thể 'collect'.`,correct:!1},{text:`collects`,explanation:`Sai. 'collects' là hiện tại đơn chủ động, không phù hợp với 'The trash' và kế hoạch tuần tới.`,correct:!1}]},{q:`Rewrite: 'They will visit the museum tomorrow.' 🏛️`,a:[{text:`The museum will be visited tomorrow.`,correct:!0,explanation:`Chuyển tân ngữ 'The museum' lên làm chủ ngữ, động từ chuyển thành 'will be visited'.`},{text:`The museum will visit tomorrow.`,explanation:`Sai. Ngữ cảnh câu mang nghĩa bị động, không dùng phương án chủ động 'The museum will visit tomorrow.'.`,correct:!1},{text:`The museum is visited tomorrow.`,explanation:`Sai. 'is visited' là hiện tại đơn bị động; câu gốc dùng 'will visit tomorrow' nên phải giữ trợ động từ 'will'.`,correct:!1},{text:`The museum will be visit tomorrow.`,explanation:`Sai. Sau 'will be' cần V3 'visited', không dùng nguyên thể 'visit'.`,correct:!1}]},{q:`Rewrite: 'She will buy a new dress.' 👗`,a:[{text:`A new dress will be bought by her.`,correct:!0,explanation:`V3 của 'buy' là 'bought'. Chủ ngữ 'She'
