ously by the mechanic for two hours, and the repair is still in progress. 🚗`,a:[{text:`has been being repaired`,correct:!0,explanation:`Nhấn mạnh quá trình sửa chữa kéo dài liên tục.`},{text:`have been being repaired`,explanation:`Sai. Phương án 'have been being repaired' không hòa hợp về ngôi và số với chủ ngữ 'My car'.`,correct:!1},{text:`is being repaired`,explanation:`Sai thì: 'for two hours' cần hiện tại hoàn thành tiếp diễn bị động, không chỉ hiện tại tiếp diễn.`,correct:!1},{text:`has been repaired`,explanation:`Sai. Dấu hiệu 'by the mechanic for two hours' không phù hợp với thì/cấu trúc của phương án 'has been repaired'.`,correct:!1}]},{q:`The cake ___ by Mom in the kitchen for an hour, and the decorating is still in progress. 🎂`,a:[{text:`has been being decorated`,correct:!0,explanation:`'The cake' số ít; bánh đang được trang trí suốt một giờ, dùng 'has been being decorated'.`},{text:`has being decorated`,explanation:`Sai. Dấu hiệu 'by Mom in the kitchen for an hour' không phù hợp với thì/cấu trúc của phương án 'has being decorated'.`,correct:!1},{text:`have been being decorated`,explanation:`Sai. Phương án 'have been being decorated' không hòa hợp về ngôi và số với chủ ngữ 'The cake'.`,correct:!1},{text:`was decorated`,explanation:`Sai thì: 'for an hour' không nêu mốc quá khứ đã kết thúc; cần 'has been being decorated'.`,correct:!1}]},{q:`Those difficult problems ___ continuously by the genius student all day, and the solving is still in progress. 🧠`,a:[{text:`have been being solved`,correct:!0,explanation:`'Those difficult problems' số nhiều đã được giải suốt cả ngày; dùng 'have been being solved'.`},{text:`has been being solved`,explanation:`Sai. Phương án 'has been being solved' không hòa hợp về ngôi và số với chủ ngữ 'Those difficult problems'.`,correct:!1},{text:`have been solved`,explanation:`Thiếu 'being': câu nhấn mạnh quá trình cả ngày, nên phải là 'have been being solved'.`,correct:!1},{text:`are being solved`,explanation:`Sai thì: 'all day' yêu og' số ít đang được bác sĩ kiểm tra suốt một giờ; dùng 'has been being examined'.`},{text:`have been being examined`,explanation:`Sai. Phương án 'have been being examined' không hòa hợp về ngôi và số với chủ ngữ 'My lovely dog'.`,correct:!1},{text:`has been examined`,explanation:`Thiếu 'being': 'for an hour' yêu cầu 'has been being examined'.`,correct:!1},{text:`was examined`,explanation:`Sai thì: thời lượng 'for an hour' nối với hiện tại, không dùng quá khứ đơn bị động.`,correct:!1}]},{q:`These letters ___ continuously by the secretary all afternoon, and typing is still in progress. ✉️`,a:[{text:`have been being typed`,correct:!0,explanation:`'These letters' số nhiều đã được thư ký đánh máy cả buổi chiều; dùng 'have been being typed'.`},{text:`has been being typed`,explanation:`Sai. Phương án 'has been being typed' không hòa hợp về ngôi và số với chủ ngữ 'These letters'.`,correct:!1},{text:`have been typed`,explanation:`Thiếu 'being': 'all afternoon' nhấn mạnh quá trình, cần 'have been being typed'.`,correct:!1},{text:`are typing`,explanation:`Sai. Chủ ngữ 'These letters' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'are typing'.`,correct:!1}]},{q:`The project ___ by the students for two weeks, and the work is still in progress. 📊`,a:[{text:`has been being done`,correct:!0,explanation:`Do -> Done (Vp2). Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`has been being do`,explanation:`Sai. V3 của 'do' là 'done'; dự án cần 'has been being done'.`,correct:!1},{text:`have been being done`,explanation:`Sai. Phương án 'have been being done' không hòa hợp về ngôi và số với chủ ngữ 'The project'.`,correct:!1},{text:`is being done`,explanation:`Sai thì: 'for two weeks' yêu cầu hiện tại hoàn thành tiếp diễn bị động.`,correct:!1}]},{q:`The road ___ by the workers for several days, and the repair work is still in progress. 🚧`,a:[{text:`has been being repaired`,correct:!0,explanation:`Con đường số ít đã được công nhân sửa trong n
