const fullQuestionBank=[{q:`English ___ all over the world.`,a:[{text:`is spoken`,correct:!0,explanation:`Hiện tại đơn bị động: am/is/are + V3/ed.`},{text:`was spoken`,explanation:`Sai. Phương án 'was spoken' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`is speaking`,explanation:`Đây là thể chủ động.`,correct:!1},{text:`spoke`,explanation:`Đây là thì quá khứ đơn.`,correct:!1}]},{q:`This house ___ by my grandfather in 1960.`,a:[{text:`was built`,correct:!0,explanation:`Quá khứ đơn bị động: was/were + V3/ed.`},{text:`is built`,explanation:`Sai. Dấu hiệu 'by my grandfather in 1960' không phù hợp với thì/cấu trúc của phương án 'is built'.`,correct:!1},{text:`built`,explanation:`Thiếu động từ to be.`,correct:!1},{text:`was build`,explanation:`Sai cột động từ (build -> built).`,correct:!1}]},{q:`A new bridge ___ across the river next year.`,a:[{text:`will be built`,correct:!0,explanation:`Tương lai đơn bị động: will be + V3/ed.`},{text:`is built`,explanation:`Sai. Dấu hiệu 'next year' không phù hợp với thì/cấu trúc của phương án 'is built'.`,correct:!1},{text:`will built`,explanation:`Thiếu 'be'. Cách dùng phù hợp trong câu này là “will be built”.`,correct:!1},{text:`be built`,explanation:`Thiếu 'will'. Cách dùng phù hợp trong câu này là “will be built”.`,correct:!1}]},{q:`The dinner ___ at the moment.`,a:[{text:`is being prepared`,correct:!0,explanation:`Hiện tại tiếp diễn bị động: am/is/are + being + V3/ed.`},{text:`is preparing`,explanation:`Đây là thể chủ động.`,correct:!1},{text:`was being prepared`,explanation:`Sai. Phương án 'was being prepared' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`has been prepared`,explanation:`Sai thì (hiện tại hoàn thành).`,correct:!1}]},{q:`The car ___ when I arrived.`,a:[{text:`was being repaired`,correct:!0,explanation:`Quá khứ tiếp diễn bị động: was/were + being + V3/ed.`},{text:`is being repaired`,explanation:`Sai. Phương án 'is being repaired' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`was repaired`,explanation:`Chỉ sự việc đã xong, không phải đang diễn ra.`,correct:!1},{text:`had been repaired`,explanation:`Quá khứ hoàn thành. Cách dùng phù hợp trong câu này là “was being repaired”.`,correct:!1}]},{q:`Use the Past Perfect Passive: all the tickets ___ before we arrived.`,a:[{text:`had been sold`,correct:!0,explanation:`Quá khứ hoàn thành bị động: had been + V3/ed (xảy ra trước 1 hành động quá khứ khác).`},{text:`were sold`,explanation:`Chưa nhấn mạnh việc xảy ra trước.`,correct:!1},{text:`have been sold`,explanation:`Sai thì (hiện tại hoàn thành).`,correct:!1},{text:`was sold`,explanation:`Sai số lượng (tickets số nhiều).`,correct:!1}]},{q:`The reports ___ by the students right now.`,a:[{text:`are being written`,correct:!0,explanation:`Hiện tại tiếp diễn bị động số nhiều: are being + V3/ed.`},{text:`is being written`,explanation:`Sai số lượng (reports số nhiều).`,correct:!1},{text:`are writing`,explanation:`Đây là thể chủ động.`,correct:!1},{text:`were being written`,explanation:`Sai. Dấu hiệu 'by the students right now' không phù hợp với thì/cấu trúc của phương án 'were being written'.`,correct:!1}]},{q:`The room ___ every day.`,a:[{text:`is cleaned`,correct:!0,explanation:`Hiện tại đơn bị động diễn tả thói quen/sự thật.`},{text:`are cleaned`,explanation:`Sai. Phương án 'are cleaned' không hòa hợp về ngôi và số với chủ ngữ 'The room'.`,correct:!1},{text:`clean`,explanation:`Thiếu to be và V3. Cách dùng phù hợp trong câu này là “is cleaned”.`,correct:!1},{text:`is cleaning`,explanation:`Nghĩa chủ động (cái phòng đang lau).`,correct:!1}]},{q:`The mail ___ every morning at 8 AM.`,a:[{text:`is delivered`,correct:!0,explanation:`Hiện tại đơn bị động cho lịch trình lặp lại.`},{text:`was delivered`,explanation:`Sai. Dấu hiệu hoặc ngữ cảnh trong câu ở hiện tại, không dùng thì Quá khứ.`,correct:!1},{text:`are delivered`,explanation:`The mail là danh từ không đếm được/số ít.`,correct:!1},{text:`delivers`,explanation:`Chủ động; thư là đối tượng được giao mỗi sáng, nên cần 'is delivered'.`,correct:!1}]},{q:`A lot of rice ___ in Vietnam.`,a:[{text:`is grown`,correct:!0,explanation:`Hiện tại đơn bị động (sự thật hiển nhiên).`},{text:`are grown`,explanation:`Rice là danh từ không đếm được.`,correct:!1},{text:`is grow`,explanation:`Sai dạng động từ (V3 là grown).`,correct:!1},{text:`was grown`,explanation:`Quá khứ (không phù hợp thực tế hiện tại).`,correct:!1}]},{q:`The window ___ by the ball yesterday.`,a:[{text:`was broken`,correct:!0,explanation:`Quá khứ đơn bị động.`},{text:`is broken`,explanation:`Sai. Dấu hiệu 'by the ball yesterday' không phù hợp với thì/cấu trúc của phương án 'is broken'.`,correct:!1},{text:`broke`,explanation:`Chủ động (Cái cửa sổ tự làm gãy).`,correct:!1},{text:`were broken`,explanation:`Window số ít. Cách dùng phù hợp trong câu này là “was broken”.`,correct:!1}]},{q:`These trees ___ by the gardeners last week.`,a:[{text:`were planted`,correct:!0,explanation:`Quá khứ đơn bị động số nhiều.`},{text:`was planted`,explanation:`Trees là số nhiều. Cách dùng phù hợp trong câu này là “were planted”.`,correct:!1},{text:`are planted`,explanation:`Sai. Dấu hiệu 'by the gardeners last week' không phù hợp với thì/cấu trúc của phương án 'are planted'.`,correct:!1},{text:`planted`,explanation:`Thiếu trợ động từ; cây được người làm vườn trồng tuần trước, nên cần 'were planted'.`,correct:!1}]},{q:`A new hospital ___ in this area soon.`,a:[{text:`will be opened`,correct:!0,explanation:`Tương lai đơn bị động.`},{text:`is opened`,explanation:`Hiện tại (không khớp 'soon').`,correct:!1},{text:`will opened`,explanation:`Thiếu 'be'. Cách dùng phù hợp trong câu này là “will be opened”.`,correct:!1},{text:`is going to opened`,explanation:`Thiếu 'be' sau to. Cách dùng phù hợp trong câu này là “will be opened”.`,correct:!1}]},{q:`Your homework ___ by tomorrow.`,a:[{text:`will be finished`,correct:!0,explanation:`Tương lai đơn bị động.`},{text:`is finished`,explanation:`Hiện tại. Cách dùng phù hợp trong câu này là “will be finished”.`,correct:!1},{text:`was finished`,explanation:`Quá khứ. Cách dùng phù hợp trong câu này là “will be finished”.`,correct:!1},{text:`be finished`,explanation:`Thiếu trợ động từ. Cách dùng phù hợp trong câu này là “will be finished”.`,correct:!1}]},{q:`Look! The old wall ___ down.`,a:[{text:`is being pulled`,correct:!0,explanation:`Hiện tại tiếp diễn bị động (hành động đang thấy trước mắt).`},{text:`was being pulled`,explanation:`Quá khứ tiếp diễn. Cách dùng phù hợp trong câu này là “is being pulled”.`,correct:!1},{text:`is pulling`,explanation:`Chủ động (bức tường đang kéo cái gì đó).`,correct:!1},{text:`has been pulled`,explanation:`Hiện tại hoàn thành (đã xong rồi).`,correct:!1}]},{q:`Listen! A song ___ by the choir.`,a:[{text:`is being sung`,correct:!0,explanation:`Hiện tại tiếp diễn bị động (sing -> sang -> sung).`},{text:`is being sang`,explanation:`Sai V3 (sang là V2).`,correct:!1},{text:`is singing`,explanation:`Chủ động; bài hát là đối tượng đang được hợp xướng hát, nên cần 'is being sung'.`,correct:!1},{text:`was being sung`,explanation:`Quá khứ. Cách dùng phù hợp trong câu này là “is being sung”.`,correct:!1}]},{q:`The light ___ when I was sleeping.`,a:[{text:`was being turned off`,correct:!0,explanation:`Hành động đang diễn ra bị động trong quá khứ.`},{text:`is being turned off`,explanation:`Hiện tại. Cách dùng phù hợp trong câu này là “was being turned off”.`,correct:!1},{text:`was turned off`,explanation:`Nhấn mạnh kết thúc, không phải quá trình.`,correct:!1},{text:`turned off`,explanation:`Thiếu trợ động từ; đèn được tắt khi tôi đang ngủ, nên cần 'was turned off'.`,correct:!1}]},{q:`The cakes ___ while we were talking.`,a:[{text:`were being eaten`,correct:!0,explanation:`Quá khứ tiếp diễn bị động (số nhiều).`},{text:`was being eaten`,explanation:`Cakes là số nhiều. Cách dùng phù hợp trong câu này là “were being eaten”.`,correct:!1},{text:`were eating`,explanation:`Chủ động (bánh đang ăn).`,correct:!1},{text:`are being eaten`,explanation:`Hiện tại tiếp diễn. Cách dùng phù hợp trong câu này là “were being eaten”.`,correct:!1}]},{q:`Many books ___ by that author so far.`,a:[{text:`have been written`,correct:!0,explanation:`Hiện tại hoàn thành bị động (so far - cho đến nay).`},{text:`has been written`,explanation:`Books số nhiều dùng have.`,correct:!1},{text:`were written`,explanation:`Quá khứ đơn (không khớp 'so far').`,correct:!1},{text:`are written`,explanation:`Sai thì: 'so far' chỉ kết quả đến hiện tại, cần hiện tại hoàn thành bị động 'have been written'.`,correct:!1}]},{q:`The thief ___ by the police yet.`,a:[{text:`hasn't been caught`,correct:!0,explanation:`Hiện tại hoàn thành bị động (phủ định, dấu hiệu 'yet').`},{text:`haven't been caught`,explanation:`Thief số ít dùng has.`,correct:!1},{text:`wasn't caught`,explanation:`Quá khứ đơn. Cách dùng phù hợp trong câu này là “hasn't been caught”.`,correct:!1},{text:`isn't caught`,explanation:`Sai thì: 'yet' yêu cầu hiện tại hoàn thành bị động 'hasn't been caught'.`,correct:!1}]},{q:`Use the Past Perfect Passive: by the time we got there, the fire ___.`,a:[{text:`had been put out`,correct:!0,explanation:`Quá khứ hoàn thành bị động (xảy ra trước hành động 'got').`},{text:`was put out`,explanation:`Quá khứ đơn. Cách dùng phù hợp trong câu này là “had been put out”.`,correct:!1},{text:`has been put out`,explanation:`Hiện tại hoàn thành.`,correct:!1},{text:`had put out`,explanation:`Sai thể: 'had put out' là chủ động; chủ ngữ 'the fire' phải nhận hành động nên cần bị động 'had been put out'.`,correct:!1}]},{q:`Use the Past Perfect Passive: the grass ___ before it started to rain.`,a:[{text:`had been cut`,correct:!0,explanation:`Quá khứ hoàn thành bị động.`},{text:`was cut`,explanation:`Quá khứ đơn. Cách dùng phù hợp trong câu này là “had been cut”.`,correct:!1},{text:`has been cut`,explanation:`Hiện tại hoàn thành.`,correct:!1},{text:`is cut`,explanation:`Sai thì: hành động xảy ra trước khi trời mưa nên cần quá khứ hoàn thành bị động.`,correct:!1}]},{q:`They ___ to the party next Sunday.`,a:[{text:`are going to be invited`,correct:!0,explanation:`Tương lai gần bị động: be going to be + V3.`},{text:`is going to be invited`,explanation:`They đi với are. Cách dùng phù hợp trong câu này là “are going to be invited”.`,correct:!1},{text:`were going to be invited`,explanation:`Quá khứ. Cách dùng phù hợp trong câu này là “are going to be invited”.`,correct:!1},{text:`are going to invite`,explanation:`Sai thể: 'are going to invite' là chủ động, trong khi 'they' là người được mời; cần 'are going to be invited'.`,correct:!1}]},{q:`That old building ___ tomorrow.`,a:[{text:`is going to be demolished`,correct:!0,explanation:`Tương lai gần bị động.`},{text:`are going to be demolished`,explanation:`Building số ít. Cách dùng phù hợp trong câu này là “is going to be demolished”.`,correct:!1},{text:`was going to be demolished`,explanation:`Quá khứ. Cách dùng phù hợp trong câu này là “is going to be demolished”.`,correct:!1},{text:`will demolished`,explanation:`Thiếu 'be'. Cách dùng phù hợp trong câu này là “is going to be demolished”.`,correct:!1}]},{q:`The flowers ___ every evening.`,a:[{text:`are watered`,correct:!0,explanation:`Hiện tại đơn bị động số nhiều.`},{text:`is watered`,explanation:`Flowers số nhiều. Cách dùng phù hợp trong câu này là “are watered”.`,correct:!1},{text:`watered`,explanation:`Quá khứ đơn. Cách dùng phù hợp trong câu này là “are watered”.`,correct:!1},{text:`are watering`,explanation:`Sai thể: 'are watering' nghĩa là các bông hoa đang tưới thứ khác; câu cần bị động 'are watered'.`,correct:!1}]},{q:`This problem ___ by the teacher yesterday.`,a:[{text:`was explained`,correct:!0,explanation:`Quá khứ đơn bị động.`},{text:`is explained`,explanation:`Sai thì: mốc 'yesterday' yêu cầu quá khứ đơn bị động 'was explained'.`,correct:!1},{text:`explained`,explanation:`Thiếu trợ động từ bị động 'was'; với 'yesterday' cần 'was explained'.`,correct:!
