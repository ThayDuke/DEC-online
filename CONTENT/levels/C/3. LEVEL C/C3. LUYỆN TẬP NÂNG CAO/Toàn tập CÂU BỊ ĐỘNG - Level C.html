const fullQuestionBank=[{q:`English ___ all over the world.`,a:[{text:`is spoken`,correct:!0,explanation:`Hiện tại đơn bị động: am/is/are + V3/ed.`},{text:`was spoken`,explanation:`Sai. Phương án 'was spoken' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`is speaking`,explanation:`Đây là thể chủ động.`,correct:!1},{text:`spoke`,explanation:`Đây là thì quá khứ đơn.`,correct:!1}]},{q:`This house ___ by my grandfather in 1960.`,a:[{text:`was built`,correct:!0,explanation:`Quá khứ đơn bị động: was/were + V3/ed.`},{text:`is built`,explanation:`Sai. Dấu hiệu 'by my grandfather in 1960' không phù hợp với thì/cấu trúc của phương án 'is built'.`,correct:!1},{text:`built`,explanation:`Thiếu động từ to be.`,correct:!1},{text:`was build`,explanation:`Sai cột động từ (build -> built).`,correct:!1}]},{q:`A new bridge ___ across the river next year.`,a:[{text:`will be built`,correct:!0,explanation:`Tương lai đơn bị động: will be + V3/ed.`},{text:`is built`,explanation:`Sai. Dấu hiệu 'next year' không phù hợp với thì/cấu trúc của phương án 'is built'.`,correct:!1},{text:`will built`,explanation:`Thiếu 'be'. Cách dùng phù hợp trong câu này là “will be built”.`,correct:!1},{text:`be built`,explanation:`Thiếu 'will'. Cách dùng phù hợp trong câu này là “will be built”.`,correct:!1}]},{q:`The dinner ___ at the moment.`,a:[{text:`is being prepared`,correct:!0,explanation:`Hiện tại tiếp diễn bị động: am/is/are + being + V3/ed.`},{text:`is preparing`,explanation:`Đây là thể chủ động.`,correct:!1},{text:`was being prepared`,explanation:`Sai. Phương án 'was being prepared' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`has been prepared`,explanation:`Sai thì (hiện tại hoàn thành).`,correct:!1}]},{q:`The car ___ when I arrived.`,a:[{text:`was being repaired`,correct:!0,explanation:`Quá khứ tiếp diễn bị động: was/were + being + V3/ed.`},{text:`is being repaired`,explanation:`Sai. Phương án 'is being repaired' chia sa
