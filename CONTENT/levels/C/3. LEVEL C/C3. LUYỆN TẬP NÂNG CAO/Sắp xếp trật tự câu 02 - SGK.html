const fullQuestionBank=[{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about generative artificial intelligence in education:
(a) Generative artificial intelligence tools are reshaping instructional methodologies in high school classrooms.
(b) When integrated ethically, these adaptive models can generate tailored practice exercises for individual learners.
(c) However, excessive reliance on AI summaries risks eroding students' independent critical reasoning skills.
(d) Therefore, educators must establish clear pedagogical boundaries regarding authentic academic writing.
(e) In conclusion, AI should serve as an intellectual catalyst rather than an automated cognitive shortcut.`,a:[{text:`a - b - c - d - e`,correct:!0,explanation:`Thứ tự lập luận: (a) câu chủ đề về AI tạo sinh làm thay đổi phương pháp dạy học -> (b) lợi ích cụ thể khi tích hợp đúng cách tạo bài tập cá nhân hóa -> (c) mặt đối lập 'However' nguy cơ làm xói mòn tư duy phản biện độc lập -> (d) giải pháp 'Therefore' giáo viên đặt ranh giới học vụ -> (e) kết luận 'In conclusion' coi AI là chất xúc tác trí tuệ.`},{text:`b - a - c - d - e`,correct:!1,explanation:`Sai: Đưa mặt lợi ích (b) lên đầu trước khi giới thiệu bức tranh toàn cảnh về sự xuất hiện của AI tạo sinh trong lớp học (a).`},{text:`a - c - b - d - e`,correct:!1,explanation:`Sai: Đưa rủi ro (c) lên trước khi trình bày mặt tích cực (b), làm mất tính cân bằng và tiến trình biện chứng của đoạn văn.`},{text:`a - b - d - c - e`,correct:!1,explanation:`Sai: Đổi chỗ giải pháp sư phạm (d) với nguy cơ (c), khiến giải pháp xuất hiện trước khi người đọc biết vấn đề là gì.`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about social media recommendation algorithms:
(a) Modern social networking platforms employ sophisticated machine learning algorithms to maximize user watch time.
(b) By analyzing clicks and scrolling speed, these engines continuously curate hyper-personalized content streams.
(c) Consequently, users frequently find themselves trapped inside insular digital echo chambers.
(d) To mitigate this polarization, platform architects should introduce algorithmic serendipity into user feeds.
(e) In summary, transparent algorithmic curation is vital for sustaining healthy civic discourse online.`,a:[{text:`a - b - c - d - e`,correct:!0,explanation:`Thứ tự logic: (a) câu chủ đề về thuật toán đề xuất giữ chân người dùng -> (b) cách thức phân tích hành vi cuộn lướt để phân phối nội dung cá nhân hóa -> (c) hệ quả tiêu cực 'Consequently' tạo ra buồng vang thông tin cô lập -> (d) giải pháp đưa tính đa dạng ngẫu nhiên vào newsfeed -> (e) kết luận 'In summary' về tính minh bạch thuật toán.`},{text:`b - a - c - d - e`,correct:!1,explanation:`Sai: Mô tả chi tiết kỹ thuật phân tích cú nhấp chuột (b) đi trước câu chủ đề giới thiệu vai trò của các thuật toán mạng xã hội (a).`},{text:`a - c - b - d - e`,correct:!1,explanation:`Sai: Nêu hệ quả buồng vang (c) trước khi giải thích cơ chế phân phối nội dung của nền tảng (b).`},{text:`a - b - d - c - e`,correct:!1,explanation:`Sai: Đưa giải pháp của các kiến trúc sư nền tảng (d) ra trước khi chỉ rõ hệ quả phân cực tư tưởng (c).`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about smartphone blue light and sleep hygiene:
(a) Emitted short-wavelength blue light from illuminated screens suppresses the brain's nocturnal release of melatonin.
(b) Nighttime smartphone usage has become a pervasive impediment to adolescent circadian sleep rhythms.
(c) Consequently, teenagers experience delayed sleep onset and severe morning cognitive fatigue.
(d) Sleep specialists strongly urge adolescents to establish a screen-free buffer hour before bedtime.
(e) Ultimately, protecting uninterrupted sleep architecture is paramount for adolescent neurological health.`,a:[{text:`b - a - c - d - e`,correct:!0,explanation:`Thứ tự nhân quả: (b) câu chủ đề về thói quen lướt điện thoại ban đêm phá vỡ nhịp sinh học của thanh thiếu niên -> (a) cơ chế sinh học ánh sáng xanh ức chế hormone melatonin -> (c) hệ quả 'Consequently' khó ngủ và mệt mỏi nhận thức buổi sáng -> (d) khuyến nghị chuyên gia về giờ đệm không màn hình trước khi ngủ -> (e) kết luận 'Ultimately'.`},{text:`a - b - c - d - e`,correct:!1,explanation:`Sai: Câu (a) giải thích cơ chế vi mô, câu (b) mang tính bao quát hiện tượng xã hội cần đứng đầu mở đoạn.`},{text:`b - c - a - d - e`,correct:!1,explanation:`Sai: Nêu hậu quả mệt mỏi nhận thức (c) trước khi chỉ rõ nguyên nhân sinh học ức chế tiết melatonin (a).`},{text:`b - a - d - c - e`,correct:!1,explanation:`Sai: Lời khuyên của chuyên gia giấc ngủ (d) xuất hiện trước khi nêu rõ các triệu chứng thiếu ngủ (c).`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about facial recognition surveillance and privacy:
(a) High-definition public security cameras increasingly utilize biometric facial recognition scanning software.
(b) While this infrastructure accelerates criminal apprehension, it simultaneously threatens civil privacy rights.
(c) Innocent citizens are subjected to perpetual identification without explicit prior consent.
(d) Therefore, comprehensive legislative frameworks are imperative to prevent authoritarian biometric overreach.
(e) In conclusion, public safety imperatives must never completely eclipse fundamental constitutional liberties.`,a:[{text:`a - b - c - d - e`,correct:!0,explanation:`Thứ tự biện luận: (a) thực trạng camera an ninh tích hợp nhận diện khuôn mặt sinh trắc học -> (b) hai mặt của vấn đề vừa giúp bắt tội phạm vừa đe dọa quyền riêng tư -> (c) chi tiết hóa sự xâm phạm khi công dân bị định danh liên tục không có sự đồng ý -> (d) kiến nghị khung pháp lý bảo vệ -> (e) kết luận 'In conclusion' cân bằng an ninh và tự do.`},{text:`b - a - c - d - e`,correct:!1,explanation:`Sai: Nêu mâu thuẫn giữa an ninh và riêng tư (b) trước khi giới thiệu công nghệ camera sinh trắc học đang triển khai (a).`},{text:`a - c - b - d - e`,correct:!1,explanation:`Sai: Mô tả tình trạng công dân bị theo dõi (c) trước khi đặt vấn đề hai mặt đối lập của công nghệ (b).`},{text:`a - b - d - c - e`,correct:!1,explanation:`Sai: Đưa ra kiến nghị ban hành luật (d) trước khi phân tích cụ thể nguy cơ xâm phạm tự do công dân (c).`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about deepfake synthetic media:
(a) Deep learning generative adversarial networks can now generate hyper-realistic synthetic video forgeries.
(b) These sophisticated deepfakes can convincingly simulate public figures delivering fabricated statements.
(c) Consequently, bad actors exploit this deception to manipulate political elections and financial markets.
(d) Forensic researchers are developing cryptographic watermarking and biological blink detectors to expose frauds.
(e) In conclusion, combating synthetic deception demands continuous technological innovation and media literacy.`,a:[{text:`a - b - c - d - e`,correct:!0,explanation:`Thứ tự cấu trúc: (a) công nghệ GAN tạo video giả mạo siêu thực -> (b) khả năng mô phỏng nhân vật công chúng nói phát ngôn bịa đặt -> (c) hệ quả 'Consequently' bị kẻ xấu lợi dụng thao túng bầu cử và tài chính -> (d) giải pháp nghiên cứu chữ ký số và phát hiện chớp mắt sinh học -> (e) kết luận 'In conclusion'.`},{text:`b - a - c - d - e`,correct:!1,explanation:`Sai: Mô tả nhân vật công chúng bị làm giả (b) trước khi giới thiệu nguồn gốc công nghệ mạng sinh đối kháng GAN (a).`},{text:`a - c - b - d - e`,correct:!1,explanation:`Sai: Nêu hệ quả thao túng bầu cử (c) trước khi làm rõ khả năng ngụy tạo phát ngôn của công nghệ deepfake (b).`},{text:`a - b - d - c - e`,correct:!1,explanation:`Sai: Đưa các công cụ giám định kỹ thuật số (d) lên trước khi trình bày nguy cơ thao túng xã hội của tin giả (c).`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about digital footprint management:
(a) Every online query, social reaction, and location ping permanently contributes to an individual's digital footprint.
(b) Prospective university admissions boards and corporate recruiters routinely audit candidates' public online dossiers.

(e) In conclusion, peer tutoring builds a symbiotic academic culture where knowledge is generously shared.`,a:[{text:`a - b - c - d - e`,correct:!0,explanation:`Thứ tự lợi ích đôi bên: (a) mạng lưới bạn giúp bạn cho phép học sinh giỏi khóa trên kèm cặp học sinh khóa dưới -> (b) do cùng góc nhìn và ngôn ngữ lứa tuổi các khái niệm toán lý trở nên bớt đáng sợ -> (c) người dạy củng cố kiến thức sâu sắc hơn qua việc giảng giải -> (d) các buổi học nhóm nâng cao điểm số và tình đoàn kết -> (e) kết luận 'In conclusion'.`},{text:`b - a - c - d - e`,correct:!1,explanation:`Sai: Giải thích sự đồng điệu về ngôn ngữ giữa học sinh (b) trước câu chủ đề giới thiệu mô hình mạng lưới gia sư đồng đẳng (a).`},{text:`a - c - b - d - e`,correct:!1,explanation:`Sai: Nói về việc người dạy củng cố kiến thức (c) trước khi nêu cảm xúc thoải mái của người được kèm cặp (b).`},{text:`a - b - d - c - e`,correct:!1,explanation:`Sai: Nêu kết quả điểm số tăng cao (d) trước khi phân tích cơ chế học hỏi lẫn nhau của hai bạn học (b)-(c).`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about financial literacy for teenagers:

(e) In summary, early financial education empowers young people to achieve lasting economic independence.`,a:[{text:`a - b - c - d - e`,correct:!0,explanation:`Thứ tự giáo dục tài chính: (a) quản lý tài chính là kỹ năng sống thiết yếu thường bị thiếu trong chương trình phổ thông -> (b) học sinh nên rèn thói quen ghi chép chi tiêu bằng bảng tính -> (c) hiểu về lãi suất kép khuyến khích tiết kiệm thay vì mua sắm bốc đồng -> (d) thực hành sớm giúp tránh bẫy nợ nần khi trưởng thành -> (e) kết luận 'In summary'.`},{text:`b - a - c - d - e`,correct:!1,explanation:`Sai: Khuyên học sinh dùng bảng tính ghi chép chi tiêu (b) trước câu chủ đề giới thiệu tầm quan trọng của giáo dục tài chính (a).`},{text:`a - c - b - d - e`,correct:!1,explanation:`Sai: Giải thích khái niệm lãi suất kép (c) trước khi hướng dẫn ghi chép kiểm soát chi tiêu hàng ngày (b).`},{text:`a - b - d - c - e`,correct:!1,explanation:`Sai: Cảnh báo bẫy nợ nần của tuổi trưởng thành (d) trước khi dạy các nguyên tắc tiết kiệm và chi tiêu hợp lý (b)-(c).`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about community first-aid certification for youths:

(d) With these vital competencies, adolescents can stabilize injured casualties during critical minutes before ambulances arrive.
(e) Ultimately, community first-aid preparedness turns ordinary high schoolers into capable emergency first responders.`,a:[{text:`a - b - c - d - e`,correct:!0,explanation:`Thứ tự sơ cứu: (a) tình huống y tế khẩn cấp có thể xảy ra bất ngờ tại sân trường hoặc đường phố -> (b) tham gia khóa học sơ cứu trang bị cho thanh thiếu niên kỹ năng cứu người -> (c) học viên thực hành hồi sức tim phổi CPR và máy sốc tim ngoài tự động AED -> (d) kỹ năng này giúp ổn định nạn nhân trong những phút vàng chờ xe cấp cứu -> (e) kết luận 'Ultimately'.`},{text:`b - a - c - d - e`,correct:!1,explanation:`Sai: Kể việc tham gia khóa tập huấn sơ cấp cứu (b) trước khi nêu bối cảnh tai nạn bất ngờ có thể xảy ra bất cứ đâu (a).`},{text:`a - c - b - d - e`,correct:!1,explanation:`Sai: Mô tả kỹ thuật hô hấp nhân tạo CPR (c) trước khi giới thiệu khóa đào tạo kỹ năng sơ cấp cứu chung (b).`},{text:`a - b - d - c - e`,correct:!1,explanation:`Sai: Nói về việc duy trì sự sống cho nạn nhân chờ cứu thương (d) trước khi học viên nắm vững thao tác ép tim và máy AED (c).`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about Model United Nations (MUN) conferences:

(e) In conclusion, MUN conferences hone analytical geopolitical awareness and global leadership capabilities.`,a:[{text:`a - b - c - d - e`,correct:!0,explanation:`Thứ tự ngoại giao: (a) hội nghị Mô phỏng Liên Hợp Quốc MUN đưa học sinh vào ngoại giao đa phương quốc tế -> (b) đại biểu đại diện cho một quốc gia yêu cầu nghiên cứu kỹ chính sách đối ngoại -> (c) trong các phiên thảo luận học sinh thương lượng dự thảo nghị quyết về biến đổi khí hậu và hạt nhân -> (d) xây dựng đồng thuận đòi hỏi thuyết phục, lắng nghe và nhượng bộ -> (e) kết luận 'In conclusion'.`},{text:`b - a - c - d - e`,correct:!1,explanation:`Sai: Nói về việc nhận quốc gia đại diện (b) trước câu chủ đề giới thiệu hội nghị mô phỏng Liên Hợp Quốc MUN (a).`},{text:`a - c - b - d - e`,correct:!1,explanation:`Sai: Mô tả việc đàm phán nghị quyết (c) trước khi đại biểu tìm hiểu kỹ lập trường ngoại giao của nước mình (b).`},{text:`a - b - d - c - e`,correct:!1,explanation:`Sai: Nói về nghệ thuật lắng nghe và nhượng bộ (d) trước khi các bên bước vào phiên tranh luận dự thảo nghị quyết (c).`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about vocational apprenticeship pathways:

(e) In summary, vocational apprenticeships provide a pragmatic, highly rewarding career launchpad for enterprising youths.`,a:[{text:`a - b - c - d - e`,correct:!0,explanation:`Thứ tự định hướng nghề nghiệp: (a) đại học 4 năm chỉ là một trong nhiều hướng đi sau phổ thông -> (b) học nghề kỹ thuật hiện đại kết hợp lý thuyết với thực hành có lương dưới sự chỉ dẫn của chuyên gia -> (c) học viên học các nghề có nhu cầu cao như điện mặt trời, cơ khí chính xác và cơ điện tử -> (d) tốt nghiệp có việc làm thu nhập cao không mang gánh nặng nợ học phí -> (e) kết luận 'In summary'.`},{text:`b - a - c - d - e`,correct:!1,explanation:`Sai: Mô tả chương trình học nghề có lương (b) trước câu chủ đề gợi mở các lựa chọn bên cạnh việc vào đại học truyền thống (a).`},{text:`a - c - b - d - e`,correct:!1,explanation:`Sai: Kể tên các ngành năng lượng và cơ điện tử (c) trước khi giải thích mô hình kết hợp học và làm thực tế (b).`},{text:`a - b - d - c - e`,correct:!1,explanation:`Sai: Khẳng định ra trường có lương cao không nợ nần (d) trước khi liệt kê các ngành nghề kỹ thuật mà học viên được đào tạo (c).`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about high school mental health awareness campaigns:

(c) Daily workshops taught grounding mindfulness routines, stress-journaling, and healthy digital boundary setting.
(d) Furthermore, the campus counseling office reported a notable increase in proactive, confidential student consultations.
(e) In conclusion, normalizing discussions around mental well-being creates a compassionate, supportive school climate.`,a:[{text:`a - b - c - d - e`,correct:!0,explanation:`Thứ tự hỗ trợ học đường: (a) áp lực học tập và xã hội thường gây kiệt sức tâm lý cho thanh thiếu niên -> (b) đại sứ sức khỏe học đường tổ chức tuần lễ nâng cao nhận thức để xóa bỏ định kiến -> (c) hội thảo dạy chánh niệm, viết nhật ký xả stress và đặt ranh giới số -> (d) phòng tư vấn tâm lý ghi nhận số lượng học sinh chủ động đến tư vấn tăng rõ rệt -> (e) kết luận 'In conclusion'.`},{text:`b - a - c - d - e`,correct:!1,explanation:`Sai: Kể việc tổ chức tuần lễ sức khỏe tâm thần (b) trước khi nêu bối cảnh áp lực học tập gây kiệt sức cho học sinh (a).`},{text:`a - c - b - d - e`,correct:!1,explanation:`Sai: Mô tả các buổi hội thảo viết nhật ký xả stress (c) trước khi giới thiệu sự kiện tuần lễ nhận thức học đường (b).`},{text:`a - b - d - c - e`,correct:!1,explanation:`Sai: Nêu số liệu học sinh đến phòng tư vấn (d) trước khi các buổi hội thảo trang bị kỹ năng chăm sóc tinh thần diễn ra (c).`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about student startup pitch competitions:

(b) Teams conduct market customer interviews to identify community problems and prototype functional solutions.
(c) During the final pitch showcase, student founders present their financial models to panels of venture investors.
(d) Winning initiatives receive seed funding grants alongside ongoing executive mentorship to launch enterprises.
(e) Ultimately, startup competitions cultivate innovative ingenuity and resilience in the next generation of business leaders.`,a:[{text:`a - b - c - d - e`,correct:!0,explanation:`Thứ tự khởi nghiệp: (a) vườn ươm khởi nghiệp thanh thiếu niên thách thức các đội phát triển doanh nghiệp xã hội -> (b) phỏng vấn khách hàng tìm vấn đề cộng đồng và làm mẫu thử nghiệm giải pháp -> (c) tại chung kết thuyết trình mô hình tài chính trước các nhà đầu tư mạo hiểm -> (d) dự án thắng cuộc nhận vốn hạt giống và cố vấn điều hành -> (e) kết luận 'Ultimately'.`},{text:`b - a - c - d - e`,correct:!1,explanation:`Sai: Mô tả việc phỏng vấn khách hàng (b) trước câu chủ đề giới thiệu cuộc thi vườn ươm khởi nghiệp trẻ (a).`},{text:`a - c - b - d - e`,correct:!1,explanation:`Sai: Kể việc thuyết trình trước nhà đầu tư (c) trước khi các đội hoàn thiện bản mẫu sản phẩm thử nghiệm (b).`},{text:`a - b - d - c - e`,correct:!1,explanation:`Sai: Nói về việc trao vốn hạt giống (d) trước khi các nhà sáng lập trẻ trình bày trước ban giám khảo (c).`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about high school internship experiences:

(c) Exposure to professional workplace dynamics sharpens punctuality, business correspondence, and collaborative adaptability.

(e) In conclusion, experiential internships provide invaluable vocational clarity for ambitious secondary students.`,a:[{text:`a - b - c - d - e`,correct:!0,explanation:`Thứ tự trải nghiệm: (a) thực tập mùa hè kết nối kiến thức sách vở với thực tế môi trường doanh nghiệp -> (b) thực tập sinh theo học các chuyên gia kỳ cựu và hỗ trợ dự án khách hàng -> (c) tiếp xúc môi trường công sở rèn luyện tính đúng giờ, viết email và làm việc nhóm -> (d) trải nghiệm thực tế giúp xác định đam mê trước khi chọn ngành đại học -> (e) kết luận 'In conclusion'.`},{text:`b - a - c - d - e`,correct:!1,explanation:`Sai: Kể việc theo học các chuyên gia kỳ cựu (b) trước câu chủ đề về giá trị kết nối thực tập mùa hè (a).`},{text:`a - c - b - d - e`,correct:!1,explanation:`Sai: Nêu việc rèn luyện tính đúng giờ và viết email (c) trước khi nói đến các công việc dự án cụ thể (b).`},{text:`a - b - d - c - e`,correct:!1,explanation:`Sai: Khẳng định học sinh tự tin chọn ngành đại học (d) trước khi họ trực tiếp trải nghiệm môi trường văn phòng (c).`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about time management with the Eisenhower Matrix:

(e) In summary, mastering matrix prioritization prevents chronic academic procrastination and cognitive burnout.`,a:[{text:`a - b - c - d - e`,correct:!0,explanation:`Thứ tự phương pháp: (a) quản lý bài tập nhiều môn cùng hoạt động ngoại khóa đòi hỏi sắp xếp ưu tiên kỷ luật -> (b) ma trận Eisenhower chia công việc thành 4 góc phần tư dựa trên tính khẩn cấp và quan trọng -> (c) việc quan trọng nhưng không khẩn cấp như ôn thi dài hạn được lên lịch trước -> (d) việc khẩn cấp nhưng không quan trọng được ủy quyền hoặc giảm bớt -> (e) kết luận 'In summary'.`},{text:`b - a - c - d - e`,correct:!1,explanation:`Sai: Giới thiệu ma trận Eisenhower (b) trước câu chủ đề về thách thức quản lý thời gian của học sinh (a).`},{text:`a - c - b - d - e`,correct:!1,explanation:`Sai: Mô tả góc việc quan trọng không khẩn cấp (c) trước khi giới thiệu cấu trúc phân chia 4 góc phần tư của ma trận (b).`},{text:`a - b - d - c - e`,correct:!1,explanation:`Sai: Xử lý các việc chen ngang khẩn cấp nhưng không quan trọng (d) trước khi lập kế hoạch cho các mục tiêu trọng tâm (c).`}]},{q:`Choose the correct arrangement of sentences to make a meaningful paragraph about constructive conflict resolution in student teams:
