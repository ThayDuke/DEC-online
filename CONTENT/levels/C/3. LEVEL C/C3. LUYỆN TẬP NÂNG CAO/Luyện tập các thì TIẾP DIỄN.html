const fullQuestionBank=[{q:`Look! The children ___ in the garden now. ⚽`,a:[{text:`are playing`,correct:!0,explanation:`Thì Hiện tại tiếp diễn (T4) dùng để diễn tả hành động đang xảy ra tại thời điểm nói, có từ khóa 'Look!' và 'now'. Cấu trúc: S + am/is/are + V-ing.`},{text:`play`,explanation:`'Gets' là hiện tại đơn ngôi thứ ba; dấu hiệu 'these days' diễn tả xu hướng đang thay đổi nên cần 'is getting'.`,correct:!1},{text:`played`,explanation:`Sai. Đây là thì Quá khứ đơn (T2).`,correct:!1},{text:`is playing`,explanation:`Sai. Chủ ngữ 'The children' (số nhiều) phải dùng 'are'.`,correct:!1}]},{q:`She ___ dinner at the moment. 🍲`,a:[{text:`is cooking`,correct:!0,explanation:`Thì Hiện tại tiếp diễn (T4) dùng với từ khóa 'at the moment'. Chủ ngữ 'She' (số ít) dùng 'is'.`},{text:`cooks`,explanation:`'Get' thiếu trợ động từ 'is' cho thì hiện tại tiếp diễn; câu đúng là 'is getting'.`,correct:!1},{text:`cooked`,explanation:`Sai. Đây là thì Quá khứ đơn (T2).`,correct:!1},{text:`are cooking`,explanation:`Sai. Chủ ngữ 'She' (số ít) phải dùng 'is'.`,correct:!1}]},{q:`They ___ for the exam right now. 📚`,a:[{text:`are not studying`,correct:!0,explanation:`Câu phủ định thì Hiện tại tiếp diễn (T4), có từ khóa 'right now'. Cấu trúc: S + am/is/are + not + V-ing. Chủ ngữ 'They' dùng 'are'.`},{text:`don't study`,explanation:`Sai. Gets là hiện tại đơn, không diễn tả sự thay đổi đang diễn ra these days.`,correct:!1},{text:`are studying`,explanation:`Sai. Thiếu 'not'. Cách dùng phù hợp trong câu này là “are not studying”.`,correct:!1},{text:`isn't studying`,explanation:`Sai. Chủ ngữ 'They' phải dùng 'are'.`,correct:!1}]},{q:`___ you ___ to me? 👂`,a:[{text:`Are / listening`,correct:!0,explanation:`Câu hỏi thì Hiện tại tiếp diễn (T4). Cấu trúc: Am/Is/Are + S + V-ing? Chủ ngữ 'you' dùng 'Are'.`},{text:`Do / listen`,explanation:`Sai. Đây là câu hỏi thì Hiện tại đơn (T1).`,correct:!1},{text:`Is / listening`,explanation:`Sai. Chủ ngữ 'you' phải dùng 'Are'.`,correct:!1},{text:`Are / listen`,explanation:`Sai. Động từ chính phải thêm '-ing'.`,correct:!1}]},{q:`I ___ for the bus at the station right now. 🚌`,a:[{text:`am waiting`,correct:!0,explanation:`Thì Hiện tại tiếp diễn (T4) diễn tả hành động đang xảy ra. Chủ ngữ 'I' dùng 'am'.`},{text:`wait`,explanation:`Sai. Get thiếu trợ động từ và không phù hợp với chủ ngữ weather.`,correct:!1},{text:`waiting`,explanation:`Sai. Thiếu trợ động từ 'am'.`,correct:!1},{text:`is waiting`,explanation:`Sai. Chủ ngữ 'I' phải dùng 'am'.`,correct:!1}]},{q:`My sister ___ a fascinating novel this week. 📖`,a:[{text:`is reading`,correct:!0,explanation:`Thì Hiện tại tiếp diễn (T4) dùng cho hành động tạm thời, xảy ra xung quanh thời điểm nói, có từ khóa 'this week'.`},{text:`reads`,explanation:`Sai. Đây là thì Hiện tại đơn (T1).`,correct:!1},{text:`read`,explanation:`Sai. Đây là thì Quá khứ đơn (T2).`,correct:!1},{text:`are reading`,explanation:`Sai. Chủ ngữ 'My sister' (số ít) phải dùng 'is'.`,correct:!1}]},{q:`What ___ he ___ now? He ___ a picture. 🖍️`,a:[{text:`is / doing / is drawing`,correct:!0,explanation:`Cả hai vế đều chia thì Hiện tại tiếp diễn (T4) với chủ ngữ số ít 'he' và 'He', có từ khóa 'now'.`},{text:`does / do / draws`,explanation:`Sai. Đây là thì Hiện tại đơn (T1).`,correct:!1},{text:`is / do / is drawing`,explanation:`Sai. Động từ chính trong câu hỏi phải thêm '-ing'.`,correct:!1},{text:`is / doing / drawing`,explanation:`Sai. Vế sau thiếu trợ động từ 'is'.`,correct:!1}]},{q:`Why ___ you ___? The joke is not that funny. 😂`,a:[{text:`are / laughing`,correct:!0,explanation:`Thì Hiện tại tiếp diễn (T4), diễn tả hành động đang xảy ra. Chủ ngữ 'you' dùng 'are'.`},{text:`do / laugh`,explanation:`Sai. Đây là thì Hiện tại đơn (T1).`,correct:!1},{text:`is / laughing`,explanation:`Sai. Chủ ngữ 'you' phải dùng 'are'.`,correct:!1},{text:`are / laugh`,explanation:`Sai. Động từ chính phải thêm '-ing'.`,correct:!1}]},{q:`Be quiet! The baby ___ in the next room. 🤫`,a:[{text:`is sleeping`,correct:!0,explanation:`Thì Hiện tại tiếp diễn (T4) dùng với từ khóa 'Be quiet!'.`},{text:`sleeps`,explanation:`Sai. Đây là thì Hiện tại đơn (T1).`,correct:!1},{text:`are sleeping`,explanation:`Sai. Chủ ngữ 'The baby' (số ít) phải dùng 'is'.`,correct:!1},{text:`slept`,explanation:`Sai. Đây là thì Quá khứ đơn (T2).`,correct:!1}]},{q:`We have booked the flights; we ___ our next vacation this month. ✈️`,a:[{text:`are planning`,correct:!0,explanation:`Thì Hiện tại tiếp diễn (T4) dùng cho hành động tạm thời, có từ khóa 'this month'.`},{text:`plan`,explanation:`Sai. Đây là thì Hiện tại đơn (T1).`,correct:!1},{text:`is planning`,explanation:`Sai. Chủ ngữ 'We' (số nhiều) phải dùng 'are'.`,correct:!1},{text:`planned`,explanation:`Sai. Đây là thì Quá khứ đơn (T2).`,correct:!1}]},{q:`The weather ___ colder these days. 🥶`,a:[{text:`is getting`,correct:!0,explanation:`Thì Hiện tại tiếp diễn (T4) diễn tả sự thay đổi/phát triển, có từ khóa 'these days'.`},{text:`gets`,explanation:`Sai. Gets là hiện tại đơn, không diễn tả sự thay đổi đang diễn ra these days.`,correct:!1},{text:`are getting`,explanation:`Sai. Chủ ngữ 'The weather' (số ít) phải dùng 'is'.`,correct:!1},{text:`get`,explanation:`Sai. Get thiếu trợ động từ và không phù hợp với chủ ngữ weather.`,correct:!1}]},{q:`My parents ___ always ___ about the noise, and it is driving me crazy these days. 😠`,a:[{text:`are / complaining`,correct:!0,explanation:`Thì Hiện tại tiếp diễn (T4) kết hợp với 'always' diễn tả sự phàn nàn, khó chịu.`},{text:`do / complain`,explanation:`Sai. Đây là thì Hiện tại đơn (T1).`,correct:!1},{text:`is / complaining`,explanation:`Sai. Chủ ngữ 'My parents' (số nhiều) phải dùng 'are'.`,correct:!1},{text:`complain`,explanation:`Sai. Thiếu trợ động từ và không nhấn mạnh sự phàn nàn.`,correct:!1}]},{q:`Hurry up! Everyone ___ for you. ⏳`,a:[{text:`is waiting`,correct:!0,explanation:`Thì Hiện tại tiếp diễn (T4) với 'Hurry up!'. Chủ ngữ 'Everyone' (luôn là số ít) dùng 'is'.`},{text:`are waiting`,explanation:`Sai. Phương án 'are waiting' không hòa hợp chủ vị với chủ ngữ trong câu.`,correct:!1},{text:`wait`,explanation:`Sai. Từ vựng hoặc dạng từ 'wait' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`waits`,explanation:`Sai. Từ vựng hoặc dạng từ 'waits' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`I ___ a coat because it's hot today. 👕`,a:[{text:`am not wearing`,correct:!0,explanation:`Hiện tại tiếp diễn (T4). Chủ ngữ 'I' dùng 'am'.`},{text:`don't wear`,explanation:`Sai. Từ vựng hoặc dạng từ 'don't wear' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`is not wearing`,explanation:`Sai. Cấu trúc 'is not wearing' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`not wearing`,explanation:`Sai. Từ vựng hoặc dạng từ 'not wearing' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`They ___ a new school in our neighborhood this month; the construction is happening right now. 🏗️`,a:[{text:`are building`,correct:!0,explanation:`Hiện tại tiếp diễn (T4) diễn tả hành động đang xảy ra xung quanh thời điểm nói.`},{text:`build`,explanation:`Sai. Từ vựng hoặc dạng từ 'build' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`is building`,explanation:`Sai. Từ vựng hoặc dạng từ 'is building' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`built`,explanation:`Sai. Từ vựng hoặc dạng từ 'built' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Look! A strange man ___ us. 🚶`,a:[{text:`is following`,correct:!0,explanation:`Hiện tại tiếp diễn (T4) với 'Look!'. Chủ ngữ 'A strange man' (số ít) dùng 'is'.`},{text:`follows`,explanation:`Sai. Từ vựng hoặc dạng từ 'follows' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`are following`,explanation:`Sai. Từ vựng hoặc dạng từ 'are following' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`followed`,explanation:`Sai. Từ vựng hoặc dạng từ 'followed' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`We have already booked a table; using the present continuous for this fixed arrangement, we ___ lunch together at noon tomorrow. 🍽️`,a:[{text:`are having`,correct:!0,explanation:`Hiện tại tiếp diễn (T4) dùng để diễn tả một kế hoạch đã được sắp xếp trong tương lai ('tomorrow').`},{text:`have`,explanation:`Sai. 'have' là động từ/trợ động từ dùng cho số nhiều hoặc I/you, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`will have`,explanation:`Sai. Tương lai đơn kém chắc chắn hơn.`,correct:!1},{text:`are going to have`,explanation:`Sai. Tương lai gần dùng cho dự định, không phải kế hoạch chắc chắn.`,correct:!1}]},{q:`For our booked trip tonight, what time ___ the bus ___? ⏱️`,a:[{text:`is / leaving`,correct:!0,explanation:`Hiện tại tiếp diễn (T4) dùng cho kế hoạch đã sắp xếp.`},{text:`does / leave`,explanation:`Sai. Dùng cho lịch trình cố định.`,correct:!1},{text:`is / leave`,explanation:`Sai. Cấu trúc 'is / leave' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`do / leave`,explanation:`Sai. Cấu trúc 'do / leave' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`The kids ___ too much noise right now! 📢`,a:[{text:`are making`,correct:!0,explanation:`Hiện tại tiếp diễn (T4), có 'right now'. Chủ ngữ 'The kids' (số nhiều) dùng 'are'.`},{text:`is making`,explanation:`Sai. Từ vựng hoặc dạng từ 'is making' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`make`,explanation:`Sai. Từ vựng hoặc dạng từ 'make' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`made`,explanation:`Sai. Từ vựng hoặc dạng từ 'made' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`You ___ your keys! It is happening again today and it is so annoying. 🔑`,a:[{text:`are always losing`,correct:!0,explanation:`Hiện tại tiếp diễn (T4) với 'always' diễn
