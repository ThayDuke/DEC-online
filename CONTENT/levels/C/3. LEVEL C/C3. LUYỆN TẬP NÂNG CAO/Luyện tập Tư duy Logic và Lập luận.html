B: A library card fits easily in your wallet.`,a:[{text:`Argument A`,correct:!0,explanation:`A nêu bật giá trị kiến thức vô tận mà thẻ thư viện mang lại.`},{text:`Argument B`,explanation:`B chỉ nói về kích thước vật lý, không có giá trị lập luận.`},{text:`Both are equal`,explanation:`A nêu quyền truy cập vào tài nguyên cụ thể; B chỉ nói về sự tiện lợi vật lý của chiếc thẻ.`},{text:`Neither is valid`,explanation:`A là lý do chính khiến thư viện công cộng tồn tại.`}]},{q:`Using evidence quality, specificity, relevance, and the number of concrete reasons, which paragraph is more persuasive?
A: It allows the body to repair tissues and the brain to process information.
B: You won't get in trouble for being grumpy in the morning.`,a:[{text:`Argument A`,correct:!0,explanation:`A giải thích các chức năng sinh học thiết yếu trong khi ngủ.`},{text:`Argument B`,explanation:`B nói về hậu quả hành vi, không quan trọng bằng cơ chế sinh học.`},{text:`Both are equal`,explanation:`A nêu hai chức năng sinh học cụ thể; B chỉ dựa trên việc tránh một phản ứng xã hội vào buổi sáng.`},{text:`Neither is valid`,explanation:`A là lập luận y khoa chuẩn xác về giấc ngủ.`}]},{q:`Using evidence quality, specificity, relevance, and the number of concrete reasons, which paragraph is more persuasive?
A: Parks provide green space for recreation and improve air quality in cities.
B: Parks are places where you can see many dogs.`,a:[{text:`Argument A`,correct:!0,explanation:`A nêu rõ vai trò sinh thái và xã hội của công viên.`},{text:`Argument B`,explanation:`B chỉ là một chi tiết phụ, không phải mục đích chính của công viên.`},{text:`Both are strong`,explanation:`A nêu hai chức năng quy hoạch cụ thể; B chỉ nêu một khả năng quan sát ngẫu nhiên trong công viên.`},{text:`Neither is valid`,explanation:`A là lý do hàng đầu cho việc duy trì công viên đô thị.`}]},{q:`Using evidence quality, specificity, relevance, and the number of concrete reasons, which paragraph is more persuasive?
A: Sunscreen prevents skin damage and reduces the risk of skin cancer.
B: Sunscreen smells like summer and vacation.`,a:[{text:`Argument B`,explanation:`B là cảm nhận cá nhân, không liên quan đến bảo vệ sức khỏe.`},{text:`Argument A`,correct:!0,explanation:`A nêu rõ tác dụng phòng ngừa bệnh lý nghiêm trọng.`},{text:`Both are equal`,explanation:`A gắn kem chống nắng với hai kết quả sức khỏe cụ thể; B chỉ mô tả mùi hương.`},{text:`Neither is valid`,explanation:`A là lý do khoa học duy nhất để sử dụng kem chống nắng.`}]},{q:`Using evidence quality, specificity, relevance, and the number of concrete reasons, which paragraph is more persuasive?
A: Cooking at home is healthier and allows you to control ingredients.
B: Cooking makes the house smell like a restaurant.`,a:[{text:`Argument A`,correct:!0,explanation:`A tập trung vào sức khỏe và sự chủ động trong dinh dưỡng.`},{text:`Argument B`,explanation:`B chỉ nói về mùi hương, không phải lợi ích thực chất.`},{text:`Both are equal`,explanation:`A nêu sức khỏe và quyền kiểm soát nguyên liệu; B chỉ nêu một trải nghiệm về mùi hương.`},{text:`Neither is valid`,explanation:`A là kỹ năng sống quan trọng vì lý do sức khỏe.`}]},{q:`Using evidence quality, specificity, relevance, and the number of concrete reasons, which paragraph is more persuasive?
A: Sharing builds friendships and teaches empathy to children.
B: If you share, your parents will give you a reward.`,a:[{text:`Argument A`,correct:!0,explanation:`A tập trung vào sự phát triển cảm xúc và mối quan hệ xã hội.`},{text:`Argument B`,explanation:`B dựa trên sự trao đổi vật chất, không giúp hình thành tính cách.`},{text:`Both are equal`,explanation:`A nêu hai tác động xã hội dài hạn; B chỉ gắn việc chia sẻ với phần thưởng từ cha mẹ.`},{text:`Neither is valid`,explanation:`A là lập luận giáo dục hành vi chuẩn mực.`}]},{q:`Identify the logical flaw: 'Everyone in my class has an iPhone, so it must be the best phone.'`,a:[{text:`Bandwagon Fallacy`,correct:!0,explanation:`Lỗi này cho rằng điều gì đó là đúng/tốt chỉ vì nhiều người tin theo.`},{text:`Personal Attack`,explanation:`Đây không phải là tấn công cá nhân, mà là dựa vào số đông.`},{text:`False Cause`,explanation:`Lỗi này không nói về nguyên nhân kết quả sai lệch.`},{text:`No flaw`,explanation:`Đây là một lỗi lập luận vì số đông không quyết định chất lượng kỹ thuật.`}]},{q:`Identify the logical flaw: 'My grandfather smoked his whole life and lived to be 90, so smoking isn't bad.'`,a:[{text:`Hasty Generalization`,correct:!0,explanation:`Lấy một ví dụ cá biệt để kết luận cho cả một tập thể/vấn đề lớn.`},{text:`Circular Reasoning`,explanation:`Không phải lập luận vòng quanh, mà là thiếu mẫu thử đủ lớn.`},{text:`Slippery Slope`,explanation:`Không có sự suy diễn quá mức về hậu quả dây chuyền ở đây.`},{text:`False Dilemma`,explanation:`Không đưa ra hai lựa chọn sai lệch.`}]},{q:`Identify the logical flaw: 'If we let students use tablets in class, they will eventually stop reading books entirely.'`,a:[{text:`Slippery Slope`,correct:!0,explanation:`Giả định rằng một hành động nhỏ sẽ dẫn đến một hậu quả cực đoan mà không có bằng chứng.`},{text:`Bandwagon Fallacy`,explanation:`Không đề cập đến việc mọi người đều làm điều đó.`},{text:`Ad Hominem`,explanation:`Không tấn công cá nhân ai cả.`},{text:`Circular Reasoning`,explanation:`Đây là lỗi suy diễn quá mức về tương lai.`}]},{q:`Identify the logical flaw: 'You should listen to my advice because I am older than you.'`,a:[{text:`Appeal to Authority`,correct:!0,explanation:`Cho rằng ai đó luôn đúng chỉ vì vị thế hoặc tuổi tác thay vì nội dung lập luận.`},{text:`False Cause`,explanation:`Tuổi tác không phải là nguyên nhân trực tiếp làm cho lời khuyên đúng.`},{text:`Hasty Generalization`,explanation:`Không phải kết luận từ mẫu thử nhỏ, mà dựa vào uy thế.`},{text:`Straw Man`,explanation:`Không bóp méo ý kiến của người khác.`}]},{q:`Identify the logical flaw: 'The movie is great because it is very good.'`,a:[{text:`Circular Reasoning`,correct:!0,explanation:`Lập luận vòng quanh: kết luận chỉ lặp lại tiền đề bằng cách dùng từ khác.`},{text:`False Dilemma`,explanation:`Không đưa ra sự lựa chọn hạn hẹp.`},{text:`Bandwagon`,explanation:`Không nói về số đông.`},{text:`Ad Hominem`,explanation:`Không tấn công người khác.`}]},{q:`Identify the logical flaw: 'Either you support this new school rule, or you don't care about our safety.'`,a:[{text:`False Dilemma`,correct:!0,explanation:`Ép người khác vào chỉ hai lựa chọn cực đoan trong khi thực tế có nhiều lựa chọn khác.`},{text:`Slippery Slope`,explanation:`Không nói về hậu quả dây chuyền.`},{text:`Hasty Generalization`,explanation:`Không phải lỗi khái quát hóa.`},{text:`Circular Reasoning`,explanation:`Đây là lỗi nhị phân giả tạo.`}]},{q:`Identify the logical flaw: 'I wore my lucky socks and we won the game; therefore, the socks caused the win.'`,a:[{text:`False Cause`,correct:!0,explanation:`Giả định rằng vì sự kiện A xảy ra trước B nên A là nguyên nhân của B.`},{text:`Bandwagon`,explanation:`Không liên quan đến số đông.`},{text:`Appeal to Emotion`,explanation:`Dù có chút cảm xúc nhưng lỗi chính là sai lệch nguyên nhân.`},{text:`No flaw`,explanation:`Đây là mê tín, một dạng lỗi logic về nguyên nhân.`}]},{q:`Identify the logical flaw: 'Why should I listen to your health advice? You eat chocolate every day!'`,a:[{text:`Ad Hominem (Personal Attack)`,correct:!0,explanation:`Tấn công đặc điểm cá nhân của người nói thay vì phản bác lập luận của họ.`},{text:`False Cause`,explanation:`Không nói về nguyên nhân kết quả.`},{text:`Slippery Slope`,explanation:`Không suy diễn hậu quả xa vời.`},{text:`Circular Reasoning`,explanation:`Đây là lỗi công kích cá nhân.`}]},{q:`Identify the logical flaw: 'Drinking soda is like putting poison in your body.'`,a:[{text:`False Analogy`,correct:!0,explanation:`So sánh hai thứ không thực sự tương đồng để tạo ra ấn tượng sai lệch.`},{text:`Bandwagon`,explanation:`Không dựa vào số đông.`},{text:`Hasty Generalization`,explanation:`Không phải kết luận từ mẫu thử.`},{text:`Circular Reasoning`,explanation:`Đây là so sánh khập khiễng.`}]},{q:`Identify the logical flaw: 'My opponent says we should spend more on schools. He clearly wants to raise everyone's taxes to 100%!'`,a:[{text:`Straw Man`,correct:!0,explanation:`Bóp méo lập luận của người khác thành một dạng cực đoan để dễ dàng tấn công.`},{text:`False Dilemma`,explanation:`Không ép chọn giữa hai thứ.`},{text:`Ad Hominem`,explanation:`Đây là bóp méo ý kiến, không phải tấn công cá nhân trực tiếp.`},{text:`Appeal to Fear`,explanation:`Dù có gây sợ hãi nhưng lỗi kỹ thuật là bóp méo ý tưởng (Straw Man).`}]},{q:`Identify the logical flaw: 'I've always done it this way, so it must be the right way.'`,a:[{text:`Appeal to Tradition`,correct:!0,explanation:`Cho rằng một việc là đúng chỉ vì nó đã được thực hiện từ lâu.`},{text:`Bandwagon`,explanation:`Không dựa vào số đông hiện tại mà dựa vào quá khứ.`},{text:`False Cause`,explanation:`Không nói về nguyên nhân kết quả.`},{text:`No flaw`,explanation:`Truyền thống không đảm bảo tính đúng đắn logic.`}]},{q:`Identify the logical flaw: 'If you don't go to university, you will be a failure in life.'`,a:[{text:`False Dilemma`,correct:!0,explanation:`Đưa ra một cái nhìn quá đơn giản và cực đoan về thành công.`},{text:`Bandwagon Fallacy`,explanation:`Không dựa vào việc nhiều người cùng tin hay làm một điều.`},{text:`Circular Reasoning`,explanation:`Không lặp lại tiền đề để chứng minh kết luận.`},{text:`Appeal to Authority`,explanation:`Không viện dẫn người có thẩm quyền thay cho bằng chứng.`}]},{q:`Identify the logical flaw: 'The weather is getting warmer. People are buying more ice cream. Therefore, ice cream causes global warming.'`,a:[{text:`Correlation vs Causation`,correct:!0,explanation:`Hai việc xảy ra cùng lúc không có nghĩa là cái này gây ra cái kia.`},{text:`Hasty Generalization`,explanation:`Không phải mẫu thử nhỏ.`},{text:`Bandwagon`,explanation:`Không phải lỗi số đông.`},{text:`False Analogy`,explanation:`Đây là lỗi nhầm lẫn giữa tương quan và nhân quả.`}]},{q:`Identify the logical flaw: 'You are either with us, or against us.'`,a:[{text:`False Dilemma`,correct:!0,explanation:`Loại bỏ mọi khả năng trung lập hoặc lựa chọn khác.`},{text:`Ad Hominem`,explanation:`Không tấn công cá nhân cụ thể.`},{text:`Straw Man`,explanation:`Không bóp méo ý kiến.`},{text:`Circular Reasoning`,explanation:`Đây là lỗi chia rẽ cực đoan.`}]},{q:`Identify the logical flaw: 'Dogs are better than cats because they are superior animals.'`,a:[{text:`Circular Reasoning`,correct:!0,explanation:`Dùng từ đồng nghĩa ('superior') để giải thích cho khẳng định ban đầu mà không có bằng chứng.`},{text:`Hasty Generalization`,explanation:`Sai: câu không suy rộng từ một mẫu nhỏ sang toàn bộ nhóm; đó không phải Hasty Generalization.`},{text:`False Cause`,explanation:`Không nói về nguyên nhân.`},{text:`Appeal to Emotion`,explanation:`Đây là lỗi lập luận vòng quanh.`}]},{q:`Identify the logical flaw: 'Since no one has proven that aliens don't exist, they must exist.'`,a:[{text:`Appeal to Ignorance`,correct:!0,explanation:`Cho rằng điều gì đó đúng chỉ vì nó chưa được chứng minh là sai.`},{text:`False Dilemma`,explanation:`Không phải lỗi hai lựa chọn.`},{text:`Bandwagon`,explanation:`Không dựa vào số đông.`},{text:`Straw Man`,explanation:`Lỗi này dựa trên sự thiếu bằng chứng.`}]},{q:`Identify the logical flaw: 'My teacher is young, so she must be inexperienced and bad at teaching.'`,a:[{text:`Hasty Generalization`,correct:!0,explanation:`Đánh giá khả năng của một người chỉ dựa trên một đặc điểm (tuổi tác) mà không có bằng chứng thực tế.`},{text:`Circular Reasoning`,explanation:`Không lặp lại tiền đề.`},{text:`False Cause`,explanation:`Trẻ không gây ra việc dạy kém.`},{text:`Ad Hominem`,explanation:`Đây là định kiến dẫn đến khái quát hóa sai lầm.`}]},{q:`Identify the logical flaw: 'We should not listen to his environmental plan because he once failed a math test.'`,a:[{text:`Ad Hominem`,correct:!0,explanation:`Sử dụng một lỗi lầm không liên quan để bác bỏ lập luận chuyên môn của họ.`},{text:`Slippery Slope`,explanation:`Không nói về hậu quả kéo dài.`},{text:`Appeal to Tradition`,explanation:`Không liên quan đến quá khứ truyền thống.`},{text:`Straw Man`,explanation:`Đây là công kích cá nhân để làm lạc hướng.`}]},{q:`Identify the logical flaw: 'Buy these shoes! All the popular kids wear them.'`,a:[{text:`Bandwagon Fallacy`,correct:!0,explanation:`Sử dụng sự phổ biến làm lý do chính để mua hàng.`},{text:`False Cause`,explanation:`Không nói về nguyên nhân kết quả.`},{text:`Circular Reasoning`,explanation:`Không lặp lại tiền đề.`},{text:`False Analogy`,explanation:`Lỗi dựa vào số đông.`}]},{q:`Identify the logical flaw: 'I failed the test because the teacher doesn't like me.'`,a:[{text:`False Cause`,correct:!0,explanation:`Gán nguyên nhân thất bại cho sự không thích của giáo viên mà không có bằng chứng, thay vì xem xét sự chuẩn bị.`},{text:`Hasty Generalization`,explanation:`Không phải mẫu thử nhỏ.`},{text:`Straw Man`,explanation:`Không bóp méo ý kiến.`},{text:`Circular Reasoning`,explanation:`Không lặp lại kết luận để chứng minh chính nó.`}]},{q:`Identify the logical flaw: 'If I fail this one quiz, I will never get into a good college.'`,a:[{text:`Slippery Slope`,correct:!0,explanation:`Phóng đại hậu quả của một sự việc nhỏ thành thảm họa lớn mà không có các bước bằng chứng trung gian.`},{text:`Bandwagon`,explanation:`Không liên quan đến số đông.`},{text:`Ad Hominem`,explanation:`Sai: câu không công kích con người hay phẩm chất của người nêu ý kiến.`},{text:`Circular Reasoning`,explanation:`Không lặp lại kết luận để chứng minh chính nó.`}]},{q:`Identify the logical flaw: 'Reading is useless because my brother never reads and he has a job.'`,a:[{text:`Hasty Generalization`,correct:!0,explanation:`Dùng một ví dụ đơn lẻ để phủ nhận giá trị của một việc cho tất cả mọi người.`},{text:`False Dilemma`,explanation:`Không phải lỗi hai lựa chọn.`},{text:`Circular Reasoning`,explanation:`Không lặp lại tiền đề.`},{text:`Appeal to Authority`,explanation:`Anh trai không phải là nguồn thẩm quyền về giáo dục.`}]},{q:`Identify the logical flaw: 'For a user whose only stated criterion is the number of features, this cell phone is the best because it has the most features.'`,a:[{text:`Circular Reasoning`,explanation:`Không lặp lại kết luận; câu nêu rõ tiêu chí đánh giá là số lượng tính năng.`},{text:`Hasty Generalization`,explanation:`Không khái quát từ một mẫu nhỏ sang mọi điện thoại hoặc mọi người dùng.`},{text:`No flaw`,correct:!0,explanation:`Với tiêu chí duy nhất đã nêu là số lượng tính năng, kết luận phù hợp với bằng chứng; không có lỗi logic trong phạm vi đó.`},{text:`Ad Hominem`,explanation:`Không tấn công cá nhân hay người đưa ra ý kiến.`}]},{q:`Identify the logical flaw: 'You should support the new mall. Think of the poor children who will have no place to hang out!'`,a:[{text:`Appeal to Emotion`,correct:!0,explanation:`Sử dụng cảm xúc (thương hại) để thuyết phục thay vì lý lẽ kinh tế hay xã hội.`},{text:`Bandwagon`,explanation:`Không dựa vào số đông.`},{text:`False Cause`,explanation:`Không phải nguyên nhân kết quả.`},{text:`Straw Man`,explanation:`Dùng cảm xúc để lấn át lý trí.`}]},{q:`Identify the logical flaw: 'Ghosts are real because I feel their presence.'`,a:[{text:`Appeal to Personal Experience`,correct:!0,explanation:`Dùng trải nghiệm/cảm giác cá nhân làm bằng chứng duy nhất cho một khẳng định khách quan; cảm nhận riêng không đủ để chứng minh ma tồn tại.`},{text:`Appeal to Authority`,explanation:`Bản thân không phải là chuyên gia khoa học.`},{text:`Hasty Generalization`,explanation:`Sai: lập luận không khái quát từ một mẫu thử nhỏ; lỗi chính nằm ở việc dùng cảm giác làm bằng chứng.`},{text:`False Analogy`,explanation:`Lỗi dùng cảm xúc thay cho bằng chứng.`}]},{q:`Identify the logical flaw: 'The law is the law, so we must follow it because it is the law.'`,a:[{text:`Circular Reasoning`,correct:!0,explanation:`Lập luận vòng quanh không đưa ra lý do thực sự tại sao luật đó tồn tại.`},{text:`Bandwagon`,explanation:`Sai: lập luận không viện dẫn việc nhiều người tin hay làm điều đó, nên không phải Bandwagon.`},{text:`Straw Man`,explanation:`Không bóp méo ý kiến.`},{text:`No flaw`,explanation:`Về mặt pháp lý thì đúng, nhưng về mặt logic lập luận thì đây là lỗi vòng quanh.`}]},{q:`Identify the logical flaw: 'Eating carrots makes you better at math. I ate a carrot today and got an A.'`,a:[{text:`False Cause (Post Hoc)`,correct:!0,explanation:`Nhầm lẫn giữa sự trùng hợp ngẫu nhiên và quan hệ nhân quả.`},{text:`Ad Hominem`,explanation:`Sai: câu không chuyển sang công kích người đối thoại; nó chỉ nêu một kết luận về lựa chọn.`},{text:`Appeal to Tradition`,explanation:`Không liên quan đến quá khứ.`},{text:`Circular Reasoning`,explanation:`Lỗi nhân quả sai lệch.`}]},{q:`Identify the logical flaw: 'He is a good doctor because he drives a very expensive car.'`,a:[{text:`Non Sequitur`,correct:!0,explanation:`Sự giàu có thể hiện qua xe hơi không liên quan đến kỹ năng chuyên môn của bác sĩ.`},{text:`Appeal to Emotion`,explanation:`Không đánh vào cảm xúc.`},{text:`Bandwagon`,explanation:`Không dựa vào số đông.`},{text:`Circular Reasoning`,explanation:`Kết luận không lặp lại tiền đề.`}]},{q:`Identify the logical flaw: 'You don't like this song? You must have terrible taste in music!'`,a:[{text:`Ad Hominem`,correct:!0,explanation:`Tấn công vào gu thẩm mỹ của người khác thay vì thảo luận về bài hát.`},{text:`False Dilemma`,explanation:`Sai: câu không buộc người nghe chỉ chọn một trong hai khả năng loại trừ nhau.`},{text:`Slippery Slope`,explanation:`Không suy diễn hậu quả.`},{text:`Hasty Generalization`,explanation:`Công kích cá nhân trực diện.`}]},{q:`Identify the logical flaw: 'If we allow 5 minutes of extra break, students will eventually want the whole day off.'`,a:[{text:`Slippery Slope`,correct:!0,explanation:`Giả định một bước đi nhỏ sẽ dẫn đến một kết cục thảm họa không thể kiểm soát.`},{text:`Circular Reasoning`,explanation:`Sai: kết luận không được dùng lại chính tiền đề để tự chứng minh.`},{text:`Appeal to Authority`,explanation:`Không dựa vào chuyên gia.`},{text:`False Cause`,explanation:`Đây là lỗi suy diễn cực đoan.`}]},{q:`Which evidence best supports the claim: 'Exercise improves mental health'?`,a:[{text:`A study showing a 30% reduction in stress levels after daily walking.`,correct:!0,explanation:`Dữ liệu nghiên cứu và con số cụ thể là bằng chứng mạnh nhất.`},{text:`My friend says she feels better when she runs.`,explanation:`Ý kiến cá nhân là bằng chứng yếu.`},{text:`Exercise is recommended by many people on Instagram.`,explanation:`Mạng xã hội không phải là nguồn bằng chứng khoa học đáng tin cậy.`},{text:`I like to play football on weekends.`,explanation:`Sở thích cá nhân không chứng minh được cho cộng đồng.`}]},{q:`Claim: 'Too much sugar is bad for children.' Which is the best evidence?`,a:[{text:`Dentists report more cavities in children who consume sugary snacks daily.`,correct:!0,explanation:`Báo cáo từ chuyên gia y tế (nha sĩ) là bằng chứng thực tế và uy tín.`},{text:`Sugar is sweet and kids love it.`,explanation:`Đây là một nhận định về hương vị, không phải tác hại.`},{text:`Some parents don't buy candy.`,explanation:`Hành động của phụ huynh không chứng minh tác hại của đường.`},{text:`Candies have colorful wrappers.`,explanation:`Thông tin không liên quan đến sức khỏe.`}]},{q:`Which evidence best supports: 'Learning to play an instrument boosts brain power'?`,a:[{text:`Brain scans show increased activity in the corpus callosum in musicians.`,correct:!0,explanation:`Quét não cung cấp chỉ dấu sinh học trực tiếp liên quan đến hoạt động não của người chơi nhạc.`},{text:`Many famous people play the piano.`,explanation:`Sự nổi tiếng không chứng minh được chức năng não bộ.`},{text:`Instruments can be very expensive to buy.`,explanation:`Giá cả không liên quan đến trí tuệ.`},{text:`Music sounds very nice in the morning.`,explanation:`Cảm nhận thẩm mỹ không phải là bằng chứng cho trí thông minh.`}]},{q:`Claim: 'Dogs make great companions.' Which evidence is most logical?`,a:[{text:`Research showing that dog owners have lower blood pressure and less loneliness.`,correct:!0,explanation:`Số liệu về sức khỏe và tâm lý là bằng chứng mạnh mẽ cho sự đồng hành.`},{text:`Dogs have four legs and fur.`,explanation:`Đây là mô tả hình dáng, không liên quan đến sự đồng hành.`},{text:`I saw a dog in a movie yesterday.`,explanation:`Phim ảnh không phải là bằng chứng thực tế.`},{text:`Some dogs can bark very loudly.`,explanation:`Thông tin này không hỗ trợ cho việc làm 'bạn tốt'.`}]},{q:`Which evidence best supports: 'Public libraries are still important in the digital age'?`,a:[{text:`Library statistics show a high number of people using free internet and workshops.`,correct:!0,explanation:`Số liệu sử dụng thực tế chứng minh thư viện vẫn đang phục vụ nhu cầu hiện đại.`},{text:`Libraries are old buildings with many shelves.`,explanation:`Mô tả vật lý không chứng minh được tầm quan trọng hiện nay.`},{text:`My grandmother likes to visit the library.`,explanation:`Một ví dụ cá nhân không đủ để đại diện cho toàn xã hội.`},{text:`Books are made of paper.`,explanation:`Sự thật hiển nhiên này không liên quan đến vai trò xã hội của thư viện.`}]},{q:`Claim: 'School starts too early for teenagers.' Which is the best evidence?`,a:[{text:`Biological studies show that teenage sleep cycles shift to later times.`,correct:!0,explanation:`Nghiên cứu về nhịp ngủ vị thành niên giải thích trực tiếp vì sao giờ bắt đầu quá sớm có thể lệch với nhu cầu sinh học.`},{text:`I hate waking up at 6 AM every day.`,explanation:`Cảm xúc cá nhân không phải là bằng chứng cho chính sách giáo dục.`},{text:`Teachers also have to wake up early.`,explanation:`Đây là sự so sánh ngang hàng, không chứng minh tác hại đối với học sinh.`},{text:`The sun isn't always up when school starts.`,explanation:`Đây là hiện tượng tự nhiên, không phải bằng chứng khoa học về con người.`}]},{q:`Which evidence best supports: 'Social media can spread misinformation'?`,a:[{text:`A report showing that 60% of shared news links are not read before sharing.`,correct:!0,explanation:`Số liệu về hành vi người dùng là bằng chứng trực tiếp cho việc lan truyền tin giả.`},{text:`Social media apps are free to download.`,explanation:`Chi phí không liên quan đến tính đúng đắn của thông tin.`},{text:`I use Facebook to talk to my cousins.`,explanation:`Trải nghiệm cá nhân không chứng minh được vấn đề tin giả.`},{text:`Phones are used more than computers now.`,explanation:`Thiết bị sử dụng không liên quan đến nội dung thông tin.`}]},{q:`Claim: 'Plastic straws should be banned.' Which is the best evidence?`,a:[{text:`Environmental data showing that straws are among the top 10 items found in ocean debris.`,correct:!0,explanation:`Dữ liệu môi trường cụ thể chứng minh tác hại trực tiếp của ống hút.`},{text:`Paper straws sometimes get soggy too quickly.`,explanation:`Đây là nhược điểm của vật liệu thay thế, không phải lý do để cấm nhựa.`},{text:`Metal straws are shiny and cool.`,explanation:`Thẩm mỹ không phải là bằng chứng môi trường.`},{text:`I don't use straws when I drink water.`,explanation:`Thói quen cá nhân không đủ làm bằng chứng cho một lệnh cấm.`}]},{q:`Which evidence best supports: 'Reading fiction improves empathy'?`,a:[{text:`A study where participants score higher on 'reading the mind in the eyes' tests after reading novels.`,correct:!0,explanation:`Kết quả bài kiểm tra tâm lý là bằng chứng thực nghiệm mạnh mẽ.`},{text:`Fiction books have more pages than non-fiction.`,explanation:`Số trang không liên quan đến sự thấu cảm.`},{text:`I like Harry Potter because of the magic.`,explanation:`Sở thích cá nhân không chứng minh được tác động tâm lý.`},{text:`Libraries have a special section for fiction.`,explanation:`Cách sắp xếp thư viện không liên quan đến sự phát triển não bộ.`}]},{q:`Claim: 'Video games can be educational.' Which is the best evidence?`,a:[{text:`Games like Minecraft are used in classrooms to teach geometry and planning.`,correct:!0,explanation:`Ví dụ thực tế về ứng dụng trong giáo dục là bằng chứng thuyết phục nhất.`},{text:`Video games are more popular than movies now.`,explanation:`Sự phổ biến không đồng nghĩa với tính giáo dục.`},{text:`My mom lets me play for two hours.`,explanation:`Quy định của gia đình không chứng minh được giá trị của trò chơi.`},{text:`Graphics in games look very realistic.`,explanation:`Hình ảnh đẹp không có nghĩa là có tính giáo dục.`}]},{q:`Which evidence best supports: 'Vegetables are essential for a healthy diet'?`,a:[{text:`Nutritionists state that vegetables provide vitamins and fiber that prevent diseases.`,correct:!0,explanation:`Ý kiến từ chuyên gia dinh dưỡng và lợi ích sinh học là bằng chứng mạnh.`},{text:`Broccoli looks like small trees.`,explanation:`Mô tả hình dáng không liên quan đến dinh dưỡng.`},{text:`My dad eats a salad every night.`,explanation:`Ví dụ cá nhân không mang tính khoa học tổng quát.`},{text:`Vegetables are usually green or red.`,explanation:`Màu sắc không chứng minh được giá trị sức khỏe.`}]},{q:`Claim: 'City life is more stressful than country life.' Which is the best evidence?`,a:[{text:`Surveys showing higher levels of cortisol (stress hormone) in city residents.`,correct:!0,explanation:`Bằng chứng sinh học (hormone) là bằng chứng khách quan nhất.`},{text:`There are more tall buildings in the city.`,explanation:`Kiến trúc không trực tiếp chứng minh mức độ căng thẳng.`},{text:`I prefer visiting the countryside on weekends.`,explanation:`Sở thích cá nhân không phản ánh tình trạng chung của dân cư.`},{text:`Cities have more traffic lights.`,explanation:`Thông tin này không đủ để kết luận về stress.`}]},{q:`Which evidence best supports: 'Uniforms help save parents money'?`,a:[{text:`A cost comparison showing that a set of uniforms is cheaper than a full year's branded wardrobe.`,correct:!0,explanation:`Sự so sánh chi phí trực tiếp là bằng chứng kinh tế mạnh nhất.`},{text:`Uniforms look very professional.`,explanation:`Vẻ ngoài chuyên nghiệp không liên quan đến việc tiết kiệm tiền.`},{text:`Most students like wearing uniforms.`,explanation:`Sở thích không chứng minh được lợi ích tài chính.`},{text:`Blue is a common color for uniforms.`,explanation:`Màu sắc không liên quan đến giá cả.`}]},{q:`Claim: 'Solar power is the best energy source for the future.' Which is the best evidence?`,a:[{text:`Data showing that solar energy costs have dropped 80% and sunlight is a long-term renewable resource.`,correct:!0,explanation:`Số liệu chi phí giảm 80% và tính sẵn có lâu dài của ánh nắng cùng hỗ trợ tính khả thi, bền vững của năng lượng mặt trời.`},{text:`Solar panels look very modern on roofs.`,explanation:`Thẩm mỹ không phải là bằng chứng cho hiệu quả năng lượng.`},{text:`The sun is very hot in the summer.`,explanation:`Đây là sự thật hiển nhiên, không phải lập luận về công nghệ.`},{text:`I saw a solar car in a science fair.`,explanation:`Một ví dụ nhỏ không chứng minh được quy mô toàn cầu.`}]},{q:`Which evidence best supports: 'Learning to code is like learning a new language'?`,a:[{text:`Linguists argue that both involve syntax, grammar, and communication of complex ideas.`,correct:!0,explanation:`Sự tương đồng về cấu trúc và chức năng là bằng chứng logic nhất.`},{text:`You type both on a computer keyboard.`,explanation:`Hành động vật lý không chứng minh sự tương đồng về bản chất tư duy.`},{text:`Both can be very difficult for some people.`,explanation:`Độ khó là chủ quan và không làm rõ bản chất của hai thứ.`},{text:`There are many books about coding.`,explanation:`Sự tồn tại của sách không chứng minh được tính chất của kỹ năng.`}]},{q:`Claim: 'Sleep is as important as exercise.' Which is the best evidence?`,a:[{text:`Medical research showing that lack of sleep affects muscle recovery and heart health.`,correct:!0,explanation:`Bằng chứng y khoa về sự phục hồi cơ thể là vô cùng thuyết phục.`},{text:`I feel tired if I don't sleep well.`,explanation:`Cảm giác cá nhân là bằng chứng yếu trong thảo luận khoa học.`},{text:`Most people sleep at night.`,explanation:`Thói quen không chứng minh được tầm quan trọng sinh học.`},{text:`Beds are more comfortable than gym equipment.`,explanation:`Sự thoải mái không liên quan đến tầm quan trọng sức khỏe.`}]},{q:`Which evidence best supports: 'Online shopping is changing the economy'?`,a:[{text:`Reports showing a 20% increase in warehouse jobs and a decrease in traditional retail stores.`,correct:!0,explanation:`Sự thay đổi về cơ cấu việc làm là bằng chứng kinh tế rõ rệt.`},{text:`It is easy to click a button and buy shoes.`,explanation:`Sự tiện lợi cá nhân không phản ánh quy mô toàn nền kinh tế.`},{text:`Packages come in cardboard boxes.`,explanation:`Thông tin về bao bì không liên quan đến thay đổi kinh tế.`},{text:`I bought a shirt online last week.`,explanation:`Hành động cá nhân không phải là bằng chứng vĩ mô.`}]},{q:`Claim: 'Art education should be mandatory.' Which is the best evidence?`,a:[{text:`Studies linking art programs to higher graduation rates and improved emotional intelligence.`,correct:!0,explanation:`Nghiên cứu nối chương trình nghệ thuật với tỷ lệ tốt nghiệp và trí tuệ cảm xúc, đúng trực tiếp với lợi ích giáo dục cần chứng minh.`},{text:`Painting is a fun activity for children.`,explanation:`Sự vui vẻ không đủ để làm một môn học trở thành bắt buộc.`},{text:`Some famous painters were very rich.`,explanation:`Sự thành công của vài cá nhân không chứng minh giá trị cho tất cả học sinh.`},{text:`Art rooms have many colors and brushes.`,explanation:`Cơ sở vật chất không liên quan đến tính cần thiết của môn học.`}]},{q:`Which evidence best supports: 'Fast food leads to health problems'?`,a:[{text:`Long-term health studies tracking thousands of people linking fast food to obesity and heart disease.`,correct:!0,explanation:`Nghiên cứu dài hạn trên quy mô lớn là bằng chứng y tế mạnh nhất.`},{text:`Fast food restaurants have bright red logos.`,explanation:`Màu sắc logo không liên quan đến sức khỏe.`},{text:`The burgers taste very salty.`,explanation:`Cảm nhận vị giác không chứng minh được bệnh lý.`},{text:`There is a fast food shop near my house.`,explanation:`Vị trí địa lý không phải là bằng chứng cho tác hại sức khỏe.`}]},{q:`Claim: 'Wild animals should not be kept as pets.' Which is the best evidence?`,a:[{text:`Biologists state that wild animals have complex social and physical needs that homes cannot provide.`,correct:!0,explanation:`Bằng chứng dựa trên nhu cầu sinh học của động vật và nhận định chuyên môn, nên liên quan trực tiếp đến việc nuôi nhốt.`},{text:`Lions are very scary and can bite.`,explanation:`Sự sợ hãi là cảm xúc, không phải là lập luận khoa học về bảo tồn.`},{text:`Tigers look better in the jungle.`,explanation:`Đây là quan điểm thẩm mỹ, không phải bằng chứng thực tế.`},{text:`I don't have enough space for an elephant.`,explanation:`Lý do cá nhân không áp dụng cho tất cả mọi người.`}]},{q:`Using evidence quality, specificity, relevance, and the number of concrete reasons, which paragraph is more persuasive?
A: Schools should have gardens. They are nice. Plants grow there and it is good for nature.
B: School gardens provide hands-on biology lessons, encourage healthy eating, and improve students' mental well-being.`,a:[{text:`Paragraph B`,correct:!0,explanation:`B liệt kê các lợi ích cụ thể và đa dạng (giáo dục, sức khỏe, tinh thần).`},{text:`Paragraph A`,explanation:`A quá đơn giản và thiếu các lý do thuyết phục thực tế.`},{text:`Both are equal`,explanation:`Hai đoạn không ngang nhau: A chỉ nêu nhận xét chung, còn B đưa ra ba lợi ích cụ thể có liên quan.`},{text:`Neither is good`,explanation:`B là một đoạn văn nghị luận ngắn rất tốt.`}]},{q:`Using evidence quality, specificity, relevance, and the number of concrete reasons, which paragraph is more persuasive?
A: Plastic is bad because it stays in the ocean for 400 years and kills sea turtles who mistake it for food.
