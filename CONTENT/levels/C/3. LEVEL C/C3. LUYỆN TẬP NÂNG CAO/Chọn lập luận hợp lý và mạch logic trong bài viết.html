ass=controls><button class=btn id=prev-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class=btn id=next-btn type=button>Tiếp tục<i class="fa-solid fa-arrow-right"></i></button><button class="btn is-initially-hidden" id=submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=confirm-back-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class="btn is-initially-hidden" id=confirm-submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=reset-btn type=button>Làm lại</button></div></div><footer class=dec-footer>Bản quyền thuộc về DEC - thầy Đức tiếng Anh - 0966939583</footer></div><script>// --- DUKEGEM QUESTION BANK
const fullQuestionBank=[{q:`Chọn câu mở đoạn phù hợp nhất cho đoạn văn sau: '. Đầu tiên, việc tập thể dục giúp cơ thể dẻo dai và khỏe mạnh hơn. Ngoài ra, nó còn giúp giảm căng thẳng sau những giờ học mệt mỏi.'`,a:[{text:`Tập thể dục mang lại nhiều lợi ích quan trọng.`,correct:!0,explanation:`Câu này bao quát được hai ý: sức khỏe thể chất và tinh thần được nhắc đến trong đoạn.`},{text:`Chúng ta nên đi bộ mỗi sáng.`,explanation:`Câu này quá hẹp, chỉ nhắc đến một hình thức tập luyện cụ thể.`,correct:!1},{text:`Học sinh thường bị căng thẳng.`,explanation:`Câu này chỉ tập trung vào một vấn đề nhỏ, không phải ý chính.`,correct:!1},{text:`Thể thao là một môn học khó.`,explanation:`Câu này lệch chủ đề về lợi ích của việc tập luyện.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Đọc sách giúp mở mang kiến thức về thế giới xung quanh. Không chỉ vậy, sách còn giúp nuôi dưỡng tâm hồn và khả năng ngôn ngữ của mỗi người.'`,a:[{text:`Đọc sách là một thói quen rất có ích.`,correct:!0,explanation:`Câu này giới thiệu đúng chủ đề về lợi ích toàn diện của việc đọc sách.`},{text:`Thư viện có rất nhiều loại sách.`,explanation:`Câu này nói về địa điểm, không nói về lợi ích của hành động đọc.`,correct:!1},{text:`Sách giáo khoa rất quan trọng.`,explanation:`Câu này quá cụ thể vào một loại sách, không bao quát được ý đoạn văn.`,correct:!1},{text:`Nhiều người thích xem phim hơn đọc sách.`,explanation:`Câu này mang tính so sánh, không phù hợp làm câu mở đầu cho đoạn liệt kê lợi ích.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Bạn có thể dễ dàng tìm kiếm tài liệu học tập trên các trang web. Thêm vào đó, Internet giúp kết nối mọi người ở khắp mọi nơi thông qua mạng xã hội.'`,a:[{text:`Internet là một công cụ hỗ trợ đắc lực trong cuộc sống hiện đại.`,correct:!0,explanation:`Câu này bao quát được cả hai khía cạnh: học tập và kết nối xã hội.`},{text:`Mạng xã hội có nhiều rủi ro.`,explanation:`Câu này mang nghĩa tiêu cực, trái ngược với các ví dụ tích cực trong đoạn.`,correct:!1},{text:`Học sinh chỉ nên dùng máy tính để học.`,explanation:`Câu này mang tính khuyên bảo chủ quan, không khớp với nội dung mô tả công dụng.`,correct:!1},{text:`Cách để tìm tài liệu trên mạng.`,explanation:`Câu này chỉ là một phần nhỏ của ý chính.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Việc trồng thêm cây xanh giúp không khí trong lành hơn. Đồng thời, hạn chế sử dụng túi nilon cũng góp phần giảm lượng rác thải khó phân hủy.'`,a:[{text:`Có nhiều cách đơn giản để bảo vệ môi trường.`,correct:!0,explanation:`Câu này bao quát được cả hai hành động: trồng cây và giảm túi nilon.`},{text:`Cây xanh cung cấp oxy cho con người.`,explanation:`Ý này chỉ đúng cho một phần của đoạn văn.`,correct:!1},{text:`Túi nilon rất có hại cho sức khỏe.`,explanation:`Ý này không bao quát được phần trồng cây xanh.`,correct:!1},{text:`Môi trường đang bị ô nhiễm nặng nề.`,explanation:`Câu này nêu thực trạng, không phù hợp dẫn dắt cho các giải pháp cụ thể trong đoạn.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Buổi sáng là thời điểm tốt nhất để nạp năng lượng cho cả ngày. Một bữa ăn đủ chất giúp bạn tập trung hơn trong các tiết học đầu tiên.'`,a:[{text:`Bữa sáng đóng vai trò cực kỳ quan trọng đối với học sinh.`,correct:!0,explanation:`Câu này nêu bật được tầm quan trọng và đối tượng hướng đến.`},{text:`Học sinh thường dậy muộn.`,explanation:`Câu này không liên quan đến lợi ích của bữa ăn.`,correct:!1},{text:`Bữa trưa giúp chúng ta no bụng.`,explanation:`Sai đối tượng (bữa trưa thay vì bữa sáng).`,correct:!1},{text:`Nên ăn nhiều rau xanh.`,explanation:`Câu này nói về thành phần món ăn, không nói về vai trò của bữa sáng.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Khi làm việc cùng nhau, mỗi thành viên có thể hỗ trợ và học hỏi lẫn nhau. Nhờ đó, những công việc khó khăn sẽ được hoàn thành nhanh chóng và hiệu quả hơn.'`,a:[{text:`Làm việc nhóm mang lại hiệu quả cao trong công việc.`,correct:!0,explanation:`Câu này giới thiệu đúng chủ đề hỗ trợ và hiệu quả của làm việc nhóm.`},{text:`Mỗi người có một sở thích riêng.`,explanation:`Không liên quan đến chủ đề làm việc tập thể.`,correct:!1},{text:`Học sinh nên tự làm bài tập về nhà.`,explanation:`Ngược lại hoàn toàn với tinh thần làm việc nhóm.`,correct:!1},{text:`Cách để chọn bạn tốt.`,explanation:`Câu này nói về tình bạn, không phải kỹ năng làm việc nhóm.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Ăn nhiều rau quả giúp cung cấp vitamin cần thiết cho cơ thể. Ngoài ra, uống đủ nước mỗi ngày cũng giúp làn da khỏe mạnh và thanh lọc độc tố.'`,a:[{text:`Thói quen ăn uống lành mạnh giúp cải thiện sức khỏe.`,correct:!0,explanation:`Câu này bao quát cả việc ăn rau quả và uống nước.`},{text:`Vitamin C có nhiều trong cam.`,explanation:`Quá chi tiết, không bao quát được toàn đoạn.`,correct:!1},{text:`Nước lọc tốt hơn nước ngọt.`,explanation:`Chỉ là một so sánh nhỏ, không phải ý chính.`,correct:!1},{text:`Làn da đẹp là niềm mơ ước của nhiều người.`,explanation:`Câu này chỉ tập trung vào một lợi ích nhỏ, không bao quát sức khỏe nói chung.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Học ngoại ngữ giúp bạn tự tin giao tiếp với bạn bè quốc tế. Bên cạnh đó, nó còn mở ra nhiều cơ hội việc làm hấp dẫn trong tương lai.'`,a:[{text:`Việc học ngoại ngữ mang lại nhiều lợi thế lớn.`,correct:!0,explanation:`Câu này tóm gọn được lợi ích giao tiếp và sự nghiệp.`},{text:`Tiếng Anh là ngôn ngữ phổ biến nhất.`,explanation:`Chỉ nhắc đến một ngôn ngữ cụ thể, trong khi đoạn văn nói chung về ngoại ngữ.`,correct:!1},{text:`Du lịch nước ngoài rất thú vị.`,explanation:`Lệch chủ đề sang du lịch.`,correct:!1},{text:`Ngoại ngữ là môn học bắt buộc.`,explanation:`Nêu tính chất môn học, không nêu lợi ích.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Trẻ em có thể học được cách yêu thương và chăm sóc người khác thông qua việc nuôi thú cưng. Ngoài ra, việc chơi đùa cùng thú cưng cũng giúp giảm cảm giác cô đơn.'`,a:[{text:`Nuôi thú cưng đem lại nhiều giá trị giáo dục và tinh thần cho trẻ nhỏ.`,correct:!0,explanation:`Câu này bao quát được ý nghĩa về sự chăm sóc và niềm vui tinh thần.`},{text:`Chó là loài động vật trung thành.`,explanation:`Quá cụ thể vào một loài vật, không bao quát thú cưng nói chung.`,correct:!1},{text:`Thú cưng thường rất nghịch ngợm.`,explanation:`Mang nghĩa tiêu cực nhẹ, không khớp với lợi ích trong đoạn.`,correct:!1},{text:`Mèo dễ nuôi hơn chó.`,explanation:`Câu so sánh không phù hợp làm câu chủ đề cho đoạn liệt kê lợi ích.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Du lịch giúp chúng ta thư giãn sau những ngày làm việc căng thẳng. Hơn nữa, mỗi chuyến đi là một cơ hội để khám phá những nền văn hóa và ẩm thực mới lạ.'`,a:[{text:`Đi du lịch là cách tuyệt vời để trải nghiệm cuộc sống.`,correct:!0,explanation:`Câu này bao quát cả tính thư giãn và tính khám phá của du lịch.`},{text:`Nên đi du lịch bằng máy bay.`,explanation:`Nói về phương tiện, không phải ý chính.`,correct:!1},{text:`Du lịch trong nước rẻ hơn nước ngoài.`,explanation:`Nói về giá cả, không phù hợp nội dung đoạn.`,correct:!1},{text:`Mùa hè là thời điểm lý tưởng để đi biển.`,explanation:`Quá cụ thể về thời gian và địa điểm.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Trò chơi điện tử giúp rèn luyện khả năng phản xạ và tư duy logic. Tuy nhiên, nếu chơi quá nhiều, nó có thể gây ảnh hưởng xấu đến thị lực và kết quả học tập.'`,a:[{text:`Trò chơi điện tử có cả mặt lợi và mặt hại.`,correct:!0,explanation:`Câu này định hướng đúng cho đoạn văn có cấu trúc liệt kê ưu điểm kèm cảnh báo.`},{text:`Trò chơi điện tử rất có hại.`,explanation:`Chỉ tập trung vào mặt tiêu cực, bỏ qua phần rèn luyện tư duy.`,correct:!1},{text:`Học sinh không nên chơi game.`,explanation:`Mang tính áp đặt, không khách quan như nội dung đoạn văn.`,correct:!1},{text:`Game giúp chúng ta thông minh hơn.`,explanation:`Chỉ tập trung vào mặt tích cực, không bao quát phần cảnh báo.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Ngủ đủ giấc giúp trí não tỉnh táo và tăng cường khả năng ghi nhớ. Ngược lại, việc thức khuya thường xuyên khiến cơ thể mệt mỏi và làm giảm hiệu suất làm việc.'`,a:[{text:`Giấc ngủ có ảnh hưởng trực tiếp đến hiệu quả hoạt động của con người.`,correct:!0,explanation:`Câu này bao quát được cả tác động tích cực của ngủ đủ và tiêu cực của thức khuya.`},{text:`Không nên dùng điện thoại trước khi ngủ.`,explanation:`Một lời khuyên cụ thể, không bao quát toàn bộ cơ chế giấc ngủ.`,correct:!1},{text:`Thức khuya là thói quen của giới trẻ.`,explanation:`Nêu hiện tượng, không nêu rõ mối quan hệ giữa giấc ngủ và sức khỏe.`,correct:!1},{text:`Mơ thấy những điều thú vị khi ngủ.`,explanation:`Lệch chủ đề sang nội dung giấc mơ.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Đầu tiên, nó giúp tiết kiệm diện tích đất dùng để chôn lấp rác. Thứ hai, việc này còn giúp bảo vệ nguồn tài nguyên thiên nhiên quý giá.'`,a:[{text:`Tái chế rác thải mang lại những lợi ích thiết thực cho môi trường.`,correct:!0,explanation:`Câu này dẫn dắt tốt cho hai lợi ích về đất đai và tài nguyên môi trường.`},{text:`Rác thải nhựa đang tràn lan đại dương.`,explanation:`Nêu thực trạng ô nhiễm, không phù hợp dẫn dắt cho lợi ích tái chế.`,correct:!1},{text:`Tái chế là một công việc khó khăn.`,explanation:`Nêu tính chất công việc, không khớp nội dung lợi ích.`,correct:!1},{text:`Chúng ta nên phân loại rác tại nhà.`,explanation:`Đây là hành động cụ thể, câu chủ đề cần mang tính bao quát hơn về kết quả (tái chế).`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Bạn nên dành thời gian trò chuyện và chia sẻ những khó khăn với bạn bè. Đồng thời, sự tôn trọng và chân thành là yếu tố then chốt để giữ gìn mối quan hệ bền lâu.'`,a:[{text:`Xây dựng một tình bạn đẹp đòi hỏi sự nỗ lực từ cả hai phía.`,correct:!0,explanation:`Câu này bao quát được các hành động chia sẻ, tôn trọng và chân thành.`},{text:`Bạn bè là người chơi cùng chúng ta.`,explanation:`Định nghĩa quá đơn giản, không bao quát được phần xây dựng quan hệ.`,correct:!1},{text:`Không nên cãi nhau với bạn.`,explanation:`Quá hẹp, mang tính cấm đoán.`,correct:!1},{text:`Tìm bạn thân rất khó.`,explanation:`Nêu quan điểm cá nhân, không khớp với hướng dẫn xây dựng tình bạn trong đoạn.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Hoạt động này giúp bạn có thêm nhiều kỹ năng sống thực tế như giao tiếp và làm việc nhóm. Hơn thế nữa, giúp đỡ người khác còn mang lại niềm vui và ý nghĩa cho cộng đồng.'`,a:[{text:`Tham gia các hoạt động tình nguyện mang lại giá trị cho cá nhân và xã hội.`,correct:!0,explanation:`Câu này bao quát cả kỹ năng cá nhân và lợi ích cộng đồng.`},{text:`Tình nguyện là làm việc không công.`,explanation:`Định nghĩa mang tính kỹ thuật, không làm nổi bật giá trị như đoạn văn.`,correct:!1},{text:`Có nhiều người nghèo cần giúp đỡ.`,explanation:`Chỉ nêu đối tượng, không nêu lợi ích của việc tham gia hoạt động.`,correct:!1},{text:`Mùa hè xanh là chương trình tình nguyện lớn.`,explanation:`Quá cụ thể vào một chương trình.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Xe đạp không thải ra khói bụi gây ô nhiễm không khí. Ngoài ra, đạp xe hằng ngày còn là một cách tuyệt vời để rèn luyện sức khỏe cơ bắp.'`,a:[{text:`Sử dụng xe đạp là một lựa chọn thông minh cho cả môi trường và sức khỏe.`,correct:!0,explanation:`Câu này kết nối được hai ý chính: môi trường và sức khỏe.`},{text:`Xe đạp rẻ hơn xe máy.`,explanation:`Nói về giá cả, đoạn văn không đề cập.`,correct:!1},{text:`Nên đạp xe vào sáng sớm.`,explanation:`Nói về thời điểm, không phải lợi ích.`,correct:!1},{text:`Cách để sửa xe đạp tại nhà.`,explanation:`Lệch khỏi đoạn về lợi ích của xe đạp đối với môi trường và sức khỏe; câu này chuyển sang hướng dẫn sửa chữa.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Đồng phục giúp xóa bỏ khoảng cách giàu nghèo giữa các học sinh. Thêm vào đó, nó tạo nên vẻ đẹp đồng bộ và sự tự hào về ngôi trường mình đang theo học.'`,a:[{text:`Việc mặc đồng phục đến trường có nhiều ý nghĩa tích cực.`,correct:!0,explanation:`Câu này bao quát tính công bằng và tính thẩm mỹ/tự hào.`},{text:`Đồng phục trường tôi rất đẹp.`,explanation:`Ý kiến cá nhân hẹp, không bao quát được ý nghĩa xã hội (xóa khoảng cách).`,correct:!1},{text:`Học sinh không thích mặc đồng phục.`,explanation:`Ngược lại với các ý tích cực trong đoạn.`,correct:!1},{text:`Giá của bộ đồng phục khá cao.`,explanation:`Chỉ nói về chi phí, không giải thích ý nghĩa xã hội và tinh thần của việc mặc đồng phục.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Bạn cần lập danh sách các việc cần làm theo thứ tự ưu tiên. Sau đó, hãy tập trung hoàn thành từng việc một thay vì làm nhiều việc cùng lúc.'`,a:[{text:`Kỹ năng quản lý thời gian hiệu quả bắt đầu từ việc lập kế hoạch.`,correct:!0,explanation:`Câu này dẫn dắt tốt cho hành động lập danh sách và tập trung.`},{text:`Thời gian là vàng bạc.`,explanation:`Một câu tục ngữ chung chung, không mô tả phương pháp như đoạn văn.`,correct:!1},{text:`Chúng ta thường rất bận rộn.`,explanation:`Nêu thực trạng, không phải câu chủ đề cho đoạn văn hướng dẫn kỹ năng.`,correct:!1},{text:`Sử dụng điện thoại làm lãng phí thời gian.`,explanation:`Chỉ là một nguyên nhân gây mất thời gian, không bao quát được cách quản lý.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Bảo tàng là nơi lưu giữ những hiện vật lịch sử quý giá của dân tộc. Thông qua việc tham quan, học sinh có thể hiểu rõ hơn về quá trình đấu tranh và phát triển của ông cha ta.'`,a:[{text:`Tham quan bảo tàng là một cách học lịch sử trực quan và hiệu quả.`,correct:!0,explanation:`Câu này bao quát tính lưu giữ hiện vật và tính giáo dục lịch sử.`},{text:`Bảo tàng mở cửa vào tất cả các ngày trong tuần.`,explanation:`Nói về thông tin hoạt động, không phải giá trị giáo dục.`,correct:!1},{text:`Có rất nhiều bảo tàng ở thành phố.`,explanation:`Nói về số lượng, không nói về lợi ích.`,correct:!1},{text:`Lịch sử là một môn học khô khan.`,explanation:`Ý kiến tiêu cực, không phù hợp dẫn dắt cho hoạt động tích cực này.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Việc tự học giúp bạn rèn luyện tính độc lập và sáng tạo trong tư duy. Hơn nữa, bạn có thể chủ động sắp xếp tốc độ học tập phù hợp với khả năng của chính mình.'`,a:[{text:`Tự học đóng vai trò quan trọng trong việc phát triển năng lực cá nhân.`,correct:!0,explanation:`Câu này bao quát được tính độc lập và tính chủ động.`},{text:`Học thêm giúp chúng ta giỏi hơn.`,explanation:`Ngược lại với chủ đề 'tự học'.`,correct:!1},{text:`Giáo viên luôn hỗ trợ học sinh.`,explanation:`Nói về vai trò giáo viên, không phải tự học.`,correct:!1},{text:`Các bước để lập thời khóa biểu.`,explanation:`Chỉ là một phần nhỏ của việc chuẩn bị tự học.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Cam và chanh chứa nhiều vitamin giúp tăng sức đề kháng. Trong khi đó, cá hồi cung cấp omega-3 rất tốt cho sự phát triển của trí não.'`,a:[{text:`Mỗi loại thực phẩm đều mang lại những dưỡng chất riêng biệt cho cơ thể.`,correct:!0,explanation:`Câu này bao quát được các ví dụ khác nhau về cam, chanh và cá hồi.`},{text:`Chúng ta nên ăn nhiều cá hơn thịt.`,explanation:`Câu so sánh không bao quát được phần hoa quả.`,correct:!1},{text:`Trẻ em thường ghét ăn rau.`,explanation:`Đoạn đang phân tích dưỡng chất của cam, chanh và cá hồi, không bàn về sở thích ăn rau của trẻ.`,correct:!1},{text:`Vitamin rất cần thiết cho con người.`,explanation:`Câu này đúng nhưng chưa bao quát được ý về omega-3 ở cá hồi.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Bạn nên hạn chế ăn đồ ăn nhanh và nước ngọt có gas. Thay vào đó, hãy bổ sung nhiều rau xanh và hoa quả tươi trong thực đơn hằng ngày.'`,a:[{text:`Để có một cơ thể khỏe mạnh, việc lựa chọn thực phẩm là rất quan trọng.`,correct:!0,explanation:`Câu này dẫn dắt cho cả việc nên ăn gì và không nên ăn gì.`},{text:`Đồ ăn nhanh rất tiện lợi.`,explanation:`Nêu ưu điểm của đồ ăn nhanh, ngược với lời khuyên trong đoạn.`,correct:!1},{text:`Rau xanh có màu sắc rất đẹp.`,explanation:`Nhận xét về hình thức, không liên quan đến lời khuyên sức khỏe.`,correct:!1},{text:`Béo phì là một vấn đề nghiêm trọng.`,explanation:`Nêu hậu quả, không bao quát được hướng dẫn ăn uống.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Cây xanh giúp hấp thụ khí CO2 và cung cấp khí Oxy cho sự sống. Đồng thời, rễ cây còn giúp giữ đất và ngăn chặn tình trạng xói mòn, lũ lụt.'`,a:[{text:`Cây xanh đóng vai trò không thể thiếu trong việc bảo vệ hệ sinh thái.`,correct:!0,explanation:`Câu này bao quát cả tác dụng thanh lọc không khí và bảo vệ đất đai.`},{text:`Rừng nhiệt đới có nhiều loài thú quý hiếm.`,explanation:`Lệch chủ đề sang động vật hoang dã.`,correct:!1},{text:`Gỗ là vật liệu xây dựng phổ biến.`,explanation:`Nêu công dụng khai thác, không phải giá trị bảo vệ môi trường.`,correct:!1},{text:`Chúng ta nên trồng cây trong nhà.`,explanation:`Quá hẹp về phạm vi. Cách dùng phù hợp trong câu này là “Cây xanh đóng vai trò không thể thiếu trong việc bảo vệ hệ sinh thái.”.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '. Bạn có thể giao lưu với mọi người thông qua các diễn đàn trực tuyến. Ngoài ra, các khóa học từ xa cho phép bạn tiếp cận kiến thức từ những chuyên gia hàng đầu thế giới.'`,a:[{text:`Công nghệ thông tin đã mang lại những thay đổi lớn trong giao tiếp và giáo dục.`,correct:!0,explanation:`Câu này bao quát cả ý giao lưu trực tuyến và học tập từ xa.`},{text:`Sử dụng máy tính quá lâu sẽ mỏi mắt.`,explanation:`Nêu tác hại, không khớp với nội dung tích cực trong đoạn.`,correct:!1},{text:`Robot sẽ thay thế con người trong tương lai.`,explanation:`Dự đoán xa rời nội dung thực tế về Internet trong đoạn.`,correct:!1},{text:`Học phí các khóa học trực tuyến thường rẻ.`,explanation:`Nói về giá cả, không phải nội dung giao tiếp/giáo dục.`,correct:!1}]},{q:`Chọn câu mở đoạn phù hợp: '___________. Làm việc nhà giúp trẻ hình thành thói quen ngăn nắp và sạch sẽ. Thêm vào đó, thông qua việc giúp đỡ cha mẹ, trẻ cũng học được cách chịu trách nhiệm với gia đình.'`,a:[{text:`Việc rèn luyện cho trẻ làm việc nhà mang lại nhiều bài học quý giá.`,correct:!0,explanation:`Câu này bao quát cả thói quen cá nhân và ý thức trách nhiệm.`},{text:`Cha mẹ thường rất bận rộn.`,explanation:`Lệch chủ đề sang đối tượng cha mẹ.`,correct:!1},{text:`Quét nhà là việc rất dễ làm.`,explanation:`Nêu tính chất một việc cụ thể, không bao quát toàn bộ ý nghĩa.`,correct:!1},{text:`Trẻ em nên được vui chơi thoải mái.`,explanation:`Câu này thường dẫn đến ý kiến phản đối làm việc nhà, không khớp đoạn văn.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Học nhóm là một phương pháp học tập hiệu quả. ___________. Ngoài ra, các thành viên có thể cùng nhau giải quyết những bài tập khó mà một người không làm được.'`,a:[{text:`Khi học cùng bạn, chúng ta có thể thảo luận và làm rõ các kiến thức chưa hiểu.`,correct:!0,explanation:`Câu này bổ sung trực tiếp lợi ích của việc học nhóm (thảo luận).`},{text:`Học nhóm thường tốn nhiều thời gian tán gẫu.`,explanation:`Mang nghĩa tiêu cực, mâu thuẫn với câu chủ đề.`,correct:!1},{text:`Mỗi học sinh đều phải có sách giáo khoa.`,explanation:`Không liên quan đến phương pháp học nhóm.`,correct:!1},{text:`Thư viện trường rất yên tĩnh.`,explanation:`Nói về địa điểm, không nói về bản chất phương pháp.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Ô nhiễm không khí đang là vấn đề lo ngại tại các thành phố lớn. Khói bụi từ xe cộ và nhà máy làm giảm chất lượng bầu khí quyển. ___________. Điều này dẫn đến sự gia tăng các bệnh về đường hô hấp ở con người.'`,a:[{text:`Hệ quả là, không khí chúng ta hít thở hằng ngày chứa nhiều tạp chất độc hại.`,correct:!0,explanation:`Câu này kết nối logic từ khói bụi đến tác động sức khỏe.`},{text:`Người dân nên đi du lịch ở vùng nông thôn.`,explanation:`Một giải pháp không liên quan trực tiếp đến việc giải thích hiện tượng ô nhiễm.`,correct:!1},{text:`Giá xăng dầu đang tăng cao.`,explanation:`Giá nhiên liệu không nối trực tiếp với chuỗi ô nhiễm và bệnh hô hấp đang được giải thích.`,correct:!1},{text:`Xe đạp điện là một phương tiện tốt.`,explanation:`Nêu giải pháp quá sớm khi đoạn đang giải thích thực trạng.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Lòng nhân ái là một phẩm chất quý giá của con người. Nó thể hiện qua việc chúng ta sẵn lòng giúp đỡ những người có hoàn cảnh khó khăn. ___________. Những hành động nhỏ bé đó góp phần làm cho xã hội trở nên ấm áp hơn.'`,a:[{text:`Ví dụ như việc quyên góp quần áo cũ hay giúp người già sang đường.`,correct:!0,explanation:`Cung cấp ví dụ cụ thể để minh họa cho 'việc giúp đỡ' đã nhắc trước đó.`},{text:`Tuy nhiên, nhiều người sống rất ích kỷ.`,explanation:`Chuyển sang ý đối lập không phù hợp với mạch cảm xúc của đoạn văn.`,correct:!1},{text:`Lòng nhân ái là một khái niệm khó hiểu.`,explanation:`Phủ nhận tính rõ ràng của đoạn văn.`,correct:!1},{text:`Mọi người đều thích nhận quà.`,explanation:`Không liên quan đến bản chất của lòng nhân ái.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Tiết kiệm điện năng là việc làm cần thiết để bảo vệ tài nguyên. ___________. Thêm vào đó, chúng ta nên sử dụng các thiết bị điện có nhãn tiết kiệm năng lượng.'`,a:[{text:`Chúng ta nên tắt các thiết bị điện khi không sử dụng đến.`,correct:!0,explanation:`Đưa ra một hành động cụ thể và phổ biến để tiết kiệm điện.`},{text:`Giá điện hằng tháng thường rất cao.`,explanation:`Nói về chi phí, không tập trung vào hành động bảo vệ tài nguyên.`,correct:!1},{text:`Ánh sáng mặt trời rất tốt cho xương.`,explanation:`Lệch chủ đề sang sức khỏe.`,correct:!1},{text:`Máy tính tiêu thụ nhiều điện hơn điện thoại.`,explanation:`So sánh không cần thiết trong ngữ cảnh này.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Rèn luyện kỹ năng sống là rất quan trọng đối với học sinh. Kỹ năng giao tiếp giúp bạn tự tin hơn trước đám đông. ___________. Tất cả những điều này sẽ chuẩn bị cho bạn một hành trang vững chắc khi bước vào đời.'`,a:[{text:`Trong khi đó, kỹ năng giải quyết vấn đề giúp bạn xử lý các tình huống khó khăn.`,correct:!0,explanation:`Bổ sung thêm một kỹ năng cụ thể để củng cố ý chính về 'rèn luyện kỹ năng sống'.`},{text:`Môn Toán và môn Văn là hai môn học cơ bản.`,explanation:`Nói về kiến thức học thuật, không phải kỹ năng sống.`,correct:!1},{text:`Học sinh thường thích chơi thể thao vào giờ ra chơi.`,explanation:`Lệch chủ đề. Cách dùng phù hợp trong câu này là “Trong khi đó, kỹ năng giải quyết vấn đề giúp bạn xử lý các tình huống khó khăn.”.`,correct:!1},{text:`Nhiều trường học chưa tổ chức các lớp kỹ năng.`,explanation:`Nêu khuyết điểm của trường học, không tập trung vào tầm quan trọng của kỹ năng.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Nước đóng vai trò sống còn đối với cơ thể con người. Nó giúp vận chuyển các chất dinh dưỡng đến các tế bào. ___________. Vì vậy, bác sĩ luôn khuyên chúng ta uống đủ 2 lít nước mỗi ngày.'`,a:[{text:`Đồng thời, nước còn hỗ trợ quá trình tiêu hóa và thanh lọc độc tố.`,correct:!0,explanation:`Bổ sung thêm một chức năng sinh học của nước, phù hợp mạch liệt kê lợi ích.`},{text:`Nước biển có vị mặn vì chứa nhiều muối.`,explanation:`Lệch chủ đề sang hóa học/địa lý.`,correct:!1},{text:`Nhiều người thích uống nước ngọt hơn nước lọc.`,explanation:`Không liên quan đến chức năng của nước với cơ thể.`,correct:!1},{text:`Nước chiếm 70% diện tích bề mặt Trái Đất.`,explanation:`Nói về địa lý thế giới, không phải cơ thể con người.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Việc sử dụng điện thoại thông minh quá nhiều gây ra nhiều hệ lụy. Đầu tiên là ảnh hưởng đến thị lực do tiếp xúc quá lâu với ánh sáng xanh. ___________. Hơn nữa, thói quen này còn làm giảm thời gian tương tác trực tiếp với người thân.'`,a:[{text:`Tiếp theo, việc sử dụng điện thoại trong giờ học gây mất tập trung và giảm kết quả học tập.`,correct:!0,explanation:`Sử dụng từ nối 'Tiếp theo' để liệt kê thêm một tác hại phù hợp logic.`},{text:`Điện thoại thông minh hiện nay rất rẻ và đẹp.`,explanation:`Nêu ưu điểm, trái ngược hoàn toàn với mạch 'hệ lụy' của đoạn.`,correct:!1},{text:`Nhiều người dùng điện thoại để chụp ảnh.`,explanation:`Nêu tính năng, không phải hệ lụy.`,correct:!1},{text:`Chúng ta có thể tải rất nhiều ứng dụng hữu ích.`,explanation:`Nêu điểm tích cực, không phù hợp.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Trồng cây xanh mang lại rất nhiều lợi ích cho không gian sống. Cây giúp lọc bụi bẩn và cung cấp bóng mát trong những ngày hè oi ả. ___________. Sự hiện diện của mảng xanh giúp con người cảm thấy thư thái và yêu đời hơn.'`,a:[{text:`Về mặt tinh thần, ngắm nhìn cây cối giúp chúng ta giảm bớt căng thẳng.`,correct:!0,explanation:`Kết nối ý từ bóng mát (vật lý) sang cảm giác thư thái (tinh thần).`},{text:`Cây xanh cần có đủ nước và ánh sáng để phát triển.`,explanation:`Nói về cách chăm sóc cây, không phải lợi ích của cây cho con người.`,correct:!1},{text:`Có nhiều loại cây không cần nhiều đất.`,explanation:`Nêu đặc điểm sinh học, không phải lợi ích.`,correct:!1},{text:`Gỗ cây có thể dùng làm bàn ghế.`,explanation:`Lệch chủ đề sang khai thác lâm sản.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Để học tốt môn Tiếng Anh, chúng ta cần luyện tập đều đặn hằng ngày. Việc nghe các bài hát hay xem phim giúp bạn làm quen với ngữ điệu tự nhiên. ___________. Kết hợp nhiều phương pháp sẽ giúp bạn tiến bộ nhanh chóng.'`,a:[{text:`Ngoài ra, bạn nên thực hành nói và viết thường xuyên để ghi nhớ từ vựng.`,correct:!0,explanation:`Bổ sung thêm các kỹ năng nói và viết để hoàn thiện phương pháp học.`},{text:`Tiếng Anh là ngôn ngữ khó nhất thế giới.`,explanation:`Nêu quan điểm cá nhân tiêu cực, không hỗ trợ ý 'luyện tập đều đặn'.`,correct:!1},{text:`Người Mỹ nói tiếng Anh khác người Anh.`,explanation:`Nêu kiến thức ngôn ngữ học, không hỗ trợ phương pháp học.`,correct:!1},{text:`Máy tính có thể dịch được nhiều ngôn ngữ.`,explanation:`Không liên quan đến việc tự luyện tập của cá nhân.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Phân loại rác tại nguồn là một bước quan trọng trong quy trình xử lý rác thải. Việc tách riêng rác hữu cơ giúp quá trình ủ phân bón diễn ra thuận lợi hơn. ___________. Nhờ đó, lượng rác thải ra môi trường sẽ giảm đáng kể.'`,a:[{text:`Trong khi đó, rác tái chế như nhựa và giấy có thể được thu gom để sản xuất sản phẩm mới.`,correct:!0,explanation:`Bổ sung ý về rác tái chế, hoàn thiện các loại rác cần phân loại.`},{text:`Rác thải y tế cần được xử lý đặc biệt.`,explanation:`Quá chuyên sâu, không phù hợp với phân loại rác gia đình thông thường.`,correct:!1},{text:`Mọi người thường vứt rác bừa bãi trên đường.`,explanation:`Nêu hành vi xấu, không hỗ trợ quy trình phân loại rác.`,correct:!1},{text:`Thùng rác có nhiều màu sắc khác nhau.`,explanation:`Chỉ mô tả hình thức thùng rác, không mô tả quy trình.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Tình bạn đẹp là nguồn động viên tinh thần lớn lao cho mỗi người. Khi gặp khó khăn, bạn bè sẽ luôn ở bên cạnh để sẻ chia và giúp đỡ. ___________. Sự gắn kết này giúp cuộc sống trở nên ý nghĩa và đáng yêu hơn.'`,a:[{text:`Ngược lại, khi có niềm vui, sự chúc mừng từ bạn bè sẽ làm hạnh phúc nhân đôi.`,correct:!0,explanation:`Tạo sự đối lập logic: chia sẻ nỗi buồn (khó khăn) và nhân đôi niềm vui.`},{text:`Bạn thân là người thường xuyên mượn đồ của chúng ta.`,explanation:`Một chi tiết vụn vặt và hơi tiêu cực, không phù hợp đoạn văn ca ngợi tình bạn.`,correct:!1},{text:`Một lớp học thường có khoảng 40 học sinh.`,explanation:`Không liên quan đến chất lượng tình bạn.`,correct:!1},{text:`Tìm kiếm bạn mới qua mạng xã hội rất nhanh.`,explanation:`Nêu phương thức kết bạn, không nói về giá trị của tình bạn hiện có.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Học sinh nên hạn chế sử dụng túi nilon để bảo vệ môi trường. Túi nilon mất hàng trăm năm mới có thể phân hủy hoàn toàn trong đất. ___________. Việc thay đổi thói quen nhỏ này sẽ mang lại tác động lớn.'`,a:[{text:`Thay vào đó, chúng ta có thể sử dụng túi vải hoặc túi giấy khi đi mua sắm.`,correct:!0,explanation:`Đưa ra giải pháp thay thế cụ thể sau khi nêu tác hại của túi nilon.`},{text:`Túi nilon rất bền và rẻ tiền.`,explanation:`Nêu ưu điểm của túi nilon, mâu thuẫn với lời khuyên 'hạn chế sử dụng'.`,correct:!1},{text:`Có nhiều nhà máy sản xuất túi nilon hiện nay.`,explanation:`Không liên quan đến giải pháp bảo vệ môi trường của học sinh.`,correct:!1},{text:`Đốt túi nilon sẽ gây ra mùi hôi khó chịu.`,explanation:`Nêu một tác hại khác nhưng không dẫn dắt tốt đến câu kết về 'thay đổi thói quen'.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Lịch sử không chỉ là những con số và sự kiện khô khan. Nó giúp chúng ta hiểu về nguồn gốc và truyền thống của dân tộc mình. ___________. Từ đó, mỗi người sẽ có ý thức trách nhiệm hơn trong việc xây dựng đất nước.'`,a:[{text:`Học lịch sử còn giúp chúng ta rút ra những bài học kinh nghiệm từ quá khứ.`,correct:!0,explanation:`Bổ sung một giá trị quan trọng của việc học lịch sử phù hợp với mạch tư duy.`},{text:`Nhiều học sinh cảm thấy buồn ngủ trong giờ lịch sử.`,explanation:`Nêu tình trạng tiêu cực, phá vỡ mạch lập luận tích cực của đoạn.`,correct:!1},{text:`Các cuộc chiến tranh thường gây ra nhiều mất mát.`,explanation:`Quá cụ thể vào chiến tranh, không bao quát ý nghĩa của môn học.`,correct:!1},{text:`Sách lịch sử có nhiều hình ảnh minh họa đẹp mắt.`,explanation:`Chỉ nói về hình thức sách, không nói về giá trị kiến thức.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Âm nhạc có sức mạnh kỳ diệu đối với cảm xúc con người. Những giai điệu vui tươi giúp chúng ta nạp thêm năng lượng tích cực. ___________. Vì vậy, âm nhạc được xem là liều thuốc cho tâm hồn.'`,a:[{text:`Trái lại, những bản nhạc nhẹ nhàng có thể xoa dịu nỗi buồn và căng thẳng.`,correct:!0,explanation:`Hoàn thiện hai sắc thái cảm xúc mà âm nhạc tác động: vui tươi và xoa dịu.`},{text:`Nhạc cụ phổ biến nhất hiện nay là đàn guitar.`,explanation:`Nói về nhạc cụ, không phải tác động cảm xúc.`,correct:!1},{text:`Nhiều ca sĩ nổi tiếng nhờ mạng xã hội.`,explanation:`Lệch chủ đề sang sự nghiệp của nghệ sĩ.`,correct:!1},{text:`Âm thanh quá lớn sẽ gây hại cho thính giác.`,explanation:`Cảnh báo về sức khỏe thính giác, không phù hợp mạch cảm xúc.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Việc tự nấu ăn tại nhà mang lại nhiều lợi ích cho sức khỏe và tài chính. Bạn có thể kiểm soát được lượng gia vị và độ tươi ngon của nguyên liệu. ___________. Một bữa cơm gia đình còn giúp các thành viên gắn kết với nhau hơn.'`,a:[{text:`Hơn nữa, chi phí nấu ăn tại nhà thường rẻ hơn nhiều so với việc đi ăn tiệm.`,correct:!0,explanation:`Hỗ trợ ý 'tài chính' đã được nhắc đến ở câu chủ đề.`},{text:`Đồ ăn nhanh thường chứa nhiều dầu mỡ.`,explanation:`Chỉ là một so sánh phụ, không trực tiếp hỗ trợ ý tự nấu tại nhà.`,correct:!1},{text:`Siêu thị bán rất nhiều loại thực phẩm chế biến sẵn.`,explanation:`Không hỗ trợ cho hành động tự nấu ăn.`,correct:!1},{text:`Rửa bát là công việc tốn thời gian sau khi ăn.`,explanation:`Nêu nhược điểm, mâu thuẫn với mục đích liệt kê lợi ích.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Hợp tác là một kỹ năng thiết yếu trong xã hội hiện đại. Khi cùng làm việc, chúng ta có thể tận dụng tối đa thế mạnh của từng cá nhân. ___________. Sự phối hợp nhịp nhàng sẽ đem lại kết quả vượt xa kỳ vọng.'`,a:[{text:`Mỗi người đóng góp một ý tưởng độc đáo sẽ tạo nên một giải pháp hoàn thiện.`,correct:!0,explanation:`Giải thích rõ hơn cách tận dụng thế mạnh cá nhân trong hợp tác.`},{text:`Cạnh tranh giúp con người nỗ lực hơn.`,explanation:`Lệch chủ đề sang 'cạnh tranh', trái ngược với 'hợp tác'.`,correct:!1},{text:`Hợp tác đôi khi gây ra những tranh cãi không đáng có.`,explanation:`Nêu nhược điểm, không phù hợp với mạch khẳng định kỹ năng thiết yếu.`,correct:!1},{text:`Thư ký là người ghi chép lại các biên bản họp.`,explanation:`Quá cụ thể vào một vị trí công việc, không liên quan đến kỹ năng chung.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Thể thao không chỉ rèn luyện thể chất mà còn giúp hình thành tính cách. Khi chơi các môn đồng đội, bạn sẽ học được tinh thần trách nhiệm và kỷ luật. ___________. Những bài học này sẽ rất hữu ích trong cuộc sống sau này.'`,a:[{text:`Ngoài ra, việc đối mặt với thất bại trong thi đấu rèn luyện cho bạn sự kiên trì.`,correct:!0,explanation:`Bổ sung thêm một khía cạnh hình thành tính cách (kiên trì) từ thể thao.`},{text:`Quần áo thể thao cần phải thoáng mát và co giãn tốt.`,explanation:`Nói về trang phục, không liên quan đến hình thành tính cách.`,correct:!1},{text:`Đá bóng là môn thể thao vua ở Việt Nam.`,explanation:`Cung cấp thông tin bên lề, không hỗ trợ lập luận.`,correct:!1},{text:`Chấn thương là điều khó tránh khỏi khi chơi thể thao.`,explanation:`Nêu rủi ro, không hỗ trợ ý nghĩa giáo dục tính cách.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Internet là kho tàng tri thức khổng lồ cho học sinh tham khảo. Chỉ với vài cú nhấp chuột, bạn có thể tìm thấy hàng ngàn tài liệu liên quan đến bài học. ___________. Tuy nhiên, hãy nhớ kiểm chứng độ tin cậy của thông tin trước khi sử dụng.'`,a:[{text:`Các bài giảng trực tuyến cũng giúp bạn hiểu thêm những phần kiến thức khó trên lớp.`,correct:!0,explanation:`Hỗ trợ thêm một khía cạnh học tập (bài giảng) trên Internet.`},{text:`Trò chơi trực tuyến có thể gây nghiện nếu không kiểm soát.`,explanation:`Mặc dù đúng nhưng đang trong mạch liệt kê 'kho tàng tri thức' thì ý này bị lạc điệu.`,correct:!1},{text:`Mua hàng qua mạng rất tiện lợi nhưng cũng có rủi ro.`,explanation:`Lệch chủ đề từ học tập sang mua sắm.`,correct:!1},{text:`Tốc độ mạng ổn định là rất quan trọng.`,explanation:`Nói về kỹ thuật, không phải giá trị tri thức.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Thói quen đọc sách buổi tối giúp não bộ thư giãn trước khi đi ngủ. Thay vì sử dụng điện thoại, đọc vài trang sách sẽ giúp bạn dễ đi vào giấc ngủ hơn. ___________. Đó là một cách tuyệt vời để kết thúc một ngày dài.'`,a:[{text:`Hơn nữa, không gian yên tĩnh của đêm khuya giúp bạn tập trung cảm nhận nội dung sách tốt hơn.`,correct:!0,explanation:`Bổ sung lợi ích của việc đọc sách vào ban đêm (tập trung) phù hợp logic.`},{text:`Sách điện tử ngày càng trở nên phổ biến.`,explanation:`Nói về loại hình sách, không hỗ trợ thói quen đọc buổi tối.`,correct:!1},{text:`Ánh sáng đèn điện quá sáng sẽ gây hại cho mắt.`,explanation:`Cảnh báo chung về ánh sáng, không hỗ trợ lợi ích đọc sách.`,correct:!1},{text:`Nhiều người thích đọc truyện tranh hơn là tiểu thuyết.`,explanation:`So sánh sở thích, không hỗ trợ lập luận về thư giãn.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Giao tiếp bằng ánh mắt là một phần quan trọng trong kỹ năng thuyết trình. Nó giúp bạn kết nối và tạo niềm tin với người nghe. ___________. Nhờ đó, bài thuyết trình của bạn sẽ trở nên thuyết phục và sinh động hơn.'`,a:[{text:`Bằng cách nhìn vào khán giả, bạn cho họ thấy sự tự tin và sự tôn trọng của mình.`,correct:!0,explanation:`Giải thích cụ thể cơ chế tạo niềm tin thông qua ánh mắt.`},{text:`Microphone nên được kiểm tra kỹ trước khi bắt đầu.`,explanation:`Nói về thiết bị, không liên quan đến giao tiếp bằng ánh mắt.`,correct:!1},{text:`Quần áo chỉnh tề cũng giúp bạn ghi điểm với người xem.`,explanation:`Nói về ngoại hình, không tập trung vào ánh mắt.`,correct:!1},{text:`Hầu hết mọi người đều sợ đứng trước đám đông.`,explanation:`Nêu thực trạng tâm lý, không hỗ trợ kỹ năng cụ thể đang bàn.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Tiết kiệm không chỉ là giữ lại tiền bạc mà còn là sử dụng hợp lý các nguồn tài nguyên. Khi chúng ta không lãng phí thức ăn, chúng ta đang trân trọng công sức của người lao động. ___________. Lối sống tiết kiệm mang lại sự ổn định và an tâm cho tương lai.'`,a:[{text:`Tương tự, việc tiết kiệm giấy bút cũng góp phần bảo vệ rừng tự nhiên.`,correct:!0,explanation:`Mở rộng khái niệm tiết kiệm từ thức ăn sang tài nguyên khác (giấy) phù hợp mạch văn.`},{text:`Người giàu thường biết cách đầu tư sinh lời.`,explanation:`Lệch chủ đề sang đầu tư tài chính.`,correct:!1},{text:`Nhiều nhà hàng thường bỏ đi một lượng lớn thức ăn thừa.`,explanation:`Nêu thực trạng lãng phí, không hỗ trợ ý 'sử dụng hợp lý'.`,correct:!1},{text:`Máy rút tiền ATM rất phổ biến ở các thành phố.`,explanation:`ATM không liên quan đến việc tiết kiệm thức ăn, giấy bút và tài nguyên.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Việc học từ những lỗi lầm là một phần không thể thiếu của sự trưởng thành. Thất bại cho chúng ta biết những phương pháp nào chưa hiệu quả để thay đổi. ___________. Đừng sợ mắc lỗi, hãy sợ việc không dám bắt đầu.'`,a:[{text:`Mỗi lần vấp ngã là một cơ hội để rèn luyện sự kiên cường và bản lĩnh.`,correct:!0,explanation:`Hỗ trợ ý nghĩa tích cực của việc mắc lỗi đối với sự phát triển cá nhân.`},{text:`Lỗi chính tả sẽ làm giảm điểm số của bài viết.`,explanation:`Quá cụ thể vào lỗi nhỏ, không mang tính triết lý trưởng thành như đoạn văn.`,correct:!1},{text:`Nhiều người thường đổ lỗi cho hoàn cảnh thay vì nhận sai.`,explanation:`Phê phán hành vi xấu, không hỗ trợ việc học từ lỗi lầm.`,correct:!1},{text:`Chúng ta nên cố gắng làm mọi việc thật hoàn hảo ngay từ đầu.`,explanation:`Ngược lại với tinh thần 'chấp nhận lỗi lầm' của đoạn văn.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Công viên cây xanh là lá phổi của thành phố. Đây là nơi mọi người có thể hít thở không khí trong lành và tránh xa sự ồn ào của phố thị. ___________. Vì vậy, việc mở rộng diện tích công viên là vô cùng cấp thiết.'`,a:[{text:`Bên cạnh đó, không gian này còn là địa điểm lý tưởng cho các hoạt động thể dục và thư giãn.`,correct:!0,explanation:`Bổ sung thêm giá trị sử dụng của công viên cho con người.`},{text:`Vé vào cổng công viên thường rất rẻ.`,explanation:`Nói về chi phí, không hỗ trợ ý nghĩa 'lá phổi thành phố'.`,correct:!1},{text:`Ở đây có rất nhiều loại hoa khoe sắc vào mùa xuân.`,explanation:`Mô tả vẻ đẹp, không nhấn mạnh bằng ý về sức khỏe/không gian.`,correct:!1},{text:`Một số người thường vứt rác không đúng nơi quy định trong công viên.`,explanation:`Phê phán hành vi, phá vỡ mạch lập luận về giá trị công viên.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Sự tự tin đóng vai trò quan trọng dẫn đến thành công. Khi tin vào khả năng của mình, bạn sẽ dám đối mặt với những thử thách mới. ___________. Sự tự tin giúp bạn tỏa sáng và tạo ấn tượng tốt với mọi người xung quanh.'`,a:[{text:`Nó cũng giúp bạn bình tĩnh hơn để tìm ra giải pháp khi gặp khó khăn.`,correct:!0,explanation:`Bổ sung thêm một lợi ích thực tế của sự tự tin (bình tĩnh xử lý khó khăn).`},{text:`Nhiều người quá tự tin dẫn đến chủ quan và thất bại.`,explanation:`Cảnh báo về 'tự phụ', không hỗ trợ ý nghĩa tích cực đang bàn.`,correct:!1},{text:`Trang phục đẹp là cách để tăng thêm sự tự tin.`,explanation:`Nói về phương pháp tăng tự tin, không nói về vai trò của nó.`,correct:!1},{text:`Màu áo may mắn mới là yếu tố quyết định thành công.`,explanation:`Đưa ra một nguyên nhân mê tín, không hỗ trợ mạch lập luận về lợi ích của sự tự tin.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Việc đi bộ hằng ngày là hình thức vận động đơn giản nhưng hiệu quả. Nó giúp tăng cường sức khỏe tim mạch và ổn định huyết áp. ___________. Chỉ với 30 phút mỗi ngày, bạn sẽ thấy cơ thể có những thay đổi tích cực.'`,a:[{text:`Hơn nữa, đi bộ còn giúp giảm cân và cải thiện tâm trạng rất tốt.`,correct:!0,explanation:`Bổ sung thêm lợi ích về cân nặng và tâm trạng, phù hợp mạch liệt kê lợi ích sức khỏe.`},{text:`Giày đi bộ cần phải êm và ôm sát chân.`,explanation:`Nói về dụng cụ, không hỗ trợ trực tiếp lợi ích vận động.`,correct:!1},{text:`Đi bộ trên vỉa hè đôi khi gặp khó khăn do xe máy đỗ bừa bãi.`,explanation:`Nêu thực trạng giao thông, không liên quan đến lợi ích sức khỏe.`,correct:!1},{text:`Marathon là cuộc đua chạy bộ quãng đường dài.`,explanation:`Lệch sang môn thể thao chuyên nghiệp khác.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Lòng biết ơn giúp chúng ta trân trọng những gì mình đang có. Khi biết ơn cha mẹ, bạn sẽ thấy trân quý sự hy sinh và chăm sóc của họ. ___________. Một trái tim biết ơn luôn tràn đầy niềm vui và sự tử tế.'`,a:[{text:`Biết ơn thầy cô giúp chúng ta có thêm động lực để học tập và rèn luyện tốt hơn.`,correct:!0,explanation:`Mở rộng đối tượng biết ơn (thầy cô) sau khi đã nhắc đến cha mẹ.`},{text:`Quà tặng là một cách để bày tỏ sự cảm ơn.`,explanation:`Nói về hình thức vật chất, không tập trung vào giá trị tinh thần của lòng biết ơn.`,correct:!1},{text:`Điểm số cao là mục tiêu duy nhất của việc học.`,explanation:`Lạc chủ đề học tập, không mở rộng mạch về các đối tượng và giá trị của lòng biết ơn.`,correct:!1},{text:`Nhiều người thường quên nói lời cảm ơn.`,explanation:`Nêu hiện tượng tiêu cực, không hỗ trợ ý 'trân trọng'.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Kỹ năng ghi chú (note-taking) giúp học sinh lưu trữ thông tin hiệu quả hơn. Thay vì chép lại nguyên văn, bạn nên tóm tắt ý chính bằng ngôn ngữ của mình. ___________. Phương pháp này giúp bạn ôn tập bài học một cách nhanh chóng.'`,a:[{text:`Việc sử dụng các ký hiệu hay sơ đồ cũng khiến trang ghi chú trở nên dễ hiểu hơn.`,correct:!0,explanation:`Đưa ra kỹ thuật cụ thể (ký hiệu, sơ đồ) để làm rõ cách ghi chú hiệu quả.`},{text:`Bút chì dễ tẩy xóa hơn bút bi khi ghi chép.`,explanation:`Nói về dụng cụ, không phải kỹ năng tư duy ghi chú.`,correct:!1},{text:`Vở ghi nên có lề rộng để trang trí.`,explanation:`Tập trung vào trang trí, không hỗ trợ mục tiêu lưu trữ thông tin.`,correct:!1},{text:`Nhiều bạn thường mượn vở của người khác để chép lại.`,explanation:`Hành vi đối phó, không hỗ trợ kỹ năng tự ghi chú.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Sự sáng tạo không phải là năng khiếu bẩm sinh mà là kết quả của quá trình luyện tập. Hãy thử nhìn nhận một vấn đề từ nhiều góc độ khác nhau để tìm ra giải pháp mới. ___________. Đừng ngại thử nghiệm những ý tưởng độc đáo của riêng mình.'`,a:[{text:`Việc đọc sách và quan sát thế giới xung quanh cũng kích thích trí tưởng tượng phát triển.`,correct:!0,explanation:`Cung cấp thêm cách thức để rèn luyện sự sáng tạo (đọc sách, quan sát).`},{text:`Người sáng tạo thường có phong cách thời trang khác biệt.`,explanation:`Một nhận xét bề ngoài, không hỗ trợ quá trình rèn luyện tư duy.`,correct:!1},{text:`Vẽ tranh là cách tốt nhất để thể hiện sự sáng tạo.`,explanation:`Quá hẹp vào một môn nghệ thuật cụ thể.`,correct:!1},{text:`Trí thông minh nhân tạo có thể thay thế sự sáng tạo của con người.`,explanation:`Dự đoán mang tính tranh luận, không hỗ trợ mục đích luyện tập cá nhân.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Tình yêu quê hương bắt đầu từ những điều giản dị xung quanh chúng ta. Đó là tình cảm dành cho ngôi nhà nhỏ, con đường làng hay mái trường thân thương. ___________. Khi lớn lên, tình cảm ấy sẽ trở thành động lực để chúng ta xây dựng quê hương giàu đẹp.'`,a:[{text:`Nó còn là sự trân trọng những phong tục, tập quán và vẻ đẹp văn hóa của nơi mình sinh ra.`,correct:!0,explanation:`Mở rộng tình yêu từ cảnh vật (nhà, đường) sang văn hóa (phong tục).`},{text:`Quê hương tôi có đặc sản là bánh chưng.`,explanation:`Quá cụ thể vào một cá nhân, không mang tính bao quát giáo dục.`,correct:!1},{text:`Đi du lịch nhiều nơi giúp bạn thấy quê mình không đẹp bằng.`,explanation:`Ngược lại với tinh thần yêu quê hương của đoạn văn.`,correct:!1},{text:`Nông thôn đang được đô thị hóa rất nhanh.`,explanation:`Nêu thực trạng xã hội, không hỗ trợ mạch cảm xúc tình yêu quê hương.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Thói quen đúng giờ thể hiện sự tôn trọng đối với bản thân và người khác. Đến cuộc hẹn đúng lúc giúp bạn giữ được uy tín và sự tin cậy. ___________. Ngược lại, việc trễ hẹn thường xuyên sẽ tạo nên ấn tượng xấu trong mắt mọi người.'`,a:[{text:`Ngoài ra, đúng giờ còn giúp bạn chủ động thời gian và tránh được sự vội vàng không đáng có.`,correct:!0,explanation:`Bổ sung lợi ích cá nhân của việc đúng giờ (chủ động, bớt vội vàng).`},{text:`Đồng hồ treo tường nên được thay pin định kỳ.`,explanation:`Lệch chủ đề sang bảo trì thiết bị.`,correct:!1},{text:`Giao thông ở các đô thị lớn thường xuyên ùn tắc.`,explanation:`Đây là lý do gây trễ hẹn, không hỗ trợ ý nghĩa của việc đúng giờ.`,correct:!1},{text:`Hẹn hò với bạn bè là cách để thư giãn.`,explanation:`Câu chuyển sang hoạt động giải trí, không phát triển luận điểm về sự đúng giờ và uy tín.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Việc bảo tồn các loài động vật hoang dã là trách nhiệm chung của toàn nhân loại. Mỗi loài vật đều đóng một vai trò quan trọng trong chuỗi thức ăn và cân bằng sinh thái. ___________. Bảo vệ chúng cũng chính là bảo vệ môi trường sống của chúng ta.'`,a:[{text:`Sự biến mất của một loài có thể gây ra những hậu quả dây chuyền cho toàn bộ hệ thống.`,correct:!0,explanation:`Giải thích rõ hơn về vai trò cân bằng sinh thái của các loài vật.`},{text:`Vườn bách thú là nơi nuôi dưỡng nhiều loài động vật lạ.`,explanation:`Lệch chủ đề sang địa điểm nuôi nhốt, không hỗ trợ ý bảo tồn hoang dã.`,correct:!1},{text:`Nhiều người thích mặc áo lông thú để khẳng định đẳng cấp.`,explanation:`Hành động tiêu cực gây hại động vật, không phù hợp mạch lập luận bảo vệ.`,correct:!1},{text:`Khủng long đã bị tuyệt chủng từ hàng triệu năm trước.`,explanation:`Thông tin quá khứ không hỗ trợ lời kêu gọi trách nhiệm hiện tại.`,correct:!1}]},{q:`Điền câu hỗ trợ phù hợp: 'Khen ngợi người khác đúng lúc là một nghệ thuật trong giao tiếp. Một lời khen chân thành có thể mang lại niềm vui và sự khích lệ rất lớn. ___________. Tuy nhiên, hãy tránh những lời khen sáo rỗng hay nịnh bợ.'`,a:[{text:`Nó giúp xây dựng mối quan hệ tốt đẹp và tạo bầu không khí tích cực.`,correct:!0,explanation:`Hỗ trợ ý nghĩa của lời khen trong việc xây dựng mối quan hệ.`},{text:`Khen người khác quá nhiều sẽ khiến họ trở nên kiêu ngạo.`,explanation:`Cảnh báo tiêu cực, không phù hợp dẫn dắt đến câu kết về 'chân thành'.`,correct:!1},{text:`Mọi người đều thích mặc quần áo đẹp để được khen.`,explanation:`Lệch chủ đề sang thời trang.`,correct:!1},{text:`Lương bổng là cách tốt nhất để khích lệ nhân viên.`,explanation:`Lệch chủ đề sang kinh tế/quản lý.`,correct:!1}]},{q:`Chọn liên từ phù hợp: 'Bạn có thể học rất giỏi trên lớp. ______, nếu không có kỹ năng thực tế, bạn sẽ gặp khó khăn khi làm việc thực tế.'`,a:[{text:`Tuy nhiên`,correct:!0,explanation:`Sử dụng để tạo sự đối lập giữa lý thuyết (học giỏi) và thực tế (kỹ năng).`},{text:`Vì vậy`,explanation:`Không tạo quan hệ kết quả logic ở đây.`,correct:!1},{text:`Hơn nữa`,explanation:`Không dùng để bổ sung ý trái ngược.`,correct:!1},{text:`Ví dụ`,explanation:`Câu sau không phải là ví dụ cho câu trước.`,correct:!1}]},{q:`Chọn liên từ phù hợp: 'Đọc sách giúp ta có thêm kiến thức. ______, nó còn là một hình thức giải trí tuyệt vời sau giờ học.'`,a:[{text:`Thêm vào đó`,correct:!0,explanation:`Dùng để bổ sung một lợi ích khác cùng chiều với ý trước.`},{text:`Trái lại`,explanation:`Hai ý này không đối lập nhau.`,correct:!1},{text:`Tóm lại`,explanation:`Đây không phải câu kết luận tóm gọn toàn đoạn.`,correct:!1},{text:`Do đó`,explanation:`Việc là hình thức giải trí không phải kết quả của việc có thêm kiến thức.`,correct:!1}]},{q:`Chọn liên từ phù hợp: 'Mưa kéo dài trong nhiều ngày liên tiếp. ______, trận đấu bóng đá ngoài trời đã bị hủy bỏ.'`,a:[{text:`Kết quả là`,correct:!0,explanation:`Diễn tả quan hệ nguyên nhân (mưa) - kết quả (hủy trận đấu).`},{text:`Mặc dù`,explanation:`Không dùng để bắt đầu câu chỉ kết quả trực tiếp thế này.`,correct:!1},{text:`Mặt khác`,explanation:`Không dùng để chỉ quan hệ hệ quả.`,correct:!1},{text:`Đầu tiên`,explanation:`Không có các ý tiếp theo để dùng từ liệt kê này.`,correct:!1}]},{q:`Chọn liên từ phù hợp: 'Chúng ta cần bảo vệ rừng xanh. ______, rừng cung cấp oxy và là nơi ở của nhiều loài sinh vật.'`,a:[{text:`Hơn nữa`,correct:!0,explanation:`Câu sau bổ sung thêm một lợi ích của rừng, nên dùng từ nối bổ sung.`},{text:`Nhưng`,explanation:`'Nhưng' báo hiệu đối lập, trong khi câu sau tiếp tục nêu lợi ích của rừng.`,correct:!1},{text:`Tuy nhiên`,explanation:`'Tuy nhiên' cũng là từ nối tương phản, không phù hợp với hai lợi ích cùng chiều.`,correct:!1},{text:`Vì thế`,explanation:`Câu sau nêu thêm một đặc điểm của rừng, không phải kết quả của câu trước.`,correct:!1}]},{q:`Chọn liên từ phù hợp: 'Học sinh có thể đi bộ đến trường để rèn luyện sức khỏe. ______, các bạn có thể sử dụng xe đạp điện để tiết kiệm thời gian.'`,a:[{text:`Hoặc là`,correct:!0,explanation:`Đưa ra một sự lựa chọn khác tương đương.`},{text:`Bởi vì`,explanation:`Không giải thích lý do cho việc đi bộ.`,correct:!1},{text:`Mặc dù`,explanation:`Hai phương án này không mang tính nhượng bộ nhau.`,correct:!1},{text:`Cho nên`,explanation:`Việc dùng xe đạp điện không phải kết quả của việc đi bộ.`,correct:!1}]},{q:`Chọn liên từ phù hợp: 'Internet mang lại nhiều tiện ích cho con người. ______, việc sử dụng quá mức có thể dẫn đến chứng nghiện mạng xã hội.'`,a:[{text:`Dẫu vậy`,correct:!0,explanation:`Tạo sự chuyển ý từ mặt tích cực sang mặt tiêu cực (nhượng bộ).`},{text:`Vì thế`,explanation:`Nghiện mạng không phải là kết quả mong muốn của tiện ích.`,correct:!1},{text:`Ngoài ra`,explanation:`Ít dùng để nối hai ý trái ngược hoàn toàn về tính chất.`,correct:!1},{text:`Đồng thời`,explanation:`Ít dùng khi muốn nhấn mạnh sự cảnh báo/đối lập.`,correct:!1}]},{q:`Chọn liên từ phù hợp: 'Bạn hãy liệt kê các mục tiêu cần đạt được trong năm nay. ______, hãy lập kế hoạch chi tiết cho từng tháng.'`,a:[{text:`Tiếp theo`,correct:!0,explanation:`Chỉ trình tự các bước thực hiện hành động.`},{text:`Tuy nhiên`,explanation:`Không có sự đối lập giữa hai bước này.`,correct:!1},{text:`Bởi vì`,explanation:`Việc lập kế hoạch tháng không phải nguyên nhân của việc liệt kê mục tiêu năm.`,correct:!1},{text:`Mặc dù`,explanation:`'Mặc dù' cần một mệnh đề nhượng bộ, không nối hai bước tuần tự trong kế hoạch.`,correct:!1}]},{q:`Chọn liên từ phù hợp: 'Cậu ấy tập luyện rất chăm chỉ mỗi ngày. ______, cậu ấy đã giành được huy chương vàng trong kỳ thi vừa qua.'`,a:[{text:`Nhờ vậy`,correct:!0,explanation:`Chỉ kết quả tích cực có được từ nỗ lực trước đó.`},{text:`Tuy nhiên`,explanation:`Ngược lại với thực tế thành công.`,correct:!1},{text:`Mặc dù`,explanation:`Không dùng để bắt đầu câu chỉ kết quả thế này.`,correct:!1},{text:`Chẳng hạn`,explanation:`Đây là kết quả cụ thể, không phải ví dụ minh họa cho tính chất của việc tập luyện.`,correct:!1}]},{q:`Chọn liên từ phù hợp: 'Bầu trời đầy mây đen và gió bắt đầu thổi mạnh. ______, chúng tôi quyết định ở lại nhà thay vì đi cắm trại.'`,a:[{text:`Vì lý do đó`,correct:!0,explanation:`Tóm gọn nguyên nhân từ thời tiết để dẫn đến quyết định.`},{text:`Tuy vậy`,explanation:`Không hợp logic (trời xấu thì ở nhà là thuậ  tránh chấn thương.'`,a:[{text:`Đồng thời`,correct:!0,explanation:`Dùng để nhắc nhở một việc cần làm song song với việc luyện tập.`},{text:`Mặc dù vậy`,explanation:`'Mặc dù vậy' cần một ý nhượng bộ, còn khởi động là lời nhắc bổ sung cùng hướng.`,correct:!1},{text:`Kết quả là`,explanation:`Khởi động không phải kết quả của bài tập nhẹ.`,correct:!1},{text:`Thay vào đó`,explanation:`Khởi động không thay thế cho bài tập nhẹ.`,correct:!1}]},{q:`Chọn câu chuyển ý phù hợp: '[Đang nói về tác hại của rác thải nhựa]. Để giải quyết vấn đề này, nhiều quốc gia đã ban hành lệnh cấm sử dụng nhựa dùng một lần.'`,a:[{text:`Trước tình hình đó`,correct:!0,explanation:`Dùng để dẫn dắt từ thực trạng vấn đề sang hành động giải quyết.`},{text:`Tuy nhiên`,explanation:`Hành động giải quyết thuận chiều với việc chống tác hại, không đối lập.`,correct:!1},{text:`Ví dụ như`,explanation:`Việc ban hành lệnh cấm là một giải pháp chung, không hẳn là ví dụ cho một tác hại cụ thể.`,correct:!1},{text:`Hơn nữa`,explanation:`Kém tự nhiên hơn cụm 'Trước tình hình đó'.`,correct:!1}]},{q:`Chọn câu chuyển ý phù hợp: '[Đang liệt kê các bước giải bài toán]. Sau khi đã tìm ra đáp số, bạn nên kiểm tra lại các bước tính toán một lần nữa.'`,a:[{text:`Cuối cùng`,correct:!0,explanation:`Dùng để chỉ bước kết thúc trong một quy trình.`},{text:`Đầu tiên`,explanation:`Đây là bước sau cùng, không phải bước đầu.`,correct:!1},{text:`Bởi vì`,explanation:`Không dùng để bắt đầu bước trong quy trình.`,correct:!1},{text:`Tuy nhiên`,explanation:`'Tuy nhiên' báo hiệu đối lập, nhưng kiểm tra lại vẫn là bước tiếp theo cùng quy trình.`,correct:!1}]},{q:`Chọn câu chuyển ý phù hợp: '[Đang nói về ưu điểm của xe đạp]. Không chỉ tốt cho sức khỏe, xe đạp còn là phương tiện vô cùng thân thiện với môi trường.'`,a:[{text:`Ngoài ra`,correct:!0,explanation:`Bổ sung thêm một ưu điểm lớn khác của xe đạp.`},{text:`Dù sao thì`,explanation:`Không hợp ngữ cảnh liệt kê ưu điểm.`,correct:!1},{text:`Vì thế`,explanation:`Sự thân thiện môi trường không phải kết quả của việc tốt cho sức khỏe.`,correct:!1},{text:`Trái lại`,explanation:`Hai ưu điểm này cùng chiều.`,correct:!1}]},{q:`Chọn câu chuyển ý phù hợp: '[Đang nói về việc chuẩn bị bài trước khi đến lớp]. Việc này giúp bạn chủ động tiếp thu kiến thức. ________, nó còn giúp bạn tự tin hơn khi phát biểu ý kiến.'`,a:[{text:`Hơn thế nữa`,correct:!0,explanation:`Nhấn mạnh thêm một lợi ích tinh thần (tự tin) sau lợi ích học thuật (chủ động).`},{text:`Tuy vậy`,explanation:`'Tuy vậy' biểu thị đối lập, trong khi hai lợi ích của việc chuẩn bị bài cùng chiều.`,correct:!1},{text:`Do đó`,explanation:`Tự tin không hoàn toàn là kết quả trực tiếp của việc tiếp thu kiến thức, mà là một lợi ích song song.`,correct:!1},{text:`Nói tóm lại`,explanation:`Chưa đến phần tóm kết.`,correct:!1}]},{q:`Chọn câu chuyển ý phù hợp: '[Đang nói về việc đi bộ buổi sáng]. Không khí trong lành lúc bình minh sẽ khiến bạn cảm thấy sảng khoái. ________, đây cũng là thời gian yên tĩnh để bạn lên kế hoạch cho ngày mới.'`,a:[{text:`Bên cạnh đó`,correct:!0,explanation:`Bổ sung thêm một lợi ích phụ của việc đi bộ buổi sáng.`},{text:`Nhưng`,explanation:`'Nhưng' cần sự đối lập, còn cảm giác sảng khoái và thời gian yên tĩnh đều là lợi ích.`,correct:!1},{text:`Vì lẽ đó`,explanation:`Lên kế hoạch không phải là kết quả của sự sảng khoái không khí.`,correct:!1},{text:`Chẳng hạn`,explanation:`Ý sau không phải ví dụ minh họa cho không khí trong lành.`,correct:!1}]},{q:`Chọn câu kết đoạn phù hợp nhất: '[Đoạn văn về lợi ích của việc tập thể dục hằng ngày]. ________.'`,a:[{text:`Tóm lại, thể dục là chìa khóa vàng để duy trì một cuộc sống khỏe mạnh và hạnh phúc.`,correct:!0,explanation:`Câu kết tóm gọn lại ý chính về lợi ích của thể dục.`},{text:`Bạn nên mua một đôi giày chạy bộ tốt.`,explanation:`Chỉ là một lời khuyên nhỏ, không tóm được ý cả đoạn.`,correct:!1},{text:`Có nhiều vận động viên nổi tiếng thế giới.`,explanation:`Tên vận động viên không tổng kết lợi ích của việc tập thể dục.`,correct:!1},{text:`Tập thể dục buổi tối cũng rất tốt.`,explanation:`Mở ra một ý mới, không phù hợp làm câu kết tóm ý.`,correct:!1}]},{q:`Chọn câu kết đoạn phù hợp: '[Đoạn văn về tác hại của việc lãng phí thực phẩm]. ________.'`,a:[{text:`Vì vậy, mỗi chúng ta hãy trân trọng thức ăn và chỉ sử dụng đủ lượng cần thiết.`,correct:!0,explanation:`Đưa ra lời khuyên thiết thực dựa trên các tác hại đã nêu.`},{text:`Thức ăn ở nhà hàng thường rất đắt đỏ.`,explanation:`Không liên quan đến ý nghĩa giáo dục của đoạn văn.`,correct:!1},{text:`Đầu bếp đã vất vả để nấu ăn.`,explanation:`Chỉ là một khía cạnh nhỏ, không bao quát ý bảo vệ môi trường/nguồn lực.`,correct:!1},{text:`Nhiều người thích ăn món Á hơn món Âu.`,explanation:`So sánh khẩu vị không kết luận được vấn đề lãng phí thực phẩm.`,correct:!1}]},{q:`Chọn câu kết đoạn phù hợp: '[Đoạn văn về tầm quan trọng của việc học ngoại ngữ]. ________.'`,a:[{text:`Nói tóm lại, ngoại ngữ là hành trang không thể thiếu để bạn tự tin vươn ra thế giới.`,correct:!0,explanation:`Kết luận khẳng định lại giá trị của ngoại ngữ đối với sự phát triển tương lai.`},{text:`Học tiếng Anh dễ hơn tiếng Pháp.`,explanation:`Câu so sánh không phù hợp làm kết đoạn tóm ý.`,correct:!1},{text:`Bạn có thể tải phần mềm dịch thuật về máy.`,explanation:`Đây là giải pháp công cụ, không phải kết luận về tầm quan trọng.`,correct:!1},{text:`Giáo viên ngoại ngữ thường rất nhiệt tình.`,explanation:`Lệch chủ đề sang đối tượng giáo viên.`,correct:!1}]},{q:`Chọn câu kết đoạn phù hợp: '[Đoạn văn về các biện pháp tiết kiệm điện]. ________.'`,a:[{text:`Hành động tiết kiệm điện nhỏ bé của mỗi cá nhân sẽ góp phần bảo vệ nguồn tài nguyên năng lượng của quốc gia.`,correct:!0,explanation:`Kết luận nêu lên ý nghĩa rộng lớn của những hành động cụ thể đã liệt kê.`},{text:`Hóa đơn tiền điện tháng này của nhà tôi rất thấp.`,explanation:`Câu chuyện cá nhân, không mang tính kết luận tổng quát.`,correct:!1},{text:`Bóng đèn sợi đốt tốn điện hơn bóng đèn LED.`,explanation:`Đây là một chi tiết hỗ trợ, không phải câu kết.`,correct:!1},{text:`Mùa hè thường xảy ra tình trạng thiếu điện.`,explanation:`Nêu thực trạng, không tóm gọn được các biện pháp.`,correct:!1}]},{q:`Chọn câu kết đoạn phù hợp: '[Đoạn văn về giá trị của tình bạn chân thành]. ________.'`,a:[{text:`Chính vì thế, hãy luôn trân trọng và vun đắp cho những tình bạn quý giá mà mình đang có.`,correct:!0,explanation:`Lời khuyên kết đoạn phù hợp với mạch cảm xúc trân trọng tình bạn.`},{text:`Bạn bè thường hay đi xem phim cùng nhau.`,explanation:`Quá đơn giản, không đủ sức nặng để kết thúc đoạn văn về giá trị.`,correct:!1},{text:`Chúng ta sẽ có thêm nhiều bạn mới khi lên lớp 10.`,explanation:`Dự đoán tương lai, không tóm được ý nghĩa của tình bạn hiện tại.`,correct:!1},{text:`Bạn không nên cho bạn vay quá nhiều tiền.`,explanation:`Lệch chủ đề sang vấn đề tài chính cá nhân.`,correct:!1}]},{q:`Chọn câu kết đoạn phù hợp: '[Đoạn văn về lợi ích của việc trồng cây xanh tại trường học]. ________.'`,a:[{text:`Có thể thấy, không gian xanh không chỉ làm đẹp trường lớp mà còn tạo môi trường học tập lý tưởng cho học sinh.`,correct:!0,explanation:`Tóm gọn cả hai giá trị: thẩm mỹ và giáo dục/sức khỏe.`},{text:`Cây bàng thường rụng lá vào mùa đông.`,explanation:`Chi tiết mô tả loài cây, không phải câu kết luận.`,correct:!1},{text:`Nhà trường cần mua thêm phân bón cho cây.`,explanation:`Lời nhắc nhở về hậu cần, không phải ý nghĩa đoạn văn.`,correct:!1},{text:`Học sinh không được ngắt lá bẻ cành.`,explanation:`Một nội quy cụ thể, không bao quát được lợi ích của cây xanh.`,correct:!1}]},{q:`Chọn câu kết đoạn phù hợp: '[Đoạn văn về các bước để có một bài thuyết trình tự tin]. ________.'`,a:[{text:`Sự chuẩn bị kỹ lưỡng và luyện tập thường xuyên chính là chìa khóa để bạn làm chủ sân khấu.`,correct:!0,explanation:`Khẳng định lại yếu tố then chốt đã trình bày trong các bước.`},{text:`Bài thuyết trình thường kéo dài khoảng 10 phút.`,explanation:`Thông tin kỹ thuật, không phải kết luận.`,correct:!1},{text:`Bạn nên dùng nhiều hình ảnh minh họa.`,explanation:`
