const fullQuestionBank=[{q:`My father always ___ up at 5:30 AM. ⏰`,a:[{text:`gets`,correct:!0,explanation:`Hiện tại đơn: Chủ ngữ 'My father' (số ít) động từ thêm 's'.`},{text:`get`,explanation:`Sai. Thiếu 's' cho ngôi thứ 3 số ít.`,correct:!1},{text:`got`,explanation:`Sai. Phương án 'got' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`getting`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`The sun ___ in the East. 🌅`,a:[{text:`rises`,correct:!0,explanation:`Hiện tại đơn: Diễn tả sự thật hiển nhiên. 'The sun' là số ít.`},{text:`rise`,explanation:`Sai. Thiếu 's'. Cách dùng phù hợp trong câu này là “rises”.`,correct:!1},{text:`rose`,explanation:`Sai. Phương án 'rose' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`rising`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`They usually ___ football after school. ⚽`,a:[{text:`play`,correct:!0,explanation:`Hiện tại đơn: Chủ ngữ 'They' (số nhiều) động từ giữ nguyên.`},{text:`plays`,explanation:`Sai. Phương án 'plays' không hòa hợp về ngôi và số với chủ ngữ 'They usually'.`,correct:!1},{text:`played`,explanation:`Sai. Động từ không chia ở thì Quá khứ đơn.`,correct:!1},{text:`playing`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`She ___ not like spicy food. 🌶️`,a:[{text:`does`,correct:!0,explanation:`Hiện tại đơn: Câu phủ định ngôi 3 số ít dùng trợ động từ 'does'.`},{text:`do`,explanation:`Sai. Phương án 'do' không hòa hợp về ngôi và số với chủ ngữ 'She'.`,correct:!1},{text:`did`,explanation:`Sai. Phương án 'did' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`is`,explanation:`Sai. Đây là câu phủ định với động từ thường 'like'; cần 'does not/doesn't', không dùng 'is'.`,correct:!1}]},{q:`___ you speak English? 🗣️`,a:[{text:`Do`,correct:!0,explanation:`Hiện tại đơn: Câu hỏi với 'You' dùng trợ động từ 'Do'.`},{text:`Does`,explanation:`Sai. Phương án 'Does' không hòa hợp chủ vị với chủ ngữ trong câu.`,correct:!1},{text:`Are`,explanation:`Sai. Động từ thường 'speak' không đi với tobe.`,correct:!1},{text:`Did`,explanation:`Sai ngữ cảnh (thường hỏi khả năng hiện tại).`,correct:!1}]},{q:`Water ___ at 100 degrees Celsius. 💧`,a:[{text:`boils`,correct:!0,explanation:`Hiện tại đơn: Sự thật vật lý. 'Water' không đếm được (số ít).`},{text:`boil`,explanation:`Sai. Từ vựng hoặc dạng từ 'boil' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`boiled`,explanation:`Sai. Động từ không chia ở thì Quá khứ đơn.`,correct:!1},{text:`boiling`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`My sister ___ her homework every evening. 📝`,a:[{text:`does`,correct:!0,explanation:`Hiện tại đơn: 'My sister' (số ít) đi với 'does'.`},{text:`do`,explanation:`Sai. Với chủ ngữ số ít 'My sister' ở hiện tại đơn, động từ 'do' phải chia thành 'does'.`,correct:!1},{text:`did`,explanation:`Sai. Dấu hiệu hoặc ngữ cảnh trong câu ở hiện tại, không dùng thì Quá khứ.`,correct:!1},{text:`doing`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`The train ___ at 8:00 PM tonight. 🚂`,a:[{text:`leaves`,correct:!0,explanation:`Hiện tại đơn: Diễn tả lịch trình tàu xe cố định.`},{text:`leave`,explanation:`Sai. Từ vựng hoặc dạng từ 'leave' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`left`,explanation:`Sai. 'Left' là quá khứ; lịch tàu lúc 8 PM tối nay dùng hiện tại đơn theo lịch trình: 'leaves'.`,correct:!1},{text:`leaving`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`We ___ biology on Mondays. 🧬`,a:[{text:`don't have`,correct:!0,explanation:`Hiện tại đơn: Phủ định với 'We' dùng 'don't'.`},{text:`doesn't have`,explanation:`Sai. Phương án 'doesn't have' không hòa hợp về ngôi và số với chủ ngữ 'We'.`,correct:!1},{text:`didn't have`,explanation:`Sai. Dấu hiệu hoặc ngữ cảnh trong câu ở hiện tại, không dùng thì Quá khứ.`,correct:!1},{text:`not have`,explanation:`Sai cấu trúc: phủ định hiện tại đơn dùng 'don't have', không dùng 'not have'.`,correct:!1}]},{q:`___ John play the guitar? 🎸`,a:[{text:`Does`,correct:!0,explanation:`Hiện tại đơn: 'John' là ngôi 3 số ít dùng 'Does'.`},{text:`Do`,explanation:`Sai. 'Do' là trợ động từ hiện tại đơn cho số nhiều và I/you, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`Is`,explanation:`Sai ngữ pháp với động từ thường.`,correct:!1},{text:`Has`,explanation:`Sai. 'Has' chỉ đi với cấu trúc hoàn thành như 'has played'; trước động từ nguyên mẫu 'play' phải dùng 'Does'.`,correct:!1}]},{q:`I ___ sad when it rains. 🌧️`,a:[{text:`feel`,correct:!0,explanation:`Hiện tại đơn: 'I' đi với động từ nguyên mẫu.`},{text:`feels`,explanation:`Sai. Từ vựng hoặc dạng từ 'feels' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`felt`,explanation:`Sai. 'Felt' là quá khứ; câu diễn tả cảm xúc lặp lại khi trời mưa nên dùng hiện tại đơn 'feel'.`,correct:!1},{text:`feeling`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`Cats ___ mice. 🐈`,a:[{text:`catch`,correct:!0,explanation:`Hiện tại đơn: 'Cats' (số nhiều) giữ nguyên động từ.`},{text:`catches`,explanation:`Sai. Từ vựng hoặc dạng từ 'catches' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`caught`,explanation:`Sai thì: mốc quá khứ yêu cầu quá khứ đơn 'caught', không dùng nguyên mẫu 'catch'.`,correct:!1},{text:`catching`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`He usually ___ hard for the exam. 📚`,a:[{text:`studies`,correct:!0,explanation:`Hiện tại đơn: Chỉ thói quen 'usually'.`},{text:`study`,explanation:`Sai. Từ vựng hoặc dạng từ 'study' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`studied`,explanation:`Sai. Động từ không chia ở thì Quá khứ đơn.`,correct:!1},{text:`studying`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`The Earth ___ around the Sun. 🌍`,a:[{text:`goes`,correct:!0,explanation:`Hiện tại đơn: Chân lý. 'The Earth' là số ít.`},{text:`go`,explanation:`Sai. Từ vựng hoặc dạng từ 'go' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`went`,explanation:`Sai. 'Went' là quá khứ; câu nêu sự thật khoa học nên dùng hiện tại đơn 'goes'.`,correct:!1},{text:`gone`,explanation:`Sai. 'Gone' là quá khứ phân từ, cần trợ động từ trong cấu trúc hoàn thành; câu này dùng hiện tại đơn 'goes'.`,correct:!1}]},{q:`My mom never ___ coffee. ☕`,a:[{text:`drinks`,correct:!0,explanation:`Hiện tại đơn: 'My mom' (số ít) thêm 's'.`},{text:`drink`,explanation:`Sai. Từ vựng hoặc dạng từ 'drink' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`drank`,explanation:`Sai. 'Drank' là quá khứ; 'never' ở đây diễn tả thói quen hiện tại nên dùng 'drinks'.`,correct:!1},{text:`drinking`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`They ___ often go to the cinema. 🎬`,a:[{text:`don't`,correct:!0,explanation:`Hiện tại đơn: Phủ định với 'They'.`},{text:`doesn't`,explanation:`Sai. Từ vựng hoặc dạng từ 'doesn't' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`didn't`,explanation:`Sai. Phương án 'didn't' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`aren't`,explanation:`Sai cấu trúc: câu dùng động từ 'be', cần 'are/is', không dùng trợ động từ 'do'.`,correct:!1}]},{q:`Where ___ you live? 🏠`,a:[{text:`do`,correct:!0,explanation:`Hiện tại đơn: Câu hỏi với 'you'.`},{text:`does`,explanation:`Sai. 'does' là trợ động từ hiện tại đơn cho ngôi thứ 3 số ít, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`are`,explanation:`Sai. 'Are' phải đi với chủ ngữ và bổ ngữ phù hợp của động từ to be; trước động từ thường 'live' cần trợ động từ 'do'.`,correct:!1},{text:`is`,explanation:`Sai. 'Is' là to be và không thể đứng trước động từ thường 'live'; câu hỏi hiện tại dùng 'Do you live...?'.`,correct:!1}]},{q:`Tom ___ his teeth twice a day. 🪥`,a:[{text:`brushes`,correct:!0,explanation:`Hiện tại đơn: 'Tom' (số ít) thêm 'es'.`},{text:`brush`,explanation:`Sai. Từ vựng hoặc dạng từ 'brush' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`brushed`,explanation:`Sai. Động từ không chia ở thì Quá khứ đơn.`,correct:!1},{text:`brushing`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`It ___ a lot in summer here. ☔`,a:[{text:`rains`,correct:!0,explanation:`Hiện tại đơn: 'It' (số ít).`},{text:`rain`,explanation:`Sai. Từ vựng hoặc dạng từ 'rain' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`raining`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1},{text:`rained`,explanation:`Sai ngữ cảnh 'summer here' (sự thật).`,correct:!1}]},{q:`___ she know the answer? ❓`,a:[{text:`Does`,correct:!0,explanation:`Hiện tại đơn: 'She' dùng 'Does'.`},{text:`Do`,explanation:`Sai. 'Do' là trợ động từ hiện tại đơn cho số nhiều và I/you, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`Is`,explanation:`Sai. 'Is' không làm trợ động từ cho động từ thường 'know'; với 'she' phải dùng 'Does'.`,correct:!1},{text:`Has`,explanation:`Sai. 'Has' chỉ phù hợp với chủ ngữ she/he/it trong cấu trúc hoàn thành; trước 'know' ở hiện tại đơn phải dùng 'Does'.`,correct:!1}]},{q:`I ___ to the zoo yesterday. 🦁`,a:[{text:`went`,correct:!0,explanation:`Quá khứ đơn: 'Yesterday' là dấu hiệu. V2 của go là went.`},{text:`go`,explanation:`Sai thì: chủ ngữ 'I' ở hiện tại dùng 'am/been', không dùng quá khứ 'was'.`,correct:!1},{text:`gone`,explanation:`Sai (V3). Cách dùng phù hợp trong câu này là “went”.`,correct:!1},{text:`going`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`She ___ a new dress last week. 👗`,a:[{text:`bought`,correct:!0,explanation:`Quá khứ đơn: 'Last week' là dấu hiệu. V2 của buy là bought.`},{text:`buy`,explanation:`Sai. 'Buy' là nguyên mẫu hiện tại; mốc 'last week' yêu cầu quá khứ 'bought'.`,correct:!1},{text:`buys`,explanation:`
