tton class=btn id=prev-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class=btn id=next-btn type=button>Tiếp tục<i class="fa-solid fa-arrow-right"></i></button><button class="btn is-initially-hidden" id=submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=confirm-back-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class="btn is-initially-hidden" id=confirm-submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=reset-btn type=button>Làm lại</button></div></div><footer class=dec-footer>Bản quyền thuộc về DEC - thầy Đức tiếng Anh - 0966939583</footer></div><script>// --- DUKEGEM QUESTION BANK
const fullQuestionBank=[{q:`She has been a doctor for ten years.`,a:[{text:`She became a doctor ten years ago.`,correct:!0,explanation:`HTHT với 'for ten years' chuyển thành mốc bắt đầu ở quá khứ: 'became a doctor ten years ago'.`},{text:`She was a doctor since ten years.`,explanation:`Since không đi với khoảng thời gian.`,correct:!1},{text:`She has started being a doctor ten years ago.`,explanation:`Started là mốc quá khứ, không dùng HTHT.`,correct:!1},{text:`It is ten years since she is a doctor.`,explanation:`Cấu trúc đúng: It is + thời gian + since + S + V2/ed.`,correct:!1}]},{q:`We shouldn't go out because it is raining heavily.`,a:[{text:`If it weren't raining heavily, we could go out.`,correct:!0,explanation:`Câu điều kiện loại 2 diễn tả sự việc trái ngược hiện tại.`},{text:`If it rains heavily, we won't go out.`,explanation:`Đây là điều kiện loại 1, không đổi cấu trúc từ 'because'.`,correct:!1},{text:`Unless it rains, we should go out.`,explanation:`Sai. Phương án 'Unless it rains, we should go out.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`Because of the heavy rain, we go out.`,explanation:`Ngược nghĩa câu gốc.`,correct:!1}]},{q:`The task was so difficult that I couldn't finish it.`,a:[{text:`It was such a difficult task that I couldn't finish it.`,correct:!0,explanation:`So + Adj + That = Such + (a/an) + Adj + N + That.`},{text:`The task was too difficult that I couldn't finish it.`,explanation:`Too... to V, không dùng với That.`,correct:!1},{text:`It was so a difficult task that I couldn't finish.`,explanation:`Sai vị trí từ 'so'. Cách dùng phù hợp trong câu này là “It was such a difficult task that I couldn't finish it.”.`,correct:!1},{text:`The task wasn't easy enough for me finishing.`,explanation:`Enough to V (nguyên mẫu).`,correct:!1}]},{q:`They will build a new bridge across the river next year.`,a:[{text:`A new bridge will be built across the river next year.`,correct:!0,explanation:`Câu bị động thì Tương lai đơn: will be + P2.`},{text:`A new bridge will build across the river.`,explanation:`Cầu không tự xây, thiếu 'be built'.`,correct:!1},{text:`A new bridge is built across the river.`,explanation:`Sai. Dấu hiệu 'next year' không phù hợp với thì/cấu trúc của phương án 'A new bridge is built across the river.'.`,correct:!1},{text:`A new bridge will be build across the river.`,explanation:`P2 của build là built.`,correct:!1}]},{q:`I haven't seen my uncle for two years.`,a:[{text:`The last time I saw my uncle was two years ago.`,correct:!0,explanation:`Phủ định HTHT + for = The last time + QKĐ + was + ago.`},{text:`I didn't see my uncle two years ago.`,explanation:`Sai nghĩa (chỉ nói về một thời điểm cụ thể).`,correct:!1},{text:`It is two years since I haven't seen my uncle.`,explanation:`Sau since dùng câu khẳng định QKĐ.`,correct:!1},{text:`I last saw my uncle since two years.`,explanation:`Last saw đi với 'ago'.`,correct:!1}]},{q:`Although he was very tired, he still helped me with my homework.`,a:[{text:`Despite being very tired, he still helped me with my homework.`,correct:!0,explanation:`Although + Clause = Despite/In spite of + V-ing/N.`},{text:`Despite he was tired, he helped me.`,explanation:`Despite không đi với một mệnh đề.`,correct:!1},{text:`In spite of his tired, he helped me.`,explanation:`Tired là tính từ, sau In spite of cần danh từ (tiredness) hoặc V-ing.`,correct:!1},{text:`He was tired, but he doesn't help me.`,explanation:`Mệnh đề sau dùng 'doesn't help' ở hiện tại, không giữ được thì quá khứ và ý tương phản của câu gốc.`,correct:!1}]},{q:`‘Don’t forget to do your chores,’ said my mother.`,a:[{text:`My mother reminded me to do my chores.`,correct:!0,explanation:`Don't forget/Remember to V = Remind someone to V.`},{text:`My mother told me don't forget to do chores.`,explanation:`Câu gián tiếp không dùng 'don't' mà dùng 'not to'.`,correct:!1},{text:`My mother suggested me to do chores.`,explanation:`Suggest + V-ing / Suggest that S should.`,correct:!1},{text:`My mother said me to do chores.`,explanation:`Said to me hoặc Told me.`,correct:!1}]},{q:`He is the most intelligent student in the class.`,a:[{text:`No other student in the class is as intelligent as he is.`,correct:!0,explanation:`So sánh nhất = Không ai bằng.`},{text:`He is more intelligent as any student.`,explanation:`So sánh hơn dùng 'than'.`,correct:!1},{text:`No other student is as intelligent than he is.`,explanation:`Sai cấu trúc so sánh: không dùng 'as ... than'; phải dùng 'as ... as' hoặc 'more ... than'.`,correct:!1},{text:`He is as intelligent as no one.`,explanation:`Sai. Phương án 'He is as intelligent as no one.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`I started learning English when I was seven, and I still study it now.`,a:[{text:`I have been learning English since I was seven.`,correct:!0,explanation:`Started V-ing when + QKĐ = Have/Has P2/V-ing since + QKĐ.`},{text:`I learned English for seven years.`,explanation:`Sai nghĩa (đã học được 7 năm khác với bắt đầu từ lúc 7 tuổi).`,correct:!1},{text:`I have learned English since seven years.`,explanation:`Since đi với mốc thời gian, không đi với khoảng thời gian.`,correct:!1},{text:`I start learning English for seven years ago.`,explanation:`'Start' ở hiện tại và 'for seven years ago' kết hợp sai; cần hiện tại hoàn thành tiếp diễn với 'since I was seven'.`,correct:!1}]},{q:`You should brush your teeth after every meal.`,a:[{text:`It is advisable for you to brush your teeth after every meal.`,correct:!0,explanation:`Should V = It is advisable/important (for O) to V.`},{text:`You must to brush your teeth.`,explanation:`Must không đi với 'to'.`,correct:!1},{text:`It's a good idea brushing your teeth.`,explanation:`Good idea + to V. Cách dùng phù hợp trong câu này là “It is advisable for you to brush your teeth after every meal.”.`,correct:!1},{text:`You should to brush your teeth.`,explanation:`Should không đi với 'to'.`,correct:!1}]},{q:`‘I will help you with your project,’ Nam said to me.`,a:[{text:`Nam promised to help me with my project.`,correct:!0,explanation:`Will help = Promise to help (Lời hứa).`},{text:`Nam said he will help me.`,explanation:`Lùi thì 'will' thành 'would' trong câu gián tiếp.`,correct:!1},{text:`Nam told me that he would help you.`,explanation:`Phải đổi 'you' thành 'me'.`,correct:!1},{text:`Nam offered help me.`,explanation:`Offer to V. Cách dùng phù hợp trong câu này là “Nam promised to help me with my project.”.`,correct:!1}]},{q:`The weather was too cold for us to go swimming.`,a:[{text:`The weather was not warm enough for us to go swimming.`,correct:!0,explanation:`Too + Adj (tiêu cực) = Not + Adj (tích cực) + enough.`},{text:`The weather was enough cold for us.`,explanation:`Enough đứng sau tính từ.`,correct:!1},{text:`The weather was so cold to go swimming.`,explanation:`So... that, không dùng So... to V.`,correct:!1},{text:`We were too cold to going swimming.`,explanation:`Too... to V (nguyên mẫu).`,correct:!1}]},{q:`Rewrite using a superlative: Nobody in my family is as tall as my brother.`,a:[{text:`My brother is the tallest person in my family.`,correct:!0,explanation:`Đúng nghĩa và dùng so sánh nhất như yêu cầu.`},{text:`My brother is taller as everyone in my family.`,explanation:`Sai cấu trúc; so sánh hơn dùng 'than'.`,correct:!1},{text:`My brother is as tall as nobody.`,explanation:`Sai cấu trúc. Phương án 'My brother is as tall as nobody.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`My brother is the taller in my family.`,explanation:`So sánh nhất dùng 'the tallest'.`,correct:!1}]},{q:`I haven't been to a concert for a long time.`,a:[{text:`It's a long time since I last went to a concert.`,correct:!0,explanation:`Haven't been... for = It's + time + since + S + last + V2/ed.`},{text:`I didn't go to a concert for a long time.`,explanation:`Dùng HTHT để diễn tả việc kéo dài đến nay.`,correct:!1},{text:`The last time I go to a concert was long ago.`,explanation:`Sau 'last time' dùng QKĐ (went).`,correct:!1},{text:`I have been to a concert long ago.`,explanation:`Ago dùng với QKĐ, không dùng HTHT.`,correct:!1}]},{q:`Unless you study harder, you will fail the final exam.`,a:[{text:`If you don't study harder, you will fail the final exam.`,correct:!0,explanation:`Unless = If... not. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`If you study harder, you will fail.`,explanation:`Bỏ 'unless' thành 'if' phải thêm phủ định; phương án này lại khẳng định học chăm sẽ trượt.`,correct:!1},{text:`Unless you don't study harder, you'll fail.`,explanation:`'Unless' đã mang nghĩa 'if not', nên không thêm 'don't' trong mệnh đề điều kiện.`,correct:!1},{text:`If you don't study harder, you won't fail.`,explanation:`Mệnh đề kết quả phải là 'will fail', không phải 'won't fail', để giữ nguyên nghĩa câu gốc.`,correct:!1}]},{q:`It is a pity that I don't have a new bike.`,a:[{text:`I wish I had a new bike.`,correct:!0,explanation:`It's a pity (thật tiếc) = Câu ước loại 2 (Wish + QKĐ).`},{text:`I wish I have a new bike.`,explanation:`Câu ước hiện tại phải lùi thì về QKĐ.`,correct:!1},{text:`I wish I will have a new bike.`,explanation:`Sai cấu trúc câu ước hiện tại.`,correct:!1},{text:`I wish I don't have a bike.`,explanation:`Ước ngược lại với thực tế.`,correct:!1}]},{q:`He wrote the letter in twenty minutes.`,a:[{text:`It took him twenty minutes to write the letter.`,correct:!0,explanation:`S + V + in (time) = It took + O + time + to V.`},{text:`He spent twenty minutes to write the letter.`,explanation:`Spend + V-ing. Cách dùng phù hợp trong câu này là “It took him twenty minutes to write the letter.”.`,correct:!1},{text:`It took him twenty minutes writing the letter.`,explanation:`Take + to V. Cách dùng phù hợp trong câu này là “It took him twenty minutes to write the letter.”.`,correct:!1},{text:`Writing the letter took his twenty minutes.`,explanation:`Dùng đại từ tân ngữ 'him'.`,correct:!1}]},{q:`They are going to paint the fence tomorrow.`,a:[{text:`The fence is going to be painted tomorrow.`,correct:!0,explanation:`Bị động với 'be going to': is/are going to be + P2.`},{text:`The fence are going to be painted.`,explanation:`Fence là số ít, dùng 'is'.`,correct:!1},{text:`The fence is going to paint.`,explanation:`Thiếu 'be + P2'. Cách dùng phù hợp trong câu này là “The fence is going to be painted tomorrow.”.`,correct:!1},{text:`The fence will be paint tomorrow.`,explanation:`Cấu trúc gốc là 'going to', và P2 là 'painted'.`,correct:!1}]},{q:`Because of the heavy snow, the flight was delayed.`,a:[{text:`Because it snowed heavily, the flight was delayed.`,correct:!0,explanation:`Because of + Cụm danh từ = Because + Mệnh đề.`},{text:`Because the snow was heavy, so the flight was delayed.`,explanation:`Không dùng 'so' khi đã có 'because'.`,correct:!1},{text:`Because of it snowed heavily, the flight was delayed.`,explanation:`Because of không đi với mệnh đề.`,correct:!1},{text:`The flight was delayed though it snowed heavily.`,explanation:`Sai. Phương án 'The flight was delayed though it snowed heavily.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`May I borrow your pen, please?`,a:[{text:`Would you mind lending me your pen?`,correct:!0,explanation:`May I borrow...? = Would you mind lending...? (Cho mượn).`},{text:`Would you mind if I lend your pen?`,explanation:`Borrow (mượn), Lend (cho mượn). Người nói muốn mượn.`,correct:!1},{text:`Would you mind to lend me your pen?`,explanation:`Mind + V-ing. Cách dùng phù hợp trong câu này là “Would you mind lending me your pen?”.`,correct:!1},{text:`Do you mind if I borrowing your pen?`,explanation:`Do you mind if I + V (hiện tại đơn).`,correct:!1}]},{q:`He doesn't have enough money to buy that car.`,a:[{text:`That car is too expensive for him to buy.`,correct:!0,explanation:`Không đủ tiền = Quá đắt.`},{text:`He is too poor to buy that car.`,explanation:`Câu này có thể gần nghĩa, nhưng yêu cầu đổi cấu trúc theo nguyên nhân giá xe: 'too expensive for him to buy'.`,correct:!1},{text:`The car is cheap enough for him to buy.`,explanation:`'Cheap enough' cho thấy xe đủ rẻ để mua, trái với thông tin anh ấy không đủ tiền.`,correct:!1},{text:`He has enough money to buy that car.`,explanation:`'Enough money' khẳng định anh ấy đủ tiền, ngược với câu gốc.`,correct:!1}]},{q:`I suggest going to the beach this weekend.`,a:[{text:`How about going to the beach this weekend?`,correct:!0,explanation:`Suggest + V-ing = How about + V-ing?`},{text:`Why don't we going to the beach?`,explanation:`Why don't we + V (nguyên mẫu).`,correct:!1},{text:`I suggest we to go to the beach.`,explanation:`Suggest that S (should) V.`,correct:!1},{text:`Let's to go to the beach.`,explanation:`Let's + V (nguyên mẫu).`,correct:!1}]},{q:`They have never visited London before. (Keep the present perfect meaning.)`,a:[{text:`This is the first time they have visited London.`,correct:!0,explanation:`Never... before = This is the first time.`},{text:`They visited London for the first time before.`,explanation:`Sai. Phương án 'They visited London for the first time before.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`This is the first time they visited London.`,explanation:`Sau 'first time' dùng HTHT.`,correct:!1},{text:`They have visited London many times.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “This is the first time they have visited London.”.`,correct:!1}]},{q:`I didn't go to school yesterday because I was sick.`,a:[{text:`I was sick, so I didn't go to school yesterday.`,correct:!0,explanation:`Because S1 V1, S2 V2 = S1 V1, so S2 V2.`},{text:`Because of I was sick, I didn't go to school.`,explanation:`Because of + N/V-ing.`,correct:!1},{text:`I was sick because I didn't go to school.`,explanation:`Sai quan hệ nguyên nhân - kết quả.`,correct:!1},{text:`Although I was sick, I didn't go to school.`,explanation:`Sai. Phương án 'Although I was sick, I didn't go to school.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`‘Can you open the window, please?’ said the teacher.`,a:[{text:`The teacher asked me to open the window.`,correct:!0,explanation:`Câu yêu cầu: S + asked + O + to V.`},{text:`The teacher said me to open the window.`,explanation:`Said to me / Told me.`,correct:!1},{text:`The teacher asked if I can open the window.`,explanation:`Lùi thì 'can' thành 'could'.`,correct:!1},{text:`The teacher told to me to open the window.`,explanation:`Told me (không có 'to').`,correct:!1}]},{q:`This is the house. I was born in it.`,a:[{text:`This is the house where I was born.`,correct:!0,explanation:`Where = In which (thay thế trạng từ chỉ nơi chốn).`},{text:`This is the house which I was born.`,explanation:`Thiếu 'in' ở cuối hoặc dùng 'in which'.`,correct:!1},{text:`This is the house who I was born.`,explanation:`Who dùng cho người. Cách dùng phù hợp trong câu này là “This is the house where I was born.”.`,correct:!1},{text:`This is where house I was born.`,explanation:`Sai. Phương án 'This is where house I was born.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`Rewrite using 'not as ... as': My sister is a better singer than me.`,a:[{text:`I don't sing as well as my sister.`,correct:!0,explanation:`Đúng nghĩa và dùng cấu trúc được yêu cầu.`},{text:`I sing worse as my sister.`,explanation:`Sai. Phương án 'I sing worse as my sister.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`My sister sings as well as me.`,explanation:`Sai nghĩa vì diễn đạt ngang bằng.`,correct:!1},{text:`I am a better singer as my sister.`,explanation:`So sánh hơn dùng 'than'.`,correct:!1}]},{q:`They have cleaned the room. (Rewrite in the present perfect passive.)`,a:[{text:`The room has been cleaned.`,correct:!0,explanation:`Bị động thì HTHT: have/has been + P2.`},{text:`The room have been cleaned.`,explanation:`Room là số ít, dùng 'has'.`,correct:!1},{text:`The room was cleaned.`,explanation:`Sai. Phương án 'The room was cleaned.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`The room has cleaned.`,explanation:`Thiếu 'been'. Cách dùng phù hợp trong câu này là “The room has been cleaned.”.`,correct:!1}]},{q:`We spent two hours doing the gardening.`,a:[{text:`It took us two hours to do the gardening.`,correct:!0,explanation:`Spend + time + V-ing = It take + O + time + to V.`},{text:`We took two hours to doing the gardening.`,explanation:`Sau 'take + khoảng thời gian' dùng 'to do', không dùng dạng V-ing.`,correct:!1},{text:`The gardening spent us two hours.`,explanation:`Với cấu trúc 'spend + thời gian', chủ ngữ phải là người thực hiện hoạt động, không phải 'the gardening'.`,correct:!1},{text:`It took us two hours doing the gardening.`,explanation:`Cấu trúc tương đương cần 'It took us two hours to do...'; sau thời gian phải là 'to do'.`,correct:!1}]},{q:`Rewrite using 'so ... that': She is too old to participate in the race.`,a:[{text:`She is so old that she can't participate in the race.`,correct:!0,explanation:`Đúng nghĩa và dùng 'so ... that' như yêu cầu.`},{text:`She is not young to participate in the race.`,explanation:`Sai. Phương án 'She is not young to participate in the race.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`She is enough old to participate.`,explanation:`'Enough' đứng sau tính từ.`,correct:!1},{text:`She is too old so she can't participate.`,explanation:`Sai cấu trúc. Phương án 'She is too old so she can't participate.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`I am interested in learning about space.`,a:[{text:`Learning about space interests me.`,correct:!0,explanation:`Be interested in something = Something interests someone.`},{text:`I find learn about space interesting.`,explanation:`Find + V-ing + Adj. Cách dùng phù hợp trong câu này là “Learning about space interests me.”.`,correct:!1},{text:`Space is interested to me.`,explanation:`Sự vật dùng 'interesting'.`,correct:!1},{text:`I am interesting in learning about space.`,explanation:`Người dùng 'interested'.`,correct:!1}]},{q:`He often goes to the library by bike.`,a:[{text:`He often cycles to the library.`,correct:!0,explanation:`Go by bike = Cycle. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`He often go to the library by bike.`,explanation:`Chủ ngữ số ít 'He' động từ thêm 'es'.`,correct:!1},{text:`He cycles the library by bike.`,explanation:`Thừa từ. Cách dùng phù hợp trong câu này là “He often cycles to the library.”.`,correct:!1},{text:`He is cycling to the library often.`,explanation:`Sai. Dấu hiệu 'by bike' không phù hợp với thì/cấu trúc của phương án 'He is cycling to the library often.'.`,correct:!1}]},{q:`Although the test was long, he finished it on time.`,a:[{text:`In spite of the long test, he finished it on time.`,correct:!0,explanation:`Although + Clause = In spite of + Noun Phrase.`},{text:`Despite the test was long, he finished it.`,explanation:`Despite không đi với mệnh đề.`,correct:!1},{text:`In spite of being long test, he finished it.`,explanation:`Thiếu mạo từ 'a' (a long test).`,correct:!1},{text:`He finished the test though it is long.`,explanation:`Sai. Phương án 'He finished the test though it is long.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`‘I have already finished my dinner,’ she said. (Use reported speech with backshift.)`,a:[{text:`She said that she had already finished her dinner.`,correct:!0,explanation:`Gián tiếp: Hiện tại hoàn thành -> Quá khứ hoàn thành.`},{text:`She said she has already finished her dinner.`,explanation:`Chưa lùi thì. Cách dùng phù hợp trong câu này là “She said that she had already finished her dinner.”.`,correct:!1},{text:`She said she had finished my dinner.`,explanation:`Phải đổi 'my' thành 'her'.`,correct:!1},{text:`She told me she already finished her dinner.`,explanation:`Thiếu 'had' (quá khứ hoàn thành).`,correct:!1}]},{q:`We can't go on a picnic because the weather is bad.`,a:[{text:`If the weather weren't bad, we could go on a picnic.`,correct:!0,explanation:`Trái thực tế hiện tại dùng câu điều kiện loại 2.`},{text:`If the weather is bad, we can't go.`,explanation:`Đây là điều kiện loại 1, chỉ nhắc lại thực tế.`,correct:!1},{text:`Unless the weather isn't bad, we can go.`,explanation:`Chưa đúng khi chọn “Unless the weather isn't bad, we can go.”. Đúng về ngữ pháp nhưng câu A đổi cấu trúc mạnh hơn.`,correct:!1},{text:`If the weather was bad, we could go.`,explanation:`Sai logic (Nếu thời tiết xấu, chúng ta có thể đi? - Sai).`,correct:!1}]},{q:`Reading books is very useful.`,a:[{text:`It is very useful to read books.`,correct:!0,explanation:`V-ing + is + Adj = It is + Adj + to V.`},{text:`It is very useful reading books.`,explanation:`It is + Adj + to V. Cách dùng phù hợp trong câu này là “It is very useful to read books.”.`,correct:!1},{text:`Read books is very useful.`,explanation:`Động từ làm chủ ngữ phải là V-ing.`,correct:!1},{text:`To read books being very useful.`,explanation:`Sai. Phương án 'To read books being very useful.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`My father used to smoke when he was young.`,a:[{text:`My father no longer smokes.`,correct:!0,explanation:`Used to V (đã từng làm gì) = No longer V-s (không còn làm nữa).`},{text:`My father is used to smoke.`,explanation:`Be used to + V-ing (quen với việc gì).`,correct:!1},{text:`My father usually smokes when he was young.`,explanation:`Usually dùng cho hiện tại, quá khứ dùng used to.`,correct:!1},{text:`My father doesn't smoke when he was young.`,explanation:`Sai logic. Cách dùng phù hợp trong câu này là “My father no longer smokes.”.`,correct:!1}]},{q:`I prefer watching TV to reading newspapers.`,a:[{text:`I would rather watch TV than read newspapers.`,correct:!0,explanation:`Prefer V-ing to V-ing = Would rather V th ketball.”.`,correct:!1}]},{q:`The film was so boring that we left early.`,a:[{text:`It was such a boring film that we left early.`,correct:!0,explanation:`So + Adj + That = Such + a/an + Adj + N + That.`},{text:`The film was too boring to leave early.`,explanation:`Sai nghĩa (quá chán để mà rời đi sớm? - Sai logic cấu trúc này).`,correct:!1},{text:`It was so boring film that we left early.`,explanation:`Thiếu 'a' và sai vị trí 'so'.`,correct:!1},{text:`We left early because the film is boring.`,explanation:`Sai. Phương án 'We left early because the film is boring.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`I haven't eaten out for three months.`,a:[{text:`The last time I ate out was three months ago.`,correct:!0,explanation:`Haven't + for = Last time... was... ago.`},{text:`I didn't eat out three months ago.`,explanation:`Sai. Cấu trúc 'I didn't eat out three months ago.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`It is three months since I last eat out.`,explanation:`Sau since dùng QKĐ (ate).`,correct:!1},{text:`I haven't eaten out since three months.`,explanation:`Since + mốc thời gian.`,correct:!1}]},{q:`They have built a new hospital in the city center.`,a:[{text:`A new hospital has been built in the city center.`,correct:!0,explanation:`Bị động HTHT: have/has been + P2.`},{text:`A new hospital have been built.`,explanation:`Hospital là số ít, dùng 'has'.`,correct:!1},{text:`A new hospital was built.`,explanation:`Sai. Phương án 'A new hospital was built.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`A new hospital has built.`,explanation:`Thiếu 'been'. Cách dùng phù hợp trong câu này là “A new hospital has been built in the city center.”.`,correct:!1}]},{q:`I wish I had more free time.`,a:[{text:`I don't have much free time.`,correct:!0,explanation:`Wish + QKĐ = Thực tế hiện tại ở dạng phủ định.`},{text:`I have more free time.`,explanation:`Ngược với thực tế. Cách dùng phù hợp trong câu này là “I don't have much free time.”.`,correct:!1},{text:`I will have more free time.`,explanation:`Câu ước ở hiện tại không dùng will.`,correct:!1},{text:`I didn't have more free time.`,explanation:`Ước cho hiện tại, thực tế là 'don't have'.`,correct:!1}]},{q:`Although the traffic was bad, we arrived on time.`,a:[{text:`Despite the bad traffic, we arrived on time.`,correct:!0,explanation:`Although + Clause = Despite + Noun Phrase.`},{text:`In spite of the traffic was bad, we arrived.`,explanation:`In spite of không đi với mệnh đề.`,correct:!1},{text:`Despite of the bad traffic, we arrived.`,explanation:`Despite không có 'of'.`,correct:!1},{text:`Even though the bad traffic, we arrived.`,explanation:`Even though + mệnh đề.`,correct:!1}]},{q:`‘Where are you going for your holidays?’ Nam asked me. (Use reported speech with backshift.)`,a:[{text:`Nam asked me where I was going for my holidays.`,correct:!0,explanation:`Câu hỏi Wh-: S + asked + O + Wh- + S + V (lùi thì).`},{text:`Nam asked me where was I going.`,explanation:`Trong câu gián tiếp không đảo ngữ.`,correct:!1},{text:`Nam asked me where you were going.`,explanation:`Đổi 'you' thành 'I' (vì Nam hỏi 'me').`,correct:!1},{text:`Nam asked me where I am going.`,explanation:`Chưa lùi thì. Cách dùng phù hợp trong câu này là “Nam asked me where I was going for my holidays.”.`,correct:!1}]},{q:`You should take a taxi instead of walking.`,a:[{text:`I suggest taking a taxi instead of walking.`,correct:!0,explanation:`You should = I suggest + V-ing.`},{text:`How about to take a taxi?`,explanation:`How about + V-ing. Cách dùng phù hợp trong câu này là “I suggest taking a taxi instead of walking.”.`,correct:!1},{text:`Why don't we to take a taxi?`,explanation:`Why don't we + V nguyên mẫu.`,correct:!1},{text:`You'd better to take a taxi.`,explanation:`Had better + V nguyên mẫu (không có 'to').`,correct:!1}]},{q:`He is the most skillful player in the team.`,a:[{text:`No one in the team plays as skillfully as he does.`,correct:!0,explanation:`So sánh nhất (Adj + N) -> So sánh không bằng (V + Adv).`},{text:`He plays more skillful than anyone.`,explanation:`'Plays' cần trạng từ 'skillfully', không dùng tính từ 'skillful' để bổ nghĩa cho động từ.`,correct:!1},{text:`No one plays more skillfully as him.`,explanation:`Trong so sánh hơn phải dùng liên từ 'than', không dùng 'as'.`,correct:!1},{text:`He is a more skillful player as anyone.`,explanation:`Cấu trúc 'more...than anyone' không dùng 'as'; hơn nữa câu gốc yêu cầu so sánh nhất về cả đội.`,correct:!1}]},{q:`It takes her an hour to travel to work every day.`,a:[{text:`She spends an hour traveling to work every day.`,correct:!0,explanation:`It takes + O + time + to V = S + spend + time + V-ing.`},{text:`She takes an hour to traveling to work.`,explanation:`Sai cấu trúc. Phương án 'She takes an hour to traveling to work.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`She spends an hour to travel to work.`,explanation:`Spend + V-ing. Cách dùng phù hợp trong câu này là “She spends an hour traveling to work every day.”.`,correct:!1},{text:`Traveling to work take her an hour.`,explanation:`V-ing làm chủ ngữ động từ thêm 's' (takes).`,correct:!1}]},{q:`Unless you are careful, you will cut yourself.`,a:[{text:`If you aren't careful, you will cut yourself.`,correct:!0,explanation:`Unless = If... not. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`If you are careful, you will cut yourself.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “If you aren't careful, you will cut yourself.”.`,correct:!1},{text:`Unless you are not careful, you'll cut yourself.`,explanation:`Unless không đi với 'not'.`,correct:!1},{text:`If you don't careful, you will cut yourself.`,explanation:`Careful là tính từ, dùng 'aren't' thay vì 'don't'.`,correct:!1}]},{q:`I haven't seen that movie before.`,a:[{text:`This is the first time I have seen that movie.`,correct:!0,explanation:`Haven't seen... before = This is the first time...`},{text:`I never saw that movie before.`,explanation:`Dùng HTHT phù hợp hơn.`,correct:!1},{text:`I have seen that movie many times.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “This is the first time I have seen that movie.”.`,correct:!1},{text:`This is the first time I saw that movie.`,explanation:`Sau 'first time' dùng HTHT.`,correct:!1}]},{q:`The box was too heavy for the boy to carry.`,a:[{text:`The box was so heavy that the boy couldn't carry it.`,correct:!0,explanation:`Too... for O to V = So... that... can't/couldn't.`},{text:`The box was light enough for the boy to carry.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “The box was so heavy that the boy couldn't carry it.”.`,correct:!1},{text:`The boy was too heavy to carry the box.`,explanation:`Sai chủ ngữ. Cách dùng phù hợp trong câu này là “The box was so heavy that the boy couldn't carry it.”.`,correct:!1},{text:`The box was so heavy to carry.`,explanation:`Sai cấu trúc. Phương án 'The box was so heavy to carry.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`They will finish the project by the end of this month.`,a:[{text:`The project will be finished by the end of this month.`,correct:!0,explanation:`Bị động Tương lai đơn: will be + P2.`},{text:`The project will finish by the end of the month.`,explanation:`Dự án không tự kết thúc (thiếu bị động).`,correct:!1},{text:`The project is going to finished.`,explanation:`Thiếu 'be' (be finished).`,correct:!1},{text:`The project will be finish.`,explanation:`P2 của finish là finished.`,correct:!1}]},{q:`‘I am sorry I'm late,’ said the student.`,a:[{text:`The student apologized for being late.`,correct:!0,explanation:`I am sorry = Apologize for + V-ing.`},{text:`The student said sorry for he is late.`,explanation:`Apologized for being late là cấu trúc chuẩn hơn.`,correct:!1},{text:`The student told he was late.`,explanation:`Told me / Said that.`,correct:!1},{text:`The student apologized to be late.`,explanation:`Apologize for + V-ing.`,correct:!1}]},{q:`The bicycle is mine.`,a:[{text:`This bicycle belongs to me.`,correct:!0,explanation:`Possessive pronoun (mine) = Belong to + Object pronoun (me).`},{text:`The bicycle belongs to my.`,explanation:`Sau 'to' dùng tân ngữ 'me'.`,correct:!1},{text:`I belong to the bicycle.`,explanation:`Sai nghĩa (tôi thuộc về cái xe).`,correct:!1},{text:`This is mine bicycle.`,explanation:`Mine không đứng trước danh từ.`,correct:!1}]},{q:`Learning English is not easy.`,a:[{text:`It is not easy to learn English.`,correct:!0,explanation:`V-ing + is + Adj = It is + Adj + to V.`},{text:`It is not easy learning English.`,explanation:`It is + Adj + to V. Cách dùng phù hợp trong câu này là “It is not easy to learn English.”.`,correct:!1},{text:`Learn English is not easy.`,explanation:`Động từ làm chủ ngữ phải là V-ing.`,correct:!1},{text:`To learning English is not easy.`,explanation:`To + V (nguyên mẫu) làm chủ ngữ.`,correct:!1}]},{q:`He is a more careful driver than his friend.`,a:[{text:`His friend doesn't drive as carefully as he does.`,correct:!0,explanation:`So sánh hơn -> So sánh không bằng.`},{text:`His friend drives more carefully than him.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “His friend doesn't drive as carefully as he does.”.`,correct:!1},{text:`He drives more careful than his friend.`,explanation:`Sau động từ dùng trạng từ 'carefully'.`,correct:!1},{text:`He is the most careful driver.`,explanation:`Chưa đủ ý so sánh với bạn.`,correct:!1}]},{q:`We can't go to the beach because of the storm.`,a:[{text:`The storm prevents us from going to the beach.`,correct:!0,explanation:`Because of N = N prevents someone from V-ing.`},{text:`The storm makes us to go to the beach.`,explanation:`Make someone V (nguyên mẫu) và sai nghĩa.`,correct:!1},{text:`We go to the beach although the storm.`,explanation:`Sai. Cấu trúc 'We go to the beach although the storm.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Because the storm is bad, so we can't go.`,explanation:`Không dùng 'so' sau 'because'.`,correct:!1}]},{q:`She has never seen such a beautiful garden before.`,a:[{text:`This is the most beautiful garden she has ever seen.`,correct:!0,explanation:`Never seen such a... = This is the most... ever seen.`},{text:`This garden is more beautiful than no one.`,explanation:`Sai cấu trúc. Phương án 'This garden is more beautiful than no one.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`She seen a beautiful garden before.`,explanation:`Thiếu trợ động từ 'has'.`,correct:!1},{text:`This is the first time she saw a beautiful garden.`,explanation:`Sau 'first time' dùng HTHT.`,correct:!1}]},{q:`I would rather stay at home than go to the party.`,a:[{text:`I prefer staying at home to going to the party.`,correct:!0,explanation:`Would rather V than V = Prefer V-ing to V-ing.`},{text:`I prefer stay at home than go to the party.`,explanation:`Prefer + V-ing / to V.`,correct:!1},{text:`I would rather to stay at home.`,explanation:`Would rather + V (nguyên mẫu).`,correct:!1},{text:`Staying at home is better than go to the party.`,explanation:`Better than + V-ing (going).`,correct:!1}]},{q:`He hasn't written to me for months.`,a:[{text:`The last time he wrote to me was months ago.`,correct:!0,explanation:`Haven't + for = Last time... was... ago.`},{text:`It is months since he hasn't written to me.`,explanation:`Sau since dùng câu khẳng định.`,correct:!1},{text:`He last wrote to me since months.`,explanation:`Last + V2 đi với 'ago'.`,correct:!1},{text:`He doesn't write to me for months.`,explanation:`Dùng HTHT để chỉ sự kéo dài.`,correct:!1}]},{q:`The questions were so difficult that no one could answer them.`,a:[{text:`The questions were too difficult for anyone to answer.`,correct:!0,explanation:`So... that no one could = Too... for anyone to V.`},{text:`The questions were not easy enough to answer them.`,explanation:`Bỏ 'them' ở cuối khi dùng cấu trúc enough/too với chủ ngữ vật.`,correct:!1},{text:`They were such difficult questions that no one could answered.`,explanation:`Sai: sau động từ khiếm khuyết 'could' phải dùng nguyên mẫu 'answer', không dùng quá khứ 'answered'. Dạng đúng là 'could answer'.`,correct:!1},{text:`The questions were so difficult to answer.`,explanation:`Sai cấu trúc (phải là too...to V).`,correct:!1}]},{q:`We must finish our homework before going to bed.`,a:[{text:`It is necessary for us to finish our homework before going to bed.`,correct:!0,explanation:`Must = It is necessary (for O) to V.`},{text:`We should to finish our homework.`,explanation:`Should + V (nguyên mẫu).`,correct:!1},{text:`Finish our homework are necessary.`,explanation:`V-ing làm chủ ngữ dùng 'is'.`,correct:!1},{text:`It is necessary finish our homework.`,explanation:`Thiếu 'to' (to finish).`,correct:!1}]},{q:`Although he is old, he still plays soccer every day.`,a:[{text:`Despite his old age, he still plays soccer every day.`,correct:!0,explanation:`Although + Clause = Despite + Noun Phrase.`},{text:`In spite of he is old, he plays soccer.`,explanation:`In spite of + N/V-ing.`,correct:!1},{text:`Despite of being old, he plays soccer.`,explanation:`Despite không có 'of'.`,correct:!1},{text:`He is old, but he doesn't play soccer.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “Despite his old age, he still plays soccer every day.”.`,correct:!1}]},{q:`I started playing the guitar three years ago, and I still play it.`,a:[{text:`I have played the guitar for three years.`,correct:!0,explanation:`Started V-ing + ago = Have/Has P2 + for.`},{text:`I have played the guitar since three years.`,explanation:`Since + mốc thời gian.`,correct:!1},{text:`I play the guitar for three years.`,explanation:`Phải dùng HTHT. Cách dùng phù hợp trong câu này là “I have played the guitar for three years.”.`,correct:!1},{text:`It is three years since I have played the guitar.`,explanation:`Sau since dùng QKĐ. Cách dùng phù hợp trong câu này là “I have played the guitar for three years.”.`,correct:!1}]},{q:`‘Don't make a mess in the living room,’ said my mom.`,a:[{text:`My mom told me not to make a mess in the living room.`,correct:!0,explanation:`Mệnh lệnh phủ định: S + told + O + not to V.`},{text:`My mom said me not to make a mess.`,explanation:`Told me / Said to me.`,correct:!1},{text:`My mom asked me to don't make a mess.`,explanation:`Gián tiếp dùng 'not to', không dùng 'to don't'.`,correct:!1},{text:`My mom reminded me make a mess.`,explanation:`Sai nghĩa (nhắc tôi bày bừa? - Sai).`,correct:!1}]},{q:`This is the most interesting book I've ever read.`,a:[{text:`I have never read a more interesting book than this one.`,correct:!0,explanation:`So sánh nhất = Chưa từng đọc cuốn nào hơn.`},{text:`This book is as interesting as other books.`,explanation:`Sai. Cấu trúc 'This book is as interesting as other books.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`I have read more interesting books than this.`,explanation:`Sai nghĩa (tôi đã đọc nhiều cuốn hay hơn cuốn này? - Ngược lại câu gốc).`,correct:!1},{text:`No book is more interesting as this one.`,explanation:`So sánh hơn dùng 'than'.`,correct:!1}]},{q:`Unless it stops raining, we can't go to the park.`,a:[{text:`If it doesn't stop raining, we can't go to the park.`,correct:!0,explanation:`Unless = If... not. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`If it stops raining, we can't go.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “If it doesn't stop raining, we can't go to the park.”.`,correct:!1},{text:`Unless it doesn't stop raining, we can go.`,explanation:`Unless không đi với 'not'.`,correct:!1},{text:`If it won't stop raining, we can't go.`,explanation:`Câu điều kiện loại 1 không dùng 'will' trong mệnh đề If.`,correct:!1}]},{q:`It's a pity I don't know her phone number.`,a:[{text:`I wish I knew her phone number.`,correct:!0,explanation:`It's a pity = Câu ước (Wish + QKĐ).`},{text:`I wish I know her phone number.`,explanation:`Ước cho hiện tại phải lùi thì.`,correct:!1},{text:`I wish I will know her phone number.`,explanation:`Sai. Phương án 'I wish I will know her phone number.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`I wish I didn't know her phone number.`,explanation:`Ước ngược lại với thực tế (thực tế là không biết).`,correct:!1}]},{q:`He is too weak to lift that heavy box.`,a:[{text:`He isn't strong enough to lift that heavy box.`,correct:!0,explanation:`Too weak = Not strong enough.`},{text:`He is enough strong to lift the box.`,explanation:`Enough đứng sau tính từ.`,correct:!1},{text:`The box is too heavy to he lift.`,explanation:`Sai cấu trúc (too heavy for him to lift).`,correct:!1},{text:`He is so weak for lift the box.`,explanation:`So + adj + that... Cách dùng phù hợp trong câu này là “He isn't strong enough to lift that heavy box.”.`,correct:!1}]},{q:`I prefer swimming to running.`,a:[{text:`I like swimming better than running.`,correct:!0,explanation:`Prefer V-ing to V-ing = Like V-ing better/more than V-ing.`},{text:`I like swim more than run.`,explanation:`Sau like dùng V-ing.`,correct:!1},{text:`I would rather swimming than running.`,explanation:`Would rather + V (nguyên mẫu).`,correct:!1},{text:`I prefer to swimming than running.`,explanation:`Prefer V-ing TO V-ing hoặc Prefer to V RATHER THAN V.`,correct:!1}]},{q:`They are building a new supermarket in our neighborhood.`,a:[{text:`A new supermarket is being built in our neighborhood.`,correct:!0,explanation:`Bị động HTTD: is/are being + P2.`},{text:`A new supermarket are being built.`,explanation:`Supermarket là số ít, dùng 'is'.`,correct:!1},{text:`A new supermarket is building.`,explanation:`Siêu thị không tự xây.`,correct:!1},{text:`A new supermarket will be built.`,explanation:`Sai. Phương án 'A new supermarket will be built.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`‘I will help you with your homework tonight,’ said my brother. (Use a reporting verb that shows a promise, and backshift the time expression.)`,a:[{text:`My brother promised to help me with my homework that night.`,correct:!0,explanation:`Will help = Promise to help. Đổi 'tonight' thành 'that night'.`},{text:`My brother said he will help me tonight.`,explanation:`Chưa lùi thì và chưa đổi trạng từ chỉ thời gian.`,correct:!1},{text:`My brother told me he would help me tonight.`,explanation:`Chưa đổi 'tonight' thành 'that night'.`,correct:!1},{text:`My brother promised help me.`,explanation:`Promise to V. Cách dùng phù hợp trong câu này là “My brother promised to help me with my homework that night.”.`,correct:!1}]},{q:`The tea was so hot that I couldn't drink it.`,a:[{text:`The tea was too hot for me to drink.`,correct:!0,explanation:`So... that... couldn't = Too... (for O) to V.`},{text:`The tea was not hot enough for me to drink.`,explanation:`Sai. Cấu trúc 'The tea was not hot enough for me to drink.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`I was too hot to drink the tea.`,explanation:`Sai chủ ngữ. Cách dùng phù hợp trong câu này là “The tea was too hot for me to drink.”.`,correct:!1},{text:`The tea was so hot to drink.`,explanation:`Sai cấu trúc. Phương án 'The tea was so hot to drink.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`Nobody in the class is as good at English as Hoa.`,a:[{text:`Hoa is the best at English in the class.`,correct:!0,explanation:`So sánh không bằng (Nobody as good as) = So sánh nhất (the best).`},{text:`Hoa is better at English as any student.`,explanation:`So sánh hơn dùng 'than'.`,correct:!1},{text:`No one in the class is better at English as Hoa.`,explanation:`Sai: cấu trúc so sánh hơn phải dùng 'better ... than', không dùng 'better ... as'. Câu đúng cần giữ nguyên nghĩa của câu gốc.`,correct:!1},{text:`Hoa is as good at Englis
