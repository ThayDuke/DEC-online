const fullQuestionBank=[{q:`Using standard backshift, complete: He said, 'I am happy.' 😊`,a:[{text:`He said that he was happy.`,correct:!0,explanation:`Đổi 'I' thành 'he' và lùi thì 'am' thành 'was'.`},{text:`He said that I am happy.`,explanation:`Sai đại từ 'I'. Cách dùng phù hợp trong câu này là “He said that he was happy.”.`,correct:!1},{text:`He said that he is happy.`,explanation:`Chưa lùi thì 'is' thành 'was'.`,correct:!1},{text:`He said that he was am happy.`,explanation:`Dùng thừa động từ. Cách dùng phù hợp trong câu này là “He said that he was happy.”.`,correct:!1}]},{q:`Using standard backshift, complete: She said, 'I like apples.' 🍎`,a:[{text:`She said that she liked apples.`,correct:!0,explanation:`Đổi 'I' thành 'she' và 'like' thành 'liked'.`},{text:`She said that she like apples.`,explanation:`Thiếu 's' hoặc chưa lùi thì.`,correct:!1},{text:`She said that I liked apples.`,explanation:`Sai đại từ 'I'. Cách dùng phù hợp trong câu này là “She said that she liked apples.”.`,correct:!1},{text:`She said that she likes apples.`,explanation:`Chưa lùi thì về quá khứ.`,correct:!1}]},{q:`Using standard backshift, complete: The boy said, 'I can swim.' 🏊`,a:[{text:`The boy said that he could swim.`,correct:!0,explanation:`'Can' lùi thì thành 'could'.`},{text:`The boy said that he can swim.`,explanation:`Chưa lùi thì 'can'. Cách dùng phù hợp trong câu này là “The boy said that he could swim.”.`,correct:!1},{text:`The boy said that I could swim.`,explanation:`Sai đại từ 'I'. Cách dùng phù hợp trong câu này là “The boy said that he could swim.”.`,correct:!1},{text:`The boy said that he could swims.`,explanation:`Sau 'could' động từ phải nguyên mẫu.`,correct:!1}]},{q:`Using standard backshift, complete: My mom said, 'I am cooking dinner.' 🍳`,a:[{text:`My mom said that she was cooking dinner.`,correct:!0,explanation:`Hiện tại tiếp diễn lùi thành quá khứ tiếp diễn.`},{text:`My mom said that she is cooking dinner.`,explanation:`Chưa lùi thì 'is'. Cách dùng phù hợp trong câu này là “My mom said that she was cooking dinner.”.`,correct:!1},{text:`My mom said that I was cooking dinner.`,explanation:`Sai đại từ 'I'. Cách dùng phù hợp trong câu này là “My mom said that she was cooking dinner.”.`,correct:!1},{text:`My mom said that she was cook dinner.`,explanation:`Thiếu đuôi '-ing'. Cách dùng phù hợp trong câu này là “My mom said that she was cooking dinner.”.`,correct:!1}]},{q:`Using standard backshift, complete: They said, 'We are playing.' ⚽`,a:[{text:`They said that they were playing.`,correct:!0,explanation:`'We' đổi thành 'they' và 'are' thành 'were'.`},{text:`They said that we were playing.`,explanation:`Sai đại từ 'we'. Cách dùng phù hợp trong câu này là “They said that they were playing.”.`,correct:!1},{text:`They said that they was playing.`,explanation:`Chủ ngữ 'they' phải đi với 'were'.`,correct:!1},{text:`They said that they are playing.`,explanation:`Chưa lùi thì 'are'. Cách dùng phù hợp trong câu này là “They said that they were playing.”.`,correct:!1}]},{q:`Using standard backshift, complete: He said, 'My cat is cute.' 🐱`,a:[{text:`He said that his cat was cute.`,correct:!0,explanation:`Tính từ sở hữu 'my' đổi thành 'his'.`},{text:`He said that my cat was cute.`,explanation:`Chưa đổi 'my' thành 'his'.`,correct:!1},{text:`He said that his cat is cute.`,explanation:`Chưa lùi thì 'is'. Cách dùng phù hợp trong câu này là “He said that his cat was cute.”.`,correct:!1},{text:`He said that her cat was cute.`,explanation:`Sai giới tính (phải là 'his').`,correct:!1}]},{q:`Using standard backshift, complete: She said, 'I have a new doll.' 🧸`,a:[{text:`She said that she had a new doll.`,correct:!0,explanation:`'Have' lùi thì thành 'had'.`},{text:`She said that she has a new doll.`,explanation:`Chưa lùi thì 'has'. Cách dùng phù hợp trong câu này là “She said that she had a new doll.”.`,correct:!1},{text:`She said that I had a new doll.`,explanation:`Sai đại từ 'I'. Cách dùng phù hợp trong câu này là “She said that she had a new doll.”.`,correct:!1},{text:`She said that she having a new doll.`,explanation:`Sai. Phương án 'She said that she having a new doll.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`Using told + object + to-infinitive, report the command: The teacher said to us, 'Open your books.' 📚`,a:[{text:`The teacher told us to open our books.`,correct:!0,explanation:`Câu mệnh lệnh: told someone + to Verb.`},{text:`The teacher told us open our books.`,explanation:`Thiếu 'to' trước động từ.`,correct:!1},{text:`The teacher said us to open our books.`,explanation:`Sai. 'Say' không dùng trực tiếp với tân ngữ 'us'; mệnh lệnh cần 'told us to open'.`,correct:!1},{text:`The teacher told us to opening our books.`,explanation:`Phải dùng 'to + nguyên mẫu'.`,correct:!1}]},{q:`Using standard backshift, complete: He said, 'I will help you.' 🤝`,a:[{text:`He said that he would help me.`,correct:!0,explanation:`'Will' lùi thì thành 'would'.`},{text:`He said that he will help me.`,explanation:`Chưa lùi thì 'will'.`,correct:!1},{text:`He said that I would help you.`,explanation:`Sai đại từ. Cách dùng phù hợp trong câu này là “He said that he would help me.”.`,correct:!1},{text:`He said that he would helps me.`,explanation:`Sau 'would' động từ nguyên mẫu.`,correct:!1}]},{q:`Using standard backshift, complete: Dad said, 'I am tired.' 😴`,a:[{text:`Dad said that he was tired.`,correct:!0,explanation:`Lùi thì 'am' thành 'was' và đổi 'I' thành 'he'.`},{text:`Dad said that he is tired.`,explanation:`Chưa lùi thì. Cách dùng phù hợp trong câu này là “Dad said that he was tired.”.`,correct:!1},{text:`Dad said that I was tired.`,explanation:`Sai đại từ 'I'. Cách dùng phù hợp trong câu này là “Dad said that he was tired.”.`,correct:!1},{text:`Dad said that was he tired.`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “Dad said that he was tired.”.`,correct:!1}]},{q:`Using standard backshift, complete: She said, 'My brother is a doctor.' 👨‍⚕️`,a:[{text:`She said that her brother was a doctor.`,correct:!0,explanation:`'My' đổi thành 'her' và 'is' thành 'was'.`},{text:`She said that his brother was a doctor.`,explanation:`Sai vì cô ấy là nữ nên dùng 'her'.`,correct:!1},{text:`She said that her brother is a doctor.`,explanation:`Chưa lùi thì 'is'. Cách dùng phù hợp trong câu này là “She said that her brother was a doctor.”.`,correct:!1},{text:`She said that my brother was a doctor.`,explanation:`Chưa đổi tính từ sở hữu.`,correct:!1}]},{q:`Using standard backshift, complete: They said, 'We like the park.' 🌳`,a:[{text:`They said that they liked the park.`,correct:!0,explanation:`'We' đổi thành 'they' và 'like' thành 'liked'.`},{text:`They said that they like the park.`,explanation:`Chưa lùi thì 'like'.`,correct:!1},{text:`They said that we liked the park.`,explanation:`Chưa đổi đại từ 'we'.`,correct:!1},{text:`They said that they are like the park.`,explanation:`Thừa động từ 'are'. Cách dùng phù hợp trong câu này là “They said that they liked the park.”.`,correct:!1}]},{q:`Using standard backshift, complete: The girl said, 'I want some water.' 💧`,a:[{text:`The girl said that she wanted some water.`,correct:!0,explanation:`'Want' lùi thì thành 'wanted'.`},{text:`The girl said that she want some water.`,explanation:`Thiếu 'ed' ở động từ.`,correct:!1},{text:`The girl said that I wanted some water.`,explanation:`Sai đại từ 'I'. Cách dùng phù hợp trong câu này là “The girl said that she wanted some water.”.`,correct:!1},{text:`The girl said that she wants some water.`,explanation:`Chưa lùi thì. Cách dùng phù hợp trong câu này là “The girl said that she wanted some water.”.`,correct:!1}]},{q:`Using standard backshift and time-word change, complete: He said, 'I am reading now.' 📖`,a:[{text:`He said that he was reading then.`,correct:!0,explanation:`Lùi thì 'am' -> 'was' và đổi 'now' -> 'then'.`},{text:`He said that he was reading now.`,explanation:`Chưa đổi trạng từ 'now'.`,correct:!1},{text:`He said that he is reading then.`,explanation:`Chưa lùi thì 'is'. Cách dùng phù hợp trong câu này là “He said that he was reading then.”.`,correct:!1},{text:`He said that I was reading then.`,explanation:`Sai đại từ 'I'. Cách dùng phù hợp trong câu này là “He said that he was reading then.”.`,correct:!1}]},{q:`Using told + object + to-infinitive, report the command: Mom said to me, 'Eat your vegetables.' 🥦`,a:[{text:`Mom told me to eat my vegetables.`,correct:!0,explanation:`Câu mệnh lệnh: 'told me to + Verb'.`},{text:`Mom told me eat my vegetables.`,explanation:`Thiếu 'to' trước động từ.`,correct:!1},{text:`Mom said me to eat my vegetables.`,explanation:`Dùng 'told me' thay vì 'said me'.`,correct:!1},{text:`Mom told me to ate my vegetables.`,explanation:`Sau 'to' phải dùng nguyên mẫu.`,correct:!1}]},{q:`Using standard backshift, complete: Tom said, 'I saw a lion at the zoo.' 🦁`,a:[{text:`Tom said that he had seen a lion at the zoo.`,correct:!0,explanation:`Quá khứ đơn 'saw' lùi thành quá khứ hoàn thành 'had seen'.`},{text:`Tom said that he saw a lion at the zoo.`,explanation:`Sai theo yêu cầu standard backshift của stem: 'saw' phải lùi thành 'had seen'.`,correct:!1},{text:`Tom said that I saw a lion.`,explanation:`Sai đại từ 'I'. Cách dùng phù hợp trong câu này là “Tom said that he had seen a lion at the zoo.”.`,correct:!1},{text:`Tom said that he has seen a lion.`,explanation:`Sai thì (hiện tại hoàn thành).`,correct:!1}]},{q:`Apply standard backshift even for a general truth: She said, 'The sun is hot.' ☀️`,a:[{text:`She said that the sun was hot.`,correct:!0,explanation:`Lùi thì 'is' thành 'was'.`},{text:`She said that the sun is hot.`,explanation:`Câu đã yêu cầu standard backshift; không chọn cách giữ "is" thường dùng khi cố ý bảo toàn một chân lý chung.`,correct:!1},{text:`She said that it was hot sun.`,explanation:`Sai. Phương án 'She said that it was hot sun.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`The sun was hot she said.`,explanation:`Cách viết này không phổ biến trong bài tập.`,correct:!1}]},{q:`He said, 'I don't like milk.' 🥛`,a:[{text:`He said that he didn't like milk.`,correct:!0,explanation:`'Don't' lùi thì thành 'didn't'.`},{text:`He said that he doesn't like milk.`,explanation:`Chưa lùi thì 'doesn't'.`,correct:!1},{text:`He said that he didn't liked milk.`,explanation:`Sau 'didn't' động từ phải nguyên mẫu.`,correct:!1},{text:`He said that I didn't like milk.`,explanation:`Sai đại từ 'I'. Cách dùng phù hợp trong câu này là “He said that he didn't like milk.”.`,correct:!1}]},{q:`We said, 'We are winners.' 🏆`,a:[{text:`We said that we were winners.`,correct:!0,explanation:`Lùi thì 'are' thành 'were'.`},{text:`We said that they were winners.`,explanation:`Sai ngữ cảnh (chúng tôi nói về chính chúng tôi).`,correct:!1},{text:`We said that we are winners.`,explanation:`Chưa lùi thì. Cách dùng phù hợp trong câu này là “We said that we were winners.”.`,correct:!1},{text:`We said that we was winners.`,explanation:`'We' phải đi với 'were'.`,correct:!1}]},{q:`The boy said, 'My dog is lost.' 🐕`,a:[{text:`The boy said that his dog was lost.`,correct:!0,explanation:`'My' -> 'his' và 'is' -> 'was'.`},{text:`The boy said that my dog was lost.`,explanation:`Chưa đổi 'my'. Cách dùng phù hợp trong câu này là “The boy said that his dog was lost.”.`,correct:!1},{text:`The boy said that his dog is lost.`,explanation:`Chưa lùi thì. Cách dùng phù hợp trong câu này là “The boy said that his dog was lost.”.`,correct:!1},{text:`The boy said that her dog was lost.`,explanation:`Sai giới tính sở hữu.`,correct:!1}]},{q:`Using standard backshift and time-word change, complete: She said, 'I'll go to school tomorrow.' 🏫`,a:[{text:`She said that she would go to school the next day.`,correct:!0,explanation:`'Will' -> 'would' và 'tomorrow' -> 'the next day'.`},{text:`She said that she will go to school tomorrow.`,explanation:`Chưa lùi thì và đổi trạng từ.`,correct:!1},{text:`She said that she would go to school the tomorrow.`,explanation:`Chưa đổi 'tomorrow'.`,correct:!1},{text:`She said that I would go the next day.`,explanation:`Sai đại từ 'I'. Cách dùng phù hợp trong câu này là “She said that she would go to school the next day.”.`,correct:!1}]},{q:`Using asked + object + to-infinitive, report the request: He said to me, 'Please help me.' 🙋`,a:[{text:`He asked me to help him.`,correct:!0,explanation:`Câu yêu cầu: 'asked + me + to Verb'.`},{text:`He said me to help him.`,explanation:`Dùng 'asked me' hợp lý hơn.`,correct:!1},{text:`He asked me to help me.`,explanation:`Sai đại từ 'me' ở cuối (phải là 'him').`,correct:!1},{text:`He asked to helping him.`,explanation:`Phải dùng 'to + nguyên mẫu'.`,correct:!1}]},{q:`Using told + object + not to-infinitive, report the negative command: Mom said to us, 'Don't run!' 🚫`,a:[{text:`Mom told us not to run.`,correct:!0,explanation:`Câu phủ định: 'told someone + not to + Verb'.`},{text:`Mom told us not run.`,explanation:`Vị trí đúng là 'not to run'.`,correct:!1},{text:`Mom told us don't run.`,explanation:`Sai cấu trúc bị động gián tiếp.`,correct:!1},{text:`Mom said us not to run.`,explanation:`Sai. 'Say' không dùng trực tiếp với tân ngữ 'us'; câu mệnh lệnh cần 'told us not to run'.`,correct:!1}]},{q:`Using told + object + to-infinitive, report the command: The doctor said to me, 'Stay in bed.' 🛌`,a:[{text:`The doctor told me to stay in bed.`,correct:!0,explanation:`Cấu trúc 'told me to + Verb'.`},{text:`The doctor said me to stay in bed.`,explanation:`Phải dùng 'told me' hoặc 'said that I should'.`,correct:!1},{text:`The doctor told me stay in bed.`,explanation:`Thiếu 'to'. Cách dùng phù hợp trong câu này là “The doctor told me to stay in bed.”.`,correct:!1},{text:`The doctor told to stay in bed.`,explanation:`Thiếu đối tượng 'me'.`,correct:!1}]},{q:`Using standard backshift, complete: He said, 'I am 10 years old.' 🔟`,a:[{text:`He said that he was 10 years old.`,correct:!0,explanation:`Đổi 'I' thành 'he' và 'am' thành 'was'.`},{text:`He said that he is 10 years ol
