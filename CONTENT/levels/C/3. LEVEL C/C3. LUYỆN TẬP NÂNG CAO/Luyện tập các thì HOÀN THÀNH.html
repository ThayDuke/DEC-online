const fullQuestionBank=[{q:`Use the present perfect to connect a past event or duration to the present: She ___ in Paris for five years and still lives there. (T7)`,a:[{text:`has lived`,correct:!0,explanation:`Hiện tại hoàn thành (has + V3/ed) với 'for five years'.`},{text:`have lived`,explanation:`Sai ngữ pháp. Chủ ngữ 'She' dùng 'has'.`,correct:!1},{text:`lived`,explanation:`Sai thì: 'for five years' và việc vẫn sống ở đó yêu cầu hiện tại hoàn thành 'has lived'.`,correct:!1},{text:`is living`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: I haven't ___ my homework yet. (T7) 📝`,a:[{text:`finished`,correct:!0,explanation:`Hiện tại hoàn thành (have not + V3/ed) với 'yet'.`},{text:`finish`,explanation:`Sai. Dấu hiệu hoặc ngữ cảnh trong câu ở hiện tại, không dùng thì Quá khứ.`,correct:!1},{text:`finishing`,explanation:`Sai ngữ pháp. Chủ ngữ 'I' dùng 'have'.`,correct:!1},{text:`finishes`,explanation:`Sai thì: 'yet' cho biết việc chưa hoàn tất đến hiện tại, nên dùng 'haven't finished'.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: Up to now, they ___ this movie three times. (T7) 🎬`,a:[{text:`have seen`,correct:!0,explanation:`Cụm "Up to now" và số lần tính đến hiện tại yêu cầu Hiện tại hoàn thành: have + V3, nên dùng "have seen".`},{text:`has seen`,explanation:`Sai ngữ pháp. Chủ ngữ 'They' dùng 'have'.`,correct:!1},{text:`saw`,explanation:`Sai. Với khoảng thời gian chưa kết thúc "Up to now", không dùng Quá khứ đơn "saw" để tổng kết trải nghiệm.`,correct:!1},{text:`are seeing`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: He has just ___ the office. (T7) 🚶`,a:[{text:`left`,correct:!0,explanation:`Hiện tại hoàn thành (has + just + V3) với 'just'.`},{text:`leave`,explanation:`Thì quá khứ đơn, không nhấn mạnh hành động vừa mới xảy ra.`,correct:!1},{text:`leaving`,explanation:`Sai ngữ pháp. Chủ ngữ 'He' dùng 'has'.`,correct:!1},{text:`leaves`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: We ___ anything since breakfast. (T7) 🍽️`,a:[{text:`haven't eaten`,correct:!0,explanation:`Hiện tại hoàn thành (have not + V3) với 'since breakfast'.`},{text:`didn't eat`,explanation:`Sai thì: 'since breakfast' nối khoảng thời gian với hiện tại, nên dùng 'haven't eaten'.`,correct:!1},{text:`hasn't eaten`,explanation:`Sai ngữ pháp: chủ ngữ 'We' dùng trợ động từ 'have', không phải 'has'.`,correct:!1},{text:`don't eat`,explanation:`Sai thì: 'since breakfast' nối khoảng thời gian với hiện tại, không dùng hiện tại đơn 'don't eat'.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: How long ___ you ___ your best friend? (T7) 👧`,a:[{text:`have / known`,correct:!0,explanation:`Hiện tại hoàn thành (How long + have/has + S + V3) hỏi về khoảng thời gian.`},{text:`do / know`,explanation:`Sai thì: 'How long' hỏi khoảng thời gian kéo dài đến hiện tại, nên dùng 'have known'.`,correct:!1},{text:`did / know`,explanation:`Sai thì: câu hỏi không có mốc quá khứ đã kết thúc; cần hiện tại hoàn thành 'have known'.`,correct:!1},{text:`are / knowing`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: So far this week, the train ___ late three times. (T7) 🚂`,a:[{text:`has arrived`,correct:!0,explanation:`Hiện tại hoàn thành (has + V3) với 'this week' (chưa kết thúc).`},{text:`have arrived`,explanation:`Sai ngữ pháp. Chủ ngữ 'The train' dùng 'has'.`,correct:!1},{text:`arrived`,explanation:`Sai thì: 'so far this week' là khoảng thời gian chưa kết thúc, không dùng quá khứ đơn 'arrived'.`,correct:!1},{text:`is arriving`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: In her life so far, my mother ___ abroad. (T7) ✈️`,a:[{text:`has never travelled`,correct:!0,explanation:`Hiện tại hoàn thành (has + never + V3/ed) diễn tả kinh nghiệm.`},{text:`never travelled`,explanation:`Sai thì: 'so far' nói về trải nghiệm đến hiện tại, nên dùng 'has never travelled'.`,correct:!1},{text:`have never travelled`,explanation:`Sai. Chủ ngữ là số ít, không dùng 'have'.`,correct:!1},{text:`is never travelling`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: Has your father ___ you recently? (T7) 📞`,a:[{text:`called`,correct:!0,explanation:`Hiện tại hoàn thành (Has + S + V3/ed) với 'recently'.`},{text:`call`,explanation:`Sai thì: 'recently' nối câu hỏi với hiện tại, nên dùng 'Has called', không dùng quá khứ đơn.`,correct:!1},{text:`calling`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1},{text:`calls`,explanation:`Sai thì: câu hỏi về việc gần đây cần hiện tại hoàn thành 'Has called', không dùng hiện tại đơn.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: I think I have ___ my keys. I can't find them anywhere. (T7) 🔑`,a:[{text:`lost`,correct:!0,explanation:`Hiện tại hoàn thành (have + V3) diễn tả hành động trong quá khứ có kết quả ở hiện tại.`},{text:`lose`,explanation:`Sai. Sau have cần phân từ hai lost, không dùng nguyên mẫu lose.`,correct:!1},{text:`losing`,explanation:`Sai. Sau have không dùng V-ing losing.`,correct:!1},{text:`losed`,explanation:`Sai. Lost là phân từ đúng của lose; losed không tồn tại.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: The children have ___ very quiet all morning, and they are still quiet now. (T7) 🤫`,a:[{text:`been`,correct:!0,explanation:`Sau 'have' cần V3 'been'; 'still quiet now' khóa hiện tại hoàn thành.`},{text:`be`,explanation:`Sai. Sau 'have' không dùng động từ nguyên mẫu 'be'.`,correct:!1},{text:`being`,explanation:`Sai. Sau 'have' cần V3, không dùng V-ing 'being'.`,correct:!1},{text:`was`,explanation:`Sai. Sau 'have' không dùng dạng quá khứ đơn 'was'.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: This is the best book I have ever ___. (T7) 📚`,a:[{text:`read`,correct:!0,explanation:`Sau 'have ever' cần V3 'read' trong trải nghiệm tính đến hiện tại.`},{text:`reads`,explanation:`Sai. Sau 'have ever' không dùng động từ chia ngôi 'reads'.`,correct:!1},{text:`reading`,explanation:`Sai. Sau 'have ever' cần V3, không dùng V-ing.`,correct:!1},{text:`readed`,explanation:`Sai chính tả. V3 của 'read' vẫn viết là 'read'.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: The company has ___ a new factory lately. (T7) 🏭`,a:[{text:`built`,correct:!0,explanation:`Hiện tại hoàn thành (has + V3) với 'lately'.`},{text:`build`,explanation:`Sai. Sau has cần phân từ hai built, không dùng nguyên mẫu build.`,correct:!1},{text:`building`,explanation:`Sai. Sau has không dùng V-ing building.`,correct:!1},{text:`builded`,explanation:`Sai. Built là phân từ đúng của build; builded không tồn tại.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: We ___ here since 2010. (T7) 🏠`,a:[{text:`have lived`,correct:!0,explanation:`Hiện tại hoàn thành (have + V3/ed) với 'since'.`},{text:`has lived`,explanation:`Sai. Chủ ngữ là số nhiều, không dùng 'has'.`,correct:!1},{text:`lived`,explanation:`Sai thì: 'since 2010' cho hành động còn kéo dài đến hiện tại, nên dùng 'have lived'.`,correct:!1},{text:`are living`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: I have ___ ten English courses so far. (T7) 🗣️`,a:[{text:`studied`,correct:!0,explanation:`Sau 'have' cần V3 'studied'; 'ten English courses' là số khóa đã hoàn tất.`},{text:`study`,explanation:`Sai. Sau 'have' không dùng động từ nguyên mẫu 'study'.`,correct:!1},{text:`studying`,explanation:`Sai. Sau 'have' cần V3, không dùng V-ing.`,correct:!1},{text:`studing`,explanation:`Sai chính tả. V3 đúng là 'studied'.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: She has already ___ the email. (T7) ✉️`,a:[{text:`sent`,correct:!0,explanation:`Sau 'has already' cần V3 'sent' trong hiện tại hoàn thành.`},{text:`send`,explanation:`Sai. Sau 'has' không dùng động từ nguyên mẫu 'send'.`,correct:!1},{text:`sending`,explanation:`Sai. Sau 'has' cần V3, không dùng V-ing.`,correct:!1},{text:`sends`,explanation:`Sai. Sau 'has' không dùng dạng hiện tại đơn 'sends'.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: My brother has ___ his leg, so he can't walk. (T7) 🦵`,a:[{text:`broken`,correct:!0,explanation:`Hiện tại hoàn thành, hành động trong quá khứ có kết quả ở hiện tại.`},{text:`break`,explanation:`Sai. Sau has cần phân từ hai broken, không dùng break.`,correct:!1},{text:`breaking`,explanation:`Sai. Sau has không dùng V-ing breaking.`,correct:!1},{text:`breaked`,explanation:`Sai. Broken là phân từ đúng của break; breaked không tồn tại.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: The weather ___ good recently. (T7) ☁️`,a:[{text:`hasn't been`,correct:!0,explanation:`Hiện tại hoàn thành (has not + V3) với 'recently'.`},{text:`haven't been`,explanation:`Sai ngữ pháp. Chủ ngữ 'The weather' dùng 'has'.`,correct:!1},{text:`didn't be`,explanation:`Sai cấu trúc: động từ 'be' không đi với 'didn't'; ngữ cảnh cần 'hasn't been'.`,correct:!1},{text:`wasn't`,explanation:`Sai thì: 'recently' nối tình trạng với hiện tại, nên dùng 'hasn't been', không dùng quá khứ đơn.`,correct:!1}]},{q:`Use the present perfect to connect a past event or duration to the present: We have ___ all the work. Let's go home. (T7) 🥳`,a:[{text:`finis
