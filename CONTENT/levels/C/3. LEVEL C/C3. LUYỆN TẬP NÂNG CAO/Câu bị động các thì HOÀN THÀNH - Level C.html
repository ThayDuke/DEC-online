const fullQuestionBank=[{q:`All the project reports ___ by the students so far.`,a:[{text:`have been submitted`,correct:!0,explanation:`Hiện tại hoàn thành bị động: have + been + V3/ed (số nhiều).`},{text:`has been submitted`,explanation:`Sai. Phương án 'has been submitted' không hòa hợp về ngôi và số với chủ ngữ 'All the project reports'.`,correct:!1},{text:`have submitted`,explanation:`Sai. Chủ ngữ 'All the project reports' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'have submitted'.`,correct:!1},{text:`were submitted`,explanation:`Sai. Dấu hiệu 'by the students so far' không phù hợp với thì/cấu trúc của phương án 'were submitted'.`,correct:!1}]},{q:`The ancient temple ___ by archaeologists recently, and it is open to visitors now.`,a:[{text:`has been restored`,correct:!0,explanation:`HTHT bị động: has + been + V3/ed (số ít).`},{text:`have been restored`,explanation:`Sai. Phương án 'have been restored' không hòa hợp về ngôi và số với chủ ngữ 'The ancient temple'.`,correct:!1},{text:`had been restored`,explanation:`Sai: 'had been restored' cần một mốc quá khứ chuẩn; 'recently' và trạng thái mở cửa nối kết quả với hiện tại.`,correct:!1},{text:`is being restored`,explanation:`Sai. 'Is being restored' diễn tả đang trùng tu; câu cho biết việc đã hoàn tất và đền mở cửa.`,correct:!1}]},{q:`Many new species ___ in the Amazon rainforest recently, and researchers are still studying them.`,a:[{text:`have been discovered`,correct:!0,explanation:`HTHT bị động diễn tả hành động vừa mới xảy ra (recently).`},{text:`has been discovered`,explanation:`Sai. Phương án 'has been discovered' không hòa hợp về ngôi và số với chủ ngữ 'Many new species'.`,correct:!1},{text:`were discovered`,explanation:`Sai: 'were discovered' là quá khứ đơn, không bao quát các loài mới phát hiện gần đây đến hiện tại.`,correct:!1},{text:`had been discovered`,explanation:`Sai: 'had been discovered' đòi hỏi mốc quá khứ khác; các loài được phát hiện gần đây đến hiện tại.`,correct:!1}]},{q:`The winner of the competition ___ yet.`,a:[{text:`hasn't been announced`,correct:!0,explanation:`Câu phủ định HTHT bị động với 'yet'.`},{text:`haven't been announced`,explanation:`Sai. Phương án 'haven't been announced' không hòa hợp về ngôi và số với chủ ngữ 'The winner of the competition'.`,correct:!1},{text:`hadn't been announced`,explanation:`Sai: 'hadn't been announced' lùi quá xa; 'yet' yêu cầu kết quả chưa công bố đến hiện tại.`,correct:!1},{text:`wasn't announced`,explanation:`Sai. 'Wasn't announced' là quá khứ đơn; 'yet' trong câu phủ định yêu cầu hiện tại hoàn thành.`,correct:!1}]},{q:`___ the invitations ___ to all the guests?`,a:[{text:`Have / been sent`,correct:!0,explanation:`Câu hỏi HTHT bị động: Have + S + been + V3/ed?`},{text:`Has / been sent`,explanation:`Sai. Phương án 'Has / been sent' không hòa hợp chủ vị với chủ ngữ trong câu.`,correct:!1},{text:`Were / sent`,explanation:`Sai. 'Were / sent' là quá khứ đơn; câu hỏi kiểm tra việc đã gửi đến hiện tại cần 'Have / been sent'.`,correct:!1},{text:`Have / sent`,explanation:`Thiếu 'been'. Cách dùng phù hợp trong câu này là “Have / been sent”.`,correct:!1}]},{q:`Use the Past Perfect Passive to emphasize completion before the later past event: by the time we arrived, the house ___ for the party.`,a:[{text:`had been decorated`,correct:!0,explanation:`Quá khứ hoàn thành bị động: Hành động hoàn tất trước 1 thời điểm trong quá khứ.`},{text:`has been decorated`,explanation:`Sai: 'has been decorated' là hiện tại hoàn thành; ngôi nhà đã trang trí trước lúc chúng ta đến nên cần QKHT.`,correct:!1},{text:`was being decorated`,explanation:`Sai. 'Was being decorated' diễn tả đang diễn ra khi đến; 'by the time' yêu cầu đã hoàn tất trước mốc đó.`,correct:!1},{text:`will have been decorated`,explanation:`Sai: 'will have been decorated' là tương lai hoàn thành, trái với mốc đã đến trong quá khứ.`,correct:!1}]},{q:`He realized that his laptop ___ already by someone else.`,a:[{text:`had been used`,correct:!0,explanation:`QKHT bị động diễn tả hành động xảy ra trước hành động 'realized'.`},{text:`has been used`,explanation:`Sai: 'has been used' không lùi theo 'realized'; laptop đã bị dùng trước thời điểm nhận ra.`,correct:!1},{text:`was being used`,explanation:`Chưa nhấn mạnh tính hoàn thành.`,correct:!1},{text:`had used`,explanation:`Sai. Chủ ngữ 'He realized that his laptop' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'had used'.`,correct:!1}]},{q:`The stolen car ___ already before the owner called the police; the owner was informed afterward.`,a:[{text:`had been found`,correct:!0,explanation:`QKHT bị động: find -> found.`},{text:`has been found`,explanation:`Sai: 'has been found' không lùi theo 'called'; xe đã được tìm thấy trước cuộc gọi.`,correct:!1},{text:`found`,explanation:`Sai. Phương án 'found' không chính xác do sai cấu trúc hoặc không phù hợp ngữ cảnh.`,correct:!1},{text:`was finding`,explanation:`Ít chính xác hơn QKHT trong ngữ cảnh này.`,correct:!1}]},{q:`Before the meeting started, the documents ___ already.`,a:[{text:`had been printed`,correct:!0,explanation:`QKHT bị động: had + been + V3/ed.`},{text:`have been printed`,explanation:`Sai: 'have been printed' là hiện tại hoàn thành; tài liệu đã in trước khi cuộc họp bắt đầu.`,correct:!1},{text:`were printing`,explanation:`Ít chính xác hơn QKHT.`,correct:!1},{text:`had printed`,explanation:`Sai. Phương án 'had printed' không chính xác do sai cấu trúc hoặc không phù hợp ngữ cảnh.`,correct:!1}]},{q:`Everything ___ for the wedding before the storm hit; the preparations were already complete.`,a:[{text:`had been prepared`,correct:!0,explanation:`QKHT bị động nhấn mạnh sự chuẩn bị xong trước khi bão đến.`},{text:`has been prepared`,explanation:`Sai: 'has been prepared' không lùi theo 'hit'; mọi thứ đã chuẩn bị trước cơn bão.`,correct:!1},{text:`was preparing`,explanation:`Sai thì: 'was preparing' là chủ động, không tạo bị động cho mọi thứ đã chuẩn bị trước cơn bão.`,correct:!1},{text:`had prepared`,explanation:`Sai. Phương án 'had prepared' không chính xác do sai cấu trúc hoặc không phù hợp ngữ cảnh.`,correct:!1}]},{q:`By 2030, the new bridge ___ across the river.`,a:[{text:`will have been built`,correct:!0,explanation:`Tương lai hoàn thành bị động: will + have + been + V3/ed.`},{text:`will be build`,explanation:`Sai thì (không nhấn mạnh hoàn thành).`,correct:!1},{text:`has been built`,explanation:`Sai: 'new bridge' là số ít nhưng phương án thiếu cấu trúc tương lai hoàn thành đúng.`,correct:!1},{text:`had been built`,explanation:`Sai: 'had been built' không có mốc quá khứ; mốc 2030 là hạn tương lai.`,correct:!1}]},{q:`The book ___ into ten languages by the end of next month.`,a:[{text:`will have been translated`,correct:!0,explanation:`TLHT bị động với dấu hiệu 'by the end of next month'.`},{text:`is translated`,explanation:`Sai: 'is translated' là hiện tại đơn, không đạt mốc 'by the end of next month'.`,correct:!1},{text:`will be translate`,explanation:`Sai: 'will be translate' thiếu V3 'translated' sau 'be'.`,correct:!1},{text:`has been translated`,explanation:`Sai: 'has been translated' là hiện tại hoàn thành; mốc tháng tới yêu cầu tương lai hoàn thành.`,correct:!1}]},{q:`___ the work ___ by the time the manager returns?`,a:[{text:`Will / have been finished`,correct:!0,explanation:`Câu hỏi TLHT bị động: Will + S + have + been + V3/ed?`},{text:`Will / be finished`,explanation:`Sai: 'Will / be finished' là tương lai đơn, chưa nhấn việc hoàn tất trước lúc quản lý trở lại.`,correct:!1},{text:`Has / been finished`,explanation:`Sai: 'Has / been finished' là hiện tại hoàn thành, trái với mốc tương lai 'manager returns'.`,correct:!1},{text:`Had / been finished`,explanation:`Sai: 'Had / been finished' là quá khứ hoàn thành, trong khi câu hỏi hỏi trước lúc quản lý trở lại ở tương lai.`,correct:!1}]},{q:`By next year, millions of trees ___ in this area.`,a:[{text:`will have been planted`,correct:!0,explanation:`TLHT bị động nhấn mạnh kết quả trong tương lai.`},{text:`will be plant`,explanation:`Sai: 'will be plant' dùng sai V3; phải là 'planted' và cần 'have' để hoàn tất trước năm tới.`,correct:!1},{text:`have been planted`,explanation:`Sai: 'have been planted' là hiện tại hoàn thành, không diễn tả kết quả đến năm sau.`,correct:!1},{text:`are being planted`,explanation:`Sai: 'are being planted' chỉ quá trình đang diễn ra hiện tại, không phải kết quả hoàn tất trước năm tới.`,correct:!1}]},{q:`The team has started work; I'm sure that the problem ___ by tomorrow morning.`,a:[{text:`will have been solved`,correct:!0,explanation:`TLHT bị động với dấu hiệu 'by then'.`},{text:`has been solved`,explanation:`Sai: 'has been solved' là hiện tại hoàn thành, không phù hợp với lời dự đoán 'by then'.`,correct:!1},{text:`was solved`,explanation:`Sai: 'was solved' là quá khứ đơn, không có mốc quá khứ trong câu.`,correct:!1},{text:`will be solve`,explanation:`Sai: 'will be solve' thiếu V3 'solved' và không tạo tương lai hoàn thành.`,correct:!1}]},{q:`The room looks great! It ___ recently.`,a:[{text:`has been painted`,correct:!0,explanation:`HTHT bị động diễn tả hành động để lại kết quả ở hiện tại.`},{text:`had been painted`,explanation:`Sai: 'had been painted' cần mốc quá khứ; 'recently' và vẻ ngoài hiện tại yêu cầu hiện tại hoàn thành.`,correct:!1},{text:`was being painted`,explanation:`Ít phù hợp hơn HTHT khi có 'recently'.`,correct:!1},{text:`is painted`,explanation:`Sai thì: 'is painted' là hiện tại đơn, không phù hợp kết quả sơn gần đây đang thể hiện hiện tại.`,correct:!1}]},{q:`I noticed that the gate ___ before I arrived; it was unlocked.`,a:[{text:`had been broken`,correct:!0,explanation:`QKHT bị động: break -> broken.`},{text:`has been broken`,explanation:`Sai thì (câu bắt đầu bằng QKĐ 'noticed').`,correct:!1},{text:`was breaking`,explanation:`Chỉ trạng thái, không rõ hành động trước đó.`,correct:!1},{text:`will have been broken`,explanation:`Sai: 'will have been broken' là tương lai, trong khi cổng bị phá trước lúc người nói đến.`,correct:!1}]},{q:`The email ___ yet, so please wait a moment.`,a:[{text:`hasn't been sent`,correct:!0,explanation:`HTHT phủ định bị động.`},{text:`haven't been sent`,explanation:`Email là số ít. Cách dùng phù hợp trong câu này là “hasn't been sent”.`,correct:!1},{text:`isn't sent`,explanation:`Sai. 'Isn't sent' là hiện tại đơn; 'yet' và lời nhắc chờ cho thấy việc chưa hoàn tất đến hiện tại.`,correct:!1},{text:`hadn't been sent`,explanation:`Sai: 'hadn't been sent' cần mốc quá khứ; 'yet' và lời yêu cầu chờ đợi nối với hiện tại.`,correct:!1}]},{q:`The homework ___ already before the teacher arrived.`,a:[{text:`had been done`,correct:!0,explanation:`QKHT bị động: do -> done.`},{text:`has been done`,explanation:`Sai: 'has been done' không lùi theo 'arrived'; bài tập đã xong trước giáo viên đến.`,correct:!1},{text:`was doing`,explanation:`Sai thì: 'was doing' là chủ động, không diễn tả bài tập đã hoàn tất trước giáo viên đến.`,correct:!1},{text:`will have been done`,explanation:`Sai: 'will have been done' là tương lai hoàn thành, không hợp mốc giáo viên đã đến.`,correct:!1}]},{q:`How many letters ___ today so far?`,a:[{text:`have been written`,correct:!0,explanation:`HTHT bị động: write -> written.`},{text:`has been written`,explanation:`Sai. 'Has been written' không hòa hợp với chủ ngữ số nhiều 'How many letters'.`,correct:!1},{text:`were being written`,explanation:`Sai. 'Were written' là quá khứ đơn, không phù hợp với khoảng thời gian 'today' còn đang tiếp diễn.`,correct:!1},{text:`had been written`,explanation:`Sai: 'had been written' không hợp với 'today so far', vốn tính kết quả đến hiện tại.`,correct:!1}]},{q:`By the time the sun sets, the crops ___.`,a:[{text:`will have been harvested`,correct:!0,explanation:`TLHT bị động: mùa màng sẽ được thu hoạch xong trước lúc mặt trời lặn.`},{text:`will be harvest`,explanation:`Sai: 'will be harvest' thiếu V3 'harvested' và thiếu 'have' trước mốc mặt trời lặn.`,correct:!1},{text:`have been harvested`,explanation:
