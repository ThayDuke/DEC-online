const fullQuestionBank=[{q:`Choose the correct conjunction: We stayed indoors ___ the weather was terrible.`,a:[{text:`because`,correct:!0,explanation:`'Because' dùng để chỉ nguyên nhân.`},{text:`although`,explanation:`'Although' dùng cho sự nhượng bộ, không hợp logic.`,correct:!1},{text:`but`,explanation:`'But' dùng để chỉ sự đối lập.`,correct:!1},{text:`so`,explanation:`'So' dùng để chỉ kết quả.`,correct:!1}]},{q:`Choose the correct conjunction: ___ it was midnight, the streets were still crowded.`,a:[{text:`Although`,correct:!0,explanation:`'Although' diễn tả sự nhượng bộ (mặc dù).`},{text:`Because`,explanation:`'Because' chỉ nguyên nhân, không hợp lý ở đây.`,correct:!1},{text:`If`,explanation:`'If' dùng cho câu điều kiện.`,correct:!1},{text:`Since`,explanation:`'Since' ở đây thường chỉ nguyên nhân.`,correct:!1}]},{q:`Choose the correct conjunction: You should bring an umbrella ___ it rains later.`,a:[{text:`in case`,correct:!0,explanation:`'In case' dùng để phòng ngừa một việc có thể xảy ra.`},{text:`so that`,explanation:`'So that' chỉ mục đích.`,correct:!1},{text:`unless`,explanation:`'Unless' nghĩa là trừ khi, không hợp nghĩa.`,correct:!1},{text:`although`,explanation:`'Although' chỉ sự nhượng bộ.`,correct:!1}]},{q:`Choose the correct conjunction: I will call you ___ I arrive at the airport.`,a:[{text:`as soon as`,correct:!0,explanation:`'As soon as' chỉ một hành động xảy ra ngay sau một hành động khác.`},{text:`while`,explanation:`'While' chỉ hai hành động xảy ra song song.`,correct:!1},{text:`until`,explanation:`'Until' nghĩa là cho đến khi.`,correct:!1},{text:`unless`,explanation:`'Unless' không hợp nghĩa.`,correct:!1}]},{q:`Choose the correct conjunction: He studied very hard ___ he could pass the exam.`,a:[{text:`so that`,correct:!0,explanation:`'So that' dùng để chỉ mục đích.`},{text:`because`,explanation:`'Because' chỉ nguyên nhân.`,correct:!1},{text:`even though`,explanation:`'Even though' chỉ sự nhượng bộ.`,correct:!1},{text:`if`,explanation:`'If' chỉ điều kiện. Cách dùng phù hợp trong câu này là “so that”.`,correct:!1}]},{q:`Choose the correct conjunction: ___ you finish your homework, you can't go out.`,a:[{text:`Unless`,correct:!0,explanation:`'Unless' = If not (Trừ khi/Nếu không).`},{text:`If`,explanation:`'If' làm câu mang nghĩa: Nếu bạn làm bài xong thì không được đi (sai logic).`,correct:!1},{text:`Because`,explanation:`'Because' không hợp nghĩa.`,correct:!1},{text:`When`,explanation:`'When' không hợp logic trong ngữ cảnh này.`,correct:!1}]},{q:`Choose the correct conjunction: I like apples, ___ my sister prefers oranges.`,a:[{text:`whereas`,correct:!0,explanation:`'Whereas' dùng để so sánh hai sự thật đối lập nhau.`},{text:`because`,explanation:`'Because' chỉ nguyên nhân.`,correct:!1},{text:`so that`,explanation:`'So that' chỉ mục đích.`,correct:!1},{text:`as long as`,explanation:`'As long as' chỉ điều kiện.`,correct:!1}]},{q:`Choose the correct conjunction: We will go for a picnic ___ the weather is fine.`,a:[{text:`provided that`,correct:!0,explanation:`'Provided that' nghĩa là miễn là (điều kiện).`},{text:`even if`,explanation:`'Even if' nghĩa là ngay cả khi (nhượng bộ).`,correct:!1},{text:`unless`,explanation:`'Unless' nghĩa là trừ khi (sai logic).`,correct:!1},{text:`though`,explanation:`'Though' chỉ sự nhượng bộ.`,correct:!1}]},{q:`Choose the correct conjunction: ___ I was walking home, I saw an old friend.`,a:[{text:`While`,correct:!0,explanation:`'While' dùng cho hành động đang diễn ra.`},{text:`So`,explanation:`'So' chỉ kết quả. Cách dùng phù hợp trong câu này là “While”.`,correct:!1},{text:`Unless`,explanation:`'Unless' chỉ điều kiện.`,correct:!1},{text:`Because of`,explanation:`'Because of' phải đi với danh từ/V-ing.`,correct:!1}]},{q:`Choose the correct conjunction: He failed the test ___ he didn't study at all.`,a:[{text:`since`,correct:!0,explanation:`'Since' ở đây đồng nghĩa với 'because' (vì).`},{text:`but`,explanation:`'But' chỉ sự đối lập.`,correct:!1},{text:`although`,explanation:`'Although' chỉ sự nhượng bộ.`,correct:!1},{text:`so`,explanation:`'So' chỉ kết quả. Cách dùng phù hợp trong câu này là “since”.`,correct:!1}]},{q:`Choose the correct conjunction: Put on your coat, ___ you will catch a cold.`,a:[{text:`otherwise`,correct:!0,explanation:`'Otherwise' nghĩa là nếu không thì.`},{text:`therefore`,explanation:`'Therefore' nghĩa là vì vậy (chỉ kết quả trực tiếp).`,correct:!1},{text:`moreover`,explanation:`'Moreover' nghĩa là hơn nữa.`,correct:!1},{text:`although`,explanation:`'Although' không hợp nghĩa.`,correct:!1}]},{q:`Choose the correct conjunction: I won't help you ___ you tell me the truth.`,a:[{text:`unless`,correct:!0,explanation:`'Unless' (trừ khi) phù hợp với nghĩa phủ định của câu.`},{text:`if`,explanation:`Dùng 'if' sẽ khiến câu mang nghĩa: Nếu bạn nói thật tôi sẽ không giúp (sai logic).`,correct:!1},{text:`because`,explanation:`'Because' không hợp nghĩa.`,correct:!1},{text:`since`,explanation:`'Since' không hợp nghĩa.`,correct:!1}]},{q:`Choose the correct conjunction: He is very rich; ___ , he is not happy.`,a:[{text:`however`,correct:!0,explanation:`'However' dùng để nối hai ý đối lập giữa hai câu.`},{text:`consequently`,explanation:`'Consequently' chỉ kết quả.`,correct:!1},{text:`furthermore`,explanation:`'Furthermore' dùng để bổ sung thông tin.`,correct:!1},{text:`because`,explanation:`'Because' không dùng sau dấu chấm phẩy như vậy.`,correct:!1}]},{q:`Choose the correct conjunction: ___ it was very cold, she went out without a scarf anyway.`,a:[{text:`Even though`,correct:!0,explanation:`'Even though' dùng cho sự nhượng bộ (mặc dù).`},{text:`Because of`,explanation:`'Because of' phải đi với danh từ/cụm danh từ, không đi trực tiếp với mệnh đề 'it was very cold'.`,correct:!1},{text:`If`,explanation:`'If' không hợp nghĩa.`,correct:!1},{text:`Therefore`,explanation:`'Therefore' không đứng trước mệnh đề phụ ở vị trí này; câu cần liên từ nhượng bộ.`,correct:!1}]},{q:`Choose the correct conjunction: We stayed at the library ___ it closed.`,a:[{text:`until`,correct:!0,explanation:`'Until' nghĩa là cho đến khi.`},{text:`while`,explanation:`'While' nghĩa là trong khi (sai logic).`,correct:!1},{text:`since`,explanation:`'Since' nghĩa là kể từ khi.`,correct:!1},{text:`after`,explanation:`'After' không phù hợp với 'stayed'.`,correct:!1}]},{q:`Choose the correct conjunction: I am saving money ___ I can buy a new bike.`,a:[{text:`so that`,correct:!0,explanation:`'So that' chỉ mục đích.`},{text:`because`,explanation:`'Because' chỉ nguyên nhân.`,correct:!1},{text:`although`,explanation:`'Although' chỉ sự nhượng bộ.`,correct:!1},{text:`unless`,explanation:`'Unless' chỉ điều kiện.`,correct:!1}]},{q:`Choose the correct conjunction: You can use my laptop ___ you are careful with it.`,a:[{text:`as long as`,correct:!0,explanation:`'As long as' nghĩa là miễn là.`},{text:`even if`,explanation:`'Even if' nghĩa là ngay cả khi.`,correct:!1},{text:`unless`,explanation:`'Unless' nghĩa là trừ khi (sai logic).`,correct:!1},{text:`though`,explanation:`'Though' chỉ sự nhượng bộ.`,correct:!1}]},{q:`Choose the correct conjunction: ___ you go, I will follow you.`,a:[{text:`Wherever`,correct:!0,explanation:`'Wherever' nghĩa là bất cứ nơi nào.`},{text:`Whatever`,explanation:`'Whatever' nghĩa là bất cứ điều gì.`,correct:!1},{text:`Whenever`,explanation:`'Whenever' nghĩa là bất cứ khi nào.`,correct:!1},{text:`However`,explanation:`'However' ở đây không hợp nghĩa.`,correct:!1}]},{q:`Choose the correct conjunction: I haven't seen him ___ he moved to London.`,a:[{text:`since`,correct:!0,explanation:`'Since' dùng để mốc thời gian từ quá khứ.`},{text:`for`,explanation:`'For' đi với khoảng thời gian.`,correct:!1},{text:`while`,explanation:`'While' đi với một hành động đang diễn ra.`,correct:!1},{text:`when`,explanation:`'When' ít phổ biến hơn 'since' trong cấu trúc hiện tại hoàn thành.`,correct:!1}]},{q:`Choose the correct conjunction: She is both intelligent ___ hardworking.`,a:[{text:`and`,correct:!0,explanation:`Cấu trúc 'Both ... and ...'.`},{text:`but`,explanation:`Sai. Cặp liên từ 'both ... and ...' không dùng 'but'.`,correct:!1},{text:`or`,explanation:`Sai. 'Or' diễn tả lựa chọn, không hoàn thành cấu trúc 'both ... and ...'.`,correct:!1},{text:`as well`,explanation:`Sai. 'As well' không phải liên từ đứng sau 'both'; cấu trúc cần 'and'.`,correct:!1}]},{q:`Choose the correct order: ___ , we went for a walk.`,a:[{text:`After the rain had stopped`,correct:!0,explanation:`Trật tự đúng: Liên từ + mệnh đề phụ, mệnh đề chính.`},{text:`The rain had stopped after`,explanation:`Sai vị trí liên từ. Cách dùng phù hợp trong câu này là “After the rain had stopped”.`,correct:!1},{text:`After had stopped the rain`,explanation:`Sai trật tự chủ ngữ - động từ.`,correct:!1},{text:`Had stopped the rain after`,explanation:`Vô nghĩa. Cách dùng phù hợp trong câu này là “After the rain had stopped”.`,correct:!1}]},{q:`Choose the correct order: I'll lend you the book ___ .`,a:[{text:`when I finish reading it`,correct:!0,explanation:`Mệnh đề thời gian dùng hiện tại đơn để chỉ tương lai.`},{text:`when I will finish reading it`,explanation:`Không dùng 'will' trong mệnh đề thời gian.`,correct:!1},{text:`I finish reading it when`,explanation:`Sai vị trí liên từ. Cách dùng phù hợp trong câu này là “when I finish reading it”.`,correct:!1},{text:`when finish I reading it`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “when I finish reading it”.`,correct:!1}]},{q:`Choose the correct order: ___ , she still feels lonely.`,a:[{text:`Though she has many friends`,correct:!0,explanation:`Liên từ nhượng bộ đứng đầu mệnh đề phụ.`},{text:`She has many friends though`,explanation:`Nếu 'though' đứng cuối câu thì ý nghĩa khác và cần dấu phẩy.`,correct:!1},{text:`Has she many friends though`,explanation:`Sai. Phương án 'Has she many friends though' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`Many friends she has though`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “Though she has many friends”.`,correct:!1}]},{q:`Choose the correct order: He was so tired ___ .`,a:[{text:`that he fell asleep immediately`,correct:!0,explanation:`Cấu trúc 'So + adj + that + mệnh đề'.`},{text:`he fell asleep immediately that`,explanation:`Sai vị trí 'that'. Cách dùng phù hợp trong câu này là “that he fell asleep immediately”.`,correct:!1},{text:`that immediately he fell asleep`,explanation:`Trạng từ 'immediately' nên đứng sau động từ hoặc cuối câu.`,correct:!1},{text:`fell he asleep that immediately`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “that he fell asleep immediately”.`,correct:!1}]},{q:`Choose the correct order: We won't start the meeting ___ .`,a:[{text:`until everyone arrives`,correct:!0,explanation:`Mệnh đề với 'until' dùng hiện tại đơn.`},{text:`until everyone will arrive`,explanation:`Không dùng 'will' sau 'until'.`,correct:!1},{text:`everyone arrives until`,explanation:`Sai vị trí liên từ. Cách dùng phù hợp trong câu này là “until everyone arrives”.`,correct:!1},{text:`until arrives everyone`,explanation:`Sai trật tự chủ ngữ - động từ.`,correct:!1}]},{q:`Choose the correct order: ___ , I would buy a big house.`,a:[{text:`If I won the lottery`,correct:!0,explanation:`Cấu trúc câu điều kiện loại 2.`},{text:`I won the lottery if`,explanation:`Sai vị trí liên từ khi đứng đầu câu.`,correct:!1},{text:`If I win the lottery`,explanation:`Sai loại điều kiện (vế sau dùng would buy).`,correct:!1},{text:`If would I win the lottery`,explanation:`Không dùng 'would' trong mệnh đề If.`,correct:!1}]},{q:`Choose the correct order: I don't know ___ .`,a:[{text:`where she lives`,correct:!0,explanation:`Mệnh đề danh ngữ: Từ để hỏi + chủ ngữ + động từ.`},{text:`where does she live`,explanation:`Sai. Mệnh đề danh ngữ không đảo trợ động từ: dùng 'where she lives'.`,correct:!1},{text:`she lives where`,explanation:`Sai. Từ để hỏi 'where' phải đứng đầu mệnh đề phụ.`,correct:!1},{text:`where lives she`,explanation:`Sai. Sau 'where' là chủ ngữ 'she', rồi mới đến động từ 'lives'.`,correct:!1}]},{q:`Choose the correct order: ___ , please let me know.`,a:[{text:`If you have any questions`,correct:!0,explanation:`Mệnh đề điều kiện đứng trước mệnh đề chính.`},{text:`You have any questions if`,explanation:`Sai. Mệnh đề điều kiện phải bắt đầu bằng 'If', không đặt 'if' ở cuối.`,correct:!1},{text:`Have you any questions if`,explanation:`Sai. Đây là câu hỏi đảo trợ động từ và vẫn đặt 'if' sai vị trí.`,correct:!1},{text:`If any questions you have`,explanation:`Sai. Sau 'If' cần chủ ngữ 'you' rồi mới đến động từ 'have'.`,correct:!1}]},{q:`Choose the correct order: ___ , he couldn't fix the car.`,a:[{text:`Despite his efforts`,correct:!0,explanation:`'Despite' đi với danh từ/cụm danh từ.`},{text:`Despite he tried hard`,explanation:`'Despite' không đi với mệnh đề.`,correct:!1},{text:`Efforts his despite`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “Despite his efforts”.`,correct:!1},{text:`He tried hard despite`,explanation:`Sai. Phương án 'He tried hard despite' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`Choose the correct order: I will stay at home ___ .`,a:[{text:`in case it rains`,correct:!0,explanation:`Mệnh đề với 'in case' dùng hiện tại đơn.`},{text:`in case it will rain`,explanation:`Không dùng 'will' sau 'in case'.`,correct:!1},{text:`it rains in case`,explanation:`Sai vị trí liên từ. Cách dùng phù hợp trong câu này là “in case it rains”.`,correct:!1},{text:`in case rains it`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “in case it rains”.`,correct:!1}]},{q:`Choose the correct order: She speaks English ___, but she is not a native speaker.`,a:[{text:`as if she were a native`,correct:!0,explanation:`Cấu trúc 'as if' diễn tả điều không thật.`},{text:`as if she is a native`,explanation:`Dùng 'were' chuẩn ngữ pháp hơn trong câu giả định.`,correct:!1},{text:`she were a native as if`,explanation:`Sai vị trí liên từ. Cách dùng phù hợp trong câu này là “as if she were a native”.`,correct:!1},{text:`as a native she if were`,explanation:`Vô nghĩa. Cách dùng phù hợp trong câu này là “as if she were a native”.`,correct:!1}]},{q:`Choose the correct order: ___ , he went to bed.`,a:[{text:`As soon as he had finished his work`,correct:!0,explanation:`Hành động hoàn thành trước một hành động quá khứ khác.`},{text:`He had finished his work as soon as`,explanation:`Sai vị trí liên từ. Cách dùng phù hợp trong câu này là “As soon as he had finished his work”.`,correct:!1},{text:`As soon as had he finished his work`,explanation:`Sai trật tự chủ ngữ - trợ động từ.`,correct:!1},{text:`Finished he his work as soon as`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “As soon as he had finished his work”.`,correct:!1}]},{q:`Choose the correct order: I am not sure ___ .`,a:[{text:`whether they are coming or not`,correct:!0,explanation:`Cấu trúc 'whether ... or not' (liệu ... có hay không).`},{text:`they are coming or not whether`,explanation:`Sai vị trí liên từ. Cách dùng phù hợp trong câu này là “whether they are coming or not”.`,correct:!1},{text:`whether or not are they coming`,explanation:`Phải dùng trật tự câu trần thuật.`,correct:!1},{text:`whether coming they are or not`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “whether they are coming or not”.`,correct:!1}]},{q:`Choose the correct order: He asked me ___ .`,a:[{text:`why I was late`,correct:!0,explanation:`Câu tường thuật: Từ để hỏi + S + V.`},{text:`why was I late`,explanation:`Đây là trật tự câu hỏi trực tiếp.`,correct:!1},{text:`I was late why`,explanation:`Sai vị trí từ để hỏi.`,correct:!1},{text:`why late I was`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “why I was late”.`,correct:!1}]},{q:`Choose the correct order: ___ , we can go out.`,a:[{text:`Now that it has stopped raining`,correct:!0,explanation:`'Now that' đứng đầu mệnh đề nguyên nhân hoàn chỉnh.`},{text:`It has stopped raining now that`,explanation:`Sai vị trí và tạo mệnh đề phụ dang dở trước dấu phẩy.`,correct:!1},{text:`Now that has it stopped raining`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “Now that it has stopped raining”.`,correct:!1},{text:`Stopped raining now that it has`,explanation:`Vô nghĩa. Cách dùng phù hợp trong câu này là “Now that it has stopped raining”.`,correct:!1}]},{q:`Combine: It was very dark. We couldn't see anything.`,a:[{text:`It was so dark that we couldn't see anything.`,correct:!0,explanation:`Sử dụng cấu trúc 'so... that' để chỉ kết quả.`},{text:`It was dark because we couldn't see anything.`,explanation:`Sai quan hệ nguyên nhân - kết quả.`,correct:!1},{text:`Although it was dark, we could see everything.`,explanation:`Sai logic. Cách dùng phù hợp trong câu này là “It was so dark that we couldn't see anything.”.`,correct:!1},{text:`It was dark, so we could see everything.`,explanation:`Câu này đảo kết quả thành khả năng nhìn thấy, trái với dữ kiện 'couldn't see anything'.`,correct:!1}]},{q:`Combine: She studied hard. She wanted to get a scholarship.`,a:[{text:`She studied hard so that she could get a scholarship.`,correct:!0,explanation:`Sử dụng 'so that' để chỉ mục đích.`},{text:`She studied hard because she got a scholarship.`,explanation:`Sai thì và logic (chưa nhận được học bổng).`,correct:!1},{text:`Although she studied hard, she got a scholarship.`,explanation:`Sai logic nhượng bộ.`,correct:!1},{text:`She studied hard but she wanted a scholarship.`,explanation:`Sai liên từ. Cách dùng phù hợp trong câu này là “She studied hard so that she could get a scholarship.”.`,correct:!1}]},{q:`Combine: I don't have enough money. I can't buy that phone.`,a:[{text:`If I had enough money, I could buy that phone.`,correct:!0,explanation:`Dùng câu điều kiện loại 2 để giả định trái ngược hiện tại.`},{text:`If I had enough money, I can buy that phone.`,explanation:`Trộn sai hai thì của câu điều kiện; mệnh đề chính phải dùng 'could'.`,correct:!1},{text:`I can buy that phone because I don't have money.`,explanation:`Sai logic. Cách dùng phù hợp trong câu này là “If I had enough money, I could buy that phone.”.`,correct:!1},{text:`Although I have money, I can't buy the phone.`,explanation:`Sai sự thật. Cách dùng phù hợp trong câu này là “If I had enough money, I could buy that phone.”.`,correct:!1}]},{q:`Combine: He is very old. He still plays football every day.`,a:[{text:`Although he is very old, he still plays football.`,correct:!0,explanation:`Dùng 'Although' chỉ sự nhượng bộ.`},{text:`He is old because he plays football.`,explanation:`Sai quan hệ nguyên nhân: chơi bóng không phải nguyên nhân khiến anh ấy già.`,correct:!1},{text:`He is old, so he plays football.`,explanation:`Sai quan hệ kết quả: tuổi cao không giải thích việc anh ấy vẫn chơi bóng mỗi ngày.`,correct:!1},{text:`Unless he is old, he plays football.`,explanation:`Sai nghĩa: 'unless' tạo điều kiện phủ định, không diễn tả sự tương phản giữa tuổi cao và việc chơi bóng.`,correct:!1}]},{q:`Combine: The movie was boring. We left the cinema early.`,a:[{text:`Since the movie was boring, we left the cinema early.`,correct:!0,explanation:`'Since' (vì) chỉ nguyên nhân.`},{text:`The movie was exciting, but we left early.`,explanation:`Đổi dữ kiện 'boring' thành 'exciting'.`,correct:!1},{text:`We left early so the movie was boring.`,explanation:`Sai trật tự nguyên nhân - kết quả.`,correct:!1},{text:`Although the movie was exciting, we left early.`,explanation:`Không giữ đúng thông tin đã cho: bộ phim được mô tả là nhàm chán.`,correct:!1}]},{q:`Combine: Finish your meal. You can have dessert.`,a:[{text:`After you finish your meal, you can have dessert.`,correct:!0,explanation:`'After' chỉ trình tự thời gian hợp lý.`},{text:`You can have dessert before you finish your meal.`,explanation:`Sai logic. Cách dùng phù hợp trong câu này là “After you finish your meal, you can have dessert.”.`,correct:!1},{text:`While you finish your meal, you have dessert.`,explanation:`Sai logic thời gian.`,correct:!1},{text:`Unless you finish your meal, you can have dessert.`,explanation:`Sai logic (Nếu không ăn xong lại được ăn tráng miệng).`,correct:!1}]},{q:`Combine: It might rain. I'll take a raincoat.`,a:[{text:`I'll take a raincoat in case it rains.`,correct:!0,explanation:`'In case' dùng để chuẩn bị cho khả năng xảy ra.`},{text:`I'll take a raincoat so that it rains.`,explanation:`Sai logic (Mang áo mưa để trời mưa).`,correct:!1},{text:`Although it rains, I'll take a raincoat.`,explanation:`Kém tự nhiên hơn 'in case'.`,correct:!1},{text:`I'll take a raincoat unless it rains.`,explanation:`Sai logic. Cách dùng phù hợp trong câu này là “I'll take a raincoat in case it rains.”.`,correct:!1}]},{q:`Combine: He didn't come to the party. He was sick.`,a:[{text:`He didn't come to the party because he was sick.`,correct:!0,explanation:`'Because' nối nguyên nhân.`},{text:`He was sick, but he didn't come to the party.`,explanation:`Dùng 'but' làm giảm tính kết nối nguyên nhân.`,correct:!1},{text:`Although he was sick, he came to the party.`,explanation:`Sai logic nhượng bộ.`,correct:!1},{text:`He didn't come to the party so he was sick.`,explanation:`Sai trật tự nguyên nhân - kết quả.`,correct:!1}]},{q:`Combine: You study hard. You will pass the exam.`,a:[{text:`If you study hard, you will pass the exam.`,correct:!0,explanation:`Câu điều kiện loại 1 cho sự việc có thể xảy ra.`},{text:`Unless you study hard, you will pass the exam.`,explanation:`Sai logic (Không học mà vẫn đỗ).`,correct:!1},{text:`You will pass the exam because you study lazily.`,explanation:`Mâu thuẫn với dữ kiện 'study hard'.`,correct:!1},{text:`Although you study hard, you will pass.`,explanation:`Sai logic. Cách dùng phù hợp trong câu này là “If you study hard, you will pass the exam.”.`,correct:!1}]},{q:`Combine: She was tired. She finished her homework.`,a:[{text:`In spite of being tired, she finished her homework.`,correct:!0,explanation:`'In spite of' + V-ing chỉ sự nhượng bộ.`},{text:`Because she was tired, she did not finish her homework.`,explanation:`Sai. Câu mới phủ định việc hoàn thành, trái với dữ kiện cô ấy vẫn làm xong bài.`,correct:!1},{text:`She was tired, so she did not finish her homework.`,explanation:`Sai. 'Did not finish' đảo ngược kết quả đã cho trong câu gốc.`,correct:!1},{text:`Unless she was tired, she finished her homework.`,explanation:`Sai. 'Unless' không diễn tả sự nhượng bộ giữa mệt và vẫn hoàn thành bài.`,correct:!1}]},{q:`Combine: The car is expensive. I can't afford it.`,a:[{text:`The car is so expensive that I can't afford it.`,correct:!0,explanation:`Cấu trúc 'so... that' chỉ kết quả.`},{text:`I can afford the car although it is expensive.`,explanation:`Mâu thuẫn với dữ kiện 'I can't afford it'.`,correct:!1},{text:`The car is expensive because I can't afford it.`,explanation:`Sai logic nguyên nhân.`,correct:!1},{text:`The car is cheap but I can't afford it.`,explanation:`Mâu thuẫn với quan hệ nguyên nhân được cho: xe đắt nên không đủ khả năng mua.`,correct:!1}]},{q:`Combine: The sun went down. It got colder.`,a:[{text:`As the sun went down, it got colder.`,correct:!0,explanation:`'As' diễn tả hai sự việc thay đổi cùng lúc.`},{text:`The sun went down although it got colder.`,explanation:`Sai logic. Cách dùng phù hợp trong câu này là “As the sun went down, it got colder.”.`,correct:!1},{text:`Because it got colder, the sun went down.`,explanation:`Sai logic tự nhiên. Cách dùng phù hợp trong câu này là “As the sun went down, it got colder.”.`,correct:!1},{text:`It got colder before the sun went down.`,explanation:`Sai thực tế. Cách dùng phù hợp trong câu này là “As the sun went down, it got colder.”.`,correct:!1}]},{q:`Combine: He is not very tall. He is a great basketball player.`,a:[{text:`Despite not being very tall, he is a great player.`,correct:!0,explanation:`Dùng 'Despite' cho sự nhượng bộ.`},{text:`He is a great player because he is not tall.`,explanation:`Sai quan hệ nguyên nhân: không cao không phải lý do khiến anh ấy chơi bóng giỏi.`,correct:!1},{text:`If he is not tall, he is a great player.`,explanation:`Sai. Câu điều kiện biến chiều cao thành điều kiện của năng lực, trái với ý nhượng bộ.`,correct:!1},{text:`He is not tall, so he cannot be a great player.`,explanation:`Mâu thuẫn với dữ kiện anh ấy là một cầu thủ giỏi.`,correct:!1}]},{q:`Combine: We arrived early. We wanted to get good seats.`,a:[{text:`We arrived early in order to get good seats.`,correct:!0,explanation:`'In order to' chỉ mục đích.`},{text:`We arrived early because we got good seats.`,explanation:`Sai trình tự: có ghế tốt là kết quả mong muốn, không phải nguyên nhân đã xảy ra trước.`,correct:!1},{text:`Although we arrived late, we got good seats.`,explanation:`Sai. Phương án đổi dữ kiện 'arrived early' thành 'arrived late'.`,correct:!1},{text:`We arrived late but we got good seats.`,explanation:`Sai. Phương án thay đổi dữ kiện ban đầu từ đến sớm thành đến muộn.`,correct:!1}]},{q:`Combine: You don't hurry. You will miss the bus.`,a:[{text:`Unless you hurry, you will miss the bus.`,correct:!0,explanation:`Unless = If you don't.`},{text:`If you hurry, you will miss the bus.`,explanation:`Sai nghĩa: nếu vội thì câu này lại nói sẽ lỡ xe, trái với quan hệ thực tế.`,correct:!1},{text:`Because you hurry, you will miss the bus.`,explanation:`Sai nguyên nhân: vội không khiến bạn lỡ xe trong dữ kiện đã cho.`,correct:!1},{text:`You hurry so you will miss the bus.`,explanation:`Sai cả nghĩa và cấu trúc: 'hurry' phải ở dạng phủ định để giữ ý gốc.`,correct:!1}]},{q:`Complete: I'll go to the park ___ .`,a:[{text:`if it doesn't rain`,correct:!0,explanation:`Mệnh đề điều kiện phù hợp.`},{text:`unless it doesn't rain`,explanation:`Sai. Phương án 'unless it doesn't rain' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`if it will not rain`,explanation:`Không dùng 'will' trong mệnh đề If.`,correct:!1},{text:`because it rains`,explanation:`Sai logic. Cách dùng phù hợp trong câu này là “if it doesn't rain”.`,correct:!1}]},{q:`Complete: ___ , she didn't get the job.`,a:[{text:`Even though she was qualified`,correct:!0,explanation:`Sự nhượng bộ phù hợp với kết quả phủ định.`},{text:`Because she was qualified`,explanation:`Sai logic (đủ năng lực mà không được nhận).`,correct:!1},{text:`If she was unqualified`,explanation:`Không hợp nghĩa. Cách dùng phù hợp trong câu này là “Even though she was qualified”.`,correct:!1},{text:`Despite she was qualified`,explanation:`'Despite' không đi với mệnh đề.`,correct:!1}]},{q:`Complete with a purpose clause: We should leave now ___ .`,a:[{text:`so that we won't be late`,correct:!0,explanation:`Đây là mệnh đề chỉ mục đích như yêu cầu.`},{text:`because we late`,explanation:`Sai ngữ pháp và không phải mệnh đề mục đích.`,correct:!1},{text:`unless we are late`,explanation:`Đây là mệnh đề điều kiện.`,correct:!1},{text:`although we are early`,explanation:`Đây là mệnh đề nhượng bộ.`,correct:!1}]},{q:`Complete: He speaks so quickly ___ .`,a:[{text:`that I can't understand him`,correct:!0,explanation:`Kết quả của việc nói quá nhanh.`},{text:`because I can't understand him`,explanation:`Sai quan hệ nguyên nhân.`,correct:!1},{text:`so that I can understand him`,explanation:`Sai logic. Cách dùng phù hợp trong câu này là “that I can't understand him”.`,correct:!1},{text:`if I understand him`,explanation:`Không hợp nghĩa. Cách dùng phù hợp trong câu này là “that I can't understand him”.`,correct:!1}]},{q:`Complete: You can borrow my pen ___ .`,a:[{text:`as long as you give it back`,correct:!0,explanation:`Điều kiện 'miễn là'.`},{text:`unless you give it back`,explanation:`Sai. 'Unless you give it back' gần nghĩa cho mượn trừ khi trả lại, trái với điều kiện cho phép.`,correct:!1},{text:`because you give it back`,explanation:`Sai. Việc trả bút là điều kiện, không phải nguyên nhân giải thích việc có thể mượn.`,correct:!1},{text:`although you give it back`,explanation:`Sai. 'Although' diễn tả tương phản, không phù hợp
