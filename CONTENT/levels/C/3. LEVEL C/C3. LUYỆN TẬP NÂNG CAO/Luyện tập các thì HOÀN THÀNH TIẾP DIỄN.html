' dùng 'has'.`,correct:!1}]},{q:`We ___ our vacation for six months.`,a:[{text:`have been planning`,correct:!0,explanation:`Hiện tại hoàn thành tiếp diễn (T10). Hành động kéo dài trong 6 tháng ('for six months').`},{text:`are planning`,explanation:`Hiện tại tiếp diễn (sai thì).`,correct:!1},{text:`had planned`,explanation:`Quá khứ hoàn thành (sai thì).`,correct:!1},{text:`plan`,explanation:`Hiện tại đơn (sai thì).`,correct:!1}]},{q:`The dog ___ loudly all night, and it is still barking now.`,a:[{text:`has been barking`,correct:!0,explanation:`Hiện tại hoàn thành tiếp diễn (T10). Hành động kéo dài ('all night').`},{text:`is barking`,explanation:`Hiện tại tiếp diễn (sai thì).`,correct:!1},{text:`barked`,explanation:`Quá khứ đơn (sai thì).`,correct:!1},{text:`have been barking`,explanation:`Sai. Chủ ngữ 'The dog' dùng 'has'.`,correct:!1}]},{q:`They ___ to fix the car since this morning.`,a:[{text:`have been trying`,correct:!0,explanation:`Hiện tại hoàn thành tiếp diễn (T10). Hành động kéo dài ('since this morning').`},{text:`has been trying`,explanation:`Sai. Chủ ngữ 'They' dùng 'have'.`,correct:!1},{text:`were trying`,explanation:`Quá khứ tiếp diễn (sai thì).`,correct:!1},{text:`try`,explanation:`Hiện tại đơn (sai thì).`,correct:!1}]},{q:`I ___ English for ten years.`,a:[{text:`have been teaching`,correct:!0,explanation:`Hiện tại hoàn thành tiếp diễn (T10). Hành động kéo dài ('for ten years').`},{text:`teach`,explanation:`Hiện tại đơn (sai thì).`,correct:!1},{text:`taught`,explanation:`Quá khứ đơn (sai thì).`,correct:!1},{text:`had taught`,explanation:`Quá khứ hoàn thành (sai thì).`,correct:!1}]},{q:`Why ___ you ___ me lately? You haven't answered any of my messages.`,a:[{text:`have ... been avoiding`,correct:!0,explanation:`Hiện tại hoàn thành tiếp diễn (T10). Dùng với 'lately' để chỉ hành động liên tục gần đây.`},{text:`do ... avoid`,explanation:`Hiện tại đơn (sai thì).`,correct:!1},{text:`are ... avoiding`,explanation:`Hiện tại tiếp diễn (sai thì).`,correct:!1},{text:`did ... avoid`,explanation:`Quá khứ đơn (sai thì).`,correct:!1}]},{q:`The company ___ money for several months now.`,a:[{text:`has been losing`,correct:!0,explanation:`Hiện tại hoàn thành tiếp diễn (T10). Hành động kéo dài ('for several months now').`},{text:`is losing`,explanation:`Hiện tại tiếp diễn (sai thì).`,correct:!1},{text:`lost`,explanation:`Quá khứ đơn (sai thì).`,correct:!1},{text:`have been losing`,explanation:`Sai. Chủ ngữ 'The company' dùng 'has'.`,correct:!1}]},{q:`She ___ around the world since she graduated.`,a:[{text:`has been travelling`,correct:!0,explanation:`Hiện tại hoàn thành tiếp diễn (T10). Hành động bắt đầu từ quá khứ ('since she graduated') và tiếp diễn đến hiện tại.`},{text:`is travelling`,explanation:`Hiện tại tiếp diễn (sai thì).`,correct:!1},{text:`traveled`,explanation:`Quá khứ đơn (sai thì).`,correct:!1},{text:`had been travelling`,explanation:`Quá khứ hoàn thành tiếp diễn (sai thì).`,correct:!1}]},{q:`We ___ to contact him repeatedly for the past week, but his phone is always busy and we still haven't reached him.`,a:[{text:`have been trying`,correct:!0,explanation:`Hiện tại hoàn thành tiếp diễn (T10). Hành động cố gắng liên tục.`},{text:`tried`,explanation:`Quá khứ đơn (sai thì).`,correct:!1},{text:`are trying`,explanation:`Hiện tại tiếp diễn (sai thì).`,correct:!1},{text:`had been trying`,explanation:`Quá khứ hoàn thành tiếp diễn (sai thì).`,correct:!1}]},{q:`The ground is wet because the sprinkler ___ for hours.`,a:[{text:`has been running`,correct:!0,explanation:`Hiện tại hoàn thành tiếp diễn (T10). Hành động kéo dài gây ra kết quả hiện tại ('ground is wet').`},{text:`is running`,explanation:`Hiện tại tiếp diễn (sai thì).`,correct:!1},{text:`ran`,explanation:`Quá khứ đơn (sai thì).`,correct:!1},{text:`have been running`,explanation:`Sai. Chủ ngữ 'sprinkler' dùng 'has'.`,correct:!1}]},{q:`I ___ well lately.`,a:[{text:`haven't been sleeping`,correct:!0,explanation:`Hiện tại hoàn thành tiếp diễn (T10) thể phủ định. Hành động k
