const fullQuestionBank=[{q:`Leaflet: 'SUMMER CODING BOOTCAMP: 4-week intensive web design course for high schoolers. No coding experience needed. Laptop required. Early bird discount: 15% off before May 20.' - What is an essential entry requirement for this bootcamp?`,a:[{text:`Bringing a personal laptop computer to complete practical coding assignments.`,correct:!0,explanation:`Yêu cầu bắt buộc duy nhất là học viên phải tự trang bị máy tính xách tay cá nhân ('Laptop required').`},{text:`Having at least two years of previous programming experience in Python.`,correct:!1,explanation:`Sai: Khóa học dành cho người mới bắt đầu, không yêu cầu kinh nghiệm trước ('No coding experience needed').`},{text:`Purchasing a commercial web domain name through the university portal.`,correct:!1,explanation:`Sai: Tờ rơi không yêu cầu học viên phải bỏ tiền mua tên miền trang web riêng.`},{text:`Submitting an official recommendation letter from a high school principal.`,correct:!1,explanation:`Sai: Không có yêu cầu nộp thư giới thiệu của ban giám hiệu nhà trường.`}]},{q:`Leaflet: 'UNIVERSITY OPEN DAY 2026: Explore green campus labs, meet faculty deans, and attend career counseling panels. Free shuttle buses from Central Railway Station every 20 minutes.' - How can prospective attendees travel comfortably from Central Station?`,a:[{text:`Boarding the complimentary campus shuttle service departing every twenty minutes.`,correct:!0,explanation:`Học sinh và phụ huynh có thể đón tuyến xe buýt miễn phí chạy cách nhau 20 phút từ ga trung tâm ('Free shuttle buses every 20 minutes').`},{text:`Paying a high-speed commuter train fare to the suburban university campus.`,correct:!1,explanation:`Sai: Xe buýt đưa đón trường đại học phục vụ hoàn toàn miễn phí ('Free shuttle buses').`},{text:`Renting a shared electric bicycle from private commercial stations outside.`,correct:!1,explanation:`Sai: Tờ rơi giới thiệu tuyến xe buýt miễn phí của trường chứ không yêu cầu thuê xe đạp ngoài.`},{text:`Walking four kilometers through downtown pedestrian shopping boulevards.`,correct:!1,explanation:`Sai: Tuyến xe buýt miễn phí đưa đón trực tiếp giúp khách không phải đi bộ xa.`}]},{q:`Leaflet: 'GRAPHIC DESIGN WORKSHOP: Master typography and vector illustrations using tablet styluses. Limited to 20 seats. Register via school portal before Friday noon.' - Why should interested candidates submit their enrollment forms quickly?`,a:[{text:`Because enrollment is strictly capped at twenty participants per session.`,correct:!0,explanation:`Học viên cần đăng ký sớm vì số lượng chỗ ngồi có hạn, tối đa 20 người ('Limited to 20 seats').`},{text:`Because digital design tablets must be reserved from international warehouses.`,correct:!1,explanation:`Sai: Máy tính bảng và bút vẽ có sẵn tại lớp, không phải đặt trước từ kho nước ngoài.`},{text:`Because registration fees double automatically after Wednesday midnight.`,correct:!1,explanation:`Sai: Tờ rơi không đề cập đến việc tăng học phí sau nửa đêm thứ Tư.`},{text:`Because an entrance art portfolio must be evaluated by a jury board.`,correct:!1,explanation:`Sai: Không có vòng chấm hồ sơ năng khiếu nghệ thuật trước khi đăng ký.`}]},{q:`Leaflet: 'IELTS PREPARATION MASTERCLASS: Boost Academic Writing Task 2 coherence. Taught by certified examiners. Free sample essays provided upon entry.' - What complimentary learning resource is given to attendees upon arrival?`,a:[{text:`A collection of exemplar academic essays distributed at the entrance door.`,correct:!0,explanation:`Người tham dự được tặng bài viết mẫu học thuật miễn phí ngay khi bước vào lớp ('Free sample essays provided upon entry').`},{text:`A hardcover comprehensive grammar textbook with audio listening compact discs.`,correct:!1,explanation:`Sai: Khóa học chỉ tặng bài viết luận mẫu chứ không tặng sách giáo khoa ngữ pháp dày cộp.`},{text:`A discount voucher for full registration of the official computer exam.`,correct:!1,explanation:`Sai: Masterclass không tặng phiếu giảm giá lệ phí thi chứng chỉ quốc tế.`},{text:`A personalized one-on-one speaking interview evaluation with examiners.`,correct:!1,explanation:`Sai: Sự kiện tập trung vào bài thi Viết Task 2 chứ không tổ chức phỏng vấn Nói 1-1.`}]},{q:`Leaflet: 'ROBOTICS CLUB SHOWCASE: Witness autonomous drone navigation and robotic arm assembly. Interactive test stations open to all visitors. Free admission.' - What interactive activity can guests experience at the robotics showcase?`,a:[{text:`Testing robotic controls directly at specialized public demonstrator booths.`,correct:!0,explanation:`Khách tham quan được trực tiếp thử nghiệm điều khiển tại các trạm trải nghiệm tương tác ('Interactive test stations open to all visitors').`},{text:`Assembling microchip circuit boards inside sterile cleanroom laboratories.`,correct:!1,explanation:`Sai: Khách tham quan thử nghiệm ở các gian hàng tương tác ngoài trời/hội trường, không vào phòng thí nghiệm vô trùng.`},{text:`Purchasing custom autonomous drones manufactured by university engineers.`,correct:!1,explanation:`Sai: Đây là buổi trưng bày câu lạc bộ phi thương mại, không bán máy bay không người lái.`},{text:`Competing in an advanced robotics obstacle course for cash scholarships.`,correct:!1,explanation:`Sai: Không có cuộc thi đấu giành học bổng tiền mặt tại buổi giới thiệu này.`}]},{q:`Leaflet: 'PUBLIC SPEAKING WORKSHOP: Overcome stage fright, master vocal projection, and deliver persuasive arguments. Suitable for grades 10 to 12. Certificates awarded upon completion.' - What benefit do students receive after completing the speaking workshop?`,a:[{text:`An official participation certificate verifying their course completion.`,correct:!0,explanation:`Học viên tham gia đầy đủ sẽ được nhận giấy chứng nhận hoàn thành khóa tập huấn ('Certificates awarded upon completion').`},{text:`A guaranteed speaking slot at the national youth leadership convention.`,correct:!1,explanation:`Sai: Khóa học cấp chứng chỉ tham gia chứ không bảo đảm một suất diễn thuyết cấp quốc gia.`},{text:`A cash prize reward for delivering the most compelling oral presentation.`,correct:!1,explanation:`Sai: Không có giải thưởng tiền mặt cho bài thuyết trình hay nhất.`},{text:`Direct exemption from mandatory high school English speaking assessments.`,correct:!1,explanation:`Sai: Khóa kỹ năng mềm ngoại khóa không miễn trừ bài kiểm tra chính khóa ở trường.`}]},{q:`Leaflet: 'CREATIVE WRITING RETREAT: Spend a weekend crafting short fiction beside Lake Pine. Mentored by award-winning novelists. All meals and notebook stationery included.' - What is included in the package for creative writing participants?`,a:[{text:`Weekend accommodation meals and specialized literary writing materials.`,correct:!0,explanation:`Gói tham dự đã bao gồm toàn bộ các bữa ăn dinh dưỡng và đồ dùng văn phòng phẩm ('All meals and notebook stationery included').`},{text:`Full publication contracts for their completed fiction manuscript drafts.`,correct:!1,explanation:`Sai: Khóa bồi dưỡng hướng dẫn kỹ năng viết chứ không cam kết ký hợp đồng xuất bản sách.`},{text:`Airfare transportation tickets from capital city airports to Lake Pine.`,correct:!1,explanation:`Sai: Vé máy bay di chuyển không nằm trong gói tài trợ của trại sáng tác.`},{text:`Individual laptop computers equipped with professional screenwriting software.`,correct:!1,explanation:`Sai: Ban tổ chức chỉ phát sổ tay và văn phòng phẩm chứ không cấp máy tính xách tay.`}]},{q:`Leaflet: 'DIGITAL MARKETING INTENSIVE: Learn search engine optimization and viral content strategy. Prerequisite: Basic familiarity with social media platforms. Online evening sessions.' - When do the digital marketing lectures take place during the week?`,a:[{text:`During evening hours via virtual remote conferencing software.`,correct:!0,explanation:`Các buổi học diễn ra trực tuyến vào các buổi tối trong tuần ('Online evening sessions').`},{text:`During early morning hours in traditional university lecture auditoriums.`,correct:!1,explanation:`Sai: g giày bít mũi chống trơn trượt ('Wear slip-resistant closed-toe shoes').`},{text:`Wearing full professional chef whites including pleated tall hats.`,correct:!1,explanation:`Sai: Học viên chỉ cần mặc thường phục và mang giày chống trượt, tạp dề được phát sẵn.`},{text:`Bringing customized Japanese steel santoku knives from home kitchens.`,correct:!1,explanation:`Sai: Dao bếp và tạp dề đã được trung tâm chuẩn bị sẵn ('Aprons and knives provided').`},{text:`Wearing heavy thermal insulated mittens throughout meat preparation.`,correct:!1,explanation:`Sai: Găng tay cách nhiệt chỉ dùng khi bê đồ nóng từ lò, không phải quy định bắt buộc toàn buổi.`}]},{q:`Leaflet: 'FINANCIAL LITERACY WORKSHOP: Understand personal budgeting, emergency saving funds, and compound interest basics. Designed exclusively for high school seniors.' - Who is the designated target demographic for this financial workshop?`,a:[{text:`Twelfth-grade secondary students preparing for university independence.`,correct:!0,explanation:`Chương trình thiết kế dành riêng cho học sinh lớp 12 chuẩn bị bước vào cuộc sống tự lập ('Designed exclusively for high school seniors').`},{text:`Primary school pupils learning basic piggy bank coin accumulation.`,correct:!1,explanation:`Sai: Khóa học dành cho học sinh cuối cấp THPT, không phải học sinh tiểu học.`},{text:`Mid-career banking professionals seeking corporate investment advice.`,correct:!1,explanation:`Sai: Nội dung trang bị kiến thức tài chính cá nhân căn bản cho lứa tuổi học sinh THPT.`},{text:`Senior retired citizens managing post-career pension portfolios.`,correct:!1,explanation:`Sai: Đối tượng mục tiêu là học sinh lớp 12 ('high school seniors').`}]},{q:`Leaflet: 'ASTRONOMY WORKSHOP: Learn constellations and stellar spectroscopy. Night observation sessions depend strictly on favorable cloudless sky conditions.' - Under what circumstance will the night stargazing session proceed?`,a:[{text:`Only when clear night weather conditions permit unhindered cosmic observation.`,correct:!0,explanation:`Buổi thực hành ngắm sao ban đêm chỉ diễn ra khi thời tiết quang đãng, không có mây che khuất ('depend strictly on cloudless sky conditions').`},{text:`Even during heavy thunderstorm downpours inside the open observatory.`,correct:!1,explanation:`Sai: Kính viễn vọng ngoài trời không thể quan sát khi trời mưa bão hoặc nhiều mây.`},{text:`Whenever solar eclipse phenomena darken the afternoon horizon view.`,correct:!1,explanation:`Sai: Buổi học diễn ra vào ban đêm ('Night observation sessions'), không phải nhật thực ban ngày.`},{text:`Only if every student purchases a high-end personal reflecting telescope.`,correct:!1,explanation:`Sai: Đài thiên văn đã có sẵn kính thiên văn lớn phục vụ học viên quan sát.`}]},{q:`Leaflet: 'DEBATE AND CRITICAL THINKING CAMP: Master Parliamentary debate rules and logical fallacies. Free tournament registration for top five graduating campers.' - What incentive is offered to the highest-performing debaters in camp?`,a:[{text:`Exempted registration entry fees for an upcoming competitive debate tournament.`,correct:!0,explanation:`Năm học viên có kết quả tốt nhất sẽ được miễn phí tham gia giải đấu tranh biện danh tiếng ('Free tournament registration for top five').`},{text:`A prestigious paid internship at international diplomatic embassies.`,correct:!1,explanation:`Sai: Phần thưởng là vé dự thi giải tranh biện miễn phí chứ không phải thực tập đại sứ quán.`},{text:`An all-expenses-paid summer holiday trip across major European cities.`,correct:!1,explanation:`Sai: Không có chuyến du lịch châu Âu miễn phí trong chương trình trại hè.`},{text:`An automatic exemption from final secondary graduation examinations.`,correct:!1,explanation:`Sai: Trại hè kỹ năng không thể miễn thi tốt nghiệp THPT quốc gia.`}]},{q:`Leaflet: 'APP DEVELOPMENT HACKATHON: 48-hour prototype challenge to solve urban transit bottlenecks. Meals and beverages supplied. Register teams of three to four students.' - What is the required team composition for hackathon contestants?`,a:[{text:`A collaborative group consisting of three or four enrolled students.`,correct:!0,explanation:`Mỗi đội dự thi bắt buộc phải có từ 3 đến 4 học sinh đăng ký cùng nhau ('Register teams of three to four students').`},{text:`An individual developer working entirely in solitary isolation.`,correct:!1,explanation:`Sai: Cuộc thi yêu cầu làm việc theo nhóm 3-4 bạn, không chấp nhận thí sinh thi đơn lẻ.`},{text:`A massive collective team consisting of eight to ten members.`,correct:!1,explanation:`Sai: Đội thi tối đa 4 người để đảm bảo tiến độ và phân công nhiệm vụ hiệu quả.`},{text:`A paired duo composed of one student and one commercial tutor.`,correct:!1,explanation:`Sai: Thí sinh phải là các bạn học sinh ('three to four students'), không kèm gia sư thương mại.`}]},{q:`Leaflet: 'ARCHITECTURAL MODEL-MAKING: Learn laser cutting and balsa wood assembly for scale models. Safety goggles must be worn whenever machinery is running.' - What protective equipment is strictly obligatory near active machinery?`,a:[{text:`Eye protection goggles fitted to shield against flying wooden debris.`,correct:!0,explanation:`Bắt buộc phải đeo kính bảo vệ mắt trong suốt thời gian máy móc gia công đang chạy ('Safety goggles must be worn whenever machinery is running').`},{text:`Full respiratory oxygen masks equipped with chemical filter canisters.`,correct:!1,explanation:`Sai: Xưởng chỉ yêu cầu kính bảo hộ mắt thông thường, không cần mặt nạ dưỡng khí phòng độc.`},{text:`Heavy chainmail armor gauntlets designed for metal smelting tasks.`,correct:!1,explanation:`Sai: Gia công gỗ balsa nhẹ nhàng không cần đến găng tay giáp sắt.`},{text:`High-visibility orange jumpsuits with reflective silver roadway tape.`,correct:!1,explanation:`Sai: Áo phản quang không phải là quy định bảo hộ trong xưởng mô hình kiến trúc.`}]},{q:`Leaflet: 'BIOLOGY FIELDWORK AT BOTANIC GARDEN: Study medicinal plant adaptations and spore propagation. Bring rain ponchos and field notebooks
