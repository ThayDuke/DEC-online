ogue games and physical characterization. No scripts memorization required. Comfortable loose athletic clothing recommended.' - What type of attire is suggested for students attending drama lab?`,a:[{text:`Flexible athletic sportswear that allows unrestricted physical movement.`,correct:!0,explanation:`Trang phục thể thao thoải mái giúp học viên tự do di chuyển và diễn xuất hình thể ('Comfortable loose athletic clothing recommended').`},{text:`Formal evening black-tie attire suitable for theater red carpets.`,correct:!1,explanation:`Sai: Lớp kịch ứng tác đòi hỏi vận động hình thể nên trang phục dạ hội lịch lãm là không phù hợp.`},{text:`Historical Victorian corset gowns with intricate lace ruffles.`,correct:!1,explanation:`Sai: Không yêu cầu trang phục cổ điển thời Victoria rườm rà gò bó.`},{text:`Heavy waterproof scuba suits designed for underwater filming.`,correct:!1,explanation:`Sai: Phòng tập kịch trong nhà yêu cầu quần áo thể thao co giãn thông thường.`}]},{q:`Leaflet: 'JOURNALISM ETHICS SEMINAR: Fact-checking methodologies and photojournalism integrity in digital age. Guest speaker from National Press Association. Q&A session follows.' - What professional topic is examined during the journalism seminar?`,a:[{text:`Techniques for rigorous source fact-checking and responsible media reporting.`,correct:!0,explanation:`Hội thảo tập trung vào các phương pháp kiểm chứng nguồn tin và tính trung thực của báo ảnh ('Fact-checking methodologies and integrity').`},{text:`Strategies for generating deceptive viral gossip headlines for profit.`,correct:!1,explanation:`Sai: Hội thảo đề cao đạo đức báo chí và chống tin giả mạo chứ không dạy chiêu trò câu view.`},{text:`Technical maintenance of industrial rotogravure printing press rollers.`,correct:!1,explanation:`Sai: Buổi thuyết trình bàn về đạo đức nội dung tin tức chứ không dạy cơ khí in ấn.`},{text:`Methods for hacking private celebrity emails for sensationalist stories.`,correct:!1,explanation:`Sai: Hành vi xâm phạm đời tư trái pháp luật bị lên án nghiêm khắc trong đạo đức nghề báo.`}]},{q:`Leaflet: '3D PRINTING BASICS: CAD slicing software and filament extrusion techniques. Participants create and take home a custom geometric keychain prototype.' - What tangible souvenir do students manufacture during the 3D session?`,a:[{text:`A personalized plastic keychain prototype crafted using computer design.`,correct:!0,explanation:`Học viên được tự thiết kế và mang về một móc chìa khóa hình học độc đáo do mình in ('take home a custom geometric keychain').`},{text:`A life-sized mechanical automobile engine cast in solid titanium.`,correct:!1,explanation:`Sai: Máy in 3D để bàn tại lớp chỉ in vật phẩm nhỏ bằng nhựa, không đúc động cơ ô tô titan.`},{text:`A commercial drone frame outfitted with carbon fiber rotor blades.`,correct:!1,explanation:`Sai: Sản phẩm kỷ niệm là móc treo chìa khóa xinh xắn, không phải khung máy bay không người lái.`},{text:`A smartphone motherboard soldered with microscopic silicone processors.`,correct:!1,explanation:`Sai: In 3D đùn nhựa tạo hình thể tích cơ bản, không chế tạo vi mạch bán dẫn.`}]},{q:`Leaflet: 'VOLUNTEER TUTORING ORIENTATION: Briefing for high schoolers tutoring disadvantaged elementary kids. Background checks and safeguarding training mandatory before placement.' - What administrative clearance is obligatory before volunteers begin tutoring?`,a:[{text:`Satisfactory background verification and mandatory child safeguarding training.`,correct:!0,explanation:`Tình nguyện viên bắt buộc phải hoàn thành kiểm tra lý lịch và khóa học bảo vệ an toàn cho trẻ em ('Background checks and safeguarding training mandatory').`},{text:`A completed doctoral degree in childhood pedagogical development.`,correct:!1,explanation:`Sai: Chương trình tuyển tình nguyện viên là học sinh THPT, không đòi hỏi học vị tiến sĩ.`},{text:`A notarized commercial bank deposit verifying personal wealth.`,correct:!1,explanation:`Sai: Hoạt động gia sư từ thiện hoàn toàn phi lợi nhuận, không yêu cầu chứng minh tài chính.`},{text:`Prior professional experience teaching at prestigious boarding academies.`,correct:!1,explanation:`Sai: Các bạn học sinh THPT nhiệt huyết đều được chào đón sau khi qua lớp tập huấn an toàn.`}]},{q:`Leaflet: 'URBAN TREE PLANTING DRIVE: Join us this Saturday at 8 AM in Riverside Park. Gloves, saplings, and spades provided. Wear sturdy waterproof boots.' - What personal equipment should volunteers bring themselves?`,a:[{text:`Durable waterproof boots suitable for working in damp outdoor soil.`,correct:!0,explanation:`Người tham gia chỉ cần tự chuẩn bị ủng chống nước bảo hộ chắc chắn ('Wear sturdy waterproof boots').`},{text:`Heavy motorized diesel excavators to dig deep drainage trenches.`,correct:!1,explanation:`Sai: Cây con và hố trồng cây nông được đào bằng xẻng tay thủ công được phát sẵn.`},{text:`Personal saplings purchased exclusively from private commercial nurseries.`,correct:!1,explanation:`Sai: Ban tổ chức đã chuẩn bị đầy đủ cây giống tốt cho mọi người ('Saplings provided').`},{text:`Chemical herbicide sprays to clear away existing riverside vegetation.`,correct:!1,explanation:`Sai: Trồng cây gây rừng sinh thái không sử dụng thuốc diệt cỏ hóa học độc hại.`}]},{q:`Leaflet: 'COMMUNITY FOOD PANTRY: Distributing essential grocery staples to low-income seniors. Distribution every Tuesday morning. Photo ID required at verification desk.' - What must beneficiaries present to receive grocery provisions?`,a:[{text:`A valid photographic identity card at the entry registration counter.`,correct:!0,explanation:`Người nhận trợ cấp cần xuất trình giấy tờ tùy thân có dán ảnh để đối chiếu thông tin ('Photo ID required at verification desk').`},{text:`A recent medical certificate showing complete vaccination history.`,correct:!1,explanation:`Sai: Bàn tiếp đón chỉ kiểm tra giấy tờ tùy thân có ảnh, không yêu cầu sổ tiêm chủng.`},{text:`A cash fee covering twenty percent of total grocery value.`,correct:!1,explanation:`Sai: Kho thực phẩm cộng đồng phát đồ ăn miễn phí cho người già neo đơn khó khăn.`},{text:`A signed recommendation letter from a commercial supermarket manager.`,correct:!1,explanation:`Sai: Thủ tục đơn giản xác minh nhân thân bằng căn cước công dân gắn ảnh.`}]},{q:`Leaflet: 'HOSPITAL VOLUNTEER PROGRAM: Seeking enthusiastic teens to guide outpatient visitors and deliver reading books to wards. Commitment: 3 hours per week for 3 months.' - What time commitment is expected from student hospital volunteers?`,a:[{text:`Three hours of service weekly sustained over a three-month duration.`,correct:!0,explanation:`Tình nguyện viên cần cam kết phục vụ tối thiểu 3 giờ/tuần liên tục trong 3 tháng ('3 hours per week for 3 months').`},{text:`Full-time daily attendance during forty scheduled working hours weekly.`,correct:!1,explanation:`Sai: Học sinh chỉ tham gia bán thời gian 3 tiếng mỗi tuần để không ảnh hưởng việc học ở trường.`},{text:`A single thirty-minute orientation seminar hosted during school holidays.`,correct:!1,explanation:`Sai: Chương trình yêu cầu cam kết gắn bó trong 3 tháng chứ không chỉ một buổi 30 phút.`},{text:`Overnight emergency ward assistance during weekend hospital shifts.`,correct:!1,explanation:`Sai: Tình nguyện viên thiếu niên hỗ trợ ban ngày ở khu ngoại trú, không trực cấp cứu đêm.`}]},{q:`Leaflet: 'WILDLIFE RESCUE AMBASSADORS: Assist veterinary staff with injured songbird rehabilitation. Must be eighteen or older. Rabies and tetanus vaccinations mandatory.' - What medical requirement must candidates fulfill before handling wild birds?`,a:[{text:`Possessing up-to-date immunizations against rabies and bacterial tetanus.`,correct:!0,explanation:`Tình nguyện viên bắt buộc phải có chứng nhận tiêm vắc-xin phòng dại và uốn ván ('Rabies and tetanus vaccinations mandatory').`},{text:`Submitting an eye vision test showing perfect optical color perception.`,correct:!1,explanation:`Sai: Không có yêu cầu kiểm tra thị lực màu sắc hoàn hảo.`},{text:`Undergoing psychological evaluation for animal empathy certification.`,correct:!1,explanation:`Sai: Yêu cầu trọng tâm về sức khỏe là vắc-xin phòng chống bệnh truyền nhiễm từ động vật.`},{text:`Providing a dental health clearance certificate from a licensed surgeon.`,correct:!1,explanation:`Sai: Khám răng hàm mặt không liên quan đến tiêu chuẩn an toàn thú y.`}]},{q:`Leaflet: 'YOUTH COUNCIL MENTORSHIP: Connect with civic policymakers to debate municipal sustainability. Applications close November 15. Candidates submit a 300-word essay.' - What application material is required to apply for the Youth Council?`,a:[{text:`A concise reflective written essay not exceeding three hundred words.`,correct:!0,explanation:`Hồ sơ ứng tuyển đòi hỏi một bài viết luận ngắn 300 từ về đề tài phát triển bền vững ('Candidates submit a 300-word essay').`},{text:`A comprehensive legal thesis analyzing urban zoning jurisprudence.`,correct:!1,explanation:`Sai: Thí sinh chỉ cần viết một bài luận ngắn 300 từ bày tỏ suy nghĩ, không viết luận án luật.`},{text:`A campaign video endorsement from a prominent national politician.`,correct:!1,explanation:`Sai: Quy trình tuyển chọn bình đẳng dựa trên bài luận cá nhân của học sinh.`},{text:`An audited financial statement of family household annual income.`,correct:!1,explanation:`Sai: Không yêu cầu kê khai hay kiểm toán thu nhập tài chính của gia đình.`}]},{q:`Leaflet: 'BEACH CLEANUP CHALLENGE: Help clear plastic debris along Sunrise Beach. Free organic cotton tote bags and refreshing herbal tea provided for all registered participants.' - What complimentary souvenir do volunteers receive for their cleanup efforts?`,a:[{text:`An eco-friendly reusable cotton canvas tote bag given at registration.`,correct:!0,explanation:`Mỗi tình nguyện viên đăng ký đều được nhận một túi vải tote tái sử dụng bảo vệ môi trường ('Free organic cotton tote bags').`},{text:`A waterproof electronic digital wristwatch capable of scuba timing.`,correct:!1,explanation:`Sai: Ban tổ chức tặng túi vải cotton thân thiện môi trường, không tặng đồng hồ điện tử đắt tiền.`},{text:`A free round-trip airline ticket to tropical coastal holiday islands.`,correct:!1,explanation:`Sai: Đây là hoạt động thiện nguyện làm sạch bãi biển địa phương, không có vé máy bay nghỉ dưỡng.`},{text:`A branded pair of high-performance running sneakers for beach trails.`,correct:!1,explanation:`Sai: Quà tặng mang ý nghĩa lan tỏa lối sống xanh là chiếc túi vải tote bảo vệ môi trường.`}]},{q:`Leaflet: 'ANIMAL SHELTER DOG WALKING: Volunteer to walk rescued hounds around City Park lake. Orientation workshop held every first Sunday of the month at 9 AM.' - When is the introductory training workshop held for new dog walkers?`,a:[{text:`At nine in the morning on the initial Sunday of every calendar month.`,correct:!0,explanation:`Khóa tập huấn nghiệp vụ cho người mới bắt đầu lúc 9h sáng ngày Chủ nhật đầu tiên của tháng ('every first Sunday at 9 AM').`},{text:`Every weekday evening precisely at sunset following office closures.`,correct:!1,explanation:`Sai: Buổi tập huấn chỉ diễn ra định kỳ một lần vào sáng Chủ nhật đầu tháng.`},{text:`Exclusively during national public holiday mornings once per calendar year.`,correct:!1,explanation:`Sai: Khóa học mở hàng tháng chứ không phải mỗi năm chỉ có một lần vào ngày lễ.`},{text:`At midnight during the full lunar phase for tranquil dog behavior.`,correct:!1,explanation:`Sai: Thời gian tổ chức là ban ngày lúc 9h sáng mát mẻ và an toàn cho động vật.`}]},{q:`Leaflet: 'COMMUNITY ORCHARD HARVEST: Help harvest heritage apples and pears. Volunteers take home a basket of fresh organic fruit. Bring gardening gloves and a sun hat.' - What reward do orchard volunteers receive for helping with the fruit harvest?`,a:[{text:`A free personal basket filled with freshly plucked organic orchard fruit.`,correct:!0,explanation:`Phần thưởng ý nghĩa dành cho tình nguyện viên là một giỏ trái cây tươi hữu cơ hái từ vườn ('take home a basket of fresh organic fruit').`},{text:`A shareholding equity certificate in commercial fruit canning factories.`,correct:!1,explanation:`Sai: Tình nguyện viên nhận giỏ hoa quả tươi mang về, không nhận cổ phần nhà máy chế biến.`},{text:`A motorized agricultural tractor to assist with personal yard mowing.`,correct:!1,explanation:`Sai: Không có quà tặng máy cày cơ giới nông nghiệp.`},{text:`A lifetime supply of processed commercial apple cider vinegar bottles.`,correct:!1,explanation:`Sai: Quà tặng là một giỏ táo lê tươi ngon vừa thu hoạch trong ngày.`}]},{q:`Leaflet: 'SENIOR CITIZEN TECH BUDDIES: Teach elderly neighbors how to make video calls and send emails safely. One-on-one sessions every Wednesday afternoon at Community Hall.' - What skill do student volunteers impart to senior participants?`,a:[{text:`Practical coaching on digital video communication and email navigation.`,correct:!0,explanation:`Tình nguyện viên hỗ trợ người già thành thạo gọi video call và gửi thư điện tử an toàn ('make video calls and send emails safely').`},{text:`Assembling customized semiconductor microprocessors from raw silicon.`,correct:!1,explanation:`Sai: Lớp học hướng dẫn các ứng dụng cơ bản hàng ngày, không dạy chế tạo phần cứng vi mạch.`},{text:`Hacking encrypted financial databases to extract confidential credit data.`,correct:!1,explanation:`Sai: Khóa học nhấn mạnh vào việc sử dụng Internet an toàn và phòng tránh lừa đảo mạng.`},{text:`Programming algorithmic neural networks for commercial stock trading.`,correct:!1,explanation:`Sai: Mục tiêu là giúp người cao tuổi kết nối với con cháu qua video call và hòm thư điện tử.`}]},{q:`Leaflet: 'HERITAGE ARCHIVE DIGITIZATION: Scan historical photographs and catalog local folklore manuscripts. Basic familiarity with desktop scanners required. Flexible weekday hours.' - What mechanical aptitude is preferred for archive volunteers?`,a:[{text:`Fundamental competence in operating computer flatbed document scanners.`,correct:!0,explanation:`Dự án yêu cầu tình nguyện viên biết thao tác cơ bản với máy scan ảnh và tài liệu ('Basic familiarity with desktop scanners').`},{text:`Expert skill in chemical restoration of crumbling papyrus parchment.`,correct:!1,explanation:`Sai: Công việc chỉ yêu cầu quét ảnh bằng máy scan văn phòng, việc phục chế hóa học do chuyên gia làm.`},{text:`Professional software development experience building cloud databases.`,correct:!1,explanation:`Sai: Người tham gia chỉ cần nhập liệu danh mục cơ bản theo biểu mẫu có sẵn.`},{text:`Operation of heavy industrial rotary printing presses in newspaper mills.`,correct:!1,explanation:`Sai: Máy scan phẳng để bàn rất dễ sử dụng sau vài phút hướng dẫn.`}]},{q:`Leaflet: 'BLOOD DONATION MARATHON: Save lives by giving blood at Red Cross Center. Donors must be 17+, weigh over 45kg, and have a good breakfast before arrival.' - What physiological prerequisite must prospective blood donors satisfy?`,a:[{text:`Reaching at least seventeen years of age and weighing above forty-five kilograms.`,correct:!0,explanation:`Điều kiện sức khỏe bắt buộc: từ đủ 17 tuổi trở lên và cân nặng trên 45kg ('17+, weigh over 45kg').`},{text:`Having run an official half marathon within the past fourteen days.`,correct:!1,explanation:`Sai: Người hiến máu chỉ cần đạt cân nặng và độ tuổi tiêu chuẩn, không cần là vận động viên chạy bộ.`},{text:`Fasting completely for twenty-four hours before entering the clinic.`,correct:!1,explanation:`Sai: Tờ rơi nhắc nhở người hiến máu phải ăn sáng đầy đủ trước khi đến ('have a good breakfast').`},{text:`Possessing a rare universal donor blood group verified by genetic tests.`,correct:!1,explanation:`Sai: Mọi nhóm máu thông thường đều rất quý giá và được tiếp nhận cứu chữa bệnh nhân.`}]},{q:`Leaflet: 'BICYCLE ADVOCACY VOLUNTEERS: Count morning bicycle commuters at major intersections to support new bike lane proposals. High-visibility vests provided.' - What protective clothing item is distributed to road counters?`,a:[{text:`Reflective high-visibility safety waistcoats for roadway illumination.`,correct:!0,explanation:`Tình nguyện viên được trang bị áo gile phản quang phát sáng bảo đảm an toàn giao thông ('High-visibility vests provided').`},{text:`Heavy armored leather biker jackets with reinforced shoulder pads.`,correct:!1,explanation:`Sai: Áo phản quang mỏng nhẹ được khoác ngoài giúp lái xe dễ quan sát từ xa.`},{text:`Thermal arctic snowsuits designed for sub-zero mountain exploration.`,correct:!1,explanation:`Sai: Hoạt động đếm xe đạp đô thị trong thời tiết bình thường, không cần đồ thám hiểm bắc cực.`},{text:`Inflatable emergency life vests designed for deep ocean sailing voyages.`,correct:!1,explanation:`Sai: Áo phản quang đường bộ (high-visibility vest) khác hoàn toàn với áo phao cứu sinh đường thủy.`}]},{q:`Leaflet: 'NEIGHBORHOOD GRAFFITI CLEANUP: Remove unauthorized paint from public brick walls using eco-friendly biodegradable solvent. Protective eyewear provided.' - What type of cleaning substance is utilized for wall restoration?`,a:[{text:`Environmentally sound biodegradable chemical agents designed for paint removal.`,correct:!0,explanation:`Chất tẩy rửa được sử dụng là dung dịch phân hủy sinh học an toàn cho môi trường ('eco-friendly biodegradable solvent').`},{text:`Highly caustic industrial hydrochloric acid mixed with chlorine bleach.`,correct:!1,explanation:`Sai: Dung môi phân hủy sinh học an toàn cho cây cỏ và da người hơn nhiều so với axit đặc.`},{text:`Petroleum gasoline fuels ignited to burn away surface markings.`,correct:!1,explanation:`Sai: Tuyệt đối không dùng xăng dầu đốt lửa nguy hiểm gây cháy nổ công trình.`},{text:`Heavy abrasive sandblasting grit powered by diesel pneumatic engines.`,correct:!1,explanation:`Sai: Tình nguyện viên dùng hóa chất sinh học lau chùi kết hợp chổi cọ thủ công nhẹ nhàng.`}]},{q:`Leaflet: 'BLIND SOCIETY AUDIOBOOK RECORDERS: Read classical poetry and textbooks aloud in studio. Clear articulation and fluent reading pace required. Audition required.' - What audition criterion is evaluated before recording audiobooks?`,a:[{text:`Articulate voice enunciation coupled with smooth reading cadences.`,correct:!0,explanation:`Yêu cầu kỹ năng là phát âm rõ ràng, chuẩn xác và tốc độ đọc lưu loát tự nhiên ('Clear articulation and fluent reading pace').`},{text:`The ability to sing classical operatic arias in multiple dialects.`,correct:!1,explanation:`Sai: Công việc đọc sách nói và thơ ca, không đòi hỏi kỹ thuật hát nhạc kịch opera.`},{text:`Speed-reading capability exceeding eight hundred words every minute.`,correct:!1,explanation:`Sai: Đọc sách cho người khiếm thị cần tốc độ truyền cảm vừa phải, đọc quá nhanh sẽ khó nghe.`},{text:`Previous voice acting experience in major animated film releases.`,correct:!1,explanation:`Sai: Mọi tình nguyện viên có chất giọng truyền cảm và phát âm tròn vành rõ chữ đều có thể thử giọng.`}]},{q:`Leaflet: 'SUMMER CAMP COUNSELOR INTERNSHIP: Lead outdoor sports and crafts for children aged 7-12. CPR certification and clean background check necessary. Stipend offered.' - What emergency medical qualification must camp counselors possess?`,a:[{text:`An active cardiopulmonary resuscitation certificate for emergency first aid.`,correct:!0,explanation:`Điều dưỡng viên trại hè bắt buộc phải có chứng chỉ sơ cấp cứu CPR hồi sức tim phổi ('CPR certification necessary').`},{text:`A licensed medical degree in orthopedic surgical procedures.`,correct:!1,explanation:`Sai: Chương trình chỉ yêu cầu chứng chỉ sơ cấp cứu hồi sức tim phổi (CPR) căn bản.`},{text:`Formal veterinary accreditation in exotic animal husbandry.`,correct:!1,explanation:`Sai: Hoạt động chăm sóc trẻ em, không liên quan đến chứng chỉ thú y.`},{text:`A specialized diploma in wilderness extreme mountain rescue.`,correct:!1,explanation:`Sai: Trại hè sinh hoạt kỹ năng thông thường, không phải hoạt động cứu hộ núi tuyết hiểm trở.`}]},{q:`Leaflet: 'MUSEUM JUNIOR DOCENT PROGRAM: Guide weekend family tours through the fossil wing. Training takes place on three consecutive Saturdays in June.' - When does the training program for young museum guides occur?`,a:[{text:`Across three consecutive Saturdays during the scheduled month of June.`,correct:!0,explanation:`Lịch tập huấn kỹ năng thuyết minh diễn ra trong 3 thứ Bảy liên tiếp của tháng 6 ('three consecutive Saturdays in June').`},{text:`Every weekday evening throughout the chilly winter holiday season.`,correct:!1,explanation:`Sai: Các buổi đào tạo được bố trí vào ban ngày các ngày thứ Bảy trong tháng 6 mùa hè.`},{text:`During a single twenty-minute online recorded orientation webinar.`,correct:!1,explanation:`Sai: Khóa học kéo dài ba tuần liên tiếp với nhiều hoạt động thực hành trực tiếp tại bảo tàng.`},{text:`After midnight when public visitor halls are vacant of gallery guests.`,correct:!1,explanation:`Sai: Tập huấn diễn ra trong khung giờ mở cửa tiêu chuẩn của bảo tàng vào thứ Bảy.`}]},{q:`Leaflet: 'URBAN GARDEN COMPOSTING CREW: Collect vegetable peelings from local markets to produce nutrient-rich garden compost. Meet at Central Allotment every Sunday at 3 PM.' - Where do volunteers gather for the weekly composting operations?`,a:[{text:`At the municipal central allotment gardens on Sunday afternoons at three.`,correct:!0,explanation:`Nhóm tình nguyện viên tập hợp tại khu vườn cộng đồng trung tâm lúc 15h chiều Chủ nhật ('Central Allotment every Sunday at 3 PM').`},{text:`Inside the wholesale commercial fish processing refrigeration docks.`,correct:!1,explanation:`Sai: Địa điểm là vườn rau cộng đồng trung tâm ('Central Allotment'), không phải cảng cá.`},{text:`At the suburban industrial municipal garbage incineration plant.`,correct:!1,explanation:`Sai: Dự án ủ phân hữu cơ tại vườn rau sinh thái, không tập kết ở bãi rác thiêu hủy.`},{text:`In front of city hall administrative council chambers after dark.`,correct:!1,explanation:`Sai: Thời gian và địa điểm gặp mặt là chiều Chủ nhật lúc 3h tại khu vườn chung.`}]},{q:`Leaflet: 'TOY REPAIR CAFE: Fix broken plastic and wooden toys brought by neighborhood children. Volunteer mechanics and electronics hobbyists wanted. Tools provided on site.' - What expertise is sought for the toy restoration workshop?`,a:[{text:`Hands-on tinkering skills in repairing small mechanical and electronic toys.`,correct:!0,explanation:`Chương trình tìm kiếm những thợ cơ khí và người yêu thích kỹ thuật điện tử sửa đồ chơi ('mechanics and electronics hobbyists wanted').`},{text:`Advanced academic knowledge of astrophysics and quantum computing.`,correct:!1,explanation:`Sai: Việc sửa đồ chơi cần kỹ năng cơ khí và điện tử thực hành khéo léo, không cần vật lý lượng tử.`},{text:`Commercial corporate experience in international toy logistics.`,correct:!1,explanation:`Sai: Đây là không gian sáng tạo cộng đồng sửa đồ chơi gãy hỏng, không phải khâu vận chuyển hàng hóa.`},{text:`Professional certification in manufacturing industrial timber lumber.`,correct:!1,explanation:`Sai: Thợ thủ công chỉ cần tình yêu thương trẻ nhỏ và khả năng hàn gắn đồ chơi cơ bản.`}]},{q:`Leaflet: 'NEIGHBORHOOD WATCH PATROL: Volunteer foot patrols around local residential alleys during evening hours. Cell phones and emergency whistles issued to pairs.' - What emergency alerting device is distributed to patrol partners?`,a:[{text:`Audible signaling whistles accompanied by cellular mobile devices.`,correct:!0,explanation:`Đội tuần tra được trang bị còi thổi báo động khẩn cấp và điện thoại di động ('Cell phones and emergency whistles issued').`},{text:`High-powered tactical stun guns and reinforced wooden batons.`,correct:!1,explanation:`Sai: Tình nguyện viên dân phòng không trang bị vũ khí tấn công, chỉ dùng thiết bị liên lạc cảnh báo.`},{text:`Heavy handcuffs forged from reinforced industrial carbon steel.`,correct:!1,explanation:`Sai: Nhiệm vụ tuần tra quan sát và báo tin cho công an khi cần thiết, không tự ý còng tay người khác.`},{text:`Signal flare rocket launchers designed for maritime rescue ships.`,correct:!1,explanation:`Sai: Còi thổi âm thanh và điện thoại là dụng cụ báo động an toàn phù hợp trong khu dân cư.`}]},{q:`Leaflet: 'RIVER KAYAK WATER SAMPLING: Collect water quality samples along the urban canal. Kayak paddling proficiency required. All sampling vials provided.' - What sporting skill is necessary to join the water sampling voyage?`,a:[{text:`Competent capability in steering and propelling an aquatic paddle kayak.`,correct:!0,explanation:`Yêu cầu bắt buộc là khả năng chèo thuyền kayak an toàn và thuần thục trên sông ('Kayak paddling proficiency required').`},{text:`Mastery of high-altitude alpine downhill snow skiing maneuvers.`,correct:!1,explanation:`Sai: Hoạt động diễn ra trên sông nước ngập mặn, không liên quan đến trượt tuyết vùng núi.`},{text:`Championship fencing agility with foil and épée sporting swords.`,correct:!1,explanation:`Sai: Môn đấu kiếm không liên quan đến kỹ năng chèo thuyền kayak lấy mẫu nước mặt.`},{text:`Deep-sea scuba diving certification with trimix breathing gases.`,correct:!1,explanation:`Sai: Tình nguyện viên ngồi trên thuyền kayak vớt mẫu nước bề mặt, không lặn sâu xuống đáy sông.`}]},{q:`Leaflet: 'YOUTH MENTAL HEALTH AMBASSADORS: Promote peer mental wellness and run destigmatizing campus art campaigns. Fortnightly evening strategy meetings.' - How frequently do the youth wellness ambassadors convene?`,a:[{text:`Every two weeks during scheduled evening strategy planning assemblies.`,correct:!0,explanation:`Nhóm đại sứ họp mặt định kỳ hai tuần một lần (định kỳ mỗi nửa tháng) vào buổi tối ('Fortnightly evening strategy meetings').`},{text:`Every single morning before scheduled homeroom secondary classes.`,correct:!1,explanation:`Sai: Lịch họp là 'Fortnightly' tức là định kỳ 2 tuần một lần vào buổi tối, không phải sáng nào cũng họp.`},{text:`Once per calendar quarter during end-of-term examination periods.`,correct:!1,explanation:`Sai: Hai tuần một lần là tần suất vừa phải để duy trì các hoạt động chiến dịch trường học.`},{text:`Only on annual world health awareness days designated in spring.`,correct:!1,explanation:`Sai: Nhóm hoạt động thường xuyên xuyên suốt năm học, họp mỗi nửa tháng một lần.`}]},{q:`Leaflet: 'RECYCLED ART INSTALLATION: Build an outdoor sculpture using discarded ocean plastics. Open to teen artists. Finished sculpture displayed outside City Hall.' - Where will the completed recycled plastic artwork be showcased?`,a:[{text:`In the prominent outdoor plaza situated immediately outside City Hall.`,correct:!0,explanation:`Tác phẩm điêu khắc tái chế sẽ được trưng bày ngay bên ngoài Tòa thị chính thành phố ('displayed outside City Hall').`},{text:`Locked inside a climate-controlled underground bank vault.`,correct:!1,explanation:`Sai: Tượng điêu khắc được đặt công khai ở quảng trường ngoài trời để mọi người cùng chiêm ngưỡng.`},{text:`Submerged permanently under ten fathoms of coastal ocean water.`,correct:!1,explanation:`Sai: Tác phẩm làm từ rác thải nhựa đại dương thu gom được để cảnh tỉnh, không ném lại xuống biển.`},{text:`Shipped to overseas private art auction houses for secret bids.`,correct:!1,explanation:`Sai: Bức tượng trưng bày phi lợi nhuận phục vụ cộng đồng tại khuôn viên Tòa thị chính.`}]},{q:`Leaflet: 'COMMUNITY SOUP KITCHEN CHEF: Prepare nutritious hot lunches for homeless individuals. Food hygiene training certification required. Shift: 10 AM to 2 PM on weekdays.' - What qualification must prospective kitchen helpers possess?`,a:[{text:`An officially verified food safety and sanitation hygiene certificate.`,correct:!0,explanation:`Đầu bếp tình nguyện bắt buộc phải có chứng chỉ vệ sinh an toàn thực phẩm ('Food hygiene training certification required').`},{text:`A master sommelier certificate in vintage French wine pairing.`,correct:!1,explanation:`Sai: Bếp ăn từ thiện phục vụ cơm trưa dinh dưỡng cho người nghèo, không cần chuyên gia thử rượu vang.`},{text:`A formal five-star hotel pastry chef apprenticeship diploma.`,correct:!1,explanation:`Sai: Tình nguyện viên chỉ cần chứng chỉ an toàn vệ sinh thực phẩm và tấm lòng nhân ái.`},{text:`Ownership of an upscale commercial catering restaurant downtown.`,correct:!1,explanation:`Sai: Bất cứ ai có chứng chỉ vệ sinh đều có thể tham gia đứng bếp giúp đỡ người khó khăn.`}]},{q:`Leaflet: 'LOCAL CLIMATE ADVOCATES: Train to speak at municipal environmental planning hearings. Course consists of four two-hour evening workshops. Free registration.' - How is the advocacy training schedule structured for students?`,a:[{text:`Divided into four separate evening workshop modules of two hours each.`,correct:!0,explanation:`Chương trình học gồm 4 buổi hội thảo buổi tối, thời lượng 2 giờ cho mỗi buổi ('four two-hour evening workshops').`},{text:`A full six-month residential program at the municipal town hall.`,correct:!1,explanation:`Sai: Khóa học chỉ gồm 4 buổi tối ngắn gọn (mỗi buổi 2 tiếng) rất phù hợp với lịch học sinh.`},{text:`A marathon weekend seminar running thirty continuous clock hours.`,correct:!1,explanation:`Sai: Không bắt học viên học liên tục suốt 30 tiếng đồng hồ trong một dịp cuối tuần.`},{text:`An online recorded audio broadcast lasting only ten minutes total.`,correct:!1,explanation:`Sai: Bốn buổi tương tác trực tiếp giúp học viên tự tin luyện phát biểu trước công chúng.`}]},{q:`Leaflet: 'DISASTER RELIEF PACKAGING: Pack family emergency ration kits and water purification tablets at warehouse depot. Steel-toe safety shoes mandatory inside facility.' - What protective footwear standard is enforced in the relief warehouse?`,a:[{text:`Heavy-duty protective boots featuring reinforced steel toe caps.`,correct:!0,explanation:`Để phòng ngừa vật nặng rơi trúng chân, bắt buộc phải mang giày bảo hộ mũi lót thép ('Steel-toe safety shoes mandatory').`},{text:`Lightweight open-toe rubber beach sandals with foam footbeds.`,correct:!1,explanation:`Sai: Dép lê xỏ ngón bị cấm tuyệt đối vì không bảo vệ được bàn chân khi hàng hóa rơi.`},{text:`Flexible canvas ballet slippers with thin felt friction soles.`,correct:!1,explanation:`Sai: Giày múa ba lê mỏng manh không có tác dụng bảo hộ lao động trong kho hàng cứu trợ.`},{text:`Bare feet to ensure silent movement across polished concrete floors.`,correct:!1,explanation:`Sai: Đi chân trần trong kho vận tải tiềm ẩn rủi ro chấn thương nghiêm trọng từ đinh và hàng nặng.`}]},{q:`Leaflet: '10K CHARITY RUN: Run for cleaner air through pine forests. Finisher medals, energy bars, and hydration packs provided. Early registration closes October 1st.' - What rewards and provisions do participants receive upon completion?`,a:[{text:`A commemorative finisher medal, energy nutrition snacks, and water supplies.`,correct:!0,explanation:`Vận động viên hoàn thành chặng đua sẽ nhận huy chương kỷ niệm, thanh năng lượng và nước uống ('Finisher medals, energy bars, hydration packs').`},{text:`A free motorized electric scooter for immediate road transportation.`,correct:!1,explanation:`Sai: Ban tổ chức phát huy chương và đồ ăn nhẹ nạp năng lượng, không tặng xe điện.`},{text:`A cash prize voucher redeemable for fine dining in luxury hotels.`,correct:!1,explanation:`Sai: Đây là giải chạy thiện nguyện vì không khí sạch, không có voucher ăn khách sạn 5 sao.`},{text:`An all-expenses-paid training scholarship at an athletic institute.`,correct:!1,explanation:`Sai: Phần thưởng dành cho tất cả mọi người hoàn thành cự ly là tấm huy chương kỷ niệm đẹp đẽ.`}]},{q:`Leaflet: 'TEEN MINDFULNESS RETREAT: Learn breathing techniques and stress reduction for exam periods. Vegetarian lunch and herbal infusions included. Bring your own yoga mat.' - What item must participants bring personally to the mindfulness retreat?`,a:[{text:`An individual cushioned exercise mat suitable for floor yoga stretches.`,correct:!0,explanation:`Học viên tham dự cần tự mang theo thảm tập yoga cá nhân của mình ('Bring your own yoga mat').`},{text:`A complete set of porcelain tea brewing bowls and wooden trays.`,correct:!1,explanation:`Sai: Trà thảo mộc và bữa trưa thanh đạm đã được ban tổ chức chuẩn bị chu đáo.`},{text:`Heavy noise-cancelling headphones connected to sound generators.`,correct:!1,explanation:`Sai: Khóa học hướng dẫn kỹ thuật thở tự nhiên trong không gian yên tĩnh, không cần tai nghe chống ồn.`},{text:`A stack of school textbooks and exam revision prep booklets.`,correct:!1,explanation:`Sai: Mục đích của khóa tu là buông bỏ căng thẳng sách vở để tâm trí được thư thái bình an.`}]},{q:`Leaflet: 'YOUTH SWIMMING GALA: Freestyle and backstroke competitions for swimmers aged 13-17. Certified lifeguards on duty. Spectator bleacher tickets are free but must be reserved online.' - How can parents secure seating in the spectator viewing stands?`,a:[{text:`By reserving digital admission tickets online ahead of the gala event.`,correct:!0,explanation:`Khán giả muốn có chỗ ngồi trên khán đài phải đăng ký đặt vé miễn phí trực tuyến trước ('tickets are free but must be reserved online').`},{text:`By paying a steep cash admission fee at the entrance turnstile.`,correct:!1,explanation:`Sai: Vé xem miễn phí hoàn toàn ('free'), phụ huynh không phải trả tiền vé.`},{text:`By arriving two hours early and pitching camping chairs poolside.`,correct:!1,explanation:`Sai: Chỗ ngồi trên khán đài được quản lý qua việc đặt chỗ trên mạng trước sự kiện.`},{text:`By volunteering as assistant lane lifeguards during swimming finals.`,correct:!1,explanation:`Sai: Đội ngũ cứu hộ là các chuyên gia có chứng chỉ chuyên nghiệp ('Certified lifeguards on duty').`}]},{q:`Leaflet: 'COMMUNITY DENTAL CARE FAIR: Free oral screenings and fluoride varnish for schoolchildren. Dental hygiene kits gifted to each child. No advance appointment necessary.' - What convenience is offered to families attending the dental clinic?`,a:[{text:`Families can walk in for examinations without scheduling an appointment.`,correct:!0,explanation:`Phụ huynh có thể đưa con đến khám trực tiếp mà không cần đăng ký lịch hẹn trước ('No advance appointment necessary').`},{text:`Free orthodontic braces fitted on-site within fifteen minutes.`,correct:!1,explanation:`Sai: Sự kiện cung cấp khám sàng lọc và bôi vecni fluor ngừa sâu răng, không niềng răng tại chỗ.`},{text:`Complimentary dental surgery treatments performed under anesthesia.`,correct:!1,explanation:`Sai: Đây là buổi khám nha khoa dự phòng cơ bản, không thực hiện phẫu thuật phức tạp.`},{text:`A monetary stipend distributed to reimburse parents for lost time.`,correct:!1,explanation:`Sai: Sự kiện tặng quà là bộ dụng cụ vệ sinh răng miệng cho bé, không phát tiền mặt cho cha mẹ.`}]},{q:`Leaflet: 'CYCLING SKILLS TRACK: Learn defensive road cycling, bicycle maintenance, and signaling. Helmets are mandatory. Bicycles available for loan without fee.' - What safety rule is strictly enforced on the cycling practice circuit?`,a:[{text:`Wearing a secured protective cycling helmet throughout the entire riding session.`,correct:!0,explanation:`Bắt buộc phải đội mũ bảo hiểm xe đạp trong suốt quá trình tập luyện trên đường đua ('Helmets are mandatory').`},{text:`Riding exclusively with both hands detached from bicycle handlebars.`,correct:!1,explanation:`Sai: Đi xe buông cả hai tay là hành vi vô cùng nguy hiểm và bị nghiêm cấm trên đường tập.`},{text:`Traveling at speeds exceeding forty kilometers per hour at all times.`,correct:!1,explanation:`Sai: Khóa học rèn luyện kỹ năng lái xe phòng thủ an toàn chứ không phải đua xe tốc độ cao.`},{text:`Wearing dark sunglasses while cycling through shaded indoor tunnels.`,correct:!1,explanation:`Sai: Trang bị an toàn cốt lõi bắt buộc đối với tất cả người tập là chiếc mũ bảo hiểm vừa vặn.`}]},{q:`Leaflet: 'NUTRITION AND MEAL-PREPPING CLASS: Discover affordable plant-based cooking and balanced macronutrients for athletes. Recipe booklet provided to all students.' - What helpful cooking resource is given to students taking the nutrition class?`,a:[{text:`A printed culinary booklet compiling healthy meal recipes and nutrition guides.`,correct:!0,explanation:`Học viên được phát cuốn sổ tay tập hợp các công thức nấu ăn lành mạnh ('Recipe booklet provided').`},{text:`A commercial electric pressure cooker shipped directly to student homes.`,correct:!1,explanation:`Sai: Trung tâm chỉ tặng cuốn cẩm nang công thức nấu ăn, không tặng nồi áp suất điện tử.`},{text:`A lifetime subscription to fresh organic grocery home delivery boxes.`,correct:!1,explanation:`Sai: Khóa học hướng dẫn cách tự đi chợ chọn thực phẩm bình dân đủ chất, không tặng đồ ăn trọn đời.`},{text:`A set of professional stainless steel chef frying pans and stockpots.`,correct:!1,explanation:`Sai: Dụng cụ nấu nướng được cung cấp tại lớp để thực hành, quà mang về là cuốn sách công thức.`}]},{q:`Leaflet: 'POSTURE AND BACK HEALTH CLINIC: Combat slouching and heavy backpack strain with targeted core stretches. Bring a thick cotton bath towel for spinal exercises.' - What personal item is requested for the physical spinal exercise drills?`,a:[{text:`A thick absorbent cotton bath towel utilized for floor spinal stretches.`,correct:!0,explanation:`Học viên cần chuẩn bị một chiếc khăn tắm bằng vải cotton dày để làm điểm tựa tập lưng ('Bring a thick cotton bath towel').`},{text:`An expensive ergonomic executive office chair with lumbar air cushions.`,correct:!1,explanation:`Sai: Khóa học dạy các bài tập sàn đơn giản, không yêu cầu mua ghế văn phòng công thái học đắt đỏ.`},{text:`A pair of iron dumbbells weighing twenty kilograms for spinal deadlifts.`,correct:!1,explanation:`Sai: Trọng tâm là kéo giãn và phục hồi cơ lưng nhẹ nhàng, không tập nâng tạ nặng nguy hiểm.`},{text:`A rigid back brace corset fitted with medical pneumatic pressure pumps.`,correct:!1,explanation:`Sai: Học viên dùng một chiếc khăn tắm cuộn lại để lót dưới cột sống khi tập giãn cơ trên sàn.`}]},{q:`Leaflet: 'TEEN CLIMBING GYM PASS: Indoor bouldering and top-rope climbing. First-time climbers must sign a parental consent waiver. Climbing shoes included in entry fee.' - What administrative document is required for novice adolescent climbers?`,a:[{text:`A formal parental permission waiver submitted before ascending walls.`,correct:!0,explanation:`Người chưa thành niên lần đầu tham gia phải nộp giấy cam kết đồng ý của phụ huynh ('sign a parental consent waiver').`},{text:`A medical certificate from an orthopedic surgeon clearing joint health.`,correct:!1,explanation:`Sai: Chỉ cần giấy đồng thuận của cha mẹ (parental consent waiver), không cần giấy khám khớp của bác sĩ.`},{text:`A professional mountaineering license issued by the national federation.`,correct:!1,explanation:`Sai: Phòng tập leo núi trong nhà mở cho người mới bắt đầu, không yêu cầu bằng leo núi chuyên nghiệp.`},{text:`A notarized property deed verifying residential ownership status.`,correct:!1,explanation:`Sai: Không có yêu cầu nộp giấy chứng nhận quyền sở hữu nhà đất khi đăng ký tập thể thao.`}]},{q:`Leaflet: 'AEROBIC DANCE CARNIVAL: 90-minute upbeat dance workout featuring hip-hop and salsa rhythms. Wear athletic sneakers with non-marking rubber soles.' - What footwear restriction applies inside the aerobic dance hall?`,a:[{text:`Wearing specialized sports sneakers with clean non-marking rubber outer soles.`,correct:!0,explanation:`Quy định yêu cầu mang giày thể thao đế cao su sạch không làm trầy xước sàn gỗ ('non-marking rubber soles').`},{text:`Wearing high-heeled tap dancing shoes fitted with metal clicker taps.`,correct:!1,explanation:`Sai: Giày cao gót và giày gõ sắt sẽ phá hỏng mặt sàn gỗ của phòng tập thể dục nhịp điệu.`},{text:`Attending completely barefoot to feel the natural timber grain texture.`,correct:!1,explanation:`Sai: Nhảy aerobic cường độ cao đòi hỏi đi giày thể thao có đệm êm để bảo vệ khớp cổ chân.`},{text:`Wearing heavy waterproof winter snow boots with aggressive tread lugs.`,correct:!1,explanation:`Sai: Ủng đi tuyết cồng kềnh và nặng nề, không thể dùng để nhảy nhịp điệu trên sàn tập.`}]},{q:`Leaflet: 'FIRST AID AND CPR COURSE: Learn emergency choking relief and defibrillator operation. Accredited certification issued. Minimum age requirement: 14 years old.' - What is the minimum qualifying age for candidates in the first aid course?`,a:[{text:`Fourteen completed years of age at the time of program registration.`,correct:!0,explanation:`Độ tuổi tối thiểu để tham gia khóa học cấp cứu là 14 tuổi ('Minimum age requirement: 14 years old').`},{text:`Eighteen years old with a clean driver license record.`,correct:!1,explanation:`Sai: Khóa học mở cho thanh thiếu niên từ 14 tuổi trở lên ('14 years old'), không cần đủ 18 tuổi.`},{text:`Ten years old provided they pass an advanced biology entrance test.`,correct:!1,explanation:`Sai: Trẻ 10 tuổi chưa đủ thể lực để thực hiện ép tim CPR liên tục nên giới hạn tối thiểu là 14.`},{text:`Twenty-one years old with previous nursing school hospital experience.`,correct:!1,explanation:`Sai: Đây là khóa sơ cấp cứu cơ bản dành cho cộng đồng học sinh, không đòi hỏi bằng điều dưỡng.`}]},{q:`Leaflet: 'OUTDOOR BOOTCAMP IN THE PARK: High-intensity bodyweight circuit training. All fitness levels welcome. In case of heavy rain, session moves to Community Gym.' - What contingency plan takes effect if inclement stormy weather strikes?`,a:[{text:`The training session relocates indoors to the nearby community fitness hall.`,correct:!0,explanation:`Trường hợp mưa bão, địa điểm tập luyện sẽ được dời vào nhà thi đấu cộng đồng ('session moves to Community Gym').`},{text:`The entire outdoor training class is permanently cancelled without refund.`,correct:!1,explanation:`Sai: Buổi tập không bị hủy bỏ mà được chuyển vào trong nhà thi đấu có mái che ấm áp.`},{text:`Participants continue training under downpours without weather shelter.`,correct:!1,explanation:`Sai: Tập luyện dưới mưa lớn tiềm ẩn nguy cơ cảm lạnh và trơn trượt nguy hiểm.`},{text:`The session transforms into an online video gaming challenge tournament.`,correct:!1,explanation:`Sai: Hoạt động thể chất vẫn diễn ra bình thường trong không gian phòng gym cộng đồng.`}]},{q:`Leaflet: 'HEARING WELLNESS CAMPAIGN: Free audiometry checks for teens frequently using earphones. Receive tailored advice on safe decibel levels. Walk-ins welcomed.' - What vital medical guidance do participants receive at the hearing booth?`,a:[{text:`Personalized recommendations concerning safe acoustic audio decibel limits.`,correct:!0,explanation:`Học sinh được bác sĩ tư vấn mức âm lượng decibel an toàn khi dùng tai nghe ('safe decibel levels').`},{text:`Instructions on performing surgical earwax removal procedures at home.`,correct:!1,explanation:`Sai: Bác sĩ khuyên không nên tự ý chọc ngoáy tai tại nhà mà hướng dẫn thói quen nghe an toàn.`},{text:`Prescriptions for commercial digital hearing aids costing thousands.`,correct:!1,explanation:`Sai: Chiến dịch tập trung vào phòng ngừa suy giảm thính lực học đường, không bán máy trợ thính.`},{text:`Warnings to permanently cease listening to recorded musical tracks.`,correct:!1,explanation:`Sai: Bác sĩ không cấm nghe nhạc mà hướng dẫn cách nghe đúng âm lượng để bảo vệ màng nhĩ.`}]},{q:`Leaflet: 'VISION PROTECTION WEBINAR: Ophthalmologists explain blue light filtering and 20-20-20 screen relaxation rules. Streamed live on YouTube Education channel.' - Where is the visual health seminar accessible for remote viewing?`,a:[{text:`Over the digital live streaming feed of YouTube's public educational channel.`,correct:!0,explanation:`Hội thảo về mắt được phát trực tiếp trên kênh YouTube giáo dục ('Streamed live on YouTube Education').`},{text:`Inside the surgical operating theater of the regional eye hospital.`,correct:!1,explanation:`Sai: Đây là hội thảo trực tuyến phát qua mạng Internet, người xem không cần đến bệnh viện mắt.`},{text:`On private encrypted subscription channels requiring cable television boxes.`,correct:!1,explanation:`Sai: Kênh YouTube Education hoàn toàn miễn phí cho tất cả mọi người có kết nối mạng.`},{text:`Exclusively in school auditoriums through closed-circuit projection screens.`,correct:!1,explanation:`Sai: Bất kỳ ai ở nhà cũng có thể xem trực tiếp trên điện thoại hoặc máy tính cá nhân.`}]},{q:`Leaflet: 'SLEEP HYGIENE WORKSHOP: Discover circadian rhythms, bedroom lighting adjustments, and natural relaxation techniques. Digital sleep diary app offered free.' - What digital companion tool is distributed to workshop participants?`,a:[{text:`A complimentary mobile smartphone application for tracking nighttime sleep diaries.`,correct:!0,explanation:`Người tham dự được tặng ứng dụng nhật ký giấc ngủ điện tử miễn phí ('Digital sleep diary app offered free').`},{text:`A wearable smartwatch monitoring heart rate variability during rest.`,correct:!1,explanation:`Sai: Ban tổ chức tặng ứng dụng phần mềm trên điện thoại thông minh, không tặng đồng hồ thông minh.`},{text:`A computerized white noise sound machine for the bedside table.`,correct:!1,explanation:`Sai: Ứng dụng điện thoại đã có sẵn các chức năng ghi nhận và âm thanh thư giãn tiện ích.`},{text:`An automated alarm clock that dispenses fresh brewed herbal infusions.`,correct:!1,explanation:`Sai: Quà tặng công nghệ là ứng dụng nhật ký giấc ngủ (sleep diary app) cài trên di động.`}]},{q:`Leaflet: 'YOUTH ROWING TASTER SESSION: Learn sculling basics on the calm waters of West Lake. Must be able to swim 50 meters unassisted. Life jackets mandatory.' - What fundamental aquatic survival capability is required before boarding boats?`,a:[{text:`The certified capability to swim fifty meters without flotation assistance.`,correct:!0,explanation:`Điều kiện bơi lội bắt buộc: có khả năng tự bơi ít nhất 50 mét độc lập ('Must be able to swim 50 meters').`},{text:`The ability to hold one's breath underwater for over three minutes.`,correct:!1,explanation:`Sai: Người tham gia chỉ cần biết bơi 50m cơ bản phòng khi lật thuyền, không cần lặn nín thở 3 phút.`},{text:`Previous competitive rowing championship medals won at state regattas.`,correct:!1,explanation:`Sai: Đây là buổi tập trải nghiệm cho người mới bắt đầu ('Taster session'), không đòi hỏi thành tích.`},{text:`Possession of a personal carbon fiber competitive racing boat hull.`,correct:!1,explanation:`Sai: Thuyền tập và mái chèo chuyên dụng đã được câu lạc bộ chèo thuyền trang bị đầy đủ.`}]},{q:`Leaflet: 'TABLE TENNIS YOUTH LEAGUE: Fast-paced table tennis matches every Saturday. Coaching tips provided by provincial champions. Bring indoor sport shoes.' - What mentors offer sports guidance to young ping pong contenders?`,a:[{text:`Experienced athletic champions representing the provincial table tennis team.`,correct:!0,explanation:`Các nhà vô địch bóng bàn cấp tỉnh sẽ trực tiếp hướng dẫn mẹo thi đấu ('Coaching tips by provincial champions').`},{text:`Retired international tennis players transitioning to paddle sports.`,correct:!1,explanation:`Sai: Huấn luyện viên là các nhà vô địch môn bóng bàn cấp tỉnh, không phải cựu tay vợt quần vợt.`},{text:`Commercial sports equipment sales agents marketing expensive carbon paddles.`,correct:!1,explanation:`Sai: Các vận động viên xuất sắc chia sẻ kinh nghiệm kỹ thuật thi đấu phi thương mại.`},{text:`High school physical education teachers completing basic practicum hours.`,correct:!1,explanation:`Sai: Sự hiện diện của các nhà vô địch bóng bàn mang lại nguồn cảm hứng thi đấu tuyệt vời cho các em.`}]},{q:`Leaflet: 'MEDITATION FOR TEEN EXAM RESILIENCE: 30-minute mindfulness sessions held online at 7 PM daily during mid-term exam week. Free Zoom video access link.' - When are the evening online relaxation sessions hosted for examinees?`,a:[{text:`Every night at seven o'clock via virtual meeting links during exam periods.`,correct:!0,explanation:`Thời gian diễn ra lớp học thiền là 19h tối hàng ngày trong suốt tuần thi cử ('7 PM daily during exam week').`},{text:`At five o'clock in the morning before breakfast throughout school vacations.`,correct:!1,explanation:`Sai: Lớp học diễn ra vào 19h tối sau giờ học để giải tỏa căng thẳng trước khi đi ngủ.`},{text:`Every weekend afternoon during regular non-exam semester periods.`,correct:!1,explanation:`Sai: Chương trình được thiết kế đặc biệt trong tuần thi giữa kỳ để hỗ trợ tâm lý học sinh.`},{text:`Only on the final Sunday evening following the conclusion of all tests.`,correct:!1,explanation:`Sai: Các buổi tập thiền 30 phút diễn ra đều đặn hàng ngày trong cả tuần thi áp lực.`}]},{q:`Leaflet: 'HYDRATION CHALLENGE APP: Track daily water intake and receive eco-friendly hydration prompts. Compete with school classmates to unlock virtual tree badges.' - What gamified reward can students achieve by logging water drinking?`,a:[{text:`Digital honorary foliage badges attained by maintaining adequate fluid levels.`,correct:!0,explanation:`Học sinh tích cực sẽ mở khóa các huy hiệu cây xanh ảo trên ứng dụng ('unlock virtual tree badges').`},{text:`Physical saplings delivered to student residences every single weekend.`,correct:!1,explanation:`Sai: Phần thưởng mang tính biểu tượng số là các huy hiệu cây xanh ảo trong ứng dụng.`},{text:`Cash vouchers exchangeable for sweetened commercial fruit sodas.`,correct:!1,explanation:`Sai: Ứng dụng cổ vũ thói quen uống nước lọc lành mạnh, không phát phiếu mua nước ngọt có ga.`},{text:`Automatic full marks on high school physical education report cards.`,correct:!1,explanation:`Sai: Ứng dụng là thử thách rèn luyện sức khỏe ngoại khóa, không can thiệp điểm số học bạ.`}]},{q:`Leaflet: 'STRENGTH AND CONDITIONING FOR ADOLESCENTS: Safe dumbbell and resistance band form for bone density. Supervised by sports physiotherapists. Small groups.' - Who directly oversees the adolescent weight training sessions?`,a:[{text:`Licensed physical rehabilitation therapists specialized in sports injuries.`,correct:!0,explanation:`Buổi tập được giám sát chặt chẽ bởi các chuyên gia vật lý trị liệu thể thao ('Supervised by physiotherapists').`},{text:`Professional bodybuilders promoting extreme muscular hypertrophy regimes.`,correct:!1,explanation:`Sai: Mục tiêu là tăng mật độ xương và thể lực an toàn cho lứa tuổi dậy thì, không phải thể hình cực đoan.`},{text:`High school student monitors without prior fitness training credentials.`,correct:!1,explanation:`Sai: Đội ngũ giám sát là các chuyên gia vật lý trị liệu có bằng cấp chuyên môn cao.`},{text:`Commercial fitness equipment salesmen marketing private gym memberships.`,correct:!1,explanation:`Sai: Buổi tập chú trọng vào kỹ thuật chuẩn xác và an toàn dưới sự hướng dẫn y khoa.`}]},{q:`Leaflet: 'HEALTHY COOKING DEMO: Quick 15-minute school lunchboxes packed with veggies and lean proteins. Free taste test samples following each demonstration.' - What rewarding culinary perk is provided immediately after the cooking demo?`,a:[{text:`Complimentary gourmet tasting portions prepared during the demonstration.`,correct:!0,explanation:`Khán giả được ăn thử các phần mẫu thức ăn thơm ngon ngay sau buổi biểu diễn ('Free taste test samples').`},{text:`A full set of non-stick cookware shipped directly to your home.`,correct:!1,explanation:`Sai: Người xem được thưởng thức các món ăn nếm thử tại chỗ, không tặng bộ nồi chảo về nhà.`},{text:`A month-long supply of frozen ready-to-heat packaged school meals.`,correct:!1,explanation:`Sai: Chương trình dạy nấu ăn tươi ngon tại nhà từ nguyên liệu sạch, không phát đồ đông lạnh.`},{text:`A monetary dining voucher for fast-food burger restaurant franchises.`,correct:!1,explanation:`Sai: Trọng tâm là hộp cơm dinh dưỡng cân bằng cho học sinh với nhiều rau xanh và đạm nạc.`}]},{q:`Leaflet: 'ACTIVE COMMUTE WEDNESDAYS: Walk or cycle to school on Wednesdays to reduce carbon emissions. Registered commuters receive a reflective spoke reflector clip.' - What visibility accessory is awarded to students commuting sustainably?`,a:[{text:`A luminescent bicycle wheel spoke clip to heighten road traffic visibility.`,correct:!0,explanation:`Phần thưởng là kẹp nan hoa xe đạp có gắn phản quang an toàn khi di chuyển ('reflective spoke reflector clip').`},{text:`A high-speed gasoline scooter helmet with tinted racing visors.`,correct:!1,explanation:`Sai: Phong trào khuyến khích đi bộ và xe đạp thân thiện môi trường, quà tặng là kẹp phản quang nan hoa.`},{text:`A motorized skateboard equipped with wireless handheld throttle grips.`,correct:!1,explanation:`Sai: Không có quà tặng ván trượt điện đắt tiền trong phong trào học đường này.`},{text:`An electric horn capable of emitting hundred-decibel siren alerts.`,correct:!1,explanation:`Sai: Kẹp phản quang gắn nan hoa xe đạp phát sáng trong đêm giúp các phương tiện khác dễ quan sát.`}]},{q:`Leaflet: 'YOUTH BADMINTON CARNIVAL: Singles and doubles round-robin matches. Bring your own racket; nylon shuttlecocks provided. Trophies for top three podium finishes.' - What athletic sports equipment is supplied by the carnival organizers?`,a:[{text:`Standard synthetic nylon shuttlecock projectiles provided for tournament games.`,correct:!0,explanation:`Ban tổ chức cung cấp toàn bộ quả cầu lông nhựa tổng hợp cho giải đấu ('nylon shuttlecocks provided').`},{text:`Carbon graphite badminton rackets custom strung to high tensions.`,correct:!1,explanation:`Sai: Vận động viên cần tự mang vợt cầu lông cá nhân của mình ('Bring your own racket').`},{text:`Specialized indoor court shoes featuring reinforced non-slip grips.`,correct:!1,explanation:`Sai: Giày thi đấu cá nhân do thí sinh tự chuẩn bị phù hợp với kích cỡ chân mình.`},{text:`Electronic line-calling optical cameras mounted along stadium sidelines.`,correct:!1,explanation:`Sai: Ban tổ chức tài trợ quả cầu lông thi đấu bằng chất liệu nylon bền bỉ cho các trận đấu.`}]},{q:`Leaflet: 'MINDFUL WALKING CLUB: Early morning silent walks through the Botanical Gardens every Saturday at 6:30 AM. Concludes with communal green tea ceremony.' - How do participants conclude their mindful morning walking session?`,a:[{text:`Gathering together to partake in a traditional communal green tea ceremony.`,correct:!0,explanation:`Kết thúc buổi đi bộ là nghi thức cùng nhau thưởng thức trà xanh thanh tịnh ('communal green tea ceremony').`},{text:`Competing in a five-kilometer timed footrace to the park exit gates.`,correct:!1,explanation:`Sai: Câu lạc bộ đi bộ trong chánh niệm thư thái, không thi đua chạy nhanh về đích.`},{text:`Consuming a heavy buffet breakfast in an adjacent luxury hotel restaurant.`,correct:!1,explanation:`Sai: Buổi sinh hoạt khép lại giản dị và ấm cúng bên những chén trà xanh thanh khiết.`},{text:`Listening to a loud marching brass band playing triumphant anthems.`,correct:!1,explanation:`Sai: Không gian yên tĩnh lắng đọng giúp tinh thần sảng khoái khởi đầu ngày mới an lành.`}]},{q:`Leaflet: 'ANTI-BULLYING EMPOWERMENT WORKSHOP: Assertive communication and non-violent de-escalation drills. Hosted by certified school counselors. Saturday morning.' - What core defensive interpersonal skill is rehearsed in this seminar?`,a:[{text:`Practical strategies for confident assertiveness and non-violent conflict calming.`,correct:!0,explanation:`Học sinh được học kỹ năng giao tiếp tự tin và làm dịu xung đột phi bạo lực ('assertive communication and de-escalation').`},{text:`Physical martial arts striking combinations to overpower adversaries.`,correct:!1,explanation:`Sai: Hội thảo hướng dẫn phương pháp giải quyết mâu thuẫn bằng lời nói hòa bình, cấm dùng bạo lực.`},{text:`Techniques for posting malicious retaliation insults on social networks.`,correct:!1,explanation:`Sai: Xâm hại mạng bị lên án, chương trình xây dựng sự đồng cảm và tôn trọng lẫn nhau.`},{text:`Methods for completely isolating oneself from all peer social circles.`,correct:!1,explanation:`Sai: Kỹ năng giao tiếp quyết đoán giúp học sinh tự bảo vệ bản thân và hòa đồng với bạn bè.`}]},{q:`Leaflet: 'TEEN SKATEBOARD SAFETY CLINIC: Learn safe bailouts, ramp balance, and protective gear fitting. Helmets and elbow pads required. Boards available for trial.' - What protective armor combination is compulsory on the skateboard ramp?`,a:[{text:`A protective cranial helmet matched with specialized elbow cushioning pads.`,correct:!0,explanation:`Quy định bắt buộc học viên phải trang bị mũ bảo hiểm và đệm bảo hộ cùi chỏ ('Helmets and elbow pads required').`},{text:`Heavy steel-reinforced chest armor designed for motorized motocross.`,correct:!1,explanation:`Sai: Trượt ván đường phố chỉ cần mũ bảo hiểm và băng khuỷu tay gọn nhẹ, không mặc giáp mô tô.`},{text:`Thick neoprene diving wetsuits paired with weighted diving boots.`,correct:!1,explanation:`Sai: Đồ lặn biển hoàn toàn không phù hợp và gây vướng víu cho việc tập luyện trượt ván.`},{text:`Reflective orange highway safety vests with flashing shoulder beacons.`,correct:!1,explanation:`Sai: Đồ bảo hộ bắt buộc nhằm chống chấn thương đầu và khớp khuỷu tay khi tiếp đất.`}]},{q:`Leaflet: 'TRADITIONAL LANTERN FESTIVAL: Craft floating paper lanterns along Hoai River. All lantern materials supplied. Fireworks display begins at 9 PM sharp.' - What festive visual highlight is scheduled precisely at nine o'clock?`,a:[{text:`A celebratory pyrotechnic fireworks illumination launched above the river.`,correct:!0,explanation:`Màn bắn pháo hoa nghệ thuật sẽ chính thức bắt đầu vào đúng 21h tối ('Fireworks display begins at 9 PM sharp').`},{text:`The simultaneous release of thousands of battery-powered drones.`,correct:!1,explanation:`Sai: Điểm nhấn lúc 21h là màn bắn pháo hoa truyền thống trên bầu trời đêm sông Hoài.`},{text:`A giant mechanical dragon parade traversing the ancient stone bridge.`,correct:!1,explanation:`Sai: Tờ rơi nêu rõ chương trình pháo hoa nghệ thuật lúc 9 PM sharp rực rỡ sắc màu.`},{text:`The closing of all riverside pedestrian streets to tourist visitors.`,correct:!1,explanation:`Sai: Lễ hội thả hoa đăng và ngắm pháo hoa thu hút đông đảo du khách cùng tham gia.`}]},{q:`Leaflet: 'ECO-CAMPING ON CHAM ISLAND: Experience solar-powered glamping and coral conservation. Single-use plastic bottles strictly forbidden on island boats.' - What environmental restriction is enforced aboard the transit vessels?`,a:[{text:`A complete prohibition on transporting disposable single-use plastic bottles.`,correct:!0,explanation:`Quy định cấm mang chai nhựa dùng một lần lên tàu ra đảo để bảo vệ sinh thái ('Single-use plastic bottles forbidden').`},{text:`A total ban on bringing personal canvas tents and wool sleeping bags.`,correct:!1,explanation:`Sai: Du khách có thể mang hành lý cá nhân, biển cấm nhắm trực tiếp vào rác thải nhựa dùng một lần.`},{text:`A requirement to surrender all personal electronic cameras to customs.`,correct:!1,explanation:`Sai: Du khách được khuyến khích chụp ảnh phong cảnh thiên nhiên tươi đẹp của hòn đảo.`},{text:`A rule prohibiting passengers from consuming drinking water during transit.`,correct:!1,explanation:`Sai: Du khách được mang theo bình nước cá nhân tái sử dụng nhiều lần để uống nước.`}]},{q:`Leaflet: 'FOLK INSTRUMENT WORKSHOP: Learn the basics of Dan Tranh (zither) and Dan Bau (monochord). Taught by conservatory musicians. Instruments provided in studio.' - What traditional musical instruments are featured in the workshop?`,a:[{text:`The traditional Vietnamese plucked zither and the expressive monochord.`,correct:!0,explanation:`Hai nhạc cụ dân tộc được giảng dạy trong lớp là đàn Tranh và đàn Bầu ('Dan Tranh and Dan Bau').`},{text:`The Western grand acoustic piano and four-string orchestral cello.`,correct:!1,explanation:`Sai: Lớp học giới thiệu các nhạc cụ cổ truyền dân tộc Việt Nam, không phải đàn piano phương Tây.`},{text:`The heavy marching band brass trombone and marching snare drums.`,correct:!1,explanation:`Sai: Đàn Tranh và đàn Bầu là hai nhạc cụ mang đậm bản sắc âm nhạc truyền thống Việt Nam.`},{text:`The electronic synthesizer keyboard connected to digital audio pedals.`,correct:!1,explanation:`Sai: Học viên được trực tiếp bấm phím và gảy dây trên đàn Tranh và đàn Bầu thật tại phòng học.`}]},{q:`Leaflet: 'ZERO-WASTE URBAN EXPO: Learn home composting, beeswax food wrapping, and package-free shopping. Bring your own reusable jars and canvas shopping bags.' - What containers should visitors pack when visiting the zero-waste fair?`,a:[{text:`Reusable glass jars accompanied by durable fabric canvas tote bags.`,correct:!0,explanation:`Khách tham quan cần tự mang theo lọ hũ thủy tinh và túi vải tái sử dụng ('Bring your own reusable jars and canvas bags').`},{text:`Disposable plastic shopping bags procured from local grocery stores.`,correct:!1,explanation:`Sai: Hội chợ theo đuổi lối sống không rác thải (Zero-waste) nên cấm dùng túi nhựa dùng một lần.`},{text:`Heavy industrial metal barrels to transport bulk chemical soaps.`,correct:!1,explanation:`Sai: Người tiêu dùng chỉ cần mang lọ thủy tinh và túi vải nhỏ gọn vừa vặn gia đình.`},{text:`Single-use styrofoam takeout boxes lined with aluminium foil sheets.`,correct:!1,explanation:`Sai: Hộp xốp dùng một lần không được chấp nhận tại hội chợ triển lãm lối sống xanh.`}]},{q:`Leaflet: 'HERITAGE CUISINE FESTIVAL: Taste royal Hue recipes and regional street food. Cooking demonstrations hourly from 10 AM to 6 PM. Entry tickets sold at gate.' - How frequently are live cooking masterclasses performed on stage?`,a:[{text:`At scheduled recurring intervals of one hour throughout the festival day.`,correct:!0,explanation:`Các buổi trình diễn nấu ăn diễn ra định kỳ mỗi tiếng một lần ('demonstrations hourly from 10 AM to 6 PM').`},{text:`A single continuous performance lasting eight uninterrupted hours.`,correct:!1,explanation:`Sai: Các buổi biểu diễn chia thành từng đợt mỗi giờ một lần chứ không nấu liên tục 8 tiếng.`},{text:`Only twice daily at the moment gates open and just before midnight.`,correct:!1,explanation:`Sai: Các nghệ nhân biểu diễn đều đặn mỗi giờ để du khách ghé thăm khung giờ nào cũng được xem.`},{text:`Once per calendar week during the weekend evening festival session.`,correct:!1,explanation:`Sai: Hoạt động diễn ra hàng giờ ('hourly') từ 10h sáng tới 18h tối các ngày hội ẩm thực.`}]},{q:`Leaflet: 'INDIE FILM SCREENING: Screening independent student environmental documentaries. Filmmaker Q&A follows. Free admission, but theater seating is first-come, first-served.' - How is cinema auditorium seating allocated to audience members?`,a:[{text:`On an unreserved queue basis depending strictly on early spectator arrival.`,correct:!0,explanation:`Chỗ ngồi trong rạp chiếu được xếp theo thứ tự ai đến trước ngồi trước ('first-come, first-served').`},{text:`By purchasing expensive front-row luxury balcony cinema tickets.`,correct:!1,explanation:`Sai: Vé vào xem phim hoàn toàn miễn phí ('Free admission'), không bán vé chỗ ngồi VIP.`},{text:`Through a random lottery drawing hosted during the opening film credits.`,correct:!1,explanation:`Sai: Chỗ ngồi ưu tiên cho khán giả đến rạp sớm xếp hàng văn minh.`},{text:`Reserved exclusively for certified members of the national press guild.`,correct:!1,explanation:`Sai: Buổi chiếu phim mở rộng chào đón tất cả công chúng yêu thích điện ảnh tài liệu.`}]},{q:`Leaflet: 'COMMUNITY BOOK FAIR: Thousands of donated fiction and science volumes at half price. Proceeds purchase textbooks for rural mountain schools.' - Where is the financial revenue generated from book sales allocated?`,a:[{text:`Toward purchasing curriculum textbooks for underprivileged mountain schools.`,correct:!0,explanation:`Doanh thu bán sách dùng để mua sách giáo khoa cho học sinh trường vùng cao ('purchase textbooks for rural schools').`},{text:`Deposited into commercial corporate accounts of major publishing houses.`,correct:!1,explanation:`Sai: Toàn bộ số tiền thu được dùng làm từ thiện mua sách cho trẻ em vùng khó khăn.`},{text:`Divided as cash dividend bonuses among volunteer student booksellers.`,correct:!1,explanation:`Sai: Tình nguyện viên tham gia phi lợi nhuận, tiền bán sách phục vụ mục đích thiện nguyện cao đẹp.`},{text:`Used to construct an exclusive luxury private library in city hall.`,correct:!1,explanation:`Sai: Ý nghĩa của hội chợ là mang tri thức sách giáo khoa đến với học sinh nghèo vùng núi.`}]},{q:`Leaflet: 'ASTRONOMY STARGAZING NIGHT: Observe Saturn rings through observatory telescopes. Dress warmly in layers. In cloudy weather, planetarium show runs.' - What backup indoor attraction is presented if dense clouds obstruct skies?`,a:[{text:`An immersive digital celestial presentation hosted inside the indoor planetarium.`,correct:!0,explanation:`Nếu trời nhiều mây, du khách sẽ được xem buổi trình chiếu trong nhà vòm thiên văn ('planetarium show runs').`},{text:`An outdoor laser light concert illuminated against towering mountain peaks.`,correct:!1,explanation:`Sai: Chương trình dự phòng khi trời xấu là chuyển vào rạp chiếu mái vòm thiên văn trong nhà.`},{text:`A screening of classic science-fiction movies in the administrative lobby.`,correct:!1,explanation:`Sai: Nhà vòm thiên văn sẽ chiếu mô phỏng các chòm sao và dải ngân hà kỳ thú.`},{text:`The immediate refund of visitor admissions without alternative activities.`,correct:!1,explanation:`Sai: Khách tham quan vẫn có trải nghiệm khám phá vũ trụ sống động tại nhà vòm thiên văn.`}]},{q:`Leaflet: 'POTTERY THROWING MASTERCLASS: Shape terracotta bowls on kick wheels. Aprons provided. Fired bowls ready for pickup after ten days at the ceramics studio.' - How many days must participants wait before collecting fired terracotta bowls?`,a:[{text:`A mandatory waiting interval of ten days for oven firing and cooling.`,correct:!0,explanation:`Thời gian chờ nung và làm nguội bát gốm là 10 ngày sau buổi học ('ready for pickup after ten days').`},{text:`Thirty full days to allow deep subterranean curing inside clay pits.`,correct:!1,explanation:`Sai: Tờ rơi quy định rõ thời gian lấy sản phẩm hoàn thiện là sau 10 ngày.`},{text:`Immediately at the end of the two-hour wheel throwing workshop session.`,correct:!1,explanation:`Sai: Gốm cần phơi khô tự nhiên và nung qua lửa lò hàng nghìn độ nên không thể lấy ngay trong ngày.`},{text:`Within twenty-four hours following a rapid microwave heating procedure.`,correct:!1,explanation:`Sai: Gốm truyền thống nung củi/gas lò nung tiêu chuẩn đòi hỏi chu kỳ nung và làm nguội đúng 10 ngày.`}]},{q:`Leaflet: 'BIRD-WATCHING DAWN EXPEDITION: Identify migratory wetland waders at Red River delta. High-power spotting scopes provided. Departs 5:30 AM from park gate.' - What hour does the dawn birding expedition embark from the park entrance?`,a:[{text:`At half past five in the early morning before sunrise over the delta.`,correct:!0,explanation:`Đoàn thám hiểm xuất phát vào lúc 5h30 sáng sớm từ cổng công viên ('Departs 5:30 AM from park gate').`},{text:`At nine in the morning after rush hour commuter traffic clears away.`,correct:!1,explanation:`Sai: Chim hoang dã đi kiếm ăn lúc rạng đông nên đoàn phải khởi hành từ 5h30 sáng sớm.`},{text:`At noon precisely when the overhead sun shines vertically downward.`,correct:!1,explanation:`Sai: Buổi trưa chim nước thường tìm chỗ ẩn nấp trong lùm cây, không thích hợp quan sát.`},{text:`At twilight sunset just as nocturnal flying bats emerge from caves.`,correct:!1,explanation:`Sai: Chuyến đi quan sát chim nước lúc bình minh rạng sáng ('Dawn Expedition' lúc 5:30 AM).`}]},{q:`Leaflet: 'TRADITIONAL BREAD-MAKING WORKSHOP: Sourdough fermentation and brick-oven baking. Take home a warm loaf and a jar of live sourdough starter yeast.' - What living culinary culture do workshop students take home afterwards?`,a:[{text:`A glass container holding an active live sourdough fermentation starter.`,correct:!0,explanation:`Học viên được mang về nhà một hũ men chua tự nhiên sống để tiếp tục nuôi cấy ('a jar of live sourdough starter').`},{text:`A commercial ten-kilogram sack of factory processed white wheat flour.`,correct:!1,explanation:`Sai: Quà tặng mang về là ổ bánh mì nướng và hũ men cái tự nhiên, không phải bao bột 10kg.`},{text:`A miniature portable brick baking oven powered by wood charcoal.`,correct:!1,explanation:`Sai: Lò nướng gạch cố định tại xưởng, học viên chỉ mang bánh mì và men nuôi về nhà.`},{text:`An electric kitchen stand mixer with spiral dough kneading hooks.`,correct:!1,explanation:`Sai: Lớp học dạy kỹ thuật nhào bột thủ công bằng tay và nuôi men tự nhiên truyền thống.`}]},{q:`Leaflet: 'BAMBOO ARCHITECTURE EXHIBITION: Models of sustainable bamboo bridges and pavilions. Learn how natural bamboo is treated against wood pests. Free weekend admission.' - What natural insect preservation topic is explored in the bamboo pavilion?`,a:[{text:`Ecological treatment methods safeguarding bamboo poles against wood pests.`,correct:!0,explanation:`Triển lãm giới thiệu phương pháp xử lý tre tự nhiên chống lại sự phá hoại của côn trùng ('treated against wood pests').`},{text:`Chemical genetic modification of wild bamboo forest root systems.`,correct:!1,explanation:`Sai: Triển lãm chia sẻ cách xử lý ngâm ủ tre tự nhiên truyền thống, không can thiệp biến đổi gen.`},{text:`Techniques for burning bamboo stalks to create charcoal briquettes.`,correct:!1,explanation:`Sai: Trọng tâm là ứng dụng tre làm vật liệu kiến trúc xây dựng bền vững và chống mối mọt.`},{text:`Industrial mass harvesting of young bamboo shoots for food canning.`,correct:!1,explanation:`Sai: Mô hình kiến trúc tre thể hiện tính thẩm mỹ và độ bền vững của thân tre già qua xử lý sinh học.`}]},{q:`Leaflet: 'COMMUNITY SEED SWAP: Exchange heirloom vegetable and herb seeds with local gardeners. Please label seed envelopes clearly with plant variety and harvest year.' - What specific packaging information must be inscribed on seed packets?`,a:[{text:`The precise botanical variety name along with the corresponding harvest year.`,correct:!0,explanation:`Bao bì hạt giống phải ghi rõ tên giống cây và năm thu hoạch ('label clearly with plant variety and harvest year').`},{text:`The exact commercial wholesale market price of mature vegetables.`,correct:!1,explanation:`Sai: Đây là ngày hội trao đổi tương trợ miễn phí, không định giá mua bán thương mại.`},{text:`The complete genetic genome sequencing map of each seed strain.`,correct:!1,explanation:`Sai: Người làm vườn chỉ cần ghi tên giống rau và năm hái hạt trên phong bì giấy.`},{text:`The GPS geographic coordinates of the garden plot where seeds grew.`,correct:!1,explanation:`Sai: Thông tin cần thiết và thiết thực nhất là chủng loại hạt giống và năm thu hoạch.`}]},{q:`Leaflet: 'LOCAL ARTISAN CRAFT MARKET: Handmade silver jewelry, dyed textiles, and wooden utensils. Strictly plastic-bag free; paper sacks sold for nominal fee.' - What packaging policy is enforced among craft market stalls?`,a:[{text:`A complete ban on plastic sacks with optional paid paper bags offered.`,correct:!0,explanation:`Khu chợ hoàn toàn không dùng túi ni-lông, chỉ cung cấp túi giấy với mức phí nhỏ ('Strictly plastic-bag free').`},{text:`Complimentary glossy plastic carrier bags given with every purchase.`,correct:!1,explanation:`Sai: Chợ phiên nghiêm cấm sử dụng túi nilông để bảo vệ môi trường cảnh quan làng nghề.`},{text:`A requirement that all purchased handicrafts be transported in wooden boxes.`,correct:!1,explanation:`Sai: Khách có thể tự mang túi vải hoặc mua túi giấy với giá rẻ tại quầy hàng.`},{text:`A total prohibition on wrapping fragile silver jewelry in any materials.`,correct:!1,explanation:`Sai: Đồ gốm và trang sức được bọc cẩn thận bằng giấy báo tái chế an toàn.`}]},{q:`Leaflet: 'TRADITIONAL PUPPETRY MATINEE: Water puppetry storytelling depicting harvest legends. Performed on open-air lotus pond. Rain ponchos provided if showers occur.' - What weather gear is distributed if rain showers develop during puppetry?`,a:[{text:`Water-repellent protective rain ponchos distributed to open-air spectators.`,correct:!0,explanation:`Nếu trời đổ mưa, khán giả sẽ được phát áo mưa che chắn ('Rain ponchos provided if showers occur').`},{text:`Full-sized umbrellas fitted with heavy metal ground anchoring spikes.`,correct:!1,explanation:`Sai: Dùng ô to có thể che khuất tầm nhìn của khán giả ngồi phía sau, áo mưa tiện lợi hơn.`},{text:`Waterproof rubber diving boots distributed to every seated guest.`,correct:!1,explanation:`Sai: Khán giả ngồi trên khán đài khô ráo ven hồ hoa sen, chỉ cần mặc áo mưa khi có mưa nhỏ.`},{text:`Portable heated air blowers directed toward bleacher audience benches.`,correct:!1,explanation:`Sai: Ban tổ chức phát áo mưa cánh dơi miễn phí bảo vệ quần áo của du khách khi xem múa rối.`}]},{q:`Leaflet: 'URBAN TREE CANOPY WALK: Guided tour highlighting centuries-old banyan and mahogany trees in the French Quarter. Meeting point: Grand Opera House steps.' - Where is the assembly muster point for the heritage tree tour?`,a:[{text:`On the grand stone entrance steps facing the historic Opera House facade.`,correct:!0,explanation:`Điểm tập hợp của đoàn tham quan là các bậc thềm Nhà hát Lớn ('Meeting point: Opera House steps').`},{text:`Inside the subterranean underground parking garage below City Hall.`,correct:!1,explanation:`Sai: Đoàn hẹn gặp mặt tại bậc thềm Nhà hát Lớn cổ kính ('Grand Opera House steps').`},{text:`At the main railway terminal platform beside high-speed locomotives.`,correct:!1,explanation:`Sai: Điểm xuất phát của tour đi bộ ngắm cây cổ thụ là trước cửa Nhà hát Lớn.`},{text:`Beside the fountain pool in the center of the university botanical park.`,correct:!1,explanation:`Sai: Du khách tập trung tại các bậc thềm mặt tiền Nhà hát Lớn lịch sử để bắt đầu tour.`}]},{q:`Leaflet: 'ECO-FRIENDLY CLOTHING SWAP: Bring up to five clean, undamaged garments to exchange for pre-loved fashion pieces. Remaining apparel donated to shelters.' - What garment condition criterion must clothing swap items meet?`,a:[{text:`Articles must be thoroughly laundered and free from rips or structural damage.`,correct:!0,explanation:`Quần áo mang đổi phải được giặt sạch và không bị rách hỏng ('clean, undamaged garments').`},{text:`Garments must retain original designer store purchase price tags.`,correct:!1,explanation:`Sai: Quần áo đã qua sử dụng chỉ cần sạch đẹp và lành lặn, không bắt buộc còn nguyên mác giá mới.`},{text:`Apparel must be woven entirely from imported organic sheep wool.`,correct:!1,explanation:`Sai: Mọi chất liệu vải thông thường đều được iptions.`,correct:!1,explanation:`Sai: Bức thư pháp thanh tao được viết trên giấy điệp đỏ truyền thống nhẹ nhàng.`},{text:`A monetary cash voucher exchangeable for books at university stores.`,correct:!1,explanation:`Sai: Món quà tinh thần ý nghĩa là nét chữ thư pháp gửi gắm may mắn đầu xuân.`}]},{q:`Leaflet: 'CYCLING HERITAGE TRAIL: 20-kilometer leisure bicycle ride visiting ancient communal houses and pagodas. Bring water and a spare inner tube. Helmets required.' - What replacement repair part must cyclists carry on the excursion?`,a:[{text:`A reserve pneumatic inner tire tube compatible with personal bicycle wheels.`,correct:!0,explanation:`Người đạp xe bắt buộc phải mang theo săm xe đạp dự phòng để phòng thủng xăm ('a spare inner tube').`},{text:`A complete spare bicycle frame crafted from aerospace carbon fiber.`,correct:!1,explanation:`Sai: Người đi xe chỉ cần mang theo một chiếc săm nhỏ gọn trong túi đồ nghề dưới yên.`},{text:`A motorized gasoline auxiliary engine to mount on the rear rack.`,correct:!1,explanation:`Sai: Chuyến đi đạp xe thể thao dã ngoại 20km ngắm cảnh làng quê thanh bình.`},{text:`A heavy hydraulic floor jack capable of lifting passenger motorcars.`,correct:!1,explanation:`Sai: Đồ nghề sửa xe đạp rất gọn nhẹ, việc mang theo săm sơ cua giúp thay thế nhanh chóng khi bị dính đinh.`}]},{q:`Leaflet: 'MEDICINAL HERB WORKSHOP: Discover traditional herbal remedies using lemongrass, ginger, and perilla leaves. Prepare your own soothing herbal tea blend.' - What culinary hands-on product do participants concoct during the workshop?`,a:[{text:`A customized soothing dried herbal infusion blend crafted for home brewing.`,correct:!0,explanation:`Học viên được tự tay pha chế gói trà thảo mộc thanh dịu mang về ('Prepare your own herbal tea blend').`},{text:`A commercial bottle of synthesized pharmaceutical cough syrup.`,correct:!1,explanation:`Sai: Khóa học tập trung vào các loại cây cỏ dân gian tự nhiên, không bào chế tân dược hóa tổng hợp.`},{text:`A heavy wooden pestle and stone mortar set for crushing minerals.`,correct:!1,explanation:`Sai: Học viên dùng cối tại lớp để sao sấy phối trộn trà và mang thành phẩm gói trà về nhà.`},{text:`A commercial lifetime supply of bottled lemongrass essential oils.`,correct:!1,explanation:`Sai: Món quà học viên tạo ra là túi trà thảo mộc tự nhiên từ sả, gừng và lá tía tô thơm lành.`}]},{q:`Leaflet: 'WETLAND ECOSYSTEM WEBINAR: Biologists discuss migratory shorebird habitats along coastal tidal lagoons. Interactive audience poll during intermission.' - What participatory segment occurs during the webinar intermission?`,a:[{text:`A live computerized audience survey poll probing wetland ecological views.`,correct:!0,explanation:`Khán giả được tham gia bình chọn khảo sát tương tác trong giờ nghỉ giải lao ('Interactive audience poll').`},{text:`A high-stakes commercial trivia quiz awarding cash prizes to winners.`,correct:!1,explanation:`Sai: Phần khảo sát tương tác nhằm thu nhận ý kiến và tạo sự gắn kết với người nghe, không trao giải tiền mặt.`},{text:`A live acoustic musical concert performed by a regional symphony orchestra.`,correct:!1,explanation:`Sai: Giờ nghỉ giữa hội thảo khoa học có phần bình chọn nhanh trên nền tảng trực tuyến.`},{text:`A physical sprint race conducted through coastal muddy tidal mudflats.`,correct:!1,explanation:`Sai: Đây là buổi hội thảo trực tuyến qua máy tính, mọi người tham gia từ xa tại nhà.`}]},{q:`Leaflet: 'CITY PARK BOTANICAL AUDIO TOUR: Scan QR codes on historic tree trunks to listen to five-minute botanical narrations. Bring personal smartphone headphones.' - What personal audio equipment is recommended for the arboretum walk?`,a:[{text:`Individual acoustic smartphone earphone sets to stream narration audio.`,correct:!0,explanation:`Du khách cần mang theo tai nghe điện thoại để nghe thuyết minh một cách thuận tiện ('Bring personal smartphone headphones').`},{text:`A pair of massive battery-powered boombox loudspeakers on wheels.`,correct:!1,expla
