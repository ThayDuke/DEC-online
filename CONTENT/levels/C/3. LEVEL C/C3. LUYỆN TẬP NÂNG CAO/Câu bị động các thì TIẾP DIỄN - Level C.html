const fullQuestionBank=[{q:`The new report ___ by the manager right now.`,a:[{text:`is being prepared`,correct:!0,explanation:`Thì Hiện tại tiếp diễn bị động: am/is/are + being + V3.`},{text:`is preparing`,explanation:`Sai. Chủ ngữ 'The new report' chịu sự tác động, do đó câu mang nghĩa bị động, không dùng cấu trúc chủ động 'is preparing'.`,correct:!1},{text:`was being prepared`,explanation:`Sai. 'Right now' dấu hiệu hiện tại.`,correct:!1},{text:`has been prepared`,explanation:`Sai thì: hành động đang diễn ra cần hiện tại tiếp diễn bị động 'is being prepared', không dùng hoàn thành.`,correct:!1}]},{q:`Look! The old bridge ___ to ensure safety.`,a:[{text:`is being repaired`,correct:!0,explanation:`Hiện tại tiếp diễn bị động dùng cho hành động đang xảy ra.`},{text:`repaired`,explanation:`Sai. 'repaired' thiếu trợ động từ 'is being'; cây cầu đang được sửa phải dùng bị động tiếp diễn.`,correct:!1},{text:`is repairing`,explanation:`Sai. Cây cầu không tự sửa.`,correct:!1},{text:`was repaired`,explanation:`Sai. 'Look!' cho biết cây cầu đang được sửa ngay lúc nói; 'was repaired' là quá khứ đã hoàn tất.`,correct:!1}]},{q:`Use the Past Continuous Passive to emphasize an action in progress at the stated past time: at 8 PM yesterday, the cake ___ for the party.`,a:[{text:`was being baked`,correct:!0,explanation:`Quá khứ tiếp diễn bị động: was/were + being + V3.`},{text:`is being baked`,explanation:`Sai. Thời điểm trong quá khứ.`,correct:!1},{text:`was baking`,explanation:`Sai. Cái bánh không tự nướng.`,correct:!1},{text:`has been baked`,explanation:`Sai thì: mốc quá khứ đang diễn ra cần 'was being baked', không dùng hiện tại hoàn thành.`,correct:!1}]},{q:`The documents ___ at the moment. Please wait.`,a:[{text:`are being scanned`,correct:!0,explanation:`Đúng. 'Documents' số nhiều dùng 'are', còn 'at the moment' yêu cầu 'being scanned'.`},{text:`is being scanned`,explanation:`Sai. 'Documents' số nhiều cần 'are being scanned', không phải 'is'.`,correct:!1},{text:`were being scanned`,explanation:`Sai. 'At the moment' đặt việc quét tài liệu ở hiện tại; 'were' đưa hành động về quá khứ.`,correct:!1},{text:`scan`,explanation:`Sai. 'scan' là dạng chủ động nguyên mẫu; 'The documents' cần 'are being scanned'.`,correct:!1}]},{q:`Use the Past Continuous Passive to emphasize an action in progress at the stated past time: while the house ___ red, we stayed at a hotel.`,a:[{text:`was being painted`,correct:!0,explanation:`Hành động đang diễn ra trong quá khứ ở dạng bị động.`},{text:`is being painted`,explanation:`Sai. 'Stayed' là quá khứ.`,correct:!1},{text:`was painting`,explanation:`Sai. Phương án 'was painting' không hòa hợp về ngôi và số với chủ ngữ 'While the house'.`,correct:!1},{text:`painted`,explanation:`Sai. 'painted' thiếu 'was being'; ngôi nhà đang được sơn trong mốc quá khứ.`,correct:!1}]},{q:`Listen! A beautiful song ___ by the choir.`,a:[{text:`is being sung`,correct:!0,explanation:`Hiện tại tiếp diễn bị động với 'Listen!'.`},{text:`is singing`,explanation:`Sai. Bài hát không tự hát.`,correct:!1},{text:`was being sung`,explanation:`Sai. 'Listen!' là lời gọi chú ý ở hiện tại; bài hát cần 'is being sung', không phải 'was'.`,correct:!1},{text:`is sung`,explanation:`Sai. Cần nhấn mạnh tính tiếp diễn.`,correct:!1}]},{q:`Use the Past Continuous Passive to emphasize an action in progress at the stated past time: our car ___ by the mechanic at this time yesterday.`,a:[{text:`was being fixed`,correct:!0,explanation:`Thời điểm xác định trong quá khứ + bị động.`},{text:`is being fixed`,explanation:`Sai. 'At this time yesterday' đặt việc sửa xe ở quá khứ; cần 'was being fixed'.`,correct:!1},{text:`was fixing`,explanation:`Sai. Từ vựng hoặc dạng từ 'was fixing' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`has been fixed`,explanation:`Sai thì: hành động đang sửa cần 'is being fixed', không dùng hiện tại hoàn thành.`,correct:!1}]},{q:`The students ___ by the teacher right now.`,a:[{text:`are being observed`,correct:!0,explanation:`Học sinh đang được quan sát.`},{text:`is being observed`,explanation:`Sai. Phương án 'is being observed' không hòa hợp về ngôi và số với chủ ngữ 'The students'.`,correct:!1},{text:`observe`,explanation:`Sai. 'observe' là động từ chủ động; học sinh là đối tượng đang được giáo viên quan sát.`,correct:!1},{text:`were being observed`,explanation:`Sai. 'Right now' nói việc quan sát đang xảy ra hiện tại; 'were' chỉ quá khứ.`,correct:!1}]},{q:`A new road ___ in our neighborhood this week, and construction is underway now.`,a:[{text:`is being built`,correct:!0,explanation:`Hành động đang diễn ra trong giai đoạn hiện tại.`},{text:`was being built`,explanation:`Sai. 'This week' và việc thi công đang tiếp diễn neo con đường ở hiện tại, không dùng 'was'.`,correct:!1},{text:`is building`,explanation:`Sai. Từ vựng hoặc dạng từ 'is building' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`built`,explanation:`Sai. 'built' chỉ là V3, thiếu 'is being' để diễn tả con đường đang được xây.`,correct:!1}]},{q:`The injured animals ___ at the clinic now.`,a:[{text:`are being treated`,correct:!0,explanation:`Đúng. Động vật bị thương số nhiều đang được điều trị tại phòng khám, nên dùng 'are being treated'.`},{text:`is being treated`,explanation:`Sai. Phương án 'is being treated' không hòa hợp về ngôi và số với chủ ngữ 'The injured animals'.`,correct:!1},{text:`were being treated`,explanation:`Sai. 'Now' cho biết động vật đang được điều trị hiện tại; 'were' sai miền thời gian.`,correct:!1},{text:`treat`,explanation:`Sai. 'treat' là dạng chủ động; động vật bị thương phải là đối tượng của 'are being treated'.`,correct:!1}]},{q:`Use the Past Continuous Passive to emphasize an action in progress at the stated past time: the flowers ___ when it started to rain.`,a:[{text:`were being watered`,correct:!0,explanation:`Quá khứ tiếp diễn bị động bị cắt ngang bởi hành động khác.`},{text:`are being watered`,explanation:`Sai. 'When it started to rain' là mốc quá khứ; hoa khi đó đang được tưới nên dùng 'were being watered'.`,correct:!1},{text:`was being watered`,explanation:`Sai hòa hợp chủ vị (Flowers là số nhiều).`,correct:!1},{text:`watered`,explanation:`Sai. 'watered' thiếu 'were being'; hoa đang được tưới khi mưa bắt đầu.`,correct:!1}]},{q:`Your application ___ by the committee at the moment.`,a:[{text:`is being reviewed`,correct:!0,explanation:`Đúng. 'At the moment' cho biết đơn đang được hội đồng xem xét; 'application' số ít dùng 'is being reviewed'.`},{text:`are being reviewed`,explanation:`Sai. Phương án 'are being reviewed' không hòa hợp về ngôi và số với chủ ngữ 'Your application'.`,correct:!1},{text:`was being reviewed`,explanation:`Sai. 'At the moment' đặt việc xem xét đơn ở hiện tại; dùng 'is being reviewed'.`,correct:!1},{text:`reviews`,explanation:`Sai. Từ vựng hoặc dạng từ 'reviews' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Use the future continuous passive for the action in progress at this exact future time: At this time next Monday, the project ___ by the team.`,a:[{text:`will be being discussed`,correct:!0,explanation:`Tương lai tiếp diễn bị động: will be + being + V3.`},{text:`is being discussed`,explanation:`Sai. 'Next Monday' là mốc tương lai; dự án sẽ đang được thảo luận nên cần 'will be being discussed'.`,correct:!1},{text:`was being discussed`,explanation:`Sai. 'Next Monday' là mốc tương lai; 'was' không thể diễn tả dự án sẽ được thảo luận.`,correct:!1},{text:`will be discussed`,explanation:`Không phải dạng future continuous passive được yêu cầu; phương án dùng future simple nên không diễn tả hành động đang diễn ra tại mốc đó.`,correct:!1}]},{q:`Use the Past Continuous Passive to emphasize an action in progress at the stated past time: the computers ___ in the lab at 10 AM this morning.`,a:[{text:`were being installed`,correct:!0,explanation:`Quá khứ tiếp diễn bị động cho mốc thời gian cụ thể.`},{text:`was being installed`,explanation:`Sai. Phương án 'was being installed' không hòa hợp về ngôi và số với chủ ngữ 'The computers'.`,correct:!1},{text:`are being installed`,explanation:`Sai. 'At 10 AM this morning' là mốc quá khứ; máy tính số nhiều cần 'were being installed'.`,correct:!1},{text:`installed`,explanation:`Sai. 'installed' thiếu cụm 'were being'; máy tính đang được lắp vào mốc 10 giờ.`,correct:!1}]},{q:`Use the Past Continuous Passive to emphasize an action in progress at the stated past time: the children ___ to the zoo when the bus broke down.`,a:[{text:`were being taken`,correct:!0,explanation:`Đang được đưa đi (bị động quá khứ tiếp diễn).`},{text:`was being taken`,explanation:`Sai. Phương án 'was being taken' không hòa hợp về ngôi và số với chủ ngữ 'The children'.`,correct:!1},{text:`are being taken`,explanation:`Sai. Xe buýt hỏng là sự kiện quá khứ; trẻ em khi đó đang được đưa đi nên dùng 'were being taken'.`,correct:!1},{text:`took`,explanation:`Sai. Từ vựng hoặc dạng từ 'took' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Look! The criminals ___ away by the police.`,a:[{text:`are being led`,correct:!0,explanation:`Đúng. 'Look!' báo hiệu tội phạm đang bị cảnh sát dẫn đi; chủ ngữ số nhiều dùng 'are being led'.`},{text:`is being led`,explanation:`Sai. Phương án 'is being led' không hòa hợp chủ vị với chủ ngữ trong câu.`,correct:!1},{text:`were being led`,explanation:`Sai. 'Look!' yêu cầu hiện tại tiếp diễn; tội phạm đang bị dẫn đi nên dùng 'are being led'.`,correct:!1},{text:`are leading`,explanation:`Sai. Từ vựng hoặc dạng từ 'are leading' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`The living room ___ for the Christmas party now.`,a:[{text:`is being decorated`,correct:!0,explanation:`Đúng. Phòng khách đang được trang trí cho tiệc Giáng sinh; 'now' yêu cầu 'is being decorated'.`},{text:`was being decorated`,explanation:`Sai. 'Now' cho biết phòng khách đang được trang trí hiện tại; 'was' là quá khứ.`,correct:!1},{text:`is decorating`,explanation:`Sai. Phòng khách nhận hành động trang trí; 'now' cần 'is being decorated'.`,correct:!1},{text:`decorates`,explanation:`Sai. 'decorates' là hiện tại đơn chủ động; phòng khách đang được trang trí nên cần bị động tiếp diễn.`,correct:!1}]},{q:`The mystery ___ by the detectives at this very moment.`,a:[{text:`is being solved`,correct:!0,explanation:`Đúng. 'At this very moment' xác nhận bí ẩn đang được thám tử giải; chủ ngữ số ít dùng 'is being solved'.`},{text:`are being solved`,explanation:`Sai. Phương án 'are being solved' không hòa hợp về ngôi và số với chủ ngữ 'The mystery'.`,correct:!1},{text:`was being solved`,explanation:`Sai. 'At this very moment' đặt việc giải bí ẩn ở hiện tại; cần 'is being solved'.`,correct:!1},{text:`solved`,explanation:`Sai. 'solved' thiếu 'is being'; bí ẩn đang được các thám tử giải ở hiện tại.`,correct:!1}]},{q:`While I was out, my bedroom ___ by my sister.`,a:[{text:`was being cleaned`,correct:!0,explanation:`Đúng. 'While I was out' cho biết phòng ngủ đang được chị dọn trong một khoảng thời gian quá khứ.`},{text:`is being cleaned`,explanation:`Sai. 'While I was out' đặt việc dọn phòng ở quá khứ; dùng 'was being cleaned'.`,correct:!1},{text:`cleaned`,explanation:`Sai. 'cleaned' thiếu 'was being'; phòng ngủ đang được dọn trong lúc người nói vắng nhà.`,correct:!1},{text:`was cleaning`,explanation:`Sai. Phòng ngủ nhận hành động từ chị gái; cần quá khứ tiếp diễn bị động 'was being cleaned'.`,correct:!1}]},{q:`The patient ___ to the operating room right now.`,a:[{text:`is being carried`,correct:!0,explanation:`Đúng. Bệnh nhân là đối tượng đang được đưa đi 'right now', nên dùng bị động tiếp diễn số ít.`},{text:`are being carried`,explanation:`Sai. Phương án 'are being carried' không hòa hợp về ngôi và số với chủ ngữ 'The patient'.`,correct:!1},{text:`was being carried`,explanation:`Sai. 'Right now' cho biết bệnh nhân đang được đưa đi; dùng 'is being carried'.`,correct:!1},{text:`is carrying`,explanation:`Sai. Từ vựng hoặc dạng từ 'is carrying' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`A new shopping mall ___ in the city center this year, and construction is underway now.`,a:[{text:`is being constructed`,correct:!0,explanation:`Sự việc đang diễn ra trong năm nay.`},{text:`was being constructed`,explanation:`Sai. 'This year' cùng 'underway now' neo việc xây trung tâm ở hiện tại, không phải 'was'.`,correct:!1},{text:`is constructing`,explanation:`Sai. Từ vựng hoặc dạng từ 'is constructing' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`constructed`,explanation:`Sai. 'constructed' chỉ là V3; trung tâm mua sắm đang được xây cần 'is being constructed'.`,correct:!1}]},{q:`Wait a minute. Your luggage ___ into the car.`,a:[{text:`is being loaded`,correct:!0,explanation:`Hành lang đang được tải lên xe.`},{text:`are being loaded`,explanation:`Luggage là danh từ không đếm được, dùng số ít.`,correct:!1},{text:`was being loaded`,explanation:`Sai. 'Wait a minute' báo hành động đang xảy ra; hành lý cần 'is being loaded' vào xe.`,correct:!1},{text:`loads`,explanation:`Sai. Từ vựng hoặc dạng từ 'loads' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Use the Past Continuous Passive to emphasize an action in progress at the stated past time: when the lights went out, a horror movie ___ on TV.`,a:[{text:`was being shown`,correct:!0,explanation:`Đúng. Khi đèn tắt, bộ phim đang được chiếu; mốc quá khứ yêu cầu 'was being shown'.`},{text:`is being shown`,explanation:`Sai. 'When the lights went out' là mốc quá khứ; phim khi đó đang được chiếu.`,correct:!1},{text:`was showing`,explanation:`Sai. Phim kinh dị đang được chiếu khi đèn tắt; cần 'was being shown'.`,correct:!1},{text:`showed`,explanation:`Sai. 'showed' là quá khứ chủ động; bộ phim đang được chiếu khi đèn tắt.`,correct:!1}]},{q:`The plants ___ in the garden at the moment.`,a:[{text:`are being replanted`,correct:!0,explanation:`Đúng. Cây số nhiều đang được trồng lại trong vườn; 'at the moment' xác định hiện tại.`},{text:`is being replanted`,explanation:`Sai. Phương án 'is being replanted' không hòa hợp về ngôi và số với chủ ngữ 'The plants'.`,correct:!1},{text:`were being replanted`,explanation:`Sai. 'At the moment' chỉ việc trồng lại cây đang diễn ra hiện tại; không dùng 'were'.`,correct:!1},{text:`replanting`,explanation:`Sai. 'The plants' nhận hành động; hiện tại tiếp diễn bị động cần 'are being replanted', không dùng V-ing đơn.`,correct:!1}]},{q:`Use the Past Continuous Passive to emphasize an action in progress at the stated past time: the data ___ into the computer when it crashed.`,a:[{text:`was being entered`,correct:!0,explanation:`Đúng. Dữ liệu đang được nhập khi máy tính gặp sự cố; 'data' không đếm được dùng 'was'.`},{text:`is being entered`,explanation:`Sai. Máy tính bị lỗi trong quá khứ; dữ liệu khi đó đang được nhập nên dùng 'was being entered'.`,correct:!1},{text:`entered`,explanation:`Sai. 'entered' thiếu 'was being'; dữ liệu đang được nhập khi máy tính gặp sự cố.`,correct:!1},{text:`were being entered`,explanation:`Data thường dùng với động từ số ít trong ngữ pháp truyền thống.`,correct:!1}]},{q:`Use the future continuous passive for the action in progress at this exact future time: Tomorrow at 9 AM, your exam papers ___ by the teachers.`,a:[{text:`will be being marked`,correct:!0,explanation:`Đúng. 'Tomorrow at 9 AM' chỉ thời điểm tương lai; exam papers sẽ đang được giáo viên chấm.`},{text:`are being marked`,explanation:`Sai. 'Tomorrow at 9 AM' nằm ở tương lai; bài thi cần 'will be being marked', không phải hiện tại.`,correct:!1},{text:`were being marked`,explanation:`Sai. 'Tomorrow at 9 AM' không phải quá khứ; dùng 'will be being marked' cho tiến trình tương lai.`,correct:!1},{text:`will be marked`,explanation:`Không phải dạng future continuous passive được yêu cầu; phương án dùng future simple nên không diễn tả hành động đang diễn ra tại mốc đó.`,correct:!1}]},{q:`Use the Future Continuous Passive to emphasize an action in progress at th
