const fullQuestionBank=[{q:`Identify the correct inversion: He had never seen such a mess.`,a:[{text:`Never had he seen such a mess.`,correct:!0,explanation:`Đảo ngữ với 'Never': Trạng từ + trợ động từ + chủ ngữ + động từ chính.`},{text:`Never he had seen such a mess.`,explanation:`Thiếu đảo trợ động từ lên trước chủ ngữ.`,correct:!1},{text:`Never did he saw such a mess.`,explanation:`Sai thì và sai dạng động từ sau 'did'.`,correct:!1},{text:`Never had seen he such a mess.`,explanation:`Sai vị trí chủ ngữ. Cách dùng phù hợp trong câu này là “Never had he seen such a mess.”.`,correct:!1}]},{q:`Choose the correct sentence: They rarely go out at night.`,a:[{text:`Rarely do they go out at night.`,correct:!0,explanation:`Đảo ngữ với 'Rarely' dùng trợ động từ 'do' cho hiện tại đơn.`},{text:`Rarely they go out at night.`,explanation:`Thiếu trợ động từ đảo ngữ.`,correct:!1},{text:`Rarely are they go out at night.`,explanation:`Dùng sai trợ động từ 'are'.`,correct:!1},{text:`Rarely does they go out at night.`,explanation:`Chủ ngữ 'they' không đi với 'does'.`,correct:!1}]},{q:`Identify the correct inversion: She little knew about the surprise.`,a:[{text:`Little did she know about the surprise.`,correct:!0,explanation:`Đảo ngữ với 'Little' để nhấn mạnh việc không biết gì.`},{text:`Little she knew about the surprise.`,explanation:`Thiếu trợ động từ 'did'.`,correct:!1},{text:`Little does she knew about the surprise.`,explanation:`Sai thì (quá khứ phải dùng 'did').`,correct:!1},{text:`Little she did know about the surprise.`,explanation:`Sai. Phương án 'Little she did know about the surprise.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`Choose the correct sentence: I have seldom heard such a beautiful song.`,a:[{text:`Seldom have I heard such a beautiful song.`,correct:!0,explanation:`Đảo ngữ với 'Seldom' sử dụng hiện tại hoàn thành.`},{text:`Seldom I have heard such a beautiful song.`,explanation:`Chưa đảo trợ động từ 'have'.`,correct:!1},{text:`Seldom did I heard such a beautiful song.`,explanation:`Sai. Phương án 'Seldom did I heard such a beautiful song.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`Seldom have heard I such a song.`,explanation:`Trật tự từ bị xáo trộn sai.`,correct:!1}]},{q:`Identify the correct inversion: We only then realized our mistake.`,a:[{text:`Only then did we realize our mistake.`,correct:!0,explanation:`Đảo ngữ với 'Only then' dùng trợ động từ 'did'.`},{text:`Only then we realized our mistake.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “Only then did we realize our mistake.”.`,correct:!1},{text:`Only then we did realize our mistake.`,explanation:`Sai vị trí trợ động từ.`,correct:!1},{text:`Only then did we realized our mistake.`,explanation:`Động từ 'realize' phải ở dạng nguyên thể sau 'did'.`,correct:!1}]},{q:`Choose the correct sentence: Not only is he talented, but he is also kind.`,a:[{text:`Not only is he talented, but he is also kind.`,correct:!0,explanation:`Đảo ngữ với 'Not only' và giữ đủ chủ ngữ/động từ ở hai vế song song.`},{text:`Not only he is talented but also kind.`,explanation:`Mệnh đề đầu tiên chưa đảo ngữ.`,correct:!1},{text:`Not only does he talented but also kind.`,explanation:`Talented là tính từ, phải dùng 'is'.`,correct:!1},{text:`Not only is he talented but he also kind.`,explanation:`Mệnh đề sau thiếu động từ 'is'.`,correct:!1}]},{q:`Identify the correct inversion: You should under no circumstances open this door.`,a:[{text:`Under no circumstances should you open this door.`,correct:!0,explanation:`Đảo ngữ với cụm từ phủ định 'Under no circumstances'.`},{text:`Under no circumstances you should open this door.`,explanation:`Thiếu đảo modal verb 'should'.`,correct:!1},{text:`Under no circumstances do you open this door.`,explanation:`Làm thay đổi nghĩa gốc của câu dùng 'should'.`,correct:!1},{text:`No circumstances should you open this door.`,explanation:`Thiếu giới từ 'Under'.`,correct:!1}]},{q:`Choose the correct sentence: She had hardly finished work when the phone rang.`,a:[{text:`Hardly had she finished work when the phone rang.`,correct:!0,explanation:`Cấu trúc: Hardly + had + S + V3/ed + when + S + V2/ed.`},{text:`Hardly she had finished work when the phone rang.`,explanation:`Thiếu đảo ngữ ở mệnh đề đầu.`,correct:!1},{text:`Hardly had she finished work than the phone rang.`,explanation:`Hardly đi với 'when', không đi với 'than'.`,correct:!1},{text:`Hardly did she finish work when the phone rang.`,explanation:`Dùng sai thì (phải dùng quá khứ hoàn thành).`,correct:!1}]},{q:`Identify the correct inversion: I had no sooner arrived than it started raining.`,a:[{text:`No sooner had I arrived than it started raining.`,correct:!0,explanation:`Cấu trúc: No sooner + had + S + V3/ed + than + S + V2/ed.`},{text:`No sooner I had arrived than it started raining.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “No sooner had I arrived than it started raining.”.`,correct:!1},{text:`No sooner had I arrived when it started raining.`,explanation:`No sooner đi với 'than', không đi với 'when'.`,correct:!1},{text:`No sooner did I arrive than it started raining.`,explanation:`Không đúng thì quá khứ hoàn thành theo cấu trúc chuẩn.`,correct:!1}]},{q:`Choose the correct sentence: You can only solve the problem by practicing.`,a:[{text:`Only by practicing can you solve the problem.`,correct:!0,explanation:`Đảo ngữ sau 'Only by + Ving'.`},{text:`Only by practicing you can solve the problem.`,explanation:`Thiếu đảo ngữ ở mệnh đề chính.`,correct:!1},{text:`Only by practicing can solve you the problem.`,explanation:`Sai trật tự chủ ngữ và động từ.`,correct:!1},{text:`Only practicing can you solve the problem.`,explanation:`Thiếu giới từ 'by'. Cách dùng phù hợp trong câu này là “Only by practicing can you solve the problem.”.`,correct:!1}]},{q:`Identify the correct inversion: I didn't know the truth until much later.`,a:[{text:`Not until much later did I know the truth.`,correct:!0,explanation:`Đảo ngữ ở mệnh đề chính sau 'Not until'.`},{text:`Not until much later I knew the truth.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “Not until much later did I know the truth.”.`,correct:!1},{text:`Not until did I know the truth much later.`,explanation:`Sai vị trí của 'much later'.`,correct:!1},{text:`Not until much later I did know the truth.`,explanation:`Sai. Phương án 'Not until much later I did know the truth.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`Choose the correct sentence: The sun had just set when the stars appeared.`,a:[{text:`Scarcely had the sun set when the stars appeared.`,correct:!0,explanation:`Scarcely đi với 'when' và yêu cầu đảo ngữ.`},{text:`Scarcely the sun had set when the stars appeared.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “Scarcely had the sun set when the stars appeared.”.`,correct:!1},{text:`Scarcely had the sun set than the stars appeared.`,explanation:`Scarcely đi với 'when', không đi với 'than'.`,correct:!1},{text:`Scarcely did the sun set when the stars appeared.`,explanation:`Sai thì (cần quá khứ hoàn thành).`,correct:!1}]},{q:`Identify the correct inversion: We can find such beauty nowhere else.`,a:[{text:`Nowhere else can we find such beauty.`,correct:!0,explanation:`Đảo ngữ với trạng từ phủ định 'Nowhere else'.`},{text:`Nowhere else we can find such beauty.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “Nowhere else can we find such beauty.”.`,correct:!1},{text:`Nowhere else can find we such beauty.`,explanation:`Sai trật tự động từ và chủ ngữ.`,correct:!1},{text:`Nowhere else do we find such beauty.`,explanation:`Thay đổi modal verb 'can' thành 'do'.`,correct:!1}]},{q:`Choose the correct sentence: He at no time lied to us.`,a:[{text:`At no time did he lie to us.`,correct:!0,explanation:`Đảo ngữ với cụm 'At no time'.`},{text:`At no time he lied to us.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “At no time did he lie to us.”.`,correct:!1},{text:`At no time does he lie to us.`,explanation:`Sai thì (quá khứ phải dùng 'did').`,correct:!1},{text:`At no time lied he to us.`,explanation:`Phải dùng trợ động từ để đảo ngữ.`,correct:!1}]},{q:`Identify the correct inversion: I will not help him in any way.`,a:[{text:`In no way will I help him.`,correct:!0,explanation:`Đảo ngữ với 'In no way'.`},{text:`In no way I will help him.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “In no way will I help him.”.`,correct:!1},{text:`In no way I won't help him.`,explanation:`Phủ định hai lần (In no way và won't) là sai.`,correct:!1},{text:`In no way am I help him.`,explanation:`Sai động từ khuyết thiếu.`,correct:!1}]},{q:`Choose the correct sentence: They little suspected that he was a thief.`,a:[{text:`Little did they suspect that he was a thief.`,correct:!0,explanation:`Đảo ngữ với 'Little'.`},{text:`Little they suspected that he was a thief.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “Little did they suspect that he was a thief.”.`,correct:!1},{text:`Little they did suspect that he was a thief.`,explanation:`Sai cấu trúc mệnh đề. Chọn sai đại từ quan hệ hoặc chia sai động từ.`,correct:!1},{text:`Little had they suspected that he was a thief.`,explanation:`Làm thay đổi thì của câu gốc.`,correct:!1}]},{q:`Identify the correct inversion: The money is on no account to be touched.`,a:[{text:`On no account is the money to be touched.`,correct:!0,explanation:`Đảo ngữ với 'On no account'.`},{text:`On no account the money is to be touched.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “On no account is the money to be touched.”.`,correct:!1},{text:`On no account be the money touched.`,explanation:`Sai. Phương án 'On no account be the money touched.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`No account is the money to be touched.`,explanation:`Thiếu giới từ 'On'. Cách dùng phù hợp trong câu này là “On no account is the money to be touched.”.`,correct:!1}]},{q:`Choose the correct sentence: I realized who he was only when he removed his mask.`,a:[{text:`Only when he removed his mask did I realize who he was.`,correct:!0,explanation:`Đảo ngữ ở mệnh đề chính sau 'Only when + S + V'.`},{text:`Only when did he remove his mask I realized who he was.`,explanation:`Sai vì đảo ngữ ở mệnh đề 'only', phải đảo ở mệnh đề sau.`,correct:!1},{text:`Only when he removed his mask I realized who he was.`,explanation:`Thiếu đảo ngữ ở mệnh đề chính.`,correct:!1},{text:`Only when he removed his mask did I realized who he was.`,explanation:`Sai dạng động từ sau 'did'.`,correct:!1}]},{q:`Identify the correct inversion: I have never encountered such a problem.`,a:[{text:`Never have I encountered such a problem.`,correct:!0,explanation:`Đảo ngữ 'Never' với hiện tại hoàn thành.`},{text:`Never I have encountered such a problem.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “Never have I encountered such a problem.”.`,correct:!1},{text:`Never did I encounter such a problem.`,explanation:`Sai. Phương án 'Never did I encounter such a problem.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`Never have encountered I such a problem.`,explanation:`Sai vị trí chủ ngữ. Cách dùng phù hợp trong câu này là “Never have I encountered such a problem.”.`,correct:!1}]},{q:`Choose the correct sentence: He didn't say a word.`,a:[{text:`Not a word did he say.`,correct:!0,explanation:`Đảo ngữ nhấn mạnh tân ngữ phủ định đưa lên đầu.`},{text:`Not a word he said.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “Not a word did he say.”.`,correct:!1},{text:`Not a word he did say.`,explanation:`Sai cấu trúc mệnh đề. Chọn sai đại từ quan hệ hoặc chia sai động từ.`,correct:!1},{text:`Not a word does he say.`,explanation:`Sai. Dấu hiệu hoặc ngữ cảnh trong câu ở quá khứ, không dùng thì Hiện tại.`,correct:!1}]},{q:`Rewrite: He is so intelligent that he can solve any math problem.`,a:[{text:`So intelligent is he that he can solve any math problem.`,correct:!0,explanation:`Cấu trúc: So + Adj + Be + S + that...`},{text:`So intelligent he is that he can solve it.`,explanation:`Thiếu đảo ngữ 'is he'.`,correct:!1},{text:`Such intelligent is he that he can solve it.`,explanation:`Such phải đi với danh từ.`,correct:!1},{text:`So is he intelligent that he can solve it.`,explanation:`Sai trật tự tính từ.`,correct:!1}]},{q:`Rewrite, beginning with 'Such': I had such a bad day that I cried.`,a:[{text:`Such a bad day did I have that I cried.`,correct:!0,explanation:`Đảo ngữ đúng và bắt đầu bằng 'Such' như yêu cầu.`},{text:`Such a bad day I had that I cried.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “Such a bad day did I have that I cried.”.`,correct:!1},{text:`So a bad day did I have that I cried.`,explanation:`Sai trật tự trong cấu trúc 'so + adjective + a/an + noun'.`,correct:!1},{text:`Such a bad day was I have that I cried.`,explanation:`Sai trật tự và chia động từ trong cấu trúc đảo ngữ với 'Such'.`,correct:!1}]},{q:`Which sentence has the same meaning: 'If I were you, I would tell her.'`,a:[{text:`Were I you, I would tell her.`,correct:!0,explanation:`Đảo ngữ câu điều kiện loại 2: Were + S + O.`},{text:`Was I you, I would tell her.`,explanation:`Trong câu điều kiện không dùng 'was'.`,correct:!1},{text:`If were I you, I would tell her.`,explanation:`Đã đảo ngữ thì bỏ 'If'.`,correct:!1},{text:`Were I being you, I would tell her.`,explanation:`Sai cấu trúc mệnh đề. Chọn sai đại từ quan hệ hoặc chia sai động từ.`,correct:!1}]},{q:`Which sentence has the same meaning: 'If he had known, he would have come.'`,a:[{text:`Had he known, he would have come.`,correct:!0,explanation:`Đảo ngữ câu điều kiện loại 3: Had + S + V3/ed.`},{text:`If had he known, he would have come.`,explanation:`Bỏ 'If' khi dùng đảo ngữ.`,correct:!1},{text:`Had he knew, he would ha lm that I fell asleep.`,correct:!0,explanation:`Chuyển từ cấu trúc 'Such' sang đảo ngữ với 'So'.`},{text:`Such boring film was it that I fell asleep.`,explanation:`Such phải đi với cụm danh từ đầy đủ.`,correct:!1},{text:`The film was such boring that I fell asleep.`,explanation:`'Such' phải đi với cụm danh từ, không đứng trực tiếp trước tính từ.`,correct:!1},{text:`So was the film boring that I fell asleep.`,explanation:`Sai trật tự. Cách dùng phù hợp trong câu này là “So boring was the film that I fell asleep.”.`,correct:!1}]},{q:`Rewrite: He had just arrived when the meeting started.`,a:[{text:`No sooner had he arrived than the meeting started.`,correct:!0,explanation:`No sooner... than dùng để diễn tả hành động vừa mới xảy ra.`},{text:`No sooner had he arrived when the meeting started.`,explanation:`No sooner đi với 'than', không phải 'when'.`,correct:!1},{text:`No sooner he had arrived than the meeting started.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “No sooner had he arrived than the meeting started.”.`,correct:!1},{text:`Hardly had he arrived than the meeting started.`,explanation:`Hardly đi với 'when'.`,correct:!1}]},{q:`Meaning: 'You shouldn't go out alone at night.'`,a:[{text:`On no account should you go out alone at night.`,correct:!0,explanation:`On no account dùng để đưa ra lời khuyên ngăn cấm mạnh mẽ.`},{text:`Under no account should you go out alone.`,explanation:`Cụm đúng là 'On no account' hoặc 'Under no circumstances'.`,correct:!1},{text:`Never you should go out alone at night.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “On no account should you go out alone at night.”.`,correct:!1},{text:`Should you on no account go out alone.`,explanation:`Sai trật tự. Cách dùng phù hợp trong câu này là “On no account should you go out alone at night.”.`,correct:!1}]},{q:`Rewrite with inversion: I never suspected he was a genius.`,a:[{text:`Never did I suspect he was a genius.`,correct:!0,explanation:`Đảo ngữ với 'Never  the match was cancelled.`,explanation:`Sau 'Because' phải dùng mệnh đề.`,correct:!1},{text:`Due to it rained, the match was cancelled.`,explanation:`Due to phải đi với danh từ.`,correct:!1}]},{q:`Rewrite with 'Unless': If you don't study, you will fail.`,a:[{text:`Unless you study, you will fail.`,correct:!0,explanation:`Unless = If... not. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`Unless you don't study, you will fail.`,explanation:`Unless đã mang nghĩa phủ định, không dùng thêm 'don't'.`,correct:!1},{text:`Unless you will study, you will fail.`,explanation:`Không dùng 'will' trong mệnh đề Unless/If.`,correct:!1},{text:`Unless studying, you will fail.`,explanation:`Sai cấu trúc mệnh đề. Chọn sai đại từ quan hệ hoặc chia sai động từ.`,correct:!1}]},{q:`Rewrite with 'Despite': Although he is old, he runs every morning.`,a:[{text:`Despite his old age, he runs every morning.`,correct:!0,explanation:`Despite + cụm danh từ.`},{text:`Despite he is old, he runs every morning.`,explanation:`Despite không đi với mệnh đề.`,correct:!1},{text:`Despite being old age, he runs every morning.`,explanation:`Sai cách kết hợp từ.`,correct:!1},{text:`In spite he is old, he runs every morning.`,explanation:`Thiếu 'of' và không đi với mệnh đề.`,correct:!1}]},{q:`Rewrite with 'If': She didn't have a map, so she got lost.`,a:[{text:`If she had had a map, she wouldn't have got lost.`,correct:!0,explanation:`Câu điều kiện loại 3 diễn tả sự việc trái với quá khứ.`},{text:`If she has a map, she won't get lost.`,explanation:`Sai loại điều kiện (đây là quá khứ).`,correct:!1},{text:`If she had a map, she wouldn't get lost.`,explanation:`Sai loại điều kiện (loại 2 dành cho hiện tại).`,correct:!1},{text:`If she didn't have a map, she would get lost.`,explanation:`Sai. Cấu trúc 'If she didn't have a map, she would get lost.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Rewrite with 'In spite of': Though the traffic was bad, I arrived on ti ilot.”.`,correct:!1},{text:`She is the girl of whom father is a pilot.`,explanation:`Cấu trúc rườm rà không cần thiết.`,correct:!1},{text:`She is the girl that father is a pilot.`,explanation:`That không thay cho whose.`,correct:!1}]},{q:`Combine the two sentences using a present-participle phrase (V-ing), not a relative clause: I saw a dog. It had only three legs.`,a:[{text:`I saw a dog having only three legs.`,correct:!0,explanation:`Dùng hiện tại phân từ (V-ing) để rút gọn mệnh đề quan hệ.`},{text:`I saw a dog had only three legs.`,explanation:`Dùng mệnh đề quan hệ thay vì cụm phân từ hiện tại (V-ing) theo yêu cầu của stem.`,correct:!1},{text:`I saw a dog which had only three legs.`,correct:!1,explanation:`Câu này đúng nhưng đề bài thường yêu cầu rút gọn hoặc dùng V-ing.`},{text:`Saw a dog, it had three legs.`,explanation:`Sai. Phương án 'Saw a dog, it had three legs.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`Combine: He was late. This surprised everyone.`,a:[{text:`He was late, which surprised everyone.`,correct:!0,explanation:`Dùng 'which' thay thế cho cả mệnh đề phía trước.`},{text:`He was late which surprised everyone.`,explanation:`Thiếu dấu phẩy khi 'which' thay cho cả mệnh đề.`,correct:!1},{text:`He was late, that surprised everyone.`,explanation:`That không thay cho cả mệnh đề sau dấu phẩy.`,correct:!1},{text:`He was late, what surprised everyone.`,explanation:`What không làm đại từ quan hệ thay thế mệnh đề.`,correct:!1}]},{q:`Combine: The cake was delicious. My mom made it.`,a:[{text:`The cake my mom made was delicious.`,correct:!0,explanation:`Rút gọn đại từ quan hệ làm tân ngữ (bỏ which/that).`},{text:`The cake which my mom made it was delicious.`,explanation:`Thừa từ 'it'. Cách dùng phù hợp trong câu này là “The cake my mom made was delicious.”.`,correct:!1},{text:`The cake where my mom made was delicious.`,explanation:`Sai đại từ quan hệ. Cách dùng phù hợp trong câu này là “The cake my mom made was deliciou
