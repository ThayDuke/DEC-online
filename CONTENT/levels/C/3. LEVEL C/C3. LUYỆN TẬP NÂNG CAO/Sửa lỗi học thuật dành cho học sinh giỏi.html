const fullQuestionBank=[{q:`Choose the incorrect sentence.`,a:[{text:`Rarely have I seen such dedication.`,explanation:`Chưa đúng khi chọn “Rarely have I seen such dedication.”. Đúng cấu trúc đảo ngữ với trạng từ phủ định.`,correct:!1},{text:`Rarely I have seen such dedication.`,correct:!0,explanation:`Chính xác! “Rarely I have seen such dedication.” là lựa chọn phù hợp. Nhận định được nêu trong câu hỏi là sai: vì thiếu đảo ngữ trợ động từ 'have' lên trước chủ ngữ 'I'.`},{text:`I have rarely seen such dedication.`,explanation:`Câu trần thuật bình thường, đúng ngữ pháp.`,correct:!1},{text:`Never have I experienced such support.`,explanation:`Chưa đúng khi chọn “Never have I experienced such support.”. Đúng cấu trúc đảo ngữ với 'Never'.`,correct:!1}]},{q:`Identify the error: 'Not only he is late, but he also forgot his book.'`,a:[{text:`he is late`,correct:!0,explanation:`Phải đảo ngữ thành 'is he late' sau cụm 'Not only'.`},{text:`but he also`,explanation:`Cụm từ nối này đúng ngữ pháp.`,correct:!1},{text:`forgot`,explanation:`Thì quá khứ đơn phù hợp ngữ cảnh.`,correct:!1},{text:`his book`,explanation:`Tân ngữ đúng. Cách dùng phù hợp trong câu này là “he is late”.`,correct:!1}]},{q:`Identify the error: 'Despite he was tired, he finished the essay.'`,a:[{text:`Despite`,correct:!0,explanation:`'Despite' đi với danh từ/V-ing, ở đây có mệnh đề nên phải dùng 'Although'.`},{text:`he was tired`,explanation:`Mệnh đề đúng ngữ pháp.`,correct:!1},{text:`finished`,explanation:`Chia thì quá khứ đơn đúng.`,correct:!1},{text:`the essay`,explanation:`Tân ngữ đúng. Cách dùng phù hợp trong câu này là “Despite”.`,correct:!1}]},{q:`Identify the error: 'No sooner had I arrived than the phone rings.'`,a:[{text:`No sooner`,explanation:`Từ nối đảo ngữ đúng.`,correct:!1},{text:`had I arrived`,explanation:`Đảo ngữ quá khứ hoàn thành đúng.`,correct:!1},{text:`than`,explanation:`Đi cặp với 'No sooner' là đúng.`,correct:!1},{text:`rings`,correct:!0,explanation:`Phải dùng 'rang' để đồng nhất thì quá khứ.`}]},{q:`Identify the error: 'In my opinion, I think the internet is useful.'`,a:[{text:`In my opinion`,correct:!0,explanation:`Lỗi lặp ý (redundancy) khi dùng cả 'In my opinion' và 'I think'.`},{text:`the internet`,explanation:`Danh từ có 'the' đúng.`,correct:!1},{text:`is useful`,explanation:`Động từ to-be chia số ít đúng.`,correct:!1},{text:`useful`,explanation:`Tính từ đúng văn phong.`,correct:!1}]},{q:`Identify the error: 'There is many reasons why we should recycle.'`,a:[{text:`There is`,correct:!0,explanation:`Cấu trúc tồn tại phải hòa hợp với danh từ số nhiều 'many reasons', nên câu đúng là 'There are many reasons'.`},{text:`reasons`,explanation:`Danh từ số nhiều đúng.`,correct:!1},{text:`why`,explanation:`Trạng từ quan hệ chỉ lý do đúng.`,correct:!1},{text:`should recycle`,explanation:`Động từ khuyết thiếu đúng.`,correct:!1}]},{q:`Identify the error: 'Hardly I had sat down when the bell rang.'`,a:[{text:`Hardly`,explanation:`Từ nối phủ định đúng.`,correct:!1},{text:`I had sat down`,correct:!0,explanation:`Phải đảo ngữ thành 'Had I sat down'.`},{text:`when`,explanation:`Đi cặp với 'Hardly' đúng.`,correct:!1},{text:`rang`,explanation:`Thì quá khứ đơn đúng.`,correct:!1}]},{q:`Identify the error: 'So fast did he ran that I couldn't catch him.'`,a:[{text:`So fast`,explanation:`Đảo ngữ với 'So' đúng.`,correct:!1},{text:`did he ran`,correct:!0,explanation:`Sau trợ động từ 'did' phải dùng động từ nguyên mẫu 'run'.`},{text:`that`,explanation:`Cấu trúc 'So... that' đúng.`,correct:!1},{text:`couldn't catch`,explanation:`Động từ khuyết thiếu quá khứ đúng.`,correct:!1}]},{q:`Identify the error: 'The movie was so bored that I fell asleep.'`,a:[{text:`The movie`,explanation:`Chủ ngữ đúng. Cách dùng phù hợp trong câu này là “bored”.`,correct:!1},{text:`was`,explanation:`Thì quá khứ đúng. Cách dùng phù hợp trong câu này là “bored”.`,correct:!1},{text:`bored`,correct:!0,explanation:`Vật gây ra cảm xúc phải dùng tính từ đuôi -ing ('boring').`},{text:`that`,explanation:`Cấu trúc 'so... that' đúng.`,correct:!1}]},{q:`Identify the error: 'I don't know where does he live.'`,a:[{text:`I don't know`,explanation:`Mệnh đề chính đúng. Cách dùng phù hợp trong câu này là “does he live”.`,correct:!1},{text:`where`,explanation:`Từ để hỏi trong câu gián tiếp đúng.`,correct:!1},{text:`does he live`,correct:!0,explanation:`Trong câu trần thuật/gián tiếp không được dùng cấu trúc câu hỏi (đảo ngữ).`},{text:`live`,explanation:`Động từ chính. Cách dùng phù hợp trong câu này là “does he live”.`,correct:!1}]},{q:`Identify the error: 'Although it was expensive, but I bought it.'`,a:[{text:`Although`,explanation:`Liên từ nhượng bộ đúng.`,correct:!1},{text:`expensive`,explanation:`Tính từ đúng. Cách dùng phù hợp trong câu này là “but”.`,correct:!1},{text:`but`,correct:!0,explanation:`Đã dùng 'Although' thì không dùng 'but' trong cùng một câu ghép.`},{text:`bought`,explanation:`Thì quá khứ đúng. Cách dùng phù hợp trong câu này là “but”.`,correct:!1}]},{q:`Identify the error: 'If I was a bird, I would fly everywhere.'`,a:[{text:`If`,explanation:`Liên từ điều kiện đúng.`,correct:!1},{text:`was`,correct:!0,explanation:`Câu điều kiện loại 2 (giả định) dùng 'were' cho mọi ngôi.`},{text:`a bird`,explanation:`Danh từ đúng. Cách dùng phù hợp trong câu này là “was”.`,correct:!1},{text:`would fly`,explanation:`Cấu trúc vế chính loại 2 đúng.`,correct:!1}]},{q:`Identify the error: 'He is very clever, therefore he gets high marks.'`,a:[{text:`very clever`,explanation:`Tính từ bổ nghĩa đúng.`,correct:!1},{text:`therefore`,correct:!0,explanation:`'Therefore' là trạng từ liên kết, cần dấu chấm phẩy hoặc chấm câu trước nó.`},{text:`gets`,explanation:`Thì hiện tại đơn đúng.`,correct:!1},{text:`high marks`,explanation:`Cụm danh từ đúng. Cách dùng phù hợp trong câu này là “therefore”.`,correct:!1}]},{q:`Identify the error: 'The news are very shocking to everyone.'`,a:[{text:`The news`,explanation:`Chủ ngữ đúng. Cách dùng phù hợp trong câu này là “are”.`,correct:!1},{text:`are`,correct:!0,explanation:`'News' là danh từ không đếm được, phải dùng 'is'.`},{text:`shocking`,explanation:`Tính từ đuôi -ing chỉ tính chất đúng.`,correct:!1},{text:`everyone`,explanation:`Đại từ bất định đúng.`,correct:!1}]},{q:`Identify the error: 'I haven't seen him since three years.'`,a:[{text:`haven't seen`,explanation:`Thì hiện tại hoàn thành đúng.`,correct:!1},{text:`him`,explanation:`Tân ngữ đúng. Cách dùng phù hợp trong câu này là “since”.`,correct:!1},{text:`since`,correct:!0,explanation:`Phải dùng 'for' cho khoảng thời gian ('three years').`},{text:`three years`,explanation:`Khoảng thời gian đúng.`,correct:!1}]},{q:`Identify the error: 'I prefer playing football than watching it.'`,a:[{text:`prefer`,explanation:`Động từ chính đúng. Cách dùng phù hợp trong câu này là “than”.`,correct:!1},{text:`playing`,explanation:`V-ing sau 'prefer' đúng.`,correct:!1},{text:`than`,correct:!0,explanation:`Cấu trúc 'Prefer V-ing to V-ing', phải thay 'than' bằng 'to'.`},{text:`watching`,explanation:`V-ing song hành đúng.`,correct:!1}]},{q:`Choose the version with inversion after 'Not only' and an explicit subject in the second coordinated clause.`,a:[{text:`Not only she is smart, but also kind.`,explanation:`Thiếu đảo ngữ ở vế đầu.`,correct:!1},{text:`Not only is she smart, but she is also kind.`,correct:!0,explanation:`Đúng cấu trúc đảo ngữ và sự tương xứng giữa hai vế.`},{text:`Not only is she smart, but also kind.`,explanation:`Thiếu sự tương xứng về từ loại/chủ ngữ ở vế sau.`,correct:!1},{text:`She is not only smart but also she is kind.`,explanation:`Không đáp ứng yêu cầu đảo ngữ sau 'Not only'; dạng được yêu cầu là 'Not only is ... , but ...'.`,correct:!1}]},{q:`Choose the correct version: 'I didn't study hard. Therefore, I failed.'`,a:[{text:`I didn't study hard; therefore, I failed.`,correct:!0,explanation:`Cách dùng dấu chấm phẩy và phẩy với trạng từ liên kết đúng nhất.`},{text:`I didn't study hard therefore I failed.`,explanation:`Thiếu dấu câu ngăn cách.`,correct:!1},{text:`I didn't study hard, therefore I failed.`,explanation:`Lỗi Comma Splice (dùng dấu phẩy nối 2 câu độc lập).`,correct:!1},{text:`Therefore I failed, I didn't study hard.`,explanation:`Sai logic nguyên nhân - kết quả.`,correct:!1}]},{q:`Rewrite the present-unreal conditional without changing its meaning: 'If he had more money, he would buy a car.'`,a:[{text:`Had he had more money, he would buy a car.`,explanation:`Dạng 'had had' chuyển sang conditional khác và không giữ nghĩa giả định hiện tại của câu gốc.`,correct:!1},{text:`Were he have more money, he would buy a car.`,explanation:`Sai cấu trúc đảo ngữ loại 2 (phải là Were he to have).`,correct:!1},{text:`Were he to have more money, he would buy a car.`,correct:!0,explanation:`Đúng cấu trúc đảo ngữ câu điều kiện loại 2 với động từ thường.`},{text:`If he has more money, he would buy a car.`,explanation:`Sai sự phối hợp thì giữa 2 vế.`,correct:!1}]},{q:`Choose the academic version that uses an impersonal hedge ('It is often argued'), the modal 'may', and the formal noun phrase 'negative effects on children'.`,a:[{text:`I think that technology is bad for kids.`,explanation:`Văn phong cá nhân 'I think' không phù hợp học thuật.`,correct:!1},{text:`Technology is bad for kids, I believe.`,explanation:`Không đáp ứng đồng thời ba yêu cầu hình thức: mở đầu vô nhân xưng, dùng 'may' và cụm danh từ học thuật đã nêu.`,correct:!1},{text:`It is often argued that technology may have negative effects on children.`,correct:!0,explanation:`Văn phong học thuật, khách quan, dùng từ chính xác.`},{text:`Technology is really bad for children.`,explanation:`Không dùng hedge 'may' và không diễn đạt vô nhân xưng theo đúng tiêu chí của stem.`,correct:!1}]},{q:`Choose the correct version: 'Because of his illness, he couldn't attend.'`,a:[{text:`Because he was ill, so he couldn't attend.`,explanation:`Lỗi dùng cả 'Because' và 'so'.`,correct:!1},{text:`He was ill, therefore, he couldn't attend.`,explanation:`Lỗi dùng dấu phẩy sai trước 'therefore'.`,correct:!1},{text:`Owing to the fact that he was ill, he couldn't attend.`,correct:!0,explanation:`Đúng cấu trúc học thuật.`},{text:`Due to he was ill, he couldn't attend.`,explanation:`'Due to' không đi trực tiếp với mệnh đề.`,correct:!1}]},{q:`Choose the correct version: 'No sooner had she left than it started to rain.'`,a:[{text:`No sooner she had left than it started to rain.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “No sooner had she left than it started to rain.”.`,correct:!1},{text:`No sooner had she left when it started to rain.`,explanation:`Sai cặp liên từ (No sooner đi với than).`,correct:!1},{text:`No sooner had she left than it started to rain.`,correct:!0,explanation:`Đúng cấu trúc đảo ngữ 'No sooner... than'.`},{text:`Hardly had she left than it started to rain.`,explanation:`Sai cặp liên từ (Hardly đi với when).`,correct:!1}]},{q:`Choose the correct version: 'This is the school where I studied.'`,a:[{text:`This is the school which I studied.`,explanation:`Thiếu giới từ 'in' sau 'studied' hoặc dùng 'where'.`,correct:!1},{text:`This is the school in that I studied.`,explanation:`Không dùng giới từ trước 'that'.`,correct:!1},{text:`This is the school in which I studied.`,correct:!0,explanation:`Đúng cấu trúc 'giới từ + which'.`},{text:`This is the school where I studied in.`,explanation:`Dư thừa giới từ 'in' khi đã dùng 'where'.`,correct:!1}]},{q:`Choose the correct version: 'I will call you as soon as I will arrive.'`,a:[{text:`I will call you when I will arrive.`,explanation:`Sai thì trong mệnh đề thời gian.`,correct:!1},{text:`I will call you as soon as I arrive.`,correct:!0,explanation:`Trong mệnh đề thời gian tương lai, dùng thì hiện tại đơn.`},{text:`I call you as soon as I will arrive.`,explanation:`Sai. Phương án 'I call you as soon as I will arrive.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`I will call you after I arrived.`,explanation:`Sai. Phương án 'I will call you after I arrived.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`Choose the correct version: 'The boy playing with the dog is my brother.'`,a:[{text:`The boy who playing with the dog is my brother.`,explanation:`Thiếu động từ to-be trong mệnh đề quan hệ.`,correct:!1},{text:`The boy plays with the dog is my brother.`,explanation:`Hai động từ chính trong một câu đơn mà không có từ nối.`,correct:!1},{text:`The boy who is playing with the dog is my brother.`,correct:!0,explanation:`Đầy đủ mệnh đề quan hệ.`},{text:`The boy played with the dog is my brother.`,explanation:`Dùng phân từ hai sai nghĩa chủ động.`,correct:!1}]},{q:`Rewrite the recommendation without changing its meaning, using a gerund after 'suggest': 'He suggested that we should go early.'`,a:[{text:`He suggested us to go early.`,explanation:`'Suggest' không đi với 'O + to V'.`,correct:!1},{text:`He suggested we going early.`,explanation:`Sai. Phương án 'He suggested we going early.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`He suggested going early.`,correct:!0,explanation:`Cấu trúc 'suggest + V-ing' đúng.`},{text:`He suggested that we went early.`,explanation:`Sau 'suggest that' dùng nguyên mẫu hoặc 'should'.`,correct:!1}]},{q:`Choose the version that uses the past-subjunctive form after 'It's time': 'It's time we went home.'`,a:[{text:`It's time we go home.`,explanation:`Không đáp ứng yêu cầu dùng dạng quá khứ giả định 'went' sau 'It's time'.`,correct:!1},{text:`It's time for us go home.`,explanation:`Phải dùng 'for us to go'.`,correct:!1},{text:`It's time we went home.`,correct:!0,explanation:`Đúng: sau 'It's time + chủ ngữ' dùng dạng quá khứ giả định 'went' theo đúng yêu cầu của stem.`},{text:`It's time we have to go home.`,explanation:`Dùng từ thừa. Cách dùng phù hợp trong câu này là “It's time we went home.”.`,correct:!1}]},{q:`Choose the version that keeps the correlative structure and uses the adjective 'better' for the learning result: 'The more you study, the more you learn.'`,a:[{text:`More you study, more you learn.`,explanation:`Câu này đúng ngữ pháp, nhưng không đáp ứng yêu cầu dùng 'better' cho kết quả học tập; đồng thời cả hai vế của cấu trúc phải bắt đầu bằng 'the'.`,correct:!1},{text:`The more you study, the better you learn.`,correct:!0,explanation:`Đúng: giữ cấu trúc 'the more ..., the ...' và dùng tính từ so sánh 'better' theo đúng yêu cầu của stem.`},{text:`The most you study, the most you learn.`,explanation:`Sai. Phương án 'The most you study, the most you learn.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`The more you study, you learn more.`,explanation:`Thiếu mạo từ 'the' trước mệnh đề thứ hai của cấu trúc so sánh kép.`,correct:!1}]},{q:`Using standard backshift in reported questions, choose the version: 'She asked me where I was going.'`,a:[{text:`She asked me where was I going.`,explanation:`Lỗi đảo ngữ trong câu gián tiếp.`,correct:!1},{text:`She asked me where I am going.`,explanation:`Không dùng backshift chuẩn từ 'am' thành 'was' trong câu hỏi gián tiếp.`,correct:!1},{text:`She asked me where I was going.`,correct:!0,explanation:`Đúng quy tắc lùi thì và trật tự câu trần thuật trong câu gián tiếp.`},{text:`She asked where was I going.`,explanation:`Thiếu tân ngữ và lỗi đảo ngữ.`,correct:!1}]},{q:`Choose the version that uses plural agreement after 'none of + plural noun': 'None of the students ___ finished the test.'`,a:[{text:`None of the student has finished the test.`,explanation:`'None of' đi với danh từ số nhiều.`,correct:!1},{text:`None of the students have finished the test.`,correct:!0,explanation:`Đề yêu cầu rõ dạng hòa hợp số nhiều: 'None of the students have finished the test.'.`},{text:`No students has finished the test.`,explanation:`'No students' đi với động từ số nhiều.`,correct:!1},{text:`None students have finished the test.`,explanation:`Thiếu giới từ 'of'. Cách dùng phù hợp trong câu này là “None of the students have finished the test.”.`,correct:!1}]},{q:`Choose the correct version: 'Hardly had he arrived when the meeting started.'`,a:[{text:`Hardly he had arrived when the meeting started.`,explanation:`Thiếu đảo ngữ. Cách dùng phù hợp trong câu này là “Hardly had he arrived when the meeting started.”.`,correct:!1},{text:`Hardly had he arrived than the meeting started.`,explanation:`Sai liên từ (Hardly đi với when).`,correct:!1},{text:`Hardly had he arrived when the meeting started.`,correct:!0,explanation:`Đúng cấu trúc 'Hardly had + S + V3 when...'`},{text:`Scarcely had he arrived than the meeting started.`,explanation:`Sai liên từ (Scarcely đi với when).`,correct:!1}]},{q:`Choose the correct version: 'I'll lend you the book provided you return it.'`,a:[{text:`I'll lend you the book unless you return it.`,explanation:`Sai nghĩa ('unless' là trừ khi).`,correct:!1},{text:`I'll lend you the book provided that you return it.`,correct:!0,explanation:`Đúng cấu trúc điều kiện 'provided (that) + mệnh đề', tương đương với 'provided you return it'.`},{text:`I'll lend you the book in case you return it.`,explanation:`Sai nghĩa ('in case' là phòng khi).`,correct:!1},{text:`I'll lend you the book providing return it.`,explanation:`Thiếu liên từ 'that' sau 'providing'.`,correct:!1}]},{q:`Choose the correct version: 'Each of the members has a different opinion.'`,a:[{text:`Each of the members have a different opinion.`,explanation:`'Each of' đi với động từ số ít.`,correct:!1},{text:`Each of the members has a different opinion.`,correct:!0,explanation:`Đúng quy tắc sự hòa hợp chủ ngữ - động từ.`},{text:`Each members have a different opinion.`,explanation:`'Each' đi với danh từ số ít.`,correct:!1},{text:`Every of the members has a different opinion.`,explanation:`Không có cấu trúc 'Every of'.`,correct:!1}]},{q:`Choose the correct version: 'Not only did he lose his key, but he also lost his wallet.'`,a:[{text:`Not only he lost his key, but also his wallet.`,explanation:`Thiếu đảo ngữ vế đầu.`,correct:!1},{text:`Not only did he lose his key, but he also lost his wallet.`,correct:!0,explanation:`Đúng cấu trúc đảo ngữ và sự tương xứng.`},{text:`Not only did he lost his key, but also his wallet.`,explanation:`Sau 'did' phải là nguyên mẫu 'lose'.`,correct:!1},{text:`He not only did lose his key but also wallet.`,explanation:`Sai vị trí 'not only' và thiếu 'his'.`,correct:!1}]},{q:`Choose the correct version: 'She is the most talented student in our class.'`,a:[{text:`She is the more talented student in our class.`,explanation:`So sánh hơn dùng cho 2 đối tượng, ở đây là cả lớp.`,correct:!1},{text:`She is most talented student in our class.`,explanation:`Thiếu mạo từ 'the' trong so sánh nhất.`,correct:!1},{text:`She is the most talented student in our class.`,correct:!0,explanation:`Đúng cấu trúc so sánh nhất.`},{text:`She is the talentedest student in our class.`,explanation:`Sai quy tắc thêm đuôi (talented là tính từ dài).`,correct:!1}]},{q:`Choose the continuous equivalent of: 'I have worked here for five years.'`,a:[{text:`I am working here since five years.`,explanation:`Sai. Dấu hiệu 'for five years' không phù hợp với thì/cấu trúc của phương án 'I am working here since five years.'.`,correct:!1},{text:`I have worked here since five years.`,explanation:`Dùng 'since' với khoảng thời gian là sai.`,correct:!1},{text:`I have been working here for five years.`,correct:!0,explanation:`Thì hiện tại hoàn thành tiếp diễn nhấn mạnh quá trình, đúng ngữ pháp.`},{text:`I work here for five years.`,explanation:`Thì hiện tại đơn không dùng cho khoảng thời gian kéo dài từ quá khứ.`,correct:!1}]},{q:`Choose the correct version: 'The children, whose parents are teachers, are very polite.'`,a:[{text:`The children, who's parents are teachers, are very polite.`,explanation:`'Who's' là viết tắt của 'who is', sai sở hữu.`,correct:!1},{text:`The children, whose parents are teachers, are very polite.`,correct:!0,explanation:`Đúng đại từ quan hệ sở hữu 'whose'.`},{text:`The children, that parents are teachers, are very polite.`,explanation:`'That' không dùng cho sở hữu.`,correct:!1},{text:`The children, which parents are teachers, are very polite.`,explanation:`'Which' dùng cho vật.`,correct:!1}]},{q:`Choose the version that uses the past-hypothetical form after 'would rather + subject': 'I would rather you didn't smoke here.'`,a:[{text:`I would rather you don't smoke here.`,explanation:`Sau 'would rather + S' dùng quá khứ giả định.`,correct:!1},{text:`I would rather you not smoke here.`,explanation:`Không đáp ứng yêu cầu chọn dạng quá khứ giả định 'didn't smoke' sau 'would rather + subject'.`,correct:!1},{text:`I would rather you didn't smoke here.`,correct:!0,explanation:`Đúng: sau 'would rather + chủ ngữ' dùng dạng quá khứ giả định 'didn't smoke' theo đúng yêu cầu của stem.`},{text:`I'd rather you to not smoke here.`,explanation:`Không dùng 'to V' sau 'would rather + S'.`,correct:!1}]},{q:`In the following text, which sentence contains a logic error? '(1) Smoking is harmful to health. (2) Therefore, many people continue to smoke. (3) Governments should increase taxes on cigarettes.'`,a:[{text:`Sentence (1)`,explanation:`Câu này đúng thực tế.`,correct:!1},{text:`Sentence (2)`,correct:!0,explanation:`Chính xác! “Sentence (2)” là lựa chọn phù hợp. Nhận định được nêu trong câu hỏi là sai: liên từ 'Therefore' (vì thế), đúng ra phải dùng 'However' (tuy nhiên) vì vế sau tương phản vế trước.`},{text:`Sentence (3)`,explanation:`Câu này là đề xuất hợp lý.`,correct:!1},{text:`None of the above`,explanation:`Có lỗi ở câu 2. Cách dùng phù hợp trong câu này là “Sentence (2)”.`,correct:!1}]},{q:`Find the error in this paragraph: '(1) The internet provides a lot of information. (2) It is a useful tool for students. (3) On the other hand, it helps people stay connected.'`,a:[{text:`Sentence (1)`,explanation:`Câu này đúng. Cách dùng phù hợp trong câu này là “Sentence (3)”.`,correct:!1},{text:`Sentence (2)`,explanation:`Câu này bổ sung ý nghĩa đúng.`,correct:!1},{text:`Sentence (3)`,correct:!0,explanation:`Đúng vị trí lỗi: 'On the other hand' biểu thị tương phản, nhưng câu (3) bổ sung ý; dùng 'Moreover' sẽ phù hợp hơn.`},{text:`No error`,explanation:`Câu 3 dùng sai liên từ.`,correct:!1}]},{q:`Which sentence uses an inappropriate academic tone? '(1) Statistics show that poverty is declining. (2) This suggests that economic policies are working. (3) But it's still a really big mess in some areas.'`,a:[{text:`Sentence (1)`,explanation:`Câu này học thuật. Cách dùng phù hợp trong câu này là “Sentence (3)”.`,correct:!1},{text:`Sentence (2)`,explanation:`Câu này nhận xét khách quan.`,correct:!1},{text:`Sentence (3)`,correct:!0,explanation:`Dùng từ 'really big mess' và 'But' đứng đầu câu là văn phong suồng sã, không học thuật.`},{text:`Sentence (1) and (2)`,explanation:`Hai câu này đều đúng phong cách học thuật.`,correct:!1}]},{q:`Identify the grammar error: '(1) Only after finishing his homework he could go out. (2) He felt relieved. (3) His mother was happy too.'`,a:[{text:`Sentence (1)`,correct:!0,explanation:`Lỗi đảo ngữ sau 'Only after'. Phải là 'could he go out'.`},{text:`Sentence (2)`,explanation:`Chưa đúng khi chọn “Sentence (2)”. Đúng. 'He felt relieved' là câu hoàn chỉnh và dùng thì phù hợp với ngữ cảnh.`,correct:!1},{text:`Sentence (3)`,explanation:`Chưa đúng khi chọn “Sentence (3)”. Đúng. 'His mother was happy too' diễn đạt rõ chủ ngữ, động từ và trạng từ 'too'.`,correct:!1},{text:`Sentence (2) and (3)`,explanation:`Hai câu này không có lỗi.`,correct:!1}]},{q:`Which sentence contains a redundancy error? '(1) Global warming is a serious issue. (2) We must cooperate together to solve it. (3) Action is needed immediately.'`,a:[{text:`Sentence (1)`,explanation:`Chưa đúng khi chọn “Sentence (1)”. Đúng. 'Global warming is a serious issue' không có lỗi lặp hoặc dùng từ thừa.`,correct:!1},{text:`Sentence (2)`,correct:!0,explanation:`Lỗi lặp ý: 'cooperate' đã mang nghĩa là làm việc 'together'.`},{text:`Sentence (3)`,explanation:`Chưa đúng khi chọn “Sentence (3)”. Đúng. 'Action is needed immediately' là câu ngắn gọn và không lặp ý với câu 2.`,correct:!1},{text:`No error`,explanation:`Có lỗi ở câu 2. Cách dùng phù hợp trong câu này là “Sentence (2)”.`,correct:!1}]},{q:`Find the error in clause structure: '(1) The house which they live is very old. (2) It was built in 1920. (3) They love its historical value.'`,a:[{text:`Sentence (1)`,correct:!0,explanation:`Thiếu giới từ 'in' sau 'live' hoặc phải dùng 'where'/'in which'.`},{text:`Sentence (2)`,explanation:`Cấu trúc bị động đúng.`,correct:!1},{text:`Sentence (3)`,explanation:`Câu này đúng. Cách dùng phù hợp trong câu này là “Sentence (1)”.`,correct:!1},{text:`None of the sentences`,explanation:`Câu 1 sai mệnh đề quan hệ.`,correct:!1}]},{q:`Which sentence is misplaced or illogical? '(1) First, add water to the pot. (2) Second, boil the water. (3) Finally, turn on the stove.'`,a:[{text:`Sentence (1)`,explanation:`Bước đầu tiên đúng. Cách dùng phù hợp trong câu này là “Sentence (3)”.`,correct:!1},{text:`Sentence (2)`,explanation:`Bước thứ hai đúng. Cách dùng phù hợp trong câu này là “Sentence (3)”.`,correct:!1},{text:`Sentence (3)`,correct:!0,explanation:`Chính xác! “Sentence (3)” là lựa chọn phù hợp. Nhận định được nêu trong câu hỏi là sai: trình tự logic. Phải bật bếp trước khi đun sôi nước.`},{text:`No error`,explanation:`Quy trình bị ngược ở bước cuối.`,correct:!1}]},{q:`Identify the error: '(1) Studying abroad is expensive. (2) For instance, tuition fees are high. (3) Nevertheless, living costs are also a burden.'`,a:[{text:`Sentence (1)`,explanation:`Câu chủ đề đúng. Cách dùng phù hợp trong câu này là “Sentence (3)”.`,correct:!1},{text:`Sentence (2)`,explanation:`Ví dụ minh họa đúng.`,correct:!1},{text:`Sentence (3)`,correct:!0,explanation:`Chính xác! “Sentence (3)” là lựa chọn phù hợp. Nhận định được nêu trong câu hỏi là sai: liên từ 'Nevertheless' (Tuy nhiên). Vế này bổ sung thêm khó khăn nên phải dùng 'Furthermore'.`},{text:`Sentence (1) and (2)`,explanation:`Hai câu này đúng. Cách dùng phù hợp trong câu này là “Sentence (3)”.`,correct:!1}]},{q:`Find the error: '(1) He is very busy. (2) He can't come to the party. (3) If he were free, he will come.'`,a:[{text:`Sentence (1)`,explanation:`Chưa đúng khi chọn “Sentence (1)”. Đúng. 'He is very busy' là câu hiện tại đơn đúng ngữ pháp.`,correct:!1},{text:`Sentence (2)`,explanation:`Chưa đúng khi chọn “Sentence (2)”. Đúng. 'He can't come to the party' dùng modal 'can't' đúng với chủ ngữ 'He'.`,correct:!1},{text:`Sentence (3)`,correct:!0,explanation:`Đúng vị trí lỗi: câu điều kiện loại 2 dùng 'If he were free, he would come', không dùng 'will come'.`},{text:`No error`,explanation:`Câu 3 sai ngữ pháp. Cách dùng phù hợp trong câu này là “Sentence (3)”.`,correct:!1}]},{q:`Which sentence contains an error in subject-verb agreement? '(1) The collection of books is rare. (2) Each book have a unique cover. (3) Collectors value them highly.'`,a:[{text:`Sentence (1)`,explanation:`Động từ 'is' chia theo 'collection' là đúng.`,correct:!1},{text:`Sentence (2)`,correct:!0,explanation:`'Each book' phải đi với động từ số ít 'has'.`},{text:`Sentence (3)`,explanation:`Chủ ngữ số nhiều đi với động từ nguyên mẫu đúng.`,correct:!1},{text:`All sentences are correct`,explanation:`Câu 2 sai ngữ pháp. Cách dùng phù hợp trong câu này là “Sentence (2)”.`,correct:!1}]},{q:`Find the word use error: '(1) The effect of the storm was devastating. (2) It affected many families. (3) The government's affect was too slow.'`,a:[{text:`Sentence (1)`,explanation:`'Effect' là danh từ đúng.`,correct:!1},{text:`Sentence (2)`,explanation:`'Affected' là động từ đúng.`,correct:!1},{text:`Sentence (3)`,correct:!0,explanation:`Chính xác! “Sentence (3)” là lựa chọn phù hợp. Nhận định được nêu trong câu hỏi là sai: từ loại. Phải dùng danh từ 'reaction' hoặc 'response' thay vì 'affect' (thường là động từ).`},{text:`No error`,explanation:`Câu 3 dùng từ không phù hợp.`,correct:!1}]},{q:`Identify the error: '(1) She doesn't like spicy food. (2) Neither her brother does. (3) They prefer mild dishes.'`,a:[{text:`Sentence (1)`,explanation:`Câu phủ định đúng. Cách dùng phù hợp trong câu này là “Sentence (2)”.`,correct:!1},{text:`Sentence (2)`,correct:!0,explanation:`Lỗi đảo ngữ với 'Neither'. Phải là 'Neither does her brother'.`},{text:`Sentence (3)`,explanation:`Động từ 'prefer' đúng.`,correct:!1},{text:`No error`,explanation:`Câu 2 sai cấu trúc. Cách dùng phù hợp trong câu này là “Sentence (2)”.`,correct:!1}]},{q:`Which sentence has a punctuation error that changes the meaning? '(1) Let's eat, Grandpa! (2) Let's eat Grandpa! (3) We love him very much.'`,a:[{text:`Sentence (1)`,explanation:`Chưa đúng khi chọn “Sentence (1)”. Đúng ngữ pháp (gọi ông đi ăn).`,correct:!1},{text:`Sentence (2)`,correct:!0,explanation:`Thiếu dấu phẩy làm câu mang nghĩa kinh dị (ăn thịt ông).`},{text:`Sentence (3)`,explanation:`Câu này đúng. Cách dùng phù hợp trong câu này là “Sentence (2)”.`,correct:!1},{text:`None of the above`,explanation:`Câu 2 sai dấu phẩy trầm trọng.`,correct:!1}]},{q:`Find the error: '(1) I have two sister-in-laws. (2) They are both very kind. (3) We often visit each other.'`,a:[{text:`Sentence (1)`,correct:!0,explanation:`Danh từ ghép số nhiều phải thêm 's' vào từ chính: 'sisters-in-law'.`},{text:`Sentence (2)`,explanation:`Chưa đúng khi chọn “Sentence (2)”. Đúng. 'They are both very kind' hòa hợp chủ ngữ số nhiều với 'are'.`,correct:!1},{text:`Sentence (3)`,explanation:`Chưa đúng khi chọn “Sentence (3)”. Đúng. 'We often visit each other' dùng trạng từ tần suất và đại từ phản thân đúng.`,correct:!1},{text:`No error`,explanation:`Câu 1 sai cách lập số nhiều.`,correct:!1}]},{q:`Identify the error in academic style: '(1) The experiment was a success. (2) We got some cool results. (3) Further research is needed.'`,a:[{text:`Sentence (1)`,explanation:`Câu này ổn. Cách dùng phù hợp trong câu này là “Sentence (2)”.`,correct:!1},{text:`Sentence (2)`,correct:!0,explanation:`Từ 'cool' quá suồng sã, nên dùng 'significant' hoặc 'interesting'.`},{text:`Sentence (3)`,explanation:`Câu này chuẩn học thuật.`,correct:!1},{text:`All sentences are academic`,explanation:`Câu 2 dùng từ không phù hợp.`,correct:!1}]},{q:`Which sentence contains a misused conjunction? '(1) I studied hard. (2) Consequently, I passed the exam. (3) Although, I was very tired.'`,a:[{text:`Sentence (1)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (1)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Sentence (2)`,explanation:`Dùng 'Consequently' chỉ kết quả đúng.`,correct:!1},{text:`Sentence (3)`,correct:!0,explanation:`'Although' không đứng một mình với dấu phẩy như 'However'. Phải là 'However, I was very tired'.`},{text:`No error`,explanation:`Câu 3 sai cách dùng liên từ.`,correct:!1}]},{q:`Find the error: '(1) Not only did she lose her phone, but also her money. (2) She was very upset. (3) She called the police.'`,a:[{text:`Sentence (1)`,correct:!0,explanation:`Thiếu sự tương xứng. Nên là 'Not only did she lose her phone, but she also lost her money'.`},{text:`Sentence (2)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (2)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Sentence (3)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (3)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`No error`,explanation:`Câu 1 thiếu cấu trúc đầy đủ.`,correct:!1}]},{q:`Identify the error: '(1) My father is a doctor. (2) He works in a hospital. (3) He's the man whom works there.'`,a:[{text:`Sentence (1)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (1)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Sentence (2)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (2)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Sentence (3)`,correct:!0,explanation:`Phải dùng 'who' làm chủ ngữ cho động từ 'works', không dùng 'whom'.`},{text:`No error`,explanation:`Câu 3 sai đại từ quan hệ.`,correct:!1}]},{q:`Find the error: '(1) Information are very important. (2) We need to check the facts. (3) Always verify your sources.'`,a:[{text:`Sentence (1)`,correct:!0,explanation:`'Information' là danh từ không đếm được, dùng động từ số ít 'is'.`},{text:`Sentence (2)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (2)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Sentence (3)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (3)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`No error`,explanation:`Câu 1 sai sự hòa hợp chủ-vị.`,correct:!1}]},{q:`Identify the error: '(1) This is the best movie I've ever seen. (2) It's more better than the last one. (3) You should watch it.'`,a:[{text:`Sentence (1)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (1)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Sentence (2)`,correct:!0,explanation:`Lỗi dùng thừa 'more' trước tính từ so sánh hơn 'better'.`},{text:`Sentence (3)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (3)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`No error`,explanation:`Câu 2 sai so sánh. Cách dùng phù hợp trong câu này là “Sentence (2)”.`,correct:!1}]},{q:`Find the error: '(1) Because of the weather was bad, we stayed. (2) We watched TV all day. (3) It was boring.'`,a:[{text:`Sentence (1)`,correct:!0,explanation:`'Because of' đi với danh từ, ở đây có mệnh đề nên dùng 'Because'.`},{text:`Sentence (2)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (2)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Sentence (3)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (3)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`No error`,explanation:`Câu 1 sai liên từ. Cách dùng phù hợp trong câu này là “Sentence (1)”.`,correct:!1}]},{q:`Identify the error: '(1) Neither the blue one nor the red ones fits. (2) I need a bigger size. (3) Can you help me?'`,a:[{text:`Sentence (1)`,correct:!0,explanation:`Chủ ngữ gần nhất là 'the red ones' (số nhiều) nên động từ phải là 'fit'.`},{text:`Sentence (2)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (2)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Sentence (3)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (3)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`No error`,explanation:`Câu 1 sai chia động từ.`,correct:!1}]},{q:`Which sentence is unnecessary? '(1) To bake a cake, you need flour. (2) You also need sugar and eggs. (3) Eggs come from chickens. (4) Mix them all together.'`,a:[{text:`Sentence (1)`,explanation:`Câu giới thiệu đúng.`,correct:!1},{text:`Sentence (2)`,explanation:`Liệt kê nguyên liệu đúng.`,correct:!1},{text:`Sentence (3)`,correct:!0,explanation:`Câu này lạc đề, không liên quan đến quy trình nướng bánh.`},{text:`Sentence (4)`,explanation:`Bước tiếp theo đúng.`,correct:!1}]},{q:`Find the error: '(1) The news that he failed shocked us. (2) However, he didn't give up. (3) He's a very courage man.'`,a:[{text:`Sentence (1)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (1)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Sentence (2)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (2)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Sentence (3)`,correct:!0,explanation:`Đúng vị trí lỗi: 'courage' là danh từ; trước 'man' cần tính từ 'courageous'.`},{text:`No error`,explanation:`Câu 3 sai từ loại. Cách dùng phù hợp trong câu này là “Sentence (3)”.`,correct:!1}]},{q:`Identify the error: '(1) No sooner I had finished my work than she called. (2) I was surprised. (3) We talked for an hour.'`,a:[{text:`Sentence (1)`,correct:!0,explanation:`Thiếu đảo ngữ. Phải là 'No sooner had I finished'.`},{text:`Sentence (2)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (2)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Sentence (3)`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sentence (3)' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`No error`,explanation:`Câu 1 sai cấu trúc đảo ngữ.`,correct:!1}]},{q:`How should you correct: 'He is strong, but he is also weak.' (Logic error)`,a:[{text:`He is strong, and he is also weak.`,explanation:`Vẫn mâu thuẫn logic.`,correct:!1},{text:`Although he looks strong, he is actually quite weak.`,correct:!0,explanation:`Sửa lại logic rõ ràng, thể hiện sự nhượng bộ/tương phản hợp lý.`},{text:`He is strong but weak.`,explanation:`Quá ngắn gọn, không giải quyết được mâu thuẫn.`,correct:!1},{text:`He is strong because he is weak.`,explanation:`Quan hệ nguyên nhân vẫn mâu thuẫn và không sửa được lỗi logic.`,correct:!1}]},{q:`What is the best way to fix: 'I like apples. Because they are healthy.'`,a:[{text:`I like apples, because they are healthy.`,explanation:`Không cần dấu phẩy trước mệnh đề nguyên nhân thiết yếu này.`,correct:!1},{text:`I like apples because they are healthy.`,correct:!0,explanation:`Nối mệnh đề chính và mệnh đề nguyên nhân, không dùng dấu phẩy trong câu này.`},{text:`Because they are healthy. I like apples.`,explanation:`Vẫn bị lỗi câu phân mảnh.`,correct:!1},{text:`I like apples; because they are healthy.`,explanation:`Không dùng dấu chấm phẩy trước 'because'.`,correct:!1}]},{q:`Correct this for academic style: 'You can see that the results are good.'`,a:[{text:`I can see that the results are good.`,explanation:`Vẫn dùng ngôi thứ nhất.`,correct:!1},{text:`The results can be seen to be good.`,explanation:`Cấu trúc hơi gượng ép.`,correct:!1},{text:`The results indicate a significant improvement.`,correct:!0,explanation:`Sử dụng từ vựng mạnh ('indicate', 'significant') và khách quan.`},{text:`We see good results here.`,explanation:`Văn phong quá đơn giản.`,correct:!1}]},{q:`Correct the sentence while preserving the emphatic inversion with 'Hardly': 'Hardly the sun had risen when they started.'`,a:[{text:`Hardly had the sun risen when they started.`,correct:!0,explanation:`Đảo ngữ chính xác cho 'Hardly'.`},{text:`Hardly the sun rose when they started.`,explanation:`Thiếu đảo ngữ và sai thì.`,correct:!1},{text:`Hardly had the sun rose when they started.`,explanation:`Sau 'had' phải dùng P2 ('risen').`,correct:!1},{text:`When the sun had risen, they started.`,explanation:`Không bảo toàn cấu trúc nhấn mạnh với 'Hardly' theo yêu cầu của stem.`,correct:!1}]},{q:`Rewrite the sentence in one concise clause using 'because' and without the redundant noun phrase 'the reason': 'The reason why he is late is because he missed the bus.'`,a:[{text:`He is late because he missed the bus.`,correct:!0,explanation:`Ngắn gọn, loại bỏ cụm 'The reason why... is because' bị lặp nghĩa.`},{text:`The reason why he is late is that he missed the bus.`,explanation:`Sai theo yêu cầu hình thức: câu vẫn giữ cụm danh từ 'the reason', trong khi đề yêu cầu một mệnh đề ngắn dùng 'because' và bỏ cụm này.`,correct:!1},{text:`Reason he is late is missing the bus.`,explanation:`Sai cấu trúc. Phương án 'Reason he is late is missing the bus.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`Because he missed the bus, that is the reason why he is late.`,explanation:`Lặp ý rất nặng. Cách dùng phù hợp trong câu này là “He is late because he missed the bus.”.`,correct:!1}]},{q:`How to correct this dangling modifier: 'Walking down the street, the trees were beautiful.'`,a:[{text:`Walking down the street, I saw the beautiful trees.`,correct:!0,explanation:`Lỗi chủ ngữ: Cây không biết đi bộ, phải thêm chủ ngữ 'I' vào.`},{text:`While walking down the street, the trees were beautiful.`,explanation:`Vẫn bị lỗi chủ ngữ không khớp.`,correct:!1},{text:`The trees were beautiful walking down the street.`,explanation:`Nghĩa là cái cây đang đi bộ.`,correct:!1},{text:`As the street was walked down, the trees were beau
