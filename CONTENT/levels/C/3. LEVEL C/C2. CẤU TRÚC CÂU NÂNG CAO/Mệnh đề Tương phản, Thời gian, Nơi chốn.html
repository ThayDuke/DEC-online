const fullQuestionBank=[{q:`___ the weather was very cold, we went swimming in the sea.`,a:[{text:`Although`,correct:!0,explanation:`Dùng 'Although' trước một mệnh đề (S+V) để chỉ sự tương phản.`},{text:`Despite`,explanation:`Sai. 'Despite' đi với danh từ hoặc V-ing.`,correct:!1},{text:`Because`,explanation:`Sai: cái lạnh là hoàn cảnh tương phản với việc đi bơi, không phải nguyên nhân của hành động này.`,correct:!1},{text:`However`,explanation:`Sai cấu trúc ngữ pháp ở vị trí này.`,correct:!1}]},{q:`I enjoyed the film ___ the ending was very sad.`,a:[{text:`even though`,correct:!0,explanation:`'Even though' dùng để kết nối hai mệnh đề tương phản.`},{text:`because`,explanation:`Sai: đoạn ending was very sad đối lập với việc thích phim, không giải thích lý do thích phim.`,correct:!1},{text:`despite`,explanation:`Sai. Phương án 'despite' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`however`,explanation:`'However' là trạng từ nối; muốn dùng phải có dấu câu phù hợp, không điền trực tiếp vào vị trí liên từ trước mệnh đề này.`,correct:!1}]},{q:`___ having a broken leg, he still tried to finish the race.`,a:[{text:`Despite`,correct:!0,explanation:`'Despite' đi với cụm danh từ hoặc V-ing.`},{text:`However`,explanation:`Sai: 'However' là trạng từ nối, không mở mệnh đề ở vị trí này.`,correct:!1},{text:`Nevertheless`,explanation:`Sai: 'Nevertheless' là trạng từ nối, không đứng trước cụm V-ing ở vị trí này.`,correct:!1},{text:`In spite`,explanation:`Thiếu 'of'. Cách dùng phù hợp trong câu này là “Despite”.`,correct:!1}]},{q:`She went to school ___ she had a high fever.`,a:[{text:`though`,correct:!0,explanation:`'Though' nối hai mệnh đề chỉ sự nhượng bộ/tương phản.`},{text:`in spite of`,explanation:`Sai: in spite of phải có of viết liền trong cụm; đáp án này không khớp mẫu liên từ cần điền.`,correct:!1},{text:`because of`,explanation:`Sai. Từ vựng hoặc dạng từ 'because of' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`nevertheless`,explanation:`'Nevertheless' là trạng từ nối; không thể đứng trực tiếp giữa hai mệnh đề ở vị trí này như một liên từ.`,correct:!1}]},{q:`The cake was delicious. ___, I couldn't eat any more.`,a:[{text:`However`,correct:!0,explanation:`'However' thường đứng đầu câu và ngăn cách bằng dấu phẩy để chỉ sự tương phản với câu trước.`},{text:`Despite`,explanation:`'Despite' phải đi với danh từ hoặc V-ing; không thể đứng một mình ở đầu câu này.`,correct:!1},{text:`Although`,explanation:`Sai: Although không đứng sau dấu chấm để nối câu độc lập theo vị trí này; cần trạng từ However.`,correct:!1},{text:`Because`,explanation:`Sai: bánh ngon không phải lý do khiến người nói không thể ăn thêm; ý sau dấu chấm là tương phản.`,correct:!1}]},{q:`___ her poverty, she always helps other people.`,a:[{text:`In spite of`,correct:!0,explanation:`'In spite of' đi với cụm danh từ.`},{text:`Although`,explanation:`Sai: sau Although cần một mệnh đề, còn her poverty chỉ là cụm danh từ.`,correct:!1},{text:`Even though`,explanation:`Sai: Even though cũng cần mệnh đề đầy đủ; vị trí này chỉ nhận cụm danh từ her poverty.`,correct:!1},{text:`However`,explanation:`Sai: However là trạng từ nối hai mệnh đề độc lập, không đi trước cụm danh từ her poverty.`,correct:!1}]},{q:`I stayed up late ___ I was very tired.`,a:[{text:`even though`,correct:!0,explanation:`Dùng để nhấn mạnh sự tương phản giữa hai hành động.`},{text:`because`,explanation:`Sai: mệt thường không giải thích việc thức khuya trong câu này; cấu trúc nhấn mạnh kết quả trái dự đoán.`,correct:!1},{text:`despite`,explanation:`Sai: despite không đứng trước mệnh đề I was very tired; nó phải đi với danh từ hoặc V-ing.`,correct:!1},{text:`so`,explanation:`Sai: so diễn tả kết quả, nhưng thức khuya không được trình bày như kết quả của việc mệt.`,correct:!1}]},{q:`___ he is a famous singer, he is very humble.`,a:[{text:`Although`,correct:!0,explanation:`'Although' đứng trước mệnh đề đầy đủ 'he is a famous singer'.`},{text:`Despite`,explanation:`Sai: Despite cần his fame hoặc being famous, không nhận mệnh đề he is a famous singer.`,correct:!1},{text:`But`,explanation:`Sai: But không mở trực tiếp mệnh đề ở vị trí đầu câu theo mẫu này; Although mới phù hợp.`,correct:!1},{text:`However`,explanation:`Sai: However là trạng từ liên kết và cần dấu câu riêng, không thay cho liên từ Although.`,correct:!1}]},{q:`We lost the football match ___ we played extremely well.`,a:[{text:`although`,correct:!0,explanation:`Nối hai mệnh đề tương phản.`},{text:`because`,explanation:`Sai: chơi tốt không giải thích việc thua trận; hai ý được đặt ở quan hệ tương phản.`,correct:!1},{text:`therefore`,explanation:`'Therefore' chỉ kết quả, trái với quan hệ tương phản giữa việc thua trận và chơi tốt.`,correct:!1},{text:`despite`,explanation:`Sai: despite không đi trước mệnh đề we played extremely well; dùng although/even though.`,correct:!1}]},{q:`The restaurant was expensive, so I expected excellent food. ___, the food was terrible, contrary to what I expected for the price.`,a:[{text:`Moreover`,explanation:`Sai. Phương án 'Moreover' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`However`,correct:!0,explanation:`'However' báo hiệu kết quả trái với kỳ vọng vừa nêu: nhà hàng đắt nhưng món ăn lại tệ.`},{text:`Because`,explanation:`Sai: Because không mở được câu mới sau dấu chấm và cũng không diễn tả sự trái ngược với giá tiền.`,correct:!1},{text:`So`,explanation:`Sai: So tiếp tục quan hệ nguyên nhân–kết quả, trái với việc đồ ăn tệ dù nhà hàng đắt.`,correct:!1}]},{q:`I will call you ___ I arrive at the airport.`,a:[{text:`as soon as`,correct:!0,explanation:`'As soon as' diễn tả một hành động xảy ra ngay sau một hành động khác.`},{text:`until`,explanation:`Sai: cuộc gọi xảy ra tại thời điểm đến sân bay, nên cần as soon as/when chứ không phải kéo dài đến đó.`,correct:!1},{text:`while`,explanation:`Sai: arrive là mốc tức thời; while không phù hợp với một thời điểm đến cụ thể.`,correct:!1},{text:`before`,explanation:`Không hợp logic. Cách dùng phù hợp trong câu này là “as soon as”.`,correct:!1}]},{q:`Please remain here continuously and do not leave ___ the rain stops.`,a:[{text:`until`,correct:!0,explanation:`'Until' (cho đến khi) dùng để chỉ mốc thời gian kết thúc hành động.`},{text:`when`,explanation:`Sai. 'When' chỉ thời điểm xảy ra, còn câu yêu cầu ở lại liên tục và không rời đi cho đến mốc kết thúc nên phải dùng 'until'.`,correct:!1},{text:`before`,explanation:`Sai: before sẽ cho phép rời đi trước khi mưa tạnh, trái với remain here continuously.`,correct:!1},{text:`while`,explanation:`Sai: while diễn tả hai hành động đồng thời, còn remain here kéo dài đến khi mưa tạnh.`,correct:!1}]},{q:`I always brush my teeth ___ I go to bed.`,a:[{text:`before`,correct:!0,explanation:`Hành động đánh răng xảy ra 'trước khi' đi ngủ.`},{text:`after`,explanation:`Sai: đánh răng được thực hiện trước khi đi ngủ; after đảo ngược trình tự.`,correct:!1},{text:`while`,explanation:`Không thể làm hai việc cùng lúc.`,correct:!1},{text:`until`,explanation:`Sai: until không diễn tả một hành động chuẩn bị xảy ra trước mốc đi ngủ.`,correct:!1}]},{q:`___ I was walking home, I saw a beautiful rainbow.`,a:[{text:`While`,correct:!0,explanation:`'While' diễn tả một hành động đang diễn ra thì hành động khác xen vào.`},{text:`Before`,explanation:`Sai: cầu vồng được nhìn thấy trong lúc đang đi bộ, không phải trước khi bắt đầu đi bộ.`,correct:!1},{text:`After`,explanation:`Sai: hành động nhìn thấy cầu vồng không xảy ra sau khi đã đi bộ xong; nó diễn ra đồng thời.`,correct:!1},{text:`Until`,explanation:`Sai: Until diễn tả kéo dài đến một mốc, không nối được hành động đang xảy ra while I was walking.`,correct:!1}]},{q:`The students stood up at the moment ___ the teacher entered the classroom.`,a:[{text:`when`,correct:!0,explanation:`'When' diễn tả một hành động xảy ra liên tiếp hoặc cắt ngang.`},{text:`while`,explanation:`Hành động 'bước vào' là tức thời, không dùng while.`,correct:!1},{text:`before`,explanation:`Sai logic; học sinh đứng dậy khi giáo viên bước vào.`,correct:!1},{text:`until`,explanation:`Sai: uống thuốc là nguyên nhân trước khi thấy khỏe hơn; until không diễn tả mốc hoàn tất này.`,correct:!1}]},{q:`Don't leave ___ I come back.`,a:[{text:`until`,correct:!0,explanation:`Đừng đi 'cho tới khi' tôi quay lại.`},{text:`after`,explanation:`Sai: after sẽ bảo không rời đi sau khi tôi quay lại, trái với ý chờ đến lúc tôi về.`,correct:!1},{text:`when`,explanation:`Không phù hợp bằng until.`,correct:!1},{text:`while`,explanation:`Sai: while chỉ khoảng thời gian đồng thời, còn leave bị cấm cho đến mốc tôi quay lại.`,correct:!1}]},{q:`I felt much better ___ I took the medicine.`,a:[{text:`after`,correct:!0,explanation:`Cảm thấy tốt hơn 'sau khi' uống thuốc.`},{text:`before`,explanation:`Sai: cảm thấy khỏe hơn xảy ra sau khi uống thuốc, không phải trước đó.`,correct:!1},{text:`while`,explanation:`Uống thuốc là hành động ngắn.`,correct:!1},{text:`until`,explanation:`Sai: cảm thấy khỏe hơn là kết quả sau khi uống thuốc, không phải mốc kéo dài đến đó theo until.`,correct:!1}]},{q:`We will start the party ___ everyone arrives.`,a:[{text:`once`,correct:!0,explanation:`'Once' (một khi) dùng tương tự as soon as.`},{text:`while`,explanation:`Sai: bữa tiệc bắt đầu sau khi mọi người đến đủ, không diễn ra trong lúc họ còn đến.`,correct:!1},{text:`before`,explanation:`Sai: mọi người phải đến trước rồi bữa tiệc mới bắt đầu; before đảo trình tự.`,correct:!1},{text:`until`,explanation:`Phải là 'not... until'.`,correct:!1}]},{q:`I want to finish my homework first: I'll do it ___ I watch TV.`,a:[{text:`before`,correct:!0,explanation:`Làm bài tập 'trước khi' xem TV là thói quen tốt.`},{text:`while`,explanation:`Khó làm cả hai cùng lúc.`,correct:!1},{text:`until`,explanation:`Sai: câu đã nêu rõ làm bài trước rồi xem TV; until không biểu thị trình tự đó.`,correct:!1},{text:`as`,explanation:`Sai. Từ vựng hoặc dạng từ 'as' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Keep silent ___ the doctor is speaking.`,a:[{text:`while`,correct:!0,explanation:`'While' dùng cho hành động đang diễn ra (is speaking).`},{text:`before`,explanation:`Sai: im lặng phải duy trì trong lúc bác sĩ đang nói, không chỉ xảy ra trước thời điểm đó.`,correct:!1},{text:`after`,explanation:`Sai: giữ im lặng sau khi bác sĩ nói xong không đúng yêu cầu của câu, vốn nhấn mạnh thời gian đang nói.`,correct:!1},{text:`until`,explanation:`Sai: until yêu cầu một mốc kết thúc; ở đây hành động nói đang diễn ra nên dùng while.`,correct:!1}]},{q:`This is the hospital ___ I was born.`,a:[{text:`where`,correct:!0,explanation:`'Where' dùng để chỉ nơi chốn.`},{text:`when`,explanation:`Sai: hospital là nơi chốn; when chỉ thời điểm nên không thay cho where.`,correct:!1},{text:`which`,explanation:`Cần giới từ (in which).`,correct:!1},{text:`there`,explanation:`Sai. Phương án 'there' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`You can sit ___ you like; there are no restricted seats.`,a:[{text:`wherever`,correct:!0,explanation:`Đúng: wherever you like cho phép chọn bất kỳ chỗ ngồi nào.`},{text:`which`,explanation:`Sai. 'Which' không làm liên từ chỉ nơi chốn trước mệnh đề 'you like' trong cấu trúc này.`,correct:!1},{text:`when`,explanation:`Sai: người nói được tự do chọn chỗ ngồi, tức là địa điểm bất kỳ, không phải thời điểm bất kỳ.`,correct:!1},{text:`everywhere`,explanation:`Sai: everywhere là trạng từ, không nối trực tiếp với you like; wherever mới có mệnh đề theo sau.`,correct:!1}]},{q:`I will follow you to any place, ___ you go.`,a:[{text:`wherever`,correct:!0,explanation:`'Wherever' mang nghĩa bất kỳ nơi nào.`},{text:`anywhere`,explanation:`Không dùng làm liên từ trước mệnh đề 'you go'.`,correct:!1},{text:`whenever`,explanation:`Chỉ thời gian, không chỉ nơi chốn.`,correct:!1},{text:`there`,explanation:`Sai: there chỉ một địa điểm cụ thể, không thể theo sau dấu phẩy để mang nghĩa mọi nơi bạn đi.`,correct:!1}]},{q:`The village ___ my grandparents live is very peaceful.`,a:[{text:`where`,correct:!0,explanation:`Chỉ địa điểm ngôi làng.`},{text:`which`,explanation:`Sai: phải dùng in which hoặc where vì ông bà sống in the village.`,correct:!1},{text:`when`,explanation:`Sai: village là nơi chốn, không phải mốc thời gian để dùng when.`,correct:!1},{text:`there`,explanation:`Sai: there không làm đại từ quan hệ sau danh từ village; where mới nối mệnh đề.`,correct:!1}]},{q:`Put the books back ___ they belong.`,a:[{text:`where`,correct:!0,explanation:`Để sách lại chỗ mà chúng thuộc về.`},{text:`when`,explanation:`Sai: books belong ở một nơi, không phải vào một thời điểm; cần where.`,correct:!1},{text:`everywhere`,explanation:`Sai. Từ vựng hoặc dạng từ 'everywhere' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`why`,explanation:`Sai: 'why' hỏi nguyên nhân, không nối mệnh đề chỉ nơi chốn.`,correct:!1}]},{q:`Do you remember the park ___ we first met?`,a:[{text:`where`,correct:!0,explanation:`Chỉ địa điểm công viên.`},{text:`when`,explanation:`Sai: park là địa điểm hai người gặp, nên when (chỉ thời gian) không phù hợp.`,correct:!1},{text:`which`,explanation:`Sai: which cần giới từ in (the park in which...), còn câu đã có cấu trúc where hoàn chỉnh.`,correct:!1},{text:`that`,explanation:`Thường dùng cho vật.`,correct:!1}]},{q:`___ I look, I cannot find my keys.`,a:[{text:`Wherever`,correct:!0,explanation:`Mệnh đề nhượng bộ nơi chốn mang nghĩa 'dù tìm ở bất cứ đâu'.`},{text:`When`,explanation:`Sai: 'when' chỉ thời gian, còn câu hỏi nơi chốn cần 'wherever'.`,correct:!1},{text:`Because`,explanation:`Sai: 'because' chỉ nguyên nhân, không diễn tả nơi chốn.`,correct:!1},{text:`That`,explanation:`Sai: 'that' không thể nối mệnh đề nơi chốn trong mẫu này.`,correct:!1}]},{q:`There are many trees ___ I live.`,a:[{text:`where`,correct:!0,explanation:`Nơi mà tôi sống. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`which`,explanation:`Sai: trees là vật nhưng mệnh đề I live cần quan hệ nơi chốn where, không phải which.`,correct:!1},{text:`wherever`,explanation:`Không hợp ngữ cảnh. Cách dùng phù hợp trong câu này là “where”.`,correct:!1},{text:`when`,explanation:`Sai: I live trả lời câu hỏi ở đâu, không phải khi nào.`,correct:!1}]},{q:`Choose the word meaning 'bất cứ nơi nào': Go ___ you want, but don't forget to call me.`,a:[{text:`wherever`,correct:!0,explanation:`Đúng: wherever you want nghĩa là đi đến bất cứ nơi nào bạn muốn.`},{text:`somewhere`,explanation:`Không nối được với mệnh đề 'you want'.`,correct:!1},{text:`whenever`,explanation:`Sai: whenever nghĩa là bất cứ khi nào, còn go ___ you want yêu cầu địa điểm.`,correct:!1},{text:`what`,explanation:`'Go what you want' sai; 'what' không có nghĩa địa điểm trong mệnh đề này.`,correct:!1}]},{q:`Is this the street ___ the accident happened?`,a:[{text:`where`,correct:!0,explanation:`Chỉ địa điểm con đường.`},{text:`when`,explanation:`Sai. 'when' là đại từ quan hệ/trạng từ chỉ thời gian, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`which`,explanation:`Sai: street là nơi xảy ra tai nạn; dùng which ở đây phải có in/on, nên where mới phù hợp.`,correct:!1},{text:`what`,explanation:`Sai: what không làm trạng từ quan hệ chỉ địa điểm trong câu hỏi về street.`,correct:!1}]},{q:`___ the traffic was heavy, he arrived on time.`,a:[{text:`Although`,correct:!0,explanation:`Dù tắc đường nhưng vẫn đến đúng giờ (tương phản).`},{text:`So`,explanation:`Sai: 'so' không mở mệnh đề nhượng bộ trước dấu phẩy; câu cần 'Although'.`,correct:!1},{text:`However`,explanation:`Sai: However không mở trực tiếp mệnh đề trước dấu phẩy; vị trí này cần liên từ Although.`,correct:!1},{text:`Despite`,explanation:`Sai: Despite phải đi với heavy traffic (cụm danh từ), không đi trực tiếp với mệnh đề traffic was heavy.`,correct:!1}]},{q:`I will keep waiting for you and won't leave ___ it gets dark.`,a:[{text:`until`,correct:!0,explanation:`Đợi cho đến khi trời tối.`},{text:`while`,explanation:`Sai: while chỉ thời gian đồng thời, còn câu nhấn mạnh chờ kéo dài đến mốc trời tối.`,correct:!1},{text:`before`,explanation:`Sai: before would mean leaving happens earlier than darkness, trái với won't leave until it gets dark.`,correct:!1},{text:`as soon as`,explanation:`Sai. Cấu trúc 'as soon as' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Choose a conjunction of reason: She stayed at home ___ it was raining.`,a:[{text:`because`,correct:!0,explanation:`'Because' nêu nguyên nhân như yêu cầu.`},{text:`although`,explanation:`Đây là liên từ nhượng bộ.`,correct:!1},{text:`while`,explanation:`Đây là liên từ thời gian hoặc tương phản.`,correct:!1},{text:`despite`,explanation:`Sau 'despite' không dùng một mệnh đề đầy đủ theo cách này.`,correct:!1}]},{q:`Choose the word meaning 'bất cứ nơi nào': We can go ___ you prefer.`,a:[{text:`wherever`,correct:!0,explanation:`'Wherever' diễn đạt sự tự do lựa chọn địa điểm.`},{text:`when`,explanation:`Sai: when chỉ thời điểm bạn thích, không phải nơi bạn muốn đi.`,correct:!1},{text:`whenever`,explanation:`Chỉ thời gian, không chỉ địa điểm.`,correct:!1},{text:`who`,explanation:`Chỉ người. Cách dùng phù hợp trong câu này là “wherever”.`,correct:!1}]},{q:`He passed the exam ___ he didn't study hard.`,a:[{text:`even though`,correct:!0,explanation:`Tương phản giữa việc đỗ và không học chăm.`},{text:`because`,explanation:`Sai: không học chăm không phải nguyên nhân hợp lý của việc đỗ; đây là quan hệ trái ngược.`,correct:!1},{text:`so`,explanation:`Sai: so cần một kết quả, trong khi hai mệnh đề ở đây đối lập nhau.`,correct:!1},{text:`despite`,explanation:`Sai: despite không nhận mệnh đề he didn't study hard; dùng even though + S-V mới đúng.`,correct:!1}]},{q:`Turn off the lights ___ you leave the room.`,a:[{text:`before`,correct:!0,explanation:`Tắt đèn trước khi rời đi.`},{text:`after`,explanation:`Rời đi rồi thì không tắt được.`,correct:!1},{text:`while`,explanation:`Vừa đi vừa tắt không logic bằng.`,correct:!1}, ần wherever.`,correct:!1}]},{q:`___ she was very tired, she finished her homework.`,a:[{text:`Although`,correct:!0,explanation:`Mệnh đề tương phản. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`So`,explanation:`Sai: 'so' diễn tả kết quả, không mở mệnh đề nhượng bộ trước dấu phẩy.`,correct:!1},{text:`However`,explanation:`Sai: 'However' là trạng từ nối, không mở trực tiếp mệnh đề ở vị trí này.`,correct:!1},{text:`Despite`,explanation:`Sai: Despite không đi trực tiếp với mệnh đề she was very tired; phải đổi thành despite being tired.`,correct:!1}]},{q:`We will go for a walk ___ the rain stops.`,a:[{text:`as soon as`,correct:!0,explanation:`Ngay sau khi mưa tạnh.`},{text:`while`,explanation:`Không đi dạo lúc đang mưa.`,correct:!1},{text:`before`,explanation:`Sai: không thể đi dạo trước khi mưa tạnh trong ngữ cảnh này; thời điểm khởi hành là sau đó.`,correct:!1},{text:`though`,explanation:`Sai: though diễn tả tương phản, còn câu chỉ thời điểm đi dạo ngay sau khi mưa tạnh.`,correct:!1}]},{q:`___ her age, she is very active.`,a:[{text:`Despite`,correct:!0,explanation:`Bất chấp tuổi tác. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`Though`,explanation:`Sai: Though cần mệnh đề có chủ ngữ và động từ; her age chỉ là cụm danh từ.`,correct:!1},{text:`Because`,explanation:`Sai: tuổi tác không được nêu là nguyên nhân của sự năng động; ý câu là bất chấp tuổi tác.`,correct:!1},{text:`But`,explanation:`Sai: But không đứng trước cụm danh từ her age trong cấu trúc đầu câu này.`,correct:!1}]},{q:`I'll give you a gift ___ you come home.`,a:[{text:`when`,correct:!0,explanation:`Khi bạn về nhà. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`until`,explanation:`Sai: món quà được trao tại lúc bạn về, không phải hành động kéo dài cho tới lúc đó.`,correct:!1},{text:`while`,explanation:`Sai: come home là mốc xảy ra một lần, không phải khoảng thời gian để dùng while.`,correct:!1},{text:`before`,explanation:`Sai: before would give th
