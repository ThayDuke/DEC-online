const fullQuestionBank=[{q:`If it ___ tomorrow, we will stay at home.`,a:[{text:`rains`,correct:!0,explanation:`Trong mệnh đề If của câu điều kiện loại 1, ta dùng hiện tại đơn (chủ ngữ 'it' số ít).`},{text:`rain`,explanation:`Sai. Thiếu 's' cho ngôi thứ 3 số ít.`,correct:!1},{text:`will rain`,explanation:`Sai. Với 'if it rains', mệnh đề điều kiện dùng hiện tại đơn; 'will rain' đặt sai vị trí.`,correct:!1},{text:`rained`,explanation:`Sai. Dấu hiệu 'tomorrow' không phù hợp với thì/cấu trúc của phương án 'rained'.`,correct:!1}]},{q:`You will feel better if you ___ some healthy food.`,a:[{text:`eat`,correct:!0,explanation:`Mệnh đề If dùng hiện tại đơn, chủ ngữ 'you' đi với động từ nguyên mẫu.`},{text:`eats`,explanation:`Sai. 'Eats' chỉ dùng cho số ít.`,correct:!1},{text:`will eat`,explanation:`Sai. Sau 'if you' dùng hiện tại đơn 'eat'; 'will eat' không đứng trong mệnh đề điều kiện.`,correct:!1},{text:`ate`,explanation:`Sai cấu trúc điều kiện loại 1: mệnh đề If dùng hiện tại đơn 'eat', không dùng quá khứ 'ate'.`,correct:!1}]},{q:`If she ___ hard, she will pass the exam easily.`,a:[{text:`studies`,correct:!0,explanation:`Chủ ngữ 'she' số ít, động từ 'study' chuyển thành 'studies'.`},{text:`study`,explanation:`Sai. Thiếu chia động từ số ít.`,correct:!1},{text:`will study`,explanation:`Sai. Mệnh đề If loại 1 dùng hiện tại đơn 'studies', không dùng 'will study'.`,correct:!1},{text:`studying`,explanation:`Sai. Sau chủ ngữ 'she' cần động từ hiện tại đơn 'studies', không dùng dạng V-ing.`,correct:!1}]},{q:`The teacher ___ angry tomorrow if we don't finish our homework tonight.`,a:[{text:`will be`,correct:!0,explanation:`Mệnh đề chính của câu điều kiện loại 1 dùng 'will' + V-inf.`},{text:`is`,explanation:`Sai. Mệnh đề chính cần dùng tương lai đơn.`,correct:!1},{text:`be`,explanation:`Thiếu 'will'. Cách dùng phù hợp trong câu này là “will be”.`,correct:!1},{text:`was`,explanation:`Sai cấu trúc: mệnh đề kết quả tương lai cần 'will be', không dùng quá khứ 'was'.`,correct:!1}]},{q:`If they ___, they will miss the last bus.`,a:[{text:`don't hurry`,correct:!0,explanation:`Phủ định thì hiện tại đơn cho chủ ngữ 'they' là 'don't' + V-inf.`},{text:`doesn't hurry`,explanation:`Sai. 'Doesn't' dùng cho số ít.`,correct:!1},{text:`won't hurry`,explanation:`Sai. Mệnh đề If loại 1 dùng hiện tại đơn 'don't hurry'; 'won't hurry' không dùng trong mệnh đề If.`,correct:!1},{text:`not hurry`,explanation:`Sai. Phủ định trong mệnh đề If phải có trợ động từ 'do': 'don't hurry'.`,correct:!1}]},{q:`We will go to the park if the weather ___ sunny.`,a:[{text:`is`,correct:!0,explanation:`To be ở hiện tại đơn cho 'the weather' (số ít) là 'is'.`},{text:`will be`,explanation:`Sai. Sau 'if the weather' cần 'is' hiện tại đơn, không dùng 'will be'.`,correct:!1},{text:`are`,explanation:`Sai. 'Weather' không đi với 'are'.`,correct:!1},{text:`am`,explanation:`Sai. 'Weather' số ít dùng 'is sunny'; 'am' chỉ đi với chủ ngữ 'I'.`,correct:!1}]},{q:`If I ___ your wallet, I will tell you immediately.`,a:[{text:`find`,correct:!0,explanation:`Chủ ngữ 'I' đi với động từ nguyên mẫu ở hiện tại đơn.`},{text:`finds`,explanation:`Sai. Phương án 'finds' không hòa hợp về ngôi và số với chủ ngữ 'If I'.`,correct:!1},{text:`will find`,explanation:`Sai. Sau 'if I' dùng hiện tại đơn 'find'; không đặt 'will find' trong mệnh đề If.`,correct:!1},{text:`found`,explanation:`Sai cấu trúc: mệnh đề If loại 1 dùng hiện tại 'find', không dùng quá khứ 'found'.`,correct:!1}]},{q:`My mom ___ a chocolate cake this weekend if I help her.`,a:[{text:`will bake`,correct:!0,explanation:`Mệnh đề chính diễn tả kết quả ở tương lai.`},{text:`bakes`,explanation:`Sai cấu trúc: sau 'will' dùng nguyên mẫu 'bake', không dùng 'bakes'.`,correct:!1},{text:`baked`,explanation:`Sai. 'Baked' là quá khứ; kế hoạch cuối tuần cần kết quả tương lai 'will bake'.`,correct:!1},{text:`bake`,explanation:`Sai. Từ vựng hoặc dạng từ 'bake' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`If you ___ too much soda, you will have a toothache.`,a:[{text:`drink`,correct:!0,explanation:`Hiện tại đơn cho chủ ngữ 'you'.`},{text:`drinks`,explanation:`Sai. Từ vựng hoặc dạng từ 'drinks' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`will drink`,explanation:`Sai. Từ vựng hoặc dạng từ 'will drink' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`drank`,explanation:`Sai. Từ vựng hoặc dạng từ 'drank' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`The plants will die if you ___ them.`,a:[{text:`don't water`,correct:!0,explanation:`Phủ định hiện tại đơn cho 'you' là 'don't water'.`},{text:`doesn't water`,explanation:`Sai. Từ vựng hoặc dạng từ 'doesn't water' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`won't water`,explanation:`Sai. Từ vựng hoặc dạng từ 'won't water' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`not water`,explanation:`Sai. Từ vựng hoặc dạng từ 'not water' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`If he ___ late, the doctor won't see him.`,a:[{text:`arrives`,correct:!0,explanation:`Hiện tại đơn cho 'he' thêm 's'.`},{text:`arrive`,explanation:`Sai hòa hợp: chủ ngữ 'he' cần 'arrives' trong mệnh đề If.`,correct:!1},{text:`will arrive`,explanation:`Sai. Mệnh đề If của câu 11 dùng hiện tại đơn 'arrives', không dùng tương lai 'will arrive'.`,correct:!1},{text:`arrived`,explanation:`Sai. Điều kiện loại 1 cần hiện tại đơn 'arrives'; quá khứ 'arrived' không phù hợp với 'won't see'.`,correct:!1}]},{q:`I ___ a new bicycle this year if I have enough money.`,a:[{text:`will buy`,correct:!0,explanation:`Xe đạp là kế hoạch mua trong năm nay, nên mệnh đề chính dùng 'will buy'.`},{text:`buy`,explanation:`Sai. Từ vựng hoặc dạng từ 'buy' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`buyed`,explanation:`Sai. 'Buyed' không phải dạng động từ tiếng Anh; kết quả tương lai cần 'will buy'.`,correct:!1},{text:`bought`,explanation:`Sai. Từ vựng hoặc dạng từ 'bought' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`If the dog ___ loudly, the baby will wake up.`,a:[{text:`barks`,correct:!0,explanation:`Chủ ngữ 'the dog' số ít.`},{text:`bark`,explanation:`Sai hòa hợp: 'the dog' là số ít, nên động từ phải là 'barks'.`,correct:!1},{text:`will bark`,explanation:`Sai. Từ vựng hoặc dạng từ 'will bark' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`barking`,explanation:`Sai. Từ vựng hoặc dạng từ 'barking' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`You won't understand the lesson if you ___.`,a:[{text:`don't listen`,correct:!0,explanation:`Mệnh đề If phủ định dùng 'don't'.`},{text:`doesn't listen`,explanation:`Sai. Từ vựng hoặc dạng từ 'doesn't listen' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`not listen`,explanation:`Sai. Từ vựng hoặc dạng từ 'not listen' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`won't listen`,explanation:`Sai. Từ vựng hoặc dạng từ 'won't listen' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`If we ___ paper, we will save many trees.`,a:[{text:`recycle`,correct:!0,explanation:`Chủ ngữ 'we' đi với động từ nguyên mẫu.`},{text:`recycles`,explanation:`Sai. Từ vựng hoặc dạng từ 'recycles' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`will recycle`,explanation:`Sai. Từ vựng hoặc dạng từ 'will recycle' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`recycled`,explanation:`Sai. Từ vựng hoặc dạng từ 'recycled' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`He ___ a promotion this year if he works hard.`,a:[{text:`will get`,correct:!0,explanation:`Kết quả thăng chức trong năm nay là tương lai; dùng 'will get'.`},{text:`gets`,explanation:`Sai. Mệnh đề chính đã có 'will'; không dùng hiện tại 'gets' cho kết quả thăng chức tương lai.`,correct:!1},{text:`got`,explanation:`Sai. 'Got' là quá khứ, trái với kết quả có thể xảy ra trong năm nay sau điều kiện 'if he works'.`,correct:!1},{text:`is getting`,explanation:`Sai. Từ vựng hoặc dạng từ 'is getting' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`If you ___ the stove, you will get burned.`,a:[{text:`touch`,correct:!0,explanation:`Với chủ ngữ 'you', động từ điều kiện giữ nguyên 'touch'.`},{text:`touches`,explanation:`Sai. Từ vựng hoặc dạng từ 'touches' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`will touch`,explanation:`Sai. Từ vựng hoặc dạng từ 'will touch' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`touched`,explanation:`Sai. Từ vựng hoặc dạng từ 'touched' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`The cat ___ the mouse tonight if it runs fast.`,a:[{text:`will catch`,correct:!0,explanation:`Mệnh đề chính cho kết quả có thể xảy ra; việc lặp lại 'the cat' loại bỏ đại từ mơ hồ.`},{text:`catches`,explanation:`Sai. Sau 'will' phải là động từ nguyên mẫu 'catch'; 'catches' không thể đứng ở mệnh đề kết quả.`,correct:!1},{text:`catch`,explanation:`Sai. Mệnh đề kết quả cần 'will catch'; chỉ dùng 'catch' sẽ thiếu trợ động từ tương lai.`,correct:!1},{text:`caught`,explanation:`Sai. 'Caught' là quá khứ, không phù hợp với kết quả tương lai 'tonight' trong câu điều kiện loại 1.`,correct:!1}]},{q:`If they ___ the game, they will be very happy.`,a:[{text:`win`,correct:!0,explanation:`Mệnh đề If hiện tại đơn.`},{text:`wins`,explanation:`Sai. Từ vựng hoặc dạng từ 'wins' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`will win`,explanation:`Sai. Sau 'if they' cần hiện tại đơn 'win'; 'will win' không đứng trong mệnh đề điều kiện.`,correct:!1},{text:`won`,explanation:`Sai. Từ vựng hoặc dạng từ 'won' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{ y.`,correct:!1},{text:`If I have time, I helped you.`,explanation:`Sai thì kết quả: bản dịch tương lai cần 'will help', không phải quá khứ 'helped'.`,correct:!1}]},{q:`Dịch sang tiếng Anh: 'Nếu trời nắng, chúng tôi sẽ đi dã ngoại.'`,a:[{text:`If it is sunny, we will go for a picnic.`,correct:!0,explanation:`Câu đúng ngữ pháp. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`If it sunny, we will go for a picnic.`,explanation:`Thiếu động từ 'is'. Cách dùng phù hợp trong câu này là “If it is sunny, we will go for a picnic.”.`,correct:!1},{text:`If it is sunny, we went for a picnic.`,explanation:`Sai thì ở mệnh đề chính: bản dịch nói kết quả tương lai, không dùng quá khứ 'went'.`,correct:!1},{text:`If it was sunny, we go for a picnic.`,explanation:`Sai. Dấu hiệu hoặc ngữ cảnh trong câu ở hiện tại, không dùng thì Quá khứ.`,correct:!1}]},{q:`Dịch sang tiếng Việt: 'If you study hard, you will pass the exam.'`,a:[{text:`Nếu bạn học chăm chỉ, bạn sẽ vượt qua kỳ thi.`,correct:!0,explanation:`Dịch sát nghĩa và đúng ngữ pháp.`},{text:`Nếu bạn học chăm chỉ, bạn đã vượt qua kỳ thi.`,explanation:`Sai. Phương án 'Nếu bạn học chăm chỉ, bạn đã vượt qua kỳ thi.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`Nếu bạn học, bạn vượt qua kỳ thi.`,explanation:`Thiếu từ 'chăm chỉ' và 'sẽ'.`,correct:!1},{text:`Bạn sẽ học chăm chỉ nếu bạn vượt qua kỳ thi.`,explanation:`Sai chiều quan hệ: câu gốc nói học chăm chỉ dẫn đến đỗ, không phải đỗ rồi mới học.`,correct:!1}]},{q:`Dịch sang tiếng Anh: 'Nếu anh ấy không ăn sáng, anh ấy sẽ thấy đói.'`,a:[{text:`If he doesn't eat breakfast, he will feel hungry.`,correct:!0,explanation:`Đúng cấu trúc loại 1.`},{text:`If he don't eat breakfast, he will feel hungry.`,explanation:`Sai trợ động từ 'don't'.`,correct:!1},{text:`If he doesn't eat breakfast, he felt hungry.`,explanation:`Sai thì kết quả: câu yêu cầu tương lai 'will feel', không phải quá khứ 'felt'.`,correct:!1},{text:`If he not eat breakfast, ves late, they will miss the movie.`,explanation:`Sai chia động từ 'arrives'.`,correct:!1}]},{q:`Dịch sang tiếng Anh và bắt đầu bằng 'If': 'Nếu bạn không nhanh lên, bạn sẽ muộn học.'`,a:[{text:`If you don't hurry up, you will be late for school.`,correct:!0,explanation:`Đúng nghĩa, đúng câu điều kiện loại 1 và bắt đầu bằng 'If'.`},{text:`If you not hurry up, you will be late.`,explanation:`Thiếu 'don't'. Cách dùng phù hợp trong câu này là “If you don't hurry up, you will be late for school.”.`,correct:!1},{text:`If you won't hurry up, you are late.`,explanation:`Sai cấu trúc: mệnh đề If không dùng 'won't'; phải là 'don't hurry up'.`,correct:!1},{text:`Unless you hurry up, you will be late for school.`,explanation:`Chưa đúng khi chọn “Unless you hurry up, you will be late for school.”. Đúng nghĩa nhưng không bắt đầu bằng 'If' như yêu cầu.`,correct:!1}]},{q:`Dịch sang tiếng Việt: 'If you exercise, you will feel healthy.'`,a:[{text:`Nếu bạn tập thể dục, bạn sẽ cảm thấy khỏe mạnh.`,correct:!0,explanation:`Dịch chính xác. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`Nếu bạn tập thể dục, bạn đã thấy khỏe mạnh.`,explanation:`Sai thời điểm: bản gốc dùng kết quả tương lai 'sẽ cảm thấy', không phải quá khứ 'đã thấy'.`,correct:!1},{text:`Bạn sẽ cảm thấy khỏe mạnh nếu bạn không tập thể dục.`,explanation:`Sai. Cấu trúc 'Bạn sẽ cảm thấy khỏe mạnh nếu bạn không tập thể dục.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Nếu bạn đã tập thể dục, bạn sẽ khỏe.`,explanation:`Sai cấu trúc loại 1: điều kiện hiện tại dùng 'Nếu bạn tập thể dục', không dùng quá khứ hoàn thành.`,correct:!1}]},{q:`Dịch sang tiếng Anh: 'Nếu tôi tìm thấy chìa khóa, tôi sẽ đưa nó cho bạn.'`,a:[{text:`If I find the key, I will give it to you.`,correct:!0,explanation:`Đúng ngữ pháp. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`If I find the key, I gave it to you.`,explanation:`Sai thì kết quả: lời hứa tương lai cần 'will give', không phải quá khứ 'gave'.`,correct:!1},{text:`If I finds the key, I will give it to you.`,explanation:`Sai chia 'finds'. Cách dùng phù hợp trong câu này là “If I find the key, I will give it to you.”.`,correct:!1},{text:`If I found the key, I would give it to you.`,explanation:`Loại 2. Cách dùng phù hợp trong câu này là “If I find the key, I will give it to you.”.`,correct:!1}]},{q:`Dịch sang tiếng Anh: 'Nếu cô ấy mệt, cô ấy sẽ đi ngủ sớm.'`,a:[{text:`If she is tired, she will go to bed early.`,correct:!0,explanation:`Đúng cấu trúc 'be' + adj.`},{text:`If she tired, she will go to bed early.`,explanation:`Thiếu 'is'. Cách dùng phù hợp trong câu này là “If she is tired, she will go to bed early.”.`,correct:!1},{text:`If she will be tired, she goes to bed early.`,explanation:`Sai. 'If she' phải đi với 'is' ở mệnh đề điều kiện; 'will go' mới là kết quả.`,correct:!1},{text:`If she is tired, she went to bed early.`,explanation:`Sai thì kết quả: bản dịch nói cô ấy sẽ đi ngủ, không phải đã đi ngủ.`,correct:!1}]},{q:`Dịch sang tiếng Việt: 'If we save water, we will protect the earth.'`,a:[{text:`Nếu chúng ta tiết kiệm nước, chúng ta sẽ bảo vệ trái đất.`,correct:!0,explanation:`Đúng. 'save water' được dịch là 'tiết kiệm nước' và 'will protect' là 'sẽ bảo vệ trái đất'.`},{text:`Nếu chúng ta tiết kiệm nước, chúng ta bảo vệ trái đất.`,explanation:`Thiếu 'sẽ'. Cách dùng phù hợp trong câu này là “Nếu chúng ta tiết kiệm nước, chúng ta sẽ bảo vệ trái đất.”.`,correct:!1},{text:`Chúng ta sẽ bảo vệ trái đất nếu chúng ta không tiết kiệm nước.`,explanation:`Sai chiều quan hệ: tiết kiệm nước là điều kiện để bảo vệ trái đất, không phải không tiết kiệm.`,correct:!1},{text:`Nếu chúng ta đã tiết kiệm nước, trái đất được bảo vệ.`,explanation:`Sai cấu trúc loại 1: hai vế dùng hiện tại đơn và tương lai, không dùng quá khứ.`,correct:!1}]},{q:`Dịch sang tiếng Anh: 'Nếu con chó sủa, tôi sẽ sợ hãi.'`,a:[{text:`If the dog barks, I will be scared.`,correct:!0,explanation:`Đúng chia động từ và mệnh đề chính.
