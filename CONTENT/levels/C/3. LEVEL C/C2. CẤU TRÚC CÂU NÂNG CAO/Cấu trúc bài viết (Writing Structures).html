const fullQuestionBank=[{q:`What is usually the first sentence of a paragraph? 📝`,a:[{text:`Topic sentence`,correct:!0,explanation:`Topic sentence (câu chủ đề) thường đứng đầu đoạn văn để giới thiệu ý chính.`},{text:`Supporting sentence`,explanation:`Sai. Đây là câu bổ trợ.`,correct:!1},{text:`Concluding sentence`,explanation:`Sai. Đây là câu kết luận.`,correct:!1},{text:`Thesis statement`,explanation:`Sai. Đây là câu luận đề của bài văn (essay).`,correct:!1}]},{q:`Which sentences develop and explain the main idea introduced by the topic sentence? 🗣️`,a:[{text:`Supporting sentences`,correct:!0,explanation:`Supporting sentences phát triển Topic Sentence bằng giải thích, lý do và dẫn chứng cụ thể.`},{text:`Topic sentence`,explanation:`Topic Sentence giới thiệu ý chính, không phải phần phát triển và chứng minh ý đó.`,correct:!1},{text:`Concluding sentence`,explanation:`Concluding Sentence khép lại đoạn sau khi các câu bổ trợ đã phát triển ý chính.`,correct:!1},{text:`Title`,explanation:`Title chỉ đặt tên cho nội dung, không cung cấp phần giải thích trong đoạn.`,correct:!1}]},{q:`What is the function of a concluding sentence? 🔚`,a:[{text:`To summarize the main points`,correct:!0,explanation:`Câu kết luận dùng để tóm tắt lại các ý chính hoặc diễn giải lại câu chủ đề.`},{text:`To introduce a new topic`,explanation:`Sai. Không được đưa ý mới vào kết luận.`,correct:!1},{text:`To give specific details`,explanation:`Sai. Chi tiết nằm ở phần thân đoạn.`,correct:!1},{text:`To start the paragraph`,explanation:`Sai. Đây là chức năng của câu chủ đề.`,correct:!1}]},{q:`A good paragraph usually focuses on ___ main idea(s). 💡`,a:[{text:`one`,correct:!0,explanation:`Một đoạn văn chuẩn chỉ nên tập trung vào duy nhất một ý chính.`},{text:`two`,explanation:`Một đoạn chuẩn tập trung vào một ý chính, không mặc định có hai ý ngang hàng.`,correct:!1},{text:`three`,explanation:`Số lượng câu chủ đề không được xác định là ba; điều quan trọng là một trọng tâm thống nhất.`,correct:!1},{text:`many`,explanation:`Sai. 'many' là lượng từ dùng cho danh từ đếm được số nhiều, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1}]},{q:`In an essay, which paragraph comes first? 1️⃣`,a:[{text:`Introduction`,correct:!0,explanation:`Introduction (Mở bài) là đoạn đầu tiên của một bài luận.`},{text:`Body paragraph`,explanation:`Sai. Đây là thân bài.`,correct:!1},{text:`Conclusion`,explanation:`Sai. Đây là kết bài.`,correct:!1},{text:`Summary`,explanation:`'Summary' không phải tên của đoạn đứng đầu một bài luận; phần đầu là Introduction.`,correct:!1}]},{q:`What is the last sentence of the introduction called? 🔑`,a:[{text:`Thesis statement`,correct:!0,explanation:`Thesis statement (Câu luận đề) thường nằm cuối mở bài, nêu quan điểm chính của cả bài viết.`},{text:`Hook`,explanation:`Sai. Hook nằm đầu mở bài.`,correct:!1},{text:`Topic sentence`,explanation:`Trong bài luận, câu cuối phần Introduction thường nêu luận đề chung (Thesis Statement), không chỉ chủ đề một đoạn.`,correct:!1},{text:`Concluding sentence`,explanation:`'Concluding sentence' khép lại đoạn hoặc phần lập luận, không phải tên câu chốt của Introduction.`,correct:!1}]},{q:`Which of these words is a transition signal for contrast? 🔄`,a:[{text:`However`,correct:!0,explanation:`'However' (Tuy nhiên) dùng để chỉ sự đối lập.`},{text:`Also`,explanation:`Sai. Chỉ sự bổ sung.`,correct:!1},{text:`Therefore`,explanation:`Sai. Chỉ kết quả. Cách dùng phù hợp trong câu này là “However”.`,correct:!1},{text:`For example`,explanation:`Sai. Chỉ ví dụ. Cách dùng phù hợp trong câu này là “However”.`,correct:!1}]},{q:`Which word is best to start a concluding sentence? 🏁`,a:[{text:`In conclusion`,correct:!0,explanation:`'In conclusion' là từ nối phổ biến nhất để bắt đầu câu kết luận.`},{text:`First`,explanation:`'First' báo hiệu ý đầu tiên, không phải cụm kết luận tổng quát.`,correct:!1},{text:`Next`,explanation:`'Next' dùng để chuyển sang bước/ý tiếp theo, không mở đầu câu kết luận.`,correct:!1},{text:`Because`,explanation:`'Because' giới thiệu nguyên nhân và thường cần mệnh đề theo sau, không phải tín hiệu kết luận.`,correct:!1}]},{q:`To add more information, we can use: ➕`,a:[{text:`Moreover`,correct:!0,explanation:`'Moreover' (Hơn nữa) dùng để thêm thông tin.`},{text:`But`,explanation:`'But' biểu thị tương phản, trái với chức năng bổ sung thông tin của câu hỏi.`,correct:!1},{text:`So`,explanation:`'So' thường báo hiệu kết quả, không phải thêm một thông tin mới ngang hàng.`,correct:!1},{text:`In contrast`,explanation:`'In contrast' mở ra sự đối lập, không phù hợp với quan hệ bổ sung.`,correct:!1}]},{q:`What type of writing tells a story? 📖`,a:[{text:`Narrative`,correct:!0,explanation:`Narrative writing là văn kể chuyện.`},{text:`Descriptive`,explanation:`Sai. Văn miêu tả. Cách dùng phù hợp trong câu này là “Narrative”.`,correct:!1},{text:`Expository`,explanation:`Sai. Văn thuyết minh.`,correct:!1},{text:`Argumentative`,explanation:`Sai. Văn nghị luận. Cách dùng phù hợp trong câu này là “Narrative”.`,correct:!1}]},{q:`What type of writing describes how something looks, smells, or tastes? 👁️`,a:[{text:`Descriptive`,correct:!0,explanation:`Descriptive writing dùng các giác quan để miêu tả.`},{text:`Narrative`,explanation:`Narrative kể lại diễn biến, không tập trung mô tả cảm giác và đặc điểm bằng giác quan.`,correct:!1},{text:`Persuasive`,explanation:`Persuasive nhằm thuyết phục người đọc, không phải mục tiêu chính của đoạn mô tả.`,correct:!1},{text:`Expository`,explanation:`Expository giải thích hoặc cung cấp thông tin, không nhấn mạnh hình ảnh, mùi và vị.`,correct:!1}]},{q:`What is the main goal of an argumentative essay? ⚖️`,a:[{text:`To persuade the reader`,correct:!0,explanation:`Mục đích của văn nghị luận là thuyết phục người đọc đồng ý với quan điểm.`},{text:`To tell a story`,explanation:`Argumentative essay nhằm thuyết phục bằng luận điểm, không kể một câu chuyện.`,correct:!1},{text:`To describe a place`,explanation:`Mô tả địa điểm thuộc descriptive writing, không phải mục tiêu chính của argumentative essay.`,correct:!1},{text:`To explain a process`,explanation:`Giải thích quy trình thuộc expository/process writing, không phải thuyết phục người đọc.`,correct:!1}]},{q:`Identify the Topic Sentence: 'Apples are a very healthy fruit. They contain many vitamins. Doctors recommend eating them.' 🍎`,a:[{text:`Apples are a very healthy fruit.`,correct:!0,explanation:`Đây là câu bao quát toàn bộ ý của đoạn.`},{text:`They contain many vitamins.`,explanation:`Sai. Đây là chi tiết bổ trợ.`,correct:!1},{text:`Doctors recommend eating them.`,explanation:`Sai. Đây là dẫn chứng.`,correct:!1},{text:`None of the above.`,explanation:`Câu đầu nêu trực tiếp chủ đề và nhận định, nên là Topic Sentence; không phải không có đáp án.`,correct:!1}]},{q:`Which sentence is NOT a supporting sentence for the topic 'Summer is my favorite season'? ☀️`,a:[{text:`I enjoy skiing in the snow.`,correct:!0,explanation:`Trượt tuyết (skiing) thuộc về mùa đông, lạc đề so với 'Mùa hè'.`},{text:`I love going to the beach.`,explanation:`Đi biển là hoạt động phù hợp với mùa hè, nên đây vẫn là câu hỗ trợ chủ đề.`,correct:!1},{text:`The weather is warm and sunny.`,explanation:`Thời tiết ấm và nắng là đặc điểm trực tiếp giải thích vì sao mùa hè được yêu thích.`,correct:!1},{text:`There is no school in summer.`,explanation:`Không phải đi học là một lợi ích cụ thể của mùa hè, nên hỗ trợ chủ đề.`,correct:!1}]},{q:`What should you avoid in a formal essay? 🚫`,a:[{text:`Slang words`,correct:!0,explanation:`Slang (tiếng lóng) không phù hợp với văn phong trang trọng (formal).`},{text:`Complex sentences`,explanation:`Sai. Nên dùng. Cách dùng phù hợp trong câu này là “Slang words”.`,correct:!1},{text:`Transition words`,explanation:`Sai. Rất cần thiết. Cách dùng phù hợp trong câu này là “Slang words”.`,correct:!1},{text:`Correct grammar`,explanation:`Sai. Bắt buộc phải có.`,correct:!1}]},{q:`What is a 'Hook' in an essay introduction? 🎣`,a:[{text:`A sentence to grab attention`,correct:!0,explanation:`Hook là câu đầu tiên dùng để thu hút sự chú ý của người đọc.`},{text:`The last sentence`,explanation:`Hook thường mở đầu để thu hút; câu cuối Introduction mới thường là Thesis Statement.`,correct:!1},{text:`The main argument`,explanation:`Hook thu hút người đọc; main argument thuộc luận điểm/thesis, không phải chức năng của Hook.`,correct:!1},{text:`A summary`,explanation:`A summary tóm lược nội dung, còn Hook có nhiệm vụ thu hút sự chú ý ngay từ đầu.`,correct:!1}]},{q:`Which transition word shows cause and effect? ➡️`,a:[{text:`Therefore`,correct:!0,explanation:`'Therefore' (Vì vậy) chỉ kết quả/hệ quả.`},{text:`However`,explanation:`However báo hiệu tương phản, không thể hiện quan hệ nguyên nhân–kết quả được hỏi.`,correct:!1},{text:`Also`,explanation:`Also chỉ bổ sung thông tin, không nêu kết quả của việc học tập.`,correct:!1},{text:`Similarly`,explanation:`Similarly báo hiệu sự tương đồng, không phải kết quả xảy ra sau một nguyên nhân.`,correct:!1}]},{q:`To list points in order, we use: 1️⃣2️⃣3️⃣`,a:[{text:`First, Next, Finally`,correct:!0,explanation:`Đây là chuỗi từ nối chỉ trình tự thời gian hoặc thứ tự ý.`},{text:`But, So, Because`,explanation:`Nhóm này trộn tương phản, kết quả và nguyên nhân, không tạo thứ tự điểm rõ ràng.`,correct:!1},{text:`And, Or, But`,explanation:`Đây là các liên từ nối ý, không phải bộ tín hiệu First–Next–Finally.`,correct:!1},{text:`However, Therefore, Thus`,explanation:`Các từ này biểu thị tương phản/kết quả, không phải thứ tự liệt kê ba bước.`,correct:!1}]},{q:`A paragraph that explains how to do something is called: 🛠️`,a:[{text:`Process analysis`,correct:!0,explanation:`Process analysis giải thích quy trình hoặc cách làm.`},{text:`Narrative`,explanation:`Narrative kể chuyện, không hướng dẫn các bước thực hiện một quy trình.`,correct:!1},{text:`Argumentative`,explanation:`Argumentative bảo vệ một quan điểm, không tập trung giải thích cách làm từng bước.`,correct:!1},{text:`Descriptive`,explanation:`Descriptive mô tả đặc điểm, không trình bày chuỗi thao tác để hoàn thành việc gì đó.`,correct:!1}]},{q:`Which is the best concluding sentence for a paragraph about 'Regular Exercise'? 🏃`,a:[{text:`In short, exercise is vital for a healthy life.`,correct:!0,explanation:`Tóm tắt lại lợi ích và tầm quan trọng của việc tập thể dục.`},{text:`I like playing soccer.`,explanation:`Sai. Quá cụ thể. Cách dùng phù hợp trong câu này là “In short, exercise is vital for a healthy life.”.`,correct:!1},{text:`Some people don't like running.`,explanation:`Sai. Lạc đề. Cách dùng phù hợp trong câu này là “In short, exercise is vital for a healthy life.”.`,correct:!1},{text:`First, you should warm up.`,explanation:`Sai. Đây là chi tiết, không phải kết luận.`,correct:!1}]},{q:`The body of an essay usually consists of how many paragraphs? 📄`,a:[{text:`One or more, depending on the purpose and length`,correct:!0,explanation:`Số đoạn thân bài phụ thuộc nhiệm vụ viết; mô hình năm đoạn không phải quy tắc bắt buộc.`},{text:`Only one sentence`,explanation:`Không đủ để phát triển thân bài.`,correct:!1},{text:`Zero`,explanation:`Bài luận cần phần thân.`,correct:!1},{text:`Always exactly three`,explanation:`Chỉ đúng với một số mô hình luyện viết.`,correct:!1}]},{q:`Which connector fits best? 'It rained heavily. ___, we stayed at home.' 🌧️`,a:[{text:`Therefore`,correct:!0,explanation:`Chỉ kết quả: Mưa to -> Nên ở nhà.`},{text:`However`,explanation:`Sai. Chỉ đối lập. Cách dùng phù hợp trong câu này là “Therefore”.`,correct:!1},{text:`Because`,explanation:`Sai. Sai ngữ pháp ở vị trí này.`,correct:!1},{text:`Although`,explanation:`Although mở mệnh đề nhượng bộ, trong câu mưa lớn dẫn đến ở nhà cần quan hệ kết quả.`,correct:!1}]},{q:`Which connector fits best? 'He is rich. ___, he is not happy.' 💰`,a:[{text:`However`,correct:!0,explanation:`Chỉ sự đối lập: Giàu -> Tuy nhiên không hạnh phúc.`},{text:`So`,explanation:`'So' có thể báo kết quả, nhưng trong câu này đáp án được neo bằng trạng từ nối 'However' cho ý tương phản giàu/nghèo và hạnh phúc.`,correct:!1},{text:`Therefore`,explanation:`'Therefore' báo kết quả, trong khi câu sau phủ định kỳ vọng từ câu trước và cần quan hệ tương phản.`,correct:!1},{text:`Moreover`,explanation:`'Moreover' chỉ bổ sung một ý cùng chiều, không diễn tả sự đối lập giữa giàu có và không hạnh phúc.`,correct:!1}]},{q:`Which of these is a 'Fragment' ? 🧩`,a:[{text:`Because he was tired.`,correct:!0,explanation:`Đây là mệnh đề phụ thuộc, thiếu mệnh đề chính.`},{text:`He was tired.`,explanation:`Đây là câu hoàn chỉnh có chủ ngữ và động từ, không phải fragment.`,correct:!1},{text:`I am happy.`,explanation:`Câu có đủ chủ ngữ 'I' và động từ 'am' cùng bổ ngữ, nên hoàn chỉnh.`,correct:!1},{text:`They run fast.`,explanation:`Câu hoàn chỉnh; 'fast' bổ nghĩa cho 'run'.`,correct:!1}]},{q:`Which of these is a 'Run-on' sentence ? 🚂`,a:[{text:`I love cats I hate dogs.`,correct:!0,explanation:`Hai mệnh đề độc lập nối liền nhau mà không có dấu câu hoặc từ nối.`},{text:`I love cats, but I hate dogs.`,explanation:`Có liên từ 'but' nối hai mệnh đề độc lập, nên không phải run-on.`,correct:!1},{text:`I love cats because they are cute.`,explanation:`Mệnh đề 'because' được liên kết đúng trong một câu hoàn chỉnh.`,correct:!1},{text:`I love cats.`,explanation:`Đây là một câu đơn hoàn chỉnh, không dính với câu khác.`,correct:!1}]},{q:`What is 'Brainstorming'? 🧠`,a:[{text:`Generating ideas before writing`,correct:!0,explanation:`Brainstorming là bước tìm ý tưởng trước khi viết.`},{text:`Checking spelling errors`,explanation:`Sai. Đây là Proofreading.`,correct:!1},{text:`Writing the final draft`,explanation:`Sau first draft cần edit/revise trước khi tạo final draft, không nhảy thẳng đến bản cuối.`,correct:!1},{text:`Printing the essay`,explanation:`In bài không thay thế bước xem lại và sửa bản nháp.`,correct:!1}]},{q:`What implies 'giving an example'? 📌`,a:[{text:`For instance`,correct:!0,explanation:`'For instance' đồng nghĩa với 'For example'.`},{text:`In conclusion`,explanation:`'In conclusion' dùng để kết luận, không phải tín hiệu đưa ra một ví dụ cụ thể.`,correct:!1},{text:`On the other hand`,explanation:`'On the other hand' báo tương phản, không giới thiệu một ví dụ như 'For instance'.`,correct:!1},{text:`Furthermore`,explanation:`'Furthermore' bổ sung ý, còn câu hỏi cần cụm giới thiệu ví dụ.`,correct:!1}]},{q:`Which sentence provides evidence? 🔎`,a:[{text:`According to a study, 80% of students agree.`,correct:!0,explanation:`Cung cấp số liệu/dẫn chứng cụ thể.`},{text:`I think it is true.`,explanation:`Sai. Đây là ý kiến cá nhân.`,correct:!1},{text:`Students should study hard.`,explanation:`Sai. Đây là lời khuyên.`,correct:!1},{text:`Education is important.`,explanation:`Sai. Đây là nhận định chung.`,correct:!1}]},{q:`In an argumentative essay, where do you address the opposing view? 🛡️`,a:[{text:`Counter-argument paragraph`,correct:!0,explanation:`Đoạn phản biện dùng để nhắc đến và bác bỏ ý kiến đối lập.`},{text:`Conclusion`,explanation:`Conclusion khép lại lập luận, không phải nơi xử lý quan điểm đối lập bằng chứng cứ.`,correct:!1},{text:`Topic sentence`,explanation:`Topic Sentence nêu trọng tâm của đoạn, không dành riêng cho phản biện đối lập.`,correct:!1},{text:`Thesis statement`,explanation:`Thesis Statement nêu lập trường chung của bài, không phải đoạn triển khai ý kiến đối lập.`,correct:!1}]},{q:`What does 'Unity' mean in a paragraph? 🔗`,a:[{text:`All sentences discuss one main idea`,correct:!0,explanation:`Unity (Sự thống nhất) nghĩa là mọi câu đều tập trung vào 1 ý chính.`},{text:`The paragraph is very long`,explanation:`Unity nói các câu cùng một ý, không phụ thuộc độ dài đoạn.`,correct:!1},{text:`The paragraph has difficult words`,explanation:`Từ khó không định nghĩa Unity; các câu vẫn có thể lệch chủ đề.`,correct:!1},{text:`There are many different topics`,explanation:`Nhiều topic khác nhau là dấu hiệu thiếu unity, trái với một ý chính duy nhất.`,correct:!1}]},{q:`Which word signals a similarity? 👯`,a:[{text:`Likewise`,correct:!0,explanation:`'Likewise' nghĩa là tương tự như vậy.`},{text:`Otherwise`,explanation:`Otherwise diễn tả lựa chọn thay thế hoặc hậu quả nếu không, không báo hiệu sự tương đồng.`,correct:!1},{text:`Instead`,explanation:`Instead cho biết thay thế, trái với quan hệ giống nhau mà 'Likewise' biểu thị.`,correct:!1},{text:`Although`,explanation:`Although mở mệnh đề nhượng bộ, không phải trạng từ nối chỉ sự tương đồng.`,correct:!1}]},{q:`Choose the correct order for a paragraph: 1. Detail A 2. Topic Sentence 3. Detail B 4. Concluding Sentence 🔢`,a:[{text:`2 - 1 - 3 - 4`,correct:!0,explanation:`Topic Sentence -> Details -> Concluding Sentence.`},{text:`1 - 3 - 2 - 4`,explanation:`Detail A/B phải đứng sau Topic Sentence; thứ tự này đặt detail trước câu chủ đề.`,correct:!1},{text:`4 - 2 - 1 - 3`,explanation:`Concluding Sentence không thể mở đoạn trước Topic Sentence và details.`,correct:!1},{text:`2 - 4 - 1 - 3`,explanation:`Câu kết luận bị đặt quá sớm, trước khi hai chi tiết được triển khai.`,correct:!1}]},{q:`Which is a 'weak' topic sentence? 👎`,a:[{text:`I am going to write about football.`,correct:!0,explanation:`Câu này chỉ thông báo, không nêu ý chính hay quan điểm.`},{text:`Football is the most popular sport in the world.`,explanation:`Đây là một nhận định cụ thể về bóng đá, nên có thể làm Topic Sentence rõ hơn thông báo chung.`,correct:!1},{text:`Playing football has many health benefits.`,explanation:`Câu nêu trực tiếp một luận điểm về lợi ích sức khỏe, phù hợp làm Topic Sentence.`,correct:!1},{text:`Football requires teamwork and skill.`,explanation:`Câu đưa ra ý kiểm soát về kỹ năng và tinh thần đồng đội, tạo hướng phát triển cho đoạn.`,correct:!1}]},{q:`What is 'Coherence'? 🧵`,a:[{text:`Logical flow and connection of ideas`,correct:!0,explanation:`Coherence (Sự mạch lạc) là sự liên kết trôi chảy giữa các ý.`},{text:`Using difficult vocabulary`,explanation:`Coherence cần dòng ý logic, không được tạo chỉ bằng từ vựng khó.`,correct:!1},{text:`Writing a long essay`,explanation:`Độ dài bài không tự bảo đảm các ý được nối logic.`,correct:!1},{text:`Repeating the same word`,explanation:`Lặp từ không tạo flow; coherence cần quan hệ ý tưởng rõ ràng.`,correct:!1}]},{q:`Which phrase is used to clarify an idea? 💡`,a:[{text:`In other words`,correct:!0,explanation:`'In other words' (Nói cách khác) dùng để giải thích rõ hơn.`},{text:`In conclusion`,explanation:`'In conclusion' báo hiệu phần kết, không dùng để làm rõ một ý bằng cách diễn đạt lại.`,correct:!1},{text:`On the contrary`,explanation:`'On the contrary' biểu thị phản bác trực tiếp, không phải cụm clarification như 'In other words'.`,correct:!1},{text:`For example`,explanation:`'For example' giới thiệu minh họa cụ thể, còn câu hỏi cần cụm giải thích lại ý.`,correct:!1}]},{q:`What should you do after writing your first draft? 📝`,a:[{text:`Edit and revise`,correct:!0,explanation:`Sau khi viết nháp phải biên tập và chỉnh sửa.`},{text:`Submit immediately`,explanation:`Nộp ngay bỏ qua bước chỉnh sửa và phản biện cần thiết sau bản nháp đầu tiên.`,correct:!1},{text:`Throw it away`,explanation:`Sau first draft cần edit/revise, không vứt bỏ toàn bộ bản nháp.`,correct:!1},{text:`Write the title only`,explanation:`Chỉ viết tiêu đề không phải quy trình chỉnh sửa và phát triển bản nháp.`,correct:!1}]},{q:`Which is NOT a type of essay? ❌`,a:[{text:`Speaking`,correct:!0,explanation:`Speaking là kỹ năng nói, không phải dạng bài viết.`},{text:`Descriptive`,explanation:`Descriptive là một loại essay, nên không thể là đáp án cho câu hỏi 'không phải loại essay'.`,correct:!1},{text:`Narrative`,explanation:`Narrative là dạng bài kể chuyện, thuộc các loại essay được công nhận.`,correct:!1},{text:`Expository`,explanation:`Expository là dạng bài giải thích/thông tin, không phải lựa chọn 'không phải essay'.`,correct:!1}]},{q:`A thesis statement must be: 💎`,a:[{text:`Clear and specific`,correct:!0,explanation:`Luận đề phải rõ ràng và cụ thể.`},{text:`Vague and general`,explanation:`Sai. Mơ hồ. Cách dùng phù hợp trong câu này là “Clear and specific”.`,correct:!1},{text:`A question`,explanation:`Sai. Luận đề không nên là câu hỏi.`,correct:!1},{text:`A quote`,explanation:`Sai. Luận đề là ý của người viết.`,correct:!1}]},{q:`Which word can replace 'But'? 🔄`,a:[{text:`Yet`,correct:!0,explanation:`'Yet' là liên từ chỉ tương phản, nên có thể thay 'But' trong câu nối hai ý đối lập.`},{text:`And`,explanation:`And biểu thị bổ sung, không thay thế liên từ tương phản 'But'.`,correct:!1},{text:`So`,explanation:`So biểu thị kết quả, không mang nghĩa tương phản như 'But'.`,correct:!1},{text:`Or`,explanation:`Or biểu thị lựa chọn, không phải liên từ nối hai ý đối lập.`,correct:!1}]},{q:`Which word can replace 'So' (result)? ➡️`,a:[{text:`Consequently`,correct:!0,explanation:`'Consequently' (Hậu quả là/Kết quả là) trang trọng hơn 'So'.`},{text:`Because`,explanation:`Because giới thiệu nguyên nhân, không phải từ thay thế cho 'So' chỉ kết quả.`,correct:!1},{text:`Although`,explanation:`Although diễn tả nhượng bộ, không trực tiếp thay thế 'So' trong quan hệ kết quả.`,correct:!1},{text:`Since`,explanation:`Since thường nêu nguyên nhân hoặc thời điểm, không phải trạng từ kết quả tương đương 'So'.`,correct:!1}]},{q:`Identify the type of essay: 'Why Students Should Wear Uniforms'. 👔`,a:[{text:`Argumentative`,correct:!0,explanation:`Chủ đề yêu cầu đưa ra lý do/quan điểm ủng hộ.`},{text:`Narrative`,explanation:`Tiêu đề nêu lý do nên mặc đồng phục, nên là essay lập luận chứ không kể một chuỗi sự kiện.`,correct:!1},{text:`Descriptive`,explanation:`Tiêu đề yêu cầu bảo vệ quan điểm, không chỉ mô tả hình dáng hay đặc điểm.`,correct:!1},{text:`Fictional`,explanation:`'Fictional' mô tả tính hư cấu, không phải loại essay lập luận được xác định bởi tiêu đề.`,correct:!1}]},{q:`Identify the type of essay: 'My Unforgettable Trip to Da Lat'. 🌲`,a:[{text:`Narrative`,correct:!0,explanation:`Kể về một chuyến đi/trải nghiệm.`},{text:`Expository`,explanation:`Một chuyến đi đáng nhớ chủ yếu kể diễn biến và trải nghiệm, không giải thích một chủ đề khách quan.`,correct:!1},{text:`Argumentative`,explanation:`Tiêu đề không đưa ra vấn đề cần tranh luận hay lập trường cần bảo vệ.`,correct:!1},{text:`Persuasive`,explanation:`Tiêu đề kể lại một trải nghiệm, không yêu cầu thuyết phục người đọc làm điều gì.`,correct:!1}]},{q:`Identify the type of essay: 'The Water Cycle'. 💧`,a:[{text:`Expository`,correct:!0,explanation:`Giải thích các sự kiện/khoa học thực tế.`},{text:`Argumentative`,explanation:`'The Water Cycle' là chủ đề giải thích quá trình, không phải tranh luận hai phía.`,correct:!1},{text:`Narrative`,explanation:`Chủ đề chu trình nước giải thích hiện tượng, không kể một câu chuyện có nhân vật và diễn biến.`,correct:!1},{text:`Opinion`,explanation:`Tiêu đề không nêu đánh giá chủ quan; nó gọi tên một quá trình khoa học cần giải thích.`,correct:!1}]},{q:`When the selected document style requires first-line indentation, indenting the first line is: 📏`,a:[{text:`Standard formatting`,correct:!0,explanation:`Trong kiểu định dạng đã chọn, thụt đầu dòng là quy ước trình bày chuẩn cho đoạn văn.`},{text:`Wrong`,explanation:`Thụt đầu dòng không sai; đây là một quy ước định dạng hợp lệ.`,correct:!1},{text:`Optional`,explanation:`Trong bối cảnh kiểu tài liệu đã yêu cầu, thao tác này không còn là tùy chọn.`,correct:!1},{text:`Illegal`,explanation:`Thụt đầu dòng không phải hành vi bị cấm; nó là thao tác định dạng thông thường.`,correct:!1}]},{q:`Which is a 'Time' transition? ⏳`,a:[{text:`Meanwhile`,correct:!0,explanation:`'Meanwhile' (Trong khi đó) chỉ thời gian.`},{text:`Therefore`,explanation:`Therefore báo kết quả, không phải quan hệ thời gian mà 'Meanwhile' biểu thị.`,correct:!1},{text:`However`,explanation:`However báo tương phản, không phải trình tự hoặc thời điểm diễn ra.`,correct:!1},{text:`Because`,explanation:`Because giới thiệu nguyên nhân, không phải trạng từ chuyển ý chỉ thời gian.`,correct:!1}]},{q:`Which sentence uses 'First' correctly? 1️⃣`,a:[{text:`First, mix the flour and sugar.`,correct:!0,explanation:`Dùng để bắt đầu một quy trình.`},{text:`I like First.`,explanation:`'First' ở đây không phải danh từ được yêu thích; nó cần đứng đầu câu như tín hiệu trình tự.`,correct:!1},{text:`He is First.`,explanation:`Câu này dùng 'first' như tính từ/vị trí, không minh họa trạng từ nối mở đầu bước làm.`,correct:!1},{text:`They went First.`,explanation:`'First' đứng sau động từ ở đây mang nghĩa thứ tự đi trước, không báo hiệu bước đầu của hướng dẫn.`,correct:!1}]},{q:`What is 'Plagiarism'? 👮`,a:[{text:`Copying ideas without credit`,correct:!0,explanation:`Đạo văn là sao chép ý tưởng mà không trích dẫn.`},{text:`Writing original ideas`,explanation:`Viết ý tưởng nguyên bản là hành vi ngược với plagiarism, không phải hành vi bị định nghĩa là đạo văn.`,correct:!1},{text:`Checking grammar`,explanation:`Checking grammar là một công việc chỉnh sửa, không phải định nghĩa của Plagiarism.`,correct:!1},{text:`Reading books`,explanation:`Đọc sách không đồng nghĩa với sao chép ý tưởng mà không ghi nguồn.`,correct:!1}]},{q:`A strong topic sentence should be: 📍`,a:[{text:`Clear and focused on the paragraph's controlling idea`,correct:!0,explanation:`Câu chủ đề phải đủ bao quát để phát triển nhưng vẫn nêu trọng tâm cụ thể.`},{text:`A list of every detail`,explanation:`Chi tiết thuộc các câu hỗ trợ.`,correct:!1},{text:`Always a question`,explanation:`Câu hỏi chỉ phù hợp trong một số ngữ cảnh.`,correct:!1},{text:`A definition only`,explanation:`Không phải mọi đoạn đều định nghĩa.`,correct:!1}]},{q:`Does a paragraph always need a concluding sentence? 🤔`,a:[{text:`Usually yes, but not always in very short paragraphs`,correct:!0,explanation:`Thường là có, nhưng đoạn văn quá ngắn hoặc nối tiếp nhau có thể lược bỏ.`},{text:`No, never`,explanation:`Đoạn rất ngắn đôi khi có thể kết thúc tự nhiên mà không cần câu kết luận riêng.`,correct:!1},{text:`Yes, 100% strictly`,explanation:`Đoạn rất ngắn có thể không cần câu kết riêng, nên quy tắc '100%' quá tuyệt đối.`,correct:!1},{text:`Only in stories`,explanation:`Câu kết luận có thể cần trong nhiều loại đoạn, không chỉ trong stories.`,correct:!1}]},{q:`Which is the correct structure of a narrative paragraph? 🎬`,a:[{text:`Beginning -> Middle -> End`,correct:!0,explanation:`Cấu trúc kể chuyện: Mở đầu -> Diễn biến -> Kết thúc.`},{text:`Conclusion -> Body -> Intro`,explanation:`Essay bắt đầu bằng Introduction, sau đó Body và cuối cùng Conclusion.`,correct:!1},{text:`Middle -> End -> Beginning`,explanation:`Narrative cần mở đầu trước diễn biến và kết thúc, không đảo ngược trình tự này.`,correct:!1},{text:`End -> Beginning -> Middle`,explanation:`Kết thúc phải đến sau phần mở đầu và diễn biến trong cấu trúc kể chuyện cơ bản.`,correct:!1}]},{q:`In 'Descriptive' writing, you should use: 🎨`,a:[{text:`Adjectives and sensory details`,correct:!0,explanation:`Tính từ và chi tiết giác quan giúp miêu tả sinh động.`},{text:`Only verbs`,explanation:`Văn miêu tả cần tính từ và chi tiết giác quan, không thể chỉ dùng động từ.`,correct:!1},{text:`Facts and numbers only`,explanation:`Descriptive writing cần tính từ và chi tiết giác quan, không chỉ dữ kiện và con số.`,correct:!1},{text:`Arguments`,explanation:`Arguments phục vụ lập luận, không thay thế cho hình ảnh và cảm giác trong văn miêu tả.`,correct:!1}]},{q:`What does 'Expository' mean? ℹ️`,a:[{text:`To explain or inform`,correct:!0,explanation:`Expository là văn thuyết minh/giải thích.`},{text:`To argue`,explanation:`'To argue' là mục tiêu của argumentative writing, không phải expository writing.`,correct:!1},{text:`To entertain`,explanation:`Giải trí có thể là mục tiêu của narrative/creative writing, không phải nghĩa cốt lõi của expository.`,correct:!1},{text:`To confuse`,explanation:`Expository writing nhằm làm rõ thông tin, không nhằm gây nhầm lẫn cho người đọc.`,correct:!1}]},{q:`The phrase 'On the other hand' indicates: ✋`,a:[{text:`Contrasting idea`,correct:!0,explanation:`Mặt khác (chỉ ý đối lập).`},{text:`Same idea`,explanation:`'On the other hand' mở ra ý đối lập, không chỉ lặp lại cùng một ý.`,correct:!1},{text:`Example`,explanation:`'On the other hand' không phải cụm giới thiệu ví dụ.`,correct:!1},{text:`Conclusion`,explanation:`'On the other hand' nối hai mặt tương phản, không báo hiệu phần kết luận.`,correct:!1}]},{q:`The phrase 'As a result' indicates: 📉`,a:[{text:`Effect`,correct:!0,explanation:`Kết quả là. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`Cause`,explanation:`'As a result' giới thiệu hệ quả, không phải nguyên nhân đứng trước nó.`,correct:!1},{text:`Time`,explanation:`'As a result' không sắp xếp sự kiện theo thời gian; nó chỉ quan hệ nguyên nhân–kết quả.`,correct:!1},{text:`Addition`,explanation:`'As a result' không thêm ý ngang hàng mà nêu kết quả của ý trước.`,correct:!1}]},{q:`Which punctuation can join two independent clauses immediately before 'however'? 🖊️`,a:[{text:`Semicolon (;)`,correct:!0,explanation:`Cấu trúc là 'Clause 1; however, clause 2.' Có dấu phẩy sau 'however'.`},{text:`Comma (,)`,explanation:`Chỉ dùng dấu phẩy sẽ tạo comma splice.`,correct:!1},{text:`Colon (:)`,explanation:`Không phải dấu nối chuẩn trong cấu trúc này.`,correct:!1},{text:`No mark`,explanation:`Hai mệnh đề cần dấu câu thích hợp.`,correct:!1}]},{q:`What is the 'Background Information' in an introduction? 🌍`,a:[{text:`Context about the topic`,correct:!0,explanation:`Thông tin nền giúp người đọc hiểu ngữ cảnh trước khi vào luận đề.`},{text:`The main argument`,explanation:`Background Information cung cấp bối cảnh, còn main argument là luận điểm cần nêu sau đó.`,correct:!1},{text:`The conclusion`,explanation:`Background Information cung cấp bối cảnh trước luận điểm, không phải phần kết bài.`,correct:!1},{text:`The evidence`,explanation:`Evidence là dẫn chứng để hỗ trợ luận điểm, không phải thông tin nền khái quát.`,correct:!1}]},{q:`In a standard single-topic paragraph, should there be two Topic Sentences? ✌️`,a:[{text:`No, it confuses the reader`,correct:!0,explanation:`Một đoạn tập trung vào một ý chính nên có một Topic Sentence để định hướng thống nhất.`},{text:`Yes, always`,explanation:`Một đoạn chuẩn không mặc nhiên cần hai câu chủ đề; hai câu có thể làm trọng tâm bị chia đôi.`,correct:!1},{text:`Yes, if it's long`,explanation:`Đoạn dài vẫn cần giữ một ý chính; nếu có ý mới nên tách thành đoạn khác.`,correct:!1},{text:`Only in stories`,explanation:`Thể loại kể chuyện không tạo ra quy tắc bắt buộc phải có hai Topic Sentence.`,correct:!1}]},{q:`Which is a cohesive device? 🔗`,a:[{text:`Pronouns (he, she, it)`,correct:!0,explanation:`Đại từ giúp liên kết câu và tránh lặp từ.`},{text:`Nouns only`,explanation:`Pronouns liên kết bằng cách thay thế danh từ đã nêu; cohesive device không chỉ gồm danh từ.`,correct:!1},{text:`Verbs only`,explanation:`Động từ diễn tả hành động, nhưng không tự nó tạo phép quy chiếu như he/she/it.`,correct:!1},{text:`Adjectives`,explanation:`Tính từ mô tả danh từ, không thay thế các đối tượng để nối ý giữa các câu.`,correct:!1}]},{q:`In 'Cause and Effect' essays, we explain: 💥`,a:[{text:`Reasons and Results`,correct:!0,explanation:`Nguyên nhân và Kết quả.`},{text:`Similarities`,explanation:`Cause-and-effect essay giải thích lý do và hệ quả, không tập trung so sánh điểm giống nhau.`,correct:!1},{text:`Stories`,explanation:`Kể chuyện là narrative writing, không phải mục tiêu của bài nguyên nhân–kết quả.`,correct:!1},{text:`Descriptions`,explanation:`Mô tả đặc điểm thuộc descriptive writing, không trả lời quan hệ vì sao và kết quả gì.`,correct:!1}]},{q:`In 'Compare and Contrast' essays, we look for: ⚖️`,a:[{text:`Similarities and Differences`,correct:!0,explanation:`So sánh (giống) và Đối chiếu (khác).`},{text:`Time order`,explanation:`Compare-and-contrast essay đặt trọng tâm vào điểm giống và khác, không phải trình tự thời gian.`,correct:!1},{text:`Definitions`,explanation:`Định nghĩa có thể xuất hiện nhưng không phải mục tiêu chính của compare-and-contrast.`,correct:!1},{text:`Problems`,explanation:`Problems gợi bài problem–solution, không phải cặp điểm giống và khác được hỏi.`,correct:!1}]},{q:`A 'Transition' serves as a: 🌉`,a:[{text:`Bridge between ideas`,correct:!0,explanation:`Từ nối đóng vai trò như cây cầu liên kết các ý.`},{text:`Wall between ideas`,explanation:`Transition nối các ý như một cây cầu, không ngăn cách chúng như một bức tường.`,correct:!1},{text:`Topic sentence`,explanation:`Transition là cầu nối giữa các ý, không phải bản thân câu nêu ý chính của đoạn.`,correct:!1},{text:`Mistake`,explanation:`Transition là thiết bị liên kết có chủ đích, không phải lỗi viết.`,correct:!1}]},{q:`Which sentence works best as a hook at the start of an introduction? 🚀`,a:[{text:`Have you ever wondered why the sky is blue?`,correct:!0,explanation:`Đây là câu hỏi gợi tò mò, phù hợp làm Hook mở đầu.`},{text:`That is why the sky is blue.`,explanation:`Câu này kết luận một lập luận đã được giải thích, không mở đầu để thu hút.`,correct:!1},{text:`Secondly, light scatters.`,explanation:`'Secondly' báo hiệu một luận điểm trong thân bài, không phải Hook.`,correct:!1},{text:`For example, blue light.`,explanation:`Đây chỉ là mảnh chi tiết, không phải câu mở đầu hoàn chỉnh.`,correct:!1}]},{q:`What is 'Chronological Order'? 🕰️`,a:[{text:`Order of time`,correct:!0,explanation:`Chronological Order sắp xếp sự kiện theo thứ tự xảy ra trong thời gian.`},{text:`Order of importance`,explanation:`Chronological Order sắp xếp theo thời gian; order of importance là tiêu chí khác.`,correct:!1},{text:`Random order`,explanation:`Chronological order sắp xếp theo thời gian, trái với thứ tự ngẫu nhiên.`,correct:!1},{text:`Spatial order`,explanation:`Spatial order sắp xếp theo vị trí, không theo trước–sau của thời gian.`,correct:!1}]},{q:`What is 'Spatial Order'? 🗺️`,a:[{text:`Order by location/space`,correct:!0,explanation:`Trình tự không gian (tả từ trái sang phải, trên xuống dưới...).`},{text:`Time order`,explanation:`Spatial order mô tả vị trí trong không gian, không phải trình tự thời gian.`,correct:!1},{text:`Logical order`,explanation:`Logical order là quan hệ lập luận rộng hơn, không chỉ báo vị trí vật thể.`,correct:!1},{text:`Alphabetical order`,explanation:`Alphabetical order dựa trên chữ cái, không dựa trên vị trí trong không gian.`,correct:!1}]},{q:`Which word signals 'Spatial Order'? 📍`,a:[{text:`Behind`,correct:!0,explanation:`'Behind' (Phía sau) chỉ vị trí.`},{text:`Then`,explanation:`Sai (Thời gian). Cách dùng phù hợp trong câu này là “Behind”.`,correct:!1},{text:`Because`,explanation:`'Because' nêu nguyên nhân, còn câu hỏi yêu cầu từ chỉ Chronological/Spatial order.`,correct:!1},{text:`However`,explanation:`Sai (Đối lập). Cách dùng phù hợp trong câu này là “Behind”.`,correct:!1}]},{q:`Which word signals 'Chronological Order'? 📅`,a:[{text:`After that`,correct:!0,explanation:`'After that' (Sau đó) chỉ thời gian.`},{text:`Beside`,explanation:`'Beside' chỉ vị trí, không chỉ bước tiếp theo trong chuỗi thời gian.`,correct:!1},{text:`Therefore`,explanation:`'Therefore' báo kết quả, không phải mốc thời gian như 'After that'.`,correct:!1},{text:`For example`,explanation:`'For example' giới thiệu minh họa, không sắp xếp sự kiện theo thời gian.`,correct:!1}]},{q:`Correct the sentence: 'Walking home. I saw a dog.' 🐕`,a:[{text:`Walking home, I saw a dog.`,correct:!0,explanation:`Nối cụm phân từ với mệnh đề chính bằng dấu phẩy.`},{text:`Walking home. And I saw a dog.`,explanation:`Dấu chấm tách cụm phân từ khỏi mệnh đề chính, tạo mảnh câu; cần dấu phẩy để nối đúng.`,correct:!1},{text:`Walking home I saw a dog.`,explanation:`Thiếu dấu phẩy. Cách dùng phù hợp trong câu này là “Walking home, I saw a dog.”.`,correct:!1},{text:`Saw a dog walking home.`,explanation:`Thiếu chủ ngữ ở mệnh đề chính, nên không sửa được dangling/misplaced modifier.`,correct:!1}]},{q:`Identify the main idea: 'Gold is expensive. It is shiny. People make jewelry from it.' 💍`,a:[{text:`Properties and uses of gold`,correct:!0,explanation:`Đoạn văn nói về tính chất và công dụng của vàng.`},{text:`Gold is yellow`,explanation:`Đây chỉ là một thuộc tính cụ thể, hẹp hơn ý chính bao quát về properties and uses of gold.`,correct:!1},{text:`Jewelry is cheap`,explanation:`Câu nói về jewelry vừa lệch đối tượng vừa không tóm tắt các thuộc tính và công dụng của gold.`,correct:!1},{text:`People like silver`,explanation:`Câu chuyển sang silver, không phản ánh main idea về gold.`,correct:!1}]},{q:`Which sentence has a 'Parallel Structure' error? ⚖️`,a:[{text:`I like swimming, running, and to bike.`,correct:!0,explanation:`Lỗi cấu trúc song song: đang dùng V-ing thì phải là 'biking'.`},{text:`I like swimming, running, and biking.`,explanation:`Ba thành phần đều là V-ing, nên đã song song đúng.`,correct:!1},{text:`She is smart, funny, and kind.`,explanation:`Ba tính từ cùng chức năng sau 'is', tạo parallel structure đúng.`,correct:!1},{text:`He sings and dances.`,explanation:`Hai động từ cùng dạng hiện tại sau chủ ngữ 'He', nên song song đúng.`,correct:!1}]},{q:`Which is an 'Opinion'? 💭`,a:[{text:`Pizza is the best food.`,correct:!0,explanation:`Đây là quan điểm cá nhân.`},{text:`Pizza originated in Italy.`,explanation:`Sai. Đây là sự thật (Fact).`,correct:!1},{text:`Pizza is made with dough.`,explanation:`Đây là thông tin có thể kiểm chứng về thành phần pizza, nên là Fact chứ không phải Opinion.`,correct:!1},{text:`I ate pizza yesterday.`,explanation:`Đây là một sự kiện cá nhân có thể đúng hoặc sai, không phải đánh giá chủ quan về pizza.`,correct:!1}]},{q:`Which is a 'Fact'? 📚`,a:[{text:`Water boils at 100 degrees Celsius at standard atmospheric pressure.`,correct:!0,explanation:`Nhiệt độ sôi phụ thuộc áp suất; phát biểu đã nêu điều kiện chuẩn.`},{text:`Water tastes good.`,explanation:`'Tastes good' phụ thuộc cảm nhận cá nhân, nên là Opinion.`,correct:!1},{text:`Everyone loves water.`,explanation:`Đây là khái quát không thể kiểm chứng cho mọi người.`,correct:!1},{text:`Cold water is better.`,explanation:`'Better' là đánh giá so sánh không có tiêu chí khách quan cố định, nên là Opinion.`,correct:!1}]},{q:`What helps make a paragraph 'flow' smoothly? 🌊`,a:[{text:`Transitions`,correct:!0,explanation:`Từ nối giúp đoạn văn trôi chảy.`},{text:`Short sentences only`,explanation:`Flow cần transitions và liên kết ý; chỉ dùng câu ngắn không bảo đảm mạch lạc.`,correct:!1},{text:`Big words`,explanation:`Từ vựng khó không tự tạo mạch lạc; cần các từ nối thể hiện quan hệ giữa ý.`,correct:!1},{text:`No punctuation`,explanation:`Bỏ toàn bộ dấu câu làm câu khó đọc và không tạo dòng ý trôi chảy.`,correct:!1}]},{q:`If you want to emphasize a point, use: ❗`,a:[{text:`In fact`,correct:!0,explanation:`'In fact' (Thực tế là) dùng để nhấn mạnh sự thật.`},{text:`Although`,explanation:`Although mở nhượng bộ, không phải cụm nhấn mạnh trực tiếp như 'In fact'.`,correct:!1},{text:`Unless`,explanation:`Unless đặt điều kiện phủ định, không nhấn mạnh một sự thật hay luận điểm.`,correct:!1},{text:`Or`,explanation:`Or biểu thị lựa chọn giữa các khả năng, không tạo sắc thái nhấn mạnh.`,correct:!1}]},{q:`Which sentence is a 'comma splice' ? ❌`,a:[{text:`It is late, we should go.`,correct:!0,explanation:`Hai mệnh đề độc lập không thể nối nhau chỉ bằng dấu phẩy.`},{text:`It is late; we should go.`,explanation:`Chấm phẩy nối đúng hai mệnh đề độc lập, nên đã sửa comma splice.`,correct:!1},{text:`It is late, so we should go.`,explanation:`Liên từ 'so' nối nguyên nhân–kết quả và làm dấu phẩy hợp lệ.`,correct:!1},{text:`Because it is late, we should go.`,explanation:`Mệnh đề phụ đứng đầu được nối bằng dấu phẩy, nên không phải comma splice.`,correct:!1}]},{q:`How to fix a 'comma splice'? 🛠️`,a:[{text:`Use a period, semicolon, or conjunction`,correct:!0,explanation:`Dùng dấu chấm, chấm phẩy hoặc từ nối (fanboys).`},{text:`Add more commas`,explanation:`Thêm dấu phẩy không sửa được comma splice; cần dấu chấm, chấm phẩy hoặc liên từ.`,correct:!1},{text:`Remove the subject`,explanation:`Xóa chủ ngữ làm câu thiếu thành phần chính, không sửa được comma splice.`,correct:!1},{text:`Capitalize all words`,explanation:`Viết hoa không giải quyết việc nối hai mệnh đề độc lập bằng dấu phẩy.`,correct:!1}]},{q:`What is the 'topic' of a paragraph? 📌`,a:[{text:`The subject the paragraph is about`,correct:!0,explanation:`Chủ đề là đối tượng chính được nói đến.`},{text:`The first word`,explanation:`Topic là chủ đề nội dung, không phải vị trí của từ đầu tiên.`,correct:!1},{text:`The last word`,explanation:`Topic không được xác định bằng vị trí từ cuối, mà bằng chủ đề đoạn nói đến.`,correct:!1},{text:`The grammar`,explanation:`Topic là chủ đề nội dung, không phải hệ thống ngữ pháp của đoạn.`,correct:!1}]},{q:`What is the 'controlling idea' of a topic sentence? 🎮`,a:[{text:`What specifically is said about the topic`,correct:!0,explanation:`Ý kiểm soát giới hạn phạm vi bàn luận về chủ đề.`},{text:`The title`,explanation:`Controlling idea nói cụ thể về topic, không chỉ lặp lại tiêu đề.`,correct:!1},{text:`The hook`,explanation:`Hook thu hút người đọc ở phần mở đầu, không xác định điều cụ thể được nói về topic.`,correct:!1},{text:`The conclusion`,explanation:`Conclusion tổng hợp cuối bài, không phải phần kiểm soát ý trong Topic Sentence.`,correct:!1}]},{q:`Analyze: 'Smoking is bad for health.' - 'Smoking' is the ___. 🚬`,a:[{text:`Topic`,correct:!0,explanation:`'Smoking' là chủ đề.`},{text:`Controlling idea`,explanation:`Sai. 'Bad for health' là controlling idea.`,correct:!1},{text:`Detail`,explanation:`'Smoking' là chủ đề đang được nói đến, không phải một chi tiết minh họa.`,correct:!1},{text:`Transition`,explanation:`'Smoking' không nối các câu; nó là danh từ chỉ chủ đề của phát biểu.`,correct:!1}]},{q:`Analyze: 'Smoking is bad for health.' - 'bad for health' is the ___. 🏥`,a:[{text:`Controlling idea`,correct:!0,explanation:`Phần này giới hạn nội dung bàn luận (tác hại).`},{text:`Topic`,explanation:`'Bad for health' nêu nhận định cụ thể về smoking, đó là controlling idea chứ không phải topic.`,correct:!1},{text:`Detail`,explanation:`Cụm này kiểm soát hướng phát triển của câu, không phải ví dụ  cần phát triển, không bắt buộc đúng một trang.`,correct:!1},{text:`1 sentence only`,explanation:`Một đoạn thường cần nhiều câu để phát triển main idea, không chỉ một câu.`,correct:!1}]},{q:`Highly formal academic writing generally prefers: 👎`,a:[{text:`Full forms such as 'cannot' and 'do not'`,correct:!0,explanation:`Nhiều phong cách học thuật trang trọng ưu tiên dạng đầy đủ, dù quy ước có thể khác theo lĩnh vực.`},{text:`Removing all passive constructions`,explanation:`Bị động vẫn hữu ích khi phù hợp trọng tâm.`,correct:!1},{text:`Avoiding all connectors`,explanation:`Từ nối giúp tạo liên kết.`,correct:!1},{text:`Avoiding nouns`,explanation:`Không có quy tắc này.`,correct:!1}]},{q:`Which is a 'Problem-Solution' essay? 🧩`,a:[{text:`Identifies an issue and proposes a fix`,correct:!0,explanation:`Nêu vấn đề và đề xuất giải pháp.`},{text:`Tells a funny story`,explanation:`Problem–Solution essay xác định vấn đề và đề xuất cách giải quyết, không kể chuyện hài.`,correct:!1},{text:`Describes a person`,explanation:`Mô tả người thuộc descriptive writing, không phải cấu trúc problem–solution.`,correct:!1},{text:`Compares two things`,explanation:`So sánh hai đối tượng thuộc compare-and-contrast essay, không phải problem–solution.`,correct:!1}]},{q:`In an email, 'Dear Mr. Smith' is the: ✉️`,a:[{text:`Salutation`,correct:!0,explanation:`Lời chào đầu thư. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`Closing`,explanation:`'Dear Mr. Smith' mở đầu thư, nên là Salutation chứ không phải phần Closing.`,correct:!1},{text:`Body`,explanation:`Body chứa nội dung chính sau lời chào, không phải lời xưng hô.`,correct:!1},{text:`Subject`,explanation:`Subject nêu chủ đề email, thường nằm ở tiêu đề trước phần lời chào.`,correct:!1}]},{q:`In an email, 'Best regards' is the: 👋`,a:[{text:`Closing`,correct:!0,explanation:`Lời chào kết thư. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`Salutation`,explanation:`'Best regards' là lời kết, không phải lời chào mở đầu.`,correct:!1},{text:`Header`,explanation:`Header là phần thông tin đầu trang, không phải công thức kết thư.`,correct:!1},{text:`Signature`,explanation:`Signature là tên/ký tên sau lời kết, còn 'Best regards' chính là Closing.`,correct:!1}]},{q:`Which sentence implies 'Purpose'? 🎯`,a:[{text:`I study in order to pass the exam.`,correct:!0,explanation:`'In order to' chỉ mục đích.`},{text:`I study because I like it.`,explanation:`Câu này nêu nguyên nhân bằng 'because', không phải câu thể hiện mục đích học để đạt một kết quả.`,correct:!1},{text:`I study hard.`,explanation:`Câu này nói cách thức/mức độ học, không nêu mục đích đạt một kết quả.`,correct:!1},{text:`I study and play.`,explanation:`And chỉ nối hai hành động, không diễn tả purpose.`,correct:!1}]},{q:`Which word means 'Because of'? 🌧️`,a:[{text:`Due to`,correct:!0,explanation:`'Due to' + Noun phrase = Tại vì.`},{text:`Despite`,explanation:`Despite nghĩa là mặc dù, không tương đương trực tiếp với 'because of'.`,correct:!1},{text:`Although`,explanation:`Although mở mệnh đề nhượng bộ, không phải cụm giới từ mang nghĩa 'bởi vì'.`,correct:!1},{text:`So`,explanation:`So nghĩa là vì vậy/kết quả là, không phải 'because of'.`,correct:!1}]},{q:`What is 'Proofreading'? 🔍`,a:[{text:`Checking for errors in the final draft`,correct:!0,explanation:`Đọc rà soát lỗi lần cuối.`},{text:`Writing the first draft`,explanation:`Proofreading diễn ra sau khi đã có bản nháp, không phải bước tạo bản đầu tiên.`,correct:!1},{text:`Making an outline`,explanation:`Outline là bước chuẩn bị trước khi viết, còn proofreading kiểm tra bản cuối.`,correct:!1},{text:`Researching`,explanation:`Researching là hoạt động tìm hiểu, không phải thao tác kiểm tra lỗi ở bản nháp cuối.`,correct:!1}]},{q:`Which tool helps organize ideas before writing? 🕸️`,a:[{text:`Outline`,correct:!0,explanation:`Dàn ý giúp sắp xếp ý tưởng.`},{text:`Dictionary`,explanation:`Dictionary tra từ nhưng không phải công cụ chính để sắp xếp các ý trước khi viết.`,correct:!1},{text:`Printer`,explanation:`Printer chỉ in tài liệu, không giúp tạo cấu trúc ý tưởng.`,correct:!1},{text:`Pen`,explanation:`Pen là dụng cụ viết, không phải sơ đồ tổ chức ý như Outline.`,correct:!1}]},{q:`What should be in the 'Body Paragraphs'? 🏗️`,a:[{text:`Details, evidence, examples`,correct:!0,explanation:`Triển khai chi tiết, dẫn chứng, ví dụ.`},{text:`Thesis statement only`,explanation:`Body Paragraph cần details, evidence và examples; chỉ thesis là chưa đủ phát triển.`,correct:!1},{text:`New topics`,explanation:`Body Paragraph phát triển luận đề bằng chi tiết, không mở các chủ đề không liên quan.`,correct:!1},{text:`Greetings`,explanation:`Greetings thuộc email/thư, không phải thành phần lập luận của Body Paragraph.`,correct:!1}]},{q:`To show an alternative, use: 🛤️`,a:[{text:`Alternatively`,correct:!0,explanation:`Hoặc là / Một lựa chọn khác là.`},{text:`Consequently`,explanation:`Consequently báo kết quả, không giới thiệu một lựa chọn thay thế.`,correct:!1},{text:`Finally`,explanation:`Finally báo ý cuối trong trình tự, không nêu phương án khác.`,correct:!1},{text:`Likely`,explanation:`Likely diễn tả khả năng, không phải từ nối giới thiệu alternative.`,correct:!1}]},{q:`To conclude a point, use: 🔚`,a:[{text:`Thus`,correct:!0,explanation:`'Thus' (Như vậy/Do đó) dùng để chốt ý.`},{text:`Start`,explanation:`Start không báo hiệu kết luận; 'Thus' tóm tắt hệ quả/lập luận.`,correct:!1},{text:`Example`,explanation:`Example giới thiệu minh họa, không kết thúc một điểm lập luận.`,correct:!1},{text:`Or`,explanation:`Or biểu thị lựa chọn, không phải từ kết luận.`,correct:!1}]},{q:`Which is a generic transition? 🚶`,a:[{text:`Move on to`,correct:!0,explanation:`Chuyển sang (ý khác).`},{text:`Stay`,explanation:`Stay là động từ, không phải cụm chuyển ý chung để dẫn sang phần tiếp theo.`,correct:!1},{text:`Stop`,explanation:`Stop không tự tạo quan hệ chuyển đoạn hoặc trình tự ý.`,correct:!1},{text:`Break`,explanation:`Break là động từ nghĩa đen, không phải transition phrase 'Move on to'.`,correct:!1}]},{q:`What makes a title good? 🏷️`,a:[{text:`Catchy and relevant`,correct:!0,explanation:`Hấp dẫn và liên quan đến nội dung.`},{text:`Very long`,explanation:`Tiêu đề tốt nên ngắn gọn và liên quan, không cần kéo dài không cần thiết.`,correct:!1},{text:`Unrelated`,explanation:`Tiêu đề không liên quan sẽ không giúp người đọc đoán đúng nội dung.`,correct:!1},{text:`Boring`,explanation:`Một tiêu đề tốt cần thu hút ở mức phù hợp, không phải cố tình nhàm chán.`,correct:!1}]},{q:`Identify the error: 'Me and my friend went out.' 🚫`,a:[{text:`Subject pronoun error`,correct:!0,explanation:`Phải dùng 'My friend and I' làm chủ ngữ.`},{text:`Verb error`,explanation:`'Me' là đại từ tân ngữ; lỗi nằm ở vị trí chủ ngữ, không phải động từ.`,correct:!1},{text:`Noun error`,explanation:`Danh từ 'friend' không sai; vấn đề là dùng dạng tân ngữ 'me' làm chủ ngữ.`,correct:!1},{text:`Adjective error`,explanation:`Câu không chứa tính từ cần sửa; lỗi thuộc đại từ chủ ngữ.`,correct:!1}]},{q:`Identify the error: 'She don't like it.' 🚫`,a:[{text:`Subject-verb agreement`,correct:!0,explanation:`'She' đi với 'doesn't'.`},{text:`Word order`,explanation:`Các thành phần đứng đúng thứ tự; lỗi là hòa hợp chủ ngữ–động từ.`,correct:!1},{text:`Spelling`,explanation:`Không có từ nào viết sai; 'don't' sai vì chủ ngữ ngôi thứ ba số ít cần 'doesn't'.`,correct:!1},{text:`Punctuation`,explanation:`Dấu câu không gây ra lỗi; động từ phải hòa hợp với 'She'.`,correct:!1}]},{q:`A 'Dangling Modifier' happens when: 🪁`,a:[{text:`The subject of the modifier is missing`,correct:!0,explanation:`Chủ ngữ của cụm bổ nghĩa không khớp với chủ ngữ câu.`},{text:`The sentence is too short`,explanation:`Dangling modifier liên quan chủ thể của cụm bổ nghĩa, không phụ thuộc độ dài câu.`,correct:!1},{text:`There is no verb`,explanation:`Dangling modifier có thể xuất hiện dù câu vẫn có động từ; lỗi là chủ thể bị thiếu/không khớp.`,correct:!1},{text:`The spelling is wrong`,explanation:`Spelling không quyết định modifier có gắn đúng chủ thể hay không.`,correct:!1}]},{q:`Correct: 'Hungry, the burger was eaten.' 🍔`,a:[{text:`Hungry, I ate the burger.`,correct:!0,explanation:`Chủ ngữ 'I' khớp với trạng thái 'Hungry'.`},{text:`The burger ate me.`,explanation:`Câu đảo ngược nghĩa vô lý: burger không thể là chủ thể đang đói và ăn người.`,correct:!1},{text:`Eaten was the burger.`,explanation:`Câu bị động này không sửa dangling modifier vì vẫn không cho biết ai đang đói.`,correct:!1},{text:`Hungry burger.`,explanation:`Cụm này không cho biết ai đó đói và còn thiếu cấu trúc câu hoàn chỉnh để sửa dangling modifier.`,correct:!1}]},{q:`Which is a 'Complex Sentence'? 🧬`,a:[{text:`Although it rained, we played.`,correct:!0,explanation:`Gồm 1 mệnh đề độc lập và 1 mệnh đề phụ thuộc.`},{text:`It rained.`,explanation:`Sai. Simple sentence.`,correct:!1},{text:`It rained and we played.`,explanation:`Sai. Compound sentence.`,correct:!1},{text:`Rain implies wet.`,explanation:`Complex sentence cần mệnh đề phụ và mệnh đề chính; câu này chỉ có một mệnh đề.`,correct:!1}]},{q:`Which is a 'Compound Sentence'? 🔗`,a:[{text:`I like tea, and she likes coffee.`,correct:!0,explanation:`Gồm 2 mệnh đề độc lập nối bởi FANBOYS.`},{text:`I like tea.`,explanation:`Compound sentence cần hai mệnh đề độc lập nối bằng liên từ, còn câu này chỉ có một.`,correct:!1},{text:`Because I like tea, I drink it.`,explanation:`Có mệnh đề phụ 'Because' nên đây là complex sentence, không phải compound.`,correct:!1},{text:`Tea is good.`,explanation:`Đây chỉ là một mệnh đề đơn, không có hai independent clauses.`,correct:!1}]},{q:`FANBOYS stands for: 🌈`,a:[{text:`For, And, Nor, But, Or, Yet, So`,correct:!0,explanation:`Các từ nối dùng trong câu ghép.`},{text:`Food, Animals, Nouns...`,explanation:`FANBOYS là chữ viết tắt của các liên từ, không phải nhóm danh từ rời.`,correct:!1},{text:`Friends, Are, Nice...`,explanation:`Các từ này không giải thích tên viết tắt chuẩn của bảy liên từ phối hợp.`,correct:!1},{text:`Funny, And, New...`,explanation:`Chỉ 'And' trùng một từ, nhưng cả cụm không phải danh sách FANBOYS.`,correct:!1}]},{q:`What follows a 'Topic Sentence'? 🏃`,a:[{text:`Supporting sentences`,correct:!0,explanation:`Các câu bổ trợ theo sau để giải thích.`},{text:`Another topic sentence`,explanation:`Sau Topic Sentence chuẩn thường là supporting sentences, không mở thêm topic cạnh tranh.`,correct:!1},{text:`The title`,explanation:`Sau Topic Sentence thường là supporting sentences phát triển ý, không phải tiêu đề lặp lại.`,correct:!1},{text:`The end`,explanation:`Sau Topic Sentence cần câu bổ trợ phát triển ý, không phải cụm báo kết thúc.`,correct:!1}]},{q:`When should you start a new paragraph? 🆕`,a:[{text:`When you change to a new idea`,correct:!0,explanation:`Chuyển ý chính thì chuyển đoạn.`},{text:`Every sentence`,explanation:`Chỉ nên mở đoạn mới khi chuyển sang ý mới, không phải sau mọi câu.`,correct:!1},{text:`Never`,explanation:`Khi ý chính thay đổi, cần đoạn mới để giữ mạch lạc; không thể không bao giờ tách đoạn.`,correct:!1},{text:`After 10 words`,explanation:`Không có quy tắc cố định số từ; đoạn mới bắt đầu khi ý tưởng thay đổi.`,correct:!1}]},{q:`Which style is best for a science report? 🔬`,a:[{text:`Objective and factual`,correct:!0,explanation:`Khách quan và dựa trên sự thật.`},{text:`Emotional`,explanation:`Science report ưu tiên giọng khách quan, không dùng cảm xúc làm nền tảng trình bày.`,correct:!1},{text:`Funny`,explanation:`Sự hài hước không phải phong cách mặc định của báo cáo khoa học.`,correct:!1},{text:`Personal`,explanation:`Báo cáo khoa học dựa trên dữ kiện và phương pháp, không kể trải nghiệm cá nhân.`,correct:!1}]},{q:`Which style is best for a diary entry? 📔`,a:[{text:`Personal and informal`,correct:!0,explanation:`Cá nhân và thân mật.`},{text:`Academic`,explanation:`Diary entry ghi cảm xúc cá nhân, không cần phong cách học thuật khách quan.`,correct:!1},{text:`Formal`,explanation:`Nhật ký thường thân mật và riêng tư, không theo thể thức formal.`,correct:!1},{text:`Scientific`,explanation:`Diary entry thiên về trải nghiệm cá nhân, không phải báo cáo khoa học khách quan.`,correct:!1}]},{q:`What is 'Drafting'? 📝`,a:[{text:`Writing the first version`,correct:!0,explanation:`Viết bản thảo đầu tiên.`},{text:`Thinking`,explanation:`Drafting là viết ra phiên bản đầu tiên, không chỉ suy nghĩ trong đầu.`,correct:!1},{text:`Fixing grammar`,explanation:`Sửa grammar thuộc editing, diễn ra sau khi đã có bản nháp.`,correct:!1},{text:`Publishing`,explanation:`Drafting là viết phiên bản đầu tiên; publishing là phát hành sau khi hoàn thiện.`,correct:!1}]},{q:`Who is the 'Audience'? 👥`,a:[{text:`The people who read your writing`,correct:!0,explanation:`Đối tượng độc giả. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`The writer`,explanation:`Audience là người tiếp nhận bài viết, khác với người tạo ra bài viết.`,correct:!1},{text:`The teacher only`,explanation:`Audience có thể là nhiều nhóm người đọc, không chỉ riêng giáo viên.`,correct:!1},{text:`The paper`,explanation:`Audience là người đọc văn bản, không phải tờ giấy chứa văn bản.`,correct:!1}]},{q:`Why is 'Audience' important? 🎯`,a:[{text:`It determines tone and language`,correct:!0,explanation:`Biết độc giả là ai để chọn giọng văn phù hợp.`},{text:`It makes writing longer`,explanation:`Audience quyết định tone và language, không phải mục tiêu kéo dài văn bản.`,correct:!1},{text:`It doesn't matter`,explanation:`Người đọc ảnh hưởng trực tiếp cách chọn giọng điệu và từ ngữ.`,correct:!1},{text:`It costs money`,explanation:`Audience là yếu tố giao tiếp, không phải chi phí tài chính.`,correct:!1}]},{q:`To express 'Certainty', use: ✅`,a:[{text:`Undoubtedly`,correct:!0,explanation:`Chắc chắn/Không nghi ngờ gì.`},{text:`Perhaps`,explanation:`Perhaps diễn tả khả năng, không phải mức chắc chắn như 'Undoubtedly'.`,correct:!1},{text:`Maybe`,explanation:`Maybe làm giảm mức khẳng định, trái với yêu cầu diễn đạt certainty.`,correct:!1},{text:`Possibly`,explanation:`Possibly chỉ khả năng, không khẳng định chắc chắn một điều.`,correct:!1}]},{q:`To express 'Possibility', use: 🎲`,a:[{text:`Might`,correct:!0,explanation:`Có lẽ/Có thể. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`Must`,explanation:`Sai. 'Must' là động từ khuyết thiếu chỉ sự bắt buộc, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`Will`,explanation:`Sai. 'Will' là trợ động từ chỉ tương lai, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`Always`,explanation:`'Always' diễn tả mức chắc chắn tuyệt đối, trái với 'Might' chỉ khả năng.`,correct:!1}]},{q:`In 'Opinion' writing, avoid starting every sentence with: 🙅`,a:[{text:`I think...`,correct:!0,explanation:`Lặp lại 'I think' làm bài văn nhàm chán.`},{text:`The`,explanation:`Sai. 'The' là mạo từ xác định dùng cho danh từ đã được nhắc đến hoặc duy nhất, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`A`,explanation:`Sai. 'A' là mạo từ không xác định dùng trước phụ âm, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`It`,explanation:`Lặp 'I think' mới là vấn đề trong opinion writing; 'It' không phải cụm mở ý kiến bị hỏi.`,correct:!1}]},{q:`Use 'Firstly' for the first point, use ___ for the last. 🏁`,a:[{text:`Finally`,correct:!0,explanation:`Cuối cùng. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`At first`,explanation:`'At first' chỉ giai đoạn đầu, không phải từ dùng cho điểm cuối cùng.`,correct:!1},{text:`Second`,explanation:`'Second' báo điểm thứ hai, còn vị trí sau 'Firstly' và trước kết thúc cần 'Finally'.`,correct:!1},{text:`Next`,explanation:`'Next' dùng cho trình tự; câu hỏi cần từ chỉ bước cuối là 'Finally'.`,correct:!1}]},{q:`Which is correct? 'The book, that I read...' 📚`,a:[{text:`Incorrect. Remove comma or use 'which'`,correct:!0,explanation:`Mệnh đề quan hệ với 'that' không dùng dấu phẩy.`},{text:`Correct`,explanation:`Câu hỏi hỏi về lỗi của mệnh đề quan hệ có dấu phẩy, không yêu cầu chọn nhãn 'Correct'.`,correct:!1},{text:`Add more commas`,explanation:`Câu quan hệ có dấu phẩy sai cần đổi cấu trúc hoặc đại từ, không thêm phẩy tùy ý.`,correct:!1},{text:`Change book to books`,explanation:`'The book which I read' nói một cuốn sách xác định; đổi số nhiều không sửa quan hệ defining/non-defining.`,correct:!1}]},{q:`Which is correct? 'The book which I read...' 📖`,a:[{text:`Correct in a defining context`,correct:!0,explanation:`Không có dấu phẩy, 'which I read' là mệnh đề quan hệ xác định bổ nghĩa cho vật 'book'.`},{text:`Use 'who'`,explanation:`'Who' dùng cho người, không dùng để thay cho 'book'.`,correct:!1},{text:`Use 'where'`,explanation:`'Where' dùng cho nơi chốn, không dùng cho danh từ 'book'.`,correct:!1},{text:`Use 'when'`,explanation:`'When' dùng cho thời điểm, không thay thế đại từ quan hệ chỉ vật ở đây.`,correct:!1}]},{q:`Paragraphs need visual separation using: 👀`,a:[{text:`Indentation or line spacing`,correct:!0,explanation:`Thụt đầu dòng hoặc cách dòng.`},{text:`Colors`,explanation:`Màu sắc không phải cách tách các đoạn văn trong tài liệu thông thường.`,correct:!1},{text:`Pictures`,explanation:`Paragraphs được phân tách bằng định dạng chữ, không bắt buộc phải có hình ảnh.`,correct:!1},{text:`Nothing`,explanation:`Không có dấu hiệu tách đoạn sẽ làm văn bản khó đọc và mất cấu trúc thị giác.`,correct:!1}]},{q:`A 'Rhetorical Question' is used to: ❓`,a:[{text:`Make a point, not get an answer`,correct:!0,explanation:`Câu hỏi tu từ dùng để nhấn mạnh, không cần trả lời.`},{text:`Ask for information`,explanation:`Rhetorical question nhằm tạo điểm nhấn, không nhất thiết chờ câu trả lời thông tin.`,correct:!1},{text:`Confuse the reader`,explanation:`Rhetorical question cần làm rõ/nhấn mạnh ý, không nhằm gây nhầm lẫn.`,correct:!1},{text:`End the essay`,explanation:`Hook thường ở mở đầu; dùng nó để kết thúc không đúng chức năng.`,correct:!1}]},{q:`Which word adds emphasis? 💥`,a:[{text:`Significantly`,correct:!0,explanation:`Đáng kể/Quan trọng. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`Normally`,explanation:`Normally chỉ tần suất/thói quen, không tạo sắc thái nhấn mạnh.`,correct:!1},{text:`Slightly`,explanation:`Slightly làm giảm mức độ, trái với ý nhấn mạnh mạnh hơn.`,correct:!1},{text:`Randomly`,explanation:`Randomly chỉ sự ngẫu nhiên, không nhấn mạnh tầm quan trọng của điểm được nêu.`,correct:!1}]},{q:`The 'Main Idea' is often found in the: 📍`,a:[{text:`First or last sentence`,correct:!0,explanation:`Ý chính thường ở đầu hoặc cuối đoạn.`},{text:`Middle only`,explanation:`Ý chính thường được neo ở đầu hoặc cuối đoạn, không chỉ xuất hiện ở giữa.`,correct:!1},{text:`Nowhere`,explanation:`Một đoạn mạch lạc phải có ý chính được nhận diện, không thể không có vị trí nào.`,correct:!1},{text:`Margins`,explanation:`Margins là khoảng trắng quanh chữ, không phải nơi chứa Main Idea.`,correct:!1}]},{q:`What is 'Paraphrasing'? 🦜`,a:[{text:`Rewriting ideas in your own words`,correct:!0,explanation:`Diễn giải lại ý bằng từ ngữ của mình.`},{text:`Copying exactly`,explanation:`Copy nguyên văn không phải paraphrasing và có thể dẫn đến plagiarism nếu thiếu trích dẫn.`,correct:!1},{text:`Deleting`,explanation:`Paraphrasing vẫn giữ ý chính, không đơn giản là xóa nội dung.`,correct:!1},{text:`Translating`,explanation:`Dịch chuyển ngôn ngữ không đồng nghĩa diễn đạt lại ý bằng từ ngữ của chính mình.`,correct:!1}]},{q:`In a formal academic essay, should slang be used as ordinary wording? 🎓`,a:[{text:`No`,correct:!0,explanation:`Không dùng tiếng lóng trong văn học thuật.`},{text:`Yes`,explanation:`Trong academic writing chuẩn, slang không được mặc nhiên chấp nhận.`,correct:!1},{text:`Sometimes`,explanation:`Câu hỏi về quy tắc chung của văn phong học thuật, không phải ngoại lệ tùy lúc.`,correct:!1},{text:`Always`,explanation:`'Always' không phải lý do để cấm slang; câu hỏi hỏi về quy tắc văn phong học thuật.`,correct:!1}]},{q:`Which is a 'Specific Detail'? 🔍`,a:[{text:`The temperature was 30 degrees.`,correct:!0,explanation:`Số liệu cụ thể. Đây là ệt mức độ nhanh của hành động.`,correct:!1}]},{q:`Avoid 'repetition' of: 🔁`,a:[{text:`The same words`,correct:!0,explanation:`Lặp từ gây nhàm chán.`},{text:`Good ideas`,explanation:`Repetition cần tránh là lặp từ ngữ không cần thiết, không phải loại bỏ ý tưởng tốt.`,correct:!1},{text:`Punctuation marks`,explanation:`Sai: bài hỏi trình lặp từ ngữ; dấu câu không phải đối tượng của lỗi lặp từ.`,correct:!1},{text:`Grammar rules`,explanation:`Quy tắc ngữ pháp phải được tuân thủ; không phải thứ cần tránh lặp lại như từ ngữ.`,correct:!1}]},{q:`What is a 'synonym'? 👯`,a:[{text:`A word with similar meaning`,correct:!0,explanation:`Từ đồng nghĩa. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`A word with opposite meaning`,explanation:`Synonym có nghĩa tương tự; từ trái nghĩa là antonym.`,correct:!1},{text:`A wrong word`,explanation:`Synonym là quan hệ nghĩa, không phải nhãn cho một từ dùng sai.`,correct:!1},{text:`A long word`,explanation:`Độ dài chữ không quyết định hai từ có nghĩa tương tự hay không.`,correct:!1}]},{q:`Use synonyms to: 🛠️`,a:[{text:`Improve vocabulary variety`,correct:!0,explanation:`Tăng sự đa dạng từ vựng.`},{text:`Confuse people`,explanation:`Synonyms nhằm tạo đa dạng từ vựng nhưng vẫn giữ nghĩa, không nhằm gây nhầm lẫn.`,correct:!1},{text:`Make text shorter`,explanation:`Synonyms tăng đa dạng từ vựng; không có mục tiêu bắt buộc làm văn bản ngắn hơn.`,correct:!1},{text:`Make text longer`,explanation:`Dùng synonym không nhằm kéo dài bài một cách máy móc.`,correct:!1}]},{q:`In a formal letter, where is the date? 📅`,a:[{text:`Top`,correct:!0,explanation:`Thường ở trên cùng. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`Bottom`,explanation:`Trong formal letter, ngày thường đặt ở phần đầu, không phải cuối thư.`,correct:!1},{text:`Middle`,explanation:`Ngày không nằm giữa nội dung thư; nó thuộc phần đầu của formal letter.`,correct:!1},{text:`Back`,explanation:`'Back' không phải vị trí quy ước để đặt ngày trong thư trang à cụm danh từ, không có cấu trúc so sánh 'as ... as'.`,correct:!1}]},{q:`Which is a direct comparison that equates one thing with another (a Metaphor)? 🎭`,a:[{text:`Time is money`,correct:!0,explanation:`Đây là ẩn dụ trực tiếp: thời gian được đồng nhất với tiền, không dùng 'like/as'.`},{text:`Time is like money`,explanation:`Có 'like' nên đây là phép so sánh (Simile), không phải ẩn dụ trực tiếp.`,correct:!1},{text:`Time passes quickly`,explanation:`Đây là mệnh đề nghĩa đen về tốc độ trôi qua, không phải phép đồng nhất ẩn dụ.`,correct:!1},{text:`Spend money`,explanation:`Đây là cụm động từ nghĩa đen, không tạo phép so sánh giữa hai sự vật.`,correct:!1}]},{q:`Transition for 'Exception': ⚠️`,a:[{text:`Except for`,correct:!0,explanation:`Ngoại trừ. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`Including`,explanation:`Including đưa thêm thành phần vào nhóm, không nêu ngoại lệ như 'Except for'.`,correct:!1},{text:`Also`,explanation:`Also bổ sung ý, không giới hạn một trường hợp ngoại lệ.`,correct:!1},{text:`And`,explanation:`And nối hai thành phần cùng loại, không mang nghĩa 'ngoại trừ'.`,correct:!1}]},{q:`Transition for 'Clarification': 🔦`,a:[{text:`That is to say`,correct:!0,explanation:`Tức là/Nói cách khác.`},{text:`However`,explanation:`However diễn tả đối lập, còn 'That is to say' cần cụm diễn giải cùng nghĩa.`,correct:!1},{text:`Next`,explanation:`'Next' chuyển sang bước kế tiếp, không làm rõ hoặc diễn giải lại ý trước.`,correct:!1},{text:`Because`,explanation:`'Because' giới thiệu nguyên nhân, không phải cụm dùng để làm rõ hoặc diễn đạt lại ý.`,correct:!1}]},{q:`Choose the punctuation for the enthusiastic greeting 'Hello world'. 🌍`,a:[{text:`Hello, world!`,correct:!0,explanation:`Dấu phẩy ngăn cách từ cảm thán hoặc xưng hô.`},{text:`Hello world`,explanation:`Thiếu dấu. Cách dùng phù hợp trong câu này là “Hello, world!”.`,correct:!1},{text:`Hello. World`,explanation:`Ngắt quãng sai. Cách dùng phù hợp trong câu này là “Hello, world!”.`,correct:!1},{text:`Hello; world`,explanation:`Lời chào ngắn cần dấu phẩy giữa 'Hello' và người được gọi, không dùng chấm phẩy.`,correct:!1}]},{q:`Which sentence is a 'Statement'? 😐`,a:[{text:`The sky is blue.`,correct:!0,explanation:`Câu trần thuật. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`Is the sky blue?`,explanation:`Sai (Câu hỏi). Cách dùng phù hợp trong câu này là “The sky is blue.”.`,correct:!1},{text:`Look at the sky!`,explanation:`Sai (Mệnh lệnh). Cách dùng phù hợp trong câu này là “The sky is blue.”.`,correct:!1},{text:`What a blue sky!`,explanation:`Sai (Cảm thán). Cách dùng phù hợp trong câu này là “The sky is blue.”.`,correct:!1}]},{q:`Which sentence is an 'Exclamation'? ❗`,a:[{text:`What a beautiful day!`,correct:!0,explanation:`Câu cảm thán. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`It is a beautiful day.`,explanation:`Đây là câu trần thuật, không có dấu chấm than hoặc cấu trúc cảm thán.`,correct:!1},{text:`Is it a beautiful day?`,explanation:`Dấu hỏi cho biết đây là câu nghi vấn, không phải exclamation.`,correct:!1},{text:`Be beautiful.`,explanation:`Đây là câu mệnh lệnh, không phải câu cảm thán kết thúc bằng dấu chấm than.`,correct:!1}]},{q:`What is 'Tone'? 🎵`,a:[{text:`The writer's attitude`,correct:!0,explanation:`Thái độ/giọng điệu của người viết.`},{text:`The volume`,explanation:`Tone nói về thái độ của người viết, không phải âm lượng vật lý.`,correct:!1},{text:`The font size`,explanation:`Tone là thái độ, không phải kích thước chữ.`,correct:!1},{text:`The paper color`,explanation:`Màu giấy không thể hiện thái độ của người viết.`,correct:!1}]},{q:`What is 'Mood'? ☁️`,a:[{text:`The feeling the reader gets`,correct:!0,explanation:`Cảm xúc mà người đọc cảm nhận được.`},{text:`The grammar`,explanation:`Mood là cảm giác người đọc nhận được, không phải hệ thống ngữ pháp.`,correct:!1},{text:`The length`,explanation:`Độ dài văn bản không đồng nghĩa cảm giác/mood mà tác phẩm tạo ra.`,correct:!1},{text:`The topic`, dience.`,correct:!1},{text:`Ink color`,explanation:`Reader's perspective liên quan người đọc, không phụ thuộc màu mực.`,correct:!1}]},{q:`What is 'Ambiguity'? 🌫️`,a:[{text:`Unclear meaning`,correct:!0,explanation:`Sự mơ hồ, không rõ nghĩa.`},{text:`Clear meaning`,explanation:`Clear meaning là mục tiêu của writing, không phải ambiguity.`,correct:!1},{text:`Long sentences`,explanation:`Câu dài có thể rõ hoặc mơ hồ; độ dài tự nó không định nghĩa ambiguity.`,correct:!1},{text:`Short words`,explanation:`Từ ngắn không đồng nghĩa với unclear meaning; ambiguity nằm ở cách diễn đạt.`,correct:!1}]},{q:`Avoid ambiguity to ensure: 💎`,a:[{text:`Clarity`,correct:!0,explanation:`Sự rõ ràng. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`Length`,explanation:`Linking words tạo Cohesion, không tự quyết định độ dài của văn bản.`,correct:!1},{text:`Difficulty`,explanation:`Avoid ambiguity để tăng clarity, không nhằm làm bài viết khó hơn.`,correct:!1},{text:`Mystery`,explanation:`Sai (trừ văn kể chuyện).`,correct:!1}]},{q:`Which sentence has a 'Parallel Structure'? ⚖️`,a:[{text:`She likes cooking, reading, and sleeping.`,correct:!0,explanation:`Cùng dùng V-ing. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`She likes cooking, reading, and to sleep.`,explanation:`Danh sách trộn V-ing với to-infinitive; cần cùng dạng như cooking/reading/sleeping.`,correct:!1},{text:`She likes to cook, reading, and sleep.`,explanation:`Các thành phần không đồng dạng: to cook, reading và sleep trộn cấu trúc.`,correct:!1},{text:`She likes cook, read, sleep.`,explanation:`Sai cấu trúc. Phương án 'She likes cook, read, sleep.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`Identify the 'Thesis': 📝`,a:[{text:`Pollution is a serious problem requiring global action.`,correct:!0,explanation:`Nêu vấn đề và quan điểm/giải pháp bao quát.`},{text:`I see trash.`,explanation:`Câu này là chi tiết quan sát, chưa nêu luận đề bao quát về ô nhiễm.`,correct:!1},{text:`Pollution is bad.`,explanation:`Sai (Quá đơn giản). Cách dùng phù hợp trong câu này là “Pollution is a serious problem requiring global action.”.`,correct:!1},{text:`Cars make smoke.`,explanation:`Câu chỉ nêu một nguyên nhân/chi tiết cụ thể, không phải Thesis bao quát cần xác định.`,correct:!1}]},{q:`Which technique most directly creates immediate suspense in a narrative? 😮`,a:[{text:`Short, choppy sentences`,correct:!0,explanation:`Câu ngắn, ngắt quãng tạo nhịp điệu dồn dập và cảm giác khẩn cấp.`},{text:`Very long descriptions`,explanation:`Mô tả dài thường làm chậm nhịp kể, không trực tiếp tạo cảm giác khẩn cấp.`,correct:!1},{text:`Scientific facts`,explanation:`Dữ kiện khoa học cung cấp thông tin nhưng tự nó không tạo nhịp hồi hộp tức thời.`,correct:!1},{text:`Lists`,explanation:`Danh sách liệt kê thiếu nhịp kể và xung đột cần thiết để tạo suspense.`,correct:!1}]},{q:`Which is a 'Fable'? 🐇`,a:[{text:`A story with a moral, often with animals`,correct:!0,explanation:`Truyện ngụ ngôn. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`A true history`,explanation:`Fable thường là truyện ngụ ngôn, không phải bản ghi lịch sử có thật.`,correct:!1},{text:`A news report`,explanation:`News report đưa tin sự kiện, không nhất thiết có bài học đạo đức và con vật nhân hóa.`,correct:!1},{text:`A recipe`,explanation:`Fable là truyện có bài học, không phải danh sách nguyên liệu và bước nấu ăn.`,correct:!1}]},{q:`A 'Biography' is about: 👤`,a:[{text:`Another person's life`,correct:!0,explanation:`Tiểu sử (viết về người khác).`},{text:`Your own life`,explanation:`Sai (Autobiography).`,correct:!1},{text:`Animals`,explanation:`Biography có thể nói về người, không mặc định là tiểu sử loài vật.`,correct:!1},{text:`Science`,explanation:`Biography tập trung cuộc đời một người, không phải lĩnh vực khoa học nói chung.`,correct:!1}]},{q:`An 'Autobiography' is about: 🤳`,a:[{text:`Your own life`,correct:!0,explanation:`Tự truyện. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc đư
