const fullQuestionBank=[{q:`You ___ brush your teeth twice a day.`,a:[{text:`should`,correct:!0,explanation:`Dùng 'should' để đưa ra lời khuyên.`},{text:`mustn't`,explanation:`Sai. 'mustn't brush' nghĩa là bị cấm đánh răng, trái với lời khuyên chăm sóc răng.`,correct:!1},{text:`can`,explanation:`Sai. 'can brush' chỉ khả năng hoặc sự cho phép, không diễn đạt lời khuyên 'nên'.`,correct:!1},{text:`might`,explanation:`Sai. 'might brush' chỉ khả năng không chắc chắn, không phải khuyến nghị đều đặn.`,correct:!1}]},{q:`___ I borrow your pencil, please?`,a:[{text:`Can`,correct:!0,explanation:`Dùng 'Can' để xin phép lịch sự.`},{text:`Must`,explanation:`Sai. 'Must I borrow...' hỏi về nghĩa vụ, không phải xin phép mượn bút.`,correct:!1},{text:`Should`,explanation:`Sai. 'Should I borrow...' hỏi lời khuyên, không phải xin phép trực tiếp.`,correct:!1},{text:`Will`,explanation:`Sai. 'Will I borrow...' hỏi dự đoán/tương lai, không phải lời xin phép.`,correct:!1}]},{q:`We ___ run in the classroom. It's dangerous!`,a:[{text:`mustn't`,correct:!0,explanation:`Dùng 'mustn't' để chỉ sự cấm đoán.`},{text:`can`,explanation:`Sai. 'can run' nói về khả năng hoặc được phép chạy, không diễn đạt lệnh cấm trong lớp.`,correct:!1},{text:`should`,explanation:`Sai. 'shouldn't run' chỉ là lời khuyên không nên chạy, nhẹ hơn lệnh cấm vì nguy hiểm.`,correct:!1},{text:`need`,explanation:`Sai về nghĩa và cấu trúc trong câu khẳng định này: 'need run' không diễn đạt quy định cấm chạy.`,correct:!1}]},{q:`She still speaks all three languages fluently today; she learned them by age fifteen, so she ___ speak three languages fluently.`,a:[{text:`can`,correct:!0,explanation:`Dùng 'can' chỉ khả năng của bản thân.`},{text:`must`,explanation:`Sai. 'must' là động từ khuyết thiếu chỉ sự bắt buộc, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`should`,explanation:`Sai. 'should' là động từ khuyết thiếu chỉ lời khuyên, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`may`,explanation:`Sai. May chỉ khả năng/cho phép, còn stem xác nhận khả năng thực tế đã học đủ ba ngôn ngữ; dùng can.`,correct:!1}]},{q:`It ___ rain this afternoon. Look at those dark clouds!`,a:[{text:`might`,correct:!0,explanation:`Dùng 'might' để dự đoán một khả năng có thể xảy ra.`},{text:`mustn't`,explanation:`Sai. 'mustn't rain' nghĩa là không được mưa, không thể dùng để dự đoán thời tiết.`,correct:!1},{text:`can't`,explanation:`Sai. 'can't rain' là phán đoán không thể xảy ra, trái với dấu hiệu mây đen đang báo khả năng mưa.`,correct:!1},{text:`shouldn't`,explanation:`Sai. 'shouldn't rain' là dự đoán mưa không nên xảy ra, không phù hợp với tín hiệu mây đen.`,correct:!1}]},{q:`You ___ finish your homework before going out.`,a:[{text:`must`,correct:!0,explanation:`Dùng 'must' cho sự bắt buộc hoặc quy định.`},{text:`might`,explanation:`Sai. 'might finish' chỉ khả năng, không thể hiện yêu cầu bắt buộc phải hoàn thành trước khi ra ngoài.`,correct:!1},{text:`can`,explanation:`Sai. 'can finish' chỉ khả năng, không tạo nghĩa bắt buộc trong mệnh lệnh này.`,correct:!1},{text:`could`,explanation:`Sai. 'could finish' chỉ khả năng hoặc đề nghị lịch sự, không phải yêu cầu phải làm xong.`,correct:!1}]},{q:`I ___ swim when I was five years old.`,a:[{text:`could`,correct:!0,explanation:`Dùng 'could' là dạng quá khứ của 'can'.`},{text:`can`,explanation:`Sai. Phương án 'can' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`must`,explanation:`Sai. 'must' là động từ khuyết thiếu chỉ sự bắt buộc, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`should`,explanation:`Sai. 'should' là động từ khuyết thiếu chỉ lời khuyên, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1}]},{q:`You ___ eat too many candies. It's bad for your teeth.`,a:[{text:`shouldn't`,correct:!0,explanation:`Dùng 'shouldn't' để đưa ra lời khuyên không nên làm gì.`},{text:`must`,explanation:`Sai. 'must' là động từ khuyết thiếu chỉ sự bắt buộc, không đúng với cấu trúc và ngữ c
