const fullQuestionBank=[{q:`I like both apples ___ bananas. 🍎🍌`,a:[{text:`and`,correct:!0,explanation:`'And' nối hai loại quả cùng được người nói yêu thích: apples và bananas.`},{text:`but`,explanation:`'But' tạo tương phản, trong khi câu chỉ bổ sung thêm bananas vào danh sách yêu thích.`,correct:!1},{text:`or`,explanation:`'Or' buộc phải chọn một loại, trái với từ 'both' cho biết thích cả hai.`,correct:!1},{text:`so`,explanation:`'So' chỉ kết quả, không nối hai danh từ ngang hàng trong câu này.`,correct:!1}]},{q:`I want to play football, ___ it is raining. ⚽🌧️`,a:[{text:`but`,correct:!0,explanation:`'But' nối mong muốn chơi bóng với trở ngại ngược lại là trời đang mưa.`},{text:`and`,explanation:`'And' chỉ phép cộng thông tin, không thể hiện mâu thuẫn giữa muốn chơi và trời mưa.`,correct:!1},{text:`so`,explanation:`'So' sẽ nêu kết quả, nhưng mệnh đề sau đang là trở ngại chứ không phải hệ quả.`,correct:!1},{text:`because`,explanation:`'Because' cần giới thiệu lý do cho một hành động, không phù hợp sau mong muốn đối lập ở đây.`,correct:!1}]},{q:`Choose one drink: do you like tea ___ coffee? ☕🍵`,a:[{text:`or`,correct:!0,explanation:`'Or' đặt tea và coffee thành hai lựa chọn, đúng với yêu cầu chọn một đồ uống.`},{text:`and`,explanation:`'And' sẽ hỏi người nghe thích cả trà lẫn cà phê, trái với yêu cầu chọn một.`,correct:!1},{text:`but`,explanation:`'But' biểu thị tương phản, không nối hai lựa chọn đồ uống.`,correct:!1},{text:`so`,explanation:`'So' chỉ kết quả và không thể đứng giữa tea và coffee như một lựa chọn.`,correct:!1}]},{q:`He is hungry, ___ he eats a hamburger. 🍔`,a:[{text:`so`,correct:!0,explanation:`'So' nối trạng thái đói với kết quả anh ấy ăn hamburger.`},{text:`because`,explanation:`'Because' sẽ làm mệnh đề ăn hamburger thành lý do, ngược với quan hệ nguyên nhân–kết quả.`,correct:!1},{text:`but`,explanation:`'But' cần một ý đối lập, nhưng ăn hamburger là hệ quả tự nhiên của đói.`,correct:!1},{text:`or`,explanation:`'Or' diễn tả lựa chọn, không nối trạng thái đói với hành động ăn.`,correct:!1}]},{q:`She goes to sleep ___ she is tired. 😴`,a:[{text:`because`,correct:!0,explanation:`'Because' giới thiệu lý do cô ấy đi ngủ: cô ấy đang mệt.`},{text:`so`,explanation:`'So' sẽ cần mệnh đề kết quả ở sau; ở đây mệnh đề sau là lý do.`,correct:!1},{text:`and`,explanation:`'And' chỉ bổ sung, không giải thích vì sao cô ấy đi ngủ.`,correct:!1},{text:`but`,explanation:`'But' tạo tương phản không có trong quan hệ mệt nên đi ngủ.`,correct:!1}]},{q:`My dog is small ___ cute. 🐶`,a:[{text:`and`,correct:!0,explanation:`'And' nối hai đặc điểm đồng thời của chú chó: nhỏ và dễ thương.`},{text:`but`,explanation:`'But' hàm ý nhỏ trái với dễ thương, trong khi câu không nêu sự đối lập.`,correct:!1},{text:`or`,explanation:`'Or' biến hai tính từ thành lựa chọn loại trừ, không đúng với việc mô tả cả hai.`,correct:!1},{text:`because`,explanation:`'Because' cần một mệnh đề lý do, không thể nối hai tính từ song song ở đây.`,correct:!1}]},{q:`I can swim, ___ I cannot fly. 🏊‍♂️🧚`,a:[{text:`but`,correct:!0,explanation:`'But' đối chiếu khả năng bơi với việc không thể bay.`},{text:`and`,explanation:`'And' chỉ cộng thêm thông tin, không làm nổi bật hai khả năng trái ngược.`,correct:!1},{text:`so`,explanation:`'So' cần quan hệ kết quả, trong khi không bay không phải kết quả của biết bơi.`,correct:!1},{text:`because`,explanation:`'Because' sẽ biến việc không bay thành lý do, trái với ý tương phản của hai khả năng.`,correct:!1}]},{q:`Which single item is this: a pen ___ a pencil? 🖊️✏️`,a:[{text:`or`,correct:!0,explanation:`'Or' hỏi người nghe nhận diện một vật: pen hay pencil.`},{text:`and`,explanation:`'And' sẽ gộp pen và pencil thành một vật, trái với từ 'single item'.`,correct:!1},{text:`but`,explanation:`'But' biểu thị tương phản, không đặt hai vật thành lựa chọn nhận diện.`,correct:!1},{text:`so`,explanation:`'So' chỉ kết quả, không hoàn thành câu hỏi chọn pen hoặc pencil.`,correct:!1}]},{q:`It is sunny, ___ let's go to the park! ☀️🌳`,a:[{text:`so`,correct:!0,explanation:`'So' nối thời tiết nắng với đề nghị đi công viên như một hệ quả thuận lợi.`},{text:`because`,explanation:`'Because' sẽ biến trời nắng thành lý do đã biết, trong khi câu đang nêu kết quả/đề nghị.`,correct:!1},{text:`but`,explanation:`'But' cần sự tương phản, không có đối lập giữa trời nắng và đi công viên.`,correct:!1},{text:`or`,explanation:`'Or' mở ra lựa chọn, không nối nguyên nhân thuận lợi với lời rủ đi chơi.`,correct:!1}]},{q:`He studies hard ___ he wants good marks. 📚💯`,a:[{text:`because`,correct:!0,explanation:`'Because' nêu động lực học chăm: anh ấy muốn đạt điểm tốt.`},{text:`so`,explanation:`'So' sẽ đặt việc muốn điểm cao thành kết quả sau việc học, trái với ý lý do.`,correct:!1},{text:`and`,explanation:`'And' chỉ nối hai sự việc, không giải thích vì sao anh ấy học chăm.`,correct:!1},{text:`but`,explanation:`'But' tạo tương phản không có giữa học chăm và muốn điểm tốt.`,correct:!1}]},{q:`I have a brother ___ a sister. 👦👧`,a:[{text:`and`,correct:!0,explanation:`'And' nối brother và sister như hai thành viên cùng được liệt kê.`},{text:`but`,explanation:`'But' không phù hợp vì anh/em trai và chị/em gái không tạo tương phản.`,correct:!1},{text:`so`,explanation:`'So' chỉ hệ quả, không liệt kê hai người thân trong một câu.`,correct:!1},{text:`because`,explanation:`'Because' cần một mệnh đề lý do, không nối hai danh từ chỉ người thân.`,correct:!1}]},{q:`This car is old, ___ it is very fast. 🚗💨`,a:[{text:`but`,correct:!0,explanation:`'But' làm nổi bật sự tương phản giữa chiếc xe cũ và tốc độ vẫn nhanh.`},{text:`and`,explanation:`'And' chỉ cộng hai đặc điểm, không nhấn mạnh sự trái ngược cũ–nhanh.`,correct:!1},{text:`or`,explanation:`'Or' biến old và fast thành hai lựa chọn, không phải hai đặc điểm cùng đúng.`,correct:!1},{text:`so`,explanation:`'So' không chỉ quan hệ kết quả giữa tuổi của xe và tốc độ của nó.`,correct:!1}]},{q:`You can have cake ___ ice cream. You cannot have both. 🍰🍦`,a:[{text:`or`,correct:!0,explanation:`'Or' phù hợp vì người nghe chỉ được chọn cake hoặc ice cream, không được lấy cả hai.`},{text:`and`,explanation:`'And' sẽ cho phép lấy cả bánh và kem, trái với giới hạn chọn một món.`,correct:!1},{text:`but`,explanation:`'But' không biểu thị hai món thay thế nhau trong câu hỏi lựa chọn này.`,correct:!1},{text:`so`,explanation:`'So' chỉ kết quả, không nối hai món tráng miệng để chọn một.`,correct:!1}]},{q:`I forgot my umbrella, ___ I got wet as a result. ☔💧`,a:[{text:`so`,correct:!0,explanation:`'So' nối việc quên ô với hậu quả là người nói bị ướt.`},{text:`because`,explanation:`'Because' sẽ cần đảo quan hệ thành 'I got wet because I forgot...' hoặc đổi vị trí mệnh đề.`,correct:!1},{text:`but`,explanation:`'But' không có tương phản; bị ướt là hệ quả trực tiếp của quên ô.`,correct:!1},{text:`or`,explanation:`'Or' đưa ra lựa chọn, không diễn tả kết quả của việc quên ô.`,correct:!1}]},{q:`We stay at home ___ it is raining. 🏠🌧️`,a:[{text:`because`,correct:!0,explanation:`'Because' giải thích lý do gia đình ở nhà: ngoài trời đang mưa.`},{text:`so`,explanation:`'So' sẽ cần mệnh đề trước là nguyên nhân và sau là kết quả; ở đây mưa nằm sau vị trí liên từ.`,correct:!1},{text:`but`,explanation:`'But' tạo tương phản không có giữa ở nhà và trời mưa.`,correct:!1},{text:`and`,explanation:`'And' chỉ thêm thông tin, không nêu nguyên nhân phải ở nhà.`,correct:!1}]},{q:`Elephants are big, ___ mice are small. 🐘🐁`,a:[{text:`but`,correct:!0,explanation:`'But' đối chiếu kích thước lớn của voi với kích thước nhỏ của chuột.`},{text:`or`,explanation:`“Or” diễn tả lựa chọn, không thể hiện quan hệ tương phản giữa “big” và “small”.`,correct:!1},{text:`so`,explanation:`'So' không nêu kết quả giữa kích thước của voi và chuột.`,correct:!1},{text:`because`,explanation:`'Because' cần quan hệ lý do, không phù hợp với phép so sánh hai con vật.`,correct:!1}]},{q:`I like red, ___ I don't like blue. 🔴🔵`,a:[{text:`but`,correct:!0,explanation:`'But' nối việc thích màu đỏ với sở thích trái ngược là không thích màu xanh.`},{text:`and`,explanation:`'And' chỉ bổ sung, không thể hiện sự đối lập giữa thích và không thích.`,correct:!1},{text:`or`,explanation:`'Or' sẽ hỏi chọn màu nào, nhưng câu đang khẳng định thích đỏ và không thích xanh.`,correct:!1},{text:`so`,explanation:`'So' không diễn tả quan hệ kết quả giữa việc thích đỏ và không thích xanh.`,correct:!1}]},{q:`For this trip, choose one: do you go to school by bus ___ by bike? 🚌🚲`,a:[{text:`or`,correct:!0,explanation:`'Or' cho phép chọn đi học bằng bus hoặc bike, đúng với 'choose one'.`},{text:`and`,explanation:`'And' sẽ gợi đi bằng cả hai phương tiện, trái với yêu cầu chọn một.`,correct:!1},{text:`but`,explanation:`'But' biểu thị đối lập, không nối hai phương tiện để lựa chọn.`,correct:!1},{text:`so`,explanation:`'So' không dùng để đặt hai phương tiện thành lựa chọn.`,correct:!1}]},{q:`She is smart ___ kind. 🧠❤️`,a:[{text:`and`,correct:!0,explanation:`'And' nối hai phẩm chất cùng đúng về cô ấy: thông minh và tốt bụng.`},{text:`but`,explanation:`'But' không phù hợp vì smart và kind bổ sung cho nhau, không tương phản.`,correct:!1},{text:`or`,explanation:`'Or' sẽ biến smart và kind thành hai khả năng loại trừ, trái với việc cô ấy có cả hai phẩm chất.`,correct:!1},{text:`so`,explanation:`'So' chỉ kết quả, không nối hai tính từ mô tả người.`,correct:!1}]},{q:`I don't have money, ___ I cannot buy the toy. 💰🧸`,a:[{text:`so`,correct:!0,explanation:`'So' nối việc không có tiền với kết quả không thể mua món đồ chơi.`},{text:`because`,explanation:`'Because' sẽ cần mệnh đề sau là nguyên nhân, nhưng 'cannot buy' là kết quả.`,correct:!1},{text:`but`,explanation:`'But' không nêu tương phản giữa thiếu tiền và không mua được đồ chơi.`,correct:!1},{text:`or`,explanation:`'Or' mở lựa chọn, không biểu thị hệ quả của việc không có tiền.`,correct:!1}]},{q:`He is happy ___ he passed the exam. 😄📝`,a:[{text:`because`,correct:!0,explanation:`'Because' giải thích niềm vui bằng nguyên nhân anh ấy đã đỗ kỳ thi.`},{text:`so`,explanation:`'So' sẽ biến việc đỗ kỳ thi thành kết quả của việc vui, trái với quan hệ lý do.`,correct:!1},{text:`but`,explanation:`'But' tạo tương phản không có giữa hạnh phúc và việc đỗ thi.`,correct:!1},{text:`and`,explanation:`'And' chỉ nối hai thông tin, không nêu nguyên nhân khiến anh ấy vui.`,correct:!1}]},{q:`I wash my hands ___ my face. 🖐️😊`,a:[{text:`and`,correct:!0,explanation:`'And' nối hai hành động liên tiếp: rửa tay và rửa mặt.`},{text:`but`,explanation:`'But' không tạo tương phản giữa hai việc rửa tay và rửa mặt.`,correct:!1},{text:`or`,explanation:`'Or' biến hai bộ phận thành lựa chọn, trong khi câu nêu làm cả hai.`,correct:!1},{text:`so`,explanation:`'So' chỉ hệ quả, không nối hai bộ phận cơ thể được rửa.`,correct:!1}]},{q:`Choose a contrasting conjunction: The soup is too hot to eat now, ___ it is delicious. 🍲😋`,a:[{text:`but`,correct:!0,explanation:`'But' đối lập việc súp quá nóng với nhận xét nó vẫn ngon.`},{text:`and`,explanation:`'And' chỉ bổ sung, không thể hiện mâu thuẫn nóng–ngon mà câu yêu cầu.`,correct:!1},{text:`or`,explanation:`'Or' tạo lựa chọn giữa hai ý, không diễn tả hai đặc điểm cùng nói về súp.`,correct:!1},{text:`because`,explanation:`'Because' cần mệnh đề sau làm lý do, nhưng 'it is delicious' là ý đối lập về đánh giá.`,correct:!1}]},{q:`Choose one main dish: would you like chicken ___ fish for dinner? 🍗🐟`,a:[{text:`or`,correct:!0,explanation:`'Or' đặt chicken và fish thành hai món chính để người ăn chọn một.`},{text:`and`,explanation:`'And' sẽ hỏi muốn cả gà lẫn cá, trái với dạng câu hỏi chọn một món.`,correct:!1},{text:`but`,explanation:`'But' không tạo quan hệ tương phản giữa hai món được đưa ra.`,correct:!1},{text:`so`,explanation:`'So' chỉ kết quả, không nối hai lựa chọn bữa tối.`,correct:!1}]},{q:`It was cold, ___ I wore a coat. ❄️🧥`,a:[{text:`so`,correct:!0,explanation:`'So' nối trời lạnh với hành động mặc áo khoác như một kết quả.`},{text:`because`,explanation:`'Because' sẽ cần câu đổi thành 'I wore a coat because it was cold'; vị trí hiện tại nêu kết quả.`,correct:!1},{text:`but`,explanation:`'But' không thể hiện quan hệ lạnh nên mặc áo, vì hai mệnh đề không đối lập.`,correct:!1},{text:`or`,explanation:`'Or' đưa ra lựa chọn thay vì diễn tả kết quả của thời tiết lạnh.`,correct:!1}]},{q:`I like him ___ he is very funny; his humor is the reason I like him. 😂`,a:[{text:`because`,correct:!0,explanation:`'Because' nêu lý do thích anh ấy: tính hài hước của anh ấy.`},{text:`so`,explanation:`'So' sẽ làm sự hài hước thành kết quả của việc thích, trái với ý giải thích.`,correct:!1},{text:`but`,explanation:`'But' tạo tương phản không có giữa thích một người và việc người đó hài hước.`,correct:!1},{text:`or`,explanation:`'Or' tạo hai khả năng, không nêu lý do cho cảm xúc thích.`,correct:!1}]},{q:`My father is a doctor, ___ my mother is a teacher. 👨‍⚕️👩‍🏫`,a:[{text:`and`,correct:!0,explanation:`'And' bổ sung thông tin nghề nghiệp của cha và mẹ, không đặt chúng đối lập.`},{text:`but`,explanation:`'But' không cần thiết vì nghề bác sĩ và giáo viên chỉ là hai thông tin song song.`,correct:!1},{text:`or`,explanation:`'Or' biến nghề của cha mẹ thành lựa chọn loại trừ, trái với việc nêu cả hai.`,correct:!1},{text:`because`,explanation:`'Because' cần mệnh đề lý do, không nối hai thông tin nghề nghiệp.`,correct:!1}]},{q:`I want to watch TV, ___ I have to do homework. 📺📝`,a:[{text:`but`,correct:!0,explanation:`'But' đối lập mong muốn xem TV với nghĩa vụ phải làm bài tập.`},{text:`and`,explanation:`'And' chỉ cộng hai việc, không thể hiện việc làm bài ngăn mong muốn xem TV.`,correct:!1},{text:`so`,explanation:`'So' không nêu kết quả rõ ràng; mệnh đề sau là nghĩa vụ đối lập.`,correct:!1},{text:`or`,explanation:`'Or' tạo lựa chọn, trong khi người nói nêu hai mong muốn/trách nhiệm xung đột.`,correct:!1}]},{q:`Is the giraffe tall ___ short? 🦒`,a:[{text:`or`,correct:!0,explanation:`'Or' hỏi hươu cao cổ cao hay thấp như hai lựa chọn loại trừ.`},{text:`and`,explanation:`'And' sẽ hỏi hươu cao cổ vừa cao vừa thấp, không phải lựa chọn.`,correct:!1},{text:`but`,
