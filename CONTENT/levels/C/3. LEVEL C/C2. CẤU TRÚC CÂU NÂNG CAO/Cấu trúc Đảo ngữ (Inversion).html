<!doctype html><html lang=vi><head><link href=/tools-assets/vendor/dec-web-fonts.css rel=stylesheet><meta charset=UTF-8><meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" name=viewport><title>Cấu trúc Đảo ngữ (Inversion)</title><link href="/favicon-16.png?v=20260708-declogo" rel=icon sizes=16x16 type=image/png><link href="/favicon-32.png?v=20260708-declogo" rel=icon sizes=32x32 type=image/png><link href="/favicon-48.png?v=20260708-declogo" rel=icon sizes=48x48 type=image/png><link href="/favicon-64.png?v=20260708-declogo" rel=icon sizes=64x64 type=image/png><link href="/favicon-128.png?v=20260708-declogo" rel=icon sizes=128x128 type=image/png><link href="/favicon-256.png?v=20260708-declogo" rel=icon sizes=256x256 type=image/png><style>:root{--dec-font-family-offline:"Be Vietnam Pro","Segoe UI",Arial,sans-serif;--dec-serif-family-offline:Georgia,serif}html,body,button,input,select,textarea{font-family:var(--dec-font-family-offline)}</style><link href=/tools-assets/generated/style-d02bbdee71641645.css rel=stylesheet><link href=/tools-assets/generated/style-90a928cbfd947db5.css rel=stylesheet></head><body><div class=container><div id=header-area><h1 class=dec-ui-game-title id=lessonTitle>Cấu trúc Đảo ngữ (Inversion)</h1><div class=header-meta><button title="Bật chế độ Focus (phím F)" aria-pressed=false class=focus-toggle-btn id=btnFocusMode type=button><i class="fa-solid fa-expand" aria-hidden=true></i>Focus Mode</button><div id=subtitle-placeholder></div><div class=theme-switch-wrap><label title="Chuyển đổi giao diện" class=theme-toggle-switch><input id=themeToggleCheckbox type=checkbox> <span class=slider> <span class=slider-text id=themeToggleText>YOUTH</span> </span></label></div></div></div><div class=is-initially-hidden id=quiz-area><div id=focus-progress-row><div class=progress-container id=progress-area></div></div><div id=question-container></div><div class=controls><button class=btn id=prev-btn type=button><i class="fa-sol const fullQuestionBank=[{q:`Never ___ such a beautiful rainbow in my life so far. 🌈`,a:[{text:`have I seen`,correct:!0,explanation:`Đảo ngữ với 'Never': Never + Trợ động từ + S + V.`},{text:`I have seen`,explanation:`Sai. Đây là trật tự câu xuôi.`,correct:!1},{text:`did I see`,explanation:`Sai đảo ngữ hiện tại hoàn thành: cần 'have I seen', không dùng quá khứ 'did I see'.`,correct:!1},{text:`saw I`,explanation:`Sai cấu trúc. Phương án 'saw I' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`Rarely ___ out for dinner on weekdays. 🍽️`,a:[{text:`do we go`,correct:!0,explanation:`Đảo ngữ với 'Rarely' ở hiện tại thường: Rarely + do/does + S + V.`},{text:`we go`,explanation:`Sai. Sau 'Rarely' cần đảo trợ động từ: 'Rarely do we go', không phải 'we go'.`,correct:!1},{text:`go we`,explanation:`Sai cấu trúc. Phương án 'go we' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`did we go`,explanation:`Sai thì (câu nói về thói quen hiện tại).`,correct:!1}]},{q:`Little ___ that he was a famous singer. 🎤`,a:[{text:`did I know`,correct:!0,explanation:`Đảo ngữ với 'Little' (mang nghĩa phủ định): Little + Trợ động từ + S + V.`},{text:`I knew`,explanation:`Sai. 'Never' yêu cầu hiện tại hoàn thành đảo ngữ 'have I encountered'.`,correct:!1},{text:`do I know`,explanation:`Sai thì (mệnh đề sau là quá khứ 'was').`,correct:!1},{text:`knew I`,explanation:`Sai. Sau 'Seldom' cần 'did I know'; 'knew I' đảo sai và thiếu trợ động từ.`,correct:!1}]},{q:`___ had I arrived home than it started to rain. 🌧️`,a:[{text:`No sooner`,correct:!0,explanation:`Đúng. 'No sooner had the train left than...' dùng had + S + V3 trước 'than'.`},{text:`Hardly`,explanation:`Sai. 'Hardly' đi với 'when', không dùng 'than'.`,correct:!1},{text:`Scarcely`,explanation:`Sai. 'Scarcely' đi với 'when'.`,correct:!1},{text:`Rarely`,explanation:`Sai. Câu đã mở bằng 'No sooner'; 'Rarely' không đi với mệnh đề 'had ... than'.`,correct:!1}]},{q:`Hardly had the show started ___ the lights went out. 💡`,a:[{text:`when`,correct:!0,explanation:`Cấu trúc: Hardly ... when ... (Vừa mới... thì...).`},{text:`than`,explanation:`Sai. 'Hardly' đi với 'when', không đi với 'than'.`,correct:!1},{text:`then`,explanation:`Sai cấu trúc. Phương án 'then' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`that`,explanation:`Sai cấu trúc. Phương án 'that' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`Seldom ___ such a difficult math problem in my life. ➕`,a:[{text:`have I encountered`,correct:!0,explanation:`Đảo ngữ với 'Seldom': Seldom + Trợ động từ + S + V.`},{text:`I have encountered`,explanation:`Sai. Sau 'Seldom' phải là 'can you achieve'; không dùng trật tự xuôi 'you can'.`,correct:!1},{text:`did I encounter`,explanation:`Không phù hợp ngữ cảnh nhấn mạnh trải nghiệm.`,correct:!1},{text:`encountered I`,explanation:`Sai cấu trúc. Phương án 'encountered I' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`Only by working hard ___ your goals. 🎯`,a:[{text:`can you achieve`,correct:!0,explanation:`Đảo ngữ với 'Only by + Ving': Trợ động từ đảo lên trước chủ ngữ mệnh đề chính.`},{text:`you can achieve`,explanation:`Sai. 'Under no circumstances' cần 'is she allowed', không phải 'she is'.`,correct:!1},{text:`can achieve you`,explanation:`Sai trật tự từ. Cách dùng phù hợp trong câu này là “can you achieve”.`,correct:!1},{text:`achieve you can`,explanation:`Sai cấu trúc. Phương án 'achieve you can' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`___ you study harder, you will fail the exam. 📚`,a:[{text:`Unless`,correct:!0,explanation:`Unless = If not (Trừ khi).`},{text:`If`,explanation:`Sai nghĩa (Nếu bạn học chăm, bạn sẽ trượt -> vô lý).`,correct:!1},{text:`Only if`,explanation:`Sai cấu trúc. Phương án 'Only if' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`Not only`,explanation:`Sai cấu trúc. Phương án 'Not only' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`Not only ___ beautiful, but she is also intelligent. 🧠`,a:[{text:`is she`,correct:!0,explanation:`Đảo ngữ 'Not only': Not only + Trợ động từ/Tobe + S...`},{text:`she is`,explanation:`Sai. 'Little did he know' mới là đảo ngữ đúng; 'he ran' chưa đảo.`,correct:!1},{text:`does she`,explanation:`Sai. Tính từ 'beautiful' đi với tobe, không dùng trợ từ 'does'.`,correct:!1},{text:`was she`,explanation:`Sai. Phương án 'was she' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`___ I known about the party, I would have come. 🎉`,a:[{text:`Had`,correct:!0,explanation:`Đảo ngữ câu điều kiện loại 3: Had + S + PII.`},{text:`If`,explanation:`Sai. Nếu dùng If phải là 'If I had known'.`,correct:!1},{text:`Have`,explanation:`Sai. Với 'I known' ở quá khứ hoàn thành phải dùng 'Had I known', không dùng 'Have'.`,correct:!1},{text:`Were`,explanation:`Sai. Dùng cho loại 2.`,correct:!1}]},{q:`___ I you, I would accept the offer. 🤝`,a:[{text:`Were`,correct:!0,explanation:`Đảo ngữ câu điều kiện loại 2: Were + S + ... (Nếu tôi là bạn).`},{text:`If`,explanation:`Sai. Thiếu động từ. Cách dùng phù hợp trong câu này là “Were”.`,correct:!1},{text:`Was`,explanation:`Sai. Trong câu điều kiện loại 2, dùng 'Were' cho mọi ngôi.`,correct:!1},{text:`Am`,explanation:`Sai cấu trúc. Phương án 'Am' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`Should you ___ any assistance, please call us. 📞`,a:[{text:`need`,correct:!0,explanation:`Đảo ngữ câu điều kiện loại 1: Should + S + V(nguyên thể).`},{text:`needs`,explanation:`Sai. Sau 'Should' động từ không chia.`,correct:!1},{text:`needed`,explanation:`Sai đảo ngữ với 'need': cấu trúc cần 'need', không chia quá khứ 'needed'.`,correct:!1},{text:`to need`,explanation:`Sai dạng động từ. Cách dùng phù hợp trong câu này là “need”.`,correct:!1}]},{q:`So quickly ___ that we couldn't catch him. 🏃`,a:[{text:`did he run`,correct:!0,explanation:`Đảo ngữ với 'So + adj/adv': So + ... + Trợ động từ + S + V.`},{text:`he ran`,explanation:`Sai. Sau 'Rarely' cần 'was she', không phải trật tự xuôi 'she is'.`,correct:!1},{text:`run he did`,explanation:`Sai cấu trúc. Phương án 'run he did' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`ran he`,explanation:`Sai cấu trúc. Phương án 'ran he' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`Such ___ that everyone admired it. 🎨`,a:[{text:`was the painting`,correct:!0,explanation:`Đảo ngữ với 'Such': Such + be + N + that...`},{text:`the painting was`,explanation:`Sai. 'Hardly had he arrived' cần trợ động từ đảo trước chủ ngữ.`,correct:!1},{text:`is the painting`,explanation:`Sai thì (vế sau là 'admired' - quá khứ).`,correct:!1},{text:`did the painting`,explanation:`Sai. Sau 'Rarely' cần 'was the painting'; 'did' không đi với động từ to be ở đây.`,correct:!1}]},{q:`___ comes the bus! 🚌`,a:[{text:`Here`,correct:!0,explanation:`Đảo ngữ với 'Here/There' khi chủ ngữ là danh từ: Here + V + S.`},{text:`It`,explanation:`Sai cấu trúc. Phương án 'It' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`Where`,explanation:`Sai. 'Where' là đại từ quan hệ/trạng từ chỉ nơi chốn, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`When`,explanation:`Sai. 'When' chỉ thời điểm, không thể thay cho liên từ 'as' trong 'Try as he might'.`,correct:!1}]},{q:`Off ___! 🏃💨`,a:[{text:`we go`,correct:!0,explanation:`Với 'Here/There/Off...' nếu chủ ngữ là đại từ (we, he, she...), KHÔNG đảo ngữ: Off + S + V.`},{text:`go we`,explanation:`Sai. Chủ ngữ là đại từ nên không đảo động từ lên trước.`,correct:!1},{text:`do we go`,explanation:`Sai cấu trúc. Phương án 'do we go' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`did we go`,explanation:`Sai cấu trúc. Phương án 'did we go' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`I like ice cream, and ___ does my sister. 🍦`,a:[{text:`so`,correct:!0,explanation:`Đồng tình khẳng định: So + Trợ động từ + S.`},{text:`neither`,explanation:`Sai. 'Neither' cần đi cùng cấu trúc đối ứng; chỗ trống này không dùng từ phủ định đó.`,correct:!1},{text:`nor`,explanation:`Sai. 'Nor' thường theo sau một mệnh đề phủ định; dùng riêng ở đây không đúng cấu trúc.`,correct:!1},{text:`too`,explanation:`Sai vị trí (Too đứng cuối câu).`,correct:!1}]},{q:`I don't like spicy food, and ___ does he. 🌶️`,a:[{text:`neither`,correct:!0,explanation:`Đồng tình phủ định: Neither + Trợ động từ + S.`},{text:`so`,explanation:`Sai. Dùng cho khẳng định.`,correct:!1},{text:`either`,explanation:`Sai. Either đứng cuối câu (I don't ... either).`,correct:!1},{text:`too`,explanation:`Sai. Từ vựng hoặc dạng từ 'too' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`He won't go to the party, nor ___ I. 🎈`,a:[{text:`will`,correct:!0,explanation:`Đảo ngữ với 'Nor': Nor + Trợ động từ (tương ứng thì) + S.`},{text:`won't`,explanation:`Sai. 'Nor' đã mang nghĩa phủ định, không dùng 'won't'.`,correct:!1},{text:`do`,explanation:`Sai đảo ngữ tương lai: cần 'will', không dùng trợ động từ hiện tại/quá khứ 'do/did'.`,correct:!1},{text:`did`,explanation:`Sai cấu trúc giả định: 'Were I' thay cho 'If I were', không dùng câu hỏi 'Am I'.`,correct:!1}]},{q:`Only when I grew up ___ my parents' love. ❤️`,a:[{text:`did I understand`,correct:!0,explanation:`Đảo ngữ 'Only when': Mệnh đề chính đảo ngữ ở phía sau.`},{text:`I understood`,explanation:`Sai. 'Only after...' yêu cầu 'did I understand', không phải 'I understood'.`,correct:!1},{text:`I did understand`,explanation:`Sai. Sau 'Only after' phải là 'did we solve'; 'can solve we' đảo sai trợ động từ.`,correct:!1},{text:`do I understand`,explanation:`Sai. Phương án 'do I understand' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`Not until yesterday ___ the truth. 📅`,a:[{text:`did I know`,correct:!0,explanation:`Đảo ngữ 'Not until': Not until + [Time] + Trợ động từ + S + V.`},{text:`I knew`,explanation:`Sai. Sau 'Not until' phải là 'did I know', không dùng 'I knew'.`,correct:!1},{text:`had I known`,explanation:`Không phù hợp ngữ cảnh đơn thuần kể lại.`,correct:!1},{text:`knew I`,explanation:`Sai. Sau 'Not until' cần 'did I know'; không dùng 'knew I'.`,correct:!1}]},{q:`Nowhere ___ find such delicious pizza. 🍕`,a:[{text:`can you`,correct:!0,explanation:`Đảo ngữ với từ phủ định chỉ nơi chốn 'Nowhere': Nowhere + Trợ từ + S + V.`},{text:`you can`,explanation:`Sai. 'Only then' cần 'can you', đảo trợ động từ trước chủ ngữ.`,correct:!1},{text:`do you`,explanation:`Sai. Cần động từ khuyết thiếu 'can' để chỉ khả năng.`,correct:!1},{text:`are you`,explanation:`Sai. Câu hỏi cần 'are we', không phải 'are you' vì chủ ngữ là 'we'.`,correct:!1}]},{q:`Yesterday, on the table ___ a big cat. 🐈`,a:[{text:`lay`,correct:!0,explanation:`Đảo ngữ toàn bộ với cụm giới từ chỉ nơi chốn: Giới từ + V + S (động từ chính 'lay' đảo lên trước S).`},{text:`did lie`,explanation:`Sai. Với đảo ngữ toàn bộ, không mượn trợ động từ 'did'.`,correct:!1},{text:`lies`,explanation:`Sai thì (nếu ngữ cảnh quá khứ) hoặc sai hình thức.`,correct:!1},{text:`laying`,explanation:`Sai. 'Laying' nghĩa là đặt xuống; vị trí này cần động từ chia phù hợp, không dùng V-ing.`,correct:!1}]},{q:`Down ___ the rain. 🌧️`,a:[{text:`came`,correct:!0,explanation:`Đảo ngữ với trạng từ chỉ phương hướng 'Down': Down + V + S (Danh từ).`},{text:`did come`,explanation:`Sai. Không mượn trợ từ 'did' với dạng đảo ngữ này.`,correct:!1},{text:`come`,explanation:`Sai chia động từ 'rain' số ít.`,correct:!1},{text:`coming`,explanation:`Sai. 'Coming' là V-ing; sau 'Barely' cần động từ đã chia trong đảo ngữ.`,correct:!1}]},{q:`Only in this way ___ the problem. 🧩`,a:[{text:`can we solve`,correct:!0,explanation:`Đảo ngữ 'Only in this way': Trợ từ + S + V.`},{text:`we can solve`,explanation:`Sai. 'Not only' ở đầu câu cần 'can we solve', không phải 'we can solve'.`,correct:!1},{text:`solve we can`,explanation:`Sai cấu trúc. Phương án 'solve we can' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`can solve we`,explanation:`Sai. Đúng là 'should you open'; không đặt 'open you should'.`,correct:!1}]},{q:`Scarcely had he left the house ___ the phone rang. ☎️`,a:[{text:`when`,correct:!0,explanation:`Cấu trúc: Scarcely ... when ...`},{text:`than`,explanation:`Sai. Cấu trúc 'No sooner ... than' đặt 'than' sau mệnh đề thứ hai, không ở chỗ trống này.`,correct:!1},{text:`then`,explanation:`Sai. 'Only then' phải là cụm trạng từ đầy đủ; 'then' đơn lẻ không mở được đảo ngữ.`,correct:!1},{text:`after`,explanation:`Sai. Từ vựng hoặc dạng từ 'after' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Were he to study harder, he ___ pass. 🎓`,a:[{text:`would`,correct:!0,explanation:`Câu điều kiện loại 2 (giả định không thật ở hiện tại): Vế chính dùng 'would/could'.`},{text:`will`,explanation:`Sai. Câu đang giả định điều trái hiện tại nên cần 'would', không dùng 'will'.`,correct:!1},{text:`can`,explanation:`Sai. 'Can' diễn tả khả năng hiện tại; kết quả giả định cần 'would'.`,correct:!1},{text:`did`,explanation:`Sai cấu trúc. Phương án 'did' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`Had you told me earlier, I ___ you. 🆘`,a:[{text:`would have helped`,correct:!0,explanation:`Câu điều kiện loại 3: Had + S + PII, S + would have + PII.`},{text:`will help`,explanation:`Sai. 'Will help' là kết quả loại 1; câu giả định điều kiện loại 2 cần 'would help'.`,correct:!1},{text:`would help`,explanation:`Sai. 'Would help' thuộc kết quả điều kiện loại 2; câu này cần đảo ngữ với 'should'.`,correct:!1},{text:`helped`,explanation:`Sai cấu trúc. Phương án 'helped' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`___ my keys! I have found them. 🔑`,a:[{text:`Here are`,correct:!0,explanation:`'Here are my keys!' chỉ những chiếc chìa khóa ở ngay đây và hòa hợp với danh từ số nhiều.`},{text:`Here is`,explanation:`Sai số ít/số nhiều: 'keys' là danh từ số nhiều nên phải dùng 'Here are'.`,correct:!1},{text:`There is`,explanation:`Sai. Phương án 'There is' không hòa hợp chủ vị với chủ ngữ trong câu.`,cor
