const fullQuestionBank=[{q:`If it rains tomorrow, we ___ at home.`,a:[{text:`will stay`,correct:!0,explanation:`Câu điều kiện loại 1: If + HTĐ, Will + V.`},{text:`stay`,explanation:`Sai cấu trúc câu điều kiện loại 1.`,correct:!1},{text:`stayed`,explanation:`Sai. Dấu hiệu trong câu không yêu cầu thì Quá khứ đơn.`,correct:!1},{text:`would stay`,explanation:`Dùng cho loại 2. Cách dùng phù hợp trong câu này là “will stay”.`,correct:!1}]},{q:`If I ___ you, I would buy that bike.`,a:[{text:`were`,correct:!0,explanation:`Câu điều kiện loại 2: If + QKĐ (be = were), Would + V.`},{text:`am`,explanation:`Dùng cho hiện tại. Cách dùng phù hợp trong câu này là “were”.`,correct:!1},{text:`was`,explanation:`Trong câu điều kiện loại 2 thường dùng were cho mọi ngôi.`,correct:!1},{text:`be`,explanation:`Sai cấu trúc câu điều kiện. Động từ chia sai thì so với mệnh đề còn lại.`,correct:!1}]},{q:`If she ___ hard, she will pass the exam.`,a:[{text:`studies`,correct:!0,explanation:`Studies is present after if; passing is the future result.`},{text:`study`,explanation:`Chủ ngữ số ít cần thêm 's/es'.`,correct:!1},{text:`studied`,explanation:`Dùng cho loại 2. Cách dùng phù hợp trong câu này là “studies”.`,correct:!1},{text:`will study`,explanation:`Mệnh đề If không dùng will.`,correct:!1}]},{q:`If they had invited me to last Saturday's party, I ___ to the party.`,a:[{text:`would have gone`,correct:!0,explanation:`Câu điều kiện loại 3: If + Quá khứ hoàn thành, Would have + V3.`},{text:`will go`,explanation:`Dùng cho loại 1. Cách dùng phù hợp trong câu này là “would have gone”.`,correct:!1},{text:`would go`,explanation:`Dùng cho loại 2. Cách dùng phù hợp trong câu này là “would have gone”.`,correct:!1},{text:`went`,explanation:`Sai cấu trúc câu điều kiện loại 3. Cần lùi thì chính xác.`,correct:!1}]},{q:`If I ___ a million dollars, I would travel the world.`,a:[{text:`had`,correct:!0,explanation:`Câu điều kiện loại 2 diễn tả giả định không có thật ở hiện tại.`},{text:`have`,explanation:`Dùng cho loại 1. Cách dùng phù hợp trong câu này là “had”.`,correct:!1},{text:`has`,explanation:`Sai chủ ngữ. Cách dùng phù hợp trong câu này là “had”.`,correct:!1},{text:`having`,explanation:`Sai cấu trúc câu điều kiện loại 3. Cần lùi thì chính xác.`,correct:!1}]},{q:`You will be late if you ___ now.`,a:[{text:`don't leave`,correct:!0,explanation:`Don't leave is present negative after if; lateness is future.`},{text:`not leave`,explanation:`Thiếu trợ động từ. Cách dùng phù hợp trong câu này là “don't leave”.`,correct:!1},{text:`didn't leave`,explanation:`Dùng cho loại 2. Cách dùng phù hợp trong câu này là “don't leave”.`,correct:!1},{text:`won't leave`,explanation:`Mệnh đề If không dùng won't.`,correct:!1}]},{q:`If I ___ my homework, my teacher would have been happy.`,a:[{text:`had done`,correct:!0,explanation:`Câu điều kiện loại 3 diễn tả giả định trái ngược quá khứ.`},{text:`did`,explanation:`Dùng cho loại 2. Cách dùng phù hợp trong câu này là “had done”.`,correct:!1},{text:`do`,explanation:`Dùng cho loại 1. Cách dùng phù hợp trong câu này là “had done”.`,correct:!1},{text:`done`,explanation:`Thiếu trợ động từ. Cách dùng phù hợp trong câu này là “had done”.`,correct:!1}]},{q:`If the sun shines this Saturday, we ___ to the beach.`,a:[{text:`will go`,correct:!0,explanation:`Câu điều kiện loại 1: Diễn tả sự việc có thể xảy ra.`},{text:`go`,explanation:`Sai. Sau if không điền đáp án này ở mệnh đề chính; kết quả tương lai cần will go.`,correct:!1},{text:`went`,explanation:`Sai. Went là quá khứ đơn; câu dự đoán khả năng cuối tuần cần will go.`,correct:!1},{text:`would go`,explanation:`Sai. Would go dùng cho giả định; câu này nói khả năng thật nếu mặt trời chiếu sáng.`,correct:!1}]},{q:`If birds ___ hands, they could play piano.`,a:[{text:`had`,correct:!0,explanation:`Câu điều kiện loại 2: Giả định không thể xảy ra ở hiện tại.`},{text:`have`,explanation:`Sai. Have diễn tả điều kiện hiện thực; birds có tay là giả định trái với thực tế nên dùng had.`,correct:!1},{text:`has`,explanation:`Sai. Has không hợp với chủ ngữ birds và không tạo mệnh đề điều kiện loại 2.`,correct:!1},{text:`having`,explanation:`Sai. Having không phải dạng chia dùng sau if trong câu điều kiện loại 2.`,correct:!1}]},{q:`If we ___ to the museum, we would have seen the dinosaurs.`,a:[{text:`had gone`,correct:!0,explanation:`Câu điều kiện loại 3: Diễn tả sự tiếc nuối trong quá khứ.`},{text:`go`,explanation:`Dùng cho loại 1. Cách dùng phù hợp trong câu này là “had gone”.`,correct:!1},{text:`went`,explanation:`Dùng cho loại 2. Cách dùng phù hợp trong câu này là “had gone”.`,correct:!1},{text:`going`,explanation:`Sai cấu trúc câu điều kiện loại 3. Cần lùi thì chính xác.`,correct:!1}]},{q:`I will call you if I ___ any news.`,a:[{text:`get`,correct:!0,explanation:`Câu điều kiện loại 1: Mệnh đề If dùng HTĐ.`},{text:`got`,explanation:`Dùng cho loại 2. Cách dùng phù hợp trong câu này là “get”.`,correct:!1},{text:`will get`,explanation:`Không dùng will sau If.`,correct:!1},{text:`getting`,explanation:`Sai cấu trúc câu điều kiện. Động từ chia sai thì so với mệnh đề còn lại.`,correct:!1}]},{q:`If I ___ a bird, I would fly everywhere.`,a:[{text:`were`,correct:!0,explanation:`Câu điều kiện loại 2: If + were, would + V.`},{text:`am`,explanation:`Sự thật ở hiện tại. Cách dùng phù hợp trong câu này là “were”.`,correct:!1},{text:`be`,explanation:`Sai cấu trúc câu điều kiện. Động từ chia sai thì so với mệnh đề còn lại.`,correct:!1},{text:`was`,explanation:`Dùng 'were' phổ biến hơn trong câu điều kiện.`,correct:!1}]},{q:`If she had eaten breakfast, she ___ hungry now.`,a:[{text:`wouldn't be`,correct:!0,explanation:`Câu điều kiện hỗn hợp (hoặc loại 3): Giả định quá khứ dẫn đến kết quả hiện tại.`},{text:`won't be`,explanation:`Sai. Won't be nói về kết quả tương lai; now yêu cầu kết quả hiện tại của giả định quá khứ.`,correct:!1},{text:`isn't`,explanation:`Sai. Isn't không diễn tả kết quả giả định bắt nguồn từ việc không ăn sáng trong quá khứ.`,correct:!1},{text:`wasn't`,explanation:`Sai. Wasn't không đi với chủ ngữ she trong kết quả hiện tại now; cấu trúc cần wouldn't be.`,correct:!1}]},{q:`The safety officer predicts that if you touch the hot fire now, you ___ burned immediately.`,a:[{text:`will get`,correct:!0,explanation:`Câu điều kiện loại 1: Cảnh báo sự việc sẽ xảy ra.`},{text:`gets`,explanation:`Sai. Với you phải dùng get; gets chỉ đi với he, she hoặc it.`,correct:!1},{text:`got`,explanation:`Sai. Got là quá khứ đơn, không phù hợp với lời cảnh báo về kết quả sẽ xảy ra ngay.`,correct:!1},{text:`would get`,explanation:`Sai. Would get diễn tả giả định; safety officer đang cảnh báo tình huống có thể xảy ra thật.`,correct:!1}]},{q:`If he ___ more time, he would learn guitar.`,a:[{text:`had`,correct:!0,explanation:`Câu điều kiện loại 2: If + QKĐ, would + V.`},{text:`has`,explanation:`Dùng cho loại 1. Cách dùng phù hợp trong câu này là “had”.`,correct:!1},{text:`have`,explanation:`Sai chủ ngữ. Cách dùng phù hợp trong câu này là “had”.`,correct:!1},{text:`had had`,explanation:`Dùng cho loại 3. Cách dùng phù hợp trong câu này là “had”.`,correct:!1}]},{q:`If I had seen him yesterday, I ___ hello.`,a:[{text:`would have said`,correct:!0,explanation:`Câu điều kiện loại 3: If + had V3, would have V3.`},{text:`will say`,explanation:`Dùng cho loại 1. Cách dùng phù hợp trong câu này là “would have said”.`,correct:!1},{text:`would say`,explanation:`Dùng cho loại 2. Cách dùng phù hợp trong câu này là “would have said”.`,correct:!1},{text:`said`,explanation:`Sai cấu trúc câu điều kiện loại 3. Cần lùi thì chính xác.`,correct:!1}]},{q:`The plants will die if you ___ them.`,a:[{text:`don't water`,correct:!0,explanation:`Câu điều kiện loại 1: Mệnh đề If dùng phủ định HTĐ.`},{text:`not water`,explanation:`Thiếu trợ động từ. Cách dùng phù hợp trong câu này là “don't water”.`,correct:!1},{text:`didn't water`,explanation:`Dùng cho loại 2. Cách dùng phù hợp trong câu này là “don't water”.`,correct:!1},{text:`won't water`,explanation:`Không dùng won't sau If.`,correct:!1}]},{q:`If I spoke English well, I ___ in London.`,a:[{text:`would work`,correct:!0,explanation:`Câu điều kiện loại 2: Giả định trái hiện tại.`},{text:`will work`,explanation:`Dùng cho loại 1. Cách dùng phù hợp trong câu này là “would work”.`,correct:!1},{text:`work`,explanation:`Sai cấu trúc câu điều kiện loại 2. Trái với thực tế hiện tại.`,correct:!1},{text:`worked`,explanation:`Sai. Dấu hiệu trong câu không yêu cầu thì Quá khứ đơn.`,correct:!1}]},{q:`If it ___ cold, I will wear a coat.`,a:[{text:`is`,correct:!0,explanation:`Câu điều kiện loại 1: If + HTĐ.`},{text:`was`,explanation:`Dùng cho loại 2. Cách dùng phù hợp trong câu này là “is”.`,correct:!1},{text:`be`,explanation:`Sai cấu trúc câu điều kiện. Động từ chia sai thì so với mệnh đề còn lại.`,correct:!1},{text:`will be`,explanation:`Không dùng will sau If.`,correct:!1}]},{q:`If they ___ faster, they would have won the race.`,a:[{text:`had run`,correct:!0,explanation:`Câu điều kiện loại 3: Giả định trái quá khứ.`},{text:`ran`,explanation:`Dùng cho loại 2. Cách dùng phù hợp trong câu này là “had run”.`,correct:!1},{text:`run`,explanation:`Dùng cho loại 1. Cách dùng phù hợp trong câu này là “had run”.`,correct:!1},{text:`running`,explanation:`Sai cấu trúc câu điều kiện loại 3. Cần lùi thì chính xác.`,correct:!1}]},{q:`If you ___ early, you will catch the bus.`,a:[{text:`wake up`,correct:!0,explanation:`Câu điều kiện loại 1: Mệnh đề If ở hiện tại đơn.`},{text:`woke up`,explanation:`Giả định không có kitten thật; sau if dùng quá khứ 'had'.`,correct:!1},{text:`will wake up`,explanation:`Sai cấu trúc câu điều kiện. Động từ chia sai thì so với mệnh đề còn lại.`,correct:!1},{text:`waking up`,explanation:`Thiếu động từ. Cách dùng phù hợp trong câu này là “wake up”.`,correct:!1}]},{q:`If I ___ her address, I would send her a card.`,a:[{text:`knew`,correct:!0,explanation:`Câu điều kiện loại 2: Diễn tả điều không biết ở hiện tại.`},{text:`know`,explanation:`Loại 1: if it is sunny tomorrow, result will play football.`,correct:!1},{text:`known`,explanation:`Thiếu trợ động từ. Cách dùng phù hợp trong câu này là “knew”.`,correct:!1},{text:`will know`,explanation:`Sai cấu trúc câu điều kiện. Động từ chia sai thì so với mệnh đề còn lại.`,correct:!1}]},{q:`If we ___ more money, we would have bought a car.`,a:[{text:`had had`,correct:!0,explanation:`Câu điều kiện loại 3: If + had + V3 (had).`},{text:`had`,explanation:`Giả định chạy nhanh hơn; 'ran' là quá khứ đơn trong loại 2.`,correct:!1},{text:`have`,explanation:`Cold hike condition uses present 'don't wear'; result will get cold.`,correct:!1},{text:`having`,explanation:`Sai cấu trúc câu điều kiện loại 3. Cần lùi thì chính xác.`,correct:!1}]},{q:`If the cake is sweet at tonight's party, I ___ it.`,a:[{text:`will eat`,correct:!0,explanation:`Will eat is the future result after a present condition.`},{text:`eat`,explanation:`Sai cấu trúc câu điều kiện loại 1.`,correct:!1},{text:`would eat`,explanation:`Giả định mình là robot; dùng 'were' sau if.`,correct:!1},{text:`ate`,explanation:`Sai. Phương án sử dụng sai cấu trúc ngữ pháp hoặc chia động từ không đúng.`,correct:!1}]},{q:`If I ___ a teacher, I would be very kind.`,a:[{text:`were`,correct:!0,explanation:`Were is used with I in the unreal teacher condition.`},{text:`am`,explanation:`Present eating condition leads to future result will get a stomach ache.`,correct:!1},{text:`was`,explanation:`Dùng 'were' cho mọi ngôi trong If loại 2.`,correct:!1},{text:`be`,explanation:`Sai cấu trúc câu điều kiện. Động từ chia sai thì so với mệnh đề còn lại.`,correct:!1}]},{q:`If they ___ the map, they wouldn't have got lost.`,a:[{text:`had taken`,correct:!0,explanation:`Had taken the map is a past unreal condition; result wouldn't have got lost.`},{text:`took`,explanation:`Giả định mình là ngôi sao; 'were' diễn tả hiện tại trái thực.`,correct:!1},{text:`take`,explanation:`Present help condition leads to future promise will give a candy.`,correct:!1},{text:`taking`,explanation:`Sai cấu trúc câu điều kiện loại 3.
