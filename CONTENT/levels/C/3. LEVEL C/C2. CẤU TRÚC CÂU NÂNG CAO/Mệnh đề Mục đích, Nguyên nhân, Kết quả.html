const fullQuestionBank=[{q:`She studies hard ___ pass the final exam.`,a:[{text:`so as to`,correct:!0,explanation:`'So as to pass the final exam' nêu mục tiêu của việc học chăm.`},{text:`because`,explanation:`'Because' cần một mệnh đề nguyên nhân; câu này cần cụm mục đích trước 'pass'.`,correct:!1},{text:`so that`,explanation:`'So that' phải đi với mệnh đề có chủ ngữ và động từ, không đứng trước bare infinitive 'pass'.`,correct:!1},{text:`in order`,explanation:`'In order' chưa hoàn chỉnh; mục đích cần dạng 'in order to pass'.`,correct:!1}]},{q:`I get up early ___ I won't be late for school.`,a:[{text:`so that`,correct:!0,explanation:`'So that I won't be late' có chủ ngữ I và động từ won't be, đúng dạng mệnh đề mục đích.`},{text:`to`,explanation:`'To' cần theo sau một động từ nguyên mẫu; ở đây sau chỗ trống là mệnh đề 'I won't be late'.`,correct:!1},{text:`because`,explanation:`'Because' sẽ nêu lý do dậy sớm, nhưng câu đang nêu mục tiêu tránh muộn học.`,correct:!1},{text:`in order to`,explanation:`'In order to' phải đứng ngay trước V-inf, không thể đứng trước mệnh đề 'I won't be late'.`,correct:!1}]},{q:`He saved money ___ buy a new bike.`,a:[{text:`to`,correct:!0,explanation:`'To buy a new bike' nêu mục đích của việc tiết kiệm tiền.`},{text:`for`,explanation:`'For buy' sai vì 'for' không theo sau trực tiếp bởi động từ nguyên mẫu; mục đích dùng 'to buy'.`,correct:!1},{text:`so`,explanation:`'So' cần nối hai mệnh đề có quan hệ kết quả, không đứng trước bare infinitive 'buy'.`,correct:!1},{text:`but`,explanation:`'But' chỉ tương phản, không diễn tả mục tiêu mua xe mới.`,correct:!1}]},{q:`We wear warm clothes ___ we don't catch a cold.`,a:[{text:`in order that`,correct:!0,explanation:`'In order that we don't catch a cold' là mệnh đề có chủ ngữ we và động từ don't catch.`},{text:`so as to`,explanation:`'So as to' cần một V-inf ngay sau nó; câu này cần mệnh đề 'we don't catch a cold'.`,correct:!1},{text:`due to`,explanation:`'Due to' chỉ nguyên nhân và thường theo sau danh từ, không nêu mục đích mặc quần áo ấm.`,correct:!1},{text:`for`,explanation:`'For' không thể mở mệnh đề 'we don't catch a cold'; cần liên từ mục đích 'in order that'.`,correct:!1}]},{q:`They went to the library ___ find some information.`,a:[{text:`in order to`,correct:!0,explanation:`'In order to find some information' nêu mục đích đi thư viện.`},{text:`because`,explanation:`'Because' sẽ giải thích lý do đi thư viện, không phải mục tiêu tìm thông tin.`,correct:!1},{text:`so`,explanation:`'So' cần một mệnh đề kết quả, không đứng trước bare infinitive 'find'.`,correct:!1},{text:`and`,explanation:`'And' chỉ nối hai hành động, không nêu mục tiêu của việc đi thư viện.`,correct:!1}]},{q:`I turned off the TV ___ I could focus on my homework.`,a:[{text:`so that`,correct:!0,explanation:`'So that I could focus on my homework' nêu mục tiêu của việc tắt TV bằng một mệnh đề đầy đủ.`},{text:`to`,explanation:`'To' cần một V-inf ngay sau nó; sau chỗ trống là chủ ngữ 'I', không phải động từ.`,correct:!1},{text:`because`,explanation:`'Because' sẽ nêu nguyên nhân tắt TV, còn ý câu là mục tiêu tập trung học.`,correct:!1},{text:`as`,explanation:`'As' không phù hợp để mở mệnh đề mục đích có 'could focus' trong câu này.`,correct:!1}]},{q:`She practices piano every day ___ win the competition.`,a:[{text:`so as to`,correct:!0,explanation:`'So as to win the competition' nêu mục tiêu luyện piano mỗi ngày.`},{text:`so`,explanation:`'So' không đứng trực tiếp trước V-inf 'win' để chỉ mục đích.`,correct:!1},{text:`because`,explanation:`'Because' sẽ giải thích lý do luyện tập, không diễn tả mục tiêu thắng cuộc thi.`,correct:!1},{text:`for`,explanation:`'For win' sai dạng; giới từ 'for' không thay cho cụm mục đích 'so as to win'.`,correct:!1}]},{q:`He whispered ___ nobody could hear their conversation.`,a:[{text:`so that`,correct:!0,explanation:`'So that nobody could hear' nêu mục tiêu nói thầm bằng mệnh đề có chủ ngữ và động từ.`},{text:`to`,explanation:`'To' cần V-inf ngay sau nó, nhưng câu cần chủ ngữ 'nobody' trước 'could hear'.`,correct:!1},{text:`because`,explanation:`'Because' sẽ nêu lý do nói thầm, không nêu mục tiêu để người khác không nghe thấy.`,correct:!1},{text:`in order to`,explanation:`'In order to' phải theo sau V-inf; câu này đã có mệnh đề 'nobody could hear'.`,correct:!1}]},{q:`We left early ___ avoid the heavy traffic.`,a:[{text:`to`,correct:!0,explanation:`'To avoid the heavy traffic' nêu mục tiêu rời đi sớm.`},{text:`for`,explanation:`'For avoid' sai vì không dùng 'for' trước V-inf để chỉ mục đích.`,correct:!1},{text:`so that`,explanation:`'So that' cần một mệnh đề có chủ ngữ/động từ, không đi trước bare infinitive 'avoid'.`,correct:!1},{text:`as`,explanation:`'As avoid' không phải cấu trúc tiếng Anh; 'as' không nối mục đích với V-inf.`,correct:!1}]},{q:`I wrote the phone number down ___ I wouldn't forget it.`,a:[{text:`so that`,correct:!0,explanation:`'So that I wouldn't forget it' nêu mục tiêu ghi số điện thoại bằng mệnh đề phủ định đầy đủ.`},{text:`in order to`,explanation:`'In order to' cần V-inf ngay sau nó, nhưng câu cần chủ ngữ 'I' và 'wouldn't forget'.`,correct:!1},{text:`because`,explanation:`'Because' sẽ nêu lý do viết số, không diễn tả mục tiêu tránh quên.`,correct:!1},{text:`therefore`,explanation:`'Therefore' chỉ kết quả, không giới thiệu mệnh đề mục đích sau hành động ghi số.`,correct:!1}]},{q:`He wore a mask ___ hide his face.`,a:[{text:`so as to`,correct:!0,explanation:`'So as to hide his face' nêu mục tiêu đeo mặt nạ.`},{text:`for`,explanation:`'For hide' sai vì 'for' không đứng trước V-inf để diễn tả mục đích.`,correct:!1},{text:`because`,explanation:`'Because' giải thích nguyên nhân đeo mặt nạ, không phải mục tiêu che mặt.`,correct:!1},{text:`so`,explanation:`'So' không thể đứng trực tiếp trước V-inf 'hide' trong cấu trúc mục đích.`,correct:!1}]},{q:`The kids went to the park ___ play football.`,a:[{text:`to`,correct:!0,explanation:`'To play football' nêu mục tiêu các em đi công viên.`},{text:`for`,explanation:`'For play' sai dạng; muốn dùng 'for' phải có danh từ hoặc V-ing theo nghĩa khác.`,correct:!1},{text:`so`,explanation:`'So' cần mệnh đề kết quả, không nối địa điểm với V-inf 'play'.`,correct:!1},{text:`because`,explanation:`'Because' nêu lý do đi công viên, không nêu hoạt động dự định thực hiện ở đó.`,correct:!1}]},{q:`She took an umbrella ___ she wouldn't get wet.`,a:[{text:`so that`,correct:!0,explanation:`'So that she wouldn't get wet' là mệnh đề mục đích đầy đủ sau hành động mang ô.`},{text:`in order to`,explanation:`'In order to' cần V-inf, nhưng sau chỗ trống là chủ ngữ 'she'.`,correct:!1},{text:`because`,explanation:`'Because' sẽ nêu nguyên nhân lấy ô, trong khi câu nêu mục tiêu tránh bị ướt.`,correct:!1},{text:`to`,explanation:`'To' cần một động từ nguyên mẫu ngay sau nó; câu cần mệnh đề 'she wouldn't get wet'.`,correct:!1}]},{q:`He runs every morning ___ keep fit.`,a:[{text:`in order to`,correct:!0,explanation:`'In order to keep fit' chỉ mục tiêu chạy bộ mỗi sáng là giữ dáng.`},{text:`so`,explanation:`'So keep fit' thiếu chủ ngữ/mệnh đề cần thiết; 'so' không đi trước V-inf để chỉ mục đích.`,correct:!1},{text:`because`,explanation:`'Because' sẽ nêu lý do chạy, không nêu mục tiêu giữ dáng.`,correct:!1},{text:`as`,explanation:`'As keep fit' không phải cấu trúc mục đích; 'as' cần mệnh đề hoặc vai trò khác.`,correct:!1}]},{q:`I am learning English ___ get a better job in the future.`,a:[{text:`to`,correct:!0,explanation:`'To get a better job' nêu mục tiêu học tiếng Anh trong tương lai.`},{text:`for`,explanation:`'For get' sai vì 'for' không đứng trước V-inf trong cụm mục đích này.`,correct:!1},{text:`so that`,explanation:`'So that' phải theo sau mệnh đề có chủ ngữ và động từ, không trực tiếp trước 'get'.`,correct:!1},{text:`as`,explanation:`'As get a better job' không tạo mệnh đề đúng và không diễn tả mục đích học.`,correct:!1}]},{q:`They locked the gate ___ the dog couldn't get out.`,a:[{text:`so that`,correct:!0,explanation:`'So that the dog couldn't get out' nêu mục tiêu khóa cổng để ngăn chó chạy ra.`},{text:`to`,explanation:`'To' cần V-inf, nhưng sau chỗ trống là chủ ngữ 'the dog' và modal 'couldn't'.`,correct:!1},{text:`because`,explanation:`'Because' sẽ giải thích lý do khóa cổng, không diễn tả mục tiêu ngăn chó thoát.`,correct:!1},{text:`for`,explanation:`'For' không mở được mệnh đề có chủ ngữ và động từ 'the dog couldn't get out'.`,correct:!1}]},{q:`She went to the kitchen ___ make a sandwich.`,a:[{text:`to`,correct:!0,explanation:`'To make a sandwich' nêu mục tiêu cô ấy đi vào bếp.`},{text:`so`,explanation:`'So make' không phải cụm mục đích; 'so' cần mệnh đề kết quả.`,correct:!1},{text:`as`,explanation:`'As make a sandwich' sai cấu trúc và không diễn tả mục tiêu.`,correct:!1},{text:`because`,explanation:`'Because' sẽ nêu lý do đi bếp, không nêu việc muốn làm sandwich.`,correct:!1}]},{q:`He turned on the light ___ he could see better.`,a:[{text:`so that`,correct:!0,explanation:`'So that he could see better' dùng mệnh đề mục đích với modal 'could'.`},{text:`in order to`,explanation:`'In order to' cần V-inf ngay sau nó, nhưng câu cần chủ ngữ 'he could see'.`,correct:!1},{text:`to`,explanation:`'To' không thể mở mệnh đề 'he could see'; sau nó phải là một động từ nguyên mẫu không có chủ ngữ riêng.`,correct:!1},{text:`because`,explanation:`'Because' chỉ nguyên nhân bật đèn, còn câu nhấn mạnh mục tiêu nhìn rõ hơn.`,correct:!1}]},{q:`I use a dictionary ___ look up new words.`,a:[{text:`so as to`,correct:!0,explanation:`'So as to look up new words' nêu mục tiêu dùng từ điển để tra từ mới.`},{text:`for`,explanation:`'For look up' sai vì không dùng 'for' trước V-inf trong cụm mục đích.`,correct:!1},{text:`so`,explanation:`'So look up' thiếu mệnh đề kết quả và không tạo cụm mục đích.`,correct:!1},{text:`that`,explanation:`'That look up new words' thiếu cấu trúc 'so that' và cũng không có mệnh đề đầy đủ.`,correct:!1}]},{q:`We need a map ___ we won't get lost.`,a:[{text:`so that`,correct:!0,explanation:`'So that we won't get lost' n
