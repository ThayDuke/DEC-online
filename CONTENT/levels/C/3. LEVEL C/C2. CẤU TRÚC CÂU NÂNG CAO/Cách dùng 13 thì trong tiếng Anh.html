const fullQuestionBank=[{q:`Thì nào dùng để diễn tả một sự thật hiển nhiên hoặc một chân lý?`,a:[{text:`Hiện tại đơn`,correct:!0,explanation:`Đúng. Hiện tại đơn diễn tả chân lý như 'Mặt trời mọc ở hướng Đông'.`},{text:`Quá khứ đơn`,explanation:`Sai. Quá khứ đơn diễn tả việc đã kết thúc.`,correct:!1},{text:`Hiện tại tiếp diễn`,explanation:`Sai. Thì này diễn tả việc đang xảy ra.`,correct:!1},{text:`Tương lai đơn`,explanation:`Sai. Chân lý dùng Hiện tại đơn; Tương lai đơn không diễn tả sự thật hiển nhiên.`,correct:!1}]},{q:`Cách dùng: 'Diễn tả một thói quen hoặc hành động lặp đi lặp lại' là của thì nào?`,a:[{text:`Hiện tại đơn`,correct:!0,explanation:`Chính xác. Ví dụ: 'I go to school every day'.`},{text:`Hiện tại hoàn thành`,explanation:`Sai. Thói quen lặp lại dùng Hiện tại đơn; Hiện tại hoàn thành không phải lựa chọn yêu cầu.`,correct:!1},{text:`Quá khứ tiếp diễn`,explanation:`Sai. Thói quen lặp lại dùng Hiện tại đơn, không phải Quá khứ tiếp diễn.`,correct:!1},{text:`Tương lai gần`,explanation:`Sai. Thói quen không dùng Tương lai gần.`,correct:!1}]},{q:`Câu 'The sun rises in the East' sử dụng thì hiện tại đơn vì:`,a:[{text:`Diễn tả một chân lý`,correct:!0,explanation:`Việc mặt trời mọc hướng Đông là một sự thật hiển nhiên.`},{text:`Diễn tả lịch trình`,explanation:`Sai. Cấu trúc 'Diễn tả lịch trình' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Diễn tả cảm xúc`,explanation:`Sai. Cấu trúc 'Diễn tả cảm xúc' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Diễn tả dự định`,explanation:`Sai. 'The sun rises' nêu chân lý, không phải dự định.`,correct:!1}]},{q:`Khi muốn nói về một lịch trình tàu hỏa hoặc thời gian biểu trường học, ta dùng thì:`,a:[{text:`Hiện tại đơn`,correct:!0,explanation:`Hiện tại đơn dùng cho lịch trình, thời gian biểu cố định.`},{text:`Tương lai đơn`,explanation:`Sai. Lịch trình cố định dùng Hiện tại đơn, không phải Tương lai đơn.`,correct:!1},{text:`Hiện tại tiếp diễn`,explanation:`Sai. Lịch trình cố định dùng Hiện tại đơn; Hiện tại tiếp diễn không phải đáp án chuẩn ở đây.`,correct:!1},{text:`Quá khứ đơn`,explanation:`Sai. Lịch trình tàu dùng Hiện tại đơn, không phải Quá khứ đơn.`,correct:!1}]},{q:`Ví dụ tiếng Việt: 'Tôi đánh răng mỗi sáng.' Bạn sẽ dùng thì nào để dịch sang tiếng Anh?`,a:[{text:`Hiện tại đơn`,correct:!0,explanation:`Đây là một thói quen lặp lại hàng ngày.`},{text:`Hiện tại tiếp diễn`,explanation:`Sai. Thói quen mỗi sáng dùng Hiện tại đơn, không dùng Hiện tại tiếp diễn.`,correct:!1},{text:`Tương lai đơn`,explanation:`Sai. Thói quen mỗi sáng cần Hiện tại đơn, không dùng will.`,correct:!1},{text:`Quá khứ đơn`,explanation:`Sai. Thói quen mỗi sáng dùng Hiện tại đơn; Quá khứ đơn đổi nghĩa sang đã kết thúc.`,correct:!1}]},{q:`Thì Quá khứ đơn dùng để diễn tả điều gì?`,a:[{text:`Hành động đã xảy ra và kết thúc trong quá khứ`,correct:!0,explanation:`Đúng. Hành động thuộc một khoảng thời gian đã kết thúc, dù mốc thời gian có thể được nêu hoặc hiểu từ ngữ cảnh.`},{text:`Hành động đang xảy ra`,explanation:`Sai. Hành động đang diễn ra trong quá khứ cần Quá khứ tiếp diễn, không phải nhãn chung này.`,correct:!1},{text:`Hành động chưa xảy ra`,explanation:`Sai. Cấu trúc 'Hành động chưa xảy ra' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Hành động lặp lại ở hiện tại`,explanation:`Sai. Cấu trúc 'Hành động lặp lại ở hiện tại' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Câu 'I watched a movie last night' diễn đạt cách dùng nào?`,a:[{text:`Hành động xảy ra và kết thúc trong quá khứ`,correct:!0,explanation:`Hành động xem phim đã xong vào tối qua.`},{text:`Hành động lặp lại`,explanation:`Sai. 'I watched a movie last night' là một hành động đã kết thúc, không lặp lại.`,correct:!1},{text:`Một dự đoán`,explanation:`Sai. Cấu trúc 'Một dự đoán' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Một lời hứa`,explanation:`Sai. 'I watched a movie last night' là hành động quá khứ, không phải lời hứa.`,correct:!1}]},{q:`Để diễn tả các hành động xảy ra liên tiếp trong quá khứ (kể chuyện), ta dùng:`,a:[{text:`Quá khứ đơn`,correct:!0,explanation:`Ví dụ: Anh ấy đến, nhìn tôi và mỉm cười.`},{text:`Quá khứ tiếp diễn`,explanation:`Sai. Kể chuyện hành động nối tiếp dùng Quá khứ đơn.`,correct:!1},{text:`Hiện tại đơn`,explanation:`Sai. Kể chuyện các hành động nối tiếp trong quá khứ dùng Quá khứ đơn, không phải Hiện tại đơn.`,correct:!1},{text:`Quá khứ hoàn thành`,explanation:`Sai. Kể chuyện các hành động nối tiếp trong quá khứ dùng Quá khứ đơn, không phải hoàn thành.`,correct:!1}]},{q:`Ví dụ tiếng Việt: 'Hôm qua, Lan đã mua một chiếc váy mới.' Thì phù hợp là:`,a:[{text:`Quá khứ đơn`,correct:!0,explanation:`Vì có mốc thời gian 'hôm qua' và việc mua đã xong.`},{text:`Hiện tại hoàn thành`,explanation:`Sai. Ví dụ 'hôm qua' có thời điểm xác định nên dùng Quá khứ đơn.`,correct:!1},{text:`Quá khứ tiếp diễn`,explanation:`Sai. Ví dụ 'hôm qua' là hành động đã kết thúc, dùng Quá khứ đơn.`,correct:!1},{text:`Tương lai đơn`,explanation:`Sai. Ví dụ 'hôm qua' yêu cầu Quá khứ đơn, không phải tương lai.`,correct:!1}]},{q:`Thì nào được dùng trong câu điều kiện loại II để diễn tả điều không có thật ở hiện tại?`,a:[{text:`Quá khứ đơn`,correct:!0,explanation:`Cấu trúc If + S + V2/ed.`},{text:`Hiện tại đơn`,explanation:`Sai. Điều kiện loại II dùng Quá khứ đơn ở vế If, không dùng Hiện tại đơn.`,correct:!1},{text:`Tương lai đơn`,explanation:`Sai. Điều kiện loại II dùng quá khứ đơn ở vế If; Tương lai đơn không thể hiện giả định trái hiện tại.`,correct:!1},{text:`Quá khứ hoàn thành`,explanation:`Sai. Điều kiện loại II dùng Quá khứ đơn, không dùng Quá khứ hoàn thành.`,correct:!1}]},{q:`Thì Tương lai đơn (Will) thường dùng để diễn tả:`,a:[{text:`Dự định đột xuất ngay lúc nói`,correct:!0,explanation:`Will dùng cho quyết định tức thời, không chuẩn bị trước.`},{text:`Kế hoạch chắc chắn`,explanation:`Sai. Cấu trúc 'Kế hoạch chắc chắn' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Thói quen`,explanation:`Sai. Will thường nêu lời hứa/đề nghị; 'Thói quen' không phải chức năng đang hỏi.`,correct:!1},{text:`Kinh nghiệm`,explanation:`Sai. 'I will call you' là lời hứa, không phải cách nói về kinh nghiệm.`,correct:!1}]},{q:`Khi muốn đưa ra một lời hứa, đề nghị hoặc đe dọa, bạn dùng thì:`,a:[{text:`Tương lai đơn`,correct:!0,explanation:`Ví dụ: 'I will help you' (Tôi sẽ giúp bạn).`},{text:`Tương lai gần`,explanation:`Sai. Lời hứa dùng will; Tương lai gần diễn tả dự định hoặc bằng chứng.`,correct:!1},{text:`Hiện tại đơn`,explanation:`Sai. Lời hứa/đề nghị dùng Tương lai đơn, không phải Hiện tại đơn.`,correct:!1},{text:`Quá khứ đơn`,explanation:`Sai. Lời hứa dùng Tương lai đơn, không phải Quá khứ đơn.`,correct:!1}]},{q:`Sự khác biệt của Tương lai gần (Be going to) so với Tương lai đơn là:`,a:[{text:`Diễn tả hành động có kế hoạch từ trước`,correct:!0,explanation:`Đúng. Tương lai gần có dự định và căn cứ rõ ràng.`},{text:`Diễn tả lời hứa`,explanation:`Sai. Câu nói về lịch trình cố định, không phải một lời hứa.`,correct:!1},{text:`Diễn tả thói quen`,explanation:`Sai. Câu đang hỏi chức năng lời hứa, không phải thói quen.`,correct:!1},{text:`Diễn tả chân lý`,explanation:`Sai. Câu hỏi về lịch trình, không phải chân lý.`,correct:!1}]},{q:`Ví dụ tiếng Việt: 'Nhìn những đám mây đen kìa, trời sắp mưa rồi.' Bạn dùng thì nào?`,a:[{text:`Tương lai gần`,correct:!0,explanation:`Dùng cho dự đoán dựa trên căn cứ hiện tại (mây đen).`},{text:`Tương lai đơn`,explanation:`Sai vì đây không phải dự đoán cảm tính.`,correct:!1},{text:`Hiện tại đơn`,explanation:`Sai. Dự báo từ bằng chứng hiện tại dùng Tương lai gần.`,correct:!1},{text:`Quá khứ đơn`,explanation:`Sai. Dự báo từ mây đen dùng Tương lai gần, không phải Quá khứ đơn.`,correct:!1}]},{q:`Câu 'I will open the door for you' thể hiện cách dùng nào?`,a:[{text:`Một lời ngỏ ý giúp đỡ`,correct:!0,explanation:`Dùng 'Will' để ngỏ ý giúp người khác.`},{text:`Một kế hoạch`,explanation:`Sai. Cấu trúc 'Một kế hoạch' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Một thói quen`,explanation:`Sai. 'I will open the door' là quyết định/lời đề nghị tại lúc nói, không phải một thói quen.`,correct:!1},{text:`Một kinh nghiệm`,explanation:`Sai. Cấu trúc 'Một kinh nghiệm' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Thì Hiện tại tiếp diễn dùng để diễn tả hành động nào?`,a:[{text:`Hành động đang xảy ra tại thời điểm nói`,correct:!0,explanation:`Ví dụ: 'I am speaking' (Tôi đang nói).`},{text:`Hành động đã kết thúc`,explanation:`Sai. Câu 'I watched a movie last night' mới là hành động đã kết thúc; lựa chọn này hỏi công dụng khác.`,correct:!1},{text:`Hành động lặp lại`,explanation:`Sai. Hành động đang diễn ra khi bị xen vào không phải nhãn hành động lặp lại.`,correct:!1},{text:`Sự thật hiển nhiên`,explanation:`Sai. Cấu trúc 'Sự thật hiển nhiên' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Câu 'She is coming this weekend' (đã có lịch) thể hiện cách dùng:`,a:[{text:`Hành động sắp xảy ra đã lên lịch sẵn`,correct:!0,explanation:`Hiện tại tiếp diễn còn dùng cho kế hoạch tương lai gần.`},{text:`Hành động đang xảy ra`,explanation:`Sai. Lịch cuối tuần đã có sẵn là kế hoạch, không mô tả hành động đang xảy ra ngay.`,correct:!1},{text:`Thói quen`,explanation:`Sai. Kinh nghiệm không rõ thời điểm không đồng nghĩa với một thói quen.`,correct:!1},{text:`Lời hứa`,explanation:`Sai. Từ vựng hoặc dạng từ 'Lời hứa' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Quá khứ tiếp diễn dùng để diễn tả:`,a:[{text:`Hành động đang xảy ra tại một thời điểm xác định trong quá khứ`,correct:!0,explanation:`Ví dụ: 'Lúc 8 giờ tối qua tôi đang học'.`},{text:`Hành động đã kết thúc`,explanation:`Sai. Hành động đang diễn ra khi bị xen vào cần nhấn quá trình, không chỉ kết thúc.`,correct:!1},{text:`Dự định trong tương lai`,explanation:`Sai. Cấu trúc 'Dự định trong tương lai' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Kinh nghiệm`,explanation:`Sai. Hành động đang diễn ra trong quá khứ không phải trải nghiệm không rõ thời điểm.`,correct:!1}]},{q:`Khi một hành động đang diễn ra trong quá khứ thì có hành động khác xen vào, hành động đang diễn ra chia thì:`,a:[{text:`Quá khứ tiếp diễn`,correct:!0,explanation:`Hành động nền chia QKTD, hành động xen vào chia QKĐ.`},{text:`Quá khứ đơn`,explanation:`Sai. Quá khứ đơn diễn tả hành động xen vào, không phải hành động đang diễn ra.`,correct:!1},{text:`Hiện tại tiếp diễn`,explanation:`Sai. Hành động xen vào một hành động đang diễn ra trong quá khứ cần Quá khứ đơn/tiếp diễn theo vai trò, không phải Hiện tại tiếp diễn.`,correct:!1},{text:`Quá khứ hoàn thành`,explanation:`Sai. Quá khứ hoàn thành diễn tả hành động xảy ra trước, không phải hành động đang diễn ra khi bị xen vào.`,correct:!1}]},{q:`Thì Tương lai tiếp diễn (Will be V-ing) dùng để:`,a:[{text:`Diễn tả hành động đang xảy ra tại thời điểm xác định trong tương lai`,correct:!0,explanation:`Ví dụ: 'Giờ này ngày mai tôi đang bay đi Pháp'.`},{text:`Diễn tả dự định`,explanation:`Sai. 'I promise' nêu lời hứa, không phải dự định đã có.`,correct:!1},{text:`Diễn tả lời hứa`,explanation:`Sai. 'I will call you' là lời hứa, nhưng câu hỏi đang kiểm tra cách dùng Tương lai tiếp diễn.`,correct:!1},{text:`Diễn tả chân lý`,explanation:`Sai. Lời hứa không phải một chân lý chung.`,correct:!1}]},{q:`Thì Hiện tại hoàn thành dùng để diễn tả:`,a:[{text:`Hành động bắt đầu trong quá khứ và còn tiếp diễn đến hiện tại`,correct:!0,explanation:`Đây là cách dùng phổ biến nhất (với since/for).`},{text:`Hành động kết thúc hẳn`,explanation:`Sai. Cấu trúc 'Hành động kết thúc hẳn' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Dự đoán tương lai`,explanation:`Sai. Cấu trúc 'Dự đoán tương lai' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Thói quen hiện tại`,explanation:`Sai. Cấu trúc 'Thói quen hiện tại' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Khi muốn nói về một trải nghiệm hoặc kinh nghiệm mà không rõ thời gian, ta dùng:`,a:[{text:`Hiện tại hoàn thành`,correct:!0,explanation:`Ví dụ: 'I have been to Paris' (Tôi đã từng đến Paris).`},{text:`Quá khứ đơn`,explanation:`Sai vì QKĐ cần mốc thời gian rõ ràng.`,correct:!1},{text:`Hiện tại đơn`,explanation:`Sai. Trải nghiệm không rõ thời điểm dùng Hiện tại hoàn thành.`,correct:!1},{text:`Tương lai đơn`,explanation:`Sai. Trải nghiệm không rõ thời điểm dùng Hiện tại hoàn thành, không dùng will.`,correct:!1}]},{q:`Câu 'I have just lost my keys' diễn tả điều gì?`,a:[{text:`Sự việc vừa mới xảy ra và để lại hậu quả`,correct:!0,explanation:`Vừa mới mất chìa khóa, giờ không vào được nhà.`},{text:`Một thói quen`,explanation:`Sai. 'I have just lost my keys' là sự việc vừa xảy ra, không phải một thói quen.`,correct:!1},{text:`Một lời hứa`,explanation:`Sai. 'I have just lost my keys' mô tả kết quả vừa xảy ra, không phải lời hứa.`,correct:!1},{text:`Lịch trình`,explanation:`Sai. Từ vựng hoặc dạng từ 'Lịch trình' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Sự khác biệt của Hiện tại hoàn thành tiếp diễn so với Hiện tại hoàn thành là:`,a:[{text:`Nhấn mạnh tính liên tục, kéo dài của hành động`,correct:!0,explanation:`Ví dụ: 'Tôi đã đợi suốt 3 tiếng đồng hồ rồi'.`},{text:`Nhấn mạnh kết quả`,explanation:`Sai. Cấu trúc 'Nhấn mạnh kết quả' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Chỉ kinh nghiệm`,explanation:`Sai. Cấu trúc 'Chỉ kinh nghiệm' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Chỉ thói quen`,explanation:`Sai. Cấu trúc 'Chỉ thói quen' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Ví dụ tiếng Việt: 'Tôi đã học tiếng Anh liên tục được 5 năm rồi (nhấn mạnh quá trình vẫn đang diễn ra).' Bạn dùng thì gì?`,a:[{text:`Hiện tại hoàn thành tiếp diễn`,correct:!0,explanation:`Cụm 'liên tục được 5 năm' nhấn mạnh quá trình kéo dài đến hiện tại, nên dùng hiện tại hoàn thành tiếp diễn.`},{text:`Quá khứ đơn`,explanation:`Sai vì QKĐ là đã dừng lại.`,correct:!1},{text:`Hiện tại đơn`,explanation:`Sai. Quá trình học 5 năm vẫn tiếp diễn cần Hiện tại hoàn thành tiếp diễn.`,correct:!1},{text:`Tương lai đơn`,explanation:`Sai. Nhấn mạnh đã học liên tục 5 năm đến hiện tại cần Hiện tại hoàn thành tiếp diễn.`,correct:!1}]},{q:`Thì Quá khứ hoàn thành dùng để diễn tả hành động nào?`,a:[{text:`Hành động xảy ra và hoàn thành trước một hành động khác trong quá khứ`,correct:!0,explanation:`Hành động xảy ra trước chia QKHT, sau chia QKĐ.`},{text:`Hành động đang xảy ra`,explanation:`Sai. Học liên tục 5 năm nhấn mạnh quá trình, cần Hiện tại hoàn thành tiếp diễn.`,correct:!1},{text:`Hành động kết nối với hiện tại`,explanation:`Sai. Cấu trúc 'Hành động kết nối với hiện tại' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Dự báo tương lai`,explanation:`Sai. Cấu trúc 'Dự báo tương lai' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Trong câu: 'When I arrived at the station, the train ___ already (leave); it had departed before my arrival.', ta dùng:`,a:[{text:`had left (Quá khứ hoàn thành)`,correct:!0,explanation:`Past Perfect 'had left' đánh dấu chuyến tàu đã rời đi trước mốc quá khứ 'arrived'.`},{text:`left (Quá khứ đơn)`,explanation:`Sai theo dữ kiện 'had departed before my arrival': Past Simple không đánh dấu rõ quan hệ xảy ra trước.`,correct:!1},{text:`was leaving`,explanation:`Sai. 'Was leaving' diễn tả quá trình đang xảy ra quanh mốc đến, không phải việc đã hoàn tất trước đó.`,correct:!1},{text:`has left`,explanation:`Sai. Present Perfect không dùng để sắp xếp hai hành động đều thuộc một mốc quá khứ đã xác định.`,correct:!1}]},{q:`Thì Tương lai hoàn thành (Will have V3/ed) dùng để:`,a:[{text:`Diễn tả hành động hoàn thành trước một thời điểm hoặc hành động khác trong tương lai`,correct:!0,explanation:`Ví dụ: 'Trước 10 giờ tối mai tôi sẽ làm xong bài tập'.`},{text:`Diễn tả lời hứa`,explanation:`Sai. Câu hỏi về thời hạn hoàn thành, không phải chức năng lời hứa.`,correct:!1},{text:`Diễn tả thói quen`,explanation:`Sai. 'I will call you' là lời hứa, không phải thói quen lặp lại.`,correct:!1},{text:`Diễn tả đang xảy ra`,explanation:`Sai. Cấu trúc 'Diễn tả đang xảy ra' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Cách dùng 'Diễn tả hành động xảy ra liên tục trước một hành động khác trong quá khứ' là của thì:`,a:[{text:`Quá khứ hoàn thành tiếp diễn`,correct:!0,explanation:`Đúng. Nó nhấn mạnh quá trình liên tục trước một mốc quá khứ.`},{text:`Quá khứ đơn`,explanation:`Sai. Quá khứ đơn không nhấn mạnh quá trình liên tục trước mốc quá khứ.`,correct:!1},{text:`Hiện tại hoàn thành`,explanation:`Sai. Hiện tại hoàn thành gắn với hiện tại; câu này yêu cầu quá trình trước một hành động quá khứ.`,correct:!1},{text:`Quá khứ hoàn thành`,explanation:`Sai theo tiêu chí 'liên tục': Past Perfect chỉ nêu kết quả trước mốc quá khứ, không nhấn mạnh thời lượng.`,correct:!1}]},{q:`Tính đến cuối năm nay, tôi sẽ vẫn đang làm việc ở đây và đủ 10 năm. Bạn dùng thì gì?`,a:[{text:`Tương lai hoàn thành tiếp diễn`,correct:!0,explanation:`Cụm 'vẫn đang làm việc' và thời lượng 'đủ 10 năm' yêu cầu Future Perfect Continuous: will have been working.`},{text:`Tương lai đơn`,explanation:`Sai. Will + V không diễn tả quá trình kéo dài đủ 10 năm đến một mốc tương lai.`,correct:!1},{text:`Hiện tại hoàn thành`,explanation:`Sai. Present Perfect nối với hiện tại, không khóa được quá trình đang tiếp diễn đến mốc cuối năm.`,correct:!1},{text:`Hiện tại đơn`,explanation:`Sai. Present Simple không diễn tả thời lượng tích lũy đến một mốc tương lai.`,correct:!1}]},{q:`Thì nào diễn tả một sự việc chung chung ở hiện tại?`,a:[{text:`Hiện tại đơn`,correct:!0,explanation:`Hiện tại đơn dùng để nêu sự thật hoặc tình trạng chung ở hiện tại.`},{text:
