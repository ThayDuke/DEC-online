const fullQuestionBank=[{q:`Both Tuan ___ Lan like playing badminton. 🏸`,a:[{text:`and`,correct:!0,explanation:`Cấu trúc 'Both... and...' (Cả... và...).`},{text:`or`,explanation:`Sai. 'Or' đi với 'Either'.`,correct:!1},{text:`nor`,explanation:`Sai. 'Nor' đi với 'Neither'.`,correct:!1},{text:`but`,explanation:`Sai cấu trúc. Phương án 'but' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`You can choose ___ tea or coffee. ☕`,a:[{text:`either`,correct:!0,explanation:`Cấu trúc 'Either... or...' (Hoặc... hoặc...).`},{text:`neither`,explanation:`Sai. 'Neither' đi với 'nor'.`,correct:!1},{text:`both`,explanation:`Sai. 'Both' đi với 'and'.`,correct:!1},{text:`not only`,explanation:`Sai cấu trúc. Phương án 'not only' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`Neither the teacher ___ the students are in the classroom. 🏫`,a:[{text:`nor`,correct:!0,explanation:`Cấu trúc 'Neither... nor...' (Không... cũng không...).`},{text:`or`,explanation:`Sai. 'Or' đi với 'Either'.`,correct:!1},{text:`and`,explanation:`Sai. 'And' đi với 'Both'.`,correct:!1},{text:`but`,explanation:`Sai cấu trúc. Phương án 'but' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`He is not only handsome ___ also intelligent. 🧠`,a:[{text:`but`,correct:!0,explanation:`Cấu trúc 'Not only... but also...' (Không những... mà còn...).`},{text:`and`,explanation:`Sai. Từ vựng hoặc dạng từ 'and' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`or`,explanation:`Sai. Từ vựng hoặc dạng từ 'or' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`nor`,explanation:`Sai. Từ vựng hoặc dạng từ 'nor' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`I don't know ___ he will come or not. ❓`,a:[{text:`whether`,correct:!0,explanation:`Cấu trúc 'Whether... or...' (Liệu... hay...).`},{text:`neither`,explanation:`Sai. Từ vựng hoặc dạng từ 'neither' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:
