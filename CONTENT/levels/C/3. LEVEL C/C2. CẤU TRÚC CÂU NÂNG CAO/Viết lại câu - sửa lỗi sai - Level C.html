const fullQuestionBank=[{q:`She go to the park every Sunday.`,a:[{text:`She goes to the park every Sunday.`,correct:!0,explanation:`Chủ ngữ 'She' là ngôi thứ 3 số ít, động từ 'go' phải thêm 'es'.`},{text:`She going to the park every Sunday.`,explanation:`Thiếu động từ to-be và sai thì.`,correct:!1},{text:`She go to park every Sunday.`,explanation:`Thiếu mạo từ 'the' trước danh từ chỉ địa điểm.`,correct:!1},{text:`She goes to park every Sunday.`,explanation:`Thiếu mạo từ 'the'. Cách dùng phù hợp trong câu này là “She goes to the park every Sunday.”.`,correct:!1}]},{q:`I have many money in my pocket.`,a:[{text:`I have much money in my pocket.`,correct:!0,explanation:`'Money' là danh từ không đếm được, dùng 'much' thay vì 'many'.`},{text:`I have many moneys in my pocket.`,explanation:`Money không có dạng số nhiều 'moneys'.`,correct:!1},{text:`I has much money in my pocket.`,explanation:`Chủ ngữ 'I' đi với 'have'.`,correct:!1},{text:`I have a few money in my pocket.`,explanation:`Dùng 'a few' cho danh từ đếm được số nhiều.`,correct:!1}]},{q:`The children is playing in the garden.`,a:[{text:`The children are playing in the garden.`,correct:!0,explanation:`'Children' là danh từ số nhiều, dùng động từ 'are'.`},{text:`The childs are playing in the garden.`,explanation:`Số nhiều của 'child' là 'children', không phải 'childs'.`,correct:!1},{text:`The children playing in the garden.`,explanation:`Thiếu động từ to-be 'are'.`,correct:!1},{text:`The children is play in the garden.`,explanation:`Sai cấu trúc thì hiện tại tiếp diễn.`,correct:!1}]},{q:`He can speaks English very well.`,a:[{text:`He can speak English very well.`,correct:!0,explanation:`Sau động từ khuyết thiếu 'can', động từ giữ nguyên mẫu không 's'.`},{text:`He can speaking English very well.`,explanation:`Sau 'can' không dùng V-ing.`,correct:!1},{text:`He cans speak English very well.`,explanation:`Động từ 'can' không bao giờ thêm 's'.`,correct:!1},{text:`He can to speak English very well.`,explanation:`Sau 'can' không dùng 'to'.`,correct:!1}]},{q:`Look! The bus come.`,a:[{text:`Look! The bus is coming.`,correct:!0,explanation:`Dấu hiệu 'Look!' cho biết hành động đang xảy ra, dùng thì hiện tại tiếp diễn.`},{text:`Look! The bus comes.`,explanation:`Thì hiện tại đơn không dùng cho hành động đang diễn ra tại thời điểm nói.`,correct:!1},{text:`Look! The bus coming.`,explanation:`Thiếu động từ to-be 'is'.`,correct:!1},{text:`Look! The bus are coming.`,explanation:`'The bus' là số ít, phải dùng 'is'.`,correct:!1}]},{q:`There is some oranges on the table.`,a:[{text:`There are some oranges on the table.`,correct:!0,explanation:`'Oranges' là số nhiều, dùng 'There are'.`},{text:`There is some orange on the table.`,explanation:`Sau 'some' với danh từ đếm được phải dùng số nhiều.`,correct:!1},{text:`There are any oranges on the table.`,explanation:`'Any' dùng trong câu phủ định hoặc nghi vấn.`,correct:!1},{text:`There be some oranges on the table.`,explanation:`Thiếu chia động từ 'be'.`,correct:!1}]},{q:`My father work in a big factory.`,a:[{text:`My father works in a big factory.`,correct:!0,explanation:`Chủ ngữ 'My father' là ngôi thứ 3 số ít, động từ thêm 's'.`},{text:`My father working in a big factory.`,explanation:`Thiếu động từ to-be.`,correct:!1},{text:`My father workes in a big factory.`,explanation:`Sai quy tắc thêm đuôi (work -> works).`,correct:!1},{text:`My father are working in a big factory.`,explanation:`Chủ ngữ số ít không dùng 'are'.`,correct:!1}]},{q:`I didn't went to school yesterday.`,a:[{text:`I didn't go to school yesterday.`,correct:!0,explanation:`Sau trợ động từ 'didn't', động từ phải ở dạng nguyên mẫu.`},{text:`I didn't goes to school yesterday.`,explanation:`Sau 'didn't' không thêm 'es'.`,correct:!1},{text:`I don't went to school yesterday.`,explanation:`Quá khứ phải dùng 'didn't', không dùng 'don't'.`,correct:!1},{text:`I not go to school yesterday.`,explanation:`Thiếu trợ động từ 'did'.`,correct:!1}]},{q:`She is more tall than her sister.`,a:[{text:`She is taller than her sister.`,correct:!0,explanation:`'Tall' là tính từ ngắn, dùng 'taller' thay vì 'more tall'.`},{text:`She is more taller than her sister.`,explanation:`Không dùng cả 'more' và đuôi '-er'.`,correct:!1},{text:`She is tallest than her sister.`,explanation:`So sánh hơn dùng đuôi '-er', không dùng '-est'.`,correct:!1},{text:`She is taller as her sister.`,explanation:`Cấu trúc so sánh hơn dùng 'than', không dùng 'as'.`,correct:!1}]},{q:`Do you like play football?`,a:[{text:`Do you like playing football?`,correct:!0,explanation:`Sau động từ 'like' thường dùng V-ing hoặc to-V (playing/to play).`},{text:`Does you like play football?`,explanation:`Chủ ngữ 'You' đi với trợ động từ 'Do'.`,correct:!1},{text:`Do you likes playing football?`,explanation:`Trợ động từ 'Do' đã chia, động từ 'like' giữ nguyên.`,correct:!1},{text:`Do you like plays football?`,explanation:`Sai dạng động từ sau 'like'.`,correct:!1}]},{q:`How much apples do you want?`,a:[{text:`How many apples do you want?`,correct:!0,explanation:`'Apples' là danh từ đếm được số nhiều, dùng 'How many'.`},{text:`How much apple do you want?`,explanation:`'How much' không dùng cho danh từ đếm được.`,correct:!1},{text:`How many apple do you want?`,explanation:`Sau 'How many' danh từ phải ở số nhiều.`,correct:!1},{text:`How many apples does you want?`,explanation:`Chủ ngữ 'You' dùng trợ động từ 'do'.`,correct:!1}]},{q:`The cat is sleep on the sofa.`,a:[{text:`The cat is sleeping on the sofa.`,correct:!0,explanation:`Cấu trúc thì hiện tại tiếp diễn: be + V-ing.`},{text:`The cat are sleeping on the sofa.`,explanation:`Chủ ngữ 'The cat' số ít dùng 'is'.`,correct:!1},{text:`The cat sleeps on the sofa.`,correct:!1,explanation:`Câu gốc dùng 'is' ám chỉ đang diễn ra, nên 'sleeping' đúng nhất.`},{text:`The cat sleeping on the sofa.`,explanation:`Thiếu động từ to-be.`,correct:!1}]},{q:`We was at the cinema last night.`,a:[{text:`We were at the cinema last night.`,correct:!0,explanation:`Chủ ngữ 'We' đi với động từ to-be 'were' ở thì quá khứ.`},{text:`We was at cinema last night.`,explanation:`Sai động từ to-be và thiếu 'the'.`,correct:!1},{text:`We are at the cinema last night.`,explanation:`Sai thì (last night là quá khứ).`,correct:!1},{text:`We was at the cinema last night.`,explanation:`Với chủ ngữ 'we', động từ to be ở quá khứ phải là 'were', không phải 'was'.`,correct:!1}]},{q:`He doesn't has any brothers.`,a:[{text:`He doesn't have any brothers.`,correct:!0,explanation:`Sau trợ động từ 'doesn't', động từ 'has' chuyển về nguyên mẫu 'have'.`},{text:`He doesn't has some brothers.`,explanation:`Câu phủ định dùng 'any' thay vì 'some'.`,correct:!1},{text:`He don't have any brothers.`,explanation:`Chủ ngữ 'He' dùng 'doesn't'.`,correct:!1},{text:`He doesn't haves any brothers.`,explanation:`Không tồn tại từ 'haves'.`,correct:!1}]},{q:`My mother cook very well.`,a:[{text:`My mother cooks very well.`,correct:!0,explanation:`Chủ ngữ ngôi thứ 3 số ít, động từ thêm 's'.`},{text:`My mother cookes very well.`,explanation:`Sai quy tắc chính tả (cook -> cooks).`,correct:!1},{text:`My mother cooking very well.`,explanation:`Thiếu động từ to-be.`,correct:!1},{text:`My mother is cook very well.`,explanation:`Sai. Phương án 'My mother is cook very well.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`There are a bird in the sky.`,a:[{text:`There is a bird in the sky.`,correct:!0,explanation:`'A bird' là số ít nên dùng 'There is'.`},{text:`There are birds in the sky.`,correct:!1,explanation:`Câu gốc là 'a bird' (một con), sửa thành số nhiều làm thay đổi nghĩa gốc.`},{text:`There is bird in the sky.`,explanation:`Thiếu mạo từ 'a'. Cách dùng phù hợp trong câu này là “There is a bird in the sky.”.`,correct:!1},{text:`There are a birds in the sky.`,explanation:`Sai ngữ pháp giữa 'are' và 'a'.`,correct:!1}]},{q:`I am more happy than before.`,a:[{text:`I am happier than before.`,correct:!0,explanation:`Tính từ 2 âm tiết kết thúc bằng 'y', đổi 'y' thành 'i' rồi thêm '-er'.`},{text:`I am more happier than before.`,explanation:`Không dùng cả 'more' và '-er'.`,correct:!1},{text:`I am happyer than before.`,explanation:`Sai quy tắc chính tả (đổi y thành i).`,correct:!1},{text:`I am as happy than before.`,explanation:`Sai. Phương án 'I am as happy than before.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`They plays soccer every afternoon.`,a:[{text:`They play soccer every afternoon.`,correct:!0,explanation:`Chủ ngữ 'They' (số nhiều) động từ giữ nguyên ở hiện tại đơn.`},{text:`They playing soccer every afternoon.`,explanation:`Thiếu động từ to-be.`,correct:!1},{text:`They are play soccer every afternoon.`,explanation:`Sai. Phương án 'They are play soccer every afternoon.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`They do play soccer every afternoon.`,explanation:`Dùng 'do' để nhấn mạnh nhưng không tự nhiên trong ngữ cảnh này.`,correct:!1}]},{q:`This is the most cheapest hat.`,a:[{text:`This is the cheapest hat.`,correct:!0,explanation:`Tính từ ngắn dùng đuôi '-est', không dùng thêm 'most'.`},{text:`This is most cheapest hat.`,explanation:`Thiếu mạo từ 'the'. Cách dùng phù hợp trong câu này là “This is the cheapest hat.”.`,correct:!1},{text:`This is the most cheap hat.`,explanation:`Tính từ ngắn không dùng 'most'.`,correct:!1},{text:`This is the cheapier hat.`,explanation:`Sai dạng so sánh nhất.`,correct:!1}]},{q:`She always is late for school.`,a:[{text:`She is always late for school.`,correct:!0,explanation:`Trạng từ chỉ tần suất đứng sau động từ to-be.`},{text:`She is late always for school.`,explanation:`Sai vị trí trạng từ.`,correct:!1},{text:`She always late for school.`,explanation:`Thiếu động từ to-be 'is'.`,correct:!1},{text:`She is always lately for school.`,explanation:`'Lately' nghĩa là gần đây, không phải muộn.`,correct:!1}]},{q:`We must to do our homework.`,a:[{text:`We must do our homework.`,correct:!0,explanation:`Sau động từ khuyết thiếu 'must', động từ ở dạng nguyên mẫu không 'to'.`},{text:`We must doing our homework.`,explanation:`Sau 'must' không dùng V-ing.`,correct:!1},{text:`We must to doing our homework.`,explanation:`Sai. Phương án 'We must to doing our homework.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`We musts do our homework.`,explanation:`Động từ 'must' không thêm 's'.`,correct:!1}]},{q:`I would like any orange juice, please.`,a:[{text:`I would like some orange juice, please.`,correct:!0,explanation:`Sửa 'any' thành 'some' trong lời yêu cầu lịch sự.`},{text:`I would like any orange juice, please.`,explanation:`Câu mời mọc/yêu cầu lịch sự dùng 'some'.`,correct:!1},{text:`I would likes some orange juice, please.`,explanation:`Sau 'would' động từ nguyên mẫu.`,correct:!1},{text:`I will like some orange juice, please.`,explanation:`Cấu trúc yêu cầu lịch sự là 'would like'.`,correct:!1}]},{q:`How many sugar do you need?`,a:[{text:`How much sugar do you need?`,correct:!0,explanation:`'Sugar' là danh từ không đếm được, dùng 'How much'.`},{text:`How many sugars do you need?`,explanation:`Sugar không dùng số nhiều trừ khi chỉ các loại/viên đường cụ thể.`,correct:!1},{text:`How much sugar does you need?`,explanation:`Chủ ngữ 'You' dùng trợ động từ 'do'.`,correct:!1},{text:`How much sugar do you needs.`,explanation:`Sau trợ động từ 'do' động từ nguyên mẫu.`,correct:!1}]},{q:`The weather is more hot today.`,a:[{text:`The weather is hotter today.`,correct:!0,explanation:`Tính từ ngắn 1 âm tiết, gấp đôi phụ âm cuối và thêm '-er'.`},{text:`The weather is hoter today.`,explanation:`Thiếu một chữ 't' (quy tắc gấp đôi phụ âm).`,correct:!1},{text:`The weather is more hotter today.`,explanation:`Thừa từ 'more'. Cách dùng phù hợp trong câu này là “The weather is hotter today.”.`,correct:!1},{text:`The weather is the hotter today.`,explanation:`So sánh hơn không dùng 'the' trong ngữ cảnh này.`,correct:!1}]},{q:`Are there some books on the shelf?`,a:[{text:`Are th
