const fullQuestionBank=[{q:`If I ___ a bird, I would fly to school. 🐦`,a:[{text:`were`,correct:!0,explanation:`Trong câu điều kiện loại 2, động từ 'to be' chia là 'were' cho tất cả các ngôi.`},{text:`was been`,explanation:`Sai. Sau chủ ngữ cần một dạng quá khứ đơn; 'was been' là cấu trúc sai.`,correct:!1},{text:`am`,explanation:`Sai. 'Am' là hiện tại của 'be'; giả định 'If I' cần 'were'.`,correct:!1},{text:`be`,explanation:`Sai. Mệnh đề If loại 2 cần quá khứ của 'be' là 'were'; 'be' là nguyên mẫu.`,correct:!1}]},{q:`If she ___ more money, she would buy a new bike. 💰`,a:[{text:`had`,correct:!0,explanation:`Mệnh đề If câu điều kiện loại 2 dùng thì Quá khứ đơn (V2/ed).`},{text:`has`,explanation:`Sai. 'Has' là hiện tại đơn; điều kiện loại 2 với 'she' cần quá khứ 'had'.`,correct:!1},{text:`have`,explanation:`Sai. Mệnh đề If loại 2 cần quá khứ 'had'; 'have' là hiện tại đơn.`,correct:!1},{text:`having`,explanation:`Sai. Sau 'she' cần động từ quá khứ 'had'; dạng V-ing 'having' không hoàn chỉnh mệnh đề.`,correct:!1}]},{q:`We ___ play football if it didn't rain. ⚽`,a:[{text:`could`,correct:!0,explanation:`Mệnh đề chính dùng 'would/could' + V-inf.`},{text:`can`,explanation:`Sai. 'Can play' là khả năng hiện tại; câu giả định loại 2 cần 'could play'.`,correct:!1},{text:`will`,explanation:`Sai. 'Will play' là tương lai đơn; với 'if it didn't rain' cần 'could play'.`,correct:!1},{text:`did`,explanation:`Sai. Sau chủ ngữ 'did' không thể đứng một mình ở vị trí cần trợ động từ 'could'; câu phải dùng 'could play'.`,correct:!1}]},{q:`If I ___ the answer, I would tell you. 💡`,a:[{text:`knew`,correct:!0,explanation:`Động từ 'know' chia quá khứ là 'knew' trong mệnh đề If.`},{text:`know`,explanation:`Sai. Mệnh đề If loại 2 dùng quá khứ đơn 'knew', không dùng hiện tại 'know'.`,correct:!1},{text:`known`,explanation:`Sai. 'Known' là phân từ; sau 'If I' cần quá khứ đơn 'knew'.`,correct:!1},{text:`knowing`,explanation:`Sai. 'Knowing' là V-ing; mệnh đề If loại 2 cần quá khứ đơn 'knew'.`,correct:!1}]},{q:`What ___ you do if you saw a ghost? 👻`,a:[{text:`would`,correct:!0,explanation:`Cấu trúc câu hỏi mệnh đề chính: Wh- + would + S + V?`},{text:`will`,explanation:`Sai. Sau 'if you saw' là giả định loại 2, nên dùng 'would', không dùng 'will'.`,correct:!1},{text:`do`,explanation:`Sai. Câu hỏi cần 'would you do'; 'do' không đi sau chủ ngữ trong cấu trúc giả định này.`,correct:!1},{text:`did`,explanation:`Sai. 'Did' không thể làm trợ động từ cho 'What ... you do'; đáp án đúng là 'would'.`,correct:!1}]},{q:`If he ___ harder, he would get better grades. 📚`,a:[{text:`studied`,correct:!0,explanation:`Đúng. 'Studied' là quá khứ đơn trong điều kiện giả định học chăm chỉ.`},{text:`studies`,explanation:`Sai. 'Studies' là hiện tại đơn; điều kiện loại 2 cần quá khứ đơn 'studied'.`,correct:!1},{text:`study`,explanation:`Sai. Sau chủ ngữ 'he' vẫn cần dạng quá khứ 'studied', không dùng nguyên mẫu 'study'.`,correct:!1},{text:`studying`,explanation:`Sai. 'Studying' là V-ing; mệnh đề If loại 2 cần quá khứ đơn 'studied'.`,correct:!1}]},{q:`If I were you, I ___ go to the party because I need to rest tonight. 🎉`,a:[{text:`wouldn't`,correct:!0,explanation:`Câu khuyên bảo: If I were you, I would/wouldn't...`},{text:`won't`,explanation:`Sai. 'Won't go' là tương lai đơn; mệnh đề chính loại 2 dùng 'wouldn't go'.`,correct:!1},{text:`don't`,explanation:`Sai. 'Don't go' là hiện tại đơn và không đi với giả định 'If I were you'.`,correct:!1},{text:`didn't`,explanation:`Sai. Sau 'If I were you' lời khuyên dùng 'would/wouldn't'; 'didn't' không tạo mệnh đề chính.`,correct:!1}]},{q:`They ___ happier if they lived in the countryside. 🏡`,a:[{text:`would be`,correct:!0,explanation:`Mệnh đề chính: would + V-inf (be).`},{text:`will be`,explanation:`Sai. Mệnh đề chính phải là 'would be happier'; 'will be' thuộc điều kiện loại 1.`,correct:!1},{text:`were`,explanation:`Thiếu trợ động từ 'would'.`,correct:!1},{text:`are`,explanation:`Sai. 'Are' là hiện tại đơn; mệnh đề chính điều kiện loại 2 cần 'would be'.`,correct:!1}]},{q:`If today ___ Sunday, we would go to the zoo. 🦁`,a:[{text:`were`,correct:!0,explanation:`Dùng 'were' cho tình huống giả định không có thật ở hiện tại.`},{text:`is`,explanation:`Sai. 'Today' đang được giả định là Chủ nhật; loại 2 cần 'were', không dùng hiện tại 'is'.`,correct:!1},{text:`was been`,explanation:`Sai. 'Was been' ghép sai hai dạng của 'be'; sau 'today' cần 'were'.`,correct:!1},{text:`be`,explanation:`Sai. 'Be' không chia quá khứ; giả định hôm nay là Chủ nhật cần 'were'.`,correct:!1}]},{q:`If I ___ a map, I wouldn't be lost. 🗺️`,a:[{text:`had`,correct:!0,explanation:`Mệnh đề If chia quá khứ đơn của 'have' là 'had'.`},{text:`have`,explanation:`Sai. Đây là giả định hiện tại 'có bản đồ'; loại 2 cần 'had', không phải hiện tại 'have'.`,correct:!1},{text:`has`,explanation:`Sai. Chủ ngữ 'I' không đi với 'has'; trong giả định loại 2 dùng 'had'.`,correct:!1},{text:`having`,explanation:`Sai. Dạng V-ing 'having' không làm thành mệnh đề If; đáp án đúng phải là quá khứ 'had'.`,correct:!1}]},{q:`If Ba ___ rich, he would travel around the world. ✈️`,a:[{text:`were`,correct:!0,explanation:`Ba là số ít nhưng dùng 'were' trong câu điều kiện loại 2.`},{text:`is`,explanation:`Sai. Giả định Ba giàu dùng 'were rich'; hiện tại 'is' không phù hợp với cấu trúc loại 2.`,correct:!1},{text:`been`,explanation:`Sai. 'Been' là phân từ, không thể làm động từ chính sau 'If he'; cần 'were rich'.`,correct:!1},{text:`be`,explanation:`Sai. 'Be' là nguyên mẫu; với giả định 'he' giàu cần quá khứ 'were'.`,correct:!1}]},{q:`You ___ feel better if you stopped smoking. 🚭`,a:[{text:`would`,correct:!0,explanation:`Mệnh đề chính dùng 'would' + V.`},{text:`will`,explanation:`Sai. Câu hỏi giả định dùng 'would you feel'; 'will' diễn tả tương lai thực tế.`,correct:!1},{text:`can`,explanation:`Sai. 'Can feel' diễn tả khả năng hiện tại; giả định loại 2 cần 'would feel'.`,correct:!1},{text:`did`,explanation:`Sai. Câu chính cần 'would feel'; 'did' không phù hợp trước động từ 'feel'.`,correct:!1}]},{q:`If I ___ his number, I would call him. 📱`,a:[{text:`found`,correct:!0,explanation:`Đúng. 'Found' là quá khứ của 'find' trong giả định có số điện thoại.`},{text:`find`,explanation:`Sai. 'Find' là hiện tại đơn; điều kiện loại 2 cần quá khứ đơn 'found'.`,correct:!1},{text:`finded`,explanation:`Sai chính tả (động từ bất quy tắc).`,correct:!1},{text:`finding`,explanation:`Sai. Sau 'If I' phải dùng quá khứ bất quy tắc 'found'; 'finding' là V-ing.`,correct:!1}]},{q:`If the weather ___ nice, we could go for a picnic. ☀️`,a:[{text:`were`,correct:!0,explanation:`Giả định thời tiết đẹp (thực tế không đẹp) dùng 'were'.`},{text:`is`,explanation:`Sai. Điều kiện giả định thời tiết cần 'were nice'; 'is' là hiện tại thực tế.`,correct:!1},{text:`be`,explanation:`Sai. 'Be' không tạo được mệnh đề giả định; thời tiết trái thực tế dùng 'were'.`,correct:!1},{text:`been`,explanation:`Sai. 'Been' cần trợ động từ và không thay thế 'were' trong mệnh đề If loại 2.`,correct:!1}]},{q:`I would buy that computer if it ___ so expensive. 💻`,a:[{text:`weren't`,correct:!0,explanation:`Giả định trái ngược thực tế: nếu nó không đắt (thực tế là đắt).`},{text:`isn't`,explanation:`Sai. Giả định chiếc máy tính không đắt dùng 'weren't'; 'isn't' là hiện tại đơn.`,correct:!1},{text:`won't be`,explanation:`Sai. 'Won't be' là tương lai; mệnh đề If loại 2 dùng 'weren't'.`,correct:!1},{text:`not be`,explanation:`Sai. 'Not be' thiếu dạng quá khứ 'weren't' của giả định loại 2.`,correct:!1}]},{q:`If I ___ the President, I would help the poor. 🏛️`,a:[{text:`were`,correct:!0,explanation:`Giả định không thể xảy ra: Tôi là Tổng thống.`},{text:`am`,explanation:`Sai. Với giả định 'If I ...', dạng trang trọng là 'were', không dùng 'am'.`,correct:!1},{text:`was been`,explanation:`Sai. Sau 'If I' cần 'were President'; 'was been' không phải dạng quá khứ hợp lệ.`,correct:!1},{text:`become`,explanation:`Sai. 'Become' không phù hợp cấu trúc; câu giả định cần động từ 'were'.`,correct:!1}]},{q:`If she ___ English well, she would get the job. 🗣️`,a:[{text:`spoke`,correct:!0,explanation:`Quá khứ của 'speak' là 'spoke'.`},{text:`speaks`,explanation:`Sai. 'Speaks' là hiện tại đơn; loại 2 cần quá khứ đơn 'spoke'.`,correct:!1},{text:`spoken`,explanation:`Sai. Sau 'she' cần quá khứ 'spoke'; 'spoken' là phân từ quá khứ và cần trợ động từ.`,correct:!1},{text:`speaking`,explanation:`Sai. 'Speaking' là V-ing; sau 'if she' cần quá khứ của 'speak' là 'spoke'.`,correct:!1}]},{q:`Trong dạng điều kiện loại 2 trang trọng, He would come if he ___ busy. ⌚`,a:[{text:`weren't`,correct:!0,explanation:`Giả định: Nếu anh ấy không bận (thực tế là bận).`},{text:`isn't`,explanation:`Sai. Dạng điều kiện loại 2 trang trọng dùng 'were'; 'isn't' là hiện tại đơn.`,correct:!1},{text:`wasn't`,explanation:`Không chọn trong bài này: 'wasn't' có thể gặp trong văn nói, nhưng dạng giả định trang trọng yêu cầu 'weren't'.`,correct:!1},{text:`not`,explanation:`Sai. 'Not' đứng một mình không phải động từ; câu cần 'weren't busy'.`,correct:!1}]},{q:`If I ___ wings, I would fly to the moon. 🌕`,a:[{text:`had`,correct:!0,explanation:`Giả định có cánh. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`have`,explanation:`Sai. Có cánh là giả định hiện tại; loại 2 cần 'had', không dùng hiện tại 'have'.`,correct:!1},{text:`has`,explanation:`Sai. Chủ ngữ 'I' không đi với 'has'; dạng quá khứ giả định là 'had'.`,correct:!1},{text:`having`,explanation:`Sai. 'Having' là V-ing, không thể đứng một mình sau 'I' trong mệnh đề If loại 2.`,correct:!1}]},{q:`If you ___ the lottery, what would you do? 🎟️`,a:[{text:`won`,correct:!0,explanation:`Quá khứ của 'win' là 'won'.`},{text:`win`,explanation:`Sai. 'Win' là hiện tại đơn; giả định trúng xổ số dùng quá khứ 'won'.`,correct:!1},{text:`winned`,explanation:`Sai. Phương án 'winned' bị viết sai chính tả hoặc sai dạng từ gốc.`,correct:!1},{text:`winning`,explanation:`Sai. 'Winning' là V-ing; giả định trúng xổ số dùng quá khứ 'won'.`,correct:!1}]},{q:`If I ___ in Japan, I would ea
