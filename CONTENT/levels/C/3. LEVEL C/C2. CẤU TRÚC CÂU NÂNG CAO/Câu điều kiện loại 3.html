const fullQuestionBank=[{q:`If I ___ harder, I would have passed the exam. 📝`,a:[{text:`had studied`,correct:!0,explanation:`Câu điều kiện loại 3: If + S + Past Perfect (had V3/ed).`},{text:`studied`,explanation:`Sai. Đây là thì Quá khứ đơn (dùng cho loại 2).`,correct:!1},{text:`have studied`,explanation:`Sai. 'Have studied' là hiện tại hoàn thành; điều kiện giả định về kỳ thi đã qua cần 'had studied'.`,correct:!1},{text:`studies`,explanation:`Sai. Phương án 'studies' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`If it ___ yesterday, we would have gone to the beach. 🌧️`,a:[{text:`hadn't rained`,correct:!0,explanation:`Mệnh đề If loại 3 dùng Past Perfect. Ngữ cảnh cần phủ định (nếu không mưa thì đã đi).`},{text:`didn't rain`,explanation:`Sai. 'Didn't rain' diễn tả điều kiện giả định hiện tại/loại 2; trận mưa hôm qua cần 'hadn't rained'.`,correct:!1},{text:`hasn't rained`,explanation:`Sai. Dấu hiệu 'yesterday' không phù hợp với thì/cấu trúc của phương án 'hasn't rained'.`,correct:!1},{text:`wouldn't rain`,explanation:`Sai cấu trúc (không dùng would trong mệnh đề If).`,correct:!1}]},{q:`I ___ you if I had known your phone number. 📱`,a:[{text:`would have called`,correct:!0,explanation:`Mệnh đề chính loại 3: S + would have + V3/ed.`},{text:`will call`,explanation:`Sai. Dùng cho loại 1.`,correct:!1},{text:`would call`,explanation:`Sai. 'Would call' thiếu 'have' nên chỉ là kết quả loại 2; số điện thoại phải được biết trong quá khứ.`,correct:!1},{text:`called`,explanation:`Sai. 'Called' đứng một mình là quá khứ đơn; kết quả của điều kiện đã biết số điện thoại phải là 'would have called'.`,correct:!1}]},{q:`If she ___ the bus, she wouldn't have been late. 🚌`,a:[{text:`hadn't missed`,correct:!0,explanation:`If + Past Perfect. Cần phủ định (nếu không lỡ xe).`},{text:`missed`,explanation:`Sai. 'Missed' là quá khứ đơn; điều kiện loại 3 cần quá khứ hoàn thành 'hadn't missed'.`,correct:!1},{text:`has missed`,explanation:`Sai. 'Has missed' là hiện tại hoàn thành và không đi với mốc 'yesterday'; cấu trúc cần 'hadn't missed'.`,correct:!1},{text:`didn't miss`,explanation:`Sai. Lỡ xe là điều kiện đã hoàn tất trước lúc muộn; quá khứ đơn 'didn't miss' không tạo loại 3.`,correct:!1}]},{q:`We would have visited the museum if we ___ time. 🏛️`,a:[{text:`had had`,correct:!0,explanation:`Cấu trúc 'had had' (Past Perfect của 'have').`},{text:`had`,explanation:`Sai. 'Had' là quá khứ đơn của 'have'; thời gian phải tồn tại trước chuyến thăm nên cần 'had had'.`,correct:!1},{text:`have had`,explanation:`Sai. 'Have had' là hiện tại hoàn thành; thời gian có sẵn phải nằm trước chuyến thăm bảo tàng nên dùng 'had had'.`,correct:!1},{text:`would have`,explanation:`Sai. Sau 'if' không dùng 'would have'; mệnh đề điều kiện phải dùng Past Perfect 'had had'.`,correct:!1}]},{q:`If the goalkeeper ___ the ball, they would have won. ⚽`,a:[{text:`had caught`,correct:!0,explanation:`If + Past Perfect (had + V3). V3 của 'catch' là 'caught'.`},{text:`caught`,explanation:`Sai. 'Caught' là quá khứ đơn; mệnh đề If loại 3 cần 'had caught'.`,correct:!1},{text:`catched`,explanation:`Sai. 'Catch' là động từ bất quy tắc.`,correct:!1},{text:`would catch`,explanation:`Sai. 'Would catch' là kết quả loại 2; sau 'if' trong câu này cần 'had caught'.`,correct:!1}]},{q:`What ___ if you had seen a ghost? 👻`,a:[{text:`would you have done`,correct:!0,explanation:`Câu hỏi mệnh đề chính loại 3: Wh- + would + S + have + V3?`},{text:`would you do`,explanation:`Sai. 'Didn't rain' là quá khứ đơn, chỉ tạo điều kiện loại 2; câu này cần giả định trái với trận mưa hôm qua.`,correct:!1},{text:`will you do`,explanation:`Sai. 'Will call' diễn tả kết quả tương lai loại 1, không phải lời gọi đã không xảy ra trong quá khứ.`,correct:!1},{text:`did you do`,explanation:`Sai. Sau 'if you had seen' phải hỏi kết quả giả định 'would you have done', không dùng 'did you do'.`,correct:!1}]},{q:`If I hadn't eaten so much, I ___ sick. 🤢`,a:[{text:`wouldn't have felt`,correct:!0,explanation:`Mệnh đề chính loại 3 phủ định: wouldn't have + V3 (felt).`},{text:`didn't feel`,explanation:`Sai. 'Didn't feel' là quá khứ đơn; kết quả giả định quá khứ cần 'wouldn't have felt'.`,correct:!1},{text:`won't feel`,explanation:`Sai. 'Won't feel' là tương lai; mệnh đề chính loại 3 dùng 'wouldn't have felt'.`,correct:!1},{text:`would feel`,explanation:`Sai. 'Would call' không có 'have' nên là kết quả loại 2; câu yêu cầu kết quả hoàn tất trong quá khứ.`,correct:!1}]},{q:`They ___ the match if the referee had been fair. 🏆`,a:[{text:`could have won`,correct:!0,explanation:`Mệnh đề If dùng quá khứ hoàn thành; kết quả giả định dùng 'could have + V3': 'could have won'.`},{text:`can win`,explanation:`Sai. 'Can win' là hiện tại; kết quả giả định đã qua cần 'could have won'.`,correct:!1},{text:`win`,explanation:`Sai. 'Win' là hiện tại đơn, không đi với mệnh đề If quá khứ hoàn thành.`,correct:!1},{text:`won`,explanation:`Sai. 'Won' thiếu trợ động từ 'could have'; kết quả giả định cần hoàn thành trong quá khứ.`,correct:!1}]},{q:`If he ___ careful, he wouldn't have broken the vase. 🏺`,a:[{text:`had been`,correct:!0,explanation:`Động từ to be ở Past Perfect là 'had been'.`},{text:`was been`,explanation:`Sai. Sau 'if' cần 'had been' để nói điều kiện thời tiết trước buổi dã ngoại; 'was been' không tồn tại trong tiếng Anh.`,correct:!1},{text:`were`,explanation:`Sai. 'Were' là dạng giả định loại 2; câu nói về sự cẩn thận trước khi bình vỡ nên cần 'had been'.`,correct:!1},{text:`has been`,explanation:`Sai. 'Has been' nói về hiện tại hoàn thành; sự cẩn thận phải được giả định trước lúc bình vỡ trong quá khứ.`,correct:!1}]},{q:`The plant ___ if you had watered it. 🌱`,a:[{text:`wouldn't have died`,correct:!0,explanation:`Mệnh đề chính loại 3: wouldn't have + V3. Ngữ cảnh: Nếu tưới thì cây đã không chết.`},{text:`would die`,explanation:`Sai. Phương án 'would die' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`didn't die`,explanation:`Sai. 'Didn't die' là quá khứ đơn; kết quả trái thực tế cần 'wouldn't have died'.`,correct:!1},{text:`hadn't died`,explanation:`Sai cấu trúc câu điều kiện loại 2. Trái với thực tế hiện tại.`,correct:!1}]},{q:`If I ___ you were coming, I would have baked a cake. 🎂`,a:[{text:`had known`,correct:!0,explanation:`If + S + had + V3 (known).`},{text:`knew`,explanation:`Sai. 'Knew' là Past Simple của loại 2, còn điều kiện biết sự thật trước đó phải là 'had known'.`,correct:!1},{text:`know`,explanation:`Sai. 'Know' là hiện tại; điều kiện loại 3 cần 'had known'.`,correct:!1},{text:`have known`,explanation:`Sai. 'Have known' không lùi đủ về quá khứ; cần 'had known' trước khi quyết định nướng bánh.`,correct:!1}]},{q:`She ___ angry if you had told her the truth. 😡`,a:[{text:`wouldn't have been`,correct:!0,explanation:`Mệnh đề chính loại 3 với 'be': would/wouldn't have been.`},{text:`wouldn't be`,explanation:`Sai. 'Wouldn't be' chỉ kết quả hiện tại loại 2; kết quả sau lời nói trong quá khứ cần 'wouldn't have been'.`,correct:!1},{text:`won't be`,explanation:`Sai. 'Won't be' là tương lai; kết quả giả định quá khứ cần 'wouldn't have been'.`,correct:!1},{text:`wasn't`,explanation:`Sai. 'Wasn't' là quá khứ đơn; loại 3 cần trợ động từ 'wouldn't have been'.`,correct:!1}]},{q:`If the weather ___ nice, we would have gone for a picnic. ☀️`,a:[{text:`had been`,correct:!0,explanation:`If + Past Perfect của 'be' là 'had been'.`},{text:`was been`,explanation:`Sai. Với giả thuyết tôi là chim trong quá khứ, dùng 'had been'; không ghép 'was' với 'been'.`,correct:!1},{text:`were`,explanation:`Sai. 'Were' là quá khứ đơn; loại 3 cần quá khứ hoàn thành 'had been'.`,correct:!1},{text:`is`,explanation:`Sai. 'Is' là hiện tại đơn; mệnh đề If nói về điều kiện đã qua nên cần 'had been'.`,correct:!1}]},{q:`We would have been in trouble if the teacher ___ us. 👩‍🏫`,a:[{text:`had seen`,correct:!0,explanation:`If + Past Perfect. V3 của 'see' là 'seen'.`},{text:`saw`,explanation:`Sai. 'Saw' là quá khứ đơn; điều kiện loại 3 cần 'had seen'.`,correct:!1},{text:`see`,explanation:`Sai. Nguyên mẫu 'see' không phù hợp với mệnh đề If quá khứ hoàn thành.`,correct:!1},{text:`seen`,explanation:`Sai ngữ pháp (thiếu had).`,correct:!1}]},{q:`If I ___ my camera, I would have taken some photos. 📸`,a:[{text:`had brought`,correct:!0,explanation:`If + Past Perfect. V3 của 'bring' là 'brought'.`},{text:`brought`,explanation:`Sai. 'Brought' là quá khứ đơn; loại 3 cần 'had brought'.`,correct:!1},{text:`bring`,explanation:`Sai. Câu không chia ở thì Tiếp diễn.`,correct:!1},{text:`have brought`,explanation:`Sai. 'Have brought' là hiện tại hoàn thành; việc mang máy ảnh là điều kiện đã không xảy ra trước chuyến đi.`,correct:!1}]},{q:`He would have passed the driving test if he ___ more practice. 🚗`,a:[{text:`had had`,correct:!0,explanation:`Cần Past Perfect của 'have' (có) -> 'had had'.`},{text:`had`,explanation:`Sai. Đây là quá khứ đơn.`,correct:!1},{text:`has had`,explanation:`Sai. 'Has had' gắn với hiện tại; số buổi luyện tập cần được đặt trước kỳ thi lái xe đã qua.`,correct:!1},{text:`would have`,explanation:`Sai. Động từ 'have' sau 'if' phải ở dạng 'had had', không phải cụm kết quả 'would have'.`,correct:!1}]},{q:`If you ___ the map, we wouldn't have got lost. 🗺️`,a:[{text:`had followed`,correct:!0,explanation:`Đọc bản đồ là điều kiện xảy ra trước lúc bị lạc, vì vậy dùng 'had followed'.`},{text:`followed`,explanation:`Sai. 'Followed' là quá khứ đơn; nguyên nhân giả định đã qua cần 'had followed'.`,correct:!1},{text:`follow`,explanation:`Sai. Nguyên mẫu 'follow' không tạo cấu trúc If loại 3; cần 'had followed'.`,correct:!1},{text:`didn't follow`,explanation:`Sai. Phương án 'didn't follow' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`___ you ___ the job if they had offered it to you? 💼`,a:[{text:`Would / have accepted`,correct:!0,explanation:`Câu hỏi mệnh đề chính loại 3: Would + S + have + V3?`},{text:`Did / accept`,explanation:`Sai. 'Did / accept' là câu hỏi quá khứ đơn; loại 3 cần 'Would / have accepted'.`,correct:!1},{text:`Will / accept`,explanation:`Sai. 'Will / accept' là tương lai loại 1; lời mời giả định đã qua cần dạng hoàn thành 'Would / have accepted'.`,correct:!1},{text:`Would / accept`,explanation:`Sai. 'Would / accept' là câu hỏi loại 2; lời mời đã xảy ra trong quá khứ cần 'Would / have accepted'.`,correct:!1}]},{q:`If I hadn't stayed up late, I ___ tired now. 😴`,a:[{text:`wouldn't be`,correct:!0,explanation:`Đây là câu điều kiện HỖN HỢP (Mixed): If loại 3 (QK), Mệnh đề chính loại 2 (HT - có từ 'now').`},{text:`wouldn't have been`,explanation:`Sai. Nếu dùng loại 3 thuần túy thì không hợp với từ 'now'.`,correct:!1},{text:`won't be`,explanation:`Sai. 'Won't be' là tương lai; câu là điều kiện hỗn hợp, kết quả hiện tại cần 'wouldn't be'.`,correct:!1},{text:`am not`,explanation:`Sai. 'Am not' là hiện tại đơn không có trợ động từ giả định; cần 'wouldn't be'.`,correct:!1}]},{q:`I would have sent you a postcard if I ___ your address. 📮`,a:[{text:`had had`,correct:!0,explanation:`If + Past Perfect (had had).`},{text:`have`,explanation:`Sai. 'Have' là hiện tại đơn; địa chỉ phải được biết trước thời điểm gửi bưu thiếp.`,correct:!1},{text:`had`,explanation:`Sai. 'Had' là quá khứ đơn; địa chỉ cần được biết trước khi gửi bưu thiếp nên dùng 'had had'.`,correct:!1},{text:`have had`,explanation:`Sai. Dạng hiện tại hoàn thành 'have had' không phù hợp với giả định về địa chỉ trong quá khứ.`,correct:!1}]},{q:`If the alarm clock ___ off, I wouldn't have overslept. ⏰`,a:[{text:`had gone`,correct:!0,explanation:`Chuông phải reo trước khi ngủ quên; V3 'gone' đi sau trợ động từ 'had'.`},{text:`went`,explanation:`Sai. 'Went' là quá khứ đơn; loại 3 cần quá khứ hoàn thành 'had gone'.`,correct:!1},{text:`goes`,explanation:`Sai. 'Goes' là hiện tại đơn; sự việc giả định đã xảy ra trước khi ngủ quên.`,correct:!1},{text:`has gone`,explanation:`Sai. 'Has gone' là hiện tại hoàn thành; chuông phải reo trước khi người nói ngủ quên hôm đó.`,correct:!1}]},{q:`She ___ the train if she had run faster. 🚆`,a:[{text:`might have caught`,correct:!0,explanation:`Dùng 'might have V3' để chỉ khả năng trong quá khứ.`},{text:`caught`,explanation:`Sai. 'Caught' là quá khứ đơn; kết quả giả định quá khứ cần 'might have caught'.`,correct:!1},{text:`may catch`,explanation:`Sai. 'May catch' là khả năng hiện tại/tương lai; câu nói về cơ hội đã qua.`,correct:!1},{text:`might catch`,explanation:`Sai. 'Might catch' không có 'have' nên không chỉ cơ hội đã qua; cần 'might have caught'.`,correct:!1}]},{q:`If I ___ how to swim, I would have saved him. 🏊`,a:[{text:`had known`,correct:!0,explanation:`Biết cách bơi phải có trước cơ hội cứu người đã qua; 'had known' là Past Perfect.`},{text:`know`,explanation:`Sai. 'Know' là hiện tại; mệnh đề If loại 3 cần 'had known'.`,correct:!1},{text:`knew`,explanation:`Sai. 'Knew' tạo điều kiện loại 2; khả năng cứu người đã qua cần 'had known'.`,correct:!1},{text:`have known`,explanation:`Sai. 'Have known' chưa lùi về thời điểm cứu người đã qua; cần 'had known'.`,correct:!1}]},{q:`The cake ___ better if you had added more sugar. 🍰`,a:[{text:`would have tasted`,correct:!0,explanation:`Mệnh đề chính loại 3: would have + V3 (tasted).`},{text:`tasted`,explanation:`Sai. Kết quả về chiếc bánh cần trợ động từ hoàn thành 'would have tasted', không chỉ quá khứ đơn 'tasted'.`,correct:!1},{text:`would taste`,explanation:`Sai. 'Would taste' diễn tả kết quả giả định hiện tại; chiếc bánh trong tình huống đã qua cần 'would have tasted'.`,correct:!1},{text:`will taste`,explanation:`Sai. 'Will taste' dự đoán tương lai, không diễn tả vị bánh trong một điều kiện đã kết thúc.`,correct:!1}]},{q:`If they ___ the tickets earlier, they would have got better seats. 🎫`,a:[{text:`had booked`,correct:!0,explanation:`Việc đặt vé sớm hơn là điều kiện hoàn tất trước khi nhận chỗ ngồi, nên dùng 'had booked'.`},{text:`booked`,explanation:`Sai. 'Booked' là quá khứ đơn; điều kiện loại 3 cần 'had booked'.`,correct:!1},{text:`book`,explanation:`S
