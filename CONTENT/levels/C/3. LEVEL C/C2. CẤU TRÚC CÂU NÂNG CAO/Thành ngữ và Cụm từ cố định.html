 fa-arrow-left"></i>Quay lại</button><button class=btn id=next-btn type=button>Tiếp tục<i class="fa-solid fa-arrow-right"></i></button><button class="btn is-initially-hidden" id=submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=confirm-back-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class="btn is-initially-hidden" id=confirm-submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=reset-btn type=button>Làm lại</button></div></div><footer class=dec-footer>Bản quyền thuộc về DEC - thầy Đức tiếng Anh - 0966939583</footer></div><script>// --- DUKEGEM QUESTION BANK
const fullQuestionBank=[{q:`I have a big exam tomorrow, so I need to ___. 📚`,a:[{text:`hit the books`,correct:!0,explanation:`'Hit the books' nghĩa là bắt đầu học bài một cách chăm chỉ.`},{text:`hit the ball`,explanation:`Sai. Cụm từ này không có nghĩa là học bài.`,correct:!1},{text:`hit the road`,explanation:`Sai. Phương án 'hit the road' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`hit the sack`,explanation:`Sai. Phương án 'hit the sack' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`The math test was ___. I finished it in 10 minutes! 🍰`,a:[{text:`a piece of cake`,correct:!0,explanation:`'A piece of cake' nghĩa là rất dễ dàng.`},{text:`a cup of tea`,explanation:`Sai. Thường dùng trong câu phủ định 'not my cup of tea' (không phải sở thích).`,correct:!1},{text:`a piece of pizza`,explanation:`Sai: đây chỉ là một miếng pizza theo nghĩa đen, không diễn tả bài kiểm tra dễ.`,correct:!1},{text:`a bowl of soup`,explanation:`Sai: đây chỉ là một bát súp theo nghĩa đen, không phải thành ngữ chỉ sự dễ dàng.`,correct:!1}]},{q:`You look tired. You should ___ a rest. 😴`,a:[{text:`take`,correct:!0,explanation:`Cụm từ cố định 'take a rest' (nghỉ ngơi).`},{text:`do`,explanation:`Sai: collocation cố định là take a rest, không dùng do với danh từ rest.`,correct:!1},{text:`make`,explanation:`Sai: make a rest không phải cụm thành ngữ chỉ nghỉ ngơi; dùng take a rest.`,correct:!1},{text:`go`,explanation:`Sai: go a rest thiếu giới từ và không tạo thành collocation tiếng Anh.`,correct:!1}]},{q:`I don't feel well today. I am feeling a bit ___. 🌡️`,a:[{text:`under the weather`,correct:!0,explanation:`'Under the weather' nghĩa là cảm thấy không khỏe, bị ốm nhẹ.`},{text:`over the moon`,explanation:`Sai. Phương án 'over the moon' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`under the table`,explanation:`Sai. Nghĩa là bí mật/phi pháp.`,correct:!1},{text:`on the cloud`,explanation:`Sai. Không đúng thành ngữ.`,correct:!1}]},{q:`Before the performance, my mom said: '___!' 🎭`,a:[{text:`Break a leg`,correct:!0,explanation:`'Break a leg' là lời chúc may mắn trước khi lên sân khấu.`},{text:`Break a hand`,explanation:`Sai. Cấu trúc 'Break a hand' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Break a head`,explanation:`Sai. Cấu trúc 'Break a head' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Break a foot`,explanation:`Sai. Cấu trúc 'Break a foot' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`My cousin lives in Australia, so I only see him ___. 🌕`,a:[{text:`once in a blue moon`,correct:!0,explanation:`'Once in a blue moon' nghĩa là rất hiếm khi.`},{text:`once in a red moon`,explanation:`Sai. Cấu trúc 'once in a red moon' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`once in a green sun`,explanation:`Sai. Cấu trúc 'once in a green sun' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`once in a black sky`,explanation:`Sai. Cấu trúc 'once in a black sky' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`Please ___ the dishes after dinner. 🍽️`,a:[{text:`do`,correct:!0,explanation:`Cụm từ cố định 'do the dishes' (rửa bát).`},{text:`make`,explanation:`Sai: make the dishes nghĩa là làm ra món ăn, không phải rửa bát sau bữa tối.`,correct:!1},{text:`take`,explanation:`Sai: take the dishes chỉ lấy hoặc mang bát đĩa, không diễn tả việc rửa bát.`,correct:!1},{text:`get`,explanation:`Sai: get the dishes không phải collocation cho công việc sau bữa ăn; đáp án là do the dishes.`,correct:!1}]},{q:`I'm sorry, I ___ a mistake on the test. ❌`,a:[{text:`made`,correct:!0,explanation:`Cụm từ cố định 'make a mistake' (mắc lỗi). Dùng thì quá khứ là 'made'.`},{text:`did`,explanation:`Sai: tiếng Anh dùng make a mistake, không dùng do a mistake dù do là dạng quá khứ của làm.`,correct:!1},{text:`took`,explanation:`Sai: take a mistake không phải cụm cố định; lỗi trong bài thi là make a mistake.`,correct:!1},{text:`had`,explanation:`Sai: had a mistake không phải cách kết hợp tự nhiên để nói mắc lỗi.`,correct:!1}]},{q:`Remember to ___ warm clothes when it's cold. 🧣`,a:[{text:`wear`,correct:!0,explanation:`Wear clothes: mặc quần áo.`},{text:`take`,explanation:`Sai: take warm clothes là mang quần áo theo, không phải mặc chúng khi trời lạnh.`,correct:!1},{text:`do`,explanation:`Sai: do không kết hợp với warm clothes; động từ đúng cho mặc quần áo là wear.`,correct:!1},{text:`make`,explanation:`Sai: sẵn sàng dùng get ready, không dùng make ready trong mẫu này.`,correct:!1}]},{q:`Don't be sad about the broken vase. It's no use crying over ___. 🥛`,a:[{text:`spilt milk`,correct:!0,explanation:`'Cry over spilt milk' nghĩa là buồn bã vô ích về chuyện đã lỡ rồi.`},{text:`spilt water`,explanation:`Sai. Từ vựng hoặc dạng từ 'spilt water' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`spilt tea`,explanation:`Sai: câu nói về tiếc nuối việc đã xảy ra dùng spilt milk, không dùng spilt tea.`,correct:!1},{text:`spilt juice`,explanation:`Sai. Từ vựng hoặc dạng từ 'spilt juice' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`My sister wakes up at 5 a.m., so she is an ___ bird. 🐦`,a:[{text:`early`,correct:!0,explanation:`An 'early bird' là người thường dậy hoặc bắt đầu công việc sớm.`},{text:`angry`,explanation:`Sai. Từ vựng hoặc dạng từ 'angry' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`ugly`,explanation:`Sai. Từ vựng hoặc dạng từ 'ugly' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`easy`,explanation:`Sai. Từ vựng hoặc dạng từ 'easy' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`It's 7:00 AM. Time to ___ up and go to school! ⏰`,a:[{text:`get`,correct:!0,explanation:`Cụm từ 'get up' (thức dậy).`},{text:`take`,explanation:`Sai: get up là cụm chỉ thức dậy; take up không phù hợp với go to school.`,correct:!1},{text:`make`,explanation:`Sai: make up nghĩa khác và không diễn tả đứng dậy lúc bảy giờ sáng.`,correct:!1},{text:`put`,explanation:`Sai: put up không mang nghĩa thức dậy trong câu nhắc đi học.`,correct:!1}]},{q:`I usually ___ friends easily at a new school. 🤝`,a:[{text:`make`,correct:!0,explanation:`'Make friends easily' diễn tả việc nhanh chóng kết bạn ở môi trường học mới.`},{text:`do`,explanation:`Sai: do friends không phải collocation; tiếng Anh dùng make friends.`,correct:!1},{text:`take`,explanation:`Sai: take friends không diễn tả việc kết bạn dễ dàng ở trường mới.`,correct:!1},{text:`get`,explanation:`Sai: get friends có thể hiểu là nhận bạn bè, nhưng không phải collocation mục tiêu make friends.`,correct:!1}]},{q:`Let's ___ a photo together! 📸`,a:[{text:`take`,correct:!0,explanation:`Cụm từ 'take a photo' (chụp ảnh).`},{text:`make`,explanation:`Sai: make a photo không phải cách nói chụp ảnh; collocation là take a photo.`,correct:!1},{text:`do`,explanation:`Sai: do a photo không diễn tả hoạt động chụp ảnh cùng nhau.`,correct:!1},{text:`have`,explanation:`Sai: have a photo thường là sở hữu một bức ảnh, không phải chụp ảnh lúc này.`,correct:!1}]},{q:`My sister loves to ___ shopping on weekends. 🛍️`,a:[{text:`go`,correct:!0,explanation:`Cụm từ 'go shopping' (đi mua sắm).`},{text:`do`,explanation:`Sai: do shopping không dùng trong cụm go shopping chỉ đi mua sắm.`,correct:!1},{text:`make`,explanation:`Sai: make shopping không phải collocation; hoạt động cuối tuần là go shopping.`,correct:!1},{text:`take`,explanation:`Sai: take shopping không diễn tả đi mua sắm trong mẫu này.`,correct:!1}]},{q:`We ___ a good time at the party yesterday. 🎉`,a:[{text:`had`,correct:!0,explanation:`Cụm từ 'have a good time' (vui vẻ). Quá khứ là 'had'.`},{text:`did`,explanation:`Sai: had a good time là cụm vui vẻ; did a good time không dùng.`,correct:!1},{text:`made`,explanation:`Sai: made a good time không phải cách nói trải qua thời gian vui vẻ.`,correct:!1},{text:`took`,explanation:`Sai: took a good time không tạo thành collocation; dùng had a good time.`,correct:!1}]},{q:`Even though I was late, the teacher said: '___ late than never'. ⏳`,a:[{text:`Better`,correct:!0,explanation:`'Better late than never' nghĩa là muộn còn hơn không.`},{text:`Good`,explanation:`Sai. Từ vựng hoặc dạng từ 'Good' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Best`,explanation:`Sai. Từ vựng hoặc dạng từ 'Best' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Worse`,explanation:`Sai. Từ vựng hoặc dạng từ 'Worse' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Can I have your phone number? Let's ___ in touch. 📱`,a:[{text:`keep`,correct:!0,explanation:`Cụm từ 'keep in touch' (giữ liên lạc).`},{text:`stay`,explanation:`Sai: stay in touch có thể gặp trong tiếng Anh, nhưng bài yêu cầu collocation keep in touch.`,correct:!1},{text:`hold`,explanation:`Sai: hold in touch không phải thành ngữ giữ liên lạc.`,correct:!1},{text:`take`,explanation:`Sai: take in touch không phải cụm tiếng Anh; dùng keep in touch.`,correct:!1}]},{q:`It's hot today. Let's ___ swimming. 🏊`,a:[{text:`go`,correct:!0,explanation:`Cụm từ 'go swimming' (đi bơi).`},{text:`do`,explanation:`Sai: hoạt động này dùng go swimming, không dùng do swimming trong lời rủ.`,correct:!1},{text:`make`,explanation:`Sai: make swimming không phải cụm chỉ đi bơi.`,correct:!1},{text:`play`,explanation:`Sai: play swimming không phải collocation; play dùng với môn/trò chơi cụ thể.`,correct:!1}]},{q:`You must ___ your homework before watching TV. 📝`,a:[{text:`do`,correct:!0,explanation:`Cụm từ 'do homework' (làm bài tập về nhà).`},{text:`make`,explanation:`Sai: make homework không phải collocation; bài tập được làm bằng do homework.`,correct:!1},{text:`take`,explanation:`Sai: take homework không có nghĩa làm bài trước khi xem TV.`,correct:!1},{text:`have`,explanation:`Sai: have homework bye! ___ care. 👋`,a:[{text:`Take`,correct:!0,explanation:`Trong lời tạm biệt, Take care là lời chúc người nghe giữ gìn sức khỏe.`},{text:`Do`,explanation:`Sai: lời tạm biệt cố định là Take care, không phải Do care.`,correct:!1},{text:`Make`,explanation:`Sai: Make care không phải lời chúc tự nhiên khi tạm biệt.`,correct:!1},{text:`Have`,explanation:`Sai: Have care không phải cụm cố định; mẫu đúng là Take care.`,correct:!1}]},{q:`See you ___! I have to go now. ⌚`,a:[{text:`later`,correct:!0,explanation:`Cụm từ 'See you later' (Hẹn gặp lại sau).`},{text:`lately`,explanation:`Sai. Từ vựng hoặc dạng từ 'lately' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`late`,explanation:`Sai: See you late không phải lời hẹn gặp lại tự nhiên; dùng later cho một thời điểm sau hiện tại.`,correct:!1},{text:`latest`,explanation:`Sai. Từ vựng hoặc dạng từ 'latest' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`What's ___? You look happy. 😄`,a:[{text:`up`,correct:!0,explanation:`'What's up?' là câu chào hỏi thân mật (Có chuyện gì thế/Dạo này thế nào).`},{text:`down`,explanation:`Sai: What's down? không phải câu chào hỏi; What's up? mới hỏi tình hình của người nghe.`,correct:!1},{text:`in`,explanation:`Sai: What's in? không phải câu hỏi thăm tình hình trong ngữ cảnh này; dùng What's up?`,correct:!1},{text:`on`,explanation:`Sai: What's on? thường hỏi chương trình hoặc sự kiện, không phải lời chào hỏi What's up?`,correct:!1}]},{q:`Wait for me! I need to ___ dressed. 👗`,a:[{text:`get`,correct:!0,explanation:`Cụm từ 'get dressed' (mặc quần áo/thay đồ).`},{text:`make`,explanation:`Sai: thay quần áo dùng get dressed, không dùng make dressed.`,correct:!1},{text:`do`,explanation:`Sai: do dressed không phải cụm diễn tả mặc quần áo.`,correct:!1},{text:`have`,explanation:`Sai: have dressed là dạng hoàn thành, không phù hợp sau need to; mẫu thay đồ là get dressed.`,correct:!1}]},{q:`Doing this exercise is a ___ of cake. 🍰`,a:[{text:`piece`,corr
