diễn tả dự đoán thời tiết.`,correct:!1}]},{q:`He is very strong. He ___ lift that heavy box easily.`,a:[{text:`can`,correct:!0,explanation:`Dùng 'can' để chỉ khả năng thực hiện hành động.`},{text:`mustn't`,explanation:`Sai: người khỏe có thể nâng hộp; mustn't lift lại là cấm đoán.`,correct:!1},{text:`shouldn't`,explanation:`Sai: sức mạnh cho phép anh ấy nâng hộp; shouldn't không diễn tả năng lực can.`,correct:!1},{text:`might not`,explanation:`Sai: strong and easily lift expresses can, while might not lift would deny that ability.`,correct:!1}]},{q:`Your teacher assigned a rule that homework must be submitted before bedtime: you ___ finish your homework before going to bed.`,a:[{text:`must`,correct:!0,explanation:`Dùng 'must' để chỉ sự bắt buộc hoặc cần thiết.`},{text:`can't`,explanation:`Sai: quy định nộp bài trước giờ ngủ tạo nghĩa vụ must finish, không phải can't finish.`,correct:!1},{text:`may`,explanation:`Sai: quy định nộp bài là bắt buộc must finish, không chỉ khả năng may finish.`,correct:!1},{text:`might`,explanation:`Sai: teacher's rule makes finish mandatory; might finish is only a possibility.`,correct:!1}]},{q:`The sign says 'No Parking'. You ___ park here.`,a:[{text:`mustn't`,correct:!0,explanation:`Dùng 'mustn't' khi có quy định cấm đoán.`},{text:`can`,explanation:`Sai: No Parking cấm đỗ xe, nên mustn't park; can park trái biển báo.`,correct:!1},{text:`should`,explanation:`Sai: No Parking là lệnh cấm mustn't park, không chỉ lời khuyên should park.`,correct:!1},{text:`may`,explanation:`Sai: No Parking cấm đỗ xe; may park sẽ cho phép hành động bị cấm.`,correct:!1}]},{q:`She ___ speak three languages fluently.`,a:[{text:`can`,correct:!0,explanation:`Diễn tả năng lực, khả năng của bản thân.`},{text:`mustn't`,explanation:`Sai: nói ba ngôn ngữ là năng lực can speak, không phải cấm mustn't speak.`,correct:!1},{text:`shouldn't`,explanation:`Sai: shouldn't be at home gives advice about location; the car clue supports must be at home.`,correct:!1},{text:`may not`,explanation:`Sai: speaking three languages is present ability can speak, not uncertain may not speak.`,correct:!1}]},{q:`It's a secret. You ___ tell anyone!`,a:[{text:`mustn't`,correct:!0,explanation:`Cấm tiết lộ bí mật. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`can`,explanation:`Sai: secret yêu cầu mustn't tell anyone; can tell lại cho phép tiết lộ.`,correct:!1},{text:`should`,explanation:`Sai: bí mật cần mustn't tell anyone, còn should tell lại khuyên tiết lộ.`,correct:!1},{text:`might`,explanation:`Sai: a secret requires mustn't tell; might tell would merely express possibility.`,correct:!1}]},{q:`If you feel sick, a doctor advises that you ___ see a doctor.`,a:[{text:`should`,correct:!0,explanation:`Lời khuyên nên làm gì tốt cho sức khỏe.`},{text:`can't`,explanation:`Sai: đi khám là lời khuyên khi ốm, không phải khẳng định không thể see a doctor.`,correct:!1},{text:`mustn't`,explanation:`Sai: khi bị ốm, should see a doctor là lời khuyên; mustn't see là cấm đi khám.`,correct:!1},{text:`may not`,explanation:`Sai: feeling sick calls for should see a doctor; may not see would mean possibly not going.`,correct:!1}]},{q:`I ___ swim when I was five years old.`,a:[{text:`could`,correct:!0,explanation:`Khả năng trong quá khứ của 'can' là 'could'.`},{text:`can`,explanation:`Sai: when I was five cần could swim cho khả năng quá khứ; can là hiện tại.`,correct:!1},{text:`must`,explanation:`Sai: mốc when I was five yêu cầu could swim để chỉ khả năng quá khứ, không phải must.`,correct:!1},{text:`should`,explanation:`Sai: could swim at five là khả năng quá khứ; should swim là lời khuyên hiện tại.`,correct:!1}]},{q:`The school handbook says students must prepare for this final exam, so we ___ study hard.`,a:[{text:`must`,correct:!0,explanation:`Sự bắt buộc cần thiết để đạt kết quả tốt.`},{text:`might not`,explanation:`Sai: handbook rule makes study compulsory; might not study contradicts the requirement.`,correct:!1},{text:`can't`,explanation:`Sai: sổ tay yêu cầu học chăm chỉ, nên must study chứ không phải can't study.`,correct:!1},{text:`may`,explanation:`Ít phổ biến trong ngữ cảnh này.`,correct:!1}]},{q:`___ you help me with this math problem?`,a:[{text:`Can`,correct:!0,explanation:`Lời yêu cầu giúp đỡ thân mật.`},{text:`Must`,explanation:`Sai: Must I help? hỏi nghĩa vụ, còn câu xin trợ giúp dùng Can you help me...?`,correct:!1},{text:`Shouldn't`,explanation:`Sai: Shouldn't I help...? hỏi có nên giúp hay không; câu này cần Can you help me...?`,correct:!1},{text:`Mayn't`,explanation:`Không tồn tại dạng này.`,correct:!1}]},{q:`To protect your teeth, it would be healthier if you ___ eat too many candies.`,a:[{text:`shouldn't`,correct:!0,explanation:`Lời khuyên không nên làm gì để bảo vệ răng.`},{text:`can`,explanation:`Sai: candies harm teeth nên shouldn't eat too many, không phải can eat.`,correct:!1},{text:`must`,explanation:`Sai: candies are harmful, so should not eat too many is advice; must eat would reverse the warning.`,correct:!1},{text:`might`,explanation:`Sai: candies are harmful, so shouldn't eat is advice; might eat changes the intended warning.`,correct:!1}]},{q:`It ___ be true! I don't believe it.`,a:[{text:`can't`,correct:!0,explanation:`Dùng 'can't' để diễn tả sự không tin nổi vào điều gì đó.`},{text:`must`,explanation:`Sai: I don't believe it signals can't be true; must be true would assert certainty instead.`,correct:!1},{text:`should`,explanation:`Sai: I don't believe it cần can't be true, không phải lời khuyên should be true.`,correct:!1},{text:`may`,explanation:`Sai: can't be true là phủ định chắc chắn; may be true lại cho phép điều người nói không tin.`,correct:!1}]},{q:`The library is a quiet place. We ___ talk loudly.`,a:[{text:`mustn't`,correct:!0,explanation:`Quy định cấm làm ồn trong thư viện.`},{text:`can`,explanation:`Sai: thư viện yêu cầu không nói to; can talk loudly trái quy tắc yên lặng.`,correct:!1},{text:`should`,explanation:`Sai: trong thư viện phải giữ yên lặng; should talk loudly trái với quy định.`,correct:!1},{text:`might`,explanation:`Sai: quiet library forbids loud talking; might talk does not state the prohibition.`,correct:!1}]},{q:`___ I have a glass of water, please?`,a:[{text:`May`,correct:!0,explanation:`Dùng 'May' để xin phép một cách lịch sự.`},{text:`Must`,explanation:`Sai: May I have water? là lời xin phép; Must I have water? hỏi bắt buộc.`,correct:!1},{text:`Shouldn't`,explanation:`Sai: Shouldn't I have water? asks whether it is advisable; the polite request is May I have...?`,correct:!1},{text:`Has to`,explanation:`Sai: Has to không thể mở lời xin nước; mẫu lịch sự là May I have...?`,correct:!1}]},{q:`I can see him sitting in the living room right now, so he ___ be at home.`,a:[{text:`must`,correct:!0,explanation:`Nhìn thấy anh ấy đang ngồi trong phòng khách là bằng chứng trực tiếp; dùng 'must' để suy luận chắc chắn.`},{text:`can't`,explanation:`Sai: bằng chứng trực tiếp cho thấy anh ấy đang ở nhà, nên không thể dùng 'can't be at home'.`,correct:!1},{text:`shouldn't`,explanation:`Sai: câu hỏi yêu cầu suy luận về nơi anh ấy đang ở; 'shouldn't' diễn tả lời khuyên, không phải suy luận.`,correct:!1},{text:`might not`,explanation:`Sai: bằng chứng trực tiếp ủng hộ 'must be at home', không phải khả năng phủ định 'might not'.`,correct:!1}]},{q:`The clinic's hygiene poster instructs every visitor to wash hands before eating: you ___ wash your hands before eating.`,a:[{text:`must`,correct:!0,explanation:`Tấm biển của phòng khám là chỉ dẫn bắt buộc, nên dùng 'must'.`},{text:`mustn't`,explanation:`Sai: khách được yêu cầu must wash hands; mustn't wash trái với áp-phích vệ sinh.`,correct:!1},{text:`can't`,explanation:`Sai: khách phải rửa tay trước khi ăn; can't wash trái với chỉ dẫn của phòng khám.`,correct:!1},{text:`may not`,explanation:`Sai: the hygiene poster requires must wash hands; may not wash contradicts it.`,correct:!1}]},{q:`The tour leader requires everyone to be at the bus at 6 a.m., so we ___ get up early tomorrow for the trip.`,a:[{text:`must`,correct:!0,explanation:`Sự cần thiết phải làm để kịp chuyến đi.`},{text:`can't`,explanation:`Sai: chuyến đi yêu cầu dậy sớm, nên must get up early; can't trái ý bắt buộc.`,correct:!1},{text:`shouldn't`,explanation:`Sai: the tour leader's 6 a.m. requirement means must get up early; shouldn't get up denies the need.`,correct:!1},{text:`may not`,explanation:`Sai: tomorrow's trip requires must get up early; may not get up fails the requirement.`,correct:!1}]},{q:`I ___ ride a bike when I was six.`,a:[{text:`could`,correct:!0,explanation:`Khả năng trong quá khứ.`},{text:`can`,explanation:`Sai ngữ cảnh: khả năng hiện tại cần 'can', không dùng quá khứ 'could'.`,correct:!1},{text:`must`,explanation:`Sai: at age six the sentence asks past ability could ride, not an obligation expressed by must.`,correct:!1},{text:`may`,explanation:`Sai: could ride a bike at six nói năng lực quá khứ, không phải may ride.`,correct:!1}]},{q:`The house rule posted by the parents says football is forbidden in the living room: you ___ play football there.`,a:[{text:`mustn't`,correct:!0,explanation:`Sự cấm đoán để tránh làm hỏng đồ đạc.`},{text:`can`,explanation:`Sai: football bị cấm trong living room, nên mustn't play; can play trái nội quy.`,correct:!1},{text:`should`,explanation:`Sai: football bị cấm trong phòng khách, nên mustn't play; should play trái nội quy.`,correct:!1},{text:`may`,explanation:`Sai: football bị cấm ở living room, nên mustn't play; may play trái nội quy.`,correct:!1}]},{q:`The parents explicitly forbid noise while the baby is sleeping: you ___ make any noise.`,a:[{text:`mustn't`,correct:!0,explanation:`Cha mẹ đã cấm rõ ràng, nên dùng 'mustn't' cho sự cấm đoán.`},{text:`can`,explanation:`Sai: cha mẹ cấm noise khi em bé ngủ; can make noise trái lệnh cấm.`,correct:!1},{text:`should`,explanation:`'Should' chỉ là lời khuyên, không diễn tả lệnh cấm rõ ràng trong stem.`,correct:!1},{text:`may`,explanation:`Sai: cha mẹ cấm noise khi baby ngủ; may make noise không thể thay cho mustn't.`,correct:!1}]},{q:`The forecast says it is 2°C and everyone is wearing a coat, so it ___ be cold outside.`,a:[{text:`must`,correct:!0,explanation:`Suy luận chắc chắn dựa trên bằng chứng mọi người mặc áo khoác.`},{text:`can't`,explanation:`Sai: áo khoác của mọi người là bằng chứng cho must be cold, không phải can't be cold.`,correct:!1},{text:`shouldn't`,explanation:`Sai: everyone wearing coats is evidence for must be cold; shouldn't be cold would be a contradictory recommendation.`,correct:!1},{text:`might not`,explanation:`Sai: coats provide evidence for must be cold; might not be conflicts with that clue.`,correct:!1}]},{q:`___ you play the guitar?`,a:[{text:`Can`,correct:!0,explanation:`Hỏi về khả năng hoặc kỹ năng của ai đó.`},{text:`Must`,explanation:`Sai: Can you play the guitar? hỏi khả năng, không phải Must you play...?`,correct:!1},{text:`Shouldn't`,explanation:`Sai: Shouldn't you play...? asks for advice about playing, while Can you play...? asks about ability.`,correct:!1},{text:`May`,explanation:`Ít dùng để hỏi về kỹ năng.`,correct:!1}]},{q:`The hiking leader says bringing the map is a safety requirement: we ___ forget to bring it.`,a:[{text:`mustn't`,correct:!0,explanation:`Không được phép quên vì bản đồ rất quan trọng.`},{text:`can`,explanation:`Sai: map là yêu cầu an toàn không được quên; can forget không diễn tả mustn't forget.`,correct:!1},{text:`should`,explanation:`Sai: bản đồ là yêu cầu an toàn mustn't forget, không phải should forget.`,correct:!1},{text:`may`,explanation:`Sai: bản đồ là yêu cầu an toàn mustn't forget, còn may forget cho phép quên.`,correct:!1}]},{q:`She ___ come to the party, but she isn't sure.`,a:[{text:`might`,correct:!0,explanation:`Diễn tả một khả năng không chắc chắn lắm.`},{text:`must`,explanation:`Sai: she isn't sure nên dùng might come; must come diễn tả chắc chắn trái cue.`,correct:!1},{text:`can't`,explanation:`Sai: might come diễn tả chưa chắc; can't come lại là không thể đến.`,correct:!1},{text:`shouldn't`,explanation:`Sai: she is unsure, so might come expresses possibility; shouldn't come advises her not to attend.`,correct:!1}]},{q:`The classroom rule forbids phones during the lesson: you ___ use your phone then.`,a:[{text:`mustn't`,correct:!0,explanation:`Quy định cấm sử dụng điện thoại trong giờ học.`},{text:`can`,explanation:`Sai: điện thoại bị cấm trong lesson, nên mustn't use; can use trái quy định.`,correct:!1},{text:`should`,explanation:`Sai: điện thoại bị cấm trong giờ học; should use không diễn tả lệnh cấm mustn't.`,correct:!1},{text:`may`,explanation:`Sai: điện thoại bị cấm trong lesson; may use would cho phép điều cấm.`,correct:!1}]},{q:`___ I open the window? It's hot in here.`,a:[{text:`Can`,correct:!0,explanation:`Lời đề nghị hoặc xin phép làm việc gì đó.`},{text:`Must`,explanation:`Sai: Can I open the window? xin phép, trong khi Must I open...? hỏi nghĩa vụ.`,correct:!1},{text:`Shouldn't`,explanation:`Sai: Shouldn't I open the window? asks for advice, whereas the hot room calls for Can I open...?`,correct:!1},{text:`Has to`,explanation:`Sai: Has to không dùng trong câu hỏi xin mở cửa sổ; dùng Can I open...?`,correct:!1}]},{q:`Drivers ___ stop when the traffic light is red.`,a:[{text:`must`,correct:!0,explanation:`Luật lệ giao thông bắt buộc phải tuân theo.`},{text:`might`,explanation:`Sai mức độ: đèn đỏ là quy định bắt buộc must stop, không chỉ khả năng thấp might stop.`,correct:!1},{text:`can't`,explanation:`Sai: đèn đỏ buộc phải dừng, vì vậy must stop; can't stop đảo ngược nghĩa.`,correct:!1},{text:`shouldn't`,explanation:`Sai: red traffic light requires must stop; shouldn't stop would be advice not to stop.`,correct:!1}]},{q:`You ___ drink more water during summer.`,a:[{text:`should`,correct:!0,explanation:`Lời khuyên tốt cho sức khỏe trong mùa hè.`},{text:`mustn't`,explanation:`Sai: uống nước mùa hè là should drink more, không phải cấm mustn't drink.`,correct:!1},{text:`can't`,explanation:`Sai: uống thêm nước là lời khuyên mùa hè, không phải không thể drink more water.`,correct:!1},{text:`may not`,explanation:`Sai: summer hydration is advice should drink more, not may not drink.`,correct:!1}]},{q:`I ___ find my keys. Have you seen them?`,a:[{text:`can't`,correct:!0,explanation:`Diễn tả việc không thể thực hiện ở hiện tại.`},{text:`must`,explanation:`Sai: missing keys means can't find them now; must find would express an obligation, not the reported inability.`,correct:!1},{text:`should`,explanation:`Sai: can't find keys mô tả không thể tìm thấy, không phải lời khuyên should find.`,correct:!1},{text:`may`,explanation:`Sai: can't find keys nói không thể tìm thấy; may find không đúng nội dung hiện tại.`,correct:!1}]},{q:`His teacher has required extra preparation for tomorrow's test, so he ___ study tonight.`,a:[{text:`must`,correct:!0,explanation:`Sự cần thiết/bắt buộc để chuẩn bị cho bài thi.`},{text:`can't`,explanation:`Sai: extra preparation for tomorrow's test tạo yêu cầu must study tonight, không phải can't study.`,correct:!1},{text:`might not`,explanation:`Sai: teacher required study tonight; might not study is not the required action.`,correct:!1},{text:`shouldn't`,explanation:`Sai: the teacher required study tonight, so must study is mandatory; shouldn't study reverses that requirement.`,correct:!1}]},{q:`___ you pass me the salt, please?`,a:[{text:`Could`,correct:!0,explanation:`Lời yêu cầu giúp đỡ một cách lịch sự.`},{text:`Must`,explanation:`Quá nặng nề. Cách dùng phù hợp trong câu này là “Could”.`,correct:!1},{text:`Shouldn't`,explanation:`Sai: Shouldn't you pass me the salt? is a reproach, not the polite request Could you pass...?`,correct:!1},{text:`Mayn't`,explanation:`Không tồn tại. Cách dùng phù hợp trong câu này là “Could”.`,correct:!1}]},{q:`She loves teaching children, so I recommend that she ___ consider becoming a teacher.`,a:[{text:`should`,correct:!0,explanation:`Dùng 'should' để đưa ra lời khuyên về một nghề nghiệp phù hợp.`},{text:`mustn't`,explanation:`Sai: cân nhắc nghề giáo là đề xuất should consider, không phải cấm mustn't consider.`,correct:!1},{text:`can't`,explanation:`Sai: người yêu thích dạy học có thể cân nhắc nghề giáo; can't consider phủ định khả năng đó.`,correct:!1},{text:`might not`,explanation:`Sai: love of teaching supports should consider, not uncertain might not consider.`,correct:!1}]},{q:`To do our part for the environment, we ___ protect it.`,a:[{text:`should`,correct:!0,explanation:`Bổn phận, trách nhiệm xã hội nên làm.`},{text:`mustn't`,explanation:`Sai: bảo vệ môi trường là lời kêu gọi should protect, không phải cấm mustn't protect.`,correct:!1},{text:`can't`,explanation:`Sai: bảo vệ môi trường là lời khuyên chung should protect, không phải can't protect.`,correct:!1},{text:`may not`,explanation:`Sai: protecting the environment is recommended with should protect, not may not protect.`,correct:!1}]},{q:`The safety notice forbids touching the live wire because it is dangerous: you ___ touch it.`,a:[{text:`mustn't`,correct:!0,explanation:`Cấm đoán tuyệt đối vì sự an toàn.`},{text:`can`,explanation:`Sai: dangerous wire cần mustn't touch, không phải can touch.`,correct:!1},{text:`should`,explanation:`Sai: nguy hiểm của dây điện đòi hỏi lệnh cấm mustn't touch, không chỉ lời khuyên should not.`,correct:!1},{text:`might`,explanation:`Sai: dangerous wire demands mustn't touch; might touch only says it may happen.`,correct:!1}]},{q:`I have learned English and am able to speak it well now; I ___ speak English well.`,a:[{text:`can`,correct:!0,explanation:`Khả năng thực hiện hành động ở hiện tại.`},{text:`could`,explanation:`Sai. Phương án 'could' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`mustn't`,explanation:`Sai: am able to speak now tương đương can speak; mustn't speak lại là không được nói.`,correct:!1},{text:`shouldn't`,explanation:`Sai: the present ability is can speak English well; shouldn't speak would advise against speaking.`,correct:!1}]},{q:`The clock has just re not allowed to park here.' -> You ___ park here.`,a:[{text:`mustn't`,correct:!0,explanation:`Not allowed (không cho phép) tương đương với mustn't.`},{text:`can`,explanation:`Sai: not allowed to park tương đương mustn't park; can park trái điều cấm.`,correct:!1},{text:`should`,explanation:`Sai: not allowed to park là điều cấm tuyệt đối mustn't park; should park quá nhẹ và ngược nghĩa.`,correct:!1},{text:`might`,explanation:`Sai: not allowed to park is a prohibition, so mustn't park; might park weakens it.`,correct:!1}]},{q:`Hoàn thành câu: 'When I was young, I ___ run very fast.'`,a:[{text:`could`,correct:!0,explanation:`Diễn tả khả năng trong quá khứ khi còn nhỏ.`},{text:`can`,explanation:`Sai: when I was young yêu cầu could run, không dùng can cho mốc quá khứ.`,correct:!1},{text:`must`,explanation:`Sai: I could ride a bike at six nói năng lực quá khứ, không phải nghĩa vụ must.`,correct:!1},{text:`should`,explanation:`Sai: could run very fast khi còn nhỏ là năng lực quá khứ, không phải should run.`,correct:!1}]},{q:`Viết lại câu: 'It is necessary for you to finish this.' -> You ___ finish this.`,a:[{text:`must`,correct:!0,explanation:`Necessary (cần thiết) dùng 'must' hoặc 'have to'.`},{text:`might`,explanation:`Sai: necessary means must finish, not the low-probability idea might finish.`,correct:!1},{text:`shouldn't`,explanation:`Sai: necessary to finish tương đương must finish; shouldn't finish lại khuyên không hoàn thành.`,correct:!1},{text:`can't`,explanation:`Sai: necessary to finish requires must finish, còn can't finish mang nghĩa không thể hoàn thành.`,correct:!1}]},{q:`Trong ngữ cảnh xin phép lịch sự, viết lại câu: 'Do you mind if I sit here?' -> ___ I sit here?`,a:[{text:`May`,correct:!0,explanation:`May dùng để xin phép làm gì đó lịch sự hơn can.`},{text:`Must`,explanation:`Sai: Do you mind if I sit here? chuyển thành May I sit here?, không phải Must I sit here?`,correct:!1},{text:`Should`,explanation:`Sai: Do you mind...? chuyển thành May I sit here?;
