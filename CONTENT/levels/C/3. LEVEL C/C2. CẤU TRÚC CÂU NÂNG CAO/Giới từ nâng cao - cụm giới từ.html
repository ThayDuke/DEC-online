const fullQuestionBank=[{q:`My father is very good ___ cooking. 👨‍🍳`,a:[{text:`at`,correct:!0,explanation:`Cấu trúc 'Good at': Giỏi về cái gì đó.`},{text:`in`,explanation:`Sai. Không dùng 'good in' trong ngữ cảnh này.`,correct:!1},{text:`on`,explanation:`'Good on cooking' không phải collocation; 'good at' mới đi với kỹ năng nấu ăn.`,correct:!1},{text:`of`,explanation:`'Good of cooking' không diễn tả năng lực; cấu trúc đúng là 'good at + V-ing'.`,correct:!1}]},{q:`Are you afraid ___ spiders? 🕷️`,a:[{text:`of`,correct:!0,explanation:`Cấu trúc 'Afraid of': Sợ cái gì đó.`},{text:`at`,explanation:`Tính từ 'afraid' đi với 'of' để chỉ đối tượng gây sợ, không dùng 'afraid at'.`,correct:!1},{text:`by`,explanation:`'Afraid with spiders' không phải cụm giới từ chuẩn; 'afraid of spiders' mới đúng.`,correct:!1},{text:`on`,explanation:`'Afraid on spiders' sai collocation; 'of' nối tính từ với đối tượng bị sợ.`,correct:!1}]},{q:`She is interested ___ learning English. 📚`,a:[{text:`in`,correct:!0,explanation:`Cấu trúc 'Interested in': Quan tâm/thích thú về cái gì.`},{text:`on`,explanation:`'Interested on learning' sai collocation; tính từ 'interested' đi với 'in'.`,correct:!1},{text:`at`,explanation:`'Interested at' không dùng để chỉ sự quan tâm đến việc học.`,correct:!1},{text:`of`,explanation:`'Interested of' không phải cấu trúc chuẩn; 'interested in' mới nối với hoạt động.`,correct:!1}]},{q:`Please listen ___ the teacher speaking. 👩‍🏫`,a:[{text:`to`,correct:!0,explanation:`Cấu trúc 'Listen to': Lắng nghe ai/cái gì.`},{text:`at`,explanation:`Sai. Listen không đi với at.`,correct:!1},{text:`by`,explanation:`'Listen with the teacher' không mang nghĩa lắng nghe người nói; collocation là 'listen to'.`,correct:!1},{text:`on`,explanation:`'Listen on the teacher' không phải collocation; người nói trực tiếp đi sau 'listen to'.`,correct:!1}]},{q:`Look ___ the beautiful rainbow! 🌈`,a:[{text:`at`,correct:!0,explanation:`Cấu trúc 'Look at': Nhìn vào cái gì.`},{text:`on`,explanation:`'Look on the rainbow' không phải cách nói chuẩn khi chỉ hướng nhìn; dùng 'look at'.`,correct:!1},{text:`in`,explanation:`'Look in the rainbow' gợi nhìn bên trong vật, không phù hợp với cầu vồng trên trời.`,correct:!1},{text:`by`,explanation:`'Look with the beautiful rainbow' thiếu đối tượng/cách thức phù hợp; câu cần giới từ chỉ hướng nhìn trực tiếp.`,correct:!1}]},{q:`I am looking ___ my keys. I lost them. 🔑`,a:[{text:`for`,correct:!0,explanation:`Cấu trúc 'Look for': Tìm kiếm.`},{text:`at`,explanation:`Sai. 'Look at' là nhìn vào.`,correct:!1},{text:`after`,explanation:`Sai. 'Look after' là chăm sóc.`,correct:!1},{text:`to`,explanation:`'Look to my keys' không có nghĩa tìm kiếm; collocation cần 'look for'.`,correct:!1}]},{q:`My mom looks ___ my baby sister while I am at school. 👶`,a:[{text:`after`,correct:!0,explanation:`Cấu trúc 'Look after': Chăm sóc/trông coi.`},{text:`at`,explanation:`'Look at my baby sister' chỉ nhìn em bé, không nói mẹ đang trông nom em.`,correct:!1},{text:`for`,explanation:`'Look for my baby sister' là đi tìm em bé, trái với ngữ cảnh mẹ đang chăm sóc em.`,correct:!1},{text:`in`,explanation:`'Look in my baby sister' sai nghĩa; 'in' không thể hiện việc mẹ chăm sóc em bé.`,correct:!1}]},{q:`We are waiting ___ the school bus. 🚌`,a:[{text:`for`,correct:!0,explanation:`Cấu trúc 'Wait for': Chờ đợi ai/cái gì.`},{text:`to`,explanation:`'Wait to the school bus' sai collocation; xe buýt được chờ đi sau 'for'.`,correct:!1},{text:`at`,explanation:`'Wait at the school bus' chỉ vị trí đứng gần xe, không phải cấu trúc chờ xe buýt.`,correct:!1},{text:`of`,explanation:`'Wait of the school bus' không phải collocation; xe buýt được chờ đi sau 'for'.`,correct:!1}]},{q:`This bag belongs ___ me. 🎒`,a:[{text:`to`,correct:!0,explanation:`Cấu trúc 'Belong to': Thuộc về ai.`},{text:`at`,explanation:`'Belong at me' sai giới từ; 'at' không chỉ người sở hữu chiếc cặp.`,correct:!1},{text:`with`,explanation:`'Belong with me' có thể gợi vật đi cùng người nói, nhưng không diễn tả quyền sở hữu chiếc cặp.`,correct:!1},{text:`for`,explanation:`'Belongs for me' không chỉ người sở hữu chiếc cặp; cấu trúc đúng là 'belong to'.`,correct:!1}]},{q:`He is famous ___ his delicious cakes. 🍰`,a:[{text:`for`,correct:!0,explanation:`Cấu trúc 'Famous for': Nổi tiếng vì cái gì.`},{text:`at`,explanation:`'Famous at his delicious cakes' sai collocation; 'at' không nêu lý do nổi tiếng.`,correct:!1},{text:`in`,explanation:`'Famous in his delicious cakes' không nêu lý do nổi tiếng; 'in' không theo sau 'famous' theo nghĩa này.`,correct:!1},{text:`on`,explanation:`'Famous on his delicious cakes' không phải cách nói về điều làm anh ấy nổi tiếng.`,correct:!1}]},{q:`My bike is different ___ yours. 🚲`,a:[{text:`from`,correct:!0,explanation:`Cấu trúc 'Different from': Khác với.`},{text:`by`,explanation:`'Different by yours' không phải cấu trúc so sánh; 'by' cần một mức chênh lệch cụ thể, không phải đối tượng so sánh.`,correct:!1},{text:`with`,explanation:`'Different with yours' không phải mẫu so sánh chuẩn; câu này cần 'different from'.`,correct:!1},{text:`at`,explanation:`'Different at yours' sai giới từ khi đối chiếu chiếc xe với xe của bạn.`,correct:!1}]},{q:`This hat is similar ___ that one. 🧢`,a:[{text:`to`,correct:!0,explanation:`Cấu trúc 'Similar to': Giống với/tương tự.`},{text:`with`,explanation:`Sai. Similar không đi với with.`,correct:!1},{text:`for`,explanation:`'Similar for that one' không diễn tả sự tương đồng giữa hai chiếc mũ.`,correct:!1},{text:`at`,explanation:`'Similar at that one' sai collocation; tính từ 'similar' đi với 'to'.`,correct:!1}]},{q:`I am proud ___ my high score. 💯`,a:[{text:`of`,correct:!0,explanation:`Cấu trúc 'Proud of': Tự hào về.`},{text:`at`,explanation:`'Proud at my high score' không phải cấu trúc chuẩn để chỉ niềm tự hào về điểm số.`,correct:!1},{text:`in`,explanation:`'Proud in my high score' không diễn tả cảm xúc tự hào về điểm số; tính từ dùng 'of'.`,correct:!1},{text:`on`,explanation:`'Proud on my high score' sai collocation; 'on' không theo sau 'proud' để chỉ thành tích.`,correct:!1}]},{q:`The box is full ___ toys. 🧸`,a:[{text:`of`,correct:!0,explanation:`Cấu trúc 'Full of': Đầy cái gì.`},{text:`with`,explanation:`'Full with toys' không phải mẫu chuẩn của 'full'; hộp chứa đầy đồ chơi dùng 'full of'.`,correct:!1},{text:`in`,explanation:`'Full in toys' sai cấu trúc; of nối 'full' với thứ chứa bên trong.`,correct:!1},{text:`at`,explanation:`'Full at toys' sai giới từ; 'at' không nối 'full' với những thứ ở bên trong hộp.`,correct:!1}]},{q:`She is bad ___ playing tennis. 🎾`,a:[{text:`at`,correct:!0,explanation:`Cấu trúc 'Bad at': Kém về cái gì.`},{text:`in`,explanation:`'Bad in playing tennis' không phải mẫu chuẩn để đánh giá kỹ năng chơi tennis.`,correct:!1},{text:`on`,explanation:`'Bad on playing tennis' không đánh giá kỹ năng chơi tennis theo cách dùng chuẩn.`,correct:!1},{text:`of`,explanation:`'Bad of playing tennis' sai giới từ; 'of' không giới thiệu kỹ năng được đánh giá.`,correct:!1}]},{q:`I often dream ___ flying in the sky. ☁️`,a:[{text:`of`,correct:!0,explanation:`Cấu trúc 'Dream of': Mơ về cái gì.`},{text:`at`,explanation:`'Dream at flying' không phải collocation; 'at' không giới thiệu nội dung giấc mơ.`,correct:!1},{text:`in`,explanation:`'Dream in flying' sai giới từ; nội dung giấc mơ đi với 'dream of'.`,correct:!1},{text:`to`,explanation:`'Dream to flying' không tự nhiên trước V-ing; cấu trúc mục tiêu là 'dream of'.`,correct:!1}]},{q:`Can you think ___ a good idea? 💡`,a:[{text:`of`,correct:!0,explanation:`Cấu trúc 'Think of': Nghĩ về/nghĩ ra.`},{text:`at`,explanation:`'Think at a good idea' không phải cách nói nghĩ ra một ý tưởng; 'think of' mới phù hợp.`,correct:!1},{text:`in`,explanation:`'Think in a good idea' không phải cách nói nghĩ ra hoặc nghĩ về một ý tưởng.`,correct:!1},{text:`to`,explanation:`'Think to a good idea' không tự nhiên khi nói đang cân nhắc một ý tưởng; dùng 'think of'.`,correct:!1}]},{q:`You can rely ___ him. He is honest. 🤝`,a:[{text:`on`,correct:!0,explanation:`Cấu trúc 'Rely on': Dựa vào/tin tưởng vào.`},{text:`at`,explanation:`'Rely at him' sai collocation; người được tin cậy đi sau 'rely on'.`,correct:!1},{text:`in`,explanation:`'Rely in him' sai collocation; người đáng tin cậy đi sau 'rely on'.`,correct:!1},{text:`of`,explanation:`'Rely of him' không phải cấu trúc tiếng Anh chuẩn để nói dựa vào một người.`,correct:!1}]},{q:`Success depends ___ hard work. 💪`,a:[{text:`on`,correct:!0,explanation:`Cấu trúc 'Depend on': Phụ thuộc vào.`},{text:`at`,explanation:`'Depend at hard work' sai collocation; quan hệ phụ thuộc dùng 'depend on'.`,correct:!1},{text:`to`,explanation:`'Depend to' không phải cấu trúc chuẩn trong tiếng Anh.`,correct:!1},{text:`of`,explanation:`'Depend of' sai collocation; động từ này đi với 'on'.`,correct:!1}]},{q:`He apologized ___ being late. ⏰`,a:[{text:`for`,correct:!0,explanation:`Cấu trúc 'Apologize for': Xin lỗi vì việc gì.`},{text:`at`,explanation:`'Apologize at being late' sai; apologize for giới thiệu lý do xin lỗi.`,correct:!1},{text:`in`,explanation:`'Apologize in being late' không phải collocation chỉ lý do.`,correct:!1},{text:`on`,explanation:`'Apologize on being late' sai cấu trúc; 'for' mới nối lời xin lỗi với lý do.`,correct:!1}]},{q:`We insist ___ going to the zoo. 🦁`,a:[{text:`on`,correct:!0,explanation:`Cấu trúc 'Insist on': Khăng khăng đòi làm gì.`},{text:`at`,explanation:`'Insist at going' không phải cấu trúc chỉ sự khăng khăng đi sở thú.`,correct:!1},{text:`in`,explanation:`'Insist in going' sai giới từ; động từ 'insist' dùng 'on' trước V-ing.`,correct:!1},{text:`of`,explanation:`'Insist of going' không phải cấu trúc chỉ sự khăng khăng; động từ dùng 'insist on'.`,correct:!1}]},{q:`She succeeded ___ finishing the puzzle. 🧩`,a:[{text:`in`,correct:!0,explanation:`Cấu trúc 'Succeed in': Thành công trong việc gì.`},{text:`on`,explanation:`'Succeed on finishing' không phải collocation; thành công trong việc gì dùng 'succeed in + V-ing'.`,correct:!1},{text:`at`,explanation:`'Succeed at finishing' không phải mẫu collocation mục tiêu; câu này cần 'succeed in'.`,correct:!1},{text:`of`,explanation:`'Succeed of finishing' không phải kết hợp chuẩn để nói hoàn thành trò xếp hình thành công.`,correct:!1}]},{q:`He applied ___ a new job. 💼`,a:[{text:`for`,correct:!0,explanation:`'Apply for a new job' nghĩa là nộp đơn xin một công việc mới.`},{text:`at`,explanation:`'Apply at a new job' không dùng để nói nộp đơn; 'at' thường chỉ địa điểm.`,correct:!1},{text:`in`,explanation:`'Apply in a new job' không diễn tả đối tượng của đơn xin việc; phải dùng 'for'.`,correct:!1},{text:`on`,explanation:`'Apply on a new job' không phải collocation tiếng Anh; 'on' không đánh dấu công việc muốn xin.`,correct:!1}]},{q:`The prince is married ___ the princess. 👑`,a:[{text:`to`,correct:!0,explanation:`'Married to the princess' là cụm chuẩn để chỉ người mà hoàng tử kết hôn.`},{text:`with`,explanation:`'Married with the princess' không dùng trong cấu trúc chỉ người phối ngẫu; chọn 'to'.`,correct:!1},{text:`for`,explanation:`'Married for the princess' không nêu quan hệ hôn nhân; 'for' chỉ mục đích hoặc đối tượng hưởng lợi.`,correct:!1},{text:`at`,explanation:`'Married at the princess' sai giới từ; 'at' không đi sau 'married' để chỉ người.`,correct:!1}]},{q:`Who is responsible ___ this mess? 🧹`,a:[{text:`for`,correct:!0,explanation:`'Responsible for this mess' xác định người chịu trách nhiệm về đống lộn xộn.`},{text:`at`,explanation:`'Responsible at this mess' không phải kết hợp chuẩn; 'at' không giới thiệu việc phải chịu trách nhiệm.`,correct:!1},{text:`in`,explanation:`'Responsible in this mess' không diễn tả trách nhiệm đối với một sự việc; dùng 'for'.`,correct:!1},{text:`on`,explanation:`'Responsible on this mess' không dùng trong tiếng Anh chuẩn để nói trách nhiệm về sự việc.`,correct:!1}]},{q:`This game is suitable ___ kids. 🎮`,a:[{text:`for`,correct:!0,explanation:`'Suitable for kids' nói trò chơi phù hợp với trẻ em.`},{text:`at`,explanation:`'Suitable at kids' không phải
