const fullQuestionBank=[{q:`He is a famous ___ in this country. 🎬`,a:[{text:`actor`,correct:!0,explanation:`Cần danh từ chỉ người (diễn viên nam) sau mạo từ 'a' và tính từ 'famous'.`},{text:`act`,explanation:`Đây là động từ. Cách dùng phù hợp trong câu này là “actor”.`,correct:!1},{text:`acting`,explanation:`Đây là danh động từ/động từ thêm ing.`,correct:!1},{text:`action`,explanation:`Đây là danh từ chỉ hành động, không hợp nghĩa.`,correct:!1}]},{q:`She sings very ___. 🎤`,a:[{text:`beautifully`,correct:!0,explanation:`Cần trạng từ (adv) để bổ nghĩa cho động từ thường 'sings'.`},{text:`beauty`,explanation:`Sai. 'Beauty' là danh từ chỉ vẻ đẹp, không phải trạng từ bổ nghĩa cho 'sings'.`,correct:!1},{text:`beautiful`,explanation:`Sai. 'Beautiful' là tính từ; sau 'sings very' cần trạng từ 'beautifully'.`,correct:!1},{text:`beautify`,explanation:`Sai. 'Beautify' là động từ; vị trí sau 'sings very' cần trạng từ 'beautifully'.`,correct:!1}]},{q:`Information ___ is very important nowadays. 💻`,a:[{text:`technology`,correct:!0,explanation:`Cụm danh từ 'Information technology' (Công nghệ thông tin).`},{text:`technician`,explanation:`Danh từ chỉ người (kỹ thuật viên).`,correct:!1},{text:`technical`,explanation:`Sai. 'Technical' là tính từ; sau 'Information' cần danh từ 'technology'.`,correct:!1},{text:`technically`,explanation:`Sai. 'Technically' là trạng từ; cụm 'Information technology' cần danh từ.`,correct:!1}]},{q:`The ___ of the internet has changed our lives. 🌐`,a:[{text:`development`,correct:!0,explanation:`Sau mạo từ 'The' cần một danh từ (sự phát triển).`},{text:`developing`,explanation:`'Developing' là dạng V-ing, không thể làm danh từ chính sau 'The' trong câu này.`,correct:!1},{text:`developed`,explanation:`'Developed' là tính từ/V-ed, không diễn tả sự phát triển như một danh từ.`,correct:!1},{text:`develops`,explanation:`'Develops' là động từ chia ngôi thứ ba, không đứng sau mạo từ 'The' ở vị trí này.`,correct:!1}]},{q:`My father is a ___. He grows vegetables. 🚜`,a:[{text:`farmer`,correct:!0,explanation:`Cần danh từ chỉ người (nông dân) phù hợp với ngữ cảnh trồng rau.`},{text:`farming`,explanation:`'Farming' chỉ hoạt động/nghề nông, không chỉ người sau mạo từ 'a'.`,correct:!1},{text:`farm`,explanation:`'Farm' là nông trại hoặc động từ, không phải danh từ chỉ người cha.`,correct:!1},{text:`farmed`,explanation:`'Farmed' là dạng quá khứ/phân từ, không thể làm danh từ chỉ người sau 'a'.`,correct:!1}]},{q:`This film is very ___. 🎞️`,a:[{text:`interesting`,correct:!0,explanation:`Dùng tính từ đuôi -ing để chỉ tính chất của sự vật (bộ phim).`},{text:`interested`,explanation:`Dùng cho cảm xúc của con người (bị thu hút).`,correct:!1},{text:`interest`,explanation:`'Interest' là danh từ hoặc động từ, không làm tính từ sau 'is very'.`,correct:!1},{text:`interestingly`,explanation:`'Interestingly' là trạng từ; sau 'is very' cần tính từ mô tả bộ phim.`,correct:!1}]},{q:`We need to protect the ___. 🌳`,a:[{text:`environment`,correct:!0,explanation:`Sau 'the' là danh từ. Ở đây giữ nguyên danh từ gốc.`},{text:`environmental`,explanation:`Sai. 'Environmental' là tính từ; sau 'the' cần danh từ 'environment'.`,correct:!1},{text:`environmentally`,explanation:`Sai. 'Environmentally' là trạng từ; sau 'the' cần danh từ 'environment'.`,correct:!1},{text:`environmentalist`,explanation:`Danh từ chỉ nhà môi trường học (không hợp ngữ cảnh chung).`,correct:!1}]},{q:`It is ___ to cross the street here. 🚦`,a:[{text:`dangerous`,correct:!0,explanation:`Sau 'to be' (is) cần một tính từ (nguy hiểm).`},{text:`danger`,explanation:`Sai. 'Danger' là danh từ; sau 'is' cần tính từ 'dangerous'.`,correct:!1},{text:`dangerously`,explanation:`Sai. 'Dangerously' là trạng từ; sau 'is' cần tính từ 'dangerous'.`,correct:!1},{text:`endanger`,explanation:`Sai. 'Endanger' là động từ; sau 'is' cần tính từ 'dangerous'.`,correct:!1}]},{q:`She is a ___ girl. She always helps others. 💖`,a:[{text:`kind`,correct:!0,explanation:`Cần tính từ bổ nghĩa cho danh từ 'girl'. 'Kind' (tốt bụng) vừa là tính từ.`},{text:`kindness`,explanation:`Sai. 'Kindness' là danh từ; vị trí trước 'girl' cần tính từ 'kind'.`,correct:!1},{text:`kindly`,explanation:`Sai. 'Kindly' là trạng từ; trước 'girl' cần tính từ 'kind'.`,correct:!1},{text:`unkind`,explanation:`Tính từ mang nghĩa 'không tốt' (sai nghĩa).`,correct:!1}]},{q:`Air ___ is a big problem in big cities. 🏭`,a:[{text:`pollution`,correct:!0,explanation:`Cụm danh từ 'Air pollution' (Ô nhiễm không khí).`},{text:`polluted`,explanation:`Sai. 'Polluted' là tính từ; cụm cần danh từ 'Air pollution'.`,correct:!1},{text:`pollute`,explanation:`Sai. 'Pollute' là động từ; sau 'Air' cần danh từ 'pollution'.`,correct:!1},{text:`pollutant`,explanation:`Chất gây ô nhiễm. Cách dùng phù hợp trong câu này là “pollution”.`,correct:!1}]},{q:`He drives ___. He never has accidents. 🚗`,a:[{text:`carefully`,correct:!0,explanation:`Cần trạng từ bổ nghĩa cho động từ 'drives'. Ngữ cảnh 'không tai nạn' -> cẩn thận.`},{text:`careless`,explanation:`'Careless' là tính từ, trong khi sau động từ 'drives' cần trạng từ chỉ cách lái xe.`,correct:!1},{text:`carelessly`,explanation:`'Carelessly' đúng từ loại nhưng trái với thông tin 'never has accidents', nên sai nghĩa.`,correct:!1},{text:`careful`,explanation:`'Careful' là tính từ; vị trí sau 'drives' phải dùng trạng từ 'carefully'.`,correct:!1}]},{q:`Tet is a ___ festival in Vietnam. 🏮`,a:[{text:`traditional`,correct:!0,explanation:`Cần tính từ đứng trước danh từ 'festival'.`},{text:`tradition`,explanation:`'Tradition' là danh từ số ít, không thể bổ nghĩa trực tiếp cho 'festival'.`,correct:!1},{text:`traditionally`,explanation:`'Traditionally' là trạng từ, không đứng giữa mạo từ 'a' và danh từ 'festival'.`,correct:!1},{text:`traditions`,explanation:`'Traditions' là danh từ số nhiều; vị trí này cần tính từ 'traditional'.`,correct:!1}]},{q:`Thomas Edison was a great ___. 💡`,a:[{text:`inventor`,correct:!0,explanation:`Cần danh từ chỉ người (nhà phát minh).`},{text:`invention`,explanation:`Danh từ chỉ vật (phát minh).`,correct:!1},{text:`invent`,explanation:`Sai. 'Invent' là động từ; sau 'a great' cần danh từ 'inventor'.`,correct:!1},{text:`inventive`,explanation:`Sai. 'Inventive' là tính từ; sau 'a great' cần danh từ chỉ người 'inventor'.`,correct:!1}]},{q:`Her ___ makes everyone happy. 😊`,a:[{text:`happiness`,correct:!0,explanation:`Sau tính từ sở hữu 'Her' cần một danh từ.`},{text:`happy`,explanation:`Sai. 'Happy' là tính từ; sau 'Her' cần danh từ 'happiness'.`,correct:!1},{text:`happily`,explanation:`Sai. 'Happily' là trạng từ; sau 'Her' cần danh từ 'happiness'.`,correct:!1},{text:`happier`,explanation:`Tính từ so sánh hơn.`,correct:!1}]},{q:`We must be ___ when we take exams. 📝`,a:[{text:`careful`,correct:!0,explanation:`Sau 'must be' cần tính từ.`},{text:`carefully`,explanation:`'Carefully' bổ nghĩa cho động từ, nhưng sau cụm liên kết 'must be' cần tính từ.`,correct:!1},{text:`careless`,explanation:`'Careless' là tính từ nhưng trái với lời khuyên khi làm bài thi.`,correct:!1},{text:`care`,explanation:`'Care' là danh từ/động từ, không phải tính từ sau 'must be'.`,correct:!1}]},{q:`The children are playing ___ in the garden. 📢`,a:[{text:`noisily`,correct:!0,explanation:`Cần trạng từ bổ nghĩa cho động từ 'playing'.`},{text:`noisy`,explanation:`'Noisy' là tính từ; sau 'playing' phải dùng trạng từ chỉ cách chơi.`,correct:!1},{text:`noise`,explanation:`'Noise' là danh từ chỉ âm thanh, không thể bổ nghĩa trực tiếp cho 'playing'.`,correct:!1},{text:`noises`,explanation:`'Noises' là danh từ số nhiều, không phù hợp làm trạng từ trong câu này.`,correct:!1}]},{q:`English is an ___ subject. 📚`,a:[{text:`interesting`,correct:!0,explanation:`Cần tính từ bổ nghĩa cho 'subject'.`},{text:`interested`,explanation:`'Interested' thường tả cảm xúc của người học, không tả bản thân môn học.`,correct:!1},{text:`interest`,explanation:`'Interest' là danh từ/động từ; sau 'an' và trước 'subject' cần tính từ.`,correct:!1},{text:`interestingly`,explanation:`'Interestingly' là trạng từ, không thể đứng làm tính từ trước danh từ 'subject'.`,correct:!1}]},{q:`Smoking is ___ to your health. 🚬`,a:[{text:`harmful`,correct:!0,explanation:`Cần tính từ mang nghĩa 'có hại'.`},{text:`harmless`,explanation:`'Harmless' đúng từ loại nhưng trái nghĩa với tác động tiêu cực của việc hút thuốc.`,correct:!1},{text:`harm`,explanation:`'Harm' là danh từ/động từ, không đứng sau 'is' để làm tính từ chỉ tác hại.`,correct:!1},{text:`harmed`,explanation:`'Harmed' là phân từ/quá khứ, không diễn tả tính chất của việc hút thuốc trong cấu trúc này.`,correct:!1}]},{q:`He works as a ___ for a big company. 🎨`,a:[{text:`designer`,correct:!0,explanation:`Cần danh từ chỉ người (nhà thiết kế) sau 'a'.`},{text:`design`,explanation:`'Design' chỉ bản thiết kế hoặc hành động thiết kế, không chỉ nhân viên làm công việc này.`,correct:!1},{text:`designing`,explanation:`'Designing' là danh động từ/V-ing, không phù hợp sau mạo từ 'a' để gọi một người.`,correct:!1},{text:`designs`,explanation:`'Designs' là động từ ngôi thứ ba hoặc danh từ số nhiều, không phải chức danh số ít sau 'a'.`,correct:!1}]},{q:`The ___ of the experiment surprised everyone. 🧪`,a:[{text:`result`,correct:!0,explanation:`Sau 'The' là danh từ. 'Result' (kết quả) hợp lý.`},{text:`resulted`,explanation:`'Resulted' là động từ quá khứ, không thể làm chủ ngữ sau mạo từ 'The'.`,correct:!1},{text:`resulting`,explanation:`'Resulting' là dạng V-ing/tính từ, không gọi tên kết quả của thí nghiệm ở vị trí này.`,correct:!1},{text:`results`,explanation:`Dạng số nhiều không phù hợp với cách câu đang nêu một kết quả cụ thể: 'the result'.`,correct:!1}]},{q:`Please listen to the explanation ___. 👂`,a:[{text:`carefully`,correct:!0,explanation:`Cần trạng từ bổ nghĩa cho động từ 'listen'.`},{text:`careful`,explanation:`'Careful' là tính từ, không bổ nghĩa trực tiếp cho động từ 'listen'.`,correct:!1},{text:`careless`,explanation:`'Careless' là tính từ mang nghĩa bất cẩn, không phải trạng từ chỉ cách lắng nghe.`,correct:!1},{text:`care`,explanation:
