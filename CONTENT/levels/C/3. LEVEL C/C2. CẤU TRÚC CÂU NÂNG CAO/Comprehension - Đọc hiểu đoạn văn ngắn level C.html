day and Thursday`,correct:!0,explanation:`Câu cuối: 'every Tuesday and Thursday afternoon'.`},{text:`Monday and Friday`,explanation:`Sai. Lịch tập được nêu là Tuesday and Thursday afternoon.`,correct:!1},{text:`Saturday`,explanation:`Sai. Saturday không xuất hiện trong lịch tập của anh ấy.`,correct:!1},{text:`Every day`,explanation:`Sai. Đoạn văn giới hạn lịch tập ở thứ Ba và thứ Năm, không phải mỗi ngày.`,correct:!1}]},{q:`Sarah lives in a small house near the forest. There are many tall trees and colorful flowers around her house. She likes listening to birds singing. <br><b>Where is Sarah's house?</b>`,a:[{text:`Near the forest`,correct:!0,explanation:`Câu 1: 'near the forest'.`},{text:`In the city`,explanation:`Sai. Đoạn văn nói ngôi nhà ở gần khu rừng, không ở thành phố.`,correct:!1},{text:`Near the beach`,explanation:`Sai. Vị trí được nêu là near the forest, không phải near the beach.`,correct:!1},{text:`On a mountain`,explanation:`Sai. Đoạn văn không đặt nhà trên núi; chỉ nói nhà gần rừng.`,correct:!1}]},{q:`Sarah lives in a small house near the forest. There are many tall trees and colorful flowers around her house. She likes listening to birds singing. <br><b>What is around her house?</b>`,a:[{text:`Trees and flowers`,correct:!0,explanation:`Câu 2: 'tall trees and colorful flowers'.`},{text:`Cars and buses`,explanation:`Sai. Đoạn văn nêu tall trees và colorful flowers, không nêu xe cộ.`,correct:!1},{text:`Shops`,explanation:`Sai. Không có cửa hàng quanh nhà; thông tin đúng là cây và hoa.`,correct:!1},{text:`A lake`,explanation:`Sai. Đoạn văn không nhắc đến hồ; chỉ có cây cao và hoa nhiều màu.`,correct:!1}]},{q:`Sarah lives in a small house near the forest. There are many tall trees and colorful flowers around her house. She likes listening to birds singing. <br><b>What does Sarah like listening to?</b>`,a:[{text:`Birds singing`,correct:!0,explanation:`Câu cuối: 'She likes listening to birds singing'.`},{text:`Music`,explanation:`Sai. Đoạn văn nói Sarah thíc
