const fullQuestionBank=[{q:`The new highway ___ by the workers for six months, and construction is still ongoing now.`,a:[{text:`has been being built`,correct:!0,explanation:`Cấu trúc bị động HTHTTD: has/have + been + being + V3.`},{text:`has been built`,explanation:`Sai. 'Has been built' chỉ hoàn thành thường, không nhấn mạnh quá trình xây kéo dài sáu tháng.`,correct:!1},{text:`is being built`,explanation:`Đây là thì Hiện tại tiếp diễn bị động.`,correct:!1},{text:`had been being built`,explanation:`Đây là thì Quá khứ hoàn thành tiếp diễn bị động.`,correct:!1}]},{q:`The report ___ by the secretary since this morning, and typing is still in progress.`,a:[{text:`has been being typed`,correct:!0,explanation:`Dùng bị động HTHTTD để nhấn mạnh quá trình kéo dài từ sáng đến nay.`},{text:`has typed`,explanation:`Sai. Chủ ngữ 'The report' (bản báo cáo) không thể tự đánh máy, câu mang nghĩa bị động nên không dùng thì Hiện tại hoàn thành chủ động.`,correct:!1},{text:`was being typed`,explanation:`Sai. Dấu hiệu 'since this morning' yêu cầu dùng thì Hiện tại hoàn thành tiếp diễn, không dùng Quá khứ tiếp diễn.`,correct:!1},{text:`have been being typed`,explanation:`Chủ ngữ 'The report' số ít nên dùng 'has'.`,correct:!1}]},{q:`My car ___ by the mechanic for three hours now.`,a:[{text:`has been being repaired`,correct:!0,explanation:`Diễn tả hành động sửa xe bắt đầu trong quá khứ và vẫn đang tiếp tục ở hiện tại.`},{text:`is repairing`,explanation:`Sai. Chủ ngữ 'My car' bị tác động (được sửa chữa) nên phải dùng cấu trúc bị động, không dùng cấu trúc chủ động.`,correct:!1},{text:`has repaired`,explanation:`Sai. Xe ô tô không thể tự sửa chữa, phải dùng bị động của thì Hiện tại hoàn thành (hoặc tiếp diễn) thay vì chủ động.`,correct:!1},{text:`had been being repaired`,explanation:`Sai. Câu có dấu hiệu 'now', cần chia ở thì Hiện tại hoàn thành tiếp diễn, không dùng thì Quá khứ hoàn thành tiếp diễn.`,correct:!1}]},{q:`These trees ___ by the gardener all day, and watering is still continuing.`,a:[{text:`have been being watered`,correct:!0,explanation:`Chủ ngữ số nhiều 'These trees' đi với 'have been being + V3'.`},{text:`has been being watered`,explanation:`Sai hòa hợp chủ ngữ - động từ.`,correct:!1},{text:`were being watered`,explanation:`Đây là thì Quá khứ tiếp diễn bị động.`,correct:!1},{text:`have been watered`,explanation:`Sai. 'Have been watered' chỉ kết quả, không nhấn mạnh việc tưới kéo dài cả ngày.`,correct:!1}]},{q:`The missing documents ___ by the police for weeks, and the search is still ongoing.`,a:[{text:`have been being searched for`,correct:!0,explanation:`Bị động HTHTTD nhấn mạnh tính liên tục của hành động tìm kiếm.`},{text:`has been being searched for`,explanation:`Sai vì chủ ngữ 'documents' là số nhiều.`,correct:!1},{text:`are searching`,explanation:`Sai. 'Tài liệu' không thể tự tìm kiếm, câu cần cấu trúc bị động.`,correct:!1},{text:`were searched`,explanation:`Sai thì: 'for weeks' và 'still ongoing' cần bị động hoàn thành tiếp diễn, không dùng quá khứ đơn.`,correct:!1}]},{q:`The dinner ___ by my grandmother since 4 PM, and preparation is still underway.`,a:[{text:`has been being prepared`,correct:!0,explanation:`Cấu trúc bị động HTHTTD: has been being + V3.`},{text:`has prepared`,explanation:`Sai. 'Bữa tối' phải được chuẩn bị (bị động), không dùng cấu trúc chủ động.`,correct:!1},{text:`is being prepared`,explanation:`Thiếu tính chất 'hoàn thành' từ mốc thời gian 4h.`,correct:!1},{text:`have been being prepared`,explanation:`Chủ ngữ 'The dinner' số ít.`,correct:!1}]},{q:`Use the Past Perfect Continuous Passive to emphasize the ongoing process before the past event: the old house ___ by the team for six months before it collapsed.`,a:[{text:`had been being renovated`,correct:!0,explanation:`Bị động QKHTTD diễn tả hành động kéo dài liên tục trước một thời điểm quá khứ.`},{text:`has been being renovated`,explanation:`Sai. Dấu hiệu 'before it collapsed' (trước khi nó sụp đổ - ở quá khứ) yêu cầu dùng Quá khứ hoàn thành tiếp diễn, không dùng thì Hiện tại.`,correct:!1},{text:`was being renovated`,explanation:`Chưa nhấn mạnh được tính hoàn thành tiếp diễn trước mốc khác.`,correct:!1},{text:`had renovated`,explanation:`Sai. Ngôi nhà phải 'được cải tạo' (bị động), không dùng cấu trúc chủ động của thì Quá khứ hoàn thành.`,correct:!1}]},{q:`Use the Past Perfect Continuous Passive to emphasize the ongoing process before the past event: the patient ___ by the doctor for over an hour before the surgery.`,a:[{text:`had been being examined`,correct:!0,explanation:`Dùng bị động QKHTTD: had + been + being + V3.`},{text:`has been being examined`,explanation:`Sai. Mốc 'before the surgery' ở quá khứ; bệnh nhân cần được khám liên tục hơn một giờ trước mốc đó.`,correct:!1},{text:`was examined`,explanation:`Sai. 'Was examined' là quá khứ đơn, không thể hiện bệnh nhân được khám liên tục hơn một giờ trước phẫu thuật.`,correct:!1},{text:`had examined`,explanation:`Sai. Bệnh nhân 'được khám' (bị động), không dùng cấu trúc chủ động.`,correct:!1}]},{q:`Use the Past Perfect Continuous Passive to emphasize the ongoing process before the past event: the suspect ___ by the detectives for days before he confessed.`,a:[{text:`had been being watched`,correct:!0,explanation:`Hành động bị theo dõi diễn ra liên tục trong quá khứ.`},{text:`was being watched`,explanation:`Thì Quá khứ tiếp diễn không nhấn mạnh thời gian 'for days' bằng QKHTTD.`,correct:!1},{text:`has been being watched`,explanation:`Sai. 'Before he confessed' là mốc quá khứ; nghi phạm đã bị theo dõi liên tục nhiều ngày trước đó.`,correct:!1},{text:`had watched`,explanation:`Sai. Kẻ tình nghi 'bị theo dõi' (bị động), không thể tự theo dõi (chủ động).`,correct:!1}]},{q:`Use the Past Perfect Continuous Passive to emphasize the ongoing process before the past event: the classroom ___ by the students for 20 minutes when the teacher arrived.`,a:[{text:`had been being cleaned`,correct:!0,explanation:`Cấu trúc: had been being + V3 cho thì QKHTTD bị động.`},{text:`has been being cleaned`,explanation:`Sai. 'When the teacher arrived' là mốc quá khứ; lớp đã được dọn liên tục 20 phút trước khi cô đến.`,correct:!1},{text:`was cleaned`,explanation:`Sai. Cấu trúc bị động của Quá khứ đơn không thể hiện được tính liên tục 'for 20 minutes' của hành động trước thời điểm đến.`,correct:!1},{text:`cleaned`,explanation:`Sai. Lớp học không thể tự dọn dẹp, câu mang nghĩa bị động.`,correct:!1}]},{q:`The project ___ by the students for a month by the end of next week, and work will still be ongoing.`,a:[{text:`will have been being done`,correct:!0,explanation:`Cấu trúc bị động TLHTTD: will have been being + V3.`},{text:`will have been done`,explanation:`Đây là thì TLHT bị động.`,correct:!1},{text:`is being done`,explanation:`Sai thì: 'by the end of next week' yêu cầu tương lai hoàn thành tiếp diễn bị động, không chỉ hiện tại tiếp diễn.`,correct:!1},{text:`will be done`,explanation:`Đây là thì TLĐ bị động.`,correct:!1}]},{q:`The garden ___ by the robot for 5 hours by the time you come home, and tending will still be ongoing.`,a:[{text:`will have been being mowed`,correct:!0,explanation:`Diễn tả hành động kéo dài đến một thời điểm trong tương lai dưới dạng bị động.`},{text:`will have mowed`,explanation:`Sai. Khu vườn 'được cắt cỏ', câu mang nghĩa bị động, không dùng Tương lai hoàn thành chủ động.`,correct:!1},{text:`will be mowing`,explanation:`Sai. Chủ ngữ là 'The garden' nên câu phải chia ở thể bị động.`,correct:!1},{text:`has been being mowed`,explanation:`Sai. 'Has been being mowed' là hiện tại hoàn thành tiếp diễn; mốc 'by the time you come home' đặt hành động ở tương lai.`,correct:!1}]},{q:`By next Christmas, this bridge ___ for two years, and construction will still be ongoing.`,a:[{text:`will have been being built`,correct:!0,explanation:`Cấu trúc bị động TLHTTD phù hợp với dấu hiệu 'By next Christmas' và 'for two years'.`},{text:`will have built`,explanation:`Sai. Cây cầu 'được xây dựng' (bị động), không dùng Tương lai hoàn thành chủ động.`,correct:!1},{text:`has been built`,explanation:`Sai. 'This bridge' là số ít nhưng cấu trúc này thiếu 'being' để diễn tả quá trình xây dựng.`,correct:!1},{text:`will be built`,explanation:`Sai. Dấu hiệu 'By next Christmas' (Trước Giáng sinh tới) và 'for two years' yêu cầu thì Tương lai hoàn thành tiếp diễn, không dùng Tương lai đơn bị động.`,correct:!1}]},{q:`The data ___ by the computer for several hours by midnight, and processing will still be ongoing.`,a:[{text:`will have been being processed`,correct:!0,explanation:`Nhấn mạnh quá trình xử lý dữ liệu liên tục đến mốc nửa đêm.`},{text:`will process`,explanation:`Sai. Dữ liệu (data) không thể tự xử lý, câu mang nghĩa bị động, không dùng Tương lai đơn chủ động.`,correct:!1},{text:`will be processed`,explanation:`Sai. Dấu hiệu 'for several hours by midnight' đòi hỏi thì Tương lai hoàn thành tiếp diễn, không dùng Tương lai đơn bị động.`,correct:!1},{text:`has been processing`,explanation:`Sai. Dữ liệu cần được xử lý (bị động), cấu trúc này là Hiện tại hoàn thành tiếp diễn chủ động.`,correct:!1}]},{q:`The cake ___ for 45 minutes by the time the party starts, and baking will still be ongoing.`,a:[{text:`will have been being baked`,correct:!0,explanation:`Bị động TLHTTD của 'bake' là 'will have been being baked'.`},{text:`will be baking`,explanation:`Sai. Cái bánh (cake) phải 'được nướng' (bị động), không dùng cấu trúc Tương lai tiếp diễn chủ động.`,correct:!1},{text:`is baked`,explanation:`Sai. Có dấu hiệu 'for 45 minutes by the time the party starts' nên phải chia thì Tương lai hoàn thành tiếp diễn bị động, không dùng Hiện tại đơn bị động.`,correct:!1},{text:`will have baked`,explanation:`Sai. Cái bánh không thể tự nướng, câu mang nghĩa bị động.`,correct:!1}]},{q:`Lựa chọn câu đúng: 'Hợp đồng đã và đang được xem xét bởi luật sư suốt 2 tiếng qua.'`,a:[{text:`The contract has been being reviewed by the lawyer for 2 hours.`,correct:!0,explanation:`Dịch đúng cấu trúc bị động HTHTTD.`},{text:`The contract has reviewed by the lawyer.`,explanation:`Thiếu 'been' và sai nghĩa.`,correct:!1},{text:`The contract is being reviewed.`,explanation:`Thiếu khoảng thời gian '2 hours'.`,correct:!1},{text:`The contract had been being reviewed.`,explanation:`Sai. Cụm từ 'suốt 2 tiếng qua' (for 2 hours) chỉ hành động kéo dài đến hiện tại, nên phải dùng thì Hiện tại hoàn thành tiếp diễn, không dùng Quá khứ hoàn thành tiếp diễn.`,correct:!1}]},{q:`Tìm lỗi sai: 'The film have been being shown for three hours now.'`,a:[{text:`have`,correct:!0,explanation:`Chủ ngữ 'The film' số ít nên phải dùng 'has'.`},{text:`been`,explanation:`Không phải lỗi. 'Been' là phân từ bắt buộc trong chuỗi 'has/have been being + V3'.`,correct:!1},{text:`being`,explanation:`Không phải lỗi. 'Being' đánh dấu thể tiếp diễn trong cấu trúc bị động hoàn thành tiếp diễn.`,correct:!1},{text:`shown`,explanation:`Không phải lỗi. 'Shown' là V3 của 'show' và giữ vai trò phân từ bị động.`,correct:!1}]},{q:`Use the Past Perfect Continuous Passive to emphasize the ongoing process before the past event: the law ___ by the government for months before it was finally passed.`,a:[{text:`had been being discussed`,correct:!0,explanation:`Hành động thảo luận kéo dài liên tục trước khi luật được thông qua (QKHTTD bị động).`},{text:`has been being discussed`,explanation:`Sai. Mốc thời gian 'before it was finally passed' nằm ở quá khứ, nên hành động xảy ra trước đó phải dùng Quá khứ hoàn thành tiếp diễn.`,correct:!1},{text:`was discussed`,explanation:`Sai. Dấu hiệu 'for months before...' đòi hỏi thì Quá khứ hoàn thành tiếp diễn để nhấn mạnh tính liên tục, không dùng Quá khứ đơn bị động.`,correct:!1},{text:`is being discussed`,explanation:`Sai. Ngữ cảnh của câu ở quá khứ (was finally passed), không thể dùng Hiện tại tiếp diễn.`,correct:!1}]},{q:`Use the Past Perfect Continuous Passive to emphasize the ongoing process before the past event: the song ___ by the choir for half an hour when the power went out.`,a:[{text:`had been being sung`,correct:!0,explanation:`Cấu
