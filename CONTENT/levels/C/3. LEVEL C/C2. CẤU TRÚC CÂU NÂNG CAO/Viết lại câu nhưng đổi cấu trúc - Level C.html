tton class=btn id=prev-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class=btn id=next-btn type=button>Tiếp tục<i class="fa-solid fa-arrow-right"></i></button><button class="btn is-initially-hidden" id=submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=confirm-back-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class="btn is-initially-hidden" id=confirm-submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=reset-btn type=button>Làm lại</button></div></div><footer class=dec-footer>Bản quyền thuộc về DEC - thầy Đức tiếng Anh - 0966939583</footer></div><script>// --- DUKEGEM QUESTION BANK
const fullQuestionBank=[{q:`My house is bigger than your house.`,a:[{text:`Your house is smaller than mine.`,correct:!0,explanation:`Cấu trúc so sánh hơn ngược lại: A bigger than B = B smaller than A.`},{text:`Your house is big than mine.`,explanation:`Sai ngữ pháp so sánh hơn.`,correct:!1},{text:`My house is as small as yours.`,explanation:`Sai. Phương án 'My house is as small as yours.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`Your house is not small than mine.`,explanation:`Sai. Phương án 'Your house is not small than mine.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`This is my favorite book.`,a:[{text:`I like this book the most.`,correct:!0,explanation:`Favorite (yêu thích nhất) tương đương với like the most.`},{text:`I like this book more.`,explanation:`Thiếu 'the most' để chỉ sự nhất.`,correct:!1},{text:`This book is my like.`,explanation:`Sai. Phương án 'This book is my like.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`I don't like this book.`,explanation:`Nghĩa quá cực đoan so với câu gốc.`,correct:!1}]},{q:`There are four people in my family.`,a:[{text:`My family has four people.`,correct:!0,explanation:`There are... in... = Subject + has/have.`},{text:`My family are four people.`,explanation:`Sai động từ tobe. Cách dùng phù hợp trong câu này là “My family has four people.”.`,correct:!1},{text:`Four people is in my family.`,explanation:`Sai. Phương án 'Four people is in my family.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`My family have four people.`,explanation:`My family là danh từ số ít, dùng 'has'.`,correct:!1}]},{q:`He is a fast runner.`,a:[{text:`He runs very fast.`,correct:!0,explanation:`Chuyển từ cụm Danh từ (Adj + N) sang cụm Động từ (V + Adv).`},{text:`He runs fastly.`,explanation:`Fast vừa là tính từ vừa là trạng từ, không có 'fastly'.`,correct:!1},{text:`He is run fast.`,explanation:`Sai. Phương án 'He is run fast.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`He run fast.`,explanation:`Chủ ngữ 'He' động từ phải thêm 's'.`,correct:!1}]},{q:`Let's go to the zoo this weekend.`,a:[{text:`Why don't we go to the zoo this weekend?`,correct:!0,explanation:`Let's + V = Why don't we + V? (Lời đề nghị).`},{text:`How about go to the zoo?`,explanation:`How about + V-ing. Cách dùng phù hợp trong câu này là “Why don't we go to the zoo this weekend?”.`,correct:!1},{text:`Shall we to go to the zoo?`,explanation:`Shall we + V nguyên mẫu.`,correct:!1},{text:`We going to the zoo, okay?`,explanation:`Không đúng cấu trúc lời đề nghị chuẩn.`,correct:!1}]},{q:`The blue car is cheaper than the red car.`,a:[{text:`The red car is more expensive than the blue one.`,correct:!0,explanation:`Cheaper than (rẻ hơn) = More expensive than (đắt hơn).`},{text:`The red car is cheaper than the blue one.`,explanation:`Ngược nghĩa câu gốc.`,correct:!1},{text:`The blue car is as expensive as the red one.`,explanation:`Sai. Phương án 'The blue car is as expensive as the red one.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`The red car is expensiver than the blue one.`,explanation:`Expensive là tính từ dài, dùng 'more expensive'.`,correct:!1}]},{q:`I prefer playing soccer to watching it.`,a:[{text:`I like playing soccer more than watching it.`,correct:!0,explanation:`Prefer V-ing to V-ing = Like V-ing more than V-ing.`},{text:`I like play soccer better than watch it.`,explanation:`Sau like dùng V-ing.`,correct:!1},{text:`I prefer to play soccer than watch it.`,explanation:`Sai. Phương án 'I prefer to play soccer than watch it.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`I like playing soccer as watching it.`,explanation:`Sai. Phương án 'I like playing soccer as watching it.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`This bike belongs to me.`,a:[{text:`This is my bike.`,correct:!0,explanation:`Belong to someone = Someone's property.`},{text:`This bike is my.`,explanation:`Dùng tính từ sở hữu 'my' cuối câu là sai, phải dùng 'mine'.`,correct:!1},{text:`I am this bike.`,explanation:`Sai. Phương án 'I am this bike.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`This is mine bike.`,explanation:`Mine là đại từ sở hữu, không đứng trước danh từ.`,correct:!1}]},{q:`She is too young to ride a motorbike.`,a:[{text:`She is not old enough to ride a motorbike.`,correct:!0,explanation:`Too + adj + to V = Not + adj (ngược nghĩa) + enough + to V.`},{text:`She is enough young to ride a motorbike.`,explanation:`Enough đứng sau tính từ.`,correct:!1},{text:`She is young enough to ride a motorbike.`,explanation:`Sai. Phương án 'She is young enough to ride a motorbike.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`She is too old to ride a motorbike.`,explanation:`Ngược nghĩa hoàn toàn.`,correct:!1}]},{q:`How much is this school bag?`,a:[{text:`What is the price of this school bag?`,correct:!0,explanation:`How much is + S? = What is the price of + S?`},{text:`How many is this school bag?`,explanation:`How many dùng cho số lượng đếm được.`,correct:!1},{text:`What price is this school bag?`,explanation:`Sai. Phương án 'What price is this school bag?' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`How much money you have for this bag?`,explanation:`Sai. Phương án 'How much money you have for this bag?' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`No one in my class is taller than Nam.`,a:[{text:`Nam is the tallest student in my class.`,correct:!0,explanation:`So sánh hơn với 'No one' = So sánh nhất.`},{text:`Nam is taller than no one in my class.`,explanation:`Sai. Cấu trúc 'Nam is taller than no one in my class.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Nam is as tall as everyone in my class.`,explanation:`Sai. Phương án 'Nam is as tall as everyone in my class.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`Nam is the taller student in my class.`,explanation:`So sánh nhất dùng 'the tallest'.`,correct:!1}]},{q:`It's a good idea to brush your teeth twice a day.`,a:[{text:`You should brush your teeth twice a day.`,correct:!0,explanation:`It's a good idea to... = You should... (Lời khuyên).`},{text:`You must to brush your teeth.`,explanation:`Must + V nguyên mẫu, không có 'to'.`,correct:!1},{text:`You can brush your teeth.`,explanation:`Can chỉ khả năng, không phải lời khuyên.`,correct:!1},{text:`Brushing teeth is idea.`,explanation:`Câu không hoàn chỉnh, sai nghĩa.`,correct:!1}]},{q:`The bakery is to the left of the drugstore.`,a:[{text:`The drugstore is to the right of the bakery.`,correct:!0,explanation:`A ở bên trái B = B ở bên phải A.`},{text:`The drugstore is next to the bakery.`,explanation:`Next to (bên cạnh) không rõ hướng như câu gốc.`,correct:!1},{text:`The drugstore is behind the bakery.`,explanation:`Behind (phía sau) sai hướng.`,correct:!1},{text:`The bakery is to the right of the drugstore.`,explanation:`Ngược với câu gốc. Cách dùng phù hợp trong câu này là “The drugstore is to the right of the bakery.”.`,correct:!1}]},{q:`I walk to school every morning as a regular habit.`,a:[{text:`I go to school on foot every morning.`,correct:!0,explanation:`Walk to... = Go to... on foot.`},{text:`I go to school by foot.`,explanation:`Cụm từ đúng là 'on foot', không dùng 'by foot'.`,correct:!1},{text:`I go to school walking.`,explanation:`Ngữ pháp không tự nhiên bằng 'on foot'.`,correct:!1},{text:`I am walking to school every morning.`,explanation:`Thói quen hàng ngày dùng hiện tại đơn, không dùng hiện tại tiếp diễn.`,correct:!1}]},{q:`Why don't we have a picnic near the lake?`,a:[{text:`What about having a picnic near the lake?`,correct:!0,explanation:`Why don't we + V? = What/How about + V-ing?`},{text:`What about have a picnic?`,explanation:`Sau 'about' phải dùng V-ing.`,correct:!1},{text:`Let's to have a picnic.`,explanation:`Let's + V nguyên mẫu, không có 'to'.`,correct:!1},{text:`Shall we having a picnic?`,explanation:`Shall we + V nguyên mẫu.`,correct:!1}]},{q:`Doing exercise is good for your health.`,a:[{text:`It is good for your health to do exercise.`,correct:!0,explanation:`V-ing + is + Adj = It is + Adj + to V.`},{text:`It is good to doing exercise.`,explanation:`It is + Adj + to V (nguyên mẫu).`,correct:!1},{text:`Exercise do is good.`,explanation:`Sai. Dấu hiệu 'for your health' không phù hợp với thì/cấu trúc của phương án 'Exercise do is good.'.`,correct:!1},{text:`To do exercise being good.`,explanation:`Sai. Dấu hiệu 'for your health' không phù hợp với thì/cấu trúc của phương án 'To do exercise being good.'.`,correct:!1}]},{q:`They usually spend two hours doing their homework.`,a:[{text:`It usually takes them two hours to do their homework.`,correct:!0,explanation:`S + spend + time + V-ing = It + takes + O + time + to V.`},{text:`It usually takes they two hours to do homework.`,explanation:`Dùng đại từ tân ngữ 'them', không dùng 'they'.`,correct:!1},{text:`They take two hours to doing homework.`,explanation:`Take + to V, không dùng V-ing.`,correct:!1},{text:`It spends them two hours to do homework.`,explanation:`Chủ ngữ của 'spend' phải là người.`,correct:!1}]},{q:`The weather was so bad that we stayed at home.`,a:[{text:`Because the weather was bad, we stayed at home.`,correct:!0,explanation:`So... that (quá... đến nỗi) tương đương với quan hệ nguyên nhân - kết quả (Because).`},{text:`The weather was bad because we stayed at home.`,explanation:`Sai quan hệ nguyên nhân - kết quả.`,correct:!1},{text:`We stayed at home so the weather was bad.`,explanation:`Sai logic. Cách dùng phù hợp trong câu này là “Because the weather was bad, we stayed at home.”.`,correct:!1},{text:`Because of the weather was bad, we stayed home.`,explanation:`Because of + N/V-ing, không dùng với một mệnh đề.`,correct:!1}]},{q:`What is your date of birth?`,a:[{text:`When were you born?`,correct:!0,explanation:`Date of birth (ngày sinh) = When were you born?`},{text:`When is your born?`,explanation:`Sai cấu trúc. Phương án 'When is your born?' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`What time you born?`,explanation:`Thiếu động từ tobe 'were'.`,correct:!1},{text:`When was your birthday date?`,explanation:`Cách dùng từ không tự nhiên.`,correct:!1}]},{q:`This is the most interesting movie I've ever seen.`,a:[{text:`I have never seen a more interesting movie than this one.`,correct:!0,explanation:`So sánh nhất = Chưa từng thấy cái nào hơn cái này.`},{text:`I have ever seen a more interesting movie.`,explanation:`Thiếu phần so sánh với 'this one'.`,correct:!1},{text:`This movie is more interesting as others.`,explanation:`Sai cấu trúc so sánh hơn (phải dùng than).`,correct:!1},{text:`I haven't seen this movie before.`,explanation:`Sai ý nghĩa (câu gốc nói đã xem rồi và nó hay nhất).`,correct:!1}]},{q:`Mary sings better than Hoa.`,a:[{text:`Hoa doesn't sing as well as Mary.`,correct:!0,explanation:`So sánh hơn (better) = So sánh không bằng (not as well as).`},{text:`Hoa sings worse as Mary.`,explanation:`So sánh hơn của bad là worse than, không dùng as.`,correct:!1},{text:`Mary doesn't sing as well as Hoa.`,explanation:`Ngược nghĩa câu gốc.`,correct:!1},{text:`Hoa sings more bad than Mary.`,explanation:`Trạng từ của bad là badly, so sánh hơn là worse.`,correct:!1}]},{q:`He is too short to reach the top shelf.`,a:[{text:`He isn't tall enough to reach the top shelf.`,correct:!0,explanation:`Too short (quá thấp) = Not tall enough (không đủ cao).`},{text:`He is tall enough to reach the shelf.`,explanation:`Ngược nghĩa câu gốc.`,correct:!1},{text:`He is so short to reach the shelf.`,explanation:`Sai cấu trúc (phải là so short that...).`,correct:!1},{text:`He isn't enough tall to reach the shelf.`,explanation:`Enough đứng sau tính từ.`,correct:!1}]},{q:`We started living here five years ago.`,a:[{text:`We have lived here for five years.`,correct:!0,explanation:`Started + V-ing + ago (QKĐ) = Have/Has + P2 + for (HTHT).`},{text:`We live here since five years.`,explanation:`For dùng cho khoảng thời gian, since dùng cho mốc thời gian.`,correct:!1},{text:`We have lived here since five years.`,explanation:`'Since' phải đi với một mốc cụ thể, không đi trực tiếp với khoảng 'five years'.`,correct:!1},{text:`We are living here for five years.`,explanation:`Không dùng hiện tại tiếp diễn cho khoảng thời gian kéo dài từ quá khứ.`,correct:!1}]},{q:`It's not necessary for you to finish it today.`,a:[{text:`You don't have to finish it today.`,correct:!0,explanation:`Not necessary (không cần thiết) = Don't have to / Needn't.`},{text:`You must not finish it today.`,explanation:`Must not (cấm đoán) không bằng nghĩa với không cần thiết.`,correct:!1},{text:`You couldn't finish it today.`,explanation:`Couldn't chỉ khả năng trong quá khứ.`,correct:!1},{text:`You not need finish it today.`,explanation:`Sai. Dấu hiệu 'for you to finish it today' không phù hợp với thì/cấu trúc của phương án 'You not need finish it today.'.`,correct:!1}]},{q:`I am interested in collecting stamps.`,a:[{text:`My hobby is collecting stamps.`,correct:!0,explanation:`Be interested in something (thích cái gì) = Hobby is something.`},{text:`I am interesting in collecting stamps.`,explanation:`Dùng cho người phải dùng tính từ đuôi -ed (interested).`,correct:!1},{text:`Collecting stamps is my interest in.`,explanation:`Sai cấu trúc. Phương án 'Collecting stamps is my interest in.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`I like collect stamps.`,explanation:`Sau like dùng V-ing.`,correct:!1}]},{q:`The box is so heavy that he can't lift it.`,a:[{text:`The box is too heavy for him to lift.`,correct:!0,explanation:`So + Adj + that + S + can't = Too + Adj + (for O) + to V.`},{text:`The box is heavy enough for him to lift.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “The box is too heavy for him to lift.”.`,correct:!1},{text:`The box is too heavy that he can't lift.`,explanation:`Sai cấu trúc kết hợp giữa too và that.`,correct:!1},{text:`He is too heavy to lift the box.`,explanation:`Sai chủ ngữ (He là người nâng, không phải vật nặng).`,correct:!1}]},{q:`He is a more careful driver than his brother.`,a:[{text:`He drives more carefully than his brother.`,correct:!0,explanation:`Chuyển từ tính từ (careful) sang trạng từ (carefully).`},{text:`He drives more careful than his brother.`,explanation:`Sau động từ 'drives' phải dùng trạng từ.`,correct:!1},{text:`His brother is a more careful driver than him.`,explanation:`Ngược nghĩa câu gốc.`,correct:!1},{text:`He is driving more carefully as his brother.`,explanation:`So sánh hơn dùng 'than', không dùng 'as'.`,correct:!1}]},{q:`I haven't eaten this kind of food before.`,a:[{text:`This is the first time I have eaten this kind of food.`,correct:!0,explanation:`Haven't... before = This is the first time...`},{text:`I have eaten this food many times.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “This is the first time I have eaten this kind of food.”.`,correct:!1},{text:`This is the first time I ate this food.`,explanation:`Sau 'This is the first time' dùng hiện tại hoàn thành.`,correct:!1},{text:`I never eat this kind of food.`,explanation:`Sai. Phương án 'I never eat this kind of food.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`Please don't make so much noise.`,a:[{text:`Would you mind not making so much noise?`,correct:!0,explanation:`Don't + V = Would you mind not + V-ing? (Yêu cầu lịch sự).`},{text:`Would you mind to not make noise?`,explanation:`Mind + V-ing. Cách dùng phù hợp trong câu này là “Would you mind not making so much noise?”.`,correct:!1},{text:`Can you make so much noise?`,explanation:`Sai. Phương án 'Can you make so much noise?' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`Please to not make noise.`,explanation:`Sai cấu trúc. Phương án 'Please to not make noise.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`The Nile is the longest river in the world.`,a:[{text:`No river in the world is longer than the Nile.`,correct:!0,explanation:`So sánh nhất = Không có cái nào hơn.`},{text:`The Nile is longer than all river.`,explanation:`Phải có 'in the world' để đủ nghĩa.`,correct:!1},{text:`No river in the world is as longer as the Nile.`,explanation:`Sai cấu trúc; sau 'as' phải dùng tính từ nguyên dạng.`,correct:!1},{text:`The Nile is longest river in the world.`,explanation:`Thiếu mạo từ 'the' trước so sánh nhất.`,correct:!1}]},{q:`She has a lot of dolls in her room.`,a:[{text:`There are many dolls in her room.`,correct:!0,explanation:`S + has + something = There is/are + something + in...`},{text:`Her room have a lot of dolls.`,explanation:`Room là số ít, dùng 'has'.`,correct:!1},{text:`There is a lot of dolls in her room.`,explanation:`Dolls là số nhiều, dùng 'are'.`,correct:!1},{text:`Many dolls is in her room.`,explanation:`Dolls số nhiều dùng 'are'.`,correct:!1}]},{q:`I find playing video games boring.`,a:[{text:`I am bored with playing video games.`,correct:!0,explanation:`Find something + Adj-ing = Be + Adj-ed + with something.`},{text:`I am boring with playing video games.`,explanation:`Người cảm thấy chán dùng 'bored'.`,correct:!1},{text:`Playing video games is bored.`,explanation:`Sự vật gây chán dùng 'boring'.`,correct:!1},{text:`I find video games is boring.`,explanation:`Sai. Phương án 'I find video games is boring.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`My father is a skillful cook.`,a:[{text:`My father cooks skillfully.`,correct:!0,explanation:`Tính từ (skillful) bổ nghĩa cho danh từ -> Trạng từ (skillfully) bổ nghĩa cho động từ.`},{text:`My father is a skillfully cook.`,explanation:`Trước danh từ dùng tính từ, correct:!1},{text:`He can speaks English well.`,explanation:`Sau 'can' động từ không thêm 's'.`,correct:!1},{text:`He is a good at English speaker.`,explanation:`Sai. Phương án 'He is a good at English speaker.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`This cake is very delicious.`,a:[{text:`What a delicious cake!`,correct:!0,explanation:`S + be + Adj = What + a/an + Adj + N!`},{text:`How delicious cake!`,explanation:`How + Adj + S + be! (How delicious the cake is!).`,correct:!1},{text:`What a delicious!`,explanation:`Cake đếm được số ít cần có 'a'.`,correct:!1},{text:`How a delicious cake!`,explanation:`Sai. Phương án 'How a delicious cake!' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`They will build a new school in this area.`,a:[{text:`A new school will be built in this area.`,correct:!0,explanation:`Chuyển từ câu chủ động sang bị động (TLĐ).`},{text:`A new school will build in this area.`,explanation:`Trường học không thể tự xây dựng.`,correct:!1},{text:`A new school is going to build.`,explanation:`Thiếu dạng bị động 'be built'.`,correct:!1},{text:`A new school will be build.`,explanation:`Quá khứ phân từ của build là built.`,correct:!1}]},{q:`Remember to turn off the lights before leaving.`,a:[{text:`Don't forget to turn off the lights before leaving.`,correct:!0,explanation:`Remember to V = Don't forget to V.`},{text:`Don't forget turn off the lights.`,explanation:`Forget to V (nhớ phải làm gì), forget V-ing (quên đã làm gì).`,correct:!1},{text:`You must remember turn off the lights.`,explanation:`Thiếu 'to' sau remember.`,correct:!1},{text:`Remember turning off the lights.`,explanation:`Sai. Phương án 'Remember turning off the lights.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`I haven't seen her for two years, and the period continues to now.`,a:[{text:`The last time I saw her was two years ago.`,correct:!0,explanation:`Haven't + P2 + for + time = The last time + S + V2 + was + time + ago.`},{text:`I last see her two years ago.`,explanation:`Quá khứ của see là saw.`,correct:!1},{text:`It is two years when I saw her.`,explanation:`Cấu trúc đúng là 'It is two years since I saw her'.`,correct:!1},{text:`I didn't see her for two years.`,explanation:`Dùng hiện tại hoàn thành đúng hơn cho hành động kéo dài đến nay.`,correct:!1}]},{q:`It's a pity I can't swim.`,a:[{text:`I wish I could swim.`,correct:!0,explanation:`It's a pity (thật đáng tiếc) = Câu ước (Wish + QKĐ).`},{text:`I wish I can swim.`,explanation:`Câu ước ở hiện tại dùng quá khứ đơn (could).`,correct:!1},{text:`I wish I will swim.`,explanation:`Sai. Phương án 'I wish I will swim.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`I wish I swim.`,explanation:`Thiếu lùi thì. Cách dùng phù hợp trong câu này là “I wish I could swim.”.`,correct:!1}]},{q:`If you don't study hard, you will fail the exam.`,a:[{text:`Unless you study hard, you will fail the exam.`,correct:!0,explanation:`If... not = Unless. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`Unless you don't study hard, you will fail.`,explanation:`Unless đã mang nghĩa phủ định, không dùng thêm don't.`,correct:!1},{text:`Unless you study hard, you won't fail.`,explanation:`Sai nghĩa (trừ khi học chăm, bạn sẽ không trượt).`,correct:!1},{text:`If you study hard, you will fail.`,explanation:`Ngược nghĩa hoàn toàn.`,correct:!1}]},{q:`This computer is too expensive for me to buy.`,a:[{text:`I don't have enough money to buy this computer.`,correct:!0,explanation:`Vật quá đắt = Tôi không đủ tiền mua.`},{text:`The computer is cheap enough for me.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “I don't have enough money to buy this computer.”.`,correct:!1},{text:`I am too poor to buying this computer.`,explanation:`Sau 'to' dùng động từ nguyên mẫu.`,correct:!1},{text:`This computer is not expensive enough for me.`,explanation:`Sai. Cấu trúc 'This computer is not expensive enough for me.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1}]},{q:`She usually goes to work by car.`,a:[{text:`She usually drives to work.`,correct:!0,explanation:`Go by car = Drive. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`She usually go to work by car.`,explanation:`Chủ ngữ 'She' động từ phải thêm 'es'.`,correct:!1},{text:`She drives to work on car.`,explanation:`Thừa từ (Drives đã bao hàm nghĩa đi bằng ô tô).`,correct:!1},{text:`She is driving to work usually.`,explanation:`Trạng từ chỉ tần suất đứng trước động từ thường.`,correct:!1}]},{q:`They have a three-week summer vacation.`,a:[{text:`Their summer vacation lasts for three weeks.`,correct:!0,explanation:`S + have + a (time)-Adj + N = N + lasts for (time).`},{text:`Their summer vacation is three week.`,explanation:`Sau số 'three' cần danh từ số nhiều 'weeks'.`,correct:!1},{text:`They go on vacation for three week.`,explanation:`Khoảng thời gian sau 'for three' cũng cần 'weeks'.`,correct:!1},{text:`It is a three-weeks summer vacation.`,explanation:`Tính từ ghép không có 's' ở danh từ chỉ thời gian.`,correct:!1}]},{q:`Because I was tired, I went to bed early.`,a:[{text:`I was tired, so I went to bed early.`,correct:!0,explanation:`Because S + V, S + V = S + V, so S + V.`},{text:`I went to bed early because I was tired, so.`,explanation:`Dùng thừa từ nối. Cách dùng phù hợp trong câu này là “I was tired, so I went to bed early.”.`,correct:!1},{text:`Because of tired, I went to bed early.`,explanation:`Because of + N/V-ing (tired là tính từ).`,correct:!1},{text:`So I was tired, I went to bed early.`,explanation:`So không đứng đầu mệnh đề nguyên nhân.`,correct:!1}]},{q:`The shirt is small for him.`,a:[{text:`The shirt is not big enough for him.`,correct:!0,explanation:`Small (bé) = Not big enough (không đủ lớn).`},{text:`The shirt is big enough for him.`,explanation:`'Big enough' trái với ý áo không đủ rộng cho anh ấy.`,corre 1},{text:`Her school has best student.`,explanation:`Thiếu mạo từ 'the' và sai cấu trúc.`,correct:!1}]},{q:`You are not allowed to park here.`,a:[{text:`You must not park here.`,correct:!0,explanation:`Not allowed (không được phép) = Must not (cấm).`},{text:`You don't have to park here.`,explanation:`Don't have to (không cần) khác với cấm.`,correct:!1},{text:`You can park here.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “You must not park here.”.`,correct:!1},{text:`You should not to park here.`,explanation:`Should not + V nguyên mẫu, không có 'to'.`,correct:!1}]},{q:`How much does the rain-coat cost?`,a:[{text:`What is the price of the rain-coat?`,correct:!0,explanation:`How much does... cost? = What is the price of...?`},{text:`How much is the rain-coat cost?`,explanation:`Dùng thừa 'is' hoặc 'does'.`,correct:!1},{text:`What price does the rain-coat?`,explanation:`Thiếu động từ. Cách dùng phù hợp trong câu này là “What is the price of the rain-coat?”.`,correct:!1},{text:`How many money is the rain-coat?`,explanation:`Cụm đúng là 'How much money'.`,correct:!1}]},{q:`I'll help you with the housework.`,a:[{text:`I will give you a hand with the housework.`,correct:!0,explanation:`Help someone = Give someone a hand.`},{text:`I will give you a hand for the housework.`,explanation:`Cụm từ đúng là 'give a hand with'.`,correct:!1},{text:`I help you do to housework.`,explanation:`Thiếu thì tương lai 'will'.`,correct:!1},{text:`I give hand you with housework.`,explanation:`Sai. Phương án 'I give hand you with housework.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`It's a good idea to plant more trees.`,a:[{text:`We should plant more trees.`,correct:!0,explanation:`It's a good idea = We should.`},{text:`Planting more trees are good.`,explanation:`V-ing làm chủ ngữ dùng động từ số ít 'is'.`,correct:!1},{text:`We must to plant more trees.`,explanation:`Must không đi với 'to'.`,correct:!1},{text:`More trees should plant.`,explanation:`Thiếu dạng bị động 'should be planted'.`,correct:!1}]},{q:`My brother is older than me.`,a:[{text:`I am younger than my brother.`,correct:!0,explanation:`A older than B = B younger than A.`},{text:`I am older than my brother.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “I am younger than my brother.”.`,correct:!1},{text:`My brother is as young as me.`,explanation:`Sai. Cấu trúc 'My brother is as young as me.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`I am so young than my brother.`,explanation:`So sánh hơn dùng 'younger', không dùng 'so young than'.`,correct:!1}]},{q:`She began to play the piano when she was six and still plays it today.`,a:[{text:`She has played the piano since she was six.`,correct:!0,explanation:`Began to V when... and still continues now = Have/Has + P2 + since... (HTHT).`},{text:`She has played the piano for she was six.`,explanation:`Since dùng cho mốc thời gian, for dùng cho khoảng thời gian.`,correct:!1},{text:`She plays the piano since she was six.`,explanation:`Phải dùng hiện tại hoàn thành.`,correct:!1},{text:`She began playing piano for six years.`,explanation:`Sai ý nghĩa (bắt đầu chơi được 6 năm khác với bắt đầu từ lúc 6 tuổi).`,correct:!1}]},{q:`I enjoy listening to music.`,a:[{text:`I am fond of listening to music.`,correct:!0,explanation:`Enjoy + V-ing = Be fond of + V-ing.`},{text:`I am enjoy listening to music.`,explanation:`Không dùng 'am' trước 'enjoy'.`,correct:!1},{text:`Listening to music is my enjoy.`,explanation:`Enjoy là động từ, không dùng làm danh từ ở đây.`,correct:!1},{text:`I am fond in listening to music.`,explanation:`Cụm từ đúng là 'fond of'.`,correct:!1}]},{q:`Tom is more intelligent than Peter.`,a:[{text:`Peter is not as intelligent as Tom.`,correct:!0,explanation:`A more Adj than B = B not as Adj as A.`},{text:`Peter is more intelligent than Tom.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “Peter is not as intelligent as Tom.”.`,correct:!1},{text:`Tom is as intelligent as Peter.`,explanation:`Sai. Cấu trúc 'Tom is as intelligent as Peter.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Peter is the most intelligent.`,explanation:`Sai. Phương án 'Peter is the most intelligent.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`The tea is too hot for me to drink.`,a:[{text:`The tea is so hot that I can't drink it.`,correct:!0,explanation:`Too + Adj + for O + to V = So + Adj + that + S + can't + V.`},{text:`The tea is hot enough for me to drink.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “The tea is so hot that I can't drink it.”.`,correct:!1},{text:`The tea is not hot enough to drink.`,explanation:`Sai. Cấu trúc 'The tea is not hot enough to drink.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`I am too hot to drink the tea.`,explanation:`Sai chủ ngữ. Cách dùng phù hợp trong câu này là “The tea is so hot that I can't drink it.”.`,correct:!1}]},{q:`My mother usually goes to the supermarket on foot.`,a:[{text:`My mother usually walks to the supermarket.`,correct:!0,explanation:`Go on foot = Walk. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`My mother usually walk to the supermarket.`,explanation:`Chủ ngữ số ít 'Mother' động từ phải thêm 's'.`,correct:!1},{text:`My mother goes to the supermarket with foot.`,explanation:`Cụm đúng là 'on foot'.`,correct:!1},{text:`My mother is walking to the supermarket.`,explanation:`Sai thì (thói quen dùng hiện tại đơn).`,correct:!1}]},{q:`It takes me thirty minutes to get to school.`,a:[{text:`I spend thirty minutes getting to school.`,correct:!0,explanation:`It takes O + time + to V = S + spend + time + V-ing.`},{text:`I spend thirty minutes to get to school.`,explanation:`Spend + V-ing. Cách dùng phù hợp trong câu này là “I spend thirty minutes getting to school.”.`,correct:!1},{text:`I take thirty minutes getting to school.`,explanation:`Cấu trúc đúng là 'It takes me...'`,correct:!1},{text:`Thirty minutes is taken for me to go school.`,explanation:`Cách diễn đạt không tự nhiên.`,correct:!1}]},{q:`What is your favorite subject?`,a:[{text:`Which subject do you like best?`,correct:!0,explanation:`Favorite subject = Subject you like best.`},{text:`Which subject you like best?`,explanation:`Thiếu trợ động từ 'do'.`,correct:!1},{text:`What subject do you likes best?`,explanation:`Like best (thích nhất), like better (thích hơn).`,correct:!1},{text:`What is the subject you favor?`,explanation:`Cách dùng từ không phổ biến bằng 'like best'.`,correct:!1}]},{q:`This room is very small.`,a:[{text:`What a small room!`,correct:!0,explanation:`S + be + Adj = What + a/an + Adj + N!`},{text:`How a small room!`,explanation:`How + Adj + S + be! Cách dùng phù hợp trong câu này là “What a small room!”.`,correct:!1},{text:`What small room!`,explanation:`Thiếu mạo từ 'a'. Cách dùng phù hợp trong câu này là “What a small room!”.`,correct:!1},{text:`How small is the room!`,explanation:`Câu cảm thán không đảo ngữ động từ 'is'.`,correct:!1}]},{q:`The food was so salty that we couldn't eat it.`,a:[{text:`The food was too salty for us to eat.`,correct:!0,explanation:`So + Adj + that... = Too + Adj + (for O) + to V.`},{text:`The food was salty enough to eat.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “The food was too salty for us to eat.”.`,correct:!1},{text:`The food was so salty to eat.`,explanation:`Sai cấu trúc. Phương án 'The food was so salty to eat.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1},{text:`We were too salty to eat the food.`,explanation:`Sai chủ ngữ. Cách dùng phù hợp trong câu này là “The food was too salty for us to eat.”.`,correct:!1}]},{q:`They have a new car.`,a:[{text:`The new car belongs to them.`,correct:!0,explanation:`Have = Belong to. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`The new car belongs to they.`,explanation:`Sau 'to' dùng đại từ tân ngữ 'them'.`,correct:!1},{text:`They are a new car.`,explanation:`Sai. Phương án 'They are a new car.' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`The new car is of them.`,explanation:`Cách nói không tự nhiên.`,correct:!1}]},{q:`Shall we go out for dinner tonight?`,a:[{text:`How about going out for dinner tonight?`,correct:!0,explanation:`Shall we + V? = How about + V-ing?`},{text:`How about go out for dinner?`,explanation:`Sau about dùng V-ing.`,correct:!1},{text:`Let's to go out for dinner.`,explanation:`Let's + V nguyên mẫu.`,correct:!1},{text:`Why we don't go out for dinner?`,explanation:`Sai thứ tự (Why don't we...).`,correct:!1}]},{q:`My house is behind the post office.`,a:[{text:`The post office is in front of my house.`,correct:!0,explanation:`A ở sau B = B ở trước A.`},{text:`The post office is behind my house.`,explanation:`'Behind my house' đảo ngược quan hệ trước–sau của câu gốc.`,correct:!1},{text:`The post office is next to my house.`,explanation:`Next to (bên cạnh) không chính xác bằng In front of.`,correct:!1},{text:`My house is in front of the post office.`,explanation:`'In front of' đảo ngược ý nhà ở phía sau bưu điện.`,correct:!1}]},{q:`It's important to do your homework.`,a:[{text:`Doing your homework is important.`,correct:!0,explanation:`It is + Adj + to V = V-ing + is + Adj.`},{text:`Do your homework is important.`,explanation:`Động từ đứng đầu câu làm chủ ngữ phải ở dạng V-ing.`,correct:!1},{text:`To doing your homework is important.`,explanation:`To + V nguyên mẫu hoặc V-ing làm chủ ngữ, không dùng To + V-ing.`,correct:!1},{text:`It important to do homework.`,explanation:`Thiếu động từ 'is'. Cách dùng phù hợp trong câu này là “Doing your homework is important.”.`,correct:!1}]},{q:`I have never met such a famous person before.`,a:[{text:`This is the first time I have met such a famous person.`,correct:!0,explanation:`Never... before = This is the first time...`},{text:`I have met many famous people.`,explanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “This is the first time I have met such a famous person.”.`,correct:!1},{text:`Such a famous person was met by me.`,explanation:`Bị động không tự nhiên và sai nghĩa gốc.`,correct:!1},{text:`I never meet a famous person.`,explanation:`Sai. Phương án 'I never meet a famous person.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`She is a fast swimmer.`,a:[{text:`She swims fast.`,correct:!0,explanation:`Fast vừa là tính từ vừa là trạng từ.`},{text:`She swims fastly.`,explanation:`Không có từ 'fastly'.`,correct:!1},{text:`She is swim fast.`,explanation:`Sai. Phương án 'She is swim fast.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1},{text:`She swim fast.`,explanation:`Chủ ngữ số ít 'She' động từ phải thêm 's'.`,correct:!1}]},{q:`No one in the group is more creative than Lan.`,a:[{text:`Lan is the most creative person in the group.`,correct:!0,explanation:`No one more... than = The most...`},{text:`Lan is as creative as everyone.`,explanation:`Sai. Cấu trúc 'Lan is as creative as everyone.' bị sai ngữ pháp hoặc lệch ý nghĩa so với yêu cầu của đề bài.`,correct:!1},{text:`Lan is creative than other people.`,explanation:`Thiếu 'more' trong so sánh hơn.`,correct:!1},{text:`The group has creative person Lan.`,explanation:`Sai. Phương án 'The group has creative person Lan.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`Don't talk in the library.`,a:[{text:`You mustn't talk in the library.`,correct:!0,explanation:`Mệnh lệnh phủ định (Don't) = Mustn't (cấm).`},{text:`You don't have to talk in the library.`,explanation:`Don't have to (không cần) khác với cấm.`,correct:!1},{text:`Talking in the library is okay.`,explanation:`Câu này cho phép nói, trái với lệnh cấm nói trong thư viện.`,correct:!1},{text:`You should talk in the library.`,explanation:`'Should talk' khuyến khích nói, trái với 'mustn't talk'.`,corre lanation:`Ngược nghĩa. Cách dùng phù hợp trong câu này là “I prefer English to Math.”.`,correct:!1},{text:`English is more like than Math.`,explanation:`Sai cấu trúc. Phương án 'English is more like than Math.' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`This is the most beautiful flower I have ever seen.`,a:[{text:`I have never seen a more beautiful flower than this one.`,correct:!0,explanation:`So sánh nhất = Chưa từng thấy cái nào hơn.`},{text:`I have seen many beautiful flowers.`,explanation:`Không sát nghĩa câu gốc.`,correct:!1},{text:`This flower is more beautiful as others.`,explanation:`So sánh hơn dùng 'than'.`,correct:!1},{text:`I saw this flower before.`,explanation:`Sai. Phương án 'I saw this flower before.' chia sai thì hoặc không đúng cấu trúc ngữ pháp theo ngữ cảnh câu.`,correct:!1}]},{q:`The box is empty.`,a:[{text:`There is nothing in the box.`,correct:!0,explanation:`Empty (trống rỗng) = There is nothing in...`},{text:`The box has something in it.`,explanation:`'Something' trái với nghĩa chiếc hộp hoàn toàn trống.`,correct:!1},{text:`There is anything in the box.`,explanation:`Câu khẳng định dùng 'nothing' hoặc 'something', 'anything' dùng trong câu phủ định/nghi vấn.`,correct:!1},{text:`The box is not empty.`,explanation:`'Not empty' phủ định trực tiếp nghĩa của 'empty'.`,correct:!1}]},{q:`It's a two-hour drive from here to my uncle's house.`,a:[{text:`It takes two hours to drive from here to my uncle's house.`,correct:!0,explanation:`Cấu trúc chỉ thời gian di chuyển.`},{text:`I drive two hour to my uncle house.`,explanation:`Thiếu 's' ở hours. Cách dùng phù hợp trong câu này là “It takes two hours to drive from here to my uncle's house.”.`,correct:!1},{text:`My uncle house is two hour drive.`,explanation:`Thiếu sở hữu cách và 's' ở hours.`,correct:!1},{text:`It is two hours to drive here.`,explanation:`Thiếu phần đến nhà bác.`,correct:!1}]},{q:`My sister can dance very gracefully.`,a:[{text:`My sister is a graceful dancer.`,cor
