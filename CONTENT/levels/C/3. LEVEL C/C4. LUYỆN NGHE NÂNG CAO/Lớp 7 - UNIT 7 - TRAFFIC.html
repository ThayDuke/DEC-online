        body {
            font-family: "Be Vietnam Pro", sans-serif;
            background-color: var(--bg-color);
            background-image: var(--shell-background-image);
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: var(--lesson-page-align-y);
            overflow-x: hidden;
        }

        /* BUBBLES */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background-color: var(--ulti-rgba-255-255-255-05);
            border-radius: 50%;
            animation: rise 10s infinite ease-in;
        }

        @keyframes rise {
            0% {
                bottom: -100px;
                transform: translateX(0);
            }

            50% {
                transform: translateX(100px);
            }

            100% {
                bottom: 1080px;
                transform: translateX(-200px);
            }
        }

        /* CONTAINER */
        .app-container {
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            max-width: var(--lesson-frame-width);
            background-color: var(--container-bg);
            border: 1px solid var(--border-main);
            border-radius: 22px;
            box-shadow: 0 22px 50px var(--ulti-rgba-28-62-95-016);
            display: flex;
            flex-direction: column;
            padding: 22px;
            margin: 0 auto 20px;
            position: relative;
            height: calc(100vh - 24px);
            height: calc(100dvh - 1.5rem);
            min-height: 520px;
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        .app-container::before {
            content: "";
            position: absolute;
            inset: 0 0 auto;
            height: var(--accent-height);
            background: linear-gradient(90deg, var(--ulti-hex-e91e63), var(--ulti-hex-00acc1));
            z-index: 1;
            pointer-events: none;
        }

        .header-area {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: var(--lesson-header-margin-bottom);
            min-height: var(--lesson-header-min-height);
        }


        h1 {
            font-family: "Be Vietnam Pro", sans-serif;
            text-align: center;
            color: var(--primary-pink);
            font-weight: var(--font-weight-extra);
            font-size: var(--lesson-title-font-size);
            margin: var(--lesson-title-margin);
            text-transform: none;
            zoom: 0.7;
            line-height: var(--lesson-title-line-height);
            width: 100%;
        }

        #lesson-title.dec-ui-game-title {
            font-family: "Be Vietnam Pro", sans-serif;
            font-weight:var(--font-weight-extra);
            font-size: clamp(1.8rem, 2.5vw, 2.2rem);
            letter-spacing: 0.0625rem;
            text-align: center;
            background: var(--accent-gradient, var(--btn-secondary-bg));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: var(--color-transparent, transparent);
            color: var(--color-transparent, transparent);
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            text-transform: none;
            zoom: 0.7;
            width: 100%;
        }

        /* Overrides for IPA specific header layout */
        body[data-mode="ipa"] .header-area {
            flex-direction: column;
            margin-bottom: 2px;
            min-height: auto;
        }

        body[data-mode="ipa"] .app-logo {
            display: none;
        }

        body[data-mode="ipa"] h1 {
            font-size: var(--lesson-title-font-size);
            margin: var(--lesson-title-margin);
            width: 100%;
            line-height: var(--lesson-title-line-height);
            padding: var(--lesson-title-padding);
            letter-spacing: 0;
        }

        body[data-mode="ipa"] .timer-display {
            display: none !important;
        }

        /* TIMER CLOCK */
        .timer-display {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--ulti-rgba-255-255-255-095);
            color: var(--text-color);
            border: 1px solid var(--border-pink);
            padding: 5px 0;
            width: 116px;
            text-align: center;
            border-radius: 14px;
            font-size: 1.02rem;
            font-weight: var(--font-weight-strong);
            box-shadow: 0 4px 10px var(--ulti-rgba-0-0-0-01);
            display: none;
            transition: all 0.3s;
            z-index: 50;
            font-variant-numeric: tabular-nums;
        }

        .timer-display.is-visible {
            display: block;
        }

        .timer-display.low-time {
            background: var(--ulti-hex-fff0f0);
            border-color: var(--danger-red);
            color: var(--danger-red);
            animation: pulse 1s infinite;
        }

        .timer-display.paused {
            background: var(--ulti-hex-fff8e1);
            border-color: var(--orange-btn);
            color: var(--ulti-hex-555);
            opacity: 0.8;
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* SEGMENTED PROGRESS BAR */
        .progress-container {
            width: 100%;
            height: var(--adaptive-progress-height);
            display: flex;
            gap: var(--adaptive-progress-gap);
            margin-bottom: calc(var(--accent-height) * 4);
            background: none;
        }

        .progress-container.wrap-mode {
            flex-wrap: wrap !important;
            height: auto !important;
        }

        .progress-container.wrap-mode .progress-segment {
            flex: 0 0 calc((100% - (29 * var(--adaptive-progress-gap))) / 30) !important;
            box-sizing: border-box !important;
        }

        .progress-segment {
            flex: 1;
            height: var(--adaptive-progress-height);
            border: var(--adaptive-progress-border-width) solid var(--border-main);
            border-radius: var(--adaptive-progress-segment-radius);
            background: var(--adaptive-progress-empty-bg);
            color: var(--adaptive-progress-empty-text);
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: var(--font-weight-strong);
            cursor: pointer;
            user-select: none;
            transition: background var(--adaptive-progress-motion), border-color var(--adaptive-progress-motion), color var(--adaptive-progress-motion), box-shadow var(--adaptive-progress-motion), transform var(--adaptive-progress-motion);
        }

        .progress-segment:hover:not(.active) {
            background-color: var(--progress-hover-bg);
            transform: translateY(-1px);
        }

        .progress-segment.done {
            background: var(--adaptive-progress-done-bg);
            color: var(--adaptive-progress-done-text);
        }

        .progress-segment.warn {
            background: var(--adaptive-progress-warn-bg);
            color: var(--adaptive-progress-warn-text);
        }

        .progress-segment.active {
            background: var(--adaptive-progress-active-bg);
            color: var(--adaptive-progress-active-text);
            border-color: var(--adaptive-progress-active-bg);
        }

        #display-area {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: stretch;
            align-items: stretch;
            margin-bottom: 20px;
            position: relative;
        }

        .flashcard {
            background: var(--card-bg);
            border: 1px solid var(--border-main);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            text-align: center;
            box-shadow: 0 5px 15px var(--ulti-rgba-0-0-0-005);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            /* Anchor for top/middle/bottom */
            transition: all 0.3s ease;
            position: relative;
            min-height: 280px;
            flex: 1 1 auto;
            height: 100%;
            box-sizing: border-box;
        }

        .card-top-area {
            flex: 2 1 0%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 40px;
        }

        .card-bottom-area {
            flex: 3 1 0%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 60px;
            position: relative;
        }

        .card-middle-area {
            flex: 0 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 0;
        }

        /* Overrides for card border scaling in focus mode */
        body[data-mode="ipa"] .flashcard,
        body[data-mode="listening"] .flashcard {
            border-style: solid;
            border-width: calc(1px / var(--focus-zoom, 1)) !important;
        }

        /* --- IPA SPECIFIC FOCUS MODE --- */
        body[data-mode="ipa"] .header-area {
            padding-left: 5px;
            padding-right: 5px;
        }

        .focus-toggle-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid var(--focus-action-border, rgba(25, 167, 160, 0.36));
            background: var(--focus-action-bg, #ffffff);
            color: var(--focus-action-text, #19a7a0);
            padding: 0 16px;
            height: var(--toggle-height, 36px);
            box-sizing: border-box;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            box-shadow: var(--focus-action-shadow, 0 4px 10px rgba(25, 167, 160, 0.08));
            white-space: nowrap;
        }

        body[data-mode="ipa"] .focus-toggle-btn {
            display: inline-flex;
        }

        .focus-toggle-btn:hover {
            background: var(--focus-action-hover-bg, rgba(25, 167, 160, 0.08));
        }

        .focus-toggle-btn[aria-pressed="true"] {
            background: var(--focus-action-bg, #ffffff) !important;
            color: var(--focus-action-text, #19a7a0) !important;

        .word-bank.blind::after {

            left: -5px;

            border: 1px solid var(--ulti-rgba-255-255-255-06);

            align-items: center;

            color: var(--teal-main);
            display: block;
        }

        .msg-wait {
            color: var(--ulti-hex-ff9800);
            display: block;
        }

        .word-chip {
            background: var(--surface-solid);
            border: 2px solid var(--teal-main);
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 1.3em;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--ulti-hex-b2dfdb);

            user-select: none;
            color: var(--text-color);
            font-weight: var(--font-weight-strong);
            position: relative;
            z-index: 10;

        .word-chip:hover {
            transform: translateY(-2px);
        }

        .word-chip:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .word-chip.used {
            opacity: 0;
            pointer-events: none;
            cursor: default;
        }

        .word-chip.wrong {
            animation: bounce-wrong 0.5s;
            background-color: var(--ulti-hex-ffebee);

                transform: translateX(10px) rotate(5deg);

            60% {
                transform: translateX(-10px) rotate(-5deg);

        .control-right {

            background-size: 100% 100%;
            background-clip: border-box;

            background-color: var(--game-purple);

        .btn-game:hover {
            filter: brightness(1.1);

        .btn-game.active {
            background-color: var(--ulti-hex-8e24aa);

            transform: none;
            box-shadow: none;

            background-image: var(--btn-primary-bg);

            height: 50px;

            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

            width: 50px;
            height: 50px;

                transform: scale(1);
            }

            color: var(--ulti-rgba-46-125-50-078);

        @keyframes slideDown {
            from {

                opacity: 0;

            to {
                transform: translateY(0);

            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.is-visible {
            display: flex;
        }

        .modal-content {
            background: var(--surface-solid);
            width: 90%;
            max-width: 450px;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            border: 5px solid var(--primary-pink);
            box-shadow: 0 20px 50px var(--ulti-rgba-0-0-0-03);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

            font-size: 2em;
            color: var(--game-purple);
            margin-bottom: 20px;
            font-weight: var(--font-weight-strong);

            font-size: 1.4em;
            border-bottom: 2px solid var(--ulti-hex-eee);

        }

        .score-val {
            font-weight: var(--font-weight-strong);
            color: var(--primary-pink);
        }

        .score-message {
            margin-top: 20px;
            color: var(--ulti-hex-666);
            font-style: italic;
        }

            background: var(--btn-primary-bg);

            padding: 10px 30px;
            font-size: 1.2em;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--accent-height);
            font-family: inherit;
            font-weight: var(--font-weight-strong);
            box-shadow:var(--btn-restart-shadow, 0 0.3125rem 0 var(--ulti-hex-5a4050));
        }

        .btn-restart:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* --- Theme Switcher --- */
        .theme-row {
            display: flex;
            justify-content: flex-end;

        body[data-mode="ipa"] .theme-row {

        .sub-header-controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            justify-content: stretch;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
            padding: 0 2px;
            position: relative;
            /* Anchor for absolute timer */
        }

        body[data-mode="ipa"] .sub-header-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        /* Hide focus button by default, show in IPA */
        .focus-toggle-btn {
            display: none;
        }

        body[data-mode="ipa"] .focus-toggle-btn {
            display: inline-flex;
        }

        /* --- New Global Theme Toggle --- */
        .theme-toggle-switch,
        .theme-toggle-switch {
            display: inline-block;
            position: relative;
            width: var(--toggle-width);
            height: var(--toggle-height);
            vertical-align: middle;
            margin: 0;
        }

        .switch-mode.theme-toggle-switch {
            grid-column: 1;
            justify-self: start;
            width: var(--toggle-width);
        }

        .theme-toggle-switch:not(.switch-mode) {
            grid-column: 3;
            justify-self: end;
        }

        .theme-toggle-switch input {
            display: none;
        }

        .theme-toggle-switch .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: var(--toggle-slider-bg);
            transition: .4s;
            border-radius: var(--toggle-height);
            overflow: hidden;
            display: flex;
            align-items: center;
            box-shadow: var(--toggle-slider-shadow);
            border: 1px solid var(--toggle-slider-border);
        }

        .theme-toggle-switch .slider-text {
            width: 100%;
            position: absolute;
            left: var(--toggle-text-youth-left);
            text-align: center;
            color: var(--color-on-accent);
            font-weight: var(--font-weight-strong);
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: .4s;
            user-select: none;
            font-family: "Be Vietnam Pro", sans-serif;
            pointer-events: none;
        }

        .switch-mode.theme-toggle-switch .slider-text {
            left: var(--toggle-text-youth-left);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: normal;
            text-transform: uppercase;
        }

        .theme-toggle-switch:not(.switch-mode) .slider-text {
            color: var(--toggle-text-color);
        }

        .theme-toggle-switch .slider:before {
            position: absolute;
            content: "";
            height: var(--toggle-knob);
            width: var(--toggle-knob);
            left: 4px;
            bottom: 3px;
            box-sizing: border-box;
            border-radius: 50%;
            z-index: 2;
            box-shadow: var(--toggle-knob-shadow);
            transition: transform 0.4s ease, border-color 0.4s ease, background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .theme-toggle-switch:not(.switch-mode) .slider:before {
            border: 2px solid var(--toggle-knob-border);
            background-color: var(--toggle-knob-bg);
        }

        .switch-mode.theme-toggle-switch .slider:before {
            border: 2px solid transparent;
            background-color: var(--surface-solid);
        }

        .theme-toggle-switch input:checked+.slider {
            background: var(--toggle-slider-checked-bg);
            box-shadow:var(--toggle-slider-checked-shadow);
            border: 1px solid var(--toggle-slider-checked-border);
        }

        .theme-toggle-switch:not(.switch-mode) input:checked+.slider .slider-text {
            left: var(--toggle-text-elegant-left);
            color: var(--toggle-text-checked-color);
        }

        .switch-mode.theme-toggle-switch input:checked+.slider .slider-text {
            left: var(--toggle-text-elegant-left);
        }

        .theme-toggle-switch input:checked+.slider:before {
            transform: translateX(var(--toggle-shift));
        }

        body[data-theme="elegant"] .theme-toggle-switch .slider {
            background: var(--toggle-slider-bg);
            box-shadow: var(--toggle-slider-shadow);
        }

        body[data-theme="elegant"] .theme-toggle-switch input:checked+.slider {
            background: var(--toggle-slider-checked-bg);
            box-shadow:var(--toggle-slider-checked-shadow);
        }

    <script>/**

const DukePronunciationEngine = (function createDukePronunciationEngine() {

    const IPA_POLICY_VERSION = '2.0.0';

        fifteen: '15', sixteen: '16', seventeen: '17', eighteen: '18', nineteen: '19',
        twenty: '20', thirty: '30', forty: '40', fifty: '50',
        sixty: '60', seventy: '70', eighty: '80', ninety: '90',
        hundred: '100', thousand: '1000', million: '1000000',
        first: '1', second: '2', third: '3', fourth: '4', fifth: '5',
        sixth: '6', seventh: '7', eighth: '8', ninth: '9', tenth: '10',
        eleventh: '11', twelfth: '12', thirteenth: '13', fourteenth: '14',

        "doesn't": ['does', 'not'],

    function clamp(value, minimum, maximum) {

    function round(value, decimals) {

        return Math.round(value * factor) / factor;

    function normalizeLevel(level) {
        const normalized = String(level || 'B').toUpperCase();
        return normalized === 'A' || normalized === 'C' ? normalized : 'B';
    }

    function normalizeApostrophes(text) {
        return String(text || '').replace(/[’`]/g, "'").replace(/''/g, '"');
    }

    function escapeRegExp(text) {
        return String(text || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function applyPhraseEquivalences(text, equivalences) {
        let value = normalizeApostrophes(text).normalize('NFC').toLowerCase();
        const entries = Array.isArray(equivalences) ? equivalences.slice() : [];
        entries.sort((a, b) => String(b.canonical || '').length - String(a.canonical || '').length);
        entries.forEach((entry) => {
            const canonical = String(entry && entry.canonical || '').trim().toLowerCase();
            if (!canonical) return;
            const variants = Array.isArray(entry.variants) ? entry.variants.slice() : [];
            variants.sort((a, b) => String(b || '').length - String(a || '').length);
            variants.forEach((rawVariant) => {
                const variant = String(rawVariant || '').trim().toLowerCase();
                if (!variant || variant === canonical) return;
                const variantPattern = variant
                    .split(/\s+/)
                    .map(escapeRegExp)
                    .join('\\s+');
                const pattern = new RegExp(
                    '(^|\\s)' + variantPattern + '(?=\\s|$|[.,!?;:])',
                    'g'
                );
                value = value.replace(pattern, '$1' + canonical);
            });
        });
        return value;
    }

    function normalizeSurface(text, equivalences) {
        let value = applyPhraseEquivalences(text, equivalences);
        value = value.replace(/[-–—/]+/g, ' ');
        value = value.replace(/[^a-z0-9'\s]/g, ' ');
        return value.replace(/\s+/g, ' ').trim();
    }

    function normalizeTokens(text, equivalences) {
        const surface = normalizeSurface(text, equivalences);
        if (!surface) return [];
        const output = [];
        surface.split(' ').forEach((token) => {
            const expansion = CONTRACTION_PARTS[token];
            if (expansion) {
                output.push(...expansion);
                return;
            }
            output.push(NUMBER_WORDS[token] || token);
        });
        return output;
    }

    function normalizeListeningSurface(text, equivalences) {
        const apostrophes = String(text || '')
            .normalize('NFC')
            .replace(/[’ʼ`]/g, "'")
            .replace(/'{2,}/g, "'");
        let value = applyPhraseEquivalences(apostrophes, equivalences);
        value = value.replace(/[-–—/]+/g, ' ');
        value = value.replace(/[^a-z0-9'\s]/g, ' ');
        return value.replace(/\s+/g, ' ').trim();
    }

    function normalizeListeningParts(text, equivalences) {
        const surface = normalizeListeningSurface(text, equivalences);
        if (!surface) return [];
        return surface.split(' ').map((token) => NUMBER_WORDS[token] || token);
    }

    function normalizeListeningCandidates(candidateInput) {
        const input = Array.isArray(candidateInput) ? candidateInput : [candidateInput];
        const seen = new Set();
        const output = [];
        input.forEach((candidate, inputIndex) => {
            const transcript = typeof candidate === 'string'
                ? candidate
                : String(candidate && candidate.transcript || '');
            const trimmed = transcript.trim();
            if (!trimmed) return;
            const key = normalizeListeningSurface(trimmed, []);
            if (!key || seen.has(key)) return;
            seen.add(key);
            const confidenceValue = typeof candidate === 'object' && candidate !== null
                ? Number(candidate.confidence)
                : NaN;
            const rankValue = typeof candidate === 'object' && candidate !== null
                ? Number(candidate.rank)
                : NaN;
            output.push({
                transcript: trimmed,
                confidence: Number.isFinite(confidenceValue) ? clamp(confidenceValue, 0, 1) : null,
                rank: Number.isFinite(rankValue) ? rankValue : inputIndex
            });
        });
        output.sort((a, b) =>
            confidenceForSort(b) - confidenceForSort(a)
            || a.rank - b.rank
        );
        return output;
    }

    function replaceListeningSequence(parts, surfaceParts, targetParts) {
        if (!surfaceParts.length || surfaceParts.length > parts.length) return null;
        const output = [];
        let changed = false;
        for (let index = 0; index < parts.length;) {
            const matches = surfaceParts.every((part, offset) => parts[index + offset] === part);
            if (matches) {
                output.push(...targetParts);
                index += surfaceParts.length;
                changed = true;
            } else {
                output.push(parts[index]);
                index += 1;
            }
        }
        return changed ? output : null;
    }

    function expandListeningCandidateParts(baseParts, profile) {
        const entries = Array.isArray(profile.candidateEquivalences)
            ? profile.candidateEquivalences
            : [];
        const variants = [{ parts: baseParts, equivalenceCount: 0, equivalenceKinds: [] }];
        const seen = new Set([baseParts.join('\u0001')]);
        let capExceeded = false;

        entries.forEach((entry) => {
            if (variants.length >= MAX_LISTENING_CANDIDATE_VARIANTS) {
                capExceeded = true;
                return;
            }
            const surfaceParts = Array.isArray(entry.surfaceParts)
                ? entry.surfaceParts.map((part) => String(part || '').toLowerCase()).filter(Boolean)
                : [];
            const targetParts = Array.isArray(entry.targetParts)
                ? entry.targetParts.map((part) => String(part || '').toLowerCase()).filter(Boolean)
                : [];
            if (!surfaceParts.length || !targetParts.length) return;
            const snapshot = variants.slice();
            snapshot.forEach((variant) => {
                if (variants.length >= MAX_LISTENING_CANDIDATE_VARIANTS) {
                    capExceeded = true;
                    return;
                }
                const replaced = replaceListeningSequence(variant.parts, surfaceParts, targetParts);
                if (!replaced) return;
                const key = replaced.join('\u0001');
                if (seen.has(key)) return;
                seen.add(key);
                variants.push({
                    parts: replaced,
                    equivalenceCount: variant.equivalenceCount + 1,
                    equivalenceKinds: variant.equivalenceKinds.concat(String(entry.kind || 'contraction'))
                });
            });
        });

        variants.forEach((variant) => {
            variant.capExceeded = capExceeded;
        });
        return variants;
    }

    function normalizedLexicalText(text) {
        return normalizeTokens(text, []).join(' ');
    }

    function levenshtein(a, b) {
        if (a === b) return 0;
        if (!a.length) return b.length;
        if (!b.length) return a.length;
        const previous = Array.from({ length: b.length + 1 }, (_, index) => index);
        const current = new Array(b.length + 1);
        for (let i = 1; i <= a.length; i++) {
            current[0] = i;
            for (let j = 1; j <= b.length; j++) {
                current[j] = a[i - 1] === b[j - 1]
                    ? previous[j - 1]
                    : Math.min(previous[j - 1] + 1, previous[j] + 1, current[j - 1] + 1);
            }
            for (let j = 0; j <= b.length; j++) previous[j] = current[j];
        }
        return previous[b.length];
    }

    function lexicalSimilarity(a, b) {
        if (!a || !b) return a === b ? 1 : 0;
        return 1 - levenshtein(a, b) / Math.max(a.length, b.length);
    }

    function normalizeCandidates(candidateInput) {
        const input = Array.isArray(candidateInput) ? candidateInput : [candidateInput];
        const seen = new Set();
        const output = [];
        input.forEach((candidate, inputIndex) => {
            const transcript = typeof candidate === 'string'
                ? candidate
                : String(candidate && candidate.transcript || '');
            const trimmed = transcript.trim();
            if (!trimmed) return;
            const key = normalizedLexicalText(trimmed);
            if (!key || seen.has(key)) return;
            seen.add(key);
            const confidenceValue = typeof candidate === 'object' && candidate !== null
                ? Number(candidate.confidence)
                : NaN;
            const rankValue = typeof candidate === 'object' && candidate !== null
                ? Number(candidate.rank)
                : NaN;
            output.push({
                transcript: trimmed,
                confidence: Number.isFinite(confidenceValue) ? clamp(confidenceValue, 0, 1) : null,
                rank: Number.isFinite(rankValue) ? Math.max(0, Math.floor(rankValue)) : inputIndex,

            });
        });

    function confidenceBand(confidence) {
        if (confidence === null || !Number.isFinite(confidence)) return 'unavailable';
        if (confidence >= 0.8) return 'high';
        if (confidence >= 0.55) return 'medium';
        return 'low';
    }

    function confidenceForSort(candidate) {
        return candidate.confidence === null ? -1 : candidate.confidence;
    }

    function ipaEquivalent(target, spoken, explicitAliases) {
        const aliases = [];
        const builtIn = IPA_ACOUSTIC_EQUIVALENTS[target];
        if (Array.isArray(builtIn)) aliases.push(...builtIn);
        if (Array.isArray(explicitAliases)) aliases.push(...explicitAliases);
        return aliases.some((alias) => normalizedLexicalText(alias) === spoken);
    }

    function scoreIpaCandidate(profile, candidate) {
        const target = normalizedLexicalText(profile.targetText);
        const spoken = normalizedLexicalText(candidate.transcript);
        const level = normalizeLevel(profile.level);
        const passScore = IPA_PASS_SCORE[level];
        const exact = target && spoken === target;
        const accepted = !exact && target && ipaEquivalent(target, spoken, profile.aliases);
        const similarity = target && spoken ? lexicalSimilarity(target, spoken) : 0;
        let finalScore = 0;
        let status = 'incorrect';

        if (exact) {
            finalScore = 100;
            status = 'correct';
        } else if (accepted) {
            finalScore = 92;
            status = 'accepted';
        } else if (similarity >= 0.8) {
            finalScore = Math.min(passScore - 1, Math.round(55 + similarity * 25));
            status = 'near';
        } else {
            finalScore = Math.round(similarity * 55);
        }

        const targetWords = target ? target.split(' ') : [String(profile.targetText || '')];
        const tokenScores = targetWords.map((word, index) => ({
            id: index,
            display: word,
            status,
            matchRatio: status === 'correct' ? 1 : (status === 'accepted' ? 0.92 : round(similarity, 2)),
            hint: status === 'incorrect'
                ? 'Hệ thống chưa nhận đúng từ. Hãy nghe mẫu và nói lại.'
                : ''
        }));

        return {
            apiVersion: API_VERSION,
            policyVersion: IPA_POLICY_VERSION,
            assessmentMode: 'asr_proxy',
            finalScore,
            rawScore: finalScore,
            isPass: (exact || accepted) && finalScore >= passScore,
            passScore,
            confidenceBand: confidenceBand(candidate.confidence),
            selectedCandidate: candidate.transcript,
            candidateText: candidate.transcript,
            candidateConfidence: candidate.confidence,
            candidateRank: candidate.rank,
            tokenScores,
            missingCritical: [],
            insertions: [],
            deletions: status === 'incorrect' ? targetWords.slice() : [],
            substitutions: status === 'near'
                ? [{ target: target, candidate: spoken }]
                : [],
            extraPenalty: 0,
            earnedWeight: round(finalScore / 100, 2),
            totalWeight: 1,
            diagnostics: {
                targetIpa: String(profile.targetIpa || ''),
                evidence: exact ? 'exact_transcript' : (accepted ? 'approved_acoustic_equivalent' : 'lexical_proxy'),
                lexicalSimilarity: round(similarity, 3)
            }
        };
    }

    function emptyIpaResult(profile) {
        const level = normalizeLevel(profile && profile.level);
        const target = normalizedLexicalText(profile && profile.targetText);
        return {
            apiVersion: API_VERSION,
            policyVersion: IPA_POLICY_VERSION,
            assessmentMode: 'asr_proxy',
            finalScore: 0,
            rawScore: 0,
            isPass: false,
            passScore: IPA_PASS_SCORE[level],
            confidenceBand: 'unavailable',
            selectedCandidate: '',
            candidateText: '',
            candidateConfidence: null,
            candidateRank: -1,
            evaluatedCandidatesCount: 0,
            tokenScores: (target ? target.split(' ') : []).map((word, index) => ({
                id: index,
                display: word,
                status: 'incorrect',
                matchRatio: 0,
                hint: 'Không nhận được giọng nói. Hãy thử lại.'
            })),
            missingCritical: [],
            insertions: [],
            deletions: target ? target.split(' ') : [],
            substitutions: [],
            extraPenalty: 0,
            earnedWeight: 0,
            totalWeight: 1,
            diagnostics: { targetIpa: String(profile && profile.targetIpa || ''), evidence: 'no_transcript' }
        };
    }

    function scoreIpaCandidates(profileInput, candidateInput, legacyLevel) {
        const profile = typeof profileInput === 'string'
            ? { targetText: profileInput, targetIpa: '', level: legacyLevel }
            : Object.assign({}, profileInput || {});
        const candidates = normalizeCandidates(candidateInput);
        if (!candidates.length) return emptyIpaResult(profile);
        const scored = candidates.map((candidate) => scoreIpaCandidate(profile, candidate));
        scored.sort((a, b) =>
            b.finalScore - a.finalScore
            || confidenceForSort(b) - confidenceForSort(a)
            || a.candidateRank - b.candidateRank
        );
        scored[0].evaluatedCandidatesCount = scored.length;
        return scored[0];
    }

    function validateListeningProfile(profile) {
        if (!profile || profile.schemaVersion !== LISTENING_PROFILE_VERSION) {
            throw new Error('Invalid Listening profile schema; expected 3.0.0');
        }
        if (!Array.isArray(profile.tokens) || !profile.tokens.length) {
            throw new Error('Invalid Listening profile: missing tokens');
        }
    }

    function buildListeningTokenParts(token, tokenParts) {
        const parts = [];
        const totalWeight = typeof token.weight === 'number' ? token.weight : 1;
        const partWeight = tokenParts.length ? totalWeight / tokenParts.length : 0;
        const requiredIndexes = Array.isArray(token.requiredPartIndexes)
            ? token.requiredPartIndexes
            : [];
        tokenParts.forEach((part, partIndex) => {
            parts.push({
                tokenId: token.id,
                tokenDisplay: String(token.display || part),
                part: String(part || '').toLowerCase(),
                tokenClass: Array.isArray(token.partClasses)
                    ? token.partClasses[partIndex] || token.tokenClass || 'content'
                    : token.tokenClass || 'content',
                criticalReason: Array.isArray(token.criticalReasons)

        function applyDashboardTheme(theme) {

            const toggleCb = document.getElementById('themeToggleCheckbox');
            const toggleTxt = document.getElementById('themeToggleText');

        }

            setDashboardTheme(theme);

            applyDashboardTheme(theme);
            try {

            } catch (err) {

            }
        }

        function stripSkipMarkersFromText(text) {
            // Ẩn các ký hiệu đánh dấu (nếu bài có dùng { } hoặc [ ]) để học sinh không "nhìn lén" ngoại lệ.
            return (text || "").replace(/[{}\[\]]/g, "");
        }

        function normalizeWord(word) {
            // Canonical normalization for o'clock and common contractions
            word = (word || "").toLowerCase();

            // Normalize apostrophes (' → ')
            word = word.replace(/[']/g, "'");

            // (A) Normalize o'clock variants
            // o'clock, o clock, oclock → oclock
            word = word.replace(/\bo\s*'?clock\b/g, "oclock");

            // (B) Normalize common contractions → full form (canonical)
            const contractionMap = {
                "i'm": "i am",
                "you're": "you are",
                "he's": "he is",
                "she's": "she is",
                "it's": "it is",
                "we're": "we are",
                "they're": "they are",
                "i've": "i have",
                "you've": "you have",
                "we've": "we have",
                "they've": "they have",
                "i'll": "i will",
                "you'll": "you will",
                "he'll": "he will",
                "she'll": "she will",
                "we'll": "we will",
                "they'll": "they will",
                "don't": "do not",
                "doesn't": "does not",
                "didn't": "did not",
                "can't": "cannot",
                "won't": "will not",
                "isn't": "is not",
                "aren't": "are not",
                "wasn't": "was not",
                "weren't": "were not",
                "shouldn't": "should not",
                "wouldn't": "would not",
                "couldn't": "could not"
            };

            if (contractionMap[word]) {
                word = contractionMap[word];
            } else {
                word = word.replace(/'s\b/g, "").replace(/s'\b/g, "s");
            }

            // Làm sạch 1 "mảnh" từ:
            // - Bỏ { } [ ] (đánh dấu skip)
            // - Giữ chữ, số và dấu chấm thập phân
            let w = stripSkipMarkersFromText(word);

            // Chuẩn hóa dấu gạch nối/hyphen: "twenty-one" -> "twenty one"
            w = w.replace(/[-–—]/g, " ");

            // Nếu có số, ưu tiên chuẩn hóa về chuỗi số (bỏ dấu , giữ dấu .)
            if (/\d/.test(w)) {
                w = w.replace(/,/g, "");
                w = w.replace(/[^\d.]/g, "");
                // Nếu chỉ còn dấu chấm hoặc rỗng thì fallback về chữ thường
                if (!w || w === ".") return stripSkipMarkersFromText(word).toLowerCase();
                return w.trim();
            }

            // Với chữ: thay dấu câu bằng khoảng trắng để tránh dính chữ
            w = w.replace(/[.,!?;:"''()]/g, " ");
            return w.trim().toLowerCase();
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        const DUKE_NUM_MAP = {
            "zero": 0, "one": 1, "two": 2, "three": 3, "four": 4, "five": 5, "six": 6, "seven": 7, "eight": 8, "nine": 9,
            "ten": 10, "eleven": 11, "twelve": 12, "thirteen": 13, "fourteen": 14, "fifteen": 15, "sixteen": 16, "seventeen": 17, "eighteen": 18, "nineteen": 19,
            "twenty": 20, "thirty": 30, "forty": 40, "fifty": 50, "sixty": 60, "seventy": 70, "eighty": 80, "ninety": 90,
            "hundred": 100, "thousand": 1000, "million": 1000000, "billion": 1000000000,
            "first": 1, "second": 2, "third": 3, "fourth": 4, "fifth": 5, "sixth": 6, "seventh": 7, "eighth": 8, "ninth": 9, "tenth": 10,
            "eleventh": 11, "twelfth": 12, "thirteenth": 13, "fourteenth": 14, "fifteenth": 15, "sixteenth": 16, "seventeen": 17, "eighteen": 18, "nineteenth": 19,
            "twentieth": 20, "thirtieth": 30, "fortieth": 40, "fiftieth": 50, "sixtieth": 60, "seventieth": 70, "eightieth": 80, "ninetieth": 90
        };

        /**
         * Chuyển đổi một danh sách token chữ/số thành dạng "Canonical Digit"
         * Hỗ trợ: "a hundred" -> 100, "point five" -> 0.5, "first" -> 1, year-style...
         */
        function collapseNumericalTokens(tokens) {
            const canonicalList = [];
            const originalToCanonicalIndex = new Array(tokens.length).fill(-1);

            let i = 0;
            const n = tokens.length;

            while (i < n) {
                let currentVal = 0;
                let totalVal = 0;
                let hasNumber = false;
                let j = i;
                let consumed = [];

                while (j < n) {
                    let w = tokens[j].toLowerCase();

                    // Bỏ qua "and" trong cụm số
                    if (w === "and" && hasNumber && (j + 1 < n) && (DUKE_NUM_MAP[tokens[j + 1].toLowerCase()] !== undefined)) {
                        consumed.push(j);
                        j++;
                        w = tokens[j].toLowerCase();
                    }

                    // Xử lý "a hundred", "a thousand"
                    let val = DUKE_NUM_MAP[w];
                    if (w === "a" && (j + 1 < n)) {
                        const nextW = tokens[j + 1].toLowerCase();
                        if (["hundred", "thousand", "million", "billion"].includes(nextW)) val = 1;
                    }

                    if (val !== undefined || /^\d+(\.\d+)?$/.test(w)) {
                        hasNumber = true;
                        if (val === undefined) val = parseFloat(w);
                        consumed.push(j);

                        if (val >= 100 && val <= 1000000000) {
                            if (currentVal === 0) currentVal = 1;
                            if (val === 100) currentVal *= 100;
                            else { totalVal += currentVal * val; currentVal = 0; }
                        } else {
                            if (currentVal >= 20 && currentVal < 100 && currentVal % 10 === 0 && val < 10) {
                                currentVal += val;
                            } else if (currentVal > 0 && (val >= 10 || (currentVal >= 11 && currentVal <= 99))) {
                                totalVal += currentVal * 100;
                                currentVal = val;
                            } else {
                                totalVal += currentVal;
                                currentVal = val;
                            }
                        }
                        j++;

                        // Xử lý "point" cho số thập phân
                        if (j < n && tokens[j].toLowerCase() === "point" && (j + 1 < n) && DUKE_NUM_MAP[tokens[j + 1].toLowerCase()] < 10) {
                            let base = totalVal + currentVal;
                            consumed.push(j); j++;
                            let dec = "";
                            while (j < n && DUKE_NUM_MAP[tokens[j].toLowerCase()] !== undefined && DUKE_NUM_MAP[tokens[j].toLowerCase()] < 10) {
                                dec += DUKE_NUM_MAP[tokens[j].toLowerCase()];
                                consumed.push(j); j++;
                            }
                            const cIdx = canonicalList.length;
                            canonicalList.push(base + "." + dec);
                            consumed.forEach(idx => originalToCanonicalIndex[idx] = cIdx);
                            i = j; hasNumber = false; break;
                        }
                    } else { break; }
                }

                if (hasNumber) {
                    const finalNum = String(totalVal + currentVal);
                    const cIdx = canonicalList.length;
                    canonicalList.push(finalNum);
                    consumed.forEach(idx => originalToCanonicalIndex[idx] = cIdx);
                    i = j;
                } else if (i < j) {
                    // Break từ point
                } else {
                    const cIdx = canonicalList.length;
                    canonicalList.push(tokens[i]);
                    originalToCanonicalIndex[i] = cIdx;
                    i++;
                }
            }
            return { canonicalList, originalToCanonicalIndex };
        }

        function convertNumbers(word) {
            const w = normalizeWord(word);
            if (DUKE_NUM_MAP[w] !== undefined) return String(DUKE_NUM_MAP[w]);
            return w;
        }

        function isMatch(a, b) {
            const na = normalizeWord(a);
            const nb = normalizeWord(b);
            if (na === nb) return true;
            if (convertNumbers(na) === convertNumbers(nb)) return true;
            return false;
        }

        function initGameDataForIndex(idx) {
            if (GAME_SESSION[idx]) return;

            const item = lessonData[idx];
            const sentence = item.title || item.text;
            const targetWordsOriginal = sentence.trim().split(/\s+/);

            let bankItems = targetWordsOriginal.map(w => ({
                original: w,
                display: normalizeWord(w),
                id: `w-${idx}-${Math.random().toString(36).substr(2, 9)}`,
                used: false
            }));

            const distractorCount = targetWordsOriginal.length;
            for (let i = 0; i < distractorCount; i++) {
                const randomWord = commonWords[Math.floor(Math.random() * commonWords.length)];
                bankItems.push({
                    original: randomWord,
                    display: normalizeWord(randomWord),
                    id: `d-${idx}-${Math.random().toString(36).substr(2, 9)}`,
                    used: false
                });
            }
            bankItems.sort(() => Math.random() - 0.5);

            GAME_SESSION[idx] = {
                targetWords: targetWordsOriginal,
                slotsState: new Array(targetWordsOriginal.length).fill(null),
                bank: bankItems,
                listenCount: 0,
                mistakes: 0,
                maxMistakes: 5,
                isLocked: false,
                isFinished: false,
                hasStarted: false,
                hasEarnedHeart: false,
                attemptCount: 0,
                attemptsHistory: []
            };
        }

        function renderGameInterface(idx) {
            const data = GAME_SESSION[idx];
            if (!data) return;

            const item = lessonData[idx];

            let slotsHTML = '';
            data.targetWords.forEach((word, i) => {
                const filledWord = data.slotsState[i];
                if (filledWord) {
                    slotsHTML += `<div class="slot filled" id="slot-${idx}-${i}">${filledWord}</div>`;
                } else {
                    slotsHTML += `<div class="slot" id="slot-${idx}-${i}">___</div>`;
                }
            });
            let livesHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;

            const shouldLockBank = data.isLocked || data.isFinished || !data.hasStarted;
            const lockedClass = shouldLockBank ? 'locked' : '';
            const blindClass = (!data.hasStarted && !data.isLocked && !data.isFinished) ? 'blind' : '';
            const activeClass = isPlaying ? 'active' : '';

            let bankHTML = '';
            data.bank.forEach((item) => {
                const usedClass = item.used ? 'used' : '';
                bankHTML += `<div class="word-chip ${usedClass}" id="${item.id}" data-chip-id="${item.id}" data-word="${escapeHtml(item.display)}">${escapeHtml(item.display)}</div>`;
