const fullQuestionBank=[{q:`Khi nói trong lớp, em có ___ rõ ràng không? Chọn từ tiếng Anh đúng.`,a:[{text:`listen`,explanation:`Sai. Listen nghĩa là nghe; câu hỏi về khả năng nói rõ nên đáp án là speak.`,correct:!1},{text:`look`,explanation:`Sai. Look nghĩa là nhìn; không diễn tả việc nói rõ ràng.`,correct:!1},{text:`speak`,correct:!0,explanation:`Đúng rồi! 'speak' là hành động chúng mình đang nhắc tới.`},{text:`watch`,explanation:`Sai. Watch nghĩa là xem, không phải nói; speak mới kết hợp với clearly trong stem.`,correct:!1}]},{q:`Em có ___ đàn piano không? Chọn từ tiếng Anh đúng.`,a:[{text:`go`,explanation:`Sai. Go nghĩa là đi, không kết hợp với the piano.`,correct:!1},{text:`come`,explanation:`Sai. Come nghĩa là đến; chơi nhạc cụ dùng cụm play the piano.`,correct:!1},{text:`play`,correct:!0,explanation:`Đúng rồi! Em rất thông minh khi nhận ra từ còn thiếu.`},{text:`want`,explanation:`Sai. Want nghĩa là muốn, không chỉ hành động chơi đàn.`,correct:!1}]},{q:`Chúng em ___ sách cùng nhau. Chọn từ tiếng Anh đúng.`,a:[{text:`draw`,explanation:`Sai. Draw nghĩa là vẽ; sách được đọc bằng read.`,correct:!1},{text:`swim`,explanation:`Đáp án này không phải là hành động được mô tả trong câu.`,correct:!1},{text:`read`,correct:!0,explanation:`Đúng rồi! Em rất thông minh khi nhận ra từ còn thiếu.`},{text:`climb`,explanation:`Sai. Climb nghĩa là leo; không đi với tân ngữ books.`,correct:!1}]},{q:`Làm ơn ___ lại đây; cô cần em giúp. Chọn từ tiếng Anh đúng.`,a:[{text:`come`,correct:!0,explanation:`Giỏi quá! Em đã chọn đúng động từ 'come' rồi.`},{text:`go`,explanation:`Sai. Go nghĩa là đi; câu mệnh lệnh yêu cầu người nghe đến đây, dùng come.`,correct:!1},{text:`sit`,explanation:`Sai. Sit nghĩa là ngồi, không mang nghĩa di chuyển về phía người nói.`,correct:!1},{text:`stand`,explanation:`Sai. Stand nghĩa là đứng; stem yêu cầu đến đây để giúp người nói.`,correct:!1}]},{q:`Chúng em ___ nước cam. Chọn từ tiếng Anh đúng.`,a:[{text:`close`,explanation:`Sai. Close nghĩa là đóng; không diễn tả hành động uống orange juice.`,correct:!1},{text:`go`,explanation:`Sai. Go nghĩa là đi, không thể hiện việc uống nước cam.`,correct:!1},{text:`drink`,correct:!0,explanation:`Chính xác! Em đã hiểu rõ ý nghĩa của hành động này.`},{text:`open`,explanation:`Hành động này không đúng với ngữ cảnh của câu rồi.`,correct:!1}]},{q:`Chúng em ___ bữa tối cùng nhau trong bếp. Chọn từ tiếng Anh đúng.`,a:[{text:`look`,explanation:`Sai. Look nghĩa là nhìn; bữa tối là đồ ăn nên hành động phù hợp là eat.`,correct:!1},{text:`eat`,correct:!0,explanation:`Giỏi quá! Em đã chọn đúng động từ 'eat' rồi.`},{text:`listen`,explanation:`Sai. Listen nghĩa là nghe; không diễn tả việc ăn dinner.`,correct:!1},{text:`draw`,explanation:`Sai. Draw nghĩa là vẽ; không phù hợp với tân ngữ dinner.`,correct:!1}]},{q:`Họ ___ cửa sổ để đón không khí trong lành. Chọn từ tiếng Anh đúng.`,a:[{text:`run`,explanation:`Sai. Run không liên quan đến việc mở cửa để đón không khí; open mới đúng.`,correct:!1},{text:`jump`,explanation:`Sai. Jump nghĩa là nhảy, không làm cho cửa mở.`,correct:!1},{text:`open`,correct:!0,explanation:`Đúng rồi! Em rất thông minh khi nhận ra từ còn thiếu.`},{text:`close`,explanation:`Sai. Close là đóng cửa, ngược với mục đích để fresh air vào.`,correct:!1}]},{q:`Họ ___ vào bản đồ. Chọn từ tiếng Anh đúng.`,a:[{text:`eat`,explanation:`Sai. Eat nghĩa là ăn, không đi với at the map.`,correct:!1},{text:`sleep`,explanation:`Sai. Sleep nghĩa là ngủ; nhìn bản đồ dùng look at the map.`,correct:!1},{text:`look`,correct:!0,explanation:`Chuẩn xác! Em trả lời rất tốt và đúng ngữ pháp.`},{text:`drink`,explanation:`Sai. Drink nghĩa là uống, không diễn tả việc nhìn bản đồ.`,correct:!1}]},{q:`Em ___ một chiếc túi to. Chọn từ tiếng Anh đúng.`,a:[{text:`sing`,explanation:`Sai. Sing nghĩa là hát; câu cần động từ sở hữu have với a big bag.`,correct:!1},{text:`jump`,explanation:`Sai. Jump nghĩa là nhảy, không thể hiện việc có một chiếc túi.`,correct:!1},{text:`run`,explanation:`Sai. Run nghĩa là chạy; không đi  là hành động được mô tả trong câu.`,correct:!1}]},{q:`___ em có thích bánh pizza không? Chọn từ tiếng Anh đúng.`,a:[{text:`Is`,explanation:`'Is' là động từ be; câu hỏi với động từ thường 'like' cần trợ động từ 'do'.`,correct:!1},{text:`Does`,explanation:`Chủ ngữ 'you' đi với 'do'; 'does' dùng cho he, she hoặc it.`,correct:!1},{text:`Are`,explanation:`'Are' là be; hỏi 'you like' với động từ thường phải dùng 'do'.`,correct:!1},{text:`Do`,correct:!0,explanation:`Chuẩn luôn! Em nắm rất chắc nghĩa của các động từ thông dụng.`}]},{q:`Làm ơn ___ cô. Chọn từ tiếng Anh đúng.`,a:[{text:`color`,explanation:`'Color' là tô màu; câu yêu cầu hành động hướng âm thanh đến người nghe là 'listen'.`,correct:!1},{text:`listen`,correct:!0,explanation:`Tuyệt vời! Đây chính là hành động đúng trong câu này.`},{text:`climb`,explanation:`'Climb' là trèo; câu 'Please ___ to me' cần 'listen to me'.`,correct:!1},{text:`draw`,explanation:`'Draw' là vẽ; 'listen to me' mới diễn tả nghe người nói.`,correct:!1}]},{q:`Em ___ sách trong thư viện. Chọn từ tiếng Anh đúng.`,a:[{text:`run`,explanation:`Cố gắng lên em nhé, hãy đọc kỹ câu để chọn hành động phù hợp.`,correct:!1},{text:`read`,correct:!0,explanation:`Giỏi quá! Em đã chọn đúng động từ 'read' rồi.`},{text:`drink`,explanation:`Chú ý nghĩa của các động từ để không bị nhầm lẫn em nha.`,correct:!1},{text:`eat`,explanation:`Đáp án này không phải là hành động được mô tả trong câu.`,correct:!1}]},{q:`Họ ___ cô giáo. Chọn từ tiếng Anh đúng.`,a:[{text:`write`,explanation:`Đáp án này không phải là hành động được mô tả trong câu.`,correct:!1},{text:`read`,explanation:`Em xem lại nghĩa của từ để chọn cho đúng nhé.`,correct:!1},{text:`help`,correct:!0,explanation:`Chính xác! Động từ này rất phù hợp với ngữ cảnh câu.`},{text:`dance`,explanation:`Chú ý nghĩa của các động từ để không bị nhầm lẫn em nha.`,correct:!1}]},{q:`Ban đêm họ ___ trong phòng ngủ. Chọn từ tiếng Anh đúng.`,a:[{text:`eat`,explanation:`'Eat' là ăn; sau khi lên giường vào ban đêm họ 'sleep'.`
