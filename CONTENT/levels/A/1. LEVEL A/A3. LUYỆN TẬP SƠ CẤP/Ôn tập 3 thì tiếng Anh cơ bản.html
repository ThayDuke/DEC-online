const fullQuestionBank=[{q:`Mỗi ngày em ăn một quả táo. Trong câu 'I ___ an apple every day', chọn từ đúng. 🍎`,a:[{text:`eat`,correct:!0,explanation:`Chủ ngữ 'I' đi với động từ nguyên mẫu 'eat'.`},{text:`eats`,explanation:`Sai. Động từ 'eats' chia ở số ít, không phù hợp với chủ ngữ trong câu.`,correct:!1},{text:`eating`,explanation:`Sai. Động từ thêm đuôi -ing (eating) không thể đứng một mình làm động từ chính.`,correct:!1},{text:`ate`,explanation:`Sai. Dấu hiệu hoặc ngữ cảnh của câu yêu cầu thì Hiện tại đơn, không dùng thì Quá khứ (ate).`,correct:!1}]},{q:`Bạn ấy đi học bằng xe buýt. Trong câu 'She ___ to school by bus', chọn từ đúng. 🚌`,a:[{text:`goes`,correct:!0,explanation:`Chủ ngữ 'She' (ngôi 3 số ít) động từ thêm 'es'.`},{text:`go`,explanation:`Sai. Chủ ngữ yêu cầu động từ phải chia (thêm s/es), không để nguyên thể 'go'.`,correct:!1},{text:`going`,explanation:`Sai. Động từ thêm đuôi -ing (going) không thể đứng một mình làm động từ chính.`,correct:!1},{text:`gone`,explanation:`Sai. Dấu hiệu hoặc ngữ cảnh của câu yêu cầu thì Hiện tại đơn, không dùng thì Quá khứ (gone).`,correct:!1}]},{q:`Chúng em thích xem phim hoạt hình. Trong câu 'We ___ cartoon movies', chọn từ đúng. 📺`,a:[{text:`like`,correct:!0,explanation:`Chủ ngữ 'We' (số nhiều) động từ giữ nguyên.`},{text:`likes`,explanation:`Sai. Động từ 'likes' chia ở số ít, không phù hợp với chủ ngữ trong câu.`,correct:!1},{text:`liking`,explanation:`Sai. Động từ thêm đuôi -ing (liking) không thể đứng một mình làm động từ chính.`,correct:!1},{text:`to like`,explanation:`Sai. Cần động từ chính chia theo chủ ngữ, không dùng dạng nguyên thể có 'to' (to V).`,correct:!1}]},{q:`Con mèo của em thường thích cá. Trong câu 'My cat usually ___ fish', chọn từ đúng. 🐟`,a:[{text:`likes`,correct:!0,explanation:`'My cat' là chủ ngữ ngôi thứ ba số ít; ở hiện tại đơn, động từ thường thêm s/es.`},{text:`like`,explanation:`Sai. Chủ ngữ yêu cầu động từ phải chia (thêm s/es), không để nguyên thể 'like'.`,correct:!1},{text:`is liking`,explanation:`Sai. Động từ thêm đuôi -ing (is liking) không thể đứng một mình làm động từ chính.`,correct:!1},{text:`liked`,explanation:`Sai. Dấu hiệu hoặc ngữ cảnh của câu yêu cầu thì Hiện tại đơn, không dùng thì Quá khứ (liked).`,correct:!1}]},{q:`Chủ nhật họ chơi bóng đá. Trong câu 'They ___ football on Sundays', chọn từ đúng. ⚽`,a:[{text:`play`,correct:!0,explanation:`Chủ ngữ 'They' (số nhiều) động từ giữ nguyên.`},{text:`plays`,explanation:`Sai. Động từ 'plays' chia ở số ít, không phù hợp với chủ ngữ trong câu.`,correct:!1},{text:`playing`,explanation:`Sai. Động từ thêm đuôi -ing (playing) không thể đứng một mình làm động từ chính.`,correct:!1},{text:`played`,explanation:`Sai. Dấu hiệu hoặc ngữ cảnh của câu yêu cầu thì Hiện tại đơn, không dùng thì Quá khứ (played).`,correct:!1}]},{q:`Mỗi sáng bạn ấy đánh răng. Trong câu 'He ___ his teeth every morning', chọn từ đúng. 🪥`,a:[{text:`brushes`,correct:!0,explanation:`Động từ 'brush' đi với ngôi 3 số ít thêm 'es'.`},{text:`brush`,explanation:`Sai. Chủ ngữ yêu cầu động từ phải chia (thêm s/es), không để nguyên thể 'brush'.`,correct:!1},{text:`brushs`,explanation:`Sai. Động từ tận cùng bằng -sh khi chia số ít phải thêm -es (brushes).`,correct:!1},{text:`brushing`,explanation:`Sai. Động từ thêm đuôi -ing (brushing) không thể đứng một mình làm động từ chính.`,correct:!1}]},{q:`Mặt trời mọc ở phía Đông. Trong câu 'The sun ___ in the East', chọn từ đúng. ☀️`,a:[{text:`rises`,correct:!0,explanation:`Sự thật hiển nhiên, 'The sun' là số ít.`},{text:`rise`,explanation:`Sai. Chủ ngữ yêu cầu động từ phải chia (thêm s/es), không để nguyên thể 'rise'.`,correct:!1},{text:`rising`,explanation:`Sai. Động từ thêm đuôi -ing (rising) không thể đứng một mình làm động từ chính.`,correct:!1},{text:`rose`,explanation:`Sai. Dấu hiệu hoặc ngữ cảnh của câu yêu cầu thì Hiện tại đơn, không dùng thì Quá khứ (rose).`,correct:!1}]},{q:`Mẹ em nấu ăn rất ngon. Trong câu 'My mom ___ very well', chọn từ đúng. 🍳`,a:[{text:`cooks`,correct:!0,explanation:`'My mom' là ngôi 3 số ít.`},{text:`cook`,explanation:`Sai. Chủ ngữ yêu cầu động từ phải chia (thêm s/es), không để nguyên thể 'cook'.`,correct:!1},{text:`cooking`,explanation:`Sai. Động từ thêm đuôi -ing (cooking) không thể đứng một mình làm động từ chính.`,correct:!1},{text:`cooker`,explanation:`Sai. 'cooker' là danh từ (nồi cơm/bếp), không phải động từ.`,correct:!1}]},{q:`Chim thường bay trên trời. Trong câu 'Birds usually ___ in the sky', chọn từ đúng. 🕊️`,a:[{text:`fly`,correct:!0,explanation:`'Birds' là số nhiều, động từ giữ nguyên.`},{text:`flies`,explanation:`Sai. Động từ 'flies' chia ở số ít, không phù hợp với chủ ngữ trong câu.`,correct:!1},{text:`flying`,explanation:`Sai. Động từ thêm đuôi -ing (flying) không thể đứng một mình làm động từ chính.`,correct:!1},{text:`flew`,explanation:`Sai. Dấu hiệu hoặc ngữ cảnh của câu yêu cầu thì Hiện tại đơn, không dùng thì Quá khứ (flew).`,correct:!1}]},{q:`Bây giờ trông bạn rất vui. Trong câu 'You ___ very happy right now', chọn từ đúng. 😊`,a:[{text:`look`,correct:!0,explanation:`Chủ ngữ 'You' đi với động từ nguyên mẫu.`},{text:`looks`,explanation:`Sai. Động từ 'looks' chia ở số ít, không phù hợp với chủ ngữ trong câu.`,correct:!1},{text:`looking`,explanation:`Sai. Động từ thêm đuôi -ing (looking) không thể đứng một mình làm động từ chính.`,correct:!1},{text:`looked`,explanation:`Sai. Dấu hiệu hoặc ngữ cảnh của câu yêu cầu thì Hiện tại đơn, không dùng thì Quá khứ (looked).`,correct:!1}]},{q:`Bạn có thích kem không? Trong câu hỏi '___ you like ice cream', chọn từ đúng. 🍦`,a:[{text:`Do`,correct:!0,explanation:`Câu hỏi với 'You' dùng trợ động từ 'Do'.`},{text:`Does`,explanation:`Sai. Động từ 'Does' chia ở số ít, không phù hợp với chủ ngữ trong câu.`,correct:!1},{text:`Are`,explanation:`Sai. Đây là câu hỏi với động từ thường 'like', nên dùng trợ động từ 'Do', không dùng 'Are'.`,correct:!1},{text:`Is`,explanation:`Sai. Động từ 'Is' chia ở số ít, không phù hợp với chủ ngữ trong câu.`,correct:!1}]},{q:`Bạn ấy có chơi piano không? Trong câu hỏi '___ she play the piano', chọn từ đúng. 🎹`,a:[{text:`Does`,correct:!0,explanation:`Câu hỏi với 'She' dùng trợ động từ 'Does'.`},{text:`Do`,explanation:`Sai. Với chủ ngữ 'she', câu hỏi hiện tại đơn dùng 'Does', không dùng 'Do'.`,correct:!1},{text:`Is`,explanation:`Sai. Động từ 'Is' chia ở số ít, không phù hợp với chủ ngữ trong câu.`,correct:!1},{text:`Are`,explanation:`Sai. Chủ ngữ yêu cầu động từ phải chia (thêm s/es), không để nguyên thể 'Are'.`,correct:!1}]},{q:`Em không thích nhện. Trong câu 'I ___ not like spiders', chọn từ đúng. 🕷️`,a:[{text:`do`,correct:!0,explanation:`Phủ định với 'I' dùng 'do not'.`},{text:`does`,explanation:`Sai. Động từ 'does' chia ở số ít, không phù hợp với chủ ngữ trong câu.`,correct:!1},{text:`am`,explanation:`Sai. Câu phủ định hiện tại đơn với 'I' dùng 'do not', không dùng 'am not'.`,correct:!1},{text:`have`,explanation:`Sai. 'Have' không phải trợ động từ phù hợp trong cấu trúc phủ định này; cần dùng 'do'.`,correct:!1}]},{q:`Ban đêm bạn ấy không xem tivi. Trong câu 'He ___ not watch TV at night', chọn từ đúng. 📺`,a:[{text:`does`,correct:!0,explanation:`Phủ định với 'He' dùng 'does not'.`},{text:`do`,explanation:`Sai. Chủ ngữ yêu cầu động từ phải chia (thêm s/es), không để nguyên thể 'do'.`,correct:!1},{text:`is`,explanation:`Sai. Với động từ thường 'watch', câu phủ định hiện tại đơn dùng 'does', không dùng 'is'.`,correct:!1},{text:`has`,explanation:`Sai. 'Has' không phải trợ động từ cho cấu trúc phủ định với 'watch'; cần dùng 'does'.`,correct:!1}]},{q:`Bố em có một chiếc ô tô. Trong câu 'My dad ___ a car', chọn từ đúng. 🚗`,a:[{text:`has`,correct:!0,explanation:`'My dad' là số ít, dùng 'has'.`},{text:`have`,explanation:`Sai. 'have' là động từ/trợ động từ dùng cho số nhiều hoặc I/you, không đúng với cấu trúc và ngữ cảnh đang xét.`,correct:!1},{text:`having`,explanation:`Sai. Từ vựng hoặc dạng từ 'having' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`haves`,explanation:`Sai. Phương án 'haves' b
