tn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class=btn id=next-btn type=button>Tiếp tục<i class="fa-solid fa-arrow-right"></i></button><button class="btn is-initially-hidden" id=submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=confirm-back-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class="btn is-initially-hidden" id=confirm-submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=reset-btn type=button>Làm lại</button></div></div><footer class=dec-footer>Bản quyền thuộc về DEC - thầy Đức tiếng Anh - 0966939583</footer></div><script>// --- DUKEGEM QUESTION BANK
const fullQuestionBank=[{q:`Đây là con vật gì? Nó kêu 'Meow meow'.`,a:[{text:`a cat`,correct:!0,explanation:`Chính xác! Con mèo kêu 'Meow meow' đó em.`},{text:`a dog`,explanation:`Sai rồi, con chó kêu 'Woof woof' cơ mà.`,correct:!1},{text:`a bird`,explanation:`Con chim thường hót líu lo, không kêu 'Meow' đâu nhé.`,correct:!1},{text:`a duck`,explanation:`Con vịt kêu 'Quack quack' em nha.`,correct:!1}]},{q:`Câu nào đúng về con chó?`,a:[{text:`The dog is barking.`,correct:!0,explanation:`Đúng rồi! 'Barking' là sủa, tiếng kêu của con chó.`},{text:`The dog is meowing.`,explanation:`Con chó không kêu 'meow' đâu, đó là tiếng của con mèo.`,correct:!1},{text:`The dog are barking.`,explanation:`'The dog' là số ít nên phải đi với 'is' em nhé.`,correct:!1},{text:`The dog barking.`,explanation:`Câu này bị thiếu động từ to-be 'is' rồi nè.`,correct:!1}]},{q:`Câu tiếng Anh 'The elephant is small.' nghĩa là 'Con voi nhỏ'. Câu này chưa đúng vì voi rất to. Chọn phần cần sửa.`,a:[{text:`small -> big`,correct:!0,explanation:`Giỏi quá! Con voi rất to lớn (big) chứ không hề nhỏ bé.`},{text:`is -> are`,explanation:`Con voi là số ít nên dùng 'is' là đúng rồi, không sửa nhé.`,correct:!1},{text:`elephant -> elephants`,explanation:`Có một con voi nên để số ít là chuẩn rồi.`,correct:!1},{text:`The -> A`,explanation:`Dùng 'The' ở đầu câu là hoàn toàn chính xác.`,correct:!1}]},{q:`Chim đang ___ trên trời. Chọn từ tiếng Anh đúng.`,a:[{text:`flying`,correct:!0,explanation:`Đúng! Loài chim có đôi cánh để bay (flying) trên trời.`},{text:`swimming`,explanation:`Chim thường bay trên trời, còn bơi lội là việc của cá.`,correct:!1},{text:`climbing`,explanation:`Chim hiếm khi leo trèo, chúng thường bay lượn hơn.`,correct:!1},{text:`running`,explanation:`Chim có thể chạy nhưng hành động 'bay' trên trời là đặc trưng nhất.`,correct:!1}]},{q:`Con thỏ đang đứng ___ bãi cỏ, không ở bên trong cỏ. Chọn từ tiếng Anh đúng.`,a:[{text:`on`,correct:!0,explanation:`Con thỏ đứng trên cỏ, không ở bên trong cỏ, nên dùng 'on'.`},{text:`in`,explanation:`'In' nghĩa là ở bên trong cỏ; câu nói con thỏ đứng trên cỏ, không ở bên trong.`,correct:!1},{text:`under`,explanation:`'Under' nghĩa là ở dưới cỏ; câu nói con thỏ đứng trên cỏ.`,correct:!1},{text:`at`,explanation:`'At' chỉ một địa điểm chung; không dùng cho vị trí ở trên cỏ.`,correct:!1}]},{q:`Câu nào diễn đạt sở thích chung đối với loài khỉ?`,a:[{text:`I like monkeys.`,correct:!0,explanation:`Sở thích chung đối với loài khỉ dùng danh từ số nhiều 'monkeys'.`},{text:`I like monkey.`,explanation:`Danh từ đếm được chỉ loài vật nói chung cần dạng số nhiều 'monkeys'.`,correct:!1},{text:`I likes monkeys.`,explanation:`Chủ ngữ 'I' đi với động từ nguyên mẫu 'like', không thêm 's'.`,correct:!1},{text:`I like a monkey.`,explanation:`'A monkey' chỉ một cá thể; stem hỏi sở thích chung đối với cả loài.`,correct:!1}]},{q:`Cá có thể đi trên cạn không?`,a:[{text:`No, it can't.`,correct:!0,explanation:`Theo ngữ cảnh câu hỏi, cá không đi trên cạn; đáp án đúng là 'No, it can't'.`},{text:`Yes, it can.`,explanation:`Theo ngữ cảnh câu hỏi, cá không đi trên cạn; không chọn 'Yes, it can'.`,correct:!1},{text:`Yes, it is.`,explanation:`Câu trả lời về khả năng dùng 'can/can't', không dùng 'is'.`,correct:!1},{text:`No, it isn't.`,explanation:`Câu hỏi về khả năng dùng 'can't', không dùng 'isn't'.`,correct:!1}]},{q:`Con ___ cho chúng ta sữa. Chọn từ tiếng Anh đúng.`,a:[{text:`cow`,correct:!0,explanation:`Tuyệt vời! Con bò cho chúng ta sữa tươi mỗi ngày.`},{text:`pig`,explanation:`Con lợn thường cho thịt chứ không cho sữa để mình uống đâu.`,correct:!1},{text:`chicken`,explanation:`Con gà cho chúng ta trứng em nhé.`,correct:!1},{text:`duck`,explanation:`Con vịt cũng cho trứng, còn sữa là từ con bò.`,correct:!1}]},{q:`Câu nào đúng về sư tử?`,a:[{text:`The lion is the king of the jungle.`,correct:!0,explanation:`Đúng! Sư tử được mệnh danh là chúa tể rừng xanh.`},{text:`The lion is small and cute.`,explanation:`Sư tử rất to lớn và dũng mãnh, không phải kiểu nhỏ bé đáng yêu đâu.`,correct:!1},{text:`The lion like carrots.`,explanation:`Sư tử ăn thịt, còn cà rốt là món yêu thích của thỏ.`,correct:!1},{text:`The lion are strong.`,explanation:`Sư tử là số ít nên em phải dùng 'is'.`,correct:!1}]},{q:`Câu tiếng Anh 'The giraffe has a short neck.' nghĩa là 'Hươu cao cổ có cổ ngắn'. Chọn phần cần sửa để câu đúng.`,a:[{text:`short -> long`,correct:!0,explanation:`Chính xác! Con hươu cao cổ nổi tiếng với chiếc cổ rất dài (long).`},{text:`has -> have`,explanation:`'The giraffe' là số ít nên 'has' đã đúng; không đổi thành 'have'.`,correct:!1},{text:`neck -> necks`,explanation:`Mỗi con hươu cao cổ chỉ có một cái cổ nên để số ít là đúng.`,correct:!1},{text:`The -> An`,explanation:`Dùng 'The' để chỉ vào con hươu cao cổ là đúng rồi.`,correct:!1}]},{q:`Con khỉ đang ___ một quả chuối. Chọn từ tiếng Anh đúng.`,a:[{text:`eating`,correct:!0,explanation:`Đúng! Con khỉ đang ăn chuối, món khoái khẩu của nó.`},{text:`drinking`,explanation:`Chuối là thức ăn nên mình dùng 'eating' chứ không phải 'drinking'.`,correct:!1},{text:`playing`,explanation:`Nó đang cho vào miệng thì là 'đang ăn' em nhé.`,correct:!1},{text:`singing`,explanation:`Khỉ biết kêu nhưng không biết hát như con người đâu.`,correct:!1}]},{q:`Gà mái đang ___ một quả trứng. Chọn từ tiếng Anh đúng.`,a:[{text:`laying`,correct:!0,explanation:`Giỏi quá! Con gà mái đang đẻ trứng (laying an egg).`},{text:`eating`,explanation:`Nội dung câu hỏi về quả trứng thì 'đẻ trứng' là hợp lý nhất.`,correct:!1},{text:`flying`,explanation:`Gà mái thường ở trong chuồng đẻ trứng, không bay lượn lúc này.`,correct:!1},{text:`sleeping`,explanation:`Nó đang bận đẻ trứng mà, không ngủ đâu.`,correct:!1}]},{q:`Chọn câu tiếng Anh có nghĩa là: 'Con vịt đang bơi trong hồ'.`,a:[{text:`The duck is swimming in the pond.`,correct:!0,explanation:`Chuẩn! 'Duck' là con vịt và 'swimming' là đang bơi.`},{text:`The duck is running in the pond.`,explanation:`Vịt ở dưới nước thì chúng bơi chứ không chạy đâu em.`,correct:!1},{text:`The duck are swimming in the pond.`,explanation:`Con vịt số ít nên dùng 'is' em nha.`,correct:!1},{text:`The duck swimming in the pond.`,explanation:`Thiếu to-be 'is' làm câu không hoàn chỉnh nè.`,correct:!1}]},{q:`Con rắn không có ___. Chọn từ tiếng Anh đúng.`,a:[{text:`legs`,correct:!0,explanation:`Đúng! Loài rắn bò bằng thân mình và không có chân (legs).`},{text:`eyes`,explanation:`Rắn vẫn có mắt để nhìn đấy em ạ.`,correct:!1},{text:`a tail`,explanation:`Thân rắn dài và kết thúc bằng một cái đuôi.`,correct:!1},{text:`a mouth`,explanation:`Rắn dùng miệng để ăn mồi, nên chúng có miệng chứ.`,correct:!1}]},{q:`Chọn mạo từ tiếng Anh đúng: ___ beautiful parrot.`,a:[{text:`a`,correct:!0,explanation:`Chính xác! 'Beautiful' bắt đầu bằng phụ âm 'b' nên dùng 'a'.`},{text:`an`,explanation:`Từ ngay sau mạo từ là 'beautiful' (phụ âm), em dùng 'a' nhé.`,correct:!1},{text:`some`,explanation:`Chỉ có một con vẹt thôi nên dùng 'a' là đúng nhất.`,correct:!1},{text:`many`,explanation:`Từ 'parrot' đang ở số ít, không dùng 'many' được.`,correct:!1}]},{q:`Câu nào đúng về ngựa vằn?`,a:[{text:`The zebra has black and white stripes.`,correct:!0,explanation:`Đúng! Ngựa vằn có những sọc đen và trắng đặc trưng.`},{text:`The zebra has red and blue stripes.`,explanation:`Ngựa vằn chỉ có sọc đen trắng thôi, không có màu xanh đỏ đâu.`,correct:!1},{text:`The zebra is all green.`,explanation:`Làm gì có con ngựa nào màu xanh lá cây toàn thân đâu em.`,correct:!1},{text:`The zebra are fast.`,explanation:`Ngựa vằn số ít nên phải dùng 'is'.`,correct:!1}]},{q:`Câu tiếng Anh 'The cat are sleeping on the sofa.' nghĩa là 'Con mèo đang ngủ trên ghế sofa'. Chọn phần sai cần sửa.`,a:[{text:`are -> is`,correct:!0,explanation:`Chính xác! 'The cat' là số ít nên phải dùng 'is'.`},{text:`sleeping -> sleep`,explanation:`Đang ngủ thì phải dùng 'sleeping' sau to-be chứ.`,correct:!1},{text:`on -> in`,explanation:`Nằm trên ghế sofa dùng 'on' là đúng rồi.`,correct:!1},{text:`sofa -> table`,explanation:`Nó ngủ ở đâu cũng được, nhưng lỗi ngữ pháp 'are' là quan trọng nhất.`,correct:!1}]},{q:`Có ___ con kiến (ant) trên bông hoa. Chọn mạo từ tiếng Anh đúng.`,a:[{text:`an`,correct:!0,explanation:`Đúng! 'Ant' bắt đầu bằng nguyên âm 'a' nên dùng 'an'.`},{text:`a`,explanation:`Em nhớ nhé, 'ant' bắt đầu bằng nguyên âm nên phải đi với 'an'.`,correct:!1},{text:`some`,explanation:`Chỉ có một con kiến thôi, dùng 'an' là chuẩn nhất.`,correct:!1},{text:`any`,explanation:`'Any' thường dùng trong câu hỏi hoặc phủ định; câu khẳng định giới thiệu một con kiến cần mạo từ 'an'.`,correct:!1}]},{q:`Đó là ___ con cú (owl). Chọn mạo từ tiếng Anh đúng.`,a:[{text:`an`,correct:!0,explanation:`Tuyệt vời! 'Owl' bắt đầu bằng nguyên âm 'o' nên mình dùng 'an'.`},{text:`a`,explanation:`Con cú bắt đầu bằng nguyên âm, em dùng 'an' nhé.`,correct:!1},{text:`the`,explanation:`Khi mới chỉ vào một con vật lần đầu, dùng 'an' là tự nhiên nhất.`,correct:!1},{text:`many`,explanation:`Câu này đang nói về một con thôi, không dùng 'many' được.`,correct:!1}]},{q:`Dịch sang tiếng Anh: 'Con cừu có bộ lông dày.'`,a:[{text:`This sheep has thick fur.`,correct:!0,explanation:`'This sheep' chỉ một con cừu; 'has thick fur' nghĩa là có bộ lông dày.`},{text:`This sheep have thick fur.`,explanation:`'This sheep' là số ít nên dùng 'has', không dùng 'have'.`,correct:!1},{text:`This sheep is thick fur.`,explanation:`Con cừu 'có' bộ lông, nên dùng 'has', không dùng 'is'.`,correct:!1},{text:`This sheep has thick feathers.`,explanation:`'Feathers' là lông vũ của chim; lông cừu dùng 'fur' hoặc 'wool'.`,correct:!1}]},{q:`Chỉ vào một con bướm cụ thể: ___ con bướm rất nhiều màu. Chọn mạo từ tiếng Anh đúng.`,a:[{text:`The`,correct:!0,explanation:`Đúng! Dùng 'The' để chỉ vào con bướm đang nhắc tới.`},{text:`An`,explanation:`'Butterfly' bắt đầu bằng phụ âm 'b' nên không dùng 'an' ở đây.`,correct:!1},{text:`Any`,explanation:`Để mô tả vẻ đẹp của con bướm, dùng 'The' hoặc 'A' sẽ hợp lý hơn.`,correct:!1},{text:`Many`,explanation:`Chỉ có một con (is colorful) nên không chọn 'many'.`,correct:!1}]},{q:`Con ếch có thể nhảy rất ___ để chạm tới những chiếc lá. Chọn từ tiếng Anh đúng.`,a:[{text:`high`,correct:!0,explanation:`Chuẩn! Con ếch có đôi chân sau khỏe nên nhảy rất cao (high).`},{text:`low`,explanation:`Ếch nổi tiếng với khả năng nhảy cao chứ không phải nhảy thấp.`,correct:!1},{text:`slow`,explanation:`Hành động nhảy thường gắn liền với sự nhanh nhẹn.`,correct:!1},{text:`big`,explanation:`Nhảy thì phải đi với độ cao (high) chứ không đi với kích thước.`,correct:!1}]},{q:`Câu nào đúng về con dê?`,a:[{text:`The goat eats grass.`,correct:!0,explanation:`Đúng! Dê là loài động vật ăn cỏ (grass).`},{text:`The goat eats fish.`,explanation:`Dê không ăn cá đâu, nó chỉ ăn thực vật thôi.`,correct:!1},{text:`The goat eat grass.`,explanation:`'The goat' là số ít nên động từ 'eat' phải thêm 's'.`,correct:!1},{text:`The goat are white.`,explanation:`Goat số ít em dùng 'is' nhé.`,correct:!1}]},{q:`Tìm lỗi sai: 'He has two pet cat.'`,a:[{text:`cat -> cats`,correct:!0,explanation:`Giỏi! Sau số lượng 'two' (hai) thì danh từ 'cat' phải ở số nhiều.`},{text:`has -> have`,explanation:`'He' số ít đi với 'has' là đúng rồi.`,correct:!1},{text:`pet -> pets`,explanation:`Từ 'pet' ở đây bổ nghĩa cho 'cat', không cần thêm 's'.`,correct:!1},{text:`He -> I`,explanation:`Chủ ngữ không sai, lỗi nằm ở danh từ số nhiều.`,correct:!1}]},{q:`Con sóc đang ___ lên cây. Chọn từ tiếng Anh đúng.`,a:[{text:`climbing`,correct:!0,explanation:`Đúng! Con sóc rất giỏi leo trèo (climbing) trên cây.`},{text:`flying`,explanation:`Sóc không có cánh để bay đâu em.`,correct:!1},{text:`swimming`,explanation:`Sóc sống trên cạn và trên cây, không bơi dưới nước.`,correct:!1},{text:`singing`,explanation:`Nó đang vận động leo trèo, dùng 'climbing' là đúng nhất.`,correct:!1}]},{q:`Con vật nào sống dưới nước? Một con ___ sống dưới nước. Chọn từ tiếng Anh đúng.`,a:[{text:`fish`,correct:!0,explanation:`Chính xác! Cá sống và thở dưới nước.`},{text:`cat`,explanation:`Mèo sống trên cạn và chúng thường rất sợ nước.`,correct:!1},{text:`bird`,explanation:`Chim sống trên cây và bay trên trời.`,correct:!1},{text:`rabbit`,explanation:`Thỏ sống trong hang trên mặt đất.`,correct:!1}]},{q:`Câu nào là: 'Con rùa bò rất chậm'?`,a:[{text:`The turtle crawls very slowly.`,correct:!0,explanation:`Đúng! Rùa nổi tiếng với việc di chuyển chậm chạp (slowly).`},{text:`The turtle runs very fast.`,explanation:`Rùa không thể chạy nhanh được đâu em.`,correct:!1},{text:`The turtle are slow.`,explanation:`Rùa số ít, em dùng 'is' nhé.`,correct:!1},{text:`The turtle slowly.`,explanation:`Câu này thiếu động từ mô tả hành động rồi.`,correct:!1}]},{q:`Con ong có các sọc màu ___ và vàng. Chọn từ tiếng Anh đúng.`,a:[{text:`black`,correct:!0,explanation:`Đúng! Con ong có những sọc màu đen và vàng.`},{text:`red`,explanation:`Màu đặc trưng của ong là đen và vàng, không phải đỏ.`,correct:!1},{text:`blue`,explanation:`Ong không có sọc xanh dương đâu em.`,correct:!1},{text:`green`,explanation:`Đen và vàng mới là màu của bạn ong chăm chỉ.`,correct:!1}]},{q:`Em nhìn thấy ___ con voi to (big elephant) ở sở thú. Chọn mạo từ tiếng Anh đúng.`,a:[{text:`a`,correct:!0,explanation:`Tuyệt! 'Big' bắt đầu bằng phụ âm nên dùng 'a'.`},{text:`an`,explanation:`Mặc dù là 'elephant', nhưng từ ngay sau mạo từ là 'big' nên dùng 'a'.`,correct:!1},{text:`many`,explanation:`Từ 'elephant' là số ít, dùng 'a' là chuẩn nhất.`,correct:!1},{text:`any`,explanation:`Câu khẳng định dùng 'a' để nói về một con voi.`,correct:!1}]},{q:`Câu nào đúng về hamster?`,a:[{text:`The hamster is small and fluffy.`,correct:!0,explanation:`Đúng! Hamster là loài chuột nhỏ và có lông mềm mại.`},{text:`The hamster is very big.`,explanation:`Hamster là thú cưng nhỏ bé, không hề to lớn đâu.`,correct:!1},{text:`The hamster can fly.`,explanation:`Hamster không có cánh, nó chỉ chạy trong vòng quay thôi.`,correct:!1},{text:`The hamster are cute.`,explanation:`Hamster số ít em hãy dùng 'is' nhé.`,correct:!1}]},{q:`Câu tiếng Anh 'Horses can runs very f
