const fullQuestionBank=[{q:`Tìm lỗi sai trong câu: "I have a apple."`,a:[{text:`a -> an`,correct:!0,explanation:`Chính xác! "Apple" bắt đầu bằng nguyên âm "a" nên phải dùng "an" em nhé.`},{text:`have -> has`,explanation:`Chủ ngữ "I" đi với "have" là đúng rồi.`,correct:!1},{text:`apple -> apples`,explanation:`Nếu đổi thành "apples" thì mình không được dùng "a" nữa.`,correct:!1},{text:`I -> Me`,explanation:`Chủ ngữ ở đầu câu phải là "I" mới đúng ngữ pháp.`,correct:!1}]},{q:`Tìm lỗi sai: "She is an teacher."`,a:[{text:`an -> a`,correct:!0,explanation:`Giỏi quá! "Teacher" bắt đầu bằng phụ âm "t", nên mình dùng "a" thôi nè.`},{text:`is -> are`,explanation:`"She" là số ít nên đi với "is" là chuẩn rồi.`,correct:!1},{text:`teacher -> teachers`,explanation:`Một người thì dùng "teacher" số ít thôi em.`,correct:!1},{text:`She -> Her`,explanation:`Đầu câu dùng đại từ làm chủ ngữ "She" là đúng nhất.`,correct:!1}]},{q:`Sửa lỗi mạo từ: "My name is the Lan."`,a:[{text:`bỏ "the"`,correct:!0,explanation:`Đúng! Tên riêng của người không bao giờ đi kèm mạo từ "the".`},{text:`thêm "a"`,explanation:`Không ai gọi là "a Lan" đâu em nhé.`,correct:!1},{text:`thêm "an"`,explanation:`Tên người không đi với "an" nè.`,correct:!1},{text:`giữ nguyên`,explanation:`Dùng mạo từ trước tên riêng là sai ngữ pháp rồi.`,correct:!1}]},{q:`Tìm lỗi: "Sun is yellow today."`,a:[{text:`thêm "The" vào đầu`,correct:!0,explanation:`Chính xác! Những thứ duy nhất như Mặt Trời luôn cần có "The" ở trước.`},{text:`thêm "A" vào đầu`,explanation:`Chỉ có một Mặt Trời thôi nên dùng "The" mới đúng ngữ pháp.`,correct:!1},{text:`thêm "An" vào đầu`,explanation:`Mặt trời bắt đầu bằng phụ âm, không thể dùng "An".`,correct:!1},{text:`giữ nguyên`,explanation:`Thiếu mạo từ xác định làm câu chưa hoàn chỉnh đâu em.`,correct:!1}]},{q:`Sửa lỗi sai (chỉ sửa mạo từ, giữ danh từ số nhiều): "I see a dogs."`,a:[{text:`a -> some`,correct:!0,explanation:`"Dogs" là số nhiều; trong câu này sửa mạo từ thành "some" để giữ nghĩa một nhóm chó.`},{text:`dogs -> doggie`,explanation:`Theo chỉ dẫn chỉ sửa mạo từ và giữ nguyên "dogs" số nhiều, thay "a" bằng "some" để câu đúng.`,correct:!1},{text:`see -> sees`,explanation:`I đi với "see" nguyên mẫu là đúng rồi.`,correct:!1},{text:`a -> an`,explanation:`Số nhiều không bao giờ dùng mạo từ "an" đâu nè.`,correct:!1}]},{q:`Sửa lỗi: "We live in the Hanoi."`,a:[{text:`bỏ "the"`,correct:!0,explanation:`Chắc chắn rồi! Tên các thành phố thường không dùng mạo từ đứng trước.`},{text:`thêm "a"`,explanation:`Hà Nội là tên riêng thành phố, không dùng "a" em nhé.`,correct:!1},{text:`vẫn đúng`,explanation:`Dùng "the" ở đây là không tự nhiên đâu.`,correct:!1},{text:`thêm "an"`,explanation:`Hanoi bắt đầu bằng phụ âm, dùng "an" là sai rồi.`,correct:!1}]},{q:`Tìm lỗi sai: "He is from the Vietnam."`,a:[{text:`bỏ "the"`,correct:!0,explanation:`Đúng! Tên hầu hết các quốc gia (như Vietnam) không dùng "the".`},{text:`from -> in`,explanation:`"From" là giới từ đúng để chỉ nơi mình đến.`,correct:!1},{text:`is -> are`,explanation:`He là số ít nên đi với "is" là chuẩn.`,correct:!1},{text:`bỏ "from"`,explanation:`Vẫn cần giới từ "from" để chỉ nguồn gốc em nhé.`,correct:!1}]},{q:`Sửa lỗi mạo từ: "As a sport, I play the football every day."`,a:[{text:`bỏ "the"`,correct:!0,explanation:`Tuyệt vời! Chơi các môn thể thao thì không cần mạo từ "the" ở giữa.`},{text:`thêm "a"`,explanation:`Không ai nói "play a football" khi tập thể dục em nhé.`,correct:!1},{text:`thêm "an"`,explanation:`Thể thao không đi với "an" đâu nè.`,correct:!1},{text:`giữ nguyên`,explanation:`Bỏ mạo từ đi câu sẽ đúng và hay hơn rất nhiều.`,correct:!1}]},{q:`Lỗi sai ở đâu: "I am at the home now."`,a:[{text:`bỏ "the"`,correct:!0,explanation:`Chuẩn! Cụm từ "at home" (ở nhà) là cụm cố định, không có "the".`},{text:`at -> in`,explanation:`"At home" là cách nói tự nhiên nhất khi ở nhà mình.`,correct:!1},{text:`home -> house`,explanation:`"Home" ở đây là mái ấm gia đình, không cần thay bằng "house".`,correct:!1},{text:`now -> today`,explanation:`Trạng từ "now" là đúng rồi em nhé.`,correct:!1}]},{q:`Tìm lỗi: "My dad is a engineer."`,a:[{text:`a -> an`,correct:!0,explanation:`Chính xác! "Engineer" bắt đầu bằng nguyên âm E nên phải dùng "an".`},{text:`is -> are`,explanation:`Dad là số ít nên dùng "is" là chuẩn.`,correct:!1},{text:`engineer -> enginer`,explanation:`Spelling của engineer là đúng rồi, đừng sửa nhé.`,correct:!1},{text:`dad -> father`,explanation:`Đổi từ này không sửa lỗi mạo từ trước 'engineer'.`,correct:!1}]},{q:`Sửa lỗi: "I study the English at school."`,a:[{text:`bỏ "the"`,correct:!0,explanation:`Đúng rồi! Các môn học và ngôn ngữ không có mạo từ đứng trước.`},{text:`at -> on`,explanation:`Địa điểm trường học dùng "at school" là chuẩn rồi.`,correct:!1},{text:`school -> the school`,explanation:`Không thêm "the" vào trước school trong cụm từ đi học này nhé.`,correct:!1},{text:`thêm "an"`,explanation:`Ngôn ngữ thì tuyệt đối không mạo từ nha em.`,correct:!1}]},{q:`Câu nào đúng khi nói tôi ăn một quả trứng bất kỳ vào bữa sáng?`,a:[{text:`I eat an egg for breakfast.`,correct:!0,explanation:`Chính xác! "Egg" bắt đầu bằng nguyên âm nên dùng "an" là chuẩn.`},{text:`I eat a egg for breakfast.`,explanation:`Egg là nguyên âm, không dùng "a" được em ơi.`,correct:!1},{text:`I eat the egg for breakfast.`,explanation:`Sai. "The egg" cần một quả trứng đã xác định; đề nói một quả bất kỳ nên dùng "an egg".`,correct:!1},{text:`I eat egg for breakfast.`,explanation:`Sai. Đề chỉ một quả trứng đếm được số ít; cần mạo từ "an".`,correct:!1}]},{q:`Tìm lỗi sai: "Go to the bed, children!"`,a:[{text:`bỏ "the"`,correct:!0,explanation:`Giỏi lắm! Cụm từ "go to bed" (đi ngủ) không dùng mạo từ "the".`},{text:`to -> at`,explanation:`Sau "go" dùng giới từ "to" là đúng rồi.`,correct:!1},{text:`children -> childs`,explanation:`Children là số nhiều của child, đúng rồi em nhé.`,correct:!1},{text:`bed -> beds`,explanation:`Đi ngủ nói chung mình dùng bed số ít thôi nè.`,correct:!1}]},{q:`Sửa lỗi (chỉ sửa mạo từ, giữ danh từ số nhiều): "A birds can fly."`,a:[{text:`bỏ "a"`,correct:!0,explanation:`Chính xác! Theo chỉ dẫn giữ nguyên "birds" số nhiều, bỏ mạo từ số ít "a".`},{text:`birds -> birdes`,explanation:`"Birdes" sai chính tả; dạng số nhiều đúng là "birds".`,correct:!1},{text:`can -> cans`,explanation:`Can là trợ động từ, không bao giờ thêm "s".`,correct:!1},{text:`fly -> flying`,explanation:`Sau "can" là động từ nguyên mẫu, dùng "fly" là chuẩn.`,correct:!1}]},{q:`Lỗi sai ở mạo từ (mô tả cơ thể nói chung): "I have the two hands."`,a:[{text:`bỏ "the"`,correct:!0,explanation:`Tuyệt! Khi mô tả cơ thể với số lượng, mình không cần dùng "the".`},{text:`two -> one`,explanation:`Chúng mình có 2 bàn tay là đúng rồi em.`,correct:!1},{text:`hands -> hand`,explanation:`Vẫn nên để số nhiều vì có tới 2 bàn tay nè.`,correct:!1},{text:`giữ "the"`,explanation:`Dùng "the" ở đây nghe sẽ không tự nhiên đâu em.`,correct:!1}]},{q:`Tìm lỗi (bữa ăn thường lệ): "He has a breakfast at 7."`,a:[{text:`bỏ "a"`,correct:!0,explanation:`Chuẩn luôn! Các bữa ăn chính không đi kèm mạo từ "a".`},{text:`has -> have`,explanation:`Chủ ngữ số ít "He" đi với "has" là đúng rồi.`,correct:!1},{text:`at -> for`,explanation:`At 7 là cụm chỉ thời gian chính xác em nhé.`,correct:!1},{text:`breakfast -> breakfasts`,explanation:`Bữa sáng không thêm "s" ở đây nha.`,correct:!1}]},{q:`Sửa lỗi: "She wears an uniform."`,a:[{text:`an -> a`,correct:!0,explanation:`Giỏi! Mặc dù bắt đầu bằng U nhưng "uniform" phát âm là /j/, dùng "a".`},{text:`wears -> wear`,explanation:`She là số ít nên động từ thêm "s" là đúng.`,correct:!1},{text:`uniform -> uniforms`,explanation:`Một bộ đồng phục dùng số ít là chuẩn rồi.`,correct:!1},{text:`She -> They`,explanation:`Đổi chủ ngữ không sửa được lỗi mạo từ trước từ "uniform"; từ này bắt đầu bằng âm /j/ nên dùng "a".`,correct:!1}]},{q:`Tìm lỗi sai: "Look at a moon!"`,a:[{text:`a -> the`,correct:!0,explanation:`Chính xác! Mặt trăng là vật duy nhất cả hai đều thấy nên dùng "the".`},{text:`at -> in`,explanation:`Không thể dùng "in moon" được em nhé.`,correct:!1},{text:`moon -> sun`,explanation:`Sửa từ mặt trăng sang mặt trời thì vẫn sai mạo từ.`,correct:!1},{text:`look -> looking`,explanation:`Câu mệnh lệnh giữ nguyên "look" là chuẩn.`,correct:!1}]},{q:`Sửa lỗi: "I see a cat. A cat is black."`,a:[{text:`vế sau dùng "The"`,correct:!0,explanation:`Đúng rồi! Khi nhắc lại con mèo đã biết ở vế trước, vế sau dùng "The".`},{text:`vế đầu dùng "The"`,explanation:`Vế đầu mới kể nên dùng "a" là chính xác.`,correct:!1},{text:`bỏ "a" cả hai vế`,explanation:`Thiếu mạo từ cả hai câu sẽ không hay.`,correct:!1},{text:`giữ nguyên`,explanation:`Nhớ quy tắc: lặp lại vật cũ thì dùng "The" nhé.`,correct:!1}]},{q:`Câu nào viết đúng mạo từ?`,a:[{text:`This is an orange.`,correct:!0,explanation:`Chuẩn luôn! "Orange" bắt đầu bằng nguyên âm O nên dùng "an".`},{text:`This is a orange.`,explanation:`O là nguyên âm, không được đi với "a" đâu.`,correct:!1},{text:`This is the orange.`,explanation:`Mới giới thiệu quả cam bất kỳ, dùng "an" là chuẩn nhất.`,correct:!1},{text:`This is orange.`,explanation:`Đừng quên mạo từ trước danh từ số ít em nha.`,correct:!1}]},{q:`Sửa lỗi mạo từ: "I like the Japan."`,a:[{text:`bỏ "the"`,correct:!0,explanation:`Chính xác! Tên nước Nhật không đi kèm mạo từ "the".`},{text:`Japan -> Japanese`,explanation:`Nói về đất nước thì giữ nguyên tên nước Nhật Bản.`,correct:!1},{text:`like -> likes`,explanation:`Chủ ngữ "I" không thêm "s" vào động từ nhé.`,correct:!1},{text:`thêm "a"`,explanation:`Không ai nói "một nước Nhật" trong ngữ cảnh này.`,correct:!1}]},{q:`Tìm lỗi: "She speaks the French very well."`,a:[{text:`bỏ "the"`,correct:!0,explanation:`Giỏi! Trước ngôn ngữ (French) không dùng mạo từ "the".`},{text:`speaks -> speak`,explanation:`She số ít thêm "s" vào động từ là chính xác.`,correct:!1},{text:`well -> good`,explanation:`Trạng từ "well" bổ nghĩa cho "speaks" là chuẩn rồi.`,correct:!1},{text:`French -> the France`,explanation:`France là tên nước, ở đây mình đang nói ngôn ngữ em
