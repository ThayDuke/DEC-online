const fullQuestionBank=[{q:`Địa chỉ của em là gì? — 81 đường Trần Hưng Đạo. Trong câu 'What is your ___?', chọn từ đúng. 🏠`,a:[{text:`address /əˈdres/`,correct:!0,explanation:`Câu hỏi về địa chỉ nhà.`},{text:`name /neɪm/`,explanation:`Sai. Đây là câu hỏi tên.`,correct:!1},{text:`class /klɑːs/`,explanation:`Sai. Đây là câu hỏi lớp học.`,correct:!1},{text:`school /skuːl/`,explanation:`Sai. Đây là câu hỏi trường học.`,correct:!1}]},{q:`Bạn ấy sống trong một tòa nhà cao ở thành phố. Trong câu 'She lives in a tall ___', chọn từ đúng. 🏢`,a:[{text:`tower /ˈtaʊə(r)/`,correct:!0,explanation:`'Tower' là tòa tháp/tòa nhà cao tầng.`},{text:`lane /leɪn/`,explanation:`Sai. 'Lane' là ngõ/hẻm nhỏ.`,correct:!1},{text:`village /ˈvɪlɪdʒ/`,explanation:`Sai. 'Village' nghĩa là làng; từ này không phù hợp với ngữ cảnh một tòa nhà cao.`,correct:!1},{text:`river /ˈrɪvə(r)/`,explanation:`Sai. 'River' là dòng sông.`,correct:!1}]},{q:`Căn hộ của bạn ấy ở tầng hai. Trong câu 'His flat is on the second ___', chọn từ đúng. 2️⃣`,a:[{text:`floor /flɔː(r)/`,correct:!0,explanation:`'Floor' nghĩa là tầng (lầu).`},{text:`road /rəʊd/`,explanation:`Sai. Phương án 'road /rəʊd/' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`street /striːt/`,explanation:`Sai. Phương án 'street /striːt/' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`city /ˈsɪti/`,explanation:`Sai. Phương án 'city /ˈsɪti/' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`Hà Nội là một thành phố lớn và nhộn nhịp. Trong câu 'Ha Noi is a big and busy ___', chọn từ đúng. 🏙️`,a:[{text:`city /ˈsɪti/`,correct:!0,explanation:`Ha Noi là một thành phố lớn.`},{text:`village /ˈvɪlɪdʒ/`,explanation:`Sai. Ha Noi không phải là làng.`,correct:!1},{text:`island /ˈaɪlənd/`,explanation:`Sai. Ha Noi không phải là đảo.`,correct:!1},{text:`mountain /ˈmaʊntən/`,explanation:`Sai. Ha Noi không phải là núi.`,correct:!1}]},{q:`Em thường đánh răng hai lần mỗi ngày. Trong câu 'I usually ___ my teeth twice a day', chọn từ đúng. 🦷`,a:[{text:`brush /brʌʃ/`,correct:!0,explanation:`'Brush teeth' là đánh răng.`},{text:`wash /wɒʃ/`,explanation:`Sai. Thường dùng 'wash face' (rửa mặt).`,correct:!1},{text:`do /duː/`,explanation:`Sai. Từ vựng hoặc dạng từ 'do /duː/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`play /pleɪ/`,explanation:`Sai. Từ vựng hoặc dạng từ 'play /pleɪ/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Bạn ấy thường tập thể dục vào buổi sáng. Trong câu 'He often does ___ exercise in the morning', chọn từ đúng. 🤸`,a:[{text:`morning /ˈmɔːnɪŋ/`,correct:!0,explanation:`Cụm từ 'morning exercise' là tập thể dục buổi sáng.`},{text:`dinner /ˈdɪnə(r)/`,explanation:`Sai. 'Dinner' là bữa tối.`,correct:!1},{text:`homework /ˈhəʊmwɜːk/`,explanation:`Sai. Phương án 'homework /ˈhəʊmwɜːk/' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`school /skuːl/`,explanation:`Sai. Từ vựng hoặc dạng từ 'school /skuːl/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Chị/em gái em thích nấu bữa tối cho gia đình. Trong câu 'My sister likes to ___ dinner for the family', chọn từ đúng. 🍳`,a:[{text:`cook /kʊk/`,correct:!0,explanation:`'Cook dinner' là nấu bữa tối.`},{text:`play /pleɪ/`,explanation:`Sai. Từ vựng hoặc dạng từ 'play /pleɪ/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`go /ɡəʊ/`,explanation:`Sai. Từ vựng hoặc dạng từ 'go /ɡəʊ/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`watch /wɒtʃ/`,explanation:`Sai. Từ vựng hoặc dạng từ 'watch /wɒtʃ/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Em đi thư viện bao lâu một lần? — Một lần mỗi tuần. Trong câu 'How ___ do you go to the library?', chọn từ đúng. 📚`,a:[{text:`often /ˈɒfn/`,correct:!0,explanation:`'How often' dùng để hỏi về tần suất.`},{text:`many /ˈmeni/`,explanation:`Sai. 'How many' hỏi số lượng.`,correct:!1},{text:`much /mʌtʃ/`,explanation:`Sai. 'How much' hỏi giá tiền/số lượng không đếm được.`,correct:!1},{text:`old /əʊld/`,explanation:`Sai. 'How old' hỏi tuổi.`,correct:!1}]},{q:`Tuần trước em đã đi tàu về quê. Trong câu 'I ___ to my hometown by train last week', chọn từ đúng. 🚂`,a:[{text:`went /went/`,correct:!0,explanation:`Đã đi (Quá khứ của 'go').`},{text:`go /ɡəʊ/`,explanation:`Sai. Dấu hiệu 'by train last week' không phù hợp với thì/cấu trúc của phương án 'go /ɡəʊ/'.`,correct:!1},{text:`goes /ɡəʊz/`,explanation:`Sai. Đây là thì hiện tại ngôi 3 số ít.`,correct:!1},{text:`going /ˈɡəʊɪŋ/`,explanation:`Sai cấu trúc. Phương án 'going /ˈɡəʊɪŋ/' sử dụng sai dạng thức động từ hoặc từ vựng.`,correct:!1}]},{q:`Chúng em đã thăm Hoàng thành ở Huế. Trong câu 'We visited the Imperial ___ in Hue', chọn từ đúng. 🏯`,a:[{text:`City /ˈsɪti/`,correct:!0,explanation:`'Imperial City' là Kinh thành (Huế).`},{text:`Town /taʊn/`,explanation:`Sai. Từ vựng hoặc dạng từ 'Town /taʊn/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Village /ˈvɪlɪdʒ/`,explanation:`Sai. Từ vựng hoặc dạng từ 'Village /ˈvɪlɪdʒ/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Island /ˈaɪlənd/`,explanation:`Sai. Từ vựng hoặc dạng từ 'Island /ˈaɪlənd/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Họ đã đến Phố cổ Hội An. Trong câu 'They went to Hoi An ___ Town', chọn từ đúng. 🏮`,a:[{text:`Ancient /ˈeɪnʃənt/`,correct:!0,explanation:`'Ancient Town' là Phố cổ.`},{text:`New /njuː/`,explanation:`Sai. Hoi An là phố cổ.`,correct:!1},{text:`Modern /ˈmɒdn/`,explanation:`Sai. Phương án 'Modern /ˈmɒdn/' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`Big /bɪɡ/`,explanation:`Sai. Từ vựng hoặc dạng từ 'Big /bɪɡ/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Em đã đi dự tiệc bằng xe máy à? Trong câu 'Did you go to the party ___ motorbike?', chọn từ đúng. 🛵`,a:[{text:`by /baɪ/`,correct:!0,explanation:`Dùng 'by' trước phương tiện giao thông.`},{text:`on /ɒn/`,explanation:`Sai. 'On' dùng cho 'on foot'.`,correct:!1},{text:`in /ɪn/`,explanation:`Sai. Từ vựng hoặc dạng từ 'in /ɪn/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`at /æt/`,explanation:`Sai. Từ vựng hoặc dạng từ 'at /æt/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Mùa hè năm ngoái em đã đi Hạ Long. Trong câu 'Last summer, I went to Ha Long ___', chọn từ đúng. ⛰️`,a:[{text:`Bay /beɪ/`,correct:!0,explanation:`Ha Long Bay: Vịnh Hạ Long.`},{text:`Sea /siː/`,explanation:`Sai. Từ vựng hoặc dạng từ 'Sea /siː/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`River /ˈrɪvə(r)/`,explanation:`Sai. Từ vựng hoặc dạng từ 'River /ˈrɪvə(r)/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`Lake /leɪk/`,explanation:`Sai. Từ vựng hoặc dạng từ 'Lake /leɪk/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Chúng em về quê để thăm ông bà. Trong câu 'We went back to our hometown to visit our ___', chọn từ đúng. 👴👵`,a:[{text:`grandparents /ˈɡrænpeərənts/`,correct:!0,explanation:`Ông bà. Đây là lựa chọn phù hợp với dữ kiện và cấu trúc được hỏi.`},{text:`teachers /ˈtiːtʃəz/`,explanation:`Sai. Phương án 'teachers /ˈtiːtʃəz/' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`doctors /ˈdɒktəz/`,explanation:`Sai. Phương án 'doctors /ˈdɒktəz/' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1},{text:`drivers /ˈdraɪvəz/`,explanation:`Sai. Phương án 'drivers /ˈdraɪvəz/' mang nghĩa không phù hợp với ngữ cảnh chung của câu.`,correct:!1}]},{q:`Em đã tham gia hội chợ nào? Trong câu 'Did you join the ___ fair?', chọn từ đúng. 🎡`,a:[{text:`fun /fʌn/`,correct:!0,explanation:`'Fun fair' là hội chợ vui chơi.`},{text:`sad /sæd/`,explanation:`Sai. Từ vựng hoặc dạng từ 'sad /sæd/' không phù hợp với cấu trúc ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`b
