const fullQuestionBank=[{q:`Ai là người dạy học ở trường?`,a:[{text:`Teacher`,correct:!0,explanation:`Chính xác! "Teacher" là thầy cô giáo truyền dạy kiến thức.`},{text:`Doctor`,explanation:`Bác sĩ "doctor" chữa bệnh cho chúng mình em nhé.`,correct:!1},{text:`Biker`,explanation:`Người đi xe đạp không phải nghề chính ở trường nè.`,correct:!1},{text:`Cook`,explanation:`Đầu bếp "cook" làm việc ở trong bếp cơ.`,correct:!1}]},{q:`Khi bị ốm, em đến gặp ai?`,a:[{text:`Doctor`,correct:!0,explanation:`Đúng rồi! Bác sĩ "doctor" sẽ giúp em khỏe lại.`},{text:`Pilot`,explanation:`Phi công "pilot" lái máy bay trên bầu trời em nhé.`,correct:!1},{text:`Singer`,explanation:`Ca sĩ "singer" hát những bài hát hay nè.`,correct:!1},{text:`Student`,explanation:`Học sinh "student" cũng đi học giống em thôi.`,correct:!1}]},{q:`"Nurse" nghĩa là gì?`,a:[{text:`Y tá`,correct:!0,explanation:`Giỏi lắm! "Nurse" là cô y tá hiền hậu hỗ trợ bác sĩ.`},{text:`Kỹ sư`,explanation:`Kỹ sư là "engineer" em nhé.`,correct:!1},{text:`Nông dân`,explanation:`Nông dân là "farmer" nè.`,correct:!1},{text:`Cảnh sát`,explanation:`Cảnh sát là "police officer" đó.`,correct:!1}]},{q:`Ai lái máy bay?`,a:[{text:`Pilot`,correct:!0,explanation:`Chính xác! Phi công "pilot" đưa chúng mình bay cao.`},{text:`Driver`,explanation:`Tài xế "driver" lái ô tô hoặc xe buýt em nhé.`,correct:!1},{text:`Worker`,explanation:`Công nhân "worker" làm việc ở nhà máy nè.`,correct:!1},{text:`Dancer`,explanation:`Vũ công "dancer" biểu diễn những điệu nhảy đẹp.`,correct:!1}]},{q:`Ai trồng lúa và rau củ ở cánh đồng?`,a:[{text:`Farmer`,correct:!0,explanation:`Chuẩn luôn! Nông dân "farmer" vất vả làm ra hạt gạo thơm.`},{text:`Artist`,explanation:`Họa sĩ "artist" vẽ những bức tranh xinh xắn em nha.`,correct:!1},{text:`Teacher`,explanation:`Thầy cô giáo dạy học ở lớp nè.`,correct:!1},{text:`Doctor`,explanation:`Bác sĩ làm việc ở bệnh viện rồi.`,correct:!1}]},{q:`Ai nấu những món ăn ngon ở nhà hàng?`,a:[{text:`Cook`,correct:!0,explanation:`Giỏi quá! Đầu bếp "cook" (hoặc chef) tạo ra những bữa ăn tuyệt vời.`},{text:`Pilot`,explanation:`Phi công không nấu ăn chuyên nghiệp đâu em.`,correct:!1},{text:`Nurse`,explanation:`Y tá chăm sóc bệnh nhân mà.`,correct:!1},{text:`Singer`,explanation:`Ca sĩ biểu diễn trên sân khấu em nhé.`,correct:!1}]},{q:`Dịch sang tiếng Anh: "Cảnh sát"`,a:[{text:`Police officer`,correct:!0,explanation:`Đúng rồi! "Police officer" giữ gìn trật tự và an toàn.`},{text:`Postman`,explanation:`Người đưa thư là "postman" em nhé.`,correct:!1},{text:`Painter`,explanation:`Họa sĩ là "painter" nè.`,correct:!1},{text:`Player`,explanation:`Người chơi thể thao là "player" đó.`,correct:!1}]},{q:`Ai vẽ những bức tranh đẹp rực rỡ?`,a:[{text:`Artist`,correct:!0,explanation:`Chính xác! Họa sĩ "artist" (hoặc painter) có tâm hồn nghệ thuật.`},{text:`Farmer`,explanation:`Bác nông dân trồng cây em nhé.`,correct:!1},{text:`Doctor`,explanation:`Bác sĩ chữa bệnh nè.`,correct:!1},{text:`Driver`,explanation:`Tài xế lái xe đường dài đó.`,correct:!1}]},{q:`Viết đúng từ "bác sĩ":`,a:[{text:`doctor`,correct:!0,explanation:`Đúng! "Doctor" có vần cuối là "or".`},{text:`docter`,explanation:`Dùng chữ "e" là sai rồi em.`,correct:!1},{text:`doctar`,explanation:`Dùng chữ "a" cũng không đúng đâu.`,correct:!1},{text:`doctur`,explanation:`Dùng chữ "u" hụt luôn rồi nhé.`,correct:!1}]},{q:`Người lái xe buýt gọi là gì?`,a:[{text:`Bus driver`,correct:!0,explanation:`Chuẩn luôn! "Bus driver" là bác tài lái xe buýt.`},{text:`Bus worker`,explanation:`Không gọi là công nhân xe buýt em nhé.`,correct:!1},{text:`Bus pilot`,explanation:`Xe buýt chạy dưới đất, không cần phi công "pilot" đâu.`,correct:!1},{text:`Bus teacher`,explanation:`Cũng không phải giáo viên dạy trên xe nè.`,correct:!1}]},{q:`Ai hát những bài hát hay trên TV?`,a:[{text:`Singer`,correct:!0,explanation:`Giỏi lắm! Ca sĩ "singer" có giọng hát tuyệt vời.`},{text:`Dancer`,explanation:`Vũ công "dancer" chỉ nhảy thôi em nhé.`,correct:!1},{text:`Baker`,explanation:`Thợ làm bánh là "baker" nè.`,correct:!1},{text:`Barber`,explanation:`Thợ cắt tóc là "barber" đó.`,correct:!1}]},{q:`Viết đúng tên "học sinh":`,a:[{text:`student`,correct:!0,explanation:`Đúng rồi! "Student" là cách viết chính xác.`},{text:`stundent`,explanation:`Dư một chữ "n" rồi em ơi.`,correct:!1},{text:`studeant`,explanation:`Sai chữ cái ở giữa rồi nè.`,correct:!1},{text:`studentt`,explanation:`Chỉ có một chữ "t" cuối cùng thôi em nha.`,correct:!1}]},{q:`Ai làm việc trong các xí nghiệp, nhà máy?`,a:[{text:`Worker`,correct:!0,explanation:`Chính xác! Công nhân "worker" làm ra nhiều sản phẩm hữu ích.`},{text:`Farmer`,explanation:`Nông dân làm việc trên cánh đồng em nhé.`,correct:!1},{text:`Pilot`,explanation:`Phi công trên bầu trời nè.`,correct:!1},{text:`Doctor`,explanation:`Bác sĩ trong bệnh viện rồi.`,correct:!1}]},{q:`Ai biểu diễn những điệu nhảy đẹp mắt?`,a:[{text:`Dancer`,correct:!0,explanation:`Đúng! Vũ công "dancer" có những bước chân uyển chuyển.`},{text:`Singer`,explanation:`Ca sĩ biểu diễn giọng hát em nhé.`,correct:!1},{text:`Cook`,explanation:`Đầu bếp bận rộn trong bếp nè.`,correct:!1},{text:`Driver`,explanation:`Tài xế tập trung lái xe trên đường.`,correct:!1}]},{q:`Dịch sang tiếng Anh: "Người đưa thư"`,a:[{text:`Postman`,correct:!0,explanation:`Chính xác! "Postman" mang những lá thư và bưu phẩm đến nhà em.`},{text:`Policeman`,explanation:`Cảnh sát là "policeman" em nhé.`,correct:!1},{text:`Milkman`,explanation:`Người giao sữa là "milkman" nè.`,correct:!1},{text:`Fireman`,explanation:`Lính cứu hỏa là "fireman" đó.`,correct:!1}]},{q:`Nói "Mẹ tôi là một y tá":`,a:[{text:`My mom is a nurse.`,correct:!0,explanation:`Giỏi quá! "Nurse" phụ âm dùng "a", và "is" cho số ít.`},{text:`My mom is an nurse.`,explanation:`Nurse bắt đầu bằng N, không dùng "an" em nhé.`,correct:!1},{text:`My mom are a nurse.`,explanation:`Chỉ có một mẹ, không dùng "are".`,correct:!1},{text:`My mom am a nurse.`,explanation:`"Am" hụt sang phe "I" mất rồi.`,correct:!1}]},{q:`Bác sĩ "doctor" làm việc ở đâu?`,a:[{text:`Hospital`,correct:!0,explanation:`Chính xác! "Hospital" (bệnh viện) là nơi bác sĩ làm việc.`},{text:`School`,explanation:`Trường học "school" dành cho giáo viên và học sinh.`,correct:!1},{text:`Farm`,explanation:`Trang trại "farm" dành cho nông dân nè.`,correct:!1},{text:`Park`,explanation:`Công viên "park" là nơi vui chơi giải trí.`,correct:!1}]},{q:`Ông Green lái máy bay. Ông ấy là một ___.`,a:[{text:`pilot`,correct:!0,explanation:`Đúng! Người lái máy bay là phi công "pilot".`},{text:`driver`,explanation:`Tài xế lái xe dưới đất em nhé.`,correct:!1},{text:`worker`,explanation:`Công nhân làm trong nhà máy nè.`,correct:!1},{text:`farmer`,explanation:`Bác nông dân làm trên ruộng đồng.`,correct:!1}]},{q:`Từ "giáo viên" viết là gì?`,a:[{text:`teacher`,correct:!0,explanation:`Chính xác! "Teacher" có chữ "a" ở giữa vần đầu.`},{text:`techer`,explanation:`Thiếu chữ "a" rồi em ơi.`,correct:!1},{text:`tetcher`,explanation:`Thừa chữ "t" hụt mất rồi.`,correct:!1},{text:`teachir`,explanation:`Dùng chữ "i" ở cuối là sai chính tả em nha.`,correct:!1}]},{q:`Chọn câu hỏi đúng về nghề nghiệp của bố:`,a:[{text:`What does your father do?`,correct:!0,explanation:`Chuẩn luôn! Cấu trúc đúng là "What does + chủ ngữ + do?".`},{text:`What is your father do?`,explanation:`Đã có động từ "do" thì không dùng "is" em nhé.`,correct:!1},{text:`What are your father do?`,explanation:`Bố là số ít, không dùng "are" nè.`,correct:!1},{text:`What your father do?`,explanation:`Thiếu trợ động từ "does" câu nghe rất hụt hẫng.`,correct:!1}]},{q:`Ai làm ra những chiếc bánh mì nóng hổi?`,a:[{text:`Baker`,correct:!0,explanation:`Giỏi! Thợ làm bánh "baker" mang lại bữa sáng ngon lành.`},{text:`Butcher`,explanation:`Người bán thịt là "butcher" em nhé.`,correct:!1},{text:`Barber`,explanation:`Thợ cắt tóc là "barber" nè.`,correct:!1},{text:`Builder`,explanation:`Thợ xây dựng là "builder" đó.`,correct:!1}]},{q:`Dịch sang tiếng Anh theo cách gọi trung tính hiện nay: "Lính cứu hỏa"`,a:[{text:`Firefighter`,correct:!0,explanation:`Chính xác! Cả "Firefighter" và "Fireman" đều chỉ người lính cứu hỏa dũng cảm.`},{text:`Fire house`,explanation:`Fire house là trạm cứu hỏa, không phải người lính cứu hỏa.`,correct:!1},{text:`Fire station`,explanation:`Fire station là trạm cứu hỏa, không phải người lính cứu hỏa.`,correct:!1},{text:`Fisherman`,explanation:`Ngư dân mới là "fisherman" hụt rồi.`,correct:!1}]},{q:`Khi bị đau răng, em đến gặp ai?`,a:[{text:`Dentist`,correct:!0,explanation:`Đúng! Nha sĩ "dentist" là bác sĩ chuyên về răng miệng.`},{text:`Doctor`,explanation:`Bác sĩ đa khoa chăm sóc sức khỏe chung em nhé.`,correct:!1},{text:`Nurse`,explanation:`Y tá hỗ trợ bác sĩ nè.`,correct:!1},{text:`Farmer`,explanation:`Bác nông dân không chữa răng được đâu.`,correct:!1}]},{q:`Một ca sĩ ___.`,a:[{text:`sings songs`,correct:!0,explanation:`Giỏi! Ca sĩ thì hát những bài hát hay.`},{text:`paints pictures`,explanation:`Vẽ tranh là họa sĩ em nhé.`,correct:!1},{text:`drivers cars`,explanation:`Lái xe là tài xế nè.`,correct:!1},{text:`teaches students`,explanation:`Dạy học là thầy cô giáo rồi.`,correct:!1}]},{q:`Từ nào đúng cho nghĩa "họa sĩ"?`,a:[{text:`artist`,correct:!0,explanation:`Chính xác! "Artist" là cách viết đúng nhất.`},{text:`artistt`,explanation:`Dư một chữ "t" cuối cùng rồi em.`,correct:!1},{text:`autist`,explanation:`Sai chữ cái ở giữa hụt hẫng luôn.`,correct:!1},{text:`artest`,explanation:`Dùng chữ "e" thay vì "i" là sai rồi nè.`,correct:!1}]},{q:`Ronaldo và Messi làm nghề gì?`,a:[{text:`Soccer players`,correct:!0,explanation:`Đúng rồi! Họ là những cầu thủ bóng đá "soccer players" (hoặc football players) nổi tiếng.`},{text:`Singers`,explanation:`Họ không phải ca sĩ chuyên nghiệp đâu.`,correct:!1},{text:`Dancers`,explanation:`Họ nhảy trên sân cỏ chứ không phải vũ công sân khấu nè.`,correct:!1},{text:`Doctors`,explanation:`Đó không phải nghề bác sĩ em nha.`,correct:!1}]},{q:`Ước mơ của em là trở thành bác sĩ: "I want to be a ___."`,a:[{text:`doctor`,correct:!0,explanation:`Chín
