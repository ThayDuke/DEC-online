const fullQuestionBank=[{q:`Tôi có ___ cây bút. ___ cây bút màu xanh.`,a:[{text:`a / The`,correct:!0,explanation:`Chính xác! Lần đầu dùng "a", lần sau nhắc lại vật đó dùng "The".`},{text:`an / The`,explanation:`"Pen" bắt đầu bằng phụ âm, không dùng "an" em nhé.`,correct:!1},{text:`the / A`,explanation:`Vế đầu chưa xác định nên dùng "a", vế sau mới dùng "the".`,correct:!1},{text:`a / A`,explanation:`Nhớ quy tắc: kể lần đầu dùng "a/an", kể tiếp dùng "the".`,correct:!1}]},{q:`Hãy nhìn ___ cái bảng trước mặt chúng ta. Nó màu xanh lá.`,a:[{text:`the`,correct:!0,explanation:`Đúng rồi! Cụm "in front of us" chỉ rõ một cái bảng cụ thể, nên dùng "the".`},{text:`a`,explanation:`"A board" chỉ giới thiệu một cái bảng bất kỳ; câu đã chỉ rõ cái bảng trước mặt nên phải dùng "the".`,correct:!1},{text:`an`,explanation:`Board bắt đầu bằng phụ âm, và mình dùng "the" để xác định.`,correct:!1},{text:`(để trống)`,explanation:`Câu này cần mạo từ xác định vị trí của đồ vật em nhé.`,correct:!1}]},{q:`Bố tôi là ___ nghệ sĩ.`,a:[{text:`an`,correct:!0,explanation:`Giỏi lắm! "Artist" bắt đầu bằng nguyên âm "a" nên dùng "an".`},{text:`a`,explanation:`Nhớ nhé, nguyên âm u, e, o, a, i đi với "an".`,correct:!1},{text:`the`,explanation:`Khi giới thiệu nghề nghiệp lần đầu, dùng "an" là chuẩn nhất.`,correct:!1},{text:`(để trống)`,explanation:`Đừng quên mạo từ khi nói về nghề nghiệp số ít nha em.`,correct:!1}]},{q:`___ mặt trời hôm nay rất nóng.`,a:[{text:`The`,correct:!0,explanation:`Chính xác! Chỉ có một Mặt trời duy nhất nên phải có "The".`},{text:`A`,explanation:`Mặt trời là duy nhất, dùng "the" mới đúng ngữ pháp nè.`,correct:!1},{text:`An`,explanation:`Dù chỉ là một nhưng nó là duy nhất nên ưu tiên dùng "The".`,correct:!1},{text:`(để trống)`,explanation:`Quên "The" trước Mặt trời là một lỗi rất phổ biến đó, em nhớ nhé.`,correct:!1}]},{q:`Mẹ tôi đang ở trong ___ nhà bếp.`,a:[{text:`the`,correct:!0,explanation:`Đúng! Căn bếp trong nhà là nơi xác định với mọi người, dùng "the".`},{text:`a`,explanation:`Thường thì nhà chỉ có một cái bếp chính thôi, nên mình dùng "the".`,correct:!1},{text:`an`,explanation:`Kitchen bắt đầu bằng phụ âm, và mình dùng mạo từ xác định.`,correct:!1},{text:`(để trống)`,explanation:`Thiếu mạo từ sẽ làm câu nghe không tự nhiên em ạ.`,correct:!1}]},{q:`Nói về sở thích chung đối với loài chó, câu nào đúng ngữ pháp?`,a:[{text:`I like dogs.`,correct:!0,explanation:`Chính xác! Nói về sở thích chung số nhiều thì không dùng mạo từ.`},{text:`I like a dogs.`,explanation:`Dogs là số nhiều, không dùng "a" đứng trước.`,correct:!1},{text:`I like the dogs.`,explanation:`Nói chung chung thì bỏ "the" đi nghe sẽ hay hơn.`,correct:!1},{text:`I like an dogs.`,explanation:`Số nhiều không bao giờ đi với "an" em nhé.`,correct:!1}]},{q:`Tôi nhìn thấy ___ con voi ở sở thú.`,a:[{text:`an`,correct:!0,explanation:`Tuyệt vời! "Elephant" bắt đầu bằng nguyên âm nên dùng "an".`},{text:`a`,explanation:`Elephant bắt đầu bằng chữ E (nguyên âm), phải dùng "an" mới đúng.`,correct:!1},{text:`the`,explanation:`Khi mới bắt đầu nhìn thấy, dùng "an" để giới thiệu nhé.`,correct:!1},{text:`(để trống)`,explanation:`Đừng quên mạo từ trước tên con vật số ít em nha.`,correct:!1}]},{q:`Bây giờ hãy đi ___ ngủ nhé!`,a:[{text:`(để trống)`,correct:!0,explanation:`Đúng! Cụm từ "go to bed" (đi ngủ) là cụm cố định không dùng mạo từ.`},{text:`the`,explanation:`Trong tiếng Anh, "go to bed" có nghĩa là đi ngủ, bỏ mạo từ đi là đúng nhất.`,correct:!1},{text:`a`,explanation:`Chúng mình không gọi là "đi đến một cái giường" khi sắp ngủ đâu.`,correct:!1},{text:`an`,explanation:`Bed bắt đầu bằng phụ âm, và cụm này không cần mạo từ em nhé.`,correct:!1}]},{q:`Tìm lỗi trong câu tiếng Anh "She is from the Vietnam." (Cô ấy đến từ Việt Nam.)`,a:[{text:`the Vietnam -> Vietnam`,correct:!0,explanation:`Chính xác! Tên các quốc gia như Việt Nam thường không có "the".`},{text:`is -> are`,explanation:`She là ngôi thứ 3 số ít, dùng "is" là chuẩn rồi.`,correct:!1},{text:`from -> in`,explanation:`Đến từ đâu dùng "from" là đúng nhất em nhé.`,correct:!1},{text:`She -> They`,explanation:`Sửa chủ nghĩa không liên quan đến lỗi mạo từ đâu nè.`,correct:!1}]},{q:`Chúng tôi ăn ___ bữa trưa lúc 12 giờ.`,a:[{text:`(để trống)`,correct:!0,explanation:`Giỏi quá! Các bữa ăn như breakfast, lunch, dinner không cần mạo từ.`},{text:`a`,explanation:`Ai lại nói "a lunch" bao giờ, đúng không nè?`,correct:!1},{text:`an`,explanation:`Mạo từ không đi trước các bữa ăn đâu em.`,correct:!1},{text:`the`,explanation:`Bỏ mạo từ đi là cách nói tự nhiên nhất của người bản xứ.`,correct:!1}]},{q:`Tôi có thể mượn ___ cục tẩy không?`,a:[{text:`an`,correct:!0,explanation:`Đúng! "Eraser" bắt đầu bằng nguyên âm nên dùng "an".`},{text:`a`,explanation:`Mượn "một" cái bất kỳ, dùng "an" cho từ bắt đầu bằng nguyên âm nè.`,correct:!1},{text:`the`,explanation:`Dùng "an" nghe sẽ đúng ngữ pháp hơn trong trường hợp này.`,correct:!1},{text:`some`,explanation:`Eraser là số ít, không dùng "some" em nhé.`,correct:!1}]},{q:`Chọn câu tiếng Anh đúng khi giới thiệu một bạn tên Peter.`,a:[{text:`This is Peter.`,correct:!0,explanation:`Chính xác! Tên riêng của người tuyệt đối không dùng mạo từ.`},{text:`This is a Peter.`,explanation:`Đừng gọi bạn là "một Peter" em nhé.`,correct:!1},{text:`This is the Peter.`,explanation:`Tên người không đi với "the" đâu.`,correct:!1},{text:`This is an Peter.`,explanation:`Peter bắt đầu bằng phụ âm, và mình bỏ luôn mạo từ cho tên riêng.`,correct:!1}]},{q:`Hãy rửa tay trong ___ phòng tắm ở nhà!`,a:[{text:`the`,correct:!0,explanation:`Tuyệt! Tương tự như căn bếp, nhà tắm là nơi xác định nên dùng "the".`},{text:`a`,explanation:`Dùng "the bathroom" để chỉ phòng tắm trong nhà mình nè.`,correct:!1},{text:`an`,explanation:`Bathroom bắt đầu bằng phụ âm, dùng mạo từ xác định là chuẩn.`,correct:!1},{text:`(để trống)`,explanation:`Câu mệnh lệnh chỉ địa điểm trong nhà thường cần mạo từ "the".`,correct:!1}]},{q:`___ mặt trăng tối nay thật đẹp.`,a:[{text:`The`,correct:!0,explanation:`Đúng! Mặt trăng là duy nhất, em nhớ thêm "The" nhé.`},{text:`A`,explanation:`Trăng chỉ có một trái thôi, dùng "The" mới đúng.`,correct:!1},{text:`An`,explanation:`Dù đẹp đến đâu thì nó vẫn là duy nhất, nên dùng "The".`,correct:!1},{text:`(để trống)`,explanation:`Mặt trăng cần có "The" đứng trước để câu hoàn chỉnh.`,correct:!1}]},{q:`A: "Quyển sách của tôi đâu?" - B: "Nó ở dưới ___ cái bàn bên cạnh ghế sofa."`,a:[{text:`the`,correct:!0,explanation:`Chính xác! Cả hai bạn đều biết cái bàn nào, nên dùng "the".`},{text:`a`,explanation:`Cái bàn đó đã xác định rồi (cái bàn bạn đang ngồi chẳng hạn), dùng "the".`,correct:!1},{text:`an`,explanation:`Table bắt đầu bằng phụ âm, dùng mạo từ xác định là chuẩn.`,correct:!1},{text:`(để trống)`,explanation:`Thiếu mạo từ sẽ làm câu trả lời nghe cụt ngủn đó.`,correct:!1}]},{q:`Anh/em trai tôi chơi ___ bóng đá mỗi buổi chiều.`,a:[{text:`(để trống)`,correct:!0,explanation:`Đúng! Tên các môn thể thao tuyệt đối không dùng mạo từ.`},{text:`a`,explanation:`Chúng mình không đếm "một bóng đá" đúng không nè?`,correct:!1},{text:`an`,explanation:`Môn thể thao không đi với "an" em nha.`,correct:!1},{text:`the`,explanation:`Chơi thể thao thì để trống mạo từ nghe sẽ rất xịn đó.`,correct:!1}]},{q:`Nhìn ___ con chim chúng ta đã thấy hôm qua trên cây kìa!`,a:[{text:`the`,correct:!0,explanation:`Chính xác! Bạn đang chỉ cho người khác thấy một con chim cụ thể, dùng "the".`},{text:`a`,explanation:`Vì bạn đang chỉ đích danh con chim đó, dùng "the" sẽ hay hơn.`,correct:!1},{text:`an`,explanation:`Bird bắt đầu bằng phụ âm, dùng "an" là sai rồi.`,correct:!1},{text:`some`,explanation:`Đang nói về một con chim cụ thể đã thấy hôm qua nên không dùng "some".`,correct:!1}]},{q:`Tôi có thể nói ___ tiếng Anh.`,a:[{text:`(để trống)`,correct:!0,explanation:`Tuyệt vời! Trước tên các ngôn ngữ, chúng mình không dùng mạo từ.`},{text:`a`,explanation:`Không có ai gọi là "một tiếng Anh" đâu em.`,correct:!1},{text:`an`,explanation:`Dù bắt đầu bằng nguyên âm nhưng tên ngôn ngữ không dùng mạo từ.`,correct:!1},{te
