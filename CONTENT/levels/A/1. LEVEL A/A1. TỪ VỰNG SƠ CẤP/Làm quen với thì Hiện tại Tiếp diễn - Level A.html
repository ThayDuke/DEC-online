const fullQuestionBank=[{q:`Nhìn kìa! Em bé ___ trong nôi. Điền phần còn thiếu bằng tiếng Anh.`,a:[{text:`is sleeping`,correct:!0,explanation:`Chính xác! 'The baby' là số ít nên đi với 'is sleeping' để chỉ hành động đang diễn ra.`},{text:`are sleeping`,explanation:`Sai rồi, 'The baby' là số ít, em phải dùng 'is' nhé.`,correct:!1},{text:`sleeping`,explanation:`Thiếu mất động từ to-be 'is' rồi. Thì tiếp diễn luôn cần be + V-ing.`,correct:!1},{text:`sleeps`,explanation:`Đây là thì hiện tại đơn, nhưng 'Look!' báo hiệu hành động đang diễn ra ngay bây giờ.`,correct:!1}]},{q:`Chọn câu đúng.`,a:[{text:`Nam is playing football now.`,correct:!0,explanation:`Đúng! Cấu trúc S + is/am/are + V-ing + now rất chuẩn.`},{text:`Nam playing football now.`,explanation:`Câu này bị thiếu động từ to-be 'is' rồi em ơi.`,correct:!1},{text:`Nam are playing football now.`,explanation:`Nam là một người thôi, nên dùng 'is' thay vì 'are' nhé.`,correct:!1},{text:`Nam is play football now.`,explanation:`Thiếu đuôi '-ing' ở động từ 'play' rồi. Nhớ là 'is playing' mới đúng.`,correct:!1}]},{q:`Tìm lỗi sai trong câu tiếng Anh: 'They is reading books in the library.'`,a:[{text:`is reading -> are reading`,correct:!0,explanation:`Giỏi quá! 'They' là số nhiều nên phải đi với 'are'.`},{text:`is reading -> reading`,explanation:`Nếu bỏ 'is' mà không thêm 'are' thì vẫn thiếu to-be đấy.`,correct:!1},{text:`reading -> read`,explanation:`Không nên đổi sang 'read' vì câu này đang diễn tả hành động đang xảy ra.`,correct:!1},{text:`books -> book`,explanation:`Từ 'books' không sai, 'is reading' mới là chỗ cần sửa.`,correct:!1}]},{q:`Nghe này! Có ai đó ___ ở cửa. Điền phần còn thiếu bằng tiếng Anh.`,a:[{text:`is knocking`,correct:!0,explanation:`Đúng rồi! 'Someone' (ai đó) được tính là số ít, đi với 'is knocking'.`},{text:`are knocking`,explanation:`'Someone' đi với 'is' chứ không đi với 'are' đâu nhé.`,correct:!1},{text:`knocks`,explanation:`'Listen!' là dấu hiệu của hành động đang diễn ra, dùng hiện tại tiếp diễn tốt hơn.`,correct:!1},{text:`knocking`,explanation:`Em quên chưa thêm 'is' rồi. Cấu trúc đầy đủ là 'is knocking'.`,correct:!1}]},{q:`Mary đang nấu ăn trong bếp. Chọn phần còn thiếu để hoàn thành câu tiếng Anh: 'She ___ in the kitchen.'`,a:[{text:`is cooking`,correct:!0,explanation:`Hợp lý! Mary đang ở bếp nên cô ấy đang nấu ăn (is cooking).`},{text:`are cooking`,explanation:`'She' là số ít nên phải dùng 'is', không dùng 'are' em nha.`,correct:!1},{text:`cooks`,explanation:`Câu nói về hành động đang diễn ra nên dùng thì hiện tại tiếp diễn với động từ thêm đuôi -ing.`,correct:!1},{text:`is cook`,explanation:`Sau 'is' phải là 'cooking' mới đúng ngữ pháp thì tiếp diễn.`,correct:!1}]},{q:`Câu nào có nghĩa là: 'Nam đang chạy trong công viên'?`,a:[{text:`Nam is running in the park.`,correct:!0,explanation:`Chính xác! 'Running' (đang chạy) và 'is' cho chủ ngữ Nam.`},{text:`Nam is run in the park.`,explanation:`Thiếu đuôi '-ing' ở động từ chạy rồi.`,correct:!1},{text:`Nam are running in the park.`,explanation:`Nam là số ít, em dùng 'are' là sai mất rồi.`,correct:!1},{text:`Nam running in the park.`,explanation:`Câu này thiếu to-be 'is' để làm thành câu hoàn chỉnh.`,correct:!1}]},{q:`Em đang làm bài tập, vì vậy em ___ xem ti vi lúc này. Điền phần còn thiếu bằng tiếng Anh.`,a:[{text:`am not`,correct:!0,explanation:`Chuẩn! Phủ định của 'I am' là 'I am not'.`},{text:`is not`,explanation:`Chủ ngữ là 'I' thì phải đi với 'am', không đi với 'is'.`,correct:!1},{text:`are not`,explanation:`'I' luôn đi với 'am', 'are' chỉ dùng cho số nhiều thôi.`,correct:!1},{text:`not`,explanation:`Em cần cả to-be 'am' đứng trước 'not' nữa nhé.`,correct:!1}]},{q:`Chọn từ thích hợp để hoàn thành câu hỏi tiếng Anh: '___ the cats playing with the ball?'.`,a:[{text:`Are`,correct:!0,explanation:`Đúng! 'The cats' là số nhiều nên dùng 'Are' ở đầu câu hỏi.`},{text:`Is`,explanation:`Vì có nhiều con mèo (cats) nên mình phải dùng 'Are' mới đúng.`,correct:!1},{text:`Am`,explanation:`'Am' chỉ dùng cho 'I' thôi, không dùng cho 'the cats'.`,correct:!1},{text:`Do`,explanation:`Đây là thì tiếp diễn (V-ing) nên mình mượn to-be 'Are' làm câu hỏi.`,correct:!1}]},{q:`Đừng làm ồn! Ông của em ___. Điền phần còn thiếu bằng tiếng Anh.`,a:[{text:`is sleeping`,correct:!0,explanation:`Đúng! Lời nhắc 'Be quiet!' cho thấy ông đang ngủ ngay lúc này.`},{text:`are sleeping`,explanation:`Ông (grandfather) là một người thôi nên dùng 'is' em nhé.`,correct:!1},{text:`sleep`,explanation:`Dùng hiện tại tiếp diễn 'is sleeping' sẽ hay hơn trong tình huống này.`,correct:!1},{text:`sleeping`,explanation:`Thiếu to-be 'is' rồi, câu chưa hoàn chỉnh đâu.`,correct:!1}]},{q:`Câu nào đúng?`,a:[{text:`We are learning English at the moment.`,correct:!0,explanation:`Hoàn hảo! 'We' đi với 'are' và 'learning' có đuôi -ing đúng chuẩn.`},{text:`We is learning English at the moment.`,explanation:`'We' là chúng tôi (số nhiều), phải đi với 'are' mới đúng.`,correct:!1},{text:`We learning English at the moment.`,explanation:`Đừng quên chữ 'are' sau 'We' để tạo thành thì tiếp diễn nhé.`,correct:!1},{text:`We are learn English at the moment.`,explanation:`Động từ 'learn' phải thêm '-ing' mới diễn tả được hành động đang làm.`,correct:!1}]},{q:`Tìm lỗi sai trong câu tiếng Anh: 'Look! The students is swimming.'`,a:[{text:`is -> are`,correct:!0,explanation:`Chính xác! 'The students' là số nhiều nên phải sửa thành 'are'.`},{text:`swimming -> swim`,explanation:`Sau 'is/are' phải dùng 'swimming' để chỉ hành động đang diễn ra.`,correct:!1},{text:`is -> am`,explanation:`'Am' chỉ đi với 'I', còn đây là các học sinh cơ mà.`,correct:!1},{text:`Look -> Listen`,explanation:`Từ 'Look' dùng ở đây rất hợp lý, không cần thay đổi.`,correct:!1}]},{q:`Đừng làm ồn! Em ___ đài. Điền phần còn thiếu bằng tiếng Anh.`,a:[{text:`am listening`,correct:!0,explanation:`Đúng rồi! 'I' đi với 'am' và thêm '-ing' vào động từ listen.`},{text:`is listening`,explanation:`'I' không bao giờ đi với 'is', nhớ nhé: 'I am'.`,correct:!1},{text:`listen`,explanation:`Câu này cần dùng thì tiếp diễn vì có lời nhắc đừng làm ồn.`,correct:!1},{text:`listening`,explanation:`Em thiếu chữ 'am' mất rồi, thêm vào mới đúng cấu trúc.`,correct:!1}]},{q:`Em đang làm gì? Chọn phần còn thiếu để hoàn thành câu tiếng Anh: 'I ___ a letter.'`,a:[{text:`am writing`,correct:!0,explanation:`Tuyệt! 'I' đi với 'am' và 'writing' bỏ đuôi 'e' thêm 'ing'.`},{text:`is writing`,explanation:`Đừng nhầm lẫn nhé, 'I' thì phải đi với 'am' chứ.`,correct:!1},{text:`writing`,explanation:`Vẫn thiếu to-be 'am' nè, em bổ sung cho câu đúng nhé.`,correct:!1},{text:`write`,explanation:`Người ta đang hỏi 'What are you doing?' thì mình trả lời bằng -ing.`,correct:!1}]},{q:`Câu nào đúng với nghĩa: 'Mẹ tôi đang nấu bữa tối'?`,a:[{text:`My mother is cooking dinner.`,correct:!0,explanation:`Chuẩn! Mẹ là số ít nên dùng 'is cooking'.`},{text:`My mother are cooking dinner.`,explanation:`Mẹ là một người, không dùng 'are' được đâu.`,correct:!1},{text:`My mother cooking dinner.`,explanation:`Câu bị thiếu động từ to-be 'is' mất rồi.`,correct:!1},{text:`My mother is cook dinner.`,explanation:`'Cook' phải thêm '-ing' thì mới thành 'đang nấu' được.`,correct:!1}]},{q:`Trời quang và mặt đất khô, vì vậy lúc này trời ___ mưa. Điền phần còn thiếu bằng tiếng Anh.`,a:[{text:`is not`,correct:!0,explanation:`Đúng! Phủ định của 'It is' là 'It is not' hoặc 'It isn't'.`},{text:`are not`,explanation:`'It' là ngôi thứ 3 số ít, nên mình dùng 'is not' nhé.`,correct:!1},{text:`am not`,explanation:`'Am not' chỉ dùng cho 'I' thôi, không dùng cho 'It'.`,correct:!1},{text:`not`,explanation:`Thiếu 'is' rồi, 'not' không đứng một mình được trong câu này.`,correct:!1}]},{q:`Chọn từ thích hợp để hoàn thành câu hỏi tiếng Anh về anh/em trai: '___ your brother working now?'.`,a:[{text:`Is`,correct:!0,explanation:`Chính xác! 'Your brother' là một người (số ít) nên dùng 'Is'.`},{text:`Are`,explanation:`Anh/em trai của bạn là số ít, em nên chọn 'Is' mới đúng.`,correct:!1},{text:`Do`,explanation:`Câu có 'working' (V-ing) nên mình hỏi bằng to-be 'Is' nhé.`,correct:!1},{text:`Does`,explanation:`'Does' dùng cho hiện tại đơn, còn đây là thì tiếp diễn có 'now'.`,correct:!1}]},{q:`Nhìn kìa! Mặt trời ___. Điền phần còn thiếu bằng tiếng Anh.`,a:[{text:`is shining`,correct:!0,explanation:`Đúng! 'The sun' số ít và 'shining' bỏ 'e' thêm 'ing' rất chuẩn.`},{text:`are shining`,explanation:`Mặt trời chỉ có một, em dùng 'is' nhé.`,correct:!1},{text:`shining`,explanation:`Câu còn thiếu 'is' nè, em nhớ kiểm tra cấu trúc be + V-ing.`,correct:!1},{text:`shines`,explanation:`'Look!' báo hiệu sự việc đang diễn ra, dùng 'is shining' mới đúng.`,correct:!1}]},{q:`Câu nào đúng về các bạn nhỏ?`,a:[{text:`The children are playing hide and seek.`,correct:!0,explanation:`Đúng rồi! 'Children' là số nhiều của 'child' nên đi với 'are'.`},{text:`The children is playing hide and seek.`,explanation:`'Children' là danh từ số nhiều (những đứa trẻ) nên phải dùng 'are'.`,correct:!1},{text:`The children are play hide and seek.`,explanation:`Thiếu đuôi '-ing' ở từ 'play' rồi em ơi.`,correct:!1},{text:`The children playing hide and seek.`,explanation:`Với chủ ngữ số nhiều 'children', câu phải có 'are' trước 'playing'.`,correct:!1}]},{q:`Tìm lỗi sai trong câu tiếng Anh: 'I am runing in the park right now.'`,a:[{text:`runing -> running`,correct:!0,explanation:`Chính xác! Động từ 'run' khi thêm '-ing' phải gấp đôi chữ 'n'.`},{text:`am -> is`,explanation:`'I' đi với 'am' là đúng rồi, không cần sửa thành 'is'.`,correct:!1},{text:`runing -> runs`,explanation:`Có 'right now' nên mình vẫn giữ thì tiếp diễn nhưng phải viết đúng chính tả.`,correct:!1},{text:`in -> on`,explanation:`Dùng 'in the park' là hoàn toàn đúng ngữ pháp.`,correct:!1}]},{q:`Lúc này, các chị/em gái của em ___ búp bê. Điền phần còn thiếu bằng tiếng Anh.`,a:[{text:`are washing`,correct:!0,explanation:`Đúng! 'My sisters' (những người chị/em) là số nhiều nên dùng 'are washing'.`},{text:`is washing`,explanation:`Có nhiều người chị/em (sisters) mà, em dùng 'are' mới đúng.`
