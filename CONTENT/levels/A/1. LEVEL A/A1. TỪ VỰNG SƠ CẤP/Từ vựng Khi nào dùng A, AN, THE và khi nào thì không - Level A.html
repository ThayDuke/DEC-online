=controls><button class=btn id=prev-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class=btn id=next-btn type=button>Tiếp tục<i class="fa-solid fa-arrow-right"></i></button><button class="btn is-initially-hidden" id=submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=confirm-back-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class="btn is-initially-hidden" id=confirm-submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=reset-btn type=button>Làm lại</button></div></div><footer class=dec-footer>Bản quyền thuộc về DEC - thầy Đức tiếng Anh - 0966939583</footer></div><script>// --- DUKEGEM QUESTION BANK
const fullQuestionBank=[{q:`Em có một món đồ chơi hình con voi. Hoàn thành câu 'I have ___ elephant toy.'`,a:[{text:`an`,correct:!0,explanation:`Chính xác! "Elephant" bắt đầu bằng nguyên âm "e" nên dùng "an" nhé.`},{text:`a`,explanation:`Sai rồi, "elephant" bắt đầu bằng nguyên âm, em phải dùng "an".`,correct:!1},{text:`the`,explanation:`Chúng mình đang nói về "một" món đồ chơi chung chung, dùng "an" hợp hơn.`,correct:!1},{text:`some`,explanation:`"Elephant toy" là số ít (không có "s"), không dùng "some" được.`,correct:!1}]},{q:`Tên em là Mai. Hoàn thành câu 'My name is ___ Mai.'`,a:[{text:`(để trống)`,correct:!0,explanation:`Giỏi lắm! Với tên riêng của người, chúng mình không thêm "a, an, the" đâu.`},{text:`a`,explanation:`Không dùng "a" trước tên người đâu em nhé.`,correct:!1},{text:`an`,explanation:`Tên người không bắt đầu bằng mạo từ "an" đâu nè.`,correct:!1},{text:`the`,explanation:`Khi xưng tên, mình không dùng "the" đứng trước nhé.`,correct:!1}]},{q:`Mặt trời có màu vàng. Hoàn thành câu '___ Sun is yellow.'`,a:[{text:`The`,correct:!0,explanation:`Đúng rồi! Vì chỉ có duy nhất một mặt trời, nên mình phải dùng "The".`},{text:`A`,explanation:`Có nhiều mặt trời không nhỉ? Chỉ có một thôi, nên dùng "The" nhé.`,correct:!1},{text:`An`,explanation:`"Sun" bắt đầu bằng chữ S, không dùng "an" được và cũng cần dùng "The" nữa.`,correct:!1},{text:`(để trống)`,explanation:`Nhớ nhé, những thứ duy nhất như Mặt Trời, Mặt Trăng phải có "The".`,correct:!1}]},{q:`Nói về loài chó nói chung, chọn câu đúng:`,a:[{text:`I like dogs.`,correct:!0,explanation:`Chính xác! Khi nói mình thích chó nói chung (số nhiều), mình không dùng mạo từ.`},{text:`I like a dogs.`,explanation:`"Dogs" là số nhiều nên không dùng "a" được em ơi.`,correct:!1},{text:`I like the dogs.`,explanation:`Dùng "the" khi chỉ một đàn chó cụ thể nào đó. Nói chung chung thì không cần.`,correct:!1},{text:`I like an dogs.`,explanation:`"Dogs" bắt đầu bằng phụ âm và là số nhiều, không bao giờ dùng "an".`,correct:!1}]},{q:`Dịch sang tiếng Anh: "Tôi ăn sáng lúc 7 giờ."`,a:[{text:`I eat breakfast at 7.`,correct:!0,explanation:`Chuẩn luôn! Các bữa ăn như breakfast, lunch, dinner thường không có mạo từ.`},{text:`I eat a breakfast at 7.`,explanation:`Chúng mình không dùng "a" trước các bữa ăn như breakfast đâu.`,correct:!1},{text:`I eat the breakfast at 7.`,explanation:`Dùng "the" ở đây là không tự nhiên, bỏ đi là đúng nhất.`,correct:!1},{text:`I eat an breakfast at 7.`,explanation:`Breakfast bắt đầu bằng phụ âm, và mình cũng không dùng mạo từ ở đây.`,correct:!1}]},{q:`Em nhìn thấy một con chim. Con chim đó màu xanh. Hoàn thành câu 'I see a bird. ___ bird is blue.'`,a:[{text:`The`,correct:!0,explanation:`Tuyệt vời! Khi nhắc lại con chim đã biết ở câu trước, mình dùng "The".`},{text:`A`,explanation:`Bây giờ chúng mình đã biết con chim nào rồi, nên dùng "The" nhé.`,correct:!1},{text:`An`,explanation:`"Bird" đã được nhắc tới, mình dùng "The" để xác định nó.`,correct:!1},{text:`Some`,explanation:`Chỉ có một con chim thôi, không dùng "some" được nè.`,correct:!1}]},{q:`Em nói về việc yêu thích những quả táo nói chung. Hoàn thành câu 'I love ___ apples in general.'`,a:[{text:`(để trống)`,correct:!0,explanation:`Đúng! Nói về sở thích chung với danh từ số nhiều thì không cần mạo từ.`},{text:`a`,explanation:`"Apples" là số nhiều nên không dùng "a" được nha.`,correct:!1},{text:`an`,explanation:`Số nhiều không dùng "an" đâu em.`,correct:!1},{text:`the`,explanation:`Nếu nói thích táo nói chung, em để trống chỗ này là hay nhất.`,correct:!1}]},{q:`Tìm lỗi về mạo từ trong câu 'He goes to the school every day for classes as a student.' (Bạn ấy đi học hằng ngày.)`,a:[{text:`the school -> school`,correct:!0,explanation:`Đúng rồi! Đi học để học tập thì mình dùng "go to school", không có "the".`},{text:`goes -> go`,explanation:`Chủ ngữ "He" đi với "goes" là đúng rồi, không sửa nhé.`,correct:!1},{text:`every -> a`,explanation:`"Every day" là cụm từ đúng, không nên sửa.`,correct:!1},{text:`day -> days`,explanation:`"Day" là số ít đi sau "every" là chuẩn, không sửa thành "days".`,correct:!1}]},{q:`Quả bóng ở dưới chiếc bàn duy nhất cạnh ghế sofa. Chọn mạo từ đúng trong câu 'It is under ___ only table beside the sofa.'`,a:[{text:`the`,correct:!0,explanation:`Chính xác! Cả hai bạn đều biết cái bàn nào, nên dùng "the".`},{text:`a`,explanation:`Vì bạn A hỏi về quả bóng ở đâu nên chắc chắn cái bàn đó phải xác định rồi.`,correct:!1},{text:`an`,explanation:`"Table" bắt đầu bằng phụ âm, nhưng ở đây dùng "the" sẽ đúng ngữ cảnh hơn.`,correct:!1},{text:`(để trống)`,explanation:`Trong câu này cần có mạo từ xác định vị trí, dùng "the" nhé.`,correct:!1}]},{q:`Hãy mở chiếc cửa duy nhất bên cạnh em. Hoàn thành câu 'Open ___ only door beside you, please.'`,a:[{text:`the`,correct:!0,explanation:`Đúng! Khi nhờ mở cửa, chúng mình thường hiểu là cái cửa trong phòng này (xác định).`},{text:`a`,explanation:`Thường thì mình nhờ mở cái cửa cụ thể nào đó, dùng "the" sẽ tự nhiên hơn.`,correct:!1},{text:`an`,explanation:`Door bắt đầu bằng phụ âm, và mình nên dùng mạo từ xác định.`,correct:!1},{text:`(để trống)`,explanation:`Câu này thiếu mạo từ sẽ nghe rất cụt ngủn đó.`,correct:!1}]},{q:`Em có thể nói tiếng Anh. Hoàn thành câu 'I can speak ___ English.'`,a:[{text:`(để trống)`,correct:!0,explanation:`Tuyệt! Trước tên các ngôn ngữ, chúng mình không dùng mạo từ nhé.`},{text:`a`,explanation:`Không ai nói "a English" hết em ơi.`,correct:!1},{text:`an`,explanation:`Mặc dù English bắt đầu bằng nguyên âm, nhưng tên ngôn ngữ thì không dùng mạo từ.`,correct:!1},{text:`the`,explanation:`Tên ngôn ngữ như tiếng Anh, tiếng Việt thì để trống là đúng nhất.`,correct:!1}]},{q:`Cô ấy là một giáo viên. Hoàn thành câu 'She is ___ teacher.'`,a:[{text:`a`,correct:!0,explanation:`Chắc chắn rồi! Dùng "a" để chỉ nghề nghiệp (một giáo viên).`},{text:`an`,explanation:`Teacher bắt đầu bằng phụ âm "t", mình dùng "a" nhé.`,correct:!1},{text:`the`,explanation:`Khi mới giới thiệu nghề nghiệp, dùng "a" là chuẩn nhất.`,correct:!1},{text:`(để trống)`,explanation:`Đừng quên "a" trước tên nghề nghiệp số ít em nha.`,correct:!1}]},{q:`Em rất thích môn Toán. Hoàn thành câu 'I like ___ Math very much.'`,a:[{text:`(để trống)`,correct:!0,explanation:`Đúng! Các môn học ở trường (Math, Music, Art) không dùng mạo từ.`},{text:`a`,explanation:`Môn học thì không đếm "một môn" bằng cách dùng "a Math" đâu.`,correct:!1},{text:`an`,explanation:`Dù có nguyên âm hay phụ âm thì môn học cũng không dùng "an".`,correct:!1},{text:`the`,explanation:`Nói về môn học yêu thích, em không cần dùng "the" đâu nè.`,correct:!1}]},{q:`Mặt trăng tối nay rất đẹp. Hoàn thành câu '___ Moon is beautiful tonight.'`,a:[{text:`The`,correct:!0,explanation:`Chính xác! Chỉ có một Mặt trăng duy nhất nên dùng "The".`},{text:`A`,explanation:`Trăng chỉ có một, dùng "The" mới đúng ngữ pháp.`,correct:!1},{text:`An`,explanation:`Moon bắt đầu bằng phụ âm, nhưng vì nó là duy nhất nên phải dùng "The".`,correct:!1},{text:`(để trống)`,explanation:`Em nhớ quy tắc: Sun, Moon, Earth đều cần "The" nhé.`,correct:!1}]},{q:`Dịch câu: "Mẹ tôi đang ở trong căn bếp nhà mình."`,a:[{text:`My mother is in the kitchen.`,correct:!0,explanation:`Giỏi quá! Căn bếp trong nhà là nơi xác định nên dùng "the kitchen".`},{text:`My mother is in a kitchen.`,explanation:`Thường mình nói bếp nhà mình, nên dùng "the" thay vì "a".`,correct:!1},{text:`My mother is in kitchen.`,explanation:`Thiếu mạo từ "the" câu sẽ không tự nhiên đâu.`,correct:!1},{text:`My mother is an kitchen.`,explanation:`"Kitchen" bắt đầu bằng phụ âm, dùng "an" là sai hoàn toàn.`,correct:!1}]},{q:`Họ sống ở Việt Nam. Hoàn thành câu 'They live in ___ Vietnam.'`,a:[{text:`(để trống)`,correct:!0,explanation:`Đúng! Tên hầu hết các quốc gia thường không dùng mạo từ.`},{text:`a`,explanation:`Không dùng "a" trước tên nước Việt Nam đâu em.`,correct:!1},{text:`an`,explanation:`Tên nước không dùng "an" nhé.`,correct:!1},{text:`the`,explanation:`Việt Nam là tên riêng quốc gia, không cần dùng "the" đâu nè.`,correct:!1}]},{q:`Tìm lỗi: "I have the cat and the dog." (lần đầu nhắc cả hai thú cưng)`,a:[{text:`the cat/the dog -> a cat/a dog`,correct:!0,explanation:`Chính xác! Lần đầu nhắc cả hai thú cưng, đổi cả hai mạo từ xác định thành "a".`},{text:`cat -> cats`,explanation:`Dùng số ít là đúng rồi, không cần sửa thành số nhiều.`,correct:!1},{text:`and -> or`,explanation:`Dùng "and" để liệt kê hai con vật là chuẩn rồi.`,correct:!1},{text:`dog -> dogs`,explanation:`Sai. Câu nói về một con chó, giữ danh từ số ít và sửa mạo từ, không đổi thành "dogs".`,correct:!1}]},{q:`Chúng ta hãy chơi bóng đá! Hoàn thành câu 'Let's play ___ football!'`,a:[{text:`(để trống)`,correct:!0,explanation:`Tuyệt! Tên các môn thể thao (football, basketball, tennis) không có mạo từ.`},{text:`a`,explanation:`Chúng mình không gọi là "a football" khi nói về việc chơi bóng.`,correct:!1},{text:`an`,explanation:`Thể thao không dùng "an" nha em.`,correct:!1},{text:`the`,explanation:`Nói "play the football" nghe sẽ không tự nhiên bằng "play football".`,correct:!1}]},{q:`Bây giờ hãy đi ngủ! Hoàn thành câu 'Go to ___ bed now!'`,a:[{text:`(để trống)`,correct:!0,explanation:`Đúng! Cụm từ "go to bed" (đi ngủ) không dùng mạo từ.`},{text:`the`,explanation:`Thực ra "go to bed" là cụm từ cố định, không cần "the" đâu.`,correct:!1},{text:`a`,explanation:`Không dùng "a" trong trường hợp đi ngủ này em nhé.`,correct:!1},{text:`an`,explanation:`"An" lại càng không đúng rồi vì bed bắt đầu bằng phụ âm.`,correct:!1}]},{q:`Câu nào đúng ngữ pháp để nói 'Em đi học bằng xe buýt nào?'`,a:[{text:`I go to school by bus.`,correct:!0,explanation:`Chính xác! "Go to school" (đi học) là cụm từ không cần mạo từ.`},{text:`I go to a school by bus.`,explanation:`Đi học nói chung mình không dùng "a" ở đây.`,correct:!1},{text:`I go to the school by bus.`,explanation:`Trong tiếng Anh, "go to school" có nghĩa là đi học, không cần "the".`,correct:!1},{text:`I go to an school by bus.`,explanation:`"School" bắt đầu bằng phụ âm, dùng "an" là sai rồi.`,correct:!1}]},{q:`Bạn Nam đang ở đâu? Hoàn thành câu 'Where is ___ Nam?'`,a:[{text:`(để trống)`,correct:!0,explanation:`Đúng rồi! Tên người đứng một mình không cần mạo từ.`},{text:`a`,explanation:`Không gọi bạn là "a Nam" em nhé.`,correct:!1},{text:`an`,explanation:`Tên riêng không đi kèm "an" đâu nè.`,correct:!1},{text:`the`,explanation:`Dùng "the" trước tên người là không cần thiết và không đúng.`,correct:!1}]},{q:`Chúng ta sống trên Trái Đất. Hoàn thành câu 'We live on ___ Earth.'`,a:[{text:`the`,correct:!0,explanation:`Đúng rồi! Trái đất là duy nhất nên phải có "the" đi kèm.`},{text:`a`,explanation:`Chỉ có một Trái đất thôi, dùng "a" là không đúng.`,correct:!1},{text:`an`,explanation:`Dù Earth bắt đầu bằng E nhưng mình cần dùng mạo từ xác định "the".`,correct:!1},{text:`some`,explanation:`Trái đất là tên riêng duy nhất, không dùng "some".`,correct:!1}]},{q:`Đây là một quả cam. Quả cam đó ngọt. Hoàn thành câu 'This is ___ orange. ___ orange is sweet.'`,a:[{text:`an / The`,correct:!0,explanation:`Tuyệt! Lần đầu dùng "an", lần thứ hai nhắc lại dùng "The".`},{text:`a / The`,explanation:`Orange bắt đầu bằng nguyên âm, nên phải dùng "an" ở chỗ đầu tiên.`,correct:!1},{text:`an / A`,explanation:`Đã nhắc tới rồi thì lần sau phải dùng "The" chứ không dùng "A".`,correct:!1},{text:`the / The`,explanation:`Câu đầu tiên giới thiệu một quả cam chung chung, nên dùng "an" mới đúng.`,correct:!1}]},{q:`Em muốn ăn gì vào bữa trưa? Hoàn thành câu 'What do you want for ___ lunch?'`,a:[{text:`(để trống)`,correct:!0,explanation:`Chính xác! Các bữa ăn không đi kèm mạo từ đâu em.`},{text:`a`,explanation:`Ai lại nói "a lunch" bao giờ, đúng không nè?`,correct:!1},{text:`an`,explanation:`Ăn trưa là "have lunch", không cần "an".`,correct:!1},{text:`the`,explanation:`Bỏ mạo từ đi là cách nói tự nhiên nhất cho bữa ăn đó.`,correct:!1}]},{q:`Tìm lỗi: "The cats like milk." (Mèo nói chung thích sữa)`,a:[{text:`The cats -> Cats`,correct:!0,explanation:`Giỏi lắm! Khi nói về loài vật nói chung ở số nhiều (general), mình không dùng "the".`},{text:`like -> likes`,explanation:`Chủ ngữ số nhiều "Cats" dùng "like" là đúng rồi.`,correct:!1},{text:`milk -> milks`,explanation:`Sữa là danh từ không đếm được, không thêm "s" đâu.`,correct:!1},{text:`cats -> cat`,explanation:`Cần để số nhiều để nói về cả loài mèo, nhưng không thêm "the".`,correct:!1}]},{q:`Bây giờ em đang ở nhà. Hoàn thành câu 'I am at ___ home now.'`,a:[{text:`(để trống)`,correct:!0,explanation:`Đúng! Cụm từ "at home" (ở nhà) không bao giờ có mạo từ.`},{text:`a`,explanation:`Không ai nói "at a home" khi muốn nói mình đang ở nhà mình đâu.`,correct:!1},{text:`an`,explanation:`Ở nhà là "at home" thôi nhé.`,correct:!1},{text:`the`,explanation:`Dùng "the" ở đây sẽ làm câu nghe không giống người bản xứ nói.`,correct:!1}]},{q:`Bạn ấy biết chơi chiếc đàn piano mà chúng ta mua hôm qua. Hoàn thành câu 'He can play ___ piano we bought yesterday.'`,a:[{text:`the`,correct:!0,explanation:`Chuẩn! Khi nói chơi một nhạc cụ, chúng mình dùng "the" trước tên nhạc cụ.`},{text:`a`,explanation:`Không nói "play a piano" khi đang chỉ kỹ năng chơi đàn.`,correct:!1},{text:`an`,explanation:`Nhạc cụ thường đi kèm với "the" khi dùng với động từ play.`,correct:!1},{text:`(để trống)`,explanation:`Dùng "the" là quy tắc đặc biệt dành cho nhạc cụ đó em.`,correct:!1}]},{q:`Bạn A bảo: 'Hãy nhìn bầu trời kìa!' Bạn B thấy bầu trời rất xanh. Hoàn thành câu 'A: "Look at ___ sky!" - B: "Wow, it is so blue!"'`,a:[{text:`the`,correct:!0,explanation:`Chính xác! Bầu trời là duy nhất nên dùng "the sky".`},{text:`a`,explanation:`Chỉ có một bầu trời thôi, không dùng "a" được.`,correct:!1},{text:`an`,explanation:`Sky bắt đầu bằng phụ âm, nhưng quan trọng là nó duy nhất.`,correct:!1},{text:`(để trống)`,explanation:`Thiếu "the" thì câu nghe sẽ không hay đâu.`,correct:!1}]},{q:`Dịch câu: "Tôi thích môn Tiếng Anh."`,a:[{text:`I like English.`,correct:!0,explanation:`Đúng rồi! Tên môn học không dùng mạo từ đứng trước.`},{text:`I like the English.`,explanation:`Dùng "the English
