const fullQuestionBank=[{q:`Cái bút chì tiếng Anh là gì?`,a:[{text:`pencil`,correct:!0,explanation:`Chính xác! "Pencil" là bút chì để em tập viết.`},{text:`pen`,explanation:`"Pen" là bút bi hoặc bút mực em nhé.`,correct:!1},{text:`paper`,explanation:`"Paper" là tờ giấy trắng nè.`,correct:!1},{text:`ruler`,explanation:`"Ruler" là cái thước kẻ đó.`,correct:!1}]},{q:`Em dùng cái gì để đựng sách vở khi đi học?`,a:[{text:`bag`,correct:!0,explanation:`Đúng rồi! Cặp sách "bag" (hoặc schoolbag) là người bạn đồng hành mỗi ngày.`},{text:`box`,explanation:`Cái hộp "box" không tiện bằng cặp sách em nhé.`,correct:!1},{text:`bowl`,explanation:`Cái bát "bowl" để ăn cơm mà em.`,correct:!1},{text:`bottle`,explanation:`Cái chai "bottle" để đựng nước uống nè.`,correct:!1}]},{q:`"Key" nghĩa là gì?`,a:[{text:`Chìa khóa`,correct:!0,explanation:`Giỏi lắm! "Key" giúp em mở cửa vào nhà.`},{text:`Cái bàn`,explanation:`Cái bàn là "table" em nhé.`,correct:!1},{text:`Cái ghế`,explanation:`Cái ghế là "chair" nè.`,correct:!1},{text:`Cửa sổ`,explanation:`Cửa sổ là "window" đó.`,correct:!1}]},{q:`Vật có mặt số và kim, treo trên tường, giúp em biết bây giờ là mấy giờ?`,a:[{text:`clock`,correct:!0,explanation:`Chính xác! "Clock" (đồng hồ treo tường) là vật nhắc nhở thời gian.`},{text:`lamp`,explanation:`Đèn "lamp" giúp thắp sáng căn phòng em nhé.`,correct:!1},{text:`phone`,explanation:`Điện thoại cũng xem được giờ nhưng đồng hồ là vật chuyên dụng.`,correct:!1},{text:`book`,explanation:`Sách cung cấp kiến thức thôi em.`,correct:!1}]},{q:`Em mở cái gì để đi vào phòng?`,a:[{text:`door`,correct:!0,explanation:`Chuẩn luôn! "Door" là lối vào chính của căn phòng.`},{text:`window`,explanation:`Cửa sổ "window" chỉ để thông gió và đón nắng thôi nhé.`,correct:!1},{text:`wall`,explanation:`Tường "wall" chắc chắn không mở được rồi.`,correct:!1},{text:`floor`,explanation:`Sàn nhà "floor" là nơi em đứng mà.`,correct:!1}]},{q:`Vật gì che mưa cho em?`,a:[{text:`umbrella`,correct:!0,explanation:`Giỏi quá! "Umbrella" là chiếc ô (dù) che mưa che nắng.`},{text:`hat`,explanation:`Mũ "hat" chỉ che được phần đầu thôi em.`,correct:!1},{text:`coat`,explanation:`Áo khoác "coat" có thể che nhưng không hiệu quả bằng ô.`,correct:!1},{text:`bag`,explanation:`Cặp sách không dùng để che mưa đâu em nha.`,correct:!1}]},{q:`Dịch sang tiếng Anh: "Quyển sách"`,a:[{text:`book`,correct:!0,explanation:`Đúng rồi! "Book" là nơi chứa đựng những câu chuyện hay.`},{text:`box`,explanation:`Cái hộp là "box" em nhé.`,correct:!1},{text:`boot`,explanation:`Chiếc ủng là "boot" nè.`,correct:!1},{text:`chalk`,explanation:`“chalk” cùng nhóm từ vựng nhưng không đúng nghĩa được hỏi; đáp án phù hợp là “book”.`,correct:!1}]},{q:`Trong lớp, em ngồi trên cái gì?`,a:[{text:`chair`,correct:!0,explanation:`Chính xác! "Chair" là cái ghế êm ái cho em ngồi học.`},{text:`table`,explanation:`Bàn "table" dùng để đặt sách vở, không nên ngồi lên nhé.`,correct:!1},{text:`desk`,explanation:`Bàn học có ngăn kéo gọi là "desk" em nha.`,correct:!1},{text:`board`,explanation:`Cái bảng "board" treo trên tường mà em.`,correct:!1}]},{q:`Viết đúng từ "quả táo":`,a:[{text:`apple`,correct:!0,explanation:`Đúng! "Apple" có hai chữ "p" ở giữa.`},{text:`aple`,explanation:`Thiếu một chữ "p" rồi em ơi.`,correct:!1},{text:`appel`,explanation:`Thứ tự chữ "e" và "l" bị ngược rồi nè.`,correct:!1},{text:`aplee`,explanation:`Dư một chữ "e" ở cuối hụt mất rồi.`,correct:!1}]},{q:`Trong phòng tối, em bật vật gì để có ánh sáng?`,a:[{text:`lamp`,correct:!0,explanation:`Chuẩn luôn! Đèn "lamp" thắp sáng góc học tập của em.`},{text:`fan`,explanation:`Quạt "fan" để làm mát em nhé.`,correct:!1},{text:`air conditioner`,explanation:`Điều hòa giúp điều chỉnh nhiệt độ nè.`,correct:!1},{text:`TV`,explanation:`TV chỉ để xem phim giải trí thôi.`,correct:!1}]},{q:`Quyển vở để viết bài tiếng Anh là gì?`,a:[{text:`notebook`,correct:!0,explanation:`Giỏi lắm! "Notebook" là vở ô ly để em ghi chép bài học.`},{text:`textbook`,explanation:`"Textbook" là sách giáo khoa em nhé.`,correct:!1},{text:`storybook`,explanation:`"Storybook" là truyện đọc nè.`,correct:!1},{text:`picture book`,explanation:`"Picture book" là sách tranh xinh xắn.`,correct:!1}]},{q:`Em nhìn ra ngoài vườn qua cái gì?`,a:[{text:`window`,correct:!0,explanation:`Đúng rồi! Cửa sổ "window" giúp em ngắm nhìn cảnh vật bên ngoài.`},{text:`door`,explanation:`Cửa chính "door" dùng để đi lại là chính.`,correct:!1},{text:`mirror`,explanation:`Gương "mirror" để em ngắm chính mình nè.`,correct:!1},{text:`picture`,explanation:`Bức tranh "picture" chỉ là ảnh chụp thôi em.`,correct:!1}]},{q:`Ký hiệu "2B" thường in trên loại bút chì nào?`,a:[{text:`pencil`,correct:!0,explanation:`Chính xác! Bút chì "pencil" thường có độ đậm 2B rất phổ biến.`},{text:`eraser`,explanation:`Cái tẩy không có ký hiệu này em nhé.`,correct:!1},{text:`ruler`,explanation:`Thước kẻ dùng để đo độ dài nè.`,correct:!1},{text:`crayon`,explanation:`Bút màu "crayon" để tô màu rực rỡ.`,correct:!1}]},{q:`Cái gì có mặt phản chiếu phẳng để em thấy khuôn mặt mình?`,a:[{text:`mirror`,correct:!0,explanation:`Đúng! Chiếc gương "mirror" phản chiếu hình ảnh của chính em.`},{text:`window`,explanation:`Cửa sổ trong suốt nên không soi gương được đâu.`,correct:!1},{text:`glass`,explanation:`Kính cũng vậy, trừ khi là kính đặc biệt.`,correct:!1},{text:`water`,explanation:`Nước cũng soi được nhưng gương là vật dụng tốt nhất.`,correct:!1}]},{q:`Dịch sang tiếng Anh: "Cái thước kẻ"`,a:[{text:`ruler`,correct:!0,explanation:`Chính xác! "Ruler" giúp em kẻ những đường thẳng tắp.`},{text:`rubber`,explanation:`Cái tẩy là "rubber" (hoặc eraser) em nhé.`,correct:!1},{text:`runner`,explanation:`Người chạy là "runner" nè.`,correct:!1},{text:`roller`,explanation:`Con lăn là "roller" đó.`,correct:!1}]},{q:`Nói "Tôi có một cái cặp màu xanh":`,a:[{text:`I have a blue bag.`,correct:!0,explanation:`Giỏi quá! Màu sắc đứng trước danh từ, và dùng "a" cho phụ âm "b".`},{text:`I have an blue bag.`,explanation:`Blue phụ âm không đi với "an" em nhé.`,correct:!1},{text:`I have blue bag a.`,explanation:`Mạo từ phải đứng đầu cụm danh từ.`,correct:!1},{text:`I have some blue bag.`,explanation:`Chỉ có một chiếc cặp thôi em ơi.`,correct:!1}]},{q:`Vật gì giúp em cắt giấy?`,a:[{text:`scissors`,correct:!0,explanation:`Chính xác! Cái kéo "scissors" là dụng cụ thủ công quen thuộc.`},{text:`knife`,explanation:`Dao "knife" của mẹ sắc lắm, em không nên tự dùng nhé.`,correct:!1},{text:`ruler`,explanation:`Thước chỉ để kẻ thôi em.`,correct:!1},{text:`pen`,explanation:`Bút để viết chứ không cắt được.`,correct:!1}]},{q:`Vật nào kêu tích tắc, tích tắc?`,a:[{text:`clock`,correct:!0,explanation:`Đúng! Tiếng tích tắc của đồng hồ "clock" nghe rất đều đặn.`},{text:`phone`,explanation:`Điện thoại thường reo bằng nhạc chuông em nhé.`,correct:!1},{text:`computer`,explanation:`Máy tính không kêu như thế đâu.`,correct:!1},{text:`pencil`,explanation:`Bút chì thì lặng im làm việc thôi.`,correct:!1}]},{q:`Từ "cái điện thoại" viết là gì?`,a:[{text:`phone`,correct:!0,explanation:`Chính xác! "Phone" (viết tắt của telephone) là cách phổ biến nhất.`},{text:`fone`,explanation:`Phát âm là /f/ nhưng viết là "ph" em nhé.`,correct:!1},{text:`phon`,explanation:`Thiếu chữ "e" cuối cùng rồi em ơi.`,correct:!1},{text:`phonne`,explanation:`Dư một chữ "n" mất rồi nè.`,correct:!1}]},{q:`Chọn câu miêu tả cái bàn đúng:`,a:[{text:`The table is big.`,correct:!0,explanation:`Chuẩn luôn! "Table" số ít đi với động từ "is".`},{text:`The table are big.`,explanation:`Chỉ có một cái bàn, không dùng "are" em nhé.`,correct:!1},{text:`The table am big.`,explanation:`"Am" chỉ dành cho "I" thôi.`,correct:!1},{text:`Tables is big.`,explanation:`Số nhiều "Tables" phải đi với "are" mới đúng.`,correct:!1}]},{q:`Em dùng cái gì để di chuyển mũi tên trên máy tính?`,a:[{text:`mouse`,correct:!0,explanation:`Giỏi! Con chuột "mouse" giúp em điều khiển máy tính dễ dàng.`},{text:`cat`,explanation:`Con mèo "cat" thật thì không dùng được máy tính đâu em.`,correct:!1},{text:`key`,explanation:`Chìa khóa "key"
