const fullQuestionBank=[{q:`Điền "a" hoặc "an" trước từ "apple" (quả táo): ___ apple.`,a:[{text:`an`,correct:!0,explanation:`Đúng. 'Apple' bắt đầu bằng âm nguyên âm /æ/, nên dùng 'an'.`},{text:`a`,explanation:`'Apple' bắt đầu bằng âm nguyên âm, nên không dùng 'a'.`,correct:!1},{text:`two`,explanation:`'Two' phải đi với danh từ số nhiều 'apples'.`,correct:!1},{text:`many`,explanation:`'Many' phải đi với danh từ số nhiều 'apples'.`,correct:!1}]},{q:`Câu nào đúng về quả cam?`,a:[{text:`This is an orange.`,correct:!0,explanation:`'Orange' bắt đầu bằng âm nguyên âm /ɒ/, nên dùng 'an' trước danh từ số ít này.`},{text:`This is a orange.`,explanation:`Em lưu ý nhé, 'orange' bắt đầu bằng nguyên âm nên phải dùng 'an'.`,correct:!1},{text:`This an orange.`,explanation:`Câu này thiếu động từ 'is' sau 'This'.`,correct:!1},{text:`This are an orange.`,explanation:`'This' là số ít nên phải đi với 'is' chứ không phải 'are'.`,correct:!1}]},{q:`Tìm lỗi trong câu tiếng Anh "She has a elephant." (Cô ấy có một con voi).`,a:[{text:`a -> an`,correct:!0,explanation:`'Elephant' bắt đầu bằng âm nguyên âm /e/, nên cụm đúng là 'an elephant', không phải 'a elephant'.`},{text:`has -> have`,explanation:`'She' là ngôi thứ 3 số ít nên dùng 'has' là đúng rồi em.`,correct:!1},{text:`elephant -> elephants`,explanation:`Câu đang nói về 'một' con voi nên mình giữ nguyên số ít nhé.`,correct:!1},{text:`a -> many`,explanation:`'Many' cần danh từ số nhiều; thay 'a' bằng 'many' vẫn để lại 'many elephant', nên phải đổi cả danh từ thành 'elephants'.`,correct:!1}]},{q:`Điền "a" hoặc "an" trước từ "bird" (con chim): ___ bird.`,a:[{text:`a`,correct:!0,explanation:`Đúng! 'Bird' bắt đầu bằng âm phụ âm /b/, nên dùng 'a'.`},{text:`an`,explanation:`'Bird' bắt đầu bằng âm phụ âm, nên không dùng 'an'.`,correct:!1},{text:`two`,explanation:`'Two' phải đi với danh từ số nhiều 'birds'.`,correct:!1},{text:`many`,explanation:`'Many' phải đi với danh từ số nhiều 'birds'.`,correct:!1}]},{q:`Điền "a" hoặc "an" trước từ "egg" (quả trứng): "It's ___ egg."`,a:[{text:`an`,correct:!0,explanation:`Đúng. 'Egg' bắt đầu bằng âm nguyên âm /e/, nên dùng 'an'.`},{text:`a`,explanation:`'Egg' bắt đầu bằng âm nguyên âm, nên không dùng 'a'.`,correct:!1},{text:`many`,explanation:`'Many' phải đi với danh từ số nhiều 'eggs'.`,correct:!1},{text:`two`,explanation:`'Two' phải đi với danh từ số nhiều 'eggs'.`,correct:!1}]},{q:`Câu nào có nghĩa là: 'Tôi có một con mèo'?`,a:[{text:`I have a cat.`,correct:!0,explanation:`Chính xác! 'A' đi với 'cat' vì 'cat' bắt đầu bằng phụ âm.`},{text:`I have an cat.`,explanation:`'Cat' bắt đầu bằng phụ âm 'c', nên mình dùng 'a' em nhé.`,correct:!1},{text:`I has a cat.`,explanation:`Chủ ngữ 'I' thì phải đi với 'have', không đi với 'has' đâu.`,correct:!1},{text:`I have cat.`,explanation:`Em thiếu mạo từ 'a' để chỉ 'một' con mèo rồi nè.`,correct:!1}]},{q:`Điền "a" hoặc "an" trước từ "umbrella" (cái ô): "Is it ___ umbrella?"`,a:[{text:`an`,correct:!0,explanation:`Đúng. 'Umbrella' bắt đầu bằng âm nguyên âm /ʌ/, nên dùng 'an'.`},{text:`a`,explanation:`'Umbrella' bắt đầu bằng âm nguyên âm, nên không dùng 'a'.`,correct:!1},{text:`many`,explanation:`'Many' phải đi với danh từ số nhiều 'umbrellas'.`,correct:!1},{text:`two`,explanation:`'Two' phải đi với danh từ số nhiều 'umbrellas'.`,correct:!1}]},{q:`Điền "a" hoặc "an" trước từ "ant" (con kiến): ___ ant.`,a:[{text:`an`,correct:!0,explanation:`'Ant' bắt đầu bằng âm nguyên âm /æ/, nên dùng 'an' trước danh từ số ít.`},{text:`a`,explanation:`Vì 'ant' bắt đầu bằng nguyên âm, em phải chọn 'an' mới đúng.`,correct:!1},{text:`any`,explanation:`'Any' không phải là một trong hai mạo từ cần chọn; với danh từ số ít 'ant' để nói về một con kiến, dùng 'an'.`,correct:!1},{text:`many`,explanation:`'Many' đi với danh từ số nhiều 'ants', không đi với danh từ số ít 'ant'.`,correct:!1}]},{q:`Câu nào đúng về con kiến?`,a:[{text:`An ant is small.`,correct:!0,explanation:`'Ant' bắt đầu bằng âm nguyên âm /æ/; ở đây 'an ant' là cụm danh từ số ít đúng.`},{text:`A ant is small.`,explanation:`Lưu ý nhé: 'ant' bắt đầu bằng nguyên âm nên phải dùng 'an'.`,correct:!1},{text:`An ants is small.`,explanation:`Nếu dùng 'ants' (số nhiều) thì không dùng 'an' và phải đổi 'is' thành 'are'.`,correct:!1},{text:`Ant is small.`,explanation:`Câu này thiếu mạo từ đứng trước danh từ 'ant' rồi.`,correct:!1}]},{q:`Tìm lỗi trong câu tiếng Anh "Ba is a English boy." (Ba là một cậu bé người Anh).`,a:[{text:`a -> an`,correct:!0,explanation:`'English' bắt đầu bằng âm nguyên âm /ɪ/, nên cụm đúng là 'an English boy'.`},{text:`is -> are`,explanation:`Ba là một người nên dùng 'is' là đúng rồi, không sửa nhé.`,correct:!1},{text:`boy -> boys`,explanation:`Ba là một cậu bé thôi, nên để số ít là đúng rồi.`,correct:!1},{text:`English -> England`,explanation:`Dùng tính từ 'English' để chỉ quốc tịch là hoàn toàn chính xác.`,correct:!1}]},{q:`Điền "a" hoặc "an" trước từ "book" (quyển sách): ___ book.`,a:[{text:`a`,correct:!0,explanation:`Đúng! 'Book' bắt đầu bằng phụ âm 'b' nên mình dùng 'a'.`},{text:`an`,explanation:`Từ 'book' không bắt đầu bằng nguyên âm, nên không dùng 'an' được.`,correct:!1},{text:`two`,explanation:`'Two' phải đi với danh từ số nhiều 'books'.`,correct:!1},{text:`many`,explanation:`'Many' phải đi với danh từ số nhiều 'books'.`,correct:!1}]},{q:`Điền "a" hoặc "an" trước cụm "ice cream cone" (ốc quế kem): ___ ice cream cone, please.`,a:[{text:`An`,correct:!0,explanation:`Đúng. 'Ice' bắt đầu bằng âm nguyên âm /aɪ/, nên dùng 'an'.`},{text:`A`,explanation:`'Ice' bắt đầu bằng âm nguyên âm, nên không dùng 'a'.`,correct:!1},{text:`Two`,explanation:`'Two' phải đi với danh từ số nhiều 'cones'.`,correct:!1},{text:`Many`,explanation:`'Many' phải đi với danh từ số nhiều 'cones'.`,correct:!1}]},{q:`Câu nào đúng với nghĩa: 'Đó là một con cá sấu'?`,a:[{text:`That is an alligator.`,correct:!0,explanation:`'Alligator' bắt đầu bằng âm nguyên âm /ˈæl-/, nên dùng 'an' trước danh từ số ít.`},{text:`That is a alligator.`,explanation:`Nhớ quy tắc nhé: nguyên âm 'a' phải đi với 'an'.`,correct:!1},{text:`That are an alligator.`,explanation:`'That' đi với 'is' chứ không đi với 'are' em nha.`,correct:!1},{text:`That is alligator.`,explanation:`Thiếu mạo từ 'an' rồi, em bổ sung cho đúng nhé.`,correct:!1}]},{q:`Điền "a" hoặc "an" trước cụm "old ruler" (thước kẻ cũ): ___ old ruler.`,a:[{text:`an`,correct:!0,explanation:`Mạo từ phụ thuộc vào âm đầu của từ đứng ngay sau nó; 'old' bắt đầu bằng âm nguyên âm /əʊ/, nên dùng 'an'.`},{text:`a`,explanation:`Dù danh từ là 'ruler' nhưng từ đứng trước nó là 'old' (vowel), nên dùng 'an' nhé.`,correct:!1},{text:`no`,explanation:`'No' không phải là mạo từ cần chọn; với cụm 'old ruler', từ đứng sau là 'old' nên dùng 'an'.`,correct:!1},{text:`two`,explanation:`'Two' phải đi với danh từ số nhiều 'rulers'.`,correct:!1}]},{q:`Điền "a" hoặc "an" trước từ "banana" (quả chuối): ___ banana.`,a:[{text:`a`,correct:!0,explanation:`'Banana' bắt đầu bằng âm phụ âm /b/, nên dùng 'a' trước danh từ số ít.`},{text:`an`,explanation:`'Banana' không phải nguyên âm, nên mình dùng 'a' thôi.`,correct:!1},{text:`two`,explanation:`'Two' phải đi với danh từ số nhiều 'bananas'.`,correct:!1},{text:`many`,explanation:`Từ 'banana' ở số ít, em dùng 'a' là đúng nhất.`,correct:!1}]},{q:`Câu nào đúng về con cú?`,a:[{text:`She sees an owl on the roof.`,correct:!0,explanation:`'Owl' bắt đầu bằng âm nguyên âm /aʊ/, nên dùng 'an' trước danh từ số ít.`},{text:`She sees a owl on the roof.`,explanation:`O là nguyên âm, nên phải dùng 'an' mới đúng ngữ pháp.`,correct:!1},{text:`She see an owl on the roof.`,explanation:`'She' số ít nên động từ 'see' phải thêm 's' thành 'sees'.`,correct:!1},{text:`She sees an owls on the roof.`,explanation:`Đã dùng 'an' thì không dùng 'owls' số nhiều nữa.`,correct:!1}]},{q:`Tìm lỗi trong câu tiếng Anh "I want a eraser." (Tôi muốn một cục tẩy).`,a:[{text:`a -> an`,correct:!0,explanation:`'Eraser' bắt đầu bằng âm nguyên âm /ɪ/, nên phải sửa 'a eraser' thành 'an eraser'.`},{text:`want -> wants`,explanation:`Chủ ngữ 'I
