const fullQuestionBank=[{q:`Chọn từ phù hợp để nói có một quả cam trong túi: I have ___ orange in my bag.`,a:[{text:`an`,correct:!0,explanation:`Chính xác! "Orange" bắt đầu bằng nguyên âm nên dùng "an" em nhé.`},{text:`a`,explanation:`Sai rồi, "orange" bắt đầu bằng nguyên âm, phải dùng "an" mới đúng.`,correct:!1},{text:`some`,explanation:`Chỉ có "một" quả cam thôi, dùng "an" hay hơn "some" nè.`,correct:!1},{text:`many`,explanation:`"Orange" là số ít, mình không dùng "many" được.`,correct:!1}]},{q:`Chọn từ phù hợp để nói có một vài con chim trên cây: There are ___ birds on the tree.`,a:[{text:`some`,correct:!0,explanation:`Đúng rồi! Câu khẳng định dùng "some" cho danh từ số nhiều.`},{text:`a`,explanation:`"Birds" là số nhiều, không dùng "a" được đâu em.`,correct:!1},{text:`an`,explanation:`Số nhiều không đi với "an" em nhé.`,correct:!1},{text:`any`,explanation:`Câu này là khẳng định, mình dùng "some" thay vì "any" nhé.`,correct:!1}]},{q:`Hỏi xem bạn có chiếc bút chì nào không: Do you have ___ pencils at all?`,a:[{text:`any`,correct:!0,explanation:`Giỏi lắm! Trong câu hỏi, chúng mình dùng "any".`},{text:`some`,explanation:`Thường thì "any" dùng cho câu hỏi nghe sẽ tự nhiên hơn "some".`,correct:!1},{text:`a`,explanation:`"Pencils" là số nhiều, không dùng "a" được.`,correct:!1},{text:`an`,explanation:`Số nhiều không dùng "an" em nha.`,correct:!1}]},{q:`Chọn từ phù hợp để nói bạn ấy có một vài người bạn ở trường: He has ___ friends at school.`,a:[{text:`many`,correct:!0,explanation:`Chính xác! "Friends" là danh từ đếm được số nhiều, dùng "many".`},{text:`much`,explanation:`"Much" thường dùng cho danh từ không đếm được (như sữa, nước).`,correct:!1},{text:`a`,explanation:`"Friends" là số nhiều, không dùng "a" em nhé.`,correct:!1},{text:`an`,explanation:`Số nhiều không đi với "an" đâu.`,correct:!1}]},{q:`Chọn từ phù hợp cho sữa, một danh từ không đếm được, trong câu phủ định: I don't have ___ milk in the fridge; there is only a little left, not a large amount.`,a:[{text:`much`,correct:!0,explanation:`Đúng! Câu nói còn một ít sữa nhưng không nhiều, nên lượng từ phù hợp là "much".`},{text:`many`,explanation:`"Many" chỉ dùng cho những thứ đếm được (như quả táo, cái bút).`,correct:!1},{text:`a`,explanation:`"Milk" không đếm được nên không dùng "a milk" em nhé.`,correct:!1},{text:`an`,explanation:`Không dùng "an" trước danh từ không đếm được.`,correct:!1}]},{q:`Chọn câu đúng về cách dùng từ chỉ số lượng trong tiếng Anh:`,a:[{text:`I have some apples.`,correct:!0,explanation:`Chính xác! "Some" đi với danh từ số nhiều trong câu khẳng định.`},{text:`I have an apples.`,explanation:`Đã là số nhiều "apples" thì không dùng "an" đứng trước.`,correct:!1},{text:`I have much apples.`,explanation:`"Much" dùng cho vật không đếm được, còn táo đếm được em ơi.`,correct:!1},{text:`I have a apples.`,explanation:`Số nhiều không dùng "a", em nhớ nhé.`,correct:!1}]},{q:`Cô bé không muốn một chút nước nào; chọn từ phù hợp: She refuses even a drop of water; she doesn't want ___ water.`,a:[{text:`any`,correct:!0,explanation:`Tuyệt vời! Câu phủ định (doesn't) dùng "any".`},{text:`some`,explanation:`Sai. Cụm "even a drop" loại trừ cả một ít nước, nên phải dùng "any water".`,correct:!1},{text:`many`,explanation:`"Water" là danh từ không đếm được, không dùng "many" nè.`,correct:!1},{text:`a`,explanation:`"Water" không đếm được, không dùng "a water" em nhé.`,correct:!1}]},{q:`Tìm lỗi sai: "I have a animals."`,a:[{text:`a -> some`,correct:!0,explanation:`Đúng rồi! "Animals" là số nhiều, mình dùng "some" chứ không dùng "a".`},{text:`have -> has`,explanation:`Chủ ngữ "I" luôn đi với "have", không cần sửa.`,correct:!1},{text:`animals -> animalses`,explanation:`Cách sửa này tạo ra một từ sai chính tả và không sửa được lượng từ.`,correct:!1},{text:`I -> Me`,explanation:`Chủ ngữ phải là "I", dùng "Me" ở đây là sai.`,correct:!1}]},{q:`Chọn từ phù hợp để nói có một chiếc bánh đã chuẩn bị cho bạn: I have ___ cake ready for you.`,a:[{text:`some`,correct:!0,explanation:`Chính xác! "Cake" ở đây chỉ một lượng bánh không xác định, nên dùng "some".`},{text:`any`,explanation:`Đây là câu khẳng định nói về một lượng bánh không xác định, nên dùng "some" thay vì "any".`,correct:!1},{text:`many`,explanation:`"Many" dùng cho danh từ đếm được số nhiều, còn "cake" ở đây chỉ một lượng bánh không xác định.`,correct:!1},{text:`much`,explanation:`Trong câu khẳng định tự nhiên này, dùng "some cake"; "much cake" thường dùng trong câu hỏi hoặc phủ định.`,correct:!1}]},{q:`Dịch câu: "Bạn có nhiều đồ chơi không?"`,a:[{text:`Do you have many toys?`,correct:!0,explanation:`Giỏi quá! "Toys" đếm được nên dùng "many" trong câu hỏi.`},{text:`Do you have much toys?`,explanation:`"Much" chỉ dùng cho vật không đếm được (như sữa, tiền).`,correct:!1},{text:`Do you have a toys?`,explanation:`Số nhiều không dùng "a" đứng trước đâu em.`,correct:!1},{text:`Do you have some toy?`,explanation:`Câu đang muốn hỏi "nhiều", "some" chỉ có nghĩa là "một ít".`,correct:!1}]},{q:`Chọn từ phù hợp để nói anh/em trai chỉ có một chiếc xe đạp cũ: My brother has ___ old bike; it is his only bicycle.`,a:[{text:`an`,correct:!0,explanation:`Chính xác! "Old" bắt đầu bằng nguyên âm "o" nên dùng "an".`},{text:`a`,explanation:`Mạo từ đi theo từ ngay sau nó, "old" là nguyên âm nên dùng "an".`,correct:!1},{text:`some`,explanation:`Sai. Cue "his only bicycle" chỉ một xe đạp số ít; dùng "an old bike".`,correct:!1},{text:`any`,explanation:`Không dùng "any" trong câu khẳng định giới thiệu đồ vật này.`,correct:!1}]},{q:`Chọn từ phù hợp để nói trong cốc có một ít nước ép: There is ___ juice in my glass.`,a:[{text:`some`,correct:!0,explanation:`Tuyệt! Dùng "some" trước danh từ không đếm được trong câu khẳng định.`},{text:`a`,explanation:`Nước ép không đếm được, mình không dùng "a juice" nhé.`,correct:!1},{text:`any`,explanation:`Đây là câu khẳng định nói về một lượng nước ép không xác định, nên dùng "some" thay vì "any".`,correct:!1},{text:`many`,explanation:`Juice không đếm được nên không dùng "many".`,correct:!1}]},{q:`Hỏi xem trong hộp có viên kẹo nào không: Are there ___ sweets at all in the box?`,a:[{text:`any`,correct:!0,explanation:`Đúng! Trong câu hỏi "Are there...?", chúng mình dùng "any".`},{text:`some`,explanation:`Dùng "any" cho câu hỏi là quy tắc cơ bản đấy em.`,correct:!1},{text:`much`,explanation:`"Sweets" đếm được số nhiều, không dùng "much".`,correct:!1},{text:`a`,explanation:`Số nhiều không đi với "a" em nhé.`,correct:!1}]},{q:`Lớp có một vài quả trứng nhưng không đủ cho cả lớp; chọn từ phù hợp: We have a few eggs, but not ___ eggs for the whole class.`,a:[{text:`many`,correct:!0,explanation:`Chuẩn luôn! "Eggs" đếm được số nhiều, dùng "many" trong câu phủ định.`},{text:`much`,explanation:`"Much" chỉ dành cho vật không đếm được như nước, sữa.`,correct:!1},{text:`a`,explanation:`Đã là số nhiều "eggs" thì không dùng "a" đứng trước.`,correct:!1},{text:`some`,explanation:`Sai. "Some eggs" không diễn tả lượng lớn cần cho cả lớp; cue "a few, but not many" khóa "many".`,correct:!1}]},{q:`Hỏi bạn có bao nhiêu tiền, dùng từ phù hợp với danh từ không đếm được: How ___ money do you have?`,a:[{text:`much`,correct:!0,explanation:`Chính xác! "Money" là danh từ không đếm được, dùng "much".`},{text:`many`,explanation:`Tiền không đếm từng "một tiền, hai tiền" nên không dùng "many".`,correct:!1},{text:`some`,explanation:`Trong câu hỏi "How...?", mình chọn "much" hoặc "many" thôi.`,correct:!1},{text:`any`,explanation:`Hỏi về số lượng thì dùng "much" cho tiền em nhé.`,correct:!1}]},{q:`Chọn hai từ phù hợp để nói nhìn thấy một con mèo và vài mèo con: I see ___ cat and ___ kittens.`,a:[{text:`a / some`,correct:!0,explanation:`Tuyệt! Lần đầu khoe có "một con mèo" và "một vài con mèo con".`},{text:`some / a`,explanation:`"Cat" số ít dùng "a", "kittens" số nhiều khẳng định dùng "some".`,correct:!1},{text:`an / some`,explanation:`"Cat" bắt đầu bằng phụ âm, không dùng "an".`,correct:!1},{text:`a / any`,explanation:`Câu khẳng định mình dùng "some" cho số nhiều nhé.`,correct:!1}]},{q:`Tìm lỗi: "There are any books on the table."`,a:[{text:`any -> some`,correct:!0,explanation:`Đúng! Câu khẳng định "There are..." dùng "some" chứ không dùng "any".`},{text:`are -> is`,explanation:`Chủ ngữ số nhiều dùng "are" là đúng ngữ pháp rồi.`,correct:!1},{text:`books -> book`,explanation:`Hãy giữ số nhiều để phù hợp với từ "are" nhé.`,correct:!1},{text:`the -> a`,explanation:`Dùng "the table" để chỉ cái bàn đã biết là chuẩn rồi.`,correct:!1}]},{q:`Câu nào đúng trong câu khẳng định cần một lượng giúp đỡ không xác định?`,a:[{text:`He needs any help.`,explanation:`Trong câu khẳng định thông thường, dùng some help; any chỉ phù hợp trong phủ định hoặc nghi vấn.`,correct:!1},{text:`He needs much help.`,explanation:`"Much help" diễn tả rất nhiều sự giúp đỡ, không phù hợp với ý "một lượng không xác định"; dùng "some help".`,correct:!1},{text:`He needs some help.`,correct:!0,explanation:`Help là danh từ không đếm được; câu khẳng định dùng some help.`},{text:`He needs many help.`,explanation:`"Help" không đếm được nên không dùng "many".`,correct:!1}]},{q:`Hỏi và trả lời phủ định về bánh mì; chọn từ phù hợp: A: "Is there ___ bread?" - B: "No, there isn't ___."`,a:[{text:`any / any`,correct:!0,explanation:`Chính xác! Cả câu hỏi và câu phủ định đều dùng "any".`},{text:`some / some`,explanation:`Nhớ nhé: câu hỏi và phủ định đi chung với "any".`,correct:!1},{text:`any / some`,explanation:`Vế đầu là câu hỏi, dùng "any" là đúng quy tắc.`,correct:!1},{text:`some / any`,explanation:`Vế sau là phủ định (isn't), cũng phải dùng "any".`,correct:!1}]},{q:`Dịch câu: "Mẹ mua một vài quả trứng."`,a:[{text:`My mother buys some eggs.`,correct:!0,explanation:`Giỏi quá! Câu khẳng định dùng "some" cho danh từ số nhiều.`},{text:`My mother buys an eggs.`,explanation:`Số nhiều không dùng "an", em nhớ nhé.`,correct:!1},{text:`My mother buys any eggs.`,explanation:`Câu khẳng định không dùng "any".`,correct:!1},{text:`My mother buys much eggs.`,explanation:`"Eggs" là vật đếm được, không dùng "much".`,correct:!1}]},{q:`Chọn hai từ phù hợp để nói cô bé ăn một quả chuối và một quả táo mỗi ngày: She eats ___ banana and ___ apple every day.`,a:[{text:`a / an`,correct:!0,explanation:`Đúng rồi! "Banana" (phụ âm) dùng "a", "Apple" (nguyên âm) dùng "an".`},{text:`an / a`,explanation:`"Banana" làm sao mà đi với "an" được, đúng không nè?`,correct:!1},{text:`some / any`,explanation:`Mỗi ngày ăn một quả, dùng "a" và "an" là chuẩn nhất.`,correct:!1},{text:`many / much`,explanation:`Đây là số lượng ít (một quả), không dùng many/much.`,correct:!1}]},{q:`Chọn từ phù hợp để nói tôi muốn một vài con tem cho những tấm thiệp: I want ___ stamps for my cards.`,a:[{text:`some`,correct:!0,explanation:`Chắc chắn rồi! "Stamps" (con tem) số nhiều khẳng định dùng "some".`},{text:`any`,explanation:`Câu khẳng định chúng mình dùng "some" em nhé.`,correct:!1},{text:`a`,explanation:`Số nhiều không dùng "a".`,correct:!1},{text:`much`,explanation:`Con tem là vật đếm được, không dùng "much".`,correct:!1}]},{q:`Chọn từ phù hợp để nói tôi không nhìn thấy đứa trẻ nào trong sân: I don't see ___ children in the yard.`,a:[{text:`any`,correct:!0,explanation:`Đúng! Câu phủ định (don't see) dùng "any" cho danh từ số nhiều.`},{text:`some`,explanation:`Nếu dùng "some" trong câu phủ định sẽ không đúng ngữ pháp.`,correct:!1},{text:`much`,explanation:`"Children" số nhiều, đếm được nên không dùng "much".`,correct:!1},{text:`an`,explanation:`Số nhiều không dùng "an" em nha.`,correct:!1}]},{q:`Hỏi bạn nhìn thấy bao nhiêu chiếc ô tô, dùng từ phù hợp với danh từ đếm được số nhiều: How ___ cars can you see?`,a:[{text:`many`,correct:!0,explanation:`Chuẩn luôn! "Cars" đếm được số nhiều, dùng "many" sau "How".`},{text:`much`,explanation:`"Much" chỉ dùng cho những thứ như nước, đường, tiền.`,correct:!1},{text:`some`,explanation:`Khi hỏi số lượng mang ý nghĩa "bao nhiêu", dùng "many" cho vật đếm được.`,correct:!1},{text:`any`,explanation:`Câu hỏi bao nhiêu (How...) đi với many mới đúng.`,correct:!1}]},{q:`Chọn từ phù hợp để nói trong trà không có chút đường nào: There isn't ___ sugar in my tea.`,a:[{text:`much`,correct:!0,explanation:`Chính xác! "Sugar" (đường) không đếm được, dùng "much" câu phủ định.`},{text:`many`,explanation:`Đường không đếm từng hột được nên không dùng "many" nhé.`,correct:!1},{text:`a`,explanation:`Không dùng "a sugar" vì nó không đếm được.`,correct:!1},{text:`an`,explanation:`Đường không đi với "an" đâu em.`,correct:!1}]},{q:`Hỏi xem trong cốc có chút sữa nào không: Is there ___ milk in the cup?`,a:[{text:`any`,correct:!0,explanation:`Đúng! Câu hỏi trung tính về việc có tồn tại sữa hay không dùng "any".`},{text:`many`,explanation:`Sữa không đếm được, mình không dùng "many".`,correct:!1},{text:`a`,explanation:`Sữa là vật không đếm được, không thể nói "một sữa".`,correct:!1},{text:`an`,explanation:`Càng không thể dùng "an" trước sữa được rồi.`,correct:!1}]},{q:`Tìm lỗi: "How many water does she have?"`,a:[{text:`many -> much`,correct:!0,explanation:`Đúng rồi! Sau How, danh từ water không đếm được nên phải dùng much.`},{text:`has -> have`,explanation:`Chủ ngữ số ít "She" dùng "has" là chuẩn rồi.`,correct:!1},{text:`water -> waters`,explanation:`Nước là không đếm được, đừng thêm "s" vào em nhé.`,correct:!1},{text:`many -> a lot of`,explanation:`Sau How trong câu hỏi định lượng phải dùng much, không dùng a lot of.`,correct:!1}]},{q:`Câu nào đúng với nghĩa: "Tôi không có bất cứ cái kẹo nào"?`,a:[{text:`I don't have any sweets.`,correct:!0,explanation:`Tuyệt! Câu phủ định (don't) đi kèm "any" để mang nghĩa "bất cứ".`},{text:`I don't have some sweets.`,explanation:`Phủ định thì dùng "any" sẽ đúng ngữ pháp hơn "some".`,correct:!1},{text:`I don't have many sweet.`,explanation:`Nếu dùng "many" thì "sweet" phải thêm "s" thành số nhiều.`,correct:!1},{text:`I don't have much sweets.`,explanation:`Kẹo đếm được (sweets), mình không dùng "much".`,correct:!1}]},{q:`Tôi đã mua bánh quy và sẽ mời mọi người một số chiếc; chọn từ phù hợp: I bought cookies. I will serve ___ co
