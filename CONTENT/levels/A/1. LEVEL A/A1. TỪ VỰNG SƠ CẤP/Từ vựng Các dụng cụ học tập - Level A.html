<!doctype html><html lang=vi><head><link href=/tools-assets/vendor/dec-web-fonts.css rel=stylesheet><meta charset=UTF-8><meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" name=viewport><title>Từ vựng Các dụng cụ học tập - Level A</title><link href="/favicon-16.png?v=20260708-declogo" rel=icon sizes=16x16 type=image/png><link href="/favicon-32.png?v=20260708-declogo" rel=icon sizes=32x32 type=image/png><link href="/favicon-48.png?v=20260708-declogo" rel=icon sizes=48x48 type=image/png><link href="/favicon-64.png?v=20260708-declogo" rel=icon sizes=64x64 type=image/png><link href="/favicon-128.png?v=20260708-declogo" rel=icon sizes=128x128 type=image/png><link href="/favicon-256.png?v=20260708-declogo" rel=icon sizes=256x256 type=image/png><style>:root{--dec-font-family-offline:"Be Vietnam Pro","Segoe UI",Arial,sans-serif;--dec-serif-family-offline:Georgia,serif}html,body,button,input,select,textarea{font-family:var(--dec-font-family-offline)}</style><link href=/tools-assets/generated/style-d02bbdee71641645.css rel=stylesheet><link href=/tools-assets/generated/style-e08fd04e027e6fee.css rel=stylesheet></head><body><div class=container><div id=header-area><h1 class=dec-ui-game-title id=lessonTitle>Từ vựng Các dụng cụ học tập - Level A</h1><div class=header-meta><button title="Bật chế độ Focus (phím F)" aria-pressed=false class=focus-toggle-btn id=btnFocusMode type=button><i class="fa-solid fa-expand" aria-hidden=true></i>Focus Mode</button><div id=subtitle-placeholder></div><div aria-label="Tiến độ bài tập" class=progress-container id=progress-area></div><div class=theme-switch-wrap><label title="Chuyển đổi giao diện" class=theme-toggle-switch><input id=themeToggleCheckbox type=checkbox> <span class=slider> <span class=slider-text id=themeToggleText>YOUTH</span> </span></label></div></div></div><div class=is-initially-hidden id=quiz-area><div id=focus-progress-row></div><div id=question-container></div><div class=controls><button class=btn id=prev-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class=btn id=next-btn type=button>Tiếp tục<i class="fa-solid fa-arrow-right"></i></button><button class="btn is-initially-hidden" id=submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=confirm-back-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class="btn is-initially-hidden" id=confirm-submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=reset-btn type=button>Làm lại</button></div></div><footer class=dec-footer>Bản quyền thuộc về DEC - thầy Đức tiếng Anh - 0966939583</footer></div><script>// --- DUKEGEM QUESTION BANK
const fullQuestionBank=[{q:`Em dùng đồ dùng nào để viết? Chọn từ tiếng Anh đúng.`,a:[{text:`pen`,correct:!0,explanation:`Đúng! Pen là bút mực, dùng để viết.`},{text:`cat`,explanation:`Sai: cat là con mèo, không phải dụng cụ dùng để viết.`,correct:!1},{text:`dog`,explanation:`Sai: dog là con chó, không phải dụng cụ dùng để viết.`,correct:!1},{text:`apple`,explanation:`Sai: apple là quả táo, không phải dụng cụ dùng để viết.`,correct:!1}]},{q:`Đây là dụng cụ dùng để viết bằng mực vào vở. Chọn từ tiếng Anh đúng.`,a:[{text:`chalk`,explanation:`Chalk có thể viết trên bảng, nhưng không phải dụng cụ dùng để viết bằng mực vào vở như stem yêu cầu.`,correct:!1},{text:`book`,explanation:`Sai: book là sách, không phải dụng cụ trực tiếp dùng để viết.`,correct:!1},{text:`pen`,correct:!0,explanation:`Chính xác! Pen là dụng cụ dùng để viết bằng mực.`},{text:`crayon`,explanation:`Crayon dùng để tô/vẽ bằng sáp, không phải dụng cụ viết bằng mực vào vở như stem yêu cầu.`,correct:!1}]},{q:`Câu tiếng Anh 'I use a pens to write.' nghĩa là 'Tôi dùng bút để viết'. Chọn phần sai cần sửa.`,a:[{text:`pens -> pen`,correct:!0,explanation:`Đúng rồi! 'pen' là từ đúng trong tình huống này đó em.`},{text:`use -> used`,explanation:`Sai: câu nói về thói quen hiện tại nên "use" đúng; lỗi nằm ở danh từ sau mạo từ "a".`,correct:!1},{text:`write -> read`,explanation:`Sai: "write" phù hợp với mục đích dùng bút; đổi thành "read" làm thay đổi nghĩa.`,correct:!1},{text:`a -> an`,explanation:`Sai: "pen" bắt đầu bằng phụ âm nên "a pen" đúng; cần sửa số nhiều "pens" thành "pen".`,correct:!1}]},{q:`Câu nào có nghĩa là: 'Đây là cây bút mực của tôi'?`,a:[{text:`This is my ruler.`,explanation:`Sai: "ruler" nghĩa là thước kẻ, không phải cây bút mực.`,correct:!1},{text:`This is my bag.`,explanation:`Sai: "bag" nghĩa là cặp/túi, không phải cây bút mực.`,correct:!1},{text:`This is my pen.`,correct:!0,explanation:`Chuẩn luôn! Em quan sát rất kỹ các dấu hiệu trong câu để chọn 'pen'.`},{text:`This is my pencil.`,explanation:`Sai: "pencil" là bút chì; câu yêu cầu "pen", tức bút mực.`,correct:!1}]},{q:`Đồ dùng nào của em viết bằng mực đỏ? Chọn từ tiếng Anh đúng.`,a:[{text:`sharpener`,explanation:`Sai: sharpener dùng để gọt bút chì, không viết ra mực đỏ.`,correct:!1},{text:`eraser`,explanation:`Sai: eraser dùng để xóa, không phải vật viết ra mực đỏ.`,correct:!1},{text:`pen`,correct:!0,explanation:`Giỏi quá! Em đã nắm vững kiến thức về vật dụng 'pen' rồi.`},{text:`ruler`,explanation:`Sai: ruler dùng để đo hoặc kẻ đường, không viết ra mực đỏ.`,correct:!1}]},{q:`Câu nào viết đúng về việc em dùng bút chì để viết?`,a:[{text:`I write with a pencil.`,correct:!0,explanation:`Câu ở hiện tại đơn với chủ ngữ I dùng động từ nguyên mẫu: 'I write with a pencil'.`},{text:`I writing with a pencil.`,explanation:`Sai ngữ pháp: sau chủ ngữ I cần động từ chia ở hiện tại đơn (write), không dùng writing nếu thiếu trợ động từ am.`,correct:!1},{text:`I am write with a pencil.`,explanation:`Sai ngữ pháp: sau am phải là V-ing (am writing), không phải động từ nguyên mẫu write.`,correct:!1},{text:`I writes with a pencil.`,explanation:`Sai hòa hợp chủ ngữ: I đi với write, không thêm -s như ngôi thứ ba số ít.`,correct:!1}]},{q:`Em muốn nói 'Em không có bút chì'. Chọn từ điền vào câu tiếng Anh: 'I ___ have a pencil.'`,a:[{text:`not`,explanation:`Sau chủ ngữ I, phủ định hiện tại đơn dùng 'do not' hoặc dạng rút gọn 'don't'; 'not' không đứng một mình.`,correct:!1},{text:`am not`,explanation:`'Am not' phải đi với tính từ, danh từ hoặc động từ -ing; câu này cần phủ định động từ 'have' bằng 'don't'.`,correct:!1},{text:`doesn't`,explanation:`Sai. Với chủ ngữ I phải dùng 'don't have'; 'doesn't' chỉ dùng cho he/she/it.`,correct:!1},{text:`don't`,correct:!0,explanation:`Sau chủ ngữ I, phủ định của 'have' ở hiện tại đơn là 'don't have': 'I don't have a pencil'.`}]},{q:`Chọn từ để hỏi 'Bạn có bút chì không?': '___ you have a pencil?'`,a:[{text:`Is`,explanation:`Sai. 'Is' dùng cho câu hỏi với động từ to be; 'have' là động từ thường nên cần trợ động từ 'Do'.`,correct:!1},{text:`Do`,correct:!0,explanation:`Câu hỏi hiện tại đơn với chủ ngữ you dùng 'Do' trước chủ ngữ: 'Do you have a pencil?'.`},{text:`Does`,explanation:`Sai. 'Does' đi với he/she/it; chủ ngữ 'you' phải dùng 'Do'.`,correct:!1},{text:`Are`,explanation:`Sai. 'Are' là to be, không tạo câu hỏi cho động từ thường 'have' trong câu này.`,correct:!1}]},{q:`Em dùng đồ dùng nào để vẽ một hình tròn? Chọn từ tiếng Anh đúng.`,a:[{text:`book`,explanation:`Sai. 'Book' là quyển sách để đọc, không phải dụng cụ dùng để vẽ hình tròn.`,correct:!1},{text:`map`,explanation:`Sai. 'Map' là bản đồ dùng để xem địa điểm hoặc đường đi, không dùng để vẽ hình tròn.`,correct:!1},{text:`clock`,explanation:`Sai. 'Clock' là đồng hồ dùng để xem giờ, không phải dụng cụ vẽ.`,correct:!1},{text:`pencil`,correct:!0,explanation:`Chính xác! 'Pencil' là bút chì, dụng cụ phù hợp để vẽ hình tròn.`}]},{q:`Bút chì ở trên đồ vật nào trong lớp, nơi em viết bài? Chọn từ tiếng Anh đúng.`,a:[{text:`tree`,explanation:`Sai. Trong lớp học, bút chì không được đặt trên cây; 'tree' là cái cây.`,correct:!1},{text:`sky`,explanation:`Sai. Bút chì không thể nằm trên bầu trời; 'sky' là bầu trời.`,correct:!1},{text:`river`,explanation:`Sai. Bút chì không nằm trên dòng sông trong bối cảnh lớp học; 'river' là dòng sông.`,correct:!1},{text:`desk`,correct:!0,explanation:`Chính xác! 'Desk' là bàn học, nơi bút chì có thể được đặt trong lớp học.`}]},{q:`Tìm lỗi sai: 'The ruler are long.'`,a:[{text:`The -> A`,explanation:`Sai. Đổi 'The' thành 'A' không sửa lỗi hòa hợp giữa 'ruler' và 'are'.`,correct:!1},{text:`ruler -> book`,explanation:`Sai. Đổi danh từ thành 'book' vẫn để lại lỗi 'book are'; lỗi cần sửa nằm ở 'are'.`,correct:!1},{text:`are -> is`,correct:!0,explanation:`Chính xác! 'The ruler' là chủ ngữ số ít nên phải dùng 'is': 'The ruler is long.'`},{text:`long -> short`,explanation:`Sai. Đổi tính từ 'long' thành 'short' không sửa lỗi chia động từ 'are'.`,correct:!1}]},{q:`Dịch sang tiếng Anh: 'Cây thước này ngắn.'`,a:[{text:`This ruler is short.`,correct:!0,explanation:`Chính xác! 'This ruler is short' dịch đúng là 'Cây thước này ngắn.'`},{text:`This ruler is long.`,explanation:`Sai. 'Long' nghĩa là dài, trái với 'short' nghĩa là ngắn trong câu tiếng Việt.`,correct:!1},{text:`I have a ruler.`,explanation:`Sai nghĩa. Câu này nghĩa là 'Tôi có một cây thước', không nói cây thước ngắn.`,correct:!1},{text:`This is a ruler.`,explanation:`Sai nghĩa. Câu này nghĩa là 'Đây là một cây thước', không mô tả độ dài.`,correct:!1}]},{q:`Đồ dùng nào của em đang ở trong hộp bút? Chọn từ tiếng Anh đúng.`,a:[{text:`desk`,explanation:`Sai. Bàn học quá lớn để nằm trong hộp bút; 'desk' nghĩa là bàn học.`,correct:!1},{text:`ruler`,correct:!0,explanation:`Chính xác! Thước kẻ là dụng cụ nhỏ gọn có thể nằm trong hộp bút.`},{text:`chair`,explanation:`Sai. Ghế ngồi quá lớn để nằm trong hộp bút; 'chair' nghĩa là cái ghế.`,correct:!1},{text:`school bag`,explanation:`Sai. Cặp sách có thể đựng hộp bút, không nằm bên trong hộp bút.`,correct:!1}]},{q:`Chọn từ tiếng Anh để hoàn thành câu: 'Phòng tối nên em ___ nhìn thấy thước.'`,a:[{text:`mustn't`,explanation:`Sai. 'Mustn't see' diễn tả điều bị cấm, không diễn tả không thể nhìn thấy vì phòng tối.`,correct:!1},{text:`can't`,correct:!0,explanation:`Chính xác! Phòng tối khiến người nói không thể nhìn thấy thước, nên dùng 'can't see'.`},{text:`am`,explanation:`Sai ngữ pháp. 'Am' không đứng trực tiếp trước động từ nguyên mẫu 'see'.`,correct:!1},{text:`not`,explanation:`Sai ngữ pháp. Không dùng 'not' một mình giữa chủ ngữ và động từ 'see'.`,correct:!1}]},{q:`Chọn từ tiếng Anh để hoàn thành câu hỏi: '___ đây là cục tẩy?'`,a:[{text:`Are`,explanation:`Sai. 'This' là số ít nên không dùng 'Are'; câu hỏi cần 'Is'.`,correct:!1},{text:`Is`,correct:!0,explanation:`'This' là chủ ngữ số ít và câu hỏi yes/no với động từ be dùng 'Is': 'Is this an eraser?'.`},{text:`Do`,explanation:`Sai. 'Do' dùng với động từ thường, còn câu này hỏi với động từ to be 'is'.`,correct:!1},{text:`Does`,explanation:`Sai. 'Does' dùng với động từ thường; câu hỏi này cần đảo động từ to be 'is'.`,correct:!1}]},{q:`Em cần một đồ dùng để xóa lỗi viết. Đó là một ___. Chọn từ tiếng Anh đúng.`,a:[{text:`ruler`,explanation:`Sai. Thước kẻ không phải dụng cụ dùng để xóa lỗi viết; câu cần một vật để tẩy.`,correct:!1},{text:`pencil`,explanation:`Sai. Bút chì dùng để viết, không phải dụng cụ sửa lỗi bằng cách xóa.`,correct:!1},{text:`eraser`,correct:!0,explanation:`Sau mạo từ 'an' cần danh từ bắt đầu bằng nguyên âm; eraser là dụng cụ dùng để sửa lỗi viết.`},{text:`pen`,explanation:`Sai. Bút mực không dùng để xóa lỗi; danh từ sau 'an' phải là dụng cụ phù hợp với mục đích sửa.`,correct:!1}]},{q:`A: 'Is it an eraser?' - B: 'Yes, it ___.'`,a:[{text:`am`,explanation:`Sai. Với chủ ngữ 'it', câu trả lời ngắn phải dùng 'is', không dùng 'am'.`,correct:!1},{text:`do`,explanation:`Sai. 'Do' không dùng trong câu trả lời ngắn cho câu hỏi với 'Is'; với chủ ngữ 'it' phải dùng 'is'.`,correct:!1},{text:`is`,correct:!0,explanation:`Câu trả lời ngắn phải lặp lại động từ be của câu hỏi: 'it is', nên chọn 'is'.`},{text:`are`,explanation:`Sai. Với chủ ngữ 'it', câu trả lời ngắn dùng 'is', không dùng 'are'.`,correct:!1}]},{q:`Tìm lỗi sai: 'I has an eraser.'`,a:[{text:`has -> have`,correct:!0,explanation:`Chủ ngữ I đi với 'have', không đi với 'has'; vì vậy sửa 'I has' thành 'I have'.`},{text:`eraser -> erasers`,explanation:`Sai. 'An eraser' là danh từ số ít đúng; đổi thành 'erasers' sẽ không sửa lỗi hòa hợp 'I has'.`,correct:!1},{text:`I -> He`,explanation:`Sai. Đổi chủ ngữ thành 'He' làm thay đổi câu, nhưng vẫn không sửa lỗi cần tìm ở 'has'.`,correct:!1},{text:`an -> a`,explanation:`Sai. 'An eraser' đúng vì 'eraser' bắt đầu bằng nguyên âm; lỗi duy nhất là 'I has' phải thành 'I have'.`,correct:!1}]},{q:`Câu nào là: 'Đừng làm mất cục tẩy của bạn'?`,a:[{text:`Don't use your eraser.`,explanation:`Sai. 'Don't use' nghĩa là đừng sử dụng, không phải đừng làm mất.`,correct:!1},{text:`Don't sell your eraser.`,explanation:`Sai nghĩa. 'Sell' nghĩa là bán, không phải 'lose' nghĩa là làm mất.`,correct:!1},{text:`Don't lose your eraser.`,correct:!0,explanation:`Động từ 'lose' nghĩa là làm mất, nên câu mệnh lệnh phủ định này khớp với nghĩa tiếng Việt.`},{text:`Don't buy your eraser.`,explanation:`Sai. 'Don't buy' nghĩa là đừng mua, khác với hành động làm mất được hỏi.`,correct:!1}]},{q:`Đồ dùng nào đang ở trên bàn? Chọn từ tiếng Anh đúng.`,a:[{text:`cloud`,explanation:`Sai. Mây ở trên trời, không nằm trên mặt bàn.`,correct:!1},{text:`sun`,explanation:`Sai. Mặt trời không phải đồ vật có thể đặt trên bàn.`,correct:!1},{text:`moon`,explanation:`Sai. Mặt trăng ở trên bầu trời, không thể đặt trên bàn.`,correct:!1},{text:`book`,correct:!0,explanation:`'Book' là đồ vật có thể đặt trên bàn; các lựa chọn còn lại là vật thể tự nhiên không phù hợp với vị trí này.`}]},{q:`Chọn từ tiếng Anh để hoàn thành câu: 'Bây giờ em ___ đọc sách.'`,a:[{text:`do`,explanation:`Sai. 'Do reading' không tạo hiện tại tiếp diễn; với chủ ngữ I phải dùng 'am reading'.`,correct:!1},{text:`are`,explanation:`Sai. 'Are' dùng với you/we/they, còn chủ ngữ 'I' phải dùng 'am'.`,correct:!1},{text:`is`,explanation:`Sai. 'Is' dùng cho he/she/it; chủ ngữ 'I' dùng 'am'.`,correct:!1},{text:`am`,correct:!0,explanation:`Chủ ngữ I dùng 'am' trong hiện tại tiếp diễn: 'I am reading a book now'.`}]},{q:`Chọn từ tiếng Anh để hoàn thành câu: 'Em ___ đóng sách.'`,a:[{text:`don't`,correct:!0,explanation:`Phủ định hiện tại đơn với chủ ngữ I dùng 'don't' trước động từ nguyên mẫu 'close'.`},{text:`no`,explanation:`Sai. 'No' không đứng trước động từ nguyên mẫu; phủ định phải dùng 'don't close'.`,correct:!1},{text:`am not`,explanation:`Sai. 'Am not' dùng với tính từ hoặc V-ing; 'close' là động từ thường cần 'don't'.`,correct:!1},{text:`doesn't`,explanation:`Sai. 'Doesn't' dùng cho he/she/it, không dùng với chủ ngữ 'I'.`,correct:!1}]},{q:`A: 'Do you like books?' - B: 'Yes, I ___.'`,a:[{text:`do`,correct:!0,explanation:
