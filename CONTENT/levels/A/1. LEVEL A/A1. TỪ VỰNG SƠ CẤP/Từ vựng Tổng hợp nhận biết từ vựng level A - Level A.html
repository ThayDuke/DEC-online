 nè.`,correct:!1}]},{q:`Con vật nào có thể bay?`,a:[{text:`Bird`,correct:!0,explanation:`Đúng! Loài chim "bird" có đôi cánh nên có thể bay lượn.`},{text:`Dog`,explanation:`Chú chó không biết bay đâu em.`,correct:!1},{text:`Cat`,explanation:`Con mèo cũng chỉ leo trèo giỏi thôi.`,correct:!1},{text:`Fish`,explanation:`Con cá thì bơi lội dưới nước em nhé.`,correct:!1}]},{q:`Cái gì lạnh và ngọt mà em thích ăn vào mùa hè?`,a:[{text:`Ice cream`,correct:!0,explanation:`Chính xác! Kem "ice cream" mát lạnh là món khoái khẩu ngày hè.`},{text:`Bread`,explanation:`Bánh mì "bread" thường không lạnh em nhé.`,correct:!1},{text:`Soup`,explanation:`Súp "soup" thường ăn nóng mới ngon.`,correct:!1},{text:`Rice`,explanation:`Cơm "rice" là món ăn chính mỗi ngày nè.`,correct:!1}]},{q:`Chọn câu chào đúng khi gặp cô giáo:`,a:[{text:`Hello teacher!`,correct:!0,explanation:`Chuẩn luôn! "Hello teacher" là lời chào lịch sự và lễ phép.`},{text:`Bye teacher!`,explanation:`Gặp mặt không nói "bye" em nhé.`,correct:!1},{text:`Good morning bread!`,explanation:`Không ai chào mẩu bánh mì cả đâu.`,correct:!1},{text:`Hello apple!`,explanation:`Chào quả táo thì lạ quá đúng không nào?`,correct:!1}]},{q:`Bầu trời trong xanh là màu gì?`,a:[{text:`blue`,correct:!0,explanation:`Giỏi! Màu xanh dương "blue" là màu đặc trưng của bầu trời.`},{text:`red`,explanation:`Màu đỏ "red" chỉ thấy lúc hoàng hôn thôi em.`,correct:!1},{text:`black`,explanation:`Màu đen "black" là khi trời đã đêm rồi.`,correct:!1},{text:`white`,explanation:`Màu trắng "white" là của những đám mây xinh xắn.`,correct:!1}]},{q:`Dịch sang tiếng Anh: "Giáo viên"`,a:[{text:`teacher`,correct:!0,explanation:`Chính xác! "Teacher" là người truyền dạy kiến thức cho em.`},{text:`student`,explanation:`Học sinh là "student" em nhé.`,correct:!1},{text:`artist`,explanation:`“artist” cùng nhóm từ vựng nhưng không đúng nghĩa được hỏi; đáp án phù hợp là “teacher”.`,correct:!1},{text:`class`,explanation:`Lớp học là "class" đó.`,correct:!1}]},{q:`Em đặt sách vở lên
