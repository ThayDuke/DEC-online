const fullQuestionBank=[{q:`Con vật nào thường được gọi là bạn của con người và có thể trông nhà? 🐶`,a:[{text:`Dog`,correct:!0,explanation:`Chính xác! Dog nghĩa là chó; chó thường được nuôi làm bạn đồng hành và trông nhà.`},{text:`Tiger`,explanation:`Sai. Tiger nghĩa là hổ, một loài mèo lớn hoang dã, không phải thú nuôi thông thường.`,correct:!1},{text:`Lion`,explanation:`Sai. Lion nghĩa là sư tử, sống hoang dã và không phải đáp án cho thú nuôi thân thiết này.`,correct:!1},{text:`Snake`,explanation:`Sai. Snake nghĩa là rắn, là loài bò sát, không phải con vật được hỏi.`,correct:!1}]},{q:`Con mèo thích bắt chuột là con gì? 🐱`,a:[{text:`Cat`,correct:!0,explanation:`Chính xác! Cat nghĩa là con mèo, phù hợp với mô tả bắt chuột.`},{text:`Dog`,explanation:`Sai. Dog nghĩa là con chó, không phải con mèo.`,correct:!1},{text:`Bird`,explanation:`Sai. Bird nghĩa là con chim, không phải con mèo bắt chuột.`,correct:!1},{text:`Fish`,explanation:`Sai. Fish nghĩa là con cá, sống dưới nước, không phải con mèo.`,correct:!1}]},{q:`Con vật nào biết bơi và thường kêu 'quạc quạc'? 🦆`,a:[{text:`Duck`,correct:!0,explanation:`Chính xác! Duck nghĩa là con vịt, phù hợp với tiếng kêu quạc quạc và khả năng bơi.`},{text:`Chicken`,explanation:`Sai. Chicken nghĩa là con gà; tiếng gà không phải tiếng quạc quạc.`,correct:!1},{text:`Lion`,explanation:`Sai. Lion nghĩa là sư tử, không phù hợp với tiếng kêu của vịt.`,correct:!1},{text:`Tiger`,explanation:`Sai. Tiger nghĩa là hổ, không phải con vật được mô tả.`,correct:!1}]},{q:`Con gì có cái vòi rất dài? 🐘`,a:[{text:`Elephant`,correct:!0,explanation:`Chính xác! Elephant nghĩa là con voi, loài vật có vòi dài.`},{text:`Monkey`,explanation:`Sai. Monkey nghĩa là con khỉ; khỉ không có vòi dài.`,correct:!1},{text:`Snake`,explanation:`Sai. Snake nghĩa là con rắn, có thân dài nhưng không có vòi.`,correct:!1},{text:`Bear`,explanation:`Sai. Bear nghĩa là con gấu, không có cái vòi đặc trưng.`,correct:!1}]},{q:`Con gì thích ăn chuối và leo trèo giỏi? 🐒`,a:[{text:`Monkey`,correct:!0,explanation:`Chính xác! Monkey nghĩa là con khỉ, phù hợp với việc ăn chuối và leo trèo.`},{text:`Panda`,explanation:`Sai. Panda nghĩa là gấu trúc, thường gắn với tre, không phải khỉ.`,correct:!1},{text:`Rabbit`,explanation:`Sai. Rabbit nghĩa là con thỏ; thỏ không phải con vật được mô tả leo trèo và ăn chuối.`,correct:!1},{text:`Sheep`,explanation:`Sai. Sheep nghĩa là con cừu, không phù hợp với mô tả này.`,correct:!1}]},{q:`Con gì gáy 'ò ó o' báo thức mọi người? 🐓`,a:[{text:`Rooster`,correct:!0,explanation:`Chính xác! Rooster nghĩa là gà trống, con vật thường gáy vào buổi sáng.`},{text:`Bird`,explanation:`Sai. Bird nghĩa là chim nói chung; tiếng 'ò ó o' là tiếng gà trống.`,correct:!1},{text:`Cow`,explanation:`Sai. Cow nghĩa là con bò, kêu 'moo', không gáy 'ò ó o'.`,correct:!1},{text:`Goat`,explanation:`Sai. Goat nghĩa là con dê, không phải gà trống.`,correct:!1}]},{q:`Con gì có đôi tai dài và thích ăn cà rốt? 🐰`,a:[{text:`Rabbit`,correct:!0,explanation:`Chính xác! Rabbit nghĩa là con thỏ, có tai dài và thường được minh họa ăn cà rốt.`},{text:`Mouse`,explanation:`Sai. Mouse nghĩa là con chuột; chuột không có đôi tai dài như mô tả.`,correct:!1},{text:`Horse`,explanation:`Sai. Horse nghĩa là con ngựa, không phải con vật nhỏ có tai dài trong câu.`,correct:!1},{text:`Bee`,explanation:`Sai. Bee nghĩa là con ong, một loài côn trùng biết bay.`,correct:!1}]},{q:`Con gì to lớn, có bờm và là chúa sơn lâm? 🦁`,a:[{text:`Lion`,correct:!0,explanation:`Chính xác! Lion nghĩa là sư tử, con vật lớn có bờm.`},{text:`Tiger`,explanation:`Sai. Tiger nghĩa là hổ; hổ có vằn nhưng không có bờm.`,correct:!1},{text:`Wolf`,explanation:`Sai. Wolf nghĩa là sói, nhỏ hơn sư tử và không có bờm.`,correct:!1},{text:`Fox`,explanation:`Sai. Fox nghĩa là cáo, không phải loài vật lớn có bờm.`,correct:!1}]},{q:`Con gì có sọc đen vàng và rất hung dữ? 🐯`,a:[{text:`Tiger`,correct:!0,explanation:`Chính xác! Tiger nghĩa là con hổ, loài có sọc đen vàng.`},{text:`Lion`,explanation:`Sai. Lion nghĩa là sư tử; sư tử không có sọc đen vàng.`,correct:!1},{text:`Zebra`,explanation:`Sai. Zebra nghĩa là ngựa vằn, có sọc đen trắng, không phải đen vàng.`,correct:!1},{text:`Cat`,explanation:`Sai. Cat nghĩa là mèo, không phù hợp với mô tả loài thú lớn hung dữ.`,correct:!1}]},{q:`Con gì cho chúng ta sữa và kêu 'moo'? 🐄`,a:[{text:`Cow`,correct:!0,explanation:`Chính xác! Cow nghĩa là con bò, thường cho sữa và kêu 'moo'.`},{text:`Pig`,explanation:`Sai. Pig nghĩa là con lợn, thường kêu 'oink', không phải 'moo'.`,correct:!1},{text:`Sheep`,explanation:`Sai. Sheep nghĩa là con cừu, không phải con bò cho sữa trong câu này.`,correct:!1},{text:`Horse`,explanation:`Sai. Horse nghĩa là con ngựa, không kêu 'moo'.`,correct:!1}]},{q:`Con gì có sọc đen trắng khắp cơ thể? 🦓`,a:[{text:`Zebra`,correct:!0,explanation:`Đúng rồi! Zebra là ngựa vằn.`},{text:`Horse`,explanation:`Horse là ngựa, không có các sọc đen trắng đặc trưng của zebra.`,correct:!1},{text:`Tiger`,explanation:`Tiger có sọc nhưng thường là đen cam, không phải kiểu đen trắng của zebra.`,correct:!1},{text:`Cow`,explanation:`Cow có thể có mảng màu nhưng không có sọc đen trắng khắp cơ thể.`,correct:!1}]},{q:`Con gì cổ rất dài để ăn lá trên cao? 🦒`,a:[{text:`Giraffe`,correct:!0,explanation:`Chính xác! Giraffe là hươu cao cổ.`},{text:`Deer`,explanation:`Deer có cổ ngắn hơn và không nổi bật với khả năng ăn lá trên cao.`,correct:!1},{text:`Elephant`,explanation:`Elephant có vòi dài nhưng không có chiếc cổ rất dài như mô tả.`,correct:!1},{text:`Camel`,explanation:`Camel có bướu để sống ở sa mạc, không có cổ đặc trưng như giraffe.`,correct:!1}]},{q:`Con gì sống dưới nước, có vây và thở bằng mang? 🐟`,a:[{text:`Fish`,correct:!0,explanation:`Đúng rồi! Cá sống dưới nước, có vây và thở bằng mang.`},{text:`Bird`,explanation:`Bird là chim; chim có cánh và không thở bằng mang.`,correct:!1},{text:`Frog`,explanation:`Frog là ếch; ếch có thể bơi nhưng không có vây và mang như cá.`,correct:!1},{text:`Spider`,explanation:`Spider là nhện, không sống dưới nước và không có vây.`,correct:!1}]},{q:`Con gì nhảy loăng quăng và kêu 'ộp ộp'? 🐸`,a:[{text:`Frog`,correct:!0,explanation:`Chính xác! Frog là con ếch.`},{text:`Fish`,explanation:`Fish sống dưới nước và không kêu 'ộp ộp' như frog.`,correct:!1},{text:`Snake`,explanation:`Snake bò sát trên đất, không nhảy loăng quăng và không có tiếng kêu này.`,correct:!1},{text:`Turtle`,explanation:`Turtle di chuyển chậm với mai cứng, không nhảy như frog.`,correct:!1}]},{q:`Con gì có bốn chân, mai cứng trên lưng và đi rất chậm? 🐢`,a:[{text:`Turtle`,correct:!0,explanation:`Bốn chân và mai cứng là đặc điểm của turtle (rùa).`},{text:`Snail`,explanation:`Snail có vỏ nhưng không có bốn chân.`,correct:!1},{text:`Crab`,explanation:`Crab có nhiều chân và mai dẹt, không phải bốn chân.`,correct:!1},{text:`Shrimp`,explanation:`Shrimp sống dưới nước và không có mai cứng cùng bốn chân như mô tả.`,correct:!1}]},{q:`Con gì thích ăn mật ong và rất to béo? 🐻`,a:[{text:`Bear`,correct:!0,explanation:`Chính xác! Bear là con gấu.`},{text:`Panda`,explanation:`Panda là gấu trúc, thường gắn với tre hơn là mô tả con vật to béo ăn mật ong.`,correct:!1},{text:`Lion`,explanation:`Lion là sư tử, không có thói quen ăn mật ong trong ngữ cảnh này.`,correct:!1},{text:`Dog`,explanation:`Dog là thú nuôi, không khớp con vật to béo thích ăn mật ong.`,correct:!1}]},{q:`Con gì chỉ ăn tre và có mắt thâm quầng? 🐼`,a:[{text:`Panda`,correct:!0,explanation:`Đúng rồi! Panda là gấu trúc.`},{text:`Bear`,explanation:`Bear là gấu nói chung; câu hỏi khóa bằng thức ăn tre và mắt thâm quầng của panda.`,correct:!1},{text:`Koala`,explanation:`Koala là gấu túi, thường ăn lá bạch đàn chứ không chỉ ăn tre.`,correct:!1},{text:`Rabbit`,explanation:`Rabbit có thể ăn rau nhưng không có đặc điểm mắt thâm quầng và ăn tre này.`,correct:!1}]},{q:`Con gì có 8 chân và hay giăng tơ? 🕷️`,a:[{text:`Spider`,correct:!0,explanation:`Chính xác! Spider là con nhện.`},{text:`Ant`,explanation:`Ant có sáu chân và không giăng tơ.`,correct:!1},{text:`Bee`,explanation:`Bee có sáu chân, cánh và làm tổ; không có tám chân hay giăng tơ.`,correct:!1},{text:`Fly`,explanation:`Fly có sáu chân và bay, không giăng tơ như spider.`,correct:!1}]},{q:`Con gì làm ra mật ngọt cho chúng ta? 🐝`,a:[{text:`Bee`,correct:!0,explanation:`Đúng rồi! Bee là con ong.`},{text:`Butterfly`,explanation:`Butterfly hút mật hoa nhưng không làm ra mật ong cho con người.`,correct:!1},{text:`Bird`,explanation:`Bird là chim, không sản xuất mật ong.`,correct:!1},{text:`Ant`,explanation:`Ant là kiến, không làm ra mật ong trong tổ ong.`,correct:!1}]},{q:`Con gì có cánh nhiều màu, không có ngòi và thường đậu trên hoa? 🦋`,a:[{text:`Butterfly`,correct:!0,explanation:`Cánh phủ vảy nhiều màu và không có ngòi là đặc điểm của butterfly (bướm).`},{text:`Bee`,explanation:`Bee có ngòi và thân sọc; câu hỏi loại ong bằng chi tiết không có ngòi.`,correct:!1},{text:`Bird`,explanation:`Bird có lông vũ, không phải cánh phủ vảy.`,correct:!1},{text:`Dragonfly`,explanation:`Dragonfly có cánh trong suốt, không có cánh phủ vảy nhiều màu.`,correct:!1}]},{q:`Con gì biết bay và hót líu lo trên cành cây? 🐦`,a:[{text:`Bird`,correct:!0,explanation:`Đúng rồi! Bird là con chim.`},{text:`Bat`,explanation:`Bat biết bay nhưng thường hoạt động ban đêm và không hót líu lo trên cành cây.`,correct:!1},{text:`Chicken`,explanation:`Chicken là gà, thường sống trên mặt đất và không khớp mô tả chim hót trên cành.`,correct:!1},{text:`Duck`,explanation:`Duck biết bơi và kêu quạc quạc, không phải chim hót líu lo trên cành.`,correct:!1}]},{q:`Con gì nhỏ bé, sống cùng nhiều con khác dưới đất và thường tha thức ăn về tổ? 🐜`,a:[{text:`Ant`,correct:!0,explanation:`Sống thành đàn dưới đất và tha mồi về tổ là đặc điểm của ant (kiến).`},{text:`Bee`,explanation:`Bee sống trong tổ ong và không tha mồi trên mặt đất như mô tả.`,correct:!1},{text:`Spider`,explanation:`Spider thường sống một mình và giăng tơ, không sống thành đàn dưới đất.`,correct:!1},{text:`Worm`,explanation:`Worm không sống thành đàn có tổ và tha mồi.`,correct:!1}]},{q:`Con gì có bờm dài, thường được cưỡi để đua và chạy rất nhanh? 🐎`,a:[{text:`Horse`,correct:!0,explanation:`Bờm dài và dùng để cưỡi đua là dấu hiệu của horse (ngựa).`},{text:`Donkey`,explanation:`Donkey có thể chở người nhưng không phải loài có bờm dài dùng để đua trong câu này.`,correct:!1},{text:`Cow`,explanation:`Cow không có bờm dài và không được cưỡi để đua.`,correct:!1},{text:`Zebra`,explanation:`Zebra có sọc đen trắng và không thường được cưỡi để đua.`,correct:!1}]},{q:`Con gì có lông xù phủ dày, thường được lấy len? 🐑`,a:[{text:`Sheep`,correct:!0,explanation:`Cừu có lớp lông dày và là nguồn len; 'sheep' là đáp án đúng.`},{text:`Goat`,explanation:`Goat là dê; dê không phải vật nuôi được mô tả lấy len trong câu này.`,correct:!1},{text:`Dog`,explanation:`Dog là chó, không phải loài cho len.`,correct:!1},{text:`Pig`,explanation:`Pig là lợn, không có lớp lông cho len.`,correct:!1}]},{q:`Con gì có râu, sừng cong và thường leo chỗ dốc? 🐐`,a:[{text:`Goat`,correct:!0,explanation:`Dê thường có râu, sừng cong và leo tốt; 'goat' là đáp án đúng.`},{text:`Sheep`,explanation:`Sheep là cừu; câu hỏi nêu bộ râu và khả năng leo dốc đặc trưng của dê.`,correct:!1},{text:`Cow`,explanation:`Cow là bò, không có đặc điểm leo địa hình dốc như mô tả.`,correct:!1},{text:`Deer`,explanation:`Deer là hươu; câu hỏi đang mô tả dê có râu và sừng cong.`,correct:!1}]},{q:`Con gì ủn ỉn, thích ăn và ngủ? 🐷`,a:[{text:`Pig`,correct:!0,explanation:`Chính xác! Pig là con lợn.`},{text:`Hippo`,explanation:`Hippo là hà mã, không phát ra tiếng ủn ỉn đặc trưng của pig.`,correct:!1},{text:`Elephant`,explanation:`Elephant là voi, không khớp tiếng kêu ủn ỉn trong stem.`,correct:!1},{text:`Dog`,explanation:`Dog là chó và thường sủa, không ủn ỉn như pig.`,correct:!1}]},{q:`Con gì không có chân, có vảy và trườn trên đất? 🐍`,a:[{text:`Snake`,correct:!0,explanation:`Đúng rồi! Snake là rắn; rắn không có chân, có vảy và di chuyển bằng cách bò sát.`},{text:`Worm`,explanation:`Sai. Worm là sâu
