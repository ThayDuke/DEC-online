const fullQuestionBank=[{q:`"Teacher" nghĩa là gì trong tiếng Việt?`,a:[{text:`Học sinh`,explanation:`Sai. 'Học sinh' là 'student'; 'teacher' nghĩa là giáo viên.`,correct:!1},{text:`Giáo viên`,correct:!0,explanation:`Trong tiếng Anh, "teacher" dùng để chỉ thầy giáo hoặc cô giáo (giáo viên).`},{text:`Bác sĩ`,explanation:`Sai. 'Bác sĩ' là 'doctor'; 'teacher' nghĩa là giáo viên.`,correct:!1},{text:`Công nhân`,explanation:`Sai. 'Công nhân' là 'worker'; 'teacher' nghĩa là giáo viên.`,correct:!1}]},{q:`Từ nào sau đây có nghĩa là "Bác sĩ"?`,a:[{text:`Nurse`,explanation:`Sai. 'Nurse' nghĩa là y tá; bác sĩ là 'doctor'.`,correct:!1},{text:`Doctor`,correct:!0,explanation:`"Doctor" là từ vựng chỉ bác sĩ - người chăm sóc sức khỏe cho mọi người.`},{text:`Singer`,explanation:`Sai. 'Singer' nghĩa là ca sĩ, không phải bác sĩ.`,correct:!1},{text:`Pilot`,explanation:`Sai. 'Pilot' nghĩa là phi công, không phải bác sĩ.`,correct:!1}]},{q:`Điền từ đúng vào chỗ trống: "My mother is a _____. She sings very well."`,a:[{text:`singer`,correct:!0,explanation:`Vì câu sau nói về việc hát hay ("sings well") nên nghề nghiệp phù hợp là ca sĩ (singer).`},{text:`farmer`,explanation:`Sai. 'Farmer' nghĩa là nông dân; không khớp với hành động hát hay.`,correct:!1},{text:`driver`,explanation:`Sai. 'Driver' nghĩa là tài xế, không phải nghề gắn với việc hát.`,correct:!1},{text:`student`,explanation:`Sai. 'Student' nghĩa là học sinh; câu mô tả người hát hay là 'singer'.`,correct:!1}]},{q:`A: "What does your father do?" - B: "He works on a farm. He is a _____."`,a:[{text:`worker`,explanation:`Sai. 'Worker' là người lao động nói chung; gợi ý yêu cầu nông dân là 'farmer'.`,correct:!1},{text:`teacher`,explanation:`Sai. 'Teacher' nghĩa là giáo viên, không phải nông dân.`,correct:!1},{text:`farmer`,correct:!0,explanation:`Từ "farmer" có nghĩa là nông dân, người làm việc trên cánh đồng.`},{text:`dentist`,explanation:`Sai. 'Dentist' nghĩa là nha sĩ, không phải nông dân.`,correct:!1}]},{q:`Người lái máy bay được gọi là gì trong tiếng Anh?`,a:[{text:`Driver`,explanation:`Sai. 'Driver' là tài xế; người lái máy bay là 'pilot'.`,correct:!1},{text:`Pilot`,correct:!0,explanation:`Trong tiếng Anh, "pilot" là phi công, người điều khiển máy bay.`},{text:`Cook`,explanation:`Sai. 'Cook' nghĩa là đầu bếp, không phải phi công.`,correct:!1},{text:`Artist`,explanation:`Sai. 'Artist' nghĩa là họa sĩ/nghệ sĩ, không phải phi công.`,correct:!1}]},{q:`Từ "Nurse" có nghĩa là gì?`,a:[{text:`Y tá`,correct:!0,explanation:`"Nurse" là y tá, người hỗ trợ bác sĩ chăm sóc bệnh nhân.`},{text:`Bác sĩ`,explanation:`Sai. 'Bác sĩ' là 'doctor'; 'nurse' nghĩa là y tá.`,correct:!1},{text:`Học sinh`,explanation:`Sai. 'Học sinh' là 'student', không phải y tá.`,correct:!1},{text:`Ca sĩ`,explanation:`Sai. 'Ca sĩ' là 'singer', không phải y tá.`,correct:!1}]},{q:`Chọn câu đúng để giới thiệu: "Tôi là một học sinh."`,a:[{text:`I am a student.`,correct:!0,explanation:`Cấu trúc đúng là "I am a" + danh từ chỉ nghề nghiệp số ít.`},{text:`I is a student.`,explanation:`Sai. Với chủ ngữ 'I', động từ to be phải là 'am', không phải 'is'.`,correct:!1},{text:`I am student.`,explanation:`Sai. Danh từ nghề nghiệp số ít cần mạo từ 'a': 'I am a student'.`,correct:!1},{text:`I are a student.`,explanation:`Sai. Với chủ ngữ 'I' dùng 'am', không dùng 'are'.`,correct:!1}]},{q:`Người làm việc ở văn phòng hoặc nhà máy thường được gọi là:`,a:[{text:`Farmer`,explanation:`Sai. 'Farmer' nghĩa là nông dân; người làm việc ở văn phòng hoặc nhà máy là 'worker'.`,correct:!1},{text:`Worker`,correct:!0,explanation:`"Worker" có nghĩa là công nhân hoặc người lao động nói chung.`},{text:`Dentist`,explanation:`Sai. 'Dentist' nghĩa là nha sĩ, không phải người lao động nói chung.`,correct:!1},{text:`Firefighter`,explanation:`Sai. 'Firefighter' nghĩa là lính cứu hỏa, không phải 'worker' trong câu này.`,correct:!1}]},{q:`Từ nào chỉ người nấu ăn chuyên nghiệp trong nhà hàng?`,a:[{text:`Cook`,correct:!0,explanation:`"Cook" (hoặc chef) là từ dùng để chỉ đầu bếp, người nấu ăn.`},{text:`Pilot`,explanation:`Sai. 'Pilot' nghĩa là phi công, không phải người nấu ăn.`,correct:!1},{text:`Teacher`,explanation:`Sai. 'Teacher' nghĩa là giáo viên, không phải đầu bếp.`,correct:!1},{text:`Singer`,explanation:`Sai. 'Singer' nghĩa là ca sĩ, không phải đầu bếp.`,correct:!1}]},{q:`A: "Is he a policeman?" - B: "Yes, _____."`,a:[{text:`he is`,correct:!0,explanation:`Câu hỏi bắt đầu bằng "Is he" thì câu trả lời khẳng định ngắn là "Yes, he is."`},{text:`she is`,explanation:`Sai. Câu hỏi dùng 'he' nên câu trả lời phải giữ đại từ 'he', không đổi thành 'she'.`,correct:!1},{text:`he does`,explanation:`Sai. Câu hỏi bắt đầu bằng 'Is', nên câu trả lời ngắn dùng 'is', không dùng 'does'.`,correct:!1},{text:`I am`,explanation:`Sai. Chủ ngữ trong câu hỏi là 'he', không phải 'I'; câu trả lời là 'he is'.`,correct:!1}]},{q:`"Policeman" có nghĩa là gì?`,a:[{text:`Chú bộ đội`,explanation:`Sai. 'Chú bộ đội' là người lính; 'policeman' nghĩa là nam cảnh sát.`,correct:!1},{text:`Chú cảnh sát`,correct:!0,explanation:`"Policeman" là nam cảnh sát, người giữ gìn trật tự an ninh.`},{text:`Chú bảo vệ`,explanation:`Sai. 'Chú bảo vệ' là security guard; 'policeman' là cảnh sát.`,correct:!1},{text:`Chú lái xe`,explanation:`Sai. 'Chú lái xe' là driver; 'policeman' nghĩa là cảnh sát nam.`,correct:!1}]},{q:`Từ nào sau đây viết ĐÚNG chính tả?`,a:[{text:`Docter`,explanation:`Sai chính tả. Từ đúng là 'doctor', không phải 'docter'.`,correct:!1},{text:`Doctor`,correct:!0,explanation:`Từ "bác sĩ" trong tiếng Anh viết chính xác là "doctor".`},{text:`Doctur`,explanation:`Sai chính tả. Từ đúng là 'doctor', không phải 'doctur'.`,correct:!1},{text:`Dotor`,explanation:`Sai chính tả. 'Dotor' thiếu chữ 'c'; cách viết đúng là 'doctor'.`,correct:!1}]},{q:`Điền từ: "She paints beautiful pictures. She is an _____."`,a:[{text:`artist`,correct:!0,explanation:`Người vẽ tranh ("paints pictures") là họa sĩ (artist).`},{text:`nurse`,explanation:`Sai. 'Nurse' nghĩa là y tá; người vẽ tranh là 'artist'.`,correct:!1},{text:`worker`,explanation:`Sai. 'Worker' nghĩa là người lao động, không nói riêng người vẽ tranh.`,correct:!1},{text:`dentist`,explanation:`Sai. 'Dentist' nghĩa là nha sĩ; người vẽ tranh là 'artist'.`,correct:!1}]},{q:`Người khám và chữa răng được gọi là gì trong tiếng Anh?`,a:[{text:`Dentist`,correct:!0,explanation:`"Dentist" là từ vựng chỉ nha sĩ, người chuyên chăm sóc răng miệng.`},{text:`Doctor`,explanation:`Sai. 'Doctor' nghĩa là bác sĩ nói chung; nha sĩ là 'dentist'.`,correct:!1},{text:`Farmer`,explanation:`Sai. 'Farmer' nghĩa là nông dân, không phải nha sĩ.`,correct:!1},{text:`Driver`,explanation:`Sai. 'Driver' nghĩa là tài xế, không phải nha sĩ.`,correct:!1}]},{q:`A: "What _____ you do?" - B: "I am a student."`,a:[{text:`is`,explanation:`Sai. Với chủ ngữ 'you', câu hỏi nghề nghiệp dùng trợ động từ 'do', không phải 'is'.`,correct:!1},{text:`are`,explanation:`Sai. 'Are' là động từ to be; cấu trúc này cần 'do' trước chủ ngữ 'you'.`,correct:!1},{text:`do`,correct:!0,explanation:`Cấu trúc hỏi nghề nghiệp của bạn là "What do you do?"`},{text:`does`,explanation:`Sai. 'Does' dùng với he/she/it; chủ ngữ 'you' đi với 'do'.`,correct:!1}]},{q:`Người lái xe buýt hoặc xe ô tô được gọi là:`,a:[{text:`Pilot`,explanation:`Sai. 'Pilot' nghĩa là phi công; người lái xe là 'driver'.`,correct:!1},{text:`Driver`,correct:!0,explanation:`"Driver" bắt nguồn từ động từ "drive" (lái xe), có nghĩa là tài xế.`},{text:`Worker`,explanation:`Sai. 'Worker' nghĩa là người lao động, không chỉ người lái xe.`,correct:!1},{text:`Farmer`,explanation:`Sai. 'Farmer' nghĩa là nông dân; tài xế là 'driver'.`,correct:!1}]},{q:`"Firefighter" là nghề gì?`,a:[{text:`Lính cứu hỏa`,correct:!0,explanation:`"Fire" là lửa, "fighter" là người chiến đấu. "Firefighter" là lính cứu hỏa.`},{text:`Cảnh sát`,explanation:`Sai. 'Cảnh sát' là 'policeman'; 'firefighter' nghĩa là lính cứu hỏa.`,correct:!1},{text:`Phi công`,explanation:`Sai. 'Phi công' là 'pilot', không phải 'firefighter'.`,correct:!1},{text:`Bác sĩ`,explanation:`Sai. 'Bác sĩ' là 'doctor'; 'firefighter' là lính cứu hỏa.`,correct:!1}]},{q:`Điền từ: "He helps sick animals. He is a _____."`,a:[{text:`vet`,correct:!0,explanation:`"Vet" (viết tắt của veterinarian) là bác sĩ thú y, chuyên chữa bệnh cho động vật.`},{text:`doctor`,explanation:`Sai. 'Doctor' thường chữa bệnh cho người; bác sĩ thú y chữa động vật là 'vet'.`,correct:!1},{text:`dentist`,explanation:`Sai. 'Dentist' là nha sĩ, không phải bác sĩ thú y.`,correct:!1},{text:`nurse`,explanation:`Sai. 'Nurse' là y tá chăm sóc người bệnh; 'vet' chữa động vật.`,correct:!1}]},{q:`Sửa lỗi sai trong câu: "He is a sing."`,a:[{text:`sing -> singer`,correct:!0,explanation:`"Sing" là hành động hát, để chỉ nghề nghiệp ca sĩ ta phải dùng danh từ "singer".`},{text:`is -> am`,explanation:`Sai. Chủ ngữ 'He' đi với 'is', không đổi thành 'am'.`,correct:!1},{text:`a -> an`,explanation:`Sai. 'Singer' bắt đầu bằng âm phụ âm, nên dùng 'a', không dùng 'an'.`,correct:!1},{text:`He -> She`,explanation:`Sai. Đổi 'He' thành 'She' không sửa danh từ sai 'sing'; nghề nghiệp cần 'singer'.`,correct:!1}]},{q:`Từ "Postman" dùng để chỉ ai?`,a:[{text:`Người đưa thư`,correct:!0,explanation:`"Postman" là nhân viên bưu điện hay người đưa thư.`},{text:`Người quét rác`,explanation:`Sai. Người quét rác là sanitation worker; 'postman' là người đưa thư.`,correct:!1},{text:`Người bán hàng`,explanation:`Sai. Người bán hàng là shop assistant/seller; 'postman' đưa thư.`,correct:!1},{text:`Người làm vườn`,explanation:`Sai. Người làm vườn là gardener; 'postman' là người đưa thư.`,correct:!1}]},{q:`A: "What does she do?" - B: "She is _____ nurse."`,a:[{text:`a`,correct:!0,explanation:`Trước danh từ số ít bắt đầu bằng phụ âm ("n" trong nurse), ta dùng mạo từ "a".`},{text:`an`,explanation:`Sai. 'Nurse' bắt đầu bằng âm phụ âm /n/, nên dùng 'a', không dùng 'an'.`,correct:!1},{text:`the`,explanation:`Sai. 'The' chỉ đối tượng xác định; nghề nghiệp nói chung cần 'a nurse'.`,correct:!1},{text:`two`,explanation:`Sai. 'Two' chỉ số lượng hai, nhưng câu nói về một nghề nghiệp số ít.`,correct:!1}]},{q:`Từ nào sau đây không phải là một nghề nghiệp?`,a:[{text:`Teacher`,explanation:`Sai. 'Teacher' là giáo viên, một nghề nghiệp.`,correct:!1},{text:`Farmer`,explanation:`Sai. 'Farmer' là nông dân, một nghề nghiệp.`,correct:!1},{text:`Book`,correct:!0,explanation:`"Book" là cuốn sách (đồ vật), không phải là tên nghề nghiệp.`},{text:`Doctor`,explanation:`Sai. 'Doctor' là bác sĩ, một nghề nghiệp.`,correct:!1}]},{q:`"Dancer" nghĩa là gì?`,a:[{text:`Người hát`,explanation:`Sai. Người hát là 'singer'; 'dancer' là vũ công.`,correct:!1},{text:`Người nhảy / Vũ công`,correct:!0,explanation:`"Dancer" bắt nguồn từ động từ "dance" (nhảy múa), chỉ vũ công.`},{text:`Người vẽ`,explanation:`Sai. Người vẽ là 'artist'; 'dancer' nghĩa là vũ công.`,correct:!1},{text:`Người học`,explanation:`Sai. Người học là 'student'; 'dancer' chỉ người nhảy múa.`,correct:!1}]},{q:`Điền từ: "My dad works on a farm. He is a _____."`,a:[{text:`farmer`,correct:!0,explanation:`Người làm việc ở nông trại ("farm") là nông dân (farmer).`},{text:`pilot`,explanation:`Sai. 'Pilot' là phi công; người làm việc ở nông trại là 'farmer'.`,correct:!1},{text:`dentist`,explanation:`Sai. 'Dentist' là nha sĩ, không phải nông dân.`,correct:!1},{text:`police officer`,explanation:`Sai. 'Police officer' là cảnh sát; người làm việc ở nông trại là 'farmer'.`,correct:!1}]},{q:`Chọn từ phù hợp: Một người biểu diễn trên sân khấu hoặc trong phim.`,a:[{text:`Actor`,correct:!0,explanation:`"Actor" là diễn viên nam (hoặc diễn viên nói chung).`},{text:`Driver`,explanation:`Sai. 'Driver' là tài xế, không phải người biểu diễn trên sân khấu hoặc phim.`,correct:!1},{text:`Worker`,explanation:`Sai. 'Worker' nghĩa là người lao động nói chung, không phải diễn viên.`,correct:!1},{text:`Farmer`,explanation:`Sai. 'Farmer' là nông dân; người biểu diễn là 'actor'.`,correct:!1}]},{q:`"Học sinh" trong tiếng Anh là gì?`,a:[{text:`Teacher`,explanation:`Sai. 'Teacher' là giáo viên; 'student' nghĩa là học sinh.`,correct:!1},{text:`Student`,correct:!0,explanation:`"Student" là học sinh, sinh viên - những người đang đi học.`},{text:`Worker`,explanation:`Sai. 'Worker' nghĩa là người lao động, không phải học sinh.`,correct:!1},{text:`Singer`,explanation:`Sai. 'Singer' nghĩa là ca sĩ; học sinh là 'student'.`,correct:!1}]},{q:`A: "Is your mom a cook?" - B: "No, she _____."`,a:[{text:`isn't`,correct:!0,explanation:`Câu trả lời phủ định ngắn cho "Is she..." là "No, she isn't."`},{text:`not`,explanation:`Sai. 'Not' không đứng một mình sau 'she'; câu trả lời cần trợ động từ 'isn't'.`,correct:!1},{text:`aren't`,explanation:`Sai. Chủ ngữ 'she' đi với 'isn't', không dùng 'aren't'.`,correct:!1},{text:`doesn't`,explanation:`Sai. Câu hỏi bắt đầu bằng 'Is', nên câu trả lời dùng 'isn't', không dùng 'doesn't'.`,correct:!1}]},{q:`Từ nào để chỉ người điều trị bệnh về răng?`,a:[{text:`Vet`,explanation:`Sai. 'Vet' là bác sĩ thú y; người điều trị răng là 'dentist'.`,correct:!1},{text:`Dentist`,correct:!0,explanation:`"Dentist" là nha sĩ, người chữa răng cho chúng ta.`},{text:`Artist`,explanation:`Sai. 'Artist' là nghệ sĩ/họa sĩ, không phải nha sĩ.`,correct:!1},{text:`Actor`,explanation:`Sai. 'Actor' là diễn viên, không phải người điều trị răng.`,correct:!1}]},{q:`Người giúp chú cảnh sát bắt kẻ xấu là:`,a:[{text:`Policeman`,correct:!0,explanation:`"Policeman" là cảnh sát, người thực thi pháp luật và bảo vệ mọi người.`},{text:`Chef`,explanation:`Sai. 'Chef' là đầu bếp; người giúp bắt kẻ xấu là 'policeman'.`,correct:!1},{text:`Farmer`,explanation:`Sai. 'Farmer' là nông dân, không phải cảnh sát.`,correct:!1},{text:`Dancer`,explanation:`Sai. 'Dancer' là vũ công, không phải cảnh sát.`,correct:!1}]},{q:`Điền từ: "She is a _____ teacher."`,a:[{text:`good`,correct:!0,explanation:`Chúng ta dùng tính từ "good" để khen ngợi: "Cô ấy là một giáo viên giỏi."`},{text:`well`,explanation:`Sai. 'Well' thường là trạng từ; trước danh từ 'teacher' cần tính từ 'good'.`,correct:!1}
