:`at`,explanation:`Sai. Giới từ 'at' dùng cho một địa điểm cụ thể hoặc thời gian chính xác.`,correct:!1},{text:`for`,explanation:`Sai. Giới từ 'for' dùng chỉ mục đích hoặc một khoảng thời gian.`,correct:!1}]},{q:`A: Mẹ ở đâu? - B: Mẹ ở ___ bếp. Điền giới từ tiếng Anh. 🍳`,a:[{text:`in`,correct:!0,explanation:`Phòng trong nhà dùng giới từ 'in'.`},{text:`at`,explanation:`Sai. Giới từ 'at' dùng cho một địa điểm cụ thể hoặc thời gian chính xác.`,correct:!1},{text:`on`,explanation:`Sai. Giới từ 'on' dùng cho bề mặt tiếp xúc hoặc ngày cụ thể, không phù hợp ở đây.`,correct:!1},{text:`to`,explanation:`Sai. Giới từ 'to' chỉ hướng di chuyển tới một điểm, không dùng để chỉ vị trí tĩnh.`,correct:!1}]},{q:`A: Em học vào lúc nào? - B: ___ buổi sáng. Điền giới từ tiếng Anh. ☀️`,a:[{text:`In`,correct:!0,explanation:`Buổi trong ngày (sáng/chiều/tối) dùng 'in'.`},{text:`On`,explanation:`Sai. 'On' dùng cho thứ/ngày.`,correct:!1},{text:`At`,explanation:`Sai. Giới từ 'at' dùng cho một địa điểm cụ thể hoặc thời gian chính xác.`,correct:!1},{text:`Of`,explanation:`Sai. Giới từ 'of' dùng để chỉ sự sở hữu hoặc liên kết.`,correct:!1}]},{q:`A: Bây giờ là mấy giờ? - B: Bây giờ là ___ 7 giờ. Điền giới từ tiếng Anh. ⏰`,a:[{text:`at`,correct:!0,explanation:`Giờ giấc chính xác đi với giới từ 'at'.`},{text:`in`,explanation:`Sai. 'In' không đi với giờ.`,correct:!1},{text:`on`,explanation:`Sai. Giới từ 'on' dùng cho bề mặt tiếp xúc hoặc ngày cụ thể, không phù hợp ở đây.`,correct:!1},{text:`by`,explanation:`Sai. Giới từ 'by' chỉ vị trí kế bên hoặc phương tiện di chuyển.`,correct:!1}]},{q:`A: Bữa tiệc diễn ra ___ Chủ nhật phải không? - B: Đúng vậy. Điền giới từ tiếng Anh. 🎈`,a:[{text:`on`,correct:!0,explanation:`Các thứ trong tuần luôn đi với 'on'.`},{text:`at`,explanation:`Sai. Giới từ 'at' dùng cho một địa điểm cụ thể hoặc thời gian chính xác.`,correct:!1},{text:`in`,explanation:`Sai. Giới từ 'in' dùng cho không gian bao bọc, tháng/năm, không đúng ngữ cảnh này.`,correct:!1},{text:`from`,explanation:`Sai. Giới từ 'from' chỉ nguồn gốc hoặc điểm xuất phát.`,correct:!1}]},{q:`A: Em ở cùng ai? - B: Em ở ___ bạn của em. Điền giới từ tiếng Anh. 👫`,a:[{text:`with`,correct:!0,explanation:`'With' có nghĩa là cùng với ai đó.`},{text:`by`,explanation:`Sai. Giới từ 'by' chỉ vị trí kế bên hoặc phương tiện di chuyển.`,correct:!1},{text:`at`,explanation:`Sai. Giới từ 'at' dùng cho một địa điểm cụ thể hoặc thời gian chính xác.`,correct:!1},{text:`about`,explanation:`Sai. Giới từ 'about' mang nghĩa về một chủ đề nào đó.`,correct:!1}]},{q:`Chọn câu tiếng Anh đúng để nói: Em đi học. 🚶`,a:[{text:`I go to school.`,correct:!0,explanation:`'Go to' dùng để chỉ hướng di chuyển đến đâu đó.`},{text:`I go in school.`,explanation:`Sai. Giới từ 'I go in school.' không đi kèm với từ khóa trong câu hoặc sai ngữ nghĩa vị trí.`,correct:!1},{text:`I go on school.`,explanation:`Sai. Giới từ 'I go on school.' không đi kèm với từ khóa trong câu hoặc sai ngữ nghĩa vị trí.`,correct:!1},{text:`I go at school.`,explanation:`Sai. Giới từ 'I go at school.' không đi kèm với từ khóa trong câu hoặc sai ngữ nghĩa vị trí.`,correct:!1}]},{q:`Chọn câu cho biết người nhận món quà. 🎁`,a:[{text:`This is a gift for you.`,correct:!0,explanation:`'For' dùng để chỉ mục đích hoặc đối tượng nhận.`},{text:`This is a gift at you.`,explanation:`'At you' không diễn đạt người nhận món quà; câu đúng dùng 'for you'.`,correct:!1},{text:`This is a gift with you.`,explanation:`Sai. Lựa chọn 'This is a gift with you.' không phù hợp với ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`This is a gift of you.`,explanation:`Sai. Lựa chọn 'This is a gift of you.' không phù hợp với ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Chọn câu nói về quê hương của một người. 🇻🇳`,a:[{text:`I am from Vietnam.`,correct:!0,explanation:`'From' dùng để chỉ nguồn gốc, xuất xứ.`},{text:`I am to Vietnam.`,explanation:`Sai. Lựa chọn 'I am to Vietnam.' không phù hợp với ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`I am at Vietnam.`,explanation:`'At' không diễn đạt nguồn gốc quốc gia; câu nói đến từ Việt Nam phải dùng 'from Vietnam'.`,correct:!1},{text:`I am on Vietnam.`,explanation:`Sai. Lựa chọn 'I am on Vietnam.' không phù hợp với ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Chọn câu nói về một phần của chiếc bánh. 🍰`,a:[{text:`A piece of cake.`,correct:!0,explanation:`'Of' dùng để chỉ sự sở hữu hoặc một phần của cái gì.`},{text:`A piece with cake.`,explanation:`Sai. Lựa chọn 'A piece with cake.' không phù hợp với ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`A piece for cake.`,explanation:`Sai. Lựa chọn 'A piece for cake.' không phù hợp với ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`A piece in cake.`,explanation:`Sai. Lựa chọn 'A piece in cake.' không phù hợp với ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`Chọn cụm từ có nghĩa là ‘nói về động vật’. 🦁`,a:[{text:`Talk about animals.`,correct:!0,explanation:`'About' dùng để chỉ chủ đề của cuộc trò chuyện.`},{text:`Talk on animals.`,explanation:`Sai. Giới từ 'Talk on animals.' không đi kèm với từ khóa trong câu hoặc sai ngữ nghĩa vị trí.`,correct:!1},{text:`Talk with animals.`,explanation:`Nghĩa là nói chuyện 'với' con vật, không phải 'về'.`,correct:!1},{text:`Talk at animals.`,explanation:`Sai. Lựa chọn 'Talk at animals.' không phù hợp với ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`“Vào thứ Hai” tiếng Anh là gì? 🗓️`,a:[{text:`on Monday`,correct:!0,explanation:`Giới từ 'on' dùng trước các ngày trong tuần.`},{text:`in Monday`,explanation:`Sai. Lựa chọn 'in Monday' không phù hợp với ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`at Monday`,explanation:`Sai. Lựa chọn 'at Monday' không phù hợp với ngữ pháp và ngữ cảnh của câu.`,correct:!1},{text:`to Monday`,explanation:`Sai. Lựa chọn 'to Monday' không phù hợp với ngữ pháp và ngữ cảnh của câu.`,correct:!1}]},{q:`“Bằng xe buýt” tiếng Anh là gì? 🚌`,a:[{text:`by bus`,correct:!0,explanation:`Dùng 'by' để chỉ phương tiện đi lại.`},{text:`with bus`,explanation:`Sai. Lựa chọn 'with bus' không
