ion:`Tủ lạnh là 'fridge' cơ, em nhìn kỹ lại từ nhé.`,correct:!1},{text:`Đèn bàn`,explanation:`Đèn bàn là 'lamp' em nha, tivi là 'television'.`,correct:!1},{text:`Cửa ra vào`,explanation:`Cửa là 'door', tivi là thiết bị để xem phim cơ.`,correct:!1}]},{q:`Dụng cụ nào có lòng sâu để múc canh?`,a:[{text:`spoon`,correct:!0,explanation:`Chính xác! 'spoon' là cái thìa giúp em ăn súp dễ dàng hơn.`},{text:`fork`,explanation:`Cái nĩa (fork) dùng để xiên thức ăn, múc súp sẽ bị chảy hết mất.`,correct:!1},{text:`knife`,explanation:`Con dao (knife) rất sắc, không dùng để múc súp ăn đâu.`,correct:!1},{text:`comb`,explanation:`Cái lược (comb) để chải tóc, không phải đồ dùng để ăn.`,correct:!1}]},{q:`Dịch sang tiếng Anh: 'Cái chăn'`,a:[{text:`blanket`,correct:!0,explanation:`Chuẩn luôn! Vào mùa đông, em đắp 'blanket' sẽ thấy rất ấm áp.`},{text:`pillow`,explanation:`'pillow' là cái gối, em tìm từ có nghĩa là cái chăn nhé.`,correct:!1},{text:`rug`,explanation:`'rug' là tấm thảm trải sàn, không dùng để đắp đi ngủ.`,correct:!1},{text:`curtain`,explanation:`'curtain' là cái rèm cửa, không phải cái chăn đâu nè.`,correct:!1}]},{q:`Nhìn kìa! ___ quay và thổi gió quanh phòng.`,a:[{text:`fan`,correct:!0,explanation:`Đúng rồi! 'fan' là cái quạt giúp căn phòng của em luôn mát mẻ.`},{text:`lamp`,explanation:`Cái đèn (lamp) thắp sáng chứ không thổi gió mát đâu.`,correct:!1},{text:`mirror`,explanation:`Cái gương (mirror) để soi mặt, không làm mình mát được.`,correct:!1},{text:`door`,explanation:`Cửa (door) để đi ra vào, không phải là cái quạt.`,correct:!1}]},{q:`Từ nào chỉ “cửa sổ”?`,a:[{text:`window`,correct:!0,explanation:`Tuyệt vời! 'window' là cửa sổ để em nhìn ngắm bầu trời.`},{text:`door`,explanation:`'door' là cửa chính ra vào, còn cửa sổ là 'window' cơ.`,correct:!1},{text:`floor`,explanation:`'floor' là sàn nhà em đứng, không phải cửa sổ đâu.`,correct:!1},{text:`wall`,explanation:`'wall' là bức tường, em chọn lại nhé.`,correct:!1}]},{q:`Em nhìn vào ___ để thấy khuôn mặt.`,a:[{text:`mirror` Cái đèn (lamp) là đồ điện, em đừng mang đi rửa bằng nước nhé.`,correct:!1}]},{q:`Dịch sang tiếng Anh: 'Cái đèn bàn'`,a:[{text:`lamp`,correct:!0,explanation:`Chuẩn xác! 'lamp' thắp sáng căn phòng khi trời tối.`},{text:`fan`,explanation:`Cái quạt (fan) thổi gió, không phát ra ánh sáng đâu em.`,correct:!1},{text:`fridge`,explanation:`Tủ lạnh (fridge) để đựng đồ ăn, em tìm từ 'cái đèn' nhé.`,correct:!1},{text:`sofa`,explanation:`Ghế sofa để ngồi, không phải là cái đèn thắp sáng.`,correct:!1}]},{q:`Em dùng ___ mỗi sáng để làm sạch răng.`,a:[{text:`toothbrush`,correct:!0,explanation:`Đúng rồi! 'toothbrush' giúp răng em luôn trắng sáng và chắc khỏe.`},{text:`hairbrush`,explanation:`Đây là bàn chải tóc, em chọn từ bàn chải đánh răng nhé.`,correct:!1},{text:`towel`,explanation:`Cái khăn (towel) để lau mặt, không dùng để đánh răng được.`,correct:!1},{text:`soap`,explanation:`Xà phòng (soap) để rửa tay, em cần tìm 'bàn chải' cơ.`,correct:!1}]},{q:`Sau khi rửa tay, lau tay bằng ___.`,a:[{text:`towel`,correct:!0,explanation:`Chính xác! Dùng khăn (towel) để lau khô đôi tay sau khi rửa nhé.`},{text:`map`,explanation:`Bản đồ (map) để xem đường, không dùng để lau tay đâu.`,correct:!1},{text:`curtain`,explanation:`Đừng dùng rèm cửa (curtain) lau tay, sẽ bị bẩn rèm đó em.`,correct:!1},{text:`rug`,explanation:`Thảm (rug) trải dưới sàn nhà, em chọn từ 'cái khăn' nhé.`,correct:!1}]},{q:`Từ nào gọi tên vòi nước dùng khi tắm?`,a:[{text:`shower`,correct:!0,explanation:`Tuyệt vời! 'shower' giúp em tắm rửa sạch sẽ và sảng khoái.`},{text:`sink`,explanation:`Cái bồn rửa mặt là 'sink', còn vòi tắm là 'shower' cơ.`,correct:!1},{text:`cooker`,explanation:`Cái bếp (cooker) dùng để nấu ăn, không phải để tắm.`,correct:!1},{text:`bin`,explanation:`Thùng rác (bin) để bỏ rác, em đừng nhầm sang vòi tắm nhé.`,correct:!1}]},{q:`___ trong bếp dùng để nấu bằng nhiệt.`,a:[{text:`cooker`,correct:!0,explanation:`Đúng rồi! Bếp (cooker) là nơi mẹ nấu những món ăn ngon cho em.`},{text:`bed`,explanation:`Giường ngủ
