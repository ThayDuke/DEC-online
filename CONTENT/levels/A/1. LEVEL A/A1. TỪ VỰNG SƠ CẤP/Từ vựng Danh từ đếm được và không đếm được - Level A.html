<!doctype html><html lang=vi><head><link href=/tools-assets/vendor/dec-web-fonts.css rel=stylesheet><meta charset=UTF-8><meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" name=viewport><title>Từ vựng Danh từ đếm được và không đếm được - Level A</title><link href="/favicon-16.png?v=20260708-declogo" rel=icon sizes=16x16 type=image/png><link href="/favicon-32.png?v=20260708-declogo" rel=icon sizes=32x32 type=image/png><link href="/favicon-48.png?v=20260708-declogo" rel=icon sizes=48x48 type=image/png><link href="/favicon-64.png?v=20260708-declogo" rel=icon sizes=64x64 type=image/png><link href="/favicon-128.png?v=20260708-declogo" rel=icon sizes=128x128 type=image/png><link href="/favicon-256.png?v=20260708-declogo" rel=icon sizes=256x256 type=image/png><style>:root{--dec-font-family-offline:"Be Vietnam Pro","Segoe UI",Arial,sans-serif;--dec-serif-family-offline:Georgia,serif}html,body,button,input,select,textarea{font-family:var(--dec-font-family-offline)}</style><link href=/tools-assets/generated/style-d02bbdee71641645.css rel=stylesheet><link href=/tools-assets/generated/style-90a928cbfd947db5.css rel=stylesheet></head><body><div class=container><div id=header-area><h1 class=dec-ui-game-title id=lessonTitle>Từ vựng Danh từ đếm được và không đếm được - Level A</h1><div class=header-meta><button title="Bật chế độ Focus (phím F)" aria-pressed=false class=focus-toggle-btn id=btnFocusMode type=button><i class="fa-solid fa-expand" aria-hidden=true></i>Focus Mode</button><div id=subtitle-placeholder></div><div class=theme-switch-wrap><label title="Chuyển đổi giao diện" class=theme-toggle-switch><input id=themeToggleCheckbox type=checkbox> <span class=slider> <span class=slider-text id=themeToggleText>YOUTH</span> </span></label></div></div></div><div class=is-initially-hidden id=quiz-area><div id=focus-progress-row><div class=progress-container id=progress-area></div></div><div id=question-container></div><div class=controls><button class=btn id=prev-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class=btn id=next-btn type=button>Tiếp tục<i class="fa-solid fa-arrow-right"></i></button><button class="btn is-initially-hidden" id=submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=confirm-back-btn type=button><i class="fa-solid fa-arrow-left"></i>Quay lại</button><button class="btn is-initially-hidden" id=confirm-submit-btn type=button>NỘP BÀI 👍</button><button class="btn is-initially-hidden" id=reset-btn type=button>Làm lại</button></div></div><footer class=dec-footer>Bản quyền thuộc về DEC - thầy Đức tiếng Anh - 0966939583</footer></div><script>// --- DUKEGEM QUESTION BANK
const fullQuestionBank=[{q:`Trong tiếng Anh, "apple" là loại danh từ nào?`,a:[{text:`Danh từ đếm được`,correct:!0,explanation:`Vì chúng ta có thể đếm 'một quả táo, hai quả táo', nên 'apple' là danh từ đếm được.`},{text:`Danh từ không đếm được`,explanation:`Sai. 'Apple' là quả táo, có thể đếm từng quả; vì vậy nó là danh từ đếm được.`,correct:!1},{text:`Động từ`,explanation:`Sai. 'Apple' là tên của một loại quả, nên là danh từ, không phải động từ.`,correct:!1},{text:`Tính từ`,explanation:`Sai. 'Apple' gọi tên sự vật và có số nhiều 'apples', không phải tính từ.`,correct:!1}]},{q:`Từ nào sau đây là danh từ không đếm được?`,a:[{text:`book`,explanation:`Sai. 'Book' là quyển sách, có thể đếm từng quyển; 'water' mới không đếm trực tiếp.`,correct:!1},{text:`pen`,explanation:`Sai. 'Pen' là cây bút, có thể đếm từng chiếc; đáp án không đếm được là 'water'.`,correct:!1},{text:`water`,correct:!0,explanation:`Chúng ta không đếm 'một nước, hai nước' mà thường đếm theo chai hay cốc, nên 'water' là danh từ không đếm được.`},{text:`cat`,explanation:`Sai. 'Cat' là con mèo, có thể đếm từng con; 'water' là chất lỏng không đếm trực tiếp.`,correct:!1}]},{q:`"Milk" là loại danh từ nào?`,a:[{text:`Danh từ đếm được`,explanation:`Sai. 'Milk' là sữa, thường đo theo cốc hoặc chai thay vì đếm từng đơn vị sữa.`,correct:!1},{text:`Danh từ không đếm được`,correct:!0,explanation:`Sữa là chất lỏng, chúng ta không đếm trực tiếp từng đơn vị sữa nên nó là danh từ không đếm được.`},{text:`Danh từ riêng`,explanation:`Sai. 'Milk' là danh từ chung chỉ chất lỏng, không phải tên riêng.`,correct:!1},{text:`Trạng từ`,explanation:`Sai. 'Milk' gọi tên một chất, nên là danh từ, không phải trạng từ.`,correct:!1}]},{q:`Chọn danh từ đếm được trong các từ sau:`,a:[{text:`rice`,explanation:`Sai. 'Rice' là gạo, thường không đếm trực tiếp từng hạt trong ngữ cảnh này.`,correct:!1},{text:`bread`,explanation:`Sai. 'Bread' là bánh mì, thường đếm theo ổ hoặc lát, không trực tiếp như quả chuối.`,correct:!1},{text:`banana`,correct:!0,explanation:`Quả chuối (banana) có thể đếm được số lượng cụ thể, trong khi gạo, bánh mì và đường thì không.`},{text:`sugar`,explanation:`Sai. 'Sugar' là đường, một chất không đếm trực tiếp từng đơn vị.`,correct:!1}]},{q:`Chúng ta dùng "a" hoặc "an" cho loại danh từ nào?`,a:[{text:`Danh từ không đếm được`,explanation:`Sai. Danh từ không đếm được không dùng trực tiếp với 'a' hoặc 'an'.`,correct:!1},{text:`Danh từ đếm được số ít`,correct:!0,explanation:`'A' và 'an' có nghĩa là 'một', nên chỉ dùng cho danh từ đếm được ở dạng số ít.`},{text:`Danh từ đếm được số nhiều`,explanation:`Sai. Danh từ số nhiều không đi với 'a' hoặc 'an'; hai mạo từ này chỉ đi với số ít.`,correct:!1},{text:`Tính từ`,explanation:`Sai. 'A' và 'an' đứng trước danh từ đếm được số ít, không đứng trước tính từ một mình.`,correct:!1}]},{q:`Tôi có ___ quả cam. Chọn từ thích hợp: I have ___ orange.`,a:[{text:`a`,explanation:`Sai. Trước âm nguyên âm đầu của 'orange' phải dùng 'an', không dùng 'a'.`,correct:!1},{text:`an`,correct:!0,explanation:`Vì 'orange' bắt đầu bằng nguyên âm 'o' và là danh từ đếm được số ít, nên ta dùng 'an'.`},{text:`some`,explanation:`Sai. Gợi ý nói một quả cam số ít; 'some' không tạo cụm 'some orange' trong câu này.`,correct:!1},{text:`any`,explanation:`Sai. 'Any' thường dùng trong câu hỏi hoặc phủ định; câu khẳng định này cần 'an'.`,correct:!1}]},{q:`Tôi muốn một ít nước, không phải cả chai. Chọn từ thích hợp: I want ___ water, please; just a little, not a bottle.`,a:[{text:`a`,explanation:`Sai. 'Water' không đếm được nên không dùng trực tiếp với 'a'.`,correct:!1},{text:`an`,explanation:`Sai. 'An' dùng trước danh từ đếm được số ít bắt đầu bằng âm nguyên âm, không dùng cho 'water'.`,correct:!1},{text:`some`,correct:!0,explanation:`Với danh từ không đếm được như 'water', chúng ta dùng 'some' để chỉ một lượng nhỏ.`},{text:`one`,explanation:`Sai. 'One' yêu cầu một đơn vị đếm được; nước cần lượng từ như 'some'.`,correct:!1}]},{q:`Trong tiếng Anh, "bread" là loại danh từ nào?`,a:[{text:`Danh từ đếm được`,explanation:`Sai. 'Bread' thường không đếm trực tiếp; ta nói 'a loaf' hoặc 'a slice' để đếm.`,correct:!1},{text:`Danh từ không đếm được`,correct:!0,explanation:`Trong tiếng Anh, 'bread' là danh từ không đếm được, chúng ta thường đếm theo 'ổ' (loaf) hoặc 'lát' (slice).`},{text:`Động từ`,explanation:`Sai. 'Bread' gọi tên thực phẩm, nên là danh từ, không phải động từ.`,correct:!1},{text:`Số từ`,explanation:`Sai. 'Bread' không phải số từ; đây là danh từ không đếm được.`,correct:!1}]},{q:`Danh từ nào có thể thêm đuôi "-s" để thành số nhiều?`,a:[{text:`book`,correct:!0,explanation:`Chỉ có danh từ đếm được mới có dạng số nhiều (thêm -s), nên 'book' thành 'books' là đúng.`},{text:`water`,explanation:`Sai. 'Water' là danh từ không đếm được; không thêm '-s' để chỉ nhiều đơn vị nước.`,correct:!1},{text:`milk`,explanation:`Sai. 'Milk' là danh từ không đếm được; muốn đếm cần nói chai hoặc cốc sữa.`,correct:!1},{text:`rice`,explanation:`Sai. 'Rice' là danh từ không đếm được; 'book' mới có số nhiều 'books'.`,correct:!1}]},{q:`Từ nào là danh từ không đếm được dùng để nấu ăn?`,a:[{text:`egg`,explanation:`Sai. 'Egg' là quả trứng riêng lẻ và có thể đếm từng quả.`,correct:!1},{text:`salt`,correct:!0,explanation:`Muối (salt) gồm các hạt nhỏ li ti nên được xếp vào nhóm danh từ không đếm được.`},{text:`carrot`,explanation:`Sai. 'Carrot' là củ cà rốt riêng lẻ và có thể đếm từng củ.`,correct:!1},{text:`onion`,explanation:`Sai. 'Onion' là củ hành riêng lẻ và có thể đếm từng củ.`,correct:!1}]},{q:`Hoàn thành đoạn hội thoại: Có nước ép không? — Có, có ___ nước ép. (Yes, there is ___ juice.)`,a:[{text:`a`,explanation:`Sai. 'Juice' là chất lỏng không đếm được, không dùng trực tiếp với 'a'.`,correct:!1},{text:`an`,explanation:`Sai. 'An' dùng cho danh từ đếm được số ít, không dùng trực tiếp cho 'juice'.`,correct:!1},{text:`some`,correct:!0,explanation:`'Juice' là nước trái cây (không đếm được), nên ta dùng 'some' trong câu khẳng định.`},{text:`many`,explanation:`Sai. 'Many' đi với danh từ đếm được số nhiều; 'juice' cần 'some' trong câu khẳng định.`,correct:!1}]},{q:`Đâu là danh từ đếm được chỉ đồ dùng học tập?`,a:[{text:`ink`,explanation:`Sai. 'Ink' là mực, thường không đếm trực tiếp từng đơn vị.`,correct:!1},{text:`paper`,explanation:`Sai. 'Paper' là giấy, thường là danh từ không đếm được khi nói chung về chất liệu.`,correct:!1},{text:`pencil`,correct:!0,explanation:`Chúng ta có thể đếm từng chiếc bút chì (pencil), còn mực (ink) và giấy (paper) là danh từ không đếm được.`},{text:`music`,explanation:`Sai. 'Music' nghĩa là âm nhạc, không phải đồ dùng học tập có thể đếm từng chiếc.`,correct:!1}]},{q:`"Money" là loại danh từ nào?`,a:[{text:`Danh từ đếm được`,explanation:`Sai. 'Money' là danh từ không đếm được; ta đếm tờ tiền hoặc đồng xu cụ thể.`,correct:!1},{text:`Danh từ không đếm được`,correct:!0,explanation:`Dù chúng ta đếm tờ tiền hay đồng xu, nhưng bản thân từ 'money' là danh từ không đếm được.`},{text:`Danh từ riêng`,explanation:`Sai. 'Money' là danh từ chung chỉ tiền, không phải tên riêng.`,correct:!1},{text:`Số từ`,explanation:`Sai. 'Money' gọi tên một khái niệm/vật chất, không phải số từ.`,correct:!1}]},{q:`Bạn có bao nhiêu quả táo? Hoàn thành câu tiếng Anh: How ___ apples do you have?`,a:[{text:`much`,explanation:`Sai. 'Much' đi với danh từ không đếm được; 'apples' là danh từ đếm được số nhiều.`,correct:!1},{text:`many`,correct:!0,explanation:`Vì 'apples' là danh từ đếm được số nhiều, nên ta phải dùng cấu trúc 'How many'.`},{text:`some`,explanation:`Sai. 'Some' không tạo câu hỏi về số lượng cụ thể như 'How many apples'.`,correct:!1},{text:`any`,explanation:`Sai. 'Any' không hỏi trực tiếp số lượng; với 'apples' phải dùng 'many'.`,correct:!1}]},{q:`Hỏi lượng sữa trong tủ lạnh: How ___ milk is in the fridge?`,a:[{text:`many`,explanation:`Sai. 'Many' đi với danh từ đếm được số nhiều, không phải 'milk'.`,correct:!1},{text:`much`,correct:!0,explanation:`Vì 'milk' là danh từ không đếm được, nên ta sử dụng cấu trúc 'How much'.`},{text:`some`,explanation:`Sai. 'Some' chỉ một lượng không xác định, không tạo câu hỏi 'bao nhiêu'.`,correct:!1},{text:`any`,explanation:`Sai. 'Any' không hỏi lượng cụ thể; với 'milk' dùng 'how much'.`,correct:!1}]},{q:`Từ nào có thể đi với "a"?`,a:[{text:`egg`,explanation:`'Egg' bắt đầu bằng nguyên âm nên phải dùng 'an egg', không phải 'a egg'.`,correct:!1},{text:`pen`,correct:!0,explanation:`'Pen' bắt đầu bằng phụ âm 'p' và là danh từ đếm được số ít, nên đi với 'a'.`},{text:`ice`,explanation:`'Ice' bắt đầu bằng nguyên âm nên dùng 'an ice' khi nói đến một phần/đơn vị phù hợp, không phải 'a ice'.`,correct:!1},{text:`orange`,explanation:`'Orange' bắt đầu bằng nguyên âm nên phải dùng 'an orange', không phải 'a orange'.`,correct:!1}]},{q:`Sửa lỗi sai khi muốn nói một ít nước: I have a water.`,a:[{text:`I have some water.`,correct:!0,explanation:`Vì 'water' không đếm được, không thể dùng 'a'. Thay vào đó dùng 'some' là đúng nhất.`},{text:`I have an water.`,explanation:`Sai. 'An' cũng chỉ đứng trước danh từ đếm được số ít; 'water' cần lượng từ 'some'.`,correct:!1},{text:`I has a water.`,explanation:`Sai. 'I' đi với 'have', không phải 'has'; đồng thời 'water' không đi trực tiếp với 'a'.`,correct:!1},{text:`I have water some.`,explanation:`Sai. 'Some' phải đứng trước 'water' trong cụm 'some water', không đứng sau danh từ.`,correct:!1}]},{q:`Chọn câu đúng:`,a:[{text:`There is some rice.`,correct:!0,explanation:`Gạo (rice) là danh từ không đếm được, nên đi với 'is' và dùng 'some'.`},{text:`There is a rice.`,explanation:`Sai. 'Rice' không đếm được nên không dùng trực tiếp với mạo từ 'a'; dùng 'some rice'.`,correct:!1},{text:`There are some rice.`,explanation:`Sai. 'Rice' không đếm được nên dùng động từ số ít 'is', không dùng 'are'.`,correct:!1},{text:`There is an rice.`,explanation:`Sai. 'An' chỉ dùng trước danh từ đếm được số ít; 'rice' cần 'some'.`,correct:!1}]},{q:`Hoàn thành cụm từ tiếng Anh có nghĩa ‘một cốc ___’: A cup of ___.`,a:[{text:`tea`,correct:!0,explanation:`Chúng ta dùng đơn vị đo lường 'cup' cho danh từ không đếm được 'tea'.`},{text:`teas`,explanation:`Sai. Sau 'a cup of' dùng danh từ chất liệu số ít 'tea', không dùng số nhiều 'teas'.`,correct:!1},{text:`a tea`,explanation:`Sai. 'A cup of' đã là đơn vị đếm; không chèn thêm mạo từ 'a' trước 'tea'.`,correct:!1},{text:`an tea`,explanation:`Sai. 'An' không dùng trực tiếp với 'tea'; cấu trúc đúng là 'a cup of tea'.`,correct:!1}]},{q:`Từ nào sau đây là danh từ đếm được chỉ con vật?`,a:[{text:`meat`,explanation:`Sai. 'Meat' là thịt, thường là danh từ không đếm được; con vật đếm được là 'dog'.`,correct:!1},{text:`dog`,correct:!0,explanation:`Con chó (dog) là vật thể riêng lẻ có thể đếm được.`},{text:`fur`,explanation:`Sai. 'Fur' là lông thú, chất liệu không đếm từng con; 'dog' mới chỉ con vật riêng lẻ.`,correct:!1},{text:`milk`,explanation:`Sai. 'Milk' là sữa, danh từ không đếm được; 'dog' là danh từ chỉ con vật đếm được.`,correct:!1}]},{q:`"Butter" là loại danh từ nào?`,a:[{text:`Danh từ đếm được`,explanation:`Sai. 'Butter' thường chỉ chất bơ nói chung; muốn đếm phải dùng đơn vị như 'a pat' hoặc 'a packet'.`,correct:!1},{text:`Danh từ không đếm được`,correct:!0,explanation:`Bơ là chất dẻo, không đếm được từng đơn vị nên thuộc nhóm không đếm được.`},{text:`Tên riêng`,explanation:`Sai. 'Butter' là danh từ chung chỉ thực phẩm, không phải tên riêng của người hay địa điểm.`,correct:!1},{text:`Cụm từ`,explanation:`Sai. 'Butter' là một danh từ đơn; về cách đếm, nó thuộc nhóm không đếm được.`,correct:!1}]},{q:`Tôi muốn ăn ___ quả trứng. Hoàn thành câu: I want to eat ___ egg.`,a:[{text:`a`,explanation:`Sai. 'Egg' bắt đầu bằng âm nguyên âm nên mạo từ đúng là 'an', không phải 'a'.`,correct:!1},{text:`an`,correct:!0,explanation:`'Egg' bắt đầu bằng nguyên âm 'e', nên ta dùng 'an'.`},{text:`some`,explanation:`Sai. Câu nói rõ muốn ăn một quả trứng; danh từ số ít cần 'an egg', không dùng 'some'.`,correct:!1},{text:`any`,explanation:`Sai. 'Any' thường dùng trong câu hỏi/phủ định; câu khẳng định này c rrect:!1},{text:`thức ăn`,explanation:`'Food' là thức ăn; 'money' chỉ tiền bạc.`,correct:!1},{text:`nước`,explanation:`'Water' là nước; 'money' nghĩa là tiền.`,correct:!1}]},{q:`Một thỏi bơ được nói là: ___ butter.`,a:[{text:`a stick of`,correct:!0,explanation:`Với một thỏi bơ, dùng đơn vị 'a stick of butter'.`},{text:`a cup of`,explanation:`'A cup of butter' là một cốc bơ, không phải một thỏi bơ.`,correct:!1},{text:`a bottle of`,explanation:`'A bottle of butter' là một chai bơ, không phù hợp với 'một thỏi'.`,correct:!1},{text:`a book of`,explanation:`'A book of butter' không phải đơn vị dùng cho bơ.`,correct:!1}]},{q:`Hôm qua tôi đã mua ___ quyển truyện. Hoàn thành câu: I bought ___ story books yesterday.`,a:[{text:`some`,correct:!0,explanation:`Trong câu khẳng định 'I bought ...', 'some' phù hợp với danh từ đếm được số nhiều 'story books'.`},{text:`a`,explanation:`'A' chỉ đi với một danh từ số ít, không đi với 'story books' số nhiều.`,correct:!1},{text:`an`,explanation:`'An' chỉ đi với một danh từ số ít bắt đầu bằng nguyên âm, không đi với 'story books'.`,correct:!1},{text:`any`,explanation:`'Any' thường dùng trong câu hỏi hoặc phủ định; câu khẳng định này cần 'some'.`,correct:!1}]},{q:`Hộp bánh quy rỗng. Hoàn thành câu: There aren't ___ cookies in the box.`,a:[{text:`any`,correct:!0,explanation:`Câu phủ định nói chiếc hộp rỗng nên dùng 'any': 'There aren't any cookies'.`},{text:`a`,explanation:`'A' cần danh từ số ít, còn 'cookies' là số nhiều.`,correct:!1},{text:`an`,explanation:`'An' cần danh từ số ít bắt đầu bằng nguyên âm, không đi với 'cookies'.`,correct:!1},{text:`some`,explanation:`'Some' không phù hợp với ý phủ định tuyệt đối 'the box is empty'.`,correct:!1}]},{q:`Không còn chiếc bánh quy nào vì hộp hoàn toàn rỗng. Hoàn thành câu: There aren't ___ cookies left.`,a:[{text:`any`,correct:!0,explanation:`Vì chiếc hộp hoàn toàn rỗng, câu phủ định dùng 'any': 'There aren't any cookies'.`},{text:`some`,explanation:`'Some' thường chỉ một lượng tồn tại, trái với thông tin chiếc hộp hoàn toàn rỗng.`,correct:!1},{text:`a`,explanation:`'A' cần danh từ số ít; 'cookies' là danh từ số nhiều.`,correct:!1},{text:`many`,explanation:`'Many' có thể nói số lượng ít, nhưng không diễn đạt 'hoàn toàn không có' như 'any'.`,correct:!1}]},{q:`"Potato" là loại danh từ nào?`,a:[{text:`Đếm được`,correct:!0,explanation:`Chúng ta có thể đếm từng củ khoai tây.`},{text:`Không đếm được`,explanation:`'Potato' chỉ từng củ khoai tây nên là danh từ đếm được, không phải không đếm được.`,correct:!1},{text:`Động từ`,explanation:`'Potato' là danh từ chỉ thực phẩm, không phải động từ.`,correct:!1},{text:`Trạng từ`,explanation:`'Potato' là danh từ, không phải trạng từ.`,correct:!1}]},{q:`Khi đựng cơm chín trong bát, rice dùng đơn vị nào để đếm?`,a:[{text:`a bowl`,correct:!0,explanation:`Chúng ta thường ăn 'một bát cơm' (a bowl of rice).`},{text:`a glass`,explanation:`'A glass' là cái ly; cơm chín trong bát được đếm bằng 'a bowl'.`,correct:!1},{text:`a bottle`,explanation:`'A bottle' là một chai; đơn vị phù hợp với cơm trong bát là 'a bowl'.`,correct:!1},{text:`a slice`,explanation:`'A slice' là một lát; cơm chín được đựng và đếm bằng bát.`,correct:!1}]},{q:`Từ nào mô tả vật không đếm được dùng để tắm?`,a:[{text:`water`,correct:!0,explanation:`Nước là danh từ không đếm được thực thụ.`},{text:`soap (bar)`,explanation:`'Soap' là xà phòng; vật không đếm được dùng để tắm trong lựa chọn là 'water'.`,correct:!1},{text:`shampoo (bottle)`,explanation:`'Shampoo' là dầu gội; câu hỏi đang tìm chất lỏng dùng để tắm là 'water'.`,correct:!1},{text:`towel`,explanation:`'Towel' là khăn, vật dụng đếm được; 'water' là chất không đếm được.`,correct:!1}]},{q:`"Soup" là loại danh từ nào?`,a:[{text:`Không đếm được`,correct:!0,explanation:`Trong nghĩa món súp nói chung, soup là danh từ không đếm được; ta đếm bằng bowls hoặc servings nếu cần.`},{text:`Đếm được`,explanation:`Trong ngữ cảnh cơ bản này soup chỉ chất súp, không phải từng bát súp được đếm riêng.`,correct:!1},{text:`Số nhiều`,explanation:`'Số nhiều' là dạng ngữ pháp, không phải loại danh từ; soup không có dạng số nhiều trong nghĩa chất súp này.`,correct:!1},{text:`Động từ`,explanation:`Soup gọi tên một món ăn nên là danh từ, không phải động từ.`,correct:!1}]},{q:`Tôi muốn một đồ dùng học tập bắt đầu bằng âm nguyên âm. Hoàn thành câu: I want an ___.`,a:[{text:`eraser`,correct:!0,explanation:`Trong các đồ dùng học tập này, chỉ có 'eraser' bắt đầu bằng nguyên âm để đi với 'an'.`},{text:`pencil`,explanation:`Sai. 'Pencil' bắt đầu bằng âm /p/, nên phải nói 'a pencil', không phải 'an pencil'.`,correct:!1},{text:`pen`,explanation:`Sai. 'Pen' bắt đầu bằng âm /p/, nên đi với 'a': 'a pen'.`,correct:!1},{text:`book`,explanation:`Sai. 'Book' bắt đầu bằng âm /b/, nên dùng 'a book'.`,correct:!1}]},{q:`Tôi có một đồ dùng học tập bắt đầu bằng âm phụ âm. Hoàn thành câu: I have a ___.`,a:[{text:`ruler`,correct:!0,explanation:`'Ruler' là danh từ đếm được bắt đầu bằng phụ âm, phù hợp với 'a'.`},{text:`ink`,explanation:`Sai. 'Ink' là chất không đếm được trong ngữ cảnh này và còn bắt đầu bằng nguyên âm; không nói 'a ink'.`,correct:!1},{text:`ice`,explanation:`Sai. 'Ice' bắt đầu bằng nguyên âm; nếu đếm phải nói 'a piece of ice', không phải 'a ice'.`,correct:!1},{text:`apple`,explanation:`Sai. 'Apple' bắt đầu bằng nguyên âm nên dùng 'an apple'.`,correct:!1}]},{q:`Có một ít chất lỏng trên áo của tôi. Hoàn thành câu: There is some ___ on my shirt.`,a:[{text:`ink`,correct:!0,explanation:`Mực là chất lỏng bám trên áo, không đếm được.`},{text:`pen`,explanation:`'Pen' là bút; mực bám trên áo được gọi là 'ink'.`,correct:!1},{text:`pencil`,explanation:`'Pencil' là bút chì; chất mực không đếm được là 'ink'.`,correct:!1},{text:`paper`,explanation:`'Paper' là giấy; mực trên áo là 'ink'.`,correct:!1}]},{q:`Nhóm từ nào toàn là danh từ không đếm được?`,a:[{text:`water, milk, rice`,correct:!0,explanation:`Cả 3 từ nước, sữa và gạo đều không đếm được.`},{text:`apple, orange, pen`,explanation:`Apple, orange và pen đều là vật đếm được, không phải nhóm chất không đếm được.`,correct:!1},{text:`cat, dog, bird`,explanation:`Cat, dog và bird là các con vật đếm được.`,correct:!1},{text:`table, chair, bed`,explanation:`Table, chair và bed là đồ vật đếm được.`,correct:!1}]},{q:`Nhóm từ nào toàn là danh từ đếm được?`,a:[{text:`car, bus, bike`,correct:!0,explanation:`Xe hơi, xe buýt và xe đạp đều là các vật đếm được cụ thể.`},{text:`air, oil, soup`,explanation:`Air, oil và soup đều là các chất không đếm được.`,correct:!1},{text:`money, music, art`,explanation:`Money, music và art đều thường là danh từ không đếm được.`,correct:!1},{text:`snow, rain, wind`,explanation:`Snow, rain và wind đều chỉ hiện tượng hoặc chất không đếm được.`,correct:!1}]},{q:`"Ice" là loại danh từ nào?`,a:[{text:`Không đếm được`,correct:!0,explanation:`Trong nghĩa vật liệu băng nói chung, ice là danh từ không đếm được; từng viên được gọi là ice cube.`},{text:`Đếm được`,explanation:`'Đếm được' chỉ từng viên hoặc vật chứa, không phải chất ice nói chung trong stem này.`,correct:!1},{text:`Danh từ riêng`,explanation:`Ice không phải tên riêng; đây là tên một chất.`,correct:!1},{text:`Số từ`,explanation:`Ice gọi tên chất băng, không phải từ chỉ số lượng.`,correct:!1}]},{q:`Khi nói chung về thực phẩm, "cheese" có đếm được không?`,a:[{text:`Không`,correct:!0,explanation:`Trong nghĩa thực phẩm nói chung, cheese là danh từ không đếm được; có thể đếm bằng pieces hoặc slices.`},{text:`Có`,explanation:`Không đếm trực tiếp cheese trong nghĩa chất thực phẩm của stem; cần dùng đơn vị như a slice of cheese.`,correct:!1},{text:`Chỉ khi số nhiều`,explanation:`Cheese không chuyển thành số nhiều để đếm từng miếng; dùng đơn vị đo phù hợp thay vì thêm -s.`,correct:!1},{text:`Tùy lúc`,explanation:`Câu hỏi đang xét nghĩa thực phẩm chung, nên không cần lựa chọn 'tùy lúc' theo các nghĩa chuyên ngành khác.`,correct:!1}]},{q:`Hoàn thành cụm từ chỉ một lượng nhiều: A lot of ___.`,a:[{text:`water`,correct:!0,explanation:`'A lot of' có thể đi với danh từ kh
