 chiếc áo phông đỏ":`,a:[{text:`I wear a red T-shirt.`,correct:!0,explanation:`Giỏi quá! Mạo từ đứng trước tính từ và danh từ.`},{text:`I wear red an T-shirt.`,explanation:`Tính từ "red" bắt đầu bằng phụ âm, không dùng "an".`,correct:!1},{text:`I wear red T-shirt a.`,explanation:`Mạo từ phải đứng đầu cụm danh từ em nhé.`,correct:!1},{text:`I wear red some T-shirt.`,explanation:`Chỉ có một chiếc áo thôi, không dùng "some".`,correct:!1}]},{q:`Em đội "hat" ở đâu?`,a:[{text:`on the head`,correct:!0,explanation:`Chính xác! Mũ "hat" dùng để che phần đầu "head".`},{text:`on the feed`,explanation:`Chân thì phải đi giày em nhé.`,correct:!1},{text:`on the arms`,explanation:`Tay thường dùng găng tay nè.`,correct:!1},{text:`on the legs`,explanation:`Chân thì có quần che rồi.`,correct:!1}]},{q:`Cô ấy đang mặc một chiếc ___ màu hồng rất đẹp, dài đến mắt cá chân.`,a:[{text:`dress`,correct:!0,explanation:`Đúng. A 'dress' is a one-piece garment that can reach the ankles.`},{text:`pants`,explanation:`Sai. 'Pants' are separate leg garments, not one piece.`,correct:!1},{text:`shoes`,explanation:`Sai. 'Shoes' are worn on the feet and do not reach the ankles as one garment.`,correct:!1},{text:`socks`,explanation:`Sai. 'Socks' are small foot coverings, not a one-piece garment reaching the ankles.`,correct:!1}]},{q:`Từ "áo khoác dày" viết là gì?`,a:[{text:`coat`,correct:!0,explanation:`Chính xác! "Coat" là chiếc áo khoác dày dặn.`},{text:`cote`,explanation:`Thiếu chữ "a" và dư chữ "e" ở cuối rồi em.`,correct:!1},{text:`coot`,explanation:`Dùng hai chữ "o" là sai rồi nè.`,correct:!1},{text:`coat e`,explanation:`Viết sai chính tả rồi em ơi.`,correct:!1}]},{q:`Chọn câu đúng khi nói về đôi tất:`,a:[{text:`These are my socks.`,correct:!0,explanation:`Chuẩn luôn! Tất luôn đi theo đôi (số nhiều) nên dùng "These are".`},{text:`This is my socks.`,explanation:`Socks có "s" số nhiều, không dùng "This is" được.`,correct:!1},{text:`Those is my socks.`,explanation:`Số nhiều phải đi với "are" em nhé.`,cor
