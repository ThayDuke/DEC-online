am.`,correct:!1},{text:`mother`,explanation:`Sai. 'Mother' là phụ huynh nữ, không phải anh trai.`,correct:!1},{text:`brother`,correct:!0,explanation:`Đúng. 'Brother' là anh/em trai; 'older than me' xác định đây là anh trai.`},{text:`grandmother`,explanation:`Sai. 'Grandmother' là bà, không phải người nam lớn tuổi hơn em.`,correct:!1}]},{q:`Đây là ___ của em. Em ấy là một bé gái nhỏ tuổi hơn em.`,a:[{text:`father`,explanation:`Sai. 'Father' là phụ huynh nam, không phải cô bé trong gia đình.`,correct:!1},{text:`sister`,correct:!0,explanation:`Đúng. 'Sister' là chị/em gái; 'younger girl' xác định đây là em gái.`},{text:`grandfather`,explanation:`Sai. 'Grandfather' là ông, không phải cô bé.`,correct:!1},{text:`son`,explanation:`Sai. 'Son' là con trai, trái với đại từ 'She' và mô tả cô bé.`,correct:!1}]},{q:`Cụm từ "Big brother" thường có nghĩa là gì?`,a:[{text:`em trai`,explanation:`Sai. 'Em trai' là 'little brother'; 'big brother' nghĩa là anh trai.`,correct:!1},{text:`anh trai`,correct:!0,explanation:`'Big' là lớn, 'big brother' dùng để chỉ anh trai (người lớn hơn mình).`},{text:`ông nội`,explanation:`Sai. 'Ông nội' là 'grandfather', không phải 'big brother'.`,correct:!1},{text:`bố`,explanation:`Sai. 'Bố' là 'father'; 'big brother' nghĩa là anh trai.`,correct:!1}]},{q:`Cụm từ "Little sister" có nghĩa là gì?`,a:[{text:`chị gái`,explanation:`Sai. 'Chị gái' là 'big sister'; 'little sister' nghĩa là em gái.`,correct:!1},{text:`em gái`,correct:!0,explanation:`'Little' là nhỏ, 'little sister' dùng để chỉ em gái (người nhỏ hơn mình).`},{text:`bà ngoại`,explanation:`Sai. 'Bà ngoại' là 'grandmother', không phải 'little sister'.`,correct:!1},{text:`mẹ`,explanation:`Sai. 'Mẹ' là 'mother'; 'little sister' nghĩa là em gái.`,correct:!1}]},{q:`- Đây có phải là cô của em không?
