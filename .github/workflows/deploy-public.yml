name: Deploy public DEC-online

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dec-online-public
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public website
        uses: actions/checkout@v4

      - name: Assemble public Pages artifact
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp -R CONTENT dist/CONTENT
          if [ -d tools-assets ]; then cp -R tools-assets dist/tools-assets; fi

      - name: Deploy public Pages site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
